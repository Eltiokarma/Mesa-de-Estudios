<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="m-svg" aria-hidden="true" focusable="false">
  <!-- Respaldo del gato: los mismos trazos de Ilus.gato (app/ilustraciones.js), separados en partes.
       Cada parte tiene dos capas: la de afuera toma la pose (transición) y la de adentro (.m-g) hace el gesto.
       Lo único nuevo son los ojos abiertos (.m-ojos-abiertos), para las poses que miran. -->
  <g class="m-salto">
    <g class="m-todo" stroke="#3b2a52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <g class="m-cola"><g class="m-g"><path d="M88 100c20 0 24-22 10-28" fill="none"/></g></g>
      <g class="m-cuerpo">
        <path d="M30 106c-5-26 6-46 30-46s35 20 30 46z" fill="#fff6ee"/>
        <ellipse cx="47" cy="104" rx="8" ry="5" fill="#fff6ee"/><ellipse cx="73" cy="104" rx="8" ry="5" fill="#fff6ee"/>
        <path d="M50 80c6 4 14 4 20 0" stroke="#cdb9ff" stroke-width="5" fill="none"/>
      </g>
      <g class="m-cabeza"><g class="m-g">
        <g class="m-oreja-i"><g class="m-g"><path d="M35 38 37 14l19 15z" fill="#fff6ee"/></g></g>
        <g class="m-oreja-d"><g class="m-g"><path d="M85 38 83 14 64 29z" fill="#fff6ee"/></g></g>
        <ellipse cx="60" cy="50" rx="31" ry="26" fill="#fff6ee"/>
        <g class="m-oreja-i"><g class="m-g"><path d="M39 33 40 20l10 9z" fill="#ffc7da" stroke="none"/></g></g>
        <g class="m-oreja-d"><g class="m-g"><path d="M81 33 80 20l-10 9z" fill="#ffc7da" stroke="none"/></g></g>
        <path d="M26 52l-12-2M27 58l-12 3M94 52l12-2M93 58l12 3" stroke-width="2"/>
        <path d="M56.5 59q3.5 3 7 0" fill="none"/>
        <circle cx="42" cy="59" r="5" fill="#ffc7da" stroke="none"/><circle cx="78" cy="59" r="5" fill="#ffc7da" stroke="none"/>
        <path d="M57.5 55h5l-2.5 3z" fill="#ff9fbf" stroke="none"/>
        <g class="m-ojos-felices"><path d="M45 50q5 5 10 0M65 50q5 5 10 0" fill="none"/></g>
        <g class="m-ojos-abiertos"><g class="m-g" stroke="none">
          <ellipse cx="50" cy="50" rx="3.6" ry="4.4" fill="#3b2a52"/><ellipse cx="70" cy="50" rx="3.6" ry="4.4" fill="#3b2a52"/>
          <circle cx="51.3" cy="48.4" r="1.3" fill="#fff"/><circle cx="71.3" cy="48.4" r="1.3" fill="#fff"/>
        </g></g>
      </g></g>
    </g>
  </g>
</svg>
