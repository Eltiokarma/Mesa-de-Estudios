<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">161 · Área máxima de un rectángulo bajo un valor absoluto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polygon points="198.83,396.52 198.83,269.50 316.34,269.50 316.34,396.52 198.83,396.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="140.07,396.52 257.59,142.48 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">f(x)</text><polyline points="198.83,396.52 198.83,269.50 316.34,269.50 316.34,396.52 198.83,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Rectángulo máximo</text><circle cx="257.58525345622115" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="264.58525345622115" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(4,3)</text><circle cx="198.8294930875576" cy="269.5" r="3.7" fill="#20364b"/><text x="205.8294930875576" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2,5;1,5)</text><circle cx="316.3410138248848" cy="269.5" r="3.7" fill="#20364b"/><text x="323.3410138248848" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(5,5;1,5)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A altura h entre 0 y 3, los lados</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cortan la gráfica cuando ∣x−4∣=3−h. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">anchura es 2(3−h).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área es A(h)=2h(3−h)=9/2−2(h−3/2)².</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El máximo se alcanza en h=3/2, con</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">anchura 3 y esquinas superiores en</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=5/2 y x=11/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>