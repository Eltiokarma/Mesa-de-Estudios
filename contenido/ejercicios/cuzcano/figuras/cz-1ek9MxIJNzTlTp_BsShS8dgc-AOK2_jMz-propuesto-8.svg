<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Dos ramas inyectivas de cinco funciones seno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="244.09677419354838" x2="421" y2="244.09677419354838" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,345.71 105.47,345.57 110.04,345.15 114.61,344.46 119.18,343.49 123.75,342.25 128.32,340.74 132.89,338.96 137.46,336.92 142.03,334.63 146.60,332.10 151.17,329.32 155.74,326.30 160.31,323.06 164.88,319.61 169.45,315.95 174.02,312.09 178.59,308.04 183.16,303.82 187.73,299.44 192.30,294.90 196.87,290.23 201.44,285.43 206.01,280.51 210.58,275.50 215.15,270.40 219.72,265.22 224.29,259.99 228.86,254.72 233.43,249.41 238.00,244.10 242.57,238.78 247.14,233.48 251.71,228.20 256.28,222.97 260.85,217.80 265.42,212.70 269.99,207.68 274.56,202.77 279.13,197.97 283.70,193.29 288.27,188.75 292.84,184.37 297.41,180.15 301.98,176.10 306.55,172.25 311.12,168.58 315.69,165.13 320.26,161.89 324.83,158.88 329.40,156.10 333.97,153.56 338.54,151.27 343.11,149.23 347.68,147.46 352.25,145.95 356.82,144.70 361.39,143.73 365.96,143.04 370.53,142.62 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">C: y−k</text><polyline points="100.90,396.52 105.47,396.46 110.04,396.31 114.61,396.05 119.18,395.68 123.75,395.21 128.32,394.64 132.89,393.96 137.46,393.19 142.03,392.30 146.60,391.32 151.17,390.24 155.74,389.06 160.31,387.77 164.88,386.39 169.45,384.91 174.02,383.34 178.59,381.67 183.16,379.90 187.73,378.05 192.30,376.10 196.87,374.06 201.44,371.93 206.01,369.71 210.58,367.41 215.15,365.02 219.72,362.55 224.29,360.00 228.86,357.37 233.43,354.66 238.00,351.87 242.57,349.02 247.14,346.09 251.71,343.09 256.28,340.02 260.85,336.88 265.42,333.69 269.99,330.43 274.56,327.11 279.13,323.74 283.70,320.31 288.27,316.83 292.84,313.29 297.41,309.71 301.98,306.09 306.55,302.43 311.12,298.72 315.69,294.98 320.26,291.20 324.83,287.39 329.40,283.55 333.97,279.68 338.54,275.79 343.11,271.87 347.68,267.94 352.25,263.99 356.82,260.03 361.39,256.06 365.96,252.07 370.53,248.09 375.10,244.10" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">E: y−k</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los argumentos primero, segundo y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuarto atraviesan un máximo o un</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mínimo interior. Por simetría del</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">seno, producen pares de valores</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">repetidos.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El tercero recorre [−π/2,π/2] y el</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">quinto recorre [−π/2,0]. En ambos</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intervalos el seno es estrictamente</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">creciente.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja x con arcsen. Para el tercero,</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=π+2arcsen((y−k)/4). Para el quinto,</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=2π+4arcsen((y−k)/6).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>