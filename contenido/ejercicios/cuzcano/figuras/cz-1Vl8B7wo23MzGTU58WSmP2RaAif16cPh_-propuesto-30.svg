<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Parábola con dos huecos por cancelación</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="344.6728110599079" x2="421" y2="344.6728110599079" stroke="#20364b" stroke-width="1.7"/><line x1="215.1505376344086" y1="105" x2="215.1505376344086" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,142.48 105.47,156.79 110.04,170.69 114.61,184.17 119.18,197.23 123.75,209.88 128.32,222.12 132.89,233.94 137.46,245.34 142.03,256.33 146.60,266.91 151.17,277.07 155.74,286.82 160.31,296.15 164.88,305.06 169.45,313.57 174.02,321.65 178.59,329.33 183.16,336.59 187.73,343.43 192.30,349.86 196.87,355.87 201.44,361.47 206.01,366.65 210.58,371.42 215.15,375.78 219.72,379.72 224.29,383.24 228.86,386.35 233.43,389.05 238.00,391.33 242.57,393.20 247.14,394.65 251.71,395.69 256.28,396.31 260.85,396.52 265.42,396.31 269.99,395.69 274.56,394.65 279.13,393.20 283.70,391.33 288.27,389.05 292.84,386.35 297.41,383.24 301.98,379.72 306.55,375.78 311.12,371.42 315.69,366.65 320.26,361.47 324.83,355.87 329.40,349.86 333.97,343.43 338.54,336.59 343.11,329.33 347.68,321.65 352.25,313.57 356.82,305.06 361.39,296.15 365.96,286.82 370.53,277.07 375.10,266.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">x²−4x−6</text><circle cx="260.8494623655914" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="267.8494623655914" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Vértice</text><circle cx="123.75268817204301" cy="209.88018433179727" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="130.752688172043" y="201.88018433179727" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="169.4516129032258" cy="313.5668202764977" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="176.4516129032258" y="305.5668202764977" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El denominador es (x+2)(x+4). Excluye</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=−2 y x=−4 desde el comienzo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Factoriza el numerador como</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(x+2)(x+4)(x²−4x−6). En el dominio, la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">regla se reduce a x²−4x−6.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La parábola tiene vértice (2,−10).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dibuja círculos abiertos en (−4,26) y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−2,6).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>