<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Masa expulsada de un horno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">T (K)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">masa (kg)</text><polyline points="275.39,142.48 277.05,144.88 278.71,147.23 280.38,149.54 282.04,151.81 283.70,154.03 285.36,156.22 287.02,158.36 288.68,160.47 290.35,162.54 292.01,164.57 293.67,166.57 295.33,168.54 296.99,170.47 298.65,172.37 300.32,174.24 301.98,176.07 303.64,177.88 305.30,179.66 306.96,181.41 308.63,183.13 310.29,184.82 311.95,186.49 313.61,188.13 315.27,189.75 316.93,191.34 318.60,192.90 320.26,194.45 321.92,195.96 323.58,197.46 325.24,198.94 326.91,200.39 328.57,201.82 330.23,203.23 331.89,204.62 333.55,205.99 335.21,207.34 336.88,208.68 338.54,209.99 340.20,211.28 341.86,212.56 343.52,213.82 345.18,215.06 346.85,216.29 348.51,217.50 350.17,218.69 351.83,219.87 353.49,221.03 355.16,222.18 356.82,223.31 358.48,224.43 360.14,225.53 361.80,226.62 363.46,227.70 365.13,228.76 366.79,229.81 368.45,230.84 370.11,231.87 371.77,232.88 373.43,233.87 375.10,234.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">proceso</text><line x1="375.0967741935484" y1="234.85923753665693" x2="365.1632633280139" y2="233.7079939115682" stroke="#1766b0" stroke-width="2"/><line x1="375.0967741935484" y1="234.85923753665693" x2="369.32379060554604" y2="226.69390469024734" stroke="#1766b0" stroke-width="2"/><circle cx="300.316715542522" cy="174.23790322580646" r="3.7" fill="#20364b"/><text x="307.316715542522" y="166.23790322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">400 K; 72,5 kg</text><circle cx="350.1700879765396" cy="218.69354838709677" r="3.7" fill="#20364b"/><text x="343.1700879765396" y="210.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="end">500 K; 58 kg</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al calentarse a presión y volumen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">constantes, debe salir gas: el horno</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se modela como sistema abierto. Usar</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M=0,029 kg/mol.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mi=PVM/(RTi)=72,5 kg y mf=PVM/(RTf)=58</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">kg.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Δm=mf−mi=−14,5 kg. Salen 14,5 kg; la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opción A expresa el módulo de la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">disminución.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>