<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Tres veces las diagonales ordinarias</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,142.48 365.02,269.50 238.00,396.52 110.98,269.50 238.00,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="301.51,205.99 301.51,333.01" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="301.51,205.99 174.49,333.01" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="301.51,205.99 174.49,205.99" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="301.51,333.01 174.49,333.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="301.51,333.01 174.49,205.99" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="174.49,333.01 174.49,205.99" fill="none" stroke="#008674" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada par de puntos medios da una</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diagonal media. Hay n(n−1)/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala esta cantidad a 3n(n−3)/2 y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cancela n/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De n−1=3n−9 resulta n=4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>