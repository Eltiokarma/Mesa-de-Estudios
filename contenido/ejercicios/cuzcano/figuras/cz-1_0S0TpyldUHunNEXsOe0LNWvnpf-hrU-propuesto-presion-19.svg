<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">019 · Medidor submarino con resorte</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,184.70 100.90,354.30 375.10,354.30 375.10,184.70" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,204.49 375.10,204.49" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="148.96,255.37 307.26,255.37 307.26,314.73 148.96,314.73 148.96,255.37" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="155.74,284.20 180.62,284.20 190.23,268.37 202.10,300.59 213.41,268.37 224.71,300.59 236.02,268.37 247.89,300.59 260.90,284.20 281.81,284.20" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="281.81,255.37 281.81,314.73" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="344.00,204.49 344.00,284.20" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="191.35882939807118" y="329.9921849018956" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Resorte</text><text x="303.2976388427004" y="329.9921849018956" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Émbolo</text><text x="357.00565347522456" y="244.059361489857" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h</text><text x="175.52909876953777" y="244.62470901230463" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">pₐₜₘ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El resorte ejerce 1000×0,005 = 5 N al</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">comprimirse.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área del émbolo es π(0,01)² m². La</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerza neta por presión es ρghA.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala las fuerzas y divide por</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1000×10×π(0,01)².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>