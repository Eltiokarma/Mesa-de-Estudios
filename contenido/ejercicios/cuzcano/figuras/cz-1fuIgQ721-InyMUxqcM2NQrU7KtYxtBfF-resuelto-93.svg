<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">093 · Atajo por la diagonal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,353.10 368.41,353.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="368.41,353.10 368.41,152.47" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="368.41,152.47 100.90,353.10" fill="none" stroke="#008674" stroke-width="2.5"/><text x="107.90322580645162" y="345.09559402045636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="375.4091266719119" y="345.09559402045636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="375.4091266719119" y="144.4661683713611" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="174.77970102281668" y="378.5338316286389" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">mayor4</text><text x="382.0967741935484" y="278.2191188040913" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">menor3</text><text x="228.28088119590873" y="244.78088119590873" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">diagonal5</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Normalizar mayor 1 y menor r. Se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cumple√(1+r²)=1+r−1/2=r+1/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elevar al cuadrado: 1=r+1/4.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r=3/4. La solución cumple 0&lt;r≤1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>