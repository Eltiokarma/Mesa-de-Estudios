<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Altura de un faro observada desde dos navíos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="125.87,375.89 125.87,188.08 375.10,188.08 125.87,375.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="125.86862228785157" y="188.07925660661388" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="125.86862228785157" y="375.8861398747861" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="375.0967741935484" y="188.07925660661388" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="238.21290645415135" y="300.42354077291367" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50 m</text><text x="100.9032258064516" y="287.9408425322137" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">sur</text><text x="256.9369538152013" y="163.11386012521393" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">este</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La componente norte del recorrido es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la distancia horizontal del primer</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">navío al faro: 50sen37° m.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con el ángulo de elevación, la altura</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 50sen37° tan30°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Evalúa con 37° exactos. Si se aproxima</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen37° por 3/5, resulta 10√3 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>