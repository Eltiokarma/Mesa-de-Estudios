<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Diedro a partir de la razón entre áreas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="133.27,318.75 229.07,211.45 288.62,318.75" fill="#f4c581" fill-opacity="0.45"/><polygon points="133.27,318.75 229.07,301.14 288.62,318.75" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,327.55 302.86,327.55 375.10,272.97 173.14,272.97 100.90,327.55" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="133.27,318.75 229.07,211.45 288.62,318.75 133.27,318.75" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="133.27,318.75 229.07,301.14 288.62,318.75" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="229.07,211.45 205.76,318.75" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="205.76,318.75 229.07,301.14" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="229.07,301.14 229.07,211.45" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="133.26790337811082" y="318.7474088895046" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="288.61835572207497" y="318.7474088895046" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="229.06734899022206" y="211.44939881100416" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="229.06734899022206" y="301.141024290522" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="205.76478113862743" y="318.7474088895046" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="218.76243565140575" y="295.4862678252017" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escoge como base un segmento paralelo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a la intersección de los planos. Su</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud se conserva en la proyección.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura medida en el plano original</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se multiplica por cos θ. Por tanto,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también el área se multiplica por cos</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala cos θ=1/2 y toma el ángulo</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre 0° y 90°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>