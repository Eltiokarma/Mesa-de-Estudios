<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">019 · Longitud de cuerda en una parábola</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="377.34388314059646" x2="421" y2="377.34388314059646" stroke="#20364b" stroke-width="1.7"/><line x1="223.62081558125382" y1="105" x2="223.62081558125382" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="185.28,300.65 187.03,307.52 188.79,314.07 190.55,320.29 192.31,326.20 194.06,331.78 195.82,337.03 197.58,341.97 199.34,346.58 201.09,350.87 202.85,354.84 204.61,358.49 206.37,361.81 208.12,364.82 209.88,367.50 211.64,369.85 213.40,371.89 215.15,373.60 216.91,375.00 218.67,376.06 220.43,376.81 222.18,377.24 223.94,377.34 225.70,377.12 227.46,376.58 229.21,375.71 230.97,374.53 232.73,373.02 234.49,371.19 236.24,369.03 238.00,366.56 239.76,363.76 241.51,360.64 243.27,357.20 245.03,353.44 246.79,349.35 248.54,344.94 250.30,340.21 252.06,335.16 253.82,329.78 255.57,324.09 257.33,318.07 259.09,311.73 260.85,305.06 262.60,298.08 264.36,290.77 266.12,283.14 267.88,275.19 269.63,266.91 271.39,258.31 273.15,249.40 274.91,240.15 276.66,230.59 278.42,220.71 280.18,210.50 281.94,199.97 283.69,189.12 285.45,177.94 287.21,166.44 288.97,154.62 290.72,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="185.28,396.52 290.72,185.62" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="204.4485696895922" cy="358.17163724893487" r="3.7" fill="#20364b"/><text x="211.4485696895922" y="350.17163724893487" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="281.13755325623856" cy="204.79367011564213" r="3.7" fill="#20364b"/><text x="288.13755325623856" y="196.79367011564213" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta buscada es y=2x+3.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al igualar con x² se obtiene</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(x+1)(x−3)=0. Los cortes son (−1,1) y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(3,9).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus diferencias de coordenadas son 4 y</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">8. Usa Pitágoras.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>