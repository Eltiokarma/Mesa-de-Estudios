<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Suplemento en el máximo de una cuadrática</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,329.86 375.10,329.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,329.86 266.50,195.75" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,329.86 100.90,329.86" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="273.07,329.86 273.04,328.36 272.94,326.87 272.79,325.39 272.56,323.92 272.28,322.45 271.93,321.00 271.53,319.56 271.06,318.15 270.53,316.75 269.95,315.38 269.30,314.04 268.60,312.72 267.84,311.43 267.03,310.18 266.17,308.96 265.26,307.78 264.29,306.64 263.28,305.55 262.22,304.49 261.12,303.49 259.98,302.53 258.80,301.62 257.58,300.76 256.32,299.95 255.04,299.20 253.72,298.50 252.37,297.86 251.00,297.28 249.60,296.76 248.18,296.29 246.74,295.89 245.29,295.55" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="247.68,284.32 245.13,283.86 242.56,283.53 239.98,283.35 237.39,283.31 234.80,283.42 232.23,283.67 229.67,284.06 227.13,284.59 224.63,285.27 222.17,286.08 219.77,287.03 217.41,288.11 215.12,289.32 212.90,290.65 210.76,292.11 208.71,293.68 206.74,295.36 204.87,297.16 203.10,299.05 201.44,301.04 199.90,303.11 198.47,305.27 197.16,307.51 195.99,309.82 194.94,312.18 194.02,314.60 193.24,317.07 192.60,319.58 192.10,322.12 191.74,324.69 191.52,327.27 191.45,329.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="238.0" y="343.2458642288458" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="278.88324122068275" y="296.748420551149" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="197.67014673260888" y="280.0517953935407" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Reescribe θ=[102−(x+1)²]°. Su máximo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se alcanza en x=−1.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces θ=102°. Como θ y β forman un</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">par lineal, suman 180°.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta para hallar β.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>