<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">052 · Volumen oculto bajo un disco</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,238.38 375.10,238.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="163.89,238.38 163.89,230.96 312.11,230.96 312.11,238.38" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="163.89,238.38 238.00,303.73 312.11,238.38" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,238.38 238.00,303.73" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="280.9816913687881" y="220.58979947689627" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="124.61726242371404" y="268.0178727114211" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="269.86573670444636" y="290.2497820401046" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θc</text><text x="243.92850915431563" y="318.41020052310375" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vértice del cono</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo crítico tiene seno 3/4, así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que su tangente es 3/√7. Un pez a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">profundidad z ilumina con rayos</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">capaces de emerger un círculo de radio</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">z tan θc.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El círculo debe quedar completamente</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tapado por el disco. El radio de</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posiciones permitidas a profundidad z</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es R − z tan θc.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Es un cono de altura R√7/3. Su volumen</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es πR² por su altura dividido entre 3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>