<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">051 · Separación de dos impactos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,342.24 179.14,342.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="229.06,199.18 229.06,349.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="291.65,199.18 291.65,349.69" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="365.41,199.18 365.41,349.69" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,342.24 229.06,246.12 291.65,222.28 365.41,166.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="179.14,342.24 229.06,304.80 291.65,280.96 365.41,225.63" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="356.3962570126227" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="179.13779803646565" y="356.3962570126227" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="139.64796633941097" y="372.0431714586255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100 cm</text><text x="124.74614305750353" y="323.6122457924264" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="260.35273492286115" y="327.33770161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vidrio</text><text x="375.0967741935484" y="166.95682854137448" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="375.0967741935484" y="225.63275771388498" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la primera cara, la separación</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical vale 100 tan 37°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dentro de la placa ambos rayos tienen</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la misma pendiente. Al cruzar el mismo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">espesor se desplazan verticalmente lo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mismo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el aire recuperan su dirección y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conservan la separación en altura. Con</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan 37° ≈ 3/4 resulta 75 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>