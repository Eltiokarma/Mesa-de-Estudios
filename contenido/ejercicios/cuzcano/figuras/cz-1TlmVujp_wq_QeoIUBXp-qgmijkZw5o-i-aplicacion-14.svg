<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Ángulo de la aceleración media</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="360.89784946236557" x2="421" y2="360.89784946236557" stroke="#20364b" stroke-width="1.7"/><line x1="237.99999999999997" y1="105" x2="237.99999999999997" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="238.00,360.90 375.10,360.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">vi</text><line x1="375.0967741935484" y1="360.89784946236557" x2="365.9658847904253" y2="364.97545399296126" stroke="#1766b0" stroke-width="2"/><line x1="375.0967741935484" y1="360.89784946236557" x2="365.9658847904253" y2="356.8202449317699" stroke="#1766b0" stroke-width="2"/><polyline points="238.00,360.90 238.00,178.10" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">vf</text><line x1="237.99999999999997" y1="178.1021505376344" x2="242.07760453059566" y2="187.2330399407575" stroke="#d37618" stroke-width="2"/><line x1="237.99999999999997" y1="178.1021505376344" x2="233.92239546940428" y2="187.2330399407575" stroke="#d37618" stroke-width="2"/><polyline points="238.00,360.90 100.90,178.10" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">a media</text><line x1="100.90322580645162" y1="178.1021505376344" x2="109.64384307280203" y2="182.96029934177545" stroke="#008674" stroke-width="2"/><line x1="100.90322580645162" y1="178.1021505376344" x2="103.11967582384891" y2="187.85342477849028" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elegir vi=(3,0) y vf=(0,4);</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">amedia=(−3,4) m/s².</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El módulo es √(3²+4²)=5 m/s².</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector está en el segundo</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrante: θ=atan2(4,−3)≈126,87°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arcsen(4/5)=53,13° es el ángulo</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suplementario, no θ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>