<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">140 · Rango de una función que aparece a ambos lados de su regla</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="192.30107526881721" y1="105" x2="192.30107526881721" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,301.25 203.73,301.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">f=1</text><polyline points="203.73,301.25 238.00,301.25" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">f=1</text><polyline points="238.00,333.01 375.10,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">f=2x/3</text><circle cx="238.0" cy="333.008064516129" r="3.7" fill="#20364b"/><text x="245.0" y="325.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1, 2/3)</text><circle cx="203.7258064516129" cy="301.2540322580645" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="210.7258064516129" y="293.2540322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="238.0" cy="301.2540322580645" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="245.0" y="293.2540322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x≥1, despeja 3f(x)=2x. El rango de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esta rama es [2/3,∞).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la otra rama, (1−4x)f(x)=1−4x. Como</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x≠1/4, divide para obtener f(x)=1.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La imagen 1 del segundo tramo ya</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pertenece al rango del primero. Une</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las imágenes.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>