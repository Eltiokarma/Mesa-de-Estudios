<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Tres segmentos iguales alrededor de un ángulo recto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.13,294.05 315.76,191.74 366.91,294.05 264.60,345.21 111.13,294.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="111.13,294.05 264.60,294.05 366.91,294.05" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="315.76,191.74 264.60,294.05 264.60,345.21" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="303.26263842079925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="255.39287433798748" y="287.9159845931632" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="375.09677419354836" y="301.2164179104478" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="264.6008666345691" y="357.48748194511313" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="315.7563793933558" y="181.51251805488687" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma A=(−3,0), P=(0,0), C=(2,0) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(0,−d). Girar CD 90° en C da</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=(2−d,2).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BP²=BC² equivale a (2−d)²+4=4+d².</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta d=1 y B=(1,2).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las inclinaciones de AB y AD respecto</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de AC tienen tangentes 1/2 y 1/3 a</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lados opuestos. La tangente de su suma</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>