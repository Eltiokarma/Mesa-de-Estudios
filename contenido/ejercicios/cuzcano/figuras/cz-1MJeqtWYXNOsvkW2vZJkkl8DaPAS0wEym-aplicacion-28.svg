<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Una masa colgante sostiene otra en rampa lisa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="130.46,189.48 375.10,372.96 288.46,372.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="250.74,279.69 285.40,305.69 311.39,271.03 276.73,245.04 250.74,279.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="142.69,178.27 142.51,180.40 141.96,182.46 141.06,184.39 139.83,186.13 138.33,187.64 136.58,188.86 134.65,189.77 132.59,190.32 130.46,190.50 128.34,190.32 126.28,189.77 124.35,188.86 122.60,187.64 121.09,186.13 119.87,184.39 118.97,182.46 118.42,180.40 118.23,178.27 118.42,176.15 118.97,174.09 119.87,172.16 121.09,170.41 122.60,168.90 124.35,167.68 126.28,166.78 128.34,166.23 130.46,166.04 132.59,166.23 134.65,166.78 136.58,167.68 138.33,168.90 139.83,170.41 141.06,172.16 141.96,174.09 142.51,176.15 142.69,178.27" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="118.23,178.27 118.23,283.77" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,283.77 135.56,283.77 135.56,314.86 100.90,314.86 100.90,283.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="137.60,168.08 255.33,256.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="118.23144261901905" y="301.0985130111524" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m</text><text x="281.8301954670824" y="277.14480153495623" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="346.5561817963785" y="363.7858855977935" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La masa colgante fija la tensión T=mg.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuerda contrarresta la componente</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de peso M g sen 37° en la rampa.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala ambas expresiones y despeja. La</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximación del triángulo 3-4-5 toma</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 37°≈3/5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>