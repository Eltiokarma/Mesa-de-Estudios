<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Mínimo de un ángulo expresado como fracción</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,354.19 351.76,354.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,354.19 278.29,176.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="165.08,354.19 165.06,352.62 165.00,351.04 164.90,349.47 164.77,347.90 164.59,346.34 164.38,344.77 164.13,343.22 163.84,341.67 163.52,340.13 163.15,338.60 162.75,337.08 162.31,335.56 161.84,334.06 161.32,332.57 160.78,331.10 160.19,329.63 159.57,328.19 158.91,326.75 158.22,325.34 157.50,323.94 156.74,322.56 155.95,321.20 155.12,319.86 154.26,318.54 153.37,317.24 152.45,315.96 151.49,314.71 150.51,313.48 149.50,312.27 148.45,311.09 147.38,309.94 146.28,308.81" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="378.6932598092058" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.09677419354836" y="354.19085761291205" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="294.7873432285695" y="160.3067401907942" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="189.83534964633355" y="317.3539657877893" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1−xy/(x+y)²</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe la medida como 1−xy/(x+y)².</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como (x−y)²≥0, la fracción xy/(x+y)²</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">no supera 1/4 y alcanza ese valor con</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=y.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mínimo es 3/4 de grado. Convierte a</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">minutos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>