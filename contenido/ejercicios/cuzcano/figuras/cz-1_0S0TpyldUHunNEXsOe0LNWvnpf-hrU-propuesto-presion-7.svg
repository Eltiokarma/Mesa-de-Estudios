<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Profundidad y presión absoluta del buzo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,181.99 100.90,357.01 375.10,357.01 375.10,181.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,198.33 375.10,198.33" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,240.33 375.10,240.33" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,333.67 375.10,333.67" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="252.5847632120796" y="254.3318462594372" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="317.9245024021963" y="347.67433081674676" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="162.159231297186" y="319.0881949210707" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Buzo</text><text x="123.07206588881263" y="219.9118050789293" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia de 3×10⁵ Pa equivale a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una columna de agua de 30 m.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B está a 10 + 30 = 40 m bajo la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superficie.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La presión absoluta suma la</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">atmosférica y ρgh. Así 100 000 +</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1000×10×40 = 500 000 Pa.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>