<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">037 · Descuento conocido a 45 días</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,262.65 375.10,262.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,252.36 100.90,272.93" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="169.45,252.36 169.45,272.93" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,252.36 375.10,272.93" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645164" y="286.63709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hoy</text><text x="169.45161290322582" y="286.63709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15 días</text><text x="375.09677419354836" y="286.63709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vence en 60 días</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Convierte dos meses en 60 días.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Después de 15 días faltarán 45.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El descuento de hoy es 720 × 60/45 =</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">S/ 960, al ser proporcional al plazo.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma el descuento actual al valor</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">actual.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>