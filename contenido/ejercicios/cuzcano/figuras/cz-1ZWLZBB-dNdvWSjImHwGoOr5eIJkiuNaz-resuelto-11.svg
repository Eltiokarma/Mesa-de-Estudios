<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Merma del café al tostar</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,223.80 192.30,223.80 192.30,315.20 100.90,315.20 100.90,223.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="283.70,223.80 375.10,223.80 375.10,315.20 283.70,315.20 283.70,223.80" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="206.01,269.50 269.99,269.50 256.28,260.36" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="269.99,269.50 256.28,278.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="146.6021505376344" y="253.50537634408605" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60 kg</text><text x="146.6021505376344" y="290.06451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S/ 264</text><text x="329.39784946236557" y="253.50537634408605" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">48 kg</text><text x="329.39784946236557" y="290.06451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S/ 264</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El café crudo cuesta S/ (36 × 4 + 24 ×</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5) = S/ 264.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La masa vendible es 60 × 4/5 = 48 kg.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con la ganancia, el ingreso debe ser</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">264 × 1,20 = S/ 316,80.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide el ingreso objetivo entre los</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">48 kg tostados.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>