<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">050 · Distancia entre el centro de un cuadrado y un punto medio elevado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="186.00,287.09 100.90,351.38 290.00,351.38 375.10,287.09" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,351.38 290.00,351.38 195.45,187.62" fill="#f4c581" fill-opacity="0.45"/><polyline points="186.00,287.09 100.90,351.38 290.00,351.38 375.10,287.09 186.00,287.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,351.38 290.00,351.38 195.45,187.62 242.73,269.50 100.90,351.38" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,319.24 242.73,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><text x="185.99777530589543" y="287.08860881165435" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.9032258064516" y="351.3822684334564" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="290.0022246941046" y="351.3822684334564" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="287.08860881165435" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="238.0" y="319.23543862255536" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="195.4527252502781" y="187.6177315665436" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="242.72747497219132" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon B=(0,0,0), C=(4,0,0). El centro</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O=(2,2,0) y el vértice E=(2,0,2√3).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio M=(3,0,√3). Las</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencias desde O son 1,−2,√3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras, OM²=1+4+3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>