<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">066 · Altura desde el ángulo recto a una ceviana</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.19,326.07 170.04,209.79 367.24,326.07 107.19,326.07" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="150.40,250.64 367.24,326.07" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="170.04,209.79 159.83,253.00" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="150.40,250.64 150.40,326.07" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="335.4950087808485" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="170.0408540530548" y="201.93368148627417" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="334.7093539144098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="142.54293372770127" y="251.42993807191053" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="166.11257972086145" y="263.2147610684906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="151.97079212496533" y="337.06631851372583" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="119.75894260097975" y="289.9270265274055" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">25</text><text x="129.18680099824383" y="320.56756631851374" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">74°</text><text x="337.3853406044921" y="311.9253627876883" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="334.2427211387374" y="324.49584065070707" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea ∠DCB=θ y M el punto medio de DC.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como BDC es rectángulo en B, BM=MC.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así ∠BMD=2θ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ∠DCA=2θ, el ángulo agudo de BM con</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DC coincide con el de AC con DC. Las</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancias a B y a AC en los</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulos rectángulos con hipotenusa</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BM=MC son iguales.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia de M a AC es la mitad de</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la distancia de D a AC. Por eso</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BH=(25/2)sen74°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>