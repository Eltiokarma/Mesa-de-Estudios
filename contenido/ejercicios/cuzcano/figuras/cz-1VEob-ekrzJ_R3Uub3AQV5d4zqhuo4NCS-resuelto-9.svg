<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">009 · Presión total de una mezcla</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">estados indicados</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">P (10⁵ Pa)</text><polyline points="192.30,396.52 192.30,227.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">CO₂</text><polyline points="283.70,396.52 283.70,311.84" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">N₂O</text><polyline points="375.10,396.52 375.10,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">total</text><circle cx="192.30107526881721" cy="227.1612903225806" r="3.7" fill="#20364b"/><text x="199.30107526881721" y="219.1612903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">CO₂</text><circle cx="283.69892473118284" cy="311.83870967741933" r="3.7" fill="#20364b"/><text x="290.69892473118284" y="303.83870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N₂O</text><circle cx="375.09677419354836" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">total</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">nCO₂=22/44=0,5 mol; nN₂O=11/44=0,25</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mol; ntotal=0,75 mol.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usar T≈400 K y V=0,002 m³. Las</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">presiones parciales son 8,30·10⁵ y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4,15·10⁵ Pa.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la ley de Dalton,</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ptotal=ntotalRT/V=1,245·10⁶</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pa=12,45·10⁵ Pa.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>