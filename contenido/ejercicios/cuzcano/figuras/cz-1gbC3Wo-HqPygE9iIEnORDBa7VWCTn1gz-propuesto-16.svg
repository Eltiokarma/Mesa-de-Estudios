<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Bisectriz en un triángulo isósceles de base 8</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="157.42,390.47 188.20,295.75 238.00,142.48 303.19,343.11 318.58,390.47 157.42,390.47" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="157.42,390.47 303.19,343.11" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="318.58,390.47 188.20,295.75" fill="none" stroke="#008674" stroke-width="2.5"/><text x="157.4234831789922" y="390.47289027068246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.0" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="318.5765168210078" y="390.47289027068246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="303.18777145573415" y="343.11120200219773" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="188.20097390953958" y="295.74951373371294" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="184.61805760608235" y="386.4440644296321" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t</text><text x="172.33013879087866" y="376.1705585349536" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3t</text><text x="300.3675933669988" y="334.6506677359919" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="238.0" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea t=∠HAC. El ángulo A mide 4t, igual</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que C. Como AHC es rectángulo,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t+4t=90°. Así A=C=72°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La longitud de los lados iguales es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">8/(2 cos 72°)=8φ, donde φ=(1+√5)/2 y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">φ²=φ+1.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La bisectriz da BM/MA=BC/CA=φ. Por</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tanto BM=8φ·φ/(1+φ)=8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>