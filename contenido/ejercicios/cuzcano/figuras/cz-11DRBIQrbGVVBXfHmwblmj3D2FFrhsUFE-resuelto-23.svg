<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">023 · Segmento entre pies de dos perpendiculares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="135.59,384.21 252.11,147.55 341.13,382.77 135.59,384.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="172.50,309.67 341.13,382.77" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="224.61,196.04 341.13,382.77" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="135.59,384.21 284.68,291.57" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="172.50,309.67 293.37,261.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="284.68,291.57 293.37,261.90" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="126.18238213399505" y="392.17369727047145" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="163.8167907361456" y="312.5624483043838" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="349.8176178660049" y="389.2787427626137" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="219.54466501240697" y="192.42183622828784" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="251.38916459884203" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="275.99627791563273" y="286.5078577336642" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="302.05086848635233" y="264.79569892473114" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="137.762200165426" y="341.5119933829611" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="181.9102564102564" y="245.9784946236559" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6</text><text x="218.82092638544253" y="173.60463192721258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="270.20636889991727" y="341.5119933829611" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="243.42803970223326" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja C en la bisectriz de A. Su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">imagen P cae en la prolongación de AB</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con AP=10 y M es punto medio de CP.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja C en la bisectriz externa de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B. Su imagen Q queda más allá de B con</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BQ=8, así AQ=4+8=12. N es punto medio</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de CQ.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo CPQ el segmento MN es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelo a PQ y mide la mitad de</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AQ−AP.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>