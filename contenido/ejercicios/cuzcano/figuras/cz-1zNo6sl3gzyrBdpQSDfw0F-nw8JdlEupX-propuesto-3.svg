idth="2"/><polyline points="110.98,396.52 238.00,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">AM</text><line x1="238.00000000000003" y1="142.48387096774195" x2="237.56366248622612" y2="152.47434691106284" stroke="#b0467a" stroke-width="2"/><line x1="238.00000000000003" y1="142.48387096774195" x2="230.26942175360765" y2="148.82722654475361" stroke="#b0467a" stroke-width="2"/><circle cx="110.98387096774195" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="117.98387096774195" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="110.98387096774195" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="117.98387096774195" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="365.01612903225805" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="372.01612903225805" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="365.01612903225805" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="372.01612903225805" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D</text><circle cx="238.00000000000003" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="245.00000000000003" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tomar A=(0,0),B=(0,2),D=(2,0),M=(1,2).</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La resultante es</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,2)+(2,0)+(1,2)=(3,4).</t