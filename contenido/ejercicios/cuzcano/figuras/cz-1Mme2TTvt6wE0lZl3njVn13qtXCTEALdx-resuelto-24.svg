<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">024 · Cuadrados que empiezan y terminan con la misma cifra</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="64" y="160" font-family="Arial,sans-serif" font-size="19" fill="#1766b0" text-anchor="start">RELACIONES DEL PROBLEMA</text><text x="64" y="208" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como d va al comienzo, es no nula.</text><text x="64" y="231" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los residuos cuadrados módulo cien</text><text x="64" y="254" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con dos cifras iguales dejan como</text><text x="64" y="277" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">única posibilidad 44.</text><text x="64" y="316" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ahora d=4. Las raíces de cuadrados</text><text x="64" y="339" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre 40000 y 49999 van de 200 a 223.</text><text x="64" y="362" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para terminar en cuatro, la raíz</text><text x="64" y="385" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">acaba en dos u ocho.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como d va al comienzo, es no nula. Los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">residuos cuadrados módulo cien con dos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cifras iguales dejan como única</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posibilidad 44.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ahora d=4. Las raíces de cuadrados</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre 40000 y 49999 van de 200 a 223.</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para terminar en cuatro, la raíz acaba</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en dos u ocho.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las raíces son 202,208,212,218 y 222.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay cinco cuadrados.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>