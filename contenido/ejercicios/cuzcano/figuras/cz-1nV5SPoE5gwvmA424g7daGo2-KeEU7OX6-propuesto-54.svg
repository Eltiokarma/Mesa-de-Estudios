<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Plato,aceite y agua</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="178.51026392961876" x2="421" y2="178.51026392961876" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">Tf (°C)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">ΣQ (cal)</text><polyline points="146.60,396.52 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">balance térmico</text><circle cx="342.6920821114369" cy="178.51026392961876" r="3.7" fill="#20364b"/><text x="349.6920821114369" y="170.51026392961876" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">equilibrio</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La energía se conserva:ΣCi(Tf−Ti)=0.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto Tf=ΣCiTi/ΣCi=(15·10 + 60·40</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">+ 200·60)/275.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tf≈52.9091°C;se comprueba el balance</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de calor.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>