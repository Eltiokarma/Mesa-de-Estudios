<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">092 · Razón de proyecciones sobre dos planos perpendiculares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="238.00,149.25 176.31,389.75 299.69,296.52" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,343.14 176.31,389.75 375.10,343.14 299.69,296.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,149.25 375.10,149.25 176.31,389.75 299.69,296.52 100.90,149.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,149.25 176.31,389.75" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,149.25 299.69,296.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,149.25 176.31,389.75 299.69,296.52 238.00,149.25" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,343.14 176.31,389.75 375.10,343.14 299.69,296.52 100.90,343.14" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,149.25 100.90,343.14" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="375.10,149.25 375.10,343.14" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="100.90322580645162" y="149.25148967603786" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="149.25148967603786" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="176.30645161290323" y="389.7485103239622" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="299.6935483870968" y="296.5227038723492" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="238.0" y="149.25148967603786" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma las aristas opuestas paralelas a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x e y, de longitud a. Sus puntos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medios están separados por a/√2 en z,</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">porque una arista entre ellas tiene</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrado a²/4+a²/4+h²=a².</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el plano yz se obtiene un triángulo</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de base a y altura a/√2. En el plano</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">xy se obtiene un rombo con diagonales</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares de longitud a.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las áreas son a²/(2√2) y a²/2. Divide</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la mayor por la menor.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>