<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Pares conjugados en el esquema de fenol</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="126.26,236.42 100.90,251.06 100.90,280.33 126.26,294.97 151.61,280.33 151.61,251.06 126.26,236.42" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="126.26,241.69 105.47,253.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="105.47,277.70 126.26,289.70" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="147.05,277.70 147.05,253.69" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="126.26,294.97 126.26,307.56" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="275.56,236.42 250.21,251.06 250.21,280.33 275.56,294.97 300.91,280.33 300.91,251.06 275.56,236.42" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="275.56,241.69 254.77,253.69" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="254.77,277.70 275.56,289.70" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="296.35,277.70 296.35,253.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="275.56,294.97 275.56,307.56" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="197.98,262.18 236.04,262.18" fill="none" stroke="#008674" stroke-width="2.5"/><line x1="236.0389242850425" y1="262.1811657942892" x2="226.9080348819194" y2="266.2587703248849" stroke="#008674" stroke-width="2"/><line x1="236.0389242850425" y1="262.1811657942892" x2="226.9080348819194" y2="258.1035612636935" stroke="#008674" stroke-width="2"/><polyline points="236.04,269.21 197.98,269.21" fill="none" stroke="#b0467a" stroke-width="2.5"/><line x1="197.98098641534614" y1="269.20724663177157" x2="207.11187581846923" y2="265.1296421011759" stroke="#b0467a" stroke-width="2"/><line x1="197.98098641534614" y1="269.20724663177157" x2="207.11187581846923" y2="273.28485116236726" stroke="#b0467a" stroke-width="2"/><polyline points="375.10,265.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><circle cx="106.34918215984649" cy="225.8797481339634" r="3.7" fill="#20364b"/><text x="113.34918215984649" y="217.8797481339634" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I · fenol</text><circle cx="122.1578640441819" cy="313.1202518660366" r="3.7" fill="#20364b"/><text x="129.1578640441819" y="305.1202518660366" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">OH</text><circle cx="255.65339995634756" cy="225.8797481339634" r="3.7" fill="#20364b"/><text x="262.6533999563476" y="217.8797481339634" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">III · fenóxido</text><circle cx="271.4620818406829" cy="313.1202518660366" r="3.7" fill="#20364b"/><text x="278.4620818406829" y="305.1202518660366" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O⁻</text><circle cx="159.9230485456498" cy="256.91160516617737" r="3.7" fill="#20364b"/><text x="166.9230485456498" y="248.91160516617737" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">+ H₂O (II)</text><circle cx="307.7634995010087" cy="256.91160516617737" r="3.7" fill="#20364b"/><text x="314.7634995010087" y="248.91160516617737" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">+ H₃O⁺ (IV)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El fenol (I) pierde H⁺ y pasa a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fenóxido (III). Es el primer par.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El agua (II) gana H⁺ y pasa a hidronio</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(IV). Es el segundo par.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El fenóxido y el hidronio están del</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mismo lado, pero pertenecen a pares</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distintos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>