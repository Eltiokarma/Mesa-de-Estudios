<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Comprensión y potencia</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">categorías</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">cantidad</text><polyline points="100.90,396.52 100.90,294.90 140.07,294.90 140.07,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="179.24,396.52 179.24,142.48 218.41,142.48 218.41,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="257.59,396.52 257.59,345.71 296.76,345.71 296.76,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="335.93,396.52 335.93,345.71 375.10,345.71 375.10,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><circle cx="120.48847926267281" cy="294.9032258064516" r="3.7" fill="#20364b"/><text x="127.48847926267281" y="286.9032258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><circle cx="198.8294930875576" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="205.8294930875576" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5</text><circle cx="277.1705069124424" cy="345.7096774193548" r="3.7" fill="#20364b"/><text x="284.1705069124424" y="337.7096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><circle cx="355.5115207373272" cy="345.7096774193548" r="3.7" fill="#20364b"/><text x="362.5115207373272" y="337.7096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ecuación factoriza (x−5)(x−8)=0,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que A={5,8}.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B={3,5,7,9,11}; solo x=3 de B es menor</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que5, por lo que C={8}.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(A∪C)−B={8}; n(P(D))=2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>