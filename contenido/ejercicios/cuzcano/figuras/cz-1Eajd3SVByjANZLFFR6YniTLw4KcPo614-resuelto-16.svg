<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Punto notable formado en un cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,396.52 110.98,142.48 238.00,142.48 365.02,142.48 365.02,269.50 365.02,396.52 110.98,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.98,396.52 212.60,193.29 238.00,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.98,142.48 212.60,193.29 365.02,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.98,396.52 365.02,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="110.98,396.52 238.00,269.50 365.02,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,269.50 365.02,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="110.98387096774195" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="110.98387096774195" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="365.01612903225805" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="365.01612903225805" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="238.00000000000003" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="365.01612903225805" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="212.5967741935484" y="193.29032258064515" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="238.00000000000003" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma A=(0,0), B=(0,2), C=(2,2) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(2,0). Entonces M=(1,2), N=(2,1) y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O=(1,1).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En A, los rayos AP y AN se reflejan</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre sí al intercambiar x e y. Por</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">eso AO es bisectriz interna.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En N, NA y NP se reflejan en y=1,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recta que contiene NO. Al cruzarse dos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisectrices interiores en O, O es el</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">incentro.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>