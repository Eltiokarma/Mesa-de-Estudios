<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Intersección con la recta del vértice del cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="145.30,386.89 213.52,269.29 330.70,269.29 262.06,386.89 145.30,386.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="213.52,269.29 213.52,151.27 330.70,151.27 330.70,269.29" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="145.30,386.89 330.70,269.29" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="262.06,386.89 330.70,151.27" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="213.52,269.29 262.06,386.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="139.86068448743157" y="394.42360631344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="206.4029069458468" y="266.77972046553646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="335.7208109688048" y="273.0572886219908" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="264.5750385289897" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="336.13931551256843" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="211.42496147101025" y="142.9023755115055" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="295.5443747674975" y="303.18961577297125" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="231.09467502790028" y="323.2778338736249" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="306.84399744911514" y="221.1627251953021" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ME</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa como origen el cruce de las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diagonales del rombo y toma AC</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal. Escribe C=(a,0), B=(0,b) y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(0,−b), con a=4√2.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al girar el vector BC=(a,−b) un cuarto</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de vuelta hacia fuera se obtiene</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CE=(b,a). Entonces E=(a+b,a) y DE</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene componentes iguales.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde M en el eje horizontal hasta E</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hay un ascenso a y un avance</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal a. Por Pitágoras, ME=a√2=8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>