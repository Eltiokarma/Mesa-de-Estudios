<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">068 · Peso máximo al llegar al extremo libre de una tabla</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="105.67,284.88 365.57,284.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="182.77,305.67 192.30,284.88 201.83,305.67 182.77,305.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="356.04,305.67 365.57,284.88 375.10,305.67 356.04,305.67" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="105.67,236.36 105.67,284.88" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,274.91 105.67,284.88 110.43,274.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="235.62,236.36 235.62,284.88" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="230.85,274.91 235.62,284.88 240.38,274.91" fill="none" stroke="#008674" stroke-width="2.5"/><text x="192.30107526881721" y="313.0330989145391" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="365.567140600316" y="313.0330989145391" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="148.98455893594252" y="296.5728227080467" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L/3</text><text x="213.95933343525456" y="296.5728227080467" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L/6</text><text x="105.66804260306783" y="225.96690108546093" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Niño</text><text x="235.61759160169188" y="225.96690108546093" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">900 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el umbral el apoyo derecho deja de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ejercer reacción. Toma momentos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto del apoyo a L/3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El peso de la tabla es 900 N y su</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">centro está a L/6 a la derecha del</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">apoyo. El niño está a L/3 a la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala W(L/3)=900(L/6).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>