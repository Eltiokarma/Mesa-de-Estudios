<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">075 · Ángulo exacto con datos en grados y minutos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.60,316.52 248.67,259.62 367.19,316.52 109.60,316.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.60,316.52 303.98,283.33" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="109.60,316.52 158.59,219.32 248.67,259.62" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645167" y="325.99809426420006" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="249.45765548015245" y="252.51106256391188" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935483" y="324.41772799107554" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="158.5865947754951" y="213.00190573579997" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="307.1410244491958" y="276.216556660779" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="340.3287161848098" y="309.40424839639303" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°/2</text><text x="224.17179511016084" y="263.5736264757832" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">135° en B</text><text x="170.43934182392866" y="311.77479780607973" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Traza AH perpendicular a la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">prolongación de CB. En el triángulo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulo ABH, ∠ABH=45° y AH=HB=a.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si c=37°/2, entonces HC=a cot c. Como</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M es punto medio de BC,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">HM=(HB+HC)/2=a(1+cot c)/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto ∠AMH=arctan[2/(1+cot c)]. En</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el triángulo AMC, ∠AMH es exterior,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que ∠MAC=∠AMH−c.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>