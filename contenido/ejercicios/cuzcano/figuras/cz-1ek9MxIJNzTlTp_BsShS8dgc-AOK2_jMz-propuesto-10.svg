<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Hueco en el rango de una arcosecante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución</text><line x1="60" y1="200" x2="425" y2="200" stroke="#8295a8" stroke-width="2"/><line x1="98.3199220835281" y1="200" x2="248.25957145940458" y2="200" stroke="#1766b0" stroke-width="6"/><circle cx="98.3199220835281" cy="200" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="98.3199220835281" y="235" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/3</text><circle cx="248.25957145940458" cy="200" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="248.25957145940458" y="235" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">11π/6</text><line x1="60" y1="290" x2="425" y2="290" stroke="#8295a8" stroke-width="2"/><line x1="248.25957145940458" y1="290" x2="398.1992208352811" y2="290" stroke="#1766b0" stroke-width="6"/><circle cx="248.25957145940458" cy="290" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="248.25957145940458" y="325" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">11π/6</text><circle cx="398.1992208352811" cy="290" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="398.1992208352811" y="325" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">10π/3</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El argumento lineal puede recorrer</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">todo el dominio de arcsec,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−∞,−1]∪[1,∞).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la rama arcsec u=arccos(1/u), el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rango es [0,π] sin π/2. Los extremos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se alcanzan cuando u=1 o u=−1.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica el intervalo por 3,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desplázalo π/3 y traslada también el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hueco de π/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>