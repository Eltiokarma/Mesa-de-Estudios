<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">020 · Suma cíclica de cocientes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="64" y="160" font-family="Arial,sans-serif" font-size="19" fill="#1766b0" text-anchor="start">RELACIONES DEL PROBLEMA</text><text x="64" y="208" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada término se descompone como 1+cot</text><text x="64" y="231" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A cot B para su par.</text><text x="64" y="270" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como A+B=180°−C, divide sen(A+B)=sen</text><text x="64" y="293" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C y cos(A+B)=−cos C por sen A sen B</text><text x="64" y="316" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para obtener cot A cot B−1=−cot C(cot</text><text x="64" y="339" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A+cot B).</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada término se descompone como 1+cot</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A cot B para su par.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como A+B=180°−C, divide sen(A+B)=sen C</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y cos(A+B)=−cos C por sen A sen B para</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtener cot A cot B−1=−cot C(cot A+cot</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma de los tres productos de</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cotangentes vale 1. Los otros tres</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sumandos valen 1 cada uno.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>