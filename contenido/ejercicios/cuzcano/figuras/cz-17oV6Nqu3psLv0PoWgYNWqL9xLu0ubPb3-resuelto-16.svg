<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Dos paralelas a distancia fija de un punto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="142.74,285.38 333.26,285.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,396.52 238.00,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="158.61,317.13 317.39,198.05" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="158.61,309.19 317.39,190.11" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="158.61,388.58 317.39,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="214.18447580645162" y="298.07862903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="322.148185483871" y="182.17641129032262" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="323.73588709677415" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toda paralela se expresa 3x−4y+c=0.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fórmula de distancia da</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∣−3+4+c∣/5=2, o ∣1+c∣=10.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resuelve 1+c=10 o 1+c=−10. Así c=9 o</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">c=−11.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>