<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Un arco de 120° y dos prolongaciones radiales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="166.04,264.51 167.54,262.03 169.12,259.60 170.78,257.22 172.53,254.90 174.35,252.65 176.25,250.46 178.23,248.34 180.28,246.29 182.40,244.31 184.59,242.41 186.85,240.58 189.16,238.84 191.54,237.18 193.97,235.60 196.46,234.10 198.99,232.70 201.58,231.38 204.20,230.15 206.87,229.02 209.58,227.98 212.32,227.04 215.10,226.19 217.90,225.44 220.72,224.79 223.57,224.23 226.44,223.78 229.31,223.43 232.20,223.17 235.10,223.02 238.00,222.97 240.90,223.02 243.80,223.17 246.69,223.43 249.56,223.78 252.43,224.23 255.28,224.79 258.10,225.44 260.90,226.19 263.68,227.04 266.42,227.98 269.13,229.02 271.80,230.15 274.42,231.38 277.01,232.70 279.54,234.10 282.03,235.60 284.46,237.18 286.84,238.84 289.15,240.58 291.41,242.41 293.60,244.31 295.72,246.29 297.77,248.34 299.75,250.46 301.65,252.65 303.47,254.90 305.22,257.22 306.88,259.60 308.46,262.03 309.96,264.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,226.71 166.04,264.51" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="309.96,264.51 375.10,226.71" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="166.04,264.51 238.00,306.06 309.96,264.51" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="358.48,245.40 328.15,263.27" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="333.71,254.69 328.15,263.27 338.35,262.57" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="150.76,263.68 121.68,246.24" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="131.86,247.02 121.68,246.24 127.16,254.86" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="238.0" y="316.0298142717498" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="238.0" y="294.8421309872923" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">120°</text><text x="276.6363636363636" y="293.1803519061584" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="345.18475073313783" y="261.6065493646139" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En los tramos radiales, el elemento de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corriente y la dirección hacia P son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelos. Su producto vectorial es</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cero.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El arco aporta μ₀Iθ/(4πR), con θ=2π/3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al simplificar, queda μ₀I/(6R). Por la</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">regla de la mano derecha, el campo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sale del plano.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>