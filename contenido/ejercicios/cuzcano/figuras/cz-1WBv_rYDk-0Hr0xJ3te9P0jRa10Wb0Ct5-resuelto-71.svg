<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">071 · Volumen de metano por su presión parcial</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,291.47 100.90,352.13 375.10,352.13 375.10,291.47" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,319.33 375.10,319.33" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="171.46,333.56 171.46,217.82 173.32,204.82 179.51,194.92 190.03,188.73 201.17,186.87 212.31,190.58 222.22,198.63 227.17,209.77 228.41,217.82 228.41,333.56" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="195.60,311.90 195.60,335.42 204.27,342.85 224.07,342.23 248.21,326.13 269.26,297.66 293.40,288.38 357.15,288.38" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="348.48,284.05 341.05,288.38 348.48,292.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="177.03371441054395" y="246.90843224350107" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₄ + vapor</text><text x="239.54736765455473" y="227.7210733270225" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">600 torr</text><text x="116.37690235199882" y="340.9883856404282" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="333.00837398965996" y="281.56946770552685" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₄</text><text x="167.1305614213937" y="313.13576785844316" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Nivel de agua</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La presión del vapor es 0,50·72=36</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">torr, y la del CH₄ es 600−36=564 torr.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cantidad de CH₄ es 2,0/16=0,125</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mol. La temperatura es 320 K.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica V=nRT/P con la presión parcial</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en atmósferas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>