<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">037 · Seno y coseno cuando el ángulo parte del eje vertical</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="183.96,175.14 292.04,175.14" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="266.57,396.52 266.57,149.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="266.57,175.14 209.43,371.05" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="266.57,142.48 263.46,142.63 260.39,143.07 257.37,143.81 254.43,144.83 251.60,146.12 248.91,147.67 246.38,149.48 244.03,151.52 241.88,153.77 239.96,156.21 238.28,158.83 236.86,161.59 235.71,164.48 234.83,167.46 234.25,170.52 233.95,173.61 233.96,176.72 234.26,179.82 234.85,182.87 235.73,185.85 236.89,188.74 238.31,191.50 240.00,194.11 241.92,196.55 244.07,198.80 246.43,200.83 248.96,202.63 251.66,204.18 254.49,205.47 257.43,206.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="266.57046604196034" y="175.1358321585538" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="209.42953395803963" y="371.0475993034248" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="292.0389957707936" y="180.03362633717558" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="273.42737789203085" y="149.66730242972056" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="233.9185048511485" y="184.9314205157973" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para usar el eje x como inicio, rota</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el dibujo 90° en sentido horario. El</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rayo de θ pasa entonces por (−24,7).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La norma es 25. Así sen(−θ)=−7/25,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos(−θ)=−24/25 y tan(−θ)=7/24.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye. La expresión vale −7−24+7.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>