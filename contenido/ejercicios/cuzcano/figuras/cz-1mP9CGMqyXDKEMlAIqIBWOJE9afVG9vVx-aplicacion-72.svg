<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">072 · Masa de una varilla que baja uniformemente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="102.16,162.77 197.43,162.77 203.60,170.71 215.07,154.83 226.53,170.71 238.00,154.83 249.47,170.71 260.93,154.83 272.40,170.71 282.10,162.77 373.84,162.77 373.84,339.18 102.16,339.18 102.16,162.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="102.16,339.18 102.16,390.34" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="373.84,339.18 373.84,390.34" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,346.24 238.00,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,346.24 238.00,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="231.83,382.40 238.00,396.52 244.17,382.40" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="238.0" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 Ω</text><text x="238.0" y="295.9616935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1,5 m</text><text x="355.31350806451616" y="193.6431451612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊗ 2 T</text><text x="268.8719758064516" y="390.34173387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 m/s</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fem de movimiento es BLv=12 V. Con</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2 Ω circulan 6 A.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza magnética se opone a la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bajada y vale ILB=18 N. Las dos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerzas de rozamiento suman 5 N hacia</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arriba.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La rapidez constante exige mg=18+5 N.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide entre g.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>