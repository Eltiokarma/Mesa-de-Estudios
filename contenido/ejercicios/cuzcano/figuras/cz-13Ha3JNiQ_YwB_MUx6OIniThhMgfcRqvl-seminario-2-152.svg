dle">O</text><text x="316.96568419778487" y="192.8492707135508" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">··</text><text x="312.8502087998547" y="203.65239363311744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">··</text><text x="309.2491678266658" y="285.9619015917207" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="311.8213399503722" y="271.55773769896507" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">··</text><text x="152.34666828057857" y="315.79909822671425" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="203.79011075470552" y="197.47918053622223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="203.79011075470552" y="315.79909822671425" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="306.6769957029595" y="346.6651637111904" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="375.0967741935484" y="291.1062458391333" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El esqueleto acíclico tiene 14 átomos,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por lo que hay 13 conexiones σ. El</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">doble C=O añade un π.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El O tiene dos pares libres y cada N</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">uno, para un total de cuatro pares</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">libres.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El dibujo ordinario de la amida se</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">representa con enlaces covalentes y no</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exige marcar uno como dativo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>