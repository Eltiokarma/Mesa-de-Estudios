<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">182 · Diferencia entre dos distancias en un triángulo obtuso</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="140.99,386.98 336.70,153.70 295.20,386.98 140.99,386.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="336.70,153.70 336.70,386.98 295.20,386.98" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="295.20,386.98 204.69,311.05" fill="none" stroke="#008674" stroke-width="2.5"/><text x="131.4522537919248" y="395.3945738090151" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="336.69685964537496" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="304.1717581713309" y="395.9553514206366" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="344.5477462080752" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="195.38090151676988" y="309.03482161931214" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="166.2204657124546" y="374.0850245674001" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50°</text><text x="291.834650715659" y="364.55180516983546" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea s = AC. CQ = s sen 50°. Además, ∠B</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= 30°, y por la ley de senos BC = 2s</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 50°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H queda más allá de C, así que CH = BC</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 10°. La diferencia es s(sen 50° −</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2 sen 50° sen 10°).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 2 sen 50° sen 10° = cos 40° − cos</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60° y cos 40° = sen 50°, la diferencia</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es s/2. Entonces s = 4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>