<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">084 · Posición de una imagen real ampliada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="293.62,191.16 296.60,195.08 299.43,198.99 302.10,202.91 304.62,206.83 306.99,210.74 309.20,214.66 311.27,218.58 313.18,222.50 314.93,226.41 316.54,230.33 317.99,234.25 319.29,238.16 320.43,242.08 321.43,246.00 322.27,249.91 322.95,253.83 323.49,257.75 323.87,261.67 324.10,265.58 324.18,269.50 324.10,273.42 323.87,277.33 323.49,281.25 322.95,285.17 322.27,289.09 321.43,293.00 320.43,296.92 319.29,300.84 317.99,304.75 316.54,308.67 314.93,312.59 313.18,316.50 311.27,320.42 309.20,324.34 306.99,328.26 304.62,332.17 302.10,336.09 299.43,340.01 296.60,343.92 293.62,347.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="252.10,269.50 252.10,247.56" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="143.99,269.50 143.99,324.34" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="252.10,247.56 324.18,269.50 143.99,324.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="252.10,247.56 324.18,247.56 143.99,324.34" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="252.10138248847923" y="233.463133640553" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Objeto</text><text x="143.99078341013822" y="339.2235023041475" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen</text><text x="336.7096774193548" y="287.5184331797235" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La magnitud del aumento es s′/s = m,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que s = s′/m.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces 1/f = 1/s + 1/s′ = (m +</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1)/s′.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja s′ = (m + 1)f. El</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplicador pedido es m + 1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>