<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Suma de exteriores en un cuadrilátero cruzado por diagonales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,383.00 137.00,242.08 325.12,212.93 375.10,383.00 100.90,383.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,383.00 325.12,212.93" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="137.00,242.08 375.10,383.00" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="107.84,178.22 173.10,328.16" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="278.61,326.07 359.13,156.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="143.94120048999594" y="224.7266231114741" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="318.86974275214374" y="196.96018783176808" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="139.08207431604737" y="267.7645977950184" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2α</text><text x="163.3777051857901" y="262.90547162106986" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="293.87995100040825" y="251.1047366271948" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="331.3646386280114" y="249.71641486320945" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2β</text><text x="126.58717844017968" y="376.0536953858718" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">γ</text><text x="118.95140873826051" y="352.4522253981217" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">γ</text><text x="351.4953042057982" y="374.6653736218865" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="354.9661086157615" y="355.92302980808495" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos triángulos que comparten la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">base inferior y tienen una diagonal</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dan 3α + 2γ + θ = 180° y 3β + γ + 2θ =</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°. Al sumar, α + β + γ + θ = 120°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos interiores superiores suman</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">360° − 2(γ + θ). Los ángulos</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suplementarios a a y b excluyen además</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2α y 2β, respectivamente.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces a + b = 2(α + β + γ + θ) =</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">240°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>