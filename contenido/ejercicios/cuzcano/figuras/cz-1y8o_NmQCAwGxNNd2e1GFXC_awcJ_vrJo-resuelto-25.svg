<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">025 · Ángulo exacto con una diagonal dividida</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.63,364.33 165.84,173.12 368.91,171.06 310.16,363.82 108.63,364.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.63,364.33 368.91,171.06" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="165.84,173.12 310.16,363.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="182.85,308.67 310.16,363.82" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="230.78,259.19 238.00,253.52 244.18,260.74" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645159" y="376.1880911957313" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="164.29759883579914" y="162.81190880426868" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="163.32731021101137" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="316.34101382488484" y="374.6418869755033" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="181.82124666504973" y="296.8162745573611" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="245.73102110113996" y="273.62321125394135" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="286.44773223381037" y="352.4796264855688" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma la razón común como unidad. En el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cruce O de las diagonales</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares, AO=8, OD=4 y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EO=8−5=3.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pitágoras en EOD da ED=√(3²+4²)=5=AE.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto AED es isósceles.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo exterior OED vale</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arctan(4/3) y es la suma de los dos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos iguales de AED. Divide entre</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>