<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">072 · Cadena principal y orden de dos sustituyentes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,255.22 138.99,293.30 177.07,255.22 215.15,293.30 253.23,255.22 291.32,293.30 329.40,255.22 367.48,293.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="138.99,293.30 138.99,331.38" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="253.23,255.22 253.23,217.14 291.32,198.10" fill="none" stroke="#008674" stroke-width="2.5"/><text x="138.98566308243727" y="340.9045698924731" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">metil</text><text x="306.5483870967742" y="198.09543010752688" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">etil</text><text x="100.90322580645162" y="243.79435483870967" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C1</text><text x="375.09677419354836" y="300.91801075268813" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cadena más larga conecta uno de los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">metilos de la izquierda con el extremo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del brazo propilo. Tiene ocho</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">carbonos.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al numerar desde la izquierda, los</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituyentes quedan en 2 y 5. Desde</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el extremo contrario quedarían en 4 y</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">7.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Identifica metil en C2 y etil en C5.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el nombre, etil precede</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alfabéticamente a metil.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>