<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Producto obtenido de una suma de recíprocos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,293.83 375.10,293.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,290.43 107.18,297.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="194.39,290.43 194.39,297.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,290.43 238.00,297.23" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.82,290.43 368.82,297.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="194.39,267.67 238.00,267.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="194.39,264.53 194.39,270.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,264.53 238.00,270.81" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="194.39,241.51 368.82,241.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="194.39,238.37 194.39,244.64" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="368.82,238.37 368.82,244.64" fill="none" stroke="#008674" stroke-width="2.5"/><text x="107.18246737256834" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="194.3941557908561" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="238.0" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="368.81753262743166" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="216.19707789542804" y="259.2962324550603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">u</text><text x="281.6058442091439" y="233.132725929574" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">v</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe BO=b, OL=u, OA=v. La igualdad</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 1/b=1/(b+u)+1/(b+v).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al multiplicar por b(b+u)(b+v) y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simplificar, queda uv=b².</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye en 8uv/b².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>