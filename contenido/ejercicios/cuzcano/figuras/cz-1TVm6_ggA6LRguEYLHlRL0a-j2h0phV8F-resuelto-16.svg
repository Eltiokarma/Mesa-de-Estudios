<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Regiones congruentes a ambos lados de una altura</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="106.24,290.46 234.48,267.85 242.71,290.46" fill="#f4c581" fill-opacity="0.45"/><polygon points="370.94,243.79 242.71,266.40 242.71,290.46" fill="#f4c581" fill-opacity="0.45"/><polyline points="106.24,290.46 234.48,267.85 242.71,266.40 370.94,243.79 242.71,290.46 106.24,290.46" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="242.71,290.46 242.71,266.40" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="242.71,290.46 234.48,267.85" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="296.99018983404403" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="244.48823180023328" y="298.17684277614137" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.09677419354836" y="240.82315722385863" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="245.67488474233065" y="261.6545098848017" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="224.3918505471825" y="261.91900186793254" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="225.50178472667537" y="285.716986884119" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="353.73702123579574" y="252.09636017378364" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea α=∠TAD. El ángulo BED vale 90°+α y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es obtuso, por lo que corresponde a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠ATD. La suma angular de ATD da</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=90°−2α.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo de 10° en B debe</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corresponder a α o a x. Si</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">correspondiera a x, los lados DB y DA</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">quedarían emparejados y el triángulo</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ADB sería isósceles, con α=10°,</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto α=10°. Sustituye en</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=90°−2α.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>