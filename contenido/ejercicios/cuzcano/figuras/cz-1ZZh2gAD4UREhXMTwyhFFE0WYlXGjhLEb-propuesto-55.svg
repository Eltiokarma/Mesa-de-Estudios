<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">055 · Doble péndulo con longitud sin referencia</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.4838709677419" x2="421" y2="142.4838709677419" stroke="#20364b" stroke-width="1.7"/><line x1="297.27419354838713" y1="105" x2="297.27419354838713" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="297.27,142.48 246.47,210.23 178.73,261.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">cuerdas</text><polyline points="297.27,142.48 297.27,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">vertical</text><circle cx="246.46774193548387" cy="210.22580645161287" r="3.7" fill="#20364b"/><text x="253.46774193548387" y="202.22580645161287" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m;α=37°</text><circle cx="178.72580645161293" cy="261.0322580645161" r="3.7" fill="#20364b"/><text x="185.72580645161293" y="253.0322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m;β=53°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con valores notables,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T2=(5/3)mg,T1=(5/2)mg. Las ecuaciones</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radiales dan r1=g/(6ω²),r2=4g/(3ω²).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si l es cuerda superior: r1=(3/5)l y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ω=√[g/(3,6l)]≈5,14 rad/s.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si l es cuerda inferior: r2−r1=(4/5)l</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y ω=√[7g/(4,8l)]≈11,79 rad/s. Ninguna</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lectura coincide con las opciones.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>