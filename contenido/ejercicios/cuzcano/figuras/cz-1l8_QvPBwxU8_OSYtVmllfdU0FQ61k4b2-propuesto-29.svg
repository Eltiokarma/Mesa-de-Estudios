<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Propiedades de un ácido dienoico ramificado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,221.65 137.71,258.46 174.51,221.65 211.32,258.46 248.12,221.65 284.93,258.46 321.73,221.65 358.53,254.78" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="137.71,258.46 137.71,295.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="284.93,258.46 284.93,295.26 262.84,317.35" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="284.93,295.26 307.01,317.35" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="216.84,262.88 249.96,229.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="290.45,262.88 323.57,229.75" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="375.09677419354847" y="258.82669408962977" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">COOH</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuenta doce carbonos. Dos enlaces C=C</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y el carbonilo suman tres grados de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">insaturación. Con C=12, se obtiene</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H=2·12+2−2·3=20.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cadena está en representación</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">topológica. Los dobles enlaces con</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituyentes distintos en cada</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">carbono permiten isomería geométrica.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El grupo COOH puede formar puentes de</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hidrógeno entre moléculas del ácido.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La descripción que atribuye la</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interacción característica solo a</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">London es incorrecta.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>