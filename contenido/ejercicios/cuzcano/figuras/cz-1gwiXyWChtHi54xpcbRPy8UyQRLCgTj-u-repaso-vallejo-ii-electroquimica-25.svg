<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">025 · Voltaje no estándar de una celda níquel–oro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,249.39 100.90,340.79 192.30,340.79 192.30,249.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="283.70,249.39 283.70,340.79 375.10,340.79 375.10,249.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,285.95 192.30,285.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="283.70,285.95 375.10,285.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="123.75,313.37 123.75,212.83 352.25,212.83 352.25,313.37" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="169.45,311.09 169.45,251.22 306.55,251.22 306.55,311.09" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="123.75268817204301" y="228.82795698924727" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Ni (−)</text><text x="352.247311827957" y="228.82795698924727" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Au (+)</text><text x="237.99999999999997" y="198.2096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">e⁻ →</text><text x="237.99999999999997" y="241.6236559139785" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">puente salino</text><text x="139.747311827957" y="329.36559139784947" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Ni²⁺</text><text x="345.39247311827955" y="329.36559139784947" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Au³⁺</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Au³⁺ se reduce y Ni se oxida. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reacción balanceada es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2Au³⁺+3Ni→2Au+3Ni²⁺ y transfiere seis</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">electrones.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E°=1,75 V y Q≈[Ni²⁺]³/[Au³⁺]²=10³</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">usando las concentraciones del</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enunciado.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Nernst da</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E≈1,75−(0,0592/6)log₁₀(1000)=1,7204 V.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>