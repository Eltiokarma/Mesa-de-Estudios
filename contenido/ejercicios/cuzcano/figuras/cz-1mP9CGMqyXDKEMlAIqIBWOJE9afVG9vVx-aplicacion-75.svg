<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">075 · Potencia de un foco unido a una espira</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="142.74,391.93 326.06,391.93" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="315.58,396.52 326.06,391.93 315.58,387.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="142.74,391.93 142.74,152.96" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="147.32,163.43 142.74,152.96 138.15,163.43" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="142.74,344.79 166.96,175.22" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="142.74,344.79 166.96,344.79" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="341.773486863984" y="393.897239773861" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t (s)</text><text x="158.45123877618886" y="144.4480379115397" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="169.58151812437643" y="221.0505487196541" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8°</text><text x="134.22651313601597" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B (T)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como el área es constante y el campo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es perpendicular, la variación de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">flujo por unidad de tiempo es A·dB/dt.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con la pendiente indicada, el módulo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la fem es 2×7=14 V.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toda la resistencia está en el foco.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula P=ε²/R=14²/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>