<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">123 · Aplicación radical hacia un intervalo abierto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 105.47,350.14 110.04,330.93 114.61,316.18 119.18,303.76 123.75,292.81 128.32,282.91 132.89,273.81 137.46,265.33 142.03,257.38 146.60,249.85 151.17,242.69 155.74,235.85 160.31,229.29 164.88,222.98 169.45,216.89 174.02,211.00 178.59,205.29 183.16,199.74 187.73,194.35 192.30,189.10 196.87,183.98 201.44,178.98 206.01,174.09 210.58,169.30 215.15,164.62 219.72,160.02 224.29,155.52 228.86,151.10 233.43,146.75 238.00,142.48 242.57,146.75 247.14,151.10 251.71,155.52 256.28,160.02 260.85,164.62 265.42,169.30 269.99,174.09 274.56,178.98 279.13,183.98 283.70,189.10 288.27,194.35 292.84,199.74 297.41,205.29 301.98,211.00 306.55,216.89 311.12,222.98 315.69,229.29 320.26,235.85 324.83,242.69 329.40,249.85 333.97,257.38 338.54,265.33 343.11,273.81 347.68,282.91 352.25,292.81 356.82,303.76 361.39,316.18 365.96,330.93 370.53,350.14 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F</text><circle cx="238.0" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="245.0" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,√2)</text><circle cx="100.90322580645162" cy="396.51612903225805" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="107.90322580645162" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="375.0967741935484" cy="396.51612903225805" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="382.0967741935484" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En −2&lt;x&lt;2 se cumple 0≤∣x∣&lt;2. Por tanto</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0&lt;2−∣x∣≤2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al sacar la raíz, 0&lt;F(x)≤√2&lt;2, así que</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la imagen pertenece al conjunto de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">llegada.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toda entrada de (−2,2) tiene</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exactamente una imagen por la raíz</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">principal.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>