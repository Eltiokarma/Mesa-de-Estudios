<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">195 · Bisectriz y ceviana de igual longitud que la base</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.57,363.78 205.19,175.22 366.12,363.78 110.57,363.78" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.57,363.78 238.35,314.05 205.19,175.22" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645163" y="374.1355732509954" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="205.1934671325262" y="164.17376289916308" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="374.8262371008369" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="248.01462582270253" y="314.0478183147802" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="203.8121394328431" y="204.9229300398148" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4x</text><text x="220.3880718290404" y="205.6135938896563" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5x</text><text x="335.72893475257985" y="354.7969854554319" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">13x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se tiene ∠B = 9x y ∠BAP = 90° − 11x.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABC, la ley de senos da AB/AC = sen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">13x/sen 9x.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABP, AB/BP = cos 7x/cos 11x. Como</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BP = AC, queda sen 13x cos 11x = sen</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">9x cos 7x.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con producto a suma queda sen 24x =</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 16x, o 2 cos 20x sen 4x = 0. Como</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0° &lt; x &lt; 180°/22, se obtiene 20x =</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">90°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>