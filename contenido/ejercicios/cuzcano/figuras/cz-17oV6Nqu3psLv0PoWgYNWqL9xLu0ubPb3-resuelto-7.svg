<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Lugar geométrico de puntos equidistantes de dos coordenadas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,329.32 375.10,329.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="250.46,379.18 250.46,154.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="125.83,279.47 325.24,229.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="201.86,159.82 257.94,384.16" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="118.35190615835779" y="291.9340175953079" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="337.7067448680352" y="227.12463343108502" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="233.01466275659826" y="242.0806451612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lugar geométrico es la mediatriz</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del segmento AB. Su punto medio es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M=(−1,3).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de AB es (4−2)/(3+5)=1/4.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La mediatriz tiene pendiente −4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe y−3=−4(x+1) y reduce.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>