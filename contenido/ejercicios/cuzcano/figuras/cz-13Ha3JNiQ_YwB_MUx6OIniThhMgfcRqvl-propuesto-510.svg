<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">510 · Reconocimiento del anillo aromático</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="215.02,213.81 199.17,241.26 167.47,241.26 151.62,213.81 167.47,186.35 199.17,186.35 215.02,213.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="215.02,213.81 234.04,213.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="340.23,213.81 292.68,241.26 292.68,186.35 340.23,213.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="340.23,213.81 357.66,213.81" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="249.89,312.07 234.04,339.52 202.34,339.52 186.49,312.07 202.34,284.62 234.04,284.62 249.89,312.07" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="243.23,312.07 230.71,333.76" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="205.67,333.76 193.15,312.07" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="205.67,290.38 230.71,290.38" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="356.08,312.07 334.17,342.22 298.73,330.70 298.73,293.44 334.17,281.92 356.08,312.07" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="349.42,312.07 332.12,335.89" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="304.12,326.79 304.12,297.35" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="220.1455639234901" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A · C₅H₁₂</text><text x="183.31978370315122" y="253.42917384331108" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="248.93604325936974" y="213.80582870066704" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="308.5295543539064" y="253.42917384331108" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="213.80582870066704" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C₁₄H₂₇</text><text x="218.18832742867798" y="352.64603008049176" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D · Benceno</text><text x="324.37889241096406" y="352.64603008049176" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los tres primeros candidatos carecen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del anillo conjugado continuo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">necesario para aromaticidad.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ciclopenta-1,3-dieno neutro tiene</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un carbono sp³ que interrumpe la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conjugación. Sus dos dobles enlaces no</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recorren todo el anillo.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El benceno tiene seis carbonos sp² y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">seis electrones π en un ciclo</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conjugado. Satisface 4n+2 con n=1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>