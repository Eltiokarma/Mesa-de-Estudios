<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Ángulo entre una altura y una hipotenusa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="111.57,339.68 239.60,265.77 282.28,339.68" fill="#f4c581" fill-opacity="0.45"/><polygon points="282.28,339.68 367.63,339.68 367.63,191.85" fill="#f4c581" fill-opacity="0.45"/><polyline points="111.57,339.68 367.63,191.85 367.63,339.68 111.57,339.68" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="239.60,265.77 282.28,339.68 367.63,191.85" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="352.48572543911365" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="183.31357166142607" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="374.02987322706167" y="352.48572543911365" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="276.9418852767667" y="355.68642833857393" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="229.99824275134932" y="257.2306388854023" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="280.1425881762269" y="310.8765877461301" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las hipotenusas AP y PB son iguales.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABP los ángulos en A y B valen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=∠BAP.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por congruencia, el ángulo PBC es θ.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si fuese el complemento de θ,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coincidiría con todo el ángulo ABC y P</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tendría que ser A.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces ABC mide 2θ y también 90°−θ.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así θ=30°. En P, ∠BPA=90°+θ y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠QPA=90°−θ, por lo que x=2θ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>