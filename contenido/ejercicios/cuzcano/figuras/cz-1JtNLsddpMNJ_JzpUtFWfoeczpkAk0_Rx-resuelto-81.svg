<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">081 · Objeto con imagen de un quinto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,270.93 375.10,270.93" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="325.11,199.52 322.40,203.09 319.82,206.66 317.39,210.23 315.09,213.80 312.93,217.37 310.91,220.94 309.03,224.52 307.29,228.09 305.69,231.66 304.23,235.23 302.90,238.80 301.72,242.37 300.68,245.94 299.77,249.51 299.01,253.08 298.38,256.65 297.89,260.22 297.54,263.79 297.34,267.36 297.27,270.93 297.34,274.50 297.54,278.07 297.89,281.64 298.38,285.21 299.01,288.78 299.77,292.35 300.68,295.92 301.72,299.49 302.90,303.06 304.23,306.63 305.69,310.20 307.29,313.77 309.03,317.34 310.91,320.91 312.93,324.48 315.09,328.05 317.39,331.62 319.82,335.19 322.40,338.76 325.11,342.33" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="140.18,270.93 140.18,209.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="328.68,270.93 328.68,258.65" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="140.18,209.52 297.27,270.93 328.68,258.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="140.18,209.52 297.27,209.52 328.68,258.65" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="140.1757392473118" y="196.6673387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Objeto</text><text x="328.6838037634409" y="245.07963709677418" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen</text><text x="308.6905241935484" y="287.35114247311833" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una imagen virtual reducida de un</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">objeto real corresponde a un espejo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">convexo, con f = −20 cm.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El aumento lateral +1/5 da s′ = −s/5.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye en 1/f = 1/s + 1/s′. Queda</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−1/20 = −4/s, así que s = 80 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>