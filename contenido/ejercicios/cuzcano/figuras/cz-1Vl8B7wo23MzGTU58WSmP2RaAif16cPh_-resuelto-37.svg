<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">037 · Rango de una suma que incluye dos valores aislados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="360.2258064516129" x2="421" y2="360.2258064516129" stroke="#20364b" stroke-width="1.7"/><line x1="222.76702508960574" y1="105" x2="222.76702508960574" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,323.94 192.30,323.94" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">x&lt;−1</text><polyline points="192.30,287.65 194.33,289.98 196.36,292.16 198.39,294.18 200.43,296.03 202.46,297.73 204.49,299.26 206.52,300.63 208.55,301.84 210.58,302.89 212.61,303.77 214.64,304.50 216.67,305.06 218.70,305.47 220.74,305.71 222.77,305.79 224.80,305.71 226.83,305.47 228.86,305.06 230.89,304.50 232.92,303.77 234.95,302.89 236.98,301.84 239.02,300.63 241.05,299.26 243.08,297.73 245.11,296.03 247.14,294.18 249.17,292.16 251.20,289.98 253.23,287.65 255.26,285.15 257.30,282.48 259.33,279.66 261.36,276.68 263.39,273.53 265.42,270.23 267.45,266.76 269.48,263.13 271.51,259.34 273.54,255.39 275.57,251.27 277.61,247.00 279.64,242.56 281.67,237.97 283.70,233.21 285.73,228.29 287.76,223.21 289.79,217.97 291.82,212.56 293.85,207.00 295.89,201.27 297.92,195.39 299.95,189.34 301.98,183.13 304.01,176.76 306.04,170.23 308.07,163.53 310.10,156.68 312.13,149.66 314.16,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">−1≤x≤3</text><polyline points="314.16,396.52 375.10,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">x&gt;3</text><circle cx="192.30107526881721" cy="287.64516129032256" r="3.7" fill="#20364b"/><text x="199.30107526881721" y="279.64516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−1,4)</text><circle cx="314.1648745519713" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="321.1648745519713" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(3,12)</text><circle cx="192.30107526881721" cy="323.93548387096774" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="199.30107526881721" y="315.93548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="314.1648745519713" cy="396.51612903225805" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="321.1648745519713" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para x&lt;−1, F(x)=2−2x. Al sumar G,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda 2. Para x&gt;3, F(x)=2x−2 y la suma</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda −2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En −1≤x≤3, F(x)=4, de modo que la suma</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale x²+3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mínimo del tramo central es 3 en</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=0 y su máximo es 12 en x=3. Une ese</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intervalo con las dos imágenes</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aisladas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>