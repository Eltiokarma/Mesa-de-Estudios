<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">009 · Superficie del tetraedro a partir de una sección cuadrada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="138.60,316.11 200.30,269.50 337.40,269.50 275.70,316.11" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,389.75 176.31,242.48 375.10,389.75 299.69,149.25 100.90,389.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,389.75 375.10,389.75" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="176.31,242.48 299.69,149.25" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="138.60,316.11 200.30,269.50 337.40,269.50 275.70,316.11 138.60,316.11" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="389.7485103239622" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="176.30645161290323" y="242.47729612765076" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="389.7485103239622" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="299.6935483870968" y="149.25148967603786" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="138.60483870967744" y="316.11290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="200.29838709677418" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="337.39516129032256" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="275.70161290322585" y="316.11290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los segmentos medios en las cuatro</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">caras muestran que PE y UR son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelos a BD, y ER y UP son</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelos a AC. Todos miden la mitad</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de una arista.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En un tetraedro regular las aristas</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuestas AC y BD son ortogonales. Por</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ello PERU es un cuadrado de lado 2 m y</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el tetraedro tiene arista 4 m.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada cara equilátera tiene área</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4²√3/4. Multiplica por cuatro caras.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>