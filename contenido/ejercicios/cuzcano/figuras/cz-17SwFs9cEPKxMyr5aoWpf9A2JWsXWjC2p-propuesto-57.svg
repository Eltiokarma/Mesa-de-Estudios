<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Torre inclinada hipotética</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="130.96,396.52 345.04,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="345.04,396.52 323.63,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="130.96,396.52 323.63,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><text x="137.9639362087713" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="352.0360637912287" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="330.628851032983" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Modelo:T=(−150+tcos53,tsin53) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia base→T179.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ecuación t²−300tcos53+150²−179²=0. La</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">raíz positiva</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es150cos53+√[179²−150²sin²53].</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sinx=tsin53/179. El libro además</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproxima sin53=.8,cos53=.6 y t≈223;así</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene.996648,no un valor exacto.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>