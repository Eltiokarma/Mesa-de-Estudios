>I</text><text x="244.22940631559197" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="275.37643789355195" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="368.81753262743166" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="213.08237473763205" y="259.2962324550603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">IL</text><text x="238.0" y="233.132725929574" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">DO</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon D=0, I=a, L=a+b y O=a+b+c.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro de DL está en (a+b)/2. El de</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">IO está en (2a+b+c)/2.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su separación es (a+c)/2=(DO−IL)/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>