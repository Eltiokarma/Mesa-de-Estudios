text x="314.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="352.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">-1</text><rect x="48.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="86.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="124.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="162.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="200.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1</text><rect x="276.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="314.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="352.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2</text><rect x="48.0" y="274" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="86.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="124.0" y="274" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="162.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="200.0" y="274" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="276.0" y="274" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="314.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1</text><rect x="352.0" y="274" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">-2</text><text x="48" y="349" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Forma reducida de la matriz ampliada</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Construye la matriz ampliada colocando</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B como última columna.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica en orden F2←F2−(1)F1,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F3←F3−(1)F1, F4←F4−(1)F1, intercambia</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F2 y F4, F2←F2/(-2), F1←F1−(1)F2,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F3←F3/(-2), F1←F1−(1)F3, F4←F4/(-2),</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F1←F1−(1)F4. La forma reducida es [[1,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada columna de coeficientes tiene</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pivote y la solución es única. (1, -1,</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2, -2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>