<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">112 · Focal a partir de la inclinación de un rayo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="130.75,329.06 345.25,329.06" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="242.72,261.61 279.15,261.61 267.01,298.71 264.98,329.06 267.01,359.42 279.15,396.52 242.72,396.52 254.86,359.42 256.89,329.06 254.86,298.71 242.72,261.61" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="144.24,329.06 260.93,261.61 329.74,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="260.93,261.61 324.34,224.98" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="222.01,329.06 260.93,261.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="142.88967502098572" y="339.18011752008636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="273.07614821921095" y="339.18011752008636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="173.91857536874923" y="318.9438781628493" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="301.40688331934285" y="218.43722268857178" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="218.4383019546708" y="280.4950233840988" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10√3 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La inclinación incidente da s =</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">10√3/tan 30° = 30 cm.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La salida se inclina 60°. Su</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">prolongación corta el eje a 10√3/tan</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60° = 10 cm delante de la lente, luego</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">s′ = −10 cm.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma 1/s + 1/s′ = 1/30 − 1/10 = −1/15</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cm⁻¹ e invierte.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>