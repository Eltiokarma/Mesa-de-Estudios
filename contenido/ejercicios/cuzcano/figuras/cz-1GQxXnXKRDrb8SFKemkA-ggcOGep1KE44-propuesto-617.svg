<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">617 · Triángulos y área eliminada en el tamiz de Sierpinski</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,388.23 169.45,388.23 135.18,328.86" fill="#f4c581" fill-opacity="0.45"/><polygon points="238.00,388.23 203.73,328.86 169.45,388.23" fill="#f4c581" fill-opacity="0.45"/><polygon points="169.45,269.50 135.18,328.86 203.73,328.86" fill="#f4c581" fill-opacity="0.45"/><polygon points="375.10,388.23 340.82,328.86 306.55,388.23" fill="#f4c581" fill-opacity="0.45"/><polygon points="306.55,269.50 272.27,328.86 340.82,328.86" fill="#f4c581" fill-opacity="0.45"/><polygon points="238.00,388.23 306.55,388.23 272.27,328.86" fill="#f4c581" fill-opacity="0.45"/><polygon points="238.00,150.77 203.73,210.14 272.27,210.14" fill="#f4c581" fill-opacity="0.45"/><polygon points="169.45,269.50 238.00,269.50 203.73,210.14" fill="#f4c581" fill-opacity="0.45"/><polygon points="306.55,269.50 272.27,210.14 238.00,269.50" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,388.23 375.10,388.23 238.00,150.77 100.90,388.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,388.23 169.45,388.23 135.18,328.86 100.90,388.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,388.23 203.73,328.86 169.45,388.23 238.00,388.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="169.45,269.50 135.18,328.86 203.73,328.86 169.45,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,388.23 340.82,328.86 306.55,388.23 375.10,388.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="306.55,269.50 272.27,328.86 340.82,328.86 306.55,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,388.23 306.55,388.23 272.27,328.86 238.00,388.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,150.77 203.73,210.14 272.27,210.14 238.00,150.77" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="169.45,269.50 238.00,269.50 203.73,210.14 169.45,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="306.55,269.50 272.27,210.14 238.00,269.50 306.55,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="238.0" cy="150.77071077148827" r="3.7" fill="#20364b"/><text x="245.0" y="142.77071077148827" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Paso 2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el primer paso se retira un</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo. Cada triángulo restante</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">genera tres para el paso siguiente,</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que las cantidades eliminadas son</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1,3,9,…</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el paso k, cada triángulo retirado</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene lados 1/2^k de los iniciales. Su</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área es 1/4^k.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica el número de triángulos por</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el área de cada uno. El dibujo muestra</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los dos primeros pasos superpuestos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>