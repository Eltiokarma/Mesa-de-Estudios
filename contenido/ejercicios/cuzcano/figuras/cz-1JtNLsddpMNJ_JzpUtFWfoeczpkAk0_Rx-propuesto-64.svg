<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">064 · Tamaño real de una hormiga</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="265.42,208.57 257.50,240.25 255.06,269.50 257.50,298.75 265.42,330.43 273.34,298.75 275.78,269.50 273.34,240.25 265.42,208.57" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="221.55,269.50 221.55,255.49 216.67,261.58 221.55,255.49 226.42,261.58" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="134.42,269.50 134.42,227.46 129.54,233.55 134.42,227.46 139.29,233.55" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="220.93906810035844" y="242.6899641577061" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hormiga</text><text x="134.41577060931903" y="218.31720430107526" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen h</text><text x="340.9749103942652" y="257.31362007168457" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Observador</text><text x="242.87455197132616" y="281.0770609318996" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="189.25448028673839" y="295.0913978494624" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El módulo del aumento lateral es la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">relación b/a de las distancias a la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lente.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si H es la altura real, h/H = b/a.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja H = ha/b.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>