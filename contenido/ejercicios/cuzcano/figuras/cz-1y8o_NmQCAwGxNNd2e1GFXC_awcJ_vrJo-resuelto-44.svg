<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Ángulos correspondientes en dos cuadrados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="106.72,296.87 106.72,180.12 224.92,180.12 224.92,296.87 106.72,296.87" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="234.12,369.05 164.85,238.25 300.49,170.43 368.31,302.68 234.12,369.05" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="106.72,296.87 234.12,369.05" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="224.92,296.87 300.49,170.43" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645159" y="303.6530833238345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="101.38766670466201" y="171.88515901060066" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="231.21782742505414" y="170.91627721417984" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="230.24894562863332" y="303.16864242562406" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="159.0361335917018" y="230.98694859227172" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="233.64003191610624" y="377.2880998518181" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="300.492875869144" y="161.71190014818188" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.0967741935484" y="305.10640601846575" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="216.6846004787416" y="354.51937763592844" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="300.492875869144" y="188.84059044796533" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El giro de un cuarto de vuelta</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alrededor de E lleva D a O, pues son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértices consecutivos del primer</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrado.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mismo giro lleva P a R, vértices</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">consecutivos del segundo cuadrado</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alrededor de E. Así ∠DPE=∠ORE=θ.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠ERU=90° y RO queda en su</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interior, x=90°−θ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>