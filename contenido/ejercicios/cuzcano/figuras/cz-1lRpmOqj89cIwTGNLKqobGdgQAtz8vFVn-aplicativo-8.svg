<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Una parte al 20 % y la otra al 40 %</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,202.41 109.65,202.41 109.65,289.92" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,202.41 366.35,202.41 366.35,289.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,275.33 109.65,289.92 118.40,275.33" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="357.60,275.33 366.35,289.92 375.10,275.33" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="238.0" y="184.9083733699382" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="109.65408373369937" y="304.50343170899106" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2C/7</text><text x="366.34591626630066" y="304.50343170899106" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5C/7</text><text x="109.65408373369937" y="327.8390528483185" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 % anual</text><text x="366.34591626630066" y="327.8390528483185" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 % anual</text><text x="238.0" y="354.0916266300618" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">9 meses</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El esquema divide el capital en 2C/7 y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5C/7.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En tres cuartos de año esas partes</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">generan (2C/7)×0,20×3/4 y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(5C/7)×0,40×3/4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma ambos intereses al capital. El</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">monto es (44/35)C. Despeja.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>