<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">110 · Cruce de dos rayos paralelos oblicuos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,281.52 375.10,281.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="228.61,206.40 241.38,243.96 245.14,281.52 241.38,319.08 228.61,356.64 215.84,319.08 212.08,281.52 215.84,243.96 228.61,206.40" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="337.54,182.36 337.54,341.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="138.46,349.43 228.61,281.52 337.54,199.41" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="138.46,307.81 228.61,239.90 337.54,199.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="281.194874060981" y="295.7925320371189" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8 cm</text><text x="351.0578877596111" y="194.37847989394612" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cruce</text><text x="179.78082191780823" y="308.56319045514806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los rayos paralelos se cruzan en el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">plano focal, a 8 cm axialmente de la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lente.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rayo que pasa por el centro</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva la dirección de 37°. El</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segmento entre centro y cruce tiene</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección axial de 8 cm.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La longitud pedida es 8/cos 37° ≈ 10</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>