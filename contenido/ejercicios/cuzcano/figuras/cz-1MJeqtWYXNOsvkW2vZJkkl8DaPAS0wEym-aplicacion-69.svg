<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">069 · Una viga inclinada suspendida fuera del centro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="182.74,333.89 293.26,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="256.42,206.29 256.42,169.45" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="182.74,333.89 182.74,375.89" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="293.26,142.48 293.26,184.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="170.96,375.89 194.53,375.89 194.53,396.52 170.96,396.52 170.96,375.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="281.47,184.48 305.04,184.48 305.04,205.11 281.47,205.11 281.47,184.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="182.74478466541512" y="386.5701902720328" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="293.25521533458493" y="195.16050958671286" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100 N</text><text x="212.95096904832153" y="256.53625018464305" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 m</text><text x="278.88885934759276" y="164.07585652477098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro de gravedad de la viga queda</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a 1 m del punto de suspensión hacia la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda. Los extremos quedan a 4 m a</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la izquierda y 2 m a la derecha.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como las fuerzas son verticales, los</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tres brazos son las proyecciones</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontales de esas distancias. El</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">factor común de proyección se cancela.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por equilibrio, 4P+70×1=100×2. Despeja</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>