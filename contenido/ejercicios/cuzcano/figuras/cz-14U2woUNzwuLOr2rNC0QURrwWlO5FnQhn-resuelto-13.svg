<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">013 · Canje de octubre con vencimientos distintos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,263.05 375.10,263.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,253.37 100.90,272.73" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="171.87,253.37 171.87,272.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,253.37 375.10,272.73" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.9032258064516" y="285.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 oct.</text><text x="171.8709677419355" y="285.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16 nov.</text><text x="375.0967741935484" y="285.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 feb.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuenta 27 días hasta el 16 de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">noviembre y 104 hasta el 1 de febrero,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">usando días calendario y año de 360</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">días.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La primera vale 25 000(1 − 0,12 ×</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">27/360) = S/ 24 775.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La segunda vale 15 000(1 − 0,12 ×</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">104/360) = S/ 14 480. Resta los</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valores actuales.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>