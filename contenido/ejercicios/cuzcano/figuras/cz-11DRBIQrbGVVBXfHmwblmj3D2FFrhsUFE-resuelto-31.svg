<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Ángulo inferior en un cuadrilátero con bisectriz</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.69,280.49 185.27,209.30 365.43,276.97 209.00,325.31 109.69,280.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.69,280.49 365.43,276.97" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="185.27,209.30 209.00,325.31" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645164" y="285.75827129859385" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="184.3916459884202" y="202.26985111662532" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="279.6064929693962" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="209.8775847808106" y="336.7301488833747" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="175.60339123242352" y="240.93817204301075" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50°</text><text x="204.60463192721258" y="240.93817204301075" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50°</text><text x="156.2692307692308" y="294.5465260545906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="311.8213399503722" y="272.57588916459883" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10°</text><text x="314.4578163771712" y="287.5159222497932" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja A en BD hasta E. Como BD</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">biseca ∠ABC, E está sobre BC. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mediatriz BD da DA=DE.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABC, ∠BAC=70°. Como AE es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a BD, ∠BAE=40°. De ahí</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠EAC=30° y ∠EAD=60°, por lo que AED es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilátero.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC biseca ∠EAD, así que es mediatriz</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de ED. El punto C está a la misma</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia de E y D y ∠ACD=∠ECA=10°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>