<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">047 · Clase modal al final de un histograma</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,380.39 375.10,380.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,380.39 100.90,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,380.39 100.90,360.23 151.68,360.23 151.68,380.39" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="151.68,380.39 151.68,299.74 202.46,299.74 202.46,380.39" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="202.46,380.39 202.46,329.98 253.23,329.98 253.23,380.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="253.23,380.39 253.23,229.18 304.01,229.18 304.01,380.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="304.01,380.39 304.01,178.77 354.79,178.77 354.79,380.39" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="151.67980884109917" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6</text><text x="202.45639187574673" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="253.23297491039426" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10</text><text x="304.0095579450418" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">12</text><text x="354.7861409796894" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">14</text><text x="126.2915173237754" y="348.1290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="177.06810035842295" y="287.64516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="227.84468339307048" y="317.88709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="278.62126642771807" y="217.08064516129033" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15</text><text x="329.39784946236557" y="166.67741935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mayor recuento es 20, en la clase</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[12,14).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usando frecuencia cero para la clase</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">siguiente fuera del histograma, las</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencias respecto de las vecinas</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son 20−15=5 y 20−0=20.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica la fórmula modal desde 12, con</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">avance 2×5/(5+20).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>