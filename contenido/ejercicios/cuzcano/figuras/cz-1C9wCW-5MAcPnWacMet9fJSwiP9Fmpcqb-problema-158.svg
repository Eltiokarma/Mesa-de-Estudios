<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">158 · Potencial y caminos distintos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.5161290322581" x2="421" y2="396.5161290322581" stroke="#20364b" stroke-width="1.7"/><line x1="110.98387096774192" y1="105" x2="110.98387096774192" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="195.66,311.84 195.66,201.76 305.74,184.82 365.02,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">camino I</text><polyline points="195.66,311.84 322.68,286.44 365.02,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">camino II</text><circle cx="195.66129032258064" cy="311.8387096774194" r="3.7" fill="#20364b"/><text x="202.66129032258064" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="365.01612903225805" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="372.01612903225805" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La gravedad uniforme es conservativa:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ΔU sólo depende de extremos. I falsa.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ΔU=mg(y2−y1) para ambos caminos: II</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verdadera.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con U=0 en y=0, UB=mgy2. La expresión</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de III sería válida si se eligiera</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">U(A)=0, no como valor absoluto en la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">referencia dibujada.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>