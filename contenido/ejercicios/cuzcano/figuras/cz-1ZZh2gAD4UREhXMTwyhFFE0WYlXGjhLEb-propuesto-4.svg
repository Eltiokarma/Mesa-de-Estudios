<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Atwood compuesto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.4838709677419" x2="421" y2="142.4838709677419" stroke="#20364b" stroke-width="1.7"/><line x1="132.1532258064516" y1="105" x2="132.1532258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="132.15,396.52 132.15,142.48 301.51,142.48 301.51,227.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">cuerda superior</text><polyline points="259.17,396.52 259.17,227.16 343.85,227.16 343.85,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">cuerda inferior</text><circle cx="132.1532258064516" cy="396.5161290322581" r="3.7" fill="#20364b"/><text x="139.1532258064516" y="388.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m</text><circle cx="259.1693548387097" cy="396.5161290322581" r="3.7" fill="#20364b"/><text x="266.1693548387097" y="388.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m</text><circle cx="343.84677419354836" cy="396.5161290322581" r="3.7" fill="#20364b"/><text x="350.84677419354836" y="388.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si t es tensión inferior en unidades</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mg, la superior vale 2t; aceleraciones</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">descendentes son a 1/g=1−2t, a</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2/g=1−t, a 3/g=1−t/2.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las restricciones dan ap=−a 1 y a 2+a</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3=2ap: 2−3t/2=−2+4t.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t=8/11; para 2m, a 3/g=1−4/11=7/11,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia abajo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>