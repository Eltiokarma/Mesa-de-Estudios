<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">020 · Ángulo entre dos rectas notables desde un vértice</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,339.29 151.71,199.71 375.10,339.29 100.90,339.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,339.29 151.71,257.99 151.71,199.71 238.00,310.15 375.10,339.29 151.71,257.99" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,339.29 238.00,310.15" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645164" y="339.29404456705674" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="151.7091353093665" y="199.7059554329432" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.09677419354836" y="339.29404456705674" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="151.7091353093665" y="257.98759331020733" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="238.0" y="310.1532256284248" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="166.78978047065684" y="239.46401994907222" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ψ</text><text x="136.5483870967742" y="317.35856069608906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="314.7741935483871" y="321.7456574702826" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama θ al complemento de ∠RDO. Por</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicularidad, ∠DRH=∠DOH=θ. Por el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo central y CR=CO, ∠CRO=∠COR=θ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como CD=CO, ∠CDO=∠DOC=θ+β. Así</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠HDO=α+β+θ.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DH⊥RO y RH⊥DO, de modo que ∠HRO=∠HDO.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠HRO=ψ+θ, resta θ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>