<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">013 · Coseno del séxtuplo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,372.32 375.10,372.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,372.32 375.10,166.68" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,166.68 100.90,372.32" fill="none" stroke="#008674" stroke-width="2.5"/><text x="107.90322580645164" y="364.3225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="382.09677419354836" y="364.3225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="382.09677419354836" y="158.67741935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="190.16129032258067" y="339.64516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">ángulo agudo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En esa rama,cos3x4/5 y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sin3x3/5;tan(3x/2)=1/3.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Poner u=tan(x/2). La fórmula triple da</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F=3u³−3u²−9u+1=0.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E−4=(3−u)F/[2u(1+u²)]=0. Otras ramas</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de cos6x requieren análisis separado.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>