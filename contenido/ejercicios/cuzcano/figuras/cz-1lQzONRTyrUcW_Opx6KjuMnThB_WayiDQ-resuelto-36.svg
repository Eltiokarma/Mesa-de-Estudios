<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Ángulo con la vertical desde el punto medio de una oblicua</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="143.45,182.18 290.00,356.82 375.10,292.53" fill="#f4c581" fill-opacity="0.45"/><polygon points="122.18,269.50 122.18,340.75 375.10,292.53" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,356.82 186.00,292.53 375.10,292.53 290.00,356.82 100.90,356.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,356.82 143.45,182.18 186.00,292.53" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="290.00,356.82 143.45,182.18 375.10,292.53" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="143.45,182.18 332.55,324.67" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="122.18,269.50 375.10,292.53" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="143.45,182.18 143.45,324.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="143.45,324.67 332.55,324.67" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="122.18,269.50 122.18,340.75" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="122.18,340.75 375.10,292.53" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><text x="100.9032258064516" y="356.82157314653784" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="185.99777530589543" y="292.5279135247358" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="292.5279135247358" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="290.0022246941046" y="356.82157314653784" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="143.4505005561735" y="182.17842685346213" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="143.4505005561735" y="324.6747433356368" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="122.17686318131256" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="122.17686318131256" y="340.7481582410873" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="332.5494994438265" y="324.6747433356368" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="306.54838709677426" y="314.27429839681594" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea s el lado. La proyección R de E es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el punto medio de AB por la simetría</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ED=EC. La altura ER=s tan 37° sale del</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corte perpendicular a CD.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El pie I de M queda a s/4 de A sobre</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB. Por ello IC=√(s²+(3s/4)²)=5s/4 y</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MI=ER/2.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente del ángulo con la vertical</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es IC/MI=5/(2 tan 37°).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>