<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">349 · Parábola restringida por una inecuación exponencial</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="352.4133064516129" x2="421" y2="352.4133064516129" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,352.41 105.47,357.27 110.04,361.84 114.61,366.13 119.18,370.14 123.75,373.86 128.32,377.30 132.89,380.46 137.46,383.34 142.03,385.93 146.60,388.23 151.17,390.26 155.74,392.00 160.31,393.46 164.88,394.63 169.45,395.52 174.02,396.13 178.59,396.46 183.16,396.50 187.73,396.26 192.30,395.73 196.87,394.92 201.44,393.83 206.01,392.46 210.58,390.80 215.15,388.86 219.72,386.64 224.29,384.13 228.86,381.34 233.43,378.26 238.00,374.91 242.57,371.27 247.14,367.34 251.71,363.13 256.28,358.64 260.85,353.87 265.42,348.81 269.99,343.47 274.56,337.85 279.13,331.95 283.70,325.76 288.27,319.28 292.84,312.53 297.41,305.49 301.98,298.16 306.55,290.56 311.12,282.67 315.69,274.50 320.26,266.04 324.83,257.30 329.40,248.28 333.97,238.98 338.54,229.39 343.11,219.52 347.68,209.36 352.25,198.92 356.82,188.20 361.39,177.20 365.96,165.91 370.53,154.34 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">x²−2x, x&gt;0</text><circle cx="100.90322580645162" cy="352.4133064516129" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="107.90322580645162" y="344.4133064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,0)</text><circle cx="181.54838709677418" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="188.54838709677418" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,−1)</text><circle cx="262.19354838709677" cy="352.4133064516129" r="3.7" fill="#20364b"/><text x="269.19354838709677" y="344.4133064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2,0)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por monotonía de eˣ, compara x³&gt;−x.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esto es x(x²+1)&gt;0, equivalente a x&gt;0.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En esa semirrecta ∣x∣=x y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f(x)=x²−2x=(x−1)²−1.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Traza el vértice (1,−1) y la</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intersección (2,0). El origen queda</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abierto porque 0 no está en el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dominio.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>