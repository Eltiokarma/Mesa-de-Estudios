<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">207 · Cota óptima de funciones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="135.17741935483872" y1="105" x2="135.17741935483872" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)+g(x)</text><polyline points="100.90,325.54 105.47,322.86 110.04,319.97 114.61,316.85 119.18,313.48 123.75,309.82 128.32,305.83 132.89,301.47 137.46,296.69 142.03,291.42 146.60,285.59 151.17,279.12 155.74,271.88 160.31,263.75 164.88,254.56 169.45,244.10 174.02,241.18 178.59,237.78 183.16,233.82 187.73,229.19 192.30,223.77 196.87,217.44 201.44,210.08 206.01,201.62 210.58,192.05 215.15,181.57 219.72,170.61 224.29,160.00 228.86,150.92 233.43,144.70 238.00,142.48 242.57,144.70 247.14,150.92 251.71,160.00 256.28,170.61 260.85,181.57 265.42,192.05 269.99,201.62 274.56,210.08 279.13,217.44 283.70,223.77 288.27,229.19 292.84,233.82 297.41,237.78 301.98,241.18 306.55,244.10 311.12,254.56 315.69,263.75 320.26,271.88 324.83,279.12 329.40,285.59 333.97,291.42 338.54,296.69 343.11,301.47 347.68,305.83 352.25,309.82 356.82,313.48 361.39,316.85 365.96,319.97 370.53,322.86 375.10,325.54" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">suma</text><circle cx="238.0" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="245.0" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">máximo (3,2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La desigualdad triangular da</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∣x−1∣+∣x−5∣≥4. Por tanto, 0&lt;f(x)≤1.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completar el cuadrado:</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x²−6x+10=(x−3)²+1≥1, de modo que</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0&lt;g(x)≤1.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma es positiva y no supera 2. En</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=3, f(3)=g(3)=1; la cota se alcanza y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es la menor.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>