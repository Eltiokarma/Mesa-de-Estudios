<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Impacto de un proyectil en una ladera</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="389.4596774193548" x2="421" y2="389.4596774193548" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645164" y1="105" x2="100.90322580645164" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,389.46 105.47,378.23 110.04,367.37 114.61,356.90 119.18,346.81 123.75,337.10 128.32,327.77 132.89,318.82 137.46,310.25 142.03,302.06 146.60,294.25 151.17,286.83 155.74,279.78 160.31,273.12 164.88,266.83 169.45,260.93 174.02,255.41 178.59,250.27 183.16,245.51 187.73,241.13 192.30,237.13 196.87,233.51 201.44,230.28 206.01,227.42 210.58,224.94 215.15,222.85 219.72,221.14 224.29,219.80 228.86,218.85 233.43,218.28 238.00,218.09 242.57,218.28 247.14,218.85 251.71,219.80 256.28,221.14 260.85,222.85 265.42,224.94 269.99,227.42 274.56,230.28 279.13,233.51 283.70,237.13 288.27,241.13 292.84,245.51 297.41,250.27 301.98,255.41 306.55,260.93 311.12,266.83 315.69,273.12 320.26,279.78 324.83,286.83 329.40,294.25 333.97,302.06 338.54,310.25 343.11,318.82 347.68,327.77 352.25,337.10 356.82,346.81 361.39,356.90 365.96,367.37 370.53,378.23 375.10,389.46" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,389.46 375.10,149.54" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="100.90322580645164" cy="389.4596774193548" r="3.7" fill="#20364b"/><text x="107.90322580645164" y="381.4596774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="238.0" cy="218.08870967741942" r="3.7" fill="#20364b"/><text x="245.0" y="210.08870967741942" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">V</text><circle cx="279.1290322580645" cy="233.5120967741936" r="3.7" fill="#20364b"/><text x="286.1290322580645" y="225.5120967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="375.09677419354836" cy="149.54032258064518" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="141.54032258064518" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(8,7)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al pasar por O, la trayectoria es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=5−5(x−4)²/16.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ladera es y=7x/8. Igualar produce</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x(26−5x)=0.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Descarta el punto de salida x=0. Con</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=26/5 resulta y=91/20.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>