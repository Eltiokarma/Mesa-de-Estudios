<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Identificación de un fenol con sustitución para</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,364.64 154.35,316.35 154.35,219.76 238.00,171.46 321.65,219.76 321.65,316.35 238.00,364.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="281.47,268.05 281.23,272.59 280.52,277.09 279.34,281.48 277.71,285.73 275.64,289.78 273.16,293.60 270.30,297.14 267.08,300.35 263.55,303.22 259.73,305.69 255.68,307.76 251.43,309.39 247.04,310.57 242.54,311.28 238.00,311.52 233.46,311.28 228.96,310.57 224.57,309.39 220.32,307.76 216.27,305.69 212.45,303.22 208.92,300.35 205.70,297.14 202.84,293.60 200.36,289.78 198.29,285.73 196.66,281.48 195.48,277.09 194.77,272.59 194.53,268.05 194.77,263.51 195.48,259.01 196.66,254.62 198.29,250.37 200.36,246.32 202.84,242.50 205.70,238.97 208.92,235.75 212.45,232.89 216.27,230.41 220.32,228.34 224.57,226.71 228.96,225.54 233.46,224.82 238.00,224.59 242.54,224.82 247.04,225.54 251.43,226.71 255.68,228.34 259.73,230.41 263.55,232.89 267.08,235.75 270.30,238.97 273.16,242.50 275.64,246.32 277.71,250.37 279.34,254.62 280.52,259.01 281.23,263.51 281.47,268.05" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,171.46 238.00,156.01" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,364.64 238.00,380.10" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="238.00000000000003" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">OH</text><text x="238.00000000000003" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El OH está unido directamente al</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">anillo aromático, por lo que el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">compuesto es un fenol.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El metilo está en el carbono opuesto</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">al que lleva OH, posición 4 o para. Se</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">llama 4-metilfenol.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La estructura aromática favorece la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">solubilidad en disolventes orgánicos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">como tolueno. La afirmación sobre uso</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fenólico se evalúa en el contexto del</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuaderno.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>