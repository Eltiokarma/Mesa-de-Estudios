<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">079 · Razón de senos a partir de lados tangentes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,336.44 192.03,202.56 375.10,336.44 100.90,336.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="130.74193548387098" y="326.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="346.8709677419355" y="326.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="123.48387096774195" y="252.56451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">tan θ</text><text x="301.7096774193549" y="251.75806451612905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">tan 3θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ley de senos, sin α/sin β=tan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3θ/tan θ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las fórmulas triples dan esa razón</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">como (4cos²θ−1)/(4cos²θ−3).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe 4cos²θ=2+2cos 2θ y sustituye</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k/8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>