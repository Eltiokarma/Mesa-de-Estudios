<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Dos tipos de descuento y plazos sucesivos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,267.22 375.10,267.22" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,263.79 100.90,270.64" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="192.30,263.79 192.30,270.64" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="344.63,263.79 344.63,270.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,263.79 375.10,270.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="275.2123655913979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Firma</text><text x="192.3010752688172" y="275.2123655913979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Mes 4</text><text x="344.6308243727598" y="275.2123655913979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Consulta</text><text x="375.09677419354836" y="275.2123655913979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vencimiento</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A 8 meses del vencimiento, el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">descuento racional es N/5. Eso exige</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rt = 1/4, así la tasa mensual es 1/32.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A cuatro meses el descuento comercial</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es N × 4/32 = 120. Entonces N = S/</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">960.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al evaluar faltan 40 días,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivalentes a 4/3 meses. Divide 960</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por 1 + (4/3)/32.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>