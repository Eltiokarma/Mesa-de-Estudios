<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Rapidez terrestre de un avión con viento del este</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="375.10,359.01 155.82,193.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><line x1="155.8168645922608" y1="193.76996723464418" x2="165.56308077289478" y2="196.00855387812004" stroke="#1766b0" stroke-width="2"/><line x1="155.8168645922608" y1="193.76996723464418" x2="160.65515344292407" y2="202.52159342624694" stroke="#1766b0" stroke-width="2"/><polyline points="155.82,193.77 100.90,193.77" fill="none" stroke="#d37618" stroke-width="2.5"/><line x1="100.90322580645163" y1="193.76996723464418" x2="110.03411520957471" y2="189.6923627040485" stroke="#d37618" stroke-width="2"/><line x1="100.90322580645163" y1="193.76996723464418" x2="110.03411520957471" y2="197.84757176523988" stroke="#d37618" stroke-width="2"/><polyline points="375.10,359.01 100.90,193.77" fill="none" stroke="#008674" stroke-width="2.5"/><line x1="100.90322580645163" y1="193.76996723464418" x2="110.828463648472" y2="194.99048097046483" stroke="#008674" stroke-width="2"/><line x1="100.90322580645163" y1="193.76996723464418" x2="106.61910594742484" y2="201.97537485486805" stroke="#008674" stroke-width="2"/><polyline points="375.10,359.01 375.10,199.76" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="375.0967741935484" y="359.00923122086897" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="155.8168645922608" y="193.76996723464418" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645163" y="193.76996723464418" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="290.52977046340226" y="281.0318641450199" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">250 km/h</text><text x="129.0836724331233" y="179.99076877913106" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50 km/h</text><text x="375.0967741935484" y="186.58040543342815" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector del avión tiene componentes</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">oeste 250sen53° y norte 250cos53°. El</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">viento añade 50 km/h al oeste.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Eleva al cuadrado y suma las</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes. La norma es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(250²+50²+2·250·50sen53°).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Evalúa para obtener ≈291,49 km/h. La</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximación escolar sen53°≈4/5 da</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">50√34 km/h.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>