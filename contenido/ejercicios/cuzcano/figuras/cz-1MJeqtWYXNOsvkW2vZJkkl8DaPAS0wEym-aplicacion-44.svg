<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Dos reacciones sobre una piedra isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="128.06,183.91 335.00,183.91 231.53,356.38 128.06,183.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,182.62 364.10,182.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,355.28 283.27,270.11 291.67,288.67" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="283.27,270.11 304.61,275.74" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="344.7026780279976" y="329.4151704199635" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="155.87127206329885" y="200.07859099208764" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="307.19506999391353" y="200.07859099208764" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="228.2997565429093" y="244.05302799756544" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 kg</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La reacción superior es vertical hacia</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abajo. La normal izquierda tiene la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dirección reflejada de F respecto de</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la vertical, por simetría de las</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">caras.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El equilibrio horizontal fija en +300</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N la componente horizontal de la</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal izquierda. Por simetría, su</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente vertical es +500 N.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La reacción superior y el peso de 200</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N compensan los 1 000 N ascendentes de</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la fuerza y la normal izquierda.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>