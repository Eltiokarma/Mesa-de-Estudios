<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">052 · Aceleración total desde ley de arco</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="313.3709677419355" x2="421" y2="313.3709677419355" stroke="#20364b" stroke-width="1.7"/><line x1="375.0967741935484" y1="105" x2="375.0967741935484" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="375.10,313.37 100.90,313.37" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">normal (m/s²)</text><line x1="100.90322580645162" y1="313.3709677419355" x2="110.0341152095747" y2="309.2933632113398" stroke="#1766b0" stroke-width="2"/><line x1="100.90322580645162" y1="313.3709677419355" x2="110.0341152095747" y2="317.4485722725312" stroke="#1766b0" stroke-width="2"/><polyline points="375.10,313.37 375.10,225.63" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">tangencial (m/s²)</text><line x1="375.0967741935484" y1="225.6290322580645" x2="379.1743787241441" y2="234.7599216611876" stroke="#d37618" stroke-width="2"/><line x1="375.0967741935484" y1="225.6290322580645" x2="371.0191696629527" y2="234.7599216611876" stroke="#d37618" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Radio R4 m; v=ds/dt=2+8t, por tanto</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">v(1)=10 m/s.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a T=dv/dt=8 m/s²; a N=v²/R=100/4=25</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m/s².</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Módulo=√(8²+25²)=√689≈26,25 m/s².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>