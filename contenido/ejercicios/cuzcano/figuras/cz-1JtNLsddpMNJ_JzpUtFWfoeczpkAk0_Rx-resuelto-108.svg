<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">108 · Enfoque al fotografiar un objeto lejano</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="234.40,204.06 245.53,236.78 248.80,269.50 245.53,302.22 234.40,334.94 223.28,302.22 220.00,269.50 223.28,236.78 234.40,204.06" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="129.70,269.50 129.70,237.43" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="339.10,269.50 339.10,301.57" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="129.70,237.43 234.40,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="129.70,237.43 234.40,237.43 339.10,301.57" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="339.10,210.60 339.10,328.40" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="234.40,269.50 339.10,301.57" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="129.69682038648085" y="224.34640849949957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Objeto</text><text x="339.1047809685118" y="313.3447917468627" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen</text><text x="252.0695973516052" y="204.7144121949342" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Lente</text><text x="182.04881053198858" y="285.8599969204712" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La imagen sobre la placa es real. Un</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tamaño igual implica que las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancias objeto e imagen son ambas</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 20 cm.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De 1/f = 1/20 + 1/20 sale f = 10 cm.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para un objeto muy lejano, 1/s tiende</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a cero. La imagen se forma</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximadamente a una distancia focal.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>