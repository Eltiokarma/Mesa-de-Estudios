<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Tres rectas separadas por 60°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="187.15,346.52 375.10,346.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="187.15,346.52 282.31,181.77" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="187.15,346.52 100.90,197.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="294.21,202.29 294.21,346.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="294.21,202.29 276.36,191.94" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="294.21,202.29 151.46,284.67" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="301.9388426282276" y="198.42379819466797" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="294.2067035196977" y="357.2300398852425" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="271.60506612553354" y="182.3647400461829" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="143.13260093765308" y="280.50342873136935" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="223.42789168007835" y="338.1970820796305" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="184.1724162060038" y="312.0267650969141" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon el origen en la intersección y P =</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(x,7). La distancia al rayo de 60° es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(√3x − 7)/2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala a 1. Se obtiene √3x = 9.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia a la recta de 120° es</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(√3x + 7)/2 = 8. El pie R cae sobre</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ese rayo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>