<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Péndulo repelido desde abajo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="311.8387096774194" x2="421" y2="311.8387096774194" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="238.00,142.48 238.00,311.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">hilo</text><polyline points="238.00,311.84 238.00,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">eje</text><circle cx="238.0" cy="311.8387096774194" r="3.7" fill="#20364b"/><text x="245.0" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m;q</text><circle cx="238.0" cy="396.5161290322581" r="3.7" fill="#20364b"/><text x="245.0" y="388.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><circle cx="238.0" cy="227.1612903225806" r="3.7" fill="#20364b"/><text x="245.0" y="219.1612903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">L</text><circle cx="238.0" cy="354.1774193548387" r="3.7" fill="#20364b"/><text x="245.0" y="346.1774193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia entre cargas cumple</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d²=a²+L(L+a)θ²+O(θ⁴).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Expandir U=mgL(1−cosθ)+KQq/d:</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coeficiente cuadrático</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[mgL−KQqL(L+a)/a³]/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con inercia mL²,</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f=(1/2π)√[g/L−KQq(L+a)/(ma³L)], si el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilibrio es estable.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>