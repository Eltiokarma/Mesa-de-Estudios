<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Intersección de una perpendicular y una horizontal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="126.26,268.48 349.74,268.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="170.80,396.52 170.80,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="170.80,299.03 231.89,278.66 262.44,268.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="195.23,168.69 208.13,207.39 231.89,278.66 262.44,370.31" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="152.47,207.39 208.13,207.39 323.53,207.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="170.7956989250706" y="268.48175301452534" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="170.7956989250706" y="299.0291625940387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="231.89051808409732" y="278.66422287436313" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="262.4379276636107" y="268.48175301452534" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="208.13142174447583" y="207.3869338554986" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="349.74242424199224" y="273.5220755951705" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="177.85215053797384" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=(0,−1) y C=(3,0). B divide AC en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">razón 2:1, así que B=(2,−1/3).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de L es 1/3, así que la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular por B tiene pendiente</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al imponer y=2, queda 2+1/3=−3(x−2) y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=11/9.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>