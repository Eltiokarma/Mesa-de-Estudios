<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Aceite para igualar dos niveles libres</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,194.31 100.90,344.69 351.54,344.69 351.54,194.31" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="141.00,194.31 141.00,314.61 291.39,314.61 291.39,194.31" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,229.40 141.00,229.40" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,279.53 141.00,279.53" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="291.39,229.40 351.54,229.40" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="291.39,261.98 351.54,261.98" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="120.95394232470366" y="253.45942678539836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Aceite</text><text x="322.96491124609304" y="244.43660435218493" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="231.23288317508994" y="328.14834581588724" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="375.09677419354836" y="246.44167600401016" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,12 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Compara presiones a una cota común</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bajo ambas interfaces.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con niveles libres iguales, la columna</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de agua hipotética tendría la misma</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura a cada lado. El aceite y M</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reducen esa presión en (1000 − 900)gh</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y (1000 − 800)g×0,12, respectivamente.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala las dos reducciones y despeja</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>