<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">142 · Composición con un diagrama de flechas y una curva</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,184.82 168.61,255.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><line x1="168.60533651931502" y1="255.3870967741936" x2="159.34147869479963" y2="251.6213381245766" stroke="#1766b0" stroke-width="2"/><line x1="168.60533651931502" y1="255.3870967741936" x2="165.22620206747993" y2="245.9753248710703" stroke="#1766b0" stroke-width="2"/><polyline points="100.90,255.39 168.61,325.95" fill="none" stroke="#d37618" stroke-width="2.5"/><line x1="168.60533651931502" y1="325.95161290322585" x2="159.34147869479963" y2="322.18585425360885" stroke="#d37618" stroke-width="2"/><line x1="168.60533651931502" y1="325.95161290322585" x2="165.22620206747993" y2="316.53984100010257" stroke="#d37618" stroke-width="2"/><polyline points="100.90,325.95 168.61,184.82" fill="none" stroke="#008674" stroke-width="2.5"/><line x1="168.60533651931502" y1="184.82258064516134" x2="168.3324643516374" y2="194.81885699088662" stroke="#008674" stroke-width="2"/><line x1="168.60533651931502" y1="184.82258064516134" x2="160.97954608501172" y2="191.29153112047712" stroke="#008674" stroke-width="2"/><polyline points="270.16,149.54 276.93,184.82 310.78,255.39 344.63,325.95 371.71,347.12" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="246.46,361.23 375.10,361.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="249.85,361.23 249.85,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="100.90322580645162" cy="184.82258064516134" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="176.82258064516134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><circle cx="100.90322580645162" cy="255.3870967741936" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="247.3870967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><circle cx="100.90322580645162" cy="325.95161290322585" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="317.95161290322585" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><circle cx="168.60533651931502" cy="184.82258064516134" r="3.7" fill="#20364b"/><text x="175.60533651931502" y="176.82258064516134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5</text><circle cx="168.60533651931502" cy="255.3870967741936" r="3.7" fill="#20364b"/><text x="175.60533651931502" y="247.3870967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><circle cx="168.60533651931502" cy="325.95161290322585" r="3.7" fill="#20364b"/><text x="175.60533651931502" y="317.95161290322585" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><circle cx="276.9287136598965" cy="184.82258064516134" r="3.7" fill="#20364b"/><text x="283.9287136598965" y="176.82258064516134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,6)</text><circle cx="310.7797690163282" cy="255.3870967741936" r="3.7" fill="#20364b"/><text x="317.7797690163282" y="247.3870967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2,5)</text><circle cx="344.6308243727599" cy="325.95161290322585" r="3.7" fill="#20364b"/><text x="351.6308243727599" y="317.95161290322585" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(3,4)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En I, g(3)=4 y f(4)=5, así la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">afirmación es verdadera.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En II, f(2)=1 y g(1)=6. También es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verdadera.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En III, para llegar a 1 la entrada</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interior de f debe ser 2. Como f(3)=2,</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la solución es x=3. Para x=2 la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">composición no se define.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>