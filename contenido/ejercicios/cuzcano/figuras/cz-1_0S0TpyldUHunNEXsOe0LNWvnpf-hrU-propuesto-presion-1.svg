<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Fuerza del aire sobre una cara de vidrio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,333.21 302.52,333.21 375.10,252.56 173.48,252.56 100.90,333.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="221.87,171.92 221.87,280.79" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="215.02,267.08 221.87,280.79 228.73,267.08" fill="none" stroke="#008674" stroke-width="2.5"/><text x="242.03225806451616" y="208.20967741935488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">pₐₜₘ</text><text x="306.54838709677415" y="367.0806451612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A = 0,25 m²</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La presión atmosférica se ejerce</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normalmente sobre cada elemento de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sobre una cara plana, la resultante</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene módulo pA. La presión indicada</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivale a 100 000 Pa.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica por 0,25 m² y pasa de N a</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">kN.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>