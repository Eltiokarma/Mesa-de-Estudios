<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">020 · Ángulo entre dos bisectrices de cuerdas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.00,353.82 191.90,187.00 273.79,353.82 110.00,353.82 368.42,353.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="191.90,187.00 331.42,231.89 273.79,353.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.00,353.82 331.42,231.89" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.00,353.82 375.10,302.86 273.79,353.82" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645159" y="363.5265486725664" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="191.8966600057094" y="175.47345132743365" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="273.7907507850414" y="363.5265486725664" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="339.306023408507" y="224.60990579503283" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="190.68341421638596" y="210.05095632315155" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="352.0451041964031" y="314.39009420496717" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A, C y D están en una circunferencia</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con centro B. Como D está en el arco</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mayor AC, el ángulo inscrito ∠ADC</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abarca el arco de 30° y vale 15°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama φ al ángulo de AD con la base y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ψ al de CD con la base prolongada,</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ambos hacia arriba. Su diferencia es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠ADC = 15°.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las bisectrices se inclinan φ/2 y ψ/2</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto de la base, por lo que x =</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15°/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>