<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Área lateral desde dos elevaciones enteras</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,396.20 186.00,242.21 375.10,197.36 290.00,351.35" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,396.20 290.00,396.20 375.10,331.90 186.00,331.90 100.90,396.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,207.10 290.00,207.10 375.10,142.80 186.00,142.80 100.90,207.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,396.20 100.90,207.10" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="290.00,396.20 290.00,207.10" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,331.90 375.10,142.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="186.00,331.90 186.00,142.80" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,396.20 186.00,242.21 375.10,197.36 290.00,351.35 100.90,396.20" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645163" y="396.19632925472746" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="290.00222469410454" y="396.19632925472746" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="331.90266963292544" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="185.99777530589543" y="331.90266963292544" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="100.90322580645163" y="207.0973303670745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="290.00222469410454" y="207.0973303670745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="375.09677419354836" y="142.80367074527254" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="185.99777530589543" y="142.80367074527254" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="185.99777530589543" y="242.20513867153093" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="375.09677419354836" y="197.35637319083366" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="290.00222469410454" y="351.34756377403016" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si la arista es a y las elevaciones</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son m=MD, q=QB, se cumple a²+m²=196 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a²+q²=169.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al restar, (m−q)(m+q)=27. La</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">factorización 1·27 da m=14 y a=0, que</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es degenerado. La opción 3·9 da m=6 y</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">q=3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces a²=160 y N queda a altura 9</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dentro de su arista. El área lateral</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 4a².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>