<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">033 · Dos diagonales en una malla rectangular</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.79,202.54 363.67,202.54" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.79,266.01 363.67,266.01" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="109.79,329.48 363.67,329.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="109.79,202.54 109.79,329.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="236.73,202.54 236.73,329.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="363.67,202.54 363.67,329.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="109.79,266.01 236.73,202.54" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="236.73,329.48 363.67,266.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645164" y="342.80869175627237" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="196.1913082437276" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ir solo por la malla requiere dos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desplazamientos horizontales y dos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verticales. Una diagonal reemplaza uno</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de cada tipo por un tramo más corto.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos diagonales son alternativas.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por cada diagonal hay un tramo</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obligatorio antes y otro después para</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanzar B.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuenta la ruta por la diagonal</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superior izquierda y la ruta por la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferior derecha.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>