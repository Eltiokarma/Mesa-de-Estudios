<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">047 · Objeto sumergido visto oblicuamente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,273.72 375.10,273.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="241.52,210.44 241.52,273.72" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="129.03,189.35 241.52,273.72 304.79,358.09" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="241.52,273.72 304.79,321.17" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="304.79,321.17 304.79,358.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="121.99503722084367" y="180.91439205955336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="192.30107526881721" y="261.76633581472294" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="315.33664185277087" y="320.12034739454094" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen aparente</text><text x="315.33664185277087" y="358.08560794044666" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="280.1836228287841" y="259.6571546732837" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Aire</text><text x="157.14805624483043" y="318.71422663358146" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo de salida respecto de la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal es 53°. En Snell, sen i = (3/4)</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 53°, que da i ≈ 37° con la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximación 3–4–5.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mismo desplazamiento horizontal</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre el objeto y la normal vale 9 tan</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">53° para el rayo prolongado y h tan i</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para el objeto real.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala y usa las tangentes 4/3 y 3/4.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así h ≈ 16 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>