<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">094 · Inclinación de una secante entre un trapecio y un triángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,347.84 375.10,347.84 353.59,255.57" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,347.84 375.10,347.84 309.81,191.16 166.19,191.16" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,347.84 375.10,347.84 353.59,255.57 100.90,347.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,347.84 375.10,347.84 309.81,191.16 166.19,191.16 100.90,347.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="231.47,191.16 353.59,255.57 231.47,347.84 231.47,191.16" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="347.8410138248848" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354836" y="347.8410138248848" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="353.5931368163002" y="255.57139476729853" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="166.1874039938556" y="191.1589861751152" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="309.8125960061444" y="191.1589861751152" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="231.47158218125958" y="191.1589861751152" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="231.47158218125958" y="347.8410138248848" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el trapecio, la semidiferencia de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bases es 5. La altura es √(13²−5²)=12.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como los planos son perpendiculares</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por AB y FE es paralela a AB, N está a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">12 del plano de ABC.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El seno de la inclinación de NC es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">12/24.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>