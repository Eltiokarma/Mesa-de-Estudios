<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">039 · Una razón sobre la hipotenusa auxiliar</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.37,330.68 174.03,215.79 288.92,281.44 375.10,330.68 241.73,330.68 108.37,330.68" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="174.03,215.79 207.36,272.35 241.73,330.68" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="108.37,330.68 207.36,272.35" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="108.37,330.68 288.92,281.44" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="198.31,277.68 192.98,268.63 202.03,263.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="163.52,234.17 181.91,244.67 192.41,226.29" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.9032258064516" y="323.21436019735256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="166.5586698979444" y="208.3173330372402" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="367.62846742814105" y="323.21436019735256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="281.4556970580568" y="273.9727771287329" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="199.8914338213177" y="264.8820233314493" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="234.26584661729635" y="323.21436019735256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma AB=4, BC=7 y AC=√65. Con A=(0,0)</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y C=(√65,0), obtienes</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=(16/√65,28/√65).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BM tiene dirección (33,−56), así que</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AH tiene dirección (56,33). El seno y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coseno de ∠HAM son 33/65 y 56/65. Su</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semitangente es 33/(65+56)=3/11.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En B+t(C−B), impón y=3x/11. Sale</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t=4/7, por lo que DC/BD=(1−t)/t.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>