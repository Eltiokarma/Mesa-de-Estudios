40322580645" y="254.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">z1</text><circle cx="222.12298387096774" cy="242.0002013919256" r="3.7" fill="#20364b"/><text x="210.12298387096774" y="227.0002013919256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">z2</text><circle cx="222.12298387096772" cy="296.9997986080744" r="3.7" fill="#20364b"/><text x="210.12298387096772" y="303.9997986080744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">z3</text><circle cx="301.5080645161291" cy="159.5008055677024" r="3.7" fill="#20364b"/><text x="314.5080645161291" y="144.5008055677024" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">z4</text><circle cx="110.98387096774195" cy="269.5" r="3.7" fill="#20364b"/><text x="98.98387096774195" y="254.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">z5</text><circle cx="301.5080645161291" cy="379.4991944322976" r="3.7" fill="#20364b"/><text x="314.5080645161291" y="386.4991944322976" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">z6</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituir t=x³ produce (t−1)(t+64)=0.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para t=1, los módulos son 1 y los</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">argumentos 2kπ/3. Para t=−64, los</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">módulos son 4 y los argumentos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(2k+1)π/3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Convertir los ángulos a coordenadas da</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tres raíces en cada círculo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>