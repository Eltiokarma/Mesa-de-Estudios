<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">067 · Dos alturas de un triángulo isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="126.23,201.76 358.24,149.26 297.27,318.61 153.32,379.58 126.23,201.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="153.32,379.58 358.24,149.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="138.08,284.74 297.27,318.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="153.32,379.58 170.26,291.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="114.37096774193549" y="198.3709677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="361.6290322580645" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="295.58064516129036" y="330.4677419354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="149.93548387096774" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="121.14516129032258" y="284.741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="215.98387096774192" y="288.1290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="224.4516129032258" y="166.19354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">25</text><text x="339.61290322580646" y="237.32258064516128" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">24</text><text x="166.8709677419355" y="345.7096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En los triángulos rectángulos IAB y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AOS, la igualdad de los ángulos agudos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en B y O hace iguales los dos ángulos</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que forman AB con AI y AS. O está en</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la bisectriz del ángulo IAS.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus distancias a IA y AS son iguales.</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si L es el pie desde O sobre IA, los</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos triángulos rectángulos en L y S</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con hipotenusa AO son congruentes. Así</text><text x="482" y="315" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AL=AS=24 y la distancia de O a IB es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En BUO los ángulos en B y O son</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iguales por el dato y por ángulos</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuestos por el vértice. Sus alturas</text><text x="482" y="422" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde esos dos vértices tienen la</text><text x="482" y="445" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">misma longitud. Por tanto x=1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>