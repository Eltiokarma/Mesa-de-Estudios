<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Tangente cuadrada acotada entre 1 y 3</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Dominio en radianes</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="123.33333333333333" y1="275" x2="142.77777777777777" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="123.33333333333333" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="142.77777777777777" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><line x1="220.55555555555554" y1="275" x2="240.0" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="220.55555555555554" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="240.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><line x1="356.66666666666663" y1="275" x2="376.1111111111111" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="356.66666666666663" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="376.1111111111111" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="123.33333333333333" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/4</text><text x="142.77777777777777" y="329" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/3</text><text x="220.55555555555554" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">2π/3</text><text x="240.0" y="329" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">3π/4</text><text x="356.66666666666663" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">5π/4</text><text x="376.1111111111111" y="329" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">4π/3</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los radicandos imponen 1≤tan² x≤3, o</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1≤∣tan x∣≤√3.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la primera rama positiva esto da</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[π/4,π/3]. En el segundo cuadrante,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">donde tan x es negativa, da</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[2π/3,3π/4].</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma la copia de la primera rama</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">trasladada por π dentro del intervalo</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pedido.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>