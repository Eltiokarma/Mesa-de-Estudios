<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">100 · Área de un rectángulo girado dentro de un cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="357.52,262.00 118.48,262.00 118.48,277.00 357.52,277.00" fill="#f4c581" fill-opacity="0.45"/><polyline points="365.02,269.50 238.00,142.48 110.98,269.50 238.00,396.52 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="357.52,262.00 118.48,262.00 118.48,277.00 357.52,277.00 357.52,262.00" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="365.02,269.50 110.98,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,142.48 238.00,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,269.50 357.52,262.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="365.01612903225805" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.0" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="110.98387096774195" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="238.0" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="357.5169128350367" y="262.00078380277864" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="118.48308716496332" y="262.00078380277864" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="118.48308716496332" y="276.99921619722136" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="357.5169128350367" y="276.99921619722136" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="238.0" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ejes por las diagonales del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrado, sean p,q las semilongitudes</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de los lados del rectángulo. El</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrado cumple ∣x∣+∣y∣=3√2 en su</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">borde, así que p+q=3√2.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por OP=4, p²+q²=16. Al elevar la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primera relación al cuadrado y restar,</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda 2pq=2.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área es (2p)(2q)=4pq.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>