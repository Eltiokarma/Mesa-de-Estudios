<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">215 · Rapidez angular tras un cuarto de periodo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">t (s)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">θ (rad)</text><polyline points="100.90,142.48 105.47,142.66 110.04,143.18 114.61,144.05 119.18,145.26 123.75,146.81 128.32,148.70 132.89,150.92 137.46,153.46 142.03,156.33 146.60,159.50 151.17,162.98 155.74,166.74 160.31,170.79 164.88,175.11 169.45,179.69 174.02,184.51 178.59,189.57 183.16,194.84 187.73,200.32 192.30,205.99 196.87,211.84 201.44,217.84 206.01,223.98 210.58,230.25 215.15,236.63 219.72,243.09 224.29,249.63 228.86,256.22 233.43,262.85 238.00,269.50 242.57,276.15 247.14,282.78 251.71,289.37 256.28,295.91 260.85,302.37 265.42,308.75 269.99,315.02 274.56,321.16 279.13,327.16 283.70,333.01 288.27,338.68 292.84,344.16 297.41,349.43 301.98,354.49 306.55,359.31 311.12,363.89 315.69,368.21 320.26,372.26 324.83,376.02 329.40,379.50 333.97,382.67 338.54,385.54 343.11,388.08 347.68,390.30 352.25,392.19 356.82,393.74 361.39,394.95 365.96,395.82 370.53,396.34 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">péndulo lineal</text><circle cx="238.00000000000003" cy="269.5" r="3.7" fill="#20364b"/><text x="245.00000000000003" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">rapidez angular máxima</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para oscilación pequeña, ω=√(g/L)=√2</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rad/s y θmax=12π/180=π/15 rad.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=θmax cos(√2t); la velocidad angular</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es −θmax√2sen(√2t).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el tiempo dado, la fase esπ/2:</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rapidez angular=π√2/15≈0,296 rad/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>