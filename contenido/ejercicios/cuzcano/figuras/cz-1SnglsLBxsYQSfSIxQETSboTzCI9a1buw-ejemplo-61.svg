" fill="#20364b" text-anchor="middle">0</text><rect x="238.0" y="226" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="269.6666666666667" y="257.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">−55</text><rect x="301.33333333333337" y="226" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.00000000000006" y="257.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">114</text><rect x="364.6666666666667" y="226" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="396.33333333333337" y="257.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">−11</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Cálculo de los coeficientes</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x=y+h el coeficiente de y³ es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">8h+24. Se anula para h=−3.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al sustituir x=y−3 se obtiene un</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">polinomio sin término cúbico.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los coeficientes restantes son 2, −55,</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">114 y −11. Recupera x con y−3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>