<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">012 · Rapidez de una imagen en el marco del espejo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,326.90 375.10,326.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="265.06,225.19 265.06,325.71" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="120.53,276.34 184.17,276.34" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="177.04,279.91 184.17,276.34 177.04,272.77" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="273.98,276.34 344.76,276.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="337.63,279.91 344.76,276.34 337.63,272.77" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="125.59,264.44 125.57,264.73 125.52,265.02 125.45,265.30 125.34,265.57 125.20,265.82 125.04,266.06 124.85,266.29 124.64,266.48 124.41,266.66 124.16,266.81 123.90,266.93 123.63,267.02 123.34,267.09 123.05,267.12 122.77,267.12 122.48,267.09 122.19,267.02 121.92,266.93 121.66,266.81 121.41,266.66 121.18,266.48 120.97,266.29 120.78,266.06 120.62,265.82 120.48,265.57 120.37,265.30 120.30,265.02 120.25,264.73 120.23,264.44 120.25,264.15 120.30,263.87 120.37,263.59 120.48,263.32 120.62,263.06 120.78,262.82 120.97,262.60 121.18,262.40 121.41,262.23 121.66,262.08 121.92,261.96 122.19,261.87 122.48,261.80 122.77,261.77 123.05,261.77 123.34,261.80 123.63,261.87 123.90,261.96 124.16,262.08 124.41,262.23 124.64,262.40 124.85,262.60 125.04,262.82 125.20,263.06 125.34,263.32 125.45,263.59 125.52,263.87 125.57,264.15 125.59,264.44" fill="none" stroke="#008674" stroke-width="2.5"/><text x="265.65726681127984" y="212.10373661745155" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">espejo</text><text x="152.0542999090337" y="260.28091106290674" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 m/s</text><text x="310.86054159960815" y="260.28091106290674" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 m/s</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el marco del espejo, el muchacho se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mueve a 2−3=−1 m/s.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La coordenada de la imagen respecto</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del espejo es la opuesta de la del</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">muchacho.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al derivar esa relación, la velocidad</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la imagen en ese marco es +1 m/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>