78.00,220.43 179.08,225.59 180.42,230.70 182.00,235.73 183.83,240.68 185.90,245.53 188.21,250.27 190.74,254.90 193.50,259.40 196.48,263.75 199.66,267.96 203.05,272.00 206.64,275.87 210.41,279.56 214.35,283.06 218.46,286.37 222.73,289.46 227.15,292.35 231.70,295.01 236.38,297.45 241.17,299.66 246.07,301.63 251.05,303.35 256.12,304.83 261.25,306.06 266.43,307.03 271.66,307.75 276.91,308.21 282.18,308.42 287.46,308.36 292.72,308.05 297.97,307.48 303.18,306.65 308.34,305.57 313.44,304.23 318.48,302.65 323.42,300.82 328.28,298.75 333.02,296.44 337.65,293.91 342.14,291.15 346.50,288.17 350.70,284.99 354.75,281.60 358.62,278.01 362.31,274.25 365.81,270.30 369.11,266.19 372.21,261.92 375.10,257.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645163" y="257.50114715134356" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="192.30107526881721" y="144.40207865510814" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="257.50114715134356" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="192.30107526881721" y="257.50114715134356" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="283.6989247311828" y="257.50114715134356" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="283.6989247311828" y="386.75722543275543" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea s=AM. El triángulo AHC es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulo en H y su altura verifica</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">HN²=AN·NC=2s². Así s²=8.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como M pertenece al círculo de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diámetro BC, BM⊥MC, de modo que M es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el pie de B en AC.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC²−AB²=MC²−AM²=(2s)²−s²=24.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>