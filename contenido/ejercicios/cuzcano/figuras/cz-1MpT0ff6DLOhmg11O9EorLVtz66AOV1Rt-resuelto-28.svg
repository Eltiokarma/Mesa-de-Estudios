<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Recta que contiene la base de un triángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="128.00080556770232" y1="105" x2="128.00080556770232" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="128.00,269.50 201.33,142.48 274.67,269.50 128.00,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Triángulo</text><polyline points="201.33,142.48 274.67,269.50 348.00,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">L</text><circle cx="128.00080556770232" cy="269.5" r="3.7" fill="#20364b"/><text x="135.00080556770232" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="274.6663981440993" cy="269.5" r="3.7" fill="#20364b"/><text x="281.6663981440993" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="201.33360185590078" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="208.33360185590078" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">S</text><circle cx="347.99919443229766" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="354.99919443229766" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">K</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura sobre SR es 2(4√3)/4=2√3.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para L de ecuación √3x+y=b, la</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia de A a L es (b−2√3)/2. El</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">signo se fija por la ubicación de su</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corte vertical.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala a 2√3 y despeja b.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>