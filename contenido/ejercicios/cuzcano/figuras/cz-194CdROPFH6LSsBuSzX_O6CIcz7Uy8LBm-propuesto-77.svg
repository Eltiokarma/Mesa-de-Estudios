<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">077 · Altura de un arco con foco fijado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="338.0483870967742" x2="421" y2="338.0483870967742" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,338.05 105.47,329.06 110.04,320.38 114.61,312.00 119.18,303.93 123.75,296.16 128.32,288.69 132.89,281.53 137.46,274.68 142.03,268.13 146.60,261.88 151.17,255.94 155.74,250.31 160.31,244.97 164.88,239.95 169.45,235.23 174.02,230.81 178.59,226.70 183.16,222.89 187.73,219.38 192.30,216.18 196.87,213.29 201.44,210.70 206.01,208.42 210.58,206.44 215.15,204.76 219.72,203.39 224.29,202.32 228.86,201.56 233.43,201.10 238.00,200.95 242.57,201.10 247.14,201.56 251.71,202.32 256.28,203.39 260.85,204.76 265.42,206.44 269.99,208.42 274.56,210.70 279.13,213.29 283.70,216.18 288.27,219.38 292.84,222.89 297.41,226.70 301.98,230.81 306.55,235.23 311.12,239.95 315.69,244.97 320.26,250.31 324.83,255.94 329.40,261.88 333.97,268.13 338.54,274.68 343.11,281.53 347.68,288.69 352.25,296.16 356.82,303.93 361.39,312.00 365.96,320.38 370.53,329.06 375.10,338.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,338.05 375.10,338.05" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,338.05 238.00,200.95" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="238.0" cy="200.9516129032258" r="3.7" fill="#20364b"/><text x="245.0" y="192.9516129032258" font-family="Arial,sans-serif" font