<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Distancia entre aristas opuestas de un tetraedro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,384.61 238.00,384.61 375.10,384.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="176.31,237.34 238.00,190.72 299.69,144.11" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,384.61 176.31,237.34 375.10,384.61 299.69,144.11 100.90,384.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,384.61 238.00,190.72" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="100.90322580645162" y="384.60738129170414" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.0967741935484" y="384.60738129170414" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="176.30645161290323" y="237.33616709539268" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="299.6935483870968" y="144.1103606437797" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="238.0" y="384.60738129170414" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="238.0" y="190.72326386958625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="169.4516129032258" y="394.88963935622024" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="207.1532258064516" y="207.174876772812" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sean U y R los puntos medios de DO y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BS. Los triángulos DRO y BUS son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">isósceles porque las caras del</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tetraedro son congruentes.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus medianas RU y UR son</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares a DO y BS,</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respectivamente. El segmento UR es la</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular común.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DR es la altura de una cara equilátera</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y mide 2√3. En DUR, aplica Pitágoras</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con DU=2 para obtener UR=√(12−4).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>