,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">borde</text><circle cx="299.5248824264851" cy="212.89362913311976" r="3.7" fill="#20364b"/><text x="306.5248824264851" y="204.89362913311976" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(a,b)</text><circle cx="176.47511757351492" cy="326.10637086688024" r="3.7" fill="#20364b"/><text x="183.47511757351492" y="318.10637086688024" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−a,−b)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La parte bajo el eje x que se suma a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la izquierda tiene la misma área que</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la parte sobre el eje que se resta a</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la derecha. Esto se debe a la</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">imparidad del arcsen.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Queda el área del rectángulo de base</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2a y altura b, es decir, 2ab.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La intersección también pertenece a</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=1/x, por lo que ab=1. El área vale</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>