<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">117 · Dos perpendiculares con ángulos en proporción dos a uno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.61,371.19 111.61,157.11 362.75,371.19 111.61,371.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="111.61,271.56 362.75,371.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="111.61,271.56 173.36,209.80" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="111.61,371.19 147.01,285.56" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.9032258064516" y="385.18826891407537" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="100.9032258064516" y="153.8117310859247" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="375.0967741935484" y="381.07124866802286" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="100.9032258064516" y="274.0287222706578" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">K</text><text x="185.7138428751332" y="204.8627821369757" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="154.42448900513415" y="278.9691465659207" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="309.22445025670834" y="362.1329555361814" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2φ</text><text x="295.2265814201298" y="334.1372178630243" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4φ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea d = MP. En el triángulo rectángulo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PMK se tiene PK = d/cos 2φ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces KL = PK sen 4φ = d sen 4φ/cos</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2φ = 2d sen 2φ.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como QM = d sen 2φ, la longitud pedida</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es ℓ/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>