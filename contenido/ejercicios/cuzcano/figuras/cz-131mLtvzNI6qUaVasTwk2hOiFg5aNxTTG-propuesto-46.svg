s-serif" font-size="13" fill="#20364b" text-anchor="start">H1,2m</text><circle cx="100.90322580645162" cy="316.5046082949309" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="308.5046082949309" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">u5m/s</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura máxima relativa posible es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hmax=[M/(m+M)]u²/(2g)=25/24≈1,042 m si</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">g10.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 1,2&gt;hmax, no supera la cumbre:</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sube y regresa al mismo nivel.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Momento y energía dan</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">v=(m−M)u/(m+M)=−10/3 m/s. Rapidez=3,33</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>