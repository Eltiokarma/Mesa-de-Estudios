<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Distancia entre puntos medios en un cuadrilátero cóncavo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.38,358.99 226.58,172.39 363.67,358.99 238.95,255.22 111.38,358.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="169.45,265.69 302.74,303.77" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="169.45,265.69 239.90,358.99 302.74,303.77" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="111.38,358.99 363.67,358.99" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645157" y="368.5143369175627" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="227.52732974910393" y="163.82123655913972" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="236.09587813620072" y="248.55465949820783" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="366.6102150537634" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="162.7871863799283" y="259.97939068100357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="308.4525089605735" y="294.25358422939064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="239.90412186379928" y="375.17876344086017" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="227.52732974910393" y="196.19130824372752" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="313.2128136200717" y="249.50672043010746" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16</text><text x="188.4928315412186" y="326.62365591397844" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">12</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama Q al punto medio de BD. En ABD,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el segmento MQ es paralelo a AD y mide</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">8 m.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En BCD, QN es paralelo a BC y mide 6</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m. Los ángulos A y B suman 90°, por lo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que AD y BC son perpendiculares.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo rectángulo MQN, aplica</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pitágoras.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>