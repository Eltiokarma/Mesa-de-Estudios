<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Ángulo entre dos bisectrices exteriores</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="125.29,358.19 243.54,198.55 367.71,358.19 125.29,358.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="125.29,358.19 318.19,294.63" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="125.29,358.19 348.49,211.85 243.54,198.55 264.24,170.47" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="111.25,248.07 348.49,211.85" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="111.25,248.07 318.19,294.63" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="117.90174767411528" y="368.53486653334494" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="236.89140074776105" y="187.46365533431873" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="368.53486653334494" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="329.2746717676724" y="291.67198504477875" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="355.88105382140685" y="210.37470654725678" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="100.90322580645162" y="239.1982871054691" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="168.89731327710632" y="344.88474915224765" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2β</text><text x="156.33318841839838" y="327.1471611164247" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="150.42065907312409" y="312.36583775323885" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="137.11746804625685" y="246.588948787062" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠BAC = 4β y AB = BC, ∠ACB = 4β.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ADC, los ángulos en D y C son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iguales, así que 2β + 8β = 180°.</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta β = 18°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con la base horizontal, AB y BC tienen</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">orientaciones de +4β y −4β, así que BR</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es horizontal. Desde R, RA forma 3β</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por debajo de la dirección a la</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda y RX forma 3β/2.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde D las direcciones DB y DA se</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sitúan 4β por encima y 2β por debajo</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la dirección a la izquierda. DX</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">biseca y queda β por encima. En X el</text><text x="482" y="422" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo suma β + 3β/2 = 45°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>