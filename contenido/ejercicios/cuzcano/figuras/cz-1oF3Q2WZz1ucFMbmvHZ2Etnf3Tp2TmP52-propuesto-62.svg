<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">062 · Ángulo entre dos perpendiculares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,203.52 375.10,203.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="255.14,340.62 375.10,340.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,169.25 100.90,306.34 340.82,203.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,203.52 255.14,340.62 340.82,203.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="255.14,340.62 287.70,369.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="118.04032258064518" y="191.52620967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3x</text><text x="277.4153225806452" y="351.5866935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2x</text><text x="315.4596774193548" y="224.0866935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="111.18548387096777" y="297.0907258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊥</text><text x="255.13709677419354" y="325.88104838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊥</text><text x="362.758064516129" y="194.95362903225808" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="362.758064516129" y="331.36491935483866" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos primeras rectas bajan con</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">orientaciones 3x−180° y −2x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo entre sus perpendiculares</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coincide con la diferencia angular de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las primeras rectas. En el dibujo vale</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°−5x.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala 180°−5x=x y despeja.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>