<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">079 · Distancia desde un punto medio a un lado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="167.88709677419354" x2="421" y2="167.88709677419354" stroke="#20364b" stroke-width="1.7"/><line x1="212.59677419354838" y1="105" x2="212.59677419354838" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="161.79,244.10 263.40,142.48 314.21,396.52 161.79,244.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">ABC</text><polyline points="288.81,269.50 238.00,320.31" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Distancia</text><circle cx="161.79032258064515" cy="244.09677419354836" r="3.7" fill="#20364b"/><text x="168.79032258064515" y="236.09677419354836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="263.4032258064516" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="270.4032258064516" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="314.2096774193549" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="321.2096774193549" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="288.80645161290323" cy="269.5" r="3.7" fill="#20364b"/><text x="295.80645161290323" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="238.0" cy="320.30645161290323" r="3.7" fill="#20364b"/><text x="245.0" y="312.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Promedia B y C para obtener M=(3,−4).</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta AC tiene pendiente −1 y</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ecuación x+y+5=0.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Evalúa la expresión en M y divide su</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">módulo entre √2. El pie (1,−6)</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pertenece al segmento AC.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>