<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">037 · Distancias a los lados desde la prolongación de la base</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.40,303.10 190.50,262.16 271.60,303.10 109.40,303.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="190.50,262.16 171.96,303.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="190.50,262.16 321.03,200.37" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="190.50,262.16 351.93,334.77" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="109.40,303.10 365.83,302.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="365.83,302.33 318.71,202.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="365.83,302.33 351.93,334.77" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645156" y="308.50499772830534" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="189.72648796001818" y="255.9834166288051" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="270.82598818718765" y="313.9116310767833" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="171.18945933666512" y="313.1392548841436" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="316.39618355293055" y="192.6485688323489" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="375.09677419354847" y="306.9602453430259" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="352.69786460699686" y="346.35143116765107" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="332.6160835983644" y="241.3082689686506" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">PH = 4</text><text x="367.37301226715135" y="331.6762835074966" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="179.68559745570195" y="286.87846433439347" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea x=∠C=∠A. Las distancias desde P a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las rectas laterales son AP sen x=4 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CP sen x=1, por lo que AC sen x=3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura de B respecto de AC vale</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(AC/2)tan x=3/(2cos x). Como BM es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a BC, esa altura también</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale BM cos x=2cos x.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala las dos expresiones y obtén</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos² x=3/4. El ángulo de base es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agudo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>