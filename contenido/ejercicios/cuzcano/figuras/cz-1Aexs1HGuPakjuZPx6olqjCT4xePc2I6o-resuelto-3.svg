<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Cruces en un cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="127.55,396.52 127.55,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="182.78,396.52 182.78,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,396.52 238.00,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="293.22,396.52 293.22,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="348.45,396.52 348.45,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.98,379.95 365.02,379.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.98,324.72 365.02,324.72" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.98,269.50 365.02,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="110.98,214.28 365.02,214.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.98,159.05 365.02,159.05" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los n horizontales y n verticales se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cortan n² veces dentro.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada línea interior cruza dos</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lados:hay4n cruces con la frontera.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tn=n²+4n; T20=400+80=480.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>