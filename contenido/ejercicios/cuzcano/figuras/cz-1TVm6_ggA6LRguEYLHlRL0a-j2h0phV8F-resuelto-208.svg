<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">208 · Tres segmentos concurrentes en un ángulo recto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="140.10,143.33 140.10,379.64 342.65,379.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="140.10,143.33 258.26,379.64" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="140.10,177.09 275.13,379.64" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="140.10,227.72 342.65,379.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="128.28507126781693" y="142.483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="128.28507126781693" y="177.086271567892" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="128.28507126781693" y="227.72393098274569" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="126.59714928732181" y="394.82820705176294" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="254.87921980495122" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="278.510127531883" y="395.6721680420105" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="349.4028507126782" y="394.82820705176294" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="217.7449362340585" y="276.6736684171043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon D en el origen y B = (0,b), F =</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(f,0). Entonces M = (f/2,b/2).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta AE tiene interceptos b + 2 y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f − 1. Imponer que M esté en ella da b</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= 2f − 4. Con los interceptos b − 3 y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f + 4 de CG, se obtiene 4b = 3f + 24.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resuelve f = 8, b = 12. Como M biseca</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BF, BM = √(8² + 12²)/2 = 2√13.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>