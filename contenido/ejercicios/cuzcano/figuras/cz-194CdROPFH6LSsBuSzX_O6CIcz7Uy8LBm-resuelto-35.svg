idth="2.5"/><circle cx="153.58823939575217" cy="345.7096774193548" r="3.7" fill="#20364b"/><text x="160.58823939575217" y="337.7096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="255.20114262155866" cy="345.7096774193548" r="3.7" fill="#20364b"/><text x="262.2011426215587" y="337.7096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(a,0)</text><circle cx="255.20114262155866" cy="193.29032258064512" r="3.7" fill="#20364b"/><text x="262.2011426215587" y="185.29032258064512" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(a,b)</text><circle cx="322.41176060424783" cy="269.5" r="3.7" fill="#20364b"/><text x="329.41176060424783" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como la directriz es vertical, el eje</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">focal es horizontal.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El eje focal biseca la cuerda vertical</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB, de modo que la ordenada de F vale</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo de base OA=a tiene altura</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b/2. Multiplica y divide entre 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>