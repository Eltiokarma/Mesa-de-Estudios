<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">070 · Región bajo una V en el semiplano izquierdo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="289.55517826825127" x2="421" y2="289.55517826825127" stroke="#20364b" stroke-width="1.7"/><line x1="291.4804753820034" y1="105" x2="291.4804753820034" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">Re(z)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Im(z)</text><polygon points="184.52,396.52 184.52,142.48 258.06,289.56 291.48,222.70 291.48,396.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="184.52,142.48 258.06,289.56 291.48,222.70" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="291.48,396.52 291.48,222.70" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="258.05517826825127" cy="289.55517826825127" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="265.05517826825127" y="281.55517826825127" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">−1/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dado que cos α=x/∣z∣, se requiere x&lt;0.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El eje imaginario queda excluido.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como z+z̄=2x, la otra condición es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y&lt;∣2x+1∣. El vértice es (−1/2,0).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x≤−1/2 la frontera es y=−2x−1 y en</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−1/2≤x&lt;0 es y=2x+1. Dibuja ambas con</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">trazo discontinuo y sombrea por</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">debajo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>