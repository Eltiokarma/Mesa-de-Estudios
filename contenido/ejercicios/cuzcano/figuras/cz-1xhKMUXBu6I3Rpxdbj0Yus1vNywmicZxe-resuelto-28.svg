<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Rapidez al observar dos faros alineados al oeste</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,360.37 259.55,360.37 371.73,360.37" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="371.73,360.37 371.73,248.19 371.73,192.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="371.73,248.19 259.55,360.37" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="371.73,248.19 100.90,360.37" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="371.7313536843739" y="360.36635374771174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="371.7313536843739" y="248.18567010856145" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="259.55067004522357" y="360.36635374771174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="100.90322580645162" y="360.36635374771174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="375.0967741935484" y="178.63364625228823" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="310.0319776828412" y="325.59034181957514" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">SO</text><text x="196.72948720729937" y="313.25046661926865" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">OSO</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el barco avanzó d km al norte, los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">faros están d km al sur de su nueva</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posición.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El faro al SO está d km al oeste. El</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de rumbo OSO, 22,5° al sur del oeste,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">está d cot22,5°=d(1+√2) km al oeste.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su separación es d√2=10√2. Como</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">transcurrió una hora, la rapidez vale</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d km/h.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>