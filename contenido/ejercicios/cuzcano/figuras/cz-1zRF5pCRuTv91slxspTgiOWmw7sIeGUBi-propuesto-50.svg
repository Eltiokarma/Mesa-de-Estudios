nt-size="13" fill="#20364b" text-anchor="middle">H</text><text x="100.90322580645163" y="321.8905529953917" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="189.036866359447" y="174.02188940092165" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="189.036866359447" y="364.9781105990783" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="286.963133640553" y="174.02188940092165" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="286.963133640553" y="364.9781105990783" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="375.0967741935484" y="219.0679723502304" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="375.0967741935484" y="321.8905529953917" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos hexágonos comparten un lado.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El esqueleto tiene 6+6−1=11 conexiones</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C–C, cada una con una componente σ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay 8 conexiones C–H, que añaden 8</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enlaces σ. El total es 19.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se ven 5 dobles enlaces en la forma de</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Kekulé. Cada uno añade una componente</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>