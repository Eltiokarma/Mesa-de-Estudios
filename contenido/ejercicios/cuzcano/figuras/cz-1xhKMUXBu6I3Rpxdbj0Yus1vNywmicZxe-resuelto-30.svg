<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Razón de senos en la separación entre dos botes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,259.76 238.00,200.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,259.76 375.10,377.75" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,200.76 375.10,377.75" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,259.76 100.90,170.20" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645159" y="259.7561227083588" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="238.00000000000003" y="200.7590645672064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354847" y="377.75023899066366" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="100.90322580645159" y="161.24976100933634" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="280.00570162285607" y="274.6813290263925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15 km</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los rumbos OA y OB forman en O un</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo de 180°−2θ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde A, AO tiene rumbo Sθ°O y AB</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rumbo Sφ°E. El ángulo en A es θ+φ.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ley de senos da</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen(θ+φ)/sen(180°−2θ)=OB/AB=20/15.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>