ill="#20364b" text-anchor="start">9</text><text x="328.088954056696" y="344.588954056696" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">8</text><text x="190.9921798631476" y="215.80107526881721" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="161.911045943304" y="178.41104594330398" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5</text><text x="328.088954056696" y="178.41104594330398" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">6</text><text x="299.0078201368524" y="307.19892473118284" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">10</text><text x="215.91886608015642" y="224.10997067448682" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><text x="382.09677419354836" y="224.10997067448682" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="299.0078201368524" y="141.0210166177908" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">11</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma de aristas es1+…+12=78.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al sumar las seis caras,cada arista</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aparece en dos:6S=2·78.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">S=26. La ficha incorpora una</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distribución que comprueba que es</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanzable.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>