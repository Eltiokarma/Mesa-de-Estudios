<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">480 · Fórmula de cicloalcano y grado de insaturación</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,185.20 155.74,216.30 210.58,185.20 265.42,216.30 320.26,185.20 375.10,216.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="155.74,216.30 155.74,275.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="155.74,275.23 201.82,301.83 201.82,355.03 155.74,381.63 109.67,355.03 109.67,301.83 155.74,275.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="265.42,216.30 265.42,157.37" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay 13 carbonos y un ciclo sin enlaces</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">múltiples. El ciclo reduce en dos el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">número de H respecto de un alcano</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">acíclico.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así la fórmula es C₁₃H₂₆. El grado de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">insaturación 1 corresponde aquí al</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">anillo, no a un doble enlace.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El compuesto es un cicloalcano</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alicíclico. Tres carbonos tienen tres</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vecinos: el sustituido del anillo y</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos de la cadena.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>