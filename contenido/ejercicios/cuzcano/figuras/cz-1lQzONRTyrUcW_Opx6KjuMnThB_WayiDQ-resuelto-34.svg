f" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="290.0022246941046" y="396.1963292547275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="100.9032258064516" y="207.09733036707456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="185.99777530589543" y="142.80367074527248" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="142.80367074527248" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="290.0022246941046" y="207.09733036707456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="238.0" y="174.95050055617355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.0967741935484" y="237.35317018909896" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="100.9032258064516" y="254.3720800889878" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con arista unidad, O=(1/2,1/2,1),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H=(1,0,0), E=(0,0,0) y M=(1,1,1/2).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los vectores OH y EM son (1/2,−1/2,−1)</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y (1,1,1/2). Su producto escalar es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−1/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo entre rectas usa el valor</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">absoluto. Divide 1/2 entre</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(3/2)·(3/2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>