<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Dos triángulos con base y ángulo comunes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.39,261.54 216.40,209.83 366.56,261.54 241.27,325.37 110.39,261.54" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.39,261.54 366.56,261.54" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="267.22911725456026" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="211.65545297159053" y="201.2938697157829" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="266.28035065114466" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="237.478297302469" y="337.70613028421707" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="134.11005692599622" y="255.84391801357353" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">26°</text><text x="134.11005692599622" y="278.614316495547" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">26°</text><text x="329.5559772296015" y="254.89515141015798" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">19°</text><text x="329.5559772296015" y="277.6655498921314" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">27°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ángulos restantes son ∠ABC=135° y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠ADC=127°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la ley de senos,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC=AC·sin26°/sin135° y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DC=AC·sin26°/sin127°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cancela AC·sin26°. Queda</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sin127°/sin135°, que equivale a √2</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sin53°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>