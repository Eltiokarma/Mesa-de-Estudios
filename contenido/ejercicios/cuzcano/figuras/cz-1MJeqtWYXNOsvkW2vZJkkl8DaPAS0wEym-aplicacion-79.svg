<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">079 · Pesar una masa con una balanza de brazos desiguales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="105.86,289.87 370.14,289.87" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="244.61,320.15 260.02,289.87 275.44,320.15 244.61,320.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="105.86,232.06 105.86,289.87" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,279.41 105.86,289.87 110.81,279.41" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="370.14,232.06 370.14,289.87" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="365.19,279.41 370.14,289.87 375.10,279.41" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="105.85853089778468" y="218.84577017748413" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m o m₂</text><text x="370.1414691022153" y="218.84577017748413" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m₁ o m</text><text x="260.0235781837025" y="278.309431273481" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="182.9410545407436" y="306.9400829122944" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="315.0825236429589" y="306.9400829122944" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sean x e y los brazos izquierdo y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecho. El primer ensayo exige</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mx=m₁y.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segundo exige m₂x=my. La razón x/y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es entonces m/m₂ y también m₁/m.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala ambas razones. Como la masa es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positiva, toma la raíz positiva de</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m²=m₁m₂.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>