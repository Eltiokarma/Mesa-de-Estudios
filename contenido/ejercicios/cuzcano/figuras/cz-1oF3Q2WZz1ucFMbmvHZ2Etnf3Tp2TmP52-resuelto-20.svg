<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">020 · Producto de parámetros sin escala fijada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,265.18 375.10,265.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,261.78 107.18,268.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="194.39,261.78 194.39,268.58" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,261.78 238.00,268.58" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.82,261.78 368.82,268.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="107.18246737256834" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="194.3941557908561" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="238.0" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="368.81753262743166" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La condición geométrica equivale a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2/RC=1/RI+1/RO. Se deduce al sustituir</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CO=RO−RC e IC=RC−RI en la igualdad.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elige (a,b,c)=(3t,t,3t). La segunda</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ecuación se convierte en</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2t/RC=t/RO+t/RI, así que vale para</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cualquier t.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los productos 9t³ cambian con t. Por</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ejemplo, t=1 da 9 y t=2 da 72 con los</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mismos puntos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>