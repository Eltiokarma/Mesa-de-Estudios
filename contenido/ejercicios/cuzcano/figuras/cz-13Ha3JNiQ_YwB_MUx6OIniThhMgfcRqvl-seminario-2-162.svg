<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">162 · Molécula apolar de un grupo de cinco</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,233.51 238.00,233.51 375.10,233.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="245.85080645161293" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cl</text><text x="238.0" y="245.85080645161293" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Be</text><text x="375.0967741935484" y="245.85080645161293" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cl</text><text x="169.4516129032258" y="276.01209677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">←</text><text x="306.5483870967742" y="276.01209677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">→</text><text x="238.0" y="305.48790322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Dipolos de igual magnitud</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CH₃OH, CH₂Cl₂ y CH₃Cl tienen grupos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distintos cuya distribución deja un</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dipolo neto.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">SO₂ es angular y sus dipolos S–O no se</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cancelan.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BeCl₂ aislado es lineal. Los dos</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dipolos Be–Cl tienen igual magnitud y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">direcciones opuestas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>