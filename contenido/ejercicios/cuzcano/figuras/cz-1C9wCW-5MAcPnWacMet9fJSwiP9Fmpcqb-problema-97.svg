<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">097 · DCL del bloque Q</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="290.06451612903226" x2="421" y2="290.06451612903226" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="238.00,290.06 375.10,152.97" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">normal rampa</text><line x1="375.0967741935484" y1="152.9677419354839" x2="371.5235621929169" y2="162.30755756527782" stroke="#1766b0" stroke-width="2"/><line x1="375.0967741935484" y1="152.9677419354839" x2="365.7569585637545" y2="156.54095393611541" stroke="#1766b0" stroke-width="2"/><polyline points="238.00,290.06 238.00,386.03" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">peso</text><line x1="238.0" y1="386.03225806451616" x2="233.9223954694043" y2="376.90136866139306" stroke="#d37618" stroke-width="2"/><line x1="238.0" y1="386.03225806451616" x2="242.0776045305957" y2="376.90136866139306" stroke="#d37618" stroke-width="2"/><polyline points="238.00,290.06 100.90,331.19" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="498" font-family="Arial,sans-serif" font-size="12" fill="#008674" text-anchor="start">R de viga</text><line x1="100.90322580645162" y1="331.19354838709677" x2="108.47734064416775" y2="324.6641698236278" stroke="#008674" stroke-width="2"/><line x1="100.90322580645162" y1="331.19354838709677" x2="110.8207227242526" y2="332.47544342391063" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sobre Q actúan el peso vertical y la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal perpendicular a la rampa.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El contacto con la viga aporta normal</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y fricción; se pueden reunir en una</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resultante R.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La representación con peso, normal de</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rampa y R de viga es D. No confundir R</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con una normal aislada.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>