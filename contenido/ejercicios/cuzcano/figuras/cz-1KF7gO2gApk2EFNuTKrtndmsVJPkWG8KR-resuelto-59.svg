<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">059 · Área triangular entre dos cevianas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,344.90 177.07,192.57 375.10,344.90 100.90,344.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="177.07,192.57 340.82,344.90" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="158.03,230.66 375.10,344.90" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="158.03,230.66 238.00,344.90" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645163" y="354.9569892473118" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="177.06810035842292" y="183.43369175627242" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="354.65232974910396" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="237.99999999999997" y="355.5663082437276" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="340.8225806451613" y="355.5663082437276" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="146.6021505376344" y="228.21863799283153" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa coordenadas afines A=(0,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=(0,1), C=(1,0). Entonces E=(7/8,0) y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F=(0,3/4).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">FC cumple y=3(1−x)/4 y BE cumple</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=1−8x/7. Igualar da x=7/11.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La base FB mide 1/4 de AB y la altura</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de O es 7/11 de la de C respecto de</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB. Multiplica esas razones por 440.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>