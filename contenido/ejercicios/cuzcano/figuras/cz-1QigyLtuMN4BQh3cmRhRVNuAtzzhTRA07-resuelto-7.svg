1,206.84 153.05,206.69 150.69,206.62 148.32,206.63 145.96,206.71 143.60,206.87 141.25,207.10 138.90,207.41 136.57,207.80 134.25,208.26 131.95,208.80 129.66,209.41 127.40,210.09 125.16,210.85 122.94,211.68 120.76,212.58 118.60,213.55 116.47,214.58 114.38,215.69 112.33,216.86 110.32,218.10 108.34,219.41 106.41,220.77 104.53,222.20 102.69,223.69 100.90,225.24" fill="none" stroke="#008674" stroke-width="2.5"/><text x="149.6987813213026" y="279.8498896230385" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="149.6987813213026" y="206.6136422474816" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="149.6987813213026" y="307.8236469120059" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="289.00240191235696" y="206.6136422474816" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.09677419354836" y="206.6136422474816" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="219.3505916168298" y="257.21864457974374" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="185.69375437354765" y="305.0538410918758" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea θ=∠EUR. Como ER=RU, el ángulo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre RT y RE es 2θ. Como E es el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto medio de la hipotenusa PR del</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo rectángulo PTR, ET=ER y</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠RTE=2θ.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El radio OE va sobre OU, así que</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠TOE=90°−θ. En el isósceles OTE,</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠OTE=45°+θ/2 y ∠RTE=45°−θ/2. Al</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igualar a 2θ se obtiene θ=18°.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuerda ET=ER subtiende 72°. Su</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud es 2r sen 36°. Iguala a</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(40−8√5) y despeja r.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>