<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">013 · Fracción en masa con agua sobrante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="126.66666666666667" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="111.33333333333334" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Componente</text><rect x="174.66666666666669" y="130" width="126.66666666666667" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="238.00000000000003" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Al inicio</text><rect x="301.33333333333337" y="130" width="126.66666666666667" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="364.6666666666667" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Al final</text><rect x="48.0" y="178" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">C₂H₄O</text><rect x="174.66666666666669" y="178" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1760 kg</text><rect x="301.33333333333337" y="178" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0 kg</text><rect x="48.0" y="226" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">H₂O</text><rect x="174.66666666666669" y="226" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1440 kg</text><rect x="301.33333333333337" y="226" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">720 kg</text><rect x="48.0" y="274" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">C₂H₆O₂</text><rect x="174.66666666666669" y="274" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0 kg</text><rect x="301.33333333333337" y="274" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2480 kg</text><text x="48" y="349" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Conservación de la masa</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con masas molares de 44 y 18 kg/kmol,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se parte de 40 kmol de óxido y 80 kmol</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de agua.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La proporción es 1:1. El óxido limita</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y se forman 40 kmol de etilenglicol,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivalentes a 40×62=2480 kg. Sobran</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">40 kmol de agua, es decir, 720 kg.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide 2480 kg por 2480+720 kg y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplica por 100. Se obtiene 77,5 %.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>