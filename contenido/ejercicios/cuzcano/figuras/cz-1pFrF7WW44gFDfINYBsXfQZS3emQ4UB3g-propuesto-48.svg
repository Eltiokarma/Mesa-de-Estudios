<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">048 · Campo mínimo para no tocar placa superior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="324.33870967741933" x2="421" y2="324.33870967741933" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645164" y1="105" x2="100.90322580645164" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="100.90,214.66 375.10,214.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">placa superior</text><polyline points="100.90,324.34 375.10,324.34" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">placa inferior</text><circle cx="100.90322580645164" cy="324.33870967741933" r="3.7" fill="#20364b"/><text x="107.90322580645164" y="316.33870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">lanzamiento</text><circle cx="375.09677419354836" cy="269.5" r="3.7" fill="#20364b"/><text x="368.09677419354836" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="end">longitud no dada</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El campo apunta hacia abajo.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vy0=100cos30°; altura</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">máxima=vy0²/(2qE/m).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para no alcanzar la placa superior,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E≥m vy0²/(2qd)=125·10⁶ N/C.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esto determina el umbral superior,</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pero para escapar también hace falta</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud de placas: el retorno a la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferior depende de ella.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>