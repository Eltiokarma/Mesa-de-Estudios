<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Orden de NO y Cl₂ con tres ensayos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="95.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Ensayo</text><rect x="143.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="190.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[NO]</text><rect x="238.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="285.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[Cl₂]</text><rect x="333.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="380.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">v (M/s)</text><rect x="48.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1</text><rect x="143.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,05</text><rect x="238.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,05</text><rect x="333.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,001</text><rect x="48.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2</text><rect x="143.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,05</text><rect x="238.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,15</text><rect x="333.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,003</text><rect x="48.0" y="274" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3</text><rect x="143.0" y="274" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,15</text><rect x="238.0" y="274" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,05</text><rect x="333.0" y="274" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,009</text><text x="48" y="349" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Velocidades iniciales</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre ensayos 1 y 2, triplicar [Cl₂] a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[NO] fija triplica v, así que el orden</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en Cl₂ es uno.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre 1 y 3, triplicar [NO] a [Cl₂]</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fija multiplica v por nueve. El orden</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en NO es dos.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma los órdenes parciales y escribe</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la ley.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>