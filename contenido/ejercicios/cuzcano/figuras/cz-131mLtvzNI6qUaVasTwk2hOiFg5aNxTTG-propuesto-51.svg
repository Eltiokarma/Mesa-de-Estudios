<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">051 · Desplazamiento del CM con dirección incompleta</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="210.7442396313364" x2="421" y2="210.7442396313364" stroke="#20364b" stroke-width="1.7"/><line x1="257.58525345622115" y1="105" x2="257.58525345622115" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="257.59,210.74 375.10,210.74" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">2kg:3i</text><line x1="375.0967741935484" y1="210.7442396313364" x2="365.9658847904253" y2="214.8218441619321" stroke="#1766b0" stroke-width="2"/><line x1="375.0967741935484" y1="210.7442396313364" x2="365.9658847904253" y2="206.6666351007407" stroke="#1766b0" stroke-width="2"/><polyline points="257.59,210.74 100.90,328.26" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">1kg:ejemplo 3-4-5</text><line x1="100.90322580645162" y1="328.2557603686636" x2="105.76137461059267" y2="319.5151431023132" stroke="#d37618" stroke-width="2"/><line x1="100.90322580645162" y1="328.2557603686636" x2="110.65450004730751" y2="326.0393103512663" stroke="#d37618" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea v1=(−5cosθ,−5sinθ). Entonces</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">VCM=[(6−5cosθ),−5sinθ]/3.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En3 s, ΔRCM=(6−5cosθ)î−5sinθĵ m.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La opción (2î−3ĵ) requiere cosθ4/5 y</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sinθ3/5. El dibujo por sí solo no</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proporciona esos valores.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>