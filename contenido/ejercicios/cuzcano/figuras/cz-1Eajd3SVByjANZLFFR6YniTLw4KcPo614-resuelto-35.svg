<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Cociente de ángulos formados por dos alturas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,335.31 199.61,203.69 375.10,335.31 265.42,335.31 100.90,335.31" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="199.61,203.69 199.61,285.95 199.61,335.31" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="199.61,203.69 265.42,335.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,335.31 199.61,285.95 265.42,335.31" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="335.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="199.61290322580643" y="203.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="335.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="199.61290322580643" y="335.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="199.61290322580643" y="285.95161290322585" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="265.41935483870964" y="335.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="206.19354838709677" y="222.4483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">∠NBH</text><text x="130.51612903225805" y="328.06774193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">∠MAN</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo ABN, BH es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a AN y MN es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a AB, porque MN es</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralela a BC.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M es el ortocentro de ABN. Por ello AM</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es perpendicular a BN.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ángulos ∠NBH y ∠MAN tienen sus</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lados respectivamente perpendiculares.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambos son agudos en la configuración</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mostrada, así que son iguales.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>