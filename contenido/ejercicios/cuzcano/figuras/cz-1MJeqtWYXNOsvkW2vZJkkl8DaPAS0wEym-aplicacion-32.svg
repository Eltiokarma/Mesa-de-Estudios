<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">032 · Empuje del aire sobre una cometa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,356.72 264.44,262.30 305.32,182.28 375.10,218.26 336.94,290.76 264.44,262.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,356.72 177.22,356.72" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="305.32,182.28 336.94,290.76" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="264.44,262.30 375.10,218.26" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="147.7832360674662" y="346.9065285705124" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="189.21208234464186" y="299.48140191111395" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T = 1 N</text><text x="358.1981658436478" y="194.27393702302314" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cometa</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuerda tira hacia abajo y a la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda. Sus componentes tienen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">magnitudes cos 30°=√3/2 y sen 30°=1/2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El peso añade 0,25 N hacia abajo. El</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aire debe aportar √3/2 N a la derecha</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 3/4 N hacia arriba.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula la magnitud de ese vector por</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pitágoras.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>