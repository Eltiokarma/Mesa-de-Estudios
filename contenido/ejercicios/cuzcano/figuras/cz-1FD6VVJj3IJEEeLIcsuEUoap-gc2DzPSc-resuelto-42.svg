<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Base a partir de una tabla</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="63.333333333333336" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="79.66666666666667" y="161.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">argumento</text><rect x="111.33333333333334" y="130" width="63.333333333333336" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="143.0" y="161.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">1/81</text><rect x="174.66666666666669" y="130" width="63.333333333333336" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="206.33333333333334" y="161.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">1/9</text><rect x="238.0" y="130" width="63.333333333333336" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="269.6666666666667" y="161.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">1</text><rect x="301.33333333333337" y="130" width="63.333333333333336" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="333.00000000000006" y="161.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">9</text><rect x="364.6666666666667" y="130" width="63.333333333333336" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="396.33333333333337" y="161.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">81</text><rect x="48.0" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="79.66666666666667" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">logaritmo</text><rect x="111.33333333333334" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">−8</text><rect x="174.66666666666669" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="206.33333333333334" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">−4</text><rect x="238.0" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="269.6666666666667" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">0</text><rect x="301.33333333333337" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.00000000000006" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">4</text><rect x="364.6666666666667" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="396.33333333333337" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">8</text><text x="48" y="253" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Tabla de cálculo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La correspondencia central confirma</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">log_b1=0. La pareja (9,4) exige b⁴=9.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La base es positiva, así que</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b=9^(1/4)=√3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Comprobar: (√3)^(±4)=9^(±1) y</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(√3)^(±8)=81^(±1).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>