<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">085 · Canica en tres niveles de canaletas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,202.09 192.30,247.79" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,202.09 283.70,247.79" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="192.30,247.79 146.60,293.49" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="192.30,247.79 238.00,293.49" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="283.70,247.79 238.00,293.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="283.70,247.79 329.40,293.49" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="146.60,293.49 100.90,339.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="146.60,293.49 192.30,339.19" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,293.49 192.30,339.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,293.49 283.70,339.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="329.40,293.49 283.70,339.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="329.40,293.49 375.10,339.19" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="244.99999999999997" y="189.52419354838707" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="204.30107526881721" y="350.47580645161287" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una trayectoria tiene tres elecciones</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">binarias; hay ocho secuencias</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equiprobables.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La segunda salida requiere exactamente</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una elección hacia la derecha, que</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puede ocurrir en cualquiera de los</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tres niveles.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay C(3,1)=3 trayectorias:</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">probabilidad 3/8. Se conserva la</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">confluencia de canales en el redibujo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>