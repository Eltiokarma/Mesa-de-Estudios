="255.44,225.28 255.44,231.56" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="107.18246737256834" y="318.94902733316917" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="203.11532463268486" y="318.94902733316917" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="211.83649347451367" y="318.94902733316917" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="238.0" y="318.94902733316917" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="255.44233768365754" y="318.94902733316917" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="290.3270130509727" y="318.94902733316917" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="299.0481818928015" y="318.94902733316917" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="368.81753262743166" y="318.94902733316917" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="159.509480423541" y="246.21447919231719" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3K</text><text x="246.72116884182876" y="272.3779857178035" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="246.72116884182876" y="220.05097266683086" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a=AB, b=BC y c=CD. Usa coordenadas</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=0, B=a, C=a+b y D=a+b+c.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La primera distancia es (a+c)/2 al</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">restar (A+C)/2 de (B+D)/2. La segunda</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es (a−c)/2 al restar (A+D)/2 de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(B+C)/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma y cancela c. El resultado es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=3K.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>