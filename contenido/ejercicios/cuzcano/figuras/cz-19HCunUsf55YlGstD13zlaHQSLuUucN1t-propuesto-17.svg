<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Paralelogramo bajo una cuerda paralela</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="117.50,309.67 197.83,149.00 278.17,149.00 197.83,309.67 117.50,309.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="117.50,309.67 197.83,309.67 358.50,309.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="197.83,149.00 197.83,309.67" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="117.50,309.67 278.17,149.00" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="197.83,149.00 358.50,309.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="365.02,269.50 364.40,281.95 362.58,294.28 359.55,306.37 355.35,318.11 350.02,329.37 343.61,340.07 336.18,350.08 327.81,359.31 318.58,367.68 308.57,375.11 297.87,381.52 286.61,386.85 274.87,391.05 262.78,394.08 250.45,395.90 238.00,396.52 225.55,395.90 213.22,394.08 201.13,391.05 189.39,386.85 178.13,381.52 167.43,375.11 157.42,367.68 148.19,359.31 139.82,350.08 132.39,340.07 125.98,329.37 120.65,318.11 116.45,306.37 113.42,294.28 111.60,281.95 110.98,269.50 111.60,257.05 113.42,244.72 116.45,232.63 120.65,220.89 125.98,209.63 132.39,198.93 139.82,188.92 148.19,179.69 157.42,171.32 167.43,163.89 178.13,157.48 189.39,152.15 201.13,147.95 213.22,144.92 225.55,143.10 238.00,142.48 250.45,143.10 262.78,144.92 274.87,147.95 286.61,152.15 297.87,157.48 308.57,163.89 318.58,171.32 327.81,179.69 336.18,188.92 343.61,198.93 350.02,209.63 355.35,220.89 359.55,232.63 362.58,244.72 364.40,257.05 365.02,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="117.50191980406782" y="309.6660267319774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="197.8339732680226" y="149.00191980406782" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="278.16602673197735" y="149.00191980406782" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="358.4980801959321" y="309.6660267319774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="197.8339732680226" y="309.6660267319774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon A=(0,0), N=(u,0), B=(u,h),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M=(2u,h) y C=(u+v,0). Como AC y BM son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuerdas horizontales, sus puntos</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medios están en una misma vertical.</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así (u+v)/2=3u/2, luego v=2u.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La perpendicularidad entre AM y BC da</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(2u,h)·(v,−h)=0, es decir h²=2uv.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Luego AM²=4u²+h²=4uv=4a². Toma la raíz</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positiva.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>