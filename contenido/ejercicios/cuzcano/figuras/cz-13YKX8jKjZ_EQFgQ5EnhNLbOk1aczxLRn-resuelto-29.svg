<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Razón de triángulos con una base común</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="211.67,297.38 269.75,142.48 319.03,273.88" fill="#f4c581" fill-opacity="0.45"/><polygon points="211.67,297.38 276.10,396.52 319.03,273.88" fill="#f4c581" fill-opacity="0.45"/><polyline points="110.98,396.52 110.98,142.48 365.02,142.48 365.02,396.52 174.49,396.52 110.98,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="174.49,396.52 211.67,297.38 269.75,142.48 319.03,273.88 365.02,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.98,142.48 211.67,297.38 276.10,396.52 319.03,273.88 365.02,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="211.67,297.38 319.03,273.88" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="269.7540322580645" y="205.991935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S₁</text><text x="279.2802419354839" y="345.7096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S₂</text><text x="110.98387096774195" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="110.98387096774195" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="365.01612903225805" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="365.01612903225805" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="174.49193548387098" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="269.7540322580645" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="276.10483870967744" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="211.66738788355627" y="297.38158929976396" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="319.02753058954397" y="273.87986651835377" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea H la altura del rectángulo y b=LO.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si PA=4k, entonces UA=3k y EN=4k.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo superior es semejante al</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de base UA y tiene altura H·b/(3k). El</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferior es semejante al de base EN y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene altura H·b/(4k).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como comparten la base LO, la razón de</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">áreas es la de esas alturas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>