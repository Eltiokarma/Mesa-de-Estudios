 170.24,291.02 170.76,291.10 171.29,291.17" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="204.38,300.49 245.88,224.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="204.38,300.49 268.47,266.87" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="302.61,261.62 370.37,261.62" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="216.44722531207512" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="195.97800024718822" y="216.44722531207512" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="294.20442466938573" y="216.44722531207512" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="175.49227536769249" y="310.9967247559016" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="273.19342479297984" y="310.9967247559016" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="370.3692992213571" y="310.9967247559016" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="162.36040044493882" y="289.4604498825856" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T₁</text><text x="161.30985045111854" y="299.4406748238784" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T₂</text><text x="247.45494994438263" y="224.85162526263747" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P₁</text><text x="269.5164998146088" y="264.2472500308985" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P₂</text><text x="109.83290075392411" y="322.55277468792485" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I · T₂ &lt; T₁</text><text x="212.78680014831292" y="322.55277468792485" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">II · P₂ &gt; P₁</text><text x="302.6088246199481" y="322.55277468792485" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">III · Boyle</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En I, a igual V la presión es mayor</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para la temperatura mayor. Las curvas</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">están en el orden correcto.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En II, una recta creciente del plano</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P–V no representa presión constante.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Incluso interpretando V como un error</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de eje, los rótulos no concuerdan con</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendientes de isóbaras.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En III, Boyle exige PV constante. Una</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal mantiene P constante, no</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PV.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>