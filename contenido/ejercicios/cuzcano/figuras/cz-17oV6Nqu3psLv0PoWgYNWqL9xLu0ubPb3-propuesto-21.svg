<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Distancia a una recta con inclinación obtusa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,292.35 375.10,292.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="201.44,392.89 201.44,146.11" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="201.44,200.95 323.30,292.35 201.44,292.35 201.44,200.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="140.51,353.28 235.56,226.54" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="375.0967741935484" y="286.25627240143365" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="207.53405017921148" y="146.11290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="209.36200716845877" y="186.9372759856631" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(0,3/2)</text><text x="329.3978494623656" y="305.14516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(2,0)</text><text x="130.15053763440864" y="369.1236559139785" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La inclinación obtusa da pendiente</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativa. Por eso el intercepto en Y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es positivo. La base 2 y el área 3/2</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fijan el intercepto y=3/2.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta pasa por (2,0) y (0,3/2). En</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">forma general es 3x+4y−6=0.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En P, la expresión del lado izquierdo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale −13. Divide su magnitud por</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(9+16).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>