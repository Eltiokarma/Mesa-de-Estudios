<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Lado de un equilátero a partir de un segmento interior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,386.47 371.04,386.47 235.97,152.53 100.90,386.47" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,386.47 250.83,273.50 348.17,200.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="235.97,152.53 250.83,273.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="371.04,386.47 348.17,200.15" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645159" y="386.474669190652" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="371.04465278881304" y="386.474669190652" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="235.97393929763234" y="152.52533080934808" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="348.1666528713435" y="200.14831228360586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="250.8275843238249" y="273.498561620822" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="136.02161131415858" y="348.6548694131214" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="238.67535356745591" y="189.2714274935282" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="375.0967741935484" y="359.46052649241585" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="299.4971185975842" y="226.01777987291945" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea s el lado. En ACQ, ∠CAQ=x,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠ACQ=60°−x y ∠AQC=120°. Así AQ=s</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen(60°−x)/sen 120°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABP, ∠ABP=60°+x y ∠APB=60°. Así</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AP=s sen(60°+x)/sen 60°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta ambas expresiones. Como</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen(60°+x)−sen(60°−x)=sen x, resulta</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2=2s sen x/√3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>