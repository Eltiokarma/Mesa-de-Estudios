<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">137 · Área entre una recta horizontal y una gráfica en V</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="355.18548387096774" x2="421" y2="355.18548387096774" stroke="#20364b" stroke-width="1.7"/><line x1="272.2741935483871" y1="105" x2="272.2741935483871" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polygon points="135.18,218.09 238.00,320.91 340.82,218.09" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,218.09 375.10,218.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">f(x)=4</text><polyline points="100.90,183.81 238.00,320.91 375.10,183.81" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">g(x)</text><circle cx="135.17741935483872" cy="218.08870967741936" r="3.7" fill="#20364b"/><text x="142.17741935483872" y="210.08870967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(-4, 4)</text><circle cx="238.0" cy="320.9112903225806" r="3.7" fill="#20364b"/><text x="245.0" y="312.9112903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(-1, 1)</text><circle cx="340.8225806451613" cy="218.08870967741936" r="3.7" fill="#20364b"/><text x="347.8225806451613" y="210.08870967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2, 4)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los puntos comunes cumplen ∣x+1∣=3, de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">donde x=−4 y x=2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La base horizontal entre esos puntos</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mide 6. El vértice de g está en</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−1,1), a distancia 3 de la base.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La región es un triángulo y su área es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">6·3/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>