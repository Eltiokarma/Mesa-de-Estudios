<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Suma de cuadrados de la fila veinte</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="343.70,209.64 368.82,209.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="343.70,247.31 368.82,247.31" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="343.70,284.99 368.82,284.99" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="343.70,322.66 368.82,322.66" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="170.69564146761883" y="208.3357547402118" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="382.0967741935484" y="208.3357547402118" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F1</text><text x="149.76483624722977" y="246.0112041369121" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="191.6264466880079" y="246.0112041369121" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">9</text><text x="382.0967741935484" y="246.0112041369121" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F2</text><text x="128.8340310268407" y="283.6866535336124" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">16</text><text x="170.69564146761883" y="283.6866535336124" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">25</text><text x="212.55725190839698" y="283.6866535336124" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">36</text><text x="382.0967741935484" y="283.6866535336124" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F3</text><text x="107.90322580645164" y="321.36210293031274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">49</text><text x="149.76483624722977" y="321.36210293031274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">64</text><text x="191.6264466880079" y="321.36210293031274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">81</text><text x="233.48805712878604" y="321.36210293031274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">100</text><text x="382.0967741935484" y="321.36210293031274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay 190 elementos antes de la fila 20</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 210 hasta su final.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se suman 191²+…+210². Usar</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Q(m)=m(m+1)(2m+1)/6.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Q(210)−Q(190)=804670.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>