<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">105 · Signos de dos diferencias de módulos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Componentes en escalas separadas</text><line x1="60" y1="200" x2="425" y2="200" stroke="#8295a8" stroke-width="2"/><line x1="123.3333333333333" y1="200" x2="356.6666666666667" y2="200" stroke="#1766b0" stroke-width="6"/><circle cx="123.3333333333333" cy="200" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="123.3333333333333" y="235" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">7/5</text><circle cx="356.6666666666667" cy="200" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="356.6666666666667" y="235" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">5/3</text><line x1="60" y1="290" x2="425" y2="290" stroke="#8295a8" stroke-width="2"/><line x1="123.33333333333334" y1="290" x2="356.6666666666667" y2="290" stroke="#1766b0" stroke-width="6"/><circle cx="123.33333333333334" cy="290" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="123.33333333333334" y="325" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">-11</text><circle cx="356.6666666666667" cy="290" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="356.6666666666667" y="325" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">1</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada diferencia de módulos tiene el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mismo signo que la diferencia de sus</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrados. Los factores de arriba son</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(x+11)(3x−5).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Abajo aparecen (7−5x)(9x−9). Se</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">excluyen sus raíces 1 y 7/5.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los tramos de signo no negativo son</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[−11,1) y (7/5,5/3], incluyendo los</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ceros del numerador.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>