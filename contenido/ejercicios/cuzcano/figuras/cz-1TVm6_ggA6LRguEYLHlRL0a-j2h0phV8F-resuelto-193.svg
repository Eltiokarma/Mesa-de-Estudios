<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">193 · Punto exterior y distancia al punto medio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.09,332.96 262.36,206.04 365.64,332.96 111.09,332.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="111.09,332.96 156.54,235.50 365.64,332.96" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="156.54,235.50 314.00,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="343.8668178317789" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="262.3646787028322" y="194.4058783263455" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="344.5941216736545" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="156.5419697099341" y="220.95246855480448" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="327.09472062975965" y="268.22721827671774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="324.18550526225727" y="324.22961410113805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe AC = s, AB = b y ∠PCA = t. En</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la disposición descrita, toma A =</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,0), C = (s,0), P = (s sen²t,s sen t</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos t) y B = (b sen 2t,b cos 2t).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector 2PM es B + C − 2P. Por las</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fórmulas de ángulo doble, sus</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes son b sen 2t + s cos 2t y</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b cos 2t − s sen 2t.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos vectores de esa suma son</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares y miden b y s. Así 2PM</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= √(b² + s²) = 6, de donde PM = 3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>