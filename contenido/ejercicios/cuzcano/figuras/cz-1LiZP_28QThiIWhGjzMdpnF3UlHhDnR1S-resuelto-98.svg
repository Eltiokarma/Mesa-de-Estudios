<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">098 · Tanque cónico con dos salidas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,387.01 218.41,151.99 335.93,387.01 100.90,387.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="159.66,269.50 277.17,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="277.17,269.50 320.26,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="335.93,387.01 375.10,387.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="225.4147465437788" y="143.9884792626728" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A · entrada</text><text x="311.58986175115206" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B · mitad</text><text x="346.84331797235023" y="377.05299539170505" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C · base</text><text x="194.07834101382488" y="230.1635944700461" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1/8 del volumen</text><text x="182.32718894009216" y="332.0069124423963" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">7/8 del volumen</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La parte superior es un cono a escala</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/2, con 1/8 del volumen. Hasta B se</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">llena 7/8 con caudal 1/2−1/8=3/8, en</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">7/3 h.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sobre B, su desagüe resta</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1/8)/4=1/32. El nuevo caudal neto es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">11/32 del tanque por hora.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El último 1/8 toma 4/11 h. Total:</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">7/3+4/11=89/33 h.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>