<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">069 · Distancia desde el origen de una ruta hasta un punto observado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="180.39,396.52 180.39,219.24 224.70,142.48 269.02,219.24 313.34,219.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="180.39,396.52 313.34,219.24" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="180.3867745471126" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="180.3867745471126" y="219.24466610029685" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="224.7046402801029" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="269.0225060130932" y="219.24466610029685" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="313.3403717460835" y="219.24466610029685" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="162.65962825391648" y="307.88039756627745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">200 m</text><text x="297.385940082207" y="203.29023443642035" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">este</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En los dos tramos oblicuos las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes norte y sur se cancelan.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada tramo avanza 50 m al este.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El pie del edificio está 100 m al este</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 200 m al norte de la casa. La</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">depresión de 45° añade 50 m al este.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto está a desplazamiento</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(150,200) m. Aplica Pitágoras.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>