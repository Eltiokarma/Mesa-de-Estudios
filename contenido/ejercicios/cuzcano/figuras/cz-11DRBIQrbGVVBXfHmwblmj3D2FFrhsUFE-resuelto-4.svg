<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Ángulos con dos rectas paralelas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,290.78 169.76,179.35 375.10,299.55" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,290.78 323.76,330.85" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="124.69,150.56 159.75,334.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="254.90,168.09 283.70,370.91" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="120.93563116806595" y="279.5162026808071" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="142.22006186478126" y="195.63050522904692" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="183.5368979231109" y="200.6386065694505" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="296.2191780821918" y="261.98784798939454" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50°</text><text x="312.4955074385035" y="348.3775961113565" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="157.244365885992" y="350.88164678155835" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m</text><text x="286.2029754013846" y="388.44240683458526" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Traslada 50° de n a m mediante el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelismo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segmento perpendicular a esa</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">transversal forma con m el complemento</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=40°. La otra transversal proporciona</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2θ=80° como ángulo interior del</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta 40° y 80° de 180°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>