<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">023 · Partición sin solapamientos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">categorías</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">cantidad</text><polyline points="100.90,396.52 100.90,294.90 125.83,294.90 125.83,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="150.76,396.52 150.76,142.48 175.68,142.48 175.68,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="200.61,396.52 200.61,233.94 225.54,233.94 225.54,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="250.46,396.52 250.46,345.71 275.39,345.71 275.39,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="300.32,396.52 300.32,376.19 325.24,376.19 325.24,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="350.17,396.52 350.17,274.58 375.10,274.58 375.10,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="113.366568914956" cy="294.9032258064516" r="3.7" fill="#20364b"/><text x="120.366568914956" y="286.9032258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">10</text><circle cx="163.2199413489736" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="170.2199413489736" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">25</text><circle cx="213.07331378299122" cy="233.93548387096774" r="3.7" fill="#20364b"/><text x="220.07331378299122" y="225.93548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">16</text><circle cx="262.9266862170088" cy="345.7096774193548" r="3.7" fill="#20364b"/><text x="269.9266862170088" y="337.7096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5</text><circle cx="312.78005865102637" cy="376.19354838709677" r="3.7" fill="#20364b"/><text x="319.78005865102637" y="368.19354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><circle cx="362.633431085044" cy="274.58064516129036" r="3.7" fill="#20364b"/><text x="369.633431085044" y="266.58064516129036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">12</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los cinco grupos descritos son</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">disjuntos: los dos primeros pueden</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agrupar varias regiones, pero no se</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">solapan entre sí ni con los restantes.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Contienen 10+25+16+5+2=58 alumnos.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El complemento de esos grupos es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exactamente el solicitado:70−58=12.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>