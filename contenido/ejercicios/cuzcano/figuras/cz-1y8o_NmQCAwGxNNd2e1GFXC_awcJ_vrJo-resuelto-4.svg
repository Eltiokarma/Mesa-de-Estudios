<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Mayor base media entera con diagonales dadas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.34,350.83 134.83,188.64 241.25,188.64 369.06,350.83 108.34,350.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="134.83,188.64 369.06,350.83" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="108.34,350.83 241.25,188.64" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="121.82,269.96 304.92,269.96" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="121.82,269.96 238.93,350.83 304.92,269.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645159" y="361.0527610716239" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="133.89939857845815" y="177.48250410060137" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="240.78840896664843" y="177.48250410060137" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="375.0967741935484" y="360.58802624384913" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="113.91580098414433" y="266.71159103335157" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="311.89283761618367" y="266.2468562055768" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="239.85893931109896" y="361.5174958993986" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="185.9496992892291" y="244.40431930016402" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6</text><text x="229.17003827227992" y="247.6574630945872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7</text><text x="215.69272826681245" y="279.25943138326954" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama D y O a los puntos medios de los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lados no paralelos y R al punto medio</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la base inferior. Por el teorema de</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los puntos medios, DR=7/2 y RO=3.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo DRO, la desigualdad</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triangular da DO&lt;7/2+3=6,5, así que el</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">máximo entero posible es a lo sumo 6.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se alcanza con bases 8 y 4, tomando</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyecciones horizontales de las</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diagonales de 131/24 y 157/24. La</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">misma altura positiva h satisface</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h²=36−(131/24)²=49−(157/24)².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>