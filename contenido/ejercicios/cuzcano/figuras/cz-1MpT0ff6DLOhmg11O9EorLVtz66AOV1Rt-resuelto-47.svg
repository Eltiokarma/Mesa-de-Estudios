<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">047 · Recta que atraviesa las esquinas de dos cuadrados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="360.89784946236557" x2="421" y2="360.89784946236557" stroke="#20364b" stroke-width="1.7"/><line x1="192.3010752688172" y1="105" x2="192.3010752688172" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,360.90 100.90,269.50 192.30,269.50 192.30,360.90 100.90,360.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">PARO</text><polyline points="192.30,178.10 375.10,178.10 375.10,360.90 192.30,360.90 192.30,178.10" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">TUBO</text><polyline points="100.90,269.50 375.10,178.10" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">L</text><circle cx="100.90322580645162" cy="360.89784946236557" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="352.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="100.90322580645162" cy="269.5" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="192.3010752688172" cy="269.5" r="3.7" fill="#20364b"/><text x="199.3010752688172" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="192.3010752688172" cy="360.89784946236557" r="3.7" fill="#20364b"/><text x="199.3010752688172" y="352.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="192.3010752688172" cy="178.1021505376344" r="3.7" fill="#20364b"/><text x="199.3010752688172" y="170.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="375.09677419354836" cy="178.1021505376344" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="170.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">U</text><circle cx="375.09677419354836" cy="360.89784946236557" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="352.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cuadrado a la derecha tiene lado 8.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así B=(8,0) y U=(8,8).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia restante de P a O es 4,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de modo que P=(−4,0) y A=(−4,4).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de AU es (8−4)/(8+4)=1/3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa cualquiera de los dos puntos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>