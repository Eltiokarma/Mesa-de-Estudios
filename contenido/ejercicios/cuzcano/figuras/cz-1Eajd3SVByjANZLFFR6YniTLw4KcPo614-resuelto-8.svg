<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Reflexión y bisectriz exterior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,281.55 288.18,231.36 327.91,220.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="288.18,231.36 375.10,281.55 238.00,318.28 100.90,281.55" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,281.55 238.00,281.55 259.21,281.55 375.10,281.55" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,281.55 238.00,318.28" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="288.18,231.36 259.21,281.55 238.00,318.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645164" y="281.5454545283436" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="288.1809021317375" y="231.36455239660614" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.09677419354836" y="281.5454545283436" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="238.00000000000003" y="318.2804244584169" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="259.20894477780064" y="281.5454545283436" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="238.00000000000003" y="281.5454545283436" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="243.75806451612908" y="302.92558574873954" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="227.85483870967744" y="291.96480936705336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="342.1935483870967" y="272.77126097995654" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="335.33870967741933" y="286.7551319476985" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="276.93896664786655" y="243.42906852563834" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ψ</text><text x="305.72928922851173" y="234.6548749772513" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ψ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja U sobre PR y llama E a su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">imagen. Como PR biseca el ángulo en P,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E está en PO. Por simetría, RE forma θ</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con RP y biseca ∠ORD.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EA=AU, de modo que DE y DU se reflejan</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en PR. Con la bisectriz exterior de O,</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E es el excentro de DRO opuesto a R.</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así DE biseca el exterior de D.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo entre DE y DO mide 2x en el</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">isósceles EDU. Por la bisectriz</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también vale ∠EDA. En EAD se cumple</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠EDA+x=90°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>