<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">083 · Cuántos términos tienen exponentes enteros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="86.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">j</text><rect x="124.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="162.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="200.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="238.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">6</text><rect x="276.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="314.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">12</text><rect x="352.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="390.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">18</text><rect x="48.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="86.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">x</text><rect x="124.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="162.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">12</text><rect x="200.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">11</text><rect x="276.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="314.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">10</text><rect x="352.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">9</text><rect x="48.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="86.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">y</text><rect x="124.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="162.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">6</text><rect x="200.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">7</text><rect x="276.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="314.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">8</text><rect x="352.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">9</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Comprobación del término</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los exponentes de x e y son 12−j/6 y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">6+j/6.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambos son enteros justo cuando j es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">múltiplo de 6. En el intervalo 0≤j≤18</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también son no negativos.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los índices admisibles son 0, 6, 12 y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">18.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>