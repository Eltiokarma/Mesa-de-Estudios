<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">063 · Área de una proyección que conserva un cateto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="195.90,150.95 267.56,379.52 137.26,379.52" fill="#f4c581" fill-opacity="0.45"/><polygon points="195.90,335.22 267.56,379.52 137.26,379.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,388.05 293.89,388.05 375.10,326.70 182.11,326.70 100.90,388.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="195.90,150.95 267.56,379.52 137.26,379.52 195.90,150.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="195.90,150.95 195.90,335.22 267.56,379.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="195.90,335.22 137.26,379.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="195.8985443301737" y="150.95032295838655" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="267.56336389235605" y="379.5237746329337" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="137.26369196111546" y="379.5237746329337" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="195.8985443301737" y="335.22188617631184" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A′</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como la proyección conserva BC, esa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dirección es paralela al plano. AC era</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a BC, así que su</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección también lo es.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La proyección es recta en C′ y tiene</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un ángulo agudo de 45°. Sus catetos</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son iguales. Miden BC=18tan30°=6√3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula la mitad del cuadrado de ese</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cateto.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>