<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Mediana entre dos triángulos equiláteros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.84,338.43 154.82,252.94 204.11,337.66 107.84,338.43" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="204.11,337.66 284.21,197.49 365.85,337.66 204.11,337.66" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="154.82,252.94 284.21,197.49" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="154.82,252.94 365.85,337.66" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="204.11,337.66 261.88,295.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645163" y="347.6759695541863" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="203.3407031533164" y="348.44617615077925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="346.13555636100034" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="151.73686118158753" y="246.00869880391446" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="284.9826023921711" y="190.55382384922072" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="264.95723088075385" y="286.0594418267488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="218.74483508517577" y="222.13229430953243" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16</text><text x="235.6893802102211" y="311.4762595143168" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">BM</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prolonga EB hasta N, con BN=BE. En</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">torno a B, ∠NBC=∠EBF=60° y BC=BF.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por lado-ángulo-lado, NBC y EBF son</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">congruentes. Así NC=EF=16.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En NEC, B es punto medio de EN y M de</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EC. Por el teorema de segmentos</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medios, BM=NC/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>