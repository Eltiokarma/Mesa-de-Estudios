tart">recta 1</text><polyline points="100.90,396.52 375.10,176.11" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="498" font-family="Arial,sans-serif" font-size="12" fill="#008674" text-anchor="start">perpendicular</text><circle cx="303.1122585780241" cy="233.9740327587722" r="3.7" fill="#20364b"/><text x="310.1122585780241" y="225.9740327587722" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">r=2+√10</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=5−(x−2)²/2; su raíz positiva es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r=2+√10.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La primera pendiente es −3/r; la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular tiene pendiente r/3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La segunda es y=(r/3)x−r²/3. Con</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r≈5,1: y≈1,7x−8,67.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>