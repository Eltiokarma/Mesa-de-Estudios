.00,218.42 115.61,296.54" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="155.38,266.50 115.61,296.54" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="257.88,142.48 186.31,196.56" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="257.88,342.44 186.31,396.52" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="296.76404534878213" y="266.4955224934457" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="360.3882748993433" y="218.42388238857728" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="219.00109812031857" y="218.42388238857728" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="155.3768685697574" y="266.4955224934457" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="257.88257173455037" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="257.88257173455037" y="342.4355339142811" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="186.30531349016906" y="296.54029755898847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="328.5761601240627" y="242.4597024410115" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Representa los vértices como ±r e₁, ±r</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">e₂ y ±r e₃, con r=2√2. Proyecta a lo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">largo de la dirección e₁−e₂ de una</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arista.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los cuatro vértices de los ejes e₁,e₂</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se proyectan en dos puntos a distancia</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r√2=4. Los dos del tercer eje</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conservan su separación 2r=4√2.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Estos dos pares son los extremos de</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las diagonales perpendiculares del</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rombo proyectado. Multiplica las</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diagonales y divide entre 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>