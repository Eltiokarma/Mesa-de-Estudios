<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Ángulo de una bisectriz exterior desde dos alturas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="251.62,227.44 222.45,243.72 205.44,253.22 100.90,311.56" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,311.56 238.00,311.56 375.10,311.56 222.45,243.72" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="222.45,243.72 238.00,311.56" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,311.56 205.44,253.22" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,311.56 231.16,281.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="222.4529431326904" y="243.72015297638842" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="100.9032258064516" y="311.5618556701031" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.0" y="311.5618556701031" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.0967741935484" y="311.5618556701031" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="205.43598270701696" y="253.2179913535085" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="231.15929497838374" y="281.71150648486866" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="240.70236115729963" y="283.27186564682404" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="266.27868307283006" y="253.6928832723645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="219.7731958762887" y="283.4753907549052" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="164.95710009976722" y="294.940638510143" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="304.47356168939143" y="287.85118057864986" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambas alturas se obtienen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplicando BD y BA por el mismo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">seno de ∠ABD. Por tanto BA/BD=8/4=2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el teorema de la bisectriz</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior, CA/CD=2, así que D es punto</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio de AC. La distancia de C a la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recta AB es el doble de la de D, o sea</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">8.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como C está sobre la bisectriz, su</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia a BD también es 8. Divide</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por BC=10 para obtener sen θ=4/5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>