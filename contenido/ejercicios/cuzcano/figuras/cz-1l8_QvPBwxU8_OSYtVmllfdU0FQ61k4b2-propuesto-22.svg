<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">022 · Clasificación de la glucosa en proyección de Fischer</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,152.38 238.00,383.93" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="197.53,224.31 278.47,224.31" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="197.53,269.28 278.47,269.28" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="197.53,314.24 278.47,314.24" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="197.53,359.20 278.47,359.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="238.0" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CHO</text><text x="238.0" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₂OH</text><text x="188.99200685127033" y="224.31373108763918" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="188.99200685127033" y="269.2751926919783" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">OH</text><text x="188.99200685127033" y="314.23665429631745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="188.99200685127033" y="359.1981159006566" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="287.00799314872967" y="224.31373108763918" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">OH</text><text x="287.00799314872967" y="269.2751926919783" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="287.00799314872967" y="314.23665429631745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">OH</text><text x="287.00799314872967" y="359.1981159006566" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">OH</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El carbono superior es un aldehído.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los grupos OH muestran la función</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcohol y hay seis carbonos, de modo</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que es una aldohexosa.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se trata de una unidad de azúcar, con</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fórmula molecular C₆H₁₂O₆.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Un monosacárido no se hidroliza a</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">monosacáridos más pequeños en esta</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">clasificación.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>