<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">388 · Curva exponencial con máximo en un eje de simetría desplazado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="192.30107526881721" y1="105" x2="192.30107526881721" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.48 105.47,396.46 110.04,396.42 114.61,396.34 119.18,396.22 123.75,396.03 128.32,395.72 132.89,395.24 137.46,394.51 142.03,393.43 146.60,391.86 151.17,389.64 155.74,386.57 160.31,382.40 164.88,376.88 169.45,369.74 174.02,360.73 178.59,349.64 183.16,336.33 187.73,320.76 192.30,303.06 196.87,283.51 201.44,262.57 206.01,240.89 210.58,219.28 215.15,198.68 219.72,180.04 224.29,164.35 228.86,152.44 233.43,145.01 238.00,142.48 242.57,145.01 247.14,152.44 251.71,164.35 256.28,180.04 260.85,198.68 265.42,219.28 269.99,240.89 274.56,262.57 279.13,283.51 283.70,303.06 288.27,320.76 292.84,336.33 297.41,349.64 301.98,360.73 306.55,369.74 311.12,376.88 315.69,382.40 320.26,386.57 324.83,389.64 329.40,391.86 333.97,393.43 338.54,394.51 343.11,395.24 347.68,395.72 352.25,396.03 356.82,396.22 361.39,396.34 365.96,396.42 370.53,396.46 375.10,396.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">e^(2x−x²)</text><circle cx="192.30107526881721" cy="303.06288389596426" r="3.7" fill="#20364b"/><text x="199.30107526881721" y="295.06288389596426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,1)</text><circle cx="238.0" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="245.0" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,e)</text><circle cx="283.69892473118284" cy="303.06288389596426" r="3.7" fill="#20364b"/><text x="290.69892473118284" y="295.06288389596426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2,1)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completa cuadrado: 2x−x²=1−(x−1)². El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mayor exponente es 1, en x=1.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La curva es simétrica alrededor de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=1. Pasa por (0,1) y (2,1) y alcanza</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">e en el centro.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El exponente tiende a −∞ hacia ambos</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos. La curva se acerca al eje x</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde arriba.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>