<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Ángulo entre tangente y secante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="323.36,265.62 323.04,273.74 322.09,281.81 320.50,289.77 318.30,297.59 315.49,305.22 312.08,312.59 308.11,319.68 303.60,326.44 298.57,332.82 293.06,338.78 287.09,344.30 280.71,349.33 273.96,353.84 266.87,357.81 259.49,361.21 251.87,364.03 244.05,366.23 236.08,367.82 228.01,368.77 219.89,369.09 211.77,368.77 203.71,367.82 195.74,366.23 187.92,364.03 180.30,361.21 172.92,357.81 165.83,353.84 159.08,349.33 152.69,344.30 146.73,338.78 141.21,332.82 136.18,326.44 131.67,319.68 127.70,312.59 124.30,305.22 121.49,297.59 119.28,289.77 117.70,281.81 116.74,273.74 116.42,265.62 116.74,257.50 117.70,249.43 119.28,241.47 121.49,233.65 124.30,226.02 127.70,218.65 131.67,211.56 136.18,204.80 141.21,198.42 146.73,192.46 152.69,186.94 159.08,181.91 165.83,177.40 172.92,173.43 180.30,170.03 187.92,167.21 195.74,165.01 203.71,163.42 211.77,162.47 219.89,162.15 228.01,162.47 236.08,163.42 244.05,165.01 251.87,167.21 259.49,170.03 266.87,173.43 273.96,177.40 280.71,181.91 287.09,186.94 293.06,192.46 298.57,198.42 303.60,204.80 308.11,211.56 312.08,218.65 315.49,226.02 318.30,233.65 320.50,241.47 322.09,249.43 323.04,257.50 323.36,265.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,369.09 375.10,369.09" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="116.42,387.20 116.42,151.80" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="116.42,369.09 309.50,317.35 219.89,369.09" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="116.42361533779672" y="387.196287279367" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="219.89287888009738" y="387.196287279367" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="168.15824710894705" y="342.18715763846626" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="320.7754108338405" y="316.3198417528911" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="281.9744370054778" y="330.28819233110164" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ángulo inscrito, el arco AB mide</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x y el arco BC mide 4x. El ángulo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior en O es (4x−2x)/2=x.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠BOC=∠OCB, el triángulo OBC es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">isósceles con OB=BC. OB es un radio,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que BC es una cuerda de longitud</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igual al radio y subtiende 60°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala 4x=60°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>