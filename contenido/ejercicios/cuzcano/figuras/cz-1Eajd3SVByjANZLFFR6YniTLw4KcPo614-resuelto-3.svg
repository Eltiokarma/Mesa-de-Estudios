<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Reconocer el excentro a partir de dos ángulos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="152.35,322.64 172.14,268.25 191.03,216.36 375.10,322.64 152.35,322.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="152.35,322.64 100.90,249.17 191.03,216.36" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,249.17 172.14,268.25 375.10,322.64" fill="none" stroke="#008674" stroke-width="2.5"/><text x="152.34743152834028" y="322.6362372369577" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="191.02744895866027" y="216.3637627630423" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.09677419354836" y="322.6362372369577" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="100.90322580645162" y="249.1662973768112" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="172.14081872153105" y="268.25435286914376" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="144.77395387772316" y="298.1338095437848" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">55°</text><text x="171.72662434021336" y="307.0437832503932" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">70°</text><text x="176.54874168542176" y="229.72872332295475" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50°</text><text x="203.72416149057713" y="234.18371017625893" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">80°</text><text x="186.61952599476956" y="280.5055667157302" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el dibujo, ∠EDO=55° y el ángulo de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">70° está entre DO y DR. Como</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2·55°+70°=180°, DE es una bisectriz</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior en D.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Análogamente, 2·50°+80°=180° hace a OE</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisectriz exterior en O. E es el</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">excentro opuesto a R, con RE bisectriz</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interior. El ángulo R es 30°.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En DRE, el ángulo en D mide 125° y el</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de R mide 15°, así que ∠DER=40°. En</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DEI, el exterior ∠DIR vale 55°+40°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>