<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">020 · Segmento paralelo en un trapecio interior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="106.69,338.65 152.47,211.91 299.44,211.91 369.31,337.69 106.69,338.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="106.69,338.65 299.44,211.91" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="203.06,275.04 241.61,338.17" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="222.34,306.85 258.96,211.91" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="241.61,338.17 299.44,211.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="203.06,275.04 224.27,211.91" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="293.18,216.73 297.03,222.52 303.30,218.66" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645157" y="346.84281988774876" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="146.2005782640739" y="204.2043483190657" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="299.9224445830263" y="202.2768014059754" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="344.43338624638585" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="241.6141504620443" y="347.32470661602133" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="196.316798004422" y="272.63226373377177" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="216.07415386359767" y="314.556409093486" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="259.4439594081297" y="202.75868813424796" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="223.78434151595891" y="203.24057486252056" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="223.30245478768634" y="191.6752933839787" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">BC=8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea α=∠BAC. La condición</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">complementaria da ∠CAD=α y, como M es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto medio de la hipotenusa AD,</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MA=MC. Así ∠ACM=α y AB∥CM.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como AM∥BC, ABCM es un paralelogramo.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su diagonal AC biseca ∠BAM, luego es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un rombo y CM=AB=8.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde E traza EL∥AB hasta BC. En ABC,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EL=AB/2=4. En el trapecio ELCM, QR es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la base media de los lados paralelos</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EL y CM y mide (4+8)/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>