365.00 327.81,359.31 333.50,353.25 338.77,346.82 343.61,340.07 348.00,333.01 351.92,325.68 355.35,318.11 358.28,310.33 360.69,302.37 362.58,294.28 363.93,286.08 364.74,277.81 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="215.94388065924068" y="394.58646862856676" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="112.21998320419567" y="287.1772285493631" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="182.31979385541956" y="155.33865944183964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="329.36775689785287" y="181.2671827844418" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="350.14858538329116" y="329.13046059578846" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="203.10062234085788" y="303.2019372531863" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="164.0819319317182" y="340.88184858896494" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="166.74836668619298" y="290.7520779121213" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el lado vale s, la diagonal ES mide</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2s cos 36°=(1+√5)s/2. Por tanto</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">s=2(√5−1).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como P está en la mediatriz, PI=PN.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Además, ∠NIP=36° por ángulo inscrito.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La base NI mide 2PI cos 36°. Sustituye</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el lado s y simplifica.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>