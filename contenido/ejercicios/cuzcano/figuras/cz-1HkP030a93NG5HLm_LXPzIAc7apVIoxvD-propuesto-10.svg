<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Tapón sostenido por presión exterior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="143.91397849462365" y1="105" x2="143.91397849462365" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="143.91,208.34 143.91,396.52 332.09,396.52 332.09,208.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">recipiente</text><polyline points="143.91,274.20 332.09,274.20" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">nivel exterior</text><polyline points="219.18,142.48 219.18,349.47 256.82,349.47 256.82,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">tubo</text><polyline points="219.18,349.47 256.82,349.47" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">tapón</text><polyline points="219.18,293.02 256.82,293.02" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="503" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">agua interior</text><circle cx="237.99999999999997" cy="368.2903225806452" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="360.2903225806452" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">tapón 2g</text><circle cx="261.52150537634407" cy="170.70967741935482" r="3.7" fill="#20364b"/><text x="268.52150537634407" y="162.70967741935482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">agua</text><circle cx="153.32258064516128" cy="255.38709677419357" r="3.7" fill="#20364b"/><text x="160.32258064516128" y="247.38709677419357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">ρ0,7</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el umbral, presión exterior</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilibra peso del tapón más columna</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interior:0,7·10·4=2+Vagua en gramos</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivalentes.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Vagua=28−2=26 cm³.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">26 cm³ es umbral de equilibrio; para</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separación efectiva sin perturbación</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se requiere superar ese valor.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>