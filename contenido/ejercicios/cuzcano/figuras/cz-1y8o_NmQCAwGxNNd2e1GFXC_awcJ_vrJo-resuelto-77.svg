<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">077 · Distancia entre puntos medios de diagonales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.75,351.59 161.65,215.32 291.36,182.48 370.17,351.59 110.75,351.59" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="161.65,215.32 161.65,351.59" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="291.36,182.48 291.36,351.59" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.75,351.59 291.36,182.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="161.65,215.32 370.17,351.59" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="201.06,267.04 265.91,283.46" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="363.08701950936836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="153.44330693451803" y="208.75053119567318" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="291.3610198956925" y="172.6292254201275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="359.8032644388642" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="158.36893954027428" y="366.3707745798725" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="291.3610198956925" y="366.3707745798725" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="199.4158779215762" y="258.00685725323547" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="270.0166119374154" y="290.844407958277" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="227.32779602086146" y="190.68987830790036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16</text><text x="237.17906123237393" y="287.56065288777285" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma AD como eje horizontal y escribe</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B→C=(u,v). Por el orden E,F, u=EF&gt;0 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">u²+v²=16².</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sean P y O los puntos medios de AC y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BD. El vector O→P es (A+C−B−D)/2. Como</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A→D=(2u,0), resulta O→P=(−u/2,v/2).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La reflexión horizontal del vector B→C</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva su longitud. Por tanto</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PO=BC/2=8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>