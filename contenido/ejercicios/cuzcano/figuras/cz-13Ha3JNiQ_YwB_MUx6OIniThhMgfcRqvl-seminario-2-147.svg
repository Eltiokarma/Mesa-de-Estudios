 width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">HNO₂</text><rect x="238.0" y="322" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">H–O–N=O</text><rect x="48.0" y="370" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">PO₄³⁻</text><rect x="238.0" y="370" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">P con 4 P–O simples</text><text x="48" y="445" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Esqueletos de las alternativas</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CO₂ tiene 4+2×6=16 electrones de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valencia.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La opción C dibuja 6 electrones en</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enlaces y 12 como pares libres, total</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">18.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O=C=O usa 8 electrones en enlaces y 8</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en los pares libres de ambos oxígenos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>