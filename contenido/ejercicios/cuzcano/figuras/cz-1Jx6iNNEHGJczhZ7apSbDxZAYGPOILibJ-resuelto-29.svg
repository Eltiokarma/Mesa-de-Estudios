.87 321.95,302.06 324.94,298.10 327.56,294.02 329.80,289.82 331.64,285.53 333.08,281.16 334.11,276.73 334.73,272.27 334.94,267.79" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,363.75 100.90,175.25" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,363.75 375.10,175.25" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,336.33 238.00,199.24" fill="none" stroke="#b0467a" stroke-width="2.5"/><circle cx="238.0" cy="267.7862903225806" r="3.7" fill="#20364b"/><text x="245.0" y="259.7862903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C(0,k)</text><circle cx="100.90322580645162" cy="218.08870967741936" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="210.08870967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">x = −8</text><circle cx="375.0967741935484" cy="218.08870967741936" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="210.08870967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">x = 8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro tiene abscisa 0. Su ordenada</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k es libre. El eje mayor es horizontal</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y b=4.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La separación al centro de cada</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">directriz es a²/c=8. Pon A=a².</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces A²=64(A−16), o (A−32)²=0.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así a²=32. Sustituye el centro (0,k) y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b²=16.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>