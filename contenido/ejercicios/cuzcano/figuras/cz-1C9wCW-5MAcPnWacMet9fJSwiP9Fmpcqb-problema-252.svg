<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">252 · Densidad de líquido en tubo U</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="351.6869070208728" x2="421" y2="351.6869070208728" stroke="#20364b" stroke-width="1.7"/><line x1="178.22770398481973" y1="105" x2="178.22770398481973" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="178.23,142.48 178.23,396.52 297.77,396.52 297.77,232.14" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">tubo U</text><polyline points="178.23,351.69 178.23,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">columna L</text><polyline points="297.77,396.52 297.77,321.80" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="498" font-family="Arial,sans-serif" font-size="12" fill="#008674" text-anchor="start">Hg derecho</text><polyline points="178.23,351.69 297.77,351.69" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="498" font-family="Arial,sans-serif" font-size="12" fill="#b0467a" text-anchor="start">cota interfaz</text><circle cx="178.22770398481973" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="185.22770398481973" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">L:14 cm</text><circle cx="297.77229601518025" cy="321.8007590132827" r="3.7" fill="#20364b"/><text x="304.77229601518025" y="313.8007590132827" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Hg:+2 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A igual cota en el Hg las presiones</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coinciden.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ρL g·14=ρHg g·2, usando cm en ambos</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lados.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ρL=13,6·2/14≈1,943 g/cm³.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>