<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">055 · Una corriente se divide entre dos arcos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="362.02,269.58 361.36,282.44 359.41,295.17 356.19,307.63 351.72,319.70 346.05,331.26 339.24,342.19 331.36,352.37 322.48,361.70 312.72,370.09 302.15,377.44 290.89,383.69 279.06,388.77 266.78,392.62 254.16,395.21 241.36,396.52 228.48,396.52 215.67,395.21 203.06,392.62 190.78,388.77 178.95,383.69 167.69,377.44 157.12,370.09 147.35,361.70 138.48,352.37 130.60,342.19 123.79,331.26 118.12,319.70 113.65,307.63 110.42,295.17 108.47,282.44 107.82,269.58 108.47,256.72 110.42,244.00 113.65,231.53 118.12,219.46 123.79,207.90 130.60,196.97 138.48,186.79 147.35,177.46 157.12,169.08 167.69,161.72 178.95,155.47 190.78,150.40 203.06,146.54 215.67,143.95 228.48,142.65 241.36,142.65 254.16,143.95 266.78,146.54 279.06,150.40 290.89,155.47 302.15,161.72 312.72,169.08 322.48,177.46 331.36,186.79 339.24,196.97 346.05,207.90 351.72,219.46 356.19,231.53 359.41,244.00 361.36,256.72 362.02,269.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="234.92,269.58 171.37,159.51" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="234.92,269.58 298.47,159.51" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="114.75,154.81 162.51,154.81" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="149.42,149.42 162.51,154.81 149.42,160.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="307.33,154.81 355.08,154.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="341.99,149.42 355.08,154.81 341.99,160.20" fill="none" stroke="#008674" stroke-width="2.5"/><text x="160.97109483553743" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="308.8665927513056" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="234.9188437934215" y="237.22942432003092" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="368.1788497279418" y="318.10977474271664" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙ B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El arco inferior abarca 300°, por lo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que su longitud y su resistencia son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cinco veces mayores.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos ramas tienen el mismo voltaje</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre A y C. Por la ley de Ohm,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I_inferior=I_superior/5.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En campo uniforme, las dos ramas</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">comparten el mismo vector efectivo</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A→C. La fuerza es proporcional a la</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corriente y apunta hacia abajo en</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ambas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>