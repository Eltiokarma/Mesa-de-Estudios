<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">217 · Amplitud desde posición y rapidez</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (cm)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">rapidez (cm/s)</text><polyline points="100.90,396.52 105.47,331.47 110.04,305.32 114.61,285.79 119.18,269.78 123.75,256.09 128.32,244.10 132.89,233.42 137.46,223.81 142.03,215.10 146.60,207.17 151.17,199.93 155.74,193.29 160.31,187.21 164.88,181.63 169.45,176.52 174.02,171.84 178.59,167.57 183.16,163.69 187.73,160.18 192.30,157.01 196.87,154.18 201.44,151.68 206.01,149.50 210.58,147.62 215.15,146.04 219.72,144.75 224.29,143.76 228.86,143.05 233.43,142.63 238.00,142.48 242.57,142.63 247.14,143.05 251.71,143.76 256.28,144.75 260.85,146.04 265.42,147.62 269.99,149.50 274.56,151.68 279.13,154.18 283.70,157.01 288.27,160.18 292.84,163.69 297.41,167.57 301.98,171.84 306.55,176.52 311.12,181.63 315.69,187.21 320.26,193.29 324.83,199.93 329.40,207.17 333.97,215.10 338.54,223.81 343.11,233.42 347.68,244.10 352.25,256.09 356.82,269.78 361.39,285.79 365.96,305.32 370.53,331.47 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">curva de energía</text><circle cx="306.5483870967742" cy="176.51774016766285" r="3.7" fill="#20364b"/><text x="313.5483870967742" y="168.51774016766285" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">estado dado</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ω=√(32/0,5)=8 rad/s.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En MAS, v²=ω²(A²−x²), así</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A²=x²+(v/ω)².</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En cm: A²=2²+(16√3/8)²=16; A=4 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>