<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Distancia de un vértice a una bisectriz</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="153.32,269.50 209.77,142.48 322.68,396.52 153.32,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="209.77,142.48 209.77,269.50 209.77,311.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="153.32,269.50 209.77,269.50 266.23,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><text x="153.32258064516128" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="209.77419354838707" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="322.6774193548387" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="209.77419354838707" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="209.77419354838707" y="311.83870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="184.3709677419355" y="261.73790322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">AH</text><text x="172.375" y="277.26209677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="225.29838709677418" y="261.0322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A′</text><text x="218.52419354838707" y="210.22580645161293" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">9</text><text x="273.2822580645161" y="354.1774193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja A sobre BD. Su imagen A′ queda</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en el rayo BC y H es el punto medio de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AA′.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con BD vertical, H=(0,0), B=(0,9),</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=(−x,0) y A′=(x,0). En la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">configuración interior, C queda por</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">debajo de H. El modelo notable 3–4–5</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da un avance horizontal de 12 y un</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como A′ está a mitad de altura entre B</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y C, también queda a mitad de sus</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abscisas. Así C=(2x,−9), y el avance</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de A a C es 3x=12.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>