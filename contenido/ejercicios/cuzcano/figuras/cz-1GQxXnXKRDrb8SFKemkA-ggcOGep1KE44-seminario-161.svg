b"/><text x="107.90322580645162" y="331.6432354357246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−5,0)</text><circle cx="311.8213399503722" cy="263.81271064034667" r="3.7" fill="#20364b"/><text x="318.8213399503722" y="255.81271064034667" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(5,4)</text><circle cx="206.36228287841192" cy="263.81271064034667" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="213.36228287841192" y="255.81271064034667" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="227.45409429280397" cy="142.48387096774195" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="234.45409429280397" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="311.8213399503722" cy="339.6432354357246" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="318.8213399503722" y="331.6432354357246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="375.0967741935484" cy="396.51612903225805" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="382.0967741935484" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada tramo es estrictamente monótono.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El primero recorre [0,4) y el tercero</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recorre (−3,0), por lo que no se</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superponen.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rango del segundo es [8/5+k,8+k).</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para evitar el rango [0,4), su mínimo</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">debe ser al menos 4.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La igualdad se permite porque el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primer tramo excluye el 4. Resuelve</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k≥4−8/5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>