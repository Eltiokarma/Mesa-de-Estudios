<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Progresión aritmética con una exclusión de dominio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Valores posibles de x módulo π/2</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="135.0" y1="275" x2="275.0" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="135.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="275.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><line x1="275.0" y1="275" x2="345.0" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="275.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="345.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="135.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">0</text><text x="275.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/4</text><text x="345.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">3π/8</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea t=tan x y v=tan y. La progresión</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da 2(t−v)/(1+tv)=t−v. Como t−v≠0,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda tv=1 y por tanto x+y=π/2+kπ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye y=π/2+kπ−x. La desigualdad</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es −cot 2x&lt;(−1)ᵏ. Si k es par, en una</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rama se obtiene 0&lt;2x&lt;3π/4. Si es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">impar, 0&lt;2x&lt;π/4.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para cualquier k posible toma la unión</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de las dos ramas y divide entre dos.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Quita x≡π/4 módulo π/2, porque allí</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x−y es múltiplo de π.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>