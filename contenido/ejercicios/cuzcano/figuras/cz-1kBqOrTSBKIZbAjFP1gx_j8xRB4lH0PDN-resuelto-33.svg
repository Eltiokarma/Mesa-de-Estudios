<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">033 · Función trabajo a partir de una gráfica</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.62,313.05 365.38,313.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="122.23,396.52 122.23,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="122.23,385.63 360.30,147.56" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="267.40,313.05 267.40,240.47 122.23,240.47" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="339.98,313.05 339.98,167.89 122.23,167.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="113.5241935483871" y="385.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">−1</text><text x="112.07258064516128" y="240.46774193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="112.07258064516128" y="167.88709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="194.81451612903226" y="326.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,25</text><text x="267.39516129032256" y="326.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,50</text><text x="339.9758064516129" y="326.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,75</text><text x="353.76612903225805" y="346.43548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ν (10¹⁵ Hz)</text><text x="146.91129032258064" y="144.66129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vf (V)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta ideal cumple Vf = (h/e)ν −</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">φ/e.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ordenada al origen es −φ/e. Lee −1</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">V en la gráfica.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una carga elemental por 1 V equivale a</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1 eV. Esa es la función trabajo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>