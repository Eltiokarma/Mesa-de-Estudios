<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">100 · Invertir diecinueve desagües</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="186.68,152.75 186.68,396.52 276.49,396.52 276.49,152.75 186.68,152.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="186.68,165.58 276.49,165.58 289.32,165.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="186.68,178.41 276.49,178.41 289.32,178.41" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="186.68,191.24 276.49,191.24 289.32,191.24" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="186.68,370.86 276.49,370.86 289.32,370.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="186.68,383.69 276.49,383.69 289.32,383.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="186.68,396.52 276.49,396.52 289.32,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="197.52932551319648" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Nivel inicial</text><text x="299.75366568914956" y="167.57771260997066" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D₁</text><text x="299.75366568914956" y="180.40762463343108" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D₂</text><text x="299.75366568914956" y="193.2375366568915" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D₃</text><text x="232.17008797653958" y="260.217008797654" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">… capas iguales …</text><text x="299.75366568914956" y="372.85630498533726" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D₁₇</text><text x="299.75366568914956" y="385.68621700879766" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D₁₈</text><text x="299.75366568914956" y="398.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D₁₉</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En capas por hora, D₁ a D₁₉ tienen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">caudales 1 a 19. Invertidos, el mayor</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda arriba y el de caudal 1 al</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fondo.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuando quedan k capas, siguen activos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los caudales 1+…+k=k(k+1)/2. La</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">siguiente capa toma 2/[k(k+1)] horas.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sumar de k=1 a 19:</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2·Σ(1/k−1/(k+1))=2(1−1/20)=19/10 h.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>