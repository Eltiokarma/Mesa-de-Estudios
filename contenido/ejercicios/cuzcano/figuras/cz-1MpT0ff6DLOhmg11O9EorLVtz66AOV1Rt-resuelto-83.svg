#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Recta AE</text><polyline points="100.90,178.10 169.45,178.10" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">Proyección</text><circle cx="100.90322580645162" cy="383.747311827957" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="375.747311827957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="169.4516129032258" cy="383.747311827957" r="3.7" fill="#20364b"/><text x="176.4516129032258" y="375.747311827957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="100.90322580645162" cy="155.252688172043" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="142.252688172043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="169.4516129032258" cy="178.1021505376344" r="3.7" fill="#20364b"/><text x="176.4516129032258" y="170.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">E</text><circle cx="100.90322580645162" cy="178.1021505376344" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="185.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">L</text><circle cx="375.09677419354836" cy="178.1021505376344" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="170.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="375.09677419354836" cy="383.747311827957" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="375.747311827957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">U</text><circle cx="375.09677419354836" cy="246.6505376344086" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="238.6505376344086" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=(0,10), el centro es (0,5) y el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radio vale 5. En y=9, el semicírculo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene x=√(25−16)=3. Así E=(3,9).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cuadrado tiene lado 9. Su lado</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecho está en x=12.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AE tiene pendiente −1/3. En x=12</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resulta y=10−12/3=6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>