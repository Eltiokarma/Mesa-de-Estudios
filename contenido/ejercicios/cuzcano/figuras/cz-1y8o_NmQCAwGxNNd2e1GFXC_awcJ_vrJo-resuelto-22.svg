<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">022 · Altura de un punto medio entre dos triángulos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.59,352.07 188.87,207.51 281.47,352.58 107.59,352.07" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.59,352.07 375.10,352.07" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="143.09,289.31 337.03,179.73 281.47,352.58" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="248.03,230.15 248.03,352.07" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="248.03,343.84 257.81,343.84 257.81,352.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="207.91,255.35 213.05,263.58 221.28,258.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="123.54,317.60 129.71,321.20" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="162.12,247.12 169.32,250.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645163" y="359.78324154209287" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="187.8426435877262" y="197.73639774859285" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="132.28372571566908" y="286.73355322883253" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="248.54590570719603" y="220.37151243720874" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="342.1729710101071" y="173.55797978575316" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="281.98414331537856" y="362.35541366579923" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="248.03147128245476" y="365.44202021424684" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="213.5643648247897" y="243.5210615505659" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="262.43563517521034" y="270.2716516371119" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">RM</text><text x="118.3939962476548" y="344.864643224596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="189.9003812866913" y="224.4869878351389" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="273.7531925195183" y="337.148126853477" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="289.7006596864976" y="342.80690552563095" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Traza DI y ON perpendiculares a la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">base y a su prolongación. Los</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulos rectángulos DIL y DSE</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen hipotenusas DL=DE y el mismo</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo agudo en L y E. Así DI=DS.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como O está en la bisectriz exterior</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en A, sus distancias a EA y a LA son</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iguales, de modo que ON=OS.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura de R es la media de las</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alturas de D y O, que es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(DS+OS)/2=DO/2=8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>