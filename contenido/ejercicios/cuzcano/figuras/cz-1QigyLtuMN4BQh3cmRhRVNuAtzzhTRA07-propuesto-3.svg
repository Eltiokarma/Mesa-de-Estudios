<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Ángulo a partir de dos alturas y una bisectriz</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="215.15,170.56 100.90,368.44 375.10,368.44 215.15,170.56" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="215.15,170.56 215.15,368.44" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,368.44 169.45,249.71" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,368.44 287.85,260.51" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="215.1505376344086" y="170.5589256429069" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="368.4410743570931" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="368.4410743570931" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="215.15053763440864" y="368.4410743570931" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="169.4516129032258" y="249.71178512858137" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="287.8533724340175" y="260.5053568766279" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe a=BC, c=BA y β=∠ABC. Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alturas miden c sinβ y a sinβ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa BD=2ac cos(β/2)/(a+c). Al</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituir y cancelar queda</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sinβ=cos(β/2).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide 2sin(β/2)cos(β/2)=cos(β/2)</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre cos(β/2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>