.85714285714286" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="239.78571428571428" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[18,24)</text><rect x="174.66666666666669" y="212.85714285714286" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="239.78571428571428" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">a+1</text><rect x="301.33333333333337" y="212.85714285714286" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="239.78571428571428" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="48.0" y="254.28571428571428" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[24,30)</text><rect x="174.66666666666669" y="254.28571428571428" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">b</text><rect x="301.33333333333337" y="254.28571428571428" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="48.0" y="295.7142857142857" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[30,36)</text><rect x="174.66666666666669" y="295.7142857142857" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">b+2</text><rect x="301.33333333333337" y="295.7142857142857" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="48.0" y="337.14285714285717" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[36,42)</text><rect x="174.66666666666669" y="337.14285714285717" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">c</text><rect x="301.33333333333337" y="337.14285714285717" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="48.0" y="378.57142857142856" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[42,48)</text><rect x="174.66666666666669" y="378.57142857142856" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">c−3</text><rect x="301.33333333333337" y="378.57142857142856" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">5b</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Tiempos de fabricación</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma de las seis frecuencias es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2(a+b+c)=5b. Como a+c=b+3, se obtiene</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b=6 y a+c=9.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El total es 30 trabajadores. Los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">límites 15 y 45 cortan por la mitad la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primera y última clase.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con interpolación uniforme, se excluye</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[a+(c−3)]/2=(9−3)/2=3 del total.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>