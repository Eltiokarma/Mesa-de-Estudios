<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">051 · Bisectriz y perpendicular dentro de un rectángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="115.25,339.64 115.25,196.17 363.94,196.17 363.94,339.64 115.25,339.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="115.25,339.64 198.15,196.17 363.94,291.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="115.25,339.64 363.94,196.17" fill="none" stroke="#008674" stroke-width="2.5"/><text x="102.49737434358588" y="349.20742685671416" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="100.90322580645159" y="189.7925731432858" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="368.72018004501126" y="189.7925731432858" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="370.31432858214555" y="352.39572393098274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="194.95798949737434" y="186.60427606901726" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="279.44786196549137" y="236.02288072018004" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="373.5026256564141" y="296.60052513128284" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="100.90322580645159" y="275.87659414853715" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="234.81170292573145" y="210.5165041260315" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="375.0967741935484" y="325.2951987996999" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="148.7276819204801" y="323.7010502625657" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="135.97449362340583" y="306.1654163540885" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">S está en la bisectriz, así que dista</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2 tanto de ME como de MO. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia vertical entre E y S vale</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3−2=1.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segmento ES mide 2 y su caída</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical es 1. Forma 30° con la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal. Por perpendicularidad, ME</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">forma 60° con MO y MN forma 30°.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En NSU, los ángulos en N y U valen</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60°. El triángulo es equilátero y la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia vertical de N a S vale 1,</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de modo que NS=1/sen 30°=2. Entonces</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">NO−NU=3−2=1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>