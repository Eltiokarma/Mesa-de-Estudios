<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">102 · Empuje oblicuo con el bloque en reposo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,328.30 375.10,328.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="196.84,328.30 196.84,275.69 268.02,275.69 268.02,328.30" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="122.57,219.37 195.60,274.45" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="187.56,273.21 195.60,274.45 191.27,266.41" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="122.57,219.98 178.89,219.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="232.12000291269206" y="306.01787664749145" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 N</text><text x="121.94742590839581" y="210.70002912692055" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 N</text><text x="151.6568848758465" y="236.6958057234399" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con el triángulo 3-4-5, las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes son 16 N hacia la derecha</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 12 N hacia abajo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La normal vale 40+12=52 N y el límite</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la fricción estática es 26 N.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fricción necesaria para equilibrar</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el empuje horizontal es de 16 N hacia</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la izquierda, dentro del límite.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>