#ffffff" stroke="#a3b9cc"/><text x="95.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2</text><rect x="143.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="238.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="333.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,40</text><rect x="48.0" y="274" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3</text><rect x="143.0" y="274" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">23</text><rect x="238.0" y="274" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="333.0" y="274" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="48.0" y="322" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4</text><rect x="143.0" y="322" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="238.0" y="322" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="333.0" y="322" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,85</text><rect x="48.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">5</text><rect x="143.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="238.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="333.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1</text><text x="48" y="445" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Número de cuartos</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con un cuarto hay 0,1375×80=11</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">viviendas. Hasta dos hay 0,40×80=32,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que con dos hay 21.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hasta cuatro hay 0,85×80=68 viviendas.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Restando las 32 de las dos primeras</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">categorías y las 23 de la tercera</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">quedan 13 con cuatro.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma las categorías pares 2 y 4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>