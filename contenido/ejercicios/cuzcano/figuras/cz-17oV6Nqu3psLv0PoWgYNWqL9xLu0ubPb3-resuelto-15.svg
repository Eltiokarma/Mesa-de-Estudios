<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Paralela a un lado que atraviesa el baricentro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="166.21,308.16 309.79,308.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="221.43,396.52 221.43,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="188.30,374.43 287.70,208.75 254.57,175.62 188.30,374.43" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="177.25,363.38 287.70,179.30" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="183.88008415147266" y="383.2622720897616" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="292.1199158485273" y="208.75315568022438" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="255.671809256662" y="166.78260869565213" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="247.94039270687236" y="244.09677419354838" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Promedia las coordenadas de los tres</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértices y obtén G=(2,5).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de AB es (9+6)/(6+3)=5/3.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe y−5=(5/3)(x−2), multiplica por</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3 y ordena.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>