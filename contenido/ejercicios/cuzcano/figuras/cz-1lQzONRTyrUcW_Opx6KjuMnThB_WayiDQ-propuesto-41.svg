<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Componente común a dos planos perpendiculares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,327.66 300.32,327.66 375.10,271.16 175.68,271.16" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,327.66 300.32,327.66 300.32,211.34 100.90,211.34" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,327.66 300.32,327.66 375.10,271.16 175.68,271.16 100.90,327.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,327.66 300.32,327.66 300.32,211.34 100.90,211.34 100.90,327.66" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="197.29,305.06 167.37,327.66 233.85,327.66 233.85,233.66" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="197.29,305.06 233.85,233.66" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="197.28641251221896" y="305.0620723362659" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="233.8455522971652" y="233.65784727138762" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="167.3743890518084" y="327.66226783968716" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="233.8455522971652" y="327.66226783968716" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">J</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ejes ortogonales, las componentes</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normales a los planos miden Ksin30° y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ksin45°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La componente restante va a lo largo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la arista. Por Pitágoras su</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrado es K²[1−sin²30°−sin²45°].</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El factor es 1−1/4−1/2=1/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>