<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">019 · Cosecante en dos triángulos rectángulos consecutivos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.56,383.28 356.52,383.28 356.52,317.11 309.73,142.48 109.56,383.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.56,383.28 356.52,317.11" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="109.55811275601465" y="383.28169253353315" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="356.51605986994167" y="383.28169253353315" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="356.51605986994167" y="317.1095100399085" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="309.7252609027859" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="279.7563281773371" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="366.4418872439854" y="352.8424885864658" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="296.9610956256795" y="268.8038168195625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a+b</text><text x="320.97453192670207" y="166.3058566654468" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a−b</text><text x="141.3207603529545" y="362.7683159605095" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cuadrado del lado común es a²+b².</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el segundo triángulo,</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(a+b)²=a²+b²+(a−b)². Entonces</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(a−b)²=2ab y (a+b)²=6ab.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cosecante es hipotenusa entre opuesto.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cociente al cuadrado vale 3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>