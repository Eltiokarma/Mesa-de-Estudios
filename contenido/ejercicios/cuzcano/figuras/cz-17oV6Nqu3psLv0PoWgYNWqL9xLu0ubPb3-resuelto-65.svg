<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">065 · Un mismo rayo desde dos semiejes opuestos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="138.20,168.69 325.03,168.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="298.82,396.52 298.82,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="298.82,168.69 164.41,370.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="337.80,168.69 337.70,171.50 337.40,174.28 336.89,177.04 336.19,179.76 335.30,182.42 334.22,185.00 332.96,187.51 331.52,189.91 329.91,192.21 328.13,194.38 326.21,196.42 324.15,198.32 321.95,200.07 319.64,201.65 317.21,203.06 314.69,204.29 312.09,205.34 309.42,206.20 306.70,206.87 303.93,207.34 301.14,207.60 298.34,207.67 295.54,207.53 292.75,207.20 290.00,206.66 287.29,205.93 284.65,205.00 282.07,203.89 279.59,202.60 277.20,201.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="237.66,168.69 237.70,170.70 237.80,172.70 237.96,174.69 238.19,176.68 238.48,178.67 238.84,180.64 239.26,182.60 239.75,184.54 240.30,186.46 240.92,188.37 241.59,190.26 242.33,192.12 243.13,193.96 243.98,195.77 244.90,197.55 245.87,199.30 246.91,201.02 247.99,202.70 249.13,204.35 250.33,205.96 251.57,207.53 252.87,209.05 254.22,210.54 255.61,211.97 257.05,213.37 258.54,214.71 260.07,216.00 261.64,217.25 263.25,218.44 264.90,219.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="298.8198924731183" y="168.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="164.41129032258067" y="370.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="325.02956989247315" y="173.73387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="305.8763440860215" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="332.4220430107527" y="202.96774193548384" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="231.6155913978495" y="207.0" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por los giros mostrados, α=β−180°.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Seno y coseno cambian de signo entre α</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y β.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos sumas se anulan. El argumento</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(α−β)/4 es −45°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Queda 2cot(−45°)=−2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>