<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">046 · Dominio con una desigualdad de cotangente al cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="79.36447210331235" y1="275" x2="132.48318846835713" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="79.36447210331235" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="79.36447210331235" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π</text><circle cx="132.48318846835713" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="132.48318846835713" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">7π/6</text><line x1="344.95805392853634" y1="275" x2="398.0767702935812" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="344.95805392853634" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="344.95805392853634" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">11π/6</text><circle cx="398.0767702935812" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="398.0767702935812" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">2π</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se requiere ∣cot x∣≥√3.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el intervalo dado la cotangente</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">decrece continuamente. Toma √3 en 7π/6</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y −√3 en 11π/6.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los tramos que cumplen la cota van</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia los polos de los extremos, que</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">quedan excluidos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>