<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Abogado en conferencia</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="126.27,180.12 349.73,180.12 349.73,142.48 126.27,142.48 126.27,180.12" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="126.27,238.92 349.73,238.92 349.73,201.29 126.27,201.29 126.27,238.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="126.27,297.73 349.73,297.73 349.73,260.09 126.27,260.09 126.27,297.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="126.27,356.53 349.73,356.53 349.73,318.90 126.27,318.90 126.27,356.53" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="136.21303763440858" y="153.30107526881721" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">abogado</text><text x="136.21303763440858" y="212.10483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">contador</text><text x="136.21303763440858" y="270.9086021505376" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">ingeniero</text><text x="136.21303763440858" y="329.7123655913979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">médico</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El abogado no es Daniel ni Luis. Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">relaciones de amistad distinguen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">personas, pero no añaden otras</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exclusiones.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Un caso válido es Pedro</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ingeniero,Daniel contador,Juan</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abogado,Luis médico. Otro permite</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pedro abogado.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ello la lectura literal no elige</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre Pedro y Juan.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>