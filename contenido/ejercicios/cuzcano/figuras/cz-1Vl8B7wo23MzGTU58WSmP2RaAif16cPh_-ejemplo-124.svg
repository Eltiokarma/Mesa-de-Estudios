,339.80 213.37,340.01 216.67,340.47 219.97,341.17 223.27,342.08 226.58,343.19 229.88,344.46 233.18,345.89 236.48,347.45 239.78,349.11 243.08,350.86 246.38,352.68 249.68,354.54 252.98,356.42 256.28,358.31 259.58,360.18 262.88,362.00 266.18,363.76 269.48,365.44 272.78,367.02 276.08,368.47 279.38,369.77 282.68,370.90 285.98,371.84 289.28,372.58 292.58,373.07 295.89,373.32 299.19,373.29 302.49,372.97 305.79,372.32 309.09,371.34 312.39,370.00 315.69,368.28 318.99,366.15 322.29,363.60 325.59,360.61 328.89,357.14 332.19,353.20 335.49,348.74 338.79,343.75 342.09,338.21 345.39,332.10 348.69,325.39 351.99,318.07 355.29,310.11 358.59,301.49 361.89,292.20 365.20,282.20 368.50,271.48 371.80,260.02 375.10,247.80" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">II: trazo con hueco</text><circle cx="177.06810035842292" cy="251.2552312369035" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="184.06810035842292" y="243.2552312369035" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="375.09677419354836" cy="142.483870967742" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="382.09677419354836" y="134.483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="177.06810035842292" cy="356.56938213853556" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="184.06810035842292" y="348.56938213853556" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="298.93189964157705" cy="373.3034375645604" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="305.93189964157705" y="365.3034375645604" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="375.09677419354836" cy="247.798021869374" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="382.09677419354836" y="239.798021869374" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la primera gráfica, todos los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puntos del intervalo abierto</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pertenecen al dominio y el trazo no se</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interrumpe. Es continua en (a,c).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la segunda, b está excluido. Por</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ello la función no está definida en</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">todo (a,c) y no puede ser continua</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre ese intervalo completo.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A cada lado del hueco el trazo es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">continuo. Los intervalos son (a,b) y</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(b,c).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>