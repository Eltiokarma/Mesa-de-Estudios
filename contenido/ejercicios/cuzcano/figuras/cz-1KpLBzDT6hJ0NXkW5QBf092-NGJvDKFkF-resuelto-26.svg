<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Sustitución por una tangente y su recíproca</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Un intervalo por período</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="123.33333333333333" y1="275" x2="356.6666666666667" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="123.33333333333333" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="356.6666666666667" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="123.33333333333333" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">15°</text><text x="356.6666666666667" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">75°</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con t=tan x, multiplica por 1+t².</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta −t⁴+3t³+2t²+3t−1&gt;0. Como t=0</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">falla, divide por t².</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al escribir u=t+1/t, el miembro es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(4−u)(u+1). Su positividad exige</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−1&lt;u&lt;4. Para t&lt;0 se cumple u≤−2, así</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que t&gt;0.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ahora t+1/t&lt;4 equivale a t²−4t+1&lt;0.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus extremos son tan 15°=2−√3 y tan</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">75°=2+√3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>