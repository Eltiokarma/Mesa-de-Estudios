<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Altura a partir de dos bisectrices</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,278.64 155.74,278.64 192.30,278.64 375.10,278.64 375.10,370.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,278.64 155.74,296.92 375.10,370.04" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,278.64 188.65,200.31 155.74,278.64" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="188.65,200.31 192.30,278.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="114.06,168.96 188.65,200.31 375.10,278.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="155.74,278.64 155.74,296.92" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="278.63978494623655" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="155.74193548387098" y="278.63978494623655" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="192.30107526881721" y="278.63978494623655" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="375.09677419354836" y="278.63978494623655" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.09677419354836" y="370.0376344086021" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="155.74193548387098" y="296.91935483870964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="188.64516129032256" y="200.31444089125048" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="314.7741935483871" y="287.23118279569894" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">PI/PO = 1/5</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por las dos bisectrices,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">VP/VN=PI/IN=PO/ON=3/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma PI=3k e IN=2k. Con</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PO=(3/2)(PO−5k), resulta PO=15k.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos PIM y POR son</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semejantes. Así MI/RO=PI/PO=1/5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>