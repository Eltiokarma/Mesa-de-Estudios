<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Dos rampas con rapidez constante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,321.38 220.17,231.93 375.10,321.38 100.90,321.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="150.40,284.26 170.67,269.05 155.47,248.78 135.19,263.98 150.40,284.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="286.66,270.32 308.61,282.99 321.28,261.04 299.33,248.37 286.66,270.32" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="227.92,225.37 227.80,226.72 227.45,228.02 226.88,229.25 226.11,230.35 225.15,231.31 224.05,232.09 222.82,232.66 221.52,233.01 220.17,233.12 218.82,233.01 217.52,232.66 216.29,232.09 215.19,231.31 214.23,230.35 213.46,229.25 212.88,228.02 212.54,226.72 212.42,225.37 212.54,224.03 212.88,222.72 213.46,221.50 214.23,220.39 215.19,219.43 216.29,218.66 217.52,218.09 218.82,217.74 220.17,217.62 221.52,217.74 222.82,218.09 224.05,218.66 225.15,219.43 226.11,220.39 226.88,221.50 227.45,222.72 227.80,224.03 227.92,225.37" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="216.59,217.92 145.93,270.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="224.64,218.81 291.73,257.57" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="114.32070044479369" y="316.31207818266006" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="358.81690496569337" y="316.6102442857343" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="152.48596163829995" y="265.92200676310875" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m₁</text><text x="303.9543420000281" y="265.3256745569603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La aceleración a lo largo de cada</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">plano es cero. La tensión iguala la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente paralela del peso de cada</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bloque.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala 2,5g sen β a 3g sen 30°.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cancela g y usa sen 30°=1/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Queda sen β=3/5. Aplica la función</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inversa.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>