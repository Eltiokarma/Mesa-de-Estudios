 x="254.5176836377769" y="336.1213240057002" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃(CH₂)₂CH₃</text><text x="133.38800362741287" y="337.7730923694779" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">c</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El dibujo b muestra cada enlace y cada</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hidrógeno. Es la fórmula desarrollada.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La expresión c agrupa dos CH₂</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">consecutivos en un solo paréntesis. Es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la fórmula condensada.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fórmula a solo da el número total</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de átomos de cada elemento. Es la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">global o molecular.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>