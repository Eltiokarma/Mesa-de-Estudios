<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Rango de una parábola en el coseno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">u = cos x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f</text><polyline points="100.90,327.23 105.47,330.21 110.04,332.98 114.61,335.55 119.18,337.91 123.75,340.06 128.32,342.01 132.89,343.76 137.46,345.30 142.03,346.63 146.60,347.76 151.17,348.69 155.74,349.40 160.31,349.92 164.88,350.23 169.45,350.33 174.02,350.23 178.59,349.92 183.16,349.40 187.73,348.69 192.30,347.76 196.87,346.63 201.44,345.30 206.01,343.76 210.58,342.01 215.15,340.06 219.72,337.91 224.29,335.55 228.86,332.98 233.43,330.21 238.00,327.23 242.57,324.05 247.14,320.67 251.71,317.07 256.28,313.28 260.85,309.27 265.42,305.06 269.99,300.65 274.56,296.03 279.13,291.21 283.70,286.18 288.27,280.94 292.84,275.50 297.41,269.86 301.98,264.01 306.55,257.95 311.12,251.69 315.69,245.23 320.26,238.55 324.83,231.68 329.40,224.60 333.97,217.31 338.54,209.82 343.11,202.12 347.68,194.21 352.25,186.11 356.82,177.79 361.39,169.27 365.96,160.55 370.53,151.62 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">u²+u+3/4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon u=cos x, con −1≤u≤1. La expresión</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es u²+u+3/4.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completa el cuadrado, (u+1/2)²+1/2. La</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia ∣u+1/2∣ va de 0 a 3/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al elevar y sumar 1/2 se obtienen los</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos 1/2 y 11/4, ambos incluidos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>