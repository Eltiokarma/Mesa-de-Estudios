<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">070 · Focal a partir de una trayectoria</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.11,247.80 368.89,247.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="218.44,142.48 208.66,197.25 205.65,247.80 208.66,298.35 218.44,353.11 228.22,298.35 231.23,247.80 228.22,197.25 218.44,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="125.92,224.70 143.22,247.80 218.44,347.62 350.08,385.38" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="218.44,347.62 255.30,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="157.51006333164577" y="262.09041237211875" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53°</text><text x="250.03587838031464" y="381.69695377649566" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="178.57285049719638" y="234.25744361764114" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">75 cm</text><text x="259.8150295643203" y="235.76192841518048" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Eje</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rayo cruza la lente por debajo del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">eje a altura y = 75 tan 53° ≈ 100 cm</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en valor absoluto.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rayo de salida forma 53° − 37° =</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">16° con el eje. Su prolongación hacia</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">atrás cruza el eje y da s′ = −y/tan</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">16° ≈ −349 cm.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye s = 75 cm y s′ ≈ −349 cm en</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la ecuación de lente. El resultado es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximadamente 96 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>