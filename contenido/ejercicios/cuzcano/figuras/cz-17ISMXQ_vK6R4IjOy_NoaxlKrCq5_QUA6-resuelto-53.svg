<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">053 · Sombra en tres cuadrados contiguos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="163.53,314.78 163.53,272.46 205.84,230.15 205.84,314.78" fill="#f4c581" fill-opacity="0.45"/><polygon points="205.84,314.78 205.84,272.46 248.16,272.46 248.16,314.78" fill="#f4c581" fill-opacity="0.45"/><polygon points="290.47,230.15 332.78,230.15 332.78,272.46 290.47,272.46" fill="#f4c581" fill-opacity="0.45"/><polygon points="290.47,314.78 332.78,272.46 375.10,314.78" fill="#f4c581" fill-opacity="0.45"/><polyline points="121.21,314.78 375.10,314.78 375.10,230.15 121.21,230.15 121.21,314.78" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="205.84,314.78 205.84,230.15 121.21,314.78" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="205.84,230.15 290.47,314.78 290.47,230.15" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="290.47,230.15 375.10,314.78 375.10,230.15 290.47,314.78" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="163.53,314.78 163.53,272.46 205.84,230.15 205.84,314.78 163.53,314.78" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="205.84,314.78 205.84,272.46 248.16,272.46 248.16,314.78 205.84,314.78" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="290.47,230.15 332.78,230.15 332.78,272.46 290.47,272.46 290.47,230.15" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="290.47,314.78 332.78,272.46 375.10,314.78 290.47,314.78" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="159.52608522500995" y="216.22421346077255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a</text><text x="244.15372361608925" y="216.22421346077255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a</text><text x="328.78136200716847" y="216.22421346077255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a</text><text x="107.90322580645162" y="268.6933492632417" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con a=1, las sombras de los dos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primeros cuadrados son 3/8 y 1/4.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el tercero, dos regiones de 1/4</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suman 1/2. Sombra total: 9/8 de las 3</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">unidades de área.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El blanco es 15/8; el cociente</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(9/8)/(15/8)=3/5=60%.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>