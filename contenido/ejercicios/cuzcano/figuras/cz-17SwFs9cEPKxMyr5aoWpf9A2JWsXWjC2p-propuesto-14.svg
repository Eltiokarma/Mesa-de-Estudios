<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Coseno de un ángulo entre dos líneas de un cuadrante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,142.48 110.98,205.99 110.98,396.52 365.02,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.98,205.99 140.99,228.50 365.02,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.98,205.99 155.65,146.44" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.98,396.52 140.99,228.50 155.65,146.44" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="110.98,142.48 117.22,142.56 123.45,142.79 129.67,143.17 135.88,143.71 142.08,144.39 148.26,145.23 154.41,146.22 160.54,147.37 166.64,148.66 172.71,150.10 178.74,151.69 184.73,153.42 190.67,155.31 196.56,157.33 202.41,159.51 208.20,161.82 213.93,164.28 219.60,166.87 225.20,169.61 230.73,172.48 236.20,175.49 241.58,178.63 246.89,181.90 252.12,185.30 257.26,188.82 262.31,192.48 267.27,196.25 272.14,200.15 276.91,204.16 281.58,208.29 286.15,212.53 290.61,216.89 294.97,221.35 299.21,225.92 303.34,230.59 307.35,235.36 311.25,240.23 315.02,245.19 318.68,250.24 322.20,255.38 325.60,260.61 328.87,265.92 332.01,271.30 335.02,276.77 337.89,282.30 340.63,287.90 343.22,293.57 345.68,299.30 347.99,305.09 350.17,310.94 352.19,316.83 354.08,322.77 355.81,328.76 357.40,334.79 358.84,340.86 360.13,346.96 361.28,353.09 362.27,359.24 363.11,365.42 363.79,371.62 364.33,377.83 364.71,384.05 364.94,390.28 365.02,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="110.98387096774195" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="110.98387096774195" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="365.01612903225805" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="110.98387096774195" y="205.991935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="155.64709426628798" y="146.44097108580962" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="140.99179605574787" y="228.49787929987542" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="311.66935483870975" y="376.19354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="189.25792508800595" y="258.9817502676174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="125.46370967741936" y="218.6935483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma radio 1. Con tan 37°≈3/4,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P=(0,3/4) y el vector unitario de P</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia B es (4/5,−3/5).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como PM⊥PB, M y P tienen la misma</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección en ese vector. La</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección de P vale</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−(3/4)(3/5)=−9/20.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector unitario hacia O es −OM. Su</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">producto escalar con el vector hacia B</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cambia el signo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>