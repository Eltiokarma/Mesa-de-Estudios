<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">070 · Mediatriz que une dos puntos medios</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.59,379.03 375.10,379.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.59,379.03 334.12,215.11" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="304.31,159.23 304.31,379.03" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="304.31,159.23 341.57,210.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="110.59,379.03 304.31,159.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="304.31,379.03 341.57,210.64" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="207.45,269.13 322.94,294.83" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645159" y="390.9498597475456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="302.82293127629737" y="146.55995792426359" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="305.05820476858344" y="392.44004207573636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="354.9793127629734" y="210.63779803646563" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="197.01998597475455" y="259.0687237026648" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="333.3716690042076" y="291.85273492286115" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">K</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En los triángulos rectángulos OEP y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OFP, OP es la hipotenusa común.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su punto medio M está a la misma</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia de los tres vértices de cada</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo. En particular ME = MF.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así M está en la mediatriz de EF. La</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recta que une M al punto medio de EF</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es esa mediatriz, cuando los dos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puntos son distintos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>