<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Cabello castaño o negro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,142.48 100.90,374.90 375.10,374.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="116.67,374.90 116.67,320.85 146.83,320.85 146.83,374.90" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="185.22,374.90 185.22,212.75 215.38,212.75 215.38,374.90" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="253.77,374.90 253.77,158.70 283.93,158.70 283.93,374.90" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="322.31,374.90 322.31,266.80 352.48,266.80 352.48,374.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="131.75" y="304.63212079615647" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 %</text><text x="200.2983870967742" y="196.53328757721346" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30 %</text><text x="268.8467741935484" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 %</text><text x="337.3951612903226" y="250.58270418668496" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 %</text><text x="131.75" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="200.2983870967742" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="268.8467741935484" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="337.3951612903226" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Castaño y negro reúnen el 30 %+40 %=70</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">% de 40. Eso corresponde a 28</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">personas.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El grupo sin cabello rubio es el 80 %</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 40, o sea 32 personas.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide 28 entre 32 y expresa el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cociente como porcentaje.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>