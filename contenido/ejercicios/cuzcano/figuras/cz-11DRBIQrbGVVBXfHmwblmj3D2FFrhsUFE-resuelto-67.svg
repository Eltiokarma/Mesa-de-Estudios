<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">067 · Distancia entre dos puntos exteriores a un lado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.45,358.31 168.02,176.60 328.44,355.85 107.45,358.31" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="168.02,176.60 366.09,250.27 328.44,355.85" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="222.86,358.31 366.09,250.27" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="222.86,358.31 247.41,264.18" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="247.41,264.18 366.09,250.27" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645164" y="369.7648050072219" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="168.83774675012037" y="169.23519499277808" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="336.62782859894077" y="367.3093403948002" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="222.03948001925855" y="368.94631680308134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="375.09677419354836" y="251.0840154068368" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="243.32017332691382" y="256.8134328358209" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="180.29658160808862" y="203.61169956668274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">46°</text><text x="209.76215695714973" y="201.15623495426098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="130.36880115551278" y="282.1865671641791" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2√3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea M punto medio de BC. En BPC,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MP=BC/2=√3. Por el segmento medio,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MQ=AB/2=√3 y MQ es paralelo a BA.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como BMC es colineal y BMP es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">isósceles, ∠PMC=2∠PBC=74°. Por</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelismo, ∠QMC=46°. Los dos</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sectores suman 120°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ley de cosenos,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PQ²=3+3−6cos120°=9.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>