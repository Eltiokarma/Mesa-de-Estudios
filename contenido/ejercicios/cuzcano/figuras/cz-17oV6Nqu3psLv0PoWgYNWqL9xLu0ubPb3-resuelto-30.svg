<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Hipotenusa de un triángulo cuyos vértices están en los ejes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,345.71 365.02,345.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="161.79,396.52 161.79,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="161.79,221.26 286.24,345.71" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="161.79,345.71 309.13,198.37" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="293.8870967741936" y="325.38709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="171.9516129032258" y="208.5322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="146.5483870967742" y="363.491935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El origen equidista de A y B porque</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pertenece a la mediatriz. Luego a=b&gt;0.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área vale ab/2, de modo que a²=6.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta con cortes iguales a √6 tiene</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ecuación x+y=√6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>