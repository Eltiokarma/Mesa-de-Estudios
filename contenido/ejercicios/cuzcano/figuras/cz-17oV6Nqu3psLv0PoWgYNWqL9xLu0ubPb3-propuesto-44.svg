<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Coordenadas con ángulo horario desde el eje vertical</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="142.62,355.91 333.38,355.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="308.83,380.46 308.83,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="308.83,355.91 167.17,167.04" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="308.83,396.52 305.45,396.38 302.10,395.95 298.79,395.26 295.55,394.28 292.40,393.05 289.37,391.55 286.48,389.81 283.73,387.83 281.16,385.64 278.79,383.23 276.62,380.64 274.67,377.88 272.96,374.96 271.50,371.91 270.30,368.75 269.37,365.50 268.71,362.19 268.32,358.83 268.22,355.45 268.40,352.07 268.86,348.72 269.60,345.42 270.60,342.20 271.88,339.07 273.41,336.05 275.18,333.17 277.19,330.45 279.41,327.91 281.84,325.56 284.46,323.42" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="308.8268377503298" y="355.90874205540234" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="167.1731622496702" y="167.03717472118956" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="333.38014150377745" y="360.63053123875767" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="315.4373426070272" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="264.9141983451253" y="388.9612663388896" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el eje inicial (0,−1) la proyección</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es r cos θ. En la dirección</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular horaria (−1,0) la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección es r sen θ para θ medido</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">como magnitud horaria.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa la convención de ángulo orientado</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del gráfico: θ es negativo en sentido</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horario. Respecto del eje inicial, el</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">eje positivo transversal es (1,0).</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con θ orientado, x=r sen θ e y=−r cos</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ. Suma ambas coordenadas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>