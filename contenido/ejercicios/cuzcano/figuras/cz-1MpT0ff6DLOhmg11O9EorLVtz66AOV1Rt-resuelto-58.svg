<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Ángulo entre rectas con distinta ordenada en el origen</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="282.3528225806452" x2="421" y2="282.3528225806452" stroke="#20364b" stroke-width="1.7"/><line x1="169.4516129032258" y1="105" x2="169.4516129032258" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,385.18 375.10,248.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">L₁</text><polyline points="100.90,290.92 375.10,153.82" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">L₂</text><circle cx="169.4516129032258" cy="350.9012096774194" r="3.7" fill="#20364b"/><text x="176.4516129032258" y="342.9012096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">−2</text><circle cx="169.4516129032258" cy="256.6471774193549" r="3.7" fill="#20364b"/><text x="176.4516129032258" y="248.64717741935488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3/4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja la primera como y=x/2−2.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja la segunda como y=x/2+3/4.</text><text x="482" y="169" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambas rectas tienen pendiente 1/2 y</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sus direcciones son paralelas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>