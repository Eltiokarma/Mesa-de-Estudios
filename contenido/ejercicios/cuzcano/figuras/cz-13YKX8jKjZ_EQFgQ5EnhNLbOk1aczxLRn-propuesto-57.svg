<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Razón de áreas con una mediana y dos trisectores</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="169.45,292.35 100.90,223.80 210.58,278.64" fill="#f4c581" fill-opacity="0.45"/><polygon points="210.58,278.64 238.00,269.50 375.10,315.20 283.70,315.20" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,315.20 100.90,223.80 375.10,315.20 100.90,315.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,315.20 238.00,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,223.80 192.30,315.20" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,223.80 283.70,315.20" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="315.1989247311828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="223.80107526881721" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="315.1989247311828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="237.99999999999997" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="192.3010752688172" y="315.1989247311828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="283.6989247311828" y="315.1989247311828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="169.4516129032258" y="292.3494623655914" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="210.5806451612903" y="278.63978494623655" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una transformación afín conserva la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">razón de áreas. Usa A=(0,0), B=(0,1),</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C=(3,0), M=(3/2,1/2), P=(1,0),</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Q=(2,0).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al cruzar y=x/3 con BP y BQ salen</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E=(3/4,1/4) y F=(6/5,2/5).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por determinantes, [EBF]=9/40 y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[FMCQ]=21/20. Divide.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>