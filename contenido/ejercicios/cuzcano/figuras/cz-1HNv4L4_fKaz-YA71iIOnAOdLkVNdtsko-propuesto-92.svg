<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">092 · Una circunferencia frente al vértice de un rombo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="280.91,269.50 280.51,277.71 279.30,285.83 277.30,293.80 274.54,301.54 271.02,308.97 266.80,316.01 261.90,322.61 256.39,328.70 250.30,334.22 243.70,339.11 236.65,343.34 229.22,346.85 221.49,349.62 213.52,351.61 205.39,352.82 197.18,353.22 188.98,352.82 180.85,351.61 172.88,349.62 165.15,346.85 157.72,343.34 150.67,339.11 144.07,334.22 137.98,328.70 132.47,322.61 127.57,316.01 123.35,308.97 119.83,301.54 117.07,293.80 115.07,285.83 113.86,277.71 113.46,269.50 113.86,261.29 115.07,253.17 117.07,245.20 119.83,237.46 123.35,230.03 127.57,222.99 132.47,216.39 137.98,210.30 144.07,204.78 150.67,199.89 157.72,195.66 165.15,192.15 172.88,189.38 180.85,187.39 188.98,186.18 197.18,185.78 205.39,186.18 213.52,187.39 221.49,189.38 229.22,192.15 236.65,195.66 243.70,199.89 250.30,204.78 256.39,210.30 261.90,216.39 266.80,222.99 271.02,230.03 274.54,237.46 277.30,245.20 279.30,253.17 280.51,261.29 280.91,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="113.46,269.50 239.05,196.99 364.63,269.50 239.05,342.01 113.46,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="364.63,164.85 364.63,374.15" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645159" y="273.68616104407783" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="233.60453090371826" y="187.03262743166707" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="273.68616104407783" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="236.9534597389805" y="355.31630140359516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.09677419354836" y="169.03213494213247" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea θ=∠BCD. La diagonal AC biseca ese</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo, así que θ+θ/2=90° y θ=60°.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ubica C en el origen, A=(-6,0),</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=(-3,√3) y D=(-3,−√3).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro del círculo está sobre AC.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto (-4,0) equidista de A, B y D,</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">todos a distancia 2 m.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El círculo tiene longitud 4π y su</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">centro recorre 4π durante el giro de</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°. Multiplica por Pappus.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>