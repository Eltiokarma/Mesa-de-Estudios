<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">070 · Un anillo sobre una varilla acodada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,309.24 329.08,309.24 329.08,195.15" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="320.71,327.50 329.08,309.24 337.45,327.50 320.71,327.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="131.33,301.64 131.33,316.85" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="329.08,195.15 374.72,256.00" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="366.12,251.51 374.72,256.00 372.81,246.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="131.33,309.24 131.33,352.59" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="127.14,343.85 131.33,352.59 135.51,343.85" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.9032258064516" y="300.8744351483155" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="338.5883405664176" y="312.2833206567939" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="322.23560467093193" y="186.40528387991586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="214.99208089123528" y="299.7335465974677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 m</text><text x="316.91145810030866" y="252.19652364547446" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 m</text><text x="375.09677419354836" y="265.12659388841666" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3mg</text><text x="145.01758310590128" y="349.55234665115654" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">mg</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Solo la componente horizontal de F, de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">magnitud 3mg sen 37°, produce momento</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto de O.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El anillo actúa a 10−x metros de O.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Igualando momentos queda</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mg(10−x)=5×3mg sen 37°. Cancela mg.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usando sen 37°≈3/5, resulta 10−x=9.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>