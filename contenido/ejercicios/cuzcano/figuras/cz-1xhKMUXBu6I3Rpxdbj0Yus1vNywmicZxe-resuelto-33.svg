<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">033 · Altura de un edificio desde dos puntos de rumbos conocidos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="201.30,323.11 247.83,149.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="201.30,323.11 274.70,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="247.83,149.44 274.70,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="201.30,323.11 201.30,146.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="201.29789658168232" y="323.1119221956227" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="247.83429897146178" y="149.435704075496" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="274.70210341831773" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="210.64072681760717" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="211.67881906604327" y="208.92177486765206" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N15°E</text><text x="255.27869350035934" y="365.6737043815026" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">SE</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las distancias horizontales desde el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pie del edificio son h cot30°=√3h y h</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cot45°=h.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus azimuts son 15° y 135°, así que el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo entre los radios horizontales</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 120°. La ley de cosenos da</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d²=h²(4+√3).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa d²=144·13 y (4+√3)(4−√3)=13 para</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">despejar.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>