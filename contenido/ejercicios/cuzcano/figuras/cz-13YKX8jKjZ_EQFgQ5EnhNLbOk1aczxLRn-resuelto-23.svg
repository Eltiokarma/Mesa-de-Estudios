<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">023 · Área por proyección de lados sobre la diagonal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="238.00,396.52 238.00,248.70 358.70,248.70 358.70,396.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="238.00,396.52 238.00,248.70 358.70,248.70 358.70,396.52 238.00,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,248.70 358.70,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="107.92,354.91 238.00,248.70 368.08,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,396.52 165.58,307.82" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="358.70,248.70 310.42,189.57" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="238.0" y="248.69550266492303" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="238.0" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="358.6950360195239" y="248.69550266492303" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="358.6950360195239" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="165.58297838828565" y="307.823753211857" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="310.41702161171435" y="189.567252117989" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a=BA, b=BC y d=√(a²+b²). Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancias a la recta son las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyecciones de BA y BC sobre BD, así</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que a²/d=15 y b²/d=10.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma para obtener d=25. Luego a²=375 y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b²=250.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área ab es 25√(15·10)=125√6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>