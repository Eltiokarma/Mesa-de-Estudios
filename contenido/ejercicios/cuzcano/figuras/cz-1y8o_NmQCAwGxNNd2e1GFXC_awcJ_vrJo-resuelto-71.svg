<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">071 · Distancia del centro de un cuadrado interior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="133.12,375.54 133.12,151.81 356.86,151.81 356.86,375.54 133.12,375.54" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="133.12,263.67 356.86,151.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="133.12,263.67 189.06,375.54 300.93,319.61 244.99,207.74 133.12,263.67" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="189.06,375.54 244.99,207.74" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="133.12,263.67 300.93,319.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="217.02,291.64 356.86,291.64" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="119.14087007990531" y="391.85498668245043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="119.14087007990531" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="361.5202722699023" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="361.5202722699023" y="394.18555785735424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="114.47972773009768" y="266.00414323764426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="186.72743415211602" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="247.32228469961527" y="193.75643681562593" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="307.9171352471145" y="338.25184965966264" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="207.70257472625036" y="282.318141461971" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">K</text><text x="310.2477064220183" y="282.318141461971" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa P=(0,0), I=(0,8), C=(8,8),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O=(8,0). Entonces U=(0,4) y la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente de UC es 1/2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como UA es perpendicular y llega a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=0, su vector es (2,−4). La rotación</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 90° da U→R=(4,2), así R=(4,6) y</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=(2,0).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro K es el punto medio de AR,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con abscisa 3. Dista 8−3=5 de la recta</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CO.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>