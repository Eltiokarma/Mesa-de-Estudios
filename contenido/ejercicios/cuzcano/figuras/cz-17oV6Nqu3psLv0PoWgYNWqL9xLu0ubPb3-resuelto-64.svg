<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">064 · Evaluación con eje inicial vertical</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,263.67 375.10,263.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="222.46,338.59 222.46,200.41" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="129.19,228.70 222.46,263.67 346.81,310.30" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="222.46,245.02 219.76,245.21 217.12,245.80 214.59,246.76 212.23,248.07 210.08,249.72 208.19,251.65 206.60,253.84 205.35,256.24 204.45,258.79 203.94,261.45 203.81,264.15 204.07,266.84 204.73,269.46 205.75,271.97 207.12,274.29 208.82,276.40 210.81,278.24 213.04,279.77 215.46,280.96 218.04,281.79 220.70,282.24 223.41,282.30 226.09,281.97 228.70,281.25 231.17,280.16 233.47,278.73 235.53,276.98 237.32,274.95 238.79,272.68 239.92,270.22" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="222.4561480506181" y="263.6710555189818" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="346.8069636456733" y="310.3026113671275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="269.11140370126543" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="230.07263550581524" y="200.40757808499745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="201.938263477434" y="276.57245263696876" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Rota los ejes y el rayo 90° en sentido</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horario para que el eje inicial</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coincida con +x. El vector de A pasa a</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−3,−8).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La norma es √73. Así sen α=−8/√73 y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan α=8/3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La expresión vale −8−6(8/3)=−24.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>