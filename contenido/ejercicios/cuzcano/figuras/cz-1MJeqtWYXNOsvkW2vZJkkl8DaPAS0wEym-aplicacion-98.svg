<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">098 · Descenso en un medio viscoso</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,173.37 100.90,336.38 108.43,354.77 131.83,365.63 344.17,365.63 366.74,354.77 375.10,336.38 375.10,173.37" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="101.74,218.51 374.26,218.51" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="263.91,268.66 263.72,271.61 263.15,274.51 262.20,277.30 260.89,279.95 259.25,282.40 257.30,284.62 255.08,286.57 252.63,288.21 249.98,289.52 247.19,290.47 244.29,291.04 241.34,291.23 238.40,291.04 235.50,290.47 232.71,289.52 230.06,288.21 227.60,286.57 225.38,284.62 223.44,282.40 221.80,279.95 220.49,277.30 219.54,274.51 218.97,271.61 218.77,268.66 218.97,265.72 219.54,262.82 220.49,260.03 221.80,257.38 223.44,254.92 225.38,252.70 227.60,250.76 230.06,249.12 232.71,247.81 235.50,246.86 238.40,246.29 241.34,246.09 244.29,246.29 247.19,246.86 249.98,247.81 252.63,249.12 255.08,250.76 257.30,252.70 259.25,254.92 260.89,257.38 262.20,260.03 263.15,262.82 263.72,265.72 263.91,268.66" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="241.34,291.23 241.34,338.88" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="236.33,329.69 241.34,338.88 246.36,329.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="176.1392604248623" y="209.31117230527144" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">medio viscoso</text><text x="269.7663257277734" y="326.34500393391033" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza aplicada y el peso apuntan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia abajo. El peso es 2 N.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El descenso uniforme implica</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aceleración nula.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el modelo del cuaderno, sin empuje</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separado, la resistencia equilibra 8+2</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>