<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Dominio de un radical con ángulo doble</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="210.94299279339887" x2="421" y2="210.94299279339887" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">radicando</text><polyline points="100.90,396.52 105.47,386.74 110.04,376.86 114.61,366.91 119.18,356.92 123.75,346.90 128.32,336.89 132.89,326.91 137.46,316.98 142.03,307.14 146.60,297.41 151.17,287.80 155.74,278.36 160.31,269.09 164.88,260.02 169.45,251.17 174.02,242.56 178.59,234.22 183.16,226.16 187.73,218.39 192.30,210.94 196.87,203.82 201.44,197.05 206.01,190.63 210.58,184.58 215.15,178.92 219.72,173.64 224.29,168.77 228.86,164.29 233.43,160.23 238.00,156.59 242.57,153.36 247.14,150.56 251.71,148.17 256.28,146.21 260.85,144.66 265.42,143.53 269.99,142.81 274.56,142.48 279.13,142.56 283.70,143.02 288.27,143.86 292.84,145.06 297.41,146.62 301.98,148.51 306.55,150.74 311.12,153.27 315.69,156.10 320.26,159.21 324.83,162.58 329.40,166.19 333.97,170.02 338.54,174.05 343.11,178.26 347.68,182.63 352.25,187.14 356.82,191.76 361.39,196.47 365.96,201.26 370.53,206.09 375.10,210.94" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">sen 2x−cos x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Factoriza el radicando como cos x(2sen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x−1).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En [0,π/2) el coseno es positivo. Allí</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la condición se reduce a sen x≥1/2,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivalente a x≥π/6.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x=π/2 el coseno es cero y el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radicando también, por lo que se</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">incluye ese extremo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>