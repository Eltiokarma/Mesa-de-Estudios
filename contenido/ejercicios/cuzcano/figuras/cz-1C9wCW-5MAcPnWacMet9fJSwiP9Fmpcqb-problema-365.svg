e="#20364b" stroke-width="2"/><line x1="299.9463339476562" y1="339.12467258075293" x2="237.99999999999997" y2="396.51612903225805" stroke="#20364b" stroke-width="2"/><line x1="316.33280246646353" y1="336.2120020737892" x2="304.0995863372157" y2="323.0078957755534" stroke="#1766b0" stroke-width="2.5"/><line x1="308.9971878563326" y1="343.00823325670467" x2="296.76397172708477" y2="329.8041269584688" stroke="#1766b0" stroke-width="2.5"/><text x="292.9559247309432" y="313.33683529586705" font-family="Arial,sans-serif" font-size="12" fill="#20364b" text-anchor="middle">C</text><circle cx="237.99999999999997" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a</text><circle cx="237.99999999999997" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">b</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La carga del capacitor en serie es el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">doble de la de cada capacitor del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su voltaje duplica al de cada uno y su</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">energía es cuatro veces mayor; llega</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primero al límite50 μJ.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los otros almacenan12,5 μJ cada uno;</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">total75 μJ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>