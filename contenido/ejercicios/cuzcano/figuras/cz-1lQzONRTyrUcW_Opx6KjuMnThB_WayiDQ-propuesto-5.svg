<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Lado de un cuadrado a partir de dos diedros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="104.63,207.13 291.16,331.87 375.10,268.45" fill="#f4c581" fill-opacity="0.45"/><polygon points="104.63,207.13 146.60,300.16 375.10,268.45" fill="#f4c581" fill-opacity="0.45"/><polyline points="104.63,331.87 291.16,331.87 375.10,268.45 188.57,268.45 104.63,331.87" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="104.63,331.87 104.63,207.13" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="104.63,207.13 291.16,331.87 375.10,268.45 104.63,207.13" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="104.63,207.13 146.60,300.16 375.10,268.45 104.63,207.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="104.63,331.87 100.90,306.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="104.63,207.13 100.90,306.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="104.63375027430327" y="331.86880175882806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="291.1599736668861" y="331.86880175882806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="268.4498858053499" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="188.57055080096555" y="268.4498858053499" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="104.63375027430327" y="207.13119824117197" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="146.6021505376344" y="300.15934378208897" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="100.90322580645162" y="306.5012353774368" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea s el lado y h=AP. La distancia de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A a BC es s. En coordenadas M=(0,s/2),</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C=(s,s), la distancia de A a MC es</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">s/√5.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las tangentes de los diedros son h/s y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h√5/s. Su producto es 1 porque son</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">complementarios.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De s²=h²√5, resulta s=4·5³ᐟ⁴.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>