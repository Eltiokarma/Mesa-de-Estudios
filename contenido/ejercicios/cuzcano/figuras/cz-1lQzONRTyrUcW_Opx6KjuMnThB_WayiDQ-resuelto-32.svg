<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">032 · Diedro de un cuadrado y un triángulo isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,386.18 334.26,386.18 334.26,152.82 100.90,152.82" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,386.18 334.26,386.18 375.10,267.17" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,152.82 334.26,152.82 375.10,267.17" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,386.18 334.26,386.18 375.10,267.17 100.90,386.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,386.18 334.26,386.18 334.26,152.82 100.90,152.82 100.90,386.18" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,152.82 375.10,267.17 334.26,152.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="217.58,152.82 217.58,386.18 270.09,346.51 375.10,267.17" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="217.58,269.50 270.09,346.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="217.58,152.82 375.10,267.17" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="386.1781056966369" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="334.2594371997254" y="386.1781056966369" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="267.16643788606723" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="334.2594371997254" y="152.82189430336308" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="100.90322580645162" y="152.82189430336308" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="217.58133150308853" y="152.82189430336308" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="217.58133150308853" y="386.1781056966369" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="217.58133150308853" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="270.0864790665752" y="346.5075497597804" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="366.3459162663006" y="270.66678105696633" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea s=AB y h la altura del triángulo.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus centros están en el plano</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a AB por su punto medio,</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a distancias s/2 y h/3 de AB, en</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">direcciones perpendiculares.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La igualdad de ángulos implica</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">s/2=h/3, así que h=3s/2.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El plano QPC sube s entre C y el punto</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio de QP, con recorrido horizontal</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h. La tangente del diedro es s/h.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>