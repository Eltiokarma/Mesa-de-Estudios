<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">009 · Distancia desde el vértice de un isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="322.22952853598014" x2="421" y2="322.22952853598014" stroke="#20364b" stroke-width="1.7"/><line x1="121.99503722084368" y1="105" x2="121.99503722084368" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,322.23 122.00,216.77 375.10,322.23 100.90,322.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">ABC</text><polyline points="100.90,322.23 141.46,224.88" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Altura</text><circle cx="100.90322580645162" cy="322.22952853598014" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="314.22952853598014" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="121.99503722084368" cy="216.77047146401983" r="3.7" fill="#20364b"/><text x="128.9950372208437" y="208.77047146401983" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B(0,5)</text><circle cx="375.0967741935484" cy="322.22952853598014" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="314.22952853598014" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C(12,0)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC=√(12²+5²)=13. Así, 12−x_A=13 y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=(−1,0).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ecuación de BC es 5x+12y−60=0.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En A, divide el valor absoluto de −65</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por 13.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>