<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Diedro definido por dos rectángulos que comparten un lado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="162.13,181.91 162.13,396.52 204.53,357.09" fill="#f4c581" fill-opacity="0.45"/><polygon points="162.13,181.91 162.13,396.52 313.87,396.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="162.13,181.91 313.87,181.91 313.87,396.52 162.13,396.52 162.13,181.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="162.13,181.91 204.53,142.48 204.53,357.09 162.13,396.52 162.13,181.91" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="313.87,396.52 162.13,181.91 204.53,357.09 313.87,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="162.12513635815728" y="181.90960662125156" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="162.12513635815728" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="313.8748636418427" y="181.90960662125156" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="313.8748636418427" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="204.52747967684348" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="204.52747967684348" y="357.09039337874844" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="230.41251363581574" y="388.9286426680738" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="162.12513635815728" y="290.2913199336782" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4√2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las diagonales AC y AE miden</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√((4√2)²+4²)=4√3. Como ∠CAE=60°, ACE</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es equilátero y CE=4√3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la sección perpendicular a AD por</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D, el ángulo del diedro es ∠CDE. Sus</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lados DC y DE miden 4.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la ley de cosenos, cos</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠CDE=(16+16−48)/32=−1/2. Los</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semiplanos indicados forman el diedro</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtuso.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>