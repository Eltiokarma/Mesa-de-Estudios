<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">013 · Número de imágenes en dos espejos que se cierran</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="120.18,142.48 120.18,378.12 355.82,378.12" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="182.25,151.68 120.18,378.12 346.62,317.20" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="120.18,378.12 271.91,226.39" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="277.08,226.39 277.05,226.95 276.96,227.51 276.81,228.05 276.60,228.57 276.34,229.06 276.03,229.53 275.66,229.95 275.26,230.34 274.81,230.68 274.33,230.97 273.82,231.20 273.29,231.38 272.75,231.50 272.19,231.56 271.63,231.56 271.07,231.50 270.53,231.38 269.99,231.20 269.49,230.97 269.01,230.68 268.56,230.34 268.15,229.95 267.79,229.53 267.48,229.06 267.21,228.57 267.01,228.05 266.86,227.51 266.77,226.95 266.74,226.39 266.77,225.84 266.86,225.28 267.01,224.74 267.21,224.22 267.48,223.73 267.79,223.26 268.15,222.84 268.56,222.45 269.01,222.11 269.49,221.82 269.99,221.59 270.53,221.41 271.07,221.29 271.63,221.23 272.19,221.23 272.75,221.29 273.29,221.41 273.82,221.59 274.33,221.82 274.81,222.11 275.26,222.45 275.66,222.84 276.03,223.26 276.34,223.73 276.60,224.22 276.81,224.74 276.96,225.28 277.05,225.84 277.08,226.39" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="298.34702963071084" y="208.00350313822798" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">objeto</text><text x="148.91628959276022" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">eje</text><text x="146.6173551306379" y="158.5764122025982" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ω</text><text x="340.8773171799737" y="289.61567654357026" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ω</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada espejo gira π/12 rad,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivalentes a 15°. El ángulo entre</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ellos pasa de 90° a 60°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuando 360°/θ es un entero par, la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cantidad de imágenes es 360°/θ−1. Al</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inicio son 3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al final son 5. El giro es simétrico y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el objeto sigue en la bisectriz.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>