<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">045 · Relación angular desde una tangencia al suelo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="188.79,269.50 276.67,269.50 364.55,269.50 364.55,357.38 188.79,357.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="188.79,269.50 364.55,357.38" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="188.79,357.38 364.55,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="276.67,269.50 276.25,278.11 274.98,286.65 272.88,295.01 269.98,303.13 266.29,310.93 261.86,318.32 256.72,325.25 250.93,331.64 244.54,337.43 237.61,342.57 230.21,347.01 222.42,350.69 214.30,353.60 205.93,355.69 197.40,356.96 188.79,357.38 180.17,356.96 171.64,355.69 163.27,353.60 155.15,350.69 147.36,347.01 139.96,342.57 133.03,337.43 126.64,331.64 120.85,325.25 115.71,318.32 111.28,310.93 107.59,303.13 104.69,295.01 102.59,286.65 101.33,278.11 100.90,269.50 101.33,260.89 102.59,252.35 104.69,243.99 107.59,235.87 111.28,228.07 115.71,220.68 120.85,213.75 126.64,207.36 133.03,201.57 139.96,196.43 147.36,191.99 155.15,188.31 163.27,185.40 171.64,183.31 180.17,182.04 188.79,181.62 197.40,182.04 205.93,183.31 214.30,185.40 222.42,188.31 230.21,191.99 237.61,196.43 244.54,201.57 250.93,207.36 256.72,213.75 261.86,220.68 266.29,228.07 269.98,235.87 272.88,243.99 274.98,252.35 276.25,260.89 276.67,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="188.78577336641854" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="364.55086848635233" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="364.55086848635233" y="357.3825475599669" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="276.66832092638543" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="188.78577336641854" y="357.3825475599669" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="346.97435897435895" y="293.2282878411911" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="343.45905707196033" y="350.96712158808936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="319.73076923076917" y="258.9540942928039" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h</text><text x="375.09677419354836" y="315.1989247311828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea R=OT, h=PQ y d=TQ. Por SP=PQ,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OP=R+h.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las componentes de OP son d y h−R. Al</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrar, d²=(h+R)²−(h−R)²=4hR.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se tiene tan x=d/h y cot θ=d/R. El</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">producto es d²/(hR).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>