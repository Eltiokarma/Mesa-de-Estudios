<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Problema 50: Ruta directa o vuelta completa</title><desc id="desc">Reconstrucción vectorial. Sólido en perspectiva y sección auxiliar con datos y letras.</desc><rect width="900" height="540" rx="18" fill="#f5f8fc"/><text x="28.00" y="36.00" font-family="Arial,sans-serif" font-size="22" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">50  /  Ruta directa o vuelta completa</text><line x1="460.00" y1="70.00" x2="460.00" y2="490.00" stroke="#d8e2ee" stroke-width="1"/><text x="28.00" y="517.00" font-family="Arial,sans-serif" font-size="14" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Esquema en perspectiva · Las cotas, no la apariencia, definen la geometría.</text><polygon points="550.00,120.00 820.00,120.00 820.00,310.00 550.00,310.00" fill="#e1ecfa" fill-opacity="0.6" stroke="#2463c4" stroke-width="2"/><text x="492.00" y="375.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Sin vuelta: AB = a</text><text x="492.00" y="402.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Con una vuelta: a√(n²+1)</text><text x="492.00" y="429.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">La condición cambia el mínimo.</text><line x1="550.00" y1="120.00" x2="550.00" y2="310.00" stroke="#008778" stroke-width="4"/><line x1="550.00" y1="120.00" x2="820.00" y2="310.00" stroke="#c36117" stroke-width="3"/><text x="550.00" y="105.00" font-family="Arial,sans-serif" font-size="18" fill="#233b53" text-anchor