<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Ordenadas en seno y coseno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="126.66666666666667" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="111.33333333333334" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Punto</text><rect x="174.66666666666669" y="130" width="126.66666666666667" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="238.00000000000003" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Ordenada</text><rect x="301.33333333333337" y="130" width="126.66666666666667" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="364.6666666666667" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Relación</text><rect x="48.0" y="178" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">P</text><rect x="174.66666666666669" y="178" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3a−b</text><rect x="301.33333333333337" y="178" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">sen x₁</text><rect x="48.0" y="226" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Q</text><rect x="174.66666666666669" y="226" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2a+b</text><rect x="301.33333333333337" y="226" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">cos x₂</text><rect x="48.0" y="274" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">P y Q</text><rect x="174.66666666666669" y="274" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">iguales</text><rect x="301.33333333333337" y="274" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">b=a/2</text><text x="48" y="349" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Ordenadas complementarias</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa cos x₂=sen(π/2−x₂)=sen x₁. Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ordenadas son iguales.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resuelve 3a−b=2a+b. Esto da b=a/2.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cociente se convierte en</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(7a/2)/(4a) y vale 7/8 siempre que</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esté definido.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>