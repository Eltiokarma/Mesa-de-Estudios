<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">068 · Focal de dos lentes plano-convexas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="266.29,182.45 254.97,227.72 251.49,269.50 254.97,311.28 266.29,356.55 277.61,311.28 281.09,269.50 277.61,227.72 266.29,182.45" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="266.29,182.45 266.29,356.55" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="118.31,269.50 266.29,182.45" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="335.93,269.50 266.29,182.45" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="168.79877112135176" y="213.79083461341529" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3r</text><text x="319.3876088069636" y="217.27265745007682" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">r</text><text x="233.21249359959037" y="288.6500256016385" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="296.7557603686636" y="288.6500256016385" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La interfaz plana común no aporta</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">potencia. En A la superficie curva</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aporta (2 − 1)/r.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La superficie curva de B aporta (1,5 −</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1)/(3r). La potencia total es 1/r +</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/(6r).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al invertir se obtiene 6r/7.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>