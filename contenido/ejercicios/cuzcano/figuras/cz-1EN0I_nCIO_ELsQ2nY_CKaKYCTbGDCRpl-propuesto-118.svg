<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">118 · Cambio térmico a partir de tres curvas de concentración</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">Tiempo (min)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Concentración relativa</text><polyline points="100.90,359.43 119.18,288.04 146.60,210.53 175.85,155.46 192.30,155.46 283.70,155.46 301.98,180.50 336.71,202.75 367.78,211.09 375.10,211.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">HI</text><polyline points="100.90,211.09 119.18,238.35 146.60,267.94 175.85,288.97 192.30,288.97 283.70,288.97 301.98,272.28 336.71,257.45 367.78,251.88 375.10,251.88" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">I₂</text><polyline points="100.90,263.01 119.18,285.08 146.60,309.03 175.85,326.05 192.30,326.05 283.70,326.05 301.98,309.37 336.71,294.53 367.78,288.97 375.10,288.97" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">H₂</text><circle cx="230.68817204301075" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="237.68817204301075" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">HI</text><circle cx="230.68817204301075" cy="275.9898752060278" r="3.7" fill="#20364b"/><text x="237.68817204301075" y="267.9898752060278" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I₂</text><circle cx="230.68817204301075" cy="313.0748763833294" r="3.7" fill="#20364b"/><text x="237.68817204301075" y="305.0748763833294" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las tres curvas indican que el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilibrio se mueve hacia la izquierda</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y consume HI.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos lados tienen el mismo número</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de moles gaseosos. Cambiar el volumen</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por sí solo no favorece un lado bajo</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el modelo ideal.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La reacción inversa es endotérmica.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elevar la temperatura favorece ese</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sentido, de acuerdo con las curvas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>