ill="#20364b" text-anchor="start">T</text><circle cx="158.21062726759996" cy="293.6312837502012" r="3.7" fill="#20364b"/><text x="165.21062726759996" y="285.6312837502012" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="317.7893727324" cy="293.6312837502012" r="3.7" fill="#20364b"/><text x="324.7893727324" y="285.6312837502012" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma O=(0,0) y L=(4√3,12). El radio y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la altura de V sobre OA son 6, así que</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">V=(4√3,6).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta OL es y=√3x. Al intersectarla</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con la circunferencia se obtienen L y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(√3,3). Por simetría el otro corte es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(7√3,3).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En (x−4√3)²=q(y−6) sustituye el primer</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corte. Resulta q=−9.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>