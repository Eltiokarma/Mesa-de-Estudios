<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">013 · Ecuación de la altura desde un vértice</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,368.29 365.02,368.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="139.21,396.52 139.21,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="195.66,283.61 252.11,198.94 308.56,340.06 195.66,283.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="252.11,198.94 206.95,289.26" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="187.1935483870968" y="265.26612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="260.58064516129036" y="182.00000000000003" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="319.8548387096775" y="345.7096774193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="214.00806451612905" y="307.60483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de AC es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1−3)/(6−2)=−1/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura es perpendicular a AC, por</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lo que su pendiente es 2. Pasa por el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértice opuesto B.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe y−6=2(x−4) y despeja y.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>