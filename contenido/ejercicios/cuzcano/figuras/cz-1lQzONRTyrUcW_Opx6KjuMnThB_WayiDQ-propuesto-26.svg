<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Distancia de un punto sobre un equilátero a una arista oblicua</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,388.23 375.10,388.23 344.86,307.49" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,388.23 375.10,388.23 238.00,150.77" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,388.23 375.10,388.23 344.86,307.49 100.90,388.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,388.23 375.10,388.23 238.00,150.77 100.90,388.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="344.86,307.49 238.00,150.77" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="135.18,328.86 278.07,209.54" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645164" y="388.22928922851173" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354836" y="388.22928922851173" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="344.8563603056606" y="307.4933725531237" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="238.0" y="150.77071077148833" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="135.17741935483872" y="328.86464461425584" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="278.07113511462273" y="209.5417089396016" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon C=(2,2√3,0), D=(2,0,2√3) y N=D/4,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con A en el origen.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector DN tiene módulo 3. Su</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">producto con DC es 9 y ∣DC∣²=24. El</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pie cae a 9/24 del camino de D a C.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia al cuadrado es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3²−9²/24=45/8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>