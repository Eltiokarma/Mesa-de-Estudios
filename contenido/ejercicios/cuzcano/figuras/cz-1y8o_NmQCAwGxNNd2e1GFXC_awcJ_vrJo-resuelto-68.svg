<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">068 · Longitud entre dos puntos medios exteriores</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.61,327.18 112.61,206.80 291.50,206.80 291.50,327.18 112.61,327.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="291.50,206.80 371.75,327.18 291.50,327.18" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="112.61,206.80 371.75,327.18" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="202.05,327.18 331.63,266.99" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="340.5562549173879" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="102.57513768686076" y="198.4437450826121" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="294.84500393391033" y="196.77183320220297" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="294.84500393391033" y="342.22816679779703" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="375.0967741935484" y="333.8686073957514" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="197.87411487018096" y="342.22816679779703" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="338.3147128245476" y="265.3202202989772" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="234.65617623918175" y="250.27301337529505" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">K</text><text x="249.7033831628639" y="307.11801730920536" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa E=(0,0), L=(w,0), P=(0,h), O=(w,h)</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y N=(w+d,0). Entonces A=(w/2,0) e</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I=(w+d/2,h/2).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector A→I es ((w+d)/2,h/2). El</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vector N→P es (−(w+d),h).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La magnitud del primero es la mitad de</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la del segundo. Así AI=PN/2=K/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>