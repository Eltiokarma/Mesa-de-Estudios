<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">072 · Fuerza horizontal para sostener un espejo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="157.28,260.53 362.28,260.53 362.28,363.03 157.28,363.03 157.28,260.53" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="157.28,260.53 245.14,172.67 362.28,260.53" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,363.03 157.28,363.03" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="145.49,368.67 157.28,363.03 145.49,357.40" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="245.13855032516474" y="160.59134760325594" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="182.9050346698824" y="250.28082604763338" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45°</text><text x="335.6334036780223" y="250.28082604763338" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="259.7817304793488" y="378.40865239674406" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2L</text><text x="375.0967741935484" y="311.78218269520653" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="109.61591799819112" y="351.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tomando el origen horizontal en la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esquina izquierda, C queda a altura</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h=x sobre el borde porque tan 45°=1.</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">También h=(2L−x)tan 37°. Con tan</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">37°≈3/4, resulta x=h=6L/7.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto de C las tensiones tienen</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">momento cero. El peso tiene brazo</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">L−x=L/7 y F tiene brazo vertical</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">L+h=13L/7.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala los momentos de sentido</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuesto. Así F=130(L/7)/(13L/7).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>