<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">093 · Precio de lista más porcentaje del costo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="64" y="160" font-family="Arial,sans-serif" font-size="19" fill="#1766b0" text-anchor="start">RELACIONES DEL PROBLEMA</text><text x="64" y="208" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ganancia es 360 y el costo 1440</text><text x="64" y="231" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">soles. El descuento fue 180 soles.</text><text x="64" y="270" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La lista era 1800+180=1980. El</text><text x="64" y="293" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">descuento representa a=10 sobre base</text><text x="64" y="316" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1800.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ganancia es 360 y el costo 1440</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">soles. El descuento fue 180 soles.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La lista era 1800+180=1980. El</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">descuento representa a=10 sobre base</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1800.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Añadir 10% del costo, 144 soles:</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1980+144=2124 soles.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>