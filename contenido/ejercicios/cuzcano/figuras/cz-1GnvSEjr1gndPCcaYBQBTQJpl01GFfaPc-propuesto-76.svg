<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">076 · Voltímetros iguales con corriente de fuga</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="100.90322580645162" y1="269.5" x2="229.0" y2="269.5" stroke="#20364b" stroke-width="2"/><line x1="247.0" y1="269.5" x2="375.09677419354836" y2="269.5" stroke="#20364b" stroke-width="2"/><polyline points="229.0,269.5 232.0,274.5 236.0,264.5 240.0,274.5 244.0,264.5 247.0,269.5" fill="none" stroke="#1766b0" stroke-width="2"/><text x="238.0" y="284.5" font-family="Arial,sans-serif" font-size="12" fill="#20364b" text-anchor="middle">microA I2</text><line x1="100.90322580645162" y1="269.5" x2="100.90322580645162" y2="142.48387096774195" stroke="#20364b" stroke-width="2"/><line x1="100.90322580645162" y1="142.48387096774195" x2="229.0" y2="142.48387096774195" stroke="#20364b" stroke-width="2"/><line x1="247.0" y1="142.48387096774195" x2="375.09677419354836" y2="142.48387096774195" stroke="#20364b" stroke-width="2"/><polyline points="229.0,142.48387096774195 232.0,147.48387096774195 236.0,137.48387096774195 240.0,147.48387096774195 244.0,137.48387096774195 247.0,142.48387096774195" fill="none" stroke="#1766b0" stroke-width="2"/><text x="238.0" y="157.48387096774195" font-family="Arial,sans-serif" font-size="12" fill="#20364b" text-anchor="middle">voltímetro V2</text><line x1="375.09677419354836" y1="142.48387096774195" x2="375.09677419354836" y2="269.5" stroke="#20364b" stroke-width="2"/><circle cx="100.90322580645162" cy="269.5" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a</text><circle cx="375.09677419354836" cy="269.5" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">b</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La corriente por V2 es I1−I2=1 µA.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por V1 pasa I1=100 µA; resistencia de</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cada voltímetro RV=10/(100·10⁻⁶)=100</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">kΩ.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">V2=RV·1 µA=0,1 V.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>