<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Segmento superior entre paralelas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,238.87 175.73,238.87 354.53,238.87 375.10,238.87" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,341.39 122.36,341.39 247.52,341.39 375.10,341.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="122.36,341.39 144.96,194.93 175.73,238.87 247.52,341.39 354.53,238.87" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="122.36,341.39 175.73,238.87" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="118.78351111266583" y="352.1205110910414" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="173.0495502333278" y="229.92549142681523" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="243.9455082561653" y="353.0145253563521" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="357.21648888733415" y="230.81950569212594" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="141.3884049873821" y="185.98547464364788" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="158.7453219883564" y="250.48781952896158" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">γ</text><text x="173.9435644986385" y="258.533947916758" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">γ</text><text x="252.8856509092724" y="320.8300118051666" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">φ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por paralelismo y la bisectriz en B,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠BAC=∠ABC. Luego BC=AC=7.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama u al unitario de C hacia B y h</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">al unitario horizontal hacia la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha. Entonces CD=7u+10h. La</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reflexión que intercambia u y h lleva</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ese vector a 7h+10u.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde A, el punto E′=C+10u tiene</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vector AE′=7h+10u. Forma con h el</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo exigido y está sobre la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">prolongación CB. Por la posición de</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las rectas en el dibujo, E′=E.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>