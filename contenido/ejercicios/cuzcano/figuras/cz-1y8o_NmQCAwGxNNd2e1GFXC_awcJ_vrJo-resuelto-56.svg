<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">056 · Proyección de una diagonal del cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="141.52,353.28 141.52,175.56 319.24,175.56 319.24,353.28 141.52,353.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,359.92 375.10,222.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="141.52,353.28 136.06,342.35" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="319.24,175.56 349.32,235.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="141.52,175.56 207.14,306.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="319.24,353.28 278.23,271.26" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="129.6766228594186" y="371.8994424532059" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="133.06172839506175" y="167.1005575467941" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="319.2425328554361" y="167.1005575467941" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="322.62763839107924" y="371.8994424532059" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="122.90641178813223" y="334.66328156113104" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="351.4010354440462" y="248.3430904022302" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="163.5276782158503" y="239.88032656312225" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="298.93189964157705" y="305.8898845081641" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia de distancias con signo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de I y A es 8−(−5)=13. Es la magnitud</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la proyección de la diagonal IA</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre una normal a la recta.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las diagonales IA y LM del cuadrado</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen la misma longitud y son</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares. Al rotar 90° la</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primera proyección sobre la normal se</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">convierte, en magnitud, en la</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esa proyección es la distancia de sus</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pies P y N. Por tanto, PN=13.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>