<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Cociente de segmentos con producto fijo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,265.18 375.10,265.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,261.78 107.18,268.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="252.54,261.78 252.54,268.58" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="281.61,261.78 281.61,268.58" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.82,261.78 368.82,268.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="107.18246737256834" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="252.53528140304795" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="281.6058442091439" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="368.81753262743166" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea x=DL e y=LO. Como DO=x+y, del dato</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se obtiene IO=x²/(x+y).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe DI=DO−IO. Entonces</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DI=((x+y)²−x²)/(x+y)=y(2x+y)/(x+y).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DI/LO−IO/DL=(2x+y)/(x+y)−x/(x+y)=1.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Añade 8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>