<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">068 · Voltaje entre los extremos de una varilla doblada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="132.71,144.16 258.06,269.50 132.71,394.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="132.71,144.16 132.71,394.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="268.08,269.50 356.66,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="343.29,275.35 356.66,269.50 343.29,263.65" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="119.34019524617997" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="119.34019524617997" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="242.17816213921898" y="302.9252971137521" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="317.3850806451612" y="252.78735144312392" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 m/s</text><text x="288.13794567062814" y="177.58043293718168" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙ 0,8 T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los brazos miden 10√2 m cada uno. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separación perpendicular al movimiento</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 2(10√2) sen 45°=20 m.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza por unidad de carga</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positiva, v×B, apunta hacia abajo.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Integra esta cantidad uniforme entre</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los extremos.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica Bv por la separación</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular. El extremo inferior</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda a mayor potencial.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>