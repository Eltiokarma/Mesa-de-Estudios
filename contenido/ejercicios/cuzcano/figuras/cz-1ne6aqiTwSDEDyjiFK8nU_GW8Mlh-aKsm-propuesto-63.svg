<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">063 · Ángulo que minimiza una suma de seno y cosecante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="155.02,142.48 158.68,153.02 162.35,161.98 166.02,169.62 169.69,176.18 173.36,181.80 177.02,186.64 180.69,190.81 184.36,194.39 188.03,197.47 191.70,200.12 195.36,202.37 199.03,204.29 202.70,205.92 206.37,207.28 210.04,208.41 213.70,209.33 217.37,210.08 221.04,210.66 224.71,211.10 228.38,211.41 232.04,211.61 235.71,211.71 239.38,211.72 243.05,211.65 246.72,211.51 250.38,211.32 254.05,211.07 257.72,210.78 261.39,210.45 265.06,210.08 268.72,209.69 272.39,209.28 276.06,208.85 279.73,208.40 283.40,207.95 287.06,207.49 290.73,207.03 294.40,206.57 298.07,206.11 301.74,205.66 305.40,205.21 309.07,204.78 312.74,204.36 316.41,203.95 320.08,203.56 323.74,203.19 327.41,202.84 331.08,202.51 334.75,202.20 338.42,201.92 342.08,201.66 345.75,201.42 349.42,201.21 353.09,201.03 356.76,200.87 360.42,200.74 364.09,200.64 367.76,200.57 371.43,200.53 375.10,200.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><circle cx="238.0" cy="211.72207514209393" r="3.7" fill="#20364b"/><text x="245.0" y="203.72207514209393" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">mín</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon t=sen x∈(0,1). La expresión es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2t+1/t.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La desigualdad entre media aritmética</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y geométrica da 2t+1/t≥2√2. La</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igualdad exige 2t=1/t.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De t=1/√2 y x agudo resulta x=π/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>