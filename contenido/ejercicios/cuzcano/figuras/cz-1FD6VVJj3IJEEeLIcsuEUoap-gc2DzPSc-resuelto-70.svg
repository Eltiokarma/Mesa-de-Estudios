<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">070 · Cuártica con cambio de variable</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="349.4367949975134" x2="421" y2="349.4367949975134" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">t</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">polinomio transformado</text><polyline points="155.74,142.48 159.40,163.56 163.05,183.41 166.71,202.08 170.37,219.62 174.02,236.06 177.68,251.46 181.33,265.86 184.99,279.29 188.65,291.79 192.30,303.41 195.96,314.18 199.61,324.13 203.27,333.31 206.92,341.73 210.58,349.44 214.24,356.46 217.89,362.82 221.55,368.55 225.20,373.68 228.86,378.22 232.52,382.21 236.17,385.67 239.83,388.61 243.48,391.07 247.14,393.04 250.80,394.56 254.45,395.64 258.11,396.28 261.76,396.52 265.42,396.35 269.08,395.78 272.73,394.84 276.39,393.52 280.04,391.83 283.70,389.77 287.35,387.36 291.01,384.59 294.67,381.46 298.32,377.98 301.98,374.13 305.63,369.93 309.29,365.37 312.95,360.44 316.60,355.13 320.26,349.44 323.91,343.35 327.57,336.86 331.23,329.96 334.88,322.63 338.54,314.86 342.19,306.63 345.85,297.92 349.51,288.72 353.16,279.01 356.82,268.77 360.47,257.97 364.13,246.59 367.78,234.60 371.44,221.98 375.10,208.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">ecuación equivalente</text><circle cx="210.58064516129033" cy="349.4367949975134" r="3.7" fill="#20364b"/><text x="217.58064516129033" y="341.4367949975134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><circle cx="320.258064516129" cy="349.4367949975134" r="3.7" fill="#20364b"/><text x="327.258064516129" y="341.4367949975134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con x&gt;0, x≠1, sea t=log_x2≠0.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">log_x(2/x²)=t−2 y log_x4=2t.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ecuación se transforma en</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(t−2)^4+t³−2t²=(t−2)(t−1)[(t−2)²+4]=0.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El último factor es positivo. t=1 o 2,</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">luego x=2 o √2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>