<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Período y electrones desapareados de cobre y sus iones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="64" y="160" font-family="Arial,sans-serif" font-size="19" fill="#1766b0" text-anchor="start">RELACIONES DEL PROBLEMA</text><text x="64" y="208" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cu está en el período 4 y Au en el 6,</text><text x="64" y="231" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aunque los dos ocupan el grupo 11.</text><text x="64" y="270" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El átomo libre de Cu tiene 4s¹ y Cu²⁺</text><text x="64" y="293" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene 3d⁹, cada uno con un electrón</text><text x="64" y="316" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desapareado. Cu⁺ tiene 3d¹⁰.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cu está en el período 4 y Au en el 6,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aunque los dos ocupan el grupo 11.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El átomo libre de Cu tiene 4s¹ y Cu²⁺</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene 3d⁹, cada uno con un electrón</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desapareado. Cu⁺ tiene 3d¹⁰.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La configuración [Ar]3d⁹ de Cu²⁺ y el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">grupo IB histórico son correctos. La</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">comparación de períodos es la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">afirmación incorrecta.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>