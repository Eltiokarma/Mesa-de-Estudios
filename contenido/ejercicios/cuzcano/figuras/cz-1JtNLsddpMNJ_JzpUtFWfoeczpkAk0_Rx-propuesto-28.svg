<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Radio de un espejo a partir de una imagen real doble</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="257.59,218.87 258.57,220.90 259.52,222.92 260.42,224.95 261.28,226.97 262.11,229.00 262.89,231.02 263.64,233.05 264.34,235.07 265.00,237.10 265.63,239.12 266.21,241.15 266.75,243.17 267.25,245.20 267.72,247.22 268.14,249.25 268.52,251.27 268.86,253.30 269.16,255.32 269.43,257.35 269.65,259.37 269.83,261.40 269.97,263.42 270.07,265.45 270.13,267.47 270.15,269.50 270.13,271.53 270.07,273.55 269.97,275.58 269.83,277.60 269.65,279.63 269.43,281.65 269.16,283.68 268.86,285.70 268.52,287.73 268.14,289.75 267.72,291.78 267.25,293.80 266.75,295.83 266.21,297.85 265.63,299.88 265.00,301.90 264.34,303.93 263.64,305.95 262.89,307.98 262.11,310.00 261.28,312.03 260.42,314.05 259.52,316.08 258.57,318.10 257.59,320.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="200.68,269.50 200.68,251.39" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="202.89,255.83 200.68,251.39 198.46,255.83" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="143.03,269.50 143.03,305.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="140.81,301.28 143.03,305.71 145.25,301.28" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="278.2791061646813" y="273.19533084079643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="200.6771585079558" y="244.74128336666377" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">objeto</text><text x="143.02999739153114" y="312.36583775323885" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">imagen</text><text x="219.5233457960177" y="276.52112859751327" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="181.46143813581426" y="276.52112859751327" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para la imagen real, el módulo del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aumento es q/p=2. Así que q=2p.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como q−p=30 cm, se obtiene p=30 cm y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">q=60 cm.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La focal es pq/(p+q)=20 cm y el radio</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es el doble de la focal.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>