c" stroke-width="4" stroke-linejoin="round">Ángulo entre planos = 60°</text><text x="490.00" y="224.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">h = 3; g = h/cos60° = 6</text><text x="490.00" y="251.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">V = 40·6 = 240 cm³</text></svg>