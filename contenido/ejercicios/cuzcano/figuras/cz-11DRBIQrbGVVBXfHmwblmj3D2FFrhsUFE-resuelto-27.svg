<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Lado de un triángulo con una ceviana de igual longitud</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.89,335.16 215.37,201.17 363.56,336.05 108.89,335.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.89,335.16 294.35,273.05" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645156" y="345.8127675122664" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="214.4850193130807" y="193.18723248773358" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354847" y="343.1506942269548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="300.5587222048231" y="268.61264223822945" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="136.39753627727316" y="318.3046768973797" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="153.2573337509134" y="330.72768556216727" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="213.59766155131015" y="236.66776281449003" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2α + θ</text><text x="198.51257960121097" y="297.0080906148867" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="321.85530848731605" y="292.57130180603406" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Traza BE con E sobre AC y ∠EBC=α. Como</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠ABE=∠BAE=α+θ, resulta BE=AE.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos BCE y ADE son</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">congruentes por lado-ángulo-lado. Así</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CE=DE y ∠ADE=∠BCE. Sea ω ese ángulo,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que también es ∠EDC por el isósceles</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CDE.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces ∠ADC=2ω. Como exterior de</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ADB, vale 2(α+θ). Por ello ∠BCA=ω=∠BAC</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y AB=BC.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>