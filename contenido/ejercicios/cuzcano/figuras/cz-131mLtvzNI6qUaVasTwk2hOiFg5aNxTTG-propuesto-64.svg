<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">064 · Aceleración del CM con fuerzas oblicuas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="311.83870967741933" x2="421" y2="311.83870967741933" stroke="#20364b" stroke-width="1.7"/><line x1="189.11146914120104" y1="105" x2="189.11146914120104" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="189.11,311.84 286.89,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F1</text><line x1="286.88853085879896" y1="142.48387096774195" x2="285.85439526731983" y2="152.43025541529053" stroke="#1766b0" stroke-width="2"/><line x1="286.88853085879896" y1="142.48387096774195" x2="278.791777047155" y2="148.3526508846948" stroke="#1766b0" stroke-width="2"/><polyline points="189.11,311.84 238.00,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">F2</text><line x1="238.0" y1="396.51612903225805" x2="229.90324618835606" y2="390.6473491153052" stroke="#d37618" stroke-width="2"/><line x1="238.0" y1="396.51612903225805" x2="236.96586440852087" y2="386.5697445847095" stroke="#d37618" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El resorte es interno: sus fuerzas se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cancelan en la suma.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Fx=200cos60°+100cos60°=150 N;</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Fy=(200−100)sin60°=50√3 N.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dividir entre6 kg: a CM=25î+(25√3/3)ĵ</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m/s².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>