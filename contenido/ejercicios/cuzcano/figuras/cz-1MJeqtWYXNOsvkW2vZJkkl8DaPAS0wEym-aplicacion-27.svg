<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Comparar una fuerza horizontal y otra paralela a la rampa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,231.11 210.58,307.89 169.45,307.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="265.42,231.11 375.10,307.89 333.97,307.89" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="146.20,262.82 165.29,276.18 178.65,257.09 159.56,243.72 146.20,262.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="310.71,262.82 329.80,276.18 343.17,257.09 324.08,243.72 310.71,262.82" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="213.87,262.65 173.02,262.65 180.42,257.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="173.02,262.65 180.42,267.31" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="369.61,296.92 336.16,273.50 345.21,274.16" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="336.16,273.50 340.27,281.29" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="200.43548387096777" y="255.51612903225808" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F₁</text><text x="363.58064516129036" y="284.85483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F₂</text><text x="196.59677419354838" y="302.9516129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="361.11290322580646" y="302.9516129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La componente del peso cuesta abajo es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mg sen α en ambos ensayos.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza horizontal aporta F₁ cos α</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuesta arriba. La fuerza paralela</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aporta todo F₂.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ambas aportaciones equilibran el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mismo peso, F₁ cos α=F₂.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>