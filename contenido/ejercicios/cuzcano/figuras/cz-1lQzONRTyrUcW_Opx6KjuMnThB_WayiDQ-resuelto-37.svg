<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">037 · Longitud desde una perpendicular sobre un rectángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="143.45,316.77 280.55,284.63 186.00,190.08" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,348.92 186.00,284.63 375.10,284.63 290.00,348.92 100.90,348.92" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="186.00,190.08 186.00,284.63" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="186.00,190.08 143.45,316.77 375.10,284.63" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="186.00,190.08 290.00,348.92" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,348.92 375.10,284.63" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="143.45,316.77 280.55,284.63" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="186.00,190.08 280.55,284.63" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="186.00,284.63 290.00,348.92" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="100.9032258064516" y="348.92157953281423" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="185.99777530589543" y="284.6279199110122" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="284.6279199110122" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="290.0022246941046" y="348.92157953281423" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="143.4505005561735" y="316.7747497219132" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="280.5472747497219" y="284.6279199110122" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="185.99777530589543" y="190.0784204671857" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea AB=a, BC=b y BP=h. Entonces</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC²=a²+b² y MP²=a²/4+h². De AC=2MP</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sale b=2h.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El producto escalar de AC con MP es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a²/2. Por el ángulo de 60° y AC=2MP,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ese producto también vale MP². Así</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a²/4=h² y a=2h.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De PC²=b²+h²=20 sale h=2. Luego</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PD²=a²+b²+h²=36.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>