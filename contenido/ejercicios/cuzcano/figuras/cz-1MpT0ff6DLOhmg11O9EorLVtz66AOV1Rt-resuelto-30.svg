<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Recta por el punto medio de un cateto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="347.8410138248848" x2="421" y2="347.8410138248848" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,347.84 218.41,191.16 375.10,308.67 100.90,347.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Triángulo</text><polyline points="159.66,269.50 375.10,308.67" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Recta por M y A</text><circle cx="100.90322580645162" cy="347.8410138248848" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="339.8410138248848" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="218.4147465437788" cy="191.15898617511522" r="3.7" fill="#20364b"/><text x="225.4147465437788" y="183.15898617511522" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">L</text><circle cx="159.65898617511522" cy="269.5" r="3.7" fill="#20364b"/><text x="166.65898617511522" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="375.0967741935484" cy="308.6705069124424" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="300.6705069124424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Gira el vector OL=(3,4) 90° en sentido</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horario. Se obtiene LA=(4,−3) y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=(7,1).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio de OL es (3/2,2), así</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que la pendiente hacia A es −2/11.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe y−1=−2(x−7)/11.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>