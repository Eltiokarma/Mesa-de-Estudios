oints="229.83364591927742,202.2089920494186 230.4541287048225,208.00683657241527 238.28688989009072,200.61441800914682 237.71311010990922,211.36945295859513 245.54587129517745,203.97703439532668 246.16635408072253,209.77487891832334" fill="none" stroke="#1766b0" stroke-width="2"/><text x="229.59345903455028" y="219.13938899658774" font-family="Arial,sans-serif" font-size="12" fill="#20364b" text-anchor="middle">R</text><line x1="375.09677419354836" y1="269.5" x2="246.16635408072253" y2="329.22512108167666" stroke="#20364b" stroke-width="2"/><line x1="229.83364591927742" y1="336.7910079505814" x2="100.9032258064516" y2="396.51612903225805" stroke="#20364b" stroke-width="2"/><polyline points="246.16635408072253,329.22512108167666 241.3426008124526,325.9492388483149 241.91638059263408,336.7042737977632 234.08361940736586,329.31185523449483 234.65739918754736,340.06689018394314 229.83364591927742,336.7910079505814" fill="none" stroke="#1766b0" stroke-width="2"/><text x="229.59345903455028" y="309.86061100341226" font-family="Arial,sans-serif" font-size="12" fill="#20364b" text-anchor="middle">5Ω</text><line x1="237.99999999999997" y1="269.5" x2="297.54838709677415" y2="269.5" stroke="#20364b" stroke-width="2"/><line x1="315.54838709677415" y1="269.5" x2="375.09677419354836" y2="269.5" stroke="#20364b" stroke-width="2"/><polyline points="297.54838709677415,269.5 300.54838709677415,274.5 304.54838709677415,264.5 308.54838709677415,274.5 312.54838709677415,264.5 315.54838709677415,269.5" fill="none" stroke="#1766b0" stroke-width="2"/><text x="306.54838709677415" y="284.5" font-family="Arial,sans-serif" font-size="12" fill="#20364b" text-anchor="middle">4Ω</text><circle cx="100.9032258064516" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a</text><circle cx="100.9032258064516" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">b</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El dato de corriente exige</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Rtotal=30/2=15 Ω; carga formal15−6=9</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ω.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pero la ruta de 1+2 Ω sola ya conecta</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a con b; añadir ramas pasivas sólo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puede disminuirla: Rcarga≤3 Ω.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">No existe R positiva que satisfaga</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ambos datos.9 Ω es sólo deducción</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">formal, no solución física de la red.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>