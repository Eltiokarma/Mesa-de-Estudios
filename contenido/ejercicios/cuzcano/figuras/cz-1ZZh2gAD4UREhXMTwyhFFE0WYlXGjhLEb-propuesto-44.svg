<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Giro hasta aceleración a 45°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="110.98387096774195" y1="105" x2="110.98387096774195" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="110.98,396.52 365.02,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">at (escala)</text><line x1="365.01612903225805" y1="396.51612903225805" x2="355.88523962913496" y2="400.59373356285374" stroke="#1766b0" stroke-width="2"/><line x1="365.01612903225805" y1="396.51612903225805" x2="355.88523962913496" y2="392.43852450166236" stroke="#1766b0" stroke-width="2"/><polyline points="110.98,396.52 110.98,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">an</text><line x1="110.98387096774195" y1="142.48387096774195" x2="115.06147549833766" y2="151.61476037086504" stroke="#d37618" stroke-width="2"/><line x1="110.98387096774195" y1="142.48387096774195" x2="106.90626643714624" y2="151.61476037086504" stroke="#d37618" stroke-width="2"/><polyline points="110.98,396.52 365.02,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">a a 45°</text><line x1="365.01612903225805" y1="142.48387096774195" x2="361.44291703162656" y2="151.82368659753587" stroke="#008674" stroke-width="2"/><line x1="365.01612903225805" y1="142.48387096774195" x2="355.67631340246413" y2="146.05708296837346" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A 45°, an=at.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde reposo con at constante, v²=2at</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">s=2atRθ.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">an=v²/R=2atθ; igualar a at da θ=1/2</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rad.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>