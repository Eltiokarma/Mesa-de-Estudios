<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">048 · Ángulo a partir de la proyección de un extremo de la base</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.29,327.38 179.71,206.70 365.25,328.20 108.29,327.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="179.71,206.70 238.00,327.38" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="108.29,327.38 211.73,275.66" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645156" y="338.86932586440025" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="179.71334749855126" y="198.48879660034765" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354847" y="335.58557079389607" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="237.17906123237398" y="340.51120339965235" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="219.93934711222715" y="273.1942244543171" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="168.22020475178672" y="300.2852037859764" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="283.97257098705813" y="257.5963878694224" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2a</text><text x="206.80432683021053" y="232.14728607301524" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como M es punto medio de AC, la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simetría central en M lleva A a C y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva la recta BM. Las dos</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancias a BM son iguales a AH.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la fórmula de distancia a una</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recta por B, sen(∠MBC)=AH/BC=½.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre 0° y 180° el seno vale ½ en 30°</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 150°. La figura del impreso muestra</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el caso de 30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>