<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Tanque con un desagüe lateral</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="167.61,142.48 167.61,396.52 294.63,396.52 294.63,142.48 167.61,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="167.61,311.84 294.63,311.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="294.63,142.48 327.44,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="294.63,311.84 327.44,311.84" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="155.5594758064516" y="155.6532258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">h</text><text x="155.5594758064516" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">h/3</text><text x="155.5594758064516" y="388.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">fondo</text><text x="322.7973790322581" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A · entrada</text><text x="322.7973790322581" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B · desagüe</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B no descarga mientras el agua esté</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">debajo de su boca. A llena el primer</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tercio en 4 h.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El caudal de B es (2/3)/10=1/15. Desde</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esa altura, el neto es 1/12−1/15=1/60.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los 2/3 restantes toman 40 h. En</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">total, 44 h.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>