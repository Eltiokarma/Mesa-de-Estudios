<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Proposiciones y neutralidad de la pelotita</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="228.71,173.46 191.53,315.97" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="206.40,330.84 206.36,329.67 206.22,328.51 205.99,327.37 205.67,326.24 205.27,325.15 204.78,324.09 204.21,323.07 203.56,322.10 202.84,321.18 202.05,320.32 201.19,319.53 200.27,318.81 199.30,318.16 198.28,317.59 197.22,317.10 196.13,316.70 195.00,316.38 193.86,316.15 192.70,316.02 191.53,315.97 190.36,316.02 189.20,316.15 188.06,316.38 186.94,316.70 185.84,317.10 184.78,317.59 183.76,318.16 182.79,318.81 181.87,319.53 181.02,320.32 180.22,321.18 179.50,322.10 178.85,323.07 178.28,324.09 177.79,325.15 177.39,326.24 177.07,327.37 176.84,328.51 176.71,329.67 176.66,330.84 176.71,332.01 176.84,333.17 177.07,334.31 177.39,335.43 177.79,336.53 178.28,337.59 178.85,338.61 179.50,339.58 180.22,340.50 181.02,341.35 181.87,342.15 182.79,342.87 183.76,343.52 184.78,344.09 185.84,344.58 186.94,344.98 188.06,345.30 189.20,345.53 190.36,345.66 191.53,345.71 192.70,345.66 193.86,345.53 195.00,345.30 196.13,344.98 197.22,344.58 198.28,344.09 199.30,343.52 200.27,342.87 201.19,342.15 202.05,341.35 202.84,340.50 203.56,339.58 204.21,338.61 204.78,337.59 205.27,336.53 205.67,335.43 205.99,334.31 206.22,333.17 206.36,332.01 206.40,330.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="346.43,330.84 346.33,328.41 346.05,325.99 345.57,323.61 344.91,321.27 344.07,318.98 343.05,316.78 341.86,314.65 340.51,312.63 339.01,310.72 337.35,308.93 335.57,307.28 333.66,305.78 331.64,304.43 329.51,303.24 327.30,302.22 325.02,301.38 322.68,300.72 320.30,300.24 317.88,299.96 315.45,299.86 313.02,299.96 310.60,300.24 308.22,300.72 305.88,301.38 303.59,302.22 301.38,303.24 299.26,304.43 297.24,305.78 295.33,307.28 293.54,308.93 291.89,310.72 290.39,312.63 289.03,314.65 287.85,316.78 286.83,318.98 285.99,321.27 285.33,323.61 284.85,325.99 284.56,328.41 284.47,330.84 284.56,333.27 284.85,335.69 285.33,338.07 285.99,340.41 286.83,342.69 287.85,344.90 289.03,347.03 290.39,349.05 291.89,350.96 293.54,352.75 295.33,354.40 297.24,355.90 299.26,357.25 301.38,358.44 303.59,359.46 305.88,360.30 308.22,360.96 310.60,361.44 313.02,361.72 315.45,361.82 317.88,361.72 320.30,361.44 322.68,360.96 325.02,360.30 327.30,359.46 329.51,358.44 331.64,357.25 333.66,355.90 335.57,354.40 337.35,352.75 339.01,350.96 340.51,349.05 341.86,347.03 343.05,344.90 344.07,342.69 344.91,340.41 345.57,338.07 346.05,335.69 346.33,333.27 346.43,330.84" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="210.12,330.84 265.88,330.84" fill="none" stroke="#b0467a" stroke-width="2.5"/><line x1="265.88158929976396" y1="330.8394964594807" x2="256.75069989664087" y2="334.9171009900764" stroke="#b0467a" stroke-width="2"/><line x1="265.88158929976396" y1="330.8394964594807" x2="256.75069989664087" y2="326.761891928885" stroke="#b0467a" stroke-width="2"/><text x="161.3552321007081" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">pelotita neutral</text><text x="297.6652242328875" y="264.59795436664047" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">+Q</text><text x="210.92250196695517" y="369.92840283241543" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">fuerza hacia +Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I es verdadera: perder electrones deja</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">carga positiva. II es falsa si la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pelotita empieza neutra: se polariza y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es atraída.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">III es verdadera para un electroscopio</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inicialmente neutro. IV es verdadera:</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde tierra llegan electrones a la</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esfera positiva.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La secuencia editorial es VFVV, opción</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D, bajo esas condiciones iniciales.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sin conocer la carga previa de la</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pelotita, no se puede fijar II; una</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pelotita positiva puede ser repelida.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>