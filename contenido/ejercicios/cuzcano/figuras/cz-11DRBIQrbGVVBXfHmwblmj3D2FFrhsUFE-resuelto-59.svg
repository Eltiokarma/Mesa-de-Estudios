<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">059 · Distancia sobre una ceviana exterior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.61,326.50 155.29,208.78 369.14,326.50 107.61,326.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="155.29,208.78 296.12,326.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="155.29,208.78 172.43,326.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="172.43,326.50 270.04,214.74" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="235.76,252.74 296.12,326.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="304.31,292.23 304.31,326.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645166" y="332.46020336605886" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="156.03997194950915" y="202.0692496493689" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="296.8622019635343" y="335.44056802244035" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="171.68688639551195" y="336.9307503506311" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.09677419354836" y="332.46020336605886" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="236.50981767180926" y="245.28453716690044" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="311.0189340813464" y="292.2252805049088" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="314.74438990182324" y="313.8329242636746" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como DB=DC, ∠C es la mitad del ángulo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en B. Por suma angular, ∠C=35° y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠B=70°. La recta DP es perpendicular a</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC y forma 55° con AE.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La disposición de ∠DPE=100° da</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠BEP=25°. Así ∠PBC=35°−25°=10°. Como</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PB=PC, ∠BCP=10°, y el ángulo de CP con</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la base hacia D es 45°.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P tiene altura 10 sobre AE porque Q es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto medio de PE. Con el ángulo de</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">45°, PC es la hipotenusa de un</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo rectángulo de catetos 10.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>