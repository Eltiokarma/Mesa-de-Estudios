<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Ángulo con polarización por reflexión</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,252.95 375.10,252.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,158.40 238.00,380.60" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="116.98,162.19 238.00,252.95 359.02,162.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,252.95 323.09,366.41" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="178.43381535038935" y="234.98943270300333" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="306.075639599555" y="171.6412680756396" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Reflejado</text><text x="334.440489432703" y="368.30422691879863" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Refractado</text><text x="131.1590656284761" y="292.6646273637375" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n₂ = 4/3</text><text x="135.8865406006674" y="179.2052280311457" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n₁ = 1</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la condición de Brewster, el rayo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reflejado y el refractado son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares. La incidencia desde</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la normal vale 90° − α y la refracción</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale α.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Snell da sen(90° − α) = (4/3) sen α,</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es decir, cos α = (4/3) sen α.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto tan α = 3/4. El ángulo</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">buscado es aproximadamente 37°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>