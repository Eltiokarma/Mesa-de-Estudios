<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Reflexiones y un triángulo 3–4–5</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.37,315.91 224.39,315.91 375.10,315.91 299.74,272.40" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.37,315.91 166.38,215.43" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="166.38,339.11 166.38,215.43 166.38,199.89" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="299.74,339.11 299.74,272.40 299.74,199.89" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="308.4380996291811" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="216.91924179292278" y="308.4380996291811" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="367.6284674281411" y="308.4380996291811" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="158.91123379968718" y="207.96528253903557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="292.27385461053194" y="264.93209363425444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="171.71404539752828" y="199.89039040811733" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="305.076666208373" y="199.89039040811733" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La primera mediatriz refleja A en B y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva P, así que BP=AP=4. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segunda da BQ=QC=3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En B, los rayos BP y BQ forman con las</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">direcciones BA y BC los ángulos α y β.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ello, ∠PBQ=180°−α−β=90°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica Pitágoras en PBQ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>