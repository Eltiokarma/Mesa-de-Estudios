<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Altura de un punto en el lado de un rectángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,351.59 100.90,186.42 365.19,186.42 365.19,351.59 100.90,351.59" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,351.59 365.19,186.42" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,186.42 365.19,296.53" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="259.47,186.42 259.47,252.49" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="362.1642052079285" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="176.50544111931595" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="365.18616401088224" y="176.50544111931595" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="365.18616401088224" y="362.494558880684" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.09677419354836" y="295.4327633113097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="254.5176836377769" y="262.3973960357559" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="259.47298872910994" y="176.50544111931595" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Coloca A=(0,0), B=(0,15), C=(w,15) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(w,0). Como F tiene altura 9 y está</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en AC, su abscisa es 3w/5.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe E=(w,e). En BE, la altura a la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fracción 3/5 del recorrido es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15+(3/5)(e−15).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala esa altura a 9 y despeja e.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>