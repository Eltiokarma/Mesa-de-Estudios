<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Comparar blanco y sombreado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="179.24,223.28 140.07,262.45 179.24,275.51 257.59,301.62" fill="#f4c581" fill-opacity="0.45"/><polygon points="179.24,301.62 100.90,301.62 179.24,275.51" fill="#f4c581" fill-opacity="0.45"/><polygon points="296.76,301.62 296.76,223.28 335.93,223.28" fill="#f4c581" fill-opacity="0.45"/><polygon points="296.76,301.62 375.10,223.28 375.10,262.45" fill="#f4c581" fill-opacity="0.45"/><polygon points="335.93,301.62 375.10,301.62 375.10,262.45" fill="#f4c581" fill-opacity="0.45"/><polyline points="179.24,223.28 100.90,301.62 257.59,301.62 179.24,223.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="179.24,223.28 179.24,301.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="140.07,262.45 257.59,301.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,301.62 179.24,275.51" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="296.76,301.62 375.10,301.62 375.10,223.28 296.76,223.28 296.76,301.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="296.76,301.62 335.93,223.28" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="296.76,301.62 375.10,223.28" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="296.76,301.62 375.10,262.45 335.93,301.62" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="179.24,223.28 140.07,262.45 179.24,275.51 257.59,301.62 179.24,223.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="179.24,301.62 100.90,301.62 179.24,275.51 179.24,301.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="296.76,301.62 296.76,223.28 335.93,223.28 296.76,301.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="296.76,301.62 375.10,223.28 375.10,262.45 296.76,301.62" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="335.93,301.62 375.10,301.62 375.10,262.45 335.93,301.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="176.4516129032258" y="307.721198156682" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I</text><text x="335.0921658986175" y="307.721198156682" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">II</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo mide 64·3/16=12 cm². La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mediana y el segmento al punto medio</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de un lado se cortan a un tercio de la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura desde la base; las dos zonas</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">blancas suman un tercio del total.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las tres sombras del cuadrado miden</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/4, 1/4 y 1/8 de su área: 40 cm² en</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conjunto.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El blanco mide 4 cm²; 4/40=10%.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>