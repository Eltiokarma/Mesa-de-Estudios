ily="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">↑↓</text><rect x="156.57142857142856" y="274" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="183.7142857142857" y="305.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">↑↓</text><rect x="210.85714285714286" y="274" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="305.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">↑</text><rect x="265.1428571428571" y="274" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="292.2857142857143" y="305.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">↑↓</text><rect x="319.42857142857144" y="274" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="346.5714285714286" y="305.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">↑</text><rect x="373.7142857142857" y="274" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="400.8571428571429" y="305.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">↑↓</text><text x="48" y="349" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Ocupaciones del impreso</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ti²⁺ pierde los electrones 4s y queda</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con dos electrones 3d, así que I es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">incorrecto.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para 3d⁵, Hund favorece cinco espines</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelos en los cinco orbitales, por</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lo que II es incorrecto.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En III, tres orbitales d tienen pares</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y dos conservan un electrón cada uno.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se ajusta al esquema de Ni [Ar]3d⁸4s².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>