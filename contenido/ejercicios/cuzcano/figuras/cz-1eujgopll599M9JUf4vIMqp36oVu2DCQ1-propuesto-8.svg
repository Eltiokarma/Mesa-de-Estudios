<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Altura máxima con un ángulo recto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="140.07,333.01 257.59,142.48 375.10,163.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Ángulo recto</text><polyline points="140.07,333.01 375.10,163.65" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Diámetro</text><polyline points="257.59,248.33 257.59,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Radio vertical</text><circle cx="140.073732718894" cy="333.008064516129" r="3.7" fill="#20364b"/><text x="147.073732718894" y="325.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A (1,3)</text><circle cx="375.0967741935484" cy="163.6532258064516" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="155.6532258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B (7,11)</text><circle cx="257.58525345622115" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="264.58525345622115" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="257.58525345622115" cy="248.3306451612903" r="3.7" fill="#20364b"/><text x="264.58525345622115" y="240.3306451612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Centro</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el teorema de Tales, P pertenece a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la circunferencia con diámetro AB.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro es (4,7) y el radio es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(6²+8²)/2=5.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto superior de la circunferencia</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene la abscisa del centro y ordenada</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">7+5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>