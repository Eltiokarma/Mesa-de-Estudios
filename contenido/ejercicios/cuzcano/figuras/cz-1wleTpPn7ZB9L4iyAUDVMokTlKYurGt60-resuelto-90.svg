369863" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">●</text><text x="120.4071661237785" y="230.24014920668276" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="181.64453083955027" y="254.10134496164756" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">●</text><text x="179.3543133340338" y="230.24014920668276" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><text x="252.3811074918567" y="277.32294840811176" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">●</text><text x="238.30146054428917" y="230.24014920668276" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="288.10665125564776" y="289.11237785016283" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">●</text><text x="297.2486077545444" y="230.24014920668276" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="335.264369023852" y="265.89077440369863" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">●</text><text x="356.1957549647998" y="230.24014920668276" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">sigue</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Del primer al segundo símbolo hay un</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">giro de 90° horario: el brazo recto</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pasa de oeste a norte.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto negro y los círculos giran</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">junto con sus brazos, conservando su</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posición relativa.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El quinto completa 360° y coincide con</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el primero: brazo recto hacia la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda y punto negro encima de él.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>