<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">050 · Cinco ángulos exteriores en una estrella</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="116.48,295.98 280.06,155.77 264.48,373.88 136.74,182.26 356.40,288.20 116.48,295.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,310.01 116.48,295.98" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="280.06,155.77 292.53,144.87" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="264.48,373.88 276.95,394.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="121.16,174.47 136.74,182.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="356.40,288.20 375.10,297.54" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="119.5982404692082" y="317.79545454545456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">r</text><text x="113.36656891495602" y="202.50953079178888" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">e</text><text x="290.9692082111437" y="169.79325513196483" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">c</text><text x="345.49633431085044" y="311.56378299120234" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t</text><text x="281.6217008797654" y="373.88049853372434" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Recorre la estrella siguiendo sus</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cinco segmentos. En cada punta el giro</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior es el suplemento indicado en</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el dibujo.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En un pentagrama convexo de puntas</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ordenadas, este recorrido da dos</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vueltas completas en el mismo sentido.</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Puede verse siguiendo los rumbos de</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cada segmento alrededor de las cinco</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada vuelta suma 360°. Por tanto, la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suma de los giros marcados es</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2×360°=720°. Equivalentemente, los</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos interiores de las puntas suman</text><text x="482" y="422" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>