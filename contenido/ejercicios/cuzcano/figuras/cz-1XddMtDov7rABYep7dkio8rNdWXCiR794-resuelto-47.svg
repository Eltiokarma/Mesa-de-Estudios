<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">047 · Cuadrados de lados sucesivamente partidos a la mitad</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="142.53,369.95 142.53,148.57 363.91,148.57 363.91,369.95 142.53,369.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="142.53,369.95 142.53,259.26 253.22,259.26 253.22,369.95 142.53,369.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="142.53,369.95 142.53,314.61 197.88,314.61 197.88,369.95 142.53,369.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="142.53,369.95 142.53,342.28 170.20,342.28 170.20,369.95 142.53,369.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="142.53,369.95 142.53,356.11 156.37,356.11 156.37,369.95 142.53,369.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="142.53,369.95 142.53,363.03 149.45,363.03 149.45,369.95 142.53,369.95" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="134.0338393421885" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="370.9092346616066" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="370.9092346616066" y="378.5540796963947" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="132.926944971537" y="378.5540796963947" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D</text><text x="235.3146742567995" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4a</text><text x="119.09076533839342" y="259.5629348513599" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4a</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El primero tiene área 16a². Al dividir</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un lado por 2, el área se divide por</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las áreas forman una geométrica</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">convergente de razón 1/4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma es 16a²/(1−1/4)=64a²/3. Si se</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pidiera solo el área de la unión,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sería la del cuadrado grande.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>