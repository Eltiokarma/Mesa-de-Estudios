rcle cx="306.5483870967742" cy="269.5" r="3.7" fill="#20364b"/><text x="313.5483870967742" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">0,3π</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre ceros consecutivos hay T/2=0,2π:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ω=5 rad/s y A=amax/ω²=2/25=8 cm.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=2cos5t implica x=−0,08cos5t. Cuando</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=0, x=0 y la rapidez es máxima, no</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cero.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para t=π/15, x=−0,08cos(π/3)=−0,04 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>