0,267.94 219.09,268.18 219.32,268.46 219.49,268.78 219.60,269.13 219.64,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="269.8712058088323" y="278.10016664682774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="193.98738245446972" y="230.04041185573146" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">joven</text><text x="122.65658850136889" y="230.04041185573146" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">imagen inicial</text><text x="217.76431377216997" y="281.13551958100226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="170.21045113676945" y="281.13551958100226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para que la imagen pase por el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">infinito, el espejo debe ser cóncavo y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el joven debe llegar a su foco,</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">situado a 20 m del vértice.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una imagen finita a 20 m de C puede</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">quedar en el foco o a 60 m del</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértice, sobre el eje. La primera</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posición exigiría un objeto en el</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">infinito. Usa q=60 m:</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El joven avanza 30−20=10 m desde el</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reposo. De 10=5t²/2 resulta t=2 s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>