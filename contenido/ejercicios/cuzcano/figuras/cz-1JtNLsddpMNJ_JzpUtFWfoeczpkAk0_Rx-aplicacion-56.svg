" stroke="#b0467a" stroke-width="2.5"/><polyline points="282.56,308.57 282.56,220.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="124.89516129032259" y="252.36290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Luz</text><text x="193.44354838709677" y="332.56451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Eje</text><text x="282.55645161290323" y="332.56451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Eje</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una onda longitudinal pura tiene una</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">única dirección de oscilación, así que</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I es falsa.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El patrón de difracción se describe</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mediante amplitudes ondulatorias. II</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es falsa.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Un filtro estacionario selecciona</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes y atenúa el haz a cada</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frecuencia, pero no desplaza esa</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frecuencia. Solo III es correcta.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>