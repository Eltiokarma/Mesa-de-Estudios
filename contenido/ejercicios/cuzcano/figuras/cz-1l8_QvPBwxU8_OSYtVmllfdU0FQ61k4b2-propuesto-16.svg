<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Alcoholes, puentes de hidrógeno y un éter aromático</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,359.61 143.98,305.33 143.98,196.76 238.00,142.48 332.02,196.76 332.02,305.33 238.00,359.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="286.85,251.04 286.58,256.15 285.78,261.20 284.46,266.14 282.63,270.91 280.31,275.47 277.52,279.76 274.30,283.73 270.69,287.35 266.71,290.57 262.43,293.35 257.87,295.67 253.10,297.51 248.16,298.83 243.11,299.63 238.00,299.90 232.89,299.63 227.84,298.83 222.90,297.51 218.13,295.67 213.57,293.35 209.29,290.57 205.31,287.35 201.70,283.73 198.48,279.76 195.69,275.47 193.37,270.91 191.54,266.14 190.22,261.20 189.42,256.15 189.15,251.04 189.42,245.94 190.22,240.89 191.54,235.95 193.37,231.17 195.69,226.62 198.48,222.33 201.70,218.36 205.31,214.74 209.29,211.52 213.57,208.74 218.13,206.42 222.90,204.58 227.84,203.26 232.89,202.46 238.00,202.19 243.11,202.46 248.16,203.26 253.10,204.58 257.87,206.42 262.43,208.74 266.71,211.52 270.69,214.74 274.30,218.36 277.52,222.33 280.31,226.62 282.63,231.17 284.46,235.95 285.78,240.89 286.58,245.94 286.85,251.04" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,359.61 238.00,378.06" fill="none" stroke="#008674" stroke-width="2.5"/><text x="238.0" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O–CH₃</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La clasificación de alcoholes se basa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en el número de vecinos carbonados del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">carbono que lleva OH.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En un éter simple, el oxígeno puede</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aceptar puentes de hidrógeno de otras</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">especies. Entre moléculas del éter</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puro no hay un OH que los done.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El sustituyente OCH₃ unido al benceno</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es metoxi. La estructura se llama</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">metoxibenceno.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>