<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">043 · Un bloque entre piso y cuña lisa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="167.09,320.79 167.09,239.01 299.41,239.01 252.18,320.79 167.09,320.79" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="252.18,320.79 375.10,320.79 375.10,239.01 299.41,239.01" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,327.88 375.10,211.12" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="152.91,320.79 375.10,320.79" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,280.61 167.09,280.61 156.21,274.94" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="167.09,280.61 156.21,286.28" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="209.1624026696329" y="282.9733036707453" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="332.0767519466073" y="282.9733036707453" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="272.03781979977754" y="314.174638487208" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="132.5773081201335" y="267.3726362625139" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50√3 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La normal de B sobre A apunta hacia</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arriba y a la izquierda, a 30° sobre</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la horizontal.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Equilibra horizontalmente N cos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">30°=50√3. Resulta N=100 N.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En vertical el peso de 100 N se</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilibra con la reacción del piso más</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N sen 30°=50 N.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>