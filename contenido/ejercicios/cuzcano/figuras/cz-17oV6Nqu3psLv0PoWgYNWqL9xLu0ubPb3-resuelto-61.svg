<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">061 · Pendiente de la perpendicular al rayo de un punto medio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,225.98 375.10,225.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="172.72,341.31 172.72,197.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="346.81,225.98 259.76,269.50 172.72,313.02" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="172.72,225.98 259.76,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="172.72,225.98 129.19,313.02" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="196.65,225.98 196.41,222.60 195.70,219.29 194.53,216.11 192.91,213.13 190.90,210.41 188.52,208.00 185.82,205.95 182.86,204.30 179.70,203.08 176.40,202.33 173.03,202.04 169.64,202.24 166.32,202.91 163.13,204.04 160.13,205.61 157.38,207.59 154.94,209.94 152.86,212.61 151.17,215.55 149.91,218.69 149.11,221.99 148.79,225.36 148.94,228.74 149.57,232.07 150.66,235.28 152.19,238.30 154.14,241.07 156.45,243.54 159.09,245.66 162.01,247.39" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="172.71582181259598" y="225.97721454173066" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="346.8069636456733" y="225.97721454173066" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="172.71582181259598" y="313.02278545826937" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="259.7613927291346" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="375.09677419354836" y="231.41756272401435" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="180.3323092677931" y="197.68740399385558" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="147.9078341013825" y="241.64541730670766" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio es M=(2,−1).</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de OM es −1/2. Una</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular tiene pendiente 2.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el tercer cuadrante puede usarse el</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vector (−1,−2). Su cociente y/x es 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>