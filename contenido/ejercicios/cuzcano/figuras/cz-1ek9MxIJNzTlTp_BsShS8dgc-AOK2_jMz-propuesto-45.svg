.29 295.12,198.94 297.41,204.58 299.69,210.23 301.98,215.87 304.26,221.52 306.55,227.16 308.83,221.52 311.12,215.87 313.40,210.23 315.69,204.58 317.97,198.94 320.26,193.29 322.54,187.65 324.83,182.00 327.11,176.35 329.40,170.71 331.68,165.06 333.97,159.42 336.25,153.77 338.54,148.13 340.82,142.48 343.11,159.42 345.39,176.35 347.68,193.29 349.96,210.23 352.25,227.16 354.53,244.10 356.82,261.03 359.10,277.97 361.39,294.90 363.67,311.84 365.96,328.77 368.24,345.71 370.53,362.65 372.81,379.58 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><circle cx="100.9032258064516" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">−π/2</text><circle cx="169.4516129032258" cy="227.16129032258064" r="3.7" fill="#20364b"/><text x="176.4516129032258" y="219.16129032258064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">π/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El primer seno equivale a cos(πx/2).</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Reemplaza además arcsen u por</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π/2−arccos u.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La función es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arccos[cos(πx/2)]+arccos[cos(πx)]−π/2.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada composición arccos(cos t) forma</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una onda triangular.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x=0,1,2,3,4, las alturas son −π/2,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π, π/2, π, −π/2. Une con segmentos y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">repite cada 4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>