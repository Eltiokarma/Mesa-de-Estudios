<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Problema 23: Volumen con altura media</title><desc id="desc">Reconstrucción vectorial. Sólido en perspectiva y sección auxiliar con datos y letras.</desc><rect width="900" height="540" rx="18" fill="#f5f8fc"/><text x="28.00" y="36.00" font-family="Arial,sans-serif" font-size="22" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">23  /  Volumen con altura media</text><line x1="460.00" y1="70.00" x2="460.00" y2="490.00" stroke="#d8e2ee" stroke-width="1"/><text x="28.00" y="517.00" font-family="Arial,sans-serif" font-size="14" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Esquema en perspectiva · Las cotas, no la apariencia, definen la geometría.</text><polygon points="271.19,435.00 316.12,344.03 158.88,435.00" fill="#e5eefb" fill-opacity="0.65" stroke="#2463c4" stroke-width="2"/><line x1="271.19" y1="435.00" x2="271.19" y2="115.00" stroke="#233b53" stroke-width="2"/><line x1="316.12" y1="344.03" x2="316.12" y2="115.46" stroke="#233b53" stroke-width="2"/><line x1="158.88" y1="435.00" x2="158.88" y2="297.86" stroke="#233b53" stroke-width="2" stroke-dasharray="6 5"/><polygon points="271.19,115.00 316.12,115.46 158.88,297.86" fill="#e7eef5" fill-opacity="0.8" stroke="#233b53" stroke-width="2"/><circle cx="271.19" cy="115.00" r="3.5" fill="#233b53"/><text x="279.19" y="106.00" font-family="Arial,sans-serif" font-size="19" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">A</text><circle cx="316.12" cy="115.46" r="3.5" fill="#233b53"/><text x="324.12" y="106.46" font-family="Arial,sans-serif" font-size="19" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">B</text><circle cx="158.88" cy="297.86" r="3.5" fill="#233b53"/><text x="166.88" y="288.86" font-family="Arial,sans-serif" font-size="19" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">C</text><text x="249.19" y="275.00" font-family="Arial,sans-serif" font-size="18" fill="#2463c4" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">7</text><text x="294.12" y="229.74" font-family="Arial,sans-serif" font-size="18" fill="#2463c4" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">5</text><text x="136.88" y="366.43" font-family="Arial,sans-serif" font-size="18" fill="#2463c4" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">3</text><text x="205.00" y="155.00" font-family="Arial,sans-serif" font-size="18" fill="#008778" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">12 u²</text><text x="220.00" y="465.00" font-family="Arial,sans-serif" font-size="17" fill="#2463c4" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Base proyectada: 6 u²</text><line x1="535.00" y1="310.00" x2="825.00" y2="310.00" stroke="#2463c4" stroke-width="2.3"/><line x1="585.00" y1="310.00" x2="705.00" y2="102.00" stroke="#008778" stroke-width="3"/><text x="611.00" y="287.00" font-family="Arial,sans-serif" font-size="18" fill="#c36117" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">60°</text><text x="710.00" y="121.00" font-family="Arial,sans-serif" font-size="16" fill="#008778" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Plano ABC</text><text x="495.00" y="405.00" font-family="Arial,sans-serif" font-size="17" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Alturas: 7, 5 y 3 u</text><text x="495.00" y="432.00" font-family="Arial,sans-serif" font-size="17" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Media = (7+5+3)/3 = 5 u</text><text x="495.00" y="459.00" font-family="Arial,sans-serif" font-size="17" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">V = 6 × 5 = 30 u³</text></svg>