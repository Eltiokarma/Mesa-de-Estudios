<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Una cuña equilátera con una carga centrada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="139.15,193.88 336.85,193.88 238.00,365.09 139.15,193.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="147.56,282.84 190.55,282.84 190.55,396.52 147.56,396.52 147.56,282.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="285.45,282.84 328.44,282.84 328.44,396.52 285.45,396.52 285.45,282.84" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="229.60,155.33 246.40,155.33 246.40,193.88 229.60,193.88 229.60,155.33" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="126.80,396.52 349.20,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="177.21017949039788" y="271.47690473201965" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="298.7898205096021" y="271.47690473201965" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="238.0" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">700 N</text><text x="238.0" y="228.47922681059373" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">200 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada reacción es perpendicular a su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cara. Como las caras forman 60° con la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal, las normales forman 60°</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con la vertical.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La simetría y el equilibrio horizontal</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exigen reacciones de igual magnitud R.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los pesos suman 900 N. En vertical, 2R</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos 60°=900.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>