<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">109 · Resortes y bisagra</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="338.0483870967742" x2="421" y2="338.0483870967742" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="100.90,276.35 375.10,276.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">barra</text><polyline points="238.00,276.35 238.00,200.95" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">resorte superior</text><polyline points="238.00,338.05 238.00,276.35" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="498" font-family="Arial,sans-serif" font-size="12" fill="#008674" text-anchor="start">resorte inferior</text><circle cx="100.9032258064516" cy="276.35483870967744" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="268.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">W/3</text><circle cx="237.99999999999997" cy="276.35483870967744" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="268.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">50 N arriba</text><circle cx="375.0967741935484" cy="276.35483870967744" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="268.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">bisagra</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El superior se estira 2 cm y el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferior se comprime 2 cm: ambos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">empujan o tiran hacia arriba. Fuerza</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">total=2(k1+k2)=50 N.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Torques en la bisagra:</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">50·L/2=W·L/2+(W/3)L; de ahí W=30 N.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El peso total es 40 N. Ry+50−40=0:</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R=−10j N.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>