<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">019 · Nombre, polaridad y volatilidad de una cetona ramificada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,293.08 155.74,238.24 210.58,293.08 265.42,238.24 320.26,293.08 375.10,238.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="210.58,293.08 210.58,347.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="320.26,293.08 320.26,347.92" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="261.58,238.24 261.58,200.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="269.26,238.24 269.26,200.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="265.41935483870964" y="191.08064516129028" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Numera la cadena de seis carbonos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde el extremo que deja el carbonilo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en C3. Los metilos quedan en C2 y C4.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El enlace C=O tiene un momento dipolar</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">significativo. La molécula es polar.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cetona tiene oxígeno aceptor, pero</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">no un grupo OH donante. Entre sus</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">propias moléculas, la comparación de</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">volatilidad no se explica por puentes</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de hidrógeno donados por la cetona.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>