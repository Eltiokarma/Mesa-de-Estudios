<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Ceviana igual a media base</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,360.90 292.84,178.10 375.10,360.90 100.90,360.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="292.84,178.10 297.41,360.90" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="374.60752688172045" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="292.8387096774193" y="164.39247311827955" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="374.60752688172045" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="297.4086021505376" y="374.60752688172045" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="128.32258064516128" y="349.9301075268817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4a</text><text x="352.247311827957" y="349.4731182795699" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6a</text><text x="313.4032258064516" y="214.6612903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2a</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma M en DA de modo que BM=BD. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo BDM es exterior de BDC y mide</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">8a. Por el isósceles BMD, ∠BMD=8a.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABM, ∠ABM=8a−4a=4a. Entonces</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AM=BM=BD=AC/2, así que MC=BM.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En BMC, ∠MBC=∠BCM=6a. Por tanto</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠MBD=4a. Suma los ángulos de BMD.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>