<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Ángulo del vértice opuesto al diámetro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="113.99,271.41 182.82,154.50 363.10,271.96 182.82,384.50 113.99,271.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="113.99,271.41 363.10,271.96" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="182.82,154.50 182.82,384.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="182.82,154.50 275.15,327.14" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="182.82,263.22 189.93,263.22 189.93,271.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="271.87,321.13 277.33,317.30 281.70,323.86" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="177.36,162.15 185.55,167.61 191.56,159.97" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="179.55,377.94 186.10,373.57 190.47,380.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="127.65,248.47 134.75,253.93 139.12,262.12 140.76,271.41 139.12,280.70 134.75,288.89 127.65,294.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="105.79396462018728" y="267.5879292403746" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="182.27679500520293" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="370.20603537981276" y="273.05098855359" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="182.27679500520293" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="244.55567117585852" y="261.57856399583767" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="174.08220603537984" y="279.6066597294485" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="280.06555671175863" y="334.78355879292405" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="147.31321540062436" y="259.9396462018731" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como RON y RDN son rectángulos con la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">misma hipotenusa, los cuatro puntos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">están en la circunferencia de centro</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I. Escala su radio a 1 y toma</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R=(−1,0), N=(1,0).</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como OD⊥RN, escribe O=(−c,s) y</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(−c,−s). Entonces c²+s²=1. La</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicularidad OI⊥DN da</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−c(1+c)+s²=0.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye y resuelve (1+c)(1−2c)=0. La</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">configuración no degenerada tiene</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">c=1/2 y s=√3/2. Desde R, los rayos RO</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y RD forman 60° a cada lado de RN.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>