<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">009 · Una viga con una carga y un cable oblicuo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.13,244.33 316.24,244.33 375.10,278.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="168.26,263.04 180.17,244.33 192.07,263.04 168.26,263.04" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="112.13,244.33 112.13,281.75" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,281.75 123.36,281.75 123.36,303.86 100.90,303.86 100.90,281.75" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="316.24,244.33 316.24,276.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="112.12951252701512" y="235.140758824942" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="180.1676138637637" y="235.140758824942" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="316.24381653726084" y="235.140758824942" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="146.1485631953894" y="235.140758824942" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 m</text><text x="248.2057152005123" y="235.140758824942" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 m</text><text x="137.64380052829586" y="293.65352597454574" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 kg</text><text x="331.5523893380293" y="267.1186664532138" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="365.23124949971987" y="264.0569518930601" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El peso de 50 N en A produce 100 N·m</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en sentido antihorario. El peso de la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">viga actúa a 1 m a la derecha de B y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">produce 40 N·m en sentido horario.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La componente vertical del cable es T</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos 60°=T/2. La horizontal pasa por B</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y no aporta momento.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala los momentos respecto de B.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Queda 100=40+4(T/2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>