<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">048 · Dos ángulos complementarios y una razón</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.23,292.52 276.39,292.52 351.08,292.52 369.86,292.52 369.86,222.41 108.23,292.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="369.86,222.41 276.39,292.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="369.86,222.41 351.08,292.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="369.86,289.51 366.86,289.51 366.86,292.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="285.1914573944925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="362.5382910613149" y="215.08655294778774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="271.15816565441423" y="310.83169378946906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="332.7650657886552" y="323.91344705221223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="375.0967741935484" y="309.52351846319476" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea BC=h. Entonces AC=h cot15° y MC=h</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cot75°. Como los ángulos son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">complementarios, la suma de</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cotangentes es 1/(sen15° cos15°)=4.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye AC+MC=4h en el dato. Se</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene PB=5h/3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En BPC, sen x=h/PB=3/5. Toma el ángulo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agudo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>