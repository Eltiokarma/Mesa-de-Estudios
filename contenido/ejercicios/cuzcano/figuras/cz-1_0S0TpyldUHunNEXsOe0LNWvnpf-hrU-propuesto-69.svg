<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">069 · Venturi con mercurio y fluido no especificado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,188.38 201.44,188.38 228.86,207.58 292.84,207.58 320.26,188.38 375.10,188.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,261.50 201.44,261.50 228.86,235.00 292.84,235.00 320.26,261.50 375.10,261.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="169.45,261.50 169.45,339.19 267.70,339.19 267.70,235.00" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="183.16,261.50 183.16,323.20 253.99,323.20 253.99,235.00" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="169.45,311.77 183.16,311.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="253.99,275.21 267.70,275.21" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="132.89247311827955" y="222.65860215053763" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1: 4A</text><text x="260.8494623655914" y="221.74462365591404" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2: A</text><text x="215.15053763440858" y="288.9220430107527" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">22,5 cm</text><text x="219.72043010752688" y="350.61559139784947" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hg</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La interfaz del lado ancho está más</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abajo. Igualar presiones al mismo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">nivel en el mercurio da P₁ − P₂ = (ρHg</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">− ρ)gΔh.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El desnivel es 0,225 m. Con ρHg = 13</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">600 kg/m³ y g = 10 m/s², sustituye en</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la expresión.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si circula agua, el resultado es 28</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">350 Pa. El valor depende de la</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">densidad del fluido.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>