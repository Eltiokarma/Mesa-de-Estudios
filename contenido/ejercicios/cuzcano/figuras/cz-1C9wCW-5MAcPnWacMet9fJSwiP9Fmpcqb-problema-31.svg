<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Temperatura y pendiente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">t (min)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">T (°C)</text><polyline points="100.90,311.84 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">T=100+10t</text><circle cx="169.45161290322582" cy="269.5" r="3.7" fill="#20364b"/><text x="176.45161290322582" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5;150</text><circle cx="210.58064516129033" cy="244.09677419354838" r="3.7" fill="#20364b"/><text x="217.58064516129033" y="236.09677419354838" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">8;180</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente es (300−100)/20=10</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">°C/min.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre 5 y 8 transcurren 3 min;</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T(5)=150 °C y T(8)=180 °C.</text><text x="482" y="215" font-family="Arial,sans-serif" 