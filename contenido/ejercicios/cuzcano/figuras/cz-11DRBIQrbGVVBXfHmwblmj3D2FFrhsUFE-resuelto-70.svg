<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">070 · Ceviana con dos ángulos dados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="141.67,385.72 207.60,148.17 333.19,384.58 141.67,385.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="207.60,148.17 183.16,385.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="207.60,148.17 236.01,385.15" fill="none" stroke="#008674" stroke-width="2.5"/><text x="136.557588222559" y="393.67460489283394" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="207.59569170816198" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="339.44241177744107" y="390.264775925525" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="182.0219744533449" y="394.81121454860363" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="237.1475427581728" y="394.81121454860363" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="313.86869452262397" y="381.74020350725266" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">42°</text><text x="203.04925308508336" y="182.83351374756438" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">36°</text><text x="266.69939380818363" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">AC = 72 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABC, ∠A=48°. Toma M punto medio de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC. La mediana del triángulo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulo cumple BM=AC/2=36.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo BMC es isósceles, así que</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠MBC=42° y ∠ABM=48°. Esto coloca P</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre A y M.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En BPM, ∠PBM=48°−36°=12° y ∠BMP=84°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ángulos en P y M son iguales,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">luego BP=BM.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>