<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">164 · Una discontinuidad que deja un intervalo fuera del rango</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="311.8387096774194" x2="421" y2="311.8387096774194" stroke="#20364b" stroke-width="1.7"/><line x1="257.58525345622115" y1="105" x2="257.58525345622115" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 103.51,395.81 106.13,395.09 108.74,394.37 111.35,393.64 113.96,392.91 116.57,392.17 119.18,391.42 121.79,390.67 124.41,389.91 127.02,389.14 129.63,388.36 132.24,387.58 134.85,386.78 137.46,385.98 140.07,385.17 142.69,384.35 145.30,383.52 147.91,382.68 150.52,381.84 153.13,380.98 155.74,380.11 158.35,379.23 160.96,378.33 163.58,377.43 166.19,376.51 168.80,375.58 171.41,374.64 174.02,373.68 176.63,372.70 179.24,371.71 181.86,370.71 184.47,369.68 187.08,368.64 189.69,367.58 192.30,366.50 194.91,365.39 197.52,364.27 200.14,363.11 202.75,361.93 205.36,360.73 207.97,359.49 210.58,358.22 213.19,356.91 215.80,355.57 218.41,354.18 221.03,352.74 223.64,351.25 226.25,349.71 228.86,348.10 231.47,346.41 234.08,344.63 236.69,342.76 239.31,340.76 241.92,338.62 244.53,336.28 247.14,333.70 249.75,330.77 252.36,327.30 254.97,322.77 257.59,311.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">x&lt;0</text><polyline points="257.59,269.50 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">x≥0</text><circle cx="257.58525345622115" cy="311.8387096774194" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="264.58525345622115" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,0) excluido</text><circle cx="257.58525345622115" cy="269.5" r="3.7" fill="#20364b"/><text x="264.58525345622115" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,1)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La condición ∣x∣≤x se cumple</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exactamente para x≥0. Su tramo da</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[1,∞).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para x&lt;0, el radical es positivo y el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">signo menos produce todos los valores</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativos. No alcanza 0.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Une las imágenes de ambos tramos. El</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">gráfico marca abierto (0,0) y cerrado</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,1).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>