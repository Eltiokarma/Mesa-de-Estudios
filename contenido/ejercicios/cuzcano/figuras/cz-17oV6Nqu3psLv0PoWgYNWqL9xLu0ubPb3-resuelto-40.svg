<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Cosecante sobre una recta de razón fija</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,295.27 375.10,295.27" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="232.27,323.56 232.27,215.44" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="129.19,243.73 232.27,295.27 346.81,295.27" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="129.19,243.73 346.81,295.27" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="251.74,295.27 251.60,297.60 251.18,299.90 250.49,302.14 249.54,304.27 248.33,306.28 246.90,308.12 245.25,309.78 243.42,311.24 241.42,312.46 239.30,313.43 237.07,314.14 234.77,314.58 232.44,314.74 230.10,314.62 227.80,314.22 225.56,313.55 223.42,312.61 221.40,311.42 219.54,310.00 217.87,308.37 216.40,306.55 215.17,304.57 214.17,302.45 213.44,300.23 212.99,297.93 212.81,295.60 212.91,293.27 213.29,290.96 213.94,288.71 214.86,286.56" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="346.8069636456733" y="295.2700703371332" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="129.19303635432667" y="243.72992966286685" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="232.2733177028593" y="295.2700703371332" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.0967741935484" y="300.71041851941686" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="239.88980515805642" y="215.44011911499177" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="232.2733177028593" y="321.3264747891234" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="136.35138922575254" y="237.14424502115506" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(m,n)</text><text x="342.5119519228178" y="308.15510550569974" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(4,0)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como n&gt;0, la norma de (m,n) es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(4n²+n²)=n√5.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El seno es la ordenada dividida por</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esa norma, de modo que sen α=1/√5.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Invierte la razón para hallar la</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosecante.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>