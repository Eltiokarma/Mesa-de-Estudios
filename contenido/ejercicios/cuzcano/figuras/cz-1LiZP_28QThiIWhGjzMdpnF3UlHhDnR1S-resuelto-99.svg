8.00,231.10 267.54,260.64 267.54,231.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="208.46,231.10 208.46,260.64 238.00,231.10 208.46,231.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="208.46,290.18 238.00,290.18 208.46,260.64 208.46,290.18" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="267.54,290.18 267.54,260.64 238.00,290.18 267.54,290.18" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="223.23,245.87 223.23,260.64 238.00,245.87 223.23,245.87" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="223.23,275.41 238.00,275.41 223.23,260.64 223.23,275.41" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="252.77,275.41 252.77,260.64 238.00,275.41 252.77,275.41" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="252.77,245.87 238.00,245.87 252.77,260.64 252.77,245.87" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="126.84546136534132" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">El patrón continúa</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada cuadrado inscrito tiene la mitad</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del área del anterior.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las coronas consecutivas tienen áreas</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/2, 1/4, 1/8, … del cuadrado</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior. Las blancas emparejan con</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una sombreada de doble área.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al sumar, el blanco es 1/3 del total y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la sombra 2/3. Razón: 1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>