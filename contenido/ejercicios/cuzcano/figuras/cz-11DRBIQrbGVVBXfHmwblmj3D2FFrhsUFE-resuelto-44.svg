<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Ángulo interior a partir de tres longitudes iguales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.04,352.08 239.22,182.03 364.52,352.08 109.04,352.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.04,352.08 291.29,317.10 364.52,352.08" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="364.2879774097827" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="240.0340767684503" y="174.71202259021726" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="357.77893175074183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="296.1745955776778" y="312.2156121374557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="178.19814300756198" y="343.94720972527995" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10°</text><text x="333.6016081171628" y="351.2698860917009" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="131.00756197951566" y="336.62453335885897" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="188.77534220350339" y="326.04733416291754" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n</text><text x="311.63357901789993" y="279.67038384225134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ACP, ∠APC=140°. La ley de senos da</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AP/AC=sen 30°/sen 140°=1/(2sen 40°).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el isósceles ABC, si ∠BAC=t, se</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene AC=2AB cos t. Usa AP=AB para</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtener cos t=sen 40°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo de base es agudo, así que</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t=50°. Resta ∠CAP=10°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>