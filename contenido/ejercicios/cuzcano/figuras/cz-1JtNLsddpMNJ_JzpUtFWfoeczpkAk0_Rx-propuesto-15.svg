<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Tiempo para desviar un rayo reflejado 60°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="188.12,174.40 188.12,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="132.93,190.36 243.32,380.56" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="343.07,285.46 188.12,285.46" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="196.10,281.47 188.12,285.46 196.10,289.45" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="188.12,285.46 270.59,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="270.05,151.39 270.59,142.48 263.14,147.40" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="201.424674885999" y="301.42028373585543" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="261.27520689072793" y="268.83499408883637" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">rayo incidente</text><text x="225.36488768789056" y="199.00937341665264" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">rayo reflejado</text><text x="149.55421381523394" y="241.5697517311265" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ω</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al girar el espejo θ, gira lo mismo la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal. La dirección de reflexión</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cambia 2θ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para un giro del reflejo de π/3, el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">espejo debe girar π/6.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide π/6 por π/12 rad/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>