<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">060 · Aceleración a rapidez mínima</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">t (s)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">v (m/s)</text><polyline points="100.90,142.48 105.47,153.59 110.04,164.31 114.61,174.66 119.18,184.63 123.75,194.23 128.32,203.45 132.89,212.30 137.46,220.76 142.03,228.85 146.60,236.57 151.17,243.91 155.74,250.87 160.31,257.46 164.88,263.67 169.45,269.50 174.02,274.96 178.59,280.04 183.16,284.74 187.73,289.07 192.30,293.02 196.87,296.60 201.44,299.80 206.01,302.62 210.58,305.06 215.15,307.13 219.72,308.83 224.29,310.15 228.86,311.09 233.43,311.65 238.00,311.84 242.57,311.65 247.14,311.09 251.71,310.15 256.28,308.83 260.85,307.13 265.42,305.06 269.99,302.62 274.56,299.80 279.13,296.60 283.70,293.02 288.27,289.07 292.84,284.74 297.41,280.04 301.98,274.96 306.55,269.50 311.12,263.67 315.69,257.46 320.26,250.87 324.83,243.91 329.40,236.57 333.97,228.85 338.54,220.76 343.11,212.30 347.68,203.45 352.25,194.23 356.82,184.63 361.39,174.66 365.96,164.31 370.53,153.59 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">rapidez</text><circle cx="237.99999999999997" cy="311.8387096774194" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">mínima</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">v=t²−4t+6=(t−2)²+2, siempre positiva.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La rapidez coincide con v y tiene</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mínimo en t=2 s.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=2t−4; en t=2, a=0 m/s².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>