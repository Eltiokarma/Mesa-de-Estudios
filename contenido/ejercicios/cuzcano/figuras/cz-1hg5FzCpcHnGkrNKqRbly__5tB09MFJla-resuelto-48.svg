<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">048 · Tres válvulas y un recipiente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.86,221.34 154.67,221.34 208.43,221.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="208.43,221.34 324.92,221.34 324.92,266.14" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="208.43,221.34 208.43,266.14 324.92,266.14" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="324.92,266.14 356.28,266.14 356.28,293.02" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="337.46,298.40 337.46,328.86 375.10,328.86 375.10,298.40" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="107.90322580645162" y="203.48028673835128" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Agua</text><text x="167.4910394265233" y="202.1362007168459" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="262.921146953405" y="202.1362007168459" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="262.4731182795699" y="248.2831541218638" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="352.97491039426524" y="315.93548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay 2³=8 configuraciones de las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">válvulas.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para que llegue agua, A debe estar</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abierta y al menos uno de B y C</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también. Eso da tres configuraciones.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los otros cinco estados no dejan pasar</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agua. Producto 3·5=15.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>