8" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B(4,H)</text><circle cx="340.8225806451613" cy="260.93145161290323" r="3.7" fill="#20364b"/><text x="347.8225806451613" y="252.93145161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A(3,h)</text><circle cx="238.0" cy="338.0483870967742" r="3.7" fill="#20364b"/><text x="245.0" y="330.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">fondo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una sección axial tiene ecuación</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x²=4py, con y medido desde el fondo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la boca 16=4pH y en la posición de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la tapa 9=4ph. Divide para hallar</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h/H=9/16.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El descenso respecto de la boca es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H−h, cuya fracción es 1−9/16.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>