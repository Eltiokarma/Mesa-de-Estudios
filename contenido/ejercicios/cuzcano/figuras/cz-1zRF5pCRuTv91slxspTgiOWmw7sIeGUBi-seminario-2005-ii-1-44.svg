r="middle">460–480</text><rect x="48.0" y="246.0" width="190.0" height="29.0" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="264.85" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Azul</text><rect x="238.0" y="246.0" width="190.0" height="29.0" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="264.85" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">480–500</text><rect x="48.0" y="275.0" width="190.0" height="29.0" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="293.85" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Verde</text><rect x="238.0" y="275.0" width="190.0" height="29.0" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="293.85" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">500–550</text><rect x="48.0" y="304.0" width="190.0" height="29.0" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="322.85" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Amarillo</text><rect x="238.0" y="304.0" width="190.0" height="29.0" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="322.85" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">550–600</text><rect x="48.0" y="333.0" width="190.0" height="29.0" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="351.85" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Anaranjado</text><rect x="238.0" y="333.0" width="190.0" height="29.0" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="351.85" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">600–650</text><rect x="48.0" y="362.0" width="190.0" height="29.0" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="380.85" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Rojo</text><rect x="238.0" y="362.0" width="190.0" height="29.0" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="380.85" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">650–780</text><rect x="48.0" y="391.0" width="190.0" height="29.0" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="409.85" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Infrarrojo</text><rect x="238.0" y="391.0" width="190.0" height="29.0" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="409.85" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">780–1000</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Longitud calculada: 102.6 nm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como el nivel final es 1, corresponde</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a la serie de Lyman.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con Rydberg, λ=10⁷/[109678(1−1/9)] nm.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El valor queda por debajo de 400 nm,</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en ultravioleta.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>