<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">033 · Distancia entre bases desde un cruce de bisectrices</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="106.92,342.94 156.54,196.06 371.09,196.06 323.97,342.94 106.92,342.94" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="106.92,342.94 245.27,238.67 323.97,342.94" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="245.27,196.06 245.27,342.94" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="245.27,238.67 155.04,208.60" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="245.27,238.67 346.02,272.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645164" y="353.4623754201804" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="156.5439641446011" y="185.03635666686324" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="187.54269623164473" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="329.98266202748124" y="353.9636433331367" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="251.28359969334198" y="238.67202335318746" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="252.78740343221088" y="217.6187710090228" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="253.7899392581235" y="297.32036916907464" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las bisectrices dan la misma distancia</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de P a AB, AD y CD. Como AB∥CD y P</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">está entre esas dos rectas, cada</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia es 6/2=3.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si h es la separación entre AD y BC, P</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">está a 3 de AD, por lo que ∣h−3∣=1.</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así h=4 si P está dentro y h=2 si</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda más allá de BC.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambas alturas son compatibles con</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB&lt;BC. Por ejemplo, para ∠A=60°, elige</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC=6/sen 60° y AB=h/sen 60° con h=2 o</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>