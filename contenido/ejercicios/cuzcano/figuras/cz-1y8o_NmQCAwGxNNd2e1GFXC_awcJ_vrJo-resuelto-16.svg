<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Ángulo a partir de dos perpendicularidades</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="124.79,285.45 124.79,152.92 353.66,152.92 353.66,285.45 124.79,285.45" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="124.79,152.92 353.66,285.45" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="353.66,152.92 264.08,384.86 264.08,285.45 310.71,260.30" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="264.08,292.82 270.83,292.82 270.83,285.45" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="328.51,208.14 336.48,211.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="284.33,324.11 291.69,327.18" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="115.58590462833098" y="298.33941093969145" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="119.26753155680223" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="359.80049088359056" y="144.32468443197752" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="360.4140953716691" y="295.2713884992987" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="253.64691444600285" y="297.7258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="312.5529453015429" y="246.79663394109397" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="257.9421458625526" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="138.90287517531556" y="172.55049088359044" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="285.554347826087" y="274.40883590462835" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama M a la reflexión de O respecto a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F. Como F también es el punto medio de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EN, M está sobre la vertical de E y P,</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es decir, sobre EP.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo OPM es rectángulo en P.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio de su hipotenusa OM</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">satisface FO=FP.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto ∠POF=∠OPF. Este último es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">complementario de θ en el triángulo</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulo URP.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>