<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">067 · Tangente de una suma al cambiar el signo de un término</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="190.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="143.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Relación</text><rect x="238.0" y="130" width="190.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="333.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Expresión</text><rect x="48.0" y="178" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Tangente de x+y+z</text><rect x="238.0" y="178" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3/5</text><rect x="48.0" y="226" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Tangente de 2y</text><rect x="238.0" y="226" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">−3/4</text><rect x="48.0" y="274" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Diferencia de argumentos</text><rect x="238.0" y="274" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">x−y+z</text><text x="48" y="349" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Relaciones usadas en la solución</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe el nuevo argumento como</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(x+y+z)−2y.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente doble es 2·3/(1−9)=−3/4.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa la fórmula de diferencia. El</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">numerador queda 27/20 y el denominador</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">11/20.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>