<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Punto exterior con razón de distancias tres</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="333.47849462365593" x2="421" y2="333.47849462365593" stroke="#20364b" stroke-width="1.7"/><line x1="155.74193548387098" y1="105" x2="155.74193548387098" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,205.52 192.30,223.80 375.10,260.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Figura</text><circle cx="100.90322580645162" cy="205.5215053763441" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="197.5215053763441" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="192.30107526881721" cy="223.8010752688172" r="3.7" fill="#20364b"/><text x="199.30107526881721" y="215.8010752688172" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P₁</text><circle cx="375.09677419354836" cy="260.36021505376345" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="252.36021505376345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P debe estar del lado de P₁, el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremo más cercano. Escribe</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P=P₁+t(P₂−P₁) con t&lt;0.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las distancias son proporcionales a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1−t y −t. De 1−t=−3t resulta t=−1/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula (1+5t,3−t).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>