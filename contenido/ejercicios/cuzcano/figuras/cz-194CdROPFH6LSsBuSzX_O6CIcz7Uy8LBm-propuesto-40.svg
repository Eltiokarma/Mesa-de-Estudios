<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Triángulo rectángulo con vértice en el lado recto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="132.15322580645162" y1="105" x2="132.15322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="227.42,396.52 221.17,392.28 215.14,388.05 209.32,383.81 203.71,379.58 198.31,375.35 193.12,371.11 188.15,366.88 183.38,362.65 178.83,358.41 174.49,354.18 170.36,349.94 166.45,345.71 162.74,341.48 159.25,337.24 155.97,333.01 152.90,328.77 150.04,324.54 147.40,320.31 144.96,316.07 142.74,311.84 140.73,307.60 138.93,303.37 137.34,299.14 135.96,294.90 134.80,290.67 133.85,286.44 133.11,282.20 132.58,277.97 132.26,273.73 132.15,269.50 132.26,265.27 132.58,261.03 133.11,256.80 133.85,252.56 134.80,248.33 135.96,244.10 137.34,239.86 138.93,235.63 140.73,231.40 142.74,227.16 144.96,222.93 147.40,218.69 150.04,214.46 152.90,210.23 155.97,205.99 159.25,201.76 162.74,197.52 166.45,193.29 170.36,189.06 174.49,184.82 178.83,180.59 183.38,176.35 188.15,172.12 193.12,167.89 198.31,163.65 203.71,159.42 209.32,155.19 215.14,150.95 221.17,146.72 227.42,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="132.15,269.50 174.49,184.82 343.85,269.50 132.15,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="174.49,354.18 174.49,184.82" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="132.15322580645162" cy="269.5" r="3.7" fill="#20364b"/><text x="139.15322580645162" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">V</text><circle cx="174.49193548387098" cy="184.8225806451613" r="3.7" fill="#20364b"/><text x="181.49193548387098" y="176.8225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">L</text><circle cx="343.8467741935484" cy="269.5" r="3.7" fill="#20364b"/><text x="350.8467741935484" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El foco es (3,0). Toma el extremo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superior L(3,6).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OL tiene pendiente 2. La perpendicular</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por L tiene ecuación y−6=−(x−3)/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En y=0 resulta x=15. El extremo</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferior da lo mismo por reflexión.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>