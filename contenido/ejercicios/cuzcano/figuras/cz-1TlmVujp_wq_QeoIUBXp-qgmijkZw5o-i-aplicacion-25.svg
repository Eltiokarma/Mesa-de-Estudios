<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">025 · Sombras por semejanza</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="280.18,248.41 111.45,290.59" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">rayo superior</text><polyline points="280.18,248.41 364.55,290.59" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">rayo inferior</text><polyline points="100.90,290.59 375.10,290.59" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">suelo</text><text x="287.1836228287841" y="240.40818858560792" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">foco</text><text x="202.8163771712159" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">insecto 1</text><text x="350.45905707196033" y="272.0459057071961" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">insecto 2</text><text x="118.44913151364764" y="282.59181141439205" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">sombra 1</text><text x="371.5508684863524" y="282.59181141439205" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">sombra 2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los insectos quedan en x₁=−8 m y x₂=6</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Proyección desde el foco: xs=4x/(4−h).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así, xs₁=−16 y xs₂=8 m.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las sombras se separan 8−(−16)=24 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>