<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Recta reflejada en un espejo vertical</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.03,371.69 365.97,371.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="136.77,396.52 136.77,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="327.77,180.68 136.77,333.49 184.52,371.69" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="136.77,371.69 136.77,333.49 184.52,371.69 136.77,371.69" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="365.9711375212224" y="367.86587436332763" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="140.58913412563666" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="335.41086587436337" y="180.68421052631578" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(5,5)</text><text x="118.81494057724956" y="331.19354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="186.4295415959253" y="379.70797962648555" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(5/4,0)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si M=(0,h) es el contacto, la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reflexión en un espejo vertical</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">invierte el signo de la pendiente del</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rayo incidente. La pendiente de salida</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es (h−5)/5.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para cortar el eje X positivo, 0&lt;h&lt;5.</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El corte es 5h/(5−h), así que el área</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 5h²/[2(5−h)].</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala el área a 5/8. Resulta</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4h²+h−5=0. La raíz admisible h=1 da la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente −4/5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>