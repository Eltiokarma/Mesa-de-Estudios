<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">051 · Distancia a un eje desde un punto de la diagonal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,372.32 375.10,372.32 375.10,166.68 100.90,166.68 100.90,372.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,372.32 375.10,166.68" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,372.32 238.00,166.68" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="155.74,331.19 155.74,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645164" y="372.3225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354836" y="372.3225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="166.67741935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="100.90322580645164" y="166.67741935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="155.74193548387098" y="331.19354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="155.74193548387098" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elige vértices opuestos (0,0) y (8,6).</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diagonal mide 10.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto a 2 del origen está a 1/5 de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la diagonal, en (8/5,6/5).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ejes son x=4 e y=3. Las distancias</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son 12/5 y 9/5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>