<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Cociente de un ángulo reflejo y su sector</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="185.45,291.70 375.10,291.70" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="185.45,291.70 340.80,182.93" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="233.96,291.70 233.96,290.78 233.93,289.85 233.88,288.93 233.82,288.00 233.74,287.08 233.65,286.16 233.53,285.24 233.40,284.32 233.25,283.41 233.08,282.50 232.90,281.59 232.70,280.69 232.48,279.79 232.24,278.89 231.99,278.00 231.72,277.11 231.43,276.23 231.13,275.36 230.81,274.49 230.47,273.63 230.12,272.77 229.75,271.92 229.36,271.08 228.96,270.24 228.54,269.42 228.11,268.60 227.66,267.79 227.20,266.99 226.72,266.20 226.22,265.41 225.71,264.64 225.19,263.88" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.20,254.77 230.86,246.05 222.09,238.75 212.18,233.12 201.44,229.33 190.19,227.48 178.79,227.66 167.60,229.83 156.97,233.95 147.23,239.88 138.69,247.43 131.62,256.37 126.23,266.41 122.70,277.25 121.14,288.54 121.59,299.93 124.04,311.07 128.41,321.59 134.58,331.18 142.34,339.53 151.45,346.38 161.62,351.52 172.54,354.79 183.87,356.07 195.24,355.34 206.31,352.62 216.73,347.99 226.16,341.59 234.32,333.63 240.95,324.35 245.84,314.06 248.83,303.06 249.84,291.70" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="185.44939694202094" y="310.2260774432538" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="254.8529702622644" y="269.8195175185674" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="100.90322580645162" y="318.3596854937142" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completa cuadrados: 4a−a²=4−(a−2)². El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">máximo es x=4° con a=2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El sector reflejo mide θ=360°−4°=356°.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide el ángulo reflejo por el sector</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pequeño.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>