<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">002 · Cruce de dos segmentos en un equilátero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="110.36,380.30 165.80,284.27 165.80,380.30" fill="#f4c581" fill-opacity="0.45"/><polygon points="257.34,380.30 340.50,332.29 368.22,380.30" fill="#f4c581" fill-opacity="0.45"/><polyline points="110.36,380.30 239.29,156.98 368.22,380.30 110.36,380.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="165.80,284.27 165.80,380.30" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="257.34,380.30 340.50,332.29" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="239.29,156.98 257.34,380.30" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.22,380.30 165.80,284.27" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645159" y="390.61258871727773" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="235.85114773991305" y="146.6683294746527" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="388.89350690920816" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="156.3436141166953" y="278.25574219592704" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="252.18242491657395" y="392.3316705253473" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La congruencia da AR=SC. Por tanto, R</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">divide AB en la misma fracción que S</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mide desde C sobre CA.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La rotación de 120° del equilátero que</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lleva A a B, B a C y C a A también</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lleva S a R.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esa rotación lleva BS a CR. Sus rectas</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">forman ángulos suplementarios de 120°</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 60°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>