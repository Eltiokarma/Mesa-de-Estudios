<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Perpendicular común entre diagonales de dos caras</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,207.10 186.00,142.80 375.10,142.80 290.00,207.10 100.90,207.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,207.10 100.90,396.20 290.00,396.20 290.00,207.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="290.00,396.20 375.10,331.90 375.10,142.80" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,396.20 186.00,142.80" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="186.00,331.90 290.00,396.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="129.27,311.73 220.67,353.33" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,396.20 186.00,331.90 375.10,331.90" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="186.00,331.90 186.00,142.80" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="100.9032258064516" y="396.1963292547275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="185.99777530589543" y="331.9026696329255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="290.0022246941046" y="396.1963292547275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="185.99777530589543" y="142.80367074527248" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="290.0022246941046" y="207.09733036707456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="129.26807563959954" y="311.7321097515759" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="220.66592510196514" y="353.33388950685946" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="172.6662958843159" y="325.58676307007784" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">d</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En unidades de k, toma T=(0,0,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">U=(0,1,1), B=(0,1,0) y O=(1,0,0).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los puntos a un tercio de TU y BO son</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">X=(0,1/3,1/3) e Y=(1/3,2/3,0). El</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vector XY es perpendicular a ambas</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">direcciones.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como los pies caen dentro de los</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segmentos, la norma de XY da la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>