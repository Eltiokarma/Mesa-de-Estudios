1="375.09677419354836" y1="396.51612903225805" x2="365.96588479042526" y2="400.59373356285374" stroke="#008674" stroke-width="2"/><line x1="375.09677419354836" y1="396.51612903225805" x2="365.96588479042526" y2="392.43852450166236" stroke="#008674" stroke-width="2"/><circle cx="100.9032258064516" cy="269.5" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A:salida</text><circle cx="237.99999999999997" cy="205.99193548387095" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="197.99193548387095" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Mayor densidad de líneas significa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mayor intensidad en la representación:</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I verdadera.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las líneas salen de cargas positivas,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">no negativas: II falsa.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector campo sigue la tangente</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">orientada; la flecha EC dibujada es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contraria: III falsa.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>