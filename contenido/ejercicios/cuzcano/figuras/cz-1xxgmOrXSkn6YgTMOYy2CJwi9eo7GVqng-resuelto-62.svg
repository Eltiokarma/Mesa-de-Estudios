<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">062 · Ángulo exacto con dos puntos medios</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="353.71,266.89 353.35,257.88 352.29,248.93 350.53,240.08 348.09,231.40 344.97,222.94 341.19,214.76 336.78,206.89 331.77,199.39 326.19,192.31 320.07,185.69 313.45,179.57 306.37,173.99 298.87,168.98 291.00,164.57 282.82,160.79 274.36,157.67 265.68,155.23 256.83,153.47 247.88,152.41 238.87,152.05 229.86,152.41 220.91,153.47 212.06,155.23 203.38,157.67 194.92,160.79 186.74,164.57 178.87,168.98 171.37,173.99 164.29,179.57 157.67,185.69 151.55,192.31 145.97,199.39 140.96,206.89 136.55,214.76 132.77,222.94 129.65,231.40 127.21,240.08 125.45,248.93 124.39,257.88 124.03,266.89 124.39,275.90 125.45,284.85 127.21,293.70 129.65,302.38 132.77,310.84 136.55,319.02 140.96,326.89 145.97,334.39 151.55,341.47 157.67,348.09 164.29,354.21 171.37,359.79 178.87,364.80 186.74,369.21 194.92,372.99 203.38,376.11 212.06,378.55 220.91,380.31 229.86,381.37 238.87,381.73 247.88,381.37 256.83,380.31 265.68,378.55 274.36,376.11 282.82,372.99 291.00,369.21 298.87,364.80 306.37,359.79 313.45,354.21 320.07,348.09 326.19,341.47 331.77,334.39 336.78,326.89 341.19,319.02 344.97,310.84 348.09,302.38 350.53,293.70 352.29,284.85 353.35,275.90 353.71,266.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="124.03,266.89 353.71,266.89" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.87,152.05 238.87,381.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="124.03,266.89 307.77,175.02 296.29,324.31" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.87,381.73 353.71,266.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="115.33373840035351" y="270.3699734865223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="360.6662615996464" y="270.3699734865223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="236.26005302695535" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="238.8699734865223" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="224.08042421564292" y="209.47182942996025" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="226.69034467520987" y="259.9302916482545" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="309.33782589482985" y="165.10318161732215" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="301.508064516129" y="332.1380910296067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="294.54827662395047" y="202.51204153778173" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con radio 1, fija A=(−1,0), O=(1,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I=(0,1) y D=(0,−1). Así N=(0,1/2) y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R=(1/2,−1/2).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta AM tiene pendiente 1/2. Su</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segunda intersección con x²+y²=1 es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M=(3/5,4/5).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de MR es 13. Los dos</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rayos desde M van hacia abajo y a la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda. La tangente de su</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia es (13−1/2)/(1+13/2)=5/3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>