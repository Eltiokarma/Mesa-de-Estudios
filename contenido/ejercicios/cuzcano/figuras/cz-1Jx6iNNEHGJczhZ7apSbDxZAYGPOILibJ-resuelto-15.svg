<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Dos tangentes paralelas de pendiente dada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="288.81,269.50 288.70,264.52 288.37,259.55 287.83,254.63 287.08,249.78 286.11,245.00 284.94,240.34 283.57,235.79 282.00,231.40 280.24,227.16 278.31,223.11 276.20,219.25 273.93,215.61 271.50,212.20 268.93,209.04 266.23,206.13 263.40,203.50 260.47,201.15 257.44,199.09 254.33,197.33 251.15,195.89 247.91,194.75 244.63,193.94 241.32,193.45 238.00,193.29 234.68,193.45 231.37,193.94 228.09,194.75 224.85,195.89 221.67,197.33 218.56,199.09 215.53,201.15 212.60,203.50 209.77,206.13 207.07,209.04 204.50,212.20 202.07,215.61 199.80,219.25 197.69,223.11 195.76,227.16 194.00,231.40 192.43,235.79 191.06,240.34 189.89,245.00 188.92,249.78 188.17,254.63 187.63,259.55 187.30,264.52 187.19,269.50 187.30,274.48 187.63,279.45 188.17,284.37 188.92,289.22 189.89,294.00 191.06,298.66 192.43,303.21 194.00,307.60 195.76,311.84 197.69,315.89 199.80,319.75 202.07,323.39 204.50,326.80 207.07,329.96 209.77,332.87 212.60,335.50 215.53,337.85 218.56,339.91 221.67,341.67 224.85,343.11 228.09,344.25 231.37,345.06 234.68,345.55 238.00,345.71 241.32,345.55 244.63,345.06 247.91,344.25 251.15,343.11 254.33,341.67 257.44,339.91 260.47,337.85 263.40,335.50 266.23,332.87 268.93,329.96 271.50,326.80 273.93,323.39 276.20,319.75 278.31,315.89 280.24,311.84 282.00,307.60 283.57,303.21 284.94,298.66 286.11,294.00 287.08,289.22 287.83,284.37 288.37,279.45 288.70,274.48 288.81,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="161.79,294.90 238.00,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,396.52 314.21,244.10" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="197.3548387096774" cy="223.7741935483871" r="3.7" fill="#20364b"/><text x="204.3548387096774" y="215.7741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T₁</text><circle cx="278.64516129032256" cy="315.2258064516129" r="3.7" fill="#20364b"/><text x="285.64516129032256" y="307.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye y=2x+p en la elipse. Resulta</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">25x²+16px+4p²−36=0.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para un solo punto la ecuación debe</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tener raíz doble. Su discriminante es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(16p)²−100(4p²−36)=3600−144p².</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala el discriminante a cero. Como</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">p²=25, hay dos valores, uno por cada</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>