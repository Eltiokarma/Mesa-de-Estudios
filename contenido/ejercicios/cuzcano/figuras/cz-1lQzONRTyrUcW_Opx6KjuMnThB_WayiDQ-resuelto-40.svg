<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Sección perpendicular a una arista de un triedro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="212.67,243.13 177.44,209.18 337.77,209.18" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,248.59 309.97,248.59 375.10,199.38 166.03,199.38 100.90,248.59" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="212.67,339.62 212.67,243.13 337.77,209.18 177.44,209.18 212.67,339.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="212.67,339.62 337.77,209.18" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="177.44,209.18 212.67,243.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="212.67,243.13 257.60,209.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="212.67127045691043" y="339.61635606848927" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="212.67127045691043" y="243.12595780910038" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="177.43630382044904" y="209.17794543060842" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="337.76862280114455" y="209.17794543060842" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="257.6024633107968" y="209.17794543060842" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="212.67127045691043" y="291.3711569387948" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6 m</text><text x="227.54687352189956" y="317.74519912969447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los extremos de las otras dos aristas</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">quedan a distancia L=6/cos 53° del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértice. Entre esas aristas hay 60°,</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que el lado opuesto de la sección</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mide L.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los otros dos lados de la sección</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">miden 6 tan 53°. Su altura respecto de</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">L es √((6 tan 53°)²−(L/2)²).</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica L por esa altura y divide</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>