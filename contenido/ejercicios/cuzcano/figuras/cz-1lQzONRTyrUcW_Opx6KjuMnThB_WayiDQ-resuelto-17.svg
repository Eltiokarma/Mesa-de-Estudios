<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Diagonal de la proyección de un cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="131.99,322.02 276.59,322.02 332.94,207.15 188.34,207.15" fill="#f4c581" fill-opacity="0.45"/><polygon points="131.99,322.02 276.59,322.02 332.94,279.44 188.34,279.44" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,331.85 288.88,331.85 375.10,266.71 187.12,266.71 100.90,331.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="131.99,322.02 276.59,322.02 332.94,207.15 188.34,207.15 131.99,322.02" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="131.99,322.02 332.94,279.44" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="131.99,322.02 276.59,322.02 332.94,279.44 188.34,279.44 131.99,322.02" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="332.94,279.44 332.94,207.15" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="188.34,207.15 188.34,279.44" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="131.99174942054566" y="322.02143166212625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="276.5895336721458" y="322.02143166212625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="188.34315894231787" y="207.14591900876493" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="332.9409431939181" y="207.14591900876493" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="332.9409431939181" y="279.44481113456504" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="204.29064154634574" y="330.6972987172223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">k</text><text x="298.0623046335084" y="291.3377818439367" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lado común DI conserva longitud k.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lado perpendicular a DI se acorta a</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k cos 30°=k√3/2. Su proyección sigue</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a DI.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diagonal del rectángulo se obtiene</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con Pitágoras.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>