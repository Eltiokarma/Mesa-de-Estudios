<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">123 · Punto donde se cruzan una bisectriz y una mediatriz</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.47,296.72 224.05,164.72 364.21,296.72 112.47,296.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="224.05,164.72 238.34,374.96" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.34,277.66 238.34,374.96" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="364.21,296.72 238.34,374.96" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="306.9209557352117" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="224.0521892259665" y="151.1137036740575" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="307.60133674857923" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="239.02057152005125" y="387.8862963259425" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prolonga la bisectriz hasta su segundo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">encuentro con la circunferencia</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">circunscrita. Llama Q′ al punto que</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda en el arco AC que no contiene a</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la igualdad de los ángulos en B,</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las cuerdas AQ′ y CQ′ son iguales. Así</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Q′ pertenece a la mediatriz y coincide</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con Q si ambas rectas son distintas.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo ∠ACQ abarca la misma cuerda</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AQ que ∠ABQ. Por ello vale ∠ABC/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>