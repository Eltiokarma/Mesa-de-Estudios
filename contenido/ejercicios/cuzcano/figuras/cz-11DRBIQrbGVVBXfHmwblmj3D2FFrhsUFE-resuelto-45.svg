<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">045 · Cevianas interiores y ángulo de vértice 100°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.76,326.24 239.52,209.71 365.96,326.24 107.76,326.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.76,326.24 209.06,271.40 365.96,326.24" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="209.06,271.40 239.52,209.71" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645164" y="336.14426523297493" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="241.80824372759855" y="202.85573476702507" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="334.6209677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="201.44086021505376" y="269.1191756272401" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="135.93906810035844" y="320.91129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="340.06093189964156" y="323.9578853046595" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="215.1505376344086" y="241.69982078853047" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="258.56451612903226" y="231.79838709677418" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100° en B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ángulos en A y C del isósceles</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">grande son 40°. Luego</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠BCM=40°−20°=20°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ley de senos en AMC, CM/AC=sen</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">30°/sen 130°=1/(2cos 40°). Esa también</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es la razón BC/AC, por lo que CM=BC.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En BCM los dos ángulos de la base son</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">80°. Resta ∠CBM de 100° para hallar</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠MBA.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>