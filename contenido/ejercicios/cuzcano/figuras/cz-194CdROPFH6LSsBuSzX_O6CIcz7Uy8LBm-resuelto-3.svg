e points="197.26,152.10 278.74,315.04" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="197.26403320472386" cy="152.10032826060137" r="3.7" fill="#20364b"/><text x="204.26403320472386" y="144.10032826060137" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B(1,6)</text><circle cx="238.0" cy="233.5722618511536" r="3.7" fill="#20364b"/><text x="245.0" y="225.5722618511536" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="278.7359667952761" cy="315.0441954417058" r="3.7" fill="#20364b"/><text x="285.7359667952761" y="307.0441954417058" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A(3,2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro es el punto medio de A y B,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con coordenadas</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">((3+1)/2,(2+6)/2)=(2,4).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde el centro hasta A el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desplazamiento es (1,−2), de modo que</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r²=5.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa la forma con centro (2,4). Con</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B(−1,6), que aparece en el dibujo y la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">solución del libro, el centro sería</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1,4) y r²=8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>