<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">107 · Lente plano-cóncava en un líquido</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,188.01 375.10,188.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="127.94,283.02 286.27,283.02" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="243.79,215.05 270.05,215.05 270.05,350.99 243.79,350.99 253.06,323.18 257.70,283.02 253.06,242.85 243.79,215.05" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="147.25,283.02 253.06,242.85" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="191.2712403452976" y="240.5358927760109" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 cm</text><text x="297.08677873693773" y="303.09836437982733" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vidrio</text><text x="170.41708314402544" y="326.2696501590186" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Líquido</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La superficie plana no aporta</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">curvatura. La cara cóncava aporta</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−1/(0,2 m).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el líquido, el factor de índice es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1,5/2 − 1 = −1/4. El producto de ambos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">factores es 1,25 m⁻¹.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La focal es positiva, 0,8 m. En este</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">líquido la lente es convergente.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>