<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Fuerza inclinada para subir un cilindro de 60 cm</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="279.13,276.35 278.09,288.26 275.00,299.80 269.95,310.63 263.09,320.42 254.64,328.87 244.85,335.72 234.03,340.77 222.48,343.86 210.58,344.90 198.68,343.86 187.14,340.77 176.31,335.72 166.52,328.87 158.07,320.42 151.22,310.63 146.17,299.80 143.07,288.26 142.03,276.35 143.07,264.45 146.17,252.91 151.22,242.08 158.07,232.29 166.52,223.84 176.31,216.99 187.14,211.94 198.68,208.85 210.58,207.81 222.48,208.85 234.03,211.94 244.85,216.99 254.64,223.84 263.09,232.29 269.95,242.08 275.00,252.91 278.09,264.45 279.13,276.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,344.90 261.67,344.90 261.67,322.05 375.10,322.05" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="210.58,276.35 261.67,322.05" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="210.58,276.35 341.18,200.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="333.92,213.06 341.18,200.95 327.07,201.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="350.0941536352339" y="194.09677419354838" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="267.15746722781773" y="333.47849462365593" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">d</text><text x="232.03968462278024" y="290.97849462365593" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="296.26612903225805" y="267.4435483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde la esquina hasta el centro hay</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">20 cm de altura y √(30²−20²)=10√5 cm</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de distancia horizontal.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto de la esquina, el peso</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">produce un momento de 200×10√5. La</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerza aplicada produce el opuesto con</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">brazo efectivo 20 cos 30°+10√5 sen</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">30°.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide el momento del peso entre el</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">brazo efectivo y simplifica.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>