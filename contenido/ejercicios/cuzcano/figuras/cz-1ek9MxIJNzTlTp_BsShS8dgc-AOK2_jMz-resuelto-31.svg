<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Semicírculo de una composición</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.48387096774195" x2="421" y2="142.48387096774195" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,142.48 105.47,207.53 110.04,233.68 114.61,253.21 119.18,269.22 123.75,282.91 128.32,294.90 132.89,305.58 137.46,315.19 142.03,323.90 146.60,331.83 151.17,339.07 155.74,345.71 160.31,351.79 164.88,357.37 169.45,362.48 174.02,367.16 178.59,371.43 183.16,375.31 187.73,378.82 192.30,381.99 196.87,384.82 201.44,387.32 206.01,389.50 210.58,391.38 215.15,392.96 219.72,394.25 224.29,395.24 228.86,395.95 233.43,396.37 238.00,396.52 242.57,396.37 247.14,395.95 251.71,395.24 256.28,394.25 260.85,392.96 265.42,391.38 269.99,389.50 274.56,387.32 279.13,384.82 283.70,381.99 288.27,378.82 292.84,375.31 297.41,371.43 301.98,367.16 306.55,362.48 311.12,357.37 315.69,351.79 320.26,345.71 324.83,339.07 329.40,331.83 333.97,323.90 338.54,315.19 343.11,305.58 347.68,294.90 352.25,282.91 356.82,269.22 361.39,253.21 365.96,233.68 370.53,207.53 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">y</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El dominio es [−1,1]. Si β=arccos x,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entonces arcsen x=π/2−β.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El argumento del seno se reduce a π+β.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto y=−sen β=−√(1−x²).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se cumple x²+y²=1 y y≤0. La gráfica va</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de (−1,0) a (1,0) por el semicírculo</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferior.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>