<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Fuerza máxima y mínima sobrecaras de cubo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="110.98387096774195" y1="105" x2="110.98387096774195" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="110.98,396.52 365.02,396.52 365.02,142.48 110.98,142.48 110.98,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">corte central</text><circle cx="238.00000000000003" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="245.00000000000003" y="159.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q encentro superior</text><circle cx="110.98387096774195" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="117.98387096774195" y="112.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">borde cercano</text><circle cx="365.01612903225805" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="358.01612903225805" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="end">vértice inferior</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Punto más cercano permitido está</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enborde superior de una caralateral:</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dmin=a/2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Puntos más lejanos sonvértices de cara</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferior:</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dmax²=a²+(a/2)²+(a/2)²=3a²/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cociente de</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerzas=dmax²/dmin²=(3/2)/(1/4)=6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>