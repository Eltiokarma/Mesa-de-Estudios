<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Dos puntos sobre bisectrices</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="233.20967741935485" x2="421" y2="233.20967741935485" stroke="#20364b" stroke-width="1.7"/><line x1="319.6532258064516" y1="105" x2="319.6532258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="228.93,142.48 319.65,233.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">y=−x</text><polyline points="156.35,396.52 319.65,233.21" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">y=x</text><circle cx="256.14516129032256" cy="169.7016129032258" r="3.7" fill="#20364b"/><text x="263.14516129032256" y="161.7016129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−7,7)</text><circle cx="165.4193548387097" cy="387.44354838709677" r="3.7" fill="#20364b"/><text x="172.4193548387097" y="379.44354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−17,−17)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el segundo cuadrante la bisectriz</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cumple y=−x, así que 3a+2b=7.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el tercero cumple y=x, de donde</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2a−3b=−17. El sistema da a=−1 y b=5.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Evalúa bᵃ=5⁻¹=1/5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>