<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Menor parámetro entero de un vértice en el tercer cuadrante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.48387096774195" x2="421" y2="142.48387096774195" stroke="#20364b" stroke-width="1.7"/><line x1="300.31671554252193" y1="105" x2="300.31671554252193" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 105.47,386.24 110.04,376.30 114.61,366.72 119.18,357.48 123.75,348.60 128.32,340.06 132.89,331.87 137.46,324.03 142.03,316.53 146.60,309.39 151.17,302.59 155.74,296.15 160.31,290.05 164.88,284.30 169.45,278.90 174.02,273.84 178.59,269.14 183.16,264.78 187.73,260.77 192.30,257.12 196.87,253.80 201.44,250.84 206.01,248.23 210.58,245.96 215.15,244.05 219.72,242.48 224.29,241.26 228.86,240.39 233.43,239.86 238.00,239.69 242.57,239.86 247.14,240.39 251.71,241.26 256.28,242.48 260.85,244.05 265.42,245.96 269.99,248.23 274.56,250.84 279.13,253.80 283.70,257.12 288.27,260.77 292.84,264.78 297.41,269.14 301.98,273.84 306.55,278.90 311.12,284.30 315.69,290.05 320.26,296.15 324.83,302.59 329.40,309.39 333.97,316.53 338.54,324.03 343.11,331.87 347.68,340.06 352.25,348.60 356.82,357.48 361.39,366.72 365.96,376.30 370.53,386.24 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Ejemplo b=−1</text><circle cx="238.0" cy="239.6900921658986" r="3.7" fill="#20364b"/><text x="245.0" y="231.6900921658986" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Vértice</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completa cuadrado:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F(x)=−(x−b)²/2+b²/2−2. El vértice</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene abscisa b.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La abscisa negativa exige b&lt;0. La</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ordenada negativa exige b²/2−2&lt;0, así</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que −2&lt;b&lt;2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Combinando se obtiene −2&lt;b&lt;0. El único</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entero de ese intervalo es −1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>