<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Demostración del lugar de puntos medios de cuerdas paralelas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="375.10,269.50 374.80,265.02 373.92,260.55 372.46,256.13 370.43,251.76 367.82,247.47 364.66,243.27 360.96,239.18 356.73,235.23 351.99,231.42 346.77,227.77 341.07,224.30 334.94,221.03 328.39,217.96 321.46,215.12 314.17,212.50 306.55,210.14 298.64,208.02 290.46,206.17 282.07,204.59 273.48,203.29 264.75,202.27 255.89,201.54 246.97,201.10 238.00,200.95 229.03,201.10 220.11,201.54 211.25,202.27 202.52,203.29 193.93,204.59 185.54,206.17 177.36,208.02 169.45,210.14 161.83,212.50 154.54,215.12 147.61,217.96 141.06,221.03 134.93,224.30 129.23,227.77 124.01,231.42 119.27,235.23 115.04,239.18 111.34,243.27 108.18,247.47 105.57,251.76 103.54,256.13 102.08,260.55 101.20,265.02 100.90,269.50 101.20,273.98 102.08,278.45 103.54,282.87 105.57,287.24 108.18,291.53 111.34,295.73 115.04,299.82 119.27,303.77 124.01,307.58 129.23,311.23 134.93,314.70 141.06,317.97 147.61,321.04 154.54,323.88 161.83,326.50 169.45,328.86 177.36,330.98 185.54,332.83 193.93,334.41 202.52,335.71 211.25,336.73 220.11,337.46 229.03,337.90 238.00,338.05 246.97,337.90 255.89,337.46 264.75,336.73 273.48,335.71 282.07,334.41 290.46,332.83 298.64,330.98 306.55,328.86 314.17,326.50 321.46,323.88 328.39,321.04 334.94,317.97 341.07,314.70 346.77,311.23 351.99,307.58 356.73,303.77 360.96,299.82 364.66,295.73 367.82,291.53 370.43,287.24 372.46,282.87 373.92,278.45 374.80,273.98 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="115.38,238.84 360.62,300.16" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="176.69,330.81 299.31,208.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="221.37,337.54 336.89,222.02" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="139.11,316.98 254.63,201.46" fill="none" stroke="#1766b0" stroke-width="2.5"/><circle cx="238.0" cy="269.5" r="3.7" fill="#20364b"/><text x="245.0" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="279.1290322580645" cy="279.7822580645161" r="3.7" fill="#20364b"/><text x="286.1290322580645" y="271.7822580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M₁</text><circle cx="196.87096774193546" cy="259.2177419354839" r="3.7" fill="#20364b"/><text x="203.87096774193546" y="251.2177419354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para una cuerda con punto medio (h,k),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">escribe los extremos (h±t,k±mt).</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye los dos en la elipse y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resta.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se obtiene 4t(h/a²+mk/b²)=0. Como la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuerda tiene longitud positiva,</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h/a²+mk/b²=0. Recíprocamente, para un</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto interior que satisface esa</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igualdad existe un t&gt;0 resolviendo</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así, los puntos medios recorren la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">parte interior de esa recta. Si m=0</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda h=0. Para cuerdas verticales,</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por simetría queda k=0.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>