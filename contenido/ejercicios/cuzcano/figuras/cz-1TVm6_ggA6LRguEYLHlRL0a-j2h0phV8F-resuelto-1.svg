<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Dos triángulos rectángulos congruentes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="109.87,356.97 238.00,267.26 175.18,177.54" fill="#f4c581" fill-opacity="0.45"/><polygon points="175.18,356.97 238.00,267.26 366.13,356.97" fill="#f4c581" fill-opacity="0.45"/><polyline points="109.87,356.97 175.18,177.54 238.00,267.26 109.87,356.97" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.87,356.97 175.18,356.97 366.13,356.97" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="175.18,356.97 238.00,267.26 366.13,356.97" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="369.5314776784596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="171.59277682883214" y="369.5314776784596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.09677419354836" y="367.73719108333034" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="230.82285361948271" y="254.69713559018308" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="168.0042036385735" y="169.46852232154032" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="131.40609792365007" y="345.3086086442138" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="259.53143914155186" y="264.5657118633943" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">160°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las perpendiculares en U hacen que</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠AUD=20°. Sea θ la inclinación de AU</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto de la base. Entonces las</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclinaciones de DU y UC respecto de</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la base son θ+20° y 70°−θ.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A y D proyectan a la misma altura</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde U. Como sus inclinaciones agudas</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">difieren, AU y DU tienen longitudes</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distintas. La congruencia empareja AU</text><text x="482" y="315" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con UC.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La igualdad de longitudes a la misma</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura da θ=70°−θ. Además, el ángulo</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en A del triángulo AUT coincide con el</text><text x="482" y="422" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de C del triángulo CUD.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>