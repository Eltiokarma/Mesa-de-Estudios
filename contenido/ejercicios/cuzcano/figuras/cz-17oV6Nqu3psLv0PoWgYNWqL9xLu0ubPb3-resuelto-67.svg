<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">067 · Tangente y coseno de un rayo perpendicular</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,209.05 375.10,209.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="225.91,358.24 225.91,180.76" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="346.81,305.77 225.91,209.05 129.19,329.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="248.64,209.05 248.43,206.00 247.82,203.01 246.81,200.12 245.42,197.40 243.68,194.89 241.62,192.63 239.28,190.67 236.69,189.04 233.91,187.78 230.98,186.90 227.96,186.42 224.90,186.35 221.87,186.69 218.90,187.43 216.06,188.57 213.40,190.07 210.97,191.92 208.81,194.08 206.95,196.51 205.44,199.17 204.30,202.00 203.55,204.97 203.21,208.01 203.27,211.06 203.75,214.08 204.62,217.01 205.88,219.79 207.50,222.38 209.46,224.73 211.71,226.80" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="225.91033737270297" y="209.05168686351482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="346.8069636456733" y="305.7689878818911" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="375.09677419354836" y="214.49203504579847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="233.5268248279001" y="180.76187631563977" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="203.4235648859305" y="226.21900779427665" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Un vector perpendicular a (5,−4) en el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tercer cuadrante es (−4,−5).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su norma es √41. Por tanto tan θ=5/4 y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos θ=−4/√41.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los términos aportan 5 y 4,</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respectivamente.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>