<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">074 · Dipolo neto en siete especies</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130.0" width="126.66666666666667" height="36.25" fill="#dfedf8" stroke="#a3b9cc"/><text x="111.33333333333334" y="153.5625" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Especie</text><rect x="174.66666666666669" y="130.0" width="126.66666666666667" height="36.25" fill="#dfedf8" stroke="#a3b9cc"/><text x="238.00000000000003" y="153.5625" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Forma</text><rect x="301.33333333333337" y="130.0" width="126.66666666666667" height="36.25" fill="#dfedf8" stroke="#a3b9cc"/><text x="364.6666666666667" y="153.5625" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Dipolo neto</text><rect x="48.0" y="166.25" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="189.8125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">PCl₃</text><rect x="174.66666666666669" y="166.25" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="189.8125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Piramidal</text><rect x="301.33333333333337" y="166.25" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="189.8125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Sí</text><rect x="48.0" y="202.5" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="226.0625" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">SO₃</text><rect x="174.66666666666669" y="202.5" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="226.0625" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Trigonal</text><rect x="301.33333333333337" y="202.5" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="226.0625" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">No</text><rect x="48.0" y="238.75" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="262.3125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">CH₃OH</text><rect x="174.66666666666669" y="238.75" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="262.3125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Grupos distintos</text><rect x="301.33333333333337" y="238.75" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="262.3125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Sí</text><rect x="48.0" y="275.0" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="298.5625" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">HNO₂</text><rect x="174.66666666666669" y="275.0" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="298.5625" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Asimétrica</text><rect x="301.33333333333337" y="275.0" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="298.5625" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Sí</text><rect x="48.0" y="311.25" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="334.8125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">SO₂</text><rect x="174.66666666666669" y="311.25" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="334.8125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Angular</text><rect x="301.33333333333337" y="311.25" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="334.8125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Sí</text><rect x="48.0" y="347.5" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="371.0625" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">BH₃</text><rect x="174.66666666666669" y="347.5" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="371.0625" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Trigonal</text><rect x="301.33333333333337" y="347.5" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="371.0625" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">No</text><rect x="48.0" y="383.75" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="407.3125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">BeCl₂</text><rect x="174.66666666666669" y="383.75" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="407.3125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Lineal</text><rect x="301.33333333333337" y="383.75" width="126.66666666666667" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="407.3125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">No</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Polaridad</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">SO₃ y BH₃ son trigonales planas</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simétricas, y BeCl₂ es lineal con</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos equivalentes. Sus</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contribuciones se cancelan.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PCl₃ es piramidal y SO₂ es angular.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus dipolos no se cancelan.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CH₃OH y HNO₂ tienen enlaces y extremos</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distintos con un dipolo neto. En total</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hay cuatro moléculas polares.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>