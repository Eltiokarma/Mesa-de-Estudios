<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Valor seis meses en el futuro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,268.36 375.10,268.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,266.64 100.90,270.07" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="203.73,266.64 203.73,270.07" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="272.27,266.64 272.27,270.07" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,266.64 375.10,270.07" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="272.35618279569894" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hace 9 meses</text><text x="203.7258064516129" y="272.35618279569894" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hoy</text><text x="272.2741935483871" y="272.35618279569894" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">En 6 meses</text><text x="375.09677419354836" y="272.35618279569894" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vencimiento</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Un descuento de 10 % en dos años da</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tasa anual de 5 %. Hoy faltan 15</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">meses.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El valor de hoy es N(1 − 0,05 × 15/12)</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= (15/16)N. El nominal es S/ 10 000.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dentro de seis meses quedarán nueve.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica el descuento de 0,05 × 9/12 al</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">nominal.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>