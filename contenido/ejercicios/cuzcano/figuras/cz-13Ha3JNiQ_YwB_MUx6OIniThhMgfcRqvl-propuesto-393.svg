<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">393 · Cristalización en una curva másica</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="373.8346774193548" x2="421" y2="373.8346774193548" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">Temperatura (°C)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">g X / 100 g de solución</text><polyline points="131.03,364.76 161.17,351.15 221.43,328.47 281.69,274.04 341.95,192.38 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><circle cx="161.16554413328606" cy="351.1532258064516" r="3.7" fill="#20364b"/><text x="168.16554413328606" y="343.1532258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5</text><circle cx="221.4278624601205" cy="328.4717741935484" r="3.7" fill="#20364b"/><text x="228.4278624601205" y="320.4717741935484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">10</text><circle cx="281.69018078695495" cy="274.0362903225806" r="3.7" fill="#20364b"/><text x="288.69018078695495" y="266.0362903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">22</text><circle cx="341.95249911378943" cy="192.38306451612902" r="3.7" fill="#20364b"/><text x="348.95249911378943" y="184.38306451612902" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">40</text><text x="161.16554413328606" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20</text><text x="221.4278624601205" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40</text><text x="281.69018078695495" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60</text><text x="341.95249911378943" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">80</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A 80 °C hay 40 g de X por 60 g de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agua. Con 500 g de agua se disuelven</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">500(40/60) g.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A 20 °C hay 5 g de X por 95 g de agua.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Quedan disueltos 500(5/95) g.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta ambas cantidades suponiendo que</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el agua no se pierde.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>