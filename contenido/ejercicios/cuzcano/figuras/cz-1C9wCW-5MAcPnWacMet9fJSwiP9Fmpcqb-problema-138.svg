<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">138 · Punto de campo gravitatorio nulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="270.35685483870964" x2="421" y2="270.35685483870964" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="100.90,270.36 375.10,270.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">segmento</text><circle cx="100.9032258064516" cy="270.35685483870964" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="262.35685483870964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m1</text><circle cx="169.4516129032258" cy="270.35685483870964" r="3.7" fill="#20364b"/><text x="176.4516129032258" y="262.35685483870964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">campo nulo</text><circle cx="375.0967741935484" cy="270.35685483870964" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="262.35685483870964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">9m1</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto debe estar entre las masas</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para que las fuerzas se opongan.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si está a x de la menor,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/x²=9/(160−x)².</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">160−x=3x, así x=40 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>