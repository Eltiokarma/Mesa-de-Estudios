<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Flechas hacia la izquierda y hacia abajo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,333.81 100.90,205.19 125.64,205.19 125.64,222.86 157.44,222.86 157.44,253.25 275.45,253.25 275.45,222.86 348.95,222.86 348.95,205.19 375.10,205.19 375.10,333.81 100.90,333.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="263.44,280.10 200.55,280.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="209.03,275.15 200.55,280.10 209.03,285.05" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="200.55,280.10 200.55,318.97" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="195.60,310.49 200.55,318.97 205.49,310.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="247.8935816428334" y="302.7141669437978" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hacia la izquierda y abajo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La región inferior izquierda</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corresponde en general a átomos de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mayor tamaño y carácter metálico.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El poder reductor de los metales</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcalinos y el tamaño aumentan en el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">modelo cualitativo usual al bajar.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La afinidad electrónica como energía</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">liberada suele ser menor hacia la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda y abajo. La tendencia admite</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">excepciones.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>