<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Barra articulada con dos cargas y un cable</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="149.31,240.07 342.95,317.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="149.31,214.89 149.31,267.18" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="149.31,240.07 102.84,189.72" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="112.96,193.55 102.84,189.72 105.85,200.12" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="246.13,278.79 246.13,348.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="241.29,338.82 246.13,348.50 250.97,338.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="296.48,298.93 296.48,358.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="291.64,348.50 296.48,358.19 301.32,348.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="342.95,317.52 368.13,256.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="368.92,267.13 368.13,256.33 359.97,263.44" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="180.81310369965374" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="253.8784399489703" y="345.40668853654097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">mg</text><text x="305.3865500273373" y="355.08866411518136" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="375.0967741935484" y="252.8470020047385" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dibuja el peso propio de la barra y la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerza vertical que transmite la carga</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P, cada uno en su punto de aplicación.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cable tira hacia arriba y a la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha. La componente horizontal de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la articulación apunta a la izquierda</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para equilibrar la del cable.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ambas cargas están antes del</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremo derecho, su momento combinado</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es menor que si ambas actuaran en ese</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremo. Además, la componente</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal del cable ayuda a</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>