8902418514" y="229.04287059773287" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="206.12035386323117" y="223.32454842073398" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="260.1584984358707" y="184.72587372599148" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="339.6431766961552" y="184.15404150829153" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="346.50516330855385" y="249.34291432607893" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B = 4 T</text><text x="106.90746409230046" y="267.64154529247537" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,8 m</text><text x="174.95549799858725" y="185.8695381613913" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,6 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Integra I dℓ×B a lo largo del alambre.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El resultado es I veces el producto</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vectorial de N→A con B.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La componente en y es paralela al</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">campo y no aporta. La proyección</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular mide √(0,6²+0,8²)=1 m.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La magnitud es I B veces esa</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección, cualquiera sea d.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>