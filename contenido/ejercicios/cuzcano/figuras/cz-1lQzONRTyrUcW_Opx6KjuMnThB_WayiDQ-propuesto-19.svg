<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">019 · Distancia a través de tres direcciones ortogonales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="148.81,396.52 327.19,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="148.81,396.52 148.81,218.13" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="148.81,218.13 248.93,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="148.81,218.13 327.19,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="148.81,396.52 248.93,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="327.19,396.52 248.93,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="148.8066940624414" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="327.1933059375586" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="148.8066940624414" y="218.12951715714087" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="248.92593166605764" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon x=AD, y=BC, z=AB. Son componentes</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en tres direcciones ortogonales.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras, BD²=x²+z² y AC²=y²+z².</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma dada es 2(x²+y²+z²).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como DC²=x²+y²+z², resulta DC²=32.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>