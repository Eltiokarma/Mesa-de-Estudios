<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Vector entre un cuarto de una diagonal y un punto medio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,336.38 167.78,202.62 368.41,202.62 301.53,336.38 100.90,336.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,336.38 368.41,202.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="167.78,202.62 301.53,336.38" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="167.78,302.94 334.97,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="346.4079464988198" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="161.09205350118017" y="192.59205350118017" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="192.59205350118017" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="308.22029897718335" y="346.4079464988198" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="167.77970102281668" y="314.6416207710464" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="341.65853658536594" y="276.18764752163656" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma A como origen y escribe B=u, D=v,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C=u+v.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E=(u+v)/4 y F=v+u/2.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta para hallar EF=u/4+3v/4 y toma</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la diferencia de coeficientes.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>