<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">046 · Raíz como argumento</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución real</text><line x1="60" y1="200" x2="425" y2="200" stroke="#8295a8" stroke-width="2"/><line x1="145.00000000000028" y1="200" x2="345.0" y2="200" stroke="#1766b0" stroke-width="6"/><circle cx="145.00000000000028" cy="200" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="145.00000000000028" y="235" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">−15/7</text><circle cx="345.0" cy="200" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="345.0" y="235" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">-2</text><line x1="60" y1="290" x2="425" y2="290" stroke="#8295a8" stroke-width="2"/><line x1="135.0" y1="290" x2="415" y2="290" stroke="#1766b0" stroke-width="6"/><circle cx="135.0" cy="290" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="135.0" y="325" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">3</text><line x1="415" y1="290" x2="405" y2="282" stroke="#1766b0" stroke-width="3"/><line x1="415" y1="290" x2="405" y2="298" stroke="#1766b0" stroke-width="3"/><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El dominio exige 7x+15&gt;0 y x+3&gt;0; se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reduce a x&gt;−15/7.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La base 7 es creciente. Ambos lados</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivos permiten cuadrar</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(7x+15)&lt;x+3: x²−x−6&gt;0.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(x−3)(x+2)&gt;0 y el dominio dan</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−15/7,−2) o x&gt;3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>