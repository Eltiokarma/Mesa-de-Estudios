<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">012 · Menor entero compatible con tres lados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,330.80 186.06,188.55 375.10,330.80 100.90,330.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="136.46416382252562" y="246.57255312121546" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a + 2</text><text x="298.360013211494" y="248.44418143785092" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a + 3</text><text x="235.66046460420566" y="350.4479246944842" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma de los dos primeros lados debe</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superar 8, de modo que 2a+5&gt;8.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las otras dos desigualdades equivalen</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a 8&gt;1 y 8&gt;−1. Los lados son positivos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para a&gt;1,5.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El menor entero mayor que 1,5 es 2 y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da lados 4, 5 y 8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>