8" stroke-width="2.5"/><text x="141.04758510069507" y="347.137675993584" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="235.7276777757975" y="345.62279451078234" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="145.59222954909998" y="214.58554624844058" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="355.40331491712703" y="255.48734628408485" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="253.14881482801636" y="232.00668330065943" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="159.2261628943147" y="305.4784352165389" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="179.67706291213688" y="327.4442167171627" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="241.78720370700407" y="191.862324006416" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como RP=RN, la mediana RE es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a PN y biseca el ángulo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">central PRN. Por ello ∠PRE=θ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠PUE=∠PRE, P,E,R,U son</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">concíclicos.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces ∠PUR=∠PER=90°. Al restar</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠PUE=θ queda el ángulo pedido.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>