<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Valor actual con el doble de plazo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,264.93 375.10,264.93" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,258.08 100.90,271.78" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="146.60,258.08 146.60,271.78" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,258.08 375.10,271.78" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="280.92473118279565" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hoy</text><text x="146.6021505376344" y="280.92473118279565" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15 días</text><text x="375.09677419354836" y="280.92473118279565" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vencimiento</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En 75 días el descuento es S/ 200, así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en 90 días es S/ 240. El nominal es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">560 + 240 = S/ 800.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A seis meses el producto tasa por</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiempo duplica el de 90 días. Vale 2 ×</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">240/800 = 0,60.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El valor racional es 800/(1 + 0,60).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>