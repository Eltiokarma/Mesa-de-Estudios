<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Espesor de aceite con un cubo entre dos líquidos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,178.10 100.90,360.90 375.10,360.90 375.10,178.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,232.37 375.10,232.37" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,295.21 375.10,295.21" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="215.15,191.24 263.71,191.24 263.71,316.91 215.15,316.91 215.15,191.24" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="337.3951612903226" y="261.502688172043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Aceite</text><text x="337.3951612903226" y="329.47983870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="164.88172043010752" y="212.3763440860215" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 cm</text><text x="160.88306451612902" y="262.64516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h</text><text x="239.14247311827958" y="331.1935483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Arista: 10 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La longitud sumergida total es 6 cm.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De ella h está en aceite y 6 − h en</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agua.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cancela g y el área de la base del</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cubo en la ecuación de equilibrio.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Queda 500×10 = 800h + 1000(6 − h) con</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alturas en cm.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja 200h = 1000.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>