l="#20364b" text-anchor="middle">•</text><text x="264.0948977962313" y="292.76533056531457" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="157.20013573938036" y="363.81890769722133" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Ca²⁺</text><text x="257.8069706164165" y="363.81890769722133" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="318.79986426061964" y="335.52323538805496" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2−</text><text x="230.14009102523156" y="357.5309805174066" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="230.14009102523156" y="370.1068348770361" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="285.4738502076014" y="357.5309805174066" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="285.4738502076014" y="370.1068348770361" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="251.51904343660172" y="340.55357713190676" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="264.0948977962313" y="340.55357713190676" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="251.51904343660172" y="387.08423826253596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="264.0948977962313" y="387.08423826253596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En Na₂S, 2Na⁺ suministran carga +2. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sulfuro aporta −2 y alcanza ocho</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">electrones de valencia.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En LiBr, Li⁺ y Br⁻ se compensan 1:1.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Br⁻ alcanza el octeto al ganar un</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">electrón.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En CaO, Ca²⁺ y O²⁻ se compensan 1:1 y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el óxido tiene octeto. Las tres</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">representaciones son correctas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>