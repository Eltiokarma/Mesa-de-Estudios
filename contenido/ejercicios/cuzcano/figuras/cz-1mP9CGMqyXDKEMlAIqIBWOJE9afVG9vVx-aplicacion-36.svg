<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Rapidez en el punto bajo de un péndulo cargado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="175.77,374.07 175.77,164.93 352.26,266.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="352.47,266.95 350.93,269.58 349.34,272.19 347.72,274.77 346.06,277.33 344.35,279.87 342.62,282.38 340.84,284.86 339.03,287.32 337.18,289.75 335.29,292.15 333.37,294.52 331.42,296.86 329.43,299.18 327.40,301.46 325.34,303.71 323.25,305.93 321.12,308.12 318.96,310.28 316.77,312.41 314.55,314.50 312.30,316.56 310.01,318.59 307.70,320.58 305.36,322.53 302.99,324.45 300.58,326.34 298.16,328.19 295.70,330.00 293.22,331.78 290.71,333.52 288.17,335.22 285.61,336.88 283.03,338.50 280.42,340.09 277.79,341.63 275.13,343.14 272.46,344.61 269.76,346.03 267.04,347.42 264.30,348.76 261.54,350.07 258.76,351.33 255.96,352.55 253.15,353.73 250.31,354.87 247.46,355.96 244.60,357.01 241.72,358.02 238.82,358.98 235.91,359.91 232.99,360.78 230.05,361.62 227.10,362.41 224.14,363.15 221.17,363.85 218.19,364.51 215.20,365.12 212.20,365.69 209.19,366.21 206.18,366.69 203.16,367.12 200.13,367.51 197.10,367.85 194.06,368.15 191.02,368.40 187.97,368.61 184.92,368.77 181.87,368.88 178.82,368.95 175.77,368.97" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="143.12,164.93 208.41,164.93" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="175.77,366.93 122.72,366.93" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="139.04,359.28 122.72,366.93 139.04,374.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="184.9490866692577" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="206.3734939759036" y="215.93898173338516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="369.60707345511076" y="271.0303148076176" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="182.9086669257676" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="106.39292654488924" y="262.8686358336572" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙ 5 T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al soltarla, la rapidez es cero y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T_A=mg cos 60°=0,30 N. Por tanto</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T_C=0,36 N.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura perdida es R/2. De la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conservación de energía, v²/R=g.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En C la esfera se mueve hacia la</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda y la fuerza magnética apunta</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia arriba. Entonces</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T_C+qvB−mg=mv²/R=mg. Despeja v.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>