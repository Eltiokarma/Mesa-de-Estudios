<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">092 · Corredores en triángulo equilátero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.99,359.01 363.01,359.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="363.01,359.01 238.00,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,142.48 112.99,359.01" fill="none" stroke="#008674" stroke-width="2.5"/><text x="119.98725075263374" y="351.0123042580482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="370.01274924736623" y="351.0123042580482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="244.99999999999997" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="256.25318731184154" y="178.61597929031853" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><text x="244.99999999999997" y="351.0123042580482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N</text><text x="267.5012749247366" y="209.74636769884037" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">CM=10m</text><text x="169.99235045158025" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N:medio de AB</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a el lado. Hasta el primer cruce</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recorren a+10 y 2 a−10.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hasta el segundo, recorren 2.5 a y 3.5</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a respectivamente; su razón de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">velocidades es 7/5.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(2 a−10)/(a+10)=7/5⇒a=40 m. Perímetro</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">120 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>