 375.10,379.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">rayo paralelo</text><polyline points="100.90,214.28 192.30,269.50 375.10,379.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="503" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">rayo central</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si u&lt;f, la imagen es virtual y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha; I es falsa.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si u&gt;f, puede formar una imagen real;</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">II es falsa.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para f&lt;u&lt;2f, v&gt;2f y el módulo del</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aumento supera 1: III verdadera.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>