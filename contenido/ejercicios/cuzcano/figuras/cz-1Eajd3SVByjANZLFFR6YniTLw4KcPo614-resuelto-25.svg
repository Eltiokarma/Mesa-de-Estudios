<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">025 · Reconocer una cuerda a partir de un isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,200.32 312.72,200.32 375.10,331.11 206.81,331.11 100.90,200.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,200.32 375.10,331.11" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="206.81,331.11 312.72,200.32" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="200.32173411002475" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="312.7161903310356" y="200.32173411002478" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.0967741935484" y="331.105347914359" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="206.8097080687436" y="331.105347914359" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="191.66387211751118" y="300.8136760118942" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="237.9428153018325" y="319.1569662194979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="343.1222316298355" y="313.94006716962895" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">39°</text><text x="149.59210558630997" y="325.2153005999909" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">∣</text><text x="289.2703704698979" y="338.67826588997525" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">∣</text><text x="136.1291402963256" y="206.5729189820035" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ED=EO, los ángulos EDO y DOE</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen una misma medida β. Entonces</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x+2θ+2β=180°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En EDR, ∠EDR=β+θ. Al sustituir x,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resulta también ∠DRE=β+θ, así que</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ED=ER.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ED=ER=EO, E es el circuncentro de</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DRO. El ángulo central DER mide el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">doble de ∠DOR.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>