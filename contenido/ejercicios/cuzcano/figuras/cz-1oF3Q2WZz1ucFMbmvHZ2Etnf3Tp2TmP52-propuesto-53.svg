<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">053 · Medida del ángulo al maximizar una cuadrática</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,353.91 375.10,353.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,353.91 316.97,185.09" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="171.05,353.91 171.03,352.45 170.99,351.00 170.91,349.55 170.80,348.10 170.67,346.65 170.50,345.21 170.31,343.76 170.08,342.33 169.83,340.90 169.54,339.47 169.23,338.05 168.89,336.64 168.52,335.23 168.11,333.84 167.68,332.45 167.22,331.07 166.74,329.70 166.22,328.34 165.68,326.99 165.11,325.66 164.51,324.33 163.88,323.02 163.23,321.72 162.55,320.44 161.84,319.17 161.11,317.91 160.35,316.67 159.56,315.45 158.75,314.24 157.92,313.05 157.06,311.88 156.18,310.72" fill="none" stroke="#008674" stroke-width="2.5"/><text x="200.3848313786978" y="319.65093844947324" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ=(x−4x²)°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completa cuadrados:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x−4x²=1/16−4(x−1/8)².</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El máximo de θ ocurre en x=1/8.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo pedido es 1/8 de grado.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica por 60 para expresarlo en</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">minutos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>