<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Distancia a una oblicua a partir de un diedro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="201.02,142.48 207.75,396.52 335.49,350.80" fill="#f4c581" fill-opacity="0.45"/><polygon points="201.02,142.48 140.51,396.52 207.75,396.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="140.51,396.52 201.02,350.80 335.49,350.80 274.98,396.52 140.51,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="201.02,142.48 140.51,396.52 201.02,142.48 201.02,350.80" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="201.02,142.48 335.49,350.80 207.75,396.52 201.02,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="140.51,396.52 207.28,379.12" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="201.02,142.48 284.39,369.09 201.02,350.80" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><text x="140.51215513777615" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="201.02185194881162" y="350.7976914416979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="335.4878448622238" y="350.7976914416979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="274.9781480511883" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="207.74515159448225" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="201.02185194881162" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="284.39076755512724" y="369.085066477922" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="207.28465161875138" y="379.11665930181175" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">J</text><text x="201.02185194881162" y="246.64078120471993" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4√3</text><text x="279.2737141645423" y="367.41077927323107" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el lado mide s, entonces</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MC²=s²+(s/2)²=25, de donde s=2√5.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el plano de base, la distancia de B</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a MC vale s²/MC=4 por el área de BMC.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El corte perpendicular a MC da BP=4</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan 60°=4√3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PA²=BP²+AB²=68, AM²=5 y PA⊥AM. La</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura desde A a PM es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PA·AM/√(PA²+AM²).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>