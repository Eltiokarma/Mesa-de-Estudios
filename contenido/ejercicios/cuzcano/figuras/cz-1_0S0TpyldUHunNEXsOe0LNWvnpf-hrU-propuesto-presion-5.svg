<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Compuerta vertical con bisagra inferior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="123.44,239.00 295.28,239.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="123.44,376.47 352.56,376.47" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="295.28,147.35 295.28,376.47" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="352.56,147.35 295.28,147.35" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="305.02,142.48 295.28,147.35 305.02,152.22" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="288.4054987816852" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Bisagra</text><text x="180.72102411172125" y="299.14187002218426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="338.23820780448773" y="190.88460559333745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 m</text><text x="338.23820780448773" y="307.73371640542604" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6 m</text><text x="352.55795177655745" y="167.40022547914316" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La presión manométrica sobre la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">compuerta crece linealmente desde cero</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hasta 60 000 Pa. La resultante es el</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área 20×6 multiplicada por 30 000 Pa.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La resultante de esa distribución</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triangular actúa a un tercio de la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura desde el fondo, a 2 m de la</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisagra.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Equilibra momentos sobre la bisagra.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza aplicada tiene brazo de 6 +</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4 = 10 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>