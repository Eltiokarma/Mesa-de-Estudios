<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Rango de cuartas potencias con un desplazamiento</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="100.90,161.00 105.47,152.65 110.04,146.62 114.61,143.18 119.18,142.48 123.75,144.56 128.32,149.32 132.89,156.55 137.46,165.95 142.03,177.08 146.60,189.48 151.17,202.60 155.74,215.86 160.31,228.69 164.88,240.53 169.45,250.85 174.02,259.21 178.59,265.24 183.16,268.67 187.73,269.37 192.30,267.29 196.87,262.53 201.44,255.30 206.01,245.91 210.58,234.77 215.15,222.37 219.72,209.25 224.29,195.99 228.86,183.16 233.43,171.33 238.00,161.00 242.57,152.65 247.14,146.62 251.71,143.18 256.28,142.48 260.85,144.56 265.42,149.32 269.99,156.55 274.56,165.95 279.13,177.08 283.70,189.48 288.27,202.60 292.84,215.86 297.41,228.69 301.98,240.53 306.55,250.85 311.12,259.21 315.69,265.24 320.26,268.67 324.83,269.37 329.40,267.29 333.97,262.53 338.54,255.30 343.11,245.91 347.68,234.77 352.25,222.37 356.82,209.25 361.39,195.99 365.96,183.16 370.53,171.33 375.10,161.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea t=π/16−x. Al variar x en ℝ, t</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también recorre ℝ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma es 1−2sen²t</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos²t=1−sen²(2t)/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como sen²(2t) recorre [0,1], los</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos del rango son 1/2 y 1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>