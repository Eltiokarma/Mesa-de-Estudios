<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Fuerza de 10 N que pasa por dos coordenadas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,333.96 375.10,333.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="112.27,345.33 112.27,193.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="112.27,227.41 325.37,227.41 325.37,333.96" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="112.27,333.96 183.30,333.96 183.30,328.28 112.27,328.28 112.27,333.96" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="183.30,333.96 353.79,206.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="345.97,209.65 353.79,206.10 350.95,213.92" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="105.16530168811632" y="340.71218452281465" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="183.3033595186361" y="341.7777034932309" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="325.3725555741267" y="341.7777034932309" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6</text><text x="104.09978271770014" y="227.41200066856092" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="189.34130035099446" y="325.79491893698815" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="334.9622263078723" y="227.41200066856092" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="355.91743272605726" y="199.35333444760155" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="369.05883336119007" y="341.7777034932309" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x (m)</text><text x="121.85843222463646" y="199.35333444760155" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y (m)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El desplazamiento de P a Q es (4,3),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de módulo 5. La fuerza tiene</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes (8,6) N.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector de O a P es (2,0) m. Su</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente vertical es cero.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica τ_z=xF_y−y F_x. El resultado</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivo indica giro antihorario.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>