<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">076 · Ángulo entre lados iguales de un cuadrilátero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.54,344.35 238.38,216.04 327.74,247.35 366.70,345.11 108.54,344.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.54,344.35 327.74,247.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.38,216.04 366.70,345.11" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.38,216.04 301.01,191.60 327.74,247.35" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.38,216.04 262.82,274.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.9032258064516" y="351.98719561505976" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="236.8543445053464" y="209.16214394824334" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="334.6169467157876" y="251.93328241531134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="353.5147362745979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="302.5385928654866" y="185.4852637254021" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="264.350076377033" y="283.24786593584327" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="262.05876538772577" y="232.83902417108456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="352.18366430047627" y="322.200152754066" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="307.88498517387006" y="255.7521340641567" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En BCD, ∠BCD=140°. Prolonga DC más</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">allá de C hasta H; ∠BCH=40°, igual a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠BCA. Así B equidista de las rectas AC</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y DC.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si Q y H son los pies de B sobre AC y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la prolongación de DC, ABQ y DBH son</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulos con hipotenusas iguales y</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BQ=BH. Luego ∠BAC=∠BDH=20°.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABC, ∠ABC=180°−20°−40°=120°. Resta</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠CBD=20°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>