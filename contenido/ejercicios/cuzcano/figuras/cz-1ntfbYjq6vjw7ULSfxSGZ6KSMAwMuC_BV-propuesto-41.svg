<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Exponencial simétrica con mínimo nulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="192.30107526881721" y1="105" x2="192.30107526881721" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,142.48 103.65,154.31 106.39,165.66 109.13,176.54 111.87,186.98 114.61,196.99 117.35,206.60 120.10,215.81 122.84,224.65 125.58,233.13 128.32,241.26 131.06,249.07 133.81,256.55 136.55,263.73 139.29,270.62 142.03,277.23 144.77,283.56 147.52,289.64 150.26,295.48 153.00,301.07 155.74,306.44 158.48,311.58 161.23,316.52 163.97,321.26 166.71,325.80 169.45,330.16 172.19,334.34 174.94,338.35 177.68,342.20 180.42,345.89 183.16,349.43 185.90,352.83 188.65,356.09 191.39,359.21 194.13,362.21 196.87,365.09 199.61,367.84 202.35,370.49 205.10,373.03 207.84,375.46 210.58,377.80 213.32,380.04 216.06,382.19 218.81,384.25 221.55,386.23 224.29,388.13 227.03,389.95 229.77,391.69 232.52,393.37 235.26,394.98 238.00,396.52 240.74,394.98 243.48,393.37 246.23,391.69 248.97,389.95 251.71,388.13 254.45,386.23 257.19,384.25 259.94,382.19 262.68,380.04 265.42,377.80 268.16,375.46 270.90,373.03 273.65,370.49 276.39,367.84 279.13,365.09 281.87,362.21 284.61,359.21 287.35,356.09 290.10,352.83 292.84,349.43 295.58,345.89 298.32,342.20 301.06,338.35 303.81,334.34 306.55,330.16 309.29,325.80 312.03,321.26 314.77,316.52 317.52,311.58 320.26,306.44 323.00,301.07 325.74,295.48 328.48,289.64 331.23,283.56 333.97,277.23 336.71,270.62 339.45,263.73 342.19,256.55 344.94,249.07 347.68,241.26 350.42,233.13 353.16,224.65 355.90,215.81 358.65,206.60 361.39,196.99 364.13,186.98 366.87,176.54 369.61,165.66 372.35,154.31 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">f(x)</text><circle cx="192.30107526881721" cy="360.2258064516129" r="3.7" fill="#20364b"/><text x="199.30107526881721" y="352.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,1)</text><circle cx="238.0" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="245.0" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,0)</text><circle cx="283.69892473118284" cy="360.2258064516129" r="3.7" fill="#20364b"/><text x="290.69892473118284" y="352.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2,1)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para x≤1 se obtiene 2^(1−x)−1, que</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">decrece hasta 0.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para x≥1 queda 2^(x−1)−1, que crece</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde 0.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mínimo es (1,0). La gráfica es</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simétrica respecto de x=1 y pasa por</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,1) y (2,1).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>