<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">065 · Rango de un cociente con raíz cuadrada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,394.79 105.47,394.67 110.04,394.54 114.61,394.39 119.18,394.23 123.75,394.05 128.32,393.85 132.89,393.62 137.46,393.36 142.03,393.06 146.60,392.72 151.17,392.33 155.74,391.88 160.31,391.35 164.88,390.73 169.45,390.00 174.02,389.12 178.59,388.05 183.16,386.75 187.73,385.13 192.30,383.11 196.87,380.53 201.44,377.21 206.01,372.86 210.58,367.08 215.15,359.31 219.72,348.85 224.29,334.85 228.86,316.67 233.43,294.41 238.00,269.50 242.57,244.59 247.14,222.33 251.71,204.15 256.28,190.15 260.85,179.69 265.42,171.92 269.99,166.14 274.56,161.79 279.13,158.47 283.70,155.89 288.27,153.87 292.84,152.25 297.41,150.95 301.98,149.88 306.55,149.00 311.12,148.27 315.69,147.65 320.26,147.12 324.83,146.67 329.40,146.28 333.97,145.94 338.54,145.64 343.11,145.38 347.68,145.15 352.25,144.95 356.82,144.77 361.39,144.61 365.96,144.46 370.53,144.33 375.10,144.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F(x)</text><polyline points="100.90,142.48 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">y=1</text><polyline points="100.90,396.52 375.10,396.52" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">y=−1</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El denominador existe y es positivo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para todo x. Además ∣x∣&lt;√(x²+1), así</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que ∣F(x)∣&lt;1.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para cualquier −1&lt;y&lt;1, despeja</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x²=y²/(1−y²). Elige x=y/√(1−y²) para</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conservar el signo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esa x verifica F(x)=y y muestra que se</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanzan todos los valores del</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intervalo abierto.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>