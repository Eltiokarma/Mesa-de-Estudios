<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Distancia entre un vértice y un punto medio en dos tetraedros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="319.88,272.79 132.95,334.65 343.05,334.65" fill="#f4c581" fill-opacity="0.45"/><polygon points="132.95,334.65 343.05,334.65 156.12,396.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="319.88,272.79 132.95,334.65 343.05,334.65 319.88,272.79" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="319.88,272.79 265.29,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="132.95,334.65 265.29,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="343.05,334.65 265.29,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="132.95,334.65 343.05,334.65 156.12,396.52 132.95,334.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="132.95,334.65 210.71,183.73" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="343.05,334.65 210.71,183.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="156.12,396.52 210.71,183.73" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="265.29,142.48 183.41,290.12" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="319.8788385646983" y="272.7881063122695" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="132.94940114163893" y="334.6521176722638" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="343.05059885836107" y="334.6521176722638" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="156.1211614353017" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="265.2929461882328" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="210.70705381176722" y="183.7265452077381" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="183.4141076235345" y="290.1213371199981" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En un corte perpendicular a BC, el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">centro de cada base queda a a√3/6 de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC y los vértices A,D a a√3/2. La</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura de cada tetraedro es h=a√(2/3).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La separación horizontal VM es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a√3/6+(a√3/6+a√3/2)/2=a√3/2. La</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia de alturas es h/2.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">VM²=a²(3/4+1/6)=11a²/12.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>