<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">085 · Focal a partir de dos alturas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="294.83,190.02 291.80,194.00 288.94,197.97 286.22,201.95 283.67,205.92 281.26,209.89 279.02,213.87 276.93,217.84 274.99,221.81 273.21,225.79 271.58,229.76 270.11,233.74 268.79,237.71 267.63,241.68 266.62,245.66 265.77,249.63 265.07,253.60 264.53,257.58 264.14,261.55 263.91,265.53 263.83,269.50 263.91,273.47 264.14,277.45 264.53,281.42 265.07,285.40 265.77,289.37 266.62,293.34 267.63,297.32 268.79,301.29 270.11,305.26 271.58,309.24 273.21,313.21 274.99,317.19 276.93,321.16 279.02,325.13 281.26,329.11 283.67,333.08 286.22,337.05 288.94,341.03 291.80,345.00 294.83,348.98" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="144.62,269.50 144.62,218.64" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="323.44,269.50 323.44,244.07" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="144.62,218.64 263.83,269.50 323.44,244.07" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="144.62,218.64 263.83,218.64 323.44,244.07" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="144.61524076671344" y="204.3293595137915" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="323.4371201496026" y="228.96704067321176" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S′</text><text x="276.5460495558673" y="287.7795698924731" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El aumento +1/2 implica una imagen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">virtual, s′ = −s/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como objeto e imagen están a lados</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuestos del espejo, sus distancias</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">absolutas suman 9 cm. Se obtiene s = 6</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cm y s′ = −3 cm.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma 1/6 − 1/3 vale −1/6 cm⁻¹. Así</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f = −6 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>