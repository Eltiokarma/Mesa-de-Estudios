<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">104 · Cuadrilátero con dos lados iguales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.45,347.84 177.74,191.16 366.06,243.89 275.66,347.84 111.45,347.84 366.06,243.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="359.8934774902517" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="176.98440269408013" y="177.59996455157747" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="240.1221198156682" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="276.4172279333569" y="361.4000354484225" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="143.84012761432118" y="338.8016660758596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="149.1130804679192" y="311.6836228287841" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">57°</text><text x="334.41970932293515" y="232.58933002481393" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">22°</text><text x="339.69266217653313" y="261.96721020914566" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">11°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABC, ∠B = 101°. Por ley de senos,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB/AC = sen 22°/sen 101°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ACD, AD/AC = sen 11°/sen(11° + x).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Igualar ambas razones y usar sen 22° =</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2 sen 11° cos 11° da sen(11° + x) =</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La opción x = 139° excedería los 180°</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">al sumarla a 57° en el vértice convexo</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A. Queda 11° + x = 30°, de donde x =</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">19°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>