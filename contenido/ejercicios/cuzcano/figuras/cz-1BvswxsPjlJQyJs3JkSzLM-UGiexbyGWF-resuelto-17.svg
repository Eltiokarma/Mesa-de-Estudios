<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Mínimo con dígitos distintos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,269.50 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><circle cx="110.98387096774192" cy="269.5" r="3.7" fill="#20364b"/><text x="117.98387096774192" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><circle cx="195.66129032258064" cy="269.5" r="3.7" fill="#20364b"/><text x="202.66129032258064" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><circle cx="280.3387096774194" cy="269.5" r="3.7" fill="#20364b"/><text x="287.3387096774194" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">9</text><circle cx="365.01612903225805" cy="269.5" r="3.7" fill="#20364b"/><text x="372.01612903225805" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para hacerlo negativo conviene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">minimizar m+n y dar a p,q los mayores</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valores adecuados.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con m,n=1,2, comparar p9,q8:−48 y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">p8,q9:−45.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mínimo global es−48; se comprueban</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las3024 asignaciones de dígitos</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distintos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>