<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">218 · Ángulo inferior con diagonales perpendiculares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,339.10 165.08,162.91 375.10,339.10 165.08,376.09 100.90,339.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,339.10 375.10,339.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="165.08,162.91 165.08,376.09" fill="none" stroke="#008674" stroke-width="2.5"/><text x="147.5744680851064" y="218.92004118050787" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="114.90459849004804" y="361.26733013040496" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="331.92587508579277" y="320.429993136582" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40°</text><text x="335.42621825669187" y="357.76698695950586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Normaliza a 1 la altura de la parte</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superior. Los segmentos horizontales a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda y derecha de O miden tan 20°</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 1/tan 40°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La parte inferior de la diagonal</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical mide tan 10°/tan 40°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divídela por la distancia hacia la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda. Se obtiene tan x = tan</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">10°/(tan 40° tan 20°) = tan 30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>