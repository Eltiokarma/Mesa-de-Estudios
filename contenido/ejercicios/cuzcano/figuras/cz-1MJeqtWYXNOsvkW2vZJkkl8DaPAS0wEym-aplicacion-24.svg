<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">024 · Una polea móvil con apertura de 120°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,172.67 238.00,251.82 375.10,172.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="252.25,251.82 252.03,254.30 251.39,256.70 250.34,258.95 248.91,260.98 247.16,262.74 245.12,264.16 242.87,265.21 240.47,265.85 238.00,266.07 235.53,265.85 233.13,265.21 230.88,264.16 228.84,262.74 227.09,260.98 225.66,258.95 224.61,256.70 223.97,254.30 223.75,251.82 223.97,249.35 224.61,246.95 225.66,244.70 227.09,242.66 228.84,240.91 230.88,239.48 233.13,238.43 235.53,237.79 238.00,237.58 240.47,237.79 242.87,238.43 245.12,239.48 247.16,240.91 248.91,242.66 250.34,244.70 251.39,246.95 252.03,249.35 252.25,251.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,251.82 238.00,346.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="219.00,346.81 257.00,346.81 257.00,381.63 219.00,381.63 219.00,346.81" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="157.36678239529448" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(1) T</text><text x="375.09677419354836" y="157.36678239529448" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="237.99999999999997" y="364.2195885178572" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,5 kg</text><text x="237.99999999999997" y="220.6890699838341" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">120°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambos ramales tienen la misma tensión</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T. Como no hay otra fuerza horizontal,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son simétricos respecto de la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada ramal aporta hacia arriba T cos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60°. La carga vertical es 0,5×10=5 N.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Impón 2T cos 60°=5 y usa cos 60°=1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>