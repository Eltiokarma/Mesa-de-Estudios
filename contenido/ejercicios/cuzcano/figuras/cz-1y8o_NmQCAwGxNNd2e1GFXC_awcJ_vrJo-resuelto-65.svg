<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">065 · Ángulo exacto de una proyección</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.89,323.44 177.32,211.07 372.10,211.07 304.68,323.44 109.89,323.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="177.32,211.07 338.39,267.25" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="304.68,323.44 304.68,255.49" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="335.42631764498503" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="171.32451965450377" y="203.573682355015" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="208.06865855808215" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="310.66878194958576" y="333.92799224396265" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="342.13361537105584" y="273.99497620306715" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="301.67882954345146" y="245.52679358364182" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="207.28432927904106" y="226.0485633703508" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="346.62859157412305" y="229.04521417239556" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3θ</text><text x="355.61854398025736" y="248.5234443856866" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="319.65873435572007" y="256.01507139079854" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea θ=∠MBC. La componente horizontal</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de DM, medida en dirección AD, es 5</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos 3θ. La de PM es 3 cos θ. Coinciden</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">porque DP es vertical.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De cos 3θ=(3/5) cos θ y cos 3θ=4</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos³θ−3 cos θ, sale cos²θ=9/10. En la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posición del dibujo θ es agudo.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto tan θ=1/3 y θ=arctan(1/3),</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximadamente 18,435°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>