<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Rectángulo con círculo tangente a tres lados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,338.05 375.10,338.05 375.10,200.95 306.55,200.95 100.90,200.95 100.90,338.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,338.05 306.55,200.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,338.05 375.10,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,269.50 374.77,276.22 373.78,282.87 372.15,289.40 369.88,295.73 367.00,301.81 363.54,307.58 359.54,312.99 355.02,317.97 350.04,322.49 344.63,326.50 338.86,329.95 332.78,332.83 326.45,335.10 319.92,336.73 313.27,337.72 306.55,338.05 299.83,337.72 293.18,336.73 286.65,335.10 280.32,332.83 274.23,329.95 268.46,326.50 263.06,322.49 258.08,317.97 253.56,312.99 249.55,307.58 246.09,301.81 243.22,295.73 240.95,289.40 239.32,282.87 238.33,276.22 238.00,269.50 238.33,262.78 239.32,256.13 240.95,249.60 243.22,243.27 246.09,237.19 249.55,231.42 253.56,226.01 258.08,221.03 263.06,216.51 268.46,212.50 274.23,209.05 280.32,206.17 286.65,203.90 293.18,202.27 299.83,201.28 306.55,200.95 313.27,201.28 319.92,202.27 326.45,203.90 332.78,206.17 338.86,209.05 344.63,212.50 350.04,216.51 355.02,221.03 359.54,226.01 363.54,231.42 367.00,237.19 369.88,243.27 372.15,249.60 373.78,256.13 374.77,262.78 375.10,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645164" y="338.04838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354836" y="338.04838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="200.95161290322582" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="100.90322580645164" y="200.95161290322582" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="306.54838709677415" y="200.95161290322582" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="375.09677419354836" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="119.41129032258067" y="311.31451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="141.34677419354838" y="334.2782258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama w al ancho y r al radio. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulo tiene altura 2r.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El contacto superior está a distancia</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal w−r de la esquina. Respecto</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la vertical, tan x=(w−r)/(2r).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El contacto derecho está a altura r y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia horizontal w. Así cot θ=w/r.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye y resta.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>