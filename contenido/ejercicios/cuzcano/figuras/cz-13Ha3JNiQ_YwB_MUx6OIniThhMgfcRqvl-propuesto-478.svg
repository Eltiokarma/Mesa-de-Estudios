<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">478 · Celda estándar de cobre y yodo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,261.24 100.90,342.18 194.50,342.18 194.50,261.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="281.50,261.24 281.50,342.18 375.10,342.18 375.10,261.24" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,291.52 194.50,291.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="281.50,291.52 375.10,291.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="124.58,236.46 124.58,317.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="350.32,236.46 350.32,317.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="124.58,236.46 124.58,205.08 350.32,205.08 350.32,236.46" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="170.28,306.39 170.28,246.93 306.27,246.93 306.27,306.39" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="120.72444617178391" y="230.95873817852052" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cu (−)</text><text x="347.01671200932765" y="230.95873817852052" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Pt (+)</text><text x="209.91993781577924" y="196.82219199378156" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">e⁻ →</text><text x="211.02111672496437" y="241.9705272703718" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Puente salino</text><text x="111.91501489830289" y="332.2671978235523" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cu⁺(ac)</text><text x="294.16012436844153" y="332.2671978235523" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I₂ / I⁻</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El yodo tiene el mayor potencial de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reducción. Cu se oxida en el ánodo y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pt conduce del lado catódico.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La notación del ejercicio ordena las</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos semiceldas de ánodo a cátodo.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E°=0,54−0,52=0,02 V.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El platino es un conductor inerte y no</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se consume en la semirreacción, así</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que III es falsa.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>