<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Dos bisectrices y dos ángulos conocidos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,349.67 209.06,189.33 277.73,255.65 375.10,349.67 225.91,349.67 100.90,349.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="209.06,189.33 219.29,286.72 225.91,349.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,349.67 219.29,286.72 277.73,255.65" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645164" y="349.67173162249185" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="209.0562573852037" y="189.3282683775082" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.09677419354836" y="349.67173162249185" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="277.7336979267616" y="255.6493017909709" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="219.29284109541098" y="286.72285656257816" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="225.90903446941783" y="349.67173162249185" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="258.26595599127774" y="246.60091469419663" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">72°</text><text x="206.98967963070814" y="335.4136671063628" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">84°</text><text x="350.96774193548384" y="341.9943122676531" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe ∠RDO=2β y ∠DRO=2θ. En DMR se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cumple 2β+θ+84°=180°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En DRL se cumple β+2θ+72°=180°. Al</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resolver ambas ecuaciones se obtiene</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">β=28° y θ=40°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El tercer ángulo de DRO mide</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°−2β−2θ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>