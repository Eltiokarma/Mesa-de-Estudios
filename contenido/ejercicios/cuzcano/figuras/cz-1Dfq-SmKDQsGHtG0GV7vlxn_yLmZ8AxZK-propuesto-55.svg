<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">055 · Rapidez media por dos gráficas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (m)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (m)</text><polyline points="375.10,354.18 375.02,350.65 374.79,347.12 374.41,343.59 373.88,340.06 373.19,336.54 372.35,333.01 371.36,329.48 370.22,325.95 368.93,322.42 367.48,318.90 365.88,315.37 364.13,311.84 362.22,308.31 360.17,304.78 357.96,301.25 355.60,297.73 353.09,294.20 350.42,290.67 347.60,287.14 344.63,283.61 341.51,280.08 338.23,276.56 334.81,273.03 331.23,269.50 327.49,265.97 323.61,262.44 319.57,258.92 315.38,255.39 311.04,251.86 306.55,248.33 301.90,244.80 297.10,241.27 292.15,237.75 287.05,234.22 281.79,230.69 276.39,227.16 270.83,223.63 265.11,220.10 259.25,216.58 253.23,213.05 247.06,209.52 240.74,205.99 234.27,202.46 227.64,198.94 220.86,195.41 213.93,191.88 206.85,188.35 199.61,184.82 192.22,181.29 184.68,177.77 176.99,174.24 169.15,170.71 161.15,167.18 153.00,163.65 144.70,160.12 136.24,156.60 127.64,153.07 118.88,149.54 109.97,146.01 100.90,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">trayectoria</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se leen x=5−t²/5,y=3+3t;así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">v=(−2t/5,3).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Rapidez</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">media=(1/5)∫0⁵√(4t²/25+9)dt≈3,21 m/s.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El módulo de velocidad media es</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√[(-5)²+15²]/5=√10≈3,16,opción E;no es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la rapidez media de la curva.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>