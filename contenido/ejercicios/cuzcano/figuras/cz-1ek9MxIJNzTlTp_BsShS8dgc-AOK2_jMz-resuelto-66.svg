<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">066 · Parábola recortada por el dominio original</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,333.01 105.47,330.88 110.03,328.71 114.60,326.51 119.16,324.27 123.73,321.99 128.30,319.69 132.86,317.34 137.43,314.96 141.99,312.55 146.56,310.10 151.12,307.61 155.69,305.09 160.25,302.54 164.82,299.95 169.38,297.32 173.95,294.66 178.51,291.97 183.08,289.24 187.64,286.47 192.21,283.67 196.77,280.83 201.34,277.96 205.91,275.05 210.47,272.11 215.04,269.13 219.60,266.12 224.17,263.07 228.73,259.99 233.30,256.87 237.86,253.72 242.43,250.53 246.99,247.31 251.56,244.05 256.12,240.75 260.69,237.42 265.25,234.06 269.82,230.66 274.39,227.22 278.95,223.75 283.52,220.25 288.08,216.71 292.65,213.13 297.21,209.52 301.78,205.87 306.34,202.19 310.91,198.47 315.47,194.72 320.04,190.93 324.60,187.11 329.17,183.25 333.73,179.36 338.30,175.43 342.87,171.47 347.43,167.47 352.00,163.44 356.56,159.37 361.13,155.26 365.69,151.12 370.26,146.95 374.82,142.74" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">y</text><circle cx="375.09677419354836" cy="142.48387096774195" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="382.09677419354836" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">excluido</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Arccos restringe a [−1,1]. Se excluye</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−1 y el argumento no negativo del arco</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">seno exige (1−x)/(1+x)≤1, es decir</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x≥0.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El denominador se anula en x=1. En</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[0,1) las identidades reducen el</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cociente a</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2(1−x²)(1+x)/[4(1−x)]=(1+x)²/2.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dibuja la rama creciente desde (0,1/2)</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">incluido hasta (1,2) excluido.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>