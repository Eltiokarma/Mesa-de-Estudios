"285.5" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,3</text><rect x="333.0" y="322" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="48.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">5</text><rect x="143.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="238.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="333.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">132</text><text x="48" y="445" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Distribución parcial</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los 18 puntos entre 12 y 30 abarcan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tres clases, por lo que el ancho es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">seis. La marca final es 33 y su</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frecuencia es 132/33=4.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La mediana 24 es el límite después de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la tercera clase. La última mitad</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contiene f₄+f₅=0,3N+4=N/2, de donde</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N=20. Así f₄=6 y f₃=10−5=5.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuarta clase, [24,30), es modal.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus diferencias con las clases</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contiguas son 1 y 2. Interpola</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">24+6/(1+2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>