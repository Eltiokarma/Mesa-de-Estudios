<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">009 · Rango de un coseno con argumento absoluto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="247.72674211198614" x2="421" y2="247.72674211198614" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">u = ∣x∣+π/4</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f</text><polyline points="170.00,142.48 173.42,146.65 176.84,150.97 180.26,155.44 183.67,160.04 187.09,164.78 190.51,169.64 193.93,174.62 197.35,179.71 200.77,184.91 204.18,190.20 207.60,195.57 211.02,201.03 214.44,206.55 217.86,212.14 221.28,217.78 224.69,223.46 228.11,229.19 231.53,234.94 234.95,240.71 238.37,246.49 241.78,252.27 245.20,258.04 248.62,263.80 252.04,269.54 255.46,275.24 258.88,280.90 262.29,286.51 265.71,292.07 269.13,297.55 272.55,302.96 275.97,308.29 279.39,313.52 282.80,318.66 286.22,323.69 289.64,328.60 293.06,333.39 296.48,338.06 299.90,342.58 303.31,346.97 306.73,351.20 310.15,355.28 313.57,359.19 316.99,362.94 320.40,366.51 323.82,369.91 327.24,373.12 330.66,376.14 334.08,378.96 337.50,381.59 340.91,384.02 344.33,386.24 347.75,388.25 351.17,390.05 354.59,391.63 358.01,393.00 361.42,394.15 364.84,395.07 368.26,395.78 371.68,396.26 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">cos u</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El valor absoluto ∣x∣ recorre [0,3π/4)</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">porque x=0 pertenece al intervalo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por periodicidad, reemplaza el</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">argumento por u=∣x∣+π/4, que recorre</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[π/4,π).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El coseno decrece en ese tramo. Toma</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√2/2 en el extremo izquierdo y tiende</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a −1 en el derecho.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>