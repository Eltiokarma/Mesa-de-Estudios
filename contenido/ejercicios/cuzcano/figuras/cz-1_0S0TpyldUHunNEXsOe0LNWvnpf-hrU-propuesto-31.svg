<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Cuerda inferior que evita que suba un cubo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,178.10 100.90,360.90 375.10,360.90 375.10,178.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,212.38 375.10,212.38" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="209.44,247.79 266.56,247.79 266.56,290.64 209.44,290.64 209.44,247.79" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,290.64 238.00,360.90" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="337.3951612903226" y="258.0752688172043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="238.0" y="270.07123655913983" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cubo</text><text x="257.9932795698925" y="320.91129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cuerda</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El volumen del cubo es (0,1 m)³ =</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,001 m³.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El empuje vale 10 N. El peso de 0,2 kg</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 2 N.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuerda tira hacia abajo. Para el</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilibrio debe compensar la</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia entre empuje y peso.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>