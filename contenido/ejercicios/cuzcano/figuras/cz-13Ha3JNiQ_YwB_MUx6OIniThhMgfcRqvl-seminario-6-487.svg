<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">487 · Identificación de dos clasificaciones incorrectas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="181.68,142.48 221.82,165.25 261.97,142.48 302.11,165.25 342.25,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="261.97,142.48 261.97,185.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="235.60,276.69 287.49,306.65 287.49,366.56 235.60,396.52 183.72,366.56 183.72,306.65 235.60,276.69" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="273.43,363.29 239.81,382.71" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="197.78,309.91 231.40,290.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="287.49,306.65 309.28,294.06" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="133.75091296409008" y="155.66479001825928" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="265.5601034692635" y="234.75030432136336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">HC≡C–CH₂–CH₃</text><text x="133.75091296409008" y="236.5477023737066" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">II</text><text x="135.7864420663234" y="338.4002586731589" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">III</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I es falsa: 3-metilpentano es un</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcano ramificado de cadena abierta.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">II es verdadera: la cadena lineal de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuatro carbonos contiene un triple</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enlace terminal.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">III es falsa: el anillo tiene carbonos</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sp³ que interrumpen la conjugación,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que no es aromático.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>