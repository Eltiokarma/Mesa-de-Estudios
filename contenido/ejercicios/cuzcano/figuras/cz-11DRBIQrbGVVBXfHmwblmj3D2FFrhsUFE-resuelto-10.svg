<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Pentágono construido a partir de un triángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="114.52,195.50 197.14,156.46 368.74,218.20 315.17,378.00 127.23,327.15 114.52,195.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="114.52,195.50 315.17,378.00" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="127.23,327.15 197.14,156.46" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="127.23,327.15 368.74,218.20" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="111.80,177.35 114.52,195.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="315.17,378.00 346.95,386.17" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="194.59613330484942" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="194.41956846827603" y="149.1998504593036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="375.0967741935484" y="213.66257209997866" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="311.54197820978425" y="389.8001495406964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="118.15381328775902" y="345.3117923520615" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="122.69344157231362" y="181.88517410809658" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="132.6806237983337" y="203.67538987395858" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="137.2202520828883" y="291.7441785943174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="145.39158299508654" y="313.5343943601795" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="160.8263191625721" y="326.2453535569323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="181.7086092715232" y="177.345545823542" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="204.4067506942961" y="175.52969450972017" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m</text><text x="351.4907071138646" y="216.3863490707114" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n</text><text x="352.39863277077546" y="241.80826746421707" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="309.7261268959624" y="359.8386028626362" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">c</text><text x="335.1480452894681" y="371.64163640247807" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">c</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En APM el tercer ángulo es a, luego</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=40°. Los ángulos de ABC dan</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3a+(180°−2b)+(180°−2c)=180°, así que</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b+c=150°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ángulos del pentágono son 3a,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°−b, x+m, n+y y 180°−c.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala su suma a 540° y sustituye</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=40°, b+c=150° y m+n=140°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>