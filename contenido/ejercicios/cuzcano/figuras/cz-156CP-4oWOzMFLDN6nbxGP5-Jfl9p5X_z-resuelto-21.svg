" text-anchor="start">3</text><text x="334.41935483870964" y="162.93548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="131.19354838709677" y="213.741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="182.0" y="213.741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="232.8064516129032" y="213.741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="283.61290322580646" y="213.741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><text x="334.41935483870964" y="213.741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="131.19354838709677" y="264.54838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><text x="182.0" y="264.54838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="232.8064516129032" y="264.54838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><text x="283.61290322580646" y="264.54838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="334.41935483870964" y="264.54838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="131.19354838709677" y="315.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="182.0" y="315.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><text x="232.8064516129032" y="315.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="283.61290322580646" y="315.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="334.41935483870964" y="315.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="131.19354838709677" y="366.16129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="182.0" y="366.16129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="232.8064516129032" y="366.16129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="283.61290322580646" y="366.16129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="334.41935483870964" y="366.16129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Fila y columna 2 conservan cada</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">elemento: e=2. Los inversos son 1↔3,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2↔2 y 4↔4.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos primeros factores se vuelven</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(3*2)⁻¹=1 y (2*3)⁻¹=1. El tercero es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1*1)*4=4*4=2. Su inverso es 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>