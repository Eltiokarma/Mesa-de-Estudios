<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">053 · Tangente en el extremo de una cuerda horizontal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="320.3839810979336" x2="421" y2="320.3839810979336" stroke="#20364b" stroke-width="1.7"/><line x1="140.073732718894" y1="105" x2="140.073732718894" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="296.76,320.38 296.60,315.46 296.14,310.57 295.37,305.70 294.29,300.90 292.92,296.18 291.25,291.54 289.30,287.03 287.07,282.64 284.56,278.41 281.79,274.34 278.78,270.45 275.52,266.76 272.04,263.28 268.35,260.02 264.46,257.00 260.39,254.24 256.16,251.73 251.77,249.50 247.25,247.54 242.62,245.88 237.90,244.50 233.09,243.43 228.23,242.66 223.33,242.20 218.41,242.04 213.50,242.20 208.60,242.66 203.74,243.43 198.93,244.50 194.21,245.88 189.58,247.54 185.06,249.50 180.67,251.73 176.44,254.24 172.37,257.00 168.48,260.02 164.79,263.28 161.31,266.76 158.05,270.45 155.04,274.34 152.27,278.41 149.76,282.64 147.53,287.03 145.58,291.54 143.91,296.18 142.53,300.90 141.46,305.70 140.69,310.57 140.23,315.46 140.07,320.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Semicírculo</text><polyline points="100.90,252.54 257.59,252.54" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Cuerda AR</text><polyline points="198.83,218.62 375.10,320.38" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Tangente</text><polyline points="100.90,320.38 100.90,252.54" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">MT</text><circle cx="100.90322580645162" cy="252.53867296735547" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="244.53867296735547" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="100.90322580645162" cy="320.3839810979336" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="312.3839810979336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="179.2442396313364" cy="252.53867296735547" r="3.7" fill="#20364b"/><text x="186.2442396313364" y="244.53867296735547" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="257.58525345622115" cy="252.53867296735547" r="3.7" fill="#20364b"/><text x="264.58525345622115" y="244.53867296735547" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="218.4147465437788" cy="320.3839810979336" r="3.7" fill="#20364b"/><text x="225.4147465437788" y="312.3839810979336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="140.073732718894" cy="320.3839810979336" r="3.7" fill="#20364b"/><text x="147.073732718894" y="312.3839810979336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como M y T comparten abscisa, MA−TO es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la abscisa de A. Así x_A=2 y x_R=6.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro C está bajo el punto medio</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de AR, luego C=(4,0) y el radio es 4.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En R la ordenada es √(16−4)=2√3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El radio CR tiene dirección (2,2√3),</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal a la tangente. Escribe su</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ecuación por R.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>