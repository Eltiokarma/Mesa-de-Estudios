30.53,193.66 238.00,193.29 245.47,193.66 252.87,194.75 260.12,196.57 267.16,199.09 273.92,202.29 280.34,206.13 286.35,210.59 291.89,215.61 296.91,221.15 301.37,227.16 305.21,233.58 308.41,240.34 310.93,247.38 312.75,254.63 313.84,262.03 314.21,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="136.39,193.29 339.61,193.29" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,269.50 238.00,193.29" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248.16129032258064" y="278.39112903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="288.80645161290323" y="186.93951612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El círculo de sección tiene radio 4 m,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y el plano dista 3 m del centro común.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras, el radio mayor es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(3²+4²)=5 m. El casquete menor tiene</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura 5−3=2 m.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica 2πRh con R=5 y h=2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>