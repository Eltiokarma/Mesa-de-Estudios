<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">082 · Presión en tubería ascendente con cambio de diámetro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,358.19 117.83,276.95 171.99,209.25 253.23,165.24 375.10,165.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="199.07,392.04 211.26,324.34 260.00,263.41 317.55,222.79 375.10,203.83" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="117.83,327.72 211.26,358.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="307.39,165.24 331.09,219.40" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="144.90959776981282" y="364.9599761051374" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1: Ø 50 cm</text><text x="349.36997212266033" y="146.95917960971718" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2: Ø 25 cm</text><text x="273.5436081242533" y="306.05913978494624" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Δz = 10 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide el caudal por las áreas. Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">velocidades son aproximadamente 0,509</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m/s y 2,037 m/s.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El aumento de cota reduce la presión</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en 800×10×10 = 80 000 Pa. El aumento</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de velocidad aporta otra caída de</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ρ(v₂² − v₁²)/2.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta ambas caídas de 170 kPa y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">redondea.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>