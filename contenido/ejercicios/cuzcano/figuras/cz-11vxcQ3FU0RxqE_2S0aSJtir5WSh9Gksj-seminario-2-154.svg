<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">154 · Ángulo de un triángulo a partir de tres inclinaciones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,307.72 165.05,231.28 375.10,307.72 100.90,307.72 165.05,270.69 375.10,307.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="165.05,307.72 165.05,231.28" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="111.40544801050211" y="304.5742960980246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="328.8869964957261" y="304.5742960980246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10°</text><text x="318.3847742916756" y="291.34149612092097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10°</text><text x="180.80566341861402" y="247.02837054683602" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">70°</text><text x="152.2225092513209" y="244.92792610602592" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Normaliza el tramo de H al extremo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecho a 1. Las alturas de la visual</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y del vértice son tan 10° y tan 20°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El tramo izquierdo de la base es √3</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan 10°, de modo que tan x=√3 tan</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">10°/tan 20°=√3 tan 10° tan 70°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La identidad tan u</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan(60°−u)tan(60°+u)=tan 3u da tan 10°</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan 50° tan 70°=1/√3. Por tanto tan</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=cot 50°=tan 40°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>