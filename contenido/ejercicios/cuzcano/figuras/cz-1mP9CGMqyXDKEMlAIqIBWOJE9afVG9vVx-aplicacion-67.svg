<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">067 · Varilla deslizante en rieles con resistencia</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,328.66 171.02,228.50 357.57,228.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,328.66 294.97,328.66" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="268.67,333.04 338.79,224.11" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="331.28,296.11 375.10,296.11" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="365.08,300.49 375.10,296.11 365.08,291.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="193.55,205.96 193.55,259.17" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="189.17,249.15 193.55,259.17 197.94,249.15" fill="none" stroke="#008674" stroke-width="2.5"/><text x="112.79746648991015" y="274.82110767417885" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 Ω</text><text x="311.2434821034026" y="269.1869936662248" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,8 m</text><text x="359.4464575047872" y="313.0078803947562" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 m/s</text><text x="213.5855059655325" y="217.22794225953746" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B = 2 T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En un intervalo Δt, el área encerrada</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aumenta en LvΔt.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El módulo de la fem inducida es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BLv=2×0,8×4=6,4 V.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide la fem entre la resistencia</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">total de 4 Ω.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>