<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">088 · Longitud normal hasta un plano paralelo a una cara</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="227.58,142.48 278.10,200.09 197.90,200.09" fill="#f4c581" fill-opacity="0.45"/><polygon points="206.75,223.70 278.10,396.52 197.90,396.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="206.75,223.70 278.10,200.09 197.90,200.09 206.75,223.70" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="206.75,223.70 227.58,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="278.10,200.09 227.58,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="197.90,200.09 227.58,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="206.75,223.70 278.10,396.52 197.90,396.52 206.75,223.70" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="227.58,142.48 227.58,207.96 227.58,338.91" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="206.7486187172892" y="223.70105154407375" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="278.09554088026823" y="200.08889679713667" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="197.90445911973177" y="200.08889679713667" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="227.58287290576305" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="227.58287290576305" y="207.95961504611572" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="227.58287290576305" y="338.9111032028633" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">K</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa ADC como base y llama L al punto</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio de DC. La sección perpendicular</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a DC contiene A,L,O,B. La altura BO</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del tetraedro mide 2 cm.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O está a 2/3 de AL desde A. La recta</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">LB en esa sección sube 2 cm entre L y</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O, a una distancia horizontal AL/3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta paralela a LB que pasa por A</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">baja 4 cm al avanzar los 2AL/3 hasta</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la vertical de O.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>