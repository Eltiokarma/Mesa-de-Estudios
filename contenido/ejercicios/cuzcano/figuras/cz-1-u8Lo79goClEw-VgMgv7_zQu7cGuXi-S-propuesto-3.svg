<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Propagación por producto vectorial</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="210.2714063230546" x2="421" y2="210.2714063230546" stroke="#20364b" stroke-width="1.7"/><line x1="331.1223613546017" y1="105" x2="331.1223613546017" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="331.12,210.27 263.33,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">E: S20°O</text><line x1="263.334825999289" y1="396.51612903225805" x2="262.62607921375206" y2="386.5412767529513" stroke="#1766b0" stroke-width="2"/><line x1="263.334825999289" y1="396.51612903225805" x2="270.28946898952" y2="389.3305225249108" stroke="#1766b0" stroke-width="2"/><polyline points="331.12,210.27 144.88,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">E×B: N70°O</text><line x1="144.87763864539826" y1="142.48387096774195" x2="154.85249092470502" y2="141.77512418220496" stroke="#d37618" stroke-width="2"/><line x1="144.87763864539826" y1="142.48387096774195" x2="152.06324515274554" y2="149.4385139579729" stroke="#d37618" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usar eje+x este, +y norte, +z arriba:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E proporcional a(−sin20°,−cos20°,0).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Flujo de energía sigue E×B; con B</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelo+z da(−cos20°,sin20°,0).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rumbo es20° al norte del oeste,</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivalente a N70°O.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>