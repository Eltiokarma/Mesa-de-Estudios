<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">099 · Circunradio de un octógono a partir del lado común</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="274.56,260.58 241.04,318.63 274.56,376.68 341.58,376.68 375.10,318.63 341.58,260.58 274.56,260.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,318.63 274.56,376.68" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="274.56,260.58 241.04,318.63 176.30,335.98 118.25,302.46 100.90,237.72 134.42,179.67 199.16,162.32 257.21,195.84 274.56,260.58" fill="none" stroke="#008674" stroke-width="2.5"/><text x="274.5557281522996" y="260.5811720014734" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="241.04204613854995" y="318.628571997995" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="274.5557281522995" y="376.67597199451654" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="341.58309217979877" y="376.67597199451654" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.09677419354836" y="318.628571997995" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="341.58309217979877" y="260.5811720014734" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="176.29858415630957" y="335.9765303513314" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="118.25118415978795" y="302.46284833758176" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="100.90322580645162" y="237.71938635534138" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="134.41690782020123" y="179.67198635881982" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">J</text><text x="199.1603698024416" y="162.32402800548346" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">K</text><text x="257.20776979896317" y="195.83771001923304" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EC abarca 120° del hexágono. Por tanto</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EC=√3 R₆ y R₆=2√3 cm.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lado AB del hexágono mide R₆. Como</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lado del octógono, vale R₈√(2−√2).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja R₈ y racionaliza su cuadrado:</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R₈²=12/(2−√2)=12+6√2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>