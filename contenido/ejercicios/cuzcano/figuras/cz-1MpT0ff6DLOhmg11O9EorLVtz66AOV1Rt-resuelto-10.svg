<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Abscisa de una intersección perpendicular</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="308.6705069124424" x2="421" y2="308.6705069124424" stroke="#20364b" stroke-width="1.7"/><line x1="140.073732718894" y1="105" x2="140.073732718894" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,191.16 375.10,328.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">L₁</text><polyline points="120.49,347.84 198.83,191.16" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">L₂</text><circle cx="140.073732718894" cy="308.6705069124424" r="3.7" fill="#20364b"/><text x="147.073732718894" y="300.6705069124424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="179.2442396313364" cy="230.3294930875576" r="3.7" fill="#20364b"/><text x="186.2442396313364" y="222.3294930875576" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(a,4)</text><circle cx="335.926267281106" cy="308.6705069124424" r="3.7" fill="#20364b"/><text x="342.926267281106" y="300.6705069124424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(a+8,0)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">L₁ tiene vector director (8,−4).</text><text x="4