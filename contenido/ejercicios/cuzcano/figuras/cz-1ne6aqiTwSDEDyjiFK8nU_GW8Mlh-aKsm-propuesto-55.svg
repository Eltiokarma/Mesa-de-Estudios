<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">055 · Rango de una secante desplazada en un intervalo asimétrico</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="257.64958707958317" y1="105" x2="257.64958707958317" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="100.90,393.89 105.47,368.96 110.04,346.77 114.61,326.93 119.18,309.11 123.75,293.04 128.32,278.50 132.89,265.31 137.46,253.31 142.03,242.37 146.60,232.37 151.17,223.22 155.74,214.85 160.31,207.17 164.88,200.12 169.45,193.66 174.02,187.73 178.59,182.29 183.16,177.32 187.73,172.76 192.30,168.61 196.87,164.82 201.44,161.39 206.01,158.28 210.58,155.49 215.15,153.01 219.72,150.80 224.29,148.88 228.86,147.22 233.43,145.82 238.00,144.67 242.57,143.76 247.14,143.10 251.71,142.67 256.28,142.48 260.85,142.53 265.42,142.81 269.99,143.33 274.56,144.09 279.13,145.10 283.70,146.35 288.27,147.85 292.84,149.62 297.41,151.65 301.98,153.97 306.55,156.57 311.12,159.49 315.69,162.72 320.26,166.29 324.83,170.22 329.40,174.54 333.97,179.26 338.54,184.41 343.11,190.04 347.68,196.18 352.25,202.87 356.82,210.16 361.39,218.11 365.96,226.79 370.53,236.27 375.10,246.63" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea t=∣x∣. Por la asimetría del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intervalo, t∈[0,π/3).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La secante con desplazamiento π es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−sec t. Entonces f=1−sec t/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como sec t recorre [1,2), la imagen</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene máximo 1/2 y se acerca a 0 sin</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanzarlo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>