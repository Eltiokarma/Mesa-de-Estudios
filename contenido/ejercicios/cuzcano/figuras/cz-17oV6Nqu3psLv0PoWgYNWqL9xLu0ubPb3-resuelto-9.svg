<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">009 · Recta paralela por un punto dado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="136.39,294.90 339.61,294.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="221.06,396.52 221.06,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="187.19,379.58 322.68,244.10" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="153.32,294.90 288.81,159.42" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="178.7258064516129" y="250.02419354838707" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="327.758064516129" y="244.0967741935484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta dada tiene pendiente 1 tras</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">despejar y.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las rectas paralelas comparten</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente. Para la buscada, escribe</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y−2=x+2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja y y comprueba que al usar x=−2</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se obtiene 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>