<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Problema 45: Área de caras oblicuas</title><desc id="desc">Reconstrucción vectorial. Sólido en perspectiva y sección auxiliar con datos y letras.</desc><rect width="900" height="540" rx="18" fill="#f5f8fc"/><text x="28.00" y="36.00" font-family="Arial,sans-serif" font-size="22" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">45  /  Área de caras oblicuas</text><line x1="460.00" y1="70.00" x2="460.00" y2="490.00" stroke="#d8e2ee" stroke-width="1"/><text x="28.00" y="517.00" font-family="Arial,sans-serif" font-size="14" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Esquema en perspectiva · Las cotas, no la apariencia, definen la geometría.</text><polygon points="555.00,310.00 810.00,310.00 810.00,120.00" fill="#e7f3ee" fill-opacity="0.6" stroke="#008778" stroke-width="2"/><line x1="798.00" y1="310.00" x2="798.00" y2="298.00" stroke="#758596" stroke-width="2"/><line x1="798.00" y1="298.00" x2="810.00" y2="298.00" stroke="#758596" stroke-width="2"/><text x="492.00" y="375.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Arista 6; altura 3; inclinación 30°</text><text x="492.00" y="402.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Dos caras: 4×3; otras dos: 5×6</text><text x="492.00" y="429.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Bases: 4×5 → total 124 m²</text><text x="535.00" y="330.00" font-family="Arial,sans-serif" font-size="18" fill="#233b53" text-anchor="start" pai