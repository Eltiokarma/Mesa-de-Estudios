<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">032 · Esfera que pasa de flotar en aceite a sumergirse en agua</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,178.10 100.90,360.90 375.10,360.90 375.10,178.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,226.66 375.10,226.66" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,274.07 375.10,274.07" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="275.13,226.66 274.93,230.54 274.32,234.38 273.31,238.13 271.92,241.76 270.16,245.22 268.04,248.48 265.59,251.50 262.85,254.25 259.82,256.70 256.57,258.81 253.10,260.58 249.47,261.97 245.72,262.98 241.88,263.58 238.00,263.79 234.12,263.58 230.28,262.98 226.53,261.97 222.90,260.58 219.43,258.81 216.18,256.70 213.15,254.25 210.41,251.50 207.96,248.48 205.84,245.22 204.08,241.76 202.69,238.13 201.68,234.38 201.07,230.54 200.87,226.66 201.07,222.78 201.68,218.94 202.69,215.18 204.08,211.55 205.84,208.09 207.96,204.83 210.41,201.81 213.15,199.06 216.18,196.62 219.43,194.50 222.90,192.74 226.53,191.34 230.28,190.34 234.12,189.73 238.00,189.53 241.88,189.73 245.72,190.34 249.47,191.34 253.10,192.74 256.57,194.50 259.82,196.62 262.85,199.06 265.59,201.81 268.04,204.83 270.16,208.09 271.92,211.55 273.31,215.18 274.32,218.94 274.93,222.78 275.13,226.66" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="337.3951612903226" y="251.22043010752688" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Aceite</text><text x="337.3951612903226" y="318.0551075268817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="238.0" y="203.80779569892474" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 L</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el equilibrio inicial, el peso es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igual al empuje de 1 L de aceite: 8 N.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sumergida por completo en agua, el</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">empuje sobre 2 L vale 20 N.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza hacia abajo necesaria</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">compensa el exceso de empuje sobre el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">peso.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>