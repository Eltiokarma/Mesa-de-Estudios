<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">049 · Choque en el pie de una rampa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="309.0764112903226" x2="421" y2="309.0764112903226" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="100.90,309.08 238.00,309.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">piso</text><polyline points="238.00,309.08 375.10,229.92" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">rampa</text><circle cx="169.4516129032258" cy="309.0764112903226" r="3.7" fill="#20364b"/><text x="176.4516129032258" y="301.0764112903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m;2m/s</text><circle cx="238.0" cy="309.0764112903226" r="3.7" fill="#20364b"/><text x="245.0" y="301.0764112903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2m;reposo</text><circle cx="375.0967741935484" cy="229.9235887096774" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="221.9235887096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">30°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el modelo escolar de choque</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">colineal antes de subir: vA=0 y vB=1</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m/s.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B sube h=vB²/(2g)=0,05 m, distancia</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre rampa h/sin30°=0,10 m.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así se obtiene 10 cm. Si B está ya</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">restringido a la rampa durante el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">impacto, hay impulso externo y cambia</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el modelo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>