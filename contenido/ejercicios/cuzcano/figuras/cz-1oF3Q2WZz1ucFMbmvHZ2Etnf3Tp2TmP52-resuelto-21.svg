<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Eliminación de longitudes con parámetros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,280.75 375.10,280.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,277.35 107.18,284.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="172.59,277.35 172.59,284.15" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="221.65,277.35 221.65,284.15" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.82,277.35 368.82,284.15" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="221.65,254.59 368.82,254.59" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="221.65,251.45 221.65,257.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="368.82,251.45 368.82,257.73" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="107.18246737256834" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="172.59123368628417" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="221.64780842157106" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="368.81753262743166" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="295.2326705245014" y="246.21447919231716" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea x=CP, n=NC y u=UC. Entonces UN=u−n</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y UP=u+x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De b x(u−n)=a n(u+x), divide por unx y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agrupa para obtener b/n−(a+b)/u=a/x.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segundo dato iguala ese lado</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierdo a 1. Por tanto x=a.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>