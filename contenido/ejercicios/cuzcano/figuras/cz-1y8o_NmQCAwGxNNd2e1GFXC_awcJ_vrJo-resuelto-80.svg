<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">080 · Altura de un punto medio entre lados contiguos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="257.28,373.39 128.75,287.71 214.44,159.18 342.96,244.87 257.28,373.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,373.39 375.10,373.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="128.75,287.71 128.75,373.39" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="342.96,244.87 342.96,373.39" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="171.59,223.44 278.70,202.02" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="225.15,212.73 225.15,373.39" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="259.42137096774195" y="392.6728830645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="111.6139112903226" y="285.56602822580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="208.0100806451613" y="146.3271169354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="351.5332661290322" y="244.8654233870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="109.47177419354841" y="334.83518145161287" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="351.5332661290322" y="311.27167338709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="231.5735887096774" y="304.84526209677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como UNCP es un paralelogramo, C=N+P−U</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en coordenadas. Su altura es a+b.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los puntos medios de NC y CP tienen</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alturas (2a+b)/2 y (a+2b)/2,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respectivamente.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura de su punto medio es el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">promedio: 3(a+b)/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>