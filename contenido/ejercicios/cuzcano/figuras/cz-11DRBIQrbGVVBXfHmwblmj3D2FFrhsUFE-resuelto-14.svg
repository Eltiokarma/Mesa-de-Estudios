<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Base doble y ángulo triple</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="106.70,322.10 173.80,210.27 364.33,322.10 106.70,322.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="173.80,210.27 236.76,322.10" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645163" y="333.69939577039275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="173.80060422960725" y="204.4722249293441" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="328.72911996881396" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="240.0709482506578" y="334.5277750706559" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="124.09784621381934" y="262.45877594776334" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="189.53981093460678" y="236.77901763960625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2x</text><text x="204.45063833934316" y="229.32360393723806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="216.87632784329014" y="279.85474125328915" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="168.83032842802845" y="334.5277750706559" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="303.0277750706558" y="334.5277750706559" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="347.760257284865" y="315.4750511646038" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea x=∠C. Traza BM hacia AC de modo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que ∠MBC=x. Entonces ∠ABM=2x y BM=MC.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El exterior ∠AMB también mide 2x,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">luego AM=AB. Por AC=2AB resulta MC=AM.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M equidista de A, B y C, con AC como</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diámetro. Así ∠B=90° y 3x=90°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>