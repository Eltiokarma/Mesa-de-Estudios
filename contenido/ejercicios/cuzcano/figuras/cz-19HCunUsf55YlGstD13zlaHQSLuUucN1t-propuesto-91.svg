<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">091 · Intersección de dos segmentos a puntos medios de un rombo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,348.65 283.70,348.65 375.10,190.35 192.30,190.35 100.90,348.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,190.35 301.98,253.67 192.30,348.65" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="192.30,190.35 301.98,253.67 329.40,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,348.65 301.98,253.67" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="348.65285948567447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="283.69892473118284" y="348.65285948567447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="190.34714051432553" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="192.30107526881721" y="190.34714051432553" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="192.30107526881721" y="348.65285948567447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="329.39784946236557" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="301.97849462365593" y="253.6694281028651" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma A como origen y los vectores</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">u=AB⃗, v=AD⃗. E=u/2, C=u+v, D=v y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F=u+v/2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala los puntos E+t(C−E) y D+s(F−D).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la base u,v salen s=1/2+t/2 y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t=1−s/2. Así t=3/5 y R=4u/5+3v/5.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa ∣u∣=∣v∣=L y u·v=L²/2. Entonces</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AR²=L²(16+9+12)/25=37L²/25.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>