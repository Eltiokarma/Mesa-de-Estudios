6.60 276.81,166.40 278.74,166.24 280.68,166.12 282.62,166.03 284.57,165.97 286.51,165.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="286.51,165.96 189.01,231.16 286.51,376.96" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="286.51,146.40 286.51,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="189.01,231.16 286.51,231.16" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="294.98663976943544" y="165.95666801116334" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="294.98663976943544" y="231.1588820206672" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="294.98663976943544" y="376.95546482940694" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="294.98663976943544" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La rotación del semicírculo da una</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esfera de radio k/2. El triángulo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interior da dos conos de base común.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el teorema de la altura, el radio</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">común al cuadrado es MA·MO. Los conos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen alturas que suman k, así que su</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">volumen total es πk·MA·MO/3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta de πk³/6. Como</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k²−2MA·MO=MA²+MO²=6, queda πk.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>