"#20364b" text-anchor="start">suelta, v=15</text><circle cx="375.0967741935484" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">suelo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cuerpo conserva inicialmente v0=+15</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m/s; soltar no significa velocidad</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cero.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=50+15t−5t². Para y=0: t²−3t−10=0.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las raíces son 5 y −2 s; la física es</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t=5 s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>