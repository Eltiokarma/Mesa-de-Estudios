4" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−1,2)</text><circle cx="238.0" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="245.0" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,3)</text><circle cx="272.2741935483871" cy="227.16129032258064" r="3.7" fill="#20364b"/><text x="279.2741935483871" y="219.16129032258064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los tramos se deciden con ∣x∣ y sus</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fórmulas dependen de él, así f es par.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como f(0)=3, no puede ser impar.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En 0&lt;x≤1, 3−x² decrece hasta 2. Para</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x&gt;1, 2/x decrece y es menor que 2. Así</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">decrece en todo (0,∞).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>