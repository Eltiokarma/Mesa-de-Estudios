<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">032 · Producto negativo de dos valores absolutos desplazados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polygon points="110.98,345.71 187.19,345.71 187.19,193.29 110.98,193.29" fill="#f4c581" fill-opacity="0.45"/><polygon points="288.81,345.71 365.02,345.71 365.02,193.29 288.81,193.29" fill="#f4c581" fill-opacity="0.45"/><polygon points="187.19,193.29 288.81,193.29 288.81,142.48 187.19,142.48" fill="#f4c581" fill-opacity="0.45"/><polygon points="187.19,396.52 288.81,396.52 288.81,345.71 187.19,345.71" fill="#f4c581" fill-opacity="0.45"/><polyline points="187.19,396.52 187.19,142.48" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">x=−2</text><polyline points="288.81,396.52 288.81,142.48" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">x=2</text><polyline points="110.98,345.71 365.02,345.71" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">y=−3</text><polyline points="110.98,193.29 365.02,193.29" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">y=3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El producto es negativo si los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">factores tienen signos opuestos.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las posibilidades son ∣x∣&lt;2 con ∣y∣&gt;3,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">o ∣x∣&gt;2 con ∣y∣&lt;3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dibuja los cuatro brazos. Las rectas</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=±2 e y=±3 son fronteras excluidas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>