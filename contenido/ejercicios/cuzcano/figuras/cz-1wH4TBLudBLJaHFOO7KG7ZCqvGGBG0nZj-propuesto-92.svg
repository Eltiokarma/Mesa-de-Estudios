<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Problema 92: Camino entre puntos opuestos</title><desc id="desc">Reconstrucción vectorial. Sólido en perspectiva y sección auxiliar con datos y letras.</desc><rect width="900" height="540" rx="18" fill="#f5f8fc"/><text x="28.00" y="36.00" font-family="Arial,sans-serif" font-size="18" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">92  /  Camino entre puntos opuestos</text><line x1="460.00" y1="70.00" x2="460.00" y2="490.00" stroke="#d8e2ee" stroke-width="1"/><text x="28.00" y="517.00" font-family="Arial,sans-serif" font-size="14" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Esquema en perspectiva · Las cotas, no la apariencia, definen la geometría.</text><polygon points="85.00,400.00 405.00,400.00 405.00,160.00 85.00,160.00" fill="#dce9f5" fill-opacity="0.5" stroke="#2463c4" stroke-width="2"/><line x1="85.00" y1="400.00" x2="405.00" y2="160.00" stroke="#c36117" stroke-width="3"/><text x="220.00" y="430.00" font-family="Arial,sans-serif" font-size="20" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">4</text><text x="415.00" y="290.00" font-family="Arial,sans-serif" font-size="20" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">3</text><text x="250.00" y="270.00" font-family="Arial,sans-serif" font-size="20" fill="#c36117" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">5</text><text x="80.00" y="110.00" font-family="Arial,sans-serif" font-size="17" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Media superficie lateral desplegada</text><text x="490.00" y="140.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Circunferencia = 24/3 = 8</text><text x="490.00" y="167.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Separación horizontal mínima = 4</text><text x="490.00" y="194.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Desnivel = 3</text><text x="490.00" y="221.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Camino recto: √(4² + 3²) = 5</text></svg>