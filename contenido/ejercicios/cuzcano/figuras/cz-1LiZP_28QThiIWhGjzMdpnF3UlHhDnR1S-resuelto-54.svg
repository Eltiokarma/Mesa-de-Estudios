<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Dos paralelogramos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,301.99 130.89,212.04 140.88,272.01" fill="#f4c581" fill-opacity="0.45"/><polygon points="130.89,212.04 220.84,212.04 180.86,242.02" fill="#f4c581" fill-opacity="0.45"/><polygon points="301.65,228.55 375.10,228.55 326.13,265.27" fill="#f4c581" fill-opacity="0.45"/><polygon points="277.17,301.99 313.89,301.99 334.29,277.51 326.13,265.27" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,301.99 190.85,301.99 220.84,212.04 130.89,212.04 100.90,301.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,301.99 220.84,212.04" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="130.89,212.04 145.88,301.99" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="130.89,212.04 205.85,257.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="277.17,301.99 350.62,301.99 375.10,228.55 301.65,228.55 277.17,301.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="277.17,301.99 375.10,228.55" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="301.65,228.55 350.62,301.99" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="313.89,301.99 375.10,228.55" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,301.99 130.89,212.04 140.88,272.01 100.90,301.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="130.89,212.04 220.84,212.04 180.86,242.02 130.89,212.04" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="301.65,228.55 375.10,228.55 326.13,265.27 301.65,228.55" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="277.17,301.99 313.89,301.99 334.29,277.51 326.13,265.27 277.17,301.99" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="140.95334101382488" y="318.9611091884872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I</text><text x="315.0172811059907" y="318.9611091884872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">II</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Un cambio afín a cuadrados unitarios</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva fracciones de área. En I, las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">líneas cortan la diagonal en 1/3 y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2/3: la sombra suma 1/6+1/6.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En II, la zona superior tiene 1/4 y la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferior 1/6 por las intersecciones de</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las diagonales y la recta al punto</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El blanco de I mide (2/3)(3/2)=1 área</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de II. La razón es 1/4+1/6=5/12.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>