<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Un triángulo equilátero oculto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="112.09,280.99 205.36,280.99 263.65,180.03" fill="#f4c581" fill-opacity="0.45"/><polygon points="205.36,280.99 321.94,280.99 368.57,361.76" fill="#f4c581" fill-opacity="0.45"/><polyline points="112.09,280.99 263.65,180.03 368.57,361.76 112.09,280.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="112.09,280.99 205.36,280.99 321.94,280.99" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="263.65,180.03 205.36,280.99 368.57,361.76" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645164" y="275.3991879692886" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="264.57998683344306" y="168.84312131129377" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="370.15687868870634" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="198.8294930875576" y="294.9844414255099" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="330.3304805793285" y="283.79286802195486" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="223.0779021285934" y="268.87077015054825" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="254.321044546851" y="197.75468593714405" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">φ</text><text x="227.74105771340794" y="295.91707254247274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">φ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el orden de los vértices en el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dibujo, la correspondencia es B↔O, O↔D</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y A↔C. En particular, BO=OD y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠AOB=∠CDO.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como AOD y BDC son rectas, el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suplemento de ∠AOB es x y el de ∠CDO</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es ∠BDO. Luego los ángulos BOD y BDO</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coinciden.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De esa igualdad se sigue BO=BD. Con</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BO=OD, el triángulo BOD es equilátero.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>