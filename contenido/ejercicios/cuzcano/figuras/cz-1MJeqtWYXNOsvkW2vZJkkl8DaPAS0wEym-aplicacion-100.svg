<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">100 · Fuerza mínima para iniciar el deslizamiento</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,298.90 375.10,298.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="196.84,298.90 196.84,246.29 268.02,246.29 268.02,298.90" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="112.66,271.05 194.36,271.05" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="186.94,266.71 194.36,271.05 186.94,275.38" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="232.12000291269206" y="276.6178912109517" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 kg</text><text x="133.7074200830117" y="261.76316172722636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="159.70319667953106" y="240.1000145634603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como la fuerza aplicada es horizontal,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la normal vale mg=100 N.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La máxima fricción estática vale</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">μₛN=0,8×100 N.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza aplicada iguala esa fricción</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en el umbral. Una fuerza apenas mayor</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inicia el movimiento.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>