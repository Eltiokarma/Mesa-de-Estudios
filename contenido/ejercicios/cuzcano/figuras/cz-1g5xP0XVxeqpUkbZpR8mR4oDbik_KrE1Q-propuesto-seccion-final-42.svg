ffffff" stroke="#a3b9cc"/><text x="285.5" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="333.0" y="322" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">98</text><rect x="48.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">5</text><rect x="143.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">18</text><rect x="238.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="333.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><text x="48" y="445" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Tabla de 25 alumnos</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre el límite 8 y la quinta marca</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hay 2,5 anchos. Como 18−8=10, el ancho</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 4 y las marcas son 2, 6, 10, 14 y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">18.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las frecuencias segunda, tercera y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuarta son 0,12×25=3, 50/10=5 y</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">98/14=7. Con cuatro en la primera</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">quedan seis en la quinta.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma ponderada es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4×2+3×6+50+98+6×18=282. Divide entre</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">25.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>