<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">469 · Recuento de carbonos terminales en un alcano ramificado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,258.39 140.07,280.61 179.24,258.39 218.41,280.61 257.59,258.39 296.76,280.61 335.93,258.39 375.10,280.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="140.07,280.61 140.07,238.51" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="140.07,280.61 140.07,322.70" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="218.41,280.61 218.41,322.70" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="257.59,258.39 257.59,216.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="296.76,280.61 296.76,322.70" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada CH₃ está unido a un solo carbono</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y, por tanto, es primario.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuenta tres metilos alrededor del</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">carbono cuaternario y uno en cada uno</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de los tres CH ramificados.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Añade el metilo del extremo derecho.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El total es 3+3+1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>