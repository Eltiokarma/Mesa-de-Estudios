<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">033 · Balanza bajo un recipiente y piedra suspendida</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="105.17,185.10 105.17,362.20 370.83,362.20 370.83,185.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="105.17,223.84 370.83,223.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="261.24,263.69 261.12,266.12 260.74,268.52 260.11,270.87 259.24,273.14 258.13,275.31 256.81,277.35 255.27,279.24 253.55,280.96 251.66,282.49 249.62,283.82 247.45,284.92 245.18,285.80 242.83,286.43 240.43,286.81 238.00,286.93 235.57,286.81 233.17,286.43 230.82,285.80 228.55,284.92 226.38,283.82 224.34,282.49 222.45,280.96 220.73,279.24 219.19,277.35 217.87,275.31 216.76,273.14 215.89,270.87 215.26,268.52 214.88,266.12 214.76,263.69 214.88,261.26 215.26,258.86 215.89,256.51 216.76,254.23 217.87,252.07 219.19,250.03 220.73,248.14 222.45,246.41 224.34,244.88 226.38,243.56 228.55,242.45 230.82,241.58 233.17,240.95 235.57,240.57 238.00,240.44 240.43,240.57 242.83,240.95 245.18,241.58 247.45,242.45 249.62,243.56 251.66,244.88 253.55,246.41 255.27,248.14 256.81,250.03 258.13,252.07 259.24,254.23 260.11,256.51 260.74,258.86 261.12,261.26 261.24,263.69" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="132.85,362.20 343.15,362.20 343.15,396.52 132.85,396.52 132.85,362.20" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,154.66 238.00,240.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="334.29981024667933" y="248.74573055028463" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="238.0" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Soporte externo</text><text x="238.0" y="380.4661606578115" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Balanza</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El agua ejerce una fuerza E hacia</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arriba sobre la piedra.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por acción y reacción, la piedra</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ejerce E hacia abajo sobre el agua. La</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuerda transmite el resto de su peso</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">al soporte externo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La balanza sostiene el peso anterior W</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">más la reacción E.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>