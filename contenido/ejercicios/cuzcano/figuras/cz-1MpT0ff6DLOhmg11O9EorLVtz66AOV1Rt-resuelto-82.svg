<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">082 · Cruce de una recta dada con la bisectriz de los ejes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="360.2258064516129" x2="421" y2="360.2258064516129" stroke="#20364b" stroke-width="1.7"/><line x1="147.2741935483871" y1="105" x2="147.2741935483871" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="110.98,396.52 365.02,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">L</text><polyline points="110.98,351.15 365.02,160.63" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">L₁</text><circle cx="147.2741935483871" cy="360.2258064516129" r="3.7" fill="#20364b"/><text x="154.2741935483871" y="352.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="292.43548387096774" cy="215.06451612903226" r="3.7" fill="#20364b"/><text x="299.43548387096774" y="207.06451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como tan(45°)=1 y pasa por O, L tiene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ecuación y=x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye en la otra recta: 3x−4x+4=0.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De x=4 se sigue y=4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>