<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Lado a partir de la distancia al incentro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.30,321.21 238.00,212.31 364.91,321.21 110.30,321.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="219.20,321.21 238.00,212.31" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="219.20,321.21 303.02,267.93" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,212.31 281.09,321.21" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="328.2557603686636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="218.4147465437788" y="332.9562211981567" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.0" y="206.04377880184333" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="330.60599078341016" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="281.8709677419355" y="332.1728110599079" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="269.33640552995394" y="284.3847926267281" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="304.58986175115206" y="261.6658986175115" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="317.1244239631336" y="249.13133640552996" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7</text><text x="246.61751152073734" y="289.86866359447004" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="225.46543778801842" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">AB</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea x=∠C y E el corte de la bisectriz</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de B con AC. Los ángulos APE y AEP</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valen 90°−x/2, de modo que AE=AP=2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la prolongación de CA toma Q con</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">QA=AB. El triángulo QAB tiene ángulos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x en Q y B. Por ello QBC es isósceles</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y QB=BC=7.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En QBE, ∠QBE=x+(180°−3x)/2=90°−x/2,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igual a ∠QEB. Entonces QE=QB=7 y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB=QA=QE−AE.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>