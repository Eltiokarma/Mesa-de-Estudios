<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">099 · Contacto total en una rampa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="259.20139494333046" x2="421" y2="259.20139494333046" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="238.00,259.20 238.00,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">peso</text><line x1="238.0" y1="396.51612903225805" x2="233.9223954694043" y2="387.38523962913496" stroke="#1766b0" stroke-width="2"/><line x1="238.0" y1="396.51612903225805" x2="242.0776045305957" y2="387.38523962913496" stroke="#1766b0" stroke-width="2"/><polyline points="238.00,259.20 273.70,238.60" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">tensión</text><line x1="273.7018308631212" y1="238.6041848299913" x2="267.8304566147216" y2="246.69905755507042" stroke="#d37618" stroke-width="2"/><line x1="273.7018308631212" y1="238.6041848299913" x2="263.75511553394256" y2="239.6351330150535" stroke="#d37618" stroke-width="2"/><polyline points="238.00,259.20 202.30,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="498" font-family="Arial,sans-serif" font-size="12" fill="#008674" text-anchor="start">R=N+f</text><line x1="202.2981691368788" y1="142.4838709677419" x2="208.86826114520153" y2="150.02269653955173" stroke="#008674" stroke-width="2"/><line x1="202.2981691368788" y1="142.4838709677419" x2="201.0697267200827" y2="152.40813059899983" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sobre A actúan peso, tensión hacia</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arriba de la rampa y contacto del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">plano.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El contacto total R=N+f se inclina</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde la normal hacia arriba de la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rampa, porque A baja.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La alternativa D representa esa</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resultante, no una normal puramente</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>