<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">079 · Suma de máximo y mínimo de verseno y coverseno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="100.90,322.07 105.47,329.44 110.04,335.92 114.61,341.43 119.18,345.91 123.75,349.32 128.32,351.61 132.89,352.76 137.46,352.76 142.03,351.61 146.60,349.32 151.17,345.91 155.74,341.43 160.31,335.92 164.88,329.44 169.45,322.07 174.02,313.88 178.59,304.96 183.16,295.42 187.73,285.35 192.30,274.87 196.87,264.09 201.44,253.13 206.01,242.11 210.58,231.15 215.15,220.37 219.72,209.89 224.29,199.83 228.86,190.28 233.43,181.37 238.00,173.18 242.57,165.80 247.14,159.32 251.71,153.81 256.28,149.33 260.85,145.93 265.42,143.64 269.99,142.48 274.56,142.48 279.13,143.64 283.70,145.93 288.27,149.33 292.84,153.81 297.41,159.32 301.98,165.80 306.55,173.18 311.12,181.37 315.69,190.28 320.26,199.83 324.83,209.89 329.40,220.37 333.97,231.15 338.54,242.11 343.11,253.13 347.68,264.09 352.25,274.87 356.82,285.35 361.39,295.42 365.96,304.96 370.53,313.88 375.10,322.07" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma interior es 2−cos x−sen x.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como cos x+sen x≤√2, la expresión</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interior es positiva.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El seno más el coseno recorre</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[−√2,√2]. Por tanto, el rango de la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">función va de 2−√2 a 2+√2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma ambos extremos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>