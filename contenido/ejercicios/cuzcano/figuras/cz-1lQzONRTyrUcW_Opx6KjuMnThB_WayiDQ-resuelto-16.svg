<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Ángulo entre un segmento y la perpendicular común</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="152.43,257.06 152.43,314.98 255.48,222.96" fill="#f4c581" fill-opacity="0.45"/><polyline points="110.15,322.85 309.95,322.85 375.10,273.63 175.30,273.63 110.15,322.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="152.43,314.98 297.21,314.98" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,274.12 152.43,257.06 255.48,222.96 276.07,216.15" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="152.43,257.06 152.43,314.98 255.48,222.96" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="255.48,222.96 210.34,314.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="152.43,314.98 255.48,280.87 210.34,314.98" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="255.48,222.96 255.48,280.87" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="152.42708159456913" y="257.064085880701" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="152.42708159456913" y="314.9755794044927" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="255.47611722479238" y="222.96016517806385" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="210.33857511836086" y="314.9755794044927" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="255.47611722479238" y="280.8716587018556" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="225.5403421683562" y="233.60993100356532" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="175.30212153646687" y="311.26924381897004" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon AB=k. La distancia horizontal de P</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a la paralela a la segunda recta por A</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es AP·sen 60°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras, PS²=k²+AP²·sen²60°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como PS=2k, queda AP=2k.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo rectángulo APB, tan</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠APB=AB/AP=1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>