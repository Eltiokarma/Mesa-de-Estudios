<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Perpendiculares a dos transversales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,204.38 375.10,204.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,341.48 375.10,341.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="142.03,163.25 207.15,375.75" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="118.04,183.81 299.69,252.36" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="118.04,375.75 306.55,293.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="275.70,175.25 232.86,272.93 323.69,368.90" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="364.8145161290322" y="194.09677419354844" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="364.8145161290322" y="331.19354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="135.17741935483872" y="196.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="167.73790322580646" y="352.44354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="166.0241935483871" y="230.42741935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2α</text><text x="198.58467741935485" y="322.28225806451616" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2β</text><text x="259.25" y="194.78225806451616" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="296.26612903225805" y="353.81451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prolonga las dos oblicuas hasta que se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corten. Forman un triángulo con la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">transversal común.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo del cruce es α+β por el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelismo. Por eso 2α+2β+α+β=180°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada perpendicular da un ángulo obtuso</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 90° más el correspondiente α o β.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>