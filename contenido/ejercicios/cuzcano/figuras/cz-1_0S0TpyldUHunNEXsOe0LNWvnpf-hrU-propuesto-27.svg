<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Lectura de balanza bajo un émbolo menor</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="120.99,142.48 120.99,292.65 296.19,292.65 296.19,336.45" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="189.82,142.48 189.82,239.47 346.25,239.47 346.25,336.45" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="120.99,176.90 189.82,176.90" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="296.19,327.06 346.25,327.06" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="321.22,327.06 321.22,364.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="287.43,364.61 355.01,364.61 355.01,396.52 287.43,396.52 287.43,364.61" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="154.78253615127915" y="161.25472747497219" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100 N</text><text x="154.78253615127915" y="205.05339265850947" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5A</text><text x="321.2174638487208" y="308.29310344827593" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="321.2174638487208" y="380.24805339265856" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Balanza</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El aumento de presión en el émbolo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mayor es 100/(5A).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esa presión actúa sobre el émbolo de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área A y añade 20 N a la balanza.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma los 20 N a la indicación inicial</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 50 N.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>