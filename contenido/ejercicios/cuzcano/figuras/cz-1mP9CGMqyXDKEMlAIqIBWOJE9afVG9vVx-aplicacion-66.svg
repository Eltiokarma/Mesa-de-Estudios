<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">066 · Corriente al apagar un campo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,190.71 197.05,190.71 203.28,198.73 214.85,182.70 226.43,198.73 238.00,182.70 249.57,198.73 261.15,182.70 272.72,198.73 282.51,190.71 375.10,190.71 375.10,368.76 100.90,368.76 100.90,190.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="238.0" y="170.23837452869708" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 Ω</text><text x="238.0" y="325.13992459153746" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 m²</text><text x="356.4017595307918" y="221.8722245496439" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙ B(t)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El flujo por la espira pasa de 0,60 Wb</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a cero.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ley de Faraday da una fem de módulo</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,60/(10⁻³)=600 V.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide entre 10 Ω. Por la ley de Lenz,</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la corriente produce un campo saliente</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para oponerse a la disminución.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>