<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">039 · Ángulo crítico de un líquido</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,240.98 375.10,240.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,323.24 342.19,240.98 371.26,240.98" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="342.19,211.92 342.19,270.05" fill="none" stroke="#008674" stroke-width="2.5"/><text x="228.1290322580645" y="327.08064516129036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="140.38709677419354" y="227.27419354838707" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">aire</text><text x="149.1612903225806" y="254.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n = 5/4</text><text x="287.35483870967744" y="284.85483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θc</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la situación límite, el rayo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">transmitido va paralelo a la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superficie.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Snell, (5/4) sen θ_c=1, ya que el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo de transmisión con la normal es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">90°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula θ_c=arcsen(4/5).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>