<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Valor actual al negociar siete días después</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,260.36 375.10,260.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,246.65 100.90,274.07" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="228.86,246.65 228.86,274.07" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,246.65 375.10,274.07" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="292.3494623655914" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Negociación</text><text x="228.8602150537634" y="292.3494623655914" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7 días después</text><text x="375.09677419354836" y="292.3494623655914" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vencimiento</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El descuento comercial varía</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">linealmente con el tiempo pendiente.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Siete días menos reducen el descuento</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en S/ 8400.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La reducción por día es 8400/7 = S/</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1200. Para 15 días se descuentan S/ 18</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">000.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta 18 000 del nominal.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>