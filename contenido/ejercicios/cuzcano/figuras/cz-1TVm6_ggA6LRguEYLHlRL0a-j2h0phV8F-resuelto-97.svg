<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">097 · Ceviana y ángulos de 36° y 84°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="114.90,375.09 114.90,165.07 359.93,375.09 114.90,375.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="114.90,375.09 211.75,248.03" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645163" y="394.92896362388467" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="114.90459849004804" y="144.07103637611533" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="394.92896362388467" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="218.74811256005492" y="228.0792724776939" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="168.57652711050105" y="354.0916266300618" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">36°</text><text x="194.2457103637612" y="259.58236101578586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">84°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠BAP = 54°, en ABP queda ∠ABP =</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">42°. En ABC, C = 48°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la ley de senos en ABP, AP = AB</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 42°/sen 84°. Y en ABC, AB = ℓ sen</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">48°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa sen 48° = cos 42° y sen 84° = 2</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 42° cos 42°. Resulta AP = ℓ/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>