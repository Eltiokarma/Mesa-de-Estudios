<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">022 · Nombre y oxidación de cinco aniones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="190.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="143.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Fórmula</text><rect x="238.0" y="130" width="190.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="333.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Nombre</text><rect x="48.0" y="178" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">BrO⁻</text><rect x="238.0" y="178" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Hipobromito</text><rect x="48.0" y="226" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Si₂O₅²⁻</text><rect x="238.0" y="226" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Disilicato</text><rect x="48.0" y="274" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">IO₄⁻</text><rect x="238.0" y="274" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Periodato</text><rect x="48.0" y="322" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">MnO₄⁻</text><rect x="238.0" y="322" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Permanganato</text><rect x="48.0" y="370" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">ClO₂⁻</text><rect x="238.0" y="370" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Clorito</text><text x="48" y="445" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Aniones</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con O en −2, los estados centrales son</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Br +1, Si +4, I +7, Mn +7 y Cl +3.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa los nombres usuales de los</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">oxoaniones en ese orden. IO₄⁻ es el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">metaperiodato, comúnmente periodato en</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esta serie.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MnO₄⁻ es permanganato. Manganato</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corresponde a MnO₄²⁻ y Mn +6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>