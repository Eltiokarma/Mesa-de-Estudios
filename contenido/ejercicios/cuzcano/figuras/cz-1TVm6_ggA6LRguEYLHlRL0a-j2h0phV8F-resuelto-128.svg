<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">128 · Ángulo obtuso desde una distancia al lado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.81,294.36 191.08,246.26 368.60,294.36 107.81,294.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="279.84,270.31 279.84,294.36" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="191.08,246.26 191.08,294.36" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645159" y="300.45340501792117" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="191.08243727598565" y="238.14038231780165" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="300.85961768219835" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="285.72998805256873" y="268.3626045400239" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Punto medio</text><text x="288.57347670250897" y="282.5800477897252" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2μ</text><text x="148.43010752688173" y="265.9253285543608" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8μ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C está en la recta AC. La distancia de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B a esa recta es el doble de la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia de su punto medio con C, es</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">decir 4μ.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura desde B es AB sen A. Así sen</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A = 4/8 = 1/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A = 150° daría C = 75°, y juntos</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">excederían 180°. Por ello A = 30°, C =</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15° y B = 135°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>