<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">088 · Razón entre dos alturas con ángulos doble y triple</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.63,375.19 187.50,160.59 365.44,375.19 111.63,375.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="187.50,160.59 187.50,375.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="111.63,375.19 187.50,321.54 365.44,375.19" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="381.62730213294526" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="187.5048582539664" y="153.08074371842525" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="381.62730213294526" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="187.5048582539664" y="385.91925628157475" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="194.47928374548934" y="316.17500136634567" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="136.00140847041263" y="362.8500027326913" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="141.36635115619947" y="339.24425491522913" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="307.67957441559196" y="341.9267262581225" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2y</text><text x="308.7525629527494" y="366.6054626127421" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama h a BH y d a DH. En A, h/d=tan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x/tan x. En C, la misma razón es tan</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3y/tan y.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con t=tan y=1/√11, la fórmula triple</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da (3−t²)/(1−3t²)=4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si u=tan x, entonces 2/(1−u²)=4 y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">u²=1/2. Como x es agudo, cot x=√2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>