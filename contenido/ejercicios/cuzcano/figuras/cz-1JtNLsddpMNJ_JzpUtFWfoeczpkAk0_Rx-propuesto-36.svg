<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Ángulo de entrada para alcanzar el fondo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="124.04,216.80 375.10,216.80 375.10,349.62 124.04,349.62 124.04,216.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="131.75,184.24 242.28,216.80 341.68,349.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="242.28,171.39 242.28,349.62" fill="none" stroke="#008674" stroke-width="2.5"/><text x="249.99596774193546" y="207.3780241935484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="347.6774193548387" y="365.039314516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="291.98185483870964" y="367.60987903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30 cm</text><text x="100.90322580645162" y="284.4949596774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 cm</text><text x="294.55241935483866" y="257.07560483870964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n = 1,6</text><text x="195.1572580645161" y="194.5252016129032" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo dentro del líquido tiene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hipotenusa 50 cm. Para el ángulo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">refractado con la normal, sen</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r=30/50=3/5.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la ley de Snell, sen</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">i=1,6×3/5=0,96, donde i se mide</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto de la normal.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como θ se mide desde la superficie,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=90°−arcsen(0,96).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>