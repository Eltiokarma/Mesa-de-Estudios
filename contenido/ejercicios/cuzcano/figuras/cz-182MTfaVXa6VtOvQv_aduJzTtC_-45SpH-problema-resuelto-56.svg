2.84,192.92 282.45,194.00 282.03,195.07 281.59,196.12 281.12,197.17 280.63,198.20 280.11,199.22 279.56,200.23 279.00,201.22 278.41,202.21 277.79,203.17 277.15,204.12 276.49,205.06 275.81,205.98 275.11,206.88" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">θ</text><circle cx="146.61631091915763" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="153.61631091915763" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P(a, 2a−2)</text><circle cx="329.3836890808424" cy="250.30222650291032" r="3.7" fill="#20364b"/><text x="336.3836890808424" y="242.30222650291032" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q(−a, a+1)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Duplica la tangente. tan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α=2(−3/2)/(1−9/4)=12/5.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como tan α=(2a−2)/a, se obtiene</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">12a=10a−10 y a=−5.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces Q=(5,−4). Cot θ es x/y=−5/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>