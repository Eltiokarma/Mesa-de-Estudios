<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">074 · Distancia al centro a partir de dos proyecciones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.92,356.09 109.92,175.70 290.31,175.70 290.31,356.09 109.92,356.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.92,175.70 187.49,218.99 109.92,356.09" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="109.92,356.09 324.59,235.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="290.31,175.70 369.69,314.60 290.31,356.09" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="200.12,265.89 218.16,294.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="366.9108658743633" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="100.90322580645162" y="166.67741935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="292.1171477079796" y="166.67741935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="292.1171477079796" y="372.3225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="191.09847198641765" y="215.38285229202037" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="331.8030560271647" y="233.42190152801356" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="375.0967741935484" y="323.6171477079796" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="191.09847198641765" y="258.67657045840406" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="221.76485568760611" y="309.18590831918505" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="138.78522920203736" y="193.73599320882852" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="353.4499151103565" y="246.0492359932088" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja el ángulo recto NUP sobre su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisectriz. Esto lleva UN a UP y UI a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">UL por los ángulos dados. Por tanto la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia de P a UL es igual a NI=5.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los puntos P y A tienen la misma</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia a UL porque PA∥UL. Como C, L</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y A están alineados con L entre C y A,</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CL=7−5=2.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro O es punto medio de UC. La</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia a UL se interpola de 0 en U</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a 2 en C, y en O vale 1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>