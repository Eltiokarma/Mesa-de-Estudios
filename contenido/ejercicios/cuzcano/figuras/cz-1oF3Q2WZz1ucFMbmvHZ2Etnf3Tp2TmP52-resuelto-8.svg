="13" fill="#20364b" text-anchor="middle">O</text><text x="368.81753262743166" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="172.59123368628417" y="246.21447919231716" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t</text><text x="303.40876631371583" y="246.21447919231716" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La igualdad LM=MN permite escribir</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">IN=IM+LM e LI=LM−IM.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">También LO=LM+MO y ON=LM−MO. Las</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencias respectivas valen 2IM y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2MO.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al dividir por las longitudes</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">indicadas, cada cociente vale 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>