127.09,291.74 124.01,296.16 121.11,300.69 118.38,305.33 115.85,310.08 113.50,314.93 111.34,319.86 109.38,324.87 107.61,329.96 106.05,335.11 104.69,340.32 103.54,345.58 102.59,350.88 101.85,356.21 101.33,361.57 101.01,366.94 100.90,372.32" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="202.23328026501602" y="204.6426799007444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="280.1836228287841" y="315.7013120623482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">12</text><text x="238.0" y="166.67741935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="185.27047146401986" y="245.77171215880895" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.0967741935484" y="372.3225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="238.0" y="372.3225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="238.0" y="235.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="278.32258064516134" y="227.16129032258064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">J</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el diámetro, ∠FOP=90°, así que</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">FP=13. La simetría respecto a FH hace</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que FV sea bisectriz de ∠OFP.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como V es el punto medio del arco P′P,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠VOP=45°. Entonces OV también es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisectriz y V es el incentro de FOP.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la bisectriz OJ, la fórmula del</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">incentro como promedio ponderado por</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los lados da OV/VJ=(FO+OP)/FP. Como</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">FOV y FVJ tienen la misma altura sobre</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OJ, esa es la razón de áreas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>