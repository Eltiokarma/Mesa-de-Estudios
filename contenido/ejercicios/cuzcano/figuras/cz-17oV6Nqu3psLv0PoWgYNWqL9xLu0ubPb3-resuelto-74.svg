<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">074 · Cotangente desde una división de segmento</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="128.36,231.26 347.64,231.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,396.52 238.00,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="154.57,259.07 279.71,342.50 321.43,370.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="154.57,259.07 238.00,231.26" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,231.26 217.14,168.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="253.29,231.26 253.26,230.30 253.17,229.34 253.02,228.39 252.81,227.44 252.54,226.52 252.21,225.61 251.83,224.73 251.39,223.87 250.90,223.04 250.35,222.24 249.76,221.48 249.12,220.76 248.43,220.08 247.71,219.44 246.94,218.86 246.14,218.32 245.31,217.83 244.45,217.39 243.56,217.02 242.65,216.69 241.73,216.43 240.78,216.22 239.83,216.08 238.87,215.99 237.90,215.97 236.94,216.01 235.98,216.10 235.03,216.26 234.09,216.48 233.16,216.75" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="238.0" y="231.2630700778643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="154.57397107897663" y="259.0717463848721" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="279.71301446051166" y="342.49777530589546" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="321.4260289210233" y="370.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="347.6357063403782" y="236.30339265850947" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="245.05645161290323" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="242.86651835372635" y="213.88264738598443" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De AM=3MB se deduce M=A/4+3B/4. Así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=4M−3B=(−6,−2).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de OA es 1/3. La de su</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular es −3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cotangente de θ es −1/3. Multiplica</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por 3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>