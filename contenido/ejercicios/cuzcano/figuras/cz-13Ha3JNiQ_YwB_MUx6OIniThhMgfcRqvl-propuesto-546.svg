<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">546 · Alcohol con bromo al final de la cadena</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,221.97 192.30,269.50 283.70,221.97 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="192.30,269.50 192.30,334.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="192.30,269.50 192.30,204.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,269.50 375.10,204.61" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="192.3010752688172" y="357.241935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">OH</text><text x="192.3010752688172" y="181.75806451612905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="375.09677419354836" y="181.75806451612905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Br</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elige la cadena de cuatro carbonos que</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contiene el OH.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Numera desde el extremo metilo para</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dar al OH el 2 en lugar del 3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El metilo adicional queda en 2 y el</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bromo en 4. Escribe bromo primero en</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">orden alfabético.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>