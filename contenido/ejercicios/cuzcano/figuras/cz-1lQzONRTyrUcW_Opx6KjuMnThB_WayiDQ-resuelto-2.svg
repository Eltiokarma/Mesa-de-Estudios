<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">002 · Mayor cara entera de un triedro equilátero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="233.25,283.85 375.10,269.50 223.75,210.53" fill="#f4c581" fill-opacity="0.45"/><polygon points="233.25,283.85 223.75,210.53 100.90,328.47" fill="#f4c581" fill-opacity="0.45"/><polygon points="233.25,283.85 100.90,328.47 375.10,269.50" fill="#f4c581" fill-opacity="0.45"/><polyline points="233.25,283.85 375.10,269.50 233.25,283.85 223.75,210.53 233.25,283.85 100.90,328.47 233.25,283.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,269.50 223.75,210.53 100.90,328.47" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="233.24900044705947" y="283.8473420836366" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.09677419354836" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="223.74700134117842" y="210.53498774333116" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="100.90322580645157" y="328.46501225666884" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si cada cara mide x, la suma de los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tres ángulos planos es 3x y debe ser</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">menor que 360°. Por tanto x&lt;120°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para verificar que 119° es realizable,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">toma tres rayos unitarios con acimutes</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separados 120° y componente vertical</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">z. Su producto escalar por parejas es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(3z²−1)/2.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elige z²=(1+2cos 119°)/3, que está</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre 0 y 1. Los rayos quedan fuera de</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un mismo plano y forman las tres caras</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 119°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>