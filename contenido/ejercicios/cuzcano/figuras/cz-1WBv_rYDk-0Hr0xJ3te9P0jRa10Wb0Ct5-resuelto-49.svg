<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">049 · Fracción de volumen que ocuparía el hielo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,220.74 100.90,349.92 213.62,349.92 213.62,220.74" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,260.00 213.62,260.00" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="157.89,260.00 157.89,210.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="157.89,189.08 157.89,204.28" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="153.46,199.84 157.89,205.54 162.33,199.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="262.38,220.74 262.38,349.92 375.10,349.92 375.10,220.74" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="262.38,339.16 375.10,339.16" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="319.37,339.16 319.37,290.40" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="165.49385383297326" y="196.67723310735306" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">82 atm</text><text x="114.8345377337406" y="254.3022051702302" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Pistón</text><text x="112.93481338001939" y="310.66069433062654" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vapor · 50 cm³</text><text x="278.2108321537659" y="334.09062802652164" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hielo · 2 cm³</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usando gas ideal en el estado inicial,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">n=82·0,050/(0,082·500)=0,100 mol.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La masa de agua es 0,100·18=1,80 g y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se conserva.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El hielo ocupa 1,80/0,9=2,0 cm³.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Frente a 50 cm³ corresponde al 4 %.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>