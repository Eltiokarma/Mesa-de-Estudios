<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">079 · Espejo que sigue a un pez</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="355.94,283.11 355.40,294.22 353.76,305.23 351.06,316.03 347.31,326.51 342.55,336.57 336.83,346.11 330.20,355.05 322.73,363.30 314.48,370.77 305.54,377.40 296.00,383.13 285.94,387.88 275.46,391.63 264.66,394.34 253.65,395.97 242.54,396.52 231.42,395.97 220.41,394.34 209.62,391.63 199.14,387.88 189.08,383.13 179.53,377.40 170.59,370.77 162.35,363.30 154.87,355.05 148.24,346.11 142.52,336.57 137.76,326.51 134.01,316.03 131.31,305.23 129.68,294.22 129.13,283.11 129.68,271.99 131.31,260.98 134.01,250.19 137.76,239.71 142.52,229.65 148.24,220.10 154.87,211.16 162.35,202.92 170.59,195.44 179.53,188.81 189.08,183.09 199.14,178.33 209.62,174.58 220.41,171.88 231.42,170.25 242.54,169.70 253.65,170.25 264.66,171.88 275.46,174.58 285.94,178.33 296.00,183.09 305.54,188.81 314.48,195.44 322.73,202.92 330.20,211.16 336.83,220.10 342.55,229.65 347.31,239.71 351.06,250.19 353.76,260.98 355.40,271.99 355.94,283.11" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="180.16,153.82 304.91,185.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="242.54,371.57 242.54,169.70 139.34,236.04" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="242.54,169.70 180.16,377.80" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="242.54,283.11 139.34,236.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="242.54,283.11 180.16,377.80" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="120.05645161290322" y="232.07560483870967" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Pez</text><text x="165.41935483870967" y="391.9798387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Pez después</text><text x="260.6814516129032" y="296.7177419354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="268.6199596774194" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Espejo</text><text x="191.5030241935484" y="306.9243951612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El pez barre un ángulo central por</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">unidad de tiempo igual a v/R = 12</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rad/s.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde el espejo en la circunferencia,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el ángulo inscrito cambia a la mitad</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la rapidez del ángulo central. El</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rayo reflejado debe girar a 6 rad/s.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rayo reflejado gira el doble que el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">espejo. Divide otra vez entre dos para</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtener 3 rad/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>