<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">013 · Un cilindro entre dos superficies lisas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="340.58,226.09 339.34,238.64 335.68,250.70 329.74,261.82 321.74,271.56 312.00,279.56 300.88,285.51 288.81,289.17 276.27,290.40 263.72,289.17 251.65,285.51 240.54,279.56 230.79,271.56 222.79,261.82 216.85,250.70 213.19,238.64 211.95,226.09 213.19,213.54 216.85,201.48 222.79,190.36 230.79,180.61 240.54,172.62 251.65,166.67 263.72,163.01 276.27,161.78 288.81,163.01 300.88,166.67 312.00,172.62 321.74,180.61 329.74,190.36 335.68,201.48 339.34,213.54 340.58,226.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="340.58,142.48 340.58,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="125.13,213.09 340.58,337.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="244.11,281.78 276.27,226.09" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="275.32,241.88 276.27,226.09 263.06,234.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="340.58,226.09 262.12,226.09" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="276.27,219.02 262.12,226.09 276.27,233.16" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="276.27,226.09 276.27,319.34" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="269.19,305.19 276.27,319.34 283.34,305.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="236.39220089832583" y="275.60963658636183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="350.8674969375255" y="230.5912617394855" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="210.6674152715394" y="267.8922008983259" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Nₐ</text><text x="318.7115149040425" y="213.22703144140465" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Nᵦ</text><text x="294.916088199265" y="312.91057574520215" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100 N</text><text x="321.2839934667211" y="331.5610453246223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza de B es horizontal hacia la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda. La de A es normal a su</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superficie y forma 60° sobre la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La componente horizontal de la fuerza</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de A equilibra a la fuerza de B. Así</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Nᵦ=Nₐ cos 60°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide ambos lados por Nᵦ y usa cos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60°=1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>