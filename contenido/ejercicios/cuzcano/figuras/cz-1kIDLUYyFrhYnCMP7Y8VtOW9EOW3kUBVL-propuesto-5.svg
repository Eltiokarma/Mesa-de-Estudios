<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Segmento en el triángulo órtico</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,358.00 238.00,358.00 283.70,358.00 375.10,358.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,358.00 169.45,269.50 238.00,181.00 272.27,313.75 283.70,358.00" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,181.00 238.00,299.00 238.00,358.00" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="169.45,269.50 238.00,299.00 272.27,313.75 375.10,358.00" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="169.45,269.50 238.00,358.00 272.27,313.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="357.9955872117286" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="237.99999999999997" y="357.9955872117286" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="283.69892473118284" y="357.9955872117286" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="237.99999999999997" y="181.00441278827134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="169.4516129032258" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="272.2741935483871" y="313.7477936058643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="237.99999999999997" y="298.9985290705762" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="375.0967741935484" y="357.9955872117286" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A,M,L,C son concíclicos porque los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos AMC y ALC son rectos. Los</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pares de lados opuestos de ese</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrilátero se cortan en E y B, y el</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tercer cruce es el ortocentro X=AL∩CM.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el teorema de la sección armónica</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en el cuadrilátero completo, la recta</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BX corta ML en T conjugado armónico de</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E respecto de M,L.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto MT/TL=ME/LE. Si MT=x, se</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene x/1=(x+1+3)/3, así que x=2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>