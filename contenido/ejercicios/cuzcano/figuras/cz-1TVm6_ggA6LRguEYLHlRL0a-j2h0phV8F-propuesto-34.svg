<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Segmento medio a partir de una bisectriz</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,301.14 164.18,216.77 375.10,301.14 206.36,301.14 100.90,301.14" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,301.14 185.27,258.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="164.18,216.77 185.27,258.95 206.36,301.14" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="185.27,258.95 269.64,258.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="301.1377171215881" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="164.1786600496278" y="216.7704714640198" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="301.1377171215881" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="185.27047146401986" y="258.9540942928039" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="269.6377171215881" y="258.9540942928039" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="138.8684863523573" y="244.1898263027295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="248.54590570719603" y="322.22952853598014" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">13</text><text x="210.5806451612903" y="314.8473945409429" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B′</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja B respecto de la bisectriz AE.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su imagen B′ está en AC y AB′=AB=5.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E es el punto medio de BB′. Como</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EF∥B′C, en BB′C la recta por E corta</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC en su punto medio F.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segmento medio EF mide</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B′C/2=(13−5)/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>