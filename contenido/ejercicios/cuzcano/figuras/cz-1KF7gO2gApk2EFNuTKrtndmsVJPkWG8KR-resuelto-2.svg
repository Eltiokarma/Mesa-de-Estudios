<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">002 · Distancia entre dos ciudades y un tesoro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,265.39 100.90,273.61" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="133.12,265.39 133.12,273.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="176.31,265.39 176.31,273.61" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,265.39 375.10,273.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,265.39 238.00,273.61" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="280.92473118279565" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="133.1209677419355" y="280.92473118279565" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="176.30645161290323" y="280.92473118279565" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="280.92473118279565" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="237.99999999999997" y="258.07526881720435" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Tesoro</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si AD=L, la primera parte mide 7 km y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la tercera 3/2 km.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El recorrido completo cumple</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">7+L/3+3/2=L/2. Así L/6=17/2 y L=51.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta AC=14 km de la distancia total.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>