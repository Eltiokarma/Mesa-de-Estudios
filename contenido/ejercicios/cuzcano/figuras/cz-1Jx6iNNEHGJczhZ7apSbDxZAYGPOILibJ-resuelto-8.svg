<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Dos diámetros con condiciones distintas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="365.02,269.50 364.74,263.96 363.93,258.45 362.58,252.98 360.69,247.58 358.28,242.28 355.35,237.10 351.92,232.05 348.00,227.16 343.61,222.46 338.77,217.95 333.50,213.67 327.81,209.62 321.75,205.84 315.32,202.32 308.57,199.09 301.51,196.17 294.18,193.56 286.61,191.27 278.83,189.32 270.87,187.71 262.78,186.45 254.58,185.55 246.31,185.00 238.00,184.82 229.69,185.00 221.42,185.55 213.22,186.45 205.13,187.71 197.17,189.32 189.39,191.27 181.82,193.56 174.49,196.17 167.43,199.09 160.68,202.32 154.25,205.84 148.19,209.62 142.50,213.67 137.23,217.95 132.39,222.46 128.00,227.16 124.08,232.05 120.65,237.10 117.72,242.28 115.31,247.58 113.42,252.98 112.07,258.45 111.26,263.96 110.98,269.50 111.26,275.04 112.07,280.55 113.42,286.02 115.31,291.42 117.72,296.72 120.65,301.90 124.08,306.95 128.00,311.84 132.39,316.54 137.23,321.05 142.50,325.33 148.19,329.38 154.25,333.16 160.68,336.68 167.43,339.91 174.49,342.83 181.82,345.44 189.39,347.73 197.17,349.68 205.13,351.29 213.22,352.55 221.42,353.45 229.69,354.00 238.00,354.18 246.31,354.00 254.58,353.45 262.78,352.55 270.87,351.29 278.83,349.68 286.61,347.73 294.18,345.44 301.51,342.83 308.57,339.91 315.32,336.68 321.75,333.16 327.81,329.38 333.50,325.33 338.77,321.05 343.61,316.54 348.00,311.84 351.92,306.95 355.35,301.90 358.28,296.72 360.69,291.42 362.58,286.02 363.93,280.55 364.74,275.04 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="197.83,349.83 278.17,189.17" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="117.50,242.72 358.50,296.28" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="153.32,396.52 322.68,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><circle cx="322.6774193548387" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="329.6774193548387" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P(2,3)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para una cuerda con punto medio (h,k)</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y dirección (1,2), resta la ecuación</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de sus extremos simétricos. Resulta</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4h+18k=0.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto los puntos medios están</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre y=−2x/9. Esa es la primera</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recta.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segundo diámetro pasa por el origen</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y (2,3), de modo que su pendiente es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>