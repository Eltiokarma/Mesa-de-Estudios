<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">079 · Ángulo en un rombo con perpendicular auxiliar</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="126.26,381.24 217.94,197.87 355.47,197.87 263.79,381.24 126.26,381.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="217.94,197.87 240.87,152.03 309.63,289.56" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="126.26,381.24 263.79,197.87" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="126.26,381.24 309.63,289.56" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="114.8039049235993" y="394.6061120543294" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="212.21477079796261" y="188.32427843803055" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="361.1960950764007" y="194.0543293718166" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="261.8752122241086" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="315.35568760611204" y="297.19524617996603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="265.69524617996603" y="188.32427843803055" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="238.95500848896432" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="238.95500848896432" y="174.9541595925297" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="242.7750424448217" y="216.97453310696093" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prolonga RM hasta P en la recta AD. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simetría central en M lleva C a D y la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recta BC a AD, así que lleva N a P.</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces MP=MN=2 NR y AM es mediatriz</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de PN.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De AP=AN y ∠NAP=∠BNA=θ, AM biseca</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠NAP. El ángulo en A de ARP es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠RAM+∠MAP=90°−θ+θ/2. Es igual al</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo en P, que es complementario de</text><text x="482" y="315" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ/2. Por tanto AR=RP.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si NR=k, entonces RM=3k y RP=AR=5k.</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con A en el origen, AD horizontal y</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k=1, las coordenadas forzadas son</text><text x="482" y="422" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=(4,8)/√5 y M=(8,4)/√5. Sale</text><text x="482" y="445" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(6/√5,0), así que AB=4 y AD=6/√5 son</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>