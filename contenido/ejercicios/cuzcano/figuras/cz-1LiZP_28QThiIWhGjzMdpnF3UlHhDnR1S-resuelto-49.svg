<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">049 · Cuadrado y triángulo sombreados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,220.93 113.96,247.04 127.02,233.99" fill="#f4c581" fill-opacity="0.45"/><polygon points="140.07,220.93 179.24,220.93 159.66,240.51" fill="#f4c581" fill-opacity="0.45"/><polygon points="140.07,220.93 140.07,260.10 159.66,260.10" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,299.27 120.49,279.68 140.07,299.27" fill="#f4c581" fill-opacity="0.45"/><polygon points="140.07,299.27 179.24,260.10 179.24,299.27" fill="#f4c581" fill-opacity="0.45"/><polygon points="218.41,299.27 257.59,279.68 257.59,299.27" fill="#f4c581" fill-opacity="0.45"/><polygon points="257.59,299.27 257.59,260.10 296.76,279.68" fill="#f4c581" fill-opacity="0.45"/><polygon points="335.93,299.27 335.93,260.10 296.76,279.68" fill="#f4c581" fill-opacity="0.45"/><polygon points="257.59,260.10 296.76,220.93 296.76,260.10" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,299.27 179.24,299.27 179.24,220.93 100.90,220.93 100.90,299.27" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="218.41,299.27 375.10,299.27 296.76,220.93 218.41,299.27" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,260.10 179.24,260.10" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="140.07,299.27 140.07,220.93" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,260.10 140.07,220.93 179.24,260.10 140.07,299.27 100.90,260.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="257.59,299.27 257.59,260.10 335.93,260.10 335.93,299.27" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,220.93 113.96,247.04 127.02,233.99 100.90,220.93" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="140.07,220.93 179.24,220.93 159.66,240.51 140.07,220.93" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="140.07,220.93 140.07,260.10 159.66,260.10 140.07,220.93" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,299.27 120.49,279.68 140.07,299.27 100.90,299.27" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="140.07,299.27 179.24,260.10 179.24,299.27 140.07,299.27" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="218.41,299.27 257.59,279.68 257.59,299.27 218.41,299.27" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="257.59,299.27 257.59,260.10 296.76,279.68 257.59,299.27" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="335.93,299.27 335.93,260.10 296.76,279.68 335.93,299.27" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="257.59,260.10 296.76,220.93 296.76,260.10 257.59,260.10" fill="none" stroke="#008674" stroke-width="2.5"/><text x="151.7741935483871" y="268.1589861751152" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">6</text><text x="350.3686635944701" y="279.12672811059906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">10</text><text x="131.40552995391704" y="310.07142857142856" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1)</text><text x="292.0046082949309" y="310.07142857142856" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el cuadrado, la media celda tiene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área 6. Sus divisiones sombreadas</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aportan 2, 3, 3, 3 y 6.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo, la zona blanca se</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">divide en cuatro triángulos de área 10</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y uno de área 5.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La razón pedida es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(2+3+3+3+6)/(4·10+5)=17/45.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>