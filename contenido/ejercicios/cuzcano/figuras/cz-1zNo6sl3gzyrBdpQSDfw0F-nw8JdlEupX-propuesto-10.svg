<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Suma doble de diferencia</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="110.98387096774192" y1="105" x2="110.98387096774192" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="110.98,269.50 269.75,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">A</text><line x1="269.7540322580645" y1="269.5" x2="260.6231428549414" y2="273.5776045305957" stroke="#1766b0" stroke-width="2"/><line x1="269.7540322580645" y1="269.5" x2="260.6231428549414" y2="265.4223954694043" stroke="#1766b0" stroke-width="2"/><polyline points="110.98,269.50 206.25,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">B</text><line x1="206.2459677419355" y1="142.48387096774195" x2="204.0295177245382" y2="152.23514520859783" stroke="#d37618" stroke-width="2"/><line x1="206.2459677419355" y1="142.48387096774195" x2="197.5053504755851" y2="147.342019771883" stroke="#d37618" stroke-width="2"/><polyline points="110.98,269.50 365.02,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">A+B</text><line x1="365.0161290322581" y1="142.48387096774195" x2="358.67277345524644" y2="150.21444921413433" stroke="#008674" stroke-width="2"/><line x1="365.0161290322581" y1="142.48387096774195" x2="355.0256530889372" y2="142.92020848151586" stroke="#008674" stroke-width="2"/><polyline points="110.98,269.50 174.49,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">A−B</text><line x1="174.49193548387098" y1="396.51612903225805" x2="166.7613572374786" y2="390.1727734552464" stroke="#b0467a" stroke-width="2"/><line x1="174.49193548387098" y1="396.51612903225805" x2="174.05559797009707" y2="386.52565308893713" stroke="#b0467a" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al cuadrar:2a²(1+cosθ)=4·2a²(1−cosθ).</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1+cosθ=4−4cosθ,así cosθ=3/5.</text><text x="482" y="169" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=arccos(3/5)≈53,13°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>