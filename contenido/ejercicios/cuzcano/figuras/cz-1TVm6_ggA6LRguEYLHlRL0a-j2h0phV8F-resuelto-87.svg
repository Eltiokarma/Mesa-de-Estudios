<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">087 · Segmento que une los pies de dos perpendiculares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="171.16,355.86 100.90,184.12 362.41,184.12 171.16,355.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="171.16,355.86 286.30,184.12" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="171.16,355.86 106.76,184.12" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="228.73,269.99 138.96,269.99" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="159.4498909424865" y="372.4445528641947" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="166.5554471358053" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="200.707668465159" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="287.27677648949606" y="166.5554471358053" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="104.80633681552061" y="166.5554471358053" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="242.3909998852026" y="274.86677763746985" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Pie</text><text x="126.27344736540007" y="278.76988864653885" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Pie</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja A en cada bisectriz. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reflejo X respecto de B cae en el rayo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC a distancia c de B. El reflejo Y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto de C cae en CB a distancia b</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de C.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos pies son los puntos medios de</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AX y AY. Su distancia es la mitad de</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">XY.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sobre la recta BC, X e Y tienen</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abscisas c y a − b. Por desigualdad</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triangular, XY = b + c − a. La mitad</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es p − a.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>