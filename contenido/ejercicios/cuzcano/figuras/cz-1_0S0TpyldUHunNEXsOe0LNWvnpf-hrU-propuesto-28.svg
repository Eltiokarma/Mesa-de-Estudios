<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Dos cables que sujetan un émbolo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,163.09 100.90,340.92 359.04,340.92 359.04,240.53 161.13,240.53 161.13,163.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,194.64 161.13,194.64" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="359.04,214.72 359.04,366.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="299.38,217.59 359.04,217.59" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="299.38,361.57 359.04,361.57" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="131.30543933054395" y="180.30105277365362" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="289.2901201241733" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8A</text><text x="324.6176272101498" y="203.81974625455524" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cable</text><text x="324.6176272101498" y="375.90774733432306" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cable</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos cables contrarrestan en total</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">400 N adicionales sobre el émbolo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mayor.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su área es 8 m². El incremento de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">presión es 400/8 Pa.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pascal, el mismo incremento se</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aplica sobre el émbolo menor.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>