<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">073 · Suma de la fila cuarenta</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="343.70,171.96 368.82,171.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="343.70,209.64 368.82,209.64" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="343.70,247.31 368.82,247.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="343.70,284.99 368.82,284.99" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="343.70,322.66 368.82,322.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="343.70,360.34 368.82,360.34" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="170.69564146761883" y="170.66030534351145" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="382.0967741935484" y="170.66030534351145" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F1</text><text x="149.76483624722977" y="208.3357547402118" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">6</text><text x="191.6264466880079" y="208.3357547402118" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">11</text><text x="382.0967741935484" y="208.3357547402118" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F2</text><text x="170.69564146761883" y="246.01120413691208" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">16</text><text x="382.0967741935484" y="246.01120413691208" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F3</text><text x="128.8340310268407" y="283.68665353361246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">21</text><text x="170.69564146761883" y="283.68665353361246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">26</text><text x="212.55725190839698" y="283.68665353361246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">31</text><text x="382.0967741935484" y="283.68665353361246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F4</text><text x="170.69564146761883" y="321.36210293031274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">36</text><text x="382.0967741935484" y="321.36210293031274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F5</text><text x="107.90322580645164" y="359.03755232701303" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">41</text><text x="149.76483624722977" y="359.03755232701303" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">46</text><text x="191.6264466880079" y="359.03755232701303" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">51</text><text x="233.48805712878604" y="359.03755232701303" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">56</text><text x="382.0967741935484" y="359.03755232701303" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F6</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Antes de la fila 40 hay veinte filas</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de un elemento y filas pares de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tamaños 2 a 20. En total 20+209=229</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">elementos.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fila 40 tiene 21 posiciones, de la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">230 a la 250. Los valores extremos son</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5·230−4=1146 y 5·250−4=1246.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su suma es 21(1146+1246)/2=25116.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>