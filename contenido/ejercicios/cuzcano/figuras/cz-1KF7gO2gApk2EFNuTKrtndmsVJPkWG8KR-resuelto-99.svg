<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">099 · Área al prolongar los tres lados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="239.94,268.33 278.78,268.33 239.94,229.49 239.94,268.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="317.63,268.33 162.26,151.81 239.94,384.86 317.63,268.33" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="278.78,268.33 317.63,268.33" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="239.94,229.49 162.26,151.81" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="239.94,268.33 239.94,384.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="239.94214264575317" y="276.88014205386213" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="278.7849955608168" y="276.88014205386213" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="246.9338561704646" y="229.4918614974845" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="317.62784847588046" y="277.65699911216336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="158.37215152411954" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="239.94214264575317" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Z</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa coordenadas afines A=(0,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=(1,0), C=(0,1). Resultan X=(2,0),</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Y=(−2,3) y Z=(0,−3).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los vectores XY y XZ son (−4,3) y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−2,−3). Su determinante vale 18.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El determinante correspondiente a ABC</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 1. Multiplica el área real de ABC</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por la razón 18.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>