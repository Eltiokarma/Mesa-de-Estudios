<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">086 · Lanchas que cambian de dirección</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="249.29,170.71 181.55,170.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="249.29,321.25 294.45,321.25" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="181.55,170.71 294.45,321.25" fill="none" stroke="#008674" stroke-width="2.5"/><text x="256.2903225806451" y="162.70967741935482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="256.2903225806451" y="313.247311827957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="188.5483870967742" y="162.70967741935482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A1</text><text x="301.4516129032258" y="313.247311827957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B1</text><text x="258.17204301075265" y="247.38709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">desnivel80m</text><text x="197.9569892473118" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A:30m/s oeste</text><text x="261.9354838709677" y="347.1182795698925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B:20m/s este</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al girar, A está 120 m al norte de la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">boya y B 40 m: desnivel 80 m.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La separación horizontal crece a</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">30+20=50 m/s. Entonces 100²=80²+(50</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t)².</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t=60/50=6/5 s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>