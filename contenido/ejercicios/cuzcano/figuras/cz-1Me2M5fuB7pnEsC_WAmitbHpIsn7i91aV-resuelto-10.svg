<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Dos tamaños para el mismo ángulo entre rectas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,142.48 163.34,166.74 117.20,230.25 117.20,308.75 163.34,372.26 238.00,396.52 312.66,372.26 358.80,308.75 358.80,230.25 312.66,166.74 238.00,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="200.67,154.61 275.33,384.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="200.67,384.39 275.33,154.61" fill="none" stroke="#008674" stroke-width="2.5"/><text x="207.6786827051464" y="147.60504558109602" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="207.6786827051464" y="377.37938156017196" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="282.3368901535855" y="377.379381560172" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M′</text><text x="282.3368901535855" y="147.60504558109602" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N′</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De AB a EF se hacen cuatro giros</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exteriores, de modo que el giro total</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 1440°/n.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las mediatrices son rectas. Su ángulo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 36° aparece cuando el giro es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">congruente con 36° o −36° módulo 180°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para n≥6, los giros posibles son 36°,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">144° y 216°. Los dos primeros dan</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enteros n=40 y n=10. El último da 20/3</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y se descarta.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>