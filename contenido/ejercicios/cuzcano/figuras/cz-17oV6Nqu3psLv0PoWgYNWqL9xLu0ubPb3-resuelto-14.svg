<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Recta del origen al cruce de dos rectas inclinadas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,338.05 375.10,338.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,383.75 238.00,155.25" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="123.75,355.19 352.25,183.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="123.75,183.81 352.25,355.19" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,360.90 238.00,178.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="249.42473118279568" y="263.7876344086022" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="248.28225806451616" y="349.4731182795699" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma ambas igualdades. Los términos en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y y las constantes se cancelan, y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda 6x=0.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye x=0 en una de ellas y obtén</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los puntos (0,0) y (0,3) determinan el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">eje vertical.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>