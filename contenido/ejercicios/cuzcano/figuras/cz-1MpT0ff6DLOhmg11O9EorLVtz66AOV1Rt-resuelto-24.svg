<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">024 · Recta que une dos centros de polígonos regulares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="337.34530813057813" x2="421" y2="337.34530813057813" stroke="#20364b" stroke-width="1.7"/><line x1="140.073732718894" y1="105" x2="140.073732718894" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="140.07,337.35 218.41,337.35 257.59,269.50 218.41,201.65 140.07,201.65 100.90,269.50 140.07,337.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Hexágono</text><polyline points="257.59,337.35 375.10,337.35 375.10,219.83 257.59,219.83 257.59,337.35" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Cuadrado</text><polyline points="179.24,269.50 316.34,278.59" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">L</text><circle cx="179.2442396313364" cy="269.5" r="3.7" fill="#20364b"/><text x="186.2442396313364" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H</text><circle cx="316.3410138248848" cy="278.58954776191456" r="3.7" fill="#20364b"/><text x="323.3410138248848" y="270.58954776191456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro del hexágono tiene x=2 y su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">apotema es 4√3/2=2√3.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro del cuadrado es (9,3).</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa los dos puntos para obtener</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m=(3−2√3)/7 y escribe la ecuación por</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(9,3).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>