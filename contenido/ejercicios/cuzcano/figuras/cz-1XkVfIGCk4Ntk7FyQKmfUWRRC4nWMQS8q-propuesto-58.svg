<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Coseno del ángulo entre dos radios vectores</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,269.50 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,142.48 238.00,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,269.50 347.85,248.90" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,269.50 292.93,173.38" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="281.87,261.29 281.66,260.24 281.42,259.19 281.16,258.15 280.87,257.11 280.56,256.08 280.23,255.06 279.87,254.05 279.48,253.04 279.07,252.05 278.64,251.07 278.19,250.09 277.71,249.13 277.21,248.18 276.68,247.24 276.13,246.32 275.56,245.41 274.97,244.51 274.36,243.62 273.73,242.76 273.07,241.90 272.40,241.07 271.70,240.25 270.99,239.44 270.26,238.66 269.50,237.89 268.73,237.14 267.94,236.41 267.14,235.70 266.32,235.01 265.48,234.34 264.62,233.68 263.75,233.05 262.87,232.44 261.97,231.86 261.05,231.29 260.13,230.74" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="365.01612903225805" y="277.7388840453357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Re</text><text x="246.92545771578028" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Im</text><text x="358.8369659982563" y="245.46992153443767" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z₂</text><text x="297.04533565823886" y="163.08108108108104" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z₁</text><text x="279.88099389712295" y="239.97733217088054" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe z₁=r₁e^(iα) y z₂=r₂e^(iβ).</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al conjugar z₂ e introducir el</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">producto se obtiene r₁r₂e^[i(α−β)].</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La parte real es r₁r₂cos(α−β). Divide</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por el producto de módulos. El coseno</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coincide también si se toma el ángulo</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">menor entre los vectores.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>