91136955" y="231.1814906849789" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="191.368901743737" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="197.439919445676" y="348.20924173554084" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α²+β²</text><text x="177.2940901476104" y="290.2205883259591" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2αβ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De (α−β)²≥0 se deduce α²+β²≥2αβ.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La razón 2αβ/(α²+β²) queda acotada por</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La igualdad se alcanza cuando α=β.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>