<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">012 · Perpendicular que atraviesa la intersección de otras dos rectas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,225.43 375.10,225.43" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="355.51,338.05 355.51,200.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="105.80,322.38 370.20,216.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="105.80,320.10 370.20,231.96" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="105.80,317.24 370.20,251.14" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="140.073732718894" y="301.32603686635946" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja x=3y+7 de la segunda recta del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cruce y sustituye en la primera. Sale</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=−17 y x=−44.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de la recta de referencia</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es −4. La perpendicular tiene</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente 1/4.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa y+17=(x+44)/4 y ordena.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>