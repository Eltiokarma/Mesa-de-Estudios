<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Ángulo de una diagonal con dos lados iguales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.79,238.93 237.55,158.02 361.61,247.92 189.00,375.58 110.79,238.93" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="237.55,158.02 189.00,375.58" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645163" y="246.1261237440508" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="237.55050237969328" y="149.9336329984136" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="252.41909042834484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="189.00475938656797" y="389.0663670015865" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="260.92437863564254" y="193.98439978847176" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">240° − 4θ</text><text x="336.43997884717083" y="247.92411422527766" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="204.2876784769963" y="354.9045478582761" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="180.91380222104706" y="348.6115811739821" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En BCD, ∠DBC=180°−3θ y entonces</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠ABD=60°−θ. Toma E sobre DC con</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠DBE=θ. En BDE se obtiene DE=BE.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El exterior ∠BEC es 2θ, igual a ∠BCE.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así BE=BC=AB y, como ∠ABE=60°, ABE es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilátero.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En AED, AE=DE y ∠AED=120°−2θ. Por</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simetría ∠ADE=30°+θ, de modo que</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>