<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">060 · Distancia firmada en tres puntos medios</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="115.28,312.62 247.95,224.17 362.85,290.51 115.28,312.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,268.39 375.10,268.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="181.61,268.39 239.06,301.56" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="115.28,312.62 115.28,268.39" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="305.40,257.34 305.40,268.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="107.53694068678459" y="321.46409989594173" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="246.8449531737773" y="217.53590010405827" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="365.1462018730489" y="298.24609781477625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="176.0853277835588" y="261.7606659729448" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="306.54838709677415" y="254.0213319458897" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="241.31685744016647" y="310.4079084287201" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="107.53694068678459" y="290.5067637877211" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="310.97086368366286" y="266.1831425598335" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="208.14828303850155" y="280.55619146722165" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="204.83142559833504" y="298.24609781477625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Mide distancias con signo, positivo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia A. Como O es punto medio de DA y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">está en la recta, d(A)=4 cuando</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d(D)=−4.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio Q de AI tiene d(Q)=1.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces d(I)=2×1−4=−2. Por ser punto</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio de DI, d(B)=(−4−2)/2=−3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como O está en la recta, la altura</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">absoluta de B es x sen 30°=3. De ahí</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>