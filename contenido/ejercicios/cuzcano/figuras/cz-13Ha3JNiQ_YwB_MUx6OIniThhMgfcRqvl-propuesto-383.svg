-anchor="middle">Espuma sól.</text><rect x="333.0" y="347.5" width="95.0" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="371.0625" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Esponja</text><rect x="48.0" y="383.75" width="95.0" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="407.3125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Sólido</text><rect x="143.0" y="383.75" width="95.0" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="407.3125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Líquido</text><rect x="238.0" y="383.75" width="95.0" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="407.3125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Gel</text><rect x="333.0" y="383.75" width="95.0" height="36.25" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="407.3125" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Gelatina</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Fases coloidales</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En gas, líquido disperso da aerosol</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">líquido, como la niebla. Sólido</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">disperso da aerosol sólido, como humo</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">o polvo fino.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En líquido, gas da espuma, como crema</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">batida. Sólido da sol, como pintura.</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Líquido da emulsión, como leche.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En sólido, gas da espuma sólida, como</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esponja. Líquido da gel, como</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">gelatina.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>