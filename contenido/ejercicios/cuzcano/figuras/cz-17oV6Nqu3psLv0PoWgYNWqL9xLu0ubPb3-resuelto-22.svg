<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">022 · Punto de reflexión que minimiza un camino quebrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="180.84,269.50 295.16,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="206.25,396.52 206.25,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="206.25,155.19 244.35,269.50 269.75,193.29" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="206.25,383.81 269.75,193.29" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="209.42137096774195" y="150.10483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="209.42137096774195" y="386.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A′</text><text x="274.8346774193549" y="192.0201612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="248.79637096774195" y="277.1209677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja A en el eje X y obtiene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A′=(0,−9). Entonces AQ=A′Q para</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cualquier Q permitido.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mínimo se logra cuando A′, Q y B</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">están alineados, por desigualdad</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triangular.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta A′B es y=3x−9. Su corte con</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el eje X es x=3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>