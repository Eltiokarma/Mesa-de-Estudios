<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Cuatro razones de tramos vecinos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,265.18 375.10,265.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,261.78 107.18,268.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="242.22,261.78 242.22,268.58" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="309.74,261.78 309.74,268.58" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="343.50,261.78 343.50,268.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="360.38,261.78 360.38,268.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="368.82,261.78 368.82,268.58" fill="none" stroke="#008674" stroke-width="2.5"/><text x="107.18246737256834" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">J</text><text x="242.2199204073365" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="309.73864692472057" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="343.4980101834126" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="360.37769181275866" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="368.81753262743166" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada numerador de la suma dada es la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suma de dos tramos vecinos.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al separar las fracciones,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">JS/OS=JO/OS+1, y ocurre lo mismo con</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los otros tres cocientes.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma pedida se obtiene restando</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuatro unidades a 12.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>