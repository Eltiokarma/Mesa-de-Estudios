55,348.65 314.17,345.49 321.46,342.01 328.39,338.22 334.94,334.13 341.07,329.76 346.77,325.14 351.99,320.28 356.73,315.20 360.96,309.92 364.66,304.48 367.82,298.88 370.43,293.16 372.46,287.33 373.92,281.43 374.80,275.48 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,269.50 340.19,208.57 340.19,330.43 238.00,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="340.18590219757107" cy="208.56810035842295" r="3.7" fill="#20364b"/><text x="347.18590219757107" y="200.56810035842295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">L</text><circle cx="340.18590219757107" cy="330.43189964157705" r="3.7" fill="#20364b"/><text x="347.18590219757107" y="322.43189964157705" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="340.18590219757107" cy="269.5" r="3.7" fill="#20364b"/><text x="347.18590219757107" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F₂</text><circle cx="135.814097802429" cy="269.5" r="3.7" fill="#20364b"/><text x="142.814097802429" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F₁</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los semiejes son 3 y 2. El foco</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecho queda en x=√(9−4)=√5.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al sustituir x=√5 en la ecuación,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y²=16/9. El lado recto une y=−4/3 con</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=4/3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La base mide 8/3 y su distancia al</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">centro es √5. Aplica base por altura</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre dos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>