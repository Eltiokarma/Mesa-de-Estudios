<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Ángulo inferior de una figura truncada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,384.95 174.37,154.05 310.81,184.22 375.10,384.95 100.90,384.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="137.64,269.50 338.36,272.12" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="174.37,154.05 239.97,265.56 310.81,184.22" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="137.64,269.50 247.84,329.85 338.36,272.12" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="170.43556104337085" y="186.8483562278129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m</text><text x="199.29803982096" y="184.22449452075932" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m</text><text x="288.509337860781" y="193.4080104954468" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n</text><text x="312.12409322426305" y="222.27048927303593" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n</text><text x="243.9036888408705" y="249.8210371970983" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">75°</text><text x="176.99521531100476" y="282.6193085352678" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="149.4446673869424" y="302.29827133816946" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2α</text><text x="308.1883006636827" y="283.93123938879455" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="338.36271029479866" y="304.92213304522306" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="247.83948140145085" y="307.5459947522766" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo que contiene 75°,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m+n=105°. En el triángulo que resulta</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">al extender los lados, los ángulos de</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">base son 180°−2m y 180°−2n, por lo que</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el ángulo del vértice es 30°.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo exterior de base</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal, sus ángulos exteriores en</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esa base suman 180°+30°. Así,</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3α+3θ=210°.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo inferior de ángulo x,</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los otros ángulos son α y θ. Resta su</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suma de 180°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>