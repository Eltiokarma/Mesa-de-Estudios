<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">099 · Comparación de dos cocientes absolutos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="371.25" y1="275" x2="415" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="371.25" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><line x1="415" y1="275" x2="405" y2="267" stroke="#1766b0" stroke-width="3"/><line x1="415" y1="275" x2="405" y2="283" stroke="#1766b0" stroke-width="3"/><line x1="108.75" y1="275" x2="371.25" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="108.75" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="371.25" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="108.75" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">-11/18</text><text x="371.25" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">3</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Excluir 3 y −2. Se pueden cuadrar y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplicar por el producto de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">denominadores al cuadrado.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia de cuadrados de los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">numeradores cruzados factoriza como</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(18x+11)(4x²+4x+17).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segundo factor es positivo. Por</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tanto x&gt;−11/18, con x=3 excluido.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>