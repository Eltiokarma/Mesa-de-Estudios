<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">002 · Mediatrices consecutivas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,146.32 199.34,152.45 164.47,170.22 136.80,197.89 119.03,232.76 112.90,271.42 119.03,310.08 136.80,344.95 164.47,372.62 199.34,390.39 238.00,396.52 276.66,390.39 311.53,372.62 339.20,344.95 356.97,310.08 363.10,271.42 356.97,232.76 339.20,197.89 311.53,170.22 276.66,152.45 238.00,146.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="218.67,149.39 257.33,393.45" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="181.91,161.33 294.09,381.51" fill="none" stroke="#008674" stroke-width="2.5"/><text x="225.57346667549925" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="188.80871425283397" y="154.4294631569923" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="264.230215031404" y="386.5529744522482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A′</text><text x="300.9949674540693" y="374.6073822629978" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B′</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los rayos desde el centro a los puntos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medios giran un ángulo central de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">360°/n.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si ese giro fuera el suplemento 162°,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">n no sería entero. Entonces</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">n=360/18=20.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula 20(20−3)/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>