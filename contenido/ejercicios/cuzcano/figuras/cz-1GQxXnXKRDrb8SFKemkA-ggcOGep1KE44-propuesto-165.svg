58064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(3,3) abierto</text><circle cx="128.3225806451613" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="135.3225806451613" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,9)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El primer tramo es (∣x∣−3)², con ∣x∣</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 0 a 1. Su imagen es [4,9].</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el segundo, el signo es −1 para</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1&lt;x&lt;3 y 0 en x=3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El tercer tramo crece desde 3 sin</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanzarlo y sin cota superior. Su</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rango (3,∞) ya contiene [4,9].</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>