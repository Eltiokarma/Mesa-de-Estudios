<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Estacas en vértices, mitades y tercios</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,326.08 375.10,326.08 375.10,212.92 100.90,212.92 100.90,326.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Contorno</text><circle cx="100.90322580645162" cy="326.0796210957501" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="318.0796210957501" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Vértice</text><circle cx="192.3010752688172" cy="326.0796210957501" r="3.7" fill="#20364b"/><text x="199.3010752688172" y="318.0796210957501" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">⅓</text><circle cx="283.6989247311828" cy="326.0796210957501" r="3.7" fill="#20364b"/><text x="290.6989247311828" y="318.0796210957501" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">⅔</text><circle cx="375.0967741935484" cy="326.0796210957501" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="318.0796210957501" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Vértice</text><circle cx="100.90322580645162" cy="212.9203789042499" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="204.9203789042499" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Vértice</text><circle cx="192.3010752688172" cy="212.9203789042499" r="3.7" fill="#20364b"/><text x="199.3010752688172" y="204.9203789042499" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">⅓</text><circle cx="283.6989247311828" cy="212.9203789042499" r="3.7" fill="#20364b"/><text x="290.6989247311828" y="204.9203789042499" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">⅔</text><circle cx="375.0967741935484" cy="212.9203789042499" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="204.9203789042499" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Vértice</text><circle cx="100.90322580645162" cy="269.5" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">½</text><circle cx="375.0967741935484" cy="269.5" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">½</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La separación d debe dividir</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1890/3=630 y 780/2=390. Por tanto d</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">divide 30.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El perímetro es 5340 m y se colocan</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5340/d estacas. Para que esa cantidad</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sea múltiplo de 10, d debe dividir</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">534.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se minimizan las estacas eligiendo el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mayor d común a 30 y 534. Ese mcd es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">6, con 890 estacas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>