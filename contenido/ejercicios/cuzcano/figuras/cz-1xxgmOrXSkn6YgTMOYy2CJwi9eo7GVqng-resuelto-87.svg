<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">087 · Dos lados iguales en triángulos cruzados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.10,335.44 156.72,206.01 371.42,335.44 110.10,335.44 320.50,204.79 371.42,335.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="341.5754853142816" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="151.8161218156888" y="197.4245146857184" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="340.9620769286281" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="319.89001948473697" y="197.4245146857184" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="162.24406437179766" y="225.0278920401241" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4x</text><text x="320.50342787039045" y="224.41448365447064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5x</text><text x="351.17384715306343" y="316.4257415024897" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2x</text><text x="346.87998845348926" y="332.3743595294797" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="131.57364508912462" y="274.10056289240094" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=</text><text x="347.4933968391427" y="274.10056289240094" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ley de senos en RAD da RA/RD=sen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x/sen4x. En RED, el ángulo en R es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°−8x, así que DE/RD=sen8x/sen5x.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala y aplica producto a suma:</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos4x−cos6x=cos4x−cos12x. De aquí</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos6x=cos12x.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las soluciones verifican 6x≡±12x</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">módulo 360°. Como 0&lt;x&lt;22,5°, la única</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 18x=360°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>