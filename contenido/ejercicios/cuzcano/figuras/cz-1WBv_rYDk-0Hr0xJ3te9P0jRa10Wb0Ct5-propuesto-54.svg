<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Referencia de oxígeno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,214.66 375.10,214.66 375.10,167.66 100.90,167.66 100.90,214.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,293.00 375.10,293.00 375.10,246.00 100.90,246.00 100.90,293.00" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,371.34 375.10,371.34 375.10,324.34 100.90,324.34 100.90,371.34" fill="none" stroke="#008674" stroke-width="2.5"/><text x="115.73732718894009" y="183.15898617511522" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P absoluta; T kelvin</text><text x="115.73732718894009" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">PV = nRT</text><text x="115.73732718894009" y="339.8410138248848" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">conservar n o balance</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con la referencia dada,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Mgas/32=(1,40/1,45)(320/273).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Mgas≈36,2157 g/mol.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Medio mol pesa≈18,1079 g. Usar R=0,082</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">directamente da 18,368 g porque la</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">densidad O2 de referencia es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximada e inconsistente con ese R.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>