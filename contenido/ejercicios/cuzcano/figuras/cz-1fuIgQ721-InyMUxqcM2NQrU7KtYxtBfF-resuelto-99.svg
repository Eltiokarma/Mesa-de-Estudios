<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">099 · Animales y recuperación del capital</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,200.95 375.10,200.95 375.10,155.25 100.90,155.25 100.90,200.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,292.35 375.10,292.35 375.10,246.65 100.90,246.65 100.90,292.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,383.75 375.10,383.75 375.10,338.05 100.90,338.05 100.90,383.75" fill="none" stroke="#008674" stroke-width="2.5"/><text x="112.47311827956989" y="170.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">capital240k,benef48k</text><text x="112.47311827956989" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">pendiente288+48a</text><text x="112.47311827956989" y="352.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a≥1→benef336</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Capital 240 k, beneficio 48 k. Si</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">faltan aperros y 12−agatos, el ingreso</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente es 72 a+24(12−a)=288+48 a.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Recuperar capital antes de terminar</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivale a ingreso</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente=beneficio⇒k=6+a.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si quedan ambos tipos, a≥1: mínimo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k=7, beneficio 336. Si se permiten 12</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">gatos solos, a 0⇒beneficio 288.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>