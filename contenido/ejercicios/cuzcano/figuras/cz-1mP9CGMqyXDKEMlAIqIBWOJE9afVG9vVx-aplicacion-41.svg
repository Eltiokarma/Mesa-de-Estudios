<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Voltaje para sostener una varilla inclinada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,391.16 284.25,147.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,391.16 375.10,391.16" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="171.95,296.87 213.20,242.13 182.79,219.21 141.54,273.95 171.95,296.87" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="306.55,307.37 306.55,193.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="312.26,206.84 306.55,193.13 300.84,206.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="161.07347670250897" y="378.96956694268795" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53°</text><text x="323.3046594982079" y="187.03408307172023" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="175.85418830872845" y="254.99066246614842" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La varilla es transversal a la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente. Su fuerza magnética es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal y se orienta cuesta arriba</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en proyección.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Proyecta las fuerzas en la pendiente:</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ILB cos 53°=mg sen 53°. Con tan</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">53°≈4/3, ILB≈0,8 N.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De I≈0,8 A y la ley de Ohm se obtiene</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">V≈5×0,8 V.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>