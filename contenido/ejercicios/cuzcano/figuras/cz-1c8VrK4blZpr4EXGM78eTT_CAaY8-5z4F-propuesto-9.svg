e="#a3b9cc"/><text x="285.5" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="333.0" y="322" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">9a</text><rect x="48.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[32,36)</text><rect x="143.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="238.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="333.0" y="370" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">140</text><text x="48" y="445" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Meses de estudio</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si la amplitud es w y el primer límite</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es L, entonces L+w/2=18 y L+3w=28. Por</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tanto w=4 y L=16.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la lectura agrupada, el 65 % queda</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">antes de 28 meses. Ese acumulado vale</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">91 y, según la tabla, es 3a+4a=7a.</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces a=13.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Menos de 24 meses corresponde a las</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos primeras clases y su acumulado es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3a.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>