<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">039 · Máxima unión y máxima intersección</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">categorías</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">cantidad</text><polyline points="100.90,396.52 100.90,142.48 192.30,142.48 192.30,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="283.70,396.52 283.70,298.81 375.10,298.81 375.10,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="146.6021505376344" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="153.6021505376344" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">13</text><circle cx="329.3978494623656" cy="298.81141439205953" r="3.7" fill="#20364b"/><text x="336.3978494623656" y="290.81141439205953" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A y B tienen8 elementos; C y D</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen5.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La unión máxima es8+5=13, alcanzada si</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A y C son disjuntos.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La intersección máxima es min(8,5)=5,</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanzada con D⊆B.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>