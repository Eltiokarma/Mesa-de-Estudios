<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">074 · Ángulo con tres lados consecutivos iguales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.45,324.42 175.53,220.45 307.18,208.71 366.71,324.42 108.45,324.42" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="175.53,220.45 366.71,324.42" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="175.53,220.45 179.72,324.42" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="307.18,208.71 276.99,275.79" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="333.6461970997336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="176.3693400414324" y="212.90041432376447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="306.33875900167703" y="201.161240998323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="331.9691723389563" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="178.88487718259842" y="337.838759001677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="271.9597514057414" y="285.85099141757917" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="131.08967150044393" y="319.39148663312614" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50°</text><text x="310.53132090362044" y="241.4098352569794" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como BC=CD, los ángulos CBD y BDC</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valen 40°. La altura CM cae en el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto medio M de BD.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Traza BH perpendicular a AD. Los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulos rectángulos ABH y CDM</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen hipotenusas iguales y ángulos</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agudos de 50°. Entonces BH=DM=BD/2.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En BHD, ∠BDH=30° y ∠HBD=60°. En B,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠ABC=∠ABH+∠HBD+∠DBC=40°+60°+40°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>