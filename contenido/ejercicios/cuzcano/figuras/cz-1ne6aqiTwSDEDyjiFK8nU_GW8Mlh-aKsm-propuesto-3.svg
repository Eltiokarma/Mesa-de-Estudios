<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Rango de una cuadrática en el seno absoluto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.48387096774195" x2="421" y2="142.48387096774195" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">t = ∣sen x∣</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f</text><polyline points="100.90,142.48 105.47,150.88 110.04,159.14 114.61,167.25 119.18,175.23 123.75,183.06 128.32,190.75 132.89,198.30 137.46,205.71 142.03,212.98 146.60,220.10 151.17,227.09 155.74,233.94 160.31,240.64 164.88,247.20 169.45,253.62 174.02,259.90 178.59,266.04 183.16,272.04 187.73,277.90 192.30,283.61 196.87,289.19 201.44,294.62 206.01,299.91 210.58,305.06 215.15,310.07 219.72,314.94 224.29,319.67 228.86,324.26 233.43,328.70 238.00,333.01 242.57,337.17 247.14,341.19 251.71,345.07 256.28,348.81 260.85,352.41 265.42,355.87 269.99,359.19 274.56,362.36 279.13,365.40 283.70,368.29 288.27,371.04 292.84,373.65 297.41,376.12 301.98,378.45 306.55,380.64 311.12,382.69 315.69,384.59 320.26,386.35 324.83,387.98 329.40,389.46 333.97,390.80 338.54,392.00 343.11,393.06 347.68,393.98 352.25,394.75 356.82,395.39 361.39,395.88 365.96,396.23 370.53,396.45 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">t²−2t</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El desplazamiento x−π/2 recorre toda</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la recta real. Pon t=∣sen x∣, que</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recorre [0,1].</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Reescribe t²−2t=(t−1)²−1. El cuadrado</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recorre [0,1].</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al restar 1 resulta [−1,0]. Los</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos se alcanzan con t=1 y t=0.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>