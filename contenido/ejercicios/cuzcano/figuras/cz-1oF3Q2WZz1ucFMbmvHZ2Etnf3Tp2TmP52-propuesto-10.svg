<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Medios de dos tramos asimétricos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,280.75 375.10,280.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,277.35 107.18,284.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="205.30,277.35 205.30,284.15" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="270.70,277.35 270.70,284.15" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="303.41,277.35 303.41,284.15" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="336.11,277.35 336.11,284.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="368.82,277.35 368.82,284.15" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="270.70,254.59 303.41,254.59" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="270.70,251.45 270.70,257.73" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="303.41,251.45 303.41,257.73" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="107.18246737256834" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="205.29561684314208" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="270.70438315685794" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="303.40876631371583" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="336.1131494705738" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="368.81753262743166" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="287.05657473528686" y="246.21447919231716" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ecuación implica x³=1 con x≠1. Los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exponentes 123 y 111 también son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">múltiplos de 3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia DR−RO se reduce a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">31+1/8+1−1/8=32.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con R como origen, el promedio de las</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coordenadas −DR/2 y RO/2 es −32/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>