27 351.99,330.43 356.73,324.34 360.96,318.01 364.66,311.47 367.82,304.75 370.43,297.89 372.46,290.90 373.92,283.82 374.80,276.67 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="210.61,162.03 375.07,267.29" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="152.36,355.14 323.64,183.86" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="292.83870967741933" cy="214.66129032258067" r="3.7" fill="#20364b"/><text x="299.83870967741933" y="206.66129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P(2,2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe los extremos como (2±u,2±v),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con signos correspondientes. Al restar</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sus ecuaciones se obtiene 16u+25v=0.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuerda tiene pendiente −16/25 y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pasa por P. Su recta es 16x+25y=82.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El diámetro conjugado contiene al</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">centro y a P. La recta que los une es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=x.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>