<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Harina de S/ 5 y S/ 8</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,224.18 100.90,314.82 171.15,314.82 171.15,224.18 100.90,224.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="191.55,224.18 191.55,314.82 261.79,314.82 261.79,224.18 191.55,224.18" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="304.85,224.18 304.85,314.82 375.10,314.82 375.10,224.18 304.85,224.18" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="266.33,269.50 298.05,269.50 286.72,261.34" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="298.05,269.50 286.72,277.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="136.25379898693683" y="251.3715009330845" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">120 kg</text><text x="226.89629432151426" y="251.3715009330845" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60 kg</text><text x="340.19941348973606" y="251.3715009330845" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">180 kg</text><text x="136.25379898693683" y="286.2688616368968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S/ 5/kg</text><text x="226.89629432151426" y="286.2688616368968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S/ 8/kg</text><text x="340.19941348973606" y="286.2688616368968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S/ 6/kg</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia entre el precio medio y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los precios individuales es de S/ 1 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">S/ 2, respectivamente.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para equilibrar los costos, la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cantidad de harina barata debe ser el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">doble de la cara.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tres partes suman 180 kg. Dos partes</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son 120 kg y la otra 60 kg.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>