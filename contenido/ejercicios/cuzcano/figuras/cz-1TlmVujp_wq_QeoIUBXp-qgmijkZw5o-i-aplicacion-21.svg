<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Dos ecos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="225.54,271.94 100.90,271.94 225.54,271.94" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">trayecto izquierdo</text><line x1="225.5366568914956" y1="271.9437927663734" x2="216.4057674883725" y2="276.0213972969691" stroke="#1766b0" stroke-width="2"/><line x1="225.5366568914956" y1="271.9437927663734" x2="216.4057674883725" y2="267.8661882357777" stroke="#1766b0" stroke-width="2"/><polyline points="225.54,267.06 375.10,267.06 225.54,267.06" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">trayecto derecho</text><line x1="225.5366568914956" y1="267.0562072336266" x2="234.6675462946187" y2="262.9786027030309" stroke="#d37618" stroke-width="2"/><line x1="225.5366568914956" y1="267.0562072336266" x2="234.6675462946187" y2="271.1338117642223" stroke="#d37618" stroke-width="2"/><text x="107.90322580645162" y="263.9437927663734" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">pared 1</text><text x="382.09677419354836" y="259.0562072336266" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">pared 2</text><text x="232.5366568914956" y="263.9437927663734" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">persona</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada eco recorre ida y vuelta:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d₁=340·3/2=510 m.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d₂=340·3,6/2=612 m.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La separación es d₁+d₂=1122 m. Se</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interpreta 3,6 s medidos desde la</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">emisión.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>