3" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="195.01,257.33 243.68,257.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><line x1="243.67856461156708" y1="257.33164726092764" x2="234.547675208444" y2="261.40925179152333" stroke="#1766b0" stroke-width="2"/><line x1="243.67856461156708" y1="257.33164726092764" x2="234.547675208444" y2="253.25404273033195" stroke="#1766b0" stroke-width="2"/><polyline points="195.01,257.33 146.33,257.33" fill="none" stroke="#d37618" stroke-width="2.5"/><line x1="146.33174269898836" y1="257.33164726092764" x2="155.46263210211146" y2="253.25404273033195" stroke="#d37618" stroke-width="2"/><line x1="146.33174269898836" y1="257.33164726092764" x2="155.46263210211146" y2="261.40925179152333" stroke="#d37618" stroke-width="2"/><text x="120.8828020614621" y="216.88270662340142" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><text x="202.0051536552777" y="216.88270662340142" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">q</text><text x="339.91315136476425" y="208.77047146401983" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4Q</text><text x="149.27562511929756" y="277.7244703187631" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">30 cm</text><text x="258.79079977094864" y="277.7244703187631" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">60 cm</text><text x="161.44397785836992" y="314.22952853598014" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">total: 90 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El dibujo coloca las dos cargas fuente</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con el mismo signo. Sus campos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">eléctricos se oponen entre ellas; el</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resultado no depende del signo de q≠0.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Igualar módulos:</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k∣Qq∣/x²=4k∣Qq∣/(0,90−x)². Como</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0&lt;x&lt;0,90, se obtiene 1/x=2/(0,90−x).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,90−x=2x: x=0,30 m desde Q y 0,60 m</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde 4Q. No se afirma estabilidad</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frente a perturbaciones</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tridimensionales.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>