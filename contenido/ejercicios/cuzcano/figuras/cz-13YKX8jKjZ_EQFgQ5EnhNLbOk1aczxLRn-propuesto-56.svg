<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">056 · Área desde una bisectriz y una mediatriz</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,364.52 284.95,364.52 375.10,174.48 191.05,174.48" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,364.52 284.95,364.52 375.10,174.48 191.05,174.48 100.90,364.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,364.52 284.95,364.52 284.95,248.12" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,364.52 284.95,248.12" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="284.95,248.12 375.10,174.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.9032258064516" y="364.52204193170564" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="284.9509500662837" y="364.52204193170564" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="191.0490499337163" y="174.47795806829438" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.0967741935484" y="174.47795806829438" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="284.9509500662837" y="248.12004056536625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon A=(0,0), B=(7,0), O=(7,7tan(θ/2)),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">donde θ=BAD.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como O equidista de B y C, su</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección desde B sobre BC mide 4.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así 7tan(θ/2)sinθ=4, equivalente a</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">7(1−cosθ)=4.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Obtén cosθ=3/7 y sinθ=2√10/7.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica AB·AD sinθ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>