<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Masas distintas y trabajo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="303.7741935483871" x2="421" y2="303.7741935483871" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645164" y1="105" x2="100.90322580645164" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="100.90,235.23 169.45,235.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F1</text><line x1="169.45161290322582" y1="235.2258064516129" x2="160.32072350010273" y2="239.3034109822086" stroke="#1766b0" stroke-width="2"/><line x1="169.45161290322582" y1="235.2258064516129" x2="160.32072350010273" y2="231.1482019210172" stroke="#1766b0" stroke-width="2"/><polyline points="306.55,235.23 375.10,235.23" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">F2</text><line x1="375.09677419354836" y1="235.2258064516129" x2="365.96588479042526" y2="239.3034109822086" stroke="#d37618" stroke-width="2"/><line x1="375.09677419354836" y1="235.2258064516129" x2="365.96588479042526" y2="231.1482019210172" stroke="#d37618" stroke-width="2"/><circle cx="100.90322580645164" cy="235.2258064516129" r="3.7" fill="#20364b"/><text x="107.90322580645164" y="227.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m</text><circle cx="306.54838709677415" cy="235.2258064516129" r="3.7" fill="#20364b"/><text x="313.54838709677415" y="227.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I falsa: el trabajo de cada fuerza</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aplicada es Fd, independientemente del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rozamiento.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">II verdadera en la prueba lisa:</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d=Ft²/(2m), por lo que duplicar masa</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reduce trabajo a la mitad.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">III falsa: con igual d, trabajos</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iguales requieren F1=F2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>