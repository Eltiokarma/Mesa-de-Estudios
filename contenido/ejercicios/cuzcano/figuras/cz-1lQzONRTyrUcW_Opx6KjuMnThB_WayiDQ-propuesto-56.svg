<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">056 · Altura de un tetraedro a partir de áreas de sus caras</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="301.51,396.52 260.23,331.74 174.49,142.48" fill="#f4c581" fill-opacity="0.45"/><polyline points="174.49,396.52 301.51,396.52 260.23,331.74 174.49,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="174.49,396.52 301.51,396.52 174.49,142.48 174.49,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="174.49,396.52 260.23,331.74 174.49,142.48 174.49,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="301.51,396.52 260.23,331.74 174.49,142.48 301.51,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="174.49,396.52 271.94,342.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="174.49193548387098" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="301.508064516129" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="260.2278225806451" y="331.73790322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="174.49193548387098" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="271.9403754627182" y="342.0449497620307" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama x,y,z a las aristas desde O.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces A=xy/2, B=yz/2, C=xz/2 y el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">volumen es xyz/6.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área de MNP es √(A²+B²+C²) porque</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las tres áreas dadas son sus</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyecciones sobre tres planos</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coordenados.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa 3V/área y observa que</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(xyz/2)²=2ABC.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>