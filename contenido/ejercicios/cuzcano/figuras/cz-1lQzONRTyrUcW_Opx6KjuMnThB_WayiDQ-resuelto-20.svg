<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">020 · Ángulo de apertura de un libro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="236.72,396.52 236.72,179.99 344.98,179.99 344.98,396.52" fill="#f4c581" fill-opacity="0.45"/><polygon points="344.98,288.25 131.02,142.48 131.02,359.01" fill="#f4c581" fill-opacity="0.45"/><polyline points="236.72,396.52 236.72,179.99 131.02,142.48 131.02,359.01 236.72,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="236.72,396.52 236.72,179.99 344.98,179.99 344.98,396.52 236.72,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="344.98,288.25 131.02,142.48 131.02,359.01 344.98,288.25" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="344.98,179.99 131.02,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="236.71782537098102" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="236.71782537098102" y="179.9876957419518" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="131.01795798386587" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="131.01795798386587" y="359.0123042580482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="344.98204201613413" y="179.9876957419518" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="344.98204201613413" y="288.25191238710494" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="344.98204201613413" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="234.71493736304566" y="168.29516034427525" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La arista CD mide 2k. Si O es el punto</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superior encima de M, entonces OM=k.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para MC=2k se requiere</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OC=√((2k)²−k²)=k√3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos lados superiores de las tapas</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">parten de B y miden k. Por cosenos,</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3k²=2k²−2k² cos θ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>