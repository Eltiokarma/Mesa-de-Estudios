<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">125 · Ceviana con ángulos en razón cuatro a tres</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.82,338.92 176.64,201.48 363.88,338.92 112.82,338.92" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="176.64,201.48 267.10,338.92" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645159" y="349.4438990182328" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="176.63955119214586" y="187.4523141654979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="350.14516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="267.1023842917251" y="351.5476858345021" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="182.95091164095373" y="235.83941093969145" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3t</text><text x="213.8064516129032" y="233.0343618513324" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4t</text><text x="336.5273492286115" y="328.40603085554" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea t = ∠BCA. Entonces B = 7t y A =</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180° − 8t.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ley de senos en ABC y QBC, con QC =</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB, da sen t/sen 8t = sen 4t/sen 5t.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con producto a suma, esta igualdad se</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reduce a cos 6t = cos 12t. En 0° &lt; t &lt;</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">22,5° la solución es t = 20°, de modo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que A = 20°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>