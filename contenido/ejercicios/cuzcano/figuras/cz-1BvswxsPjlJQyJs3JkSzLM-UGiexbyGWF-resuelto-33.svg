<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">033 · Cuadrado multiplicativo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,396.52 110.98,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="195.66,396.52 195.66,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="280.34,396.52 280.34,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="365.02,396.52 365.02,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="110.98,396.52 365.02,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.98,311.84 365.02,311.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.98,227.16 365.02,227.16" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.98,142.48 365.02,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="147.6209677419355" y="181.0564516129032" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5</text><text x="232.2983870967742" y="181.0564516129032" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">100</text><text x="316.9758064516129" y="181.0564516129032" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><text x="147.6209677419355" y="265.73387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="232.2983870967742" y="265.73387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">10</text><text x="316.9758064516129" y="265.73387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">25</text><text x="147.6209677419355" y="350.41129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">50</text><text x="232.2983870967742" y="350.41129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="316.9758064516129" y="350.41129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">20</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea b el centro; en cuadrado</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplicativo positivo el producto</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">común es b³ y casillas opuestas</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplican b².</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La casilla superior central es b².</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Fila superior:5b²x=b³⇒b=5x. Primera</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">columna y diagonal opuesta dan bx=20.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b²=100; b=10,x=2. Un testigo</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es[5,100,2;4,10,25;50,1,20].</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>