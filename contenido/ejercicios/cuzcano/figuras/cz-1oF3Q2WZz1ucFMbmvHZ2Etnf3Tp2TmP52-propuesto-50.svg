<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">050 · Mayor sector con el otro en su mínimo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="144.42,310.06 314.05,389.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="144.42,310.06 331.58,310.06" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="144.42,310.06 251.77,156.75" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="187.81,330.29 188.08,329.70 188.35,329.10 188.60,328.50 188.85,327.90 189.09,327.29 189.32,326.68 189.54,326.07 189.76,325.45 189.96,324.83 190.16,324.21 190.35,323.58 190.53,322.96 190.70,322.33 190.86,321.69 191.02,321.06 191.16,320.42 191.30,319.78 191.43,319.14 191.55,318.50 191.66,317.86 191.76,317.21 191.85,316.57 191.94,315.92 192.01,315.27 192.08,314.62 192.14,313.97 192.19,313.32 192.23,312.67 192.26,312.02 192.28,311.37 192.29,310.71 192.30,310.06" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="207.97,310.06 207.94,308.15 207.85,306.25 207.71,304.35 207.51,302.45 207.25,300.56 206.94,298.68 206.57,296.81 206.15,294.96 205.67,293.11 205.13,291.28 204.54,289.47 203.89,287.68 203.20,285.90 202.44,284.15 201.64,282.42 200.79,280.72 199.88,279.04 198.93,277.39 197.92,275.77 196.87,274.18 195.77,272.62 194.62,271.10 193.43,269.61 192.20,268.16 190.92,266.75 189.60,265.37 188.24,264.04 186.84,262.74 185.40,261.49 183.92,260.28 182.41,259.12 180.87,258.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="144.4188883031761" y="328.34094724361546" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="329.82468559470016" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="261.7569471948585" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="214.53457592684987" y="325.6042596025952" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="222.0212112382679" y="269.6627735226022" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ψ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide por x²: θ=x²+1+1/x² grados.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como x²+1/x²≥2 con igualdad en x=1, el</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mínimo de θ es 3°.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De θ+ψ&lt;90° resulta ψ&lt;87°. El mayor</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entero posible es 86°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>