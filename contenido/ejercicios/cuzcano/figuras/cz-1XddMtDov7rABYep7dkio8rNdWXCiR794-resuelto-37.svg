<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">037 · Suma de la fila n de impares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="345.93,213.88 369.26,213.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="345.93,248.89 369.26,248.89" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="345.93,283.89 369.26,283.89" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="345.93,318.89 369.26,318.89" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="166.24227865477008" y="212.1062685884237" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="205.13498055364906" y="212.1062685884237" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="382.0967741935484" y="212.1062685884237" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F1</text><text x="146.7959277053306" y="247.10970029741478" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="185.68862960420958" y="247.10970029741478" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5</text><text x="224.58133150308853" y="247.10970029741478" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">7</text><text x="382.0967741935484" y="247.10970029741478" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F2</text><text x="127.34957675589112" y="282.11313200640586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">7</text><text x="166.24227865477008" y="282.11313200640586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">9</text><text x="205.13498055364906" y="282.11313200640586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">11</text><text x="244.027682452528" y="282.11313200640586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">13</text><text x="382.0967741935484" y="282.11313200640586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F3</text><text x="107.90322580645163" y="317.1165637153969" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">13</text><text x="146.7959277053306" y="317.1165637153969" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">15</text><text x="185.68862960420958" y="317.1165637153969" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">17</text><text x="224.58133150308853" y="317.1165637153969" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">19</text><text x="263.4740334019675" y="317.1165637153969" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">21</text><text x="382.0967741935484" y="317.1165637153969" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fila n tiene n+1 impares y avanza</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2n desde su primero hasta su último.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su primer elemento es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1+2(1+…+n−1)=1+n(n−1). El promedio es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ese primero más n, o n²+1.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplicar por el número de elementos</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da (n+1)(n²+1).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>