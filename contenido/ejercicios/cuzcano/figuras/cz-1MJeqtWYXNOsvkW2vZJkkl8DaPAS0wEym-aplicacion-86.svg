<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">086 · Punto de aplicación de la reacción del piso</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,276.08 375.10,276.08 375.10,287.60 100.90,287.60 100.90,276.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="155.74,213.02 155.74,276.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="150.81,265.66 155.74,276.08 160.68,265.66" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,213.02 238.00,276.08" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="233.06,265.66 238.00,276.08 242.94,265.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="176.31,339.15 176.31,287.60" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="181.24,298.02 176.31,287.60 171.37,298.02" fill="none" stroke="#008674" stroke-width="2.5"/><text x="155.74193548387098" y="199.85483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">300 N</text><text x="237.99999999999997" y="199.85483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100 N</text><text x="188.64516129032256" y="324.88709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="128.87096774193546" y="302.40322580645164" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,20 m</text><text x="336.7096774193548" y="300.2096774193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L = 1 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La reacción vertical total vale 400 N.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto del extremo izquierdo, los</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pesos producen un momento horario de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">300×0,20+100×0,50=110 N·m.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para equilibrar el momento, la</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reacción debe actuar a una distancia x</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tal que 400x=110.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>