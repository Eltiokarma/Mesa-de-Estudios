"142.48387096774195" x2="242.0776045305957" y2="151.61476037086504" stroke="#008674" stroke-width="2"/><line x1="238.0" y1="142.48387096774195" x2="233.9223954694043" y2="151.61476037086504" stroke="#008674" stroke-width="2"/><polyline points="238.00,281.05 220.68,281.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">suelo:fricción (N)</text><line x1="220.67961876832842" y1="281.0469208211143" x2="229.81050817145152" y2="276.96931629051863" stroke="#b0467a" stroke-width="2"/><line x1="220.67961876832842" y1="281.0469208211143" x2="229.81050817145152" y2="285.12452535171" stroke="#b0467a" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Radial sobre esfera: N−mg</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sin53°=mv²/R; N≈8+2=10 N.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La canaleta recibe componente</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal Ncos53°=6 N y vertical</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia abajo Nsin53°=8 N.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Normal del suelo=40+8=48 N;</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">μ=6/48=0,125.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>