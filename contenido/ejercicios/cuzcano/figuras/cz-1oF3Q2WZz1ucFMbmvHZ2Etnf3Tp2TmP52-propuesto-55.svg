<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">055 · Cuatro múltiplos de un ángulo en un zigzag</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="114.95,245.68 273.72,245.68" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="114.95,376.67 241.97,376.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="154.65,178.21 337.23,297.28" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="146.71,223.85 353.11,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="261.82,146.45 361.05,333.01 190.37,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="162.58417338709677" y="207.97656250000003" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7x</text><text x="281.6617943548387" y="155.5824092741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8x</text><text x="245.93850806451616" y="236.95211693548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4x</text><text x="226.0922379032258" y="385.79914314516134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2x</text><text x="347.1544858870967" y="327.05418346774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊥</text><text x="122.89163306451613" y="235.76134072580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="124.87626008064515" y="366.74672379032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta que corta L₁ a 4x tiene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclinación −4x. La que la corta</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">formando el sector de 7x tiene</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclinación 7x−4x=3x.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta inferior sube a 2x. Su</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular tiene orientación</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">90°+2x.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el cruce superior, (90°+2x)−3x=8x.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resuelve.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>