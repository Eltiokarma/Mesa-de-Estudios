 points="136.39,345.71 339.61,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="136.39,193.29 339.61,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="237.99999999999997" cy="294.9032258064516" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="286.9032258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="237.99999999999997" cy="244.09677419354838" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="236.09677419354838" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completa cuadrados: (x−1)²+y²=1. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">centro es (1,0).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de L es 1, así que la de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la perpendicular es −1.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica la forma punto-pendiente desde</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1,0).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>