ont-size="13" fill="#20364b" text-anchor="middle">O</text><text x="185.99952816508855" y="195.38838247662864" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="223.76622508224384" y="326.4044796039662" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama 2α y 2β a los arcos DR y RO, y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x al arco PN. El dato implica</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α+β=140°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo DMR vale α+x por el cruce</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interior de las cuerdas DN y PR. En el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">círculo derecho, RMO vale β por ser</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inscrito.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos ángulos son suplementarios</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">porque D,M,O están alineados. Así</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=40° y PN=2x.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>