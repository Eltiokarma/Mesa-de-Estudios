<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">047 · Cotangente entre un radio tangente y una visual</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="127.55,378.84 127.55,157.95 348.45,157.95 348.45,378.84 127.55,378.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="127.55,157.95 348.45,378.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="219.05,378.84 348.45,157.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="219.05,378.84 283.75,314.14" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="310.55,378.84 310.46,374.85 310.20,370.87 309.77,366.90 309.16,362.96 308.38,359.04 307.43,355.16 306.31,351.33 305.03,347.55 303.58,343.83 301.98,340.18 300.21,336.59 298.29,333.09 296.22,329.68 294.00,326.36 291.64,323.14 289.14,320.03 286.51,317.03 283.75,314.14 280.87,311.38 277.86,308.75 274.75,306.25 271.53,303.89 268.21,301.68 264.80,299.60 261.30,297.68 257.72,295.92 254.07,294.31 250.34,292.86 246.56,291.58 242.73,290.46 238.85,289.51 234.94,288.74 230.99,288.13 227.02,287.69 223.04,287.43 219.05,287.35 215.06,287.43 211.08,287.69 207.11,288.13 203.16,288.74 199.25,289.51 195.37,290.46 191.54,291.58 187.76,292.86 184.03,294.31 180.38,295.92 176.80,297.68 173.30,299.60 169.89,301.68 166.57,303.89 163.35,306.25 160.24,308.75 157.23,311.38 154.35,314.14 151.59,317.03 148.96,320.03 146.46,323.14 144.10,326.36 141.88,329.68 139.81,333.09 137.89,336.59 136.12,340.18 134.52,343.83 133.07,347.55 131.79,351.33 130.67,355.16 129.72,359.04 128.94,362.96 128.33,366.90 127.90,370.87 127.64,374.85 127.55,378.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="114.29733520336607" y="394.30715287517535" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="112.08835904628333" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="359.4936886395511" y="144.6928471248247" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="363.9116409537166" y="394.30715287517535" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="219.04998046811005" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="297.6423562412342" y="314.78401122019636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="255.67180925666196" y="330.2468443197756" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si r=AO, la distancia de O=(r,0) a la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diagonal x+y=1 es r. Así,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r=(1−r)/√2=√2−1.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de OM es 1 y la de OC es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/(1−r). La cotangente de la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia es (2−r)/r.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al restar uno queda 2/r−2=2√2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>