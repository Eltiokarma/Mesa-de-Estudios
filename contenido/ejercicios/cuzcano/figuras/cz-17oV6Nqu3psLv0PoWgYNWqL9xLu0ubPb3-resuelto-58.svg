<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Ángulo entre dos pendientes complementarias</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,370.31 365.02,370.31" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="137.19,396.52 137.19,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="338.81,311.50 137.19,370.31 196.00,168.69" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="177.52,358.55 177.10,357.20 176.64,355.88 176.14,354.57 175.59,353.27 175.00,352.00 174.36,350.75 173.69,349.51 172.97,348.31 172.22,347.12 171.42,345.96 170.59,344.83 169.72,343.73 168.81,342.66 167.87,341.62 166.89,340.61 165.88,339.63 164.84,338.69 163.77,337.78 162.67,336.91 161.54,336.08 160.38,335.28 159.19,334.53 157.99,333.81 156.75,333.14 155.50,332.50 154.23,331.91 152.93,331.36 151.62,330.86 150.30,330.40 148.95,329.98" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="137.19354838709677" y="370.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="338.80645161290323" y="311.502688172043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="195.997311827957" y="168.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="365.01612903225805" y="375.34677419354836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="144.25" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="172.47580645161293" y="335.0241935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="327.885752688172" y="298.9018817204301" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(24,7)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de L₁ da tan α=7/24. L₂</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene inclinación 90°−α.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por eso θ=90°−2α y tan θ=cot 2α.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica el ángulo doble. Queda</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(24²−7²)/(2·24·7)=527/336.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>