<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">025 · Equilibrar dos áreas con un corte</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="365.02,269.50 364.40,281.95 362.58,294.28 359.55,306.37 355.35,318.11 350.02,329.37 343.61,340.07 336.18,350.08 327.81,359.31 318.58,367.68 308.57,375.11 297.87,381.52 286.61,386.85 274.87,391.05 262.78,394.08 250.45,395.90 238.00,396.52 225.55,395.90 213.22,394.08 201.13,391.05 189.39,386.85 178.13,381.52 167.43,375.11 157.42,367.68 148.19,359.31 139.82,350.08 132.39,340.07 125.98,329.37 120.65,318.11 116.45,306.37 113.42,294.28 111.60,281.95 110.98,269.50 111.60,257.05 113.42,244.72 116.45,232.63 120.65,220.89 125.98,209.63 132.39,198.93 139.82,188.92 148.19,179.69 157.42,171.32 167.43,163.89 178.13,157.48 189.39,152.15 201.13,147.95 213.22,144.92 225.55,143.10 238.00,142.48 250.45,143.10 262.78,144.92 274.87,147.95 286.61,152.15 297.87,157.48 308.57,163.89 318.58,171.32 327.81,179.69 336.18,188.92 343.61,198.93 350.02,209.63 355.35,220.89 359.55,232.63 362.58,244.72 364.40,257.05 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="114.57,239.52 361.43,239.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,142.48 238.00,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,269.50 361.43,239.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="238.0" y="284.741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="265.94354838709677" y="190.99971513862295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h</text><text x="293.5417963883103" y="256.02765608369754" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">r</text><text x="293.5417963883103" y="256.00700168927676" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El disco de sección mide π(R²−d²). Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alturas de los casquetes son R+d y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R−d.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia de áreas curvas es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2πR·2d. Igualando y dividiendo por π,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda d²+4Rd−R²=0.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La raíz positiva es d=R(√5−2), y con</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el radio dado ese producto vale uno.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>