<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">046 · Distancia a una diagonal auxiliar con proporciones dadas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="147.24,329.51 147.24,228.57 327.91,228.57 327.91,329.51 147.24,329.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="147.24,228.57 289.74,150.97 327.91,228.57" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="289.74,150.97 213.40,329.51" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="147.24,228.57 251.57,389.73" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="327.91,329.51 251.57,389.73" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="247.75,383.79 254.12,379.55 258.78,385.07" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="141.30658624589373" y="336.29479239592865" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="141.30658624589373" y="221.36534008293393" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="334.26931983413215" y="228.57493672249447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="334.6934137541063" y="336.7188863159028" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="293.13220959663954" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="213.40255264149928" y="337.14298023587696" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="260.9010716786041" y="235.3604394420809" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="252.41919327912112" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="271.50341967795794" y="361.31633367440355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="269.38295007808716" y="336.29479239592865" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma PC como unidad y usa ejes desde P</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por PB y PC. Así B=(2,0), C=(0,1), y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">como Q es punto medio de PM y está en</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC, M=(u,v) cumple u+2v=4 y u²+v²=4.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las soluciones son M=(0,2) y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M=(8/5,6/5). La primera queda más allá</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de D, pues (M−C)·(C−B)=1&gt;0 y AD es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelo a BC. Por ello queda la</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segunda. Los vectores BM=(−2/5,6/5) y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el rectángulo, MD=BC−AM=4. Como MD</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es paralelo a BC, la distancia de D a</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la recta BM es 4 sen 45°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>