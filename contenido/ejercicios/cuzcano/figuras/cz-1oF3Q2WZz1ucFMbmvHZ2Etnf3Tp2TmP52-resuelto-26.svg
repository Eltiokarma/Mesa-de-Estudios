<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Valor entero compatible con tres longitudes positivas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,293.83 375.10,293.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,290.43 107.18,297.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="139.89,290.43 139.89,297.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="325.21,290.43 325.21,297.23" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.82,290.43 368.82,297.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,267.67 139.89,267.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="107.18,264.53 107.18,270.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="139.89,264.53 139.89,270.81" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="139.89,267.67 325.21,267.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="139.89,264.53 139.89,270.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="325.21,264.53 325.21,270.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="325.21,267.67 368.82,267.67" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="325.21,264.53 325.21,270.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="368.82,264.53 368.82,270.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="107.18,241.51 368.82,241.51" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="107.18,238.37 107.18,244.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.82,238.37 368.82,244.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="107.18246737256834" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="139.88685052942625" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="325.2116884182878" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="368.81753262743166" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="123.5346589509973" y="259.2962324550603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x−y</text><text x="232.549269473857" y="259.2962324550603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x+y</text><text x="347.01461052285975" y="259.2962324550603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2y−x</text><text x="238.0" y="233.132725929574" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">24</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma los tres tramos. Resulta x+2y=24,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que x=24−2y.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">UN&gt;0 exige 24−3y&gt;0 y CP&gt;0 exige</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4y−24&gt;0. Por tanto 6&lt;y&lt;8.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El único entero es 7. Da x=10 y las</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tres longitudes 3, 17 y 4, todas</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>