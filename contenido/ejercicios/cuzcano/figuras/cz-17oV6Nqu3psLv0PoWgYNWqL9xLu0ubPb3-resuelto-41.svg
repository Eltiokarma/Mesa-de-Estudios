9,334.55 301.50,337.22 298.49,339.64 295.29,341.79 291.91,343.66 288.39,345.24 284.75,346.52 281.01,347.48 277.20,348.12 273.35,348.43 269.49,348.42 265.65,348.07 261.85,347.40 258.12,346.41 254.48,345.11 250.97,343.50 247.61,341.60 244.43,339.42 241.44,336.98 238.67,334.30 236.13,331.38 233.86,328.26" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="271.60215053763443" y="303.10215053763443" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="305.2043010752688" y="370.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="170.7956989247312" y="168.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="331.4139784946237" y="308.14247311827955" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="278.6586021505376" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="284.3709677419355" y="274.5403225806452" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="299.1559139784946" y="321.5833333333333" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="232.28763440860214" y="335.36021505376345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">λ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El numerador es el signo de tan α.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como α está en el segundo cuadrante,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es −1.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el cuarto cuadrante el seno es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativo. El primer término del</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">denominador es 3(−1)=−3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el tercero el coseno es negativo.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segundo término aporta −4(−1)=4. El</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">denominador vale 1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>