<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">020 · Ángulo entre dos segmentos simétricos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="347.68,273.81 347.35,265.51 346.38,257.26 344.76,249.12 342.50,241.13 339.63,233.34 336.15,225.79 332.09,218.55 327.48,211.64 322.34,205.12 316.70,199.02 310.60,193.39 304.08,188.25 297.18,183.63 289.93,179.58 282.39,176.10 274.60,173.22 266.61,170.97 258.46,169.35 250.21,168.37 241.92,168.05 233.62,168.37 225.37,169.35 217.23,170.97 209.24,173.22 201.44,176.10 193.90,179.58 186.66,183.63 179.75,188.25 173.23,193.39 167.13,199.02 161.50,205.12 156.36,211.64 151.74,218.55 147.68,225.79 144.21,233.34 141.33,241.13 139.08,249.12 137.46,257.26 136.48,265.51 136.16,273.81 136.48,282.11 137.46,290.35 139.08,298.50 141.33,306.49 144.21,314.28 147.68,321.82 151.74,329.07 156.36,335.97 161.50,342.49 167.13,348.59 173.23,354.23 179.75,359.37 186.66,363.98 193.90,368.04 201.44,371.52 209.24,374.39 217.23,376.65 225.37,378.27 233.62,379.24 241.92,379.57 250.21,379.24 258.46,378.27 266.61,376.65 274.60,374.39 282.39,371.52 289.93,368.04 297.18,363.98 304.08,359.37 310.60,354.23 316.70,348.59 322.34,342.49 327.48,335.97 332.09,329.07 336.15,321.82 339.63,314.28 342.50,306.49 344.76,298.50 346.38,290.35 347.35,282.11 347.68,273.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.74,379.57 375.10,379.57" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="108.74,379.57 170.63,147.68" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,379.57 313.21,147.68" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="140.86,243.26 342.98,243.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.74,379.57 271.69,243.26 241.92,379.57 212.15,243.26 375.10,379.57" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="128.32258064516128" y="241.68894009216592" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="346.89400921658984" y="242.47235023041475" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="100.90322580645159" y="389.7534562211982" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="375.0967741935484" y="390.536866359447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="241.13364055299536" y="391.3202764976959" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="239.56682027649765" y="278.50921658986175" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="205.8801843317972" y="234.6382488479263" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="269.33640552995394" y="234.6382488479263" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="239.56682027649765" y="349.01612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="234.86635944700458" y="161.78110599078343" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma radio 1, P=(0,−1) y α=θ/2. Los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puntos C y M tienen altura cosα. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente derecha corta la base en</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N=(a,−1), donde a=(1+cosα)/senα.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por simetría Q=(−a,−1). La recta QO</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corta la altura cosα en R=(a</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosα,cosα). La pendiente de PR es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1+cosα)/(a cosα)=tanα.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rayo PR forma α con la horizontal</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha y PD es su reflejo respecto de</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la vertical. El ángulo entre ambos es</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°−2α.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>