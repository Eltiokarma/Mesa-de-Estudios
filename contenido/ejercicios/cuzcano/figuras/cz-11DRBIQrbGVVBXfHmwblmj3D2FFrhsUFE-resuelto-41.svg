<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Prolongación de una ceviana en un triángulo rectángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="106.19,328.80 186.26,207.18 365.28,326.53 106.19,328.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="106.19,328.80 316.18,207.18 186.26,207.18" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="236.87,328.04 304.85,288.76" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645159" y="340.1256109481916" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="187.01359637430016" y="201.14045143517282" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354847" y="331.816715542522" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="257.2615302585977" y="252.50453212476674" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="325.2434017595308" y="213.22611747978317" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="239.13303119168222" y="340.1256109481916" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="308.6256109481916" y="283.47405136408065" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="174.92793032968984" y="275.9205100861992" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2√3</text><text x="279.92215409224207" y="233.6206789300631" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">DE</text><text x="249.70798898071627" y="198.8743890518084" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">AC/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma B=(0,0), A=(0,a), D=(d,0) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C=(3d,0). En la prolongación,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E=(d(1+t),−at), t&gt;0.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La condición da</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d²(1+t)²+a²t²=(a²+9d²)/4. El lado</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierdo crece para t&gt;0 y en t=½</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coincide con el derecho.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como DE=t·AD, resulta DE=√3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>