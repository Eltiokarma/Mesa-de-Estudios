<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">085 · Comparación de secante y tangente por el signo del coseno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Solución en [0, 2π)</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="78.46153846153845" y1="275" x2="159.23076923076923" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="78.46153846153845" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="159.23076923076923" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><line x1="320.7692307692307" y1="275" x2="401.5384615384615" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="320.7692307692307" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="401.5384615384615" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="78.46153846153845" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">0</text><text x="159.23076923076923" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/2</text><text x="320.7692307692307" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">3π/2</text><text x="401.5384615384615" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">2π</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el dominio cos α≠0, resta para</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtener (1−sen α)/cos α&gt;0.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El numerador es positivo en ese</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dominio, ya que sen α=1 solo en un</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">polo.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto cos α&gt;0. Interseca los</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intervalos de coseno positivo con</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[0,2π).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>