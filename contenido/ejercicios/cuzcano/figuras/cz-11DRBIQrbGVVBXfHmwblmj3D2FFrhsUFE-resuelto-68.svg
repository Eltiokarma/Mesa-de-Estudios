<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">068 · Ángulo de un cuadrilátero con diagonales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.76,328.82 163.76,258.89 364.10,316.25 171.61,360.24 108.76,328.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.76,328.82 364.10,316.25" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="163.76,258.89 171.61,360.24" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="163.76,258.89 228.18,170.90 364.10,316.25" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="228.18,170.90 171.61,360.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.9032258064516" y="339.81611054626114" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="157.470376190036" y="254.96538497088454" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="321.7460486181717" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="171.61216378593213" y="372.0279600702467" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="232.89324336814857" y="166.97203992975324" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="133.90073019687583" y="319.38908401885567" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">43°</text><text x="155.89906645715865" y="291.8911636935021" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">68°</text><text x="342.09926980312406" y="315.4608096866623" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">13°</text><text x="327.95748220722794" y="328.03128754968105" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">17°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABC, ∠ABC=124°, así que ∠DBC=56°.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Además ∠BCD=13°+17°=30°. Refleja D en</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC hasta E.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠CBE=56°, E queda en la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">prolongación de AB. El ángulo DCE vale</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60° y CD=CE, por lo que DCE es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilátero.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En AEC, ∠EAC=∠ACE=43°, de donde</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AE=CE=DE. Ahora ∠AED=94°−60°=34°, así</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que ∠DAE=73° y ∠CAD=30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>