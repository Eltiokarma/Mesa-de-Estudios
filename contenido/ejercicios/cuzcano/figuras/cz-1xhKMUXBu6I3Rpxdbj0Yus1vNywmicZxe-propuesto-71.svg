<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">071 · Dos barcos y un faro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,354.23 100.90,184.77 375.10,184.77 270.37,354.23 100.90,354.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,354.23 375.10,184.77" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645163" y="354.2322461023167" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Puerto</text><text x="100.90322580645163" y="184.76775389768332" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Barco al norte</text><text x="270.367718011085" y="354.2322461023167" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Barco al este</text><text x="375.0967741935484" y="184.76775389768332" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Faro</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tras una hora los barcos están en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,d) y (d,0), y el faro en (x,d).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por componentes, tan α=x/d y tan</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">β=(x−d)/d. Su diferencia es 1 y su</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">producto 1 por complementariedad.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con t=tan β, t²+t=1. Luego</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan(2β)=2t/(1−t²)=2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>