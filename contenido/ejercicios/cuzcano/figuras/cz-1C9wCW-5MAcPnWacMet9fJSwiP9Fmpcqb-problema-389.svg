9483 241.91638059263408,336.7042737977632 241.3426008124526,325.9492388483149 246.16635408072253,329.22512108167666" fill="none" stroke="#1766b0" stroke-width="2"/><text x="246.40654096544966" y="346.1555180288458" font-family="Arial,sans-serif" font-size="12" fill="#20364b" text-anchor="middle">R/2</text><circle cx="100.9032258064516" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="100.9032258064516" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="375.09677419354836" cy="269.5" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">X</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cable anula el resistor lateral</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecho e identifica sus extremos en</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un nodo X.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A–X contiene dos R paralelos y B–X</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">otros dos: cada grupoR/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esa ruta valeR y está en paralelo con</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el lado A–B deR: Req=R/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>