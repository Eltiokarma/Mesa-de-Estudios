<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">012 · Atracción gravitatoria entre el bloque y la Tierra</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="254.23,158.71 253.91,161.88 252.99,164.92 251.49,167.73 249.47,170.18 247.02,172.20 244.21,173.70 241.17,174.63 238.00,174.94 234.83,174.63 231.79,173.70 228.98,172.20 226.53,170.18 224.51,167.73 223.01,164.92 222.09,161.88 221.77,158.71 222.09,155.54 223.01,152.50 224.51,149.70 226.53,147.24 228.98,145.22 231.79,143.72 234.83,142.80 238.00,142.48 241.17,142.80 244.21,143.72 247.02,145.22 249.47,147.24 251.49,149.70 252.99,152.50 253.91,155.54 254.23,158.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="282.76,337.76 281.90,346.50 279.36,354.89 275.22,362.63 269.65,369.42 262.87,374.98 255.13,379.12 246.73,381.67 238.00,382.53 229.27,381.67 220.87,379.12 213.13,374.98 206.35,369.42 200.78,362.63 196.64,354.89 194.10,346.50 193.24,337.76 194.10,329.03 196.64,320.63 200.78,312.89 206.35,306.11 213.13,300.54 220.87,296.41 229.27,293.86 238.00,293.00 246.73,293.86 255.13,296.41 262.87,300.54 269.65,306.11 275.22,312.89 279.36,320.63 281.90,329.03 282.76,337.76" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,158.71 238.00,234.25" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="231.85,221.94 238.00,234.25 244.15,221.94" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,337.76 238.00,262.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="244.15,274.54 238.00,262.23 231.85,274.54" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="278.2870541423902" y="158.71060110842689" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Bloque</text><text x="248.07176353559757" y="224.73660650845525" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="248.07176353559757" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="240.23816967457722" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Tierra</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El bloque es atraído hacia el centro</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la Tierra. La fuerza sobre él</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">apunta hacia abajo en el esquema.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El bloque atrae a la Tierra hacia sí.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esa fuerza actúa sobre la Tierra en el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sentido opuesto.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la tercera ley de Newton, ambas</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerzas tienen la misma magnitud y sus</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">líneas de acción son colineales.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>