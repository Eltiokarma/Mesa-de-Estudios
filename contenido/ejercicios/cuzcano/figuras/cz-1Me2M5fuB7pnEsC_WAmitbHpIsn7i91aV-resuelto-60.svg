.58,314.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="346.42,314.41 129.58,224.59" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="346.42,314.41 193.09,161.08" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="282.91,377.92 193.09,377.92" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="282.91,377.92 129.58,314.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="282.91,377.92 129.58,224.59" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="282.91,377.92 193.09,161.08" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="193.09,377.92 129.58,314.41" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="193.09,377.92 129.58,224.59" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="193.09,377.92 193.09,161.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="129.58,314.41 129.58,224.59" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="129.58,314.41 193.09,161.08" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="129.58,224.59 193.09,161.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sean n&gt;m y k=n−m. Las dos condiciones</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dan mn=24k y k(n+m−3)=22.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con m≥3, revisa los divisores</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivos de 22. La única pareja que</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cumple ambas igualdades es n=8, m=6.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las diagonales medias son los C(8,2)</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pares de lados.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>