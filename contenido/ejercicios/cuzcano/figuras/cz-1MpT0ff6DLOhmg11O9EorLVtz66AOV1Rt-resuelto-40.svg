<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Recta perpendicular a la mediana</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="110.98387096774195" y1="105" x2="110.98387096774195" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="147.27,142.48 365.02,360.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Perpendicular</text><polyline points="147.27,360.23 183.56,178.77 328.73,323.94 147.27,360.23" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Triángulo</text><polyline points="147.27,360.23 256.15,251.35" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Mediana</text><circle cx="147.2741935483871" cy="360.2258064516129" r="3.7" fill="#20364b"/><text x="154.2741935483871" y="352.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="183.56451612903226" cy="178.7741935483871" r="3.7" fill="#20364b"/><text x="190.56451612903226" y="170.7741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="328.72580645161287" cy="323.93548387096774" r="3.7" fill="#20364b"/><text x="335.72580645161287" y="315.93548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="256.14516129032256" cy="251.35483870967744" r="3.7" fill="#20364b"/><text x="263.14516129032256" y="243.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio de BC es M=(4,4).</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AM tiene vector director (3,3), por lo</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que la recta perpendicular tiene</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente −1.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa y−6=−(x−2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>