le cx="237.99999999999997" cy="197.5241935483871" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="189.5241935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">V</text><circle cx="237.99999999999997" cy="224.9435483870968" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="216.9435483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F</text><circle cx="183.16129032258064" cy="224.9435483870968" r="3.7" fill="#20364b"/><text x="190.16129032258064" y="216.9435483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="183.16129032258064" cy="170.10483870967744" r="3.7" fill="#20364b"/><text x="190.16129032258064" y="162.10483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H</text><circle cx="320.258064516129" cy="170.10483870967744" r="3.7" fill="#20364b"/><text x="327.258064516129" y="162.10483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">y = 4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia a la recta es ∣y−4∣ y al</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">foco es √((x−3)²+(y−2)²).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Eleva al cuadrado y resta (y−2)² de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ambos lados.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Simplifica la diferencia a 12−4y. El</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértice es (3,3) y la parábola abre</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia abajo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>