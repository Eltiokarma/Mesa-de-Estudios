><text x="118.44913151364767" y="157.2816377171216" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="130.85607940446653" y="210.63151364764272" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="174.9007444168735" y="254.0558312655087" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="220.80645161290326" y="157.2816377171216" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><text x="233.21339950372212" y="210.63151364764272" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">7</text><text x="277.2580645161291" y="254.0558312655087" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5</text><text x="323.1637717121588" y="157.2816377171216" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="335.57071960297765" y="210.63151364764272" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">10</text><text x="379.61538461538464" y="254.0558312655087" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">7</text><text x="118.44913151364767" y="268.9441687344913" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="130.85607940446653" y="322.2940446650124" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a</text><text x="174.9007444168735" y="365.7183622828784" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">9</text><text x="220.80645161290326" y="268.9441687344913" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">c+4</text><text x="233.21339950372212" y="322.2940446650124" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">61</text><text x="277.2580645161291" y="365.7183622828784" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">b</text><text x="323.1637717121588" y="268.9441687344913" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">c+5</text><text x="335.57071960297765" y="322.2940446650124" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">64</text><text x="379.61538461538464" y="365.7183622828784" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">d</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la figura n, arriba va n y abajo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2n+1. En el cruce se suman: 3n+1. Así</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=13.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cruce 61 corresponde a n=20:</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">c+4=20, c=16 y b=41.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cruce 64 corresponde a n=21: d=43.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma 13+41+16+43=113.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>