<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">047 · Empuje sobre una barra entre paredes lisas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,177.30 100.90,348.34 357.46,348.34 357.46,177.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,260.15 357.46,260.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,324.29 357.46,196.01" fill="none" stroke="#008674" stroke-width="2.5"/><text x="322.1822297679683" y="321.6128089039804" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Líquido</text><text x="229.1809092624033" y="251.06008300320693" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CG</text><text x="365.475947934352" y="193.86961579576175" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="261.2153996101365" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2a</text><text x="162.36961579576177" y="361.6995849839653" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las reacciones de ambas paredes son</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontales. El equilibrio vertical</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">implica que el empuje E iguala el</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">peso.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro del volumen sumergido está a</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia horizontal a/2 del apoyo</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferior, y el peso a distancia a.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma momentos en el apoyo inferior. El</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">brazo neto del par peso-empuje es a/2.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala E(a/2) a 60(2a).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>