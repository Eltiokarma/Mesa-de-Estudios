<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">051 · Circunferencia definida por un cociente de distancias</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,269.50 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,142.48 238.00,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="218.92,285.78 218.22,277.79 216.14,270.03 212.75,262.75 208.15,256.18 202.47,250.50 195.89,245.90 188.62,242.50 180.86,240.43 172.86,239.73 164.87,240.43 157.11,242.50 149.83,245.90 143.26,250.50 137.58,256.18 132.98,262.75 129.58,270.03 127.50,277.79 126.81,285.78 127.50,293.78 129.58,301.54 132.98,308.81 137.58,315.39 143.26,321.07 149.83,325.67 157.11,329.06 164.87,331.14 172.86,331.84 180.86,331.14 188.62,329.06 195.89,325.67 202.47,321.07 208.15,315.39 212.75,308.81 216.14,301.54 218.22,293.78 218.92,285.78" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="189.15,269.50 238.00,220.65" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="365.01612903225805" y="275.3622828784119" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Re</text><text x="244.3508064516129" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Im</text><text x="163.09305210918114" y="297.9972084367246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="190.12468982630273" y="280.2475186104218" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">−1</text><text x="245.32785359801488" y="219.67059553349878" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">i</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con z=x+iy, eleva al cuadrado y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">escribe x²+(y−1)²=4[(x+1)²+y²].</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ordena como 3x²+3y²+8x+2y+3=0.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completa cuadrados. Resulta</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(x+4/3)²+(y+1/3)²=8/9. El punto</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">excluido z=−1 queda fuera de la</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">circunferencia.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>