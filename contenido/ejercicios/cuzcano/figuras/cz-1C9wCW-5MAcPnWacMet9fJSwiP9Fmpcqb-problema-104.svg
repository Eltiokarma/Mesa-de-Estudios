<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">104 · Esfera, rampa y cuerda</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="245.57743198305016" x2="421" y2="245.57743198305016" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="238.00,245.58 210.38,197.73" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">normal, escala</text><line x1="210.37578750929578" y1="197.73229594915043" x2="218.47261586653653" y2="203.60097301927297" stroke="#1766b0" stroke-width="2"/><line x1="210.37578750929578" y1="197.73229594915043" x2="211.41004944137424" y2="207.67866726012878" stroke="#1766b0" stroke-width="2"/><polyline points="238.00,245.58 265.62,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">tensión, escala</text><line x1="265.6242124907042" y1="142.48387096774195" x2="267.19959432990527" y2="152.35899993199936" stroke="#d37618" stroke-width="2"/><line x1="265.6242124907042" y1="142.48387096774195" x2="259.3222744628172" y2="150.24824969966065" stroke="#d37618" stroke-width="2"/><polyline points="238.00,245.58 238.00,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="498" font-family="Arial,sans-serif" font-size="12" fill="#008674" text-anchor="start">peso, escala</text><line x1="238.0" y1="396.51612903225805" x2="233.9223954694043" y2="387.38523962913496" stroke="#008674" stroke-width="2"/><line x1="238.0" y1="396.51612903225805" x2="242.0776045305957" y2="387.38523962913496" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La reacción N va 30° hacia la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda de la vertical y la tensión</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15° hacia la derecha.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x: T sen15°=N sen30°. En y: T</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos15°+N cos30°=20.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N=20sen15°/sen45°≈7,32 N. La esfera</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ejerce el mismo módulo sobre la rampa.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>