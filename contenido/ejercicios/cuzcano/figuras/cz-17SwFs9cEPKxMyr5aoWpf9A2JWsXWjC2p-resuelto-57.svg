<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Punto medio de recorrido</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,327.24 375.10,211.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,327.24 238.00,327.24" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,327.24 238.00,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,327.24 375.10,211.76" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="107.9032258064516" y="319.2375099510982" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="245.0" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="382.0967741935484" y="203.7624900489018" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="245.0" y="319.2375099510982" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Seaδ=θ−x;Pmedio de AB. Con AP=r,P=(r</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosδ,r sinδ),B=2P;Pablo cambia en O=(r</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosδ,0).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tanθ=2tanδ⇒tanx=tanθ/(2+tan²θ).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cotx=(1+cos²θ)/(sinθcosθ).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#00