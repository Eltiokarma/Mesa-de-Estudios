<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">075 · Una barra suspendida con un cable horizontal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.00,217.88 278.52,328.89 375.10,328.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,303.91 375.10,355.53" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="112.00,183.47 112.00,217.88" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="220.24,328.89 278.52,328.89" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645157" y="227.3163771712159" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="249.65600104479554" y="321.11943319838053" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="327.9177223455661" y="315.56895651038263" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90 N</text><text x="198.036567846415" y="253.40361760480604" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">120 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El equilibrio de fuerzas da una</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reacción con componentes −90 N y +120</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N. Su magnitud es 150 N.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si la barra mide L, el brazo del peso</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es (L/2)cos θ y el de la tensión L sen</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala 120(L/2)cos θ a 90L sen θ. De</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ahí tan θ=2/3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>