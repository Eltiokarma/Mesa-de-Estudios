<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">086 · Movimiento del centro de curvatura al foco</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="302.60,176.55 324.91,223.03 333.27,269.50 324.91,315.97 302.60,362.45" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="147.38,269.50 147.38,230.46" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="240.32,269.50 240.32,230.46" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="147.38,209.08 240.32,209.08 226.38,200.72 240.32,209.08 226.38,217.45" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="147.37670858392562" y="288.0893931109896" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="240.32367413887368" y="288.0893931109896" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="349.0716238381629" y="284.3715144887917" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="193.85019136139965" y="193.2834882449426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 s</text><text x="284.9382176052487" y="291.8072717331875" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una imagen invertida del mismo tamaño</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exige s′ = s. La ecuación del espejo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da s = 2f = 80 cm.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el foco, s = 40 cm, los rayos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reflejados salen paralelos en el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">modelo paraxial.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El objeto recorre 40 cm hacia el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">espejo en 5 s. La rapidez es 8 cm/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>