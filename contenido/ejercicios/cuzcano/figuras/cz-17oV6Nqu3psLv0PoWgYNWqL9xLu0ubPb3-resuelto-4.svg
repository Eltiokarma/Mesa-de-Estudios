<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Reflejo de un punto en una recta de pendiente uno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="121.57,375.35 354.43,375.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="142.74,396.52 142.74,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="142.74,333.01 312.09,163.65" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="227.42,205.99 269.75,248.33" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="221.06451612903226" y="195.4072580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="279.28024193548384" y="252.56451612903223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q′</text><text x="316.3266129032258" y="163.6532258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="243.2923387096774" y="211.28427419354836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El eje de simetría es y=x+2. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular por Q tiene pendiente −1</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y ecuación y=12−x.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos rectas se cortan en M=(5,7),</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el punto medio del segmento entre Q y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">su reflejo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula Q′=2M−Q. Resulta (6,6).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>