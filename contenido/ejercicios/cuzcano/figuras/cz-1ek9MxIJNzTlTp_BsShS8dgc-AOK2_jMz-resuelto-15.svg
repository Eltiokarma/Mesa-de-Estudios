75,217.47 252.36,220.78 254.97,224.01 257.59,227.16 260.20,230.24 262.81,233.26 265.42,236.22 268.03,239.14 270.64,242.02 273.25,244.86 275.86,247.67 278.48,250.46 281.09,253.22 283.70,255.96 286.31,258.69 288.92,261.40 291.53,264.11 294.14,266.80 296.76,269.50 299.37,272.20 301.98,274.89 304.59,277.60 307.20,280.31 309.81,283.04 312.42,285.78 315.04,288.54 317.65,291.33 320.26,294.14 322.87,296.98 325.48,299.86 328.09,302.78 330.70,305.74 333.31,308.76 335.93,311.84 338.54,314.99 341.15,318.22 343.76,321.53 346.37,324.96 348.98,328.51 351.59,332.20 354.21,336.07 356.82,340.14 359.43,344.48 362.04,349.16 364.65,354.28 367.26,360.05 369.87,366.82 372.49,375.58 375.10,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">arccos</text><circle cx="238.0" cy="200.92486991227742" r="3.7" fill="#20364b"/><text x="245.0" y="192.92486991227742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">x=−3/4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rango de arccos es [0,π]. Como f</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">crece y tiene el mismo rango, el punto</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio es a=π/2 y la amplitud bπ vale</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π. Así b=1.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x₀=−3/4, iguala</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π/2+arcsen(x₀−c)=arccos x₀=π/2−arcsen</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x₀. Por imparidad e inyectividad,</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x₀−c=−x₀.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así c=2x₀=−3/2 y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abc=(π/2)(1)(−3/2)=−3π/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>