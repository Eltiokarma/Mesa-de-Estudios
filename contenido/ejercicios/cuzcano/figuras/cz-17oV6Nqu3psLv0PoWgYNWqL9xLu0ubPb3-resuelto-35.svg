<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Una horizontal bisecada dentro de un cuadrante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.59,169.77 364.41,169.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="137.67,396.52 137.67,143.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="137.67,370.43 217.93,290.17 338.33,169.77" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="137.67,169.77 217.93,290.17" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="137.67,290.17 217.93,290.17 298.20,290.17" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="137.67,370.43 148.17,370.16 158.65,369.33 169.06,367.96 179.39,366.05 189.61,363.59 199.68,360.61 209.58,357.10 219.29,353.08 228.77,348.56 238.00,343.55 246.96,338.06 255.61,332.11 263.95,325.71 271.94,318.89 279.56,311.66 286.79,304.04 293.61,296.05 300.01,287.72 305.96,279.06 311.45,270.10 316.46,260.87 320.98,251.39 325.00,241.68 328.51,231.78 331.49,221.71 333.94,211.49 335.86,201.16 337.23,190.75 338.05,180.27 338.33,169.77" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="173.79,169.77 173.77,170.96 173.71,172.14 173.62,173.32 173.48,174.49 173.31,175.66 173.09,176.83 172.84,177.98 172.56,179.13 172.23,180.27 171.87,181.40 171.47,182.51 171.03,183.61 170.56,184.69 170.06,185.76 169.52,186.82 168.94,187.85 168.33,188.86 167.69,189.86 167.02,190.83 166.31,191.78 165.57,192.71 164.81,193.61 164.01,194.48 163.19,195.33 162.34,196.16 161.46,196.95 160.56,197.71 159.63,198.45 158.68,199.15 157.71,199.83" fill="none" stroke="#008674" stroke-width="2.5"/><text x="137.67130408194464" y="370.43066809356367" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="137.67130408194464" y="169.77327625745295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="338.32869591805536" y="169.77327625745295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="217.93426081638893" y="290.1677113591194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="298.1972175508332" y="290.1677113591194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="137.67130408194464" y="290.1677113591194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="364.4141568567498" y="174.78971105335572" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="144.69431279620852" y="143.68781531875857" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="177.80278244916678" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea y=−h la horizontal. La cuerda AB</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">satisface y=x−R, de modo que</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P=(R−h,−h).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El extremo sobre el arco tiene abscisa</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2(R−h), por el punto medio. Así</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4(R−h)²+h²=R².</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para una horizontal interior, divide</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por R−h&gt;0. Queda 4(R−h)=R+h, h=3R/5 y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan θ=−h/(R−h).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>