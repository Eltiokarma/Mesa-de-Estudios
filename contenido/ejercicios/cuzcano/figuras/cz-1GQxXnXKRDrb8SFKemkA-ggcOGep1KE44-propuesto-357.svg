<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">357 · Producto de los vértices de un cuadrado inscrito en un rombo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.4838709677419" x2="421" y2="142.4838709677419" stroke="#20364b" stroke-width="1.7"/><line x1="136.38709677419354" y1="105" x2="136.38709677419354" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">Re</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Im</text><polygon points="187.19,244.10 288.81,244.10 288.81,345.71 187.19,345.71 187.19,244.10" fill="#f4c581" fill-opacity="0.45"/><polyline points="136.39,294.90 238.00,193.29 339.61,294.90 238.00,396.52 136.39,294.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Rombo</text><polyline points="187.19,244.10 288.81,244.10 288.81,345.71 187.19,345.71 187.19,244.10" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Cuadrado inscrito</text><circle cx="187.19354838709677" cy="244.09677419354836" r="3.7" fill="#20364b"/><text x="194.19354838709677" y="236.09677419354836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">z1</text><circle cx="288.80645161290323" cy="244.09677419354836" r="3.7" fill="#20364b"/><text x="295.80645161290323" y="236.09677419354836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">z2</text><circle cx="288.80645161290323" cy="345.7096774193549" r="3.7" fill="#20364b"/><text x="295.80645161290323" y="337.7096774193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">z3</text><circle cx="187.19354838709677" cy="345.7096774193549" r="3.7" fill="#20364b"/><text x="194.19354838709677" y="337.7096774193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">z4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rombo se centra en (2,−3). Como los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuatro vértices cumplen la misma</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igualdad, ambos lados verticales</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen la misma distancia al eje x=2 y</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ambos lados horizontales al eje y=−3.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así el cuadrado se centra en (2,−3).</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su semilado h cumple h+h=2, por lo que</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h=1.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los vértices son 1−2i, 3−2i, 1−4i y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3−4i. Su producto es −115+120i.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>