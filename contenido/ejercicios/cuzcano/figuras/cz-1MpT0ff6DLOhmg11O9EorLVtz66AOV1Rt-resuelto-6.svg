<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Rectas posibles a distancia fijada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="323.3594470046083" x2="421" y2="323.3594470046083" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="218.41,293.98 375.10,215.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">a=2</text><polyline points="100.90,313.57 257.59,235.23" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">a=−2</text><circle cx="277.1705069124424" cy="264.6036866359447" r="3.7" fill="#20364b"/><text x="284.1705069124424" y="256.6036866359447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A₊</text><circle cx="355.5115207373272" cy="225.43317972350232" r="3.7" fill="#20364b"/><text x="362.5115207373272" y="217.43317972350232" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B₊</text><circle cx="198.8294930875576" cy="264.6036866359447" r="3.7" fill="#20364b"/><text x="205.8294930875576" y="256.6036866359447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A₋</text><circle cx="120.48847926267281" cy="303.7741935483871" r="3.7" fill="#20364b"/><text x="127.48847926267281" y="295.7741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B₋</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia al cuadrado exige</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(2a)²+a²=20, por tanto a=±2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para ambos valores, la pendiente es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a/(2a)=1/2. Por A resulta 2y−x=6−a.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye a=2 y a=−2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>