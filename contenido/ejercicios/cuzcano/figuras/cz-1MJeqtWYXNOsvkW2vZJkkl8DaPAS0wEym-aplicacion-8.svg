<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Desplazamiento máximo de dos bloques apilados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="117.27,276.05 280.97,276.05 280.97,316.97 117.27,316.97 117.27,276.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="199.12,235.12 362.82,235.12 362.82,276.05 199.12,276.05 199.12,235.12" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,316.97 375.10,316.97" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="117.27,222.03 199.12,222.03" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="117.27,218.75 117.27,226.12" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="199.12,218.75 199.12,226.12" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="280.97,255.59 280.97,302.65" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="275.86,292.42 280.97,302.65 286.09,292.42" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="158.1974000962927" y="211.79658160808856" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">d</text><text x="290.3832450649976" y="295.6916225324988" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">W</text><text x="199.1218103033221" y="327.2034183919114" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Mide la posición horizontal desde el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">borde izquierdo del bloque inferior.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La línea de acción del peso del bloque</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superior pasa por d+L/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El contacto puede sostenerlo mientras</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esa línea no sobrepase el borde</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecho del bloque inferior. Impón</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d+L/2≤L.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>