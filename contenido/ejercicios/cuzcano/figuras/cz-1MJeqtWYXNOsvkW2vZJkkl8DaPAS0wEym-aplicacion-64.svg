<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">064 · Fuerza de compensación en una placa articulada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="173.59,197.63 354.39,197.63 354.39,333.23 173.59,333.23 173.59,197.63" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="173.59,265.43 263.99,197.63" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="108.05,333.23 173.59,333.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="163.19,338.21 173.59,333.23 163.19,328.26" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="263.99,197.63 331.79,146.78" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="326.46,156.99 331.79,146.78 320.49,149.04" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="354.39,396.52 354.39,333.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="359.37,343.63 354.39,333.23 349.42,343.63" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="272.1271094019056" y="265.4318677534152" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="129.7424807714384" y="320.5776604293422" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 N</text><text x="336.31319595913214" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 N</text><text x="365.24213637929057" y="388.8318792331535" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F₃</text><text x="263.9908449087361" y="347.24652737917575" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 m</text><text x="367.95422454368037" y="266.78791183561015" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza de 10 N actúa 1,5 m por</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">debajo del centro y produce +15 N·m.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La dirección de la fuerza de 20 N</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">avanza 2 m en horizontal y 1,5 m en</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical y, por tanto, componente</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal 16 N. El momento de esa</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerza es −1,5×16=−24 N·m.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El brazo de F₃ es 2 m. Impón</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15−24+2F₃=0.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>