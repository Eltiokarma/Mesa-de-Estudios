<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Cuadrado RITA y ángulo de 53°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="110.98387096774192" y1="105" x2="110.98387096774192" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="220.15,396.52 110.98,251.65 255.85,142.48 365.02,287.35 220.15,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">RITA</text><polyline points="110.98,251.65 110.98,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Vertical de I</text><polyline points="110.98,142.48 255.85,142.48" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Proyección de T</text><circle cx="220.1490472051398" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="227.1490472051398" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="110.98387096774192" cy="251.64904720513982" r="3.7" fill="#20364b"/><text x="117.98387096774192" y="243.64904720513982" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I</text><circle cx="255.85095279486018" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="262.8509527948602" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="365.01612903225805" cy="287.3509527948602" r="3.7" fill="#20364b"/><text x="372.01612903225805" y="279.3509527948602" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector IT=(8,d) tiene d=8·cot(53°).</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al girarlo en sentido horario se</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene IR=(d,−8). Por la posición de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R, I=(0,8) y R=(d,0).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma IT a R para encontrar A.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>