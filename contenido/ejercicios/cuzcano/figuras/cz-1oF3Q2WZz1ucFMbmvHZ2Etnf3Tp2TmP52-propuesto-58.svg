<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Inclinación de la base de un triángulo isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,209.33 253.23,209.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="283.70,331.19 375.10,331.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="161.84,279.40 253.23,209.33 283.70,331.19 161.84,279.40" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="253.23,209.33 308.07,165.15" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="283.70,331.19 295.89,373.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="244.09318996415766" y="196.53405017921148" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="260.84946236559136" y="216.03225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="151.1720430107527" y="279.4014336917563" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="283.69892473118273" y="344.90322580645164" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="286.7455197132616" y="307.4301075268817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">150°</text><text x="301.9784946236558" y="344.90322580645164" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="110.04301075268819" y="201.71326164874554" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="365.95698924731175" y="323.57706093189967" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a el ángulo de la base en D y en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O. El rayo RO tiene orientación</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°−a, y RD tiene 150°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con la disposición del dibujo,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠DRO=150°−(180°−a)=a−30°. La suma del</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo da a−30°+2a=180°, luego</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=70°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como DR desde D baja 30°, DO sube a</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a−30°=40°. Su suplemento es x.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>