<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Ángulo entre una normal y la arista opuesta</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="141.34,326.95 288.75,326.95 294.02,291.15" fill="#f4c581" fill-opacity="0.45"/><polygon points="141.34,326.95 238.21,326.95 238.21,230.08" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,338.41 303.07,338.41 375.10,283.99 172.93,283.99 100.90,338.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="141.34,200.59 141.34,326.95 294.02,291.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="141.34,326.95 288.75,326.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="141.34,326.95 238.21,230.08" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.21,230.08 238.21,326.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="141.33729745800505" y="326.9500768049155" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="288.753183687627" y="326.9500768049155" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="294.0180367672563" y="291.1490758634359" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="141.33729745800505" y="200.59360289381104" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.21059412318513" y="230.0767801397354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="238.21059412318513" y="326.9500768049155" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="154.8153213418562" y="291.5702641098063" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Coloca la cara elegida en z=0. Usa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">direcciones unitarias e₁=(1,0,0) y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">e₂=(1,1,0)/√2 para sus aristas.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La opuesta forma 45° con e₁ y 60° con</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">e₂, intercambiables por simetría. Los</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">productos escalares dan x=1/√2 e y=0.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al ser unitaria, z=1/√2 en el lado del</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rayo normal. Así el ángulo pedido</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene coseno 1/√2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>