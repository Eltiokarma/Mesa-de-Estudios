.37,267.38 223.98,380.37 127.98,267.38" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="127.98,267.38 357.37,267.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="223.98,154.38 223.98,380.37" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="173.85,213.85 223.98,267.38 173.85,320.90" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="280.91,202.81 223.98,267.38 280.91,331.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="116.93111446758012" y="267.3759844643435" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="359.0688855324199" y="269.9248031071313" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="212.08701046499084" y="261.4287409645053" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="218.03425396482902" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="217.18464775056643" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="164.50906246628549" y="204.50512460891142" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="161.11063760923508" y="329.397238105513" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="286.85235732009926" y="198.55788110907326" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="286.85235732009926" y="342.1413313194519" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangencia en D,O,R coloca los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">centros sobre DO, por lo que DO es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diámetro del mayor. Como MP es</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a ese diámetro, sus</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos se reflejan entre sí respecto</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como UR e IR son las distancias desde</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R a los lados del ángulo bisecado por</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DR, UR=IR. De modo análogo OR biseca</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el ángulo derecho y NR=CR.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cancela los factores iguales en el</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cociente. Queda 8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>