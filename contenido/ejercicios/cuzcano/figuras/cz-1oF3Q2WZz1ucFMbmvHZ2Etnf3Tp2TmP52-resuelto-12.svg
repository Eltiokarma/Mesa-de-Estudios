<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">012 · Longitud a partir de recíprocos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,280.75 375.10,280.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,277.35 107.18,284.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="215.56,277.35 215.56,284.15" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="292.19,277.35 292.19,284.15" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.82,277.35 368.82,284.15" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,254.59 215.56,254.59" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="107.18,251.45 107.18,257.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="215.56,251.45 215.56,257.73" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="107.18246737256834" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="215.55525979350247" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="292.186396210467" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="368.81753262743166" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="161.36886358303542" y="246.21447919231716" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe x=LI, u=IM y v=IA. Entonces</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">LM=x+u y LA=x+v.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Reordena la ecuación como</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/x−1/(x+u)=1/(x+v). Al multiplicar,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">u(x+v)=x(x+u).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cancela ux. Resulta x²=uv=8 y se toma</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la raíz positiva.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>