<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Problema 6: Altura a partir de tres datos</title><desc id="desc">Reconstrucción vectorial. Sólido en perspectiva y sección auxiliar con datos y letras.</desc><rect width="900" height="540" rx="18" fill="#f5f8fc"/><text x="28.00" y="36.00" font-family="Arial,sans-serif" font-size="22" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">06  /  Altura a partir de tres datos</text><line x1="460.00" y1="70.00" x2="460.00" y2="490.00" stroke="#d8e2ee" stroke-width="1"/><text x="28.00" y="517.00" font-family="Arial,sans-serif" font-size="14" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Esquema en perspectiva · Las cotas, no la apariencia, definen la geometría.</text><polygon points="135.81,204.02 70.00,144.79 344.19,144.79 410.00,204.02" fill="#d2e1ef" fill-opacity="0.35" stroke="#008778" stroke-width="2"/><polygon points="344.19,144.79 410.00,204.02 410.00,410.21 344.19,350.98" fill="#d2e1ef" fill-opacity="0.35" stroke="#008778" stroke-width="2"/><line x1="135.81" y1="410.21" x2="70.00" y2="350.98" stroke="#233b53" stroke-width="2.2" stroke-dasharray="6 5"/><line x1="70.00" y1="350.98" x2="344.19" y2="350.98" stroke="#233b53" stroke-width="2.2" stroke-dasharray="6 5"/><line x1="344.19" y1="350.98" x2="410.00" y2="410.21" stroke="#233b53" stroke-width="2.2" stroke-dasharray="6 5"/><line x1="410.00" y1="410.21" x2="135.81" y2="410.21" stroke="#233b53" stroke-width="2.2" stroke-dasharray="6 5"/><line x1="135.81" y1="204.02" x2="70.00" y2="144.79" stroke="#233b53" stroke-width="2.2"/><line x1="70.00" y1="144.79" x2="344.19" y2="144.79" stroke="#233b53" stroke-width="2.2"/><line x1="344.19" y1="144.79" x2="410.00" y2="204.02" stroke="#233b53" stroke-width="2.2"/><line x1="410.00" y1="204.02" x2="135.81" y2="204.02" stroke="#233b53" stroke-width="2.2"/><line x1="135.81" y1="410.21" x2="135.81" y2="204.02" stroke="#233b53" stroke-width="2.2"/><line x1="70.00" y1="350.98" x2="70.00" y2="144.79" stroke="#233b53" stroke-width="2.2" stroke-dasharray="6 5"/><line x1="344.19" y1="350.98" x2="344.19" y2="144.79" stroke="#233b53" stroke-width="2.2"/><line x1="410.00" y1="410.21" x2="410.00" y2="204.02" stroke="#233b53" stroke-width="2.2"/><text x="60.81" y="307.11" font-family="Arial,sans-serif" font-size="18" fill="#2463c4" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">x = 8</text><text x="47.90" y="380.60" font-family="Arial,sans-serif" font-size="18" fill="#2463c4" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">a = 6</text><text x="272.90" y="435.21" font-family="Arial,sans-serif" font-size="18" fill="#2463c4" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">b = 10</text><text x="490.00" y="365.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Base = 6×10 = 60 m²</text><text x="490.00" y="392.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">8²+6²+10² = 200</text><text x="490.00" y="419.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Altura = 8; se descarta 16</text></svg>