<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">023 · Ruta de dos tramos con llegada hacia el este</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.10,302.57 157.39,233.34 370.45,302.57 107.10,302.57" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.9032258064516" y="313.401701149274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Inicio</text><text x="157.3919826860532" y="225.59829885072602" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Giro</text><text x="375.09677419354836" y="312.47291450175555" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Llegada</text><text x="238.77398887293202" y="312.47291450175555" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">d</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama u,v a las longitudes de los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tramos. La suma es 10 y las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes norte y sur se cancelan: u</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos36°=v sen18°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con cos36°=(√5+1)/4 y sen18°=(√5−1)/4,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resulta u=5(√5−1)/√5 y v=10−u.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La componente este es d=u sen36°+v</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos18°. Divide por cos18° y usa</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen36°=2sen18° cos18°. Resulta 4√5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>