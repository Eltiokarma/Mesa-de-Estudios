<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · La misma cuerda sobre dos poleas fijas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="168.77,279.00 168.41,282.71 167.33,286.27 165.57,289.56 163.21,292.44 160.33,294.80 157.04,296.56 153.48,297.64 149.77,298.01 146.06,297.64 142.50,296.56 139.21,294.80 136.33,292.44 133.97,289.56 132.21,286.27 131.13,282.71 130.77,279.00 131.13,275.29 132.21,271.73 133.97,268.44 136.33,265.56 139.21,263.20 142.50,261.44 146.06,260.36 149.77,260.00 153.48,260.36 157.04,261.44 160.33,263.20 163.21,265.56 165.57,268.44 167.33,271.73 168.41,275.29 168.77,279.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="337.09,189.41 336.72,193.12 335.64,196.69 333.89,199.97 331.52,202.85 328.64,205.21 325.36,206.97 321.79,208.05 318.09,208.42 314.38,208.05 310.81,206.97 307.53,205.21 304.65,202.85 302.29,199.97 300.53,196.69 299.45,193.12 299.08,189.41 299.45,185.71 300.53,182.14 302.29,178.86 304.65,175.98 307.53,173.61 310.81,171.86 314.38,170.78 318.09,170.41 321.79,170.78 325.36,171.86 328.64,173.61 331.52,175.98 333.89,178.86 335.64,182.14 336.72,185.71 337.09,189.41" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="130.77,355.02 130.77,279.00 140.00,262.71 308.31,173.13 337.09,189.41 337.09,284.43" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="149.77,279.00 100.90,279.00" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="318.09,189.41 318.09,151.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="111.76,355.02 149.77,355.02 149.77,387.59 111.76,387.59 111.76,355.02" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="318.09,284.43 356.09,284.43 356.09,317.01 318.09,317.01 318.09,284.43" fill="none" stroke="#008674" stroke-width="2.5"/><text x="178.00319386777386" y="371.3045352922389" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m₁ = 2 kg</text><text x="375.0967741935484" y="300.72005748961993" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuerda continua tiene una sola</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">magnitud de tensión T. Las poleas</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fijas cambian su dirección.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el primer bloque, el equilibrio</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical exige T=m₁g. En el segundo,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T=m₂g.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala ambos pesos y cancela g.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>