<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Base de un isósceles con un cuadrado inscrito</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,338.05 338.36,200.95 375.10,338.05 100.90,338.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="259.21,246.65 350.61,246.65 350.61,338.05 259.21,338.05 259.21,246.65" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="338.36,200.95 259.21,338.05" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="338.36,200.95 350.61,338.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="311.98,246.65 342.44,246.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="338.3618042634751" y="200.95161290322582" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="259.2089447778006" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="350.60679424016615" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="259.2089447778006" y="246.6505376344086" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="350.60679424016615" y="246.6505376344086" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="311.9775177682502" y="246.6505376344086" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="342.44346758903873" y="246.6505376344086" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon AC=s en la horizontal. B tiene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura s/2. Por semejanza, una</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal a altura h corta un</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segmento de longitud s−2h.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En PQ, h es el lado del cuadrado, así</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que h=s/3. Por semejanza en BRS,</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MN=h[(s/2−h)/(s/2)]=s/9.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La base del isósceles es 2s sin15°.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye s=9√(2+√3)=18cos15°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>