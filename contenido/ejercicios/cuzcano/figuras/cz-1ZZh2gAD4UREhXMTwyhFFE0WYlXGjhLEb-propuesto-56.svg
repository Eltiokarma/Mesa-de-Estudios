<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">056 · Máxima tensión en coche acelerado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.48387096774195" x2="421" y2="142.48387096774195" stroke="#20364b" stroke-width="1.7"/><line x1="333.26209677419354" y1="105" x2="333.26209677419354" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="333.26,142.48 184.42,340.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">gravedad efectiva</text><line x1="184.4150705645161" y1="340.9465725806451" x2="186.63152058191338" y2="331.19529833978925" stroke="#1766b0" stroke-width="2"/><line x1="184.4150705645161" y1="340.9465725806451" x2="193.1556878308665" y2="336.0884237765041" stroke="#1766b0" stroke-width="2"/><polyline points="333.26,142.48 142.74,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">centrífuga local en máxim</text><line x1="142.73790322580646" y1="396.51612903225805" x2="144.95435324320374" y2="386.7648547914022" stroke="#d37618" stroke-width="2"/><line x1="142.73790322580646" y1="396.51612903225805" x2="151.47852049215686" y2="391.657980228117" stroke="#d37618" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el marco del coche, gravedad</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">efectiva geff=√(10²+7,5²)=12,5 m/s².</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La máxima tensión ocurre en dirección</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferior de esa gravedad efectiva.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tmax=mω²R+mgeff=16+12,5=28,5 N.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>