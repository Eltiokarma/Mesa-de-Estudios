<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">063 · Barra uniforme acodada con torque total conocido</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,241.55 264.11,241.55 362.04,314.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,223.19 100.90,259.91" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="362.04,314.99 362.04,249.71" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="366.53,259.10 362.04,249.71 357.55,259.10" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.9032258064516" y="231.34955837173575" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="264.1136712749616" y="231.34955837173575" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="315.8109639016897" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="182.50844854070658" y="229.30942780337938" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 m</text><text x="317.1570660522273" y="263.9916474654377" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 m</text><text x="260.44143625192015" y="259.91138632872503" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">143°</text><text x="370.6084869431644" y="249.71073348694313" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los tramos pesan 80 N y 60 N. Sus</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pesos actúan a 2 m y 4+1,5 cos 37° de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O, respectivamente.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia horizontal de O a B es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4+3 cos 37°. Del momento total se</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene F=[−24+80×2+60(4+1,5 cos</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">37°)]/(4+3 cos 37°).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica F por el brazo 3 cos 37°</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto de A. Con cos 37°≈4/5 resulta</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F=70 N y un momento de +168 N·m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>