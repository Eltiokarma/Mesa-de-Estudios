<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Una mediana que forma 45°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="223.81,149.40 153.20,396.52 223.81,396.52 329.71,396.52 276.76,272.96 223.81,149.40" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="153.20,396.52 223.81,325.91 276.76,272.96" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="223.81,149.40 223.81,325.91 223.81,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="223.81,379.57 240.75,379.57 240.75,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="216.88948161164805" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="146.28574118237728" y="389.5969624701895" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="322.7950922555542" y="389.5969624701895" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="269.84228693360114" y="266.04041671896573" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="216.88948161164805" y="318.9932220409188" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="216.88948161164805" y="389.5969624701895" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ubica B=(0,0), C=(b,0) y A=(a,h).</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces M=((a+b)/2,h/2).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura tiene x=a, así que</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N=(a,ah/(a+b)). La diferencia vertical</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AN es bh/(a+b).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De AN=b se sigue h=a+b. La pendiente</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de BM es 1 y forma 45° con BC.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>