h="2.5"/><polyline points="275.33,384.39 358.80,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="275.33,384.39 335.73,198.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="275.33,384.39 275.33,154.61" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="335.73,340.50 358.80,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="335.73,340.50 335.73,198.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="335.73,340.50 275.33,154.61" fill="none" stroke="#008674" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sean n,m los tamaños y k=m−n. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia de diagonales da</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k(m+n−3)=38, y la diferencia de</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exteriores da mn=60k.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prueba los divisores positivos de 38.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con n≥7 solo sirven k=1 o k=2 para la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primera ecuación. La segunda</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">selecciona k=2, n=10, m=12.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una diagonal media une dos puntos</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medios de lados. Hay 7(10−1) pares</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">incidentes y se han contado dos veces</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C(7,2)=21 de ellos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>