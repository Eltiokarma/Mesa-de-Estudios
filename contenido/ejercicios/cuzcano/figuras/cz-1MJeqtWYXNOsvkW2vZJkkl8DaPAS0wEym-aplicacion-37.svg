,144.01 305.82,143.17 307.74,142.66 309.72,142.48 311.69,142.66 313.61,143.17 315.40,144.01 317.03,145.15 318.43,146.55 319.57,148.17 320.41,149.97 320.92,151.89 321.09,153.86" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="179.69,204.24 179.69,153.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="191.07,142.48 309.72,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="321.09,153.86 321.09,216.43" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="305.25,216.43 336.94,216.43 336.94,243.25 305.25,243.25 305.25,216.43" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="151.65666212618416" y="360.67856479474955" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="180.5054950157885" y="246.90851959630982" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">200 N</text><text x="321.09276515386046" y="231.46829917652158" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El bloque fija una tensión vertical</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ascendente T=P sobre la esfera. Las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paredes compensan el peso efectivo de</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">200−P.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La normal inclinada es la única</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reacción con componente vertical. Para</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que ambas reacciones se reduzcan a la</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mitad, el peso efectivo debe pasar de</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">150 N a 75 N.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resuelve 200−P nuevo=75. Resta el peso</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inicial de 50 N.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>