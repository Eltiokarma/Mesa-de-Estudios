<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Arco de un semicírculo a partir de un ángulo espacial</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="117.00,334.21 117.00,142.48 226.28,394.02" fill="#f4c581" fill-opacity="0.45"/><polyline points="117.00,334.21 356.65,334.21 226.28,394.02 117.00,334.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="117.00,334.21 117.00,142.48 226.28,394.02" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="356.65,334.21 357.58,336.92 358.29,339.64 358.76,342.34 358.99,345.03 359.00,347.69 358.77,350.33 358.31,352.94 357.62,355.52 356.70,358.05 355.55,360.54 354.18,362.98 352.58,365.36 350.76,367.69 348.73,369.95 346.48,372.14 344.02,374.26 341.36,376.30 338.50,378.27 335.45,380.15 332.21,381.94 328.79,383.64 325.19,385.25 321.42,386.76 317.49,388.17 313.41,389.48 309.19,390.68 304.82,391.77 300.33,392.76 295.72,393.63 290.99,394.39 286.16,395.04 281.24,395.57 276.23,395.98 271.14,396.28 266.00,396.46 260.79,396.52 255.54,396.46 250.26,396.28 244.95,395.98 239.62,395.57 234.29,395.04 228.96,394.39 223.65,393.63 218.36,392.76 213.11,391.77 207.91,390.68 202.75,389.48 197.67,388.17 192.66,386.76 187.73,385.25 182.89,383.64 178.16,381.94 173.54,380.15 169.04,378.27 164.67,376.30 160.44,374.26 156.35,372.14 152.42,369.95 148.64,367.69 145.04,365.36 141.61,362.98 138.36,360.54 135.29,358.05 132.42,355.52 129.75,352.94 127.29,350.33 125.03,347.69 122.98,345.03 121.15,342.34 119.54,339.64 118.16,336.92 117.00,334.21" fill="none" stroke="#008674" stroke-width="2.5"/><text x="117.00012592801286" y="334.2063298843579" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="356.65319957378284" y="334.2063298843579" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="226.28192751048397" y="394.02373706634205" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="117.00012592801286" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="124.18971813738597" y="184.4231588557517" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PAQ es rectángulo en A y BQA es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulo en Q por el teorema de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tales.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos triángulos tienen la misma</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hipotenusa y comparten el cateto AQ.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así ∠ABQ=∠APQ=θ.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El arco AQ mide 2θ por ángulo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inscrito. Resta de 180° para obtener</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el arco QB.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>