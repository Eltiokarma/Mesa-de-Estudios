<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Cuadrilátero inscrito dentro de un triángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="130.63,396.52 184.32,303.53 330.98,342.83 345.37,396.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="130.63,396.52 277.30,142.48 345.37,396.52 130.63,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="184.32,303.53 330.98,342.83" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="130.63,396.52 330.98,342.83" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="345.37,396.52 184.32,303.53" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="345.37,396.52 345.28,392.30 345.04,388.09 344.62,383.90 344.04,379.72 343.30,375.57 342.40,371.45 341.34,367.37 340.11,363.34 338.73,359.35 337.19,355.43 335.50,351.57 333.66,347.77 331.68,344.05 329.55,340.42 327.27,336.87 324.86,333.41 322.32,330.05 319.64,326.79 316.84,323.64 313.92,320.60 310.88,317.67 307.73,314.87 304.47,312.20 301.11,309.65 297.65,307.24 294.10,304.97 290.46,302.84 286.74,300.85 282.95,299.01 279.09,297.32 275.16,295.79 271.18,294.40 267.14,293.18 263.06,292.12 258.95,291.21 254.80,290.47 250.62,289.89 246.42,289.48 242.22,289.23 238.00,289.15 233.78,289.23 229.58,289.48 225.38,289.89 221.20,290.47 217.05,291.21 212.94,292.12 208.86,293.18 204.82,294.40 200.84,295.79 196.91,297.32 193.05,299.01 189.26,300.85 185.54,302.84 181.90,304.97 178.35,307.24 174.89,309.65 171.53,312.20 168.27,314.87 165.12,317.67 162.08,320.60 159.16,323.64 156.36,326.79 153.68,330.05 151.14,333.41 148.73,336.87 146.45,340.42 144.32,344.05 142.34,347.77 140.50,351.57 138.81,355.43 137.27,359.35 135.89,363.34 134.66,367.37 133.60,371.45 132.70,375.57 131.96,379.72 131.38,383.90 130.96,388.09 130.72,392.30 130.63,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="277.29892708827765" y="168.90790680171312" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45°</text><text x="130.63333451188072" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="277.29892708827765" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="345.3666654881192" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="184.3166672559404" y="303.53386919992084" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="330.98225983233726" y="342.83279628819844" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como UI es diámetro, IA y UB son</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares a NU y NI. Son alturas</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de UNI.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea NU=p y NI=q. Las proyecciones</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde N dan NA=q cos45° y NB=p cos45°.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo superior NAB tiene el</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mismo ángulo en N.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su área es cos²45°=1/2 de la de UNI.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al restarla, queda la otra mitad.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>