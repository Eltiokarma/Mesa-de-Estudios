<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Mediana con ángulo fijo de 30°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.67,306.56 179.81,228.45 364.73,307.36 109.67,306.56" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.67,306.56 271.48,266.71" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645159" y="317.72299324831215" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="179.81357839459864" y="221.27700675168796" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="315.3317704426107" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="274.6654163540885" y="261.13072018004505" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="137.56864216054012" y="290.6224681170293" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="153.51012753188297" y="302.5785821455364" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="332.05476369092275" y="303.37565641410356" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2x</text><text x="227.63803450862716" y="244.39216054013508" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=·</text><text x="317.70742685671416" y="283.4487996999251" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=·</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos ABD y ADC tienen igual</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área porque BD=DC. Al expresar sus</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">áreas con el lado AD, resulta AB sen</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">30°=AC sen x.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la ley de senos en ABC,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB/AC=sen(2x)/sen(150°−3x). Igualando</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a 2sen x, se obtiene sen(150°−3x)=cos</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para 0&lt;x&lt;50°, las soluciones son x=15°</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y x=30°. Sus ángulos en B son 105° y</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60°, respectivamente. El dibujo y la</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resolución editorial corresponden a B</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtuso.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>