<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">163 · Ángulo de una ceviana igual a la base</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.36,344.28 168.27,196.07 364.32,344.28 112.36,344.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="168.27,196.07 251.81,344.28" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="354.3854719822462" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="168.27264801458347" y="182.59344535150987" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="355.0591662043275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="251.810731552667" y="356.4065546484901" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="139.97749068716809" y="332.15356265356263" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4θ</text><text x="336.69620353491314" y="334.8483395418879" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3θ</text><text x="169.6200364587461" y="227.73095823095827" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABC, ∠B = 180° − 7θ. Por tanto ∠DBC</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= 180° − 9θ y ∠BDC = 6θ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ley de senos da BD/BC = sen 3θ/sen</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">6θ y AC/BC = sen 7θ/sen 4θ.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al igualar, queda sen 4θ = 2 cos 3θ</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 7θ = sen 10θ + sen 4θ. Entonces</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 10θ = 0. Como 0° &lt; θ &lt; 20°, θ =</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">18°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>