<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Cuerda desde un punto del diámetro y otro del arco</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,326.62 283.70,326.62 375.10,326.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,326.62 323.69,219.60 283.70,326.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,326.62 101.07,319.90 101.56,313.19 102.39,306.51 103.54,299.88 105.01,293.31 106.81,286.83 108.92,280.44 111.34,274.16 114.07,268.01 117.09,262.00 120.41,256.14 124.01,250.46 127.88,244.96 132.02,239.65 136.42,234.56 141.06,229.68 145.93,225.04 151.03,220.65 156.33,216.51 161.83,212.63 167.52,209.03 173.37,205.72 179.38,202.69 185.54,199.96 191.81,197.54 198.20,195.43 204.69,193.64 211.25,192.16 217.88,191.01 224.56,190.19 231.27,189.69 238.00,189.53 244.73,189.69 251.44,190.19 258.12,191.01 264.75,192.16 271.31,193.64 277.80,195.43 284.19,197.54 290.46,199.96 296.62,202.69 302.63,205.72 308.48,209.03 314.17,212.63 319.67,216.51 324.97,220.65 330.07,225.04 334.94,229.68 339.58,234.56 343.98,239.65 348.12,244.96 351.99,250.46 355.59,256.14 358.91,262.00 361.93,268.01 364.66,274.16 367.08,280.44 369.19,286.83 370.99,293.31 372.46,299.88 373.61,306.51 374.44,313.19 374.93,319.90 375.10,326.62" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="326.6236559139785" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354836" y="326.6236559139785" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="283.6989247311828" y="326.6236559139785" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="323.6854838709677" y="219.60252086078017" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="192.3010752688172" y="349.4731182795699" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="329.39784946236557" y="349.4731182795699" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa A=(0,0), B=(12,0) y Q=(x,y). Por</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Thales, x²+y²=12x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia a P=(8,0) da</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(x−8)²+y²=25. Sustituye para obtener</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">12x−16x+64=25, así que x=39/4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto AQ²=12x=117. Toma la raíz</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positiva.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>