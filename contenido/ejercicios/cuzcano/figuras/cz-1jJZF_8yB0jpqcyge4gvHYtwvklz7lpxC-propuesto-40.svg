<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · pH ideal de hidróxido de sodio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 238.00,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Ácido</text><polyline points="238.00,269.50 375.10,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Básico</text><circle cx="367.26267281105993" cy="269.5" r="3.7" fill="#20364b"/><text x="374.26267281105993" y="253.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">pH 13,6</text><circle cx="100.90322580645162" cy="269.5" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="288.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">0</text><circle cx="238.0" cy="269.5" r="3.7" fill="#20364b"/><text x="245.0" y="288.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">7 · neutro</text><circle cx="375.0967741935484" cy="269.5" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="288.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">14</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada fórmula de NaOH libera un OH⁻.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así [OH⁻]≈0,4 M.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El pOH es −log₁₀(0,4)≈0,398.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A 25 °C, pH+pOH=14. Resta 0,398 de 14.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>