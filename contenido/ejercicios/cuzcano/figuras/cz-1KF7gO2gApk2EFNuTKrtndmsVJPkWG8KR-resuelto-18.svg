<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Suma de ángulos en dos triángulos adyacentes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,325.86 375.10,325.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="125.28,347.19 335.49,191.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="224.29,347.19 277.61,197.91" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="177.07,200.95 353.77,344.14" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="152.69534050179212" y="315.1989247311828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="347.6774193548386" y="315.1989247311828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">w</text><text x="254.75627240143365" y="278.63978494623655" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="295.88530465949816" y="232.33154121863797" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama α al ángulo exterior que</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">completa x y z en el primer triángulo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el segundo triángulo, el ángulo</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior en el cruce de la horizontal</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con la recta común es 180°−α. Los</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">otros dos son y y w.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma 360° de cada triángulo y resta la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pareja suplementaria.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>