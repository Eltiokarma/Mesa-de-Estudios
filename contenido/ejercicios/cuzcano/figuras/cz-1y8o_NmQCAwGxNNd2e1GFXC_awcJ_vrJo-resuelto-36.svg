<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Mínimo entero con dos lados laterales fijados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="151.82,351.76 112.65,188.55 243.22,188.55 360.73,351.76 151.82,351.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="151.82,351.76 243.22,188.55" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="112.65,188.55 360.73,351.76" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="197.52,270.15 236.69,270.15" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="153.1305683563748" y="371.34331797235023" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="100.9032258064516" y="166.3509984639017" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="253.66820276497694" y="167.65668202764977" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="375.0967741935484" y="372.6490015360983" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="112.65437788018431" y="274.7227342549923" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7</text><text x="309.8125960061444" y="262.9715821812596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">11</text><text x="215.80337941628264" y="248.60906298003073" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Traza desde un extremo de la base</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">menor una paralela al lateral opuesto.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo resultante tiene lados 7,</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">11 y diferencia de bases B−b. Por</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desigualdad triangular, B−b&gt;4.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia buscada es (B−b)/2, así</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que debe ser mayor que 2.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se alcanza 3 con bases 16 y 10 y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura √40. Con desplazamientos</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontales de −3 y 9 para los lados,</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sus longitudes son √(9+40)=7 y</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(81+40)=11.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>