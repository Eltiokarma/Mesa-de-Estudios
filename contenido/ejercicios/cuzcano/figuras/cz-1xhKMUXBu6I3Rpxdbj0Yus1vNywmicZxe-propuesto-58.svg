<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Longitud de una poligonal de pies de perpendiculares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,364.22 375.10,364.22" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,364.22 369.10,307.21" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,364.22 351.39,252.70" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,364.22 322.73,203.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,364.22 284.37,160.46" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="312.78,364.22 303.62,321.13 277.73,285.49 239.58,263.47 195.77,258.86" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645163" y="381.67008797653955" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="312.78005865102637" y="380.4237536656891" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="375.09677419354836" y="351.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="295.3313782991202" y="157.3299120234605" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="314.8382101388239" y="316.14703451286425" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H1</text><text x="288.9452878437353" y="280.50848439773944" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H2</text><text x="250.79542205804978" y="258.4826491168257" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H3</text><text x="206.9850711567625" y="253.87799568862502" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada triángulo OPHⱼ es rectángulo en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hⱼ. Por Thales, todos los pies y P</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">están en la circunferencia de diámetro</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OP.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los radios vectores desde O giran en</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pasos α/n. El ángulo inscrito que</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intercepta cada cuerda HⱼHⱼ₊₁,</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">incluyendo P=H₀, es α/n.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada cuerda mide 2·(a/2)sen(α/n). Hay</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">n cuerdas iguales.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>