<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Dos corrientes paralelas que anulan el campo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,203.59 375.10,203.59" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,335.41 375.10,335.41" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="116.72,203.59 116.72,335.41" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="211.64,189.35 275.97,189.35" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="267.53,193.31 275.97,189.35 267.53,185.40" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="211.64,349.65 275.97,349.65" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="267.53,353.60 275.97,349.65 267.53,345.69" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="223.76,256.32 289.67,256.32" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="281.24,260.27 289.67,256.32 281.24,252.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="128.32258064516128" y="231.00744416873448" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2b</text><text x="128.32258064516128" y="294.81017369727044" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3b</text><text x="243.272952853598" y="177.22332506203472" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I₁</text><text x="243.272952853598" y="361.77667493796525" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I₂</text><text x="211.10794044665013" y="258.4267990074442" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">+q</text><text x="279.6563275434243" y="242.6079404466501" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">v</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La regla de la mano derecha da campos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuestos en la región entre los</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cables.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada campo es perpendicular a la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">velocidad, así que los campos deben</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tener módulos iguales para cancelar la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerza.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala μ₀I₁/(2π·2b) a μ₀I₂/(2π·3b) y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">despeja la razón.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>