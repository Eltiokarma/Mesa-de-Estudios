<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">088 · Puntuaciones con empates</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,195.90 375.10,195.90 375.10,149.72 100.90,149.72 100.90,195.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,268.06 375.10,268.06 375.10,221.88 100.90,221.88 100.90,268.06" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,340.21 375.10,340.21 375.10,294.03 100.90,294.03 100.90,340.21" fill="none" stroke="#008674" stroke-width="2.5"/><text x="111.51103565365024" y="164.8106960950764" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1:Nora y Susana</text><text x="111.51103565365024" y="236.9668930390492" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3:Carla por competenci</text><text x="111.51103565365024" y="309.12308998302206" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">rangos densos:otro</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Orden por puntaje:Nora=Susana&gt;Carla&gt;Ma</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ría=Natalia&gt;Rosa&gt;Sonia.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con clasificación de competencia,los</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos primeros empatan en 1 y Carla</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ocupa3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con rangos densos,el tercer nivel</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sería María/Natalia. La convención</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">debe explicitarse.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>