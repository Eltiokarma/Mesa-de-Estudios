<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Máximo de un triángulo adyacente a un triángulo rectángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="150.56,229.36 238.00,295.25 375.10,295.25" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,295.25 238.00,295.25 375.10,295.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,295.25 150.56,229.36 238.00,295.25 375.10,295.25 150.56,229.36" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="119.41129032258064" y="284.6924371591763" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53°</text><text x="237.99999999999997" y="309.6440500624021" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20</text><text x="100.9032258064516" y="295.24888877207945" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="150.55711673835086" y="229.35594993759793" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="237.99999999999997" y="295.24888877207945" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="295.24888877207945" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea x=AC. La altura de B sobre AC vale</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB·sen 53°=x cos 53°·sen 53°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área BCD es x(20−x)sen 53°cos</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">53°/2. El producto x(20−x)=100−(x−10)²</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es máximo en x=10.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye x=10. El libro obtiene 24</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con la aproximación del triángulo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3–4–5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>