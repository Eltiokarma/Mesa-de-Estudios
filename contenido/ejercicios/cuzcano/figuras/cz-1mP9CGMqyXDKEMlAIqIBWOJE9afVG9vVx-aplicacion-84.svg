<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">084 · Varilla giratoria unida a un hilo aislante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="330.02,335.70 215.46,246.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="215.46,246.49 100.90,157.29" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="360.07,335.70 359.93,338.65 359.50,341.56 358.78,344.42 357.79,347.20 356.52,349.87 355.01,352.39 353.25,354.76 351.27,356.95 349.09,358.93 346.72,360.69 344.19,362.20 341.52,363.46 338.75,364.46 335.89,365.17 332.97,365.60 330.02,365.75 327.08,365.60 324.16,365.17 321.30,364.46 318.52,363.46 315.86,362.20 313.33,360.69 310.96,358.93 308.78,356.95 306.80,354.76 305.04,352.39 303.52,349.87 302.26,347.20 301.27,344.42 300.55,341.56 300.12,338.65 299.98,335.70 300.12,332.76 300.55,329.84 301.27,326.98 302.26,324.20 303.52,321.54 305.04,319.01 306.80,316.64 308.78,314.45 310.96,312.47 313.33,310.72 315.86,309.20 318.52,307.94 321.30,306.95 324.16,306.23 327.08,305.80 330.02,305.65 332.97,305.80 335.89,306.23 338.75,306.95 341.52,307.94 344.19,309.20 346.72,310.72 349.09,312.47 351.27,314.45 353.25,316.64 355.01,319.01 356.52,321.54 357.79,324.20 358.78,326.98 359.50,329.84 359.93,332.76 360.07,335.70" fill="none" stroke="#008674" stroke-width="2.5"/><text x="323.4507291206363" y="381.712770658418" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="280.25585505965535" y="271.84754750331416" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">hilo aislante, 2 m</text><text x="153.48828988068936" y="221.1405214317278" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">varilla, 2 m</text><text x="375.09677419354836" y="313.16438356164383" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ω = 4 rad/s</text><text x="127.19575784357048" y="289.688908528502" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊗ 10 T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El tramo conductor comienza a 2 m del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">eje y termina a 4 m. Un punto a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia r tiene rapidez ωr.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Integra Bωr a lo largo del tramo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conductor para obtener Bω(4²−2²)/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye B=10 T y ω=4 rad/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>