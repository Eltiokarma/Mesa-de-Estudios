<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">032 · Atwood dentro de ascensor</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.4838709677419" x2="421" y2="142.4838709677419" stroke="#20364b" stroke-width="1.7"/><line x1="153.32258064516128" y1="105" x2="153.32258064516128" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="153.32,311.84 153.32,142.48 322.68,142.48 322.68,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">cuerda</text><circle cx="153.32258064516128" cy="311.8387096774194" r="3.7" fill="#20364b"/><text x="160.32258064516128" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m1</text><circle cx="322.6774193548387" cy="396.5161290322581" r="3.7" fill="#20364b"/><text x="329.6774193548387" y="388.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m2 quieto</text><circle cx="238.0" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="245.0" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">polea↑g/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Restricción en tierra: a 1+a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2=2apolea=g; como a 2=0, a 1=g hacia</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arriba.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para m2 quieto, T=m2g.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para m1: T−m1g=m1g, así T=2m1g y</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m1/m2=1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>