<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Cuadrática en log x</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="253.62298387096774" x2="421" y2="253.62298387096774" stroke="#20364b" stroke-width="1.7"/><line x1="272.2741935483871" y1="105" x2="272.2741935483871" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">t=log x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">t²+2t−8</text><polyline points="100.90,142.48 105.47,159.14 110.04,175.23 114.61,190.75 119.18,205.71 123.75,220.10 128.32,233.94 132.89,247.20 137.46,259.90 142.03,272.04 146.60,283.61 151.17,294.62 155.74,305.06 160.31,314.94 164.88,324.26 169.45,333.01 174.02,341.19 178.59,348.81 183.16,355.87 187.73,362.36 192.30,368.29 196.87,373.65 201.44,378.45 206.01,382.69 210.58,386.35 215.15,389.46 219.72,392.00 224.29,393.98 228.86,395.39 233.43,396.23 238.00,396.52 242.57,396.23 247.14,395.39 251.71,393.98 256.28,392.00 260.85,389.46 265.42,386.35 269.99,382.69 274.56,378.45 279.13,373.65 283.70,368.29 288.27,362.36 292.84,355.87 297.41,348.81 301.98,341.19 306.55,333.01 311.12,324.26 315.69,314.94 320.26,305.06 324.83,294.62 329.40,283.61 333.97,272.04 338.54,259.90 343.11,247.20 347.68,233.94 352.25,220.10 356.82,205.71 361.39,190.75 365.96,175.23 370.53,159.14 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">cuadrática</text><circle cx="135.17741935483872" cy="253.62298387096774" r="3.7" fill="#20364b"/><text x="142.17741935483872" y="245.62298387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">t=−4</text><circle cx="340.8225806451613" cy="253.62298387096774" r="3.7" fill="#20364b"/><text x="347.8225806451613" y="245.62298387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">t=2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x&gt;0. Tomar logaritmos decimales y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">poner t=log x: t²=8−2t.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Factorizar t²+2t−8=(t−2)(t+4), luego</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t=2 o −4.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=100 o 10^(−4). Su producto es</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">10^(−2)=0,01.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>