<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">074 · Fem de una bobina a partir de una gráfica</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="190.76,387.00 289.07,387.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="287.41,387.72 289.07,387.00 287.41,386.27" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="190.76,387.00 190.76,143.83" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="191.49,145.48 190.76,143.83 190.04,145.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="190.76,345.61 283.89,159.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="190.76,283.52 221.81,283.52 221.81,387.00" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="291.5485513435385" y="387.3068129557848" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t (s)</text><text x="193.24686288680113" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Φ (Wb)</text><text x="184.45144865646148" y="345.60620195782144" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="184.45144865646148" y="283.52092503777675" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10</text><text x="221.80609027002168" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De los puntos de la gráfica, la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente del flujo es (10−4)/3=2</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Wb/s.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente es constante y también</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale 2 Wb/s entre 3 y 9 s.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fem de toda la bobina es N por la</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tasa de cambio de flujo de cada</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">espira.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>