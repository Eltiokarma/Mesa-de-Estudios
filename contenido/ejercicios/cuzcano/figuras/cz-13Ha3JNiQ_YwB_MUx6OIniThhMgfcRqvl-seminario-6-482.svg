<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">482 · Distinción entre pentano y cuatro isómeros con C₅H₁₀</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="208.44,156.06 235.20,171.24 261.97,156.06 288.73,171.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="237.88,164.13 259.29,151.99" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="235.20,171.24 235.20,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="208.44,209.99 235.20,225.16 261.97,209.99 288.73,225.16 315.49,209.99" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="237.88,218.05 259.29,205.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="232.41,249.53 272.35,289.47 232.41,329.41 192.47,289.47 232.41,249.53" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="272.35,289.47 289.13,289.47" fill="none" stroke="#008674" stroke-width="2.5"/><text x="176.48904443091905" y="164.85149117468046" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="176.48904443091905" y="218.7734327449787" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="160.51217285453438" y="290.66935483870964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="264.36183810103466" y="353.3785757760195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃–CH=CH–CH₂–CH₃</text><text x="176.48904443091905" y="354.5768411442483" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="264.36183810103466" y="395.31786366402923" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃–CH₂–CH₂–CH₂–CH₃</text><text x="176.48904443091905" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los alquenos acíclicos con cinco</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">carbonos y un doble enlace tienen diez</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hidrógenos. Esto cubre A, B y D.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Un único ciclo sin doble enlace</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también reduce el número de H en dos.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El metilciclobutano de C tiene C₅H₁₀.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El pentano acíclico saturado de E</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva los doce hidrógenos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>