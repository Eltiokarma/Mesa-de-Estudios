<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">094 · Comparación con áreas adyacentes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,210.74 296.76,328.26 257.59,210.74 100.90,210.74" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="296.76,328.26 375.10,210.74 257.59,210.74" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="210.7442396313364" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="296.7557603686636" y="328.2557603686636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="257.58525345622115" y="210.7442396313364" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="210.7442396313364" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="202.74654377880185" y="238.1635944700461" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S₁</text><text x="312.42396313364054" y="238.1635944700461" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S₂</text><text x="279.52073732718895" y="307.88709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="273.2534562211982" y="219.36175115207374" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las áreas tienen igual altura, por lo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que AC&gt;CD=n.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo en C de ABC es suplementario</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de β. Por la ley de senos, sen α/sen</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">β=AC/m.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como la proyección de B está a la</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha de C, m&gt;AC&gt;n. Así m/n&gt;1 y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC/m&lt;1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>