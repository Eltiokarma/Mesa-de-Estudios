<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Recta perpendicular con paso por un punto diagonal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,269.50 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,396.52 238.00,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="121.57,195.41 312.09,385.93" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="132.15,375.35 343.85,163.65" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="303.625" y="189.05645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de la recta dada es −1.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente perpendicular es 1, pues</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el producto de pendientes debe ser −1.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye (3,3) en y−3=x−3 y reduce.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>