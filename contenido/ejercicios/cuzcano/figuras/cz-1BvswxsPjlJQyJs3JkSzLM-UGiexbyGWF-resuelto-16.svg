<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Edades y una mentira</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,269.50 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><circle cx="110.98387096774192" cy="269.5" r="3.7" fill="#20364b"/><text x="117.98387096774192" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">15</text><circle cx="195.66129032258064" cy="269.5" r="3.7" fill="#20364b"/><text x="202.66129032258064" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">18</text><circle cx="280.3387096774194" cy="269.5" r="3.7" fill="#20364b"/><text x="287.3387096774194" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">20</text><circle cx="365.01612903225805" cy="269.5" r="3.7" fill="#20364b"/><text x="372.01612903225805" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">17</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las frases Marco15 y Marco17 se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contradicen: una es la única mentira.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Lucio18 y Víctor17 deben ser</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verdaderas; Marco no puede tener17,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que tiene 15.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma Marco+Víctor=15+17=32.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>