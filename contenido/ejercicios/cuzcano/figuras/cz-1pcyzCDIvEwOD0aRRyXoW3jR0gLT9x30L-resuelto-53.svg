<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">053 · Cateto desde dos perpendiculares auxiliares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="124.39,396.52 351.61,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="124.39,396.52 225.38,283.61 351.61,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="225.38,283.61 351.61,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="225.38,283.61 225.38,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="351.61,396.52 351.61,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="124.39,396.52 124.39,306.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="225.38,396.52 124.39,306.19" fill="none" stroke="#008674" stroke-width="2.5"/><text x="124.39332049799454" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="225.37703561088827" y="283.61290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="351.6066795020054" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="225.37703561088827" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="124.39332049799454" y="306.1935483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="351.6066795020054" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos rectángulos AHN y CMA</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son semejantes, pues AH⊥CM y HN⊥AM.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta AH/AN=MC/AC.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así AH·AC=4·9=36. En ABC, AH es la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección de AB sobre la hipotenusa</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El teorema del cateto da AB²=AH·AC=36.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>