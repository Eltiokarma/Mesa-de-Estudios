<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">080 · Área de un triángulo con dos radios al baricentro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="324.77,184.82 229.05,142.48 203.11,227.16" fill="#f4c581" fill-opacity="0.45"/><polyline points="324.77,184.82 229.05,142.48 151.23,396.52 324.77,184.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="324.77,184.82 203.11,227.16" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="324.77,184.82 252.31,184.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="229.05,142.48 252.31,184.82" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="324.773146012197" y="184.82258064516134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="229.0543148441034" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="151.22685398780305" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="203.11182789200328" y="227.16129032258064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="252.31309624943458" y="184.82258064516134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon G en el origen y llama a,b a los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vectores GA,GB. El vector GD=−a−b, así</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AD=−2a−b.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De ∣2a+b∣²=256 se obtiene a·b=−26. El</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">determinante tiene módulo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(81·36−26²)=8√35.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área ABD es 3/2 veces ese módulo.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como BC=3BD, triplica el resultado.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>