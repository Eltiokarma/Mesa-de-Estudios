<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">037 · Una suma de dos vectores iguales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.37,340.79 205.83,340.79 303.29,340.79 347.47,340.79" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.37,340.79 205.83,201.61 375.10,186.80 303.29,340.79" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="205.83,361.18 205.83,340.79 205.83,201.61 205.83,177.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="221.42,340.79 221.42,325.20 205.83,325.20" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645163" y="333.32330602430187" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="295.8199371887704" y="333.32330602430187" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="367.6284674281411" y="179.32941597435152" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="198.361581497611" y="194.13834960360862" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="211.16439309545208" y="177.81877225794048" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como N está en la mediatriz, NB=NA=5.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La dirección de NB forma −α con el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sentido de AB.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector NC es NB+BC, con dos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sumandos de módulo 5. El ángulo entre</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sus direcciones es α+β=120°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la ley del coseno para vectores,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">NC²=25+25+50cos120°=25.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>