<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">194 · Composición de una gráfica con una función que toma valores no nega</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="303.7741935483871" x2="421" y2="303.7741935483871" stroke="#20364b" stroke-width="1.7"/><line x1="169.4516129032258" y1="105" x2="169.4516129032258" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="169.45,235.23 238.00,303.77" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F</text><polyline points="100.90,303.77 169.45,235.23 375.10,235.23" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">G</text><circle cx="100.90322580645162" cy="235.2258064516129" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="227.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Punto de F</text><circle cx="100.90322580645162" cy="303.7741935483871" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="295.7741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Inicio de G</text><circle cx="169.4516129032258" cy="235.2258064516129" r="3.7" fill="#20364b"/><text x="176.4516129032258" y="227.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,1)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La función interior es −x para x&lt;0 y 0</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para x≥0. Siempre es no negativa, así</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que el punto aislado de f no</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interviene.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para x&lt;0, la entrada −x debe estar en</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,1], lo cual da −1≤x&lt;0. Allí</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f(−x)=1+x.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para x≥0, se obtiene f(0)=1. Une el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segmento de (−1,0) a (0,1) con una</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semirrecta horizontal hacia la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>