<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Fuerza mínima para separar una esfera del suelo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="311.33,253.11 310.11,265.55 306.48,277.51 300.58,288.54 292.65,298.20 282.99,306.13 271.97,312.02 260.01,315.65 247.56,316.88 235.12,315.65 223.16,312.02 212.14,306.13 202.48,298.20 194.55,288.54 188.65,277.51 185.02,265.55 183.80,253.11 185.02,240.67 188.65,228.71 194.55,217.69 202.48,208.02 212.14,200.09 223.16,194.20 235.12,190.57 247.56,189.35 260.01,190.57 271.97,194.20 282.99,200.09 292.65,208.02 300.58,217.69 306.48,228.71 310.11,240.67 311.33,253.11" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,196.62 253.94,349.65" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="183.80,316.88 352.78,316.88" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,253.11 311.33,253.11" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="325.36,246.10 311.33,253.11 325.36,260.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="196.55213803450863" y="291.3717179294824" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="362.3435858964741" y="241.6342835708927" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="238.0" y="307.3132033008252" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45°</text><text x="242.46361590397598" y="246.73555888972243" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el umbral la reacción vertical del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">piso se anula.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La normal del plano forma 45° con la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal. Su componente vertical</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">debe igualar los 8 N del peso.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A 45° ambas componentes son iguales.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La horizontal debe equilibrar F.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>