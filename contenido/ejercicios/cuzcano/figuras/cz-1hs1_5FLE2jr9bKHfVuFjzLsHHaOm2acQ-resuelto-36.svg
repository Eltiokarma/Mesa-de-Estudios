<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Enteros con un recíproco cuadrático</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="108.75" y1="275" x2="108.75" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="108.75" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="108.75" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><line x1="240.00000000000003" y1="275" x2="240.00000000000003" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="240.00000000000003" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="240.00000000000003" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><line x1="371.25" y1="275" x2="371.25" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="371.25" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="371.25" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="108.75" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">2</text><text x="240.00000000000003" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">3</text><text x="371.25" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">4</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se excluye cero. Con t=x+1/x, el lado</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierdo es t²+10.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La condición se reduce a (t−2)(t−5)&lt;0,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">o 2&lt;t&lt;5. En x&lt;0, t&lt;0 y no hay</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">soluciones.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para enteros positivos, 1 da t=2, los</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valores 2,3,4 cumplen y desde 5 se</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene t&gt;5. Hay tres enteros.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>