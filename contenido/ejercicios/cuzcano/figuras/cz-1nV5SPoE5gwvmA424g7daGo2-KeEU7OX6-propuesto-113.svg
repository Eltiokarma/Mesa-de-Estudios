<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">113 · Composición durante la ebullición</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="373.42228739002934" x2="421" y2="373.42228739002934" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">Q (cal)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">T (°C)</text><polyline points="100.90,396.52 105.06,373.42 171.53,373.42 254.62,142.48 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">proceso</text><circle cx="105.05767350928642" cy="373.42228739002934" r="3.7" fill="#20364b"/><text x="112.05767350928642" y="365.42228739002934" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">50</text><circle cx="171.5288367546432" cy="373.42228739002934" r="3.7" fill="#20364b"/><text x="178.5288367546432" y="365.42228739002934" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">850</text><circle cx="254.6177908113392" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="261.6177908113392" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1850</text><circle cx="344.3538611925709" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="337.3538611925709" y="164.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="end">2930: 2g vapor</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fusión recibe 800 cal: m=800/80=10</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">g.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde 1850 hasta 2930 cal hay 1080 cal</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para vaporizar: mv=1080/540=2 g.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A 100°C coexisten 2 g de vapor y 8 g</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de agua.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>