<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">177 · Mediatriz que pasa por el pie de una bisectriz</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.69,326.94 198.65,189.21 341.46,326.94 111.69,326.94" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="198.65,189.21 225.31,326.94" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="225.31,326.94 368.75,353.28" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="341.46,326.94 368.75,353.28" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.9032258064516" y="336.46161887694143" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="198.64814814814812" y="176.5153823178017" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="351.61260454002394" y="337.09632616487454" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="225.3058542413381" y="338.36574074074076" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="375.0967741935484" y="362.48461768219835" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="319.2425328554361" y="316.15098566308245" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como EA = EB, el triángulo ABE es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">isósceles. Así ∠EAB = ∠ABE, y este</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">último es la mitad de ∠ABC.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De A + B = 120° y A = B/2, resulta B =</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">80°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EF es perpendicular a AB. El ángulo</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agudo que forma con BC prolongada mide</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">90° − 80° = 10°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>