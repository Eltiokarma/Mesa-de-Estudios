3 343.11,307.93 347.68,312.00 352.25,316.15 356.82,320.38 361.39,324.68 365.96,329.06 370.53,333.52 375.10,338.05" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">trayectoria si θ45°</text><circle cx="100.90322580645164" cy="200.95161290322582" r="3.7" fill="#20364b"/><text x="107.90322580645164" y="192.95161290322582" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="375.09677419354836" cy="338.04838709677415" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="330.04838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea θ la inclinación. Altura del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">impacto sobre piso=2tanθ y velocidad</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reflejada=(v sin2θ,v cos2θ), v²=2gh.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al imponer alcance 4, resulta</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h=4/[sin²(2θ)(2tanθ+4cot2θ)].</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si θ=45°, h=2 m (A); para θ=30°,</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h≈1,540 m. El croquis sin escala no</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fija θ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>