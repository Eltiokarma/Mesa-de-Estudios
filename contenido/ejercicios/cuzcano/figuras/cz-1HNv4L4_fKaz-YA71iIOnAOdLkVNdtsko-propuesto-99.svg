<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">099 · Un corte intermedio entre dos planos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="365.02,269.50 364.40,281.95 362.58,294.28 359.55,306.37 355.35,318.11 350.02,329.37 343.61,340.07 336.18,350.08 327.81,359.31 318.58,367.68 308.57,375.11 297.87,381.52 286.61,386.85 274.87,391.05 262.78,394.08 250.45,395.90 238.00,396.52 225.55,395.90 213.22,394.08 201.13,391.05 189.39,386.85 178.13,381.52 167.43,375.11 157.42,367.68 148.19,359.31 139.82,350.08 132.39,340.07 125.98,329.37 120.65,318.11 116.45,306.37 113.42,294.28 111.60,281.95 110.98,269.50 111.60,257.05 113.42,244.72 116.45,232.63 120.65,220.89 125.98,209.63 132.39,198.93 139.82,188.92 148.19,179.69 157.42,171.32 167.43,163.89 178.13,157.48 189.39,152.15 201.13,147.95 213.22,144.92 225.55,143.10 238.00,142.48 250.45,143.10 262.78,144.92 274.87,147.95 286.61,152.15 297.87,157.48 308.57,163.89 318.58,171.32 327.81,179.69 336.18,188.92 343.61,198.93 350.02,209.63 355.35,220.89 359.55,232.63 362.58,244.72 364.40,257.05 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="161.79,167.89 314.21,167.89" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="121.59,320.31 354.41,320.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="113.55,244.10 362.45,244.10" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,167.89 238.00,320.31" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="246.89112903225808" y="272.0403225806451" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="298.96774193548384" y="163.31451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z = 4</text><text x="329.4516129032258" y="239.01612903225808" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z = 1</text><text x="320.56048387096774" y="330.9758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z = −2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las distancias al centro son √(25−9)=4</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m y √(25−21)=2 m. Coloca los planos en</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alturas +4 y −2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área de una zona es proporcional a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">su altura, así que el nuevo corte</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda a media altura, z=1.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su radio es √(25−1)=2√6. Duplica para</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hallar el diámetro.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>