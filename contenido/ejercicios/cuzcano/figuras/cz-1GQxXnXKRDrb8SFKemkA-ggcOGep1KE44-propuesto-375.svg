<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">375 · Dominio maximal de una exponencial con módulo y rango fijado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,395.47 103.65,395.35 106.39,395.21 109.13,395.06 111.87,394.89 114.61,394.71 117.35,394.50 120.10,394.26 122.84,394.00 125.58,393.71 128.32,393.38 131.06,393.02 133.81,392.61 136.55,392.16 139.29,391.65 142.03,391.08 144.77,390.45 147.52,389.75 150.26,388.96 153.00,388.09 155.74,387.11 158.48,386.01 161.23,384.80 163.97,383.43 166.71,381.92 169.45,380.22 172.19,378.33 174.94,376.22 177.68,373.86 180.42,371.23 183.16,368.29 185.90,365.01 188.65,361.35 191.39,357.27 194.13,352.71 196.87,347.63 199.61,341.95 202.35,335.61 205.10,328.54 207.84,320.65 210.58,311.84 213.32,302.01 216.06,291.03 218.81,278.78 221.55,265.11 224.29,249.85 227.03,232.82 229.77,213.81 232.52,192.59 235.26,168.91 238.00,142.48 240.74,168.91 243.48,192.59 246.23,213.81 248.97,232.82 251.71,249.85 254.45,265.11 257.19,278.78 259.94,291.03 262.68,302.01 265.42,311.84 268.16,320.65 270.90,328.54 273.65,335.61 276.39,341.95 279.13,347.63 281.87,352.71 284.61,357.27 287.35,361.35 290.10,365.01 292.84,368.29 295.58,371.23 298.32,373.86 301.06,376.22 303.81,378.33 306.55,380.22 309.29,381.92 312.03,383.43 314.77,384.80 317.52,386.01 320.26,387.11 323.00,388.09 325.74,388.96 328.48,389.75 331.23,390.45 333.97,391.08 336.71,391.65 339.45,392.16 342.19,392.61 344.94,393.02 347.68,393.38 350.42,393.71 353.16,394.00 355.90,394.26 358.65,394.50 361.39,394.71 364.13,394.89 366.87,395.06 369.61,395.21 372.35,395.35 375.10,395.47" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">3^(3−∣x∣)</text><circle cx="100.90322580645162" cy="395.47072879330943" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="387.47072879330943" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−5,1/9)</text><circle cx="238.0" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="245.0" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,27)</text><circle cx="375.09677419354836" cy="395.47072879330943" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="387.47072879330943" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(5,1/9)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe el intervalo de llegada como</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[3⁻²,3³]. Como la base 3 supera 1, el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exponente debe cumplir −2≤3−∣x∣≤3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La desigualdad de la derecha es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">automática. La de la izquierda da</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∣x∣≤5.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En [0,5] el exponente ya recorre</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[−2,3]. El intervalo completo [−5,5]</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva ese rango y contiene todos</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los x admisibles.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>