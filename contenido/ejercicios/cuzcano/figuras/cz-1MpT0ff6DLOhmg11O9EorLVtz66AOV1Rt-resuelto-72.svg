<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">072 · Recta que corta un paralelogramo según una razón de áreas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="130.03629032258064" y1="105" x2="130.03629032258064" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polygon points="142.74,358.41 168.14,320.31 218.95,282.20" fill="#f4c581" fill-opacity="0.45"/><polyline points="142.74,358.41 168.14,320.31 345.96,142.48 320.56,180.59 142.74,358.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">PERU</text><polyline points="168.14,320.31 218.95,282.20" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">EI</text><circle cx="142.73790322580646" cy="358.41129032258067" r="3.7" fill="#20364b"/><text x="149.73790322580646" y="350.41129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="168.14112903225805" cy="320.30645161290323" r="3.7" fill="#20364b"/><text x="175.14112903225805" y="312.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">E</text><circle cx="345.9637096774194" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="352.9637096774194" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="320.56048387096774" cy="180.58870967741933" r="3.7" fill="#20364b"/><text x="327.56048387096774" y="172.58870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">U</text><circle cx="218.94758064516128" cy="282.20161290322585" r="3.7" fill="#20364b"/><text x="225.94758064516128" y="274.20161290322585" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E=P+R−U=(3,6) por el cierre del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelogramo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo PUE ocupa la mitad del</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelogramo. Así</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área(PIE)/área(PUE)=3/7 y PI/PU=3/7,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pues los triángulos comparten altura.</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces I=(7,9).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula la pendiente 3/4 entre E e I y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">usa la ecuación por E.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>