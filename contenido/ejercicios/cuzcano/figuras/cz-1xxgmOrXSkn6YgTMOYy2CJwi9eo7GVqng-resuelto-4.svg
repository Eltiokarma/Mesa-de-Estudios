77342831" y="163.01478680264677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="237.89696214820833" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="300.7762339463559" y="160.4996159307209" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="353.8008979603831" y="309.8637515849009" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="237.89696214820833" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="139.34084173007165" y="351.528125887415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="251.60121158907918" y="212.05406632449623" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="234.54340098564046" y="181.8882146279144" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5θ</text><text x="231.82669587596138" y="360.6077230164187" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4θ</text><text x="212.3851723080155" y="230.73815315272404" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ángulos inscritos opuestos dan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠UPC=180°−5θ y ∠RCP=180°−4θ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo CMP, el ángulo en M</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale 3θ por ser opuesto por el vértice</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a UMR.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma los tres ángulos. Queda</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">360°−6θ=180°, así que θ=30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>