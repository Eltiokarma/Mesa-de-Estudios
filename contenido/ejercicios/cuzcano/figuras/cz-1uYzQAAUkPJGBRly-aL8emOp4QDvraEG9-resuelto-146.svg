<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">146 · Hombre bajo un poste</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="196.27,360.23 196.27,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="196.27,142.48 305.14,360.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="268.85,360.23 268.85,287.65" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="196.27,360.23 305.14,360.23" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="203.26612903225808" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F</text><text x="203.26612903225808" y="352.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="275.8467741935484" y="279.64516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><text x="275.8467741935484" y="352.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="312.13709677419354" y="352.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">S</text><text x="177.86290322580646" y="243.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">altura H</text><text x="283.10483870967744" y="305.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">altura h</text><text x="239.55645161290323" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">personaV→</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sean x la distancia del hombre al</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">poste y y la de la punta de la sombra.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Triángulos semejantes: H/y=h/(y−x).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despejar: y=Hx/(H−h). Por tanto la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punta se mueve a HV/(H−h).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La longitud de sombra y−x crece a</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hV/(H−h). Se distingue desplazamiento</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la punta y crecimiento de longitud.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>