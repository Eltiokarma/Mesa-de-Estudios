<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Dos cotas para el argumento</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución real</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="96.81818181818181" y1="275" x2="128.63636363636363" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="96.81818181818181" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="96.81818181818181" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">-3</text><circle cx="128.63636363636363" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="128.63636363636363" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">-2</text><line x1="351.3636363636364" y1="275" x2="383.1818181818182" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="351.3636363636364" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="351.3636363636364" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">5</text><circle cx="383.1818181818182" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="383.1818181818182" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">6</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La definición impone 0&lt;x²−3x−10&lt;8.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cota inferior da x&lt;−2 o x&gt;5. La</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superior da −3&lt;x&lt;6.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Intersectar ambos conjuntos: quedan</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos intervalos abiertos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>