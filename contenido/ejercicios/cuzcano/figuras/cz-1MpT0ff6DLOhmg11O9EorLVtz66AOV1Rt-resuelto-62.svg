<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">062 · Distancia con normal de longitud √13</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="315.1989247311828" x2="421" y2="315.1989247311828" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645163" y1="105" x2="100.90322580645163" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,376.13 375.10,193.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">L</text><polyline points="222.77,162.87 283.70,254.27" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Distancia</text><circle cx="222.7670250896057" cy="162.86917562724017" r="3.7" fill="#20364b"/><text x="229.7670250896057" y="154.86917562724017" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P(4,5)</text><circle cx="283.69892473118273" cy="254.26702508960574" r="3.7" fill="#20364b"/><text x="290.69892473118273" y="246.26702508960574" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H(6,2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El valor de la expresión de la recta</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en P es 8−15−6=−13.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#2036