<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">045 · Tensión horizontal de dos nudos con cargas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,169.77 189.35,236.11 277.80,280.34 366.25,280.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="189.35,236.11 189.35,315.71" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="277.80,280.34 277.80,364.36" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="175.64,315.71 203.06,315.71 203.06,342.69 175.64,342.69 175.64,315.71" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="264.09,364.36 291.51,364.36 291.51,391.34 264.09,391.34 264.09,364.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,147.66 100.90,191.89" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="366.25,257.34 366.25,305.10" fill="none" stroke="#008674" stroke-width="2.5"/><text x="110.63267429760666" y="163.13943808532775" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="189.35275754422474" y="226.82310093652444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="277.8022892819979" y="270.1633714880333" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="276.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="189.35275754422474" y="328.9823100936525" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 N</text><text x="277.8022892819979" y="377.1873048907388" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Considera los nudos B y C juntos para</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">eliminar la tensión interna de BC.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La única cuerda externa con componente</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical es AB. Debe aportar 2+4=6 N</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia arriba.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras, su componente</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal tiene módulo √(10²−6²). CD</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la equilibra.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>