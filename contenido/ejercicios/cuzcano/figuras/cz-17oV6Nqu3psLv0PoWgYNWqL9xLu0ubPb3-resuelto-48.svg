<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">048 · Cociente trigonométrico en el rayo del baricentro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,261.13 375.10,261.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="196.15,389.86 196.15,149.14" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="129.19,344.83 196.15,261.13 263.11,177.43 346.81,361.57 129.19,344.83" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="196.15,261.13 246.37,294.61" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="210.71,261.13 210.71,261.42 210.70,261.70 210.69,261.99 210.67,262.27 210.64,262.56 210.61,262.84 210.58,263.12 210.54,263.40 210.49,263.69 210.44,263.97 210.38,264.25 210.31,264.52 210.24,264.80 210.17,265.08 210.09,265.35 210.00,265.62 209.91,265.89 209.82,266.16 209.72,266.43 209.61,266.69 209.50,266.96 209.38,267.22 209.26,267.48 209.13,267.73 209.00,267.98 208.86,268.23 208.72,268.48 208.58,268.73 208.42,268.97 208.27,269.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="129.1930363543267" y="344.8278979085431" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="263.1092993028477" y="177.43256922289183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="346.8069636456733" y="361.5674307771082" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="196.15116782858718" y="261.1302335657174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="246.36976643428258" y="294.6092993028477" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="375.09677419354836" y="266.57058174800113" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="203.7676552837843" y="149.14275867501675" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="214.56465398400883" y="268.1608373705148" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como A+B=0 en coordenadas,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">G=C/3=(3,−2).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica el numerador por cos θ y el</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">denominador por sen θ. Ambos dan el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">factor 1−sen θ cos θ, que nunca vale</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cero para θ real.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cociente se reduce a tan θ=−2/3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>