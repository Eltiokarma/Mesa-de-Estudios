<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">074 · Reacción de una articulación sobre una barra de cinco metros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="172.37,391.42 342.10,165.11" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="129.94,391.42 342.10,391.42 342.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="118.62,391.42 172.37,391.42" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="161.62,396.52 172.37,391.42 161.62,386.33" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="353.98354766865435" y="163.4174868884259" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="240.2630936130469" y="268.0855664918457" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 m</text><text x="357.3781880882247" y="285.6245419929593" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 m</text><text x="131.63460018679504" y="378.9771535311445" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La separación horizontal entre</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos es √(5²−4²)=3 m.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tomando momentos respecto de B, la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal del piso N satisface 3N=4×60,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que N=80 N.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La reacción en B compensa las</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes conocidas, 60 N a la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha y 80 N hacia arriba.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>