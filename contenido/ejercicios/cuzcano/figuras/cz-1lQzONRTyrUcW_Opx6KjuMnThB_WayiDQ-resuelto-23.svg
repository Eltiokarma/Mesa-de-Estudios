<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">023 · Ángulo entre una oblicua y un segmento del rectángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,317.04 132.83,292.92 132.83,221.96" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,317.04 132.83,292.92 375.10,292.92 343.17,317.04 100.90,317.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="132.83,221.96 132.83,292.92 100.90,317.04" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="132.83,221.96 100.90,317.04" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="171.86,317.04 304.14,292.92" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,317.04 233.18,292.92" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="132.83,221.96 233.18,292.92" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="100.90322580645162" y="317.0412847799579" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="132.8339394646323" y="292.9158566826658" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="292.9158566826658" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="343.1660605353677" y="317.0412847799579" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="132.8339394646323" y="221.95871522004214" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="171.8603672690753" y="317.0412847799579" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="304.1396327309247" y="292.9158566826658" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="233.182491268301" y="292.9158566826658" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="207.7292022784316" y="306.92279640738775" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">PQ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma AB=BM=1, con A=(0,0,0), B=(0,1,0)</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y M=(0,1,1). Resulta AM=√2 y AP=QC=1.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces P=(1,0,0) y Q=(1+√2,1,0). Los</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vectores AM y PQ tienen normas √2 y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√3, con producto escalar 1.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El coseno del ángulo agudo es 1/√6,</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por lo que su tangente vale √5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>