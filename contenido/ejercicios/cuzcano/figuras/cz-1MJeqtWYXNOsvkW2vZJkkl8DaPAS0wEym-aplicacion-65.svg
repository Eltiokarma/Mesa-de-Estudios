<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">065 · Tres fuerzas en un hexágono regular</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="149.37,377.58 235.42,377.58 278.44,303.06 235.42,228.54 149.37,228.54 106.34,303.06 149.37,377.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="149.37,228.54 278.44,303.06" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="330.08,228.54 235.42,228.54" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="255.21,219.07 235.42,228.54 255.21,238.00" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="235.42,228.54 235.42,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="244.88,162.28 235.42,142.48 225.95,162.28" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="278.44,303.06 363.64,352.63" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="341.77,350.86 363.64,352.63 351.29,334.49" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="149.3656089063275" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="252.6289771708003" y="150.22862358757737" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 N</text><text x="316.3080542672252" y="213.90770068400232" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 N</text><text x="369.66079453720283" y="364.6765904840456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el lado mide s, la fuerza</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal actúa a una altura √3s y la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical a una distancia horizontal s.</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aportan +10√3s y +5s.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para la fuerza oblicua, el brazo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular desde A a la diagonal es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3s/2. El sentido es horario, así que</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aporta −15s.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma y sustituye s=0,5. Queda 5√3−5</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N·m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>