<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">056 · Mancha de un haz en una semiesfera</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="159.67,269.50 310.88,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="182.35,239.26 182.35,299.74" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="310.88,142.48 310.88,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="182.35,239.26 184.73,239.35 187.09,239.63 189.41,240.09 191.70,240.74 193.93,241.56 196.08,242.55 198.16,243.71 200.13,245.03 202.00,246.50 203.74,248.12 205.35,249.86 206.82,251.72 208.14,253.70 209.30,255.77 210.29,257.93 211.12,260.15 211.76,262.44 212.22,264.77 212.50,267.13 212.60,269.50 212.50,271.87 212.22,274.23 211.76,276.56 211.12,278.85 210.29,281.07 209.30,283.23 208.14,285.30 206.82,287.28 205.35,289.14 203.74,290.88 202.00,292.50 200.13,293.97 198.16,295.29 196.08,296.45 193.93,297.44 191.70,298.26 189.41,298.91 187.09,299.37 184.73,299.65 182.35,299.74" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="156.65,251.35 206.55,251.35 310.88,390.47" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="156.65,287.65 206.55,287.65 310.88,148.53" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="315.7217741935484" y="260.4274193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Pantalla</text><text x="173.28225806451616" y="243.18951612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Haz</text><text x="191.7298387096774" y="278.875" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vidrio</text><text x="248.88709677419357" y="263.4516129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">17 cm</text><text x="319.3508064516129" y="390.4677419354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rayo extremo que aún sale tiene sen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">i = 3/5. En el meridiano superior sale</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente desde (16/5, 12/5) cm, con el</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">origen en el centro.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente tiene pendiente −4/3, así</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que al llegar a x = 17 cm su altura es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">12/5 − (4/3)(17 − 16/5) = −16 cm.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al aumentar la altura de entrada desde</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cero hasta la crítica, los rayos</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">llegan cada vez más lejos del eje</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">después del cruce. Por simetría, el</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radio en pantalla vale 16 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>