<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">037 · Lado de un cuadrado a partir de una diagonal dividida</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="134.88,383.42 134.88,173.91 341.77,173.91 341.77,383.42 134.88,383.42" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="134.88,173.91 341.77,383.42" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="134.88,383.42 212.79,173.91" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="134.88,154.27 341.77,154.27" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="212.79,149.03 212.79,159.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="126.36984536082473" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="127.67928999002326" y="165.3991519787163" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="211.48374625872964" y="163.4349850349185" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="349.63015463917526" y="165.3991519787163" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="349.63015463917526" y="395.20668440305957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="199.04402228134353" y="228.2524941802461" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="170.89096275357497" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="279.57486697705355" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea s el lado. Toma D=(0,0), A=(0,s),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O=(5,s) y E=(s,0).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R está a cuatro quintos del recorrido</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de D a O, por lo que R=(4,4s/5).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Además AE tiene ecuación x+y=s.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Impón 4+4s/5=s y obtén s=20. Resta</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AO=5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>