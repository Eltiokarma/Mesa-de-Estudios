<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Diferencia de longitudes por igualdad de perímetros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,200.61 100.90,338.39 375.10,338.39 100.90,200.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="206.01,253.43 206.01,338.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="206.01,285.83 205.76,290.99 205.00,296.09 203.75,301.09 202.01,305.95 199.81,310.61 197.15,315.03 194.08,319.17 190.62,323.00 186.80,326.46 182.65,329.53 178.23,332.18 173.57,334.39 168.71,336.13 163.71,337.38 158.61,338.13 153.46,338.39 148.31,338.13 143.20,337.38 138.20,336.13 133.35,334.39 128.68,332.18 124.26,329.53 120.12,326.46 116.30,323.00 112.83,319.17 109.76,315.03 107.11,310.61 104.90,305.95 103.17,301.09 101.91,296.09 101.16,290.99 100.90,285.83 101.16,280.68 101.91,275.58 103.17,270.58 104.90,265.72 107.11,261.06 109.76,256.64 112.83,252.49 116.30,248.67 120.12,245.21 124.26,242.14 128.68,239.49 133.35,237.28 138.20,235.54 143.20,234.29 148.31,233.53 153.46,233.28 158.61,233.53 163.71,234.29 168.71,235.54 173.57,237.28 178.23,239.49 182.65,242.14 186.80,245.21 190.62,248.67 194.08,252.49 197.15,256.64 199.81,261.06 202.01,265.72 203.75,270.58 205.00,275.58 205.76,280.68 206.01,285.83" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645163" y="338.3880412670735" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="100.90322580645163" y="200.61195873292647" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="177.05277234985945" y="238.8753907911118" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="206.01075268817203" y="253.4261237043495" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="206.01075268817203" y="338.3880412670735" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="338.3880412670735" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cancela UC en la igualdad de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perímetros. Si r es el inradio,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resulta UN+PN−CP=QU+QP+CP.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como QP=3+r por tangentes desde Q y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde P, en el triángulo rectángulo se</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cumple PN=QN+2r−QP.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye QN=QU+UN en la igualdad y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simplifica. Resulta UN−CP=QP−r=3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>