<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">172 · Suma y diferencia angular en un círculo tangente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.71,335.42 375.10,335.42" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="112.71,335.42 243.90,269.83" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="112.71,335.42 243.90,204.23 243.90,335.42" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="309.50,269.83 309.25,264.11 308.50,258.44 307.27,252.85 305.54,247.39 303.35,242.11 300.71,237.03 297.64,232.20 294.15,227.66 290.29,223.44 286.07,219.58 281.53,216.09 276.70,213.02 271.63,210.38 266.34,208.19 260.88,206.47 255.29,205.23 249.62,204.48 243.90,204.23 238.19,204.48 232.51,205.23 226.93,206.47 221.47,208.19 216.18,210.38 211.11,213.02 206.28,216.09 201.74,219.58 197.52,223.44 193.65,227.66 190.17,232.20 187.10,237.03 184.45,242.11 182.26,247.39 180.54,252.85 179.30,258.44 178.56,264.11 178.31,269.83 178.56,275.55 179.30,281.22 180.54,286.81 182.26,292.26 184.45,297.55 187.10,302.63 190.17,307.45 193.65,311.99 197.52,316.21 201.74,320.08 206.28,323.56 211.11,326.64 216.18,329.28 221.47,331.47 226.93,333.19 232.51,334.43 238.19,335.17 243.90,335.42 249.62,335.17 255.29,334.43 260.88,333.19 266.34,331.47 271.63,329.28 276.70,326.64 281.53,323.56 286.07,320.08 290.29,316.21 294.15,311.99 297.64,307.45 300.71,302.63 303.35,297.55 305.54,292.26 307.27,286.81 308.50,281.22 309.25,275.55 309.50,269.83" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.9032258064516" y="345.91997221793486" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="243.9036888408705" y="345.91997221793486" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="253.08720481555798" y="267.20412100632814" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="243.9036888408705" y="193.08002778206514" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="149.44466738694243" y="328.2089056953233" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="146.82080567988885" y="309.8418737459484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">σ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como BD=2BC, las tangentes de las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclinaciones de AC y AD son t y 2t,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con t&gt;0.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe p=θ+σ y q=θ. La razón pedida</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es sen(p+q)/sen(p−q).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desarrolla los dos senos y divide por</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos p cos q. Sale (2t+t)/(2t−t).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>