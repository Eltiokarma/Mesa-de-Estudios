<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">013 · Recta por un cruce y un punto racional</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="292.8294930875576" x2="421" y2="292.8294930875576" stroke="#20364b" stroke-width="1.7"/><line x1="206.89400921658986" y1="105" x2="206.89400921658986" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="186.16,350.89 289.84,288.68" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">3x−5y=11</text><polyline points="206.89,147.67 269.11,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">4x+y=7</text><polyline points="186.16,142.48 269.11,370.59" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">L</text><circle cx="248.36866359447004" cy="313.5668202764977" r="3.7" fill="#20364b"/><text x="255.36866359447004" y="305.5668202764977" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P(2,−1)</text><circle cx="220.7188940092166" cy="237.5299539170507" r="3.7" fill="#20364b"/><text x="227.7188940092166" y="229.5299539170507" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2/3,8/3)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye y=7−4x en la primera</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ecuación. Resulta 23x=46 y P=(2,−1).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente desde P hasta (2/3,8/3)</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es (11/3)/(−4/3)=−11/4.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa y+1=−11(x−2)/4 y despeja.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>