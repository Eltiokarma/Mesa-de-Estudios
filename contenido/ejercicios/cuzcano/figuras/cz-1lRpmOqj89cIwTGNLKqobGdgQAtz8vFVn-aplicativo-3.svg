<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Un segundo aporte al cuarto mes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,230.92 100.90,309.26 375.10,309.26 375.10,230.92" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="257.59,230.92 257.59,309.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,230.92 169.45,213.29 238.00,207.41 306.55,213.29 375.10,230.92" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="257.59,309.26 286.96,298.29 316.34,294.37 345.72,298.29 375.10,309.26" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="222.2995391705069" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S/ 3 000</text><text x="257.58525345622115" y="226.21658986175112" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S/ 2 000</text><text x="375.0967741935484" y="222.2995391705069" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="238.0" y="196.44700460829492" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I₁</text><text x="316.3410138248848" y="285.7557603686636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I₂</text><text x="179.2442396313364" y="321.7926267281106" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 meses</text><text x="316.3410138248848" y="321.7926267281106" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 meses</text><text x="238.0" y="342.55299539170505" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7 meses en total</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El primer depósito gana intereses</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">siete meses. El segundo gana intereses</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">durante tres.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula 3 000×0,02×7=420 y 2</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">000×0,02×3=120.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma los dos capitales y los dos</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intereses.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>