<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">046 · Cifras impares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">cifra o parámetro</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">valor</text><polyline points="100.90,396.52 100.90,364.76 140.07,364.76 140.07,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="179.24,396.52 179.24,301.25 218.41,301.25 218.41,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="257.59,396.52 257.59,237.75 296.76,237.75 296.76,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="335.93,396.52 335.93,142.48 375.10,142.48 375.10,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><circle cx="120.48847926267281" cy="364.76209677419354" r="3.7" fill="#20364b"/><text x="127.48847926267281" y="356.76209677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a=1</text><circle cx="198.8294930875576" cy="301.2540322580645" r="3.7" fill="#20364b"/><text x="205.8294930875576" y="293.2540322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">b=3</text><circle cx="277.1705069124424" cy="237.74596774193552" r="3.7" fill="#20364b"/><text x="284.1705069124424" y="229.74596774193552" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">c=5</text><circle cx="355.5115207373272" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="362.5115207373272" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">n=8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La centena inicial del número decimal</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es7 y b+1 es cifra. Evaluar a n³+b</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">n²+c n+c; n³≤799 acota n≤9.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplicando las restricciones de cifras</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se obtiene a=1, b=3, c=5, n=8.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Evaluar la operación pedida con esos</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valores da 9.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>