<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Recta entre un cuadrado y un triángulo equilátero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="388.22928922851173" x2="421" y2="388.22928922851173" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645159" y1="105" x2="100.90322580645159" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,388.23 100.90,214.40 274.73,214.40 274.73,388.23 100.90,388.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Cuadrado</text><polyline points="100.90,388.23 238.00,150.77 375.10,388.23 100.90,388.23" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Equilátero</text><polyline points="100.90,214.40 238.00,150.77" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">L</text><circle cx="100.90322580645159" cy="388.22928922851173" r="3.7" fill="#20364b"/><text x="107.90322580645159" y="380.22928922851173" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="100.90322580645159" cy="214.39754510489007" r="3.7" fill="#20364b"/><text x="107.90322580645159" y="206.39754510489007" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="274.73496993007325" cy="214.39754510489007" r="3.7" fill="#20364b"/><text x="281.73496993007325" y="206.39754510489007" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="274.73496993007325" cy="388.22928922851173" r="3.7" fill="#20364b"/><text x="281.73496993007325" y="380.22928922851173" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="375.0967741935484" cy="388.22928922851173" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="380.22928922851173" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I</text><circle cx="238.0" cy="150.7707107714882" r="3.7" fill="#20364b"/><text x="245.0" y="142.7707107714882" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a el lado del cuadrado, de modo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que A=(a,a) y M=(0,a). Como TI tiene</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente −√3, x_I=a+a/√3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vértice T queda sobre el punto</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio de OI y tiene altura √3·x_I/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta la ordenada de M y divide por</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x_I/2 para obtener la pendiente.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>