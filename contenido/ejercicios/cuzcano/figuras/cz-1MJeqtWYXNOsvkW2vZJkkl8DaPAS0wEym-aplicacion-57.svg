<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Fuerza paralela a un lado de una placa equilátera</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="152.92,381.20 323.08,381.20 238.00,233.85 152.92,381.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,332.08 238.00,233.85" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,332.08 195.46,307.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,233.85 290.75,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="272.03,150.99 290.75,142.48 283.94,161.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="220.98467060836455" y="227.03912575396888" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="142.7141554068415" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="333.28584459315846" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="251.61226351330836" y="332.0833075567318" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="312.86744932319596" y="162.55534989727073" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="284.7921558269975" y="318.245613830735" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura del triángulo es √3 m. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia perpendicular del baricentro</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">al lado es un tercio de la altura,</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√3/3 m.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El módulo del momento es el producto</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la fuerza por esa distancia.</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta 10 N·m.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza aplicada en A tiende a girar</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la placa en sentido horario. Con z</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia el observador, el signo es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>