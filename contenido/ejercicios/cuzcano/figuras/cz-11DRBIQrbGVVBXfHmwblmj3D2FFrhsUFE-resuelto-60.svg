<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">060 · Distancia a un punto medio desde una proyección</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.89,345.62 193.34,191.82 366.55,345.62 107.89,345.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="166.15,233.77 233.73,345.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="107.89,345.62 202.66,292.80" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="202.66,292.80 279.56,268.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="354.1659965274605" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="193.3367449511103" y="184.8340034725395" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="353.3892442657407" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="163.04340674403727" y="227.55537786712966" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="284.9935118340492" y="263.28598190624143" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="205.76478113862743" y="302.1235949922325" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="168.48067257607602" y="207.35981906241432" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="250.03966005665723" y="281.92803618751714" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">PR</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa AP como eje horizontal y sea</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α=53°/2, AM=a. Entonces</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=(a+2)(cosα,senα) y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C=(a+10)(cosα,−senα).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P=(a cosα,0). Por promedio,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R=((a+6)cosα,−4senα).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia se obtiene con Pitágoras</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a partir de las diferencias 6cosα y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−4senα.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>