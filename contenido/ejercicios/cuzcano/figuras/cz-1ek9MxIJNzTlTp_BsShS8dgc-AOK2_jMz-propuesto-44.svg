<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Cociente de dos sumas con ángulos impares de π/2</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="64" y="160" font-family="Arial,sans-serif" font-size="19" fill="#1766b0" text-anchor="start">RELACIONES DEL PROBLEMA</text><text x="64" y="208" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los términos del numerador alternan</text><text x="64" y="231" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π/2 y −π/2, empezando con el</text><text x="64" y="254" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivo.</text><text x="64" y="293" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada término del denominador vale π/2</text><text x="64" y="316" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">porque el coseno de esos argumentos</text><text x="64" y="339" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es cero.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los términos del numerador alternan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π/2 y −π/2, empezando con el positivo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada término del denominador vale π/2</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">porque el coseno de esos argumentos es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cero.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma alternada es cero para n par y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π/2 para n impar. Divide por nπ/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>