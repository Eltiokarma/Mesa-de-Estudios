<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">113 · Dos posiciones enfocadas de un objetivo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,264.51 375.10,264.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="113.37,264.51 113.37,227.12" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="362.63,205.94 362.63,323.09" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="213.07,202.20 223.67,233.36 226.78,264.51 223.67,295.67 213.07,326.83 202.48,295.67 199.36,264.51 202.48,233.36 213.07,202.20" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="262.93,202.20 273.52,233.36 276.64,264.51 273.52,295.67 262.93,326.83 252.33,295.67 249.22,264.51 252.33,233.36 262.93,202.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="113.36656891495605" y="216.53079178885633" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Objeto</text><text x="362.633431085044" y="197.2126099706745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Placa</text><text x="201.23313782991204" y="336.1788856304985" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Posición 1</text><text x="275.3900293255132" y="348.0190615835777" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Posición 2</text><text x="238.0" y="190.9809384164223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 cm</text><text x="238.0" y="276.97800586510266" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como la ecuación de lente es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simétrica, la segunda posición</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intercambia las distancias objeto e</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">imagen de la primera.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la primera posición las distancias</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suman 100 cm y difieren en 20 cm.</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resultan 40 cm y 60 cm.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica f = ss′/(s + s′). El valor es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">40·60/100 = 24 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>