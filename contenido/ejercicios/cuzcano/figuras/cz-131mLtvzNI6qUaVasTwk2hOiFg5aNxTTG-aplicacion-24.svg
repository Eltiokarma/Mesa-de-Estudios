</text><line x1="100.90322580645162" y1="214.66129032258067" x2="110.89542808882511" y2="214.26645675241483" stroke="#008674" stroke-width="2"/><line x1="100.90322580645162" y1="214.66129032258067" x2="107.86665947978013" y2="221.8383782750273" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Horizontalmente, Ix=50(0−5)=−250 N·s y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Fxmedia=−1250 N.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sin aceleración vertical y con g=10,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N=500 N e Iy,piso=100 N·s.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza total del piso tiene módulo</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(1250²+500²)≈1346,29 N; su impulso</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">total ≈269,26 N·s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>