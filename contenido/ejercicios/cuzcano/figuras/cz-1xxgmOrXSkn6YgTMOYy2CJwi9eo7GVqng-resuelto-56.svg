<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">056 · Traslado de un ángulo en un triángulo rectángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.93,335.36 110.93,243.01 237.64,200.06 372.95,335.36 110.93,335.36 237.64,200.06" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.93,243.01 197.55,243.01 372.95,335.36" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.93,326.06 120.23,326.06 120.23,335.36" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.93,252.32 120.23,252.32 120.23,243.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="231.20,206.50 237.64,212.94 244.09,206.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645164" y="346.8182851848732" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="101.61913585445974" y="236.56813779162806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="236.9261349279879" y="192.18171481512678" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="346.8182851848732" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="190.39198180746234" y="236.56813779162806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="116.65324686262954" y="304.57959235239616" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45°</text><text x="219.02838372778575" y="214.3749263033774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="348.6081024172492" y="331.0682641286953" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo rectángulo UCM,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠CMU=45°. En R, ∠PRU=135°. Por ser</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suplementarios, P,R,U,M son</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">concíclicos.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ese círculo ∠RPU=∠RMU=θ. Como N,R,P</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">están alineados, ∠NPU=θ.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">También U,N,C,P son concíclicos por</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los ángulos rectos UNP y UCP. De allí</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠NCU=∠NPU, y CU es el mismo rayo que</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CR.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>