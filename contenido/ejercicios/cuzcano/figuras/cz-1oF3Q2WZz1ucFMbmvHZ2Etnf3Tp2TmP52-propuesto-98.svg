<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">098 · Menor ángulo entero para un quiebre agudo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,351.76 375.10,351.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="227.03,242.08 375.10,242.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,351.76 199.61,187.24 227.03,242.08" fill="none" stroke="#008674" stroke-width="2.5"/><text x="119.27419354838707" y="342.43548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">77°</text><text x="200.16129032258064" y="205.61290322580643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="243.48387096774195" y="234.40322580645162" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="365.50000000000006" y="233.85483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="365.50000000000006" y="343.5322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El primer tramo tiene inclinación</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ascendente 77°. El segundo tramo,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">visto desde L₁ hacia el vértice, tiene</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclinación x.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el vértice ambas direcciones se</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">invierten. Su separación sigue siendo</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x−77°=θ.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 0&lt;θ&lt;90°, el menor entero mayor</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que 77° es 78° y corresponde a θ=1°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>