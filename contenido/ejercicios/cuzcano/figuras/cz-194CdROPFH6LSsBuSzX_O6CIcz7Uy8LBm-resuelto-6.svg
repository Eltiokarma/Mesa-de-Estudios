<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Centro de una circunferencia con dos cortes en el eje x</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="171.7347956519641" x2="421" y2="171.7347956519641" stroke="#20364b" stroke-width="1.7"/><line x1="109.62253140150983" y1="105" x2="109.62253140150983" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="366.38,269.50 365.99,259.53 364.81,249.63 362.87,239.85 360.16,230.25 356.71,220.89 352.53,211.84 347.66,203.13 342.12,194.84 335.95,187.01 329.18,179.69 321.85,172.92 314.02,166.74 305.73,161.20 297.03,156.33 287.97,152.15 278.61,148.70 269.01,145.99 259.23,144.05 249.33,142.88 239.36,142.48 229.40,142.88 219.49,144.05 209.71,145.99 200.11,148.70 190.75,152.15 181.70,156.33 173.00,161.20 164.70,166.74 156.87,172.92 149.55,179.69 142.78,187.01 136.60,194.84 131.06,203.13 126.19,211.84 122.01,220.89 118.56,230.25 115.85,239.85 113.91,249.63 112.74,259.53 112.35,269.50 112.74,279.47 113.91,289.37 115.85,299.15 118.56,308.75 122.01,318.11 126.19,327.16 131.06,335.87 136.60,344.16 142.78,351.99 149.55,359.31 156.87,366.08 164.70,372.26 173.00,377.80 181.70,382.67 190.75,386.85 200.11,390.30 209.71,393.01 219.49,394.95 229.40,396.12 239.36,396.52 249.33,396.12 259.23,394.95 269.01,393.01 278.61,390.30 287.97,386.85 297.03,382.67 305.73,377.80 314.02,372.26 321.85,366.08 329.18,359.31 335.95,351.99 342.12,344.16 347.66,335.87 352.53,327.16 356.71,318.11 360.16,308.75 362.87,299.15 364.81,289.37 365.99,279.47 366.38,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.62,171.73 239.36,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="239.36,269.50 239.36,171.73" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="158.2745844632807" cy="171.7347956519641" r="3.7" fill="#20364b"/><text x="165.2745844632807" y="163.7347956519641" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">L(3,0)</text><circle cx="320.44809466918343" cy="171.7347956519641" r="3.7" fill="#20364b"/><text x="327.44809466918343" y="163.7347956519641" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A(13,0)</text><circle cx="239.36133956623206" cy="269.5" r="3.7" fill="#20364b"/><text x="246.36133956623206" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="120.97467711592304" cy="200.1151599379971" r="3.7" fill="#20364b"/><text x="127.97467711592304" y="192.1151599379971" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">53°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La mediatriz de LA es x=8. El centro C</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">está sobre ella y bajo el eje x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo con el eje x positivo tiene</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">magnitud 37°, de modo que C=(8,−8tan</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">37°).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si t=8tan 37°, se obtiene r²=5²+t².</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con tan 37°≈3/4 se recupera la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximación editorial.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>