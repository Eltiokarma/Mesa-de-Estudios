<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Promedio de tres ángulos con grados, minutos y segundos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,348.98 351.76,348.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,348.98 287.33,181.13" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="165.08,348.98 165.06,347.51 165.01,346.05 164.92,344.58 164.81,343.11 164.66,341.65 164.47,340.19 164.25,338.74 164.00,337.29 163.72,335.85 163.40,334.41 163.05,332.98 162.67,331.57 162.25,330.16 161.80,328.75 161.32,327.37 160.81,325.99 160.27,324.62 159.70,323.27 159.09,321.93 158.46,320.60 157.79,319.29 157.10,318.00 156.37,316.72 155.62,315.45 154.84,314.21 154.03,312.98 153.19,311.78 152.32,310.59 151.43,309.42 150.51,308.27 149.56,307.15 148.59,306.04" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="373.48684874411936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.09677419354836" y="348.98444654782566" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="304.66874246960805" y="165.5131512558806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="190.7691522417519" y="314.4881494141754" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3° 3′ 3″</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En cada columna, grados, minutos y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segundos, el numerador suma x+y+z.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como los tres números son</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">consecutivos, esa suma es 3y.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide entre y. Quedan 3 unidades de</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cada tipo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>