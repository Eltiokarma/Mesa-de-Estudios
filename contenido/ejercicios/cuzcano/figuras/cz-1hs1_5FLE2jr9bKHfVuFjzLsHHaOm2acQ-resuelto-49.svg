<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">049 · Contar enteros con tres raíces</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="108.75000000000003" y1="275" x2="371.25000000000006" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="108.75000000000003" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="371.25000000000006" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="108.75000000000003" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">10</text><text x="371.25000000000006" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">5*sqrt(2) + 9</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El dominio común es x≥10. Al cuadrar</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ambos lados resulta √[(x−8)(x−10)]&lt;7.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuadrar otra vez da (x−9)²&lt;50. Como</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x≥10, la cota superior es 9+5√2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se admiten 10, 11, 12, 13, 14, 15 y</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">16.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>