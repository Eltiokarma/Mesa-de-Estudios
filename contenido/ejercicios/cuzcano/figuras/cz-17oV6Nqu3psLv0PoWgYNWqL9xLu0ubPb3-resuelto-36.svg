<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Tangente y cotangente en dos giros referidos al eje Y</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="126.86,269.50 349.14,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="253.88,396.52 253.88,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="253.88,269.50 190.37,174.24" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="253.88,269.50 158.61,333.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="253.88,248.86 253.57,248.86 253.27,248.87 252.97,248.88 252.66,248.90 252.36,248.92 252.06,248.94 251.76,248.97 251.46,249.00 251.15,249.04 250.85,249.08 250.55,249.13 250.25,249.18 249.96,249.24 249.66,249.30 249.36,249.36 249.07,249.43 248.77,249.50 248.48,249.58 248.19,249.66 247.90,249.75 247.61,249.84 247.32,249.93 247.03,250.03 246.75,250.13 246.46,250.24 246.18,250.35 245.90,250.46 245.62,250.58 245.34,250.71 245.07,250.83 244.79,250.97 244.52,251.10 244.25,251.24 243.99,251.38 243.72,251.53 243.46,251.68 243.20,251.84 242.94,252.00 242.68,252.16 242.43,252.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="253.88,301.89 251.81,301.82 249.75,301.63 247.71,301.30 245.70,300.84 243.71,300.25 241.77,299.54 239.88,298.71 238.05,297.76 236.27,296.69 234.58,295.51 232.96,294.23 231.42,292.84 229.98,291.36 228.63,289.79 227.39,288.14 226.25,286.41 225.23,284.61 224.33,282.76 223.54,280.84 222.88,278.89 222.34,276.89 221.93,274.86 221.66,272.81 221.51,270.75 221.50,268.68 221.62,266.62 221.87,264.57 222.25,262.54 222.75,260.53 223.39,258.56 224.15,256.64 225.03,254.77 226.03,252.96 227.14,251.22 228.36,249.55 229.69,247.96 231.11,246.46 232.63,245.06 234.23,243.75 235.91,242.55" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="176.0796370967742" y="163.1239919354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(−2,3)</text><text x="242.12802419354838" y="247.27217741935485" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="218.3125" y="284.741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="341.20060483870964" y="260.60887096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="261.8155241935484" y="148.83467741935482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto al semieje Y positivo, el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rayo tiene avance 3 y desplazamiento</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular 2 hacia la izquierda.</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por eso tan α=2/3.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El giro horario desde el semieje Y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativo mide β=α−180°. La cotangente</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene período 180°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así cot β=cot α=3/2. Suma con</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">denominador 6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>