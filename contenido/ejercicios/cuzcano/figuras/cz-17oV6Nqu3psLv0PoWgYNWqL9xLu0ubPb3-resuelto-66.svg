<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">066 · Rotación de un cateto para encontrar un punto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="148.79,168.69 327.21,168.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="175.00,396.52 175.00,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="175.00,168.69 301.00,244.30 225.40,370.31 175.00,168.69" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="200.20,168.69 199.85,164.55 198.83,160.52 197.16,156.71 194.89,153.22 192.07,150.16 188.79,147.60 185.14,145.62 181.20,144.27 177.10,143.58 172.94,143.58 168.84,144.26 164.90,145.60 161.24,147.58 157.95,150.13 155.13,153.18 152.85,156.66 151.17,160.47 150.15,164.50 149.79,168.65 150.13,172.79 151.14,176.83 152.81,180.64 155.07,184.13 157.88,187.19 161.16,189.76 164.81,191.75 168.74,193.11 172.85,193.80 177.00,193.81 181.11,193.14" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="174.99596774193543" y="168.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="301.0040322580645" y="244.29838709677418" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="225.39919354838707" y="370.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="327.21370967741933" y="173.73387096774192" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="182.0524193548387" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="174.99596774193543" y="200.6995967741935" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector OA es (5,−3). Un vector</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular de la misma longitud es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">su giro horario, (−3,−5).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sumar ese vector a A da B=(2,−8), que</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cumple la ubicación indicada.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide las coordenadas de B para</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtener tan α=−8/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>