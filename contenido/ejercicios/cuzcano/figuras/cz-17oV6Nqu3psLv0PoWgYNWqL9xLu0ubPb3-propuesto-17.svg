<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Distancia del origen a la mediatriz de un segmento</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,310.63 375.10,310.63" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="155.74,392.89 155.74,146.11" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="128.32,365.47 347.68,200.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="155.74,173.53 279.13,338.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="155.74,310.63 221.55,261.27" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="375.0967741935484" y="307.88709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="158.48387096774195" y="146.11290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="124.20967741935483" y="375.06451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="352.61290322580646" y="198.75806451612902" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="240.19354838709677" y="275.5322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="220.45161290322582" y="253.59677419354838" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Pie</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio es (3,1). El vector PQ</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene componentes proporcionales a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(4,3), una normal de la mediatriz.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La mediatriz queda 4(x−3)+3(y−1)=0, es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">decir 4x+3y−15=0.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica la fórmula de distancia desde</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,0). Obtienes 15/√(16+9).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>