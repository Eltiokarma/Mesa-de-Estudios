<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Dos isósceles que fuerzan un equilátero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.51,286.23 211.07,202.18 362.86,287.05 234.74,331.11 111.51,286.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="111.51,286.23 362.86,287.05" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645164" y="290.309331797235" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="211.07027649769586" y="195.64727342549924" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="291.12538402457756" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="235.55184331797236" y="343.35272657450076" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="215.96658986175115" y="222.57699692780338" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">11θ</text><text x="145.7860983102919" y="298.4698540706605" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="331.02995391705065" y="282.96486175115206" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3θ</text><text x="317.1570660522273" y="298.4698540706605" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="162.1071428571429" y="234.81778033794163" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=·</text><text x="174.34792626728114" y="321.31931643625194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=·</text><text x="295.1236559139785" y="321.31931643625194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=·</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De ABC, ∠BAC=180°−14θ. Por tanto</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠BAD=180°−12θ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El isósceles ABD da ∠ABD=∠ADB=6θ. En</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BDC, ∠DBC=11θ−6θ=5θ y ∠BCD=3θ+2θ=5θ.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así BD=DC=AD=AB. El triángulo ABD es</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilátero y 6θ=60°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>