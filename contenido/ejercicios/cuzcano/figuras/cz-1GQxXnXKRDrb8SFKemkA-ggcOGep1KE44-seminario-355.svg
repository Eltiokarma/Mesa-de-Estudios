4 283.63,333.27 285.53,336.68 287.44,339.67 289.34,342.30 291.25,344.64 293.15,346.72 295.06,348.59 296.97,350.27 298.87,351.79 300.78,353.18 302.68,354.45 304.59,355.60 306.49,356.67 308.40,357.65 310.30,358.56 312.21,359.40 314.12,360.18 316.02,360.91 317.93,361.59 319.83,362.23 321.74,362.83 323.64,363.39 325.55,363.91 327.46,364.41 329.36,364.88 331.27,365.32 333.17,365.74 335.08,366.14 336.98,366.52 338.89,366.88 340.80,367.22 342.70,367.55 344.61,367.86 346.51,368.15 348.42,368.44 350.32,368.71 352.23,368.97 354.13,369.22 356.04,369.45 357.95,369.68 359.85,369.90 361.76,370.11 363.66,370.32 365.57,370.51 367.47,370.70 369.38,370.88 371.29,371.06 373.19,371.23 375.10,371.39" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">10^(1/x), x&gt;0</text><polyline points="100.90,380.66 375.10,380.66" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">y=1</text><circle cx="238.0" cy="396.51612903225805" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="245.0" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe y=ln(10)/ln(x). Como y≠0,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">despeja ln(x)=ln(10)/y.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se obtiene f⁻¹(y)=10^(1/y). Para y&lt;0</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">toma valores de (0,1) y para y&gt;0 toma</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valores de (1,∞).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al aproximarse y a 0 por la izquierda</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiende a 0, y por la derecha crece sin</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cota. Al alejarse de 0 tiende a 1 por</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ambos lados.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>