<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">085 · Ángulo de un triángulo con longitud doble</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.88,309.06 220.52,193.13 369.58,306.61 289.22,345.87 220.52,193.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="165.31,250.18 295.35,250.18" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="165.31,250.18 289.22,345.87" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="284.93,337.28 292.29,333.60 297.19,341.58" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="108.88,309.06 369.58,306.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="317.65255827379667" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="218.677635851916" y="184.54293858699572" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.0967741935484" y="311.51847441726204" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="287.992783430757" y="354.4570614130043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="125.43956123259002" y="302.9307570181136" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="214.38377715234176" y="212.7597243270549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100°</text><text x="236.46647903586634" y="213.37313271270835" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma RO=1. En el triángulo rectángulo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ROI, RI=1/cos20°. Además DR=2 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠DRI=120°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde D, el vector DI tiene</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes 2−RI cos120° en la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dirección DR y RI sen120°</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicularmente. Por ello tan</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=sen120°/(2cos20°−cos120°).</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como sen40°=sen(60°−20°), se cumple</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(2cos20°+1/2)sen20°=sen120° cos20°.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces la tangente es tan20°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>