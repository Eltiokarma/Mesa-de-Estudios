<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">105 · Punto luminoso frente a una lente inclinada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="142.63,341.03 333.37,197.97" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="196.87,214.66 207.00,219.43 245.75,259.96 279.13,324.34 262.44,313.61 229.65,285.59 196.87,214.66" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="118.79,269.50 200.45,208.22 357.21,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="118.78541374474051" y="280.22931276297334" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="244.55680224403926" y="281.42145862552593" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="362.57924263674613" y="279.6332398316971" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A′</text><text x="209.98457223001404" y="253.40603085553997" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53°</text><text x="317.87377279102384" y="217.6416549789621" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Eje óptico</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El eje óptico es perpendicular a la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lente y forma 37° con AO. La distancia</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">axial del objeto es 50 cos 37° ≈ 40</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cm.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con s ≈ 2f, la ecuación de lente da s′</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">≈ 40 cm.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rayo que pasa por O continúa recto</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en el modelo. Proyecta la distancia</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OA′ sobre el eje, OA′ cos 37° ≈ 40 cm,</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de donde OA′ ≈ 50 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>