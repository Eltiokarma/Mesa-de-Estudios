<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Mercurio en ramas de diámetros diferentes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,198.21 100.90,356.63 375.10,356.63 375.10,198.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="180.11,198.21 180.11,320.07 335.49,320.07 335.49,198.21" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,218.32 180.11,218.32" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,273.77 180.11,273.77" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="335.49,243.30 375.10,243.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="142.33691756272404" y="237.81541218637992" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="256.2795698924731" y="339.5716845878136" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hg</text><text x="140.5089605734767" y="182.36738351254482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">12 cm</text><text x="354.9892473118279" y="182.36738351254482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El agua ocupa 544 cm³. Su columna en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la rama ancha mide 544/(36π) cm.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia de niveles de mercurio</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es esa altura dividida por 13,6. Si en</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la rama estrecha sube x, en la ancha</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">baja x/4 por conservación de volumen.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así (5/4)x = 544/(36π×13,6). Despeja y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">redondea.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>