<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">082 · Razón de áreas desde un ortocentro y un ángulo de 45 grados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="265.42,242.08 155.74,351.76 100.90,351.76 210.58,242.08" fill="#f4c581" fill-opacity="0.45"/><polygon points="375.10,351.76 265.42,242.08 265.42,187.24" fill="#f4c581" fill-opacity="0.45"/><polyline points="375.10,351.76 100.90,351.76 265.42,187.24 375.10,351.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="265.42,242.08 155.74,351.76 100.90,351.76 210.58,242.08 265.42,242.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,351.76 265.42,242.08 265.42,187.24" fill="none" stroke="#008674" stroke-width="2.5"/><text x="375.0967741935484" y="351.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.9032258064516" y="351.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="265.41935483870964" y="187.24193548387098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="265.41935483870964" y="242.08064516129033" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="155.74193548387098" y="351.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="210.58064516129033" y="242.08064516129033" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon B=(0,0), A=(a,0), C=(c,c). Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alturas desde C y A se cortan en</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H=(c,a−c).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por paralelismo, N=(a−c,a−c) y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M=(2c−a,0). El paralelogramo tiene</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área (2c−a)(a−c).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En AHC, toma la base vertical HC=2c−a</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y la altura a−c. Su área es la mitad.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>