<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">043 · Hidrógeno en amoniaco</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,205.52 375.10,205.52 375.10,150.68 100.90,150.68 100.90,205.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,296.92 375.10,296.92 375.10,242.08 100.90,242.08 100.90,296.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,388.32 375.10,388.32 375.10,333.48 100.90,333.48 100.90,388.32" fill="none" stroke="#008674" stroke-width="2.5"/><text x="117.04301075268818" y="170.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">masa y fórmula</text><text x="117.04301075268818" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">moles = masa/M</text><text x="117.04301075268818" y="352.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">partículas = n·NA</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M(NH3)=14+3=17 g/mol.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">n=102/17=6 mol; cada molécula tiene 3</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">NH=6·3NA=18NA.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>