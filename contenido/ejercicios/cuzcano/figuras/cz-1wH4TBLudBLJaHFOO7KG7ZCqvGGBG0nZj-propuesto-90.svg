<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Problema 90: Profundidad en un tanque horizontal</title><desc id="desc">Reconstrucción vectorial. Sólido en perspectiva y sección auxiliar con datos y letras.</desc><rect width="900" height="540" rx="18" fill="#f5f8fc"/><text x="28.00" y="36.00" font-family="Arial,sans-serif" font-size="18" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">90  /  Profundidad en un tanque horizontal</text><line x1="460.00" y1="70.00" x2="460.00" y2="490.00" stroke="#d8e2ee" stroke-width="1"/><text x="28.00" y="517.00" font-family="Arial,sans-serif" font-size="14" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Esquema en perspectiva · Las cotas, no la apariencia, definen la geometría.</text><circle cx="240" cy="275" r="150" fill="none" stroke="#008778" stroke-width="2"/><line x1="140.00" y1="386.80" x2="340.00" y2="386.80" stroke="#008778" stroke-width="3"/><text x="170.00" y="377.80" font-family="Arial,sans-serif" font-size="17" fill="#008778" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">ancho = 4</text><line x1="140.00" y1="163.20" x2="340.00" y2="163.20" stroke="#c36117" stroke-width="3"/><text x="170.00" y="154.20" font-family="Arial,sans-serif" font-size="17" fill="#c36117" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">ancho = 4</text><line x1="240.00" y1="125.00" x2="240.00" y2="425.00" stroke="#758596" stroke-width="1" stroke-dasharray="6 5"/><text x="85.00" y="470.00" font-family="Arial,sans-serif" font-size="15" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Sección de radio 3 m · tanque de largo 10 m</text><text x="490.00" y="140.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Dos niveles producen el área 40 m².</text><text x="490.00" y="167.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Profundidad inferior: 3 − √5</text><text x="490.00" y="194.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Profundidad superior: 3 + √5</text><text x="490.00" y="221.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">La clave escoge el nivel inferior.</text><text x="490.00" y="248.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Hace falta indicar menos de medio tanque.</text></svg>