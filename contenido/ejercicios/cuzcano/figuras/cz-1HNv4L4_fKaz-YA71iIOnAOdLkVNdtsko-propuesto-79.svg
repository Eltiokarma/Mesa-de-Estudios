<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">079 · Altura del cilindro por una corona</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,329.85 101.06,323.41 101.53,316.99 102.32,310.60 103.42,304.25 104.83,297.97 106.55,291.77 108.57,285.65 110.89,279.64 113.50,273.76 116.39,268.00 119.57,262.40 123.01,256.96 126.72,251.70 130.68,246.62 134.89,241.74 139.33,237.08 143.99,232.64 148.87,228.44 153.94,224.47 159.21,220.77 164.65,217.32 170.25,214.15 176.00,211.25 181.89,208.64 187.90,206.32 194.01,204.30 200.22,202.59 206.50,201.18 212.85,200.08 219.24,199.29 225.66,198.81 232.10,198.66 238.53,198.81 244.96,199.29 251.35,200.08 257.69,201.18 263.97,202.59 270.18,204.30 276.29,206.32 282.30,208.64 288.19,211.25 293.94,214.15 299.54,217.32 304.98,220.77 310.25,224.47 315.32,228.44 320.20,232.64 324.86,237.08 329.30,241.74 333.51,246.62 337.47,251.70 341.18,256.96 344.62,262.40 347.80,268.00 350.69,273.76 353.30,279.64 355.62,285.65 357.64,291.77 359.36,297.97 360.77,304.25 361.87,310.60 362.66,316.99 363.13,323.41 363.29,329.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,329.85 100.90,251.13 363.29,251.13 363.29,329.85 100.90,329.85" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="232.10,329.85 337.05,251.13" fill="none" stroke="#008674" stroke-width="2.5"/><text x="316.05988578484335" y="243.78615527087513" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="375.0967741935484" y="290.49089365642845" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h</text><text x="241.27982713381692" y="340.34426609044607" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea R el radio común de base, h la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">generatriz y a el radio de la sección</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a altura h.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras, a²=R²−h². Así la corona</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mide π(R²−a²)=πh².</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De πh²=9π y h&gt;0, se obtiene h=3 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>