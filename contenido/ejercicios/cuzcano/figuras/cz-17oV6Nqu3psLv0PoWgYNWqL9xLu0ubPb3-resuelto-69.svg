<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">069 · Pendiente desde un ángulo de 18,5 grados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="198.75,357.28 198.75,181.72" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="169.00,328.99 149.10,269.50 129.19,210.01 198.75,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="169.00,328.99 346.81,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="216.60,269.50 216.45,271.78 216.01,274.03 215.29,276.20 214.30,278.26 213.05,280.18 211.56,281.92 209.87,283.46 207.99,284.77 205.96,285.83 203.81,286.61 201.58,287.12 199.30,287.34 197.01,287.26 194.76,286.89 192.56,286.24 190.47,285.31 188.52,284.12 186.73,282.69 185.14,281.04 183.77,279.21 182.66,277.21 181.80,275.09 181.22,272.87 180.94,270.60 180.94,268.31 181.24,266.05 181.83,263.83 182.69,261.71 183.82,259.72 185.19,257.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="198.75039543577057" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="169.00445120691109" y="328.991888457719" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="346.8069636456733" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="129.1930363543267" y="210.00811154228097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="149.09874378061886" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="375.0967741935484" y="274.9403481822836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="206.36688289096767" y="181.71830099440598" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="198.75039543577057" y="290.8179266973493" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea k=tan 18,5°. PA tiene pendiente k.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como el punto medio de PQ está en x, Q</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene ordenada 6.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El desplazamiento P→Q es (−12k,12),</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a PA. De ahí</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Q=(−3−12k,6).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula la tangente y su recíproca.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usar k≈1/3 reproduce Q≈(−7,6) y el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resultado del libro.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>