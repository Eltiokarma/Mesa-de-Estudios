<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">052 · Exponentes de una base positiva menor que uno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="190.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="143.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Relación</text><rect x="238.0" y="130" width="190.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="333.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Expresión</text><rect x="48.0" y="178" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Base</text><rect x="238.0" y="178" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0&lt;cos α&lt;1</text><rect x="48.0" y="226" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Exponente izquierdo</text><rect x="238.0" y="226" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1/8</text><rect x="48.0" y="274" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Exponente derecho</text><rect x="238.0" y="274" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">−sen α</text><text x="48" y="349" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Datos y relaciones</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el cuarto cuadrante, 0&lt;cos α&lt;1. Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tres potencias convierten cos²α en</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(cos α)^(1/8).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La exponencial con esa base es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inyectiva. Así −sen α=1/8 y cos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α=3√7/8, tomando el signo positivo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cotangente es −3√7. Resta 3√7/8 y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplica por 16.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>