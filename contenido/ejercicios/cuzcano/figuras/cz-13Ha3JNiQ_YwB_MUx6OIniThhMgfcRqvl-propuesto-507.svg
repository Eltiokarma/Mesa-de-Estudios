<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">507 · Carbonos terciarios e hidrógenos primarios</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="163.94,255.32 216.73,285.26 269.52,255.32 322.31,285.26 375.10,255.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="216.73,285.26 216.73,228.53" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="322.31,285.26 322.31,228.53" fill="none" stroke="#008674" stroke-width="2.5"/><text x="274.24397478680015" y="167.85928809788652" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃–CH₃</text><text x="100.90322580645162" y="170.22302558398223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="100.90322580645162" y="272.6516499814609" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">II</text><text x="274.24397478680015" y="368.77697441601777" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃–CH₂–CH₃</text><text x="100.90322580645162" y="371.1407119021134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">III</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En etano los dos carbonos son</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primarios, porque cada uno tiene un</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">único vecino carbono.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el segundo compuesto, los dos CH</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ramificados son terciarios. Cada uno</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene tres vecinos carbono.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En propano solo los H de los dos CH₃</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son primarios. Son seis; los otros dos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H están en el CH₂.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>