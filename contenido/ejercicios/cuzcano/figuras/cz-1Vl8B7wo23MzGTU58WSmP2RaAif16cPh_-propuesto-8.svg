<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Raíces, concavidad e invertibilidad de una cúbica trasladada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="330.0291926694207" x2="421" y2="330.0291926694207" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 105.47,379.53 110.04,364.15 114.61,350.30 119.18,337.94 123.75,326.98 128.32,317.39 132.89,309.09 137.46,302.03 142.03,296.14 146.60,291.37 151.17,287.65 155.74,284.93 160.31,283.14 164.88,282.23 169.45,282.13 174.02,282.79 178.59,284.14 183.16,286.12 187.73,288.67 192.30,291.74 196.87,295.26 201.44,299.17 206.01,303.41 210.58,307.93 215.15,312.65 219.72,317.53 224.29,322.50 228.86,327.49 233.43,332.46 238.00,337.33 242.57,342.06 247.14,346.57 251.71,350.82 256.28,354.73 260.85,358.25 265.42,361.31 269.99,363.87 274.56,365.85 279.13,367.20 283.70,367.85 288.27,367.76 292.84,366.84 297.41,365.06 301.98,362.34 306.55,358.62 311.12,353.85 315.69,347.96 320.26,340.90 324.83,332.60 329.40,323.00 333.97,312.05 338.54,299.68 343.11,285.84 347.68,270.45 352.25,253.47 356.82,234.83 361.39,214.47 365.96,192.34 370.53,168.36 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon t=x−2,9. Resulta t³+t²−4t−1. Los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cambios de signo entre x=0 y 1, 2 y 3,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 4 y 5 garantizan tres raíces</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivas. La última está en (4,5),</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que V es falsa.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para x&gt;5 se tiene t&gt;2,1 y</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F′=3t²+2t−4&gt;0, por lo que F es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">invertible sobre su imagen. En (3,4),</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F″=6t+2&gt;0.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El primer punto crítico tiene</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t=(−1−√13)/3, que da x≈1,365. Allí</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F″&lt;0, así que IV es verdadera.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>