<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">012 · Diferencia de dos proyecciones sobre una diagonal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.91,332.79 108.91,187.69 299.54,187.69 368.09,332.79 108.91,332.79" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.91,332.79 299.54,187.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="108.91,187.69 244.00,351.81 264.02,332.79" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="174.96,268.75 181.96,262.24 188.47,269.25" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="237.50,344.80 243.50,339.80 249.51,345.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="341.8010360254297" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="102.40428537791382" y="177.68518954556157" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="305.5476807157994" y="180.1869554979986" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="341.30068283494234" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="184.9625618083353" y="288.26324464327763" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="265.0190722863198" y="323.7883211678832" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="245.50529785731104" y="361.31481045443843" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Proyecta A, M y D ortogonalmente sobre</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC. Como AM=AD/2 y la proyección de AD</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre AC mide AD·BC/AC=BC, la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección de AM mide BC/2.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R se proyecta en H porque RH⊥AC.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Además RM∥AC, por lo que RM es la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia entre las proyecciones de M</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y R.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así RM=BC/2−AH=(BC−2AH)/2=8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>