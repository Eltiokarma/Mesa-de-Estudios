<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">493 · Diferencia entre fenol y alcohol bencílico</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="144.28,205.72 166.82,218.73 166.82,244.77 144.28,257.78 121.73,244.77 121.73,218.73 144.28,205.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="146.10,211.72 160.71,220.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="160.71,243.35 146.10,251.78" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="126.01,240.19 126.01,223.32" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="144.28,205.72 144.28,194.78" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="248.41,205.72 270.96,218.73 270.96,244.77 248.41,257.78 225.87,244.77 225.87,218.73 248.41,205.72" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="250.24,211.72 264.85,220.15" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="264.85,243.35 250.24,251.78" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="230.15,240.19 230.15,223.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="248.41,205.72 248.41,194.78" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="352.55,205.72 375.10,218.73 375.10,244.77 352.55,257.78 330.00,244.77 330.00,218.73 352.55,205.72" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="354.38,211.72 368.99,220.15" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.99,243.35 354.38,251.78" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="334.29,240.19 334.29,223.32" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="352.55,205.72 352.55,194.78" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="196.35,299.44 218.89,312.46 218.89,338.49 196.35,351.51 173.80,338.49 173.80,312.46 196.35,299.44" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="198.17,305.44 212.78,313.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="212.78,337.07 198.17,345.51" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="178.08,333.91 178.08,317.04" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="196.35,299.44 196.35,288.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="300.48,299.44 323.03,312.46 323.03,338.49 300.48,351.51 277.94,338.49 277.94,312.46 300.48,299.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="302.31,305.44 316.92,313.88" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="316.92,337.07 302.31,345.51" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="282.22,333.91 282.22,317.04" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="300.48,299.44 300.48,288.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="144.27686931740118" y="187.49226065272606" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">NO₂</text><text x="100.90322580645162" y="232.53143178630825" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="248.41368118695542" y="187.49226065272606" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">NH₂</text><text x="205.04003767600588" y="232.53143178630825" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">II</text><text x="352.55049305650965" y="187.49226065272606" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">COOH</text><text x="309.1768495455601" y="232.53143178630825" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">III</text><text x="196.34527525217828" y="281.21539133532485" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH=CH₂</text><text x="152.97163174122875" y="326.25456246890707" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">IV</text><text x="300.48208712173255" y="281.21539133532485" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">OH</text><text x="257.10844361078296" y="326.25456246890707" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El grupo NO₂ enlazado directamente al</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">anillo da nitrobenceno. El nombre de I</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es incorrecto.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">NH₂, COOH y CH=CH₂ producen anilina,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ácido benzoico y estireno,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respectivamente.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si OH se une directamente al anillo,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el compuesto es fenol. En alcohol</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bencílico habría un CH₂ entre anillo y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OH.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>