<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Rango de una cúbica en un intervalo abierto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="287.64516129032256" x2="421" y2="287.64516129032256" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 105.47,378.73 110.04,361.67 114.61,345.31 119.18,329.66 123.75,314.69 128.32,300.42 132.89,286.82 137.46,273.89 142.03,261.62 146.60,250.01 151.17,239.04 155.74,228.71 160.31,219.01 164.88,209.92 169.45,201.46 174.02,193.59 178.59,186.32 183.16,179.65 187.73,173.55 192.30,168.02 196.87,163.06 201.44,158.66 206.01,154.80 210.58,151.48 215.15,148.70 219.72,146.44 224.29,144.70 228.86,143.46 233.43,142.73 238.00,142.48 242.57,142.72 247.14,143.44 251.71,144.62 256.28,146.27 260.85,148.36 265.42,150.90 269.99,153.88 274.56,157.28 279.13,161.10 283.70,165.33 288.27,169.97 292.84,175.00 297.41,180.42 301.98,186.22 306.55,192.38 311.12,198.91 315.69,205.80 320.26,213.03 324.83,220.60 329.40,228.51 333.97,236.73 338.54,245.27 343.11,254.11 347.68,263.26 352.25,272.69 356.82,282.41 361.39,292.40 365.96,302.66 370.53,313.17 375.10,323.94" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F</text><circle cx="238.0" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="245.0" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Máximo</text><circle cx="100.90322580645162" cy="396.51612903225805" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="107.90322580645162" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="375.0967741935484" cy="323.93548387096774" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="382.0967741935484" y="315.93548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Deriva: F′(x)=3x(x−4). En (−1,0) es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positiva y en (0,1) es negativa.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El máximo es F(0)=4 y se alcanza. Los</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">límites laterales de la expresión en</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−1 y 1 son −3 y −1.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El menor de esos límites es −3 y no se</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanza. Por continuidad se obtienen</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">todos los valores mayores hasta 4</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclusive.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>