<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">056 · Ocho lados excluidos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,142.48 312.66,166.74 358.80,230.25 358.80,308.75 312.66,372.26 238.00,396.52 163.34,372.26 117.20,308.75 117.20,230.25 163.34,166.74 238.00,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="275.33,154.61 335.73,198.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="275.33,154.61 358.80,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="275.33,154.61 335.73,340.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="275.33,154.61 275.33,384.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="275.33,154.61 200.67,384.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="275.33,154.61 140.27,340.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="275.33,154.61 117.20,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="275.33,154.61 140.27,198.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="275.33,154.61 200.67,154.61" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="335.73,198.50 358.80,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="335.73,198.50 335.73,340.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="335.73,198.50 275.33,384.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="335.73,198.50 200.67,384.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="335.73,198.50 140.27,340.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="335.73,198.50 117.20,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="335.73,198.50 140.27,198.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="335.73,198.50 200.67,154.61" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Faltan C(8,2)=28 pares de lados, así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que n(n−1)/2−28=2n−3.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuadrática se factoriza</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(n−10)(n+5)=0. Se toma n=10.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide 360° entre 10.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>