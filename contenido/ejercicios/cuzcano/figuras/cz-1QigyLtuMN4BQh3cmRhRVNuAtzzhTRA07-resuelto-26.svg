71.46,297.12 373.05,290.32 374.18,283.43 374.87,276.48 375.10,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.9032258064516" y="302.4807245144509" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="235.3881832031405" y="167.99576711776206" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="369.8731405998294" y="302.4807245144509" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="166.86467483535347" y="236.51927548554906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="166.86467483535347" y="302.4807245144509" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="268.3689077175914" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="133.88395032090253" y="297.2038085921388" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">AN</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como BC⊥BM, MC es un diámetro. Además</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠BCN=45°, así que el arco BN que pasa</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por M mide 90° y el arco MN mide 36°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">También ∠MNC=90° porque MC es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diámetro. El triángulo AMN es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulo isósceles y AN=MN.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuerda MN mide 2(√5+1)sen 18°=2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>