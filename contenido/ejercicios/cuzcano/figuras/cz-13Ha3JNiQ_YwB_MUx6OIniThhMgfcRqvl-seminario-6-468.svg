<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">468 · Tres tipos de fórmula orgánica en ejemplos diferentes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="163.94,359.32 216.73,389.26 269.52,359.32 322.31,389.26 375.10,359.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="274.24397478680015" y="149.73730070448653" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃(CH₂)₄COOH</text><text x="100.90322580645162" y="152.10103819058213" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="274.24397478680015" y="260.04505005561737" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₂=CH–CH(CH₃)–CH₃</text><text x="100.90322580645162" y="262.408787541713" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">II</text><text x="100.90322580645162" y="376.65609936966996" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">III</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I agrupa los cuatro CH₂ consecutivos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mediante un paréntesis. Es condensada.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">II muestra los grupos unidos, la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posición del doble enlace y la rama.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Es semidesarrollada.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">III representa los carbonos con</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértices y extremos. Es topológica.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>