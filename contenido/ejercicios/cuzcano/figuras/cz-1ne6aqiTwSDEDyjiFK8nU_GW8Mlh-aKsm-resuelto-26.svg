<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Tres radicales con un punto aislado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Dominio en radianes</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="87.34042553191489" y1="275" x2="112.16312056737587" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="87.34042553191489" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="112.16312056737587" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><line x1="385.2127659574468" y1="275" x2="385.2127659574468" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="385.2127659574468" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="385.2127659574468" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="87.34042553191489" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">0</text><text x="112.16312056737587" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/6</text><text x="385.2127659574468" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">2π</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los primeros dos radicales exigen seno</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y coseno no negativos. En el intervalo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dado esto deja [0,π/2] y el punto 2π.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El tercero exige sen x≤½. Dentro de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[0,π/2] reduce el dominio a [0,π/6].</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En 2π los tres radicandos son 0, 1 y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1, así que también pertenece al</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dominio.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>