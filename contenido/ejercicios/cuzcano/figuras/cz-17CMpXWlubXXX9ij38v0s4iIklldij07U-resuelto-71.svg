<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">071 · Máximo en bases anidadas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">cifra o parámetro</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">valor</text><polyline points="100.90,396.52 100.90,371.11 140.07,371.11 140.07,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="179.24,396.52 179.24,396.52 218.41,396.52 218.41,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="257.59,396.52 257.59,383.81 296.76,383.81 296.76,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="335.93,396.52 335.93,142.48 375.10,142.48 375.10,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><circle cx="120.48847926267281" cy="371.11290322580646" r="3.7" fill="#20364b"/><text x="127.48847926267281" y="363.11290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a=2</text><circle cx="198.8294930875576" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="205.8294930875576" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">b=0</text><circle cx="277.1705069124424" cy="383.81451612903226" r="3.7" fill="#20364b"/><text x="284.1705069124424" y="375.81451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">n=1</text><circle cx="355.5115207373272" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="362.5115207373272" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">k=20</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La igualdad es a(10a+b)+n=21(a−1)+k.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cota k≤20 limita a; después</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">maximizar n+k.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el rango comprobado hay 2</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">combinaciones válidas. Una es a=2,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b=0, n=1, k=20; se conservan todas en</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los datos.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Evaluar la operación pedida con esos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valores da 21.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>