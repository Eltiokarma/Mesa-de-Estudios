<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Accidentes al principio y al final de la obra</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130.0" width="190.0" height="41.42857142857143" fill="#dfedf8" stroke="#a3b9cc"/><text x="143.0" y="156.92857142857144" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Días trabajados</text><rect x="238.0" y="130.0" width="190.0" height="41.42857142857143" fill="#dfedf8" stroke="#a3b9cc"/><text x="333.0" y="156.92857142857144" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Accidentes</text><rect x="48.0" y="171.42857142857144" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="198.3571428571429" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[0,15)</text><rect x="238.0" y="171.42857142857144" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="198.3571428571429" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3</text><rect x="48.0" y="212.85714285714286" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="239.78571428571428" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[15,30)</text><rect x="238.0" y="212.85714285714286" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="239.78571428571428" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">5</text><rect x="48.0" y="254.28571428571428" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[30,45)</text><rect x="238.0" y="254.28571428571428" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">7</text><rect x="48.0" y="295.7142857142857" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[45,60)</text><rect x="238.0" y="295.7142857142857" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4</text><rect x="48.0" y="337.14285714285717" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[60,75)</text><rect x="238.0" y="337.14285714285717" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">8</text><rect x="48.0" y="378.57142857142856" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[75,90)</text><rect x="238.0" y="378.57142857142856" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Accidentes por tramo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma todas las frecuencias. Hubo 30</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">accidentes en total.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En los primeros dos tramos hubo 3+5=8</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">accidentes. En los tres últimos hubo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4+8+3=15.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los tramos no se superponen. Suma sus</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">porcentajes como 100(8+15)/30.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>