<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">068 · Rango de una raíz negativa restringida</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.48387096774195" x2="421" y2="142.48387096774195" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="131.37,208.07 135.43,214.40 139.49,220.31 143.56,225.88 147.62,231.17 151.68,236.22 155.74,241.05 159.80,245.70 163.87,250.18 167.93,254.50 171.99,258.70 176.05,262.76 180.11,266.72 184.18,270.57 188.24,274.32 192.30,277.99 196.36,281.57 200.43,285.07 204.49,288.50 208.55,291.87 212.61,295.16 216.67,298.40 220.74,301.58 224.80,304.70 228.86,307.78 232.92,310.80 236.98,313.77 241.05,316.70 245.11,319.59 249.17,322.44 253.23,325.25 257.30,328.01 261.36,330.75 265.42,333.44 269.48,336.11 273.54,338.74 277.61,341.34 281.67,343.91 285.73,346.45 289.79,348.97 293.85,351.45 297.92,353.91 301.98,356.34 306.04,358.75 310.10,361.14 314.16,363.50 318.23,365.84 322.29,368.16 326.35,370.45 330.41,372.73 334.48,374.98 338.54,377.21 342.60,379.43 346.66,381.63 350.72,383.81 354.79,385.97 358.85,388.11 362.91,390.24 366.97,392.34 371.03,394.44 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F(x)</text><circle cx="131.36917562724014" cy="208.07471795996435" r="3.7" fill="#20364b"/><text x="138.36917562724014" y="200.07471795996435" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,−1)</text><circle cx="375.09677419354836" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(9,−√15)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea t=√x, de modo que 1≤t≤3 y el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radicando es 2t²−t.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ese intervalo 2t²−t crece de 1 a</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15. Aplicar la raíz conserva el orden.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El signo negativo invierte el orden.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambos extremos se incluyen porque x=1</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y x=9 pertenecen al dominio.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>