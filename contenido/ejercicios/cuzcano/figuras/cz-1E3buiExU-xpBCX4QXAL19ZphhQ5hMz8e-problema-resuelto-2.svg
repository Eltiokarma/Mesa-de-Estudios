<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">002 · Polaridad de la fuente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,250.65 100.90,387.75 375.10,387.75 375.10,250.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="169.45,353.47 169.45,182.10 227.72,182.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="306.55,353.47 306.55,182.10 248.28,182.10" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,284.92 375.10,284.92" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="227.72,168.39 227.72,195.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="248.28,175.25 248.28,188.96" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="135.17741935483872" y="233.51209677419357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Ánodo</text><text x="333.96774193548384" y="233.51209677419357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cátodo</text><text x="227.71774193548387" y="350.0443548387097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Electrolito</text><text x="207.1532258064516" y="151.25403225806457" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">+</text><text x="268.8467741935484" y="151.25403225806457" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">−</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Une el ánodo al borne positivo. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuente extrae electrones de este</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">electrodo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Une el cátodo al borne negativo. La</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuente suministra electrones para que</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se reduzcan los iones metálicos.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los iones conducen corriente en la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">solución y el recubrimiento se forma</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre el cátodo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>