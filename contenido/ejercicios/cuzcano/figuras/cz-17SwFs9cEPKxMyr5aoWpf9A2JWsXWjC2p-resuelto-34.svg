<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Rectas perpendiculares en cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,396.52 110.98,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.98,142.48 365.02,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="365.02,142.48 365.02,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="365.02,396.52 110.98,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="110.98,142.48 212.60,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="212.60,396.52 365.02,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.98,396.52 365.02,294.90" fill="none" stroke="#008674" stroke-width="2.5"/><text x="117.98387096774195" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="117.98387096774195" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="372.01612903225805" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="372.01612903225805" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D</text><text x="219.5967741935484" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="372.01612903225805" y="286.9032258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con lado 1,t=tanθ,la perpendicularidad</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da AP=t.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PC tiene pendiente1/(1−t). Tangente de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia=[1/(1−t)−t]/[1+t/(1−t)].</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Simplificar:1−t+t²=(secθ−sinθ)/cosθ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>