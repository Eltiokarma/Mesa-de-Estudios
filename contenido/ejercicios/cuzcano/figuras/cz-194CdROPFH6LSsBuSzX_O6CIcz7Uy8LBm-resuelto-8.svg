<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Parábola vertical a partir de vértice e intersección</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="315.1989247311828" x2="421" y2="315.1989247311828" stroke="#20364b" stroke-width="1.7"/><line x1="146.6021505376344" y1="105" x2="146.6021505376344" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,212.38 105.47,219.12 110.04,225.63 114.61,231.91 119.18,237.97 123.75,243.79 128.32,249.39 132.89,254.76 137.46,259.90 142.03,264.82 146.60,269.50 151.17,273.96 155.74,278.18 160.31,282.18 164.88,285.95 169.45,289.49 174.02,292.81 178.59,295.89 183.16,298.75 187.73,301.38 192.30,303.77 196.87,305.94 201.44,307.89 206.01,309.60 210.58,311.09 215.15,312.34 219.72,313.37 224.29,314.17 228.86,314.74 233.43,315.08 238.00,315.20 242.57,315.08 247.14,314.74 251.71,314.17 256.28,313.37 260.85,312.34 265.42,311.09 269.99,309.60 274.56,307.89 279.13,305.94 283.70,303.77 288.27,301.38 292.84,298.75 297.41,295.89 301.98,292.81 306.55,289.49 311.12,285.95 315.69,282.18 320.26,278.18 324.83,273.96 329.40,269.50 333.97,264.82 338.54,259.90 343.11,254.76 347.68,249.39 352.25,243.79 356.82,237.97 361.39,231.91 365.96,225.63 370.53,219.12 375.10,212.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,338.05 238.00,200.95" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="237.99999999999997" cy="315.1989247311828" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="307.1989247311828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">V(4,0)</text><circle cx="146.6021505376344" cy="269.5" r="3.7" fill="#20364b"/><text x="153.6021505376344" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N(0,2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Del gráfico se obtiene V=(4,0) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N=(0,2). La forma buscada es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(x−4)²=4py.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como N pertenece a la parábola, al</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituir queda 16=8p y p=2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Reemplaza p y verifica que la ecuación</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pasa por N y V.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>