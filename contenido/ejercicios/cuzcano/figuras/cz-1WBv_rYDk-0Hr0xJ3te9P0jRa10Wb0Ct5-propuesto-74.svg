<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">074 · Fórmulas del gráfico de tanques</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,324.34 169.45,324.34 169.45,187.24 100.90,187.24 100.90,324.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,324.34 375.10,324.34 375.10,187.24 238.00,187.24 238.00,324.34" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="114.75806451612905" y="240.93548387096772" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H2</text><text x="114.75806451612905" y="343.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A:1 m³</text><text x="258.7096774193549" y="240.93548387096772" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">He + H2</text><text x="251.8548387096774" y="343.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B:4 m³</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con NA≈6·10²³: nA=5 mol; por volúmenes</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">nB=20 mol.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si la fórmula H2 del gráfico es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">literal, xH2=0,8,xHe=0,2: Mmedia=2,4;</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">masaB=48 g.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La clave D192 g se obtiene cambiando</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H2 por O2: xHe=0,8,xO2=0,2, Mmedia9,6.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">No son los mismos datos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>