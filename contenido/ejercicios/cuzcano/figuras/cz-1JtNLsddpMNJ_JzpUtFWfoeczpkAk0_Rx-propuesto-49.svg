<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">049 · Desviación en una esfera</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="330.16,289.67 329.66,299.26 328.16,308.74 325.67,318.01 322.23,326.97 317.88,335.53 312.65,343.58 306.61,351.04 299.82,357.82 292.36,363.86 284.31,369.09 275.76,373.45 266.80,376.89 257.52,379.37 248.04,380.88 238.46,381.38 228.87,380.88 219.39,379.37 210.12,376.89 201.16,373.45 192.61,369.09 184.56,363.86 177.10,357.82 170.31,351.04 164.27,343.58 159.04,335.53 154.68,326.97 151.24,318.01 148.76,308.74 147.26,299.26 146.75,289.67 147.26,280.09 148.76,270.61 151.24,261.34 154.68,252.38 159.04,243.82 164.27,235.77 170.31,228.31 177.10,221.53 184.56,215.49 192.61,210.26 201.16,205.90 210.12,202.46 219.39,199.98 228.87,198.47 238.46,197.97 248.04,198.47 257.52,199.98 266.80,202.46 275.76,205.90 284.31,210.26 292.36,215.49 299.82,221.53 306.61,228.31 312.65,235.77 317.88,243.82 322.23,252.38 325.67,261.34 328.16,270.61 329.66,280.09 330.16,289.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,361.94 181.97,361.94 324.57,258.31 358.59,153.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="181.97,361.94 238.46,289.67 324.57,258.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="181.97,361.94 375.10,361.94" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="203.6111770417521" y="340.1117164742691" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16°</text><text x="364.0923508469091" y="313.5176933865573" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">δ</text><text x="115.57579026863738" y="385.046445139713" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Aire</text><text x="218.28374150393785" y="239.23783579674182" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vidrio</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo interior en la salida</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también mide 16° porque la cuerda del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rayo y ambos radios forman un</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo isósceles.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Snell en la entrada da sen i = (20/7)</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 16°. Resulta i ≈ 52° con los</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos escritos tomados literalmente.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos desviaciones se suman y valen</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2(i − 16°) ≈ 72°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>