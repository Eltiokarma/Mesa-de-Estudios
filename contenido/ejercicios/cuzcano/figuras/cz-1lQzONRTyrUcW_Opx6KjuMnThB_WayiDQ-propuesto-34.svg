<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Área de un rectángulo que une lados de dos caras</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="201.66,286.16 375.10,286.16 314.64,176.71 141.21,176.71" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,362.29 274.34,362.29 375.10,286.16 201.66,286.16 100.90,362.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,362.29 274.34,362.29 314.64,176.71 141.21,176.71 100.90,362.29" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="201.66,286.16 375.10,286.16 314.64,176.71 141.21,176.71 201.66,286.16" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,286.16 141.21,176.71" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.9032258064516" y="362.28858543973803" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="274.3394392494483" y="362.28858543973803" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="201.66056075055175" y="286.16082125975123" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.0967741935484" y="286.16082125975123" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="141.20615978409165" y="176.711414560262" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="314.64237322708834" y="176.711414560262" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la sección perpendicular a AB, DAF</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">forma 60°. Por ley de cosenos,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DF²=25+16−40cos60°=21.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DC es paralelo a AB, así que es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a DF. El triángulo CDF</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es recto y DC²=36−21=15.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DCEF es un rectángulo de lados DC y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DF. Multiplica.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>