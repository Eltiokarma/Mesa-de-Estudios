<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Ángulo constante con un segmento móvil</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.16,329.10 300.95,329.10 367.64,329.10 222.25,207.10 300.95,329.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="111.16,329.10 239.40,282.42 367.64,329.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="239.40,282.42 222.25,207.10" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645159" y="340.2900958884843" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="340.2900958884843" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="295.35681369321924" y="341.2227270054472" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="220.38255700185954" y="197.77727299455276" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="231.00526662277815" y="297.34625001415645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="225.0457125866741" y="231.3519932052177" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="231.93789773974106" y="312.26834788556306" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">140°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En AOQ ambos ángulos de la base miden</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">20°. Normaliza AQ=1 y escribe</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O=(1/2,tan20°/2). Si AM=PQ=p, entonces</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M=(p,0) y P=(1−p cos40°,p sin40°).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En forma compleja, PM=p(1+e⁻ⁱ⁴⁰°)−1=2p</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos20°·e⁻ⁱ²⁰°−1.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica PM por e⁻ⁱ²⁰°/(2cos20°). El</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vector obtenido es p e⁻ⁱ⁴⁰°−1/2+i</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan20°/2, que coincide con PO. La</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rotación tiene magnitud 20°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>