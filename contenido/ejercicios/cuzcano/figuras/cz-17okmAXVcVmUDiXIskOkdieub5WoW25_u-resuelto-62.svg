<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">062 · Un ángulo que depende del punto de llegada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="113.14,316.42 370.20,316.42 370.20,251.14 128.00,215.48 113.14,316.42" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="128.00,215.48 370.20,316.42" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="113.14,316.42 370.20,267.46" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="326.2156298003072" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="119.67242703533026" y="208.70410906298002" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="243.79435483870967" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="374.2807219662058" y="327.03168202764977" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="242.89631336405526" y="330.29589093702" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">63</text><text x="106.61559139784947" y="256.8511904761905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">25</text><text x="375.09677419354836" y="287.0451228878648" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16</text><text x="246.16052227342547" y="275.6203917050691" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Fija A=(0,0), D=(63,0), C=(63,16). El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértice superior B está en la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">circunferencia de diámetro AC y cumple</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB=25. Sus coordenadas de la rama</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superior son (615/169,4180/169), y BD</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el otro segmento termina a altura</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h, su pendiente es h/63. La tangente</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del cruce es</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(h/63+5/12)/(1−5h/(12·63)).</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con h=16 se obtiene 3/4. Si el</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segmento termina debajo de C como en</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el dibujo, hace falta su altura para</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fijar x.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>