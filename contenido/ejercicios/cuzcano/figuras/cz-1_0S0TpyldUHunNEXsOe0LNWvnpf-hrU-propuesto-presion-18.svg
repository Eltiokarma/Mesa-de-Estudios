<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Diferencia de presión en un cono sumergido</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,187.24 375.10,187.24 375.10,351.76 100.90,351.76 100.90,187.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="174.94,225.63 238.00,321.60 301.06,225.63 174.94,225.63" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,225.63 238.00,321.60" fill="none" stroke="#008674" stroke-width="2.5"/><text x="237.99999999999997" y="211.9193548387097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">r = 3 cm</text><text x="312.5806451612903" y="262.91935483870964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 cm</text><text x="177.67741935483872" y="324.88709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ρ = 900 kg/m³</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área de base da radio de 3 cm. Con</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">generatriz 5 cm, la altura es √(25 −</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">9) = 4 cm.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia de profundidades es 0,04</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m. La densidad equivale a 900 kg/m³.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica ρg por la diferencia de</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">profundidades.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>