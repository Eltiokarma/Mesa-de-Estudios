<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">098 · Área de un triángulo exterior por semejanza</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,311.58 206.29,311.58 375.10,227.42" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,311.58 206.29,311.58 269.71,227.42 164.33,227.42 100.90,311.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="164.33,227.42 269.71,227.42 375.10,227.42" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,311.58 238.00,269.50 375.10,227.42" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="311.582296861849" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="206.28871476212558" y="311.582296861849" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="269.7112852378744" y="227.417703138151" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="164.32579628220049" y="227.417703138151" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.09677419354836" y="227.417703138151" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="238.0" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La expresión de AL en las direcciones</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB y AD da BN/AD=AB/DL. Para verlo, si</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DL=t·AB, al alcanzar la recta BC se</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recorre 1/t del tramo AL.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces AB·AD=BN·DL=25. El triángulo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ABL tiene base AB y la altura del</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelogramo.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica AB·AD por sin53°/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>