text><rect x="238.0" y="254.28571428571428" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2,5</text><rect x="48.0" y="295.7142857142857" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Br</text><rect x="238.0" y="295.7142857142857" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2,8</text><rect x="48.0" y="337.14285714285717" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">F</text><rect x="238.0" y="337.14285714285717" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4,0</text><rect x="48.0" y="378.57142857142856" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">C</text><rect x="238.0" y="378.57142857142856" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2,5</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Datos del escaneo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula diferencias absolutas en el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">orden listado. Resultan 0,4, 0,4, 1,4,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1,2 y 0,7.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La mayor es 1,4, para O–H.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pregunta usa Δχ como criterio de</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">polaridad. Un momento dipolar medido</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también depende de la distancia entre</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cargas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>