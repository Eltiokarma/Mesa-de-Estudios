<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">049 · Siete lados excluidos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,142.48 327.81,179.69 365.02,269.50 327.81,359.31 238.00,396.52 148.19,359.31 110.98,269.50 148.19,179.69 238.00,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="282.91,161.08 346.42,224.59" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="282.91,161.08 346.42,314.41" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="282.91,161.08 282.91,377.92" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="282.91,161.08 193.09,377.92" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="282.91,161.08 129.58,314.41" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="282.91,161.08 129.58,224.59" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="282.91,161.08 193.09,161.08" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De los n(n−1)/2 pares de lados, quedan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuera los C(7,2)=21 pares que solo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">usan lados excluidos.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así n(n−1)/2−21=n−1. Multiplica y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">factoriza (n−8)(n+5)=0.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con n=8, el interior vale 180°−360°/8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>