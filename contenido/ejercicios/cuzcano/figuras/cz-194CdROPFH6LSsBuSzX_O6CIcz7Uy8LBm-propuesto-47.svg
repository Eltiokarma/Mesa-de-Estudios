8.03,372.08 362.64,293.87" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="216.01,147.24 274.66,323.20" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="216.00530056610035" cy="147.24286878139532" r="3.7" fill="#20364b"/><text x="223.00530056610035" y="139.24286878139532" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="245.33156647796656" cy="235.2216665169939" r="3.7" fill="#20364b"/><text x="252.33156647796656" y="227.2216665169939" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="274.6578323898328" cy="323.20046425259255" r="3.7" fill="#20364b"/><text x="281.6578323898328" y="315.20046425259255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La normal (−1,3) permite proyectar A</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">restando 4(−1,3). Así P=(11,5).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como el radio en P es perpendicular a</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la tangente, el centro está sobre AP.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segmento AP es un diámetro.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su punto medio es C=(9,11) y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r²=2²+6²=40.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>