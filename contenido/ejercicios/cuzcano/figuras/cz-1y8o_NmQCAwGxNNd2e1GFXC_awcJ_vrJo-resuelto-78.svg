<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">078 · Lado de un cuadrado entre dos triángulos equiláteros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.75,349.13 110.75,209.57 250.31,209.57 250.31,349.13 110.75,349.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.75,349.13 180.53,228.27 250.31,349.13" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="250.31,209.57 371.17,279.35 250.31,349.13" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.75,349.13 206.08,184.04 250.31,209.57" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="360.6242032064902" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="201.36208228703885" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="255.23971412014677" y="203.0039598222909" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="251.95595904964262" y="363.9079582769944" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.09677419354836" y="281.8140815143906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="174.78771489279507" y="225.99024531581998" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="202.69963299208035" y="175.09204172300562" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="225.6859184856094" y="189.8689395402743" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">√2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon A=(0,0), D=(s,0), C=(s,s). El rayo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AF forma 60° con AD y la recta CE</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">forma −30° con la horizontal. Por</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tanto GC es perpendicular a AF.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector normal unitario a AF puede</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tomarse como (√3/2,−1/2). La distancia</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de C a AF es s(√3−1)/2.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala a √2 y racionaliza. El lado</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale √2(√3+1)=√6+√2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>