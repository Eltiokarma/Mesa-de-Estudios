<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Área entre seno y arcoseno cerrada por un segmento</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 103.81,393.82 106.72,391.12 109.63,388.43 112.54,385.73 115.45,383.02 118.36,380.32 121.27,377.61 124.18,374.89 127.09,372.17 130.00,369.44 132.91,366.70 135.81,363.95 138.72,361.20 141.63,358.43 144.54,355.65 147.45,352.86 150.36,350.06 153.27,347.24 156.18,344.41 159.09,341.56 162.00,338.69 164.91,335.80 167.82,332.89 170.73,329.96 173.64,327.01 176.54,324.03 179.45,321.03 182.36,318.00 185.27,314.93 188.18,311.84 191.09,308.71 194.00,305.54 196.91,302.34 199.82,299.09 202.73,295.79 205.64,292.45 208.55,289.05 211.46,285.60 214.37,282.08 217.27,278.50 220.18,274.85 223.09,271.12 226.00,267.30 228.91,263.38 231.82,259.37 234.73,255.23 237.64,250.96 240.55,246.55 243.46,241.97 246.37,237.20 249.28,232.21 252.19,226.95 255.10,221.38 258.00,215.42 260.91,208.97 263.82,201.87 266.73,193.84 269.64,184.36 272.55,172.05 275.46,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">arcsen x</text><polyline points="100.90,396.52 105.47,392.28 110.04,388.05 114.61,383.83 119.18,379.61 123.75,375.41 128.32,371.22 132.89,367.04 137.46,362.89 142.03,358.76 146.60,354.66 151.17,350.58 155.74,346.54 160.31,342.53 164.88,338.56 169.45,334.63 174.02,330.74 178.59,326.89 183.16,323.10 187.73,319.35 192.30,315.66 196.87,312.02 201.44,308.44 206.01,304.92 210.58,301.46 215.15,298.07 219.72,294.74 224.29,291.49 228.86,288.30 233.43,285.19 238.00,282.16 242.57,279.21 247.14,276.33 251.71,273.54 256.28,270.83 260.85,268.21 265.42,265.68 269.99,263.24 274.56,260.88 279.13,258.63 283.70,256.46 288.27,254.39 292.84,252.42 297.41,250.55 301.98,248.78 306.55,247.10 311.12,245.54 315.69,244.07 320.26,242.71 324.83,241.45 329.40,240.30 333.97,239.26 338.54,238.33 343.11,237.50 347.68,236.79 352.25,236.18 356.82,235.68 361.39,235.29 365.96,235.02 370.53,234.85 375.10,234.79" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">sen x</text><polyline points="275.46,142.48 375.10,234.79" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Segmento</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sobre 0≤x≤1, el borde superior es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arcsen x. De 1 a π/2, es la recta</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=1+π/2−x. El borde inferior es sen x</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en todo el tramo.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las integrales de arcoseno en [0,1] y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de seno en [0,π/2] son π/2−1 y 1. El</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área bajo el segmento es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(π/2−1)(π/2+1)/2.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma las dos contribuciones superiores</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y resta la inferior.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>