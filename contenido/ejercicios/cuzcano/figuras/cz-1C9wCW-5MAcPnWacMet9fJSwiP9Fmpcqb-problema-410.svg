<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">410 · Amperímetro que puentea resistor</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="100.9032258064516" y1="142.48387096774195" x2="228.99999999999997" y2="142.48387096774195" stroke="#20364b" stroke-width="2"/><line x1="246.99999999999997" y1="142.48387096774195" x2="375.09677419354836" y2="142.48387096774195" stroke="#20364b" stroke-width="2"/><polyline points="228.99999999999997,142.48387096774195 231.99999999999997,147.48387096774195 235.99999999999997,137.48387096774195 239.99999999999997,147.48387096774195 243.99999999999997,137.48387096774195 246.99999999999997,142.48387096774195" fill="none" stroke="#1766b0" stroke-width="2"/><text x="237.99999999999997" y="157.48387096774195" font-family="Arial,sans-serif" font-size="12" fill="#20364b" text-anchor="middle">R</text><line x1="375.09677419354836" y1="142.48387096774195" x2="310.822780506884" y2="261.579800445973" stroke="#20364b" stroke-width="2"/><line x1="302.2739936866643" y1="277.420199554027" x2="237.99999999999997" y2="396.51612903225805" stroke="#20364b" stroke-width="2"/><polyline points="310.822780506884,261.579800445973 304.99787184016566,261.8452039583654 311.8983631623691,270.11461866027724 301.1984110311792,268.88538133972276 308.09890235338264,277.1547960416346 302.2739936866643,277.420199554027" fill="none" stroke="#1766b0" stroke-width="2"/><text x="288.94794364338077" y="255.00134797753373" font-family="Arial,sans-serif" font-size="12" fill="#20364b" text-anchor="middle">R/2</text><circle cx="100.9032258064516" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m</text><circle cx="375.09677419354836" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">n</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El amperímetro ideal tiene caída cero</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y anula la rama2R.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde n al negativo quedan dos R</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelos: R/2; en serie con el R</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superior.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Vmn=9R/(R+R/2)=6 V.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>