<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">102 · Una raíz cuyo dominio decide la desigualdad</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="108.74999999999999" y1="275" x2="174.37499999999997" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="108.74999999999999" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="174.37499999999997" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><line x1="239.99999999999997" y1="275" x2="371.2499999999999" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="239.99999999999997" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="371.2499999999999" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="108.74999999999999" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">3</text><text x="174.37499999999997" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">4</text><text x="239.99999999999997" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">5</text><text x="371.2499999999999" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">7</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las raíces internas requieren 3≤x≤7.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los denominadores excluyen 4 y 7.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El numerador del radicando tiene el</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">signo de x−5 y su denominador el de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x−4. La raíz exterior existe en</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[3,4)∪[5,7).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ese dominio el lado izquierdo es no</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativo y el derecho no positivo. Se</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva todo el dominio.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>