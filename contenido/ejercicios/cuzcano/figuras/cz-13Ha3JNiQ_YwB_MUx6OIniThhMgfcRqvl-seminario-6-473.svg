<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">473 · Elección entre dos cadenas de ocho carbonos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,235.88 140.07,258.10 179.24,235.88 218.41,258.10 257.59,235.88 296.76,258.10 335.93,235.88 375.10,258.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="179.24,235.88 179.24,277.98" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="179.24,277.98 151.18,303.12" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="179.24,277.98 207.31,303.12" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="335.93,235.88 335.93,268.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="335.92626728110605" y="284.99281243551826" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Br</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay cadenas de ocho carbonos. Entre</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ellas, la que pasa por un extremo del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">isopropilo deja más sustituyentes</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre el esqueleto principal.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al numerarla desde ese extremo quedan</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">metil en 2, etil en 3 y bromo en 7. En</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el otro sentido los localizadores</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ordenados son 2,6,7.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa 2,3,7 y enumera los prefijos</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alfabéticamente.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>