.22 227.08,158.62 238.00,158.08 248.92,158.62 259.74,160.22 270.34,162.88 280.64,166.56 290.52,171.24 299.90,176.86 308.68,183.37 316.78,190.72 324.13,198.82 330.64,207.60 336.26,216.98 340.94,226.86 344.62,237.16 347.28,247.76 348.88,258.58 349.42,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,142.48 238.00,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,269.50 141.51,213.79" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,269.50 141.51,325.21" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,269.50 126.58,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="138.83828522920203" y="204.87775891341255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="138.83828522920203" y="337.4647707979627" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="247.47050084889645" y="273.9567062818336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="205.68887945670627" y="265.0432937181664" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="205.68887945670627" y="282.8701188455009" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el sector generador tiene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semiángulo θ respecto de la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal, el corte axial completo</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contiene dos sectores simétricos. Su</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área es 2R²θ.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De 2R²θ=πR²/3, resulta θ=π/6. El</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sólido queda entre las direcciones</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">polares π/2−θ y π/2+θ.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fracción de ángulo sólido de esa</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">banda es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[cos(π/2−θ)−cos(π/2+θ)]/2=senθ. La</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fracción de volumen es la misma.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>