903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><circle cx="375.0967741935484" cy="333.008064516129" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="325.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><circle cx="375.0967741935484" cy="269.5" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><circle cx="375.0967741935484" cy="205.991935483871" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="197.991935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5</text><circle cx="375.0967741935484" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">6</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para invertir la relación, intercambia</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la entrada y la salida en cada par.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">{(0,2),(0,3),(2,4),(4,5),(6,6)}.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La entrada 0 tiene dos salidas</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distintas, 2 y 3. Esto impide que la</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">relación inversa sea una función.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>