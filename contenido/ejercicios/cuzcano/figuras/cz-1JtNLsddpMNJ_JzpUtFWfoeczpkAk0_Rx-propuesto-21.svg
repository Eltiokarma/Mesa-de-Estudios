<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Área de piso visible en un espejo de techo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,216.09 367.47,216.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,333.60 367.47,333.60" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="207.22,216.59 283.53,216.59" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="270.30,294.43 207.22,216.59 112.60,333.60" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="270.30,294.43 283.53,216.59 303.37,333.60" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="272.59,294.43 272.58,294.67 272.54,294.92 272.47,295.16 272.38,295.39 272.26,295.61 272.13,295.81 271.96,296.00 271.78,296.17 271.59,296.32 271.38,296.45 271.15,296.55 270.92,296.63 270.67,296.69 270.43,296.71 270.18,296.71 269.93,296.69 269.69,296.63 269.46,296.55 269.23,296.45 269.02,296.32 268.82,296.17 268.64,296.00 268.48,295.81 268.34,295.61 268.23,295.39 268.13,295.16 268.07,294.92 268.03,294.67 268.01,294.43 268.03,294.18 268.07,293.93 268.13,293.70 268.23,293.47 268.34,293.25 268.48,293.04 268.64,292.85 268.82,292.68 269.02,292.53 269.23,292.40 269.46,292.30 269.69,292.22 269.93,292.17 270.18,292.14 270.43,292.14 270.67,292.17 270.92,292.22 271.15,292.30 271.38,292.40 271.59,292.53 271.78,292.68 271.96,292.85 272.13,293.04 272.26,293.25 272.38,293.47 272.47,293.70 272.54,293.93 272.58,294.18 272.59,294.43" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="180.26165539529592" y="205.4028068705488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">400 cm²</text><text x="279.9684002633311" y="303.5834280926447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ojo</text><text x="375.09677419354836" y="276.62191034771683" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3h</text><text x="277.93356873541205" y="321.3882039619367" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja el ojo respecto del techo. Su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posición virtual queda a altura 5h</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre el piso.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde el ojo virtual, la distancia al</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">espejo es 2h y al piso es 5h. Por</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semejanza, cada lado del cuadrado</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">visible se multiplica por 5/2.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El factor de escala para el área es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(5/2)². Aplícalo a 400 cm².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>