<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Lingote determinado con dos ensayos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,242.29 111.61,171.60 158.74,171.60 169.45,242.29 100.90,242.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="195.16,242.29 205.87,171.60 252.99,171.60 263.71,242.29 195.16,242.29" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="306.55,242.29 317.26,171.60 364.39,171.60 375.10,242.29 306.55,242.29" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="271.42,205.02 297.55,205.02 288.55,199.02" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="297.55,205.02 288.55,211.02" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,381.53 111.61,310.84 158.74,310.84 169.45,381.53 100.90,381.53" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="195.16,381.53 205.87,310.84 252.99,310.84 263.71,381.53 195.16,381.53" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="306.55,381.53 317.26,310.84 364.39,310.84 375.10,381.53 306.55,381.53" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="271.42,344.26 297.55,344.26 288.55,338.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="297.55,344.26 288.55,350.26" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="135.17741935483872" y="157.4662298387097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Original</text><text x="135.17741935483872" y="208.4490927419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 kg</text><text x="135.17741935483872" y="226.87147177419357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,800</text><text x="229.4314516129032" y="157.4662298387097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Plata pura</text><text x="229.4314516129032" y="208.4490927419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 kg</text><text x="229.4314516129032" y="226.87147177419357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1,000</text><text x="340.8225806451612" y="157.4662298387097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Primer ensayo</text><text x="340.8225806451612" y="208.4490927419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6 kg</text><text x="340.8225806451612" y="226.87147177419357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,900</text><text x="135.17741935483872" y="296.70514112903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Original</text><text x="135.17741935483872" y="347.68800403225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 kg</text><text x="135.17741935483872" y="366.1103830645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,800</text><text x="229.4314516129032" y="296.70514112903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Otra aleación</text><text x="229.4314516129032" y="347.68800403225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 kg</text><text x="229.4314516129032" y="366.1103830645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,900</text><text x="340.8225806451612" y="296.70514112903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Segundo ensayo</text><text x="340.8225806451612" y="347.68800403225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 kg</text><text x="340.8225806451612" y="366.1103830645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,840</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sean m la masa y s la plata iniciales.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El primer ensayo da s + 3 = 0,900(m +</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segundo da s + 1,8 = 0,840(m + 2).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al restar se obtiene 0,060m = 0,18.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con m = 3 kg, la plata inicial es 2,4</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">kg. Divide 2,4 entre 3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>