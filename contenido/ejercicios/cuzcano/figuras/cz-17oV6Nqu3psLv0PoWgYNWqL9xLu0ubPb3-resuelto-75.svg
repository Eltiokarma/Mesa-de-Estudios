<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">075 · Recta por el origen con parámetro en dos coordenadas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,293.68 375.10,293.68" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="201.73,370.33 201.73,168.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="129.19,342.04 201.73,293.68 346.81,196.96" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="222.28,293.68 222.21,295.43 221.99,297.16 221.62,298.87 221.10,300.54 220.45,302.16 219.66,303.73 218.74,305.21 217.70,306.62 216.54,307.93 215.28,309.14 213.91,310.23 212.46,311.21 210.93,312.06 209.34,312.77 207.69,313.35 205.99,313.79 204.27,314.07 202.52,314.22 200.78,314.21 199.03,314.05 197.31,313.75 195.62,313.30 193.98,312.71 192.39,311.98 190.86,311.12 189.42,310.14 188.06,309.03 186.81,307.81 185.66,306.49 184.63,305.08" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="201.73101211810888" y="293.67932525459406" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="129.19303635432667" y="342.03797576378224" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="346.8069636456733" y="196.9620242362178" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="375.0967741935484" y="299.11967343687775" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="209.34749957330604" y="168.6722136883427" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="204.63253114866018" y="317.37506400409626" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala las pendientes −2/a y −2a/9.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta a²=9. El tercer cuadrante fija</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=−3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P=(−3,−2) tiene norma √13. Las razones</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son −2/√13, −3/√13 y 2/3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al sumar, se obtiene</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−5+2/3)/√13=−√13/3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>