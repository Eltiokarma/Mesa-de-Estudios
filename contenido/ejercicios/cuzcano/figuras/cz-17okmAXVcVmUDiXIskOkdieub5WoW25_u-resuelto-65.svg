<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">065 · Inclinaciones a partir de una longitud común</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,361.38 367.14,361.38 367.14,164.60 100.90,361.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="334.58,361.38 367.14,164.60" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,361.38 367.14,328.10" fill="none" stroke="#008674" stroke-width="2.5"/><text x="226.78627968337733" y="372.9556132436803" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7</text><text x="375.0967741935484" y="244.902161886118" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6</text><text x="375.0967741935484" y="343.2935143416461" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">s</text><text x="343.9877436377564" y="374.4025448974381" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">s</text><text x="354.8397310409397" y="206.55847306153717" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8°</text><text x="332.4122904076943" y="330.99459528470504" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo derecho,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan8°=s/(6+s). Por tanto</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">s=6tan8°/(1−tan8°).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta desde la izquierda sube con</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente s/(7+s). La otra tiene</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclinación 82° respecto de la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como el seno del ángulo obtuso iguala</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el de su suplemento, usa</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">13sen²[82°−arctan(s/(7+s))].</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>