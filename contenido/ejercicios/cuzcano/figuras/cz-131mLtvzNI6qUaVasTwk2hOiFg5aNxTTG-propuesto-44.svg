<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Compresión de muelle en dispositivo libre</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="274.0698924731182" x2="421" y2="274.0698924731182" stroke="#20364b" stroke-width="1.7"/><line x1="192.3010752688172" y1="105" x2="192.3010752688172" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="192.30,328.91 375.10,328.91 375.10,219.23 192.30,219.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">dispositivo</text><polyline points="192.30,274.07 210.58,255.79 228.86,292.35 247.14,255.79 265.42,292.35 283.70,255.79 301.98,292.35 320.26,274.07" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">muelle</text><circle cx="100.90322580645162" cy="274.0698924731182" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="266.0698924731182" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m→</text><circle cx="192.3010752688172" cy="210.09139784946237" r="3.7" fill="#20364b"/><text x="199.3010752688172" y="202.09139784946237" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O; compresión x0</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La energía de traslación del CM no</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puede convertirse en energía elástica.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con masa reducida μ=mM/(m+M), la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">energía relativa disponible es μv²/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el umbral, μv²/2=Kx0²/2:</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vmin=x0√[K(1/m+1/M)].</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>