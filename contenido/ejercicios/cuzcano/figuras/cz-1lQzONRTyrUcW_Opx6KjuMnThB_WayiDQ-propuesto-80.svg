<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">080 · Ángulo entre medianas de dos caras de un tetraedro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,394.90 375.10,394.90 344.86,314.16 100.90,394.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,394.90 273.62,144.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,394.90 273.62,144.10" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="344.86,314.16 273.62,144.10" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="273.62,144.10 238.00,394.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,394.90 222.88,354.53" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645164" y="394.8950334978174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="394.8950334978174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="344.8563603056606" y="314.1591168224294" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="273.6187867685535" y="144.1049665021826" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.0" y="394.8950334978174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="222.8797930560561" y="354.5270751601234" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con arista 1, usa B=(0,0,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C=(1,0,0), D=(1/2,√3/2,0),</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=(1/2,√3/6,√(2/3)).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AM=(0,−√3/6,−√(2/3)) y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CN=(−3/4,√3/4,0). El producto escalar</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale −1/8.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos módulos valen √3/2. Para el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo entre rectas, divide el valor</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">absoluto por 3/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>