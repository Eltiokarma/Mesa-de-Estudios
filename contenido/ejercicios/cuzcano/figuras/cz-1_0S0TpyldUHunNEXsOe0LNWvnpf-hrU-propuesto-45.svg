<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">045 · Densidades por alargamiento dentro y fuera del líquido</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="114.95,175.85 114.95,188.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="114.95,188.85 107.67,196.47 122.24,204.09 107.67,211.71 122.24,219.33 107.67,226.95 122.24,234.57 107.67,242.18 122.24,249.80 107.67,257.42 122.24,265.04 107.67,272.66 122.24,280.28 107.67,287.90 114.95,295.51" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="114.95,295.51 114.95,312.68" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="129.00,326.73 128.92,328.20 128.69,329.65 128.31,331.07 127.78,332.45 127.12,333.76 126.32,334.99 125.39,336.13 124.35,337.17 123.21,338.10 121.98,338.90 120.66,339.57 119.29,340.09 117.87,340.47 116.42,340.70 114.95,340.78 113.48,340.70 112.03,340.47 110.61,340.09 109.24,339.57 107.93,338.90 106.69,338.10 105.55,337.17 104.51,336.13 103.59,334.99 102.79,333.76 102.12,332.45 101.59,331.07 101.21,329.65 100.98,328.20 100.90,326.73 100.98,325.26 101.21,323.81 101.59,322.39 102.12,321.02 102.79,319.71 103.59,318.47 104.51,317.33 105.55,316.29 106.69,315.37 107.93,314.57 109.24,313.90 110.61,313.37 112.03,312.99 113.48,312.76 114.95,312.68 116.42,312.76 117.87,312.99 119.29,313.37 120.66,313.90 121.98,314.57 123.21,315.37 124.35,316.29 125.39,317.33 126.32,318.47 127.12,319.71 127.78,321.02 128.31,322.39 128.69,323.81 128.92,325.26 129.00,326.73" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="219.01,217.47 219.01,363.15 375.10,363.15 375.10,217.47" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="219.01,251.29 375.10,251.29" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="131.60041623309053" y="237.24193548387098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x₁</text><text x="297.0530697190427" y="295.5145681581686" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Líquido</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Fuera del líquido, kx₁ equivale al</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">peso de la esfera.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dentro del líquido, kx₂ equivale a</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">peso menos empuje. Como x₂ = x₁/3, el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">empuje es dos tercios del peso.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambos son proporcionales a su densidad</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para el mismo volumen. Por ello</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ρ_líquido/ρ_esfera = 2/3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>