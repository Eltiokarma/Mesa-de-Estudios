<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">082 · Espira equilátera que entra de vértice en un campo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,155.61 311.55,155.61 311.55,368.40 100.90,368.40 100.90,155.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="224.43,262.00 375.10,174.89 375.10,349.12 224.43,262.00" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="220.15,262.00 161.60,262.00" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="173.74,257.00 161.60,262.00 173.74,267.00" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="148.74428763440858" y="201.30863575268816" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙ B₀</text><text x="184.44657258064518" y="249.14969758064515" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">v₀</text><text x="309.4045698924731" y="383.3902889784946" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">borde</text><text x="268.70396505376345" y="292.70648521505376" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">área dentro</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La penetración es x=v₀t. La sección de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la espira sobre el borde mide 2x tan</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">30°=2x/√3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área dentro del campo es la de un</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo de altura x y base 2x/√3, es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">decir, v₀²t²/√3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica Faraday a Φ(t)=B₀v₀²t²/√3. Al</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derivar t² aparece el factor 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>