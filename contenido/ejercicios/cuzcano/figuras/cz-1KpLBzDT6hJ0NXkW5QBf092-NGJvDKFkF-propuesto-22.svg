<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">022 · Intervalos para una suma de potencias sextas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (radianes)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">valor</text><polyline points="100.90,142.48 105.47,144.57 110.04,150.72 114.61,160.68 119.18,174.00 123.75,190.11 128.32,208.31 132.89,227.79 137.46,247.70 142.03,267.18 146.60,285.38 151.17,301.49 155.74,314.81 160.31,324.77 164.88,330.93 169.45,333.01 174.02,330.93 178.59,324.77 183.16,314.81 187.73,301.49 192.30,285.38 196.87,267.18 201.44,247.70 206.01,227.79 210.58,208.31 215.15,190.11 219.72,174.00 224.29,160.68 228.86,150.72 233.43,144.57 238.00,142.48 242.57,144.57 247.14,150.72 251.71,160.68 256.28,174.00 260.85,190.11 265.42,208.31 269.99,227.79 274.56,247.70 279.13,267.18 283.70,285.38 288.27,301.49 292.84,314.81 297.41,324.77 301.98,330.93 306.55,333.01 311.12,330.93 315.69,324.77 320.26,314.81 324.83,301.49 329.40,285.38 333.97,267.18 338.54,247.70 343.11,227.79 347.68,208.31 352.25,190.11 356.82,174.00 361.39,160.68 365.96,150.72 370.53,144.57 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">sen⁶x+cos⁶x</text><polyline points="100.90,285.38 375.10,285.38" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">7/16</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe a=sen²x y b=cos²x. Como a+b=1,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la suma de cubos es 1−3ab=1−¾sen²2x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al despejar, se requiere sen²2x&gt;3/4.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El módulo del seno supera √3/2 entre</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π/3 y 2π/3 en cada período de sen².</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide los extremos por dos. Son</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abiertos porque la desigualdad es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">estricta.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>