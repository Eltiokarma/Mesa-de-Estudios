<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Problema 1: Cantidades fundamentales y prefijos</title><desc id="desc">Reconstrucción vectorial. Sólido en perspectiva y sección auxiliar con datos y letras.</desc><rect width="900" height="540" rx="18" fill="#f5f8fc"/><text x="28.00" y="36.00" font-family="Arial,sans-serif" font-size="18" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">01  /  Cantidades fundamentales y prefijos</text><line x1="460.00" y1="70.00" x2="460.00" y2="490.00" stroke="#d8e2ee" stroke-width="1"/><text x="28.00" y="517.00" font-family="Arial,sans-serif" font-size="14" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Esquema en perspectiva · Las cotas, no la apariencia, definen la geometría.</text><text x="55.00" y="160.00" font-family="Arial,sans-serif" font-size="18" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Magnitud ≠ dimensión</text><text x="55.00" y="208.00" font-family="Arial,sans-serif" font-size="18" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">n=m/Mm para composición fija</text><text x="55.00" y="256.00" font-family="Arial,sans-serif" font-size="18" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Independencia dimensional: N y M</text><text x="55.00" y="304.00" font-family="Arial,sans-serif" font-size="18" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">μA: 10⁻⁶ A; mA: 10⁻³ A</text><text x="55.00" y="352.00" font-family="Arial,sans-serif" font-size="18" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">m·N: producto; mN: prefijo</text><text x="490.00" y="140.00" font-family="Arial,sans-serif" font-size="17" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">V F V F en lectura dimensional; V</text><text x="490.00" y="167.00" font-family="Arial,sans-serif" font-size="17" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">V V F para II como n=m/Mm</text><text x="490.00" y="216.00" font-family="Arial,sans-serif" font-size="16" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Relaciones y coordenadas del esquema</text><text x="490.00" y="242.00" font-family="Arial,sans-serif" font-size="16" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">conservadas en la ficha. Desarrollo</text><text x="490.00" y="268.00" font-family="Arial,sans-serif" font-size="16" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">completo en los pasos.</text></svg>