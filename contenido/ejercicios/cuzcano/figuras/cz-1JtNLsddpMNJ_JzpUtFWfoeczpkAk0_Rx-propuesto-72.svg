<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">072 · Foco de una lente plateada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="289.16,191.74 304.71,230.21 309.62,269.50 304.71,308.79 289.16,347.26 289.16,191.74" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="154.10,269.50 289.16,191.74" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="125.46,236.76 306.34,236.76 289.16,244.13 244.14,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="195.84785748675978" y="222.8461723639865" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="336.6278285989408" y="314.51685122773233" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Plata</text><text x="178.6596051998074" y="296.5101107366394" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Aire</text><text x="342.35724602792493" y="249.03779489648528" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vidrio</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Un haz paralelo al eje entra sin girar</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por la cara plana. La cara plateada</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">actúa como espejo cóncavo, con focal</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paraxial R/2 dentro del vidrio.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al salir por la cara plana hacia aire,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el ángulo pequeño respecto al eje se</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplica por nL. La pendiente</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también se multiplica por nL.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la aproximación de lente delgada,</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dividir la distancia focal en vidrio</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por nL da la focal efectiva medida</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde el plano.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>