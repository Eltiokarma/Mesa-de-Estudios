<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Valores exactos para 18° y 36°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,297.64 207.89,297.64 207.89,262.88 100.90,297.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="202.67,297.64 202.67,292.42 207.89,292.42" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="269.64,297.64 360.64,297.64 360.64,231.52 269.64,297.64" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="350.73,297.64 350.73,287.72 360.64,287.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="134.65012406947892" y="294.5449935119009" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">18°</text><text x="151.52357320099253" y="307.481304512728" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">√(10+2√5)</text><text x="213.39288668320924" y="280.20256175011434" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">√5−1</text><text x="151.52357320099253" y="272.6095096409332" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="297.7601323407775" y="293.4200969031333" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">36°</text><text x="314.6335814722911" y="307.481304512728" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">√5+1</text><text x="375.09677419354836" y="266.70380244490343" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">√(10−2√5)</text><text x="311.8213399503722" y="257.4234054225709" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como cos 54°=sen 36°, toma x=18° y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aplica cos 3x=4 cos³x−3 cos x y sen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x=2 sen x cos x.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide entre cos x. Con s=sen x, queda</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4s²+2s−1=0. Elige la raíz positiva por</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tratarse de un ángulo agudo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye s en cos 36°=1−2s². En los</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulos usa hipotenusa 4 para leer</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las razones sin denominador adicional.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>