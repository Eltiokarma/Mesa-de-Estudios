<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">087 · Fuerza mínima sobre una palanca de tres brazos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="114.23,219.53 216.73,219.53 216.73,322.03 319.23,322.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="216.73,219.53 319.23,322.03" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="114.23,219.53 114.23,275.91" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="109.62,266.17 114.23,275.91 118.84,266.17" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,266.17 319.23,322.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="322.86,311.89 319.23,322.03 329.38,318.41" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="114.22851974675909" y="206.71736508893576" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="216.73078082604763" y="206.71736508893576" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="205.45553210732587" y="332.28263491106424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="329.48326801326505" y="332.28263491106424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="100.90322580645159" y="268.2187217365089" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="369.45914983418754" y="254.38091649080494" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza P tiene brazo L y produce</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">momento PL.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde B a D hay un desplazamiento</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal L y uno vertical L, así que</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BD=√2L.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El momento por unidad de fuerza es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">máximo si la fuerza en D es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a BD y de sentido</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contrario al giro debido a P. Igualar</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los momentos da la fuerza mínima.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>