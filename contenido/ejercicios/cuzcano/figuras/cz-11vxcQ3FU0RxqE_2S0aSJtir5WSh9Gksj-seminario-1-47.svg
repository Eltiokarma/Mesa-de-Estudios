<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">047 · Cotangente desde una semicircunferencia</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,335.31 213.21,251.07 276.39,203.69 375.10,335.31 276.39,335.31 100.90,335.31" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="276.39,203.69 276.39,335.31" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="213.21,251.07 375.10,335.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="276.39,335.31 273.16,335.23 269.94,334.99 266.73,334.59 263.55,334.04 260.40,333.33 257.28,332.47 254.22,331.46 251.20,330.30 248.25,328.99 245.37,327.54 242.56,325.94 239.83,324.22 237.19,322.36 234.64,320.37 232.19,318.26 229.85,316.03 227.63,313.69 225.52,311.25 223.53,308.70 221.67,306.06 219.94,303.33 218.35,300.52 216.90,297.64 215.59,294.68 214.43,291.67 213.41,288.60 212.55,285.49 211.85,282.34 211.29,279.16 210.90,275.95 210.66,272.73 210.58,269.50 210.66,266.27 210.90,263.05 211.29,259.84 211.85,256.66 212.55,253.51 213.41,250.40 214.43,247.33 215.59,244.32 216.90,241.36 218.35,238.48 219.94,235.67 221.67,232.94 223.53,230.30 225.52,227.75 227.63,225.31 229.85,222.97 232.19,220.74 234.64,218.63 237.19,216.64 239.83,214.78 242.56,213.06 245.37,211.46 248.25,210.01 251.20,208.70 254.22,207.54 257.28,206.53 260.40,205.67 263.55,204.96 266.73,204.41 269.94,204.01 273.16,203.77 276.39,203.69" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="335.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="276.38709677419354" y="203.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="335.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="276.38709677419354" y="335.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="213.21290322580646" y="251.0741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="258.83870967741933" y="239.88709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53°</text><text x="350.96774193548384" y="328.9451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="290.0967741935484" y="324.3387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el modelo 3–4–5, toma D=(0,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=(0,12), A=(−16,0). Como BD²=AD·DC,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C=(9,0).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el ángulo inscrito en la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semicircunferencia, ED⊥AB. El pie de D</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en AB es E=(−144/25,192/25).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde C, la cotangente es la distancia</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal 9+144/25 dividida entre la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura 192/25.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>