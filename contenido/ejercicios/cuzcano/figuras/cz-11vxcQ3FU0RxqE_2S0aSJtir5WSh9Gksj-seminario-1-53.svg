<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">053 · Dos cuerdas de una semicircunferencia</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,338.05 238.00,338.05 375.10,338.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,338.05 169.45,219.32" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,338.05 306.55,219.32" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,338.05 101.07,331.32 101.56,324.61 102.39,317.93 103.54,311.30 105.01,304.74 106.81,298.25 108.92,291.86 111.34,285.58 114.07,279.43 117.09,273.42 120.41,267.57 124.01,261.88 127.88,256.38 132.02,251.08 136.42,245.98 141.06,241.11 145.93,236.47 151.03,232.07 156.33,227.93 161.83,224.06 167.52,220.46 173.37,217.14 179.38,214.11 185.54,211.39 191.81,208.97 198.20,206.85 204.69,205.06 211.25,203.59 217.88,202.44 224.56,201.61 231.27,201.12 238.00,200.95 244.73,201.12 251.44,201.61 258.12,202.44 264.75,203.59 271.31,205.06 277.80,206.85 284.19,208.97 290.46,211.39 296.62,214.11 302.63,217.14 308.48,220.46 314.17,224.06 319.67,227.93 324.97,232.07 330.07,236.47 334.94,241.11 339.58,245.98 343.98,251.08 348.12,256.38 351.99,261.88 355.59,267.57 358.91,273.42 361.93,279.43 364.66,285.58 367.08,291.86 369.19,298.25 370.99,304.74 372.46,311.30 373.61,317.93 374.44,324.61 374.93,331.32 375.10,338.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.0" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.0967741935484" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="169.4516129032258" y="219.31909786826245" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="306.5483870967742" y="219.31909786826245" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="143.40322580645164" y="327.08064516129036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="133.80645161290323" y="305.14516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Tales, los triángulos con</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hipotenusa AB y tercer vértice C o D</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son rectángulos. Así AD=2R cos θ y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC=2R cos 2θ.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cancela R y obtén cos θ+cos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2θ=(√3+1)/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En 0°&lt;θ&lt;45°, la suma disminuye</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">estrictamente. En 30° vale √3/2+1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>