<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">105 · Lectura de un mapa de bloques</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,206.99 144.24,206.99 144.24,321.17 100.90,321.17 100.90,206.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,181.16 120.91,181.16 120.91,206.99 100.90,206.99 100.90,181.16" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="144.24,241.16 275.09,241.16 275.09,321.17 144.24,321.17 144.24,241.16" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="275.09,206.99 338.43,206.99 338.43,321.17 275.09,321.17 275.09,206.99" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="338.43,176.99 375.10,176.99 375.10,321.17 338.43,321.17 338.43,176.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,337.01 375.10,337.01 375.10,362.01 100.90,362.01 100.90,337.01" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="115.0712814981861" y="264.4995097558584" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="200.91303068928326" y="284.50147073242476" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="300.92283557211493" y="264.4995097558584" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">W</text><text x="351.761153054221" y="253.66511422688498" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">18</text><text x="234.24963231689384" y="353.6749191097166" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Z</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El recuadro Z corresponde a la región</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f, el central Y al bloque d y W a la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">región p.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los metales del bloque d son</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conductores eléctricos. La afirmación</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de que Y contiene malos conductores es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">incorrecta.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La afirmación sobre todos los</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">elementos de X también requiere</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aclaración si X incluye H, que no es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">metal en condiciones ordinarias.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>