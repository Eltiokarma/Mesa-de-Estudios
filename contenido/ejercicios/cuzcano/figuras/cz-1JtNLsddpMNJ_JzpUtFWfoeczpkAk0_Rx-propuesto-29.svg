al,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">al llegar a F</text><text x="217.6756803756195" y="276.52112859751327" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="177.7661072950178" y="276.52112859751327" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El foco está a R/2=20 cm del espejo.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con p=f, la ecuación da 1/q=0. Los</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rayos reflejados salen paralelos en</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esa aproximación.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia que recorre hasta llegar</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">al foco es 90−20=70 cm. Divide por 10</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cm/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>