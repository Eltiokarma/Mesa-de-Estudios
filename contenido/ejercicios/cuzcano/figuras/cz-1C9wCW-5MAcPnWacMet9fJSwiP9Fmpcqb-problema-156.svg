<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">156 · Energía del péndulo entre dos ángulos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.48387096774195" x2="421" y2="142.48387096774195" stroke="#20364b" stroke-width="1.7"/><line x1="166.28129874216285" y1="105" x2="166.28129874216285" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="166.28,396.52 170.09,396.49 173.90,396.40 177.71,396.26 181.51,396.06 185.32,395.80 189.11,395.49 192.91,395.12 196.69,394.69 200.47,394.20 204.24,393.66 208.01,393.07 211.76,392.41 215.50,391.70 219.24,390.94 222.96,390.11 226.67,389.24 230.36,388.30 234.04,387.31 237.70,386.27 241.35,385.17 244.98,384.02 248.60,382.81 252.19,381.55 255.77,380.23 259.33,378.86 262.86,377.44 266.37,375.97 269.87,374.44 273.33,372.86 276.78,371.23 280.20,369.54 283.59,367.81 286.95,366.02 290.29,364.19 293.61,362.30 296.89,360.37 300.14,358.39 303.37,356.35 306.56,354.27 309.72,352.15" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">arco</text><polyline points="166.28,142.48 309.72,352.15" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">cuerda A</text><polyline points="166.28,142.48 241.35,385.17" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="498" font-family="Arial,sans-serif" font-size="12" fill="#008674" text-anchor="start">cuerda B</text><circle cx="309.7187012578372" cy="352.14574088431345" r="3.7" fill="#20364b"/><text x="316.7187012578372" y="344.14574088431345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A:2θ</text><circle cx="241.3529641440354" cy="385.17015651174665" r="3.7" fill="#20364b"/><text x="248.3529641440354" y="377.17015651174665" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B:θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las alturas relativas al punto más</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bajo son hA=ℓ(1−cos2θ) y hB=ℓ(1−cosθ).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tensión no hace trabajo y K inicial</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es cero.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">KB=mg(hA−hB)=mgℓ(cosθ−cos2θ).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>