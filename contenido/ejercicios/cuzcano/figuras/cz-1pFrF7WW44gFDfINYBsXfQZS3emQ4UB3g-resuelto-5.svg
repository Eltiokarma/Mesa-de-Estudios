<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Descarga del camión a tierra</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="150.76,316.24 300.32,316.24 300.32,216.53 150.76,216.53 150.76,316.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,366.09 375.10,366.09" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="300.32,316.24 325.24,366.09" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="356.40,359.86 300.32,285.08" fill="none" stroke="#b0467a" stroke-width="2.5"/><line x1="300.316715542522" y1="285.0791788856305" x2="309.0573328088724" y2="289.9373276897715" stroke="#b0467a" stroke-width="2"/><line x1="300.316715542522" y1="285.0791788856305" x2="302.53316555991927" y2="294.83045312648636" stroke="#b0467a" stroke-width="2"/><text x="157.75659824046923" y="164.9090909090909" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">+64 µC → 0</text><text x="288.6217008797654" y="202.29912023460415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">e− desde tierra</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La carrocería positiva tiene déficit</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de electrones. La cadena permite que</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lleguen desde tierra.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al neutralizarse, ΔQ=−64 µC, igual a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−Ne.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N=64·10⁻⁶/(1,6·10⁻¹⁹)=4·10¹⁴. El flujo</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cesa al equilibrarse en el modelo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">indicado.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>