y="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">…</text><text x="244.027682452528" y="229.60798444291927" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">20</text><text x="382.0967741935484" y="229.60798444291927" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F2</text><text x="146.7959277053306" y="264.61141615191036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">7</text><text x="185.68862960420958" y="264.61141615191036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">…</text><text x="224.58133150308853" y="264.61141615191036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">20</text><text x="382.0967741935484" y="264.61141615191036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F3</text><text x="185.68862960420958" y="299.6148478609014" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">…</text><text x="382.0967741935484" y="299.6148478609014" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">…</text><text x="185.68862960420958" y="334.6182795698925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">20</text><text x="382.0967741935484" y="334.6182795698925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F16</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El número k aparece en las filas que</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">comienzan entre 5 y k: k−4 veces.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto la suma es Σ(k²−4k), de 5 a</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">20.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Es (2870−30)−4(210−10)=2040.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>