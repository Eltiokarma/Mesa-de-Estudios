<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">037 · Tensión de una cuerda con dos inclinaciones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,169.14 375.10,169.14 201.27,269.50 100.90,169.14" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="201.27,269.50 201.27,334.74" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="177.18,334.74 225.35,334.74 225.35,369.86 177.18,369.86 177.18,334.74" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645164" y="169.13819573652484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="169.13819573652484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="201.26503006992672" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="125.9936768723204" y="182.18523029077664" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45°</text><text x="331.73537561244433" y="182.18523029077664" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="255.46040437220327" y="349.7894434107801" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El equilibrio horizontal da T_A</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos30°=T_B cos45°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En vertical, T_A sen30°+T_B sen45°=100</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N. Sustituye la primera ecuación para</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">eliminar T_B.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta T_A=100/(sen30°+cos30°</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan45°)=100(√3−1) N.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>