<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">046 · Cruce leído sobre el eje</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="227.16129032258067" x2="421" y2="227.16129032258067" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">t (s)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">x (m)</text><polyline points="100.90,142.48 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">A</text><polyline points="100.90,261.03 375.10,159.42" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">B</text><circle cx="192.30107526881721" cy="227.16129032258067" r="3.7" fill="#20364b"/><text x="199.30107526881721" y="219.16129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">cruce</text><circle cx="375.09677419354836" cy="159.4193548387097" r="3.7" fill="#20364b"/><text x="368.09677419354836" y="151.4193548387097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="end">6 s después</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Del cruce en cero: ∣vA∣/vB=5/2.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tras cruzarse, la separación crece a</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∣vA∣+vB=14/6=7/3 m/s.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vB=2/3 m/s: xB=−2+(2/3)t. Se cruzan a</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t=3 s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>