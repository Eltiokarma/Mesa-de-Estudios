<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Mediatriz por igualdad de distancias al cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,315.20 375.10,315.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="192.30,370.04 192.30,168.96" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="137.46,223.80 338.54,278.64" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="206.01,368.51 259.02,174.14" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="129.23655913978496" y="213.747311827957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="345.84946236559136" y="276.81182795698925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="250.79569892473117" y="243.90860215053763" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala (x+3)²+(y−5)² y (x−8)²+(y−2)².</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desarrolla. Los términos cuadráticos</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se cancelan y queda 22x−6y−34=0.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide entre 2. Como control, el punto</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio (5/2,7/2) satisface la ecuación.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>