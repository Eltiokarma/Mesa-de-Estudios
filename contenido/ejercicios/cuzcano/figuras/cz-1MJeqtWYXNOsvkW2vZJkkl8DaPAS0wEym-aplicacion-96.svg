<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">096 · Dos esferas enlazadas sobre una cúpula</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="122.00,346.49 122.35,337.38 123.42,328.34 125.20,319.40 127.67,310.64 130.83,302.09 134.64,293.82 139.09,285.87 144.15,278.30 149.79,271.15 155.97,264.46 162.66,258.27 169.81,252.64 177.39,247.57 185.33,243.12 193.61,239.31 202.15,236.16 210.92,233.69 219.85,231.91 228.90,230.84 238.00,230.48 247.10,230.84 256.15,231.91 265.08,233.69 273.85,236.16 282.39,239.31 290.67,243.12 298.61,247.57 306.19,252.64 313.34,258.27 320.03,264.46 326.21,271.15 331.85,278.30 336.91,285.87 341.36,293.82 345.17,302.09 348.33,310.64 350.80,319.40 352.58,328.34 353.65,337.38 354.00,346.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="224.03,211.08 223.72,214.95 222.81,218.73 221.33,222.33 219.29,225.64 216.77,228.60 213.81,231.13 210.49,233.16 206.90,234.65 203.12,235.55 199.24,235.86 195.37,235.55 191.59,234.65 187.99,233.16 184.68,231.13 181.72,228.60 179.19,225.64 177.16,222.33 175.67,218.73 174.77,214.95 174.46,211.08 174.77,207.20 175.67,203.42 177.16,199.82 179.19,196.51 181.72,193.55 184.68,191.03 187.99,188.99 191.59,187.51 195.37,186.60 199.24,186.29 203.12,186.60 206.90,187.51 210.49,188.99 213.81,191.03 216.77,193.55 219.29,196.51 221.33,199.82 222.81,203.42 223.72,207.20 224.03,211.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="347.68,234.12 347.37,238.00 346.46,241.78 344.98,245.37 342.94,248.69 340.42,251.64 337.46,254.17 334.15,256.20 330.55,257.69 326.77,258.60 322.89,258.90 319.02,258.60 315.24,257.69 311.64,256.20 308.33,254.17 305.37,251.64 302.84,248.69 300.81,245.37 299.32,241.78 298.42,238.00 298.11,234.12 298.42,230.24 299.32,226.46 300.81,222.87 302.84,219.55 305.37,216.59 308.33,214.07 311.64,212.04 315.24,210.55 319.02,209.64 322.89,209.34 326.77,209.64 330.55,210.55 334.15,212.04 337.46,214.07 340.42,216.59 342.94,219.55 344.98,222.87 346.46,226.46 347.37,230.24 347.68,234.12" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="199.24,211.08 322.89,234.12" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,346.49 199.24,211.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,346.49 322.89,234.12" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,346.49 375.10,346.49" fill="none" stroke="#008674" stroke-width="2.5"/><text x="177.36104218362283" y="180.91439205955334" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15 N</text><text x="339.7679900744416" y="201.4789081885856" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7 N</text><text x="238.0" y="358.0856079404466" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="213.74441687344913" y="329.6116625310173" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="248.01861042183623" y="306.93796526054587" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al aislar el conjunto, el hilo ejerce</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerzas internas. Las normales pasan</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por el centro O de la cúpula, así que</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">no aportan momento respecto de O.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los centros de las esferas están a la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">misma distancia de O. Cancelando esa</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia, el equilibrio de momentos</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da 15 cos θ=7 cos(127°−θ).</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desarrolla el coseno. Así tan</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=[15/7−cos 127°]/sen 127°. Con la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximación del libro, cos 127°≈−3/5</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y sen 127°≈4/5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>