lyline points="100.90,276.35 375.10,276.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,285.49 253.23,171.25" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="210.58,276.35 210.58,203.24" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="210.58,203.24 265.42,276.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><circle cx="113.08960573476703" cy="276.35483870967744" r="3.7" fill="#20364b"/><text x="120.08960573476703" y="268.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="210.5806451612903" cy="276.35483870967744" r="3.7" fill="#20364b"/><text x="217.5806451612903" y="268.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="210.5806451612903" cy="203.23655913978496" r="3.7" fill="#20364b"/><text x="217.5806451612903" y="195.23655913978496" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="265.41935483870964" cy="276.35483870967744" r="3.7" fill="#20364b"/><text x="272.41935483870964" y="268.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="356.81720430107526" cy="276.35483870967744" r="3.7" fill="#20364b"/><text x="363.81720430107526" y="268.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">S</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Mide desde M sobre la horizontal:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MA=2k, MS=5k. Si c=MC, la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicularidad MR⊥CR da</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(2k)c=MR²=400.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Además, por potencia, r²=c²−400. Como</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">c+r=5k, despejar c da</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(25k²+400)/(10k).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Igualar las expresiones de c da k=8,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">c=25 y r=15. Al tocar la vertical x=0</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en su extremo izquierdo, el centro es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(15,4).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>