<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">100 · Cilindro máximo en un octante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="125.60,146.98 131.11,147.05 136.63,147.25 142.13,147.59 147.63,148.06 153.12,148.67 158.58,149.41 164.03,150.29 169.45,151.30 174.85,152.44 180.22,153.72 185.56,155.12 190.85,156.66 196.11,158.33 201.33,160.12 206.50,162.04 211.63,164.09 216.70,166.27 221.71,168.56 226.67,170.98 231.57,173.52 236.40,176.19 241.17,178.96 245.87,181.86 250.49,184.87 255.04,187.99 259.51,191.22 263.90,194.56 268.21,198.01 272.43,201.56 276.57,205.22 280.61,208.97 284.56,212.82 288.41,216.77 292.17,220.82 295.82,224.95 299.37,229.17 302.82,233.48 306.16,237.87 309.40,242.34 312.52,246.89 315.53,251.52 318.42,256.21 321.20,260.98 323.86,265.81 326.40,270.71 328.82,275.67 331.12,280.69 333.29,285.76 335.34,290.88 337.26,296.05 339.06,301.27 340.72,306.53 342.26,311.83 343.67,317.16 344.94,322.53 346.08,327.93 347.09,333.35 347.97,338.80 348.71,344.27 349.32,349.75 349.79,355.25 350.13,360.76 350.34,366.27 350.40,371.79" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="125.60,146.98 125.60,371.79 350.40,371.79" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="157.09,371.79 157.09,241.99 309.15,241.99 309.15,371.79" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="309.15,241.99 125.60,241.99" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="143.5809306308878" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="326.01129245806" y="306.891045248811" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h</text><text x="217.3735451727925" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(1+√2)r</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para radio r, el centro de la base</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda a distancia mínima r de cada</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">plano vertical. La distancia</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal máxima de un punto del</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cilindro al eje del octante es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura h satisface h²+(3+2√2)r²≤R².</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con igualdad, V=πh(R²−h²)/(3+2√2).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Deriva respecto de h. La derivada es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proporcional a R²−3h², positiva antes</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de h=R/√3 y negativa después.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye esa altura.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>