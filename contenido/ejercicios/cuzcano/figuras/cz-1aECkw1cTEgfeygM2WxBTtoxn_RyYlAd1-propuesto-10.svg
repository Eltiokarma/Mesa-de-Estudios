<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Pendiente alrededor de un máximo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">t (s)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">x (m)</text><polyline points="119.18,348.25 123.45,337.72 127.71,327.46 131.98,317.49 136.24,307.79 140.51,298.36 144.77,289.21 149.04,280.34 153.30,271.75 157.57,263.43 161.84,255.39 166.10,247.62 170.37,240.13 174.63,232.92 178.90,225.99 183.16,219.33 187.43,212.95 191.69,206.84 195.96,201.01 200.22,195.46 204.49,190.19 208.75,185.19 213.02,180.46 217.28,176.02 221.55,171.85 225.81,167.96 230.08,164.34 234.34,161.00 238.61,157.94 242.87,155.15 247.14,152.65 251.41,150.41 255.67,148.46 259.94,146.78 264.20,145.37 268.47,144.25 272.73,143.40 277.00,142.83 281.26,142.53 285.53,142.51 289.79,142.77 294.06,143.30 298.32,144.11 302.59,145.20 306.85,146.56 311.12,148.20 315.38,150.12 319.65,152.31 323.91,154.78 328.18,157.53 332.44,160.55 336.71,163.85 340.97,167.42 345.24,171.28 349.51,175.41 353.77,179.81 358.04,184.50 362.30,189.45 366.57,194.69 370.83,200.20 375.10,205.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">posición</text><circle cx="128.32258064516128" cy="326.0221774193549" r="3.7" fill="#20364b"/><text x="135.32258064516128" y="318.0221774193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="283.69892473118284" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="290.69892473118284" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="375.09677419354836" cy="205.991935483871" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="197.991935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De A a B, la pendiente positiva</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">disminuye hasta 0: la rapidez</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">disminuye.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Después de B, la pendiente negativa</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aumenta en módulo.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A es correcta: el módulo de v aumenta</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre B y C. vB0 no implica a B0.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>