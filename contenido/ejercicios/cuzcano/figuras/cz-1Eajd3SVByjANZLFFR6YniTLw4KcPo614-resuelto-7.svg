<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Alturas deducidas a partir de ángulos complementarios</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="113.91,396.52 248.98,142.48 362.09,396.52 113.91,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="248.98,142.48 248.98,336.38" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="113.91,396.52 248.98,336.38 362.09,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="113.91310207840532" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="248.98444963757137" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="362.0868979215947" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="248.98444963757137" y="336.3784905356382" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="234.8385432745096" y="177.22820238578848" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">28°</text><text x="273.80182922189033" y="184.67341626108413" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50°−θ</text><text x="127.06631325809434" y="366.73527353107534" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ+12°</text><text x="151.13917145488375" y="387.83004617774645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50°−θ</text><text x="332.306042420412" y="391.0563055237079" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En D las dos partes suman 62°. Como</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠DRH=28°, RH forma un ángulo recto con</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DO.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las inclinaciones de DH respecto de DO</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y de RO respecto de RH son iguales.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así DH⊥RO. H es la intersección de dos</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alturas.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la tercera altura, OH⊥DR. El</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo entre OH y OD es el complemento</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 62°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>