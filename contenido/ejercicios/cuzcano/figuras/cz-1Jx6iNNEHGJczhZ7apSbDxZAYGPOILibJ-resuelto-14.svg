38.82,244.06 135.41,243.71 131.98,243.39 128.55,243.10 125.11,242.84 121.67,242.62 118.21,242.44 114.76,242.28 111.30,242.16 107.83,242.08 104.37,242.03 100.90,242.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,169.89 375.10,369.11" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="100.90322580645162" cy="169.89336309603925" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="161.89336309603925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="375.09677419354836" cy="369.10663690396075" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="361.10663690396075" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N</text><circle cx="272.2741935483871" cy="294.4016592259902" r="3.7" fill="#20364b"/><text x="279.2741935483871" y="286.4016592259902" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="186.58870967741936" cy="232.14751116101476" r="3.7" fill="#20364b"/><text x="193.58870967741936" y="224.14751116101476" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">b</text><circle cx="323.68548387096774" cy="331.7541480649755" r="3.7" fill="#20364b"/><text x="330.68548387096774" y="323.7541480649755" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Parametriza N=((a+b)cos t,0) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M=(0,(a+b)sen t). Así se mantiene</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MN=a+b.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P divide el segmento con fracción</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MP/MN=b/(a+b) desde M. Sus coordenadas</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son x=b cos t e y=a sen t.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Eleva al cuadrado y suma</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x²/b²+y²/a²=cos²t+sen²t=1. Si se</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">restringen M y N a los semiejes</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivos, se recorre el arco del</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primer cuadrante.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>