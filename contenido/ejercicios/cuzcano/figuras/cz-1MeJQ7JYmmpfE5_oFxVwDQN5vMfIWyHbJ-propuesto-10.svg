<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Trabajo tangencial cuasiestático</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="379.1774193548387" x2="421" y2="379.1774193548387" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="100.90,379.18 155.74,368.21 210.58,324.34 265.42,225.63 320.26,170.79 375.10,159.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">recorrido</text><circle cx="100.9032258064516" cy="379.1774193548387" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="371.1774193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="375.0967741935484" cy="159.82258064516128" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="151.82258064516128" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B: a,b</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al tender la rapidez a cero, N≈mg</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosθ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Trabajo de fricción disipado=∫μmg cosθ</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ds=μmg∫dx=μmga.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El trabajo aplicado suma subida</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">potencial mgb: W=mg(μa+b).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>