<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">068 · Área por una rotación de un lado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="283.70,360.90 192.30,178.10 192.30,360.90" fill="#f4c581" fill-opacity="0.45"/><polyline points="192.30,360.90 375.10,360.90 283.70,269.50 192.30,360.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="192.30,360.90 283.70,269.50 192.30,178.10 100.90,269.50 192.30,360.90" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="283.70,269.50 283.70,360.90" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="283.70,360.90 192.30,178.10" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="192.30107526881721" y="360.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="360.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="283.6989247311828" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="283.6989247311828" y="360.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="192.30107526881721" y="178.10215053763443" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="100.90322580645164" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon A=(0,0), H=(u,0), C=(u,v) con u,v</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivos.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al rotar AC 90° hacia el exterior de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ABC se obtiene CD=(−v,u). Así</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(u−v,v+u).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La base AH mide u y la altura hasta D</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es u+v. Usa el producto dado.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>