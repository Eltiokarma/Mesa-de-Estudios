47 372.74,298.02 374.05,291.45 374.83,284.80 375.10,278.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="208.83,251.12 370.72,305.08" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="100.9032258064516" cy="305.08485962517796" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="297.08485962517796" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="198.03664482948517" cy="175.57363426113318" r="3.7" fill="#20364b"/><text x="205.03664482948517" y="167.57363426113318" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="370.71827864821154" cy="305.08485962517796" r="3.7" fill="#20364b"/><text x="377.71827864821154" y="297.08485962517796" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="208.82924694315557" cy="251.12184905682597" r="3.7" fill="#20364b"/><text x="215.82924694315557" y="243.12184905682597" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La perpendicular a OA por A corta X en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B(25,0). Las longitudes OA, AB y OB</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son 15, 20 y 25.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Promedia los vértices con pesos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">20,25,15 correspondientes a sus lados</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuestos. Resulta I=(10,5).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio de IB es (35/2,5/2).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa IB²/4=125/2 como radio al</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrado.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>