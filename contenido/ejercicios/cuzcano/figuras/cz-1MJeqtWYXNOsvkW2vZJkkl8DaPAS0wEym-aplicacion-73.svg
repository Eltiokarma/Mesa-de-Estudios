<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">073 · Dos ladrillos al borde de una mesa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="140.07,234.25 296.76,234.25 296.76,273.42 140.07,273.42 140.07,234.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="218.41,195.08 375.10,195.08 375.10,234.25 218.41,234.25 218.41,195.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,273.42 257.59,273.42 257.59,343.92" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="257.59,323.16 375.10,323.16" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,234.25 375.10,328.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="316.3410138248848" y="330.99769585253455" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">d</text><text x="218.4147465437788" y="253.44009216589862" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="296.7557603686636" y="214.6612903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="166.31797235023043" y="283.2096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Mesa</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro del ladrillo superior debe</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">estar sobre el inferior. Su extremo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puede sobresalir como máximo L/2</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto del extremo inferior.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En esa posición, los centros de los</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ladrillos distan L/2. Su centro</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conjunto queda en el punto medio, a</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">L/4 a la izquierda del extremo del</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ladrillo inferior.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al llevar ese centro conjunto hasta el</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">borde de la mesa, el ladrillo de abajo</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobresale L/4 y el de arriba suma</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">otros L/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>