<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Radio de un sector desde un triángulo de proyección</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,378.99 210.08,378.99 210.08,160.01" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,378.99 375.10,378.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,378.99 210.08,160.01" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="210.08,160.01 210.08,378.99" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,378.99 210.08,160.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="210.08,160.01 207.56,161.93 205.06,163.88 202.59,165.86 200.13,167.87 197.71,169.91 195.30,171.98 192.92,174.07 190.56,176.19 188.23,178.34 185.92,180.51 183.64,182.71 181.38,184.94 179.15,187.19 176.95,189.47 174.77,191.77 172.62,194.10 170.49,196.45 168.40,198.83 166.33,201.23 164.29,203.66 162.27,206.11 160.29,208.58 158.33,211.08 156.40,213.59 154.51,216.13 152.64,218.70 150.80,221.28 148.99,223.88 147.21,226.51 145.47,229.15 143.75,231.82 142.06,234.50 140.41,237.21 138.78,239.93 137.19,242.67 135.63,245.43 134.10,248.21 132.61,251.00 131.14,253.82 129.71,256.65 128.31,259.49 126.95,262.35 125.62,265.23 124.32,268.12 123.05,271.03 121.82,273.95 120.62,276.89 119.46,279.84 118.33,282.80 117.24,285.77 116.17,288.76 115.15,291.76 114.16,294.77 113.20,297.79 112.28,300.83 111.39,303.87 110.54,306.93 109.73,309.99 108.95,313.06 108.20,316.15 107.49,319.24 106.82,322.33 106.18,325.44 105.58,328.55 105.02,331.67 104.49,334.80 104.00,337.93 103.54,341.07 103.12,344.21 102.73,347.36 102.39,350.51 102.08,353.66 101.80,356.82 101.56,359.98 101.36,363.15 101.20,366.31 101.07,369.48 100.98,372.65 100.92,375.82 100.90,378.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="375.0967741935484" y="378.99035218390304" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="100.90322580645162" y="378.99035218390304" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="210.08297752282544" y="160.00964781609696" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="210.08297752282544" y="378.99035218390304" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si r=RD, entonces OU=r sin53° y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DU=r(1−cos53°).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De DU·OU/2=16, despeja</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r²=32/[sin53°(1−cos53°)].</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica r² por 53π/360. La clave</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproxima seno y coseno con el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo 3–4–5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>