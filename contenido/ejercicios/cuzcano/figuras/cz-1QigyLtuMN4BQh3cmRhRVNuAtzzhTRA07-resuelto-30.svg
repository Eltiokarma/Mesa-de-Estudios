 318.41,359.31 324.09,353.25 329.37,346.82 334.21,340.07 338.60,333.01 342.51,325.68 345.95,318.11 348.87,310.33 351.29,302.37 353.17,294.28 354.53,286.08 355.34,277.81 355.61,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="179.99064395664993" y="386.84760191171586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="277.2045804042332" y="289.6336654641326" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="374.4185168518165" y="386.84760191171586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="277.2045804042332" y="386.84760191171586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="345.9452140921574" y="220.89303177620837" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="228.59761218044156" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="317.7329371691211" y="249.1053086992447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">22.5°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se cumple AH=BH=BC/√2. En el isósceles</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BHP, ∠HBP=135° por la prolongación de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus ángulos en H y P valen 22.5°. En</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el círculo de AHP, la cuerda AH</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">subtiende 45° y equivale al lado de un</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">octógono inscrito.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la fórmula de la cuerda, R=AH/(2</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 22.5°). Simplifica.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>