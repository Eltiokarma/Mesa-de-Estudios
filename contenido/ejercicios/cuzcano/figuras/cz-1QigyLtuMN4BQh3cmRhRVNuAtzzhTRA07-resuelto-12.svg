<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">012 · Longitud mediante la ley de senos y un ángulo de 54°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="155.19,269.50 247.47,142.48 320.81,269.50 155.19,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="155.19,269.50 247.47,396.52 320.81,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="247.47,142.48 247.47,269.50 247.47,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="155.19229211362483" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="247.47491159817673" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="320.80770788637517" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="247.47491159817673" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="181.4791452594085" y="259.52912466884067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">54°</text><text x="302.6788436479037" y="259.98234627480247" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El tercer ángulo es 180°−66°−54°=60°.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la ley de senos, AB=BC·sen 60°/sen</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">54°. Usa sen 60°=√3/2 y sen 54°=cos</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">36°=(1+√5)/4.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye y cancela el factor √5+1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>