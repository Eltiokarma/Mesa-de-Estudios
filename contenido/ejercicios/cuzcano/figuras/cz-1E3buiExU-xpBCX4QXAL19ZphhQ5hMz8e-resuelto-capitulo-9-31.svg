<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Pérdida de agua de cristalización</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,334.62 375.10,334.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="169.45,334.62 183.16,310.63 214.01,297.60 238.00,301.72 259.94,294.86 291.47,311.31 306.55,334.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="175.62,300.35 142.03,197.52 133.12,211.92" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,300.35 238.00,197.52 229.09,211.92" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="300.38,300.35 333.97,197.52 325.06,211.92" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="142.03225806451616" y="173.5322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H₂O</text><text x="238.0" y="173.5322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H₂O</text><text x="333.9677419354839" y="173.5322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H₂O</text><text x="238.0" y="365.46774193548384" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hidrato</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto en CuSO₄·5H₂O indica agua en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la estructura cristalina.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuando un hidrato pierde parte de esa</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agua al ambiente, puede formar un</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hidrato inferior. Si la pierde toda,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda CuSO₄ anhidro.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El esquema distingue esa pérdida de</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agua del proceso inverso, la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">incorporación de agua al cristal.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>