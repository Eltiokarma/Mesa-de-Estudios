206.25,354.18" fill="none" stroke="#b0467a" stroke-width="2.5"/><circle cx="206.2459677419355" cy="354.1774193548387" r="3.7" fill="#20364b"/><text x="213.2459677419355" y="346.1774193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="206.2459677419355" cy="333.008064516129" r="3.7" fill="#20364b"/><text x="213.2459677419355" y="325.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="248.58467741935485" cy="333.008064516129" r="3.7" fill="#20364b"/><text x="255.58467741935485" y="325.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="248.58467741935485" cy="354.1774193548387" r="3.7" fill="#20364b"/><text x="255.58467741935485" y="346.1774193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="227.41532258064515" cy="333.008064516129" r="3.7" fill="#20364b"/><text x="234.41532258064515" y="325.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">V</text><circle cx="227.41532258064515" cy="311.8387096774194" r="3.7" fill="#20364b"/><text x="234.41532258064515" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F</text><circle cx="329.630009697248" cy="209.62402256081648" r="3.7" fill="#20364b"/><text x="336.630009697248" y="201.62402256081648" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">J</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rectángulo tiene área 2. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo de base OA=2 tiene altura 2,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que F=(1,2).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con p=1, la parábola cumple</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(x−1)²=4(y−1). La recta TF es y=x+1.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye para obtener x²−6x+1=0.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elige la raíz mayor y suma 1 para</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtener y.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>