<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Oro puro añadido a dos lingotes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,301.06 108.87,248.46 143.95,248.46 151.92,301.06 100.90,301.06" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="171.05,301.06 179.02,248.46 214.09,248.46 222.06,301.06 171.05,301.06" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="241.19,301.06 249.16,248.46 284.23,248.46 292.20,301.06 241.19,301.06" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="324.08,301.06 332.05,248.46 367.13,248.46 375.10,301.06 324.08,301.06" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="297.94,273.33 317.39,273.33 310.69,268.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="317.39,273.33 310.69,277.79" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="126.40960240060014" y="237.9358589647412" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Primer lingote</text><text x="126.40960240060014" y="275.87659414853715" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15 kg</text><text x="126.40960240060014" y="289.58627156789197" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,950</text><text x="196.55213803450863" y="237.9358589647412" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Segundo lingote</text><text x="196.55213803450863" y="275.87659414853715" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8 kg</text><text x="196.55213803450863" y="289.58627156789197" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,800</text><text x="266.69467366841707" y="237.9358589647412" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Oro puro</text><text x="266.69467366841707" y="275.87659414853715" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 kg</text><text x="266.69467366841707" y="289.58627156789197" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1,000</text><text x="349.5903975993998" y="237.9358589647412" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Mezcla</text><text x="349.5903975993998" y="275.87659414853715" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">25 kg</text><text x="349.5903975993998" y="289.58627156789197" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,906</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos lingotes pesan juntos 25 − 2 =</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">23 kg. Contienen 25 × 0,906 − 2 =</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">20,65 kg de oro.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si x es la primera masa, 0,950x +</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,800(23 − x) = 20,65.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja x = 15 kg y resta esta masa de</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">23 kg para obtener la segunda.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>