<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Altura en un triángulo rectángulo isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="194.01,184.58 364.87,184.58 364.87,355.44 194.01,355.44 194.01,184.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="112.16,245.97 194.01,184.58 255.39,266.43 173.54,327.82 112.16,245.97 283.02,245.97 364.87,184.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="173.54,327.82 364.87,355.44" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="283.02,245.97 269.20,341.63" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="270.33,333.96 277.90,335.18 276.88,342.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="185.82137698603754" y="171.2814155031295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="375.0967741935484" y="170.25830524795373" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="375.0967741935484" y="367.7185844968705" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="181.72893596533459" y="368.74169475204627" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="100.90322580645159" y="245.9684641309581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="166.3822821376986" y="342.14082811747716" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="249.25421280693308" y="278.7079922965816" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="275.8550794415022" y="234.71425132402504" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="295.2941742898412" y="283.82354357246027" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="314.7332691381801" y="212.20582571015888" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ML=8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El paralelogramo da OL∥DI y el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrado da DI∥EM, así que O está en</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la recta EML. Como OL=DI=EM, se</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene EO=EM+ML−OL=8.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con I como origen, escribe L=(s,0) y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(−u,−v). Los cuadrados y el</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelogramo dan M=(v,−u), O=(s−u,−v)</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y A=(s,−s). Entonces OA=(u,v−s) es un</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">giro de 90° de ML=(s−v,u).</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como E, O y L están alineados, EOA es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulo isósceles con catetos 8. Su</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura a EA es (8·8)/(8√2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>