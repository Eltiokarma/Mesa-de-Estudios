<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">351 · Rotación de una región triangular</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="351.758064516129" x2="421" y2="351.758064516129" stroke="#20364b" stroke-width="1.7"/><line x1="210.58064516129033" y1="105" x2="210.58064516129033" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">Re</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Im</text><polygon points="210.58,351.76 210.58,187.24 100.90,351.76 210.58,351.76" fill="#f4c581" fill-opacity="0.45"/><polyline points="210.58,351.76 375.10,351.76 210.58,242.08 210.58,351.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">A original</text><polyline points="210.58,351.76 210.58,187.24 100.90,351.76 210.58,351.76" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">B rotado</text><circle cx="375.0967741935484" cy="351.758064516129" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="343.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a</text><circle cx="210.58064516129033" cy="242.08064516129033" r="3.7" fill="#20364b"/><text x="217.58064516129033" y="234.08064516129033" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">bi</text><circle cx="210.58064516129033" cy="187.24193548387098" r="3.7" fill="#20364b"/><text x="217.58064516129033" y="179.24193548387098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">ai</text><circle cx="100.9032258064516" cy="351.758064516129" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="343.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">−b</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El factor exp(iπ/2)=i rota cada punto</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un cuarto de vuelta en sentido</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">antihorario y conserva las distancias.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si los cortes positivos son a y bi,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entonces los vértices 0, a, bi pasan a</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0, ai, −b.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La región se convierte en el triángulo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cerrado del segundo cuadrante entre el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">eje real negativo y el imaginario</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>