<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">013 · Expansión isobárica desde el calor</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">V/V₁</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">P/P₁</text><polyline points="210.58,142.48 213.32,142.48 216.06,142.48 218.81,142.48 221.55,142.48 224.29,142.48 227.03,142.48 229.77,142.48 232.52,142.48 235.26,142.48 238.00,142.48 240.74,142.48 243.48,142.48 246.23,142.48 248.97,142.48 251.71,142.48 254.45,142.48 257.19,142.48 259.94,142.48 262.68,142.48 265.42,142.48 268.16,142.48 270.90,142.48 273.65,142.48 276.39,142.48 279.13,142.48 281.87,142.48 284.61,142.48 287.35,142.48 290.10,142.48 292.84,142.48 295.58,142.48 298.32,142.48 301.06,142.48 303.81,142.48 306.55,142.48 309.29,142.48 312.03,142.48 314.77,142.48 317.52,142.48 320.26,142.48 323.00,142.48 325.74,142.48 328.48,142.48 331.23,142.48 333.97,142.48 336.71,142.48 339.45,142.48 342.19,142.48 344.94,142.48 347.68,142.48 350.42,142.48 353.16,142.48 355.90,142.48 358.65,142.48 361.39,142.48 364.13,142.48 366.87,142.48 369.61,142.48 372.35,142.48 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">proceso</text><line x1="375.0967741935484" y1="142.48387096774195" x2="365.9658847904253" y2="146.56147549833764" stroke="#1766b0" stroke-width="2"/><line x1="375.0967741935484" y1="142.48387096774195" x2="365.9658847904253" y2="138.40626643714626" stroke="#1766b0" stroke-width="2"/><circle cx="210.58064516129033" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="217.58064516129033" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">400 K</text><circle cx="375.0967741935484" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1000 K</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Mayer, Cp=Cv+R=30 J/(mol·K). En el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proceso isobárico Q=nCp(Tf−Ti).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ΔT=9000/(0,5·30)=600 K y Tf=1000 K.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como V/T es constante,</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">X=Tf/Ti=1000/400=2,5. El incremento de</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">volumen es 1,5Vi, distinto del volumen</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">final 2,5Vi.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>