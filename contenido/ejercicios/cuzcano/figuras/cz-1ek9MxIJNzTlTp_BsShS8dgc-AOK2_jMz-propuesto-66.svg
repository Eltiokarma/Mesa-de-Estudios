<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">066 · Intersección con la recta y = 1</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="375.09677419354836" y1="105" x2="375.09677419354836" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,369.76 104.24,369.41 107.58,369.05 110.91,368.67 114.25,368.29 117.58,367.90 120.92,367.49 124.26,367.08 127.59,366.65 130.93,366.21 134.26,365.75 137.60,365.28 140.94,364.79 144.27,364.29 147.61,363.77 150.94,363.23 154.28,362.68 157.62,362.10 160.95,361.50 164.29,360.88 167.62,360.24 170.96,359.57 174.30,358.88 177.63,358.16 180.97,357.41 184.30,356.62 187.64,355.80 190.98,354.95 194.31,354.05 197.65,353.12 200.98,352.13 204.32,351.10 207.66,350.02 210.99,348.88 214.33,347.67 217.66,346.40 221.00,345.05 224.34,343.61 227.67,342.09 231.01,340.47 234.34,338.73 237.68,336.87 241.02,334.87 244.35,332.71 247.69,330.38 251.02,327.83 254.36,325.05 257.70,321.99 261.03,318.60 264.37,314.83 267.70,310.59 271.04,305.78 274.38,300.26 277.71,293.83 281.05,286.20 284.38,276.96 287.72,265.42 291.06,250.42 294.39,229.75 297.73,198.51 301.06,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Rama izquierda</text><polyline points="100.90,292.89 375.10,292.89" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">y = 1</text><polyline points="278.15,292.89 375.10,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">OP</text><circle cx="278.15471548248945" cy="292.89089375601753" r="3.7" fill="#20364b"/><text x="285.15471548248945" y="284.89089375601753" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Intersección</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con u = arcsec x, cos u = 1/x y sen u</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= √(x²−1)/abs(x) para abs(x) &gt; 1.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La expresión es x(sen²u−1)/sen u =</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−sgn(x)/√(x²−1). Al igualarla a 1</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resulta x = −√2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente del radio que pasa por</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−√2, 1) vale −1/√2. Aplica el arco</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">seno principal.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>