<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">009 · Ángulo exterior determinado por tres longitudes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,324.34 266.61,324.34 375.10,324.34 100.90,324.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,324.34 266.61,252.02 375.10,324.34" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="266.61,252.02 266.61,324.34" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,324.34 171.40,214.66 266.61,252.02" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="324.33870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="266.613762845769" y="252.0167021122331" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="324.33870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="266.613762845769" y="324.33870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="171.4007450039676" y="214.66129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="278.54689409402476" y="315.29845873177106" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="351.5921217348628" y="317.10650892090075" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">∠HCB</text><text x="113.55957713035919" y="301.9188873322116" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">∠BAE</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Descompón AE en los ejes paralelo y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a AB. Por AE=BC y la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igualdad de ángulos, sus proyecciones</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son HC en dirección AB y BH hacia el</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como AB=BH+HC, la proyección de BE en</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dirección BA mide AB−HC=BH. Su</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente perpendicular también mide</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BH.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Estas componentes forman un triángulo</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulo isósceles. El ángulo entre</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BA y BE vale 45°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>