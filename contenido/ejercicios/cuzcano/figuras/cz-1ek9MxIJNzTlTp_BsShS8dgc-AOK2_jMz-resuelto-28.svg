<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Arco coseno con cúspide central</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 105.47,354.64 110.04,337.13 114.61,323.58 119.18,312.05 123.75,301.80 128.32,292.45 132.89,283.77 137.46,275.62 142.03,267.88 146.60,260.50 151.17,253.40 155.74,246.55 160.31,239.91 164.88,233.46 169.45,227.16 174.02,221.00 178.59,214.97 183.16,209.04 187.73,203.20 192.30,197.44 196.87,191.76 201.44,186.14 206.01,180.57 210.58,175.05 215.15,169.56 219.72,164.11 224.29,158.68 228.86,153.27 233.43,147.88 238.00,142.48 242.57,147.88 247.14,153.27 251.71,158.68 256.28,164.11 260.85,169.56 265.42,175.05 269.99,180.57 274.56,186.14 279.13,191.76 283.70,197.44 288.27,203.20 292.84,209.04 297.41,214.97 301.98,221.00 306.55,227.16 311.12,233.46 315.69,239.91 320.26,246.55 324.83,253.40 329.40,260.50 333.97,267.88 338.54,275.62 343.11,283.77 347.68,292.45 352.25,301.80 356.82,312.05 361.39,323.58 365.96,337.13 370.53,354.64 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">f(x)</text><circle cx="237.99999999999997" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,π)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe el argumento como 2(x−1)²−1.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La condición de arccos equivale a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∣x−1∣≤1, de modo que x∈[0,2].</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al poner t=∣x−1∣, la identidad cos(2</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arccos t)=2t²−1 y 2 arccos t∈[0,π] dan</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f(x)=2 arccos∣x−1∣.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La curva sube de (0,0) a (1,π) y baja</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simétricamente a (2,0). Los tramos son</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cóncavos hacia abajo y se encuentran</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en punta.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>