<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">064 · Giro de tres partes de un rombo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="169.57,385.85 169.57,227.82 306.43,148.81 306.43,306.83 238.00,267.33" fill="#f4c581" fill-opacity="0.45"/><polyline points="169.57,385.85 169.57,227.82 306.43,148.81 306.43,306.83 169.57,385.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="169.57,385.85 306.43,148.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="169.57,227.82 306.43,306.83" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="145.87,385.85 330.13,385.85" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="306.43,385.85 306.43,306.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="169.57126318364067" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="161.66979325939445" y="221.4985702102042" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="312.354839259544" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="314.3302067406056" y="306.83444539206346" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="306.42873681635933" y="395.72598203983347" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="245.90146992424621" y="272.4630512215923" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">J</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con D=(0,0), I=(0,4), O=(b,2) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">L=(b,6), el lado DO=4 da b=2√3. El</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rombo tiene área 4b y baricentro J a</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura 3.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo sin sombrear DJO ocupa un</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuarto del rombo y su baricentro está</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a altura (0+3+2)/3=5/3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pappus, resta 2π·b·5/3 de 2π·4b·3</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y sustituye b=2√3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>