<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Igualdad de sumas en un cruce doble</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,182.35 375.10,203.89 226.25,346.86 100.90,182.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,346.86 375.10,346.86 245.83,193.71 100.90,346.86" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="226.25,346.86 247.79,374.28" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="245.83,193.71 271.29,164.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="122.44700460829492" y="191.74654377880182" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="350.02764976958525" y="214.46543778801842" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="122.44700460829492" y="338.24423963133637" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="354.7281105990784" y="337.46082949308754" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="261.50230414746545" y="185.47926267281105" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="263.46082949308754" y="205.84792626728105" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="248.184331797235" y="339.41935483870964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="248.96774193548384" y="357.43778801843314" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En un cuadrilátero, la suma de los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos interiores de una pareja de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértices coincide con la suma de los</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exteriores de la otra pareja.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica la identidad en los dos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadriláteros que usan los cruces con</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arcos dobles. Se obtiene a+b=α+β y</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x+y=α+β.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye ambas sumas en el cociente.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>