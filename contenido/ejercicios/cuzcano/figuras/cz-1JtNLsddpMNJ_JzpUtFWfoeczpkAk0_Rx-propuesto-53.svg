<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">053 · Altura de llenado para un láser</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,172.59 100.90,352.88 341.29,352.88 341.29,172.59" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,262.74 341.29,262.74" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="341.29,172.59 221.10,262.74 153.49,352.88" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="221.10,262.74 100.90,352.88" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="342.79452054794524" y="159.82258064516128" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="100.90322580645162" y="367.1579761378701" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="153.48828988068936" y="367.1579761378701" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="223.35130357931948" y="379.1774193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">32 cm</text><text x="375.0967741935484" y="257.4805567830314" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">24 cm</text><text x="134.70790985417585" y="253.7244807777287" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto de la vertical, la dirección</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en aire tiene tan i = 32/24 = 4/3 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen i = 4/5.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En agua sen r = (3/4)(4/5) = 3/5 y tan</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r = 3/4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para altura h, el impacto cambia en</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h(tan i − tan r). Igualar a 7 da h =</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">12 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>