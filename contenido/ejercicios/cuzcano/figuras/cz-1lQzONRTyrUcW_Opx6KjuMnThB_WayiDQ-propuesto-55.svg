<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">055 · Distancia desde un punto elevado a la cuerda de contactos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,360.90 192.30,360.90 142.03,329.82" fill="#f4c581" fill-opacity="0.45"/><polyline points="375.10,360.90 100.90,360.90 265.42,236.60 375.10,360.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="192.30,360.90 142.03,329.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,360.90 100.90,178.10" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,360.90 167.17,345.36 100.90,178.10" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="324.83,329.82 328.06,327.11 330.58,324.43 332.36,321.78 333.38,319.19 333.65,316.69 333.15,314.28 331.89,312.00 329.88,309.85 327.14,307.85 323.69,306.02 319.54,304.37 314.75,302.91 309.33,301.66 303.34,300.62 296.81,299.81 289.81,299.22 282.37,298.87 274.56,298.75 266.44,298.87 258.06,299.22 249.50,299.81 240.82,300.62 232.08,301.66 223.35,302.91 214.70,304.37 206.19,306.02 197.88,307.85 189.85,309.85 182.15,312.00 174.84,314.28 167.98,316.69 161.61,319.19 155.79,321.78 150.56,324.43 145.96,327.11 142.03,329.82 138.80,332.53 136.28,335.22 134.50,337.87 133.48,340.45 133.21,342.96 133.71,345.36 134.97,347.65 136.98,349.80 139.72,351.80 143.17,353.63 147.32,355.28 152.11,356.73 157.53,357.99 163.52,359.02 170.05,359.84 177.05,360.43 184.49,360.78 192.30,360.90 200.42,360.78 208.80,360.43 217.36,359.84 226.04,359.02 234.78,357.99 243.51,356.73 252.16,355.28 260.67,353.63 268.98,351.80 277.01,349.80 284.71,347.65 292.02,345.36 298.88,342.96 305.25,340.45 311.07,337.87 316.30,335.22 320.90,332.53 324.83,329.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="375.09677419354836" y="360.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="360.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="265.41935483870964" y="236.5967741935484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="100.90322580645162" y="178.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="192.3010752688172" y="360.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="142.03225806451613" y="329.8225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="167.16666666666663" y="345.36021505376345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC=5, así que el inradio es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(3+4−5)/2=1. Los puntos de tangencia</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">están a 1 de B sobre catetos</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio H de MN es la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección de B en MN. Como el</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo BMN es recto isósceles,</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BH=1/√2.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PH también es perpendicular a MN y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PH²=BP²+BH²=4+1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>