<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Diferencia de descuentos entre dos fechas futuras</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.20 375.10,269.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,268.74 100.90,269.65" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="192.30,268.74 192.30,269.65" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,268.74 238.00,269.65" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,268.74 375.10,269.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="270.2616487455197" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hoy</text><text x="192.30107526881721" y="270.2616487455197" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Día 30</text><text x="237.99999999999997" y="270.2616487455197" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Día 45</text><text x="375.0967741935484" y="270.2616487455197" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vence</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los descuentos de las dos fechas</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">difieren en 15 días de descuento. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tasa diaria aplicada al nominal da S/</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">90/15 = S/ 6 por día.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El descuento actual de 90 días</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">asciende a S/ 540.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma al valor actual ese descuento.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>