h="2.5"/><polyline points="375.10,307.72 222.92,386.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="235.77,385.15 222.92,386.26 231.27,376.43" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="317.24263674614303" y="368.7286115007013" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">r</text><text x="347.3969144460028" y="227.07363253856943" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B₀</text><text x="208.54698457223003" y="382.05259467040673" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">semiángulo θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo del campo con la normal</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia abajo de la base es 90°−θ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El flujo por la base vale +B₀πr²</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos(90°−θ)=+B₀πr² sen θ.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La base y la superficie lateral forman</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una superficie cerrada de flujo neto</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cero. El flujo lateral toma el signo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuesto.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>