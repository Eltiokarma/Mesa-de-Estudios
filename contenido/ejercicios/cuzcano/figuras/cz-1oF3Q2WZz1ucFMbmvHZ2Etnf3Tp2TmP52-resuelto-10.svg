<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Distancia con media geométrica y recíprocos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,293.83 375.10,293.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,290.43 107.18,297.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,290.43 238.00,297.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="292.19,290.43 292.19,297.23" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.82,290.43 368.82,297.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="292.19,267.67 368.82,267.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="292.19,264.53 292.19,270.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="368.82,264.53 368.82,270.81" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="107.18,241.51 368.82,241.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,238.37 107.18,244.64" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="368.82,238.37 368.82,244.64" fill="none" stroke="#008674" stroke-width="2.5"/><text x="107.18246737256834" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.0" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="292.186396210467" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="368.81753262743166" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="330.5019644189494" y="259.2962324550603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="238.0" y="233.132725929574" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 AB</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si AB=a, entonces AD=2a, AC=√2·a y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC=(√2−1)a.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye en los recíprocos. Como</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/(√2−1)=√2+1, se obtiene</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(2+√2)/a=1/4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto CD=AD−AC=(2−√2)·4(2+√2)=8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>