<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">061 · Rombo con dos trazos perpendiculares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.70,266.70 240.80,231.73 370.90,266.70 240.80,301.68 110.70,266.70" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.70,266.70 370.90,266.70" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="180.22,266.70 240.80,301.68 275.77,241.10" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="240.80,231.73 240.80,301.68" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="273.6968400263331" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="238.0" y="223.33475971033576" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="375.09677419354836" y="270.89894667544434" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="236.60105332455564" y="315.66524028966427" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="176.44634628044767" y="259.7073732718894" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="279.9684002633311" y="235.9252797893351" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="268.7768268597762" y="261.10631994733376" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea θ el ángulo entre DA y un lado del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rombo en D. Como DC=CR, el ángulo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior de DCR en C vale 2θ. Al ser</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CR⊥RL, x+2θ=90°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea M el cruce de las diagonales. Como</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ER⊥DA, ∠REL=90°−θ=x+θ. El ángulo</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior de OLA en L, con O=RL∩DA,</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también mide x+θ y es ∠ELR. Luego</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">RL=ER.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si MR=k, entonces ER=2k y CR=RL=2k. En</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el triángulo rectángulo CMR, ∠CRM=x y</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos x=k/(2k)=1/2. Así x=60°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>