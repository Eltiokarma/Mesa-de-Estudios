<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">099 · Vértice agudo entre dos transversales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,230.81 375.10,230.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,322.21 375.10,322.21" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="155.74,169.88 308.07,273.46 116.14,367.91 155.74,169.88" fill="none" stroke="#008674" stroke-width="2.5"/><text x="155.74193548387098" y="161.34587813620067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="318.12544802867376" y="273.4605734767025" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="112.78494623655916" y="377.6541218637992" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="226.11827956989245" y="222.27777777777774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2x</text><text x="224.29032258064512" y="313.0663082437276" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5x</text><text x="365.95698924731175" y="222.27777777777774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="365.95698924731175" y="313.9802867383512" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por paralelismo, al transportar ambas</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">marcas hasta R se obtiene</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠DRO=2x+5x=7x.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠DRO es agudo, x&lt;90°/7. El mayor</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entero candidato es 12°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con x=12°, ∠DRO=84°. Se pueden tomar</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los dos lados de igual longitud y los</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos de la base miden 48°, ambos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agudos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>