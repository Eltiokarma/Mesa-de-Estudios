580645161293" y="276.0228233195098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,0)</text><circle cx="238.0" cy="254.9771766804902" r="3.7" fill="#20364b"/><text x="245.0" y="246.9771766804902" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,1)</text><circle cx="203.72580645161293" cy="254.9771766804902" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="210.72580645161293" y="246.9771766804902" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="272.2741935483871" cy="284.0228233195098" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="279.2741935483871" y="276.0228233195098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuando x&lt;0, ⌊1/x⌋ es negativo y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f(x)=1+√[x(x−2)]. Este tramo es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inyectivo y recorre (1,∞).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si x&gt;2, ⌊1/x⌋=0 y f(x)=−√[x(x−2)]. Es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inyectivo y recorre (−∞,0).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El tramo de x≥0 debe recorrer [0,1].</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su fórmula es (x−1)³+1, estrictamente</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">creciente, que da 0 en 0 y 1 en 1.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cualquier a&gt;1 repetiría imágenes</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mayores que 1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>