<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">043 · Triángulo de 22°30′</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,294.81 161.17,294.81 161.17,269.85 100.90,294.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="157.42,294.81 157.42,291.07 161.17,291.07" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="221.43,294.81 366.91,294.81 366.91,234.55 221.43,294.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="357.87,294.81 357.87,285.77 366.91,285.77" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="118.37929812123363" y="291.79705778092875" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">22°30′</text><text x="131.6370081531372" y="304.45214462956403" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="172.61538461538464" y="282.1550868486352" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">√2−1</text><text x="254.5721375398795" y="289.9891882311237" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">22°30′</text><text x="290.7295285359802" y="304.45214462956403" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">√2+1</text><text x="375.0967741935484" y="262.8711449840482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide 45° entre dos. Usa tan(x/2)=sen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x/(1+cos x) para x=45°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esto da 1/(√2+1)=√2−1. Con cateto</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">adyacente 1, el opuesto mide √2−1.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Invierte el cociente para obtener la</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cotangente. Si el cateto opuesto es 1,</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el adyacente mide √2+1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>