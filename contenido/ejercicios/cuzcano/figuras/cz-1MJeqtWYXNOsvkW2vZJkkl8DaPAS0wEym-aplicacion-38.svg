<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Tres cilindros entre dos paredes lisas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="244.92,307.71 244.28,315.79 242.39,323.66 239.29,331.15 235.06,338.06 229.79,344.22 223.63,349.48 216.73,353.71 209.24,356.81 201.36,358.70 193.28,359.34 185.21,358.70 177.33,356.81 169.84,353.71 162.94,349.48 156.78,344.22 151.51,338.06 147.28,331.15 144.18,323.66 142.29,315.79 141.65,307.71 142.29,299.63 144.18,291.75 147.28,284.27 151.51,277.36 156.78,271.20 162.94,265.94 169.84,261.70 177.33,258.60 185.21,256.71 193.28,256.08 201.36,256.71 209.24,258.60 216.73,261.70 223.63,265.94 229.79,271.20 235.06,277.36 239.29,284.27 242.39,291.75 244.28,299.63 244.92,307.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="334.35,256.08 333.71,264.15 331.82,272.03 328.72,279.52 324.49,286.42 319.22,292.59 313.06,297.85 306.16,302.08 298.67,305.18 290.79,307.07 282.72,307.71 274.64,307.07 266.76,305.18 259.27,302.08 252.37,297.85 246.21,292.59 240.94,286.42 236.71,279.52 233.61,272.03 231.72,264.15 231.08,256.08 231.72,248.00 233.61,240.12 236.71,232.63 240.94,225.73 246.21,219.57 252.37,214.30 259.27,210.07 266.76,206.97 274.64,205.08 282.72,204.44 290.79,205.08 298.67,206.97 306.16,210.07 313.06,214.30 319.22,219.57 324.49,225.73 328.72,232.63 331.82,240.12 333.71,248.00 334.35,256.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="244.92,204.44 244.28,212.52 242.39,220.40 239.29,227.88 235.06,234.79 229.79,240.95 223.63,246.21 216.73,250.45 209.24,253.55 201.36,255.44 193.28,256.08 185.21,255.44 177.33,253.55 169.84,250.45 162.94,246.21 156.78,240.95 151.51,234.79 147.28,227.88 144.18,220.40 142.29,212.52 141.65,204.44 142.29,196.37 144.18,188.49 147.28,181.00 151.51,174.09 156.78,167.93 162.94,162.67 169.84,158.44 177.33,155.34 185.21,153.45 193.28,152.81 201.36,153.45 209.24,155.34 216.73,158.44 223.63,162.67 229.79,167.93 235.06,174.09 239.29,181.00 242.39,188.49 244.28,196.37 244.92,204.44" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="141.65,142.48 141.65,359.34 334.35,359.34 334.35,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="141.65,383.09 334.35,383.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="193.2848803120741" y="307.70810385523214" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="282.7151196879259" y="256.07553107789147" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="193.2848803120741" y="204.44295830055077" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="238.0" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L = (2+√3)R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La reacción del piso sostiene todo el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sistema y vale 3P porque las paredes</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">no transmiten fuerza vertical.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los centros de dos cilindros vecinos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distan 2R. Su separación horizontal es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√3R, por lo que la vertical es R. La</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerza de contacto forma 30° con la</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el inferior, la componente</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">descendente de ese contacto debe sumar</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con el peso P para equilibrar 3P. Así</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F sen 30°=2P.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>