<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Dos medianas y una ceviana de longitud desconocida</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.48,327.82 196.34,206.63 366.76,327.07 108.48,327.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="196.34,206.63 235.73,327.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="196.34,206.63 299.35,327.07" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="142.56,277.83 235.73,327.82" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="235.73,327.82 265.27,289.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645164" y="337.6696667260738" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="197.09819996435576" y="199.05801104972377" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935483" y="331.6101407948672" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="236.48511851719837" y="339.94198895027625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="299.3527000534664" y="339.94198895027625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="134.23061842808772" y="274.8020851898058" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="271.3273926216361" y="285.4062555694172" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="181.94938513633934" y="314.18900374264837" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">MN</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Traza MQ paralela a AB hasta BP. Como</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AM=MC y MP=MC/2, los triángulos PMQ y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PAB dan PQ=BP/3 y BQ=2BP/3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al ser M punto medio de la hipotenusa,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BM=AM. Además ∠BMQ=∠ABM=∠BAM por</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelismo e isósceles.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Junto con ∠QBM=∠AMN, esto da</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">congruencia de BQM y MNA por ángulo-</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lado-ángulo. Así MN=BQ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>