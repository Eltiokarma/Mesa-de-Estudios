<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Recta a partir de un tramo quebrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="389.71772097663137" x2="421" y2="389.71772097663137" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,389.72 238.12,252.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">OT</text><polyline points="238.12,252.50 375.10,149.28" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">TI=10</text><polyline points="152.36,335.45 375.10,149.28" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Recta MI</text><circle cx="100.9032258064516" cy="389.71772097663137" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="381.71772097663137" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="169.51012129045978" cy="321.1108254926232" r="3.7" fill="#20364b"/><text x="176.51012129045978" y="313.1108254926232" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="238.11701677446797" cy="252.503930008615" r="3.7" fill="#20364b"/><text x="245.11701677446797" y="244.503930008615" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="375.0967741935484" cy="149.28227902336863" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="141.28227902336863" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T=(8,8) y el punto medio es M=(4,4).</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">TO tiene dirección 225°. TI tiene</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dirección 225°+172°≡37°. Así</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I=(8+10cos37°,8+10sen37°).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide el desplazamiento vertical de M</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a I entre el horizontal.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>