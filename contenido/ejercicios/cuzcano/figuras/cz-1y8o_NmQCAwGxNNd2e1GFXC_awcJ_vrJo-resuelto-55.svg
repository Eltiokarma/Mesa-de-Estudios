<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">055 · Distancias a una transversal de dos romboides</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="126.14,351.09 126.14,199.69 233.79,162.68 233.79,314.08 126.14,351.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="233.79,162.68 346.50,219.88 346.50,371.27 233.79,314.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,238.38 375.10,322.49" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="126.14,199.69 113.52,242.25" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="126.14,351.09 155.74,255.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="346.50,219.88 320.43,305.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="346.50,371.27 362.82,318.79" fill="none" stroke="#008674" stroke-width="2.5"/><text x="117.72491589154956" y="366.22471798931326" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="117.72491589154956" y="189.59697209578468" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="232.11240847021568" y="150.90708490005937" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="228.74807045319608" y="329.21699980209775" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="351.54640807441126" y="211.46516920641204" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="351.54640807441126" y="388.0929150999406" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="105.94973283198098" y="211.46516920641204" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="146.3217890362161" y="300.62012665743123" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">9</text><text x="321.2673659212349" y="265.2945774787255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="368.3680981595092" y="346.03868988719574" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los vectores D→I, O→L y B→A son</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iguales porque son lados opuestos de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los dos paralelogramos.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La proyección de cada vector sobre una</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal a la recta tiene la misma</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud. Como los extremos están en</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lados opuestos, para D→I vale 9+4 y</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para B→A vale x+5.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala ambas sumas: x+5=13 y x=8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>