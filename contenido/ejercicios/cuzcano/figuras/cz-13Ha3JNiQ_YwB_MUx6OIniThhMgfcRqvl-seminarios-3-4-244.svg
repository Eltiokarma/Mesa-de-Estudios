<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">244 · Masa final tras dos etapas de distinto rendimiento</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="126.66666666666667" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="111.33333333333334" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Etapa</text><rect x="174.66666666666669" y="130" width="126.66666666666667" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="238.00000000000003" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Factor</text><rect x="301.33333333333337" y="130" width="126.66666666666667" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="364.6666666666667" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Producto</text><rect x="48.0" y="178" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1</text><rect x="174.66666666666669" y="178" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,80</text><rect x="301.33333333333337" y="178" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">MgCl₂</text><rect x="48.0" y="226" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2</text><rect x="174.66666666666669" y="226" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,90</text><rect x="301.33333333333337" y="226" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Mg(OH)₂</text><rect x="48.0" y="274" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Total</text><rect x="174.66666666666669" y="274" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,72</text><rect x="301.33333333333337" y="274" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">87 g</text><text x="48" y="349" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Rendimiento por etapa</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula n(Mg)=50/24 mol. Con 80 % de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rendimiento pasan 5/3 mol de MgCl₂ a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la segunda etapa.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La segunda etapa rinde 90 %, así que</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">n[Mg(OH)₂]=(5/3)·0,90=1,50 mol.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica por M[Mg(OH)₂]=58 g/mol.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>