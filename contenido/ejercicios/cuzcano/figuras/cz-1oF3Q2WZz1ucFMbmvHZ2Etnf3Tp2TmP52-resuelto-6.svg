<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Longitud del tramo final</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,293.83 375.10,293.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,290.43 107.18,297.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="172.59,290.43 172.59,297.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="325.21,290.43 325.21,297.23" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.82,290.43 368.82,297.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,267.67 172.59,267.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="107.18,264.53 107.18,270.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="172.59,264.53 172.59,270.81" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="325.21,267.67 368.82,267.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="325.21,264.53 325.21,270.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="368.82,264.53 368.82,270.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="172.59,241.51 368.82,241.51" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="172.59,238.37 172.59,244.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="368.82,238.37 368.82,244.64" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="107.18246737256834" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="172.59123368628417" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="325.2116884182878" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="368.81753262743166" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Z</text><text x="139.88685052942625" y="259.2962324550603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n</text><text x="347.01461052285975" y="259.2962324550603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="270.70438315685794" y="233.132725929574" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3n</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a=RA y x=IZ. La distancia total RZ</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 4a, así que RI=4a−x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye para obtener</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(4a−x)/(2a)+1/(3a)=2. Los términos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">constantes se cancelan.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Queda x/(2a)=1/(3a). Multiplica por</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2a.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>