<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">051 · Área del triángulo de raíces cúbicas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="115.47,257.45 363.19,257.45" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="228.40,396.52 228.40,156.20" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="337.64,219.62 141.03,181.76 206.54,370.96 337.64,219.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="228.40,257.45 337.64,219.62" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="228.40,257.45 141.03,181.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="228.40,257.45 206.54,370.96" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="344.00,257.45 341.47,233.41 334.00,210.43 321.92,189.50 305.75,171.54 286.20,157.34 264.12,147.51 240.49,142.48 216.32,142.48 192.68,147.51 170.60,157.34 151.05,171.54 134.88,189.50 122.80,210.43 115.33,233.41 112.81,257.45 115.33,281.48 122.80,304.46 134.88,325.39 151.05,343.35 170.60,357.56 192.68,367.39 216.32,372.41 240.49,372.41 264.12,367.39 286.20,357.56 305.75,343.35 321.92,325.39 334.00,304.46 341.47,281.48 344.00,257.45" fill="none" stroke="#008674" stroke-width="2.5"/><text x="337.6356440159194" y="219.62449593296094" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="141.02993317523243" y="181.75919707871154" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="206.54047786590607" y="370.9573866229688" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="228.40201835235266" y="257.4470265448804" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="363.19438642520873" y="262.36216931589763" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="235.28321823177671" y="156.2004546694222" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El numerador y el factor i tienen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">módulo 1. El módulo de z es (π/2+1)⁻³.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las tres raíces se separan por 120° y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen radio R=1/(π/2+1). El lado del</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo equilátero es √3R.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su área es √3(√3R)²/4=3√3R²/4.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye R=2/(π+2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>