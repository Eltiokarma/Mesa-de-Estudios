3 217.38,197.18 220.15,201.81 222.92,206.22 225.68,210.44 228.45,214.48 231.22,218.35 233.98,222.05 236.75,225.60 239.52,229.02 242.28,232.29 245.05,235.45 247.82,238.48 250.59,241.40 253.35,244.22 256.12,246.93 258.89,249.55 261.65,252.08 264.42,254.52 267.19,256.89 269.95,259.17 272.72,261.38 275.49,263.53 278.25,265.60 281.02,267.61 283.79,269.56 286.56,271.45 289.32,273.29 292.09,275.07 294.86,276.81 297.62,278.49 300.39,280.13 303.16,281.72 305.92,283.27 308.69,284.78 311.46,286.25 314.22,287.68 316.99,289.07 319.76,290.43 322.53,291.75 325.29,293.04 328.06,294.30 330.83,295.53 333.59,296.74 336.36,297.91 339.13,299.05 341.89,300.17 344.66,301.27 347.43,302.33 350.19,303.38 352.96,304.40 355.73,305.40 358.50,306.38 361.26,307.34 364.03,308.28 366.80,309.20 369.56,310.09 372.33,310.98 375.10,311.84" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">T_B</text><circle cx="215.15053763440864" cy="294.9032258064516" r="3.7" fill="#20364b"/><text x="222.15053763440864" y="286.9032258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><circle cx="329.3978494623656" cy="294.9032258064516" r="3.7" fill="#20364b"/><text x="336.3978494623656" y="286.9032258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><circle cx="215.15053763440864" cy="193.29032258064512" r="3.7" fill="#20364b"/><text x="222.15053763440864" y="185.29032258064512" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><circle cx="158.02688172043014" cy="193.29032258064512" r="3.7" fill="#20364b"/><text x="165.02688172043014" y="185.29032258064512" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada par sobre una misma isoterma</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">comparte temperatura. Así T₄=T₁ y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T₂=T₃.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La vertical por 1 pasa por 3, por lo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que V₁=V₃. En ese mismo volumen, 3</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene mayor presión que 1.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La presión superior implica</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">temperatura superior a igual V. La</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">única igualdad falsa es P₁=P₃.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>