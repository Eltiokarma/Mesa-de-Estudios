<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">093 · Distancia mínima entre móviles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="197.17,142.48 197.17,287.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="197.17,369.30 306.04,369.30" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="197.17,287.65 306.04,369.30" fill="none" stroke="#008674" stroke-width="2.5"/><text x="204.1733870967742" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="204.1733870967742" y="361.2983870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="204.1733870967742" y="279.64516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A1</text><text x="313.04435483870964" y="361.2983870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B1</text><text x="176.9556451612903" y="225.20967741935485" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A baja4m/s</text><text x="226.8548387096774" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B:3m/s →</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia al cuadrado es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d²(t)=(100−4 t)²+(3 t)².</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completar cuadrados: 25(t−16)²+3600.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Mínimo en t=16 s, con distancia 60 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>