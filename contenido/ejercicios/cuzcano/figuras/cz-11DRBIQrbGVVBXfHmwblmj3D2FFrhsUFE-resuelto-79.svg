<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">079 · Ángulo con una altura perpendicular a la mediana</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.37,334.13 169.64,201.89 368.37,332.63 108.37,334.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.37,334.13 271.99,266.89" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="169.64,201.89 203.26,294.53" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="140.50,268.38 271.99,266.89" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="140.50,268.38 203.26,294.53" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645159" y="343.0914564472181" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="168.8912718642876" y="195.9085435527819" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="340.8500922914652" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="273.4882657994199" y="259.4138612991122" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="206.24734112683484" y="304.24114441416896" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="133.0294453722422" y="272.11492484837834" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="167.3970290937857" y="236.25309835633294" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3α</text><text x="131.53520260174034" y="327.40190735694824" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="245.09765315988398" y="274.3562890041311" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea M punto medio de AB y α=∠QAC. En</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ABH, la mediana hacia la hipotenusa da</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MH=MA=AB/2=HQ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABC, MQ∥AC. Luego ∠MQH=α y, en MHQ,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠MHQ=180°−2α. Como A, H y Q están</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alineados en ese orden, ∠MHA=2α.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En AMH, MA=MH, así que ∠BAH=2α. En ABH</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se cumple 2α+3α=90°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>