79.62 305.16,377.47 304.96,375.26 305.16,373.04 305.73,370.90 306.67,368.88 307.95,367.06 309.52,365.49 311.34,364.21 313.35,363.27 315.50,362.70 317.72,362.50 319.93,362.70 322.08,363.27 324.09,364.21 325.92,365.49 327.49,367.06 328.76,368.88 329.70,370.90 330.28,373.04 330.47,375.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="158.28276420569577" y="162.67890403563234" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="158.28276420569577" y="375.25819948711023" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="317.7172357943042" y="375.25819948711023" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="158.28276420569577" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I₁</text><text x="150.84248886489405" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I₂</text><text x="324.0946146578485" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I₃</text><text x="190.16965852341747" y="223.26400323930355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="262.4466189769199" y="256.2137940342826" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con el triángulo 3-4-5 del cuaderno,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las separaciones desde I₂ son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximadamente 0,80 m hacia I₁ y 0,60</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m hacia I₃.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambas fuerzas son atractivas. Aplica</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F=μ₀IᵢI₂L/(2πd): salen 600 μN hacia</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arriba y 600 μN hacia la derecha.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como las componentes son</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares, aplica Pitágoras. Con</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la aproximación, apuntan a 45° sobre</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la horizontal.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>