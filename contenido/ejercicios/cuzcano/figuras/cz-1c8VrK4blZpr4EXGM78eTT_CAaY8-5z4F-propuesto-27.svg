<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Una tabla con extremos de distinto ancho</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130.0" width="190.0" height="41.42857142857143" fill="#dfedf8" stroke="#a3b9cc"/><text x="143.0" y="156.92857142857144" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Intervalo</text><rect x="238.0" y="130.0" width="190.0" height="41.42857142857143" fill="#dfedf8" stroke="#a3b9cc"/><text x="333.0" y="156.92857142857144" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">fᵢ</text><rect x="48.0" y="171.42857142857144" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="198.3571428571429" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[0,20)</text><rect x="238.0" y="171.42857142857144" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="198.3571428571429" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3a</text><rect x="48.0" y="212.85714285714286" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="239.78571428571428" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[20,30)</text><rect x="238.0" y="212.85714285714286" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="239.78571428571428" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">5a</text><rect x="48.0" y="254.28571428571428" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[30,40)</text><rect x="238.0" y="254.28571428571428" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">7a</text><rect x="48.0" y="295.7142857142857" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[40,50)</text><rect x="238.0" y="295.7142857142857" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">7a</text><rect x="48.0" y="337.14285714285717" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[50,60)</text><rect x="238.0" y="337.14285714285717" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">5a</text><rect x="48.0" y="378.57142857142856" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[60,90)</text><rect x="238.0" y="378.57142857142856" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3a</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Frecuencias por intervalo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las frecuencias se reflejan, pero los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intervalos extremos son [0,20) y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[60,90). Sus amplitudes difieren y la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distribución agrupada sobre el eje no</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es simétrica.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La primera y la última frecuencia</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">relativa coinciden, de modo que II es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verdadera. El total es 30a, así que</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h₃=7/30=0,2333…</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma de las frecuencias relativas</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es uno. Al multiplicar por 30a se</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene la última igualdad.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>