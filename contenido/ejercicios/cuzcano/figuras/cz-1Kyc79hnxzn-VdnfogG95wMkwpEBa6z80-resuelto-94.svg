<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">094 · Tres lados visibles de una casa pentagonal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="310.73,188.28 246.35,235.05 270.94,310.72 350.51,310.72 375.10,235.05 310.73,188.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.67,255.96 229.50,255.96" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="107.90322580645157" y="237.810441103584" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">observador</text><text x="270.3459153818756" y="342.72134478771204" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">planta regular</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las normales exteriores de las paredes</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">están separadas por 72°. En la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximación lejana una pared es</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">visible si su normal forma menos de</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">90° con la dirección de observación.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Un semicírculo de 180° contiene dos o</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tres normales. El número medio visible</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 5/2, porque cada pared se ve</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">durante la mitad de las direcciones.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto P(3)=1/2. La distancia de 2</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">km por sí sola no fija dimensiones ni</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">regularidad: el resultado usa el</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">modelo ideal explicado.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>