<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">191 · Velocidad relativa tras choque</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="283.2096774193548" x2="421" y2="283.2096774193548" stroke="#20364b" stroke-width="1.7"/><line x1="292.83870967741933" y1="105" x2="292.83870967741933" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="292.84,283.21 100.90,283.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">v1 final</text><line x1="100.9032258064516" y1="283.2096774193548" x2="110.03411520957468" y2="279.1320728887591" stroke="#1766b0" stroke-width="2"/><line x1="100.9032258064516" y1="283.2096774193548" x2="110.03411520957468" y2="287.2872819499505" stroke="#1766b0" stroke-width="2"/><polyline points="292.84,283.21 183.16,283.21" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">v2 final</text><line x1="183.16129032258064" y1="283.2096774193548" x2="192.29217972570373" y2="279.1320728887591" stroke="#d37618" stroke-width="2"/><line x1="183.16129032258064" y1="283.2096774193548" x2="192.29217972570373" y2="287.2872819499505" stroke="#d37618" stroke-width="2"/><polyline points="292.84,283.21 375.10,283.21" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="498" font-family="Arial,sans-serif" font-size="12" fill="#008674" text-anchor="start">v2 respecto 1</text><line x1="375.0967741935484" y1="283.2096774193548" x2="365.9658847904253" y2="287.2872819499505" stroke="#008674" stroke-width="2"/><line x1="375.0967741935484" y1="283.2096774193548" x2="365.9658847904253" y2="279.1320728887591" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La velocidad relativa de acercamiento</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inicial es u1−u2=15 m/s.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La de separación final es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">v2−v1=e(u1−u2).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">v2/1=3i m/s; no hace falta hallar cada</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">velocidad.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>