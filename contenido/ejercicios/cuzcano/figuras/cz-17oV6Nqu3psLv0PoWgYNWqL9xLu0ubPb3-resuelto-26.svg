<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Cruce de una recta con la mediatriz de dos puntos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="142.74,269.50 333.26,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="206.25,396.52 206.25,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,205.99 301.51,301.25" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="158.61,327.72 333.26,211.28" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="158.61,364.76 228.47,155.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="166.55342741935485" y="314.74949596774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="231.6491935483871" y="198.05342741935488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="307.85887096774195" y="304.429435483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio de AB es (4,1). La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mediatriz tiene vector normal (2,−3),</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelo a B−A.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe la mediatriz como 2x−3y−5=0 y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituye y=3x+3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta x=−2, y=−3. Suma ambas</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coordenadas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>