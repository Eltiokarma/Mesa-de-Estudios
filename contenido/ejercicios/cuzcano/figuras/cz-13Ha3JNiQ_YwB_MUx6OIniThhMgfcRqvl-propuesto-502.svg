<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">502 · Anillos heterocíclicos, alicíclicos y aromáticos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="124.08,177.10 143.48,188.11 162.89,177.10 182.30,188.11 201.71,177.10 221.11,188.11 240.52,177.10 259.93,188.11 279.33,177.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="350.01,153.64 375.10,168.12 375.10,197.08 350.01,211.57 324.93,197.08 324.93,168.12 350.01,153.64" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="153.04,298.47 127.96,283.98 127.96,255.02 153.04,240.53 178.13,255.02 178.13,283.98 153.04,298.47" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="178.13,255.02 190.12,247.49" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="199.97,242.85 210.39,233.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="199.39,250.67 210.11,261.68" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="344.80,295.57 324.93,283.98 324.93,255.02 350.01,240.53 375.10,255.02 375.10,283.98 355.23,295.57" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="350.01,305.13 350.01,319.03" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="124.08,350.89 143.48,361.90 162.89,350.89 182.30,361.90 201.71,350.89 221.11,361.90 240.52,350.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="164.83,347.94 180.36,356.75" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="143.48,361.90 143.48,335.25" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="201.71,350.89 201.71,378.41" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="350.01,327.43 375.10,341.92 375.10,370.88 350.01,385.36 324.93,370.88 324.93,341.92 350.01,327.43" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="370.33,347.01 370.33,365.78" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="329.69,365.78 329.69,347.01" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="183.47077400784227" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="301.75321488446815" y="183.47077400784227" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="195.3326119123217" y="248.3547693689309" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="104.78394325259188" y="270.36898208072887" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="350.0114222820598" y="299.0453907447814" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="301.75321488446815" y="270.36898208072887" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="100.90322580645162" y="357.26719015361545" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="301.75321488446815" y="357.26719015361545" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las estructuras 1 y 5 son acíclicas.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Solo la 4 tiene un heteroátomo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">integrado en su anillo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las estructuras 2, 3 y 6 tienen</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">anillos de carbono no aromáticos. El N</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la 3 está fuera del anillo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el ciclohexa-1,4-dieno los dos</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dobles enlaces no completan un sistema</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π conjugado continuo alrededor del</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">anillo. Ninguna estructura es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aromática.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>