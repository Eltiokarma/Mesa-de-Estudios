<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Longitud perpendicular junto al cuadrado exterior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="171.36,228.73 227.81,153.46 328.17,228.73 171.36,228.73 171.36,385.54 328.17,385.54 328.17,228.73" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="171.36,228.73 152.54,253.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="152.54,253.82 328.17,385.54" fill="none" stroke="#008674" stroke-width="2.5"/><text x="158.81093189964156" y="222.45698924731184" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="223.10304659498206" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="336.0062724014337" y="224.02508960573476" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="334.43817204301075" y="394.9480286738351" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="158.81093189964156" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="139.9937275985663" y="260.0913978494624" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="187.03673835125448" y="184.82258064516128" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">p</text><text x="149.40232974910393" y="239.70609318996415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">q</text><text x="241.92025089605735" y="310.27060931899643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Fija A=(0,0), B=(p,0) y C=(0,c), con</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">c=AC. La hipotenusa orientada de B a C</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene vector (−p,c).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para construir el cuadrado hacia</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuera, gira ese vector 90° en sentido</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horario. Sale C→D=(c,p), por lo que</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(c,c+p) y M=(c,0).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como M está más allá de B, c=p+q. La</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud MD=c+p resulta 2p+q.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>