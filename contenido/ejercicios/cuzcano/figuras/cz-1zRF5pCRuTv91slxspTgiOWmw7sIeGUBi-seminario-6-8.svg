<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Celda de estaño y plata</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,248.08 100.90,376.61 216.58,376.61 216.58,248.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="259.42,248.08 259.42,376.61 375.10,376.61 375.10,248.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,290.92 216.58,290.92" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="259.42,290.92 375.10,290.92" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="124.47,213.80 124.47,346.62 141.60,346.62 141.60,213.80 124.47,213.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="332.25,213.80 332.25,346.62 349.39,346.62 349.39,213.80 332.25,213.80" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="133.04,213.80 133.04,171.82 218.72,171.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="252.99,171.82 340.82,171.82 340.82,213.80" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="218.72,162.39 252.99,162.39 252.99,181.24 218.72,181.24 218.72,162.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="193.02,329.48 193.02,258.79 207.15,240.37 223.01,229.66 252.99,229.66 268.85,240.37 282.98,258.79 282.98,329.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="134.32056451612902" y="267.78629032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Sn</text><text x="339.9657258064516" y="267.78629032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Ag</text><text x="165.59576612903226" y="357.32762096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Sn²⁺</text><text x="312.9747983870967" y="357.32762096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Ag⁺</text><text x="236.28629032258064" y="171.8185483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="237.99999999999997" y="254.9334677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Puente salino</text><text x="270.1320564516128" y="193.23991935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">e⁻ →</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ag⁺ se reduce y Sn se oxida.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica la semirreacción de Ag⁺ por</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos para cancelar los electrones.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E°=0,799−(−0,140)=0,939 V. El</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">potencial de un electrodo no se</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplica por su coeficiente.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los electrones recorren el circuito</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior desde el ánodo de Sn hasta el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cátodo de Ag.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>