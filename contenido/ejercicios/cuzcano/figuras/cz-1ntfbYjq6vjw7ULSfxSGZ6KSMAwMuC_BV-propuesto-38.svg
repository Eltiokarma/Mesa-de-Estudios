<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Una exponencial reflejada con una asíntota por encima</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="203.72580645161293" y1="105" x2="203.72580645161293" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,150.42 103.65,150.88 106.39,151.35 109.13,151.86 111.87,152.39 114.61,152.96 117.35,153.56 120.10,154.19 122.84,154.85 125.58,155.56 128.32,156.31 131.06,157.09 133.81,157.93 136.55,158.81 139.29,159.74 142.03,160.72 144.77,161.76 147.52,162.86 150.26,164.02 153.00,165.25 155.74,166.55 158.48,167.92 161.23,169.37 163.97,170.90 166.71,172.53 169.45,174.24 172.19,176.05 174.94,177.96 177.68,179.99 180.42,182.12 183.16,184.38 185.90,186.77 188.65,189.30 191.39,191.97 194.13,194.79 196.87,197.77 199.61,200.92 202.35,204.26 205.10,207.78 207.84,211.50 210.58,215.44 213.32,219.60 216.06,223.99 218.81,228.64 221.55,233.55 224.29,238.74 227.03,244.23 229.77,250.03 232.52,256.17 235.26,262.65 238.00,269.50 240.74,262.65 243.48,256.17 246.23,250.03 248.97,244.23 251.71,238.74 254.45,233.55 257.19,228.64 259.94,223.99 262.68,219.60 265.42,215.44 268.16,211.50 270.90,207.78 273.65,204.26 276.39,200.92 279.13,197.77 281.87,194.79 284.61,191.97 287.35,189.30 290.10,186.77 292.84,184.38 295.58,182.12 298.32,179.99 301.06,177.96 303.81,176.05 306.55,174.24 309.29,172.53 312.03,170.90 314.77,169.37 317.52,167.92 320.26,166.55 323.00,165.25 325.74,164.02 328.48,162.86 331.23,161.76 333.97,160.72 336.71,159.74 339.45,158.81 342.19,157.93 344.94,157.09 347.68,156.31 350.42,155.56 353.16,154.85 355.90,154.19 358.65,153.56 361.39,152.96 364.13,152.39 366.87,151.86 369.61,151.35 372.35,150.88 375.10,150.42" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">g(x)</text><polyline points="100.90,142.48 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">y=2</text><circle cx="238.0" cy="269.5" r="3.7" fill="#20364b"/><text x="245.0" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,1)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como −∣x−1∣≤0, la potencia está en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,1]. El valor dentro del módulo es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto g(x)=2−2^(−∣x−1∣). Es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simétrica respecto de x=1 y alcanza su</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mínimo 1 allí.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al aumentar ∣x−1∣, la potencia tiende</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a 0. Las ramas se acercan a y=2 por</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">debajo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>