ffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">8a</text><rect x="301.33333333333337" y="295.7142857142857" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="48.0" y="337.14285714285717" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">5</text><rect x="174.66666666666669" y="337.14285714285717" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="301.33333333333337" y="337.14285714285717" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="48.0" y="378.57142857142856" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">6</text><rect x="174.66666666666669" y="378.57142857142856" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="301.33333333333337" y="378.57142857142856" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">20b</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Frecuencias agrupadas</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre 24 y 32 hay dos clases</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">completas, de modo que el ancho es 4 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la tercera termina en 28.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De la primera clase, 5a=3b. El</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">acumulado de la tercera es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5a+4b+2a+3b=7a+7b, que equivale a</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">56b/5.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide por el total 20b para hallar el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">56 % en las primeras tres clases. El</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">complemento es el porcentaje desde 28.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>