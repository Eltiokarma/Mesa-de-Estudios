<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">089 · Imán que se acerca a una espira con resistencia</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="254.24,227.41 253.93,231.68 253.00,235.91 251.47,240.04 249.35,244.04 246.66,247.85 243.44,251.44 239.72,254.77 235.53,257.79 230.94,260.49 225.97,262.82 220.70,264.76 215.18,266.30 209.46,267.40 203.62,268.07 197.71,268.30 191.80,268.07 185.96,267.40 180.25,266.30 174.72,264.76 169.45,262.82 164.49,260.49 159.89,257.79 155.71,254.77 151.99,251.44 148.76,247.85 146.08,244.04 143.96,240.04 142.43,235.91 141.50,231.68 141.19,227.41 141.50,223.13 142.43,218.91 143.96,214.77 146.08,210.78 148.76,206.96 151.99,203.38 155.71,200.05 159.89,197.02 164.49,194.33 169.45,192.00 174.72,190.06 180.25,188.52 185.96,187.41 191.80,186.74 197.71,186.52 203.62,186.74 209.46,187.41 215.18,188.52 220.70,190.06 225.97,192.00 230.94,194.33 235.53,197.02 239.72,200.05 243.44,203.38 246.66,206.96 249.35,210.78 251.47,214.77 253.00,218.91 253.93,223.13 254.24,227.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="289.11,176.30 375.10,176.30 375.10,208.77 289.11,208.77 289.11,176.30" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="330.60,176.30 330.60,208.77" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="188.09,267.09 188.09,296.56 130.97,309.19 100.90,320.61 217.56,365.71 290.31,336.24 206.73,299.57 206.73,267.09" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="320.98,160.66 262.65,175.70" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="271.35,168.49 262.65,175.70 273.75,177.80" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.9032258064516" y="334.44057724957554" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="215.75183927560835" y="378.335597057159" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="159.83078664402942" y="337.44708545557444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="308.9535936615733" y="192.53338992642892" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="352.8486134691568" y="192.53338992642892" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El campo exterior se aleja del polo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">norte y su flujo a través de la espira</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aumenta al acercarse el imán.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La espira genera un campo en sentido</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuesto, apuntando hacia el imán.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Vista desde el imán, la corriente en</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la espira es antihoraria.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al seguir ese giro por los terminales</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del esquema, la corriente vuelve por</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la resistencia desde B hasta A.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>