<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Puntos medios encadenados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,293.83 375.10,293.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,290.43 107.18,297.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="197.12,290.43 197.12,297.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="217.56,290.43 217.56,297.23" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="282.97,290.43 282.97,297.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="287.06,290.43 287.06,297.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="327.94,290.43 327.94,297.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="368.82,290.43 368.82,297.23" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="287.06,267.67 368.82,267.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="287.06,264.53 287.06,270.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="368.82,264.53 368.82,270.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="217.56,241.51 282.97,241.51" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="217.56,238.37 217.56,244.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="282.97,238.37 282.97,244.64" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="107.18246737256834" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="197.11952105392763" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="217.5597605269638" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="282.9685268406796" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="287.05657473528686" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="327.93705368135926" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="368.81753262743166" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="327.93705368135926" y="259.2962324550603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 m</text><text x="250.26414368382171" y="233.132725929574" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon A=0, B=t, C=t+5. Entonces M=t/2 y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N=t+5/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia entre los puntos medios</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de MC y AN es t/4+5/4.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala esa diferencia a 4 y despeja t.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>