<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Velocidad relativa con ejes distintos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="153.32258064516128" y1="105" x2="153.32258064516128" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="153.32,269.50 322.68,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">vA</text><line x1="322.6774193548387" y1="269.5" x2="313.5465299517156" y2="273.5776045305957" stroke="#1766b0" stroke-width="2"/><line x1="322.6774193548387" y1="269.5" x2="313.5465299517156" y2="265.4223954694043" stroke="#1766b0" stroke-width="2"/><polyline points="153.32,269.50 153.32,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">vB</text><line x1="153.32258064516128" y1="396.5161290322581" x2="149.2449761145656" y2="387.385239629135" stroke="#d37618" stroke-width="2"/><line x1="153.32258064516128" y1="396.5161290322581" x2="157.40018517575697" y2="387.385239629135" stroke="#d37618" stroke-width="2"/><polyline points="153.32,269.50 322.68,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">vA/B</text><line x1="322.6774193548387" y1="142.4838709677419" x2="317.8192705506977" y2="151.2244882340923" stroke="#008674" stroke-width="2"/><line x1="322.6774193548387" y1="142.4838709677419" x2="312.92614511398284" y2="144.70032098513917" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tomar la primera como rA; derivar da</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vA=8ti y vB=−6tj.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En t=2: vA/B=(16,12) m/s.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su módulo es √(16²+12²)=20 m/s; no</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coincide con la clave B=14.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>