<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">047 · Rango de coseno y cotangente en un tramo interior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="192.30,142.48 195.35,147.14 198.39,151.72 201.44,156.23 204.49,160.68 207.53,165.07 210.58,169.43 213.63,173.74 216.67,178.02 219.72,182.28 222.77,186.51 225.81,190.73 228.86,194.92 231.91,199.11 234.95,203.28 238.00,207.44 241.05,211.60 244.09,215.74 247.14,219.89 250.19,224.03 253.23,228.17 256.28,232.31 259.33,236.44 262.37,240.57 265.42,244.71 268.47,248.84 271.51,252.97 274.56,257.10 277.61,261.24 280.65,265.37 283.70,269.50 286.75,273.63 289.79,277.76 292.84,281.90 295.89,286.03 298.93,290.16 301.98,294.29 305.03,298.43 308.07,302.56 311.12,306.69 314.16,310.83 317.21,314.97 320.26,319.11 323.30,323.26 326.35,327.40 329.40,331.56 332.44,335.72 335.49,339.89 338.54,344.08 341.58,348.27 344.63,352.49 347.68,356.72 350.72,360.98 353.77,365.26 356.82,369.57 359.86,373.93 362.91,378.32 365.96,382.77 369.00,387.28 372.05,391.86 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El coseno y la cotangente decrecen en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">todo ese tramo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su suma también decrece y es continua.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El máximo queda en π/4 y el mínimo en</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3π/4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al evaluar se obtienen √2+1 y −√2−1,</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respectivamente.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>