<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Dos tensiones perpendiculares en proporción tres a uno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,201.67 245.22,297.88 331.80,168.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="245.22,297.88 245.22,358.01" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="361.15,176.66 360.84,179.76 359.94,182.73 358.47,185.48 356.50,187.88 354.09,189.86 351.35,191.33 348.37,192.23 345.27,192.53 342.18,192.23 339.20,191.33 336.45,189.86 334.05,187.88 332.07,185.48 330.61,182.73 329.70,179.76 329.40,176.66 329.70,173.56 330.61,170.58 332.07,167.84 334.05,165.43 336.45,163.46 339.20,161.99 342.18,161.09 345.27,160.78 348.37,161.09 351.35,161.99 354.09,163.46 356.50,165.43 358.47,167.84 359.94,170.58 360.84,173.56 361.15,176.66" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="361.15,176.66 361.15,254.59" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="228.38,358.01 262.05,358.01 262.05,383.03 228.38,383.03 228.38,358.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="347.20,254.59 375.10,254.59 375.10,279.60 347.20,279.60 347.20,254.59" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="234.15,290.67 241.37,279.60 252.43,286.82" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="213.2181663837012" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="257.2416525183927" y="307.50226372382565" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="329.39784946236557" y="155.97425014148274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="245.21561969439728" y="371.9617996604414" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="361.1465761177136" y="268.05687606112053" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tensión en BC vale Q porque la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">polea es ideal y el peso colgante está</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en equilibrio.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos tensiones perpendiculares</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">deben sumar una resultante vertical de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">magnitud P.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si T_AB=T, entonces P²=T²+(3T)²=10T².</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye Q=3T.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>