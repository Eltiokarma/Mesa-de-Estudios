<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Ángulo de una arista con el triedro de referencia</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="346.65,373.11 172.01,373.11 238.82,282.06" fill="#f4c581" fill-opacity="0.45"/><polyline points="165.52,378.60 375.10,378.60 310.48,277.06 100.90,277.06 165.52,378.60" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="346.65,373.11 172.01,373.11 238.82,282.06" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="172.01,373.11 338.12,183.19 358.05,160.40" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="172.01,373.11 338.12,359.61 346.71,373.11" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="338.12,359.61 338.12,183.19" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="338.12,183.19 346.71,373.11" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="172.00892306789163" y="373.1122661596713" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="346.6544952889724" y="373.1122661596713" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.81513480993397" y="282.06271171023906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="338.11724124102625" y="183.18959369487084" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="338.11724124102625" y="359.60826286877244" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="346.71069788068917" y="373.1122661596713" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="358.0502394218025" y="160.39887299909475" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="224.97643018579942" y="370.0933926969926" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo de OP con el plano tiene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">seno √2/2. La proyección OE mide 5√2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como OP·cos 60°=5 es la componente de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OE sobre OB, ∠EOB=45°. Así</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠AOE=53°−45°=8°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La proyección sobre OA da cos</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠AOC=(√2/2)cos 8°. Toma el arco</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coseno.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>