<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Dos trayectorias y un triángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="338.36,338.05 100.90,200.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">II: A a B</text><line x1="100.90322580645162" y1="200.9516129032258" x2="110.84961025400018" y2="201.98574849470495" stroke="#1766b0" stroke-width="2"/><line x1="100.90322580645162" y1="200.9516129032258" x2="106.77200572340449" y2="209.04836671486973" stroke="#1766b0" stroke-width="2"/><polyline points="100.90,338.05 375.10,338.05" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">I: O a I</text><line x1="375.0967741935484" y1="338.04838709677415" x2="365.9658847904253" y2="342.12599162736984" stroke="#d37618" stroke-width="2"/><line x1="375.0967741935484" y1="338.04838709677415" x2="365.9658847904253" y2="333.97078256617846" stroke="#d37618" stroke-width="2"/><polyline points="100.90,200.95 375.10,338.05" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">separación</text><text x="107.90322580645162" y="330.04838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="345.3618042634751" y="330.04838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="107.90322580645162" y="192.9516129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OB=20/√3 m y AB=40/√3 m.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como tienen igual rapidez y tiempo, I</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">avanza OI=AB=40/√3.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Separación</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">IB=√[(40/√3)²+(20/√3)²]=20√15/3 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>