<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Dos visuales desde el centro de un círculo tangente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="318.72,269.50 318.33,260.57 317.16,251.70 315.23,242.97 312.54,234.44 309.12,226.18 304.99,218.25 300.18,210.71 294.74,203.61 288.70,197.02 282.11,190.98 275.01,185.54 267.47,180.73 259.54,176.60 251.28,173.18 242.75,170.49 234.02,168.55 225.15,167.39 216.22,167.00 207.28,167.39 198.42,168.55 189.69,170.49 181.16,173.18 172.90,176.60 164.97,180.73 157.43,185.54 150.33,190.98 143.74,197.02 137.70,203.61 132.25,210.71 127.45,218.25 123.32,226.18 119.90,234.44 117.21,242.97 115.27,251.70 114.11,260.57 113.72,269.50 114.11,278.43 115.27,287.30 117.21,296.03 119.90,304.56 123.32,312.82 127.45,320.75 132.25,328.29 137.70,335.39 143.74,341.98 150.33,348.02 157.43,353.46 164.97,358.27 172.90,362.40 181.16,365.82 189.69,368.51 198.42,370.45 207.28,371.61 216.22,372.00 225.15,371.61 234.02,370.45 242.75,368.51 251.28,365.82 259.54,362.40 267.47,358.27 275.01,353.46 282.11,348.02 288.70,341.98 294.74,335.39 300.18,328.29 304.99,320.75 309.12,312.82 312.54,304.56 315.23,296.03 317.16,287.30 318.33,278.43 318.72,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,372.00 375.10,372.00" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="216.22,372.00 216.22,269.50 356.24,320.75 356.24,372.00 216.22,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="216.22,320.75 356.24,320.75" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="304.99,372.00 304.99,320.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="204.43050949653303" y="260.27479650286404" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="251.58154959300575" y="294.10054265902926" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="327.53832899810345" y="325.36373228821225" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="208.01808863430813" y="347.4017184202593" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="207.50557732891167" y="297.68812179680435" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escoge radio 2 y lado del cuadrado 1.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el vértice común superior</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierdo, el desnivel respecto de O</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 1. Por Pitágoras, su separación</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal respecto de O es √3.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los vértices derechos tienen</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separación horizontal h=√3+1 y</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desniveles 1 y 2. Las pendientes en</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valor absoluto son 1/h y 2/h.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente de la diferencia es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1/h)/(1+2/h²)=h/(h²+2), que se</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simplifica a √3/6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>