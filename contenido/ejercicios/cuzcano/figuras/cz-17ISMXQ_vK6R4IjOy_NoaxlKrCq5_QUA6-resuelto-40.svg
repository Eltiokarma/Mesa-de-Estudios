<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Círculo inscrito en un cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="125.10,368.29 350.90,368.29 350.90,142.48 125.10,142.48 125.10,368.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="350.90,255.39 350.56,246.53 349.51,237.73 347.78,229.03 345.38,220.50 342.31,212.18 338.60,204.13 334.27,196.40 329.34,189.02 323.85,182.06 317.83,175.55 311.32,169.53 304.36,164.05 296.99,159.12 289.26,154.79 281.21,151.08 272.89,148.01 264.36,145.60 255.66,143.87 246.86,142.83 238.00,142.48 229.14,142.83 220.34,143.87 211.64,145.60 203.11,148.01 194.79,151.08 186.74,154.79 179.01,159.12 171.64,164.05 164.68,169.53 158.17,175.55 152.15,182.06 146.66,189.02 141.73,196.40 137.40,204.13 133.69,212.18 130.62,220.50 128.22,229.03 126.49,237.73 125.44,246.53 125.10,255.39 125.44,264.25 126.49,273.05 128.22,281.74 130.62,290.28 133.69,298.59 137.40,306.64 141.73,314.38 146.66,321.75 152.15,328.71 158.17,335.22 164.68,341.24 171.64,346.73 179.01,351.65 186.74,355.98 194.79,359.70 203.11,362.76 211.64,365.17 220.34,366.90 229.14,367.94 238.00,368.29 246.86,367.94 255.66,366.90 264.36,365.17 272.89,362.76 281.21,359.70 289.26,355.98 296.99,351.65 304.36,346.73 311.32,341.24 317.83,335.22 323.85,328.71 329.34,321.75 334.27,314.38 338.60,306.64 342.31,298.59 345.38,290.28 347.78,281.74 349.51,273.05 350.56,264.25 350.90,255.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,255.39 350.90,255.39" fill="none" stroke="#008674" stroke-width="2.5"/><text x="286.2096774193549" y="250.20967741935488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">r</text><text x="188.54838709677418" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">lado = 2r</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el radio es r, el lado del cuadrado</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es el diámetro 2r.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área del círculo es πr² y la del</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrado 4r².</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La razón es π/4, o 25π% ≈78,54%.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>