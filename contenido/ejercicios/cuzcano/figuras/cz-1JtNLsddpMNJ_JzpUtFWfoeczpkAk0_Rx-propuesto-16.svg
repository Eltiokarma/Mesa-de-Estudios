<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Altura máxima de un muro frente a un espejo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,331.40 357.63,331.40 357.63,190.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="277.88,331.40 277.88,289.63" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="117.61,331.40 357.63,272.16 117.61,212.91" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="117.61,331.40 117.61,205.32" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="117.61308194084532" y="193.92587793762848" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1,60 m</text><text x="375.0967741935484" y="247.85314091680817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">espejo</text><text x="280.15440979358414" y="278.23469752479673" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">muro</text><text x="195.84559020641586" y="348.1122777231704" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2a</text><text x="319.65043338396924" y="348.1122777231704" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La imagen de los pies queda a 3a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">detrás del espejo, a altura cero. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recta desde los ojos hasta esa imagen</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">representa el trayecto visual al</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reflejarlo.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esa recta pierde 1,50 m de altura a lo</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">largo de 6a. En la vertical del muro,</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a 2a de los ojos, el tramo de ida</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">todavía va a 1,00 m.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El tramo de vuelta desde el espejo</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia los pies cruza el muro a 0,50 m.</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Es el cruce más bajo y fija la altura</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">máxima.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>