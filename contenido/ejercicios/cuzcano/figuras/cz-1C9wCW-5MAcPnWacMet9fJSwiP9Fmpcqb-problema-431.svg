<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">431 · Mínimo flujo no tiene normal única</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="247.70747753832657" x2="421" y2="247.70747753832657" stroke="#20364b" stroke-width="1.7"/><line x1="163.59567425303425" y1="105" x2="163.59567425303425" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="163.60,247.71 268.82,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">B</text><line x1="268.8192808236189" y1="142.48387096774195" x2="265.2460688229874" y2="151.82368659753587" stroke="#1766b0" stroke-width="2"/><line x1="268.8192808236189" y1="142.48387096774195" x2="259.479465193825" y2="146.05708296837346" stroke="#1766b0" stroke-width="2"/><polyline points="163.60,247.71 312.40,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">normal C</text><line x1="312.4043257469657" y1="396.51612903225805" x2="303.0645101171718" y2="392.94291703162656" stroke="#d37618" stroke-width="2"/><line x1="312.4043257469657" y1="396.51612903225805" x2="308.8311137463342" y2="387.17631340246413" stroke="#d37618" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mínimo es cero y exige B·n=0, es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">decir nx+ny=0.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C=(i−j)/√2,D=(i−j+k)/√3 y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E=(2i−2j+k)/3 cumplen esa condición.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las tres son unitarias; hay tres</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alternativas correctas C,D,E y una</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">familia continua de normales.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>