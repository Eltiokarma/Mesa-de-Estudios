<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Tanque con tres salidas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="211.73,142.48 211.73,396.52 281.01,396.52 281.01,142.48 211.73,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="211.73,165.58 281.01,165.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="281.01,234.86 298.91,234.86" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="281.01,281.05 298.91,281.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="281.01,350.33 298.91,350.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="211.73,396.52 193.83,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="208.33852639296188" y="157.57771260997066" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">20 m</text><text x="299.5592008797654" y="226.85923753665688" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A · 14 m</text><text x="299.5592008797654" y="273.0469208211143" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B · 10 m</text><text x="299.5592008797654" y="342.3284457478006" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C · 4 m</text><text x="184.0899926686217" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D · 0 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada metro de altura representa 10 L.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De 20 a 14 m salen 60 L netos a 6 L/s:</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">10 s.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De 14 a 10 m, quedan B y D como</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">salidas: 40 L netos a 4 L/s, otros 10</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">s.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De 10 m al fondo, D y C dan pérdida</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">neta de 1 L/s. Los 100 L toman 100 s.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Total 120 s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>