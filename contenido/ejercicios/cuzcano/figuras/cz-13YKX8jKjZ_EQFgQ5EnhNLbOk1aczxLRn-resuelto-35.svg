<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Cuadrado por distancias a dos puntos de trisección</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="110.98,396.52 110.98,142.48 365.02,142.48 365.02,396.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="110.98,396.52 110.98,142.48 365.02,142.48 365.02,396.52 280.34,396.52 195.66,396.52 110.98,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.98,396.52 178.73,284.18 365.02,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="195.66,396.52 178.73,284.18" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="280.34,396.52 178.73,284.18" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="178.73,284.18 238.00,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="177.72632509526298" y="340.34748338914244" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="236.34865883463644" y="340.34748338914244" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="110.98387096774194" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="110.98387096774194" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="365.0161290322581" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="365.0161290322581" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="195.66129032258064" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="280.3387096774194" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="178.7258064516129" y="284.1788377460268" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="238.0" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama G al punto medio de DO y t a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cada tercio. En el triángulo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulo DMO, la mediana MG vale</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DO/2=3t/2. También CG=GP=t/2.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En MCP, Apolonio da</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MC²+MP²=2MG²+CP²/2. Por tanto 25=5t².</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cuadrado tiene lado 3t y área 9t².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>