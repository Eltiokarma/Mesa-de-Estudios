<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Densidad de mezcla sin promediar masas molares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,146.11 100.90,392.89 375.10,392.89 375.10,146.11" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,146.11 375.10,146.11" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="114.75806451612905" y="179.24193548387098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">CO₂: 0,25 mol</text><text x="114.75806451612905" y="234.08064516129033" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N₂: 0,50 mol</text><text x="114.75806451612905" y="288.9193548387097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">V=12,5 L</text><text x="114.75806451612905" y="343.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">ρ=2 kg/m³</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ntotal=11/44+14/28=0,75 mol y masa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">total=0,025 kg.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El volumen común de la mezcla es V=nto</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">talRT/P=0,75·8,3·300/(1,494·10⁵)=0,012</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5 m³.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ρ=masa/V=0,025/0,0125=2 kg/m³. No se</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suman dos volúmenes independientes</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para gases que comparten recipiente.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>