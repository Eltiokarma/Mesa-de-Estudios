0322582" y="347.1854838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="169.45161290322582" cy="286.63709677419354" r="3.7" fill="#20364b"/><text x="176.45161290322582" y="278.63709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I</text><circle cx="238.0" cy="286.63709677419354" r="3.7" fill="#20364b"/><text x="245.0" y="278.63709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="238.0" cy="355.1854838709677" r="3.7" fill="#20364b"/><text x="245.0" y="347.1854838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="238.0" cy="218.08870967741936" r="3.7" fill="#20364b"/><text x="245.0" y="210.08870967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="375.09677419354836" cy="218.08870967741936" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="210.08870967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">E</text><circle cx="375.09677419354836" cy="355.1854838709677" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="347.1854838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a=OT, b el lado del cuadrado menor</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y c=RM. Los triángulos tienen áreas</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ab/2 y bc/2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como las áreas son iguales, a=c. La</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente de OI es b/a y la de IM es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">c/b=a/b.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por colinealidad b/a=a/b. Las</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitudes positivas dan a=b y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente 1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>