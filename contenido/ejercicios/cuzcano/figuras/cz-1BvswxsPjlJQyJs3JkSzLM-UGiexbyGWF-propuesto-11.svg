<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Tres patrones de respuestas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,195.90 375.10,195.90 375.10,149.72 100.90,149.72 100.90,195.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,268.06 375.10,268.06 375.10,221.88 100.90,221.88 100.90,268.06" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,340.21 375.10,340.21 375.10,294.03 100.90,294.03 100.90,340.21" fill="none" stroke="#008674" stroke-width="2.5"/><text x="111.51103565365024" y="164.8106960950764" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Roymer:2 verdades</text><text x="111.51103565365024" y="236.9668930390492" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Carlos:3 verdades</text><text x="111.51103565365024" y="309.12308998302206" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">José:0 verdades</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las filas de quien siempre dice verdad</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y quien siempre miente deben ser</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">complementarias.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Carlos(sí,no,sí) y José(no,sí,no) son</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">complementarios; Roymer difiere una</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vez de Carlos.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Carlos dice verdad,Roymer miente una</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vez,José siempre miente.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>