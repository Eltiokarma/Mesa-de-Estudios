<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">052 · Relación de tres tangentes dentro de un cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="129.60,379.00 129.60,160.00 348.59,160.00 348.59,379.00 129.60,379.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="129.60,160.00 348.59,379.00" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="348.59,160.00 239.09,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="129.60,379.00 348.59,256.36" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="112.07883759733035" y="394.32619577308117" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="114.26877085650722" y="144.67380422691883" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="361.7312291434927" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="363.9211624026696" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="289.4634315906563" y="302.34899888765295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="144.9278364849833" y="326.43826473859843" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="304.7929644048943" y="179.71273637374864" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el segmento desde A hace ángulo t</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con AD, entonces x=t+45° y y=90°−t. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a BD forma z=45° con BC.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto x+y+z=180°. Al desarrollar</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el seno de la suma y dividir por cos x</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos y cos z, resulta tan x+tan y+tan</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">z=tan x tan y tan z.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica por las tres cotangentes,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en el dominio del enunciado.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>