<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Perímetro de un hexágono formado por medianas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,321.44 200.75,269.50 300.59,217.56 337.84,269.50 375.10,321.44 238.00,321.44 100.90,321.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,321.44 179.88,304.13 258.86,286.81 337.84,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="300.59,217.56 279.73,252.19 258.86,286.81 238.00,321.44" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,321.44 316.98,304.13 258.86,286.81 200.75,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="200.75,269.50 279.73,252.19 337.84,269.50 316.98,304.13 238.00,321.44 179.88,304.13 200.75,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="321.4430620590581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="300.5876577840112" y="217.5569379409419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="321.4430620590581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="200.74544179523141" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="337.8422159887798" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="238.0" y="321.4430620590581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="279.72510518934075" y="252.18564598031398" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="316.97966339410937" y="304.1287080393721" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="179.882889200561" y="304.1287080393721" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="258.8625525946704" y="286.814354019686" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El baricentro divide cada mediana en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">razón 2:1. Así AG=8, BG=4 y CG=6.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el teorema del segmento medio,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MD=EQ=AG/2, DN=QF=CG/2 y NE=FM=BG/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El perímetro es AG+BG+CG=8+4+6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>