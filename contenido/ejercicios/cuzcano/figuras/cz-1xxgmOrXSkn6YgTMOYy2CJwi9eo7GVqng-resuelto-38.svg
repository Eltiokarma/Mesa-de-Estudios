<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Dos ángulos iguales en un triángulo rectángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="123.61,325.70 372.83,325.70 217.85,209.89 123.61,325.70" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.99,255.31 123.61,325.70" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="109.99,255.31 249.07,233.74 249.07,325.70 109.99,255.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="217.85,209.89 249.07,325.70" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="241.69,325.70 241.69,318.32 249.07,318.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="112.26,262.69 119.64,261.55 117.93,254.17" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="212.17,216.14 217.85,221.25 223.52,214.43" fill="none" stroke="#008674" stroke-width="2.5"/><text x="116.79850397381955" y="335.35186669338145" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="375.0967741935484" y="327.9719161156749" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="100.90322580645163" y="252.4693448206772" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="217.27936953182396" y="203.08044480064115" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="251.90836839644692" y="229.19411607560275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="247.3668603486275" y="335.91955519935885" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="257.01756495024375" y="301.29055633473587" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">28°</text><text x="182.65037066720095" y="330.810358645562" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=</text><text x="306.97415347625724" y="330.810358645562" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D y R ven UO bajo un ángulo recto, así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que ∠DRO=∠DUO. La recta DO es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mediatriz de UE, de modo que</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠DUO=∠DEO=x.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D y M también ven UO bajo un ángulo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recto. Por eso ∠MUO=∠MDO=28°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo UME, los ángulos en U</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y E son x+28° y x. Suman 90°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>