<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">099 · Ángulo entre dos segmentos hacia puntos medios</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="182.05,386.40 301.09,386.40 182.05,142.48 182.05,386.40" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="301.09,386.40 182.05,293.37" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="182.05,386.40 241.57,339.88" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="182.05,386.40 241.57,264.44" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="174.90857695679773" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="301.0914230432022" y="375.6840553859177" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="189.7886295613266" y="152.60230673882148" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="182.0510022069716" y="293.36760437766424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="250.4992441878042" y="335.80551440578046" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="249.30883997944193" y="257.83403875804936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="280.85455150104303" y="379.2552680110046" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">38°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Coloca A en el origen, B = (1,0), N =</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,t), con t = tan 38°. El segmento AL</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene esa misma inclinación.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como BN = CN, la ordenada de C es t +</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(1 + t²). La pendiente de AM es esa</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">misma ordenada.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa tan u + sec u = tan(45° + u/2). AM</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se inclina 64°, y la diferencia con AL</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 26°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>