<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Área mínima de un triángulo entre paralelas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="225.34,196.38 261.90,232.94 152.23,342.62" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,196.38 368.77,196.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,342.62 368.77,342.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="261.90,196.38 261.90,342.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="225.34,196.38 261.90,232.94 152.23,342.62 225.34,196.38" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="255.58,226.61 249.25,232.94 255.58,239.27" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="375.0967741935484" y="196.38172043010752" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="375.0967741935484" y="342.6182795698925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="273.8560794044665" y="214.66129032258064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="273.8560794044665" y="287.0765095119934" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="252.76426799007444" y="225.9102564102564" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe los vectores como (−u,a) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−v,−b), con u,v&gt;0. Su producto</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">escalar cero implica uv=ab.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área por determinante es (ub+va)/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la desigualdad aritmético-</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">geométrica, (ub+va)/2≥√(uvab)=ab. Se</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanza cuando u=a y v=b.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>