<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">080 · Mediana que forma 45° con la base</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="204.63,313.72 237.60,221.25 367.06,312.92 204.63,313.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="237.60,221.25 268.96,312.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="237.60,221.25 238.40,312.92" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="109.75,314.53 204.63,313.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="109.75,314.53 237.60,221.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="199.80588402232524" y="323.3738056948255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.40204332608076" y="214.01802100085138" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935483" y="322.5697190426639" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="269.7614227603822" y="324.9819789991486" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="237.59795667391919" y="324.9819789991486" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="100.90322580645166" y="322.5697190426639" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="216.6917037177183" y="310.5084192602403" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2α</text><text x="251.26742976066595" y="308.09615930375554" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45°</text><text x="349.366001324378" y="310.5084192602403" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prolonga CA hasta E con EA=AB. Si</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠C=α, el isósceles EAB da ∠AEB=α y por</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tanto BE=BC.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La proyección H de B sobre EC es su</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto medio. Como M es punto medio de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC, HM=EA/2=AB/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠AMB=45° implica BH=HM, de modo que</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen(∠A)=BH/AB=½. Como ∠A=2∠C, el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo A es menor que 120°. Por tanto</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠A=30° y ∠C=15°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>