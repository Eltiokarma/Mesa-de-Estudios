<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Anular la reacción en el techo horizontal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="306.55,235.12 305.23,248.50 301.33,261.36 295.00,273.21 286.47,283.59 276.08,292.12 264.23,298.45 251.37,302.35 238.00,303.67 224.63,302.35 211.77,298.45 199.92,292.12 189.53,283.59 181.00,273.21 174.67,261.36 170.77,248.50 169.45,235.12 170.77,221.75 174.67,208.89 181.00,197.04 189.53,186.65 199.92,178.13 211.77,171.79 224.63,167.89 238.00,166.57 251.37,167.89 264.23,171.79 276.08,178.13 286.47,186.65 295.00,197.04 301.33,208.89 305.23,221.75 306.55,235.12" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,166.57 351.10,166.57" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,166.57 266.41,386.14" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,235.12 306.55,235.12" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="321.63,227.58 306.55,235.12 321.63,242.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="238.0" y="152.86491935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="357.9596774193549" y="221.4133064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="124.20967741935485" y="179.59879032258064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53°</text><text x="235.25806451612902" y="226.2116935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">150 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una superficie lisa puede empujar, así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que su reacción mínima es cero.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ese límite, la normal del plano</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene componente vertical de 150 N. Su</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo con la vertical es 53°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza horizontal equilibra la otra</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente. Calcula F=150 tan 53°, que</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es aproximadamente 150×4/3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>