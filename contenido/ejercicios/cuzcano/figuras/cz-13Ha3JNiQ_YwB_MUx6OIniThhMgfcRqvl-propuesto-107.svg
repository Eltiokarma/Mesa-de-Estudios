<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">107 · Tres electrones en la capa externa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="238.0" y="334.6209677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="238.0" y="204.3790322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="100.90322580645167" y="334.6209677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="375.0967741935483" y="334.6209677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El átomo neutro tiene 31 electrones y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corresponde a Ga.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La capa más externa es n=4 y contiene</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4s²4p¹, tres electrones de valencia.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el símbolo de Lewis coloca tres</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puntos simples en tres lados</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferentes de X.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>