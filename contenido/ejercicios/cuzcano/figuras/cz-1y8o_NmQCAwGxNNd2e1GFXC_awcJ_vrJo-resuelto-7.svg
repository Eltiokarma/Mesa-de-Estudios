<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Triángulo rectángulo junto a un rectángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.78,209.89 107.78,327.73 314.57,327.73 314.57,209.89 107.78,209.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.78,327.73 314.57,209.89" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="314.57,209.89 366.38,297.01 314.57,327.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="359.51,300.22 355.84,293.80 363.18,289.67" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="314.57,327.73 262.30,239.70" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="336.9020929981659" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="201.63938936239074" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="320.533175099795" y="202.55642464127735" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="311.82133995037225" y="337.3606106376092" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.0967741935484" y="297.4695760060416" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="256.7992232171755" y="232.36007120509223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="321.4502103786816" y="226.85785953177256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe QD=k y toma E sobre AC a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia k de C. El cuadrilátero DECQ</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es un rectángulo, pues EC es paralelo</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a DQ y CQ es perpendicular a DQ.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro O de ABCD cumple OC=OD=2k.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así E es punto medio de OC y DE es su</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mediatriz, por lo que DC=DO=2k.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo rectángulo DCQ, el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cateto QD=k es la mitad de la</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hipotenusa DC. El ángulo opuesto mide</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>