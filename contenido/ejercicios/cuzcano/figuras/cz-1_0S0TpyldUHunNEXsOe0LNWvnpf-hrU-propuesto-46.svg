<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">046 · Barra semisumergida unida a una esfera</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,195.52 100.90,378.32 375.10,378.32 375.10,195.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,298.35 375.10,298.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="163.74,326.91 163.65,328.58 163.39,330.23 162.96,331.85 162.36,333.41 161.60,334.91 160.68,336.31 159.63,337.61 158.45,338.80 157.15,339.85 155.74,340.76 154.25,341.52 152.69,342.12 151.07,342.55 149.42,342.82 147.74,342.90 146.07,342.82 144.42,342.55 142.80,342.12 141.24,341.52 139.75,340.76 138.34,339.85 137.04,338.80 135.86,337.61 134.80,336.31 133.89,334.91 133.13,333.41 132.53,331.85 132.10,330.23 131.84,328.58 131.75,326.91 131.84,325.24 132.10,323.58 132.53,321.97 133.13,320.40 133.89,318.91 134.80,317.51 135.86,316.21 137.04,315.02 138.34,313.97 139.75,313.06 141.24,312.30 142.80,311.70 144.42,311.26 146.07,311.00 147.74,310.91 149.42,311.00 151.07,311.26 152.69,311.70 154.25,312.30 155.74,313.06 157.15,313.97 158.45,315.02 159.63,316.21 160.68,317.51 161.60,318.91 162.36,320.40 162.96,321.97 163.39,323.58 163.65,325.24 163.74,326.91" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="148.32,342.90 148.32,364.04 327.68,232.66 327.68,172.68" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="337.3951612903226" y="350.9012096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Líquido</text><text x="266.5618279569893" y="253.7909946236559" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="182.01881720430106" y="332.05040322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="128.32258064516128" y="351.47244623655916" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hilo</text><text x="327.68413978494624" y="160.67943548387092" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Soporte</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El empuje de la barra iguala su peso</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 20 N, ya que está sumergida la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mitad en un líquido del doble de</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">densidad.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sobre el extremo superior, el brazo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal del empuje de la barra es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1,5 veces el del peso. El del hilo</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferior es dos veces el del peso.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El equilibrio de momentos exige que la</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerza del hilo sobre la barra sea de</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5 N hacia abajo. En el dibujo el hilo</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiraría hacia arriba, de modo que esa</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">configuración no admite el equilibrio</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>