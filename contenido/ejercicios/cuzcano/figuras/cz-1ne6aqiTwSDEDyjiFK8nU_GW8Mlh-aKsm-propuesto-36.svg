<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Rango de dos tangentes de argumentos relacionados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="101.29,396.40 105.86,395.06 110.42,393.73 114.99,392.38 119.55,391.04 124.11,389.69 128.68,388.34 133.24,386.98 137.80,385.61 142.37,384.23 146.93,382.84 151.49,381.44 156.06,380.03 160.62,378.60 165.18,377.15 169.75,375.69 174.31,374.21 178.87,372.71 183.44,371.19 188.00,369.64 192.56,368.06 197.13,366.45 201.69,364.82 206.25,363.15 210.82,361.44 215.38,359.69 219.94,357.90 224.51,356.07 229.07,354.18 233.63,352.24 238.20,350.24 242.76,348.18 247.32,346.04 251.89,343.83 256.45,341.54 261.01,339.15 265.58,336.66 270.14,334.07 274.70,331.35 279.27,328.50 283.83,325.50 288.39,322.33 292.96,318.98 297.52,315.42 302.08,311.63 306.65,307.57 311.21,303.21 315.77,298.51 320.34,293.40 324.90,287.83 329.46,281.72 334.03,274.97 338.59,267.45 343.15,259.01 347.72,249.43 352.28,238.45 356.84,225.70 361.41,210.65 365.97,192.59 370.53,170.43 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos tangentes son positivas en el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intervalo, así que se pueden quitar</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los módulos.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambas son continuas y crecientes. Su</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suma tiende a 0 al acercarse a 0 por</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la derecha.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al acercarse a π/2, tan x crece sin</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cota, y tan(x/2) tiende a 1. Se</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanza todo valor positivo por</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">continuidad.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>