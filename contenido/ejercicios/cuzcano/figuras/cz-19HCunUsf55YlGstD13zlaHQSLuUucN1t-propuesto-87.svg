<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">087 · Segmento entre dos cuadrados exteriores</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="250.70,320.31 326.91,320.31 326.91,218.69 250.70,320.31" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="250.70,320.31 326.91,320.31 326.91,396.52 250.70,396.52 250.70,320.31" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="250.70,320.31 326.91,218.69 225.30,142.48 149.09,244.10 250.70,320.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="326.91,396.52 225.30,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="250.7016129032258" y="320.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="326.91129032258067" y="320.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="326.91129032258067" y="218.69354838709674" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="326.91129032258067" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="250.7016129032258" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="225.29838709677418" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="149.08870967741933" y="244.09677419354836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma S=(0,0), R=(−a,0) y T=(0,b). El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrado de RS queda debajo de RS y da</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M=(0,−a).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para el cuadrado de RT, gira el vector</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">RT=(a,b) en 90° hacia afuera. Obtienes</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">TP=(−b,a), así que P=(−b,b+a).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MP²=b²+(b+2a)²=2(2a²+b²+2ab).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>