<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Rango del seno de una función racional</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f</text><polyline points="100.90,348.00 105.47,350.07 110.04,352.22 114.61,354.47 119.18,356.81 123.75,359.25 128.32,361.78 132.89,364.41 137.46,367.13 142.03,369.94 146.60,372.82 151.17,375.77 155.74,378.75 160.31,381.74 164.88,384.70 169.45,387.55 174.02,390.24 178.59,392.64 183.16,394.62 187.73,395.99 192.30,396.52 196.87,395.88 201.44,393.70 206.01,389.50 210.58,382.73 215.15,372.82 219.72,359.25 224.29,341.71 228.86,320.31 233.43,295.79 238.00,269.50 242.57,243.21 247.14,218.69 251.71,197.29 256.28,179.75 260.85,166.18 265.42,156.27 269.99,149.50 274.56,145.30 279.13,143.12 283.70,142.48 288.27,143.01 292.84,144.38 297.41,146.36 301.98,148.76 306.55,151.45 311.12,154.30 315.69,157.26 320.26,160.25 324.83,163.23 329.40,166.18 333.97,169.06 338.54,171.87 343.11,174.59 347.68,177.22 352.25,179.75 356.82,182.19 361.39,184.53 365.96,186.78 370.53,188.93 375.10,191.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">sen(πx/[3(x²+1)])</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La identidad (∣x∣−1)²≥0 da 2∣x∣≤x²+1.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así x/(x²+1) está entre −1/2 y 1/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los extremos se alcanzan en x=−1 y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=1. Por continuidad se cubren todos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los valores intermedios.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El argumento recorre [−π/6,π/6], donde</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el seno es creciente. Evalúa en los</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>