<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Dos ramas inclinadas desde cotas distintas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="171.49,216.29 280.08,216.29 280.08,324.88 171.49,324.88 171.49,216.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="171.49,324.88 106.33,238.01" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="280.08,297.73 366.95,232.58" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645163" y="229.86410092622165" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="231.4929734908975" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="225.78345576493135" y="205.43101245608432" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="138.91025231555415" y="333.5689875439157" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53°</text><text x="318.0862344298946" y="300.99153625039924" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="334.3749600766528" y="322.1668795911849" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ℓ/4</text><text x="225.78345576493135" y="270.5859150431172" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ρ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las alturas de A y B sobre el fondo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son ℓ sen 53° y ℓ/4 + ℓ sen 37°,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respectivamente.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa la aproximación de triángulo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3-4-5. Sus profundidades bajo C son</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ℓ/5 y 3ℓ/20.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como P_C ≈ 0, la razón de presiones es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la razón de esas profundidades.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>