<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Tonel con dos reposiciones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,193.09 100.90,327.93 145.85,327.93 145.85,193.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="177.32,193.09 177.32,327.93 222.27,327.93 222.27,193.09" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="253.73,193.09 253.73,327.93 298.68,327.93 298.68,193.09" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="330.15,193.09 330.15,327.93 375.10,327.93 375.10,193.09" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,238.04 145.85,238.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="177.32,273.99 222.27,273.99" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="253.73,226.80 298.68,226.80" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="330.15,193.09 375.10,193.09" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="123.37810682178741" y="345.9145954521417" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">120 L</text><text x="199.79270227392914" y="345.9145954521417" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">72 L</text><text x="276.2072977260708" y="345.9145954521417" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">135 L</text><text x="352.6218931782126" y="345.9145954521417" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">180 L</text><text x="123.37810682178741" y="287.4799048122686" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">75°</text><text x="199.79270227392914" y="303.2123215230037" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">75°</text><text x="276.2072977260708" y="282.98492860920146" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">47°</text><text x="352.6218931782126" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">51°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El aumento neto de 15 L lleva el nivel</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 2/3 a 3/4. El tonel tiene capacidad</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180 L.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los primeros 120 L están a 75°. Quedan</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">72 L de esa mezcla. Al sumar 63 L al</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15 % y 45 L al 63 %, hay 91,8 L de</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcohol puro en 180 L, es decir 51°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para pasar de 51° a 34° conservando el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">volumen, se retiene 34/51 del</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contenido y se sustituye el resto.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>