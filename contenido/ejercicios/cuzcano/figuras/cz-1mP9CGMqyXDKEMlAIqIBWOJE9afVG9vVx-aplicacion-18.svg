ll="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="351.76,329.01 351.76,235.66 361.10,229.25 364.60,235.66 364.60,329.01" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="179.66,282.33 299.26,282.33" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="286.42,288.75 299.26,282.33 286.42,275.92" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="246.75085792724775" y="272.41695264241594" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="240.9169526424159" y="209.99416609471515" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">núcleo, μᵣ = 100</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el modelo de solenoide largo,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=μᵣμ₀In.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja n=B/(μᵣμ₀I) y sustituye</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">μ₀≈4π×10⁻⁷ T·m/A.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El factor π se cancela y queda</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2×10⁻³/(100×4×10⁻⁷×0,2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>