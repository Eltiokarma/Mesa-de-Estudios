<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">079 · Potencia instantánea con flujo cuadrático</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,321.50 174.82,229.53 375.10,229.53 301.18,321.50 100.90,321.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="188.58,377.37 188.58,161.63" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="194.59,176.24 188.58,161.63 182.56,176.24" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="248.74,377.37 248.74,161.63" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="254.76,176.24 248.74,161.63 242.73,176.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="308.91,377.37 308.91,161.63" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="314.93,176.24 308.91,161.63 302.90,176.24" fill="none" stroke="#008674" stroke-width="2.5"/><text x="241.86793406815653" y="331.816715542522" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Φ(t)</text><text x="329.5411062797047" y="170.22302558398223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="130.12761654363436" y="226.0931843462433" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 Ω</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Deriva el flujo respecto del tiempo:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dΦ/dt=16t−4.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En t=4 s, el módulo de la fem es 60 V.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La potencia instantánea resistiva es</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ε²/R=60²/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>