<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Diagonal del rombo frente a diagonal del cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.24,251.67 194.00,161.35 321.83,161.35 236.15,251.67 109.24,251.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="236.15,251.67 366.30,251.67 366.30,377.19 236.15,377.19 236.15,251.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="109.24,251.67 321.83,161.35" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="183.81,199.79 366.30,377.19" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="244.48,242.87 253.28,251.67 244.95,260.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.9032258064516" y="256.29980383609416" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="193.99934612031387" y="152.0877288578901" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="329.7066259808195" y="154.40355274629468" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="226.88404533565824" y="261.85778116826503" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.0967741935484" y="244.7206843940715" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="371.39145597210114" y="386.9122711421099" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="227.34721011333914" y="386.9122711421099" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="181.49389712292938" y="212.7623147340889" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diagonal OA forma 45° con OS. Como</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OM es perpendicular a OA, ∠MOS=45°.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por alineación, ∠ROM=135°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como OR=OM, el triángulo ROM es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">isósceles y el ángulo en R mide</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(180°−135°)/2=22,5°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo formado por R, O y el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cruce de las diagonales, x es el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo exterior en el cruce. Suma</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">22,5°+45°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>