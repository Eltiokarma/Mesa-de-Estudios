<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Ángulo entre una diagonal y un segmento elevado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,353.00 375.10,353.00 281.62,310.63" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,353.00 225.54,353.00 375.10,353.00 281.62,310.63 100.90,353.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="225.54,353.00 281.62,310.63" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="225.54,353.00 281.62,186.00 281.62,310.63" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645159" y="353.00439882697947" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354836" y="353.00439882697947" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="225.5366568914956" y="353.00439882697947" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="281.6217008797654" y="310.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="281.6217008797654" y="185.9956011730205" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Normaliza las tres longitudes a 1.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma M=(0,0,0), A=(−1,0,0), C=(0,1,0),</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(0,1,1).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los vectores AC=(1,1,0) y MD=(0,1,1)</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen producto 1 y ambos miden √2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El coseno es 1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>