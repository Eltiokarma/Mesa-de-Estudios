<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">055 · Reducción de una desigualdad a un coseno desplazado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Solución entre 0 y 2π</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="186.15384615384613" y1="275" x2="347.6923076923077" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="186.15384615384613" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="347.6923076923077" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="186.15384615384613" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">2π/3</text><text x="347.6923076923077" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">5π/3</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Expande el coseno de la diferencia.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Después de restar sen x queda −(√3 cos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x+sen x)/2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esa expresión es −cos(x−π/6). Se pide</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que cos(x−π/6)&lt;0.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el intervalo dado, π/2&lt;x−π/6&lt;3π/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma π/6 a ambos extremos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>