<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">062 · Gastos de 488 familias</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,380.13 375.10,380.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,380.13 100.90,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,380.13 100.90,321.59 151.68,321.59 151.68,380.13" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="151.68,380.13 151.68,292.33 202.46,292.33 202.46,380.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="202.46,380.13 202.46,175.26 253.23,175.26 253.23,380.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="253.23,380.13 253.23,306.96 304.01,306.96 304.01,380.13" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="304.01,380.13 304.01,292.33 354.79,292.33 354.79,380.13" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100</text><text x="151.67980884109917" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">150</text><text x="202.45639187574673" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">200</text><text x="253.23297491039426" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">250</text><text x="304.0095579450418" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">300</text><text x="354.7861409796894" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">350</text><text x="126.2915173237754" y="309.3022892819979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2a</text><text x="177.06810035842295" y="280.03590010405827" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3a</text><text x="227.84468339307048" y="162.9703433922997" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7a</text><text x="278.62126642771807" y="294.6690946930281" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5b</text><text x="329.39784946236557" y="280.03590010405827" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3a</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La clase modal es [200,250). Usa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">220=200+50(4a)/(11a−5b), de donde</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=5b.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las frecuencias suman 15a+5b=488. Al</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituir, a=30,5 y 5b=30,5. Esto ya</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contradice que 3a, 7a y 5b sean</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conteos enteros.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Interpolar formalmente deja 2/5 de la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuarta barra más toda la última:</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(2/5)5b+3a=103,7. Este valor tampoco</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coincide con las alternativas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>