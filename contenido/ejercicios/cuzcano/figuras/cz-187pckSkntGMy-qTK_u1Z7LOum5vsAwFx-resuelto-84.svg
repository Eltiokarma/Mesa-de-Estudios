"285.5" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">F</text><rect x="333.0" y="322" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">V</text><text x="48" y="397" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Tabla de verdad</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Reemplaza ¬q→p por q∨p.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si una sola variable es verdadera, la</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">disyunción es verdadera y el</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bicondicional falso. Si las dos son</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">falsas, la disyunción es falsa y el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bicondicional verdadero.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con las dos verdaderas ambas fórmulas</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valen verdadero. Es la única fila en</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que coinciden.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>