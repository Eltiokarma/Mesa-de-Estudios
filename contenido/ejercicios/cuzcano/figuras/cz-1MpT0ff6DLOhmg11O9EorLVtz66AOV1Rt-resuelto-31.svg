text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Círculo</text><polyline points="100.90,360.90 238.00,178.10 375.10,360.90 100.90,360.90" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Triángulo</text><polyline points="260.85,303.77 306.55,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">EI</text><polyline points="169.45,269.50 260.85,303.77" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">Recta buscada</text><circle cx="100.90322580645162" cy="360.89784946236557" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="352.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="237.99999999999997" cy="178.1021505376344" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="170.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="375.09677419354836" cy="360.89784946236557" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="352.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="306.54838709677415" cy="269.5" r="3.7" fill="#20364b"/><text x="313.54838709677415" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I</text><circle cx="169.4516129032258" cy="269.5" r="3.7" fill="#20364b"/><text x="176.4516129032258" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="260.8494623655914" cy="303.7741935483871" r="3.7" fill="#20364b"/><text x="267.8494623655914" y="295.7741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">E</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por simetría, A=(12,0) y el punto</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio I de TA es (9,4). El punto medio</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de TO es M=(3,4).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EI es perpendicular a TA, cuyo vector</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">director es (3,−4). Si el radio es r,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E=I−r(4,3)/5 y su ordenada también es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r. De r=4−3r/5 sale r=5/2 y E=(7,5/2).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre M y E, la pendiente es −3/8.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica la ecuación por M.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>