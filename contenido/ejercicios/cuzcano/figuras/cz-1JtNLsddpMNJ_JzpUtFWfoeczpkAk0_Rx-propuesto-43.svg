<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">043 · Espesor de una lámina por su desplazamiento lateral</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,240.71 375.10,240.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,310.90 375.10,310.90" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="357.00,350.94 303.81,310.90 251.71,240.71 181.52,188.06" fill="none" stroke="#008674" stroke-width="2.5"/><text x="153.0" y="223.70967741935485" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">aire</text><text x="189.74193548387098" y="267.0322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n = 4/3</text><text x="331.77419354838713" y="329.5483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="221.0" y="321.3225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ℓ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La incidencia con la normal es i=53°.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con sen 53°≈4/5, Snell da sen r≈3/5 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos r≈4/5.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rayo saliente es paralelo al</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">incidente. La separación perpendicular</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale ℓ sen(i−r)/cos r.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa sen(i−r)=sen i cos r−cos i sen</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r≈7/25. Así 7≈ℓ(7/25)/(4/5).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>