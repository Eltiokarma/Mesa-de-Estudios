 height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="276.0" y="378.57142857142856" width="76.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="314.0" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="352.0" y="378.57142857142856" width="76.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,175</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Pesos de 40 personas</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia de tres marcas</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">consecutivas suma 9 kg, así que las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">marcas son 70, 73, 76, 79, 82 y 85.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos primeras clases tienen 3 y 5</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">datos. La tercera tiene 18−3−5=10 y su</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto medio es 76.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con distribución uniforme en la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tercera clase, estima 8+5=13 personas</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por debajo de 76 y divide por 40.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>