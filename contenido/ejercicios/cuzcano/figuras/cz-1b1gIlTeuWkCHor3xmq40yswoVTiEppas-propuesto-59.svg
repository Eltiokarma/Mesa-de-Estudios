<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">059 · Carbonos terciarios y carbonos de un doble enlace</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="126.81,263.61 173.93,216.50 221.04,263.61 173.93,310.72 126.81,263.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="173.93,216.50 173.93,178.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="221.04,263.61 258.73,263.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="173.93,310.72 173.93,357.84" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="117.39,357.84 173.93,357.84 239.88,357.84 305.84,357.84 362.38,357.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="301.13,350.77 301.13,313.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="310.55,350.77 310.55,313.08" fill="none" stroke="#008674" stroke-width="2.5"/><text x="173.9272807892695" y="169.3863762332336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="268.15186786387324" y="263.61096330783727" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="100.90322580645162" y="357.83555038244094" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="173.9272807892695" y="369.61362376676647" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH</text><text x="239.8844917414921" y="369.61362376676647" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₂</text><text x="305.84170269371464" y="369.61362376676647" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="305.84170269371464" y="302.2430440084248" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₂</text><text x="375.0967741935484" y="357.83555038244094" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el anillo, los tres carbonos con</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituyente se unen cada uno a otros</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tres carbonos.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Fuera del anillo, el CH conectado a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos carbonos de la cadena y al anillo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es el cuarto carbono terciario del</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conteo escolar.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El doble enlace C=CH₂ da dos carbonos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sp². El carbono interno de ese doble</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enlace también tiene tres vecinos</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">carbonados si se aplica esa definición</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sin distinguir la hibridación.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>