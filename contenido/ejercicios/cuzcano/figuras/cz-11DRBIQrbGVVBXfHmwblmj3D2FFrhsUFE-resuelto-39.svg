<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">039 · Longitud de una mediana prolongada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.47,352.46 239.56,184.98 367.31,354.02 109.47,352.46" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.47,352.46 328.36,260.54" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="367.31,354.02 328.36,260.54" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="239.56,184.98 239.56,353.24" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="361.80663489736065" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="239.55791788856305" y="177.19336510263926" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="360.2487170087976" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="303.4325513196481" y="261.320931085044" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="329.91715542521996" y="253.5313416422287" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="315.8958944281525" y="245.74175219941344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 m</text><text x="120.37719941348973" y="347.7853739002932" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="350.1700879765396" y="321.30076979472136" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma M=(0,0), H=(3,0), C=(3,−h),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=(−3,h) y A=(−L,0). Igualar las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangentes de los dos ángulos da</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h/(L+3)=3/h.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De AB=BC resulta (L−3)²+h²=36+4h².</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye h²=3(L+3).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Obtienes L²−15L−54=(L−18)(L+3)=0. La</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud positiva es 18.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>