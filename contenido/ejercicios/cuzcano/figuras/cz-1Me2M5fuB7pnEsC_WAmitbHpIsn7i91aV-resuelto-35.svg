<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Perímetro a partir de un segmento interior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,273.83 168.25,157.18 302.94,157.18 370.29,273.83 302.94,390.48 168.25,390.48 100.90,273.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="168.25,390.48 168.25,157.18" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="168.25,390.48 125.55,231.13" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="125.55,231.13 284.90,323.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="168.25,390.48 370.29,273.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="105.71363893604979" y="265.1706281833616" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="173.05942275042443" y="148.52430894131493" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="307.75099037917374" y="148.52430894131493" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="265.1706281833616" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="307.75099037917374" y="381.8169474254082" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="173.05942275042443" y="381.8169474254083" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="289.7057419924711" y="314.47116361103366" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="130.36390664988576" y="222.47511208282302" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="173.05942275042443" y="247.125379796659" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el hexágono ∠AFB=30° y ∠BFD=60°.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces ∠AFM=15° y ∠AFL=90°. Como</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AF=FL, ∠ALF=45°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠AMF=45°, los ángulos AMF y ALF</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sitúan A,M,L,F en un círculo. Entonces</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠ALM=∠AFM=15°. En L el ángulo PLF mide</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">45°+15°=60°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En F, ∠PFL=60°. El triángulo FPL es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilátero, de modo que FL=PL=4 y el</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perímetro es 6·4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>