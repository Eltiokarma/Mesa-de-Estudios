<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">060 · Área del triángulo de raíces cúbicas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,269.50 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,142.48 238.00,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="330.33,237.53 164.15,205.53 219.52,365.44 330.33,237.53" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="335.70,269.50 334.22,252.53 329.81,236.08 322.61,220.65 312.85,206.70 300.80,194.65 286.85,184.89 271.42,177.69 254.97,173.28 238.00,171.80 221.03,173.28 204.58,177.69 189.15,184.89 175.20,194.65 163.15,206.70 153.39,220.65 146.19,236.08 141.78,252.53 140.30,269.50 141.78,286.47 146.19,302.92 153.39,318.35 163.15,332.30 175.20,344.35 189.15,354.11 204.58,361.31 221.03,365.72 238.00,367.20 254.97,365.72 271.42,361.31 286.85,354.11 300.80,344.35 312.85,332.30 322.61,318.35 329.81,302.92 334.22,286.47 335.70,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="365.01612903225805" y="299.6414705809079" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Re</text><text x="270.65325979598356" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Im</text><text x="341.40595864138936" y="233.69531977987518" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">w1</text><text x="155.289258034299" y="197.85015302393626" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">w2</text><text x="217.30478332431153" y="376.9545271961886" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">w3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El módulo de z es 1/(π/2+1)³. Cada</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">raíz cúbica tiene radio R=1/(π/2+1).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las raíces están separadas 120°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Forman un triángulo equilátero de lado</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√3R.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica la fórmula de área √3 lado²/4 y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituye el radio.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>