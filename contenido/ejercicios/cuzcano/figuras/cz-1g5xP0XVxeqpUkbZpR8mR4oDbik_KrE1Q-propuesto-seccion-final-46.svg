#20364b" text-anchor="middle">32</text><text x="126.2915173237754" y="344.0967741935484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="177.06810035842295" y="287.64516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10</text><text x="227.84468339307048" y="255.38709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">14</text><text x="278.62126642771807" y="207.0" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20</text><text x="329.39784946236557" y="166.67741935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">25</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta acumulados consecutivos. Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frecuencias son 3, 7, 4, 6 y 5.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La posición mediana 12,5 cae en la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tercera clase. La mediana agrupada es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">20+4(12,5−10)/4=22,5.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa las marcas 14, 18, 22, 26 y 30.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma las distancias a 22,5 con sus</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frecuencias y divide entre 25.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>