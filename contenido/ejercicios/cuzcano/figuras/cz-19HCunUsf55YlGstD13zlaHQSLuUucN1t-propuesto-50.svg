 font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="287.35483870967744" y="231.11290322580643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="265.41935483870964" y="274.98387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las distancias entre centros son</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O₁O₂=3, O₁O₃=4 y O₂O₃=5. Así el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo de centros es rectángulo en</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O₁.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como T está en O₃O₂ y O₃T=3, el coseno</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del ángulo O₁O₃T es 4/5.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En O₁O₃T, la ley de cosenos da</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O₁T²=16+9−2·4·3·4/5=29/5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>