<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">093 · Punto de aplicación de dos fuerzas sobre un triángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="113.60,345.26 316.70,345.26 215.15,169.37 113.60,345.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,369.63 113.60,345.26 126.29,369.63 100.90,369.63" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="295.23,308.04 370.02,308.04" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="360.37,312.61 370.02,308.04 360.37,303.47" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="295.23,308.04 331.94,244.47" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="331.07,255.11 331.94,244.47 323.15,250.54" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="215.1505376344086" y="356.93985582040295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="262.8805256869773" y="228.4751007427447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="375.0967741935484" y="297.0234878395189" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="337.01433691756273" y="234.56829070690236" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde el apoyo al punto de aplicación,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la coordenada horizontal es (L+x)/2 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la vertical es √3(L−x)/2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las fuerzas aplicadas suman</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(3W/2,√3W/2). El peso produce momento</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horario WL/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala a cero [(L+x)/2](√3W/2)−[√3(L−x</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">)/2](3W/2)−WL/2. Despeja x.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>