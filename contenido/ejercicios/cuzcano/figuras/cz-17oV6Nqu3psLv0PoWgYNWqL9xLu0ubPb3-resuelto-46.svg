<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">046 · Secante por cosecante del ángulo hacia un punto medio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,188.38 373.47,188.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="345.35,378.74 345.35,160.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="129.03,188.38 237.19,269.50 345.35,350.62 345.35,188.38" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="345.35,188.38 237.19,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,188.38 374.99,190.85 374.69,193.31 374.17,195.73 373.46,198.10 372.56,200.41 371.46,202.63 370.19,204.75 368.74,206.76 367.13,208.64 365.37,210.38 363.47,211.97 361.44,213.39 359.31,214.65 357.07,215.72 354.76,216.60 352.38,217.28 349.95,217.76 347.49,218.05 345.01,218.12 342.54,217.99 340.09,217.65 337.67,217.11 335.31,216.38 333.02,215.44 330.81,214.32 328.70,213.02 326.71,211.55 324.84,209.92 323.12,208.14 321.56,206.22" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="129.025641025641" y="188.37764840618436" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="345.3519119424826" y="350.6223515938156" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="345.3519119424826" y="188.37764840618436" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="237.1887764840618" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="373.474327161672" y="193.7858051791054" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="352.9233314245721" y="160.25523318699493" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="357.5202646815549" y="222.71944391423298" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M=(−4,−3), de norma 5. Así cos θ=−4/5</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y sen θ=−3/5.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los recíprocos son sec θ=−5/4 y csc</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=−5/3. El producto es 25/12.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta −3/5 y reduce a denominador 60.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>