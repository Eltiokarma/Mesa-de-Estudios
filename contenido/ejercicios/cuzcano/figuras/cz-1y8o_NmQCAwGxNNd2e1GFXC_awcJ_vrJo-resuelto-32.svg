<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">032 · Tres segmentos iguales y dos ángulos rectos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="113.41,333.10 113.41,207.99 363.63,207.99 363.63,333.10 113.41,333.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="113.41,333.10 238.52,207.99 363.63,333.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="113.41,320.59 125.92,320.59 125.92,333.10" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="351.12,207.99 351.12,220.50 363.63,220.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="229.14,217.37 238.52,226.75 247.90,217.37" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="105.07,266.37 121.75,266.37" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="173.88,199.65 173.88,216.33" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="301.07,199.65 301.07,216.33" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="101.94578682693488" y="349.7771985772108" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="100.90322580645162" y="193.39304550472218" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="238.52128051024164" y="189.22280142278916" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="373.01165215258186" y="194.43560652520546" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.09677419354836" y="347.6920765362443" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="350.0753097019502" y="308.07475775788055" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa LE=1, L=(0,0), E=(0,1) y D=(d,0).</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si (c,s) es el vector unitario de E a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R, O=(c,1+s) y R=(2c,1+2s).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De LO⊥OD resulta dc=c²+(1+s)²=2+2s. De</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OR⊥RD sale dc=2c²+s(1+2s)=2+s.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto s=0 y, como R está a la</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha de E, c=1. La configuración</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda con O=(1,1), R=(2,1) y D=(2,0).</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo ODR es rectángulo</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">isósceles.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>