<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">076 · Rapidez a partir de dos piezómetros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,280.92 146.60,280.92 146.60,205.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="159.40,205.52 159.40,280.92 215.15,280.92 238.00,298.75 255.37,298.75 255.37,205.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="268.16,205.52 268.16,298.75 292.84,298.75 318.43,280.92 375.10,280.92" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,342.62 215.15,342.62 238.00,328.91 292.84,328.91 318.43,342.62 375.10,342.62" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="146.60,219.23 159.40,219.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="255.37,240.25 268.16,240.25" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="157.56989247311827" y="196.38172043010752" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Piezómetro 1</text><text x="267.247311827957" y="196.38172043010752" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Piezómetro 2</text><text x="206.010752688172" y="230.65591397849462" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Δh = 10 cm</text><text x="155.74193548387098" y="305.1451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 m/s</text><text x="256.2795698924731" y="314.28494623655916" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">v₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia de alturas de los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">niveles libres es la diferencia de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cargas piezométricas, 0,10 m.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Bernoulli convierte esa diferencia en</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(v₂² − v₁²)/(2g).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja v₂ = √(1² + 2×10×0,10) = √3</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>