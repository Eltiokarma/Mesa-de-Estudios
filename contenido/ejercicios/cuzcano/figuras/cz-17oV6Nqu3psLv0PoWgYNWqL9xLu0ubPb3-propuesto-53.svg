<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">053 · Punto recto de un triángulo isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="154.19,370.31 321.81,370.31" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="266.80,396.52 266.80,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="266.80,370.31 180.40,255.10 295.60,168.69 266.80,370.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="286.96,370.31 286.91,368.82 286.74,367.34 286.47,365.88 286.09,364.44 285.61,363.03 285.02,361.67 284.33,360.35 283.55,359.08 282.68,357.88 281.72,356.74 280.68,355.68 279.56,354.69 278.37,353.80 277.12,352.99 275.82,352.27 274.46,351.66 273.07,351.14 271.64,350.73 270.18,350.43 268.71,350.24 267.22,350.15 265.73,350.17 264.25,350.31 262.78,350.55 261.34,350.90 259.92,351.36 258.54,351.91 257.21,352.57 255.93,353.33 254.71,354.18" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="266.8018433179723" y="370.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="180.3963133640553" y="255.09907834101384" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="295.60368663594465" y="168.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="321.81336405529953" y="375.3467741935484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="273.85829493087556" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="274.8663594470046" y="346.9769585253456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio M de OB es (1/2,7/2).</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como OB es hipotenusa, MA=MO=MB.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Gira el vector OB/2 en sentido</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">antihorario 90° para obtener</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MA=(−7/2,1/2). Da A=(−3,4), del lado</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">indicado.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide la abscisa de A por su</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ordenada.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>