<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">115 · Inyectividad de x dividido entre uno más su módulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,378.37 105.47,377.84 110.04,377.27 114.61,376.67 119.18,376.03 123.75,375.35 128.32,374.62 132.89,373.83 137.46,372.99 142.03,372.09 146.60,371.11 151.17,370.05 155.74,368.90 160.31,367.65 164.88,366.27 169.45,364.76 174.02,363.09 178.59,361.23 183.16,359.16 187.73,356.82 192.30,354.18 196.87,351.15 201.44,347.66 206.01,343.59 210.58,338.78 215.15,333.01 219.72,325.95 224.29,317.13 228.86,305.79 233.43,290.67 238.00,269.50 242.57,248.33 247.14,233.21 251.71,221.87 256.28,213.05 260.85,205.99 265.42,200.22 269.99,195.41 274.56,191.34 279.13,187.85 283.70,184.82 288.27,182.18 292.84,179.84 297.41,177.77 301.98,175.91 306.55,174.24 311.12,172.73 315.69,171.35 320.26,170.10 324.83,168.95 329.40,167.89 333.97,166.91 338.54,166.01 343.11,165.17 347.68,164.38 352.25,163.65 356.82,162.97 361.39,162.33 365.96,161.73 370.53,161.16 375.10,160.63" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">G</text><polyline points="100.90,142.48 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">y=1</text><polyline points="100.90,396.52 375.10,396.52" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">y=−1</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x&lt;0 la fórmula es x/(1−x) y en x≥0</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es x/(1+x). Sus derivadas son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivas en los tramos</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">correspondientes.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto cada tramo es estrictamente</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">creciente. La imagen de todo x</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativo es negativa y la de todo x≥0</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es no negativa.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esto conserva el orden incluso al</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cruzar de un tramo al otro. Luego G es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inyectiva.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>