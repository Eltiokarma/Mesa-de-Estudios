<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Área de un triángulo sombreado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="110.41,284.88 170.32,284.88 170.32,319.46" fill="#f4c581" fill-opacity="0.45"/><polyline points="110.41,284.88 170.32,213.49 366.45,284.88 170.32,319.46 110.41,284.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.41,284.88 366.45,284.88" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="170.32,213.49 170.32,319.46" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="163.40,284.88 163.40,277.96 170.32,277.96" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.9032258064516" y="287.4694681239226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="173.7734956003947" y="205.70671636572536" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="288.33406841657074" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="172.04429501509838" y="333.29328363427464" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="178.09649706363547" y="291.79246958716334" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="127.70583487854434" y="278.82346519744107" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5x</text><text x="127.70583487854434" y="295.25087075775593" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3x</text><text x="331.8667595611408" y="278.82346519744107" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2x</text><text x="326.6791578052518" y="295.25087075775593" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En los cuatro triángulos rectos,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OC/OA=tan5x/tan3x=tan2x/tan x. Al</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">transformar productos de senos y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosenos, esta igualdad da sen8x=2cos x</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen3x.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por producto a suma,</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen8x−sen4x=sen2x. La diferencia de</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">senos da 2cos6x sen2x=sen2x.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 0&lt;x&lt;18°, cos6x=1/2 implica x=10°.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces OD=2cot30° y el área es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OD·2/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>