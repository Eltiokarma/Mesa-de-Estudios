ircle cx="146.6021505376344" cy="252.36290322580646" r="3.7" fill="#20364b"/><text x="153.6021505376344" y="244.36290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="237.99999999999997" cy="252.36290322580646" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="244.36290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F</text><circle cx="237.99999999999997" cy="298.06182795698925" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="290.06182795698925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">V</text><circle cx="329.39784946236557" cy="252.36290322580646" r="3.7" fill="#20364b"/><text x="336.39784946236557" y="244.36290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N</text><circle cx="375.09677419354836" cy="229.51344086021507" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="221.51344086021507" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">L</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lado recto mide 4p, por lo que p=2.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El foco está 2 unidades por encima del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértice.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P y N quedan a 4 unidades del foco</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre la cuerda horizontal. Así</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">V=(4,0) y N=(8,2).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta por V y N tiene pendiente</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2/4=1/2. Escribe y=(x−4)/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>