<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Aro y carga con escala ausente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="227.1612903225806" x2="421" y2="227.1612903225806" stroke="#20364b" stroke-width="1.7"/><line x1="153.32258064516128" y1="105" x2="153.32258064516128" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="153.32,396.52 153.32,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">guía</text><polyline points="153.32,227.16 322.68,227.16 322.68,311.84" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">cuerda inicial</text><polyline points="153.32,311.84 322.68,227.16" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">cuerda posterior</text><circle cx="153.32258064516128" cy="227.1612903225806" r="3.7" fill="#20364b"/><text x="160.32258064516128" y="219.1612903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">aro4kg</text><circle cx="322.6774193548387" cy="311.8387096774194" r="3.7" fill="#20364b"/><text x="329.6774193548387" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5kg</text><circle cx="238.0" cy="227.1612903225806" r="3.7" fill="#20364b"/><text x="245.0" y="219.1612903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">distancia a no dada</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el aro baja y, el tramo oblicuo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">crece√(a²+y²)−a y la masa 5 kg sube</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esa distancia.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Energía: [4+5y²/(a²+y²)]v²/2=g[4y−5(√(</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a²+y²)−a)].</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con y=az, v²=2ga[4z−5(√(1+z²)−1)]/[4+5</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">z²/(1+z²)]. La rapidez máxima depende</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de√a; falta escala para valor</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">numérico.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>