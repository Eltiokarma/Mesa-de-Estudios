<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Dos triángulos equiláteros sobre un cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,336.68 100.90,199.58 238.00,199.58 238.00,336.68 100.90,336.68" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,336.68 169.45,217.95 238.00,336.68" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,336.68 356.73,268.13 238.00,199.58" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,336.68 356.73,268.13 169.45,217.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645164" y="357.241935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645164" y="181.75806451612908" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="238.0" y="181.75806451612908" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="238.0" y="357.241935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="169.45161290322582" y="200.95161290322582" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="375.09677419354836" y="268.1290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Da lado 1 al cuadrado, con A=(0,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(1,0), C=(1,1). Entonces</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E=(1/2,√3/2) y F=(1+√3/2,1/2).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta FA tiene pendiente</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/(2+√3)=2−√3, correspondiente a 15°</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto de la horizontal. El rayo</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">apunta a la izquierda y abajo.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">FE tiene pendiente</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−(√3−1)/(√3+1)=−(2−√3) y apunta a la</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda y arriba. Suma las dos</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclinaciones de 15°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>