<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">062 · Objeto a dos focales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="236.64,215.20 229.58,243.44 227.41,269.50 229.58,295.56 236.64,323.80 243.70,295.56 245.87,269.50 243.70,243.44 236.64,215.20" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="128.05,269.50 128.05,239.64 123.71,245.07 128.05,239.64 132.39,245.07" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="345.23,269.50 345.23,299.36" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="128.05110188438198" y="231.49297349089747" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Objeto</text><text x="182.34685404024273" y="278.7302778664963" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="290.9383583519642" y="278.7302778664963" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="345.234110507825" y="309.1358990737783" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa s = 2F en 1/F = 1/s + 1/s′.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La contribución restante es 1/F −</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/(2F) = 1/(2F).</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La imagen se forma a 2F del lado</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuesto. El aumento −1 indica que está</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">invertida y mide lo mismo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>