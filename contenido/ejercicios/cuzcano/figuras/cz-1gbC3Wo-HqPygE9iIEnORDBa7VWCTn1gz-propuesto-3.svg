<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Bisectrices interiores con dos isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="174.72,333.43 137.84,269.54 100.90,205.57 210.58,256.71 375.10,333.43 274.95,333.43 174.72,333.43" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="137.84,269.54 210.58,256.71 274.95,333.43" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="137.84,269.54 274.95,333.43" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="137.84,269.54 186.09,313.74 274.95,333.43" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="174.72239489252468" y="333.42927571479817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="205.57072428520183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="333.42927571479817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="137.83643117675553" y="269.5409124729439" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="210.58064516129033" y="256.71414485704037" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="274.9522831697517" y="333.42927571479817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="186.08852267601608" y="313.7425649084708" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="212.58438895430058" y="266.3321150634895" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">120°</text><text x="192.09975405504682" y="307.3305847708381" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea γ=∠BCA. Por NQ=QC, ∠QNC=γ. Como</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B,N,C están alineados,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠BNM=180°−120°−γ=60°−γ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El isósceles BMN da ∠ABC=60°−γ. En ABC</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se obtiene ∠BAC=120°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I es el incentro de AMQ. En MIQ, los</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos ángulos en la base suman</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(180°−120°)/2=30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>