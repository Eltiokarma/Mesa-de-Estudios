<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Recta por el origen a partir de un cuadrilátero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="303.7741935483871" x2="421" y2="303.7741935483871" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645164" y1="105" x2="100.90322580645164" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polygon points="100.90,303.77 375.10,235.23 375.10,303.77 306.55,269.50" fill="#f4c581" fill-opacity="0.45"/><polyline points="238.00,303.77 238.00,235.23 375.10,235.23 375.10,303.77 238.00,303.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Rectángulo</text><polyline points="238.00,303.77 306.55,269.50 375.10,235.23" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">UT</text><polyline points="100.90,303.77 238.00,235.23" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">L</text><polyline points="100.90,303.77 375.10,235.23 375.10,303.77 306.55,269.50 100.90,303.77" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">OTRA</text><circle cx="100.90322580645164" cy="303.7741935483871" r="3.7" fill="#20364b"/><text x="107.90322580645164" y="295.7741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="238.0" cy="303.7741935483871" r="3.7" fill="#20364b"/><text x="245.0" y="295.7741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">U</text><circle cx="238.0" cy="235.2258064516129" r="3.7" fill="#20364b"/><text x="245.0" y="227.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="375.09677419354836" cy="235.2258064516129" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="227.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="375.09677419354836" cy="303.7741935483871" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="295.7741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="306.54838709677415" cy="269.5" r="3.7" fill="#20364b"/><text x="313.54838709677415" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el ancho del rectángulo es d, las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendientes de UT y OB dan OU=d.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces R=(2d,0), T=(2d,2) y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=(3d/2,1).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo OTR tiene área 2d y el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo ORA que se retira tiene área</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d. Queda d=4.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como B=(4,2), OB tiene pendiente 1/2 y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pasa por O.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>