<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Razón de tres volúmenes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,315.91 169.45,218.97 306.55,218.97 375.10,315.91 100.90,315.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="169.45,218.97 203.73,315.91 272.27,315.91 306.55,218.97" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="286.47,267.44 286.24,272.19 285.54,276.90 284.38,281.51 282.78,285.99 280.75,290.29 278.30,294.37 275.47,298.19 272.27,301.72 268.75,304.91 264.93,307.75 260.85,310.19 256.55,312.22 252.07,313.83 247.46,314.98 242.75,315.68 238.00,315.91 233.25,315.68 228.54,314.98 223.93,313.83 219.45,312.22 215.15,310.19 211.07,307.75 207.25,304.91 203.73,301.72 200.53,298.19 197.70,294.37 195.25,290.29 193.22,285.99 191.62,281.51 190.46,276.90 189.76,272.19 189.53,267.44 189.76,262.69 190.46,257.99 191.62,253.37 193.22,248.89 195.25,244.59 197.70,240.51 200.53,236.69 203.73,233.17 207.25,229.97 211.07,227.14 215.15,224.70 219.45,222.66 223.93,221.06 228.54,219.90 233.25,219.21 238.00,218.97 242.75,219.21 247.46,219.90 252.07,221.06 256.55,222.66 260.85,224.70 264.93,227.14 268.75,229.97 272.27,233.17 275.47,236.69 278.30,240.51 280.75,244.59 282.78,248.89 284.38,253.37 285.54,257.99 286.24,262.69 286.47,267.44" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,315.91 238.00,218.97" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="121.46774193548387" y="327.91054548456174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4a</text><text x="275.70161290322585" y="211.08945451543826" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2a</text><text x="256.8508064516129" y="327.91054548456174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="257.8790322580645" y="267.4435483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">r</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a=√(A/π). Los radios son 4a y 2a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en el mayor, y 2a y a en el menor. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esfera tangente a ambos planos tiene</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radio h/2.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el trapecio axial menor, la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">generatriz mide 3a porque la suma de</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las bases debe igualar la suma de los</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lados oblicuos. Por Pitágoras,</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h²=(3a)²−a²=8a².</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide los tres volúmenes por πha²/3.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para los troncos salen 16+8+4=28 y</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4+2+1=7. Para la esfera sale</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h²/(2a²)=4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>