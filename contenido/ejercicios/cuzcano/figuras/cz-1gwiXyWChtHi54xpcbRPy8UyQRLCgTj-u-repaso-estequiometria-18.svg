<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Concentración desconocida en dos salmueras</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="190.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="143.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Solución</text><rect x="238.0" y="130" width="190.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="333.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Masa de NaCl</text><rect x="48.0" y="178" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Primera</text><rect x="238.0" y="178" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">399,9 g</text><rect x="48.0" y="226" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Segunda</text><rect x="238.0" y="226" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">770,1 g</text><rect x="48.0" y="274" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Mezcla</text><rect x="238.0" y="274" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1170,0 g</text><text x="48" y="349" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Aportes de NaCl</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Bajo conversión y recuperación</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">completas, 710/71=10 mol de Cl₂</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corresponden a 20 mol de NaCl. La</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mezcla tenía 20×58,5=1170 g de NaCl.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La segunda salmuera aporta</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3000×0,2567=770,1 g. La primera aporta</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1170−770,1=399,9 g.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la primera salmuera,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">100×399,9/1000=39,99 %. La alternativa</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 40 %.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>