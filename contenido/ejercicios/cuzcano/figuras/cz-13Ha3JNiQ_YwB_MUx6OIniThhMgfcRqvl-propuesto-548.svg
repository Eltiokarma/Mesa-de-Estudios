<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">548 · Un éter con un grupo isopropoxi</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,251.68 169.45,287.32 238.00,251.68 306.55,287.32 375.10,251.68" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="169.45,287.32 169.45,238.65" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,251.68 238.00,300.35" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="306.55,287.32 306.55,238.65" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="169.45161290322582" y="221.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">OCH(CH₃)₂</text><text x="238.0" y="317.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="306.54838709677415" y="221.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lado más largo contiene una cadena</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">continua de cinco carbonos. Se usa</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pentano como padre.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El otro lado es –O–CH(CH₃)₂, un</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituyente isopropoxi.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambos sentidos dan 2,3,4 para el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conjunto. El prefijo isopropoxi</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">precede a metil y obtiene el 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>