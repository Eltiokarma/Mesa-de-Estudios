<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Una esfera apoyada simétricamente en dos postes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="278.32,195.51 277.71,202.51 275.89,209.30 272.92,215.67 268.89,221.43 263.92,226.40 258.16,230.43 251.79,233.40 245.00,235.22 238.00,235.83 231.00,235.22 224.21,233.40 217.84,230.43 212.08,226.40 207.11,221.43 203.08,215.67 200.11,209.30 198.29,202.51 197.68,195.51 198.29,188.51 200.11,181.72 203.08,175.35 207.11,169.59 212.08,164.62 217.84,160.59 224.21,157.62 231.00,155.80 238.00,155.19 245.00,155.80 251.79,157.62 258.16,160.59 263.92,164.62 268.89,169.59 272.92,175.35 275.89,181.72 277.71,188.51 278.32,195.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="117.03,356.80 213.81,227.77" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="358.97,356.80 262.19,227.77" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,356.80 375.10,356.80" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,235.83 238.00,266.07" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="117.03,373.73 358.97,373.73" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="167.43548387096774" y="283.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="308.56451612903226" y="283.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="238.0" y="195.50806451612905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m</text><text x="248.48387096774192" y="255.18548387096772" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F↓</text><text x="238.0" y="383.81451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6r</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro está a 5r de cada pie,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sumando 4r de poste y r de radio. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semibase de 3r deja una altura de 4r.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por simetría, las dos reacciones</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen la misma magnitud N. Su</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente vertical es N×4/5.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Equilibra el peso y la fuerza</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aplicada. Se cumple 2N×4/5=mg+3mg.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>