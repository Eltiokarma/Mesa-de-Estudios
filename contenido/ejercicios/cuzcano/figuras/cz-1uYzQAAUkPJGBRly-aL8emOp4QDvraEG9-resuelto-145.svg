<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">145 · Alcance dentro del tren</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,227.16 365.02,227.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.98,311.84 110.98,227.16" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="117.98387096774192" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="117.98387096774192" y="219.1612903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="372.01612903225805" y="219.1612903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="117.98387096774192" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Adolfo:x→</text><text x="358.01612903225805" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="end">Angélica:y→</text><text x="202.66129032258064" y="388.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">tren:V→;AB=ℓ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto al tren, el alcance tarda</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t=ℓ/(x−y), con x&gt;y.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto al suelo, Adolfo tiene</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rapidez V+x.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia desde O es ℓ(V+x)/(x−y).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>