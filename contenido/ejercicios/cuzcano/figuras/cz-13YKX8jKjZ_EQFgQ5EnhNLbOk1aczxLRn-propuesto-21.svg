<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Área del triángulo de dos tangentes auxiliares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="365.02,396.52 280.34,142.48 110.98,269.50" fill="#f4c581" fill-opacity="0.45"/><polyline points="110.98,396.52 110.98,142.48 365.02,142.48 365.02,396.52 110.98,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="365.02,396.52 280.34,142.48 110.98,269.50 365.02,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.98,396.52 365.02,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.98,269.50 301.51,205.99" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="365.02,142.48 360.03,142.53 355.04,142.68 350.06,142.92 345.08,143.27 340.12,143.71 335.16,144.24 330.21,144.88 325.28,145.61 320.36,146.44 315.46,147.37 310.57,148.39 305.71,149.50 300.88,150.71 296.06,152.02 291.27,153.42 286.52,154.92 281.79,156.50 277.09,158.19 272.43,159.96 267.80,161.82 263.21,163.77 258.66,165.82 254.15,167.95 249.69,170.17 245.27,172.48 240.89,174.87 236.56,177.35 232.28,179.92 228.06,182.57 223.88,185.30 219.76,188.11 215.70,191.00 211.69,193.97 207.75,197.02 203.86,200.15 200.04,203.35 196.27,206.62 192.58,209.97 188.95,213.40 185.39,216.89 181.90,220.45 178.47,224.08 175.12,227.77 171.85,231.54 168.65,235.36 165.52,239.25 162.47,243.19 159.50,247.20 156.61,251.26 153.80,255.38 151.07,259.56 148.42,263.78 145.85,268.06 143.37,272.39 140.98,276.77 138.67,281.19 136.45,285.65 134.32,290.16 132.27,294.71 130.32,299.30 128.46,303.93 126.69,308.59 125.00,313.29 123.42,318.02 121.92,322.77 120.52,327.56 119.21,332.38 118.00,337.21 116.89,342.07 115.87,346.96 114.94,351.86 114.11,356.78 113.38,361.71 112.74,366.66 112.21,371.62 111.77,376.58 111.42,381.56 111.18,386.54 111.03,391.53 110.98,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="365.01612903225805" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="110.98387096774192" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="110.98387096774192" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="365.01612903225805" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="280.3387096774194" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="110.98387096774192" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="301.508064516129" y="205.99193548387095" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="212.59677419354838" y="193.2903225806451" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con O como origen y eje horizontal</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia D, pon F=(u,s) y U=(s,v). Por</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangentes desde F y U, FU=u+v. Se</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene v=s(s−u)/(s+u).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como E está sobre OF y sobre x+y=s,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E=(su/(s+u),s²/(s+u)). El vector EU es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una rotación de OE de 90°, así EU⊥OF y</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EU=EO.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura desde U hasta OF es EO. Usa</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">FO·EO/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>