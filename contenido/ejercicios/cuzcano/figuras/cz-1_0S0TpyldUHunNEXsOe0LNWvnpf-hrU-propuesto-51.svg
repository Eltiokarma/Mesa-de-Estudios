<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">051 · Masa retirada de un cubo flotante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="132.69,245.66 200.25,245.66 200.25,313.21 132.69,313.21 132.69,245.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="152.17,223.40 180.78,223.40 180.78,245.66 152.17,245.66 152.17,223.40" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="271.78,237.71 339.33,237.71 339.33,305.26 271.78,305.26 271.78,237.71" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,271.09 220.12,271.09" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="245.15,271.49 375.10,271.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="166.4712482468443" y="233.73562412342218" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="220.91257597007947" y="259.16806919121086" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15 cm</text><text x="305.5549322113137" y="315.596306685367" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 cm de arista</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con carga se sumergen 25 cm; sin</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">carga, 20 cm. La pérdida de volumen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desplazado es (0,40)²×0,05 m³.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esa pérdida corresponde a la masa de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agua que equilibraba a M. Multiplica</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por 1000 kg/m³.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sin carga, la mitad del volumen está</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sumergida. La densidad del cubo es la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mitad de la del agua.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>