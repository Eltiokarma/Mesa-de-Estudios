1 206.36,380.23 214.64,379.91 222.86,378.93 230.98,377.32 238.95,375.07 246.72,372.20 254.24,368.74 261.46,364.69 268.35,360.09 274.85,354.96 280.93,349.34 286.55,343.26 291.68,336.76 296.28,329.88 300.33,322.65 303.79,315.13 306.66,307.36 308.91,299.39 310.52,291.27 311.50,283.05 311.82,274.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="143.08684863523573" y="291.6464019851117" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="254.87344913151364" y="321.1749379652606" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="169.4516129032258" y="357.0310173697271" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Sₓ</text><text x="100.90322580645159" y="380.2320099255584" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="100.90322580645159" y="274.7729528535981" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="206.3622828784119" y="380.2320099255584" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="206.3622828784119" y="274.7729528535981" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="380.2320099255584" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="177.06810035842295" y="304.06713537358706" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="206.3622828784119" y="315.3341286505059" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo OCM tiene área r²/2. Se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">divide en OPQM y PCQ, cuya área</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">llamamos K.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo LCF también tiene área</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r²/2, porque LC=r y la distancia de F</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a LC es r.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las regiones LCP, PCQ y CQF forman</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">LCF. Iguala Sₓ+K=A+K+B y resta K.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>