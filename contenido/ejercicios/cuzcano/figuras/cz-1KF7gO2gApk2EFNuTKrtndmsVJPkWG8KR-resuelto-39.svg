<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">039 · Ángulos con una mediana de longitud conocida</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,338.39 238.00,201.29 375.10,338.39 100.90,338.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,201.29 238.00,338.39" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645164" y="349.7016129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.0" y="189.29838709677423" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="349.7016129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="238.0" y="349.7016129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="215.72177419354838" y="233.85483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3x</text><text x="260.2782258064516" y="233.85483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prolonga AB hasta C′, donde corta la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralela a BM por C. Por el teorema de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la base media, CC′=2BM=BC.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el isósceles BCC′, los ángulos en B</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y C′ son iguales. El de C′ mide 3x por</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelismo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En B, el ángulo entre BC y BC′ es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°−(3x+2x). Iguala a 3x.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>