<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">103 · Imagen de un objeto a tres medios de la focal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="199.33,205.59 210.20,237.54 213.39,269.50 210.20,301.46 199.33,333.41 188.47,301.46 185.27,269.50 188.47,237.54 199.33,205.59" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="129.03,269.50 129.03,246.49" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="339.94,269.50 339.94,315.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="129.03,246.49 199.33,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="129.03,246.49 199.33,246.49 339.94,315.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="199.33,269.50 339.94,315.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="129.02564102564102" y="233.70783517557712" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Objeto</text><text x="339.9437551695616" y="327.02312203925106" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen</text><text x="216.58861568538987" y="206.22456575682378" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Lente</text><text x="164.17866004962778" y="285.47864501090305" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3F/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la ecuación de lente, 1/s′ = 1/F −</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2/(3F) = 1/(3F).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El aumento lateral vale −s′/s =</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−3F/(3F/2) = −2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura firmada es −4 cm. Su tamaño</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 4 cm y la imagen se forma</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">invertida.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>