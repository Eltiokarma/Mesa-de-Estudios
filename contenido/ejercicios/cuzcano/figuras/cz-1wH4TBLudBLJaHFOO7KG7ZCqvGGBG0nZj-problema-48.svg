<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Problema 48: Máxima superficie para pintar</title><desc id="desc">Reconstrucción vectorial. Sólido en perspectiva y sección auxiliar con datos y letras.</desc><rect width="900" height="540" rx="18" fill="#f5f8fc"/><text x="28.00" y="36.00" font-family="Arial,sans-serif" font-size="22" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">48  /  Máxima superficie para pintar</text><line x1="460.00" y1="70.00" x2="460.00" y2="490.00" stroke="#d8e2ee" stroke-width="1"/><text x="28.00" y="517.00" font-family="Arial,sans-serif" font-size="14" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Esquema en perspectiva · Las cotas, no la apariencia, definen la geometría.</text><polygon points="550.00,120.00 820.00,120.00 820.00,310.00 550.00,310.00" fill="#e1ecfa" fill-opacity="0.6" stroke="#2463c4" stroke-width="2"/><text x="492.00" y="375.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">x = 5; ancho 3; largo 6</text><text x="492.00" y="402.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">S = (14/9)[81−(x−5)²]</text><text x="492.00" y="429.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Máximo S = 126; 529 es errata.</text><text x="575.00" y="215.00" font-family="Arial,sans-serif" font-size="23" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Caja cerrada</text><text x="565.00" y="255.00" font-family="Arial,sans-serif" font-size="18" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Se pintan seis caras</text><line x1="55.00" y1="415.24" x2="113.28" y2="360.03" stroke="#233b53" stroke-width="1.8"/><line x1="55.00" y1="174.97" x2="113.28" y2="119.76" stroke="#233b53" stroke-width="1.8"/><line x1="55.00" y1="415.24" x2="55.00" y2="174.97" stroke="#233b53" stroke-width="1.8"/><line x1="113.28" y1="360.03" x2="420.00" y2="360.03" stroke="#233b53" stroke-width="1.8"/><line x1="113.28" y1="119.76" x2="420.00" y2="119.76" stroke="#233b53" stroke-width="1.8"/><line x1="113.28" y1="360.03" x2="113.28" y2="119.76" stroke="#233b53" stroke-width="1.8"/><line x1="420.00" y1="360.03" x2="361.72" y2="415.24" stroke="#233b53" stroke-width="1.8"/><line x1="420.00" y1="119.76" x2="361.72" y2="174.97" stroke="#233b53" stroke-width="1.8"/><line x1="420.00" y1="360.03" x2="420.00" y2="119.76" stroke="#233b53" stroke-width="1.8"/><line x1="361.72" y1="415.24" x2="55.00" y2="415.24" stroke="#233b53" stroke-width="1.8"/><line x1="361.72" y1="174.97" x2="55.00" y2="174.97" stroke="#233b53" stroke-width="1.8"/><line x1="361.72" y1="415.24" x2="361.72" y2="174.97" stroke="#233b53" stroke-width="1.8"/></svg>