<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Punto sobre el eje que minimiza una suma de distancias</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="142.74,301.25 333.26,301.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="174.49,396.52 174.49,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="206.25,364.76 269.75,174.24" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="206.25,237.75 227.42,301.25" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="206.25,364.76 206.25,237.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="193.5443548387097" y="234.57056451612905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="193.5443548387097" y="374.28830645161287" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A′</text><text x="279.2802419354839" y="166.29939516129036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="236.41229838709677" y="314.5907258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja A en el eje X y obtén</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A′=(1,−2). Para todo P del eje se</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cumple PA=PA′.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por desigualdad triangular, PA′+PB</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanza el mínimo cuando P está en el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segmento A′B.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta A′B tiene pendiente 3. En</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=0, la ecuación 2=3(x−1) da x=5/3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>