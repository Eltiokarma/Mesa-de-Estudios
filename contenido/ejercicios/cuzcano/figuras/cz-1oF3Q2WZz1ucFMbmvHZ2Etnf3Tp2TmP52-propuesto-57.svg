<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Dos triángulos con un ángulo vertical común</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,275.59 314.16,275.59" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,275.59 192.30,184.20 271.51,354.80" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="241.05,385.27 350.72,275.59 314.16,275.59" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="192.30,184.20 375.10,184.20" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="271.51,354.80 375.10,354.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="192.30,184.20 222.77,153.73" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645163" y="286.2562724014337" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="181.63799283154123" y="177.49283154121864" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="244.09318996415766" y="284.73297491039426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="353.7706093189964" y="275.5931899641577" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="266.9426523297491" y="349.32078853046596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="215.15053763440858" y="176.578853046595" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="272.426523297491" y="366.9910394265233" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="362.91039426523287" y="176.578853046595" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="362.91039426523287" y="347.18817204301075" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el primer isósceles, ∠LSE=∠LES. En</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el segundo, ∠ENI=∠NEI.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ángulos en E son opuestos por el</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértice. Por tanto ∠LSE=∠ENI, y LS∥NI</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por alternos internos.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ es el ángulo agudo que ambas rectas</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">forman con las paralelas. El rayo de N</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">marcado para x va hacia el lado</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuesto.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>