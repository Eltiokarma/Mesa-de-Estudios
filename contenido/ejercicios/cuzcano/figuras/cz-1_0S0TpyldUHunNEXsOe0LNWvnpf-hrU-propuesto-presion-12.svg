<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">012 · Aumento de carga en una prensa con poleas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,312.95 209.04,237.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="146.09,267.76 163.08,267.76 163.08,283.21 146.09,283.21 146.09,267.76" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="162.69,270.85 232.21,218.33 232.21,268.15 249.59,268.15 249.59,208.68" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="249.59,268.15 259.24,291.71 315.24,291.71 315.24,307.15" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="299.79,312.17 299.79,330.32 375.10,330.32 375.10,312.17" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="349.99,289.00 370.08,289.00 370.08,312.17 349.99,312.17 349.99,289.00" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="154.58337119491142" y="263.5140845070423" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="360.03543843707405" y="300.2019536574285" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="238.3861880963199" y="254.24557019536576" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Poleas</text><text x="276.61880963198547" y="283.2096774193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 m</text><text x="307.127669241254" y="283.2096774193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 m</text><text x="309.83098591549293" y="321.8284870513403" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A₁</text><text x="363.1249432076329" y="321.8284870513403" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A velocidad constante, la tensión</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inicial es proporcional al peso de P.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los factores de poleas, palanca y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">áreas se mantienen fijos.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto, la masa de Q equilibrada</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por unidad de masa de P es constante e</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igual a 1600/20 = 80.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide el aumento de Q por ese factor.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>