<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">052 · Esposas y hermanas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="147.27,173.04 328.73,173.04 328.73,142.48 147.27,142.48 147.27,173.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="147.27,220.79 328.73,220.79 328.73,190.23 147.27,190.23 147.27,220.79" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="147.27,268.54 328.73,268.54 328.73,237.98 147.27,237.98 147.27,268.54" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="147.27,316.30 328.73,316.30 328.73,285.74 147.27,285.74 147.27,316.30" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="147.27,364.05 328.73,364.05 328.73,333.49 147.27,333.49 147.27,364.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="156.66171477079797" y="149.76400679117148" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Victoria</text><text x="156.66171477079797" y="197.51443123938878" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Ramona</text><text x="156.66171477079797" y="245.26485568760611" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Sara</text><text x="156.66171477079797" y="293.01528013582345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Lucrecia</text><text x="156.66171477079797" y="340.76570458404075" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">María</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">María es esposa de Ciro por descarte.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La hermana de Ciro es Sara,cuyo marido</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es Darío.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La hermana de Darío es Lucrecia,como</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exige la cadena; las otras hermanas</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son Victoria de Aldo,Ramona de Basilio</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y María de Ernesto.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sara es hermana de Ciro y la esposa de</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ciro es María.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>