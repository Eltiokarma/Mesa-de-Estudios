<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Tapón al fondo de un tubo lleno de agua</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,257.98 100.90,370.40 375.10,370.40 375.10,257.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,288.15 218.81,288.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="254.45,288.15 375.10,288.15" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="218.81,183.95 218.81,345.18" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="254.45,183.95 254.45,345.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="218.81,333.11 254.45,333.11 254.45,345.18 218.81,345.18 218.81,333.11" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="297.2258064516129" y="312.82258064516134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 cm</text><text x="307.64516129032256" y="345.7258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,7 g/cm³</text><text x="235.80645161290323" y="168.59677419354836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="237.99999999999997" y="356.6935483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Tapón</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La presión exterior por encima de la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">atmosférica equivale al peso de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,7×10×4 = 28 g de líquido sobre el</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área del tapón.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El peso propio del tapón ya aporta 2 g</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivalentes hacia abajo. Faltan 26 g</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de agua para anular el contacto en el</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">modelo de tapón delgado.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con densidad 1 g/cm³, el umbral es 26</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cm³. Un volumen mayor lo empuja hacia</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abajo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>