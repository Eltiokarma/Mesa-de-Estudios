<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">072 · Ángulo exacto con una diagonal bisecada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="114.05,255.41 236.12,215.98 371.34,255.41 262.41,317.39 114.05,255.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="114.05,255.41 371.34,255.41" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="236.12,215.98 262.41,317.39" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645163" y="261.048828988069" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="236.12196199734865" y="206.58572691117985" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354836" y="261.048828988069" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="264.29253203711886" y="332.41427308882015" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="245.51215201060538" y="247.90256296950952" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="149.73221387538666" y="246.02452496685817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">14°</text><text x="149.73221387538666" y="281.7072470172338" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">23°</text><text x="322.51171011931064" y="240.3904109589041" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">12,5°</text><text x="330.02386212991604" y="277.9511710119311" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon D=(0,0), O=(2,0), P=(1,0), y t=tan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">14°, u=tan 12,5°, v=tan 23°. Las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectas DA y OA tienen ecuaciones y=tx</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">e y=u(2−x).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La abscisa de A es 2u/(t+u). La recta</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">APN tiene pendiente −r, con</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r=2tu/(t−u). Al cruzarla con y=−vx, N</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene abscisa r/(r−v).</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente del ángulo en O es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vr/(r−2v). Al sustituir los tres</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos dados resulta aproximadamente</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">28,31645°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>