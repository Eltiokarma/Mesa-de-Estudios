<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">056 · Ángulo en un cuadrilátero con tres lados consecutivos iguales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,331.26 177.75,217.33 314.85,207.74 375.10,331.26 100.90,331.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,331.26 314.85,207.74" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="331.2613297010294" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="177.7539735832946" y="217.32541064606477" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="314.850747776843" y="207.7386702989706" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="331.2613297010294" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="142.13269096946755" y="299.6520730760505" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">26°</text><text x="300.178974094362" y="255.67397690216683" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">86°</text><text x="349.6543322899812" y="314.769543635823" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma AB=BC=CD=s. El triángulo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">isósceles ABC da AC=2s cos26°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ACD, la ley de senos exige sen</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=2cos26° sen(94°−θ). El ángulo 64°</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">satisface la relación porque</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen64°=cos26° y sen30°=1/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC y CD con su ángulo comprendido</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fijan un único triángulo, así que</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=64°. Evalúa sen60°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>