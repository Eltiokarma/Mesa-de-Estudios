<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Segmento entre puntos medios de aristas con direcciones ortogonales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="103.33,269.50 165.02,222.89 302.12,222.89" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,204.55 375.10,204.55 229.14,241.23 105.75,334.45 100.90,204.55" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="103.33,269.50 302.12,222.89" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,204.55 229.14,241.23" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="103.33,269.50 165.02,222.89 302.12,222.89" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="100.90322580645162" y="204.54882066359053" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="204.54882066359053" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="105.75032874200457" y="334.4511793364095" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="229.1374255161981" y="241.2253728847966" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="103.3267772742281" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="302.11709985487323" y="222.88709677419357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="165.02032566132488" y="222.88709677419357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea E el punto medio de AD. En ACD, ME</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es paralelo a CD y mide CD/2=4√2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABD, EN es paralelo a AB y mide</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB/2=4√2. Por la ortogonalidad dada,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ME y EN son perpendiculares.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica Pitágoras en MEN.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MN²=(4√2)²+(4√2)²=64.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>