<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Objeto junto a un espejo diagonal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="127.20,155.10 367.42,155.10 367.42,335.26 127.20,335.26 127.20,155.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="127.20,155.10 367.42,335.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="367.42,155.10 194.46,385.71" fill="none" stroke="#008674" stroke-width="2.5"/><text x="374.62491420727525" y="147.8888126286891" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Objeto</text><text x="193.8596431022649" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen</text><text x="247.30851063829786" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 cm</text><text x="101.37508579272476" y="245.17776252573785" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30 cm</text><text x="285.14310226492796" y="284.21345229924503" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Espejo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El objeto y los extremos del espejo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">forman un triángulo rectángulo de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">catetos 40 cm y 30 cm. La diagonal</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mide 50 cm.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia del objeto al espejo es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la altura sobre la hipotenusa. Al</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igualar las dos fórmulas del área,</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale 40·30/50 = 24 cm.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La imagen está 24 cm al otro lado del</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">espejo sobre la misma normal. La</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separación total es 48 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>