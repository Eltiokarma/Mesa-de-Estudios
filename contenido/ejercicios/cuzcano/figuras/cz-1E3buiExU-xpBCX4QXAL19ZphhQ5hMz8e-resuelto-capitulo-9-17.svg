<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Oxígenos en las fórmulas de la tabla</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="86.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">I</text><rect x="124.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="162.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">II</text><rect x="200.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="238.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">III</text><rect x="276.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="314.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">IV</text><rect x="352.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="390.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">V</text><rect x="48.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="86.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">H₃ClO₄</text><rect x="124.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="162.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">H₂C₂O₃</text><rect x="200.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">H₆N₂O₇</text><rect x="276.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="314.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">H₄SO₃</text><rect x="352.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">H₃PO₄</text><text x="48" y="253" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Fórmulas del ejercicio</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Lee el subíndice de O en cada fórmula,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sin sumar el H ni el elemento central.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los subíndices son 4, 3, 7, 3 y 4.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El máximo es 7 y corresponde a la</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tercera fórmula.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>