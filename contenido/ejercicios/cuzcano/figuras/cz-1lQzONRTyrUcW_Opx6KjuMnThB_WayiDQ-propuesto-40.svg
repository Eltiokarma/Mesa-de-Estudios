<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Altura de un triángulo formado por una perpendicular común</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="375.10,185.31 100.90,353.69 318.55,353.69" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,228.03 375.10,185.31 100.90,353.69 318.55,353.69 100.90,228.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,228.03 100.90,353.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,185.31 318.55,353.69" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="318.55,353.69 265.42,252.66" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.9032258064516" y="228.03264706125054" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="185.30870766981167" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="100.9032258064516" y="353.69129233018833" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="318.5503838225264" y="353.69129233018833" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="265.41935483870964" y="252.66174153396236" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Proyectar AB sobre L₂ da CH=AB</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos30°=√15. La componente transversal</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de AB en el plano paralelo a ambas</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">direcciones mide AB sin30°=√5.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como AC también mide √5, resulta</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BH=√10. En el triángulo recto CHB,</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CB=5.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala CH·BH con CB por la altura</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde H.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>