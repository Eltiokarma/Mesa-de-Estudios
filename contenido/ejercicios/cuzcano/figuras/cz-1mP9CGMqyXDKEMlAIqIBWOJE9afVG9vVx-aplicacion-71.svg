<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">071 · Fuerza que mantiene la rapidez de una barra</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,199.82 182.26,199.82 187.53,206.60 197.32,193.04 207.12,206.60 216.91,193.04 226.70,206.60 236.49,193.04 246.29,206.60 254.57,199.82 332.91,199.82 332.91,350.48 100.90,350.48 100.90,199.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,199.82 375.10,199.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,350.48 375.10,350.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="332.91,193.80 332.91,356.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="327.64,276.66 262.10,276.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="274.16,271.38 262.10,276.66 274.16,281.93" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="216.90818858560795" y="182.49627791563273" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="216.90818858560795" y="313.56682027649765" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="317.09429280397023" y="226.18645870258771" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙ B</text><text x="293.7426444523219" y="289.4618929457639" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">v₀</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al moverse la barra, la fem es Bv₀L y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la corriente tiene módulo Bv₀L/R.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza magnética de módulo ILB se</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opone al movimiento, como exige la ley</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de Lenz.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para rapidez constante la fuerza</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">externa la equilibra. Sustituye I en</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ILB.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>