<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">075 · Períodos de una suma con cotangente y una potencia impar</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="64" y="160" font-family="Arial,sans-serif" font-size="19" fill="#1766b0" text-anchor="start">RELACIONES DEL PROBLEMA</text><text x="64" y="208" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los polos de la primera función están</text><text x="64" y="231" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separados por 3π. Un período debe ser</text><text x="64" y="254" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">múltiplo de 3π.</text><text x="64" y="293" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al desplazar 3π la cotangente</text><text x="64" y="316" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">permanece igual, pero cos x cambia de</text><text x="64" y="339" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">signo. El menor múltiplo que también</text><text x="64" y="362" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva el coseno es 6π.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los polos de la primera función están</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separados por 3π. Un período debe ser</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">múltiplo de 3π.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al desplazar 3π la cotangente</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">permanece igual, pero cos x cambia de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">signo. El menor múltiplo que también</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva el coseno es 6π.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para la segunda, los polos están</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separados por π/3 y ese mismo</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desplazamiento conserva la función.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>