<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Ángulo entre una bisectriz y una paralela</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,350.39 375.10,350.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,350.39 283.70,258.99" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,350.39 161.84,198.06" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,350.39 253.23,185.87" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,350.39 375.10,281.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="161.84,198.06 253.23,175.21" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645163" y="368.66666666666663" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.09677419354836" y="365.6200716845878" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="283.69892473118273" y="258.98924731182797" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="161.83512544802866" y="187.6989247311828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="239.82795698924727" y="170.33333333333337" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="301.9784946236558" y="191.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">MN ∥ bisectriz de AOB</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a=∠AOB y b=∠BOC. Las dos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisectrices forman con OA los ángulos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a/2 y (a+b)/2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por paralelismo, el ángulo MNO en esta</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">disposición es su diferencia, b/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 0&lt;b&lt;90°, resulta 0&lt;MNO&lt;45°. El</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mayor entero es 44.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>