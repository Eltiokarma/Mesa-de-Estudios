<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Signo de un radicando racional en seno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Dominio en radianes</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="82.94871794871796" y1="275" x2="112.86324786324786" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="82.94871794871796" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="112.86324786324786" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><line x1="232.52136752136752" y1="275" x2="262.43589743589746" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="232.52136752136752" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="262.43589743589746" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><line x1="322.2649572649572" y1="275" x2="382.0940170940171" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="322.2649572649572" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="382.0940170940171" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="82.94871794871796" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">0</text><text x="112.86324786324786" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/6</text><text x="232.52136752136752" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">5π/6</text><text x="262.43589743589746" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π</text><text x="322.2649572649572" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">4π/3</text><text x="382.0940170940171" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">5π/3</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea t=sen x∈[−1,1]. Los puntos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">críticos son −√3/2, 0 y ½. En t=0 el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cociente no existe.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cuadro de signos deja t≤−√3/2 o</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0&lt;t≤½.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Lleva ambos conjuntos al intervalo</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">angular pedido, incluyendo los ceros</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del numerador.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>