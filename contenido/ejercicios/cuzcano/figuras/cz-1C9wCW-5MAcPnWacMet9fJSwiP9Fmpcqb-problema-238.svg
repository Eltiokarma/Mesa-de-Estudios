<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">238 · Diez decibelios más</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">P/Pinicial</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">nivel (dB)</text><polyline points="128.32,170.71 132.44,169.00 136.55,167.49 140.66,166.15 144.77,164.95 148.89,163.85 153.00,162.84 157.11,161.91 161.23,161.04 165.34,160.24 169.45,159.48 173.56,158.76 177.68,158.09 181.79,157.45 185.90,156.84 190.02,156.26 194.13,155.71 198.24,155.18 202.35,154.67 206.47,154.18 210.58,153.72 214.69,153.26 218.81,152.83 222.92,152.41 227.03,152.00 231.15,151.61 235.26,151.23 239.37,150.86 243.48,150.50 247.60,150.15 251.71,149.81 255.82,149.48 259.94,149.16 264.05,148.85 268.16,148.54 272.27,148.25 276.39,147.95 280.50,147.67 284.61,147.39 288.73,147.12 292.84,146.86 296.95,146.60 301.06,146.34 305.18,146.09 309.29,145.85 313.40,145.61 317.52,145.37 321.63,145.14 325.74,144.92 329.85,144.69 333.97,144.48 338.08,144.26 342.19,144.05 346.31,143.84 350.42,143.64 354.53,143.44 358.65,143.24 362.76,143.05 366.87,142.86 370.98,142.67 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">mismo punto</text><circle cx="375.0967741935484" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">final</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Δβ=10log10(P2/P1)=10 dB.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P2/P1=10: la potencia final debe ser</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diez veces la inicial.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El incremento es ΔP=9P1, es decir900%</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la inicial. La opción9 expresa ese</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">incremento, no el factor multiplicador</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">final.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>