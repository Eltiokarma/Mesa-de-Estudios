<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Base superior con un corte a un cuarto de altura</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="117.90,330.81 140.86,207.27 233.64,207.27 347.08,330.81 117.90,330.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="123.87,299.58 317.69,299.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="101.82,330.81 125.25,207.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="263.95,206.35 375.10,324.84" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="111.92608202301831" y="340.0003512184579" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="139.94250824012536" y="198.08107743016154" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="234.5553574323229" y="197.62179175447125" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="352.5917760847247" y="341.37820824552875" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="189.08607553898526" y="197.62179175447125" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="215.72464472902143" y="290.856783919598" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16</text><text x="219.3989301345437" y="339.08177986707733" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20</text><text x="105.4960825633544" y="255.95107256713675" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3a</text><text x="100.90322580645162" y="314.7396390554925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="312.6339222996704" y="249.06178743178256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3b</text><text x="362.6960609499109" y="306.93178256875774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos puntos del corte están a una</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuarta parte del recorrido desde PN a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CM.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La longitud de un corte paralelo varía</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">linealmente entre las bases. Por eso</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">16=20+(x−20)/4.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja x=20+4(16−20).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>