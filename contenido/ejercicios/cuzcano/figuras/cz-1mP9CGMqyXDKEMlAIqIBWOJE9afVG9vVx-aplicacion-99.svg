008674" stroke-width="2.5"/><text x="119.722992711953" y="235.12778683231343" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I (A)</text><text x="375.09677419354847" y="276.42671976383036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t (s)</text><text x="101.16461145791689" y="258.65249546419017" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="100.90322580645159" y="297.86034318398475" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">−10</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La amplitud es 10 A y la corriente</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">eficaz vale 10/√2=5√2 A.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe I(t)=10 sen(4πt+φ). En t=0 se</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cumple sen φ=1/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La gráfica empieza subiendo, así que</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos φ es positivo y φ=π/6 módulo 2π.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>