<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">108 · Período fundamental de la parte fraccionaria</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="210.5806451612903" y1="105" x2="210.5806451612903" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 155.74,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">x−⌊x⌋</text><polyline points="155.74,396.52 210.58,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">x−⌊x⌋</text><polyline points="210.58,396.52 265.42,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">x−⌊x⌋</text><polyline points="265.42,396.52 320.26,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">x−⌊x⌋</text><polyline points="320.26,396.52 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="503" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">x−⌊x⌋</text><circle cx="100.90322580645162" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">-2</text><circle cx="155.74193548387098" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="162.74193548387098" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">-1</text><circle cx="210.5806451612903" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="217.5806451612903" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">0</text><circle cx="265.41935483870964" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="272.41935483870964" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><circle cx="320.258064516129" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="327.258064516129" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><circle cx="375.09677419354836" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><circle cx="155.74193548387098" cy="142.48387096774195" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="162.74193548387098" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="210.5806451612903" cy="142.48387096774195" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="217.5806451612903" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="265.41935483870964" cy="142.48387096774195" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="272.41935483870964" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="320.258064516129" cy="142.48387096774195" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="327.258064516129" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="375.09677419354836" cy="142.48387096774195" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="382.09677419354836" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para todo entero n, ⌊x+n⌋=⌊x⌋+n.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces F(x+n)=F(x).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si p es período, F(p)=F(0)=0. Eso</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exige p=⌊p⌋, así que p es entero.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El menor entero positivo es 1 y</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">satisface la identidad para todo x.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>