<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">002 · Acción y reacción al lanzar una pelota</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="125.46,225.92 170.47,225.92 170.47,289.35 125.46,289.35 125.46,225.92" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,289.35 211.40,289.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="336.22,230.01 336.02,232.00 335.44,233.92 334.49,235.69 333.22,237.24 331.67,238.51 329.90,239.46 327.98,240.04 325.99,240.24 323.99,240.04 322.07,239.46 320.30,238.51 318.75,237.24 317.48,235.69 316.54,233.92 315.95,232.00 315.76,230.01 315.95,228.01 316.54,226.09 317.48,224.32 318.75,222.77 320.30,221.50 322.07,220.56 323.99,219.97 325.99,219.78 327.98,219.97 329.90,220.56 331.67,221.50 333.22,222.77 334.49,224.32 335.44,226.09 336.02,228.01 336.22,230.01" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="147.97,250.47 100.90,250.47" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="111.13,245.35 100.90,250.47 111.13,255.59" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="147.97,250.47 147.97,328.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="142.85,318.00 147.97,328.23 153.08,318.00" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="147.97,289.35 201.17,232.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="197.95,243.03 201.17,232.05 190.46,236.07" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="325.99,230.01 375.10,230.01" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="364.87,235.12 375.10,230.01 364.87,224.89" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="325.99,230.01 325.99,285.26" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="320.87,275.02 325.99,285.26 331.10,275.02" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="148.37554164660565" y="216.0936446798267" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Juanito</text><text x="328.0337024554646" y="210.77347135291288" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Pelota</text><text x="102.94944631680308" y="240.23904670197402" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="152.05873856523831" y="324.9525758305248" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Mg</text><text x="204.85122773230623" y="228.78021184400578" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R del suelo</text><text x="372.64130958112656" y="221.00457390467022" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="333.35387578237845" y="284.02816562349545" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">mg</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sobre la pelota actúan su peso mg</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia abajo y el empuje F de la mano</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia la derecha.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pelota ejerce sobre la mano una</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerza F hacia la izquierda. Sobre</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Juanito actúa además su peso Mg.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El piso proporciona una normal hacia</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arriba y rozamiento estático hacia la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha. Su resultante apunta arriba y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a la derecha.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>