<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Suma por tramos de funciones con parte entera</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,142.48 238.00,227.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">4−2x</text><polyline points="238.00,269.50 240.28,268.08 242.57,266.63 244.85,265.16 247.14,263.67 249.42,262.15 251.71,260.61 253.99,259.04 256.28,257.46 258.56,255.85 260.85,254.21 263.13,252.55 265.42,250.87 267.70,249.17 269.99,247.44 272.27,245.68 274.56,243.91 276.84,242.11 279.13,240.29 281.41,238.44 283.70,236.57 285.98,234.68 288.27,232.76 290.55,230.82 292.84,228.85 295.12,226.87 297.41,224.86 299.69,222.82 301.98,220.76 304.26,218.68 306.55,216.58 308.83,214.45 311.12,212.30 313.40,210.12 315.69,207.92 317.97,205.70 320.26,203.45 322.54,201.18 324.83,198.89 327.11,196.57 329.40,194.23 331.68,191.87 333.97,189.48 336.25,187.07 338.54,184.63 340.82,182.18 343.11,179.69 345.39,177.19 347.68,174.66 349.96,172.11 352.25,169.53 354.53,166.93 356.82,164.31 359.10,161.67 361.39,159.00 363.67,156.30 365.96,153.59 368.24,150.85 370.53,148.08 372.81,145.29 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">x²+2x+3</text><circle cx="238.0" cy="269.5" r="3.7" fill="#20364b"/><text x="245.0" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,3)</text><circle cx="100.90322580645162" cy="142.48387096774195" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="107.90322580645162" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="238.0" cy="227.16129032258064" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="245.0" y="219.16129032258064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="375.0967741935484" cy="142.48387096774195" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="382.0967741935484" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El dominio común es (−1,1). En −1&lt;x&lt;0</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las partes enteras de F y G son 2. El</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valor absoluto de 2x es −2x. La suma</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da 4−2x.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para 0≤x&lt;1 las partes enteras son 3 en</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F y 0 en G. La suma es x²+2x+3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La rama izquierda se acerca a (0,4),</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abierto. La derecha empieza en (0,3),</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cerrado. También se excluyen x=−1 y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>