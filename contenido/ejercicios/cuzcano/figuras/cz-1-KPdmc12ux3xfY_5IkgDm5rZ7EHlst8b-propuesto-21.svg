<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Amplitud ycompresión máxima no coinciden</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">altura H (ejemplo:ℓ0=1,d=0,2)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">amplitud real (m)</text><polyline points="155.74,356.84 159.40,345.30 163.05,335.91 166.71,327.80 170.37,320.55 174.02,313.93 177.68,307.80 181.33,302.08 184.99,296.67 188.65,291.55 192.30,286.67 195.96,281.99 199.61,277.50 203.27,273.17 206.92,268.98 210.58,264.94 214.24,261.01 217.89,257.19 221.55,253.47 225.20,249.85 228.86,246.32 232.52,242.86 236.17,239.49 239.83,236.18 243.48,232.94 247.14,229.76 250.80,226.65 254.45,223.58 258.11,220.58 261.76,217.62 265.42,214.71 269.08,211.85 272.73,209.03 276.39,206.25 280.04,203.51 283.70,200.81 287.35,198.15 291.01,195.52 294.67,192.93 298.32,190.37 301.98,187.84 305.63,185.34 309.29,182.87 312.95,180.43 316.60,178.01 320.26,175.63 323.91,173.26 327.57,170.92 331.23,168.61 334.88,166.32 338.54,164.05 342.19,161.81 345.85,159.58 349.51,157.38 353.16,155.19 356.82,153.03 360.47,150.88 364.13,148.76 367.78,146.65 371.44,144.56 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">A desde equilibrio</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea d=mg/k y h=H−ℓ0. Amplitud respecto</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del equilibrio cumpleA²=d²+2dh.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para amplitud 2A:4A²=d²+2d(H′−ℓ0), así</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H′=4H−3ℓ0+3d/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La opción4H−3ℓ0+2A sólo resulta si A</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">denota compresión máxima desde</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud natural, no amplitud del MAS.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>