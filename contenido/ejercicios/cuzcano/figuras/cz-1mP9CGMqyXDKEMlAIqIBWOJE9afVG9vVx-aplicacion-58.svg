<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Placa cuadrada que gira alrededor de z</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="123.21,262.03 225.77,193.43 225.77,327.91 123.21,396.52 123.21,262.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="225.77,193.43 225.77,143.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="225.77,327.91 366.37,327.91" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="164.64,294.63 315.43,294.63" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="303.89,289.88 315.43,294.63 303.89,299.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="251.58,168.97 251.47,169.67 251.14,170.36 250.58,171.04 249.81,171.70 248.83,172.34 247.65,172.95 246.28,173.52 244.73,174.05 243.02,174.54 241.16,174.98 239.16,175.37 237.05,175.71 234.84,175.98 232.55,176.20 230.20,176.35 227.81,176.44 225.41,176.46 223.01,176.42 220.63,176.31 218.30,176.14 216.03,175.91 213.85,175.61 211.77,175.26 209.81,174.86 207.99,174.40 206.33,173.90 204.83,173.35 203.52,172.76 202.40,172.15 201.48,171.50 200.77,170.84 200.28,170.15 200.02,169.46 199.97,168.76 200.15,168.07 200.56,167.38 201.18,166.70 202.01,166.05 203.06,165.42 204.29,164.82 205.72,164.26 207.32,163.74 209.08,163.26 210.99,162.84 213.02,162.47 215.16,162.15 217.40,161.89 219.71,161.70 222.07,161.57 224.47,161.50 226.87,161.50 229.27,161.56 231.63,161.68 233.95,161.87 236.19,162.13 238.35,162.44 240.39,162.80 242.31,163.23 244.08,163.70 245.69,164.21 247.14,164.77 248.39,165.37" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="168.7184750733138" y="221.95385544247026" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="109.62540969466968" y="329.95152665171645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="307.9607555632224" y="279.00922891150594" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B₀</text><text x="235.96230809039162" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z</text><text x="365.01612903225805" y="344.21537001897536" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="182.30308780403658" y="170.3323270657237" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">giro 30°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al inicio la normal apunta en la misma</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dirección que B, así que Φᵢ=B₀a².</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al girar 30°, la normal forma 30° con</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el campo y Φ_f=B₀a² cos 30°.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta el flujo inicial al final para</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtener el cambio con signo, que es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>