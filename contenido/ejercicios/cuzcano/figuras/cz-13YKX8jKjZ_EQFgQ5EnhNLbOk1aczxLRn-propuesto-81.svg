<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">081 · Área de un hexágono definido por simetrías en medianas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="150.76,306.89 100.90,232.11 238.00,269.50 325.24,232.11 375.10,306.89 287.85,344.28" fill="#f4c581" fill-opacity="0.45"/><polygon points="169.45,250.80 188.15,194.72 281.62,250.80 238.00,269.50" fill="#f4c581" fill-opacity="0.45"/><polyline points="150.76,306.89 188.15,194.72 375.10,306.89 150.76,306.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="150.76,306.89 281.62,250.80 325.24,232.11" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="188.15,194.72 262.93,306.89 287.85,344.28" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,306.89 169.45,250.80 100.90,232.11" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="150.76,306.89 100.90,232.11 238.00,269.50 325.24,232.11 375.10,306.89 287.85,344.28 150.76,306.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="150.75659824046923" y="306.8900293255132" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="188.14662756598244" y="194.71994134897363" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="306.8900293255132" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="238.0" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="169.45161290322582" y="250.8049853372434" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="281.6217008797654" y="250.8049853372434" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="262.9266862170088" y="306.8900293255132" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="325.24340175953074" y="232.10997067448682" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="287.8533724340176" y="344.28005865102637" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="100.90322580645162" y="232.10997067448682" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las razones se conservan por</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">transformaciones afines. Usa A=(0,0),</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=(1,3), C=(6,0), G=(7/3,1).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los reflejos son P=(14/3,2),</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Q=(11/3,−1), R=(−4/3,2). Calcula por</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">determinantes [ARGPCQ]=12 en esta</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">escala.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para la misma escala, M=(1/2,3/2),</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N=(7/2,3/2) y [MBNG]=3. La razón es 4.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica el dato original por 4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>