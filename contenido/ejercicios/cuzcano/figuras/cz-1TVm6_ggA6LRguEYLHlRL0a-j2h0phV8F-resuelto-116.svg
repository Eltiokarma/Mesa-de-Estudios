<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">116 · Ángulo central entre los pies de dos alturas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.50,332.75 196.25,206.25 365.13,332.75 111.50,332.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="196.25,206.25 196.25,332.75" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="365.13,332.75 189.64,216.09" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="196.25,332.75 280.69,269.50 189.64,216.09" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645163" y="342.0989736070381" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="196.2478005865103" y="193.78519061583577" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="342.7221407624633" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="196.2478005865103" y="345.2148093841642" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="183.1612903225806" y="223.69721407624635" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="290.34604105571844" y="269.18841642228733" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="137.6700879765396" y="323.4039589442815" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ω</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ángulos BHC y BQC son rectos, así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que H y Q pertenecen a la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">circunferencia de diámetro BC y centro</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo inscrito ∠HBQ se forma entre</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la perpendicular a AC y el lado AB.</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Mide 90° − ω.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo central que abarca el mismo</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arco mide dos veces el inscrito, 180°</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">− 2ω.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>