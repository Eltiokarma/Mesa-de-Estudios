<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Rango de un cociente en el coseno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">u = cos x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f</text><polyline points="100.90,237.75 105.47,236.95 110.04,236.13 114.61,235.30 119.18,234.46 123.75,233.60 128.32,232.73 132.89,231.84 137.46,230.94 142.03,230.02 146.60,229.09 151.17,228.13 155.74,227.16 160.31,226.17 164.88,225.16 169.45,224.14 174.02,223.09 178.59,222.02 183.16,220.94 187.73,219.83 192.30,218.69 196.87,217.54 201.44,216.36 206.01,215.16 210.58,213.93 215.15,212.68 219.72,211.40 224.29,210.09 228.86,208.75 233.43,207.39 238.00,205.99 242.57,204.56 247.14,203.11 251.71,201.61 256.28,200.08 260.85,198.52 265.42,196.92 269.99,195.28 274.56,193.60 279.13,191.88 283.70,190.11 288.27,188.31 292.84,186.45 297.41,184.55 301.98,182.59 306.55,180.59 311.12,178.53 315.69,176.41 320.26,174.24 324.83,172.00 329.40,169.70 333.97,167.33 338.54,164.90 343.11,162.39 347.68,159.80 352.25,157.14 356.82,154.39 361.39,151.56 365.96,148.63 370.53,145.61 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">3/(3−u)+1/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon u=cos x∈[−1,1]. Entonces</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∣u−3∣=3−u.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La expresión dentro del valor absoluto</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior es u/(3−u)+1=3/(3−u)&gt;0.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El denominador va de 2 a 4. El</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cociente recorre [3/4,3/2] y al sumar</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/2 queda [5/4,2].</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>