<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">091 · Dos ángulos de un triángulo isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="135.54,388.27 290.19,150.14 345.17,388.27 135.54,388.27 240.36,287.06 290.19,150.14" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="240.36,287.06 345.17,388.27" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="126.71114001374609" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="290.1895192784438" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="349.2888599862539" y="395.92729908524086" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="235.64468021193113" y="282.34635851923025" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="156.74146731162415" y="383.56187019787933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">44°</text><text x="157.91912720565855" y="362.9528220522767" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">13°</text><text x="331.0351316287202" y="367.07463168139725" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">33°</text><text x="282.53472996721996" y="171.33653837158556" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="264.77407753835257" y="219.9670125653309" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=</text><text x="294.8574196839824" y="339.6890641682655" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prolonga OM hasta R con MR=MO. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">círculo de centro M pasa por R,I,O.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠IOM=∠MIO=33°, el central IMO</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale 114°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El inscrito IRO vale 57°. En D,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠IDO=13°+44°=57°, por lo que D</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pertenece al mismo círculo.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así DM=IM, y en el isósceles DMI se</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cumple ∠DIM=∠IDM.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>