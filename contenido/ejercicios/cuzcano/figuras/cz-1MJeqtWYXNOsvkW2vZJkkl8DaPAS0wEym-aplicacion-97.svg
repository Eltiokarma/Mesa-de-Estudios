<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">097 · Esquiador con rapidez constante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,372.80 375.10,372.80 375.10,166.20 100.90,372.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="220.15,279.06 253.30,254.20 274.98,282.25 241.83,307.12 220.15,279.06" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="218.23,283.53 195.91,300.11 199.10,292.46" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="195.91,300.11 204.20,298.83" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="146.18,372.80 144.26,362.60 137.89,346.02" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="153.82895723930983" y="365.78657164291076" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="237.3623405851463" y="280.34021005251316" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">80 kg</text><text x="180.6106526631658" y="290.54276069017254" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">v</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El peso del esquiador es 80×10=800 N.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su componente paralela al plano es 800</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 37°, dirigida cuesta abajo.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como la aceleración es cero, la</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fricción cinética compensa esta</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente. Con sen 37°≈3/5 se obtiene</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">480 N.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>