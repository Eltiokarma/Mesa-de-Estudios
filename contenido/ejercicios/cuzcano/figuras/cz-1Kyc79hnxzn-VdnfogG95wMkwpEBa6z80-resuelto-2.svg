<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">002 · Triángulos con a lo más dos regiones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,372.32 238.00,166.68 375.10,372.32 100.90,372.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="146.60,303.77 329.40,303.77" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,166.68 169.45,372.32" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,166.68 238.00,372.32" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,166.68 306.55,372.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Un triángulo se elige con dos de los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cinco rayos y uno de los dos niveles</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de base: 2C(5,2)=20.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con base en el nivel intermedio, son</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">válidos los cuatro intervalos de un</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sector y los tres de dos. Con base</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abajo, solo los cuatro intervalos de</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un sector contienen dos regiones</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay 7+4=11 favorables entre 20.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>