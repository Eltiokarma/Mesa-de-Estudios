<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Recorrido y desplazamiento</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,372.32 375.10,372.32 375.10,166.68" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">bordes</text><line x1="375.0967741935484" y1="166.67741935483872" x2="379.1743787241441" y2="175.8083087579618" stroke="#1766b0" stroke-width="2"/><line x1="375.0967741935484" y1="166.67741935483872" x2="371.0191696629527" y2="175.8083087579618" stroke="#1766b0" stroke-width="2"/><polyline points="100.90,372.32 375.10,166.68" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">desplazamiento</text><line x1="375.0967741935484" y1="166.67741935483872" x2="370.2386253894074" y2="175.41803662118912" stroke="#d37618" stroke-width="2"/><line x1="375.0967741935484" y1="166.67741935483872" x2="365.34549995269253" y2="168.893869372236" stroke="#d37618" stroke-width="2"/><text x="107.9032258064516" y="364.3225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="382.0967741935484" y="158.67741935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="244.99999999999997" y="364.3225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">80 cm</text><text x="382.0967741935484" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">60 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El recorrido sobre los bordes es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">80+60=140 cm.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El desplazamiento tiene módulo</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(80²+60²)=100 cm.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Rapidez=140/50=2,8 cm/s;</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∣vmedia∣=100/50=2 cm/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>