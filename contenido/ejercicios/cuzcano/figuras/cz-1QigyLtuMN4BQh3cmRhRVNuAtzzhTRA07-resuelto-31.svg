61.88 121.58,265.65 119.27,269.50 117.09,273.42 115.04,277.41 113.12,281.47 111.34,285.58 109.69,289.76 108.18,293.98 106.81,298.25 105.57,302.57 104.48,306.92 103.54,311.30 102.73,315.72 102.08,320.15 101.56,324.61 101.20,329.08 100.98,333.56 100.90,338.05" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="238.0" y="338.04838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="163.8037604638278" y="338.04838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.0" y="263.852147560602" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="290.46466411456873" y="211.3874834460333" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="185.53533588543124" y="211.3874834460333" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="258.9858656458275" y="239.93946520253064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">√2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta tiene inclinación 45°. Al</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">avanzar √2 desde (0,√2), sus</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes horizontal y vertical</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aumentan 1.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto N=(1,√2+1). Reflejar N en el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">eje vertical produce una cuerda</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal de 2 que subtiende 45° en</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras, ON²=1+(√2+1)²=4+2√2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>