<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">051 · Ángulo agudo entre dos bisectrices de un triángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="106.96,315.94 369.44,315.94 330.61,222.75 106.96,315.94" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="369.44,315.94 268.49,248.64" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="330.61,222.75 292.24,315.94" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="322.60228514418736" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="320.7850966791772" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="334.1090788160958" y="216.39771485581264" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="319.7734809254597" y="286.2585158439831" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La condición da a+b=5c. Como b es la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hipotenusa, (b−a)(b+a)=c² y de ahí</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b−a=c/5.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se obtiene a=12c/5 y b=13c/5. El</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo obtuso entre las bisectrices es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">90°+C/2 por la suma angular en el</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo del incentro.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente del ángulo suplementario</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es cot(C/2)=(1+cos C)/sen C=(a+b)/c.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>