<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">238 · Ángulo en la base a partir de una altura</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.76,318.75 282.41,220.25 365.01,318.75 111.76,318.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="282.41,220.25 282.41,318.75" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="111.76,318.75 282.41,288.66 365.01,318.75" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="330.3888077747867" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="282.4061687274718" y="207.83553862298675" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="331.16446137701325" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="282.4061687274718" y="277.6443628233791" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="148.21809554227312" y="307.11919970798925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10°</text><text x="152.09636355340604" y="297.0357028790437" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="294.81662636309716" y="244.29125792763608" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40°</text><text x="344.4584569055984" y="307.8948533102158" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma como unidad el tramo de base a la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda de la perpendicular. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura total es tan 30° y la altura de</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P es tan 10°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El tramo de base a la derecha mide tan</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">30° tan 40°, pues el lado derecho</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">forma 50° con la base.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así tan x = tan 10°/(tan 30° tan 40°).</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se obtiene x = 20°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>