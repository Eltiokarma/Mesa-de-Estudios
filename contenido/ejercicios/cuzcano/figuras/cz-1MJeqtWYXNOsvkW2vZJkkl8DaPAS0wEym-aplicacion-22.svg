<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">022 · Una persona sostiene su propia plataforma</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="256.26,181.75 255.73,187.11 254.17,192.26 251.63,197.02 248.21,201.18 244.04,204.60 239.29,207.14 234.14,208.70 228.77,209.23 223.41,208.70 218.26,207.14 213.50,204.60 209.34,201.18 205.92,197.02 203.38,192.26 201.82,187.11 201.29,181.75 201.82,176.39 203.38,171.23 205.92,166.48 209.34,162.31 213.50,158.89 218.26,156.35 223.41,154.79 228.77,154.26 234.14,154.79 239.29,156.35 244.04,158.89 248.21,162.31 251.63,166.48 254.17,171.23 255.73,176.39 256.26,181.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="273.53,274.02 273.20,277.39 272.22,280.63 270.62,283.61 268.47,286.23 265.86,288.38 262.87,289.98 259.63,290.96 256.26,291.29 252.89,290.96 249.65,289.98 246.66,288.38 244.04,286.23 241.89,283.61 240.30,280.63 239.31,277.39 238.98,274.02 239.31,270.64 240.30,267.40 241.89,264.42 244.04,261.80 246.66,259.65 249.65,258.05 252.89,257.07 256.26,256.74 259.63,257.07 262.87,258.05 265.86,259.65 268.47,261.80 270.62,264.42 272.22,267.40 273.20,270.64 273.53,274.02" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="201.29,181.75 201.29,376.10" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="256.26,181.75 256.26,274.02" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.98,274.02 238.98,334.87" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="273.53,274.02 273.53,376.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="228.77,181.75 228.77,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="190.30,376.10 285.70,376.10 285.70,387.09 190.30,387.09 190.30,376.10" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="210.71,336.84 236.63,336.84 236.63,376.10 210.71,376.10 210.71,336.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="224.06,340.37 238.98,330.95" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="216.99424141197588" y="354.89724285785513" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">W</text><text x="236.6257914942414" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="191.86585730667593" y="287.757341576507" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2T</text><text x="247.61945954031012" y="322.30886972129434" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="281.38572568180683" y="324.2720247295209" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La polea móvil ideal recibe dos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerzas hacia abajo de magnitud T. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuerda superior debe sostenerla con</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2T.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Considera persona y plataforma como un</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">solo conjunto. La fuerza de contacto</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre ambas se cancela.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El conjunto recibe T en la mano, T en</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el extremo inferior unido a la</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">plataforma y 2T de la cuerda superior.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por equilibrio, 4T=P+W.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>