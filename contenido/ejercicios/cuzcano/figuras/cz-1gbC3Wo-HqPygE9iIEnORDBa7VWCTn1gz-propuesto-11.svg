<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Suma de dos ángulos exteriores</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,301.39 216.60,259.28 295.50,230.56 326.15,219.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="214.74,232.65 216.60,259.28 219.54,301.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,301.39 219.54,301.39 354.33,301.39 375.10,301.39" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="200.02,319.59 219.54,301.39 295.50,230.56" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="216.60,259.28 354.33,301.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="301.3895528685265" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="216.59929502255392" y="259.279627452263" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="219.5439078580922" y="301.3895528685265" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="295.49513087541095" y="230.56389159427079" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="354.3346548345113" y="301.3895528685265" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="121.66534516548872" y="297.5337307018482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="216.59929502255392" y="245.04274560606615" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2α</text><text x="232.91238880465448" y="259.279627452263" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="208.27304306318638" y="296.0507221762027" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="207.67983965292814" y="307.91479038136674" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="359.6734855268351" y="293.3813068300408" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="298.461147926702" y="245.98718026098405" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo ARS, ∠ARS=2α por</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">oposición de vértices. Entonces</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">20°+2α+2θ=180° y α+θ=80°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rayo RD tiene dirección 20°−α y el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo exterior en D vale 200°−α.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La dirección ST es θ. En T, el ángulo</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior vale 200°−θ. Suma y sustituye</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α+θ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>