<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Suma de razones positivas igualada a cero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,265.18 375.10,265.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,261.78 107.18,268.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="211.84,261.78 211.84,268.58" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="264.16,261.78 264.16,268.58" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.82,261.78 368.82,268.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="107.18246737256834" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="211.83649347451367" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="264.16350652548635" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="368.81753262743166" y="277.21823442501847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el orden de los puntos, AC=AB+BC y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AD=AB+BD, con todas estas longitudes</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivas.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos cocientes del dato son mayores</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que uno. Su suma supera dos.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La premisa contradice la configuración</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la figura. No se puede determinar x</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bajo las condiciones dadas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>