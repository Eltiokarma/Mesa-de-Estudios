<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">056 · Equilátero con un ángulo marcado siete veces</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="101.59,306.18 287.41,150.37 329.55,389.24 101.59,306.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="128.87,233.43 374.41,233.43" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="128.87,351.65 374.41,351.65" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="188.28,233.43 154.94,325.58" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="101.58649626607132" y="315.2743090307183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="288.01828470244055" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="330.4580414196628" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="174.3403649241666" y="221.90684425282933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7θ</text><text x="199.80421895449996" y="244.03614596966665" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="253.15705597043652" y="357.71406574794054" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="165.85241358072216" y="318.912002463623" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊥</text><text x="363.80356455462316" y="224.33197320809916" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="363.80356455462316" y="343.16329201632146" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠RDO=60°, DR sube con inclinación</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60°−θ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo exterior marcado es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°−(60°−θ)=120°+θ. Iguala a 7θ para</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hallar θ=20°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rayo perpendicular hacia DO forma</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un ángulo de 90°+θ con la horizontal</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia la derecha.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>