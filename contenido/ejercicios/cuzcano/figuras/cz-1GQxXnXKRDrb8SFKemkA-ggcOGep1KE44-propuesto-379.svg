<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">379 · Límite de un modelo de producción</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 105.47,370.59 110.04,347.30 114.61,326.40 119.18,307.62 123.75,290.77 128.32,275.63 132.89,262.04 137.46,249.84 142.03,238.88 146.60,229.04 151.17,220.21 155.74,212.27 160.31,205.15 164.88,198.75 169.45,193.01 174.02,187.85 178.59,183.22 183.16,179.06 187.73,175.33 192.30,171.98 196.87,168.97 201.44,166.26 206.01,163.84 210.58,161.66 215.15,159.70 219.72,157.94 224.29,156.36 228.86,154.95 233.43,153.68 238.00,152.53 242.57,151.51 247.14,150.59 251.71,149.76 256.28,149.02 260.85,148.35 265.42,147.75 269.99,147.21 274.56,146.73 279.13,146.30 283.70,145.91 288.27,145.56 292.84,145.24 297.41,144.96 301.98,144.71 306.55,144.48 311.12,144.28 315.69,144.10 320.26,143.93 324.83,143.78 329.40,143.65 333.97,143.53 338.54,143.42 343.11,143.33 347.68,143.24 352.25,143.16 356.82,143.10 361.39,143.03 365.96,142.98 370.53,142.93 375.10,142.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Producción</text><polyline points="100.90,142.48 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Límite 50</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con t≥0, el exponente −0,34t disminuye</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sin cota inferior cuando aumenta t.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por eso e^(−0,34t) se aproxima a 0 y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f(t) se aproxima a 50 desde abajo.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La producción esperada a largo plazo</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene límite 50 unidades diarias. En</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el modelo continuo, en un tiempo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">finito queda por debajo de 50.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>