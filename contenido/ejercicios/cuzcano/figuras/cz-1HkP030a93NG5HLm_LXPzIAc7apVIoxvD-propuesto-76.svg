<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">076 · Piezómetros y diferencia de carga</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="323.93548387096774" x2="421" y2="323.93548387096774" stroke="#20364b" stroke-width="1.7"/><line x1="129.1290322580645" y1="105" x2="129.1290322580645" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="129.13,251.35 201.71,251.35 238.00,287.65 346.87,287.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">pared superior</text><polyline points="129.13,396.52 201.71,396.52 238.00,360.23 346.87,360.23" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">pared inferior</text><polyline points="165.42,251.35 165.42,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">piezómetro1</text><polyline points="274.29,287.65 274.29,164.26" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">piezómetro2</text><circle cx="150.90322580645164" cy="323.93548387096774" r="3.7" fill="#20364b"/><text x="157.90322580645164" y="315.93548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">v1=1m/s</text><circle cx="296.06451612903226" cy="323.93548387096774" r="3.7" fill="#20364b"/><text x="303.06451612903226" y="315.93548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">v2=√3m/s</text><circle cx="216.22580645161293" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="223.22580645161293" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Δh10cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los niveles de piezómetros representan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">carga piezométrica; diferencia0,10 m.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Bernoulli da(v2²−v1²)/(2g)=0,10.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">v2=√(1+2·10·0,10)=√3≈1,73 m/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>