<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Articulación de una lámina triangular ligera</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,252.91 136.15,185.53 186.69,252.91 100.90,252.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="136.15,185.53 136.15,152.36" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="186.69,252.91 343.48,252.91" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="186.69,252.91 186.69,338.44" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="167.25,338.44 206.12,338.44 206.12,372.13 167.25,372.13 167.25,338.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="355.40,264.84 355.22,266.91 354.68,268.91 353.80,270.80 352.61,272.50 351.14,273.97 349.44,275.16 347.56,276.04 345.55,276.58 343.48,276.76 341.41,276.58 339.40,276.04 337.52,275.16 335.82,273.97 334.35,272.50 333.15,270.80 332.28,268.91 331.74,266.91 331.56,264.84 331.74,262.76 332.28,260.76 333.15,258.87 334.35,257.17 335.82,255.70 337.52,254.51 339.40,253.63 341.41,253.09 343.48,252.91 345.55,253.09 347.56,253.63 349.44,254.51 351.14,255.70 352.61,257.17 353.80,258.87 354.68,260.76 355.22,262.76 355.40,264.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="355.40,264.84 355.40,338.44" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="336.22,338.44 375.10,338.44 375.10,372.13 336.22,372.13 336.22,338.44" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="126.81944020976887" y="172.57335813159338" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="186.68589548143177" y="386.6412891029941" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30 kg</text><text x="355.4004512470273" y="386.6412891029941" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 kg</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los 30 kg generan 300 N verticales</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia abajo. Los 40 kg fijan una</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tensión horizontal de 400 N en la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lámina.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La reacción en A debe sumar con esas</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos fuerzas para dar cero. Sus</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes son 400 N hacia la</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda y 300 N hacia arriba.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su magnitud es √(400²+300²).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>