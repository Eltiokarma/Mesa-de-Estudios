ze="13" fill="#20364b" text-anchor="start">A</text><circle cx="215.1505376344086" cy="243.7943548387097" r="3.7" fill="#20364b"/><text x="222.1505376344086" y="235.7943548387097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="352.247311827957" cy="243.7943548387097" r="3.7" fill="#20364b"/><text x="359.247311827957" y="235.7943548387097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="123.75268817204304" cy="358.0416666666667" r="3.7" fill="#20364b"/><text x="130.75268817204304" y="350.0416666666667" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="159.42014162077106" cy="199.2100380277996" r="3.7" fill="#20364b"/><text x="166.42014162077106" y="186.2100380277996" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">U</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AT=10 y AP:PT=2:3. Luego AP=4 y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P=(−6,5).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">RP=(4,5) es normal de L, por lo que L</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 4x+5y−1=0.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Evalúa el valor absoluto de la</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ecuación en A y divide por √41.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>