<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">067 · Rumbos de regreso con dos longitudes iniciales posibles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="162.53,293.42 238.00,217.95 313.47,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="313.47,142.48 265.62,321.05 162.53,293.42" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,217.95 190.15,396.52 162.53,293.42" fill="none" stroke="#008674" stroke-width="2.5"/><text x="162.53049885514633" y="293.4228732574492" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="313.46950114485367" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A₁</text><text x="238.0" y="217.9533721125956" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A₂</text><text x="265.6237546299552" y="321.04662788740444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B₁</text><text x="190.1542534851016" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea t la longitud del primer tramo.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos desplazamientos forman 150°,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por lo que 200²=t²+120000−600t.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De t²−600t+80000=0 salen t=200 y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t=400, ambos positivos.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para cada t, resta al punto de cambio</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la componente oeste 200√3sen15° y la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sur 200√3cos15°. Desde el extremo, los</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rumbos de retorno son N15°O y N75°O.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>