<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Aceleración total con cuerda inclinada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="317.88709677419354" x2="421" y2="317.88709677419354" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="100.90,317.89 375.10,317.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">aceleración radial</text><line x1="375.0967741935484" y1="317.88709677419354" x2="365.9658847904253" y2="321.96470130478923" stroke="#1766b0" stroke-width="2"/><line x1="375.0967741935484" y1="317.88709677419354" x2="365.9658847904253" y2="313.80949224359784" stroke="#1766b0" stroke-width="2"/><polyline points="100.90,317.89 100.90,221.11" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">aceleración tangencial</text><line x1="100.9032258064516" y1="221.11290322580646" x2="104.98083033704731" y2="230.24379262892955" stroke="#d37618" stroke-width="2"/><line x1="100.9032258064516" y1="221.11290322580646" x2="96.8256212758559" y2="230.24379262892955" stroke="#d37618" stroke-width="2"/><polyline points="100.90,317.89 375.10,221.11" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">total</text><line x1="375.0967741935484" y1="221.11290322580646" x2="367.8435425693391" y2="227.99698856850594" stroke="#008674" stroke-width="2"/><line x1="375.0967741935484" y1="221.11290322580646" x2="365.1293249294387" y2="220.30670525545486" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el sector inferior,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ar=T/m−gcos37°≈25−8=17 m/s².</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La componente tangencial es at=g</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sin37°≈6 m/s².</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=√(17²+6²)=5√13≈18,03 m/s².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>