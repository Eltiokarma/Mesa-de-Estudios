<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">039 · Barra en reposo sobre un plano inclinado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,371.84 344.22,188.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,371.84 375.10,371.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="195.19,300.79 249.93,259.53 227.01,229.12 172.27,270.37 195.19,300.79" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="262.85,245.03 208.76,173.26" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="221.57,180.77 208.76,173.26 212.45,187.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="161.07347670250897" y="359.64959246811804" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="225.51531262124288" y="167.16402760356647" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="210.48295408102348" y="261.6047853015657" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊗</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La componente del peso cuesta abajo es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mg sen 37°. El plano es liso y la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal es perpendicular a esa</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dirección.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El campo es perpendicular a la barra,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de modo que la fuerza magnética vale</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ILB.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala ambas fuerzas y usa sen</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">37°≈3/5. Se obtiene I≈6/(2×0,3).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>