<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Dos tangentes y una diferencia de potencias</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="148.78,339.16 340.26,339.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="139.89,244.25 375.10,199.84 340.26,339.16" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="148.78,291.29 340.26,339.16" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="148.78,291.29 148.78,339.16" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="148.78,291.29 139.89,244.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="196.65,291.29 196.42,295.98 195.73,300.63 194.59,305.19 193.00,309.61 191.00,313.86 188.58,317.89 185.78,321.66 182.63,325.14 179.15,328.30 175.37,331.10 171.34,333.51 167.10,335.52 162.67,337.10 158.11,338.24 153.47,338.93 148.78,339.16 144.08,338.93 139.44,338.24 134.88,337.10 130.46,335.52 126.21,333.51 122.18,331.10 118.41,328.30 114.92,325.14 111.77,321.66 108.97,317.89 106.56,313.86 104.55,309.61 102.96,305.19 101.82,300.63 101.13,295.98 100.90,291.29 101.13,286.60 101.82,281.95 102.96,277.40 104.55,272.97 106.56,268.73 108.97,264.70 111.77,260.92 114.92,257.44 118.41,254.29 122.18,251.49 126.21,249.07 130.46,247.06 134.88,245.48 139.44,244.34 144.08,243.65 148.78,243.42 153.47,243.65 158.11,244.34 162.67,245.48 167.10,247.06 171.34,249.07 175.37,251.49 179.15,254.29 182.63,257.44 185.78,260.92 188.58,264.70 191.00,268.73 193.00,272.97 194.59,277.40 195.73,281.95 196.42,286.60 196.65,291.29" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="148.775496785573" y="339.16438698297947" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="139.89237226533407" y="244.25123561821525" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="148.775496785573" y="291.29211600385804" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.0967741935484" y="199.83561301702053" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="340.26458070205865" y="339.16438698297947" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las potencias de P y Q son PB²=OP²−r²</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y QA²=OQ²−r².</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta para eliminar r². La diferencia</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es OP²−OQ².</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras en OQP, PQ²=10²−8²=36.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>