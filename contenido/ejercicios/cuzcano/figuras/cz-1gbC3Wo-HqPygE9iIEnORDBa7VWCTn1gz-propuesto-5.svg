<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Ángulo entre una bisectriz y una perpendicular</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="145.80,396.52 187.34,350.37 225.11,361.20 348.27,396.52 145.80,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="145.80,396.52 194.37,374.89 225.11,361.20" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="127.73,142.48 187.34,350.37 194.37,374.89" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="127.73,142.48 225.11,361.20" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="145.7951257235522" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="187.3435325453566" y="350.3719484447475" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="348.2674144254443" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="225.11213547040597" y="361.20192106006203" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="127.73258557455571" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="194.3733181459518" y="374.887724285368" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="130.5671976163822" y="152.60748540283652" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="330.24738073097586" y="393.2765724130278" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16°</text><text x="220.65774511896433" y="356.7475307086204" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma AC horizontal y llama a=∠CAD. Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">direcciones de BA y BC son 180°+2a y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">344°, respectivamente.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La bisectriz desde B tiene dirección</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">262°+a. La recta DE es perpendicular a</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AD, así que el rayo ED tiene dirección</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">270°+a.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como EB tiene la misma dirección que</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la bisectriz desde B hacia el</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interior, la diferencia es 8°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>