<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">019 · Camino de un rayo con tres reflexiones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,225.17 358.04,225.17 358.04,296.78 100.90,296.78" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="112.50,268.14 259.83,225.17 358.04,253.81 210.72,296.78 112.50,268.14" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="112.49847536510994" y="282.4593965655593" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="235.27170598619801" y="313.8347777242818" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">24 cm</text><text x="375.09677419354836" y="259.95097095169314" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despliega las reflexiones reflejando</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el recinto cada vez que el rayo toca</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un espejo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia horizontal entre P y su</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">copia final es 2×24=48 cm por la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reflexión en el espejo vertical. Las</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos reflexiones horizontales producen</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una traslación vertical de 2×7=14 cm.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el recinto desplegado el camino es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recto. Aplica Pitágoras a esas dos</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>