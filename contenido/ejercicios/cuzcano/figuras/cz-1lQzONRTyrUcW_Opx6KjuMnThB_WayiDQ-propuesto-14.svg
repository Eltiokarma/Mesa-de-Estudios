<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Número de caras triangulares de un poliedro mixto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="135.76,227.67 100.90,262.53 135.76,297.39 170.62,262.53 135.76,227.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="240.34,227.67 207.18,251.76 219.85,290.73 260.82,290.73 273.49,251.76 240.34,227.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="344.91,227.67 314.72,279.96 375.10,279.96 344.91,227.67" fill="none" stroke="#008674" stroke-width="2.5"/><text x="135.7611793868175" y="311.32954429643905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 cuadriláteros</text><text x="240.3350401279152" y="311.32954429643905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 pentágonos</text><text x="344.9089008690128" y="311.32954429643905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x triángulos</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada cuadrilátero aporta 360° y cada</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pentágono 540°. Las caras de ambos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tipos aportan 3780°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Quedan 4320°−3780°=540° para los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulos.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide por 180° por triángulo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>