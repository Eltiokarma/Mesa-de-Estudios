<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Un conteo lineal con siete lados excluidos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,142.48 322.18,173.12 366.98,250.71 351.42,338.93 282.79,396.52 193.21,396.52 124.58,338.93 109.02,250.71 153.82,173.12 238.00,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="280.09,157.80 344.58,211.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="280.09,157.80 359.20,294.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="280.09,157.80 317.11,367.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="280.09,157.80 238.00,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="280.09,157.80 158.89,367.72" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="280.09,157.80 116.80,294.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="280.09,157.80 131.42,211.92" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="280.09,157.80 195.91,157.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="344.58,211.92 359.20,294.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="344.58,211.92 317.11,367.72" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="344.58,211.92 238.00,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="344.58,211.92 158.89,367.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="344.58,211.92 116.80,294.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="344.58,211.92 131.42,211.92" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="344.58,211.92 195.91,157.80" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El total de pares de lados es C(n,2).</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los excluidos aportan C(7,2)=21.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Plantea C(n,2)−21=2n−3 y factoriza</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(n−9)(n+4)=0.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La solución n=9 da 180°(9−2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>