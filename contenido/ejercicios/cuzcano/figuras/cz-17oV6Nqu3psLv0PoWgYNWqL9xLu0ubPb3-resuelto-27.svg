<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Pendiente mayor que uno y suma fija de interceptos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="178.23,291.91 297.77,291.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,396.52 238.00,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="199.15,387.55 256.68,157.43" fill="none" stroke="#008674" stroke-width="2.5"/><text x="202.13662239089183" y="357.66413662239086" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="217.82685009487665" y="283.6959203036053" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">−1</text><text x="242.48292220113854" y="224.6707779886148" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe y=mx+b. El punto dado obliga a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b=2m−4.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los interceptos son −b/m y b. Su suma</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da (2m−4)(1−1/m)=3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tras multiplicar por m, factoriza</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2m²−9m+4=(2m−1)(m−4). Elige m=4 y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtén b=4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>