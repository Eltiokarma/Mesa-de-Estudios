<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Área recuperada a partir del baricentro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="310.81,322.37 363.29,269.89 100.90,217.42 310.81,322.37" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="310.81,322.37 232.10,243.65" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="310.81216237073625" y="331.2919432011113" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(3,2)</text><text x="375.0967741935484" y="267.26971754900444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(5,4)</text><text x="100.90322580645156" y="207.70805679888872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(−5,6)</text><text x="260.95878993671863" y="263.33392498842414" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma de coordenadas de los tres</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértices es tres veces la del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">baricentro. El tercer vértice es</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−5,6).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde (3,2), los vectores a los otros</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértices son (2,2) y (−8,4). El</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">determinante vale 24.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La mitad del determinante en magnitud</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es S=12. Sustituye en la expresión.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>