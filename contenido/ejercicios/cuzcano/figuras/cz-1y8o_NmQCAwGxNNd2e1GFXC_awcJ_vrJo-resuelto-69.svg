<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">069 · Perpendicularidad determinada por dos distancias</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="114.14,348.92 114.14,178.73 284.33,178.73 284.33,348.92 114.14,348.92" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="284.33,178.73 369.42,348.92 284.33,348.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="199.23,263.83 369.42,348.92" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="284.33,348.92 326.88,263.83" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="360.2675194660734" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="100.90322580645162" y="173.059510567297" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="288.11123470522807" y="171.16852057842044" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="278.65628476084544" y="367.83147942157956" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="358.37652947719687" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="191.67074527252504" y="252.48109010011123" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="335.3859844271413" y="260.04505005561737" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="325.93103448275866" y="335.68464961067855" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma lado 1 con A=(1,0), D=(1,1),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O=(1/2,1/2) y R=(1+r,0). Igualar DR² y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">RO² da r²+1=(r+1/2)²+1/4.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta r=1/2, de modo que</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N=(5/4,1/2). Los vectores A→N y O→R</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son (1/4,1/2) y (1,−1/2).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su producto escalar es 1/4−1/4=0. Las</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectas son perpendiculares y x=90°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>