<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">096 · Área de un triángulo en el paralelogramo de Varignon</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="135.18,372.32 118.04,303.77 229.43,278.07 255.14,355.19" fill="#f4c581" fill-opacity="0.45"/><polygon points="340.82,252.36 306.55,166.68 203.73,200.95 229.43,278.07" fill="#f4c581" fill-opacity="0.45"/><polygon points="118.04,303.77 229.43,278.07 203.73,200.95" fill="#f4c581" fill-opacity="0.45"/><polyline points="135.18,372.32 375.10,338.05 306.55,166.68 100.90,235.23 135.18,372.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="255.14,355.19 340.82,252.36 203.73,200.95 118.04,303.77 255.14,355.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="255.14,355.19 203.73,200.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="340.82,252.36 118.04,303.77" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="135.17741935483872" y="372.3225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="306.5483870967742" y="166.67741935483866" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="100.90322580645162" y="235.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="255.13709677419357" y="355.18548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="340.8225806451613" y="252.36290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="203.72580645161293" y="200.9516129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="118.04032258064515" y="303.7741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="229.43145161290323" y="278.0685483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El paralelogramo de puntos medios</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ocupa la mitad del cuadrilátero. Sus</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diagonales lo dividen en cuatro</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulos iguales, cada uno de área</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">K/8 si K=[ABCD].</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos exteriores ARM y NCQ</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suman K/4 porque son cuartos de ADB y</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CBD. Los interiores ROM y NQO también</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suman K/4.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así 16=K/2 y [ROQ]=K/8=4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>