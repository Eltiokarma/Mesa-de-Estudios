<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">020 · Tres lados iguales y ángulos proporcionales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.73,308.04 238.49,182.17 363.39,309.02 284.35,349.03 107.73,308.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.73,308.04 363.39,309.02" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645164" y="317.80099873722884" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.48788887613364" y="173.38589140167608" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="312.92210997589257" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="284.3494432326943" y="365.614108598324" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="139.93433589714158" y="298.28544369188387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5x</text><text x="321.42899781884967" y="322.67988749856505" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3x</text><text x="284.3494432326943" y="333.4134427735048" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">14x</text><text x="180.91700149236598" y="240.71455630811622" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=·</text><text x="306.79233153484097" y="239.73877855584897" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=·</text><text x="205.3114452990472" y="346.098553552979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=·</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el isósceles ABC, ∠BCA=5x, luego</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠BCD=8x. En ADC se obtiene</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠CAD=180°−17x.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así ∠BAD=180°−12x. Como AB=AD,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠ABD=∠ADB=6x. Por diferencia</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠BDC=14x−6x=8x.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠BCD=∠BDC, BD=BC=AB=AD. El</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo ABD es equilátero y 6x=60°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>