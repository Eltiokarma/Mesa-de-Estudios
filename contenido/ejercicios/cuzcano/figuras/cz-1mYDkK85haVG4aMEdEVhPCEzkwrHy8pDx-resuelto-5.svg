<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Ángulos dirigidos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,252.36 375.10,252.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,252.36 238.00,389.46" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="135.18,149.54 340.82,355.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,252.36 340.82,149.54" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="245.0" y="175.81451612903223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">α↺</text><text x="176.4516129032258" y="223.7983870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">β↻</text><text x="265.56451612903226" y="312.9112903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">θ↺</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usar ángulos dirigidos:β es negativo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en la orientación del dibujo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El semiplano superior se descompone</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en(90°−θ)+α−β=180°.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α−β−θ=90°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>