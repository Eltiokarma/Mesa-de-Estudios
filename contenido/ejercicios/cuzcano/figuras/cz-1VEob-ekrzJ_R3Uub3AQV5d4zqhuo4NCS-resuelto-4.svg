<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Temperatura en expansión adiabática</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">P/P₁</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">T/T₁</text><polyline points="375.10,142.48 371.10,143.72 367.10,144.98 363.10,146.24 359.10,147.52 355.10,148.81 351.10,150.12 347.11,151.44 343.11,152.77 339.11,154.12 335.11,155.49 331.11,156.87 327.11,158.26 323.11,159.67 319.12,161.10 315.12,162.55 311.12,164.02 307.12,165.50 303.12,167.00 299.12,168.52 295.12,170.07 291.12,171.63 287.13,173.22 283.13,174.83 279.13,176.46 275.13,178.12 271.13,179.81 267.13,181.52 263.13,183.25 259.14,185.02 255.14,186.82 251.14,188.65 247.14,190.51 243.14,192.40 239.14,194.33 235.14,196.30 231.15,198.31 227.15,200.36 223.15,202.45 219.15,204.59 215.15,206.78 211.15,209.02 207.15,211.31 203.15,213.67 199.16,216.08 195.16,218.56 191.16,221.12 187.16,223.75 183.16,226.46 179.16,229.26 175.16,232.16 171.17,235.16 167.17,238.28 163.17,241.53 159.17,244.92 155.17,248.47 151.17,252.20 147.17,256.14 143.17,260.30 139.18,264.74 135.18,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">proceso</text><line x1="135.1774193548387" y1="269.5" x2="137.92940947045236" y2="259.88612719017124" stroke="#1766b0" stroke-width="2"/><line x1="135.1774193548387" y1="269.5" x2="144.17317469820742" y2="265.1323477928923" stroke="#1766b0" stroke-width="2"/><circle cx="375.09677419354836" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1: 300 K</text><circle cx="135.1774193548387" cy="269.5" r="3.7" fill="#20364b"/><text x="142.1774193548387" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2: 150 K</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Convertir T₁≈300 K. La relación entre</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">estados es T₂/T₁=(P₂/P₁)^[(γ−1)/γ].</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El exponente es (0,5)/(1,5)=1/3;</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T₂=300(1/8)^(1/3)=150 K.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t₂=150−273=−123 °C. Se usan kelvin en</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la razón, no grados Celsius.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>