<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">039 · Distancia entre los puntos medios de las bases</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="106.73,359.04 106.73,178.99 244.07,178.99 367.82,359.04 106.73,359.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="175.64,178.99 237.27,359.04" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="175.64,178.99 175.64,359.04" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="106.73,187.73 115.46,187.73 115.46,178.99" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="175.64,350.79 184.37,350.79 184.37,359.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645159" y="368.7435055666572" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="100.90322580645159" y="169.77119611761344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="172.72737653439907" y="168.80059948615468" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="247.4633171567228" y="169.77119611761344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="375.0967741935484" y="367.2876106194691" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="237.27205252640593" y="370.1994005138453" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="209.1247502141022" y="284.30159862974597" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="347.434770196974" y="352.72866114758784" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La proyección horizontal del lado</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">oblicuo mide 4. La altura es 4 tan</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">37°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como las bases parten de la misma</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical, sus puntos medios difieren</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontalmente en 4/2=2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica Pitágoras a las diferencias</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal y vertical.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>