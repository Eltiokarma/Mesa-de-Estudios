<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">024 · Inclinación de un segmento hacia una cara inclinada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="238.00,186.57 100.90,352.43 186.00,288.14" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,352.43 290.00,352.43 375.10,288.14 186.00,288.14 100.90,352.43" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,352.43 238.00,320.28 238.00,186.57" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,186.57 100.90,352.43 186.00,288.14 238.00,186.57" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,186.57 169.45,336.36" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="352.4300071199739" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="290.00222469410454" y="352.4300071199739" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="288.13634749817186" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="185.99777530589543" y="288.13634749817186" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="238.0" y="320.28317730907287" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="238.0" y="186.56999288002604" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="169.4516129032258" y="336.3565922145234" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elige A=(−1,−1,0), D=(−1,1,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">S=(0,0,√2), P=(−1/2,−1/2,0).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una normal de SAD es n=(√2,0,−1). El</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">producto n·SP=√2/2 y los módulos son</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√3 y √(5/2).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El seno del ángulo recta-plano es el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valor absoluto de ese producto</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dividido por los módulos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>