<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">055 · Zona sin aporte de reflexión total</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="139.46,233.73 336.54,233.73" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="139.46,302.27 336.54,302.27" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,268.00 192.30,233.73 100.90,302.27" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,268.00 283.70,233.73 375.10,302.27" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,233.73 238.00,302.27" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="243.5695564516129" y="267.57207661290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="229.43145161290323" y="250.00655241935482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 m</text><text x="228.57459677419357" y="287.27973790322585" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 m</text><text x="186.5887096774194" y="312.12852822580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Piso</text><text x="310.83266129032256" y="226.87147177419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Superficie</text><text x="324.11391129032256" y="310.84324596774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Radio 4 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo crítico satisface sen θc =</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4/5, de modo que tan θc = 4/3.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rayo límite avanza horizontalmente</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan θc al subir 1 m y otro tanto al</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bajar 2 m desde la superficie al piso.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El radio límite es 4 m.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los rayos de reflexión total llegan al</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">piso desde ese radio hacia afuera. El</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área interior vale π(4 m)².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>