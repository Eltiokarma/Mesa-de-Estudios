dle">O</text><text x="375.0967741935484" y="325.0241935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="255.1370967741935" y="189.00270477389705" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="340.8225806451613" y="234.3432010320604" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="238.0" y="351.0725806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">radio 2</text><text x="194.1290322580645" y="276.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">AP = 3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como AB=4, el triángulo APB es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulo en P y cos ∠PAB=3/4. Denota</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ese ángulo por φ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo inscrito PAM vale φ/2, por</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lo que el ángulo central POM mide φ.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La longitud de la cuerda es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4sen(φ/2)=4√[(1−3/4)/2].</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>