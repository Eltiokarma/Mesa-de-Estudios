<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">049 · Fuerza para sumergir un bloque que sobresale un tercio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,178.10 100.90,360.90 375.10,360.90 375.10,178.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,250.65 375.10,250.65" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="206.01,211.23 269.99,211.23 269.99,328.34 206.01,328.34 206.01,211.23" fill="none" stroke="#008674" stroke-width="2.5"/><text x="337.3951612903226" y="335.19220430107526" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Líquido</text><text x="238.0" y="274.64112903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m</text><text x="288.8400537634409" y="231.79838709677418" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h</text><text x="288.26881720430106" y="291.2069892473118" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2h</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Inicialmente, el empuje que producen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los 2h sumergidos iguala mg.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al quedar sumergidos 3h, el empuje es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3/2 veces el inicial. Esto depende del</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">volumen desplazado y no del movimiento</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">absoluto del nivel.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el nuevo equilibrio, el peso más la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerza hacia abajo igualan el empuje</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">final.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>