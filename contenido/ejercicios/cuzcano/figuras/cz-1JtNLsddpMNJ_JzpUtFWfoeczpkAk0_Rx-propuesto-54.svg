<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Separación de dos colores</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="213.80,169.11 213.80,365.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="292.46,169.11 292.46,365.76" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="132.11,350.63 213.80,241.72 292.46,182.72 322.71,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="132.11,396.52 213.80,287.60 292.46,264.66 343.89,196.09" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="147.84253995280733" y="313.11745307048244" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Rojo</text><text x="151.47304169967413" y="386.3325716322966" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Azul</text><text x="193.82889541312034" y="255.02942512061333" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="250.70675611403388" y="338.5309652985502" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Placa</text><text x="251.91692336298948" y="360.3139757797511" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">24 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto de la normal, i ≈ 53°. Snell</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con sen i ≈ 4/5 da tan r rojo ≈ 3/4 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan r azul ≈ 7/24.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el espesor de 24 cm, el rayo rojo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se desplaza hacia arriba 11 cm más que</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el azul. La separación vertical</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inicial era 8,4/cos i ≈ 14 cm.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambos rayos emergen paralelos a su</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dirección inicial. Proyecta la nueva</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separación vertical de 25 cm</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicularmente al rayo,</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplicando por cos i ≈ 3/5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>