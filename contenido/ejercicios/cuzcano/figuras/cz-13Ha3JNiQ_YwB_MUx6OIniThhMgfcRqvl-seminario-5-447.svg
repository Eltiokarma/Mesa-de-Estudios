<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">447 · Polaridad de una celda alimentada externamente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.11 100.90,377.22 375.10,377.22 375.10,269.11" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,300.44 375.10,300.44" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="148.69,241.69 148.69,351.37" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="327.31,241.69 327.31,351.37" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="148.69,241.69 148.69,183.72 195.70,183.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="278.74,183.72 327.31,183.72 327.31,241.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="195.70,167.26 278.74,167.26 278.74,200.17 195.70,200.17 195.70,167.26" fill="none" stroke="#008674" stroke-width="2.5"/><text x="209.0138248847926" y="187.6336405529954" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Batería</text><text x="198.82949308755758" y="161.78110599078343" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">−</text><text x="274.036866359447" y="161.78110599078343" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">+</text><text x="122.83870967741933" y="234.6382488479263" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Zn (−)</text><text x="332.00921658986175" y="234.6382488479263" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cu (+)</text><text x="194.1290322580645" y="337.2649769585254" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ZnSO₄(ac)</text><text x="158.87557603686633" y="316.8963133640553" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">← Zn²⁺</text><text x="277.1705069124424" y="316.8963133640553" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cu²⁺ ←</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La batería entrega energía al sistema,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">característica de una celda</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">electrolítica.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El electrodo negativo recibe</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">electrones y actúa como cátodo. El</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivo actúa como ánodo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La reducción sucede en el cátodo y la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">oxidación en el ánodo. La conducción</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interna es iónica.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>