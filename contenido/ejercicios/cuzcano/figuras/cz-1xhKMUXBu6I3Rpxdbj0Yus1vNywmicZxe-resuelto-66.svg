<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">066 · Dos rumbos posibles sobre una misma alineación</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="344.60,142.48 131.40,199.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="344.60,142.48 232.20,254.89 186.68,300.41" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="344.60,142.48 285.85,284.31 239.38,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="131.40,199.61 186.68,300.41 239.38,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="131.40,199.61 232.20,254.89 285.85,284.31" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="344.60175977018594" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">J</text><text x="131.39824022981406" y="199.6115818520577" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="186.67508912883392" y="300.4105416090939" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B₁</text><text x="232.1971999868503" y="254.88843075107758" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B₂</text><text x="239.37815319960134" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C₁</text><text x="285.85412888388385" y="284.3131982107411" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La perpendicular desde Alberto al rayo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">SO de Juan mide 48sen30°=24 m. El</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">círculo de radio 25 m centrado en</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Alberto corta ese rayo a 7 m de cada</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lado del pie.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así hay dos posiciones de Beatriz. Los</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rumbos de Alberto hacia ellas son</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">S(45°−arctan(7/24))E y</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">S(45°+arctan(7/24))E.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ambos casos el rayo desde Beatriz</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que se aleja de Alberto corta el rayo</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">SSO de Juan. Carla queda en la misma</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dirección desde Alberto.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>