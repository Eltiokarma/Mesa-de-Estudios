<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Distancia a una recta con el lado del cuadrado implícito</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.92,376.40 108.92,162.07 321.65,162.07 321.65,376.40 108.92,376.40" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.92,376.40 215.82,208.03 321.65,376.40" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="108.92,162.07 321.65,376.40" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="108.92,162.07 366.54,273.24 321.65,376.40" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="355.86,269.50 351.04,280.19 361.20,284.47" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645159" y="386.0188958058228" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645159" y="152.9811041941772" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="330.19958498396534" y="152.44661384644405" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="325.38917185436713" y="386.55338615355595" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="221.69804439413946" y="200.55074514242594" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="188.55964283468526" y="257.20672200213795" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="375.0967741935484" y="270.03449034773314" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="349.97572785009123" y="325.08699616424576" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa primero lado 1 y coordenadas</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=(0,0), B=(0,1), D=(1,0),</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E=(1/2,√3/2). De y=√3x y y=1−x sale</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F=(1/(1+√3),√3/(1+√3)).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En esa escala BF=√2/(1+√3). La</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia de D a BE es el valor</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">absoluto del determinante de BE y BD</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dividido por la longitud de BE, lo que</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da 1/√2.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La razón entre distancia y BF es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1+√3)/2. Multiplica por el BF real de</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>