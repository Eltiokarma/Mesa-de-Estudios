<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Secante y tangente medidas desde el eje vertical</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,210.45 363.83,210.45" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="336.70,362.78 336.70,183.32" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="336.70,210.45 128.03,335.65" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="336.70,176.22 341.45,176.55 346.10,177.54 350.57,179.16 354.77,181.38 358.63,184.17 362.06,187.46 365.00,191.20 367.39,195.31 369.19,199.71 370.37,204.31 370.89,209.04 370.76,213.79 369.97,218.48 368.53,223.02 366.48,227.31 363.86,231.27 360.71,234.84 357.09,237.93 353.09,240.49 348.77,242.47 344.21,243.83 339.51,244.55 334.75,244.61 330.04,244.01 325.45,242.77 321.08,240.89 317.01,238.43 313.32,235.43 310.08,231.95 307.36,228.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="336.70133058378747" y="210.44613836107428" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="128.03044140030443" y="335.64867187116414" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="363.82854617764036" y="215.66291059066137" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="344.00481170520936" y="183.31892276722144" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="375.0967741935484" y="233.8172779496244" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Lleva el eje inicial a +x con un giro</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de −90°. El punto pasa a (−3,5).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así tan θ=−5/3 y sec²θ=1+25/9=34/9.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye 3(34/9)+5/3 y simplifica.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>