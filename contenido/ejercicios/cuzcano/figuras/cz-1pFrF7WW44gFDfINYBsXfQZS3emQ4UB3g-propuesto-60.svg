<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">060 · Energía desde dinamómetro de triángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="381.3744505188343" x2="421" y2="381.3744505188343" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645164" y1="105" x2="100.90322580645164" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="100.90,381.37 238.00,143.92" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">hilo izquierdo</text><polyline points="375.10,381.37 238.00,143.92" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">hilo derecho</text><polyline points="100.90,381.37 375.10,381.37" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">unión base</text><polyline points="196.87,395.08 279.13,395.08 279.13,367.66 196.87,367.66 196.87,395.08" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">dinamómetro</text><circle cx="100.90322580645164" cy="381.3744505188343" r="3.7" fill="#20364b"/><text x="107.90322580645164" y="373.3744505188343" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">q</text><circle cx="375.09677419354836" cy="381.3744505188343" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="373.3744505188343" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">q</text><circle cx="238.0" cy="143.9158720618109" r="3.7" fill="#20364b"/><text x="245.0" y="135.9158720618109" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">q</text><circle cx="238.0" cy="395.0841279381891" r="3.7" fill="#20364b"/><text x="245.0" y="387.0841279381891" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">20N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En vértice superior, las dos tensiones</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">laterales igualan por simetría cada</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">repulsión de lado, F=Kq²/ℓ².</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En cada vértice inferior, fuerza y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tensión asociadas al lado inclinado se</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cancelan; dinamómetro equilibra la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">repulsión de la base, F20 N.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">U=3Kq²/ℓ=3Fℓ=60 J.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>