<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Distancia entre proyecciones sobre dos bisectrices</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,330.43 171.89,208.57 375.10,330.43 100.90,330.43" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="171.89,208.57 131.37,330.43" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="171.89,208.57 253.23,330.43" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,330.43 212.56,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,330.43 151.63,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="151.63,269.50 212.56,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645163" y="341.09498207885304" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="171.88888888888889" y="197.90501792114696" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="341.09498207885304" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="145.078853046595" y="261.8835125448029" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="218.19713261648744" y="264.93010752688167" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="131.36917562724014" y="341.09498207885304" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P′</text><text x="253.23297491039423" y="341.09498207885304" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q′</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja B respecto de la bisectriz en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C para obtener P′ sobre AC, a 8 m de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C. Así AP′=1 m.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja B respecto de la bisectriz en</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A para obtener Q′ sobre AC, a 5 m de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P y Q son los puntos medios de BP′ y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BQ′. Por ello PQ=P′Q′/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>