#a3b9cc"/><text x="95.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2</text><rect x="143.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">12</text><rect x="238.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">7</text><rect x="333.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">37</text><rect x="48.0" y="274" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4</text><rect x="143.0" y="274" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3</text><rect x="238.0" y="274" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">14</text><rect x="333.0" y="274" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">53</text><text x="48" y="349" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Comprobación del término</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por las bases primas distintas, las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cantidades i,j,k deben ser múltiplos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 2, 3 y 7, respectivamente.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con i+j+k=21 y las tres positivas se</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtienen (8,6,7), (2,12,7) y (4,3,14).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus grados 2i+j+3k son 43, 37 y 53.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>