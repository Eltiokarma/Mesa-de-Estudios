<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Dos rectas que pasan por un circuncentro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,334.85 180.53,171.59 312.29,282.14 375.10,334.85 253.22,334.85 100.90,334.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,334.85 238.00,300.67 312.29,282.14 349.53,272.86" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="180.53,171.59 238.00,300.67 253.22,334.85 267.72,367.41" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645164" y="334.84845129058635" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="180.53063246395917" y="171.58807352570162" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354836" y="334.84845129058635" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="238.0" y="300.6663863846664" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="312.2867832717682" y="282.14461107387217" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="253.2188358191938" y="334.84845129058635" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">J</text><text x="345.19000907821976" y="288.72525623516253" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">54°</text><text x="283.38012614177444" y="346.3645803228444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">66°</text><text x="349.0483870967742" y="326.62264483897343" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como O es el circuncentro, el menor</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo POA mide 2x en la configuración</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mostrada.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma PN horizontal. La recta PU forma</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">54°−x con la horizontal. La dirección</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OA es 114°, y OP apunta a 234°−x.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia en O es 120°−x. Iguala a</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x y despeja.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>