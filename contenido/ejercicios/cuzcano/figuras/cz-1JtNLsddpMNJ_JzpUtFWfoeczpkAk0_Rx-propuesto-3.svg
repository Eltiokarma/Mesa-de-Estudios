<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Diedro obtuso de dos espejos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,307.32 290.36,307.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="290.36,307.32 375.10,186.31" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="119.60,278.97 197.49,307.32 322.13,261.96 322.13,205.88" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="197.49,307.32 322.13,352.69" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="322.13,258.72 322.13,352.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="269.15835777126097" y="296.1069257650725" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="309.0410557184751" y="340.35179380026307" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">70°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Del dibujo, el rayo inicial baja 20°</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto de la horizontal, pues su</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recta forma 70° con la vertical.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al reflejarse en el espejo horizontal</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sale a 20° sobre la horizontal. El</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">siguiente espejo debe bisecar las</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">direcciones de 20° y 90°, así que se</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclina 55°.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La abertura interior marcada es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suplementaria de 55°. Mide 125°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>