<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">109 · El eje de simetría da la suma de raíces</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="331.65682910089225" x2="421" y2="331.65682910089225" stroke="#20364b" stroke-width="1.7"/><line x1="192.30107526881721" y1="105" x2="192.30107526881721" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,142.48 103.65,152.12 106.39,161.55 109.13,170.79 111.87,179.84 114.61,188.70 117.35,197.35 120.10,205.82 122.84,214.09 125.58,222.16 128.32,230.04 131.06,237.73 133.81,245.22 136.55,252.52 139.29,259.62 142.03,266.53 144.77,273.24 147.52,279.76 150.26,286.08 153.00,292.21 155.74,298.15 158.48,303.89 161.23,309.43 163.97,314.78 166.71,319.94 169.45,324.90 172.19,329.67 174.94,334.24 177.68,338.62 180.42,342.80 183.16,346.79 185.90,350.58 188.65,354.18 191.39,357.59 194.13,360.80 196.87,363.82 199.61,366.64 202.35,369.26 205.10,371.70 207.84,373.93 210.58,375.98 213.32,377.83 216.06,379.48 218.81,380.94 221.55,382.20 224.29,383.27 227.03,384.15 229.77,384.83 232.52,385.32 235.26,385.61 238.00,385.71 240.74,385.61 243.48,385.32 246.23,384.83 248.97,384.15 251.71,383.27 254.45,382.20 257.19,380.94 259.94,379.48 262.68,377.83 265.42,375.98 268.16,373.93 270.90,371.70 273.65,369.26 276.39,366.64 279.13,363.82 281.87,360.80 284.61,357.59 287.35,354.18 290.10,350.58 292.84,346.79 295.58,342.80 298.32,338.62 301.06,334.24 303.81,329.67 306.55,324.90 309.29,319.94 312.03,314.78 314.77,309.43 317.52,303.89 320.26,298.15 323.00,292.21 325.74,286.08 328.48,279.76 331.23,273.24 333.97,266.53 336.71,259.62 339.45,252.52 342.19,245.22 344.94,237.73 347.68,230.04 350.42,222.16 353.16,214.09 355.90,205.82 358.65,197.35 361.39,188.70 364.13,179.84 366.87,170.79 369.61,161.55 372.35,152.12 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Parábola de ejemplo</text><polyline points="238.00,396.52 238.00,269.50" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Eje x=1</text><circle cx="238.0" cy="385.70624571036376" r="3.7" fill="#20364b"/><text x="255.0" y="392.70624571036376" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">V=(1,−2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos cortes con el eje x existen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">porque la parábola abre hacia arriba y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">su mínimo es −2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El eje de simetría x=1 está a igual</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia de ambos cortes.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto su promedio es 1 y su suma</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 2. El dibujo usa una parábola</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">compatible con el vértice dado.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>