anchor="middle">M</text><text x="218.63778520849723" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="240.83979150275374" y="339.2039732494099" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="229.48062549173878" y="239.036782061369" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="250.64998033044847" y="241.61841070023604" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="226.38267112509834" y="359.8570023603462" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="253.7479346970889" y="310.80605822187255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa R=(0,0), M=(d,0) y E=(u,v) con v</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El giro de RE hacia RP lleva (u,v) a</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(v,−u), por lo que PC=u=b.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El giro de ME hacia MU lleva (u−d,v) a</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−v,u−d), por lo que UN=d−u=a. Suma</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las dos alturas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>