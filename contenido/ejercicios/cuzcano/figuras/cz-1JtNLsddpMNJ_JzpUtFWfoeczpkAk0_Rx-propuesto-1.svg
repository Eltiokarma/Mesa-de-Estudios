<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Dos reflexiones con salida vertical</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,316.28 295.20,316.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="295.20,316.28 375.10,210.25" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="119.60,293.95 197.49,316.28 322.13,280.55 322.13,224.46" fill="none" stroke="#008674" stroke-width="2.5"/><text x="144.52492668621704" y="288.24109382004104" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16°</text><text x="312.78005865102637" y="328.74695892268034" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="331.47507331378296" y="214.7073694798651" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vertical</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el primer espejo el rayo sale a 16°</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por encima de la horizontal.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el segundo, la dirección del espejo</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">biseca las direcciones orientadas de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entrada y salida. Estas valen 16° y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">90° respecto de la horizontal.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Promedia ambos ángulos. La inclinación</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α es 53°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>