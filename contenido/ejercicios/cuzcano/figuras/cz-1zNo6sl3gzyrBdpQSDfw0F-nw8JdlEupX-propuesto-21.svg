<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Extremo de desigualdad triangular</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="280.3387096774194" y1="105" x2="280.3387096774194" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="280.34,269.50 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F1</text><line x1="365.01612903225805" y1="269.5" x2="355.88523962913496" y2="273.5776045305957" stroke="#1766b0" stroke-width="2"/><line x1="365.01612903225805" y1="269.5" x2="355.88523962913496" y2="265.4223954694043" stroke="#1766b0" stroke-width="2"/><polyline points="280.34,269.50 110.98,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">F2</text><line x1="110.98387096774194" y1="269.5" x2="120.11476037086501" y2="265.4223954694043" stroke="#d37618" stroke-width="2"/><line x1="110.98387096774194" y1="269.5" x2="120.11476037086501" y2="273.5776045305957" stroke="#d37618" stroke-width="2"/><polyline points="280.34,269.50 195.66,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">R</text><line x1="195.66129032258064" y1="269.5" x2="204.79217972570373" y2="265.4223954694043" stroke="#008674" stroke-width="2"/><line x1="195.66129032258064" y1="269.5" x2="204.79217972570373" y2="273.5776045305957" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El resultado es el mínimo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posible:∣20−10∣=10.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se alcanza sólo con fuerzas</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">antiparalelas:α=π.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La opción E,3π/4≤α&lt;5π/4,contiene π;D</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">excluye el extremo π.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>