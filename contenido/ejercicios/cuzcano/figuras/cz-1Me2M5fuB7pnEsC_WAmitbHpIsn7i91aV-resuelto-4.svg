<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Siete ángulos suman 1134°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,142.48 198.75,148.70 163.34,166.74 135.24,194.84 117.20,230.25 110.98,269.50 117.20,308.75 135.24,344.16 163.34,372.26 198.75,390.30 238.00,396.52 277.25,390.30 312.66,372.26 340.76,344.16 358.80,308.75 365.02,269.50 358.80,230.25 340.76,194.84 312.66,166.74 277.25,148.70 238.00,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada interior vale 1134°/7=162°.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El exterior suplementario vale 18°.</text><text x="482" y="169" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los exteriores suman 360°, así que</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">divide 360° entre 18°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>