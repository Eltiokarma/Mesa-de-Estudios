<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">098 · Tarjetas en nueve casillas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="124.15,370.19 351.85,370.19 351.85,142.48 124.15,142.48 124.15,370.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="140.51,346.71 192.46,346.71 192.46,308.99 140.51,308.99 140.51,346.71" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="140.51,275.55 192.46,275.55 192.46,237.83 140.51,237.83 140.51,275.55" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="140.51,204.39 192.46,204.39 192.46,166.68 140.51,166.68 140.51,204.39" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="211.67,346.71 263.62,346.71 263.62,308.99 211.67,308.99 211.67,346.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="211.67,275.55 263.62,275.55 263.62,237.83 211.67,237.83 211.67,275.55" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="211.67,204.39 263.62,204.39 263.62,166.68 211.67,166.68 211.67,204.39" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="282.83,346.71 334.77,346.71 334.77,308.99 282.83,308.99 282.83,346.71" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="282.83,275.55 334.77,275.55 334.77,237.83 282.83,237.83 282.83,275.55" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="282.83,204.39 334.77,204.39 334.77,166.68 282.83,166.68 282.83,204.39" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="184.51612903225805" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3 A · 2 B · 4 C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elegir tres de nueve casillas para A y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos de las seis restantes para B. Las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">últimas cuatro son C.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El producto es C(9,3)C(6,2)=1260. Se</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">usan nueve tarjetas y nueve casillas.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Excluir la distribución válida deja</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1259. La solución impresa usa 10! en</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lugar de 9!, aunque el tablero muestra</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">nueve posiciones.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>