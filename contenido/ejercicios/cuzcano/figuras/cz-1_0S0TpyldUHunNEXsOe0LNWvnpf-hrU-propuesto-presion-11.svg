<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Alargamiento de un resorte entre dos émbolos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,221.52 375.10,221.52 375.10,386.03 100.90,386.03 100.90,221.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,235.23 375.10,235.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="114.61,324.34 135.18,324.34 169.45,324.34 181.79,307.20 194.13,341.48 206.47,307.20 218.81,341.48 231.15,307.20 243.48,341.48 255.82,307.20 268.16,341.48 280.50,307.20 292.84,324.34 361.39,324.34" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,164.62 238.00,218.09" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="232.17,206.44 238.00,218.09 243.83,206.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="238.0" y="152.9677419354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ΔF</text><text x="128.3225806451613" y="348.3306451612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R₃</text><text x="344.24999999999994" y="348.3306451612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R₂</text><text x="340.8225806451612" y="208.491935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R₁</text><text x="234.57258064516128" y="365.46774193548384" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">k = 320 N/m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El aumento de fuerza es 256 N. Por</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pascal, el aumento de presión se</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">transmite a cada émbolo lateral.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como cada área lateral es 1/16 del</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área principal, la fuerza adicional</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre cada extremo es 16 N.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tensión del resorte aumenta 16 N.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la ley de Hooke, Δx = 16/320 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>