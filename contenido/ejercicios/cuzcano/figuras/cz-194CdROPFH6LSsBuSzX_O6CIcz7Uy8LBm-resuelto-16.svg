<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Parábola por el vértice opuesto de un cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="355.18548387096774" x2="421" y2="355.18548387096774" stroke="#20364b" stroke-width="1.7"/><line x1="237.99999999999997" y1="105" x2="237.99999999999997" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polygon points="238.00,355.19 347.68,355.19 347.68,245.51 238.00,245.51" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,183.81 105.47,195.05 110.04,205.90 114.61,216.38 119.18,226.47 123.75,236.18 128.32,245.51 132.89,254.46 137.46,263.03 142.03,271.21 146.60,279.02 151.17,286.45 155.74,293.49 160.31,300.16 164.88,306.44 169.45,312.34 174.02,317.86 178.59,323.01 183.16,327.77 187.73,332.15 192.30,336.14 196.87,339.76 201.44,343.00 206.01,345.86 210.58,348.33 215.15,350.43 219.72,352.14 224.29,353.47 228.86,354.42 233.43,355.00 238.00,355.19 242.57,355.00 247.14,354.42 251.71,353.47 256.28,352.14 260.85,350.43 265.42,348.33 269.99,345.86 274.56,343.00 279.13,339.76 283.70,336.14 288.27,332.15 292.84,327.77 297.41,323.01 301.98,317.86 306.55,312.34 311.12,306.44 315.69,300.16 320.26,293.49 324.83,286.45 329.40,279.02 333.97,271.21 338.54,263.03 343.11,254.46 347.68,245.51 352.25,236.18 356.82,226.47 361.39,216.38 365.96,205.90 370.53,195.05 375.10,183.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,355.19 347.68,355.19 347.68,245.51 238.00,245.51 238.00,355.19" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="237.99999999999997" cy="355.18548387096774" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="347.18548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="347.6774193548387" cy="245.50806451612905" r="3.7" fill="#20364b"/><text x="354.6774193548387" y="237.50806451612905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R(4,4)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lado del cuadrado es √16=4. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértice opuesto al origen tiene</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coordenadas (4,4).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con vértice en el origen y eje y, la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">parábola tiene ecuación x²=4py.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye (4,4). De 16=16p resulta</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">p=1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>