<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Placa rectangular con proyección conocida</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="118.00,261.28 225.84,190.92 348.14,277.72 240.96,348.73 118.00,261.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="118.00,261.28 118.00,348.08 240.96,348.73" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="225.84,190.92 225.84,277.72 348.14,277.72" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,240.90 363.92,240.90" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="352.74,236.29 363.92,240.90 352.74,245.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="114.05,302.05 375.10,302.05" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="363.92,297.45 375.10,302.05 363.92,306.65" fill="none" stroke="#008674" stroke-width="2.5"/><text x="108.13614914519997" y="265.8835383306258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="225.83553802119596" y="179.08845826564556" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">c</text><text x="360.63092751605166" y="279.69184652278176" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">d</text><text x="241.6164616693742" y="359.91154173435444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="105.50599520383693" y="306.6509244217529" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,8 m</text><text x="165.34199736984607" y="217.22569041540962" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,6 m</text><text x="339.5896959851474" y="229.71892163688403" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B = 2 T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La proyección sobre el plano</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular al campo incorpora el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coseno del ángulo con la normal.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área proyectada es 0,6×0,8=0,48 m².</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica el campo de 2 T por el área</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyectada.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>