<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Problema 78: Longitud de un rollo de papel</title><desc id="desc">Reconstrucción vectorial. Sólido en perspectiva y sección auxiliar con datos y letras.</desc><rect width="900" height="540" rx="18" fill="#f5f8fc"/><text x="28.00" y="36.00" font-family="Arial,sans-serif" font-size="18" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">78  /  Longitud de un rollo de papel</text><line x1="460.00" y1="70.00" x2="460.00" y2="490.00" stroke="#d8e2ee" stroke-width="1"/><text x="28.00" y="517.00" font-family="Arial,sans-serif" font-size="14" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Esquema en perspectiva · Las cotas, no la apariencia, definen la geometría.</text><circle cx="240" cy="270" r="160" fill="none" stroke="#008778" stroke-width="2"/><circle cx="240" cy="270" r="53.333333333333336" fill="none" stroke="#c36117" stroke-width="2"/><circle cx="240" cy="270" r="65" fill="none" stroke="#c6d8e5" stroke-width="2"/><circle cx="240" cy="270" r="79" fill="none" stroke="#c6d8e5" stroke-width="2"/><circle cx="240" cy="270" r="93" fill="none" stroke="#c6d8e5" stroke-width="2"/><circle cx="240" cy="270" r="107" fill="none" stroke="#c6d8e5" stroke-width="2"/><circle cx="240" cy="270" r="121" fill="none" stroke="#c6d8e5" stroke-width="2"/><circle cx="240" cy="270" r="135" fill="none" stroke="#c6d8e5" stroke-width="2"/><circle cx="240" cy="270" r="149" fill="none" stroke="#c6d8e5" stroke-width="2"/><line x1="240.00" y1="270.00" x2="400.00" y2="270.00" stroke="#2463c4" stroke-width="2.3"/><text x="275.00" y="255.00" font-family="Arial,sans-serif" font-size="18" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">15 cm</text><text x="190.00" y="290.00" font-family="Arial,sans-serif" font-size="15" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">5 cm</text><text x="100.00" y="470.00" font-family="Arial,sans-serif" font-size="15" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Sección transversal · capas idealizadas</text><text x="490.00" y="140.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">500 vueltas; núcleo de radio 5 cm</text><text x="490.00" y="167.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Radio exterior: 15 cm</text><text x="490.00" y="194.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Espesor: (15 − 5)/500 = 0,02 cm</text><text x="490.00" y="221.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">L · 0,02 = π(15² − 5²)</text><text x="490.00" y="248.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">L = 10000π cm</text><text x="490.00" y="275.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">31420 usa π ≈ 3,142.</text></svg>