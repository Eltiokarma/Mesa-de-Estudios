<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Resorte que sostiene un sólido en agua</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,199.52 100.90,382.32 375.10,382.32 375.10,199.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,276.64 375.10,276.64" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="212.29,302.35 263.71,302.35 263.71,341.19 212.29,341.19 212.29,302.35" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,156.68 238.00,170.96" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,170.96 230.00,179.33 246.00,187.69 230.00,196.06 246.00,204.42 230.00,212.78 246.00,221.15 230.00,229.51 246.00,237.88 230.00,246.24 246.00,254.61 230.00,262.97 246.00,271.34 230.00,279.70 238.00,288.07" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,288.07 238.00,302.35" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="337.3951612903226" y="350.9012096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="261.991935483871" y="216.66061827956986" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">k</text><text x="238.0" y="320.62567204301075" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">140 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El empuje es la fracción 1000/2000 del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">peso para un mismo volumen, es decir</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">70 N.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tensión del resorte es el peso</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">menos el empuje. Resulta 70 N.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica la ley de Hooke: x = 70/700 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>