<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">059 · Barra articulada vertical en giro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.48387096774195" x2="421" y2="142.48387096774195" stroke="#20364b" stroke-width="1.7"/><line x1="187.19354838709677" y1="105" x2="187.19354838709677" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="187.19,142.48 187.19,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">eje</text><polyline points="187.19,142.48 288.81,218.69 288.81,345.71" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">AB y BC</text><circle cx="187.19354838709677" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="194.19354838709677" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="288.80645161290323" cy="218.6935483870968" r="3.7" fill="#20364b"/><text x="295.80645161290323" y="210.6935483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="288.80645161290323" cy="345.7096774193548" r="3.7" fill="#20364b"/><text x="295.80645161290323" y="337.7096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si BC queda vertical a radio</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ρ=sin53°&gt;0, su centro requiere fuerza</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal mω²ρ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La articulación ideal en B es la única</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerza horizontal; aplicada a 1/2 m</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del centro produce torque no nulo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una barra que permanece vertical no</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puede tener esa aceleración angular de</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclinación. Para ω&gt;0 falta un par o</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una segunda restricción: no hay</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">solución con articulación ideal libre.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>