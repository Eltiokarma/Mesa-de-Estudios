<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Letra con comisión bancaria</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,255.79 375.10,255.79" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,235.23 100.90,276.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,235.23 375.10,276.35" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645164" y="303.7741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 de mayo</text><text x="375.09677419354836" y="303.7741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 de julio</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre el 2 de mayo y el 1 de julio</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">transcurren 60 días. El descuento</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">comercial es 0,45 × 60/360 = 0,075 del</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">nominal.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta al nominal la fracción de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">descuento y el 0,01 de comisión. Se</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recibe 0,915 del nominal.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide 73 200 entre 0,915.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>