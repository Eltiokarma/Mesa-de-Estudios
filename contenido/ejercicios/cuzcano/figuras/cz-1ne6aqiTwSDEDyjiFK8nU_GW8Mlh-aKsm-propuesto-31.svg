<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Rango de un polinomio de la tangente en un intervalo abierto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="100.90,142.48 105.47,164.62 110.04,184.76 114.61,203.16 119.18,219.99 123.75,235.42 128.32,249.61 132.89,262.67 137.46,274.72 142.03,285.85 146.60,296.14 151.17,305.68 155.74,314.51 160.31,322.70 164.88,330.31 169.45,337.37 174.02,343.92 178.59,350.00 183.16,355.65 187.73,360.88 192.30,365.72 196.87,370.20 201.44,374.33 206.01,378.14 210.58,381.62 215.15,384.81 219.72,387.70 224.29,390.31 228.86,392.65 233.43,394.71 238.00,396.52 242.57,394.71 247.14,392.65 251.71,390.31 256.28,387.70 260.85,384.81 265.42,381.62 269.99,378.14 274.56,374.33 279.13,370.20 283.70,365.72 288.27,360.88 292.84,355.65 297.41,350.00 301.98,343.92 306.55,337.37 311.12,330.31 315.69,322.70 320.26,314.51 324.83,305.68 329.40,296.14 333.97,285.85 338.54,274.72 343.11,262.67 347.68,249.61 352.25,235.42 356.82,219.99 361.39,203.16 365.96,184.76 370.53,164.62 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ese tramo, la tangente recorre</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−1,1) y su módulo t recorre [0,1).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La expresión 3t²+t aumenta para t≥0.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Vale 0 en t=0 y tiende a 4 cuando t se</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">acerca a 1, sin llegar a ese valor.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>