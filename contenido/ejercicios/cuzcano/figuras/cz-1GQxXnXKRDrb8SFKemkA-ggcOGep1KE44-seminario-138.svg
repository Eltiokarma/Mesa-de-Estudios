<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">138 · Una raíz multiplicada por una parte entera</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.4838709677419" x2="421" y2="142.4838709677419" stroke="#20364b" stroke-width="1.7"/><line x1="375.0967741935484" y1="105" x2="375.0967741935484" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 105.47,394.39 110.04,392.25 114.61,390.08 119.18,387.90 123.75,385.70 128.32,383.48 132.89,381.24 137.46,378.98 142.03,376.69 146.60,374.38 151.17,372.05 155.74,369.70 160.31,367.32 164.88,364.91 169.45,362.48 174.02,360.02 178.59,357.54 183.16,355.02 187.73,352.48 192.30,349.90 196.87,347.29 201.44,344.65 206.01,341.97 210.58,339.26 215.15,336.50 219.72,333.71 224.29,330.88 228.86,328.00 233.43,325.08 238.00,322.11 242.57,319.09 247.14,316.02 251.71,312.89 256.28,309.71 260.85,306.46 265.42,303.15 269.99,299.77 274.56,296.31 279.13,292.77 283.70,289.15 288.27,285.44 292.84,281.62 297.41,277.70 301.98,273.67 306.55,269.50 311.12,265.19 315.69,260.73 320.26,256.09 324.83,251.25 329.40,246.19 333.97,240.87 338.54,235.24 343.11,229.25 347.68,222.82 352.25,215.82 356.82,208.07 361.39,199.29 365.96,188.86 370.53,175.28 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">−√(−x)</text><circle cx="375.0967741935484" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,0)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La raíz fija el dominio x≤0.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuando x&lt;0, el cociente es −1/(x²+1),</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">estrictamente entre −1 y 0. Su parte</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entera es −1.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x=0, el cociente vale 0 y f(0)=0.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La gráfica coincide con y=−√(−x) para</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">todo x≤0.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>