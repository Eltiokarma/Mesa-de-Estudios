<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">024 · Viga que sostiene máquina de Atwood</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="223.80107526881721" x2="421" y2="223.80107526881721" stroke="#20364b" stroke-width="1.7"/><line x1="192.3010752688172" y1="105" x2="192.3010752688172" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="100.90,223.80 375.10,223.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">viga</text><polyline points="100.90,223.80 100.90,315.20" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">m1</text><polyline points="375.10,223.80 375.10,260.36" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">polea derecha</text><circle cx="192.3010752688172" cy="223.80107526881721" r="3.7" fill="#20364b"/><text x="199.3010752688172" y="215.80107526881721" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">apoyo</text><circle cx="100.90322580645162" cy="315.1989247311828" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="307.1989247311828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m1</text><circle cx="375.09677419354836" cy="260.36021505376345" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="252.36021505376345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">carga 2T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la polea fija, T=2m2m3g/(m2+m3).</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La viga recibe carga 2T a derecha y</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m1g a izquierda.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Equilibrio de momentos: m1gl1=2Tl2;</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">l1/l2=4m2m3/[m1(m2+m3)].</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>