<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Ángulo exacto desde la separación de puntos medios</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="115.48,347.61 115.48,193.66 243.92,193.66 367.35,347.61 115.48,347.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="115.48,193.66 367.35,347.61" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="115.48,347.61 243.92,193.66" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="179.70,270.64 241.19,270.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="115.48,201.41 123.22,201.41 123.22,193.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="115.48,339.87 123.22,339.87 123.22,347.61" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="108.19076197620834" y="354.44534347872684" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="109.10170399742793" y="185.46559854249276" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="248.0203622334155" y="184.55465652127316" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="375.0967741935484" y="354.44534347872684" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="270.6386775265245" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h</text><text x="211.12721037402207" y="261.52925731432856" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2h/3</text><text x="348.2239845675705" y="341.2366841710428" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia entre esos puntos medios</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es la mitad de la diferencia entre las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bases.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así, la diferencia de bases es 4h/3.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lado oblicuo forma con la base un</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo rectángulo con altura h y</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección horizontal 4h/3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo agudo α cumple tan</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α=h/(4h/3)=3/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>