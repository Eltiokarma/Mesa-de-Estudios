<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Razón de áreas con el incentro y las bisectrices</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="327.81,179.69 111.10,263.96 217.50,300.08" fill="#f4c581" fill-opacity="0.45"/><polygon points="156.36,366.80 217.50,300.08 342.05,342.35" fill="#f4c581" fill-opacity="0.45"/><polyline points="156.36,366.80 165.15,165.45 342.05,342.35 156.36,366.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="156.36,366.80 217.50,300.08 327.81,179.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="342.05,342.35 217.50,300.08 111.10,263.96" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="327.81,179.69 111.10,263.96" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="327.81,179.69 342.05,342.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="365.02,269.50 364.62,259.53 363.45,249.63 361.51,239.85 358.80,230.25 355.35,220.89 351.17,211.84 346.30,203.13 340.76,194.84 334.58,187.01 327.81,179.69 320.49,172.92 312.66,166.74 304.37,161.20 295.66,156.33 286.61,152.15 277.25,148.70 267.65,145.99 257.87,144.05 247.97,142.88 238.00,142.48 228.03,142.88 218.13,144.05 208.35,145.99 198.75,148.70 189.39,152.15 180.34,156.33 171.63,161.20 163.34,166.74 155.51,172.92 148.19,179.69 141.42,187.01 135.24,194.84 129.70,203.13 124.83,211.84 120.65,220.89 117.20,230.25 114.49,239.85 112.55,249.63 111.38,259.53 110.98,269.50 111.38,279.47 112.55,289.37 114.49,299.15 117.20,308.75 120.65,318.11 124.83,327.16 129.70,335.87 135.24,344.16 141.42,351.99 148.19,359.31 155.51,366.08 163.34,372.26 171.63,377.80 180.34,382.67 189.39,386.85 198.75,390.30 208.35,393.01 218.13,394.95 228.03,396.12 238.00,396.52 247.97,396.12 257.87,394.95 267.65,393.01 277.25,390.30 286.61,386.85 295.66,382.67 304.37,377.80 312.66,372.26 320.49,366.08 327.81,359.31 334.58,351.99 340.76,344.16 346.30,335.87 351.17,327.16 355.35,318.11 358.80,308.75 361.51,299.15 363.45,289.37 364.62,279.47 365.02,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="156.35560602771778" y="366.7999998316444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="165.14654135057276" y="165.45447824555146" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="342.04552175444854" y="342.3534586494273" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="327.8139661587752" y="179.68603384122477" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="111.10476217811079" y="263.95963426609643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="217.49766000999736" y="300.0751565479464" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las bisectrices sitúan P en el punto</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio del arco BC y Q en el de AB. Por</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos inscritos, ∠IPQ=∠ICA y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠IQP=∠IAC, así que PQI y CAI son</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semejantes.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En CPI, ∠CPI=2θ y ∠PCI=∠CIP=90°−θ por</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la bisectriz y el arco BC. De ahí</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PI=PC y CI=2PI sen θ.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La razón de áreas es el cuadrado de</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PI/CI.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>