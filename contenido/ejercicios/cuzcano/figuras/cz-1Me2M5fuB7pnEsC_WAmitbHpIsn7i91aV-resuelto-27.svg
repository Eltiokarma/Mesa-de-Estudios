<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Cinco vértices consecutivos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="234.59,149.30 127.54,211.11 127.54,334.71 234.59,396.52 341.64,334.71 341.64,211.11 234.59,149.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="234.59,149.30 127.54,334.71" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="234.59,149.30 234.59,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="234.59,149.30 341.64,334.71" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="127.54,211.11 234.59,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="127.54,211.11 341.64,334.71" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="127.54,211.11 341.64,211.11" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="127.54,334.71 341.64,334.71" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="127.54,334.71 341.64,211.11" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="234.59,396.52 341.64,211.11" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="241.4098289673089" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="134.36363304326088" y="204.28702100021647" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="134.36363304326085" y="327.89332106516554" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="241.4098289673089" y="389.6964710976402" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="348.456024891357" y="327.89332106516565" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="348.456024891357" y="204.2870210002165" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La dirección de AB a CD gira dos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos centrales, 720°/n.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el giro marcado es 120°, n=6. Si</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">solo se exige que las rectas formen</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también el ángulo de 120°, un giro de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60° da n=12.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En un bloque de cinco vértices hay</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">seis diagonales repetidas. Usa</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5(n−3)−6 para los dos tamaños.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>