<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Ángulo para ver una imagen puntual</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="271.24,142.48 271.24,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="163.14,169.51 325.29,169.51" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="217.19,169.51 271.24,241.57 163.14,385.71" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="271.24,241.57 325.29,169.51" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="163.14,169.51 163.14,385.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="150.71019217570353" y="277.60741249142075" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4a</text><text x="189.08527796842827" y="159.23919011667806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="246.9181537405628" y="159.23919011667806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="217.19097460535346" y="179.23747426218253" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="325.2898078242965" y="179.23747426218253" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P′</text><text x="163.14155799588195" y="395.9756348661634" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="261.5114962251201" y="266.2570350034317" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja P al otro lado del espejo. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">imagen virtual P′ queda a distancia</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal 3a de O.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La vertical entre O y P′ es 4a, por lo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que el rayo observado sigue la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hipotenusa de un triángulo 3–4–5.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente respecto de la vertical es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3/4, así que α ≈ 37°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>