-serif" font-size="11" fill="#1766b0" text-anchor="start">Círculo unitario</text><polyline points="205.64,187.16 335.09,351.84" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Diámetro</text><polyline points="100.90,269.50 205.64,187.16" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Tangente</text><polyline points="270.36,351.84 335.09,351.84" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">Proyección</text><circle cx="205.63584179438368" cy="187.1643096449481" r="3.7" fill="#20364b"/><text x="212.63584179438368" y="179.1643096449481" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="335.092474616849" cy="351.83569035505195" r="3.7" fill="#20364b"/><text x="342.092474616849" y="343.83569035505195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="165.63154221768428" cy="269.5" r="3.7" fill="#20364b"/><text x="172.63154221768428" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A′</text><circle cx="270.3641582056163" cy="351.83569035505195" r="3.7" fill="#20364b"/><text x="277.3641582056163" y="343.83569035505195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H</text><circle cx="100.90322580645163" cy="269.5" r="3.7" fill="#20364b"/><text x="107.90322580645163" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="270.3641582056163" cy="269.5" r="3.7" fill="#20364b"/><text x="277.3641582056163" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si c=cos β&gt;0, la abscisa de P es −1/c</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por la ecuación de la tangente en T.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces PA′=1/c−1 y HM=c. Iguala y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplica por c para obtener</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">c²+c−1=0.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De las dos raíces, elige la positiva</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del cuarto cuadrante.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>