<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">039 · Fuerza horizontal para que un rodillo suba un escalón</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="279.13,269.50 278.09,281.40 275.00,292.94 269.95,303.77 263.09,313.56 254.64,322.01 244.85,328.86 234.03,333.91 222.48,337.01 210.58,338.05 198.68,337.01 187.14,333.91 176.31,328.86 166.52,322.01 158.07,313.56 151.22,303.77 146.17,292.94 143.07,281.40 142.03,269.50 143.07,257.60 146.17,246.06 151.22,235.23 158.07,225.44 166.52,216.99 176.31,210.14 187.14,205.09 198.68,201.99 210.58,200.95 222.48,201.99 234.03,205.09 244.85,210.14 254.64,216.99 263.09,225.44 269.95,235.23 275.00,246.06 278.09,257.60 279.13,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,338.05 261.47,338.05 261.47,315.43 375.10,315.43" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="210.58,269.50 261.47,315.43" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="210.58,269.50 361.39,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="349.05,276.35 361.39,269.50 349.05,262.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="370.2983870967742" y="262.64516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="266.95217204845915" y="326.73790322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">d</text><text x="231.95346064744965" y="284.23790322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el umbral el suelo deja de sostener</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">al rodillo. Toma momentos respecto de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la arista del escalón, por donde pasa</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la normal.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde la arista hasta el centro hay</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una altura R−d y una distancia</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal √[R²−(R−d)²]=√(2Rd−d²).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala el momento de la fuerza</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal, F(R−d), al del peso,</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mg√(2Rd−d²).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>