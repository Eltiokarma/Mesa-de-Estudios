<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">019 · Distancia desde un vértice del cuadrado al equilátero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.73,365.93 109.73,173.53 306.32,173.53 306.32,365.93 109.73,365.93" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="306.32,173.53 237.07,286.93 367.20,303.66 306.32,173.53" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="109.73,173.53 237.07,286.93" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="237.07,286.93 237.07,173.53" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="237.07,181.43 229.17,181.43 229.17,173.53" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645159" y="372.438764352105" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="102.29743028977582" y="166.561235647895" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="309.1044286495353" y="165.16703116457074" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="312.82230727173317" y="372.90349917987976" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="237.53526517222525" y="296.2222525970476" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="375.0967741935484" y="311.09376708583926" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="237.07053034445053" y="165.6317659923455" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="321.6522689994532" y="216.2878622197922" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">23°</text><text x="161.7834882449426" y="223.2588846364133" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="273.784581738655" y="233.01831601968286" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10</text><text x="205.9332968835429" y="373.83296883542926" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">21</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠ECF=60°, se tiene ∠ECD=37°. Del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo recto BCD resulta ∠BCE=53°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo BCE se conocen BC=21,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CE=10 y el ángulo comprendido. Aplica</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la ley de cosenos.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Obtienes BE²=21²+10²−2·21·10 cos 53°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma la raíz positiva.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>