<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">098 · Piedras para cuarenta hitos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.04,275.38 375.10,275.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="158.47,275.38 158.47,253.72" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="220.36,275.38 220.36,253.72" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="313.20,275.38 313.20,253.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="107.9032258064516" y="258.869474987257" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Montón</text><text x="154.6337289740042" y="245.4073763926309" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1.º hito</text><text x="216.5284351561931" y="245.4073763926309" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2.º hito</text><text x="309.3704944294765" y="245.4073763926309" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3.º hito</text><text x="145.34952304667587" y="277.5926236073691" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2 m</text><text x="191.77055268331753" y="277.5926236073691" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4 m</text><text x="269.1389354110537" y="277.5926236073691" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">6 m</text><text x="354.2441564115634" y="277.5926236073691" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">…</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como T(40)=820, hay 40 hitos. El hito</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k está a 2T(k)=k(k+1) m del montón.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para k piedras hay k idas y k</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">regresos, excepto que se omite el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">último regreso de 1640 m.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El recorrido es 2Σ(k³+k²)−1640=1387440</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m. Sus cifras suman 27.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>