<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Diferencia de segmentos a partir de una altura</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,330.56 195.63,200.18 375.10,330.56 262.07,330.56 195.63,330.56 153.27,330.56 100.90,330.56" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="195.63,200.18 153.27,330.56" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="195.63,200.18 195.63,330.56" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="195.63,200.18 262.07,330.56" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="330.56447551534876" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="195.63476690020883" y="200.1776950555293" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="330.56447551534876" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="262.07014982212974" y="330.56447551534876" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="195.63476690020883" y="330.56447551534876" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="153.26953380041766" y="330.56447551534876" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="174.77288202663772" y="221.9088251321659" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="189.98467308028333" y="230.1666545612878" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="128.70288626416817" y="338.82230494447066" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="201.28486072013433" y="323.610513890825" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea h=BE y t=tan x. Entonces AF=h(tan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x−tan x).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las distancias FE y ED son h tan x y h</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan(45°−x), porque la segunda mitad en</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B mide 45°−x.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide FD entre AF. Sustituye tan</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x=2t/(1−t²) y tan(45°−x)=(1−t)/(1+t).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Queda (1−t)/t.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>