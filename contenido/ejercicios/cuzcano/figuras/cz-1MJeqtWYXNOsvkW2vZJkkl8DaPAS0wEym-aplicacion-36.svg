<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Una esfera recibe dos normales hacia abajo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="302.31,332.20 301.33,343.37 298.43,354.20 293.70,364.36 287.27,373.54 279.34,381.47 270.16,387.90 260.00,392.64 249.17,395.54 238.00,396.52 226.83,395.54 216.00,392.64 205.84,387.90 196.66,381.47 188.73,373.54 182.30,364.36 177.57,354.20 174.67,343.37 173.69,332.20 174.67,321.04 177.57,310.21 182.30,300.05 188.73,290.87 196.66,282.94 205.84,276.51 216.00,271.77 226.83,268.87 238.00,267.89 249.17,268.87 260.00,271.77 270.16,276.51 279.34,282.94 287.27,290.87 293.70,300.05 298.43,310.21 301.33,321.04 302.31,332.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,267.89 238.00,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="218.71,266.61 106.16,350.85" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="257.29,266.61 369.84,350.85" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="218.71,266.61 138.32,266.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="257.29,266.61 337.68,266.61" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="238.0" y="340.56472029399754" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 kg</text><text x="254.07799101674152" y="226.08942425479788" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="183.97795018374848" y="274.9665169456921" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="292.0220498162515" y="274.9665169456921" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las normales son simétricas. Sus</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes horizontales se anulan y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sus componentes verticales apuntan</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia abajo.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada componente vertical tiene</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">magnitud 80 cos 37°. El peso es 200 N.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cable equilibra el peso más ambas</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes. Usa cos 37°≈4/5 para la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximación del cuaderno.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>