<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Área inscrita con bisectriz y proyección</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="161.79,371.11 246.47,371.11 314.21,167.89" fill="#f4c581" fill-opacity="0.45"/><polyline points="161.79,371.11 246.47,371.11 314.21,371.11 314.21,167.89 161.79,371.11" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="314.21,167.89 246.47,371.11 238.00,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,396.52 177.03,350.79" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="144.85,396.52 238.00,396.52 331.15,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="365.02,269.50 364.62,259.53 363.45,249.63 361.51,239.85 358.80,230.25 355.35,220.89 351.17,211.84 346.30,203.13 340.76,194.84 334.58,187.01 327.81,179.69 320.49,172.92 312.66,166.74 304.37,161.20 295.66,156.33 286.61,152.15 277.25,148.70 267.65,145.99 257.87,144.05 247.97,142.88 238.00,142.48 228.03,142.88 218.13,144.05 208.35,145.99 198.75,148.70 189.39,152.15 180.34,156.33 171.63,161.20 163.34,166.74 155.51,172.92 148.19,179.69 141.42,187.01 135.24,194.84 129.70,203.13 124.83,211.84 120.65,220.89 117.20,230.25 114.49,239.85 112.55,249.63 111.38,259.53 110.98,269.50 111.38,279.47 112.55,289.37 114.49,299.15 117.20,308.75 120.65,318.11 124.83,327.16 129.70,335.87 135.24,344.16 141.42,351.99 148.19,359.31 155.51,366.08 163.34,372.26 171.63,377.80 180.34,382.67 189.39,386.85 198.75,390.30 208.35,393.01 218.13,394.95 228.03,396.12 238.00,396.52 247.97,396.12 257.87,394.95 267.65,393.01 277.25,390.30 286.61,386.85 295.66,382.67 304.37,377.80 312.66,372.26 320.49,366.08 327.81,359.31 334.58,351.99 340.76,344.16 346.30,335.87 351.17,327.16 355.35,318.11 358.80,308.75 361.51,299.15 363.45,289.37 364.62,279.47 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="169.5806451612903" y="356.7177419354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="161.79032258064518" y="371.11290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="314.2096774193548" y="371.11290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="314.2096774193548" y="167.8870967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="246.46774193548387" y="371.11290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="238.0" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="177.03225806451616" y="350.7903225806451" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E es el punto medio del arco menor UI,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que PE biseca ∠UPI. La razón</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">UN/NI=5/4 iguala UP/PI. Los lados UP,</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PI, UI son 5s, 4s, 3s.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon U=(0,0), I=(3s,0) y P=(3s,4s). El</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto más bajo del círculo es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E=(3s/2,−s/2). Su proyección sobre UP</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mide TU=s/2.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De TU=3 sale s=6. Entonces UI=18,</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">UN=10 y la altura del triángulo es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PI=24.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>