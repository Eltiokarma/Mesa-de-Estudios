<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">214 · Ángulos en dos triángulos isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.45,331.53 216.69,207.47 288.58,331.53 110.45,331.53 366.83,286.36 288.58,331.53" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="341.07024174837215" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="216.6879724571514" y="195.38503854501909" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="283.17786842302223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="288.5763041688496" y="343.6149614549809" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="146.0720005987576" y="325.8019235087194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="347.7410373475039" y="295.9014669560662" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="220.5050520170646" y="232.2834742908465" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3α</text><text x="292.39338372876284" y="313.7145049023277" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ADC, ∠ADC = 180° − 2α. En ABD, ∠ADB</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= 180° − 8α y ∠BAD = 5α.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con ley de senos, AB/AD = sen 8α/sen</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3α y AC/AD = 2 cos α. Igualando, sen</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">8α = 2 cos α sen 3α = sen 4α + sen 2α.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como sen 8α − sen 4α = 2 cos 6α sen</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2α, queda cos 6α = 1/2. Con 0° &lt; α &lt;</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">22,5°, resulta α = 10°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>