<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">039 · Magnitudes y unidades</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,205.52 375.10,205.52 375.10,150.68 100.90,150.68 100.90,205.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,296.92 375.10,296.92 375.10,242.08 100.90,242.08 100.90,296.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,388.32 375.10,388.32 375.10,333.48 100.90,333.48 100.90,388.32" fill="none" stroke="#008674" stroke-width="2.5"/><text x="117.04301075268818" y="170.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">masa molecular:u</text><text x="117.04301075268818" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">masa relativa:sin u</text><text x="117.04301075268818" y="352.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">fijar terminología</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I es falsa: confunde masa molecular,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">masa atómica y gramos. III y IV son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximaciones escolares válidas.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si peso molecular se usa</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">históricamente como masa molecular, II</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se acepta en u: F,V,V,V.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si significa masa molecular relativa,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es adimensional y II es falsa:</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F,F,V,V. Es preciso fijar el término.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>