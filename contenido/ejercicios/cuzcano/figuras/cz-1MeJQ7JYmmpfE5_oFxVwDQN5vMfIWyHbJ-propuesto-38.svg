<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Desprender parte de carga en resorte</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">fase (rad)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">elevación / (mg/K)</text><polyline points="100.90,396.52 105.47,396.34 110.04,395.82 114.61,394.95 119.18,393.74 123.75,392.19 128.32,390.30 132.89,388.08 137.46,385.54 142.03,382.67 146.60,379.50 151.17,376.02 155.74,372.26 160.31,368.21 164.88,363.89 169.45,359.31 174.02,354.49 178.59,349.43 183.16,344.16 187.73,338.68 192.30,333.01 196.87,327.16 201.44,321.16 206.01,315.02 210.58,308.75 215.15,302.37 219.72,295.91 224.29,289.37 228.86,282.78 233.43,276.15 238.00,269.50 242.57,262.85 247.14,256.22 251.71,249.63 256.28,243.09 260.85,236.63 265.42,230.25 269.99,223.98 274.56,217.84 279.13,211.84 283.70,205.99 288.27,200.32 292.84,194.84 297.41,189.57 301.98,184.51 306.55,179.69 311.12,175.11 315.69,170.79 320.26,166.74 324.83,162.98 329.40,159.50 333.97,156.33 338.54,153.46 343.11,150.92 347.68,148.70 352.25,146.81 356.82,145.26 361.39,144.05 365.96,143.18 370.53,142.66 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">oscilación</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si queda masa M, extensión</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inicial=(M+m)g/K y nuevo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilibrio=Mg/K.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La parte restante inicia en reposo a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia mg/K bajo el nuevo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilibrio, amplitud de la oscilación.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde extremo inferior a superior sube</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos amplitudes: Δhmax=2mg/K.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>