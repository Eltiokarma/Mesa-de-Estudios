<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">077 · Ángulo entre diagonales de un cuadrado y un rectángulo perpendicula</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,328.46 290.00,328.46 375.10,264.17 186.00,264.17" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,328.46 290.00,328.46 290.00,210.54 100.90,210.54" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,328.46 290.00,328.46 375.10,264.17 186.00,264.17 100.90,328.46" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,328.46 290.00,328.46 290.00,210.54 100.90,210.54 100.90,328.46" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,328.46 375.10,264.17" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="290.00,328.46 100.90,210.54" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.9032258064516" y="328.46197216829535" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="290.0022246941046" y="328.46197216829535" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="264.1683125464933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="185.99777530589543" y="264.1683125464933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="290.0022246941046" y="210.53802783170465" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="100.9032258064516" y="210.53802783170465" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a=AD y h=BM. Las direcciones son</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC=(a,a,0), BN=(−a,0,h), con</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h/a=7/(3√14).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El producto escalar es −a². Los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">módulos son a√2 y √(a²+h²). Como</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h²/a²=7/18, su cociente da coseno</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−3/5.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo vectorial es obtuso. Para</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectas sin orientación se toma el</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agudo suplementario.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>