<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">050 · Recta definida por un trapecio y una bisectriz</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="110.98387096774195" y1="105" x2="110.98387096774195" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="110.98,142.48 203.97,235.47 365.02,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">L</text><polyline points="110.98,396.52 203.97,235.47 272.03,235.47 365.02,396.52 110.98,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Trapecio</text><polyline points="110.98,396.52 301.51,286.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Bisectriz</text><circle cx="110.98387096774195" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="117.98387096774195" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="110.98387096774195" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="117.98387096774195" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">E</text><circle cx="365.01612903225816" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="372.01612903225816" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="203.9661308000792" cy="235.46613080007916" r="3.7" fill="#20364b"/><text x="210.9661308000792" y="227.46613080007916" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="272.0338691999209" cy="235.46613080007916" r="3.7" fill="#20364b"/><text x="279.0338691999209" y="227.46613080007916" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="301.508064516129" cy="286.51693459996045" r="3.7" fill="#20364b"/><text x="308.508064516129" y="278.51693459996045" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea T el cruce de OR con AM, más allá</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de M. La perpendicularidad y la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisectriz dan ∠OAT=∠ATO=90°−∠AOI. Por</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tanto OT=OA y la altura OI biseca TA,</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">luego TI=IA.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como TI=TM+MI, se obtiene TM=RM. El</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelismo RM∥OA da por semejanza</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">TA=OA. OAT es equilátero. Así</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠OAR=60°−15°=45°.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De RE=4√2 y pendiente −1 se obtiene</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x_R=4. Sobre OT, y_R=4√3. La recta</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene suma x+y=4+4√3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>