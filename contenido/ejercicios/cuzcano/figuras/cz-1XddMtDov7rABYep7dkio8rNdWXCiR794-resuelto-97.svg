<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">097 · Caminar de ida y vuelta hacia un límite</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,318.35 375.10,318.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,259.73 320.26,259.73" fill="none" stroke="#d37618" stroke-width="2.5"/><line x1="320.258064516129" y1="259.7295285359802" x2="311.12717511300593" y2="263.8071330665759" stroke="#d37618" stroke-width="2"/><line x1="320.258064516129" y1="259.7295285359802" x2="311.12717511300593" y2="255.6519240053845" stroke="#d37618" stroke-width="2"/><polyline points="320.26,201.11 144.77,201.11" fill="none" stroke="#008674" stroke-width="2.5"/><line x1="144.7741935483871" y1="201.10669975186104" x2="153.9050829515102" y2="197.02909522126535" stroke="#008674" stroke-width="2"/><line x1="144.7741935483871" y1="201.10669975186104" x2="153.9050829515102" y2="205.18430428245674" stroke="#008674" stroke-width="2"/><polyline points="144.77,142.48 285.16,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><line x1="285.16129032258067" y1="142.4838709677419" x2="276.0304009194576" y2="146.5614754983376" stroke="#b0467a" stroke-width="2"/><line x1="285.16129032258067" y1="142.4838709677419" x2="276.0304009194576" y2="138.4062664371462" stroke="#b0467a" stroke-width="2"/><text x="107.90322580645162" y="368.9751861042183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="378.28853046594986" y="368.9751861042183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="324.9731182795699" y="368.9751861042183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="149.0322580645161" y="368.9751861042183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D</text><text x="289.1756272401434" y="368.9751861042183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">E</text><text x="220.62724014336916" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">límite: 160 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El primer desplazamiento es 288 m;</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cada siguiente cambia de signo y mide</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4/5 del anterior.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La posición límite desde A es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">288/(1+4/5)=160 m.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia a B es 360−160=200 m. A 1</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m/s, el recorrido total es 1440 m y se</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproxima a esa posición en 24 min.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>