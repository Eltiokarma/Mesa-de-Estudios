<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">065 · La base es una cifra</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">cifra o parámetro</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">valor</text><polyline points="100.90,396.52 100.90,251.35 155.74,251.35 155.74,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="210.58,396.52 210.58,142.48 265.42,142.48 265.42,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="320.26,396.52 320.26,215.06 375.10,215.06 375.10,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="128.3225806451613" cy="251.35483870967744" r="3.7" fill="#20364b"/><text x="135.3225806451613" y="243.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a=4</text><circle cx="238.00000000000003" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="245.00000000000003" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">b=7</text><circle cx="347.6774193548387" cy="215.06451612903226" r="3.7" fill="#20364b"/><text x="354.6774193548387" y="207.06451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">n=5</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a(n+3)+b=nb+a: a(n+2)=b(n−1). Además</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a+b+n=16 y n,a&lt;b.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplicando las restricciones de cifras</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se obtiene a=4, b=7, n=5.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Evaluar la operación pedida con esos</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valores da 4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>