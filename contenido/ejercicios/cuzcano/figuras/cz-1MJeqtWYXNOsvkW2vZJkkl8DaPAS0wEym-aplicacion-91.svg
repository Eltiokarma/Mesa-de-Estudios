<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">091 · Dos bloques sostienen una barra de 700 kg</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="181.39,338.87 312.27,240.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="133.62,268.52 133.50,270.05 133.14,271.55 132.55,272.97 131.75,274.29 130.75,275.46 129.58,276.46 128.26,277.26 126.84,277.85 125.34,278.21 123.81,278.33 122.27,278.21 120.77,277.85 119.35,277.26 118.04,276.46 116.87,275.46 115.87,274.29 115.06,272.97 114.47,271.55 114.11,270.05 113.99,268.52 114.11,266.98 114.47,265.49 115.06,264.06 115.87,262.75 116.87,261.58 118.04,260.58 119.35,259.77 120.77,259.18 122.27,258.82 123.81,258.70 125.34,258.82 126.84,259.18 128.26,259.77 129.58,260.58 130.75,261.58 131.75,262.75 132.55,264.06 133.14,265.49 133.50,266.98 133.62,268.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="362.01,168.72 361.88,170.36 361.50,171.96 360.87,173.48 360.01,174.88 358.94,176.13 357.69,177.19 356.29,178.05 354.77,178.68 353.18,179.06 351.54,179.19 349.90,179.06 348.30,178.68 346.78,178.05 345.38,177.19 344.13,176.13 343.07,174.88 342.21,173.48 341.58,171.96 341.20,170.36 341.07,168.72 341.20,167.08 341.58,165.49 342.21,163.97 343.07,162.57 344.13,161.32 345.38,160.25 346.78,159.39 348.30,158.76 349.90,158.38 351.54,158.25 353.18,158.38 354.77,158.76 356.29,159.39 357.69,160.25 358.94,161.32 360.01,162.57 360.87,163.97 361.50,165.49 361.88,167.08 362.01,168.72" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="181.39,338.87 131.66,262.63" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="113.99,268.52 113.99,358.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="312.27,240.71 343.36,162.51" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="362.01,168.72 362.01,278.99" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,358.83 127.08,358.83 127.08,380.75 100.90,380.75 100.90,358.83" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="348.92,278.99 375.10,278.99 375.10,300.91 348.92,300.91 348.92,278.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="181.3944106551698" y="347.04638540303336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="321.435984294403" y="244.63280468088382" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="155.87281545923474" y="331.0135884209716" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53°</text><text x="332.56078220032333" y="233.50800677496343" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="113.99122334282856" y="369.950381091693" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P₁</text><text x="362.00877665717144" y="290.11359611979367" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cancela g en todas las ecuaciones. Al</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tomar momentos respecto de B, la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuerda de A tiene brazo igual a la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud y el peso de la barra tiene</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">brazo (ℓ/2)sen 53°. Con sen 53°≈4/5,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usando el triángulo 3-4-5, la cuerda</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de A aporta componentes equivalentes a</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−168 y +224 kg multiplicados por g. La</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de B debe aportar +168 y +476 en esas</text><text x="482" y="315" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">unidades.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto P₂≈√(168²+476²)=504,78 kg y</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan α≈476/168=2,83. La suma de las</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">masas supera 700 kg.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>