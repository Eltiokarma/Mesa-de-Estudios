<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Dos ángulos obtusos en triángulos congruentes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="109.21,291.77 191.15,244.46 238.46,257.14" fill="#f4c581" fill-opacity="0.45"/><polygon points="238.46,257.14 273.09,291.77 367.71,291.77" fill="#f4c581" fill-opacity="0.45"/><polyline points="109.21,291.77 191.15,244.46 238.46,257.14 367.71,291.77 109.21,291.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.21,291.77 238.46,257.14 273.09,291.77" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.9032258064516" y="303.7712192084002" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="184.69053649359375" y="235.22878079159975" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="303.7712192084002" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="236.61518409905509" y="246.05865930908058" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="268.47784718073603" y="303.7712192084002" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="145.2173346366895" y="288.076638997691" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15°</text><text x="202.2315379055629" y="258.30904580734864" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="285.0956379920752" y="284.38379659517113" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los lados opuestos a los dos ángulos x</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son AO y OC, por lo que AO=OC.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En AOC resultan iguales los ángulos en</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A y C, ambos de 15°. El ángulo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior AOB mide 30°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el par congruente, ese 30° no puede</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corresponder al vértice C, donde hay</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15°. Corresponde al ángulo en O de</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OPC. Así x=180°−30°−15°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>