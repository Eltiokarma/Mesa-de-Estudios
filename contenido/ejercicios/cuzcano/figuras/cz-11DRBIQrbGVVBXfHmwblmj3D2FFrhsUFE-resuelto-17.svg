<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Bisectriz en un triángulo de lados 5 y 12</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.67,316.93 158.29,219.68 364.73,316.93 109.67,316.93" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="158.29,219.68 158.29,316.93" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="158.29,219.68 226.04,316.93" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645159" y="325.6937359339835" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="156.69842460615152" y="211.7121155288822" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="324.0995873968492" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="157.49549887471866" y="327.28788447111776" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="225.24681170292575" y="327.28788447111776" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="128.80082520630157" y="270.6956114028507" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="263.50637659414855" y="258.7394973743436" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">12</text><text x="187.78432108027005" y="256.3482745686422" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="167.8574643660915" y="253.15997749437358" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras AC=13. Comparando áreas,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BH=5×12/13=60/13.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por las proyecciones sobre la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hipotenusa, HC=12²/13=144/13.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La bisectriz en HBC da</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">HD/DC=BH/BC=5/13. Por tanto</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DC=(13/18)HC.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>