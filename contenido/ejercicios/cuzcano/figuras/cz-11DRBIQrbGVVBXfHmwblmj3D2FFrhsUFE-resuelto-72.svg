<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">072 · Base de un cuadrilátero con dos lados conocidos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.31,349.16 181.68,230.59 238.74,188.35 367.69,343.24 108.31,349.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="181.68,230.59 181.68,346.94" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.74,188.35 240.96,346.20" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.9032258064516" y="358.7981691368788" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="175.75065387968613" y="225.4067131647777" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="236.5178727114211" y="180.2018308631212" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="349.16434176111596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="144.62598081952922" y="287.65605928509154" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10</text><text x="313.588491717524" y="258.01351351351354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">11√2</text><text x="129.06364428945074" y="341.012641673932" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53°</text><text x="344.7131647776809" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45°</text><text x="244.66957279860503" y="212.80863121185703" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">98°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon AD horizontal. B tiene abscisa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">10cos53° y altura 10sen53°. El punto C</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda 11 m a la izquierda y 11 m por</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">encima de D.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el ángulo C de 98°, el segmento BC</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">forma 37° con la horizontal. Su</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección horizontal vale</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(11−10sen53°)/tan37°.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma la abscisa de B, la proyección de</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC y los 11 m finales.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>