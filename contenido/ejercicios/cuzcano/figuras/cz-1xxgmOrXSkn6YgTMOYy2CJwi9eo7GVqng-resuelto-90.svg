<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">090 · Cruce de diagonales a partir de cuatro ángulos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.43,225.29 239.31,211.64 369.19,225.29 174.01,324.74 109.43,225.29 369.19,225.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="174.01,324.74 239.31,211.64" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.9032258064516" y="222.00932510994218" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="236.68806914647323" y="203.76650770354203" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.0967741935484" y="227.9130139508127" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="170.0778501888641" y="335.23349229645794" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="220.93504119499673" y="233.1607373649198" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="134.35746257138447" y="220.04142882965203" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6°</text><text x="123.86201574317023" y="241.0323224860805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">57°</text><text x="331.1470906004013" y="220.04142882965203" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6°</text><text x="329.8351597468745" y="237.75249535226354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">27°</text><text x="239.30207314437163" y="218.72949797612526" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea O el cruce de la prolongación de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DE con la mediatriz de DN. Como R está</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en esa mediatriz, la simetría da</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠RON=90°−57°=33°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por suma en N, ∠RNE=6°+27°=33°.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">También ∠ROE=33°, así que R,E,O,N son</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">concíclicos por igualdad de los</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos que abarcan RE.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces ∠REN=∠RON=33°. El exterior</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">RPN del triángulo PEN vale 33°+27°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>