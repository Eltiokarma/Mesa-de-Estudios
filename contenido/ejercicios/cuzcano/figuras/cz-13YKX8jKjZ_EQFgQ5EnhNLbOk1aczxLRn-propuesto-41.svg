<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Cuadrilátero común a dos triángulos opuestos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,330.43 170.54,260.80 222.77,330.43" fill="#f4c581" fill-opacity="0.45"/><polygon points="222.77,330.43 279.89,254.27 375.10,330.43" fill="#f4c581" fill-opacity="0.45"/><polygon points="131.37,208.57 170.54,260.80 222.77,208.57" fill="#f4c581" fill-opacity="0.45"/><polygon points="222.77,208.57 279.89,254.27 314.16,208.57" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,330.43 131.37,208.57 314.16,208.57 375.10,330.43 100.90,330.43" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,330.43 222.77,208.57 375.10,330.43" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="131.37,208.57 222.77,330.43 314.16,208.57" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645163" y="330.43189964157705" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="375.09677419354836" y="330.43189964157705" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="131.36917562724014" y="208.56810035842295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="222.7670250896057" y="208.56810035842295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="314.1648745519713" y="208.56810035842295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="222.7670250896057" y="330.43189964157705" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="170.53968253968253" y="260.79544290834616" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="279.8906810035842" y="254.26702508960574" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos MRA e ISP comparten</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PERU. Por tanto sus áreas difieren en</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">16−8=8.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambos tienen la altura del trapecio.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como sus bases están en razón 3:2, sus</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">áreas son 24 y 16.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Quita los dos triángulos inferiores,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de área total 16, de MRA.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>