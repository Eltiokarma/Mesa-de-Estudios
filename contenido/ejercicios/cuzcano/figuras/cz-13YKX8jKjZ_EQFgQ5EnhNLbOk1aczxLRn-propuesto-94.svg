.05 347.68,255.79" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,338.05 374.99,332.67 374.67,327.29 374.15,321.93 373.41,316.60 372.46,311.30 371.31,306.04 369.95,300.83 368.39,295.68 366.62,290.60 364.66,285.58 362.50,280.65 360.15,275.81 357.62,271.06 354.89,266.42 351.99,261.88 348.91,257.46 345.66,253.17 342.25,249.01 338.67,244.99 334.94,241.11 331.06,237.38 327.04,233.80 322.88,230.38 318.58,227.13 314.17,224.06 309.63,221.15 304.99,218.43 300.24,215.89 295.40,213.54 290.46,211.39 285.45,209.43 280.37,207.66 275.21,206.10 270.00,204.74 264.75,203.59 259.45,202.64 254.11,201.90 248.76,201.37 243.38,201.06 238.00,200.95 232.62,201.06 227.24,201.37 221.89,201.90 216.55,202.64 211.25,203.59 206.00,204.74 200.79,206.10 195.63,207.66 190.55,209.43 185.54,211.39 180.60,213.54 175.76,215.89 171.01,218.43 166.37,221.15 161.83,224.06 157.42,227.13 153.12,230.38 148.96,233.80 144.94,237.38 141.06,241.11 137.33,244.99 133.75,249.01 130.34,253.17 127.09,257.46 124.01,261.88 121.11,266.42 118.38,271.06 115.85,275.81 113.50,280.65 111.34,285.58 109.38,290.60 107.61,295.68 106.05,300.83 104.69,306.04 103.54,311.30 102.59,316.60 101.85,321.93 101.33,327.29 101.01,332.67 100.90,338.05" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.9032258064516" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="128.32258064516128" y="255.79032258064515" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="347.6774193548387" y="255.79032258064515" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="128.32258064516128" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="237.99999999999997" y="255.79032258064515" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con centro (0,0) y radio r, C=(−r+1,h)</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y P=(0,h). Entonces HP²=(r−1)²+h²=r²,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por lo que r=5. Resultan C=(−4,3),</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(4,3).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segmento circular sobre CD es el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sector menos el triángulo OCD. El</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo BCD tiene la misma base y</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura 3, y cancela ese triángulo.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El sector tiene ángulo central</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2arcsin(4/5). Expresa el ángulo en</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radianes al calcular el área.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>