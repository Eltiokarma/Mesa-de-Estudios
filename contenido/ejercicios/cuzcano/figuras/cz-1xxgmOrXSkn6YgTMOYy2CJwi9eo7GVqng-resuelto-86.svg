<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">086 · Tres segmentos de la misma longitud</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.36,336.00 301.98,203.63 370.05,336.00 110.36,336.00 230.12,295.03 370.05,336.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645164" y="342.93344456803857" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="303.86948461253246" y="196.06655543196146" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="375.0967741935484" y="342.3031145717464" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="227.59955506117907" y="288.0947348906192" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="133.05005561735263" y="325.28420467185765" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="341.0589543937709" y="316.45958472376714" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2x</text><text x="167.7182054134223" y="312.0472747497219" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=</text><text x="305.760474601409" y="313.30793474230626" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=</text><text x="335.3859844271413" y="270.44549499443826" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma las tres longitudes iguales a 1.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea θ=∠ADO. Con D=(0,0) y DO</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal, O=(2cosθ,0) y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">L=(2cosθ−cos(θ+2x),sen(θ+2x)).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como DL forma x con la base, proyecta</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">L sobre una normal a DL. Resulta</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen(θ+3x)=2cosθ sen x.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Expande el seno compuesto y usa las</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">identidades de ángulo triple. Queda</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1−4sen²x)sen(θ+x)=0. En el dibujo</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0&lt;θ&lt;x&lt;90° y 2x&lt;180°, por lo que</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen(θ+x)&gt;0. Así sen x=1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>