<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">139 · Altura donde g se reduce a un cuarto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">h/R</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">g/g0</text><polyline points="100.90,142.48 105.47,158.61 110.04,173.25 114.61,186.57 119.18,198.74 123.75,209.88 128.32,220.10 132.89,229.51 137.46,238.19 142.03,246.20 146.60,253.62 151.17,260.51 155.74,266.91 160.31,272.87 164.88,278.42 169.45,283.61 174.02,288.47 178.59,293.02 183.16,297.28 187.73,301.29 192.30,305.06 196.87,308.62 201.44,311.96 206.01,315.12 210.58,318.11 215.15,320.94 219.72,323.61 224.29,326.15 228.86,328.55 233.43,330.84 238.00,333.01 242.57,335.07 247.14,337.04 251.71,338.91 256.28,340.70 260.85,342.40 265.42,344.03 269.99,345.59 274.56,347.07 279.13,348.49 283.70,349.86 288.27,351.16 292.84,352.41 297.41,353.61 301.98,354.77 306.55,355.87 311.12,356.93 315.69,357.95 320.26,358.94 324.83,359.88 329.40,360.79 333.97,361.67 338.54,362.51 343.11,363.33 347.68,364.11 352.25,364.87 356.82,365.60 361.39,366.31 365.96,366.99 370.53,367.65 375.10,368.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">campo exterior</text><circle cx="237.99999999999997" cy="333.008064516129" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="325.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">h=R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Fuera de una Tierra esférica,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">g/g0=R²/(R+h)².</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/4=R²/(R+h)² implica R+h=2R.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura es h=R; 2R es la distancia</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">al centro.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>