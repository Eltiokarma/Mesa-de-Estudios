<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Segmento entre dos puntos que dividen diagonales cruzadas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.50,305.26 149.91,228.44 279.73,228.44 241.31,305.26 111.50,305.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="279.73,228.44 372.45,228.44 241.31,305.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="241.31,305.26 187.00,228.44" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="111.50,305.26 372.45,228.44" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="200.58,247.64 307.21,247.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="313.2120149602618" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="141.96602773881875" y="221.8141654978962" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="282.37431821723544" y="220.48955898394888" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="243.96072931276296" y="319.83504752999846" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="183.02882967118592" y="219.16495247000154" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="375.0967741935484" y="227.11259155368552" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="193.62568178276453" y="258.90314788842136" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="308.866448496182" y="258.90314788842136" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como BC∥AD, el triángulo ECD es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">isósceles por los ángulos de la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisectriz interna. El mismo argumento</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con la externa da CF=CD. Por tanto</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EC=CF=5 y EF=10.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De las razones dadas, P=(D+3E)/4 y</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">S=(A+3F)/4. Están a la misma altura y</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PS es horizontal.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tomando positiva la dirección de A</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia D, la diferencia horizontal S−P</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es (−AD+3 EF)/4=(−7+30)/4=23/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>