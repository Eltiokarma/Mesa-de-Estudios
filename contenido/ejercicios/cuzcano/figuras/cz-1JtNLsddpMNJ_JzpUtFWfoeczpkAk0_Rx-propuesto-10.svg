<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Separación mínima para el diámetro máximo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,160.97 375.10,160.97" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,275.21 375.10,275.21" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="185.45,275.21 290.55,275.21" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="240.57,160.97 240.56,161.24 240.51,161.52 240.44,161.79 240.33,162.04 240.20,162.29 240.05,162.52 239.87,162.73 239.66,162.92 239.44,163.09 239.20,163.24 238.95,163.35 238.69,163.44 238.42,163.50 238.14,163.53 237.86,163.53 237.58,163.50 237.31,163.44 237.05,163.35 236.80,163.24 236.56,163.09 236.34,162.92 236.13,162.73 235.95,162.52 235.80,162.29 235.67,162.04 235.56,161.79 235.49,161.52 235.44,161.24 235.43,160.97 235.44,160.69 235.49,160.41 235.56,160.14 235.67,159.89 235.80,159.64 235.95,159.41 236.13,159.20 236.34,159.01 236.56,158.84 236.80,158.69 237.05,158.58 237.31,158.49 237.58,158.43 237.86,158.40 238.14,158.40 238.42,158.43 238.69,158.49 238.95,158.58 239.20,158.69 239.44,158.84 239.66,159.01 239.87,159.20 240.05,159.41 240.20,159.64 240.33,159.89 240.44,160.14 240.51,160.41 240.56,160.69 240.57,160.97" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,160.97 185.45,275.21 132.89,160.97" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,160.97 290.55,275.21 343.11,160.97" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,389.46 185.45,275.21" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,389.46 290.55,275.21" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="331.11155913978496" y="149.54032258064518" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">techo</text><text x="313.9744623655914" y="287.77956989247315" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">espejo</text><text x="249.4247311827957" y="158.68010752688173" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">fuente</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el espejo, el haz incidente tiene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radio d tan 37°, limitado por el radio</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 15 cm del disco.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el techo, la proyección reflejada</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">duplica ese radio por semejanza</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto de la fuente virtual.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El diámetro se satura cuando d tan</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">37°=15 cm. Con tan 37°≈3/4, la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separación mínima es 20 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>