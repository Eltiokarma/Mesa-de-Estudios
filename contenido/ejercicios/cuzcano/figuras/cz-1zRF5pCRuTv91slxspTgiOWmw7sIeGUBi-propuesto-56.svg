<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">056 · Radical que también presenta resonancia</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="126.66666666666667" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="111.33333333333334" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Especie</text><rect x="174.66666666666669" y="130" width="126.66666666666667" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="238.00000000000003" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">e⁻ de valencia</text><rect x="301.33333333333337" y="130" width="126.66666666666667" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="364.6666666666667" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Diagnóstico</text><rect x="48.0" y="178" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">NO₂</text><rect x="174.66666666666669" y="178" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">17</text><rect x="301.33333333333337" y="178" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Radical</text><rect x="48.0" y="226" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">O₃</text><rect x="174.66666666666669" y="226" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">18</text><rect x="301.33333333333337" y="226" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Octeto + reson.</text><rect x="48.0" y="274" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">BeF₂</text><rect x="174.66666666666669" y="274" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">16</text><rect x="301.33333333333337" y="274" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Be con 4 e⁻</text><text x="48" y="349" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Octeto y resonancia</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">NO₂ cuenta 5+2·6=17 electrones de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valencia. Queda un electrón</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desapareado y el doble enlace se puede</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">situar en cualquiera de los dos</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">oxígenos.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O₃ tiene dos formas resonantes de</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Lewis con octeto en los tres oxígenos.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la representación habitual de BeF₂</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el Be central tiene dos enlaces y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">octeto incompleto, pero no hay</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posiciones equivalentes de un enlace</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">múltiple. Solo se cumple en NO₂.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>