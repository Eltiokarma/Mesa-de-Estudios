<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">059 · Dos mitades determinadas por ángulos exteriores</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,190.67 265.42,190.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,300.35 196.87,300.35 265.42,190.67 298.32,327.77" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="169.45,252.36 265.42,190.67" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="169.45,252.36 298.32,327.77 347.68,355.19" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="298.32,327.77 375.10,327.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="109.12903225806451" y="183.81451612903228" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="109.12903225806451" y="292.9435483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="364.1290322580645" y="320.08870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₃</text><text x="181.79032258064515" y="253.73387096774192" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="188.64516129032256" y="288.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="302.98387096774195" y="316.5241935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="250.3387096774194" y="197.5241935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="251.43548387096774" y="207.66935483870967" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="294.4838709677419" y="306.9274193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t</text><text x="313.95161290322585" y="334.07258064516134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La transversal que corta L₂ con ángulo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">β forma con L₁, en el sector bisecado,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°−β. El lado superior izquierdo del</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo sube con inclinación</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(180°−β)/2.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En L₃, si t es la inclinación</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">descendente del lado inferior hacia la</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha, las marcas dan θ+2t=180°.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo en el vértice izquierdo es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(180°−β)/2+t=180°−(θ+β)/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>