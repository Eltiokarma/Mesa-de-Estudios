 353.30,320.86 357.32,316.37 360.97,311.68 364.22,306.81 367.07,301.79 369.50,296.62 371.50,291.34 373.07,285.96 374.19,280.51 374.87,275.02 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="164.18,269.50 375.10,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="164.1786600496278" cy="269.5" r="3.7" fill="#20364b"/><text x="171.1786600496278" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">V(3,2)</text><circle cx="332.9131513647643" cy="269.5" r="3.7" fill="#20364b"/><text x="339.9131513647643" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F(11,2)</text><circle cx="269.6377171215881" cy="269.5" r="3.7" fill="#20364b"/><text x="276.6377171215881" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El eje mayor es horizontal. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separación vértice–foco opuesto es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a+c=8 y b=4.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa (a−c)(a+c)=b²=16. Resulta a−c=2,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por lo que a=5 y c=3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro está a 5 unidades a la</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha del vértice, en (8,2).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye en la forma canónica.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>