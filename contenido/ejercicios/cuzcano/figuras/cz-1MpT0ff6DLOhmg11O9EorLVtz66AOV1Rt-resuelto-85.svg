<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">085 · Recta perpendicular a una mediana en el baricentro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="372.8098294495766" x2="421" y2="372.8098294495766" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645159" y1="105" x2="100.90322580645159" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,372.81 100.90,166.19 375.10,372.81 100.90,372.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Triángulo</text><polyline points="100.90,166.19 238.00,372.81" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Mediana</text><polyline points="100.90,364.58 375.10,182.65" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">L</text><circle cx="100.90322580645159" cy="372.8098294495766" r="3.7" fill="#20364b"/><text x="107.90322580645159" y="364.8098294495766" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="100.90322580645159" cy="166.19017055042337" r="3.7" fill="#20364b"/><text x="107.90322580645159" y="158.19017055042337" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="375.09677419354836" cy="372.8098294495766" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="364.8098294495766" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="192.30107526881721" cy="303.93660981652556" r="3.7" fill="#20364b"/><text x="199.30107526881721" y="295.93660981652556" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">G</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si c=OC, entonces c=12·cot(37°). El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto medio de OC es (c/2,0).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La mediana desde B tiene pendiente</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−24/c y la perpendicular tiene</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente c/24.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El baricentro es G=(c/3,4). Usa la</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ecuación por G.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>