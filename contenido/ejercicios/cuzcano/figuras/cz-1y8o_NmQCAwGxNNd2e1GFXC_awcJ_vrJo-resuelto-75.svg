<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">075 · Distancia entre dos cruces en un trapecio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="115.23,357.49 195.03,177.42 368.96,177.42 368.96,357.49 115.23,357.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="195.03,177.42 368.96,249.04 115.23,357.49" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="155.13,267.45 368.96,177.42" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="155.13,267.45 368.96,357.49" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="242.09,303.26 281.99,213.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645159" y="373.85724602792493" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="188.89070775156475" y="167.18897448242654" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="368.95811266249405" y="165.14275397207507" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="373.05055368319694" y="373.85724602792493" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="139.7814155031295" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="375.0967741935484" y="253.13023591718826" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="285.0630717380838" y="206.06716417910445" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="242.09244102070292" y="320.6555127587867" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con N=(0,0), toma C=(0,c), D=(0,−d).</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La igualdad angular obliga a B=(−kc,c)</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y A=(−kd,−d) para una constante k&gt;0.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como M=(A+B)/2, la recta que une M con</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B/2 es paralela a (k,1), y C−B/2</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también es paralelo a (k,1). Por tanto</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Q=B/2. Análogamente R=A/2, pues</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M−A/2=B/2 y D−A/2 son paralelos a</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así el vector R→Q es (B−A)/2. Su</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud es AB/2=8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>