<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">117 · Normal y contacto en bloques</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="225.29838709677418" y1="105" x2="225.29838709677418" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="225.30,269.50 225.30,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">normal en D (N)</text><line x1="225.29838709677418" y1="142.48387096774195" x2="229.37599162736987" y2="151.61476037086504" stroke="#1766b0" stroke-width="2"/><line x1="225.29838709677418" y1="142.48387096774195" x2="221.22078256617849" y2="151.61476037086504" stroke="#1766b0" stroke-width="2"/><polyline points="225.30,269.50 225.30,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">peso superior (N)</text><line x1="225.29838709677418" y1="396.51612903225805" x2="221.22078256617849" y2="387.38523962913496" stroke="#d37618" stroke-width="2"/><line x1="225.29838709677418" y1="396.51612903225805" x2="229.37599162736987" y2="387.38523962913496" stroke="#d37618" stroke-width="2"/><polyline points="225.30,269.50 250.70,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="498" font-family="Arial,sans-serif" font-size="12" fill="#008674" text-anchor="start">fricción requerida (N)</text><line x1="250.7016129032258" y1="269.5" x2="241.5707235001027" y2="273.5776045305957" stroke="#008674" stroke-width="2"/><line x1="250.7016129032258" y1="269.5" x2="241.5707235001027" y2="265.4223954694043" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En parejas horizontales, la fuerza</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre el bloque delantero es ma: 0,4 N</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 0,2 N.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En las pilas, la normal entre bloques</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale el peso del superior: 2 N en C y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1 N en D.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto «en D, R=2 N» es falsa si R</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">designa la normal. Si designa contacto</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">total, deben incluirse fuerzas</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangenciales.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>