<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">075 · Distancias máximas desde los vértices a una recta</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="299.3036465638149" x2="421" y2="299.3036465638149" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="238.00,180.09 134.76,358.91 341.24,358.91 238.00,180.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">ABC</text><polyline points="100.90,299.30 375.10,299.30" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Recta</text><polyline points="238.00,180.09 238.00,299.30" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">d(A)</text><polyline points="134.76,358.91 134.76,299.30" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">d(B)</text><polyline points="341.24,358.91 341.24,299.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="503" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">d(C)</text><circle cx="238.0" cy="180.0890603085554" r="3.7" fill="#20364b"/><text x="245.0" y="172.0890603085554" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="134.76016830294526" cy="358.9109396914446" r="3.7" fill="#20364b"/><text x="141.76016830294526" y="350.9109396914446" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="341.23983169705474" cy="358.9109396914446" r="3.7" fill="#20364b"/><text x="348.23983169705474" y="350.9109396914446" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="238.0" cy="299.3036465638149" r="3.7" fill="#20364b"/><text x="245.0" y="291.3036465638149" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">G</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia del centro a cada vértice</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es R=L/√3. Si θ mide el ángulo del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primer radio con la recta, las</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancias son R por los valores</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">absolutos de sen θ, sen(θ+120°),</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El producto de los tres senos es −sen</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3θ/4 por las identidades de suma y</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo triple.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El valor absoluto alcanza 1/4 cuando</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3θ=90° módulo 180°. Multiplica por R³.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>