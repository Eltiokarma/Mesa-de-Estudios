<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">053 · Tensión interna de un anillo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="371.17,269.50 370.48,282.78 368.40,295.91 364.96,308.75 360.19,321.16 354.16,333.01 346.92,344.16 338.55,354.49 329.15,363.89 318.82,372.26 307.67,379.50 295.82,385.54 283.41,390.30 270.57,393.74 257.44,395.82 244.16,396.52 230.88,395.82 217.75,393.74 204.91,390.30 192.50,385.54 180.65,379.50 169.50,372.26 159.17,363.89 149.77,354.49 141.40,344.16 134.16,333.01 128.12,321.16 123.36,308.75 119.92,295.91 117.84,282.78 117.14,269.50 117.84,256.22 119.92,243.09 123.36,230.25 128.12,217.84 134.16,205.99 141.40,194.84 149.77,184.51 159.17,175.11 169.50,166.74 180.65,159.50 192.50,153.46 204.91,148.70 217.75,145.26 230.88,143.18 244.16,142.48 257.44,143.18 270.57,145.26 283.41,148.70 295.82,153.46 307.67,159.50 318.82,166.74 329.15,175.11 338.55,184.51 346.92,194.84 354.16,205.99 360.19,217.84 364.96,230.25 368.40,243.09 370.48,256.22 371.17,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="244.16,269.50 348.85,341.09" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.21,243.33 139.47,181.74" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="129.66,190.72 139.47,181.74 138.70,195.02" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="104.82551319648093" y="216.3841642228739" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 A</text><text x="292.6554252199413" y="297.9824046920821" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 m</text><text x="365.7859237536657" y="178.6642228739003" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊗ 0,5 T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Corta imaginariamente el anillo por un</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diámetro. En el semianillo aparecen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos tensiones iguales en los extremos</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del corte.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza magnética sobre la mitad</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivale a la de un tramo de longitud</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2R. En estos sentidos empuja el</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semianillo hacia fuera y vale</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I(2R)B=40 N.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las tensiones se oponen a esa fuerza.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Del equilibrio, 2T=40 N.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>