<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Dos mesetas de NO₂ y N₂O₄</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">Tiempo (min)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Concentración (mol/L)</text><polyline points="100.90,142.48 135.18,234.57 169.45,288.55 203.73,320.31 238.00,333.01 306.55,333.01 306.55,342.53 320.26,332.37 340.82,326.66 375.10,326.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">NO₂</text><polyline points="100.90,396.52 135.18,350.47 169.45,323.48 203.73,307.60 238.00,301.25 306.55,301.25 306.55,273.31 320.26,278.39 340.82,281.25 375.10,281.25" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">N₂O₄</text><circle cx="238.00000000000003" cy="301.2540322580645" r="3.7" fill="#20364b"/><text x="245.00000000000003" y="293.2540322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">20</text><circle cx="306.54838709677415" cy="273.3104838709678" r="3.7" fill="#20364b"/><text x="313.54838709677415" y="265.3104838709678" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">30</text><circle cx="340.8225806451613" cy="281.2489919354839" r="3.7" fill="#20364b"/><text x="347.8225806451613" y="273.2489919354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">35</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ubica las dos zonas planas. La primera</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">comienza a los 20 min y la siguiente a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los 35 min.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la primera meseta se han consumido</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">8−2=6 mol/L de NO₂. Por cada dos se</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">forma uno de N₂O₄, así que [N₂O₄]=3</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mol/L.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Evalúa Kc=3/2². El gráfico indica el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">instante de perturbación. Sus alturas</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posteriores son esquemáticas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>