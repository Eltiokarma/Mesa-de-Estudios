<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">107 · Velas y sombra en pared</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="153.32,368.29 322.68,368.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="153.32,368.29 153.32,170.71" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="181.55,368.29 181.55,198.94" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="294.45,368.29 294.45,311.84" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="322.68,368.29 322.68,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="153.32,170.71 322.68,340.06" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="160.32258064516128" y="162.70967741935488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A:7L</text><text x="188.5483870967742" y="190.93548387096777" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B:6L</text><text x="301.45161290322585" y="303.83870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">barra:2L</text><text x="216.7741935483871" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">AB=L,BT=4L,TW=L</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Mientras arde A, el obstáculo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dominante es B: altura de sombra Y=36</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">L−5 hA. Rapidez 5·0.5=2.5 cm/s.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con B encendida, la barra da</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Y=(5/2)L−hB/4. Rapidez 1.6/4=0.4 cm/s.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Diferencia 2.1 cm/s=0.021 m/s. Las</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alternativas impresas usan m/s sin</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">convertir: hay inconsistencia de</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">unidades.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>