<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Manómetro encima de una columna de agua</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="117.76,162.74 246.99,162.74 246.99,277.93 350.94,277.93 350.94,334.12 334.08,334.12 334.08,297.59 246.99,297.59 246.99,334.12 117.76,334.12 117.76,162.74" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="117.76,221.74 246.99,221.74" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="246.99,196.46 275.08,196.46" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="342.51,376.26 342.51,335.80" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="347.28,345.35 342.51,335.80 337.73,345.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="182.3746694870439" y="190.83791644632473" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Gas</text><text x="182.3746694870439" y="275.11872025383394" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="284.0735060814384" y="196.45663670015864" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="100.90322580645164" y="280.7374405076679" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 m</text><text x="375.0967741935483" y="330.18217874140663" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A = 0,01 m²</text><text x="356.55499735589626" y="365.0182443151771" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La presión manométrica del agua a la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura del émbolo es 210/0,01 = 21 000</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pa.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El manómetro está conectado al gas.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre el émbolo y la superficie del</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agua se pierde 1000 × 10 × 1 = 10 000</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pa al subir.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La presión del gas coincide con la de</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la superficie del agua. Resta 10 000</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pa de 21 000 Pa.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>