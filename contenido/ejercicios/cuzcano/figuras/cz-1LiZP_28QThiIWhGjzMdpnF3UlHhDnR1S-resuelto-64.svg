37618" stroke-width="2.5"/><polyline points="152.31,290.24 186.59,290.24 169.45,319.88 152.31,290.24" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="203.73,260.59 186.59,290.24 238.00,319.88 203.73,260.59" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="272.27,217.06 323.69,217.06 323.69,268.47 272.27,217.06" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="323.69,268.47 375.10,217.06 375.10,268.47 323.69,268.47" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="323.69,268.47 323.69,319.88 375.10,319.88 323.69,268.47" fill="none" stroke="#008674" stroke-width="2.5"/><text x="157.60080645161293" y="329.7056451612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I</text><text x="313.54838709677415" y="329.7056451612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">II</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En I, dos triángulos pequeños suman</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2/16 del área y la mitad del triángulo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferior derecho aporta 1/8. Total</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/4.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En II se sombrean tres mitades de los</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuatro cuadrados pequeños, o 3/8 del</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrado.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Medir ambos respecto de I:</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1/4)/[(3/8)(3/4)]=8/9.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>