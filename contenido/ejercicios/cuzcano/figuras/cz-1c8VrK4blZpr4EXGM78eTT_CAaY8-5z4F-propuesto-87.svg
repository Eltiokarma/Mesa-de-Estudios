>28</text><rect x="238.0" y="254.28571428571428" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">40 %</text><rect x="48.0" y="295.7142857142857" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">36</text><rect x="238.0" y="295.7142857142857" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">66 %</text><rect x="48.0" y="337.14285714285717" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">44</text><rect x="238.0" y="337.14285714285717" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">86 %</text><rect x="48.0" y="378.57142857142856" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">52</text><rect x="238.0" y="378.57142857142856" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">100 %</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Edades acumuladas</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como x₆=x₁+5w=6w, w=8. La primera</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">clase comienza en 4. Los cortes</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">relevantes son 20, 28, 36 y 44.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A 25 corresponde 24 % más 5/8 de los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">16 puntos porcentuales de la tercera</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">clase. Eso da 34 %.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A 38 corresponde 66 % más 2/8 de los</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">20 puntos de la quinta. Eso da 71 %.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta los dos acumulados.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>