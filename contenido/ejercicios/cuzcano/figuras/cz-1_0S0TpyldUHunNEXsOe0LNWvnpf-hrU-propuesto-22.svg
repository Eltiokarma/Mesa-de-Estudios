<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">022 · Gas en una ciudad con barómetro de 700 mm</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="179.24,215.25 179.24,332.76 375.10,332.76 375.10,215.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="210.58,215.25 210.58,309.26 328.09,309.26 328.09,215.25" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,207.41 159.66,207.41 159.66,274.00 100.90,274.00 100.90,207.41" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="159.66,219.17 179.24,219.17" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="179.24,254.42 210.58,254.42" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="328.09,285.76 375.10,285.76" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="130.2811059907834" y="241.10138248847926" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Gas</text><text x="279.1290322580645" y="320.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hg</text><text x="288.9216589861751" y="270.0875576036866" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30 cm</text><text x="354.7281105990784" y="206.23963133640552" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Aire</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lado del gas tiene el nivel más</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alto, por lo que su presión es menor</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que la atmosférica.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta 300 mm de Hg de los 700 mm</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">atmosféricos. La presión del gas</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivale a 400 mm de Hg.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Convierte a pascales con ρHg = 13 600</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">kg/m³ y una altura de 0,400 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>