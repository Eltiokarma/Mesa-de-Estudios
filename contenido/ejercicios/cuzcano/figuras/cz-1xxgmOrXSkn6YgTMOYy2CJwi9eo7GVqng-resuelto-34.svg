font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="367.53358373840035" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="182.78568272205038" y="161.70061864781263" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En los círculos que comparten la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente DO, las cuerdas RD y RO son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares. Por tangente y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuerda, si β=∠DAR y α=∠REO, entonces</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">β+α=90° en DRO.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea δ la inclinación descendente de la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">línea de centros desde el círculo</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierdo. Por las direcciones de los</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radios en los extremos de las cuerdas,</text><text x="482" y="315" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A→R sube 45°−δ/2 y R→E baja δ/2. Así</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el cuadrilátero cóncavo AMER, los</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">otros tres ángulos suman el ángulo</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">menor ARE. Luego ∠AME=135°−(α+β).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>