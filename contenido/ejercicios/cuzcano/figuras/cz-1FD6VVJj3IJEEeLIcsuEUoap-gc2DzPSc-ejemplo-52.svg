<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">052 · Base cuadrática y raíz principal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución real</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="65" y1="275" x2="135.0" y2="275" stroke="#1766b0" stroke-width="6"/><line x1="65" y1="275" x2="75" y2="267" stroke="#1766b0" stroke-width="3"/><line x1="65" y1="275" x2="75" y2="283" stroke="#1766b0" stroke-width="3"/><circle cx="135.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="135.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">1</text><line x1="205.0" y1="275" x2="275.0" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="205.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="205.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">3</text><circle cx="275.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="275.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">5</text><line x1="345.0" y1="275" x2="415" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="345.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="345.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">7</text><line x1="415" y1="275" x2="405" y2="267" stroke="#1766b0" stroke-width="3"/><line x1="415" y1="275" x2="405" y2="283" stroke="#1766b0" stroke-width="3"/><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El argumento es siempre positivo:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">discriminante −11. La base excluye</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=5,6,7; su raíz positiva es ∣x−6∣.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para 0&lt;(x−6)²&lt;1 se necesitaría</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x²−5x+9&lt;∣x−6∣; equivale a 1&lt;x&lt;3 y no</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coincide con 5&lt;x&lt;7.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para (x−6)²&gt;1, se exige x²−5x+9&gt;∣x−6∣.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su diferencia de cuadrados es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(x−1)(x−3)(x²−6x+15), con último</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">factor positivo. Intersectar con x&lt;5 o</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x&gt;7.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>