<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">066 · Base media con una diagonal conocida</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,157.25 100.90,362.90 289.41,362.90 375.10,157.25 100.90,157.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,362.90 375.10,157.25" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,260.07 332.25,260.07" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645164" y="157.25201612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645164" y="362.89717741935476" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="289.4112903225806" y="362.89717741935476" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="157.25201612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="100.90322580645164" y="260.07459677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="332.25403225806446" y="260.07459677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="195.15725806451616" y="381.7479838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">11</text><text x="272.2741935483871" y="242.9375" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20</text><text x="354.53225806451616" y="275.49798387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">13</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama h a la altura y d a la base AD.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pitágoras da d²+h²=400 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(d−11)²+h²=169.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al restar, 22d−121=231, por lo que</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d=16.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La longitud de la mediana es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(d+BC)/2=(16+11)/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>