<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Retroceso para mantener a la vista una araña</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,338.81 360.44,338.81 360.44,192.25 183.34,192.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="168.08,340.03 242.58,340.03" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="168.08,338.81 323.80,192.25" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="168.08,338.81 129.61,302.17" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="326.55,192.25 326.53,192.55 326.48,192.84 326.40,193.13 326.29,193.40 326.15,193.67 325.99,193.91 325.80,194.14 325.58,194.34 325.34,194.52 325.09,194.68 324.82,194.80 324.54,194.90 324.24,194.96 323.95,194.99 323.65,194.99 323.36,194.96 323.06,194.90 322.78,194.80 322.51,194.68 322.26,194.52 322.02,194.34 321.80,194.14 321.61,193.91 321.45,193.67 321.31,193.40 321.20,193.13 321.12,192.84 321.07,192.55 321.05,192.25 321.07,191.95 321.12,191.66 321.20,191.37 321.31,191.10 321.45,190.83 321.61,190.59 321.80,190.36 322.02,190.16 322.26,189.97 322.51,189.82 322.78,189.70 323.06,189.60 323.36,189.54 323.65,189.51 323.95,189.51 324.24,189.54 324.54,189.60 324.82,189.70 325.09,189.82 325.34,189.97 325.58,190.16 325.80,190.36 325.99,190.59 326.15,190.83 326.29,191.10 326.40,191.37 326.48,191.66 326.53,191.95 326.55,192.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="124.108915870393" y="292.4003520367842" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ojo</text><text x="314.63984481643797" y="180.64663409727714" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">araña</text><text x="204.71815503987355" y="351.63592930526613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">espejo</text><text x="375.09677419354836" y="269.8053380271571" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4h</text><text x="119.83418349019328" y="318.65942237229683" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h</text><text x="265.7857604712982" y="358.3533659027229" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">12 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tras 6 s la araña está a 15−0,5×6=12 m</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del borde cercano del espejo. Su</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">imagen virtual está 4h debajo del</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">piso.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para el retroceso máximo, la recta de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">visión toca justo el borde cercano. Si</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el niño retrocede x, la pendiente</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene igual módulo en ambos lados del</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">borde: h/x=4h/12.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al despejar x=12/4 se obtiene el</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">retroceso máximo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>