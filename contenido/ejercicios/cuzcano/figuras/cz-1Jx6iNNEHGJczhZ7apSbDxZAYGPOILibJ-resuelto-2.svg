 341.07,329.76 346.77,325.14 351.99,320.28 356.73,315.20 360.96,309.92 364.66,304.48 367.82,298.88 370.43,293.16 372.46,287.33 373.92,281.43 374.80,275.48 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,178.10 375.10,360.90" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,360.90 238.00,178.10" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="238.0" cy="269.5" r="3.7" fill="#20364b"/><text x="245.0" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C(−3,2)</text><circle cx="238.0" cy="178.1021505376344" r="3.7" fill="#20364b"/><text x="245.0" y="170.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="347.67741935483866" cy="324.3387096774194" r="3.7" fill="#20364b"/><text x="354.67741935483866" y="316.3387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="375.09677419354836" cy="360.89784946236557" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="352.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las tangencias determinan semiejes</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal 3 y vertical 2. El extremo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superior es A=(−3,4).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Parametriza OA por (−3t,4t). Al</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituir en (x+3)²/9+(y−2)²/4=1</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resulta (1−t)²+(2t−1)²=1.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se factoriza como (t−1)(5t−1)=0. El</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primer valor corresponde a A y el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segundo a P.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>