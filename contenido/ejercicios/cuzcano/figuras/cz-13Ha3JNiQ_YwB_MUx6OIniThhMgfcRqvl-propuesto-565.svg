erif" font-size="13" fill="#20364b" text-anchor="middle">Cl</text><text x="213.80645161290326" y="251.15322580645162" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="213.80645161290326" y="308.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="287.59677419354836" y="272.1209677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="345.66129032258067" y="272.1209677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="263.4032258064516" y="251.15322580645162" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="262.1935483870968" y="308.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cl</text><text x="375.09677419354836" y="251.15322580645162" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="375.09677419354836" y="308.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="155.3387096774194" y="230.99193548387098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="316.6290322580645" y="230.99193548387098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">II</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los enlaces entre átomos son los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mismos en ambas estructuras.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada carbono del doble enlace lleva</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos sustituyentes distintos, y el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">doble enlace impide la rotación libre.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cl y CH₃ tienen mayor prioridad que H</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en sus carbonos. Sus posiciones dan I</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">como E y II como Z.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>