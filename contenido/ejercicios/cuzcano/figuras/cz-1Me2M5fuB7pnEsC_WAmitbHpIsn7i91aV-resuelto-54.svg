<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Solo un vértice activo en la solución</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,142.48 312.66,166.74 358.80,230.25 358.80,308.75 312.66,372.26 238.00,396.52 163.34,372.26 117.20,308.75 117.20,230.25 163.34,166.74 238.00,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,142.48 358.80,230.25" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,142.48 358.80,308.75" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,142.48 312.66,372.26" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,142.48 238.00,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,142.48 163.34,372.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,142.48 117.20,308.75" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,142.48 117.20,230.25" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Faltan los pares de nueve vértices</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">consecutivos que no son lados:</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C(9,2)−8=28.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así D(n)−28=n−3. Factoriza</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">n²−5n−50=(n−10)(n+5).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con n=10, el interior es 180°−36°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>