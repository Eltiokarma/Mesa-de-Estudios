<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Distancia entre puntos de dos mediatrices</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,329.13 220.17,329.13 375.10,329.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,329.13 160.54,225.85" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,329.13 297.63,284.41" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="160.54,225.85 297.63,284.41" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="160.54,345.53 160.54,200.92" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="297.63,345.53 297.63,200.92" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="329.1322322170462" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="220.16769024054398" y="329.1322322170462" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="329.1322322170462" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="160.5354580234978" y="225.8461762483765" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="297.6322322170462" y="284.4080580542616" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="120.28370127699161" y="319.889236223404" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="354.22549291758224" y="324.36165363968246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="160.5354580234978" y="193.46890392326614" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ℒ₁</text><text x="297.6322322170462" y="193.46890392326614" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ℒ₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AP=4, QC=3. Las proyecciones</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontales de AP y QC son 4 cos α y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3 cos β. Su suma es el desplazamiento</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal entre las dos mediatrices.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia vertical es 4 sen α−3</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen β. Como β=90°−α, eleva al cuadrado</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los desplazamientos (4 cos α+3 sen α)</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y (4 sen α−3 cos α).</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los términos mixtos se cancelan.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PQ²=16+9=25.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>