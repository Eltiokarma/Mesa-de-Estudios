<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">436 · Electrodos y puente salino de Zn–Cu</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,263.44 100.90,344.38 194.50,344.38 194.50,263.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="281.50,263.44 281.50,344.38 375.10,344.38 375.10,263.44" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,293.73 194.50,293.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="281.50,293.73 375.10,293.73" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="124.58,238.67 124.58,320.15" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="350.32,238.67 350.32,320.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="124.58,238.67 124.58,207.28 215.43,207.28" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="259.47,207.28 350.32,207.28 350.32,238.67" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="215.43,194.62 259.47,194.62 259.47,219.40 215.43,219.40 215.43,194.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="170.28,308.59 170.28,249.13 306.27,249.13 306.27,308.59" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="120.72444617178391" y="233.1610959968908" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Zn (−)</text><text x="347.01671200932765" y="233.1610959968908" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cu (+)</text><text x="221.4823163622231" y="210.58692835859566" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">e⁻ →</text><text x="211.02111672496437" y="244.17288508874205" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Puente salino</text><text x="111.91501489830289" y="334.4695556419225" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Zn²⁺(ac)</text><text x="294.16012436844153" y="334.4695556419225" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cu²⁺(ac)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Zn se oxida y constituye el ánodo.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cu²⁺ se reduce a Cu a la derecha.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los electrones circulan por el cable</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">externo. El puente salino transporta</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iones para mantener la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">electroneutralidad.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia 0,34−(−0,76)=1,10 V</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">confirma el sentido escrito.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>