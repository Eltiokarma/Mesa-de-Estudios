<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">023 · Cuerda de un círculo de radio ocho</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="156.36,269.50 262.93,142.48 319.64,240.71 262.93,396.52 156.36,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="262.93,142.48 262.93,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="156.35560602771778" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="262.93479305225134" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="319.6443939722822" y="240.70778103819015" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="262.93479305225134" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="170.24200766146663" y="270.1217791776305" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="262.1057541487439" y="167.3550380729638" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="250.70646922551725" y="364.3908715213465" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ−30°</text><text x="300.8235409026018" y="318.6119550352241" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="199.28221324614213" y="205.99193548387098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="199.28221324614213" y="333.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo ORA es isósceles. Su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuerda RA mide 2·8 sen θ al dividir el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo central por la mitad.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En RIA, el ángulo I vale 180°−θ. Su</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">seno es sen θ.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ley de senos, IA=RA·sen 30°/sen</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=16·1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>