<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">108 · Tangencia en la mitad positiva del eje</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="123.75268817204301" y1="105" x2="123.75268817204301" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,142.48 103.65,152.54 106.39,162.40 109.13,172.05 111.87,181.50 114.61,190.75 117.35,199.79 120.10,208.63 122.84,217.27 125.58,225.70 128.32,233.94 131.06,241.96 133.81,249.79 136.55,257.41 139.29,264.83 142.03,272.04 144.77,279.05 147.52,285.86 150.26,292.46 153.00,298.87 155.74,305.06 158.48,311.06 161.23,316.85 163.97,322.44 166.71,327.83 169.45,333.01 172.19,337.99 174.94,342.76 177.68,347.34 180.42,351.70 183.16,355.87 185.90,359.83 188.65,363.59 191.39,367.15 194.13,370.50 196.87,373.65 199.61,376.60 202.35,379.34 205.10,381.88 207.84,384.22 210.58,386.35 213.32,388.29 216.06,390.01 218.81,391.54 221.55,392.86 224.29,393.98 227.03,394.89 229.77,395.60 232.52,396.11 235.26,396.41 238.00,396.52 240.74,396.41 243.48,396.11 246.23,395.60 248.97,394.89 251.71,393.98 254.45,392.86 257.19,391.54 259.94,390.01 262.68,388.29 265.42,386.35 268.16,384.22 270.90,381.88 273.65,379.34 276.39,376.60 279.13,373.65 281.87,370.50 284.61,367.15 287.35,363.59 290.10,359.83 292.84,355.87 295.58,351.70 298.32,347.34 301.06,342.76 303.81,337.99 306.55,333.01 309.29,327.83 312.03,322.44 314.77,316.85 317.52,311.06 320.26,305.06 323.00,298.87 325.74,292.46 328.48,285.86 331.23,279.05 333.97,272.04 336.71,264.83 339.45,257.41 342.19,249.79 344.94,241.96 347.68,233.94 350.42,225.70 353.16,217.27 355.90,208.63 358.65,199.79 361.39,190.75 364.13,181.50 366.87,172.05 369.61,162.40 372.35,152.54 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">f(x)=(x−5)²</text><circle cx="238.0" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="245.0" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">V=(5,0)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El contacto con el eje x implica una</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">raíz doble, así el discriminante es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m²−4m−60=0.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resolver da m=10 o m=−6. El vértice</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene abscisa m/2, de modo que la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">figura selecciona m=10.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces la curva es y=(x−5)² y el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valor pedido es 100−10+1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>