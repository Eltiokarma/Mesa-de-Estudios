<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">505 · Equivalencia entre estructuras del mismo alcano</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="124.88,201.63 144.95,213.01 165.03,201.63 185.11,213.01 205.19,201.63 225.26,213.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="165.03,201.63 165.03,180.05" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="205.19,201.63 205.19,180.05" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="274.71,201.63 294.79,213.01 314.86,201.63 334.94,213.01 355.02,201.63 375.10,213.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="294.79,213.01 294.79,191.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="334.94,213.01 334.94,191.44" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="124.88,255.57 144.95,266.95 165.03,255.57 185.11,266.95 205.19,255.57 225.26,266.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="185.11,266.95 174.32,245.38" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="185.11,266.95 194.10,284.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="274.71,255.57 294.79,266.95 314.86,255.57 334.94,266.95 355.02,255.57 375.10,266.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="294.79,266.95 294.79,244.78" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="355.02,255.57 355.02,272.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="213.48,309.21 222.96,309.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="241.35,309.21 250.83,309.21" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="232.16,317.41 232.16,325.87" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="260.03,317.41 260.03,325.87" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="269.22,334.08 278.70,334.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="260.03,342.29 260.03,350.74" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.9032258064516" y="208.21849109818442" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Dado</text><text x="250.7357659086903" y="208.21849109818442" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="100.9032258064516" y="262.1582055349903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">II</text><text x="250.7357659086903" y="262.1582055349903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">III</text><text x="204.2876784769963" y="309.20562312709325" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₂</text><text x="232.1565309360127" y="309.20562312709325" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH</text><text x="260.02538339502905" y="309.20562312709325" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₂</text><text x="232.1565309360127" y="334.0778247840649" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₂</text><text x="260.02538339502905" y="334.0778247840649" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₂</text><text x="287.8942358540454" y="334.0778247840649" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C₂H₅</text><text x="260.02538339502905" y="358.95002644103647" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="180.31447206063808" y="310.1046183677067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">IV</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al numerar el alcano dado desde el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremo más próximo a una rama se</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene 2,4-dimetilhexano.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fórmula I recorre esa misma cadena</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en sentido inverso y da los mismos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">localizadores. II es 3,3-dimetilhexano</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y III es 2,5-dimetilhexano.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En IV, tal como está impresa, hay</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">grupos CH₂ terminales y un CH₂</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enlazado a tres carbonos. Esas</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valencias no corresponden a un alcano</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">neutro.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>