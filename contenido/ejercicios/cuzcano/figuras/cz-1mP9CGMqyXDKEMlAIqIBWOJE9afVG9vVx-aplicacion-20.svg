ddle">⊙</text><text x="332.8316458676713" y="263.0101247939722" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙</text><text x="332.8316458676713" y="304.73075111843656" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙</text><text x="110.05674593830938" y="309.36637626559923" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,4 m</text><text x="308.46150223687306" y="370.55662820814695" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53°</text><text x="169.39274782199197" y="253.73887449964678" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">v₀</text><text x="301.04450200141275" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙ 4 T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza magnética curva la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">trayectoria sin cambiar la rapidez. El</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radio gira el mismo ángulo que la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El descenso es R(1−cos 53°). Con cos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">53°≈3/5 resulta R≈1 m.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como qvB=mv²/R, despeja v=qBR/m y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituye los datos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>