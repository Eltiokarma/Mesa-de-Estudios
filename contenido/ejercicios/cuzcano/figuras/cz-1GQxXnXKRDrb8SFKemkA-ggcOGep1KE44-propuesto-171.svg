<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">171 · Mínimo de una expresión con parte entera</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.4838709677419" x2="421" y2="142.4838709677419" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="238.00,376.98 240.28,378.26 242.57,379.49 244.85,380.69 247.14,381.84 249.42,382.95 251.71,384.01 253.99,385.03 256.28,386.01 258.56,386.94 260.85,387.83 263.13,388.68 265.42,389.48 267.70,390.24 269.99,390.96 272.27,391.63 274.56,392.26 276.84,392.85 279.13,393.39 281.41,393.89 283.70,394.34 285.98,394.76 288.27,395.13 290.55,395.45 292.84,395.73 295.12,395.97 297.41,396.17 299.69,396.32 301.98,396.43 304.26,396.49 306.55,396.52 308.83,396.49 311.12,396.43 313.40,396.32 315.69,396.17 317.97,395.97 320.26,395.73 322.54,395.45 324.83,395.13 327.11,394.76 329.40,394.34 331.68,393.89 333.97,393.39 336.25,392.85 338.54,392.26 340.82,391.63 343.11,390.96 345.39,390.24 347.68,389.48 349.96,388.68 352.25,387.83 354.53,386.94 356.82,386.01 359.10,385.03 361.39,384.01 363.67,382.95 365.96,381.84 368.24,380.69 370.53,379.49 372.81,378.26 375.10,376.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">1&lt;x≤2</text><circle cx="237.99999999999997" cy="337.893300248139" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="329.893300248139" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">f(1)=−5/2</text><circle cx="237.99999999999997" cy="376.9751861042183" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="244.99999999999997" y="368.9751861042183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Extremo abierto</text><circle cx="306.54838709677415" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="313.54838709677415" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Mínimo</text><circle cx="375.09677419354836" cy="376.9751861042183" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="368.9751861042183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">f(2)=−3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x=1 la parte entera es 3, así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f(1)=−5/2. Para 1&lt;x≤2, la parte entera</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale 2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el segundo tramo,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f(x)=x²−3x−1=(x−3/2)²−13/4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vértice x=3/2 pertenece al tramo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su valor −13/4 es menor que −5/2, así</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es el mínimo global.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>