<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Dos configuraciones con el mismo ángulo de base</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,372.32 169.45,372.32 375.10,372.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,372.32 373.80,166.68" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,372.32 373.80,166.68" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="169.45,372.32 373.80,166.68" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,372.32 177.78,314.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="169.45,372.32 177.78,314.39" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="375.09677419354836" y="372.320530400159" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="169.45161290322582" y="372.320530400159" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="100.90322580645164" y="372.320530400159" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="373.79813065404153" y="166.679469599841" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="177.77985400545828" y="314.38983586255085" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="127.63709677419357" y="366.83665943241704" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma PC=1, AC=4 y AB=3. Si t=CB, la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ley de cosenos da t²−8t cos37°+7=0.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos raíces positivas son t≈4,985 y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t≈1,404. Cada una coloca B en el mismo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rayo desde C, a distinta distancia.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde B, las componentes de BP</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">relativas a BC dan tan</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠PBC=sen37°/(t−cos37°). Evalúa las dos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">raíces.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>