<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">071 · Base a partir de dos triángulos rectos isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="127.16,246.44 209.77,153.50 347.46,246.44 127.16,246.44 220.10,329.05 220.10,246.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="347.46,246.44 254.52,384.12 254.52,246.44" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="117.52399685287178" y="257.4523996852872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="209.7741935483871" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="358.47600314712827" y="257.4523996852872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="220.10070810385525" y="341.441384736428" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="254.52242328874902" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="209.7741935483871" y="235.42250196695517" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="264.16050354051924" y="236.7993705743509" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="204.2667191188041" y="290.4972462627852" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="270.3564122738002" y="318.72305271439814" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea H la proyección de B en AC. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rotación de 90° alrededor de A lleva</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB a AP, por lo que AH = PS.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La rotación de 90° alrededor de C</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lleva CB a CQ, por lo que HC = RQ.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H está entre A y C según el dibujo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así AC = 3 + 5 = 8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>