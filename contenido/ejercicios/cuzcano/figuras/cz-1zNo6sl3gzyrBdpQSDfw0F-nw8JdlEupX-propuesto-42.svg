<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Paralelos pero distintos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="333.008064516129" x2="421" y2="333.008064516129" stroke="#20364b" stroke-width="1.7"/><line x1="174.49193548387098" y1="105" x2="174.49193548387098" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="174.49,333.01 301.51,205.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">A</text><line x1="301.508064516129" y1="205.991935483871" x2="297.93485251549754" y2="215.33175111366492" stroke="#1766b0" stroke-width="2"/><line x1="301.508064516129" y1="205.991935483871" x2="292.1682488863351" y2="209.56514748450252" stroke="#1766b0" stroke-width="2"/><polyline points="174.49,333.01 365.02,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">B</text><line x1="365.016129032258" y1="142.48387096774195" x2="361.4429170316265" y2="151.82368659753587" stroke="#d37618" stroke-width="2"/><line x1="365.016129032258" y1="142.48387096774195" x2="355.6763134024641" y2="146.05708296837346" stroke="#d37618" stroke-width="2"/><polyline points="174.49,333.01 110.98,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">A−B</text><line x1="110.98387096774195" y1="396.51612903225805" x2="114.55708296837346" y2="387.17631340246413" stroke="#008674" stroke-width="2"/><line x1="110.98387096774195" y1="396.51612903225805" x2="120.32368659753588" y2="392.94291703162656" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como Bz=0 y Ay=2≠0,paralelismo exige</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m=n.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La proporción (m−1)/3=2/(6−m) da</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m²−7m+12=0: m=3 o4.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m=4 produce A=B y se excluye;con</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m=3,A=(2,2,0),B=(3,3,0):A−B=−i−j.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>