<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">053 · Distancia perpendicular en una sección a un tercio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.38,328.01 179.49,209.25 371.60,209.25 303.49,328.01 111.38,328.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="179.49,209.25 303.49,328.01" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="207.44,328.01 371.60,209.25" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="261.58,287.84 165.52,233.70" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.9032258064516" y="338.4850010273269" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="172.5079104170947" y="197.02208752825152" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="375.0967741935484" y="198.7685432504623" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="308.73145674953776" y="340.2314567495377" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="202.19765769467847" y="341.9779124717485" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="266.8165194164784" y="296.5700636942675" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="202.19765769467847" y="256.40158208341893" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="263.3236079720567" y="197.02208752825152" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10</text><text x="128.84651736182454" y="324.5133552496404" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En coordenadas afines con origen P,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">escribe O=u, I=v, T=u+v y N=u/2. Los</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puntos E sobre NT e IO se igualan en</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E=(2u+v)/3.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La paralela a PO desde E corta PI en</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=v/3. Así AE=(2/3) PO=20/3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La proyección perpendicular de AE</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre la normal a PI tiene longitud</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(20/3) sen 37°. Con sen 37°≈3/5 se</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reproduce el 4 de la clave escolar.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>