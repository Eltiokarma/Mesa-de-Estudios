<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">050 · Cuatro lados excluidos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,142.48 342.48,192.80 368.28,305.85 295.98,396.52 180.02,396.52 107.72,305.85 133.52,192.80 238.00,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="290.24,167.64 355.38,249.33" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="290.24,167.64 332.13,351.18" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="290.24,167.64 238.00,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="290.24,167.64 143.87,351.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="290.24,167.64 120.62,249.33" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="290.24,167.64 185.76,167.64" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="355.38,249.33 332.13,351.18" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="355.38,249.33 238.00,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="355.38,249.33 143.87,351.18" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="355.38,249.33 120.62,249.33" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="355.38,249.33 185.76,167.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="332.13,351.18 238.00,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="332.13,351.18 143.87,351.18" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="332.13,351.18 120.62,249.33" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="332.13,351.18 185.76,167.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuenta todos los pares de lados y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">quita los C(4,2)=6 formados fuera del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">grupo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ecuación es n(n−1)/2−6=2n+1.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Factoriza (n−7)(n+2)=0 y elige n=7.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>