<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Intervalo donde un coseno es invertible</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="-81.89247311827953" y1="105" x2="-81.89247311827953" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 105.47,396.34 110.04,395.82 114.61,394.95 119.18,393.74 123.75,392.19 128.32,390.30 132.89,388.08 137.46,385.54 142.03,382.67 146.60,379.50 151.17,376.02 155.74,372.26 160.31,368.21 164.88,363.89 169.45,359.31 174.02,354.49 178.59,349.43 183.16,344.16 187.73,338.68 192.30,333.01 196.87,327.16 201.44,321.16 206.01,315.02 210.58,308.75 215.15,302.37 219.72,295.91 224.29,289.37 228.86,282.78 233.43,276.15 238.00,269.50 242.57,262.85 247.14,256.22 251.71,249.63 256.28,243.09 260.85,236.63 265.42,230.25 269.99,223.98 274.56,217.84 279.13,211.84 283.70,205.99 288.27,200.32 292.84,194.84 297.41,189.57 301.98,184.51 306.55,179.69 311.12,175.11 315.69,170.79 320.26,166.74 324.83,162.98 329.40,159.50 333.97,156.33 338.54,153.46 343.11,150.92 347.68,148.70 352.25,146.81 356.82,145.26 361.39,144.05 365.96,143.18 370.53,142.66 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">g en el intervalo C</text><circle cx="100.90322580645162" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">π/3</text><circle cx="375.0967741935484" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5π/6</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El coseno es estrictamente monótono</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre extremos consecutivos de su</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fase, separados por π.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las fases de A, B, C, D y E, en</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">unidades de π, van respectivamente de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−1/2 a 1/2, de 1/2 a 3/2, de 1 a 2, de</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/4 a 5/4 y de 0 a 2.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Solo C queda entre dos extremos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">consecutivos sin cruzar un extremo</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interior. Allí el coseno aumenta</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">estrictamente.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>