<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">097 · Peso del embalaje a partir de acumulados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="64" y="160" font-family="Arial,sans-serif" font-size="19" fill="#1766b0" text-anchor="start">RELACIONES DEL PROBLEMA</text><text x="64" y="208" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si 70 cajas son el 87,5 % del total,</text><text x="64" y="231" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hay 80 cajas. Al restar los</text><text x="64" y="254" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">acumulados inversos, las frecuencias</text><text x="64" y="277" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son 10, 16, 20, 18 y 16.</text><text x="64" y="316" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las marcas son 9,7, 9,9, 10,1, 10,3 y</text><text x="64" y="339" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">10,5 kg. Pondera por las frecuencias</text><text x="64" y="362" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y divide por 80 para obtener 10,135</text><text x="64" y="385" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">kg.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si 70 cajas son el 87,5 % del total,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hay 80 cajas. Al restar los acumulados</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inversos, las frecuencias son 10, 16,</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">20, 18 y 16.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las marcas son 9,7, 9,9, 10,1, 10,3 y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">10,5 kg. Pondera por las frecuencias y</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">divide por 80 para obtener 10,135 kg.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los juguetes de cada caja pesan en</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">promedio 80×0,125=10 kg. Resta su peso</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio al total medio de la caja llena.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>