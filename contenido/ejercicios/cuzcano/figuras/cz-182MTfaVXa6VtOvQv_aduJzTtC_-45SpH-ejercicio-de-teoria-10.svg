<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Expresar el seno de 20° a partir del de 40°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="339.61,379.58 339.45,371.27 338.96,362.97 338.15,354.70 337.01,346.46 335.55,338.28 333.76,330.16 331.66,322.12 329.25,314.16 326.53,306.31 323.50,298.57 320.17,290.95 316.54,283.47 312.62,276.14 308.42,268.97 303.94,261.97 299.18,255.15 294.17,248.52 288.89,242.10 283.37,235.88 277.61,229.89 271.62,224.13 265.40,218.61 258.98,213.33 252.35,208.32 245.53,203.56 238.53,199.08 231.36,194.88 224.03,190.96 216.55,187.33 208.93,184.00 201.19,180.97 193.34,178.25 185.38,175.84 177.34,173.74 169.22,171.95 161.04,170.49 152.80,169.35 144.53,168.54 136.23,168.05 127.92,167.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="127.92,146.72 127.92,379.58 360.78,379.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="127.92,379.58 326.85,307.18 326.85,379.58" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="127.92,307.18 326.85,307.18" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="362.8991935483871" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="113.1008064516129" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="197.7782258064516" y="371.11290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="229.53225806451607" y="292.3586390137193" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">cos 20°</text><text x="348.0806451612903" y="333.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">sen 20°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Eleva al cuadrado sen x ± cos x. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suma de cuadrados vale 1 y el término</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cruzado es ±sen 2x.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el primer cuadrante, por debajo de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">45°, sen x + cos x &gt; 0 y sen x − cos x</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">&lt; 0. El dibujo muestra estas</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitudes para x=20°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma sen x + cos x = √(1+sen 2x) y sen</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x − cos x = −√(1−sen 2x). Divide el</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resultado entre dos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>