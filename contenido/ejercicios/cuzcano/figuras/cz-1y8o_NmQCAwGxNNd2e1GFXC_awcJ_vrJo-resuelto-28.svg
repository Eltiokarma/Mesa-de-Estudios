<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Ángulo frente a dos hipotenusas iguales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="220.53,343.19 220.53,195.33 366.96,195.33 366.96,343.19 220.53,343.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.08,343.19 220.53,343.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="108.08,343.19 220.53,195.33" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="108.08,343.19 220.53,257.54 366.96,343.19" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="156.89,272.37 163.59,277.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="288.96,294.38 285.13,301.08" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="347.49921184484606" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="214.7916455553679" y="352.28443956538877" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="218.1413049597478" y="186.7155604346113" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="375.0967741935484" y="188.1511287507741" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="374.6182514214941" y="350.37034847717166" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="211.44198615098801" y="258.9724990148061" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="130.09311490176208" y="326.92273264651243" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="231.53994257726734" y="275.2422732646512" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos OUN y AUP son</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulos y tienen hipotenusas ON=AP</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y catetos UN=UP. Por congruencia,</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OU=UA y ∠UON=∠UAP.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OUA es rectángulo isósceles, así que</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠UOA=45°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces x=∠UON=∠UOA+∠AON.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>