<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">070 · Altura sobre un punto medio fijada por un diedro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="195.45,322.19 143.45,216.81 186.00,257.90" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,322.19 290.00,322.19 375.10,257.90 186.00,257.90 100.90,322.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="195.45,322.19 143.45,216.81 186.00,257.90 195.45,322.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="143.45,290.05 189.78,283.62 143.45,216.81 143.45,290.05" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="322.1922785792692" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="290.0022246941046" y="322.1922785792692" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="257.89861895746725" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="185.99777530589543" y="257.89861895746725" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="195.4527252502781" y="322.1922785792692" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="143.45050055617352" y="290.04544876836826" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="143.45050055617352" y="216.80772142073076" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="189.7797552836485" y="283.61608280618805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con lado s, toma A=(0,0), N=(s/2,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(0,s), M=(0,s/2). La recta ND es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x+y=s.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia de M a ND es (s/2)/√5=1</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el corte normal a ND, la tangente</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del diedro es ME/1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>