<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Distancia al punto medio de la hipotenusa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,353.44 193.44,283.52 284.27,318.48 375.10,353.44 100.90,353.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,353.44 100.90,182.07" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,182.07 284.27,318.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,353.44 284.27,318.48" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><text x="100.90322580645164" y="353.4375" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="193.44354838709677" y="283.5181451612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354836" y="353.4375" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="284.27016129032256" y="318.4778225806451" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="100.90322580645164" y="182.06653225806454" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="100.90322580645164" y="267.75201612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="150.60080645161293" y="318.4778225806451" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6</text><text x="233.37298387096777" y="356.93346774193543" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras AC=√(6²+8²)=10.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio de la hipotenusa</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equidista de los tres vértices, por lo</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que BM=5.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como PB es perpendicular a BM,</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PM²=PB²+BM²=50.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>