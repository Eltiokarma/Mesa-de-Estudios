<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">083 · Compatibilidad de dos senos con un parámetro cuadrático</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Valores compatibles de b</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="131.84405196876838" y1="275" x2="348.1559480312316" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="131.84405196876838" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="348.1559480312316" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="131.84405196876838" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">(1−√5)/2</text><text x="348.1559480312316" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">(√5−1)/2</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma y resta. Se obtienen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen(x+y)=b²+b y sen(x−y)=b²−b.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma y la diferencia se eligen de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">forma independiente, de modo que se</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">requiere y basta que ambas expresiones</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">estén en [−1,1]. Su máximo en valor</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">absoluto es b²+∣b∣.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con u=∣b∣, resuelve u²+u≤1 para u≥0.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esto da u≤(√5−1)/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>