<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Amplitud de una suma con fase desplazada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5096733224809" x2="421" y2="269.5096733224809" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Valor</text><polyline points="100.90,154.39 105.47,149.40 110.04,145.74 114.61,143.43 119.18,142.50 123.75,142.97 128.32,144.82 132.89,148.03 137.46,152.58 142.03,158.41 146.60,165.46 151.17,173.64 155.74,182.88 160.31,193.06 164.88,204.09 169.45,215.83 174.02,228.15 178.59,240.94 183.16,254.03 187.73,267.29 192.30,280.58 196.87,293.75 201.44,306.65 206.01,319.14 210.58,331.09 215.15,342.37 219.72,352.85 224.29,362.41 228.86,370.96 233.43,378.39 238.00,384.63 242.57,389.61 247.14,393.28 251.71,395.59 256.28,396.52 260.85,396.05 265.42,394.20 269.99,390.99 274.56,386.44 279.13,380.61 283.70,373.56 288.27,365.38 292.84,356.14 297.41,345.96 301.98,334.93 306.55,323.19 311.12,310.87 315.69,298.08 320.26,284.99 324.83,271.73 329.40,258.44 333.97,245.27 338.54,232.37 343.11,219.88 347.68,207.93 352.25,196.65 356.82,186.17 361.39,176.61 365.96,168.06 370.53,160.63 375.10,154.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F(x)</text><circle cx="119.94444444444444" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="126.94444444444444" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Máximo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Expande el coseno de suma: F=(1−sen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">40°)sen x+cos 40° cos x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una combinación A sen x+B cos x</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanza como máximo √(A²+B²). Aquí es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(2−2sen 40°).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como (cos 20°−sen 20°)²=1−sen 40° y la</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia es positiva, toma la raíz</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positiva.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>