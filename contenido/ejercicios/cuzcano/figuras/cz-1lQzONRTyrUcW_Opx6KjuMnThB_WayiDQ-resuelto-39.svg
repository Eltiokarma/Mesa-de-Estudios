<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">039 · Área de una cara por su proyección</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="375.10,366.44 200.30,246.19 224.29,273.22" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,366.44 375.10,366.44 224.29,273.22" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,366.44 100.90,172.56 375.10,366.44 224.29,273.22 100.90,366.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,172.56 224.29,273.22" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,366.44 375.10,366.44" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,366.44 200.30,246.19 224.29,273.22" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,172.56 299.69,319.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,366.44 200.30,246.19" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="100.90,366.44 299.69,319.83" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="100.90322580645162" y="366.44205871105896" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="100.90322580645162" y="172.5579412889411" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354836" y="366.44205871105896" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="224.29032258064515" y="273.21625225944604" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="200.2983870967742" y="246.19354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="299.6935483870967" y="319.8291554852525" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">J</text><text x="246.33422639777044" y="308.1313174513768" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Corta con el plano perpendicular a BC</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por el pie J de O sobre BC. Como OA</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también es perpendicular a BC, A y O</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">quedan en ese corte y ∠AOJ=90°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos ABC y BHC comparten</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">base BC, así que H es el punto medio</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de AJ en ese corte. Como OH⊥AJ, el</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo AOJ es isósceles rectángulo.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el corte, OJ=√2 HJ. Con la misma</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">base BC, el área de BOC es √2 veces la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de BHC.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>