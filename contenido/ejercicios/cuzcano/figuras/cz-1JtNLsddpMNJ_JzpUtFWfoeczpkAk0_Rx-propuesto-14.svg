<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Longitud de un trayecto reflejado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,299.81 372.98,299.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="122.05,187.03 272.42,299.81 347.61,243.42" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="272.42,299.81 347.61,356.20" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="122.05,187.03 122.05,299.81" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="347.61,243.42 347.61,356.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="122.04925781573928" y="175.0477236918484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="352.54100671697483" y="231.43714238328218" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="356.0653453851895" y="363.9522763081516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B′</text><text x="103.7226967410233" y="246.23936478978356" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">80 cm</text><text x="375.09677419354836" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 cm</text><text x="234.82809519860686" y="317.4310058877187" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">160 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja B bajo el espejo y llama B′ a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">su imagen. El camino quebrado tiene la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">misma longitud que A→B′.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre A y B′ hay 160 cm en horizontal</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 80+40=120 cm en vertical.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica Pitágoras al segmento recto.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>