<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">084 · Área a partir de una razón de triángulos y el teorema de Pitot</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="353.07,220.87 367.29,151.19 189.50,151.19" fill="#f4c581" fill-opacity="0.45"/><polygon points="146.83,360.23 324.62,360.23 189.50,151.19" fill="#f4c581" fill-opacity="0.45"/><polyline points="146.83,360.23 324.62,360.23 367.29,151.19 189.50,151.19 146.83,360.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="324.62,360.23 189.50,151.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="353.07,220.87 189.50,151.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="362.74,269.50 362.35,259.53 361.18,249.63 359.23,239.85 356.53,230.25 353.08,220.89 348.90,211.84 344.03,203.13 338.49,194.84 332.31,187.01 325.54,179.69 318.22,172.92 310.39,166.74 302.09,161.20 293.39,156.33 284.33,152.15 274.98,148.70 265.38,145.99 255.60,144.05 245.69,142.88 235.73,142.48 225.76,142.88 215.86,144.05 206.08,145.99 196.48,148.70 187.12,152.15 178.06,156.33 169.36,161.20 161.07,166.74 153.24,172.92 145.91,179.69 139.14,187.01 132.97,194.84 127.43,203.13 122.56,211.84 118.38,220.89 114.93,230.25 112.22,239.85 110.28,249.63 109.10,259.53 108.71,269.50 109.10,279.47 110.28,289.37 112.22,299.15 114.93,308.75 118.38,318.11 122.56,327.16 127.43,335.87 132.97,344.16 139.14,351.99 145.91,359.31 153.24,366.08 161.07,372.26 169.36,377.80 178.06,382.67 187.12,386.85 196.48,390.30 206.08,393.01 215.86,394.95 225.76,396.12 235.73,396.52 245.69,396.12 255.60,394.95 265.38,393.01 274.98,390.30 284.33,386.85 293.39,382.67 302.09,377.80 310.39,372.26 318.22,366.08 325.54,359.31 332.31,351.99 338.49,344.16 344.03,335.87 348.90,327.16 353.08,318.11 356.53,308.75 359.23,299.15 361.18,289.37 362.35,279.47 362.74,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="146.8346396290945" y="360.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="324.62018547626064" y="360.2258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="367.28871647958044" y="151.19354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="189.50317063241437" y="151.19354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="353.0658728118072" y="220.87096774193543" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si AD=s, las alturas sobre CD dan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">TC=s/3 y BT=2s/3. Por Pitot en ABTD,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">10+TD=5s/3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si θ=BAD, por ciclicidad ∠BTD=180°−θ.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Proyectar TD sobre la dirección TB da</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(10+TD)cosθ=s/3. Así cosθ=1/5.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ley de cosenos, TD²=100+s²/9−4s/3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al sustituir TD=5s/3−10 resulta s=12.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa 10s sinθ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>