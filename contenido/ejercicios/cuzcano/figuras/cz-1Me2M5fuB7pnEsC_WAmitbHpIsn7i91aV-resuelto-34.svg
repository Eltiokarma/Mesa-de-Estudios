<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Hexágono equiángulo con lados opuestos iguales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="375.10,269.50 306.55,388.23 169.45,388.23 100.90,269.50 169.45,150.77 306.55,150.77 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="227.92,242.28 350.09,312.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="227.92,242.28 120.87,304.09" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="227.92,242.28 227.92,150.77" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="261.19,289.66 261.19,388.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="261.19,289.66 132.24,215.22" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="261.19,289.66 355.35,235.30" fill="none" stroke="#008674" stroke-width="2.5"/><text x="221.8709677419355" y="233.20967741935482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="263.2016129032258" y="304.7822580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los lados opuestos son paralelos e</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iguales, de modo que el hexágono tiene</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simetría central.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En un grupo de tres lados alternos,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las normales unitarias exteriores</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">están separadas por 120°. Como suman</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el vector cero, la suma de las</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancias interiores a esas rectas es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La simetría central intercambia ambos</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">grupos. Sus constantes son iguales,</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que el valor pedido es el dato.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>