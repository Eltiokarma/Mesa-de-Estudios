<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Mínimo arrastre de lancha lenta</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="316.9917156914047" x2="421" y2="316.9917156914047" stroke="#20364b" stroke-width="1.7"/><line x1="155.74193548387098" y1="105" x2="155.74193548387098" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="155.74,316.99 375.10,316.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">corriente (escala)</text><line x1="375.0967741935484" y1="316.9917156914047" x2="365.9658847904253" y2="321.0693202220004" stroke="#1766b0" stroke-width="2"/><line x1="375.0967741935484" y1="316.9917156914047" x2="365.9658847904253" y2="312.914111160809" stroke="#1766b0" stroke-width="2"/><polyline points="155.74,316.99 100.90,222.01" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">lancha/agua</text><line x1="100.90322580645162" y1="222.0082843085953" x2="108.99997961809555" y2="227.87706422554817" stroke="#d37618" stroke-width="2"/><line x1="100.90322580645162" y1="222.0082843085953" x2="101.93736139793076" y2="231.9546687561439" stroke="#d37618" stroke-width="2"/><polyline points="155.74,316.99 320.26,222.01" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">lancha/tierra</text><line x1="320.258064516129" y1="222.0082843085953" x2="314.38928459917616" y2="230.10503812023924" stroke="#008674" stroke-width="2"/><line x1="320.258064516129" y1="222.0082843085953" x2="310.3116800685805" y2="223.04241990007444" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sean corriente c y rapidez u=c/2.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Arrastre por ancho es (c+u cosθ)/(u</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sinθ). Su derivada se anula cuando c</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosθ+u=0.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosθ=−u/c=−1/2: θ=120°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>