<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Rango de una combinación de seno y coseno dobles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="210.8771712158809" x2="421" y2="210.8771712158809" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Valor</text><polyline points="100.90,386.75 105.47,374.03 110.04,356.74 114.61,335.64 119.18,311.65 123.75,285.82 128.32,259.27 132.89,233.17 137.46,208.66 142.03,186.81 146.60,168.57 151.17,154.74 155.74,145.93 160.31,142.52 164.88,144.66 169.45,152.25 174.02,164.97 178.59,182.26 183.16,203.36 187.73,227.35 192.30,253.18 196.87,279.73 201.44,305.83 206.01,330.34 210.58,352.19 215.15,370.43 219.72,384.26 224.29,393.07 228.86,396.48 233.43,394.34 238.00,386.75 242.57,374.03 247.14,356.74 251.71,335.64 256.28,311.65 260.85,285.82 265.42,259.27 269.99,233.17 274.56,208.66 279.13,186.81 283.70,168.57 288.27,154.74 292.84,145.93 297.41,142.52 301.98,144.66 306.55,152.25 311.12,164.97 315.69,182.26 320.26,203.36 324.83,227.35 329.40,253.18 333.97,279.73 338.54,305.83 343.11,330.34 347.68,352.19 352.25,370.43 356.82,384.26 361.39,393.07 365.96,396.48 370.53,394.34 375.10,386.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F(x)</text><circle cx="160.83741702247565" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="167.83741702247565" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">7/2</text><circle cx="229.38580411924983" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="236.38580411924983" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">−19/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Reemplaza sen²x y cos²x por (1∓cos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x)/2 y el producto por ½sen 2x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Queda F=−3+(5/2)sen 2x−6cos 2x. La</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">amplitud es √[(5/2)²+6²]=13/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los valores extremos se alcanzan</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">porque 2x puede recorrer todos los</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos. Suma y resta 13/2 al centro</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>