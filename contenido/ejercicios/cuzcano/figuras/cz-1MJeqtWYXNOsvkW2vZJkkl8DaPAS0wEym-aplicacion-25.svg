1.05 375.10,331.21 342.62,331.21 342.62,301.05" fill="none" stroke="#008674" stroke-width="2.5"/><text x="144.97833087713556" y="206.86695595218606" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(1)</text><text x="298.08132743845863" y="206.86695595218606" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(2)</text><text x="221.52982915779708" y="348.83518912723105" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m/2</text><text x="358.8585775885596" y="315.43089896839695" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m</text><text x="221.52982915779708" y="238.41545221330713" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El extremo derecho en equilibrio fija</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T=mg en toda la cuerda.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La polea móvil y la masa que cuelga de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ella pesan mg en conjunto. Dos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tensiones iguales equilibran ese peso</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en la dirección de la bisectriz.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con apertura θ, se cumple 2mg</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos(θ/2)=mg. Así cos(θ/2)=1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>