<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">052 · Distancia desde un vértice a un punto de la bisectriz</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="181.5483870967742" y1="105" x2="181.5483870967742" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="153.32,368.29 266.23,283.61 322.68,142.48 153.32,368.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">ABC</text><polyline points="153.32,368.29 252.11,269.50 285.04,236.57" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Bisectriz</text><polyline points="266.23,283.61 252.11,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">BR</text><circle cx="153.32258064516128" cy="368.2903225806452" r="3.7" fill="#20364b"/><text x="160.32258064516128" y="360.2903225806452" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="266.2258064516129" cy="283.61290322580646" r="3.7" fill="#20364b"/><text x="275.2258064516129" y="291.61290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="322.6774193548388" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="329.6774193548388" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="285.04301075268825" cy="236.56989247311824" r="3.7" fill="#20364b"/><text x="292.04301075268825" y="228.56989247311824" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="252.11290322580646" cy="269.5" r="3.7" fill="#20364b"/><text x="243.11290322580646" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las distancias AB=5 y AC=10 dan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BP:PC=1:2. Así P=(2B+C)/3=(11/3,17/3).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R se obtiene avanzando tres cuartos</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del segmento AP. Resulta R=(5/2,9/2).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde B hasta R hay un desplazamiento</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−1/2,1/2). Aplica Pitágoras.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>