<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">019 · Cateto entre una bisectriz y dos perpendiculares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="375.10,299.18 238.00,299.18 100.90,299.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,299.18 306.55,180.45 100.90,299.18 375.10,299.18" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="306.55,180.45 238.00,299.18 203.73,358.55 100.90,299.18" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="299.18232230712795" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="299.18232230712795" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="237.99999999999997" y="299.18232230712795" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="306.54838709677415" y="180.45303307861616" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="203.7258064516129" y="358.54696692138384" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon C en el origen y mide hacia A</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre el eje x. Sean A=(c,0), P=(p,0)</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y t=cos ∠BCA. Proyectar A sobre CB y P</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre CD da B=(ct²,cts) y</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(pt²,−pts), donde s=sen ∠BCA.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La intersección de BD con el eje x</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene abscisa 2cpt²/(c+p). Como es p,</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resulta t²=(c+p)/(2c).</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces BP²=(ct²−p)²+c²t²s²=c(c−p)/2=</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC·AP/2=36.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>