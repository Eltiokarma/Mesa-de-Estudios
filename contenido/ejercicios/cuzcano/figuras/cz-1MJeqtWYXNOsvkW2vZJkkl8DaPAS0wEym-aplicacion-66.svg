<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">066 · Dos momentos en una pieza con arco semicircular</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="203.07,269.50 202.84,264.84 202.16,260.23 201.03,255.71 199.46,251.31 197.46,247.10 195.06,243.10 192.29,239.35 189.15,235.90 185.70,232.77 181.95,229.99 177.95,227.59 173.74,225.60 169.35,224.03 164.82,222.89 160.21,222.21 155.55,221.98 150.89,222.21 146.28,222.89 141.76,224.03 137.37,225.60 133.15,227.59 129.15,229.99 125.41,232.77 121.95,235.90 118.82,239.35 116.04,243.10 113.64,247.10 111.65,251.31 110.08,255.71 108.94,260.23 108.26,264.84 108.03,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="203.07,269.50 361.46,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="155.55,221.98 155.55,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="191.67,258.10 155.55,221.98" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="166.98,226.01 155.55,221.98 159.58,233.40" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="361.46,317.02 361.46,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="366.69,280.43 361.46,269.50 356.23,280.43" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645159" y="276.1528763906748" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="155.55185330128023" y="280.4297254989657" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="172.1840442779672" y="230.5331525689048" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F₁</text><text x="300.9647229831721" y="279.954520042489" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 m</text><text x="375.0967741935483" y="307.51643651814163" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F₂</text><text x="143.67171688936094" y="247.16534354559178" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,3 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F₁ tiene componentes (−50,50) N. Su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto de aplicación está 0,3 m por</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">encima de O y, respecto de A, 0,3 m a</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la derecha y 0,3 m arriba.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto de A, F₁ aporta 30 N·m y F₂</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aporta 30×1,6=48 N·m.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto de O, F₁ aporta 15 N·m y F₂</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aporta 30×1,3=39 N·m. Todos son</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">antihorarios.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>