<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Índice de un cubo con rayo emergente rasante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="154.29,205.08 299.87,205.08 299.87,350.66 154.29,350.66 154.29,205.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="334.08,142.48 227.08,205.08 154.29,268.41 154.29,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="227.08,170.14 227.08,248.76" fill="none" stroke="#008674" stroke-width="2.5"/><text x="270.0269895554118" y="194.16378593215643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="141.91903133376468" y="393.60458452722065" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">salida</text><text x="267.8433311766337" y="304.8024771235789" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la primera cara, el ángulo con la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal es 60°, de modo que n sen r=sen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la segunda cara, el ángulo interno</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con la normal es 90°−r. Para la salida</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rasante, n cos r=1.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Eleva al cuadrado y suma:</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">n²=sen²60°+1=7/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>