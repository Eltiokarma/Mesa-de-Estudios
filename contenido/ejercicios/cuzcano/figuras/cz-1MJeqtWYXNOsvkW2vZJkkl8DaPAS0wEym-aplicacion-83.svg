<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">083 · Una barra entre dos paredes y una cuerda vertical</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.87,385.08 111.87,155.60 364.97,155.60 364.97,385.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="111.87,359.77 364.97,169.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="196.24,155.60 196.24,296.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="111.87,380.02 364.97,380.02" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="358.5074441687345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="169.9466501240695" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="196.2382133995037" y="147.58933002481388" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="205.94044665012404" y="295.65384615384613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="154.4764267990074" y="315.05831265508687" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 m</text><text x="280.6054590570719" y="222.67617866004966" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 m</text><text x="238.42183622828782" y="391.41066997518607" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">12 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las únicas fuerzas verticales son el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">peso y la tensión, por lo que T=1 800</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N. Las reacciones horizontales de las</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paredes son iguales.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El desnivel entre A y B es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(15²−12²)=9 m. El punto de sujeción</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la cuerda queda a 4 m horizontales</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de A y el centro de masa a 6 m.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tomando momentos respecto de A, 1</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">800×4+9R_B=1 800×6. Despeja.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>