<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">129 · Base a partir de dos proyecciones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.91,311.52 253.35,227.54 318.00,227.54 366.48,311.52 107.91,311.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="253.35,227.54 253.35,311.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="318.00,227.54 318.00,311.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="320.6756131567273" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="253.3526839470182" y="217.78569617846503" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="317.99556372393687" y="217.78569617846503" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="321.21430382153494" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="134.30204702452627" y="304.51489321249767" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="260.3556625895177" y="236.63986944673303" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">150°</text><text x="306.14436909816845" y="236.63986944673303" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">120°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A y B son suplementarios, así que AD y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC son paralelos. La altura es AB sen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">30° = 12√3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La proyección horizontal de AB mide AB</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos 30° = 36. El lado CD forma 60° con</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AD y aporta 12√3/tan 60° = 12 a la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección horizontal.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma los dos salientes y BC. La base</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AD mide 64.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>