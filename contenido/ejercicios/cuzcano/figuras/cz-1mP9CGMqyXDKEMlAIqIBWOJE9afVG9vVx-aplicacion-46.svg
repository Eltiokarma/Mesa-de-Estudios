<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">046 · Espira cerrada con arco y diámetro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="258.49,396.52 251.84,396.34 245.21,395.82 238.62,394.95 232.08,393.74 225.61,392.19 219.24,390.30 212.97,388.08 206.82,385.54 200.82,382.67 194.98,379.50 189.31,376.02 183.83,372.26 178.55,368.21 173.50,363.89 168.67,359.31 164.10,354.49 159.78,349.43 155.73,344.16 151.96,338.68 148.49,333.01 145.31,327.16 142.45,321.16 139.91,315.02 137.69,308.75 135.80,302.37 134.25,295.91 133.03,289.37 132.17,282.78 131.64,276.15 131.47,269.50 131.64,262.85 132.17,256.22 133.03,249.63 134.25,243.09 135.80,236.63 137.69,230.25 139.91,223.98 142.45,217.84 145.31,211.84 148.49,205.99 151.96,200.32 155.73,194.84 159.78,189.57 164.10,184.51 168.67,179.69 173.50,175.11 178.55,170.79 183.83,166.74 189.31,162.98 194.98,159.50 200.82,156.33 206.82,153.46 212.97,150.92 219.24,148.70 225.61,146.81 232.08,145.26 238.62,144.05 245.21,143.18 251.84,142.66 258.49,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="258.49,142.48 258.49,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="168.35,181.00 258.49,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="276.51,218.69 276.51,321.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="281.84,308.83 276.51,321.95 271.19,308.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="216.69406867845996" y="212.13787721123833" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="270.7783558792924" y="276.87513007284076" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="286.34807492195625" y="310.4729448491155" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="344.52965660770036" y="186.73465140478666" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊗ B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para un tramo en un campo uniforme,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">integra I dℓ×B. El resultado depende</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del vector entre los extremos.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El arco tiene un vector entre extremos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de módulo 2R. El diámetro cierra el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">circuito con el vector opuesto.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos fuerzas tienen igual módulo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2IRB y sentidos opuestos, de modo que</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se cancelan.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>