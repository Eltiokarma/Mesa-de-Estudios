<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">019 · Luis y el siglo del libro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,200.95 375.10,200.95 375.10,155.25 100.90,155.25 100.90,200.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,292.35 375.10,292.35 375.10,246.65 100.90,246.65 100.90,292.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,383.75 375.10,383.75 375.10,338.05 100.90,338.05 100.90,383.75" fill="none" stroke="#008674" stroke-width="2.5"/><text x="112.47311827956989" y="170.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Luis44,nació1936</text><text x="112.47311827956989" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">año1956→Pedro21</text><text x="112.47311827956989" y="352.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Pedro a futuro37</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si Luis tiene a, el año es a²+a y debe</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">estar entre 1901 y 2000. Solo a=44:</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">observación 1980, nacimiento 1936.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Luis cumplió 20 en 1956; la suma de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cifras es 21, edad de Pedro en 1980.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hasta los 60 de Luis faltan 16 años;</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pedro tendrá 21+16=37.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>