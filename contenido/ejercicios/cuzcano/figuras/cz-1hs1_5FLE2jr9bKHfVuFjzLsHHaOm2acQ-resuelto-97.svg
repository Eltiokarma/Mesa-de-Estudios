<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">097 · Tabla de signos con raíces impares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="65" y1="275" x2="108.75" y2="275" stroke="#1766b0" stroke-width="6"/><line x1="65" y1="275" x2="75" y2="267" stroke="#1766b0" stroke-width="3"/><line x1="65" y1="275" x2="75" y2="283" stroke="#1766b0" stroke-width="3"/><circle cx="108.75" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><line x1="226.87500000000003" y1="275" x2="253.12500000000003" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="226.87500000000003" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="253.12500000000003" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><line x1="174.375" y1="275" x2="200.62500000000003" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="174.375" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="200.62500000000003" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><line x1="121.87500000000001" y1="275" x2="148.125" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="121.87500000000001" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="148.125" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><line x1="371.25" y1="275" x2="415" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="371.25" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><line x1="415" y1="275" x2="405" y2="267" stroke="#1766b0" stroke-width="3"/><line x1="415" y1="275" x2="405" y2="283" stroke="#1766b0" stroke-width="3"/><text x="108.75" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">0</text><text x="121.87500000000001" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">1</text><text x="148.125" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">3</text><text x="174.375" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">5</text><text x="200.62500000000003" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">7</text><text x="226.87500000000003" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">9</text><text x="253.12500000000003" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">11</text><text x="371.25" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">20</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Todas las raíces son impares y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">preservan el signo. Se excluyen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,9,11,20.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los puntos críticos en orden son</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,1,3,5,7,9,11,20. A partir de x&gt;20 el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">signo es positivo y alterna en cada</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frontera.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se incluyen los ceros 1,3,5,7. Entre</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las opciones, [1,3] es una componente</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">completa.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>