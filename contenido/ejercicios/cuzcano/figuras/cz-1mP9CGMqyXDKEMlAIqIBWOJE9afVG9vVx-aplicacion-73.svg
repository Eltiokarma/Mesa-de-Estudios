<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">073 · Campo y voltaje en una barra aislada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="161.96,383.77 294.50,154.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="230.78,270.77 332.73,329.40" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="317.98,327.78 332.73,329.40 323.91,317.47" fill="none" stroke="#008674" stroke-width="2.5"/><text x="150.06575682382135" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b (−)</text><text x="311.4909375337145" y="142.483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a (+)</text><text x="171.30591218038626" y="236.79016075089007" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1,5 m</text><text x="334.4303053188046" y="310.7059013917359" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 m/s</text><text x="141.56969468119541" y="173.91930089545798" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊗ 3 T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La redistribución de carga continúa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hasta que el campo interno equilibra</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">v×B.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como v es perpendicular a B, el módulo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del campo interno es vB=120 N/C.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica el campo interno por la</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud de la barra para obtener el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">módulo de la diferencia de potencial.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>