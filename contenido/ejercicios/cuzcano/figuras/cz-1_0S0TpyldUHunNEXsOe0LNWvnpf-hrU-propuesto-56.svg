<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">056 · Cilindro repartido entre aceite y agua</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,178.10 100.90,360.90 375.10,360.90 375.10,178.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,196.38 375.10,196.38" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,276.35 375.10,276.35" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="202.58,224.94 268.28,224.94 268.28,327.77 202.58,327.77 202.58,224.94" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="337.3951612903226" y="235.22580645161287" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Aceite</text><text x="337.3951612903226" y="322.0537634408602" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="235.1438172043011" y="249.50672043010752" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h/2</text><text x="235.1438172043011" y="300.9180107526882" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada líquido aporta empuje en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proporción al volumen del cilindro que</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desplaza.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al equilibrar el peso y cancelar gV,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda la media de las densidades de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las dos mitades.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula (0,5 + 1)/2 g/cm³.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>