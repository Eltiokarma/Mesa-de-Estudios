<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Dos perpendiculares sobre rectas que se cruzan</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,353.61 131.05,212.62 282.73,353.61 100.90,353.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="162.16,353.61 346.90,192.20 375.10,353.61 162.16,353.61" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="179.66,260.26 249.67,185.39 293.42,238.87" fill="none" stroke="#008674" stroke-width="2.5"/><text x="111.59871882864331" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="140.76824525280256" y="234.9827270647449" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="343.98261267444525" y="217.4810112102494" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="364.4012811713567" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ω</text><text x="249.6678105696637" y="211.64710592541755" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="189.38412262640128" y="260.26298329901624" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="280.7819720887669" y="234.01040951727293" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el teorema del ángulo exterior,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los dos exteriores inferiores del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo central son α+β y θ+ω.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el cuadrilátero superior hay dos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos rectos. Por ello x suplementa</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el ángulo de cruce, que es opuesto por</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el vértice al ángulo superior del</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo central.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así x es el tercer exterior del</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo central. Calcula 360°−240°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>