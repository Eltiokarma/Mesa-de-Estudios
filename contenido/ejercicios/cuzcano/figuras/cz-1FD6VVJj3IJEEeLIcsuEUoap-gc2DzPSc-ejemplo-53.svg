<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">053 · Bases inversas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución real</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="94.16666666666666" y1="275" x2="239.99999999999997" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="94.16666666666666" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="94.16666666666666" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">0</text><circle cx="239.99999999999997" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="239.99999999999997" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">1</text><line x1="330.129956692693" y1="275" x2="385.8333333333333" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="330.129956692693" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="330.129956692693" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">1.618</text><circle cx="385.8333333333333" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="385.8333333333333" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">2</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El dominio es 0&lt;x&lt;2, x≠1. Cambiar la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segunda base da log_x[(x+1)(2−x)]≤0.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para 0&lt;x&lt;1: (x+1)(2−x)≥1. Se cumple en</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">todo ese tramo.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para 1&lt;x&lt;2: (x+1)(2−x)≤1, o x²−x−1≥0.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Queda x≥(1+√5)/2 dentro del dominio.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>