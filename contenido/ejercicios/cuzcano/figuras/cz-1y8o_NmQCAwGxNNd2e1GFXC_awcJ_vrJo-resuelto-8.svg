<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Distancia a un cruce de bisectrices exteriores</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.88,367.46 164.72,172.54 299.32,172.54 244.98,367.46 107.88,367.46" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="299.32,172.54 354.66,172.54" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="244.98,367.46 286.36,367.46" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="299.32,172.54 366.12,273.74 244.98,367.46" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="164.72,172.54 366.12,273.74" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="172.69,176.52 170.20,185.00 161.23,181.01" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="377.9310850439882" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="158.23460410557186" y="163.0630498533725" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="300.316715542522" y="161.56744868035196" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="244.48093841642228" y="378.4296187683284" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.0967741935484" y="275.7316715542522" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="235.00879765395894" y="160.5703812316716" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="128.32258064516128" y="267.2565982404692" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6</text><text x="236.50439882697947" y="210.4237536656892" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="316.2697947214076" y="184.00146627565985" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="300.81524926686217" y="195.96627565982408" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="253.95307917888562" y="350.5117302052786" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="267.41348973607035" y="358.4882697947214" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prolonga NQ hasta A sobre la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">prolongación de PO. El paralelismo de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las bases y la bisectriz en N hacen</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">isósceles al triángulo ONA, con</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OA=ON=6.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La bisectriz desde O también es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mediana, así que Q es punto medio de</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">NA. Si M es el punto medio de PI, MQ</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es la base media del trapecio PINA y</text><text x="482" y="315" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mide (2+8)/2=5.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo IMQ es rectángulo en I y</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MI=3. Por Pitágoras IQ=√(5²−3²)=4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>