<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">022 · Máximo de una combinación de seno y coseno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="238.00000000000003" y1="105" x2="238.00000000000003" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (radianes)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">N</text><polyline points="100.90,371.49 105.47,363.02 110.04,353.52 114.61,343.11 119.18,331.88 123.75,319.97 128.32,307.51 132.89,294.64 137.46,281.48 142.03,268.20 146.60,254.93 151.17,241.82 155.74,229.01 160.31,216.65 164.88,204.87 169.45,193.79 174.02,183.54 178.59,174.24 183.16,165.98 187.73,158.85 192.30,152.94 196.87,148.30 201.44,144.99 206.01,143.04 210.58,142.48 215.15,143.32 219.72,145.53 224.29,149.10 228.86,153.99 233.43,160.15 238.00,167.51 242.57,175.98 247.14,185.48 251.71,195.89 256.28,207.12 260.85,219.03 265.42,231.49 269.99,244.36 274.56,257.52 279.13,270.80 283.70,284.07 288.27,297.18 292.84,309.99 297.41,322.35 301.98,334.13 306.55,345.21 311.12,355.46 315.69,364.76 320.26,373.02 324.83,380.15 329.40,386.06 333.97,390.70 338.54,394.01 343.11,395.96 347.68,396.52 352.25,395.68 356.82,393.47 361.39,389.90 365.96,385.01 370.53,378.85 375.10,371.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">N(x)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desarrolla el seno de la diferencia</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">usando sen π/6=1/2 y cos π/6=√3/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Agrupa y obtén N=7cos x−3√3 sen x.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El máximo de a cos x+b sen x es</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(a²+b²), alcanzado al alinear el</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vector unitario con (a,b).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>