<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">475 · Cinco metilos sobre una cadena de once carbonos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,261.72 128.32,277.28 155.74,261.72 183.16,277.28 210.58,261.72 238.00,277.28 265.42,261.72 292.84,277.28 320.26,261.72 347.68,277.28 375.10,261.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="155.74,261.72 155.74,232.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="155.74,261.72 155.74,291.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="210.58,261.72 210.58,291.19" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="292.84,277.28 292.84,247.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="292.84,277.28 292.84,306.74" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ruta terminal de extremo a extremo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contiene once carbonos. El padre es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">undecano.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el sentido escrito los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituyentes son cinco metilos en</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3,3,5,8,8.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al invertir se obtienen 4,4,7,9,9. El</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primer conjunto es menor en el primer</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto de diferencia.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>