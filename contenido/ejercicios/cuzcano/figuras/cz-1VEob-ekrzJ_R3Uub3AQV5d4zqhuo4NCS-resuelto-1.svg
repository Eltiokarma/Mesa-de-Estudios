<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Expansión adiabática: presión final</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">V/V₁</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">P (Pa)</text><polyline points="135.18,142.48 139.18,177.24 143.17,204.45 147.17,226.26 151.17,244.07 155.17,258.86 159.17,271.31 163.17,281.92 167.17,291.04 171.17,298.97 175.16,305.91 179.16,312.03 183.16,317.46 187.16,322.31 191.16,326.66 195.16,330.58 199.16,334.14 203.15,337.37 207.15,340.32 211.15,343.02 215.15,345.50 219.15,347.79 223.15,349.90 227.15,351.86 231.15,353.68 235.14,355.37 239.14,356.95 243.14,358.42 247.14,359.81 251.14,361.10 255.14,362.32 259.14,363.47 263.13,364.55 267.13,365.57 271.13,366.54 275.13,367.45 279.13,368.32 283.13,369.14 287.13,369.92 291.12,370.66 295.12,371.37 299.12,372.05 303.12,372.69 307.12,373.30 311.12,373.89 315.12,374.45 319.12,374.99 323.11,375.50 327.11,376.00 331.11,376.47 335.11,376.93 339.11,377.36 343.11,377.78 347.11,378.19 351.10,378.58 355.10,378.95 359.10,379.31 363.10,379.66 367.10,380.00 371.10,380.33 375.10,380.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">proceso</text><line x1="375.09677419354836" y1="380.6391129032258" x2="365.67464180373497" y2="383.9892503972444" stroke="#1766b0" stroke-width="2"/><line x1="375.09677419354836" y1="380.6391129032258" x2="366.3131942473152" y2="375.8590790824112" stroke="#1766b0" stroke-width="2"/><circle cx="135.1774193548387" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="142.1774193548387" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1: 4 Pa</text><circle cx="375.09677419354836" cy="380.6391129032258" r="3.7" fill="#20364b"/><text x="368.09677419354836" y="372.6391129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="end">2: 0,25 Pa</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para una adiabática reversible o</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuasiestática del modelo, PV^γ</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">permanece constante.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P₂=P₁(V₁/V₂)^γ=4(1/8)^(4/3)=4/16.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P₂=0,25 Pa. Las alternativas A y E</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">repiten ese mismo valor: el resultado</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es único, la letra de opción no.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>