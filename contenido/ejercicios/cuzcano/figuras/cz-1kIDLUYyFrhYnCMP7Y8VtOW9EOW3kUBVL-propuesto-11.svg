.29 220.63,355.30 225.79,352.96 230.78,350.29 235.60,347.30 240.20,343.99 244.58,340.40 248.72,336.53 252.59,332.39 256.19,328.01 259.49,323.41 262.48,318.59 265.15,313.60 267.49,308.44 269.48,303.13 271.13,297.71 272.41,292.19 273.34,286.60 273.89,280.96 274.08,275.30" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="144.1969439728353" y="350.28717792275586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="375.0967741935484" y="350.28717792275586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="317.3718166383701" y="250.30461857243014" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="274.07809847198644" y="275.30025841001157" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="331.8030560271647" y="275.30025841001157" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="274.07809847198644" y="350.28717792275586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma X=(0,0), D=(d,0) y T=(t,h). Como</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">TR∥XD, la razón OR/OD=1/4 da</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OT/OX=1/4. Así O=(4t/3,4h/3).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La perpendicularidad de XO y OD da</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d=(4/3)(t²+h²)/t.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El radio a T es horizontal, por lo que</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el centro es (t−12,h). Como X está en</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el círculo, (t−12)²+h²=144 y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t²+h²=24t.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>