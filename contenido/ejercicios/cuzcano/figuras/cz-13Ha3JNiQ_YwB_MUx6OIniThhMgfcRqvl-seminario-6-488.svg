<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">488 · Fórmula correspondiente a buta-1,3-dieno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="213.75,162.10 213.75,229.35 146.50,229.35 146.50,162.10 213.75,162.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="207.36,173.93 207.36,217.51" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="152.89,217.51 152.89,173.93" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="180.13,257.54 221.31,328.87 138.95,328.87 180.13,257.54" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="221.31,328.87 238.61,338.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="108.46033108842039" y="197.15018963653125" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="195.7235905712177" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₂=C=CH–CH₃</text><text x="270.4795094038901" y="197.15018963653125" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="100.90322580645162" y="306.5227846439012" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="305.0961855785877" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₂=CH–CH=CH₂</text><text x="270.4795094038901" y="306.5227846439012" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.0967741935484" y="375.4750728007215" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃–CH=CH–CH₃</text><text x="270.4795094038901" y="376.90167186603503" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Buta- señala una cadena abierta de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuatro carbonos. -dieno exige dos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enlaces dobles.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los localizadores 1 y 3 fijan los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dobles entre C1–C2 y C3–C4, separados</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por un enlace simple.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completa las valencias de carbono. Los</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">carbonos terminales llevan dos H y los</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interiores uno.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>