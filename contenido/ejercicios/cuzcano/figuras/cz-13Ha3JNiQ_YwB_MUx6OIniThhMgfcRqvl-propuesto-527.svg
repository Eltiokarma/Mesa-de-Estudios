<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">527 · Prioridad alfabética entre bromo y cloro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="210.71,205.51 293.41,253.26 293.41,348.77 210.71,396.52 128.00,348.77 128.00,253.26 210.71,205.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="210.71,205.51 210.71,165.40" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="293.41,348.77 328.15,368.82" fill="none" stroke="#008674" stroke-width="2.5"/><text x="210.70696679499383" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Br</text><text x="347.99919443229766" y="380.28098471986414" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cl</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al sustituir dos H de C₆H₁₂ por Br y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cl queda C₆H₁₀BrCl.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El anillo es un derivado saturado del</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ciclohexano. Los carbonos se describen</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">como sp³ y solo hay enlaces simples.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambos sentidos permiten 1,3. En el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desempate, bromo va primero</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alfabéticamente y recibe el 1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>