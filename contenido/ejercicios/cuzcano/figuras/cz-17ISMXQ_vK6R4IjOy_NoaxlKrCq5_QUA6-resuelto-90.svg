<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">090 · Triángulos dentro de un trapecio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="112.71,320.67 142.23,215.71 163.22,320.67" fill="#f4c581" fill-opacity="0.45"/><polygon points="163.22,320.67 184.87,215.71 207.83,320.67" fill="#f4c581" fill-opacity="0.45"/><polygon points="207.83,320.67 207.83,215.71 375.10,320.67" fill="#f4c581" fill-opacity="0.45"/><polyline points="112.71,320.67 142.23,215.71 207.83,215.71 375.10,320.67 112.71,320.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="207.83,215.71 207.83,320.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="112.71,320.67 142.23,215.71 163.22,320.67 112.71,320.67" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="163.22,320.67 184.87,215.71 207.83,320.67 163.22,320.67" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="207.83,320.67 207.83,215.71 375.10,320.67 207.83,320.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="107.9032258064516" y="321.19285383546844" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><text x="138.73360086433092" y="206.39890415187529" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><text x="211.54576323506714" y="204.4310078715851" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N</text><text x="382.0967741935484" y="321.8488192622318" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><text x="176.1236301898441" y="189.9997684827905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">b</text><text x="237.78438030560272" y="333.00023151720944" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4b</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con altura h, el área total del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">trapecio es (b+4b)h/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos triángulos blancos tienen sus</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bases en QN y suman bh/2 de área, pues</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sus bases juntas miden b y su altura</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es h.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El blanco es 1/5 del total; la sombra</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 4/5, o 80%.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>