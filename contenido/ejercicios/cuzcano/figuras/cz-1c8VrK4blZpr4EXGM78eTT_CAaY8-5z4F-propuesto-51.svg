<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">051 · Escalar las frecuencias para hallar el total</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,380.13 375.10,380.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,380.13 100.90,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,380.13 100.90,243.55 151.68,243.55 151.68,380.13" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="151.68,380.13 151.68,175.26 202.46,175.26 202.46,380.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="202.46,380.13 202.46,209.41 253.23,209.41 253.23,380.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="253.23,380.13 253.23,277.69 304.01,277.69 304.01,380.13" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="304.01,380.13 304.01,243.55 354.79,243.55 354.79,380.13" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="151.67980884109917" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="202.45639187574673" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">c</text><text x="253.23297491039426" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">d</text><text x="304.0095579450418" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">e</text><text x="354.7861409796894" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">f</text><text x="126.2915173237754" y="231.25858480749218" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">68a %</text><text x="177.06810035842295" y="162.97034339229964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">102a %</text><text x="227.84468339307048" y="197.1144640998959" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">85a %</text><text x="278.62126642771807" y="265.4027055150884" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">51a %</text><text x="329.39784946236557" y="231.25858480749218" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">68a %</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma las alturas de las tres clases</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iniciales: 68+102+85=255.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como todas las clases tienen el mismo</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ancho, la proporción es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">255/(68+102+85+51+68)=255/374.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si 60 observaciones representan esa</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fracción, el total es 60×374/255.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>