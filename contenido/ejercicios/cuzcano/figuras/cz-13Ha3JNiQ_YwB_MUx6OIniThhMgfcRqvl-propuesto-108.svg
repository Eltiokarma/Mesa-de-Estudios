<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">108 · Dos símbolos y una fórmula binaria</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="113.90845339793447" y="270.04188448297845" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="100.90322580645162" y="233.1937396404437" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="124.74614305750352" y="233.1937396404437" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="113.90845339793447" y="305.8062603595563" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="346.91878107866887" y="270.04188448297845" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="333.91355348718605" y="237.52881550427134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="354.50516384036723" y="237.52881550427134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="375.0967741935484" y="268.95811551702155" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="344.7512431467551" y="302.55495346168556" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="312.238174168048" y="260.2879637893663" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="312.238174168048" y="279.7958051765906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los puntos sitúan a X en el patrón</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ns²np¹ y a M en ns²np⁴, ambos del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bloque p.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los grupos correspondientes son 13 y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">16.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el modelo de cargas del ejercicio,</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3x−2m=0 exige x:m=2:3. La fórmula</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esperada es X₂M₃.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>