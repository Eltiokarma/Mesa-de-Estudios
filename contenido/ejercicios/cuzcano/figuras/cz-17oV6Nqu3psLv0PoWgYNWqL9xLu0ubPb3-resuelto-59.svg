<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">059 · Ángulo al cruce de dos rectas desde el eje vertical</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="149.56,370.31 326.44,370.31" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="262.89,396.52 262.89,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="199.42,168.69 225.55,220.96 300.23,370.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="175.77,370.31 225.55,220.96 240.49,176.16" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="262.89,370.31 225.55,220.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="262.89,395.32 260.48,395.20 258.09,394.86 255.75,394.28 253.47,393.48 251.28,392.46 249.20,391.24 247.24,389.82 245.43,388.22 243.79,386.46 242.32,384.54 241.04,382.49 239.97,380.33 239.11,378.07 238.47,375.74 238.06,373.36 237.88,370.96 237.94,368.54 238.22,366.15 238.74,363.79 239.48,361.49 240.44,359.27 241.61,357.16 242.97,355.17 244.53,353.32 246.25,351.63 248.13,350.11 250.14,348.78 252.28,347.65 254.51,346.74 256.82,346.04" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="262.89048187972924" y="370.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="225.5547590601354" y="220.9635603345281" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="300.226204699323" y="370.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="175.77379530067702" y="370.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="326.4358821186778" y="375.3467741935484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="269.9469334926324" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="231.52847471127043" y="385.9874551971326" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala y=2−2x con y=3x+7. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intersección es (−1,4).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al rotar el eje inicial 90° en sentido</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">antihorario para llevarlo a +x, el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vector (−1,4) pasa a (−4,−1).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente respecto del nuevo eje</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inicial es (−1)/(−4).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>