<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Dos retiros de doce litros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,241.22 100.90,311.91 169.45,311.91 169.45,241.22" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,261.79 169.45,261.79" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="195.16,241.22 195.16,311.91 263.71,311.91 263.71,241.22" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="195.16,261.79 263.71,261.79" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="306.55,241.22 306.55,311.91 375.10,311.91 375.10,241.22" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="306.55,261.79 375.10,261.79" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="271.42,274.64 297.55,274.64 288.55,268.64" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="297.55,274.64 288.55,280.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="135.17741935483872" y="227.085685483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Inicial</text><text x="135.17741935483872" y="278.0685483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">72 L</text><text x="135.17741935483872" y="296.4909274193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">72 L vino</text><text x="229.4314516129032" y="227.085685483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Primer retiro</text><text x="229.4314516129032" y="278.0685483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">72 L</text><text x="229.4314516129032" y="296.4909274193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60 L vino</text><text x="340.8225806451612" y="227.085685483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Segundo retiro</text><text x="340.8225806451612" y="278.0685483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">72 L</text><text x="340.8225806451612" y="296.4909274193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50 L vino</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si la capacidad es V, cada operación</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva una fracción 1 − 12/V del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vino.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Después de dos operaciones, la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fracción de vino es (1 − 12/V)² =</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">25/36.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fracción retenida en cada paso es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positiva, 5/6. Por tanto 12/V = 1/6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>