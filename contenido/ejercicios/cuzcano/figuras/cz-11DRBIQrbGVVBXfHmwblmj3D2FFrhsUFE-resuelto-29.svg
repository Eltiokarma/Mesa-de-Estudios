<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Cuadrilátero con diagonales y lados iguales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.30,316.05 181.20,221.24 280.28,246.86 363.99,315.20 110.30,316.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="181.20,221.24 363.99,315.20" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.30,316.05 280.28,246.86" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.9032258064516" y="324.5949653301176" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="181.19666365189428" y="214.4050346698824" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="283.6989247311828" y="240.88478544869864" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="323.7407798211235" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="130.7997186212441" y="298.96940006029547" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="153.862727364084" y="311.78218269520653" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="248.67731886242586" y="257.114310119586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40°</text><text x="320.42890161792786" y="310.92799718621245" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="330.6791277258567" y="291.2817304793488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10°</text><text x="233.3019797005326" y="228.07200281378755" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=·</text><text x="326.40820018088635" y="275.90639131745553" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=·</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Traza CE con E en AD y ∠ACE=20°. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo AEC da AE=EC. En CED, los</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos en E y D son 40°, por lo que</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EC=CD.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠BCE=40°+20°=60° y BC=CD=CE, BCE</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es equilátero. Entonces EB=EC=AE.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo AEB vale 180°−40°−60°=80°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así ∠BAE=50° y x=50°−20°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>