<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">052 · Tangente desde un área cuadrática</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="161.39,319.90 314.61,319.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="187.60,396.52 187.60,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="187.60,319.90 288.40,168.69 288.40,319.90 288.40,370.31 187.60,319.90" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="187.60,293.44 188.12,293.45 188.63,293.46 189.15,293.49 189.67,293.52 190.19,293.57 190.70,293.62 191.22,293.69 191.73,293.77 192.24,293.85 192.75,293.95 193.26,294.05 193.76,294.17 194.27,294.30 194.77,294.43 195.26,294.58 195.76,294.73 196.25,294.90 196.74,295.07 197.22,295.26 197.71,295.45 198.18,295.65 198.66,295.86 199.13,296.09 199.59,296.32 200.05,296.56 200.51,296.80 200.96,297.06 201.40,297.33 201.84,297.60 202.28,297.89" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="187.59677419354838" y="319.9032258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="288.4032258064516" y="168.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="288.4032258064516" y="319.9032258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="288.4032258064516" y="370.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="314.61290322580646" y="324.94354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="194.65322580645164" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="195.91330645161293" y="288.90524193548384" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="301.0040322580645" y="333.2600806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(a,0)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea NB=u. Entonces AB=4u y el área con</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura a es 2au. De 2au=a² se obtiene</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">u=a/2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A tiene coordenadas (a,3a/2). Al girar</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">90° en sentido horario para alinear el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inicio con el eje x, el vector queda</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(3a/2,−a).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide las coordenadas del vector</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">girado para obtener −2/3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>