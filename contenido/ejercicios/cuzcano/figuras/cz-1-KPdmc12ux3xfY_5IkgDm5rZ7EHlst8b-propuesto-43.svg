/><text x="269.19354838709677" y="135.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">brazo1m</text><circle cx="262.19354838709677" cy="385.6290322580645" r="3.7" fill="#20364b"/><text x="269.19354838709677" y="377.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">brazo0,5m</text><circle cx="375.0967741935484" cy="143.69354838709677" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="135.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1kg</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para pequeña rotaciónθ, bloque se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mueve x≈1·θ yresorteδ≈0,5θ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Energía elástica=Kδ²/2=keq x²/2, así</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">keq=100(0,5/1)²=25 N/m.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T=2π√(1/25)=2π/5 s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>