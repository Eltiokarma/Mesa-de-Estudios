2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">V</text><rect x="352.0" y="274" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">F</text><rect x="48.0" y="322" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="86.0" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">F</text><rect x="124.0" y="322" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="162.0" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">F</text><rect x="200.0" y="322" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">V</text><rect x="276.0" y="322" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="314.0" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">V</text><rect x="352.0" y="322" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">V</text><text x="48" y="397" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Tabla de verdad</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con p falsa y q verdadera, p∨q es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verdadera y p es falsa. La primera</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">falla.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si p∧q es verdadera, p necesariamente</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es verdadera. La segunda pasa en todas</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las filas.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con p falsa y q verdadera, q→p es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">falsa. El antecedente exterior q es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verdadero y la tercera también falla.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>