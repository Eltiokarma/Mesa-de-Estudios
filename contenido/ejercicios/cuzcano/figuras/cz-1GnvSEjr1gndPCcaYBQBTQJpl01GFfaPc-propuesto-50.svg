<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">050 · Resistencia entre nodos vecinos de malla infinita</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,338.05 375.10,338.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,200.95 375.10,200.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,338.05 100.90,200.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="169.45,338.05 169.45,200.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,338.05 238.00,200.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="306.55,338.05 306.55,200.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,338.05 375.10,200.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><circle cx="238.0" cy="269.5" r="3.7" fill="#20364b"/><text x="245.0" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="306.5483870967742" cy="269.5" r="3.7" fill="#20364b"/><text x="313.5483870967742" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="375.0967741935484" cy="200.9516129032258" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="192.9516129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">∞</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Inyectar corriente I en A y extraerla</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en infinito: por simetría, cada arista</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de A lleva I/4.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Superponer extracción I en B con</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">retorno en infinito: aporta otro I/4</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por la arista A–B.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con fuente I de A a B, esa arista</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lleva I/2, así VAB=rI/2 y Req=r/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>