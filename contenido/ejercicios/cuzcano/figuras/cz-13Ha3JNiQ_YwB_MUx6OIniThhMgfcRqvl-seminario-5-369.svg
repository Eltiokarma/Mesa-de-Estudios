<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">369 · Energía de activación y diferencia de niveles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">Avance</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Energía (J/mol)</text><polyline points="100.90,211.20 164.67,211.20 183.80,200.79 202.93,165.39 218.87,146.65 234.81,142.48 250.75,146.65 266.69,171.64 285.82,246.60 308.14,323.64 324.08,369.45 375.10,369.45" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">perfil</text><circle cx="120.03300825206301" cy="211.19751454257005" r="3.7" fill="#20364b"/><text x="127.03300825206301" y="203.19751454257005" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">89</text><circle cx="234.81170292573145" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="241.81170292573145" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">122</text><circle cx="346.40210052513123" cy="369.4471179270227" r="3.7" fill="#20364b"/><text x="353.40210052513123" y="361.4471179270227" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">13</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ea es la diferencia máximo menos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reactivos: 122−89=33 en las unidades</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del eje.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cambio de entalpía es producto</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">menos reactivos: 13−89=−76. La</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reacción directa es exotérmica.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con el eje literal, convierte de J a</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">kJ dividiendo por 1000: Ea=0,033</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">kJ/mol y ΔH=−0,076 kJ/mol.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>