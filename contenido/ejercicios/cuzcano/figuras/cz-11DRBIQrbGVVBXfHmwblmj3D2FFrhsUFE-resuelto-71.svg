<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">071 · Longitud del lado opuesto a un ángulo doble</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.94,329.81 164.43,208.39 365.45,329.81 108.94,329.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.94,329.81 203.83,267.09" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="164.43,208.39 203.83,267.09" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="338.65145208589536" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="165.23015797937754" y="200.3485479141046" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="338.65145208589536" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="209.45492384826412" y="261.4591334783843" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="189.35275754422474" y="237.33653391353704" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">14 m</text><text x="131.45851858859143" y="310.5084192602403" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16°</text><text x="138.6952984580456" y="324.9819789991486" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La bisectriz forma 16° con AB, así que</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BH=AB sen16° y AB=14/sen16°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ley de senos, BC=AB sen32°/sen16°.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa sen32°=2sen16° cos16° para reducir</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a 28cot16°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>