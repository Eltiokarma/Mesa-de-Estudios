troke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Círculo unitario</text><polyline points="144.34,355.29 331.66,183.71 277.84,269.50 144.34,355.29" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Triángulo KQT</text><polyline points="144.34,183.71 144.34,355.29" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Cuerda MK</text><polyline points="238.00,333.01 331.66,183.71" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">Secante PQ</text><circle cx="144.33910467923698" cy="183.7052815025756" r="3.7" fill="#20364b"/><text x="151.33910467923698" y="175.7052815025756" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="144.33910467923698" cy="355.2947184974244" r="3.7" fill="#20364b"/><text x="151.33910467923698" y="347.2947184974244" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">K</text><circle cx="331.660895320763" cy="183.7052815025756" r="3.7" fill="#20364b"/><text x="338.660895320763" y="175.7052815025756" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><circle cx="277.8399953611679" cy="269.5" r="3.7" fill="#20364b"/><text x="284.8399953611679" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="238.0" cy="269.5" r="3.7" fill="#20364b"/><text x="245.0" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="238.0" cy="333.008064516129" r="3.7" fill="#20364b"/><text x="245.0" y="325.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="238.0" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="245.0" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B′</text><circle cx="365.016129032258" cy="269.5" r="3.7" fill="#20364b"/><text x="372.016129032258" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea c=cos α y s=sen α. K=(c,−s) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Q=(−c,s), así que KQ pasa por O.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En PQ, la altura desde P hasta T es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/2 del tramo escalado de altura total</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">s+1/2. Luego x_T=−c/(2s+1).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos KOT y QOT tienen base</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OT común y altura s. Suma sus áreas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>