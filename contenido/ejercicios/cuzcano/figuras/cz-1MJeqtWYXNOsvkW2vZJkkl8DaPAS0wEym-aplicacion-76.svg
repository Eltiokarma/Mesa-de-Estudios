<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">076 · Fuerza y punto de aplicación en una varilla acodada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,249.72 325.65,249.72 325.65,339.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="145.85,197.58 145.85,249.72" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="141.81,241.18 145.85,249.72 149.90,241.18" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="235.75,197.58 235.75,249.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="231.71,241.18 235.75,249.72 239.80,241.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,339.62 325.65,339.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="334.19,335.58 325.65,339.62 334.19,343.67" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="181.36,306.81 190.80,249.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="193.40,258.81 190.80,249.72 185.42,257.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="145.85298783712324" y="187.69143310417772" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 N</text><text x="235.75251189846642" y="187.69143310417772" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 N</text><text x="360.26335272342675" y="351.3085668958223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 N</text><text x="190.80274986779483" y="240.7321523003702" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="168.32786885245903" y="241.18164992067688" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="190.80274986779483" y="227.69672131147544" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 m</text><text x="338.6874669487044" y="294.67186673717606" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 m</text><text x="173.27234267583287" y="299.16684294024327" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La componente horizontal de F</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilibra los 5 N. Su componente</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical equilibra 20+10=30 N.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma momentos respecto de P. La carga</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 20 N produce +20x. La de 10 N</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">produce −10(2−x) y los 5 N producen</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−5×2.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala la suma a cero y despeja x.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>