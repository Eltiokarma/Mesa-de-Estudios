<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Ortocentro con un lado sobre una recta dada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="142.73790322580646" y1="105" x2="142.73790322580646" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="142.74,253.62 333.26,142.48 333.26,396.52 142.74,253.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">ABC</text><polyline points="142.74,253.62 333.26,253.62" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Altura desde A</text><polyline points="142.74,396.52 333.26,142.48" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Altura desde B</text><circle cx="142.73790322580646" cy="253.62298387096774" r="3.7" fill="#20364b"/><text x="149.73790322580646" y="245.62298387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="333.26209677419354" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="340.26209677419354" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="333.26209677419354" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="340.26209677419354" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="249.90776209677415" cy="253.62298387096774" r="3.7" fill="#20364b"/><text x="256.90776209677415" y="245.62298387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H</text><circle cx="142.73790322580646" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="149.73790322580646" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los interceptos son A=(0,12) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C=(16,0). La altura desde A es y=12.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de AC es −3/4 y la altura</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por O tiene pendiente 4/3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resuelve 12=4x/3 para cruzar las</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alturas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>