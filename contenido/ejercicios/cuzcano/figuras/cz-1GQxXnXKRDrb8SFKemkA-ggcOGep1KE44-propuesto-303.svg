.69 297.41,183.50 299.69,183.58 301.98,183.93 304.26,184.57 306.55,185.49 308.83,186.72 311.12,188.25 313.40,190.11 315.69,192.30 317.97,194.83 320.26,197.70 322.54,200.94 324.83,204.54 327.11,208.53 329.40,212.90 331.68,217.66 333.97,222.84 336.25,228.43 338.54,234.45 340.82,240.90 343.11,247.80 345.39,255.15 347.68,262.97 349.96,271.26 352.25,280.04 354.53,289.31 356.82,299.08 359.10,309.36 361.39,320.17 363.67,331.51 365.96,343.39 368.24,355.82 370.53,368.81 372.81,382.37 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">curva reconstruida</text><circle cx="171.81535038932145" cy="317.8911465814228" r="3.7" fill="#20364b"/><text x="178.81535038932145" y="309.8911465814228" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−1,0)</text><circle cx="360.9143492769744" cy="317.8911465814228" r="3.7" fill="#20364b"/><text x="367.9143492769744" y="309.8911465814228" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(3,0)</text><circle cx="219.0901001112347" cy="275.36817067507593" r="3.7" fill="#20364b"/><text x="226.0901001112347" y="267.36817067507593" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tocar sin cruzar exige multiplicidad</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">par en −1; cruzar en 3 exige</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplicidad impar. Los mínimos son 2</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 1, así que P=a(x+1)²(x−3).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usar el punto (0,2): −3a=2, luego</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=−2/3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P=−(2/3)(x+1)²(x−3). Tiene grado 3 y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coeficiente principal negativo,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">compatible con las ramas del dibujo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>