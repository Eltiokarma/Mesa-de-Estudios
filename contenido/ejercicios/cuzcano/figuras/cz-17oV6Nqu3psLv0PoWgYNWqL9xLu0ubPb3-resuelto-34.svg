<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Dos cotangentes en un triángulo isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,354.52 368.72,354.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="341.09,382.15 341.09,156.85" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="128.54,354.52 213.56,184.48 341.09,354.52 128.54,354.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="213.56,184.48 213.56,354.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,354.52 375.00,352.01 374.73,349.52 374.27,347.05 373.63,344.63 372.81,342.25 371.82,339.95 370.66,337.72 369.34,335.59 367.87,333.56 366.25,331.64 364.49,329.84 362.61,328.19 360.61,326.67 358.50,325.31 356.30,324.10 354.01,323.06 351.66,322.20 349.25,321.51 346.79,320.99 344.30,320.66 341.80,320.52 339.29,320.56 336.79,320.79 334.31,321.20 331.87,321.79 329.48,322.55 327.16,323.50 324.91,324.61 322.74,325.88 320.68,327.31" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="162.54,354.52 162.52,353.27 162.45,352.01 162.34,350.76 162.17,349.52 161.97,348.28 161.71,347.05 161.42,345.83 161.07,344.63 160.69,343.43 160.25,342.25 159.78,341.09 159.26,339.95 158.70,338.83 158.11,337.72 157.47,336.64 156.79,335.59 156.07,334.56 155.31,333.56 154.52,332.58 153.69,331.64 152.83,330.73 151.94,329.85 151.01,329.00 150.06,328.19 149.07,327.41 148.05,326.67 147.01,325.97 145.95,325.31 144.86,324.69 143.75,324.10" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="128.53513378344587" y="354.5212553138284" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="341.08827206801703" y="354.5212553138284" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="213.55638909727432" y="184.47874468617155" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="213.55638909727432" y="354.5212553138284" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="368.72018004501126" y="359.83508377094273" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="348.52763190797697" y="156.84683670917724" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="351.7159289822456" y="316.2616904226056" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="166.7946986746687" y="335.391472868217" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=(−10,0). El dato de altura fija la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ordenada de B en 8.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con BO=10, el valor absoluto de la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abscisa de B es √(100−64)=6. En el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segundo cuadrante, B=(−6,8).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las cotangentes son −6/8 y 4/8, usando</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OB y el desplazamiento AB. La</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia es −10/8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>