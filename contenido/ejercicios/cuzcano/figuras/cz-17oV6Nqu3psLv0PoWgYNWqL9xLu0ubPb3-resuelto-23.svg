<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">023 · Suma de abscisas a partir de dos medianas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,364.41 375.10,364.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="122.00,385.50 122.00,153.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="185.27,174.59 354.00,237.86 143.09,301.14 185.27,174.59" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="354.00,237.86 164.18,237.86" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="143.09,301.14 269.64,206.22" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="185.27047146401986" y="164.04094292803973" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="362.4416873449132" y="237.8622828784119" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="130.4317617866005" y="301.1377171215881" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="221.12655086848636" y="229.4255583126551" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos medianas se cruzan en el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">baricentro G. Sustituye y=6 y obtén</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=5.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La abscisa de G es el promedio de las</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abscisas de los tres vértices.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja de (3+x₁+x₂)/3=5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>