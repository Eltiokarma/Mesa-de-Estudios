<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Disco mínimo para bloquear luz que sale del agua</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,222.99 375.10,222.99 375.10,329.07 100.90,329.07 100.90,222.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="135.72,221.35 340.28,221.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="135.72,222.99 238.00,313.29 340.28,222.99" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,313.29 238.00,222.99" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="238.0" y="209.92818740399386" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">disco</text><text x="248.33666154633897" y="321.455325140809" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">fuente</text><text x="217.87071172555042" y="264.8757040450589" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2√7 m</text><text x="333.7501280081925" y="298.60586277521764" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">agua</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo crítico cumple sen θ_c=3/4.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los rayos más oblicuos que ese ángulo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se reflejan internamente.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El radio del círculo de salida es h</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan θ_c, con tan</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ_c=(3/4)/(√7/4)=3/√7.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye h=2√7 m para hallar el radio</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 6 m. El diámetro es el doble.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>