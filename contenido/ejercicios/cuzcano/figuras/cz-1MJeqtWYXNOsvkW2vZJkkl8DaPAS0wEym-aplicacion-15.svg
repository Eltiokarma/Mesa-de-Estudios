<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Cable oblicuo que sostiene una esfera</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="323.74,220.33 322.62,231.79 319.27,242.80 313.85,252.96 306.54,261.86 297.64,269.16 287.49,274.59 276.47,277.93 265.02,279.06 253.56,277.93 242.54,274.59 232.39,269.16 223.49,261.86 216.18,252.96 210.76,242.80 207.41,231.79 206.29,220.33 207.41,208.87 210.76,197.85 216.18,187.70 223.49,178.80 232.39,171.50 242.54,166.07 253.56,162.73 265.02,161.60 276.47,162.73 287.49,166.07 297.64,171.50 306.54,178.80 313.85,187.70 319.27,197.85 322.62,208.87 323.74,220.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="152.26,142.48 298.92,396.52 206.29,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="214.15,190.96 163.29,161.60" fill="none" stroke="#008674" stroke-width="2.5"/><text x="179.27100726747977" y="172.17137679403092" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="277.34842513078854" y="385.35762041307925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="274.41197549416256" y="222.09102061667303" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">W</text><text x="159.30314973842292" y="148.0924897736976" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La normal apunta arriba y a la derecha</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a 30° de la horizontal. El cable</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">apunta arriba y a la izquierda a 30°</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la horizontal.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las componentes horizontales tienen</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igual factor cos 30° y sentidos</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contrarios. Por equilibrio, la tensión</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y la normal son iguales.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las componentes verticales suman 2T</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 30°=W. Como sen 30°=1/2, despeja.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>