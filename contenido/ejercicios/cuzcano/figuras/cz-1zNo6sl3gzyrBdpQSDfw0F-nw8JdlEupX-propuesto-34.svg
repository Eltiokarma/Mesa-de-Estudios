<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Resultante en dirección de A</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="260.123126613448" x2="421" y2="260.123126613448" stroke="#20364b" stroke-width="1.7"/><line x1="214.46882193447908" y1="105" x2="214.46882193447908" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="214.47,260.12 324.76,236.68" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">A=150</text><line x1="324.7556241023285" y1="236.68094314706798" x2="316.6720481925403" y2="242.56786088988474" stroke="#1766b0" stroke-width="2"/><line x1="324.7556241023285" y1="236.68094314706798" x2="314.9764848876556" y2="234.59086271319777" stroke="#1766b0" stroke-width="2"/><polyline points="214.47,260.12 189.46,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">B=160</text><line x1="189.46382623700705" y1="142.48387096774195" x2="195.35074397982382" y2="150.56744687753022" stroke="#d37618" stroke-width="2"/><line x1="189.46382623700705" y1="142.48387096774195" x2="187.37374580313684" y2="152.26301018241483" stroke="#d37618" stroke-width="2"/><polyline points="214.47,260.12 151.24,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">C=200</text><line x1="151.24437589767155" y1="396.51612903225805" x2="151.3849872492911" y2="386.5171176587374" stroke="#008674" stroke-width="2"/><line x1="151.24437589767155" y1="396.51612903225805" x2="158.78392377357144" y2="389.94686592084184" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A y B son perpendiculares. C debe</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cancelar la componente B,por lo que</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cperp=−160.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con ∣C∣=200,su componente opuesta a A</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale −√(200²−160²)=−120.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R=150−120=30 u;la dirección de C es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">12°+233,13°=245,13°,así θ≈24,87°≈25°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>