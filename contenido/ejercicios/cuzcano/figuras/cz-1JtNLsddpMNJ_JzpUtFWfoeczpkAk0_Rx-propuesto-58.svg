<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Lente entre imagen virtual y observador</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,275.33 375.10,275.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="142.03,213.63 142.03,337.02" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="279.13,275.33 279.13,239.00 273.65,245.85 279.13,239.00 284.61,245.85" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="347.68,275.33 347.68,220.49 342.19,227.34 347.68,220.49 353.16,227.34" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="142.03225806451616" y="201.97983870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="279.1290322580645" y="230.08467741935482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="347.6774193548387" y="210.2056451612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="210.58064516129033" y="286.97983870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 cm</text><text x="313.4032258064516" y="286.97983870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia del objeto es positiva, s</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= 6 cm. La imagen virtual está del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mismo lado y tiene s′ = −4 cm.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ecuación de lente da 1/f = 1/6 −</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/4 = −1/12 cm⁻¹.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto la lente es divergente, de</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">focal −12 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>