<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">071 · Distancia de un punto medio a la arista común</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,313.37 276.39,313.37 375.10,238.79 199.61,238.79" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,313.37 276.39,313.37 276.39,225.63 100.90,225.63" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,313.37 276.39,313.37 375.10,238.79 199.61,238.79 100.90,313.37" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,313.37 276.39,313.37 276.39,225.63 100.90,225.63 100.90,313.37" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,225.63 375.10,238.79" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,232.21 188.65,313.37" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="313.3709677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="276.38709677419354" y="313.3709677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="238.79032258064515" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="199.61290322580646" y="238.79032258064515" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="276.38709677419354" y="225.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="100.90322580645162" y="225.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="238.0" y="232.20967741935488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="188.64516129032256" y="313.3709677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma BA como eje x. Respecto de él, C</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene componente transversal de 10</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre el primer plano y F tiene</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente 4 sobre el segundo.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio tiene componentes</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">transversales de 5 y 2 en direcciones</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ortogonales.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica Pitágoras.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>