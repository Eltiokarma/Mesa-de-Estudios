<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">063 · Hexágonos de puntos medios</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="375.10,269.50 306.55,150.77 169.45,150.77 100.90,269.50 169.45,388.23 306.55,388.23 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="340.82,210.14 238.00,150.77 135.18,210.14 135.18,328.86 238.00,388.23 340.82,328.86 340.82,210.14" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="289.41,180.45 186.59,180.45 135.18,269.50 186.59,358.55 289.41,358.55 340.82,269.50 289.41,180.45" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,180.45 160.88,224.98 160.88,314.02 238.00,358.55 315.12,314.02 315.12,224.98 238.00,180.45" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="199.44,202.71 160.88,269.50 199.44,336.29 276.56,336.29 315.12,269.50 276.56,202.71 199.44,202.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="180.16,236.11 180.16,302.89 238.00,336.29 295.84,302.89 295.84,236.11 238.00,202.71 180.16,236.11" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="125.04032258064515" y="187.4677419354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">ℓ</text><text x="221.69354838709677" y="275.2096774193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">…</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El radio del hexágono regular equivale</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a su lado. El radio del siguiente es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el apotema anterior: ℓ cos 30°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los perímetros disminuyen con razón</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√3/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su suma es 6ℓ/(1−√3/2)=12(2+√3)ℓ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>