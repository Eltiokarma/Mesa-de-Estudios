2,340.07 290.39,333.01 292.87,325.68 295.04,318.11 296.89,310.33 298.42,302.37 299.61,294.28 300.47,286.08 300.98,277.81 301.15,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="149.14,326.84 292.50,212.16" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="186.42,161.98 255.23,377.02" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="273.87,153.92 335.51,346.56" fill="none" stroke="#b0467a" stroke-width="2.5"/><circle cx="292.50189641864483" cy="212.1565212533301" r="3.7" fill="#20364b"/><text x="299.50189641864483" y="204.1565212533301" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="149.14319955197016" cy="326.84347874666986" r="3.7" fill="#20364b"/><text x="156.14319955197016" y="318.84347874666986" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P′</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El diámetro OP tiene pendiente 4/5,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">luego 4x−5y=0.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En P, el gradiente es (50,16). La</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente tiene ecuación 25x+8y=157.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El conjugado es paralelo a esa</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente y pasa por O. Su ecuación es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">25x+8y=0.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>