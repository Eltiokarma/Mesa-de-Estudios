<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Tangente a un semicírculo oblicuo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="348.70389023037444" x2="421" y2="348.70389023037444" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="238.00,251.76 235.56,255.42 233.31,259.19 231.26,263.08 229.42,267.07 227.79,271.16 226.38,275.32 225.18,279.55 224.21,283.83 223.47,288.17 222.95,292.53 222.66,296.92 222.60,301.31 222.77,305.70 223.17,310.08 223.80,314.43 224.66,318.74 225.74,323.00 227.04,327.20 228.56,331.32 230.30,335.36 232.24,339.30 234.39,343.14 236.73,346.86 239.27,350.45 241.99,353.90 244.88,357.21 247.95,360.35 251.18,363.34 254.56,366.15 258.08,368.78 261.73,371.22 265.51,373.47 269.40,375.52 273.39,377.36 277.47,378.99 281.63,380.40 285.86,381.60 290.15,382.57 294.48,383.32 298.85,383.83 303.23,384.12 307.63,384.18 312.02,384.01 316.40,383.61 320.75,382.98 325.06,382.12 329.32,381.04 333.51,379.74 337.64,378.22 341.68,376.48 345.62,374.54 349.46,372.39 353.17,370.05 356.76,367.51 360.22,364.79 363.52,361.90 366.67,358.83 369.65,355.60 372.47,352.23 375.10,348.70" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Semicírculo</text><polyline points="100.90,154.82 238.00,348.70" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">L</text><polyline points="100.90,348.70 238.00,251.76" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Normal OD</text><polyline points="100.90,154.82 238.00,251.76 375.10,348.70" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">Diámetro</text><polyline points="306.55,300.23 238.00,348.70" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="503" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Radio CT</text><circle cx="100.9032258064516" cy="348.70389023037444" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="340.70389023037444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="100.9032258064516" cy="154.81977280825657" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="146.81977280825657" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="375.0967741935484" cy="348.70389023037444" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="340.70389023037444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><circle cx="237.99999999999997" cy="251.7618315193155" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="243.7618315193155" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D</text><circle cx="237.99999999999997" cy="348.70389023037444" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="340.70389023037444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="306.54838709677415" cy="300.23286087484496" r="3.7" fill="#20364b"/><text x="313.54838709677415" y="292.23286087484496" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el ángulo inscrito DTQ=90°, D</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene abscisa t. Si L tiene pendiente</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−k, entonces OD tiene pendiente 1/k y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(t,t/k).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro C, punto medio de DQ, está</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en la normal a L por T. De y_C=t/(2k)</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se obtiene x_C=3t/2 y q=2t. Por</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">colinealidad, D es punto medio de PQ,</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de modo que p=2t/k. También p=kt,</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para L de ecuación kx+y−p=0, la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia de O es p/√(k²+1)=4. Así</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">p=4√3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>