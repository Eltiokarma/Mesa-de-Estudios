<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">084 · Diagonal de un cuadrilátero con ángulos de 60°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.19,367.08 221.87,170.31 367.84,222.73 282.35,367.08 112.19,367.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="221.87,170.31 282.35,367.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="112.19,367.08 367.84,222.73" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="378.3709677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="215.4193548387097" y="159.82258064516128" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="375.0967741935484" y="218.6935483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="284.7741935483871" y="379.1774193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="219.45161290322582" y="201.75806451612905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="239.61290322580646" y="189.66129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="249.29032258064518" y="352.56451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">80°</text><text x="283.16129032258067" y="341.2741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="136.38709677419357" y="344.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma LD=1. En DLP, el ángulo en P vale</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">40° y DP=sen60°/sen40°. En DLO, el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo en O vale 100° y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DO=sen60°/sen100°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Proyecta DO sobre DP y sobre su</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular. Como ∠PDO=100°, la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente de ∠DPO es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/(1/sen40°−cot100°).</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La identidad sen100°=2sen40°cos40°=sen</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">40°(cos100°+√3 sen100°) reduce esa</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente a 1/√3. Entonces ∠DPO=30° y</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠LPO=40°−30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>