<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">060 · Primera franja de una doble rendija</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 358.53,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="358.53,154.49 358.53,370.71" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="192.91,159.09 192.91,249.26" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="192.91,289.74 192.91,370.71" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="192.91,269.50 358.53,194.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="192.91,252.94 192.91,286.06" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="192.91,249.26 358.53,194.05" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="192.91,289.74 358.53,194.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="139.54795410261963" y="255.69831132279714" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Luz</text><text x="224.19831132279717" y="257.53853647975757" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="375.0967741935484" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Centro</text><text x="375.0967741935484" y="194.0507685646244" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Máximo</text><text x="196.59493396839144" y="384.51407231002383" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Rendijas</text><text x="353.0140723100238" y="384.51407231002383" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Pantalla</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los máximos de la doble rendija</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">satisfacen d sen θ = mλ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para el primer máximo lateral m = 1,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de modo que sen θ = 0,006.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia en pantalla es 1 m·tan θ,</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximadamente 0,006 m o 6 mm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>