<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Recta de pendiente negativa a distancia fija</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="354.1774193548387" x2="421" y2="354.1774193548387" stroke="#20364b" stroke-width="1.7"/><line x1="153.32258064516128" y1="105" x2="153.32258064516128" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="110.98,311.84 195.66,227.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Distancia</text><polyline points="110.98,142.48 365.02,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">L</text><circle cx="280.3387096774194" cy="311.8387096774194" r="3.7" fill="#20364b"/><text x="287.3387096774194" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="110.98387096774192" cy="311.8387096774194" r="3.7" fill="#20364b"/><text x="117.98387096774192" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><circle cx="195.66129032258064" cy="227.1612903225806" r="3.7" fill="#20364b"/><text x="202.66129032258064" y="219.1612903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe y−1=m(x−3), con m&lt;0.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia de (−1,1) es</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4∣m∣/√(m²+1). Al igualar a 2√2 y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">elevar al cuadrado, se obtiene m²=1.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elige m=−1 y sustituye en la ecuación.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>