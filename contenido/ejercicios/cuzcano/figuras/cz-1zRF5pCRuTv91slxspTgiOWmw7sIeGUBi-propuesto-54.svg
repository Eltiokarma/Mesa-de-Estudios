<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Enlaces en acetona</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="130.15,313.37 221.55,313.37" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="258.11,313.37 349.51,313.37" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="232.52,300.58 232.52,245.74" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="247.14,300.58 247.14,245.74" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645164" y="313.3709677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="239.82795698924733" y="315.1989247311828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="313.3709677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="239.82795698924733" y="223.80107526881721" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dibuja CH₃–C(=O)–CH₃. Los seis enlaces</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C–H son σ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos enlaces C–C añaden 2 σ. El</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">doble C=O añade 1 σ y 1 π.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma 6+2+1 componentes σ y una π.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>