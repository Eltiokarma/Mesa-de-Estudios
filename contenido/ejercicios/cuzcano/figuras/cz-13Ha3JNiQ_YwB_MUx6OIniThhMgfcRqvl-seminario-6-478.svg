<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">478 · Cadena de seis carbonos con ciclopropilo, etilo y metilo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,241.47 155.74,272.57 210.58,241.47 265.42,272.57 320.26,241.47 375.10,272.57" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="210.58,241.47 210.58,300.40" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="210.58,300.40 245.31,360.56 175.85,360.56 210.58,300.40" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="265.42,272.57 265.42,213.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="265.42,213.64 226.13,178.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="265.42,213.64 304.71,178.44" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El recorrido más informativo de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud seis pasa por un extremo del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">grupo isopropilo y deja tres</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituyentes.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al numerar desde ese extremo quedan</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">metil en 2, etil en 3 y ciclopropil en</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4. Al invertir, los números empiezan</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en 3.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ordena los sustituyentes por nombre y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva los localizadores 2,3,4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>