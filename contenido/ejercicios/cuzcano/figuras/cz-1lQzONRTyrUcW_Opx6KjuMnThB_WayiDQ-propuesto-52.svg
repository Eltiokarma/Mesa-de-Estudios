<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">052 · Lado común desde dos puntos medios en planos perpendiculares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="110.98,396.52 365.02,396.52 337.00,321.72" fill="#f4c581" fill-opacity="0.45"/><polygon points="110.98,396.52 365.02,396.52 365.02,142.48 110.98,142.48" fill="#f4c581" fill-opacity="0.45"/><polyline points="110.98,396.52 365.02,396.52 337.00,321.72 110.98,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.98,396.52 365.02,396.52 365.02,142.48 110.98,142.48 110.98,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.98,396.52 337.00,321.72" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.98,396.52 365.02,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="223.99,359.12 238.00,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="110.98387096774195" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="365.01612903225805" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="336.99927498906794" y="321.71667681829564" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="365.01612903225805" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="110.98387096774195" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="223.99157297840492" y="359.1164029252768" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="238.00000000000003" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a el lado. Pon A=(0,0,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=(a,0,0), C=(a/2,a√3/2,0), D=(a,0,a).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia de los dos puntos medios</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene componentes a/4,−a√3/4,a/2. Su</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">módulo al cuadrado es a²/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala a 1 cm² y toma la raíz</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positiva.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>