 267.70,384.59 269.99,382.69 272.27,380.64 274.56,378.45 276.84,376.12 279.13,373.65 281.41,371.04 283.70,368.29 285.98,365.40 288.27,362.36 290.55,359.19 292.84,355.87 295.12,352.41 297.41,348.81 299.69,345.07 301.98,341.19 304.26,337.17 306.55,333.01 308.83,328.70 311.12,324.26 313.40,319.67 315.69,314.94 317.97,310.07 320.26,305.06 322.54,299.91 324.83,294.62 327.11,289.19 329.40,283.61 331.68,277.90 333.97,272.04 336.25,266.04 338.54,259.90 340.82,253.62 343.11,247.20 345.39,240.64 347.68,233.94 349.96,227.09 352.25,220.10 354.53,212.98 356.82,205.71 359.10,198.30 361.39,190.75 363.67,183.06 365.96,175.23 368.24,167.25 370.53,159.14 372.81,150.88 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Crece</text><circle cx="238.0" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="245.0" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Vértice</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si x₁&lt;x₂≤0, entonces ∣x₁∣&gt;∣x₂∣. Al</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">elevar al cuadrado, se obtiene</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F(x₁)&gt;F(x₂).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si 0≤x₁&lt;x₂, entonces x₁²&lt;x₂², así que</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la función crece en ese lado.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vértice x=0 puede incluirse en</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ambos intervalos. Un intervalo que lo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">atraviese contiene dos abscisas</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuestas de la misma imagen.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>