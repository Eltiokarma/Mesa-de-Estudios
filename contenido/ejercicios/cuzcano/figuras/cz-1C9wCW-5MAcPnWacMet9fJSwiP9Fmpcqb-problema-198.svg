<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">198 · Aceleración del CM en Atwood</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="206.2459677419355" y1="105" x2="206.2459677419355" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="206.25,269.50 206.25,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">a1</text><line x1="206.2459677419355" y1="142.48387096774195" x2="210.32357227253118" y2="151.61476037086504" stroke="#1766b0" stroke-width="2"/><line x1="206.2459677419355" y1="142.48387096774195" x2="202.1683632113398" y2="151.61476037086504" stroke="#1766b0" stroke-width="2"/><polyline points="206.25,269.50 206.25,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">a2</text><line x1="206.2459677419355" y1="396.51612903225805" x2="202.1683632113398" y2="387.38523962913496" stroke="#d37618" stroke-width="2"/><line x1="206.2459677419355" y1="396.51612903225805" x2="210.32357227253118" y2="387.38523962913496" stroke="#d37618" stroke-width="2"/><polyline points="206.25,269.50 206.25,294.90" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="498" font-family="Arial,sans-serif" font-size="12" fill="#008674" text-anchor="start">aCM</text><line x1="206.2459677419355" y1="294.9032258064516" x2="202.1683632113398" y2="285.7723364033285" stroke="#008674" stroke-width="2"/><line x1="206.2459677419355" y1="294.9032258064516" x2="210.32357227253118" y2="285.7723364033285" stroke="#008674" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El módulo de aceleración de cada masa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es (6−4)10/(6+4)=2 m/s².</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ligera acelera +2j y la pesada −2j.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aCM=[4(2)+6(−2)]j/10=−0,4j m/s².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>