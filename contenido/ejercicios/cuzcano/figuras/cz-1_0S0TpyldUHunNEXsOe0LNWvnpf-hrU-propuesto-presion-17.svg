<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Presión a medio metro bajo un pistón</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="117.31,200.66 117.31,259.25 363.38,376.42 363.38,200.66 117.31,200.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="234.48,153.79 234.48,200.66" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="229.50,190.70 234.48,200.66 239.46,190.70" fill="none" stroke="#008674" stroke-width="2.5"/><text x="249.13178935759575" y="165.50565205403916" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="100.90322580645159" y="259.24703611800385" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354836" y="385.2120209539564" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="148.35980148883374" y="234.63992280121315" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,5 m</text><text x="322.3672456575682" y="285.61180038599394" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2,5 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La presión manométrica bajo el pistón</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es (1,5 − 1) × 10⁵ = 50 000 Pa.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al bajar medio metro, la presión crece</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1000×10×0,5 = 5000 Pa.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma el incremento a la presión</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">manométrica bajo el pistón.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>