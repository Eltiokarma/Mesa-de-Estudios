<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">087 · Sistema por reducción de filas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="86.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1</text><rect x="124.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="162.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="200.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="238.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">5/14</text><rect x="276.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="314.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1/14</text><rect x="352.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="390.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="48.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="86.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="124.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="162.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1</text><rect x="200.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">-4/7</text><rect x="276.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="314.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">-5/7</text><rect x="352.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="48.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="86.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="124.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="162.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="200.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="276.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="314.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="352.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="48.0" y="274" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="86.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="124.0" y="274" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="162.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="200.0" y="274" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="276.0" y="274" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="314.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="352.0" y="274" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><text x="48" y="349" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Forma reducida de la matriz ampliada</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Construye la matriz ampliada colocando</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B como última columna.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica en orden F1←F1/(4),</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F2←F2−(2)F1, F4←F4−(2)F1, F2←F2/(7/2),</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F1←F1−(-1/4)F2, F3←F3−(7)F2,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F4←F4−(-21/2)F2. La forma reducida es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[[1, 0, 5/14, 1/14, 0], [0, 1, -4/7,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada fila pivote determina una</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">variable. Las columnas sin pivote</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">quedan libres. (-5*x3/14 - x4/14,</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4*x3/7 + 5*x4/7, x3, x4).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>