<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">059 · Ascenso hacia la cumbre</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="164.67,396.52 210.05,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="210.05,396.52 249.34,373.83" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="164.67,396.52 311.33,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="249.34,373.83 311.33,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="171.66720371180156" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="217.04569597836266" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="256.3446230666403" y="365.82688289897754" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><text x="318.33279628819844" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segundo punto Q tiene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coordenadas(240+120√3,120). Si altura</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H,la base de cumbre está en x=H/√3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(H−120)/(H/√3−240−120√3)=tan75=2+√3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resolver:H=360(2+√3)m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>