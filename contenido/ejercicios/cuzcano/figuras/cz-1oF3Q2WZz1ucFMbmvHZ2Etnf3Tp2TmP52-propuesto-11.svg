<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Reducir cinco longitudes a dos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,293.83 375.10,293.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,290.43 107.18,297.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="172.59,290.43 172.59,297.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="194.39,290.43 194.39,297.23" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="224.92,290.43 224.92,297.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="368.82,290.43 368.82,297.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="172.59,267.67 224.92,267.67" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="172.59,264.53 172.59,270.81" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="224.92,264.53 224.92,270.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,241.51 368.82,241.51" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="107.18,238.37 107.18,244.64" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="368.82,238.37 368.82,244.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="107.18246737256834" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="172.59123368628417" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="194.3941557908561" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="224.91824673725685" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="368.81753262743166" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="198.7547402117705" y="259.2962324550603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">RT</text><text x="238.0" y="233.132725929574" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">GA</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Agrupa GE+EA=GA.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la superposición de tramos,</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">RA+GT=GA+RT. La igualdad se vuelve</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">GA·RT=2(GA+RT).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide por 2GA·RT. La suma de</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recíprocos es 1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>