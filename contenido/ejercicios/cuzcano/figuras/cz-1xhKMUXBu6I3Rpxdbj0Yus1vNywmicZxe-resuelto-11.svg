<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Menor ángulo con un lado igual a un segmento de la base</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,316.39 229.20,316.39 375.10,316.39 100.90,316.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,316.39 212.67,222.61 375.10,316.39 229.20,316.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="212.67,222.61 229.20,316.39" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645164" y="316.38985835916424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="212.66554011798695" y="222.61014164083576" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="316.38985835916424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="229.20143441862496" y="316.38985835916424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="147.5161290322581" y="294.4543744881965" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4x</text><text x="331.22580645161287" y="302.6801809398094" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3x</text><text x="231.1451612903226" y="242.35760029464814" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ley de senos da BD/AB=sen 4x/sen 8x</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y BD/CD=sen 3x/sen 5x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala y simplifica a 2cos x·sen</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3x=sen 10x. Como 2cos x·sen 3x=sen</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4x+sen 2x, resulta 2cos 6x·sen 4x=sen</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4x.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 0&lt;x&lt;15°, cos 6x=1/2 implica</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=10°. Los ángulos de ABD son</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">40°,80°,60°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>