<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">025 · Distancia entre la arista de un rectángulo y una oblicua</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="135.50,188.11 135.50,321.27 340.50,321.27" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,347.40 170.09,295.13 375.10,295.13 305.91,347.40 100.90,347.40" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,347.40 170.09,295.13 135.50,188.11 100.90,347.40" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="135.50,188.11 305.91,347.40" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="125.23,329.02 186.06,235.37" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="135.50,188.11 135.50,321.27" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="135.50,321.27 340.50,321.27" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="135.50,188.11 340.50,321.27" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="100.90322580645159" y="347.40367137926796" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="170.09225203497135" y="295.1275182288308" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="295.1275182288308" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="305.90774796502865" y="347.40367137926796" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="135.49773892071147" y="188.1112517440362" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="135.49773892071147" y="321.2655948040494" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="340.50226107928853" y="321.2655948040494" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="125.23343283186514" y="329.0208482934" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="186.058950395399" y="235.37383778965443" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="198.79288513717214" y="350.8887482559638" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="135.49773892071147" y="254.68842327404278" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3√3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En un plano perpendicular a AB, esta</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se proyecta a O y FD a la hipotenusa</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de un triángulo rectángulo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los catetos son AD=8 y la altura del</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilátero, 3√3. La hipotenusa vale</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√91.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia es la altura desde el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo recto. Iguala las dos fórmulas</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de área para obtener 8·3√3/√91.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>