<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Recorrido tras romper hilo en campo horizontal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="110.98387096774195" y1="105" x2="110.98387096774195" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="110.98,396.52 365.02,396.52 365.02,142.48 110.98,142.48 110.98,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">campo</text><polyline points="174.49,176.52 301.51,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">trayectoria</text><circle cx="174.49193548387098" cy="176.5177401676628" r="3.7" fill="#20364b"/><text x="181.49193548387098" y="168.5177401676628" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">inicio</text><circle cx="301.5080645161291" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="308.5080645161291" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">salida</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Equilibrio previo:qE=mg tan30°=mg/√3.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tras romper hilo, aceleración</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">constante (g/√3,−g). Parte del reposo,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así trayectoria recta a 30° de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Recorrido s=(a√3)/cos30°=2a.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>