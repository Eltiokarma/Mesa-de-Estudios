<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">095 · Normal sobre el bloque más liviano</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="363.74,279.43 362.30,297.74 358.01,315.61 350.98,332.58 341.38,348.25 329.45,362.22 315.48,374.15 299.81,383.75 282.84,390.79 264.97,395.07 246.65,396.52 228.34,395.07 210.47,390.79 193.50,383.75 177.83,374.15 163.86,362.22 151.93,348.25 142.33,332.58 135.30,315.61 131.01,297.74 129.57,279.43 131.01,261.11 135.30,243.24 142.33,226.27 151.93,210.60 163.86,196.63 177.83,184.70 193.50,175.10 210.47,168.07 228.34,163.78 246.65,162.34 264.97,163.78 282.84,168.07 299.81,175.10 315.48,184.70 329.45,196.63 341.38,210.60 350.98,226.27 358.01,243.24 362.30,261.11 363.74,279.43" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="146.03,203.18 149.09,199.29 152.31,195.52 155.68,191.89 159.18,188.38 162.82,185.02 166.59,181.81 170.49,178.74 174.50,175.83 178.62,173.08 182.84,170.49 187.17,168.07 191.58,165.82 196.08,163.75 200.66,161.85 205.31,160.14 210.02,158.61 214.79,157.26 219.61,156.11 224.47,155.14 229.36,154.36 234.28,153.78 239.22,153.39 244.18,153.20 249.13,153.20 254.08,153.39 259.02,153.78 263.94,154.36 268.84,155.14 273.70,156.10 278.51,157.26 283.28,158.61 288.00,160.14 292.65,161.85 297.22,163.74 301.72,165.82 306.14,168.07 310.46,170.49 314.69,173.07 318.81,175.83 322.82,178.74" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="246.65,279.43 152.98,209.17" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="246.65,279.43 316.91,185.76" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="246.65,279.43 246.65,148.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="117.86,190.85 152.47,190.85 152.47,225.46 117.86,225.46 117.86,190.85" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="312.33,151.14 346.94,151.14 346.94,185.76 312.33,185.76 312.33,151.14" fill="none" stroke="#008674" stroke-width="2.5"/><text x="112.25657767147196" y="185.24681621307133" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">750 N</text><text x="355.08901674316377" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 000 N</text><text x="262.94505139310877" y="237.682332406749" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea θ el ángulo entre el radio del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bloque pesado y la vertical. Para el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bloque ligero ese ángulo es 90°−θ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tensión común equilibra las</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes tangenciales. Así 750 cos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=1 000 sen θ y tan θ=3/4.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La normal sobre el bloque ligero</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilibra la componente radial de su</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">peso, 750 cos(90°−θ)=750 sen θ. Como</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen θ=3/5, calcula la magnitud.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>