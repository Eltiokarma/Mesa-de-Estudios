<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Incentro y ángulos inscritos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,223.83 231.47,186.39 375.10,345.91 203.34,345.91 100.90,223.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,223.83 375.10,345.91" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="231.47,186.39 203.34,345.91" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="223.83055932239236" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="231.46673654260047" y="186.39207507033112" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.0967741935484" y="345.909392390862" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="203.33952960875712" y="345.909392390862" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="116.36137781908283" y="219.3648709631878" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40°</text><text x="238.33702632599213" y="200.30441188169922" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">52°</text><text x="347.6156150599818" y="339.55437434122473" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">24°</text><text x="347.6156150599818" y="352.6079249296689" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">24°</text><text x="196.46923982536546" y="327.8748817094589" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En RDO, ∠RDO=80°. Si I es el incentro,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I pertenece a EO, ∠RDI=40° y ∠IRO=26°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠RDI=∠REI=40°, ambos ángulos ven</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el segmento RI con la misma apertura</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde el mismo lado. D,R,I,E son</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">concíclicos.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el mismo arco RE, ∠RDE=∠RIE. Este</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">último es exterior del triángulo RIO y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale 26°+24°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>