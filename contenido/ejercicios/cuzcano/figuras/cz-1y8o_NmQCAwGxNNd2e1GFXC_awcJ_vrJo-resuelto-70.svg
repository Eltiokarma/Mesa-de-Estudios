<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">070 · Ángulo entre dos trazos desde un vértice</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="133.98,372.43 133.98,153.43 352.97,153.43 352.97,372.43 133.98,372.43" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="133.98,262.93 352.97,153.43" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="133.98,372.43 352.97,262.93" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="133.98,153.43 243.47,372.43" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="177.78,241.03 352.97,372.43 221.58,328.63" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="116.45870411568407" y="389.9463292547275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="118.64863737486093" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="355.1614293659622" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="359.5412958843159" y="389.9463292547275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="116.45870411568407" y="271.6899332591769" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="243.47483314794212" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="355.1614293659622" y="251.98053392658508" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="182.15670189098995" y="230.08120133481646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="217.19563403781976" y="339.5778642936596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="317.9325639599555" y="357.09733036707456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma D=(0,0), U=(0,10), N=(10,10),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=(10,0). Entonces UO tiene ecuación</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=10−2x, mientras MN y DP tienen</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=5+x/2 e y=x/2.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las intersecciones son I=(2,6) y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R=(4,2). Desde A, las dos elevaciones</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto de AD tienen tangentes 3/4 y</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/3.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente de la diferencia es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(3/4−1/3)/(1+(3/4)(1/3))=1/3. Así</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=arctan(1/3).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>