<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Cinco declaraciones del pastel</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="126.27,180.12 349.73,180.12 349.73,142.48 126.27,142.48 126.27,180.12" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="126.27,238.92 349.73,238.92 349.73,201.29 126.27,201.29 126.27,238.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="126.27,297.73 349.73,297.73 349.73,260.09 126.27,260.09 126.27,297.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="126.27,356.53 349.73,356.53 349.73,318.90 126.27,318.90 126.27,356.53" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="136.21303763440858" y="153.30107526881721" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="136.21303763440858" y="212.10483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><text x="136.21303763440858" y="270.9086021505376" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="136.21303763440858" y="329.7123655913979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si comieron k personas, solo la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">afirmación k es verdadera.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto hay un solo inocente; los</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">otros cuatro son culpables y k=4.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La afirmación verdadera es la de</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Marlene: ella no probó el pastel.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>