<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Secantes de una parábola horizontal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="326.91825011047285" x2="421" y2="326.91825011047285" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="241.59,396.52 231.53,392.28 221.88,388.05 212.65,383.81 203.84,379.58 195.44,375.35 187.46,371.11 179.90,366.88 172.76,362.65 166.03,358.41 159.71,354.18 153.82,349.94 148.34,345.71 143.27,341.48 138.63,337.24 134.39,333.01 130.58,328.77 127.18,324.54 124.20,320.31 121.64,316.07 119.49,311.84 117.76,307.60 116.44,303.37 115.54,299.14 115.06,294.90 115.00,290.67 115.35,286.44 116.11,282.20 117.30,277.97 118.90,273.73 120.92,269.50 123.35,265.27 126.20,261.03 129.47,256.80 133.15,252.56 137.25,248.33 141.76,244.10 146.70,239.86 152.04,235.63 157.81,231.40 163.99,227.16 170.59,222.93 177.61,218.69 185.04,214.46 192.89,210.23 201.15,205.99 209.83,201.76 218.93,197.52 228.44,193.29 238.37,189.06 248.72,184.82 259.48,180.59 270.66,176.35 282.26,172.12 294.27,167.89 306.70,163.65 319.55,159.42 332.81,155.19 346.49,150.95 360.58,146.72 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Parábola</text><polyline points="100.90,292.12 104.65,289.80 108.41,287.48 112.16,285.16 115.91,282.84 119.66,280.52 123.41,278.20 127.16,275.88 130.92,273.56 134.67,271.24 138.42,268.92 142.17,266.60 145.92,264.28 149.67,261.96 153.43,259.64 157.18,257.32 160.93,255.00 164.68,252.68 168.43,250.36 172.18,248.04 175.93,245.72 179.69,243.40 183.44,241.08 187.19,238.76 190.94,236.44 194.69,234.12 198.44,231.80 202.20,229.48 205.95,227.16 209.70,224.84 213.45,222.52 217.20,220.20 220.95,217.88 224.71,215.56 228.46,213.24 232.21,210.92 235.96,208.60 239.71,206.28 243.46,203.96 247.21,201.64 250.97,199.32 254.72,197.00 258.47,194.68 262.22,192.36 265.97,190.04 269.72,187.72 273.48,185.40 277.23,183.08 280.98,180.76 284.73,178.44 288.48,176.12 292.23,173.80 295.99,171.48 299.74,169.16 303.49,166.84 307.24,164.52 310.99,162.20 314.74,159.88 318.49,157.56 322.25,155.24 326.00,152.92" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Recta k=1</text><circle cx="115.98171525953455" cy="282.79496292357453" r="3.7" fill="#20364b"/><text x="122.98171525953455" y="274.79496292357453" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Corte 1</text><circle cx="310.91949131455647" cy="162.24790053201542" r="3.7" fill="#20364b"/><text x="317.91949131455647" y="154.24790053201542" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Corte 2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye la recta en la parábola.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta k²x²−4x+1=0.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si k=0, queda una ecuación lineal con</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una sola intersección. Para k≠0 se</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">requieren dos raíces reales distintas.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Impón discriminante 16−4k²&gt;0 y elimina</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k=0. Cada raíz x da un único punto en</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la recta.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>