<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">386 · Exponencial con signo y un salto en cero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="371.1762870381445" x2="421" y2="371.1762870381445" stroke="#20364b" stroke-width="1.7"/><line x1="277.8022892819979" y1="105" x2="277.8022892819979" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 277.80,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">x&lt;0</text><polyline points="277.80,345.84 279.42,344.89 281.05,343.91 282.67,342.89 284.29,341.83 285.91,340.74 287.53,339.60 289.15,338.42 290.77,337.20 292.40,335.93 294.02,334.61 295.64,333.25 297.26,331.83 298.88,330.36 300.50,328.84 302.13,327.26 303.75,325.62 305.37,323.91 306.99,322.15 308.61,320.32 310.23,318.42 311.86,316.45 313.48,314.40 315.10,312.28 316.72,310.08 318.34,307.80 319.96,305.44 321.58,302.98 323.21,300.43 324.83,297.79 326.45,295.05 328.07,292.21 329.69,289.26 331.31,286.20 332.94,283.03 334.56,279.73 336.18,276.32 337.80,272.78 339.42,269.10 341.04,265.29 342.67,261.33 344.29,257.23 345.91,252.98 347.53,248.56 349.15,243.98 350.77,239.23 352.39,234.30 354.02,229.19 355.64,223.89 357.26,218.39 358.88,212.68 360.50,206.76 362.12,200.62 363.75,194.25 365.37,187.65 366.99,180.79 368.61,173.68 370.23,166.31 371.85,158.65 373.48,150.72 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">x&gt;0</text><circle cx="277.8022892819979" cy="396.51612903225805" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="284.8022892819979" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="277.8022892819979" cy="345.83644504403094" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="284.8022892819979" y="337.83644504403094" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x&lt;0, x/∣x∣=−1 y x+∣x∣=0. La rama es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=−1.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x&gt;0, el cociente es 1 y el</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exponente es 2x. La rama es y=e^(2x).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como se excluye 0, marca abiertos</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,−1) y (0,1). La rama derecha crece</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por encima de 1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>