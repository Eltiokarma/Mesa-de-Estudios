<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Sustitución por ley menor</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,311.91 111.61,241.22 158.74,241.22 169.45,311.91 100.90,311.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="195.16,311.91 205.87,241.22 252.99,241.22 263.71,311.91 195.16,311.91" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="306.55,311.91 317.26,241.22 364.39,241.22 375.10,311.91 306.55,311.91" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="271.42,274.64 297.55,274.64 288.55,268.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="297.55,274.64 288.55,280.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="135.17741935483872" y="227.085685483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Lingote restante</text><text x="135.17741935483872" y="278.0685483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">800 g</text><text x="135.17741935483872" y="296.4909274193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,908</text><text x="229.4314516129032" y="227.085685483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Reposición</text><text x="229.4314516129032" y="278.0685483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">200 g</text><text x="229.4314516129032" y="296.4909274193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,833</text><text x="340.8225806451612" y="227.085685483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Mezcla final</text><text x="340.8225806451612" y="278.0685483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1000 g</text><text x="340.8225806451612" y="296.4909274193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,893</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lingote inicial tiene 644 + 264 =</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">908 g de oro en 1000 g, ley 0,908.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada gramo reemplazado reduce el oro</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en 0,908 − 0,833 = 0,075 g.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para llegar a 893 g de oro hay que</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perder 15 g. Divide 15 entre 0,075.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>