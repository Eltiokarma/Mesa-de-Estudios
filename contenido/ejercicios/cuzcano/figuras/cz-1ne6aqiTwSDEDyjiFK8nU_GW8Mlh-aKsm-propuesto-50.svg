<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">050 · Rango de una expresión cuadrática en el módulo de la secante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="247.14,142.48 249.27,156.06 251.41,167.74 253.54,177.88 255.67,186.72 257.80,194.50 259.94,201.36 262.07,207.46 264.20,212.89 266.33,217.74 268.47,222.10 270.60,226.03 272.73,229.56 274.86,232.76 277.00,235.66 279.13,238.28 281.26,240.66 283.39,242.82 285.53,244.78 287.66,246.55 289.79,248.16 291.92,249.61 294.06,250.92 296.19,252.09 298.32,253.14 300.46,254.07 302.59,254.89 304.72,255.60 306.85,256.22 308.99,256.73 311.12,257.15 313.25,257.49 315.38,257.73 317.52,257.88 319.65,257.95 321.78,257.93 323.91,257.83 326.05,257.63 328.18,257.35 330.31,256.98 332.44,256.52 334.58,255.97 336.71,255.31 338.84,254.55 340.97,253.68 343.11,252.70 345.24,251.60 347.37,250.37 349.51,249.00 351.64,247.49 353.77,245.81 355.90,243.96 358.04,241.92 360.17,239.67 362.30,237.19 364.43,234.45 366.57,231.43 368.70,228.09 370.83,224.39 372.96,220.29 375.10,215.73" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el tramo dado, cos x es negativo y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">su módulo recorre [1/2,1]. El valor 1</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se alcanza en π y 1/2 en el extremo</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierdo.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto t=∣sec x∣ recorre [1,2]. La</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">expresión t²+2t+3 es creciente para</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t≥1.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Evalúa en t=1 y t=2 para obtener los</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos extremos incluidos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>