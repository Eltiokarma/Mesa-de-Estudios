<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Ángulo con la perpendicular común para dos orientaciones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="375.10,363.41 230.00,218.31 359.09,175.59" fill="#f4c581" fill-opacity="0.45"/><polyline points="230.00,363.41 375.10,363.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,261.04 230.00,218.31 359.09,175.59" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="230.00,363.41 230.00,218.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,363.41 359.09,175.59" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,363.41 100.90,261.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="229.99866884949853" y="363.41102236774435" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.0967741935484" y="363.41102236774435" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="229.99866884949853" y="218.3129170236945" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="359.09411189254547" y="175.58897763225565" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="100.90322580645162" y="261.03685641513334" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a la longitud común. La proyección</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de BC sobre el plano paralelo a las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos direcciones es DC−AB.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Según la orientación de los rayos AB y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DC, el ángulo entre ellos es 60° o</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">120°. Por ley de cosenos, esa</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyección mide a o a√3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La componente en dirección AD mide a.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las tangentes del ángulo buscado son 1</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y √3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>