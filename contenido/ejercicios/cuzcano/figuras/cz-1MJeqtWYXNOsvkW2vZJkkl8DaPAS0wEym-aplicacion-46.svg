<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">046 · Dos nudos con una cuerda vertical de soporte</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,233.07 195.78,287.84 290.66,233.07 366.56,233.07" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="290.66,233.07 290.66,180.32" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="195.78,287.84 195.78,341.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="182.18,341.61 209.38,341.61 209.38,358.68 182.18,358.68 182.18,341.61" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,211.94 100.90,263.17" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="366.56,211.94 366.56,263.17" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="274.21,180.32 307.10,180.32" fill="none" stroke="#008674" stroke-width="2.5"/><text x="111.33965844402277" y="253.68722327640734" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="279.58760278304874" y="226.80550284629982" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">120°</text><text x="298.24667931688805" y="200.87254901960785" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="375.0967741935484" y="233.44686907020872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="195.77988614800762" y="350.77767235926626" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el primer nudo, las componentes</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontales de ambas cuerdas deben</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cancelarse. Sus tensiones son iguales.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las componentes verticales suman 2T</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 30°=100 N. La cuerda entre nudos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene tensión 100 N.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el segundo nudo esa cuerda tira</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia abajo y aporta 100 sen 30°=50 N.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuerda horizontal no aporta</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente vertical.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>