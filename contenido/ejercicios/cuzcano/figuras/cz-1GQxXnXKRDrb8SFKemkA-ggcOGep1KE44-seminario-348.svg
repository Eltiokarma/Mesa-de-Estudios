f" font-size="11" fill="#d37618" text-anchor="start">x=1</text><circle cx="210.58064516129033" cy="220.2488479262673" r="3.7" fill="#20364b"/><text x="217.58064516129033" y="212.2488479262673" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2,0)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rango de f es (1,∞), pues eˣ&gt;0 y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recorre todos los positivos.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja en y=eˣ+1: y−1=eˣ y x=ln(y−1).</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La inversa es creciente, tiene</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">asíntota vertical en 1 y corta el eje</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal en 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>