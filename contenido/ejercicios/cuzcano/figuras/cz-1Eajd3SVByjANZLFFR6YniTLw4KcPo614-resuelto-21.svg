<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Perpendicularidad escondida en un triángulo isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,358.61 238.00,180.39 324.13,292.36 375.10,358.61 238.00,358.61 100.90,358.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,358.61 281.07,325.49 324.13,292.36" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,358.61 275.52,306.79 324.13,292.36" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,180.39 275.52,306.79 281.07,325.49" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="358.61290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="238.0" y="180.3870967741935" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.0967741935484" y="358.61290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="238.0" y="358.61290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="324.13143062717353" y="292.3579565895192" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="281.0657153135868" y="325.4854299076628" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="275.516009731939" y="306.7871911018034" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="285.524074248068" y="298.56138465019046" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="329.6153015949155" y="299.76118239597076" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea O el punto medio de IN. En PIN, D</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y O son puntos medios, así que DO∥PI.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En DRO, DH es altura porque DI⊥RN.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">También la recta OH es paralela a PN</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por el segmento medio de DIN y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a RD.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto H es el ortocentro de DRO.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">RH⊥DO∥PI, así que x es recto.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>