<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Rango de un radical en un intervalo agudo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="101.78,142.48 106.33,142.51 110.89,142.59 115.44,142.70 120.00,142.86 124.56,143.06 129.11,143.31 133.67,143.59 138.22,143.92 142.78,144.30 147.33,144.71 151.89,145.17 156.44,145.67 161.00,146.21 165.55,146.80 170.11,147.43 174.66,148.10 179.22,148.81 183.77,149.56 188.33,150.36 192.88,151.19 197.44,152.07 202.00,152.99 206.55,153.95 211.11,154.96 215.66,156.00 220.22,157.08 224.77,158.21 229.33,159.37 233.88,160.58 238.44,161.82 242.99,163.10 247.55,164.43 252.10,165.79 256.66,167.19 261.21,168.63 265.77,170.11 270.32,171.63 274.88,173.19 279.44,174.78 283.99,176.41 288.55,178.08 293.10,179.78 297.66,181.53 302.21,183.30 306.77,185.12 311.32,186.97 315.88,188.85 320.43,190.78 324.99,192.73 329.54,194.72 334.10,196.74 338.65,198.80 343.21,200.89 347.76,203.02 352.32,205.18 356.88,207.36 361.43,209.59 365.99,211.84 370.54,214.12 375.10,216.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe 1−sen x=[cos(x/2)−sen(x/2)]².</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 0&lt;x/2&lt;π/4, la diferencia dentro</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del cuadrado es positiva. La suma</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pedida se reduce a cos(x/2).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El coseno toma valores estrictamente</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre cos(π/4) y cos 0.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>