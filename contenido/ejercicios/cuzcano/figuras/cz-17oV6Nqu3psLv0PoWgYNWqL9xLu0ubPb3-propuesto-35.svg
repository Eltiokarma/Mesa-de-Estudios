<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Punto de una recta a distancia dada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="161.39,351.98 314.61,351.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="205.93,396.52 205.93,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="187.60,370.31 279.24,187.02 288.40,168.69" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="205.93,351.98 279.24,187.02" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="205.93,315.32 279.24,187.02" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="220.59,351.98 220.58,351.41 220.54,350.85 220.49,350.29 220.42,349.73 220.32,349.18 220.20,348.63 220.06,348.08 219.90,347.54 219.72,347.01 219.52,346.48 219.30,345.96 219.06,345.45 218.80,344.96 218.52,344.47 218.22,343.99 217.90,343.52 217.57,343.07 217.22,342.63 216.85,342.20 216.47,341.79 216.07,341.39 215.65,341.01 215.23,340.64 214.78,340.29 214.33,339.96 213.86,339.65 213.38,339.35 212.89,339.08 212.39,338.82 211.88,338.58" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="205.92521994134896" y="351.97800586510266" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="279.23900293255133" y="187.02199413489734" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="205.92521994134896" y="315.32111436950146" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="314.61290322580646" y="357.0183284457478" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="212.9816715542522" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="220.03812316715542" y="340.06451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe P=(x,2x+1). La distancia al</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrado da x²+(2x−1)²=65.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resuelve 5x²−4x−64=0. Las raíces son 4</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y −16/5, y el primer cuadrante fija</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces y=9 y cot θ=x/y.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>