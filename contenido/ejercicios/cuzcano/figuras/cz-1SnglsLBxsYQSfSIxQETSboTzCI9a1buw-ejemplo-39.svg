<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">039 · Séptimas potencias mediante recurrencia</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="54.285714285714285" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="75.14285714285714" y="161.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">j</text><rect x="102.28571428571428" y="130" width="54.285714285714285" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="129.42857142857142" y="161.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">2</text><rect x="156.57142857142856" y="130" width="54.285714285714285" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="183.7142857142857" y="161.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">3</text><rect x="210.85714285714286" y="130" width="54.285714285714285" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="238.0" y="161.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">4</text><rect x="265.1428571428571" y="130" width="54.285714285714285" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="292.2857142857143" y="161.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">5</text><rect x="319.42857142857144" y="130" width="54.285714285714285" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="346.5714285714286" y="161.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">6</text><rect x="373.7142857142857" y="130" width="54.285714285714285" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="400.8571428571429" y="161.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">7</text><rect x="48.0" y="178" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="75.14285714285714" y="209.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">S_j</text><rect x="102.28571428571428" y="178" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="129.42857142857142" y="209.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">0</text><rect x="156.57142857142856" y="178" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="183.7142857142857" y="209.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">−4</text><rect x="210.85714285714286" y="178" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="209.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">−8</text><rect x="265.1428571428571" y="178" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="292.2857142857143" y="209.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">−8</text><rect x="319.42857142857144" y="178" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="346.5714285714286" y="209.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">0</text><rect x="373.7142857142857" y="178" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="400.8571428571429" y="209.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">16</text><text x="48" y="253" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Cálculos de la resolución</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada raíz r cumple r²=2r−2. Al</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplicar por r^(j−2) y sumar, se</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene S_j=2S_(j−1)−2S_(j−2).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se inicia con S₀=2 y S₁=2. Los valores</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">S₂ a S₆ son 0, −4, −8, −8, 0.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces S₇=2·0−2·(−8)=16.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>