<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">043 · Celdas cruzadas por diagonal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,379.18 100.90,159.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="155.74,379.18 155.74,159.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="210.58,379.18 210.58,159.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="265.42,379.18 265.42,159.82" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="320.26,379.18 320.26,159.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,379.18 375.10,159.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,379.18 375.10,379.18" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,324.34 375.10,324.34" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,214.66 375.10,214.66" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,159.82 375.10,159.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,379.18 375.10,159.82" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diagonal empieza en una celda; cada</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cruce de línea interior entra a otra.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Serían n+(n+1)−1; hay que descontar</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los vértices interiores comunes. Como</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">gcd(n,n+1)=1,no hay tales vértices.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Celdas=n+(n+1)−1=2n.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>