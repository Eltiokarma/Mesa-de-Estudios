<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">080 · Contrapeso del brazo de un tocadiscos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="104.48,270.30 375.10,270.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="277.99,290.19 287.55,270.30 297.10,290.19 277.99,290.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="104.48,305.71 104.48,270.30" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="108.07,277.86 104.48,270.30 100.90,277.86" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="207.95,232.89 207.95,270.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="204.37,262.73 207.95,270.30 211.54,262.73" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="340.08,232.89 340.08,270.30" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="336.49,262.73 340.08,270.30 343.66,262.73" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="104.48485415983896" y="315.2652511821714" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Fₙ</text><text x="207.95411770213963" y="224.13270752376047" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60 g</text><text x="340.07640807153894" y="223.73474881782855" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100 g</text><text x="287.5458588885248" y="261.54082588136146" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="156.21948593098926" y="282.63263729575357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">13 cm</text><text x="247.74998829533217" y="282.63263729575357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 cm</text><text x="314.20909218596375" y="282.2346785898216" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro de gravedad del brazo queda</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">23−13=10 cm a la izquierda de O. El</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">peso del brazo es 0,588 N y el del</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contrapeso 0,98 N.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La normal de la aguja y el contrapeso</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">producen momentos horarios. El peso</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del brazo produce momento antihorario.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En N·cm, iguala 0,588×10 a</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,0098×23+0,98x. Despeja x.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>