2.5"/><polyline points="285.95,396.52 285.95,204.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="281.96,214.41 285.95,204.71 289.95,214.41" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="300.79449075752086" y="318.3084450888003" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 m</text><text x="325.34142805364263" y="202.99492569771655" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B = 4/π T</text><text x="212.31134469010513" y="329.1547662196448" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La base del cono tiene área 4π m² y su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal exterior apunta hacia abajo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la base el flujo es entrante y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale −(4/π)(4π)=−16 Wb.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El flujo lateral lo compensa porque el</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">flujo total a través del cono cerrado</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es cero.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>