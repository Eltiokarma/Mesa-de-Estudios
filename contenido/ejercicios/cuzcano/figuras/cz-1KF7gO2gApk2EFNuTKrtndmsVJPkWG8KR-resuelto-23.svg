<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">023 · Ángulo inscrito a partir de dos ángulos exteriores</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="352.25,269.50 351.90,278.46 350.84,287.37 349.09,296.17 346.66,304.80 343.55,313.22 339.80,321.37 335.41,329.19 330.43,336.65 324.87,343.70 318.79,350.29 312.20,356.37 305.15,361.93 297.69,366.91 289.87,371.30 281.72,375.05 273.30,378.16 264.67,380.59 255.87,382.34 246.96,383.40 238.00,383.75 229.04,383.40 220.13,382.34 211.33,380.59 202.70,378.16 194.28,375.05 186.13,371.30 178.31,366.91 170.85,361.93 163.80,356.37 157.21,350.29 151.13,343.70 145.57,336.65 140.59,329.19 136.20,321.37 132.45,313.22 129.34,304.80 126.91,296.17 125.16,287.37 124.10,278.46 123.75,269.50 124.10,260.54 125.16,251.63 126.91,242.83 129.34,234.20 132.45,225.78 136.20,217.63 140.59,209.81 145.57,202.35 151.13,195.30 157.21,188.71 163.80,182.63 170.85,177.07 178.31,172.09 186.13,167.70 194.28,163.95 202.70,160.84 211.33,158.41 220.13,156.66 229.04,155.60 238.00,155.25 246.96,155.60 255.87,156.66 264.67,158.41 273.30,160.84 281.72,163.95 289.87,167.70 297.69,172.09 305.15,177.07 312.20,182.63 318.79,188.71 324.87,195.30 330.43,202.35 335.41,209.81 339.80,217.63 343.55,225.78 346.66,234.20 349.09,242.83 350.84,251.63 351.90,260.54 352.25,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="123.75,269.50 184.68,168.58 238.00,383.75 291.32,168.58 352.25,269.50 238.00,383.75 123.75,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="123.75,269.50 100.90,246.65" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="352.25,269.50 375.10,246.65" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="114.2320788530466" y="247.79301075268816" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="361.7679211469534" y="247.79301075268816" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="238.0" y="353.28136200716847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada ángulo exterior lateral es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suplementario del ángulo inscrito</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interior correspondiente. Así mide la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mitad del arco entre los extremos de</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sus cuerdas que sí contiene al vértice</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos arcos así medidos y el arco</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superior que subtiende α recorren toda</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la circunferencia.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto 2x+2y+2α=360°. Despeja α.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>