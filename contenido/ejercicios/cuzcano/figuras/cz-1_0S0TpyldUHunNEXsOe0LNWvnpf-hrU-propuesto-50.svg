<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">050 · Bloque que flota en dos orientaciones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="135.72,239.25 207.53,239.25 207.53,278.42 135.72,278.42 135.72,239.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="289.36,217.49 329.40,217.49 329.40,317.59 289.36,317.59 289.36,217.49" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,258.84 231.47,258.84" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="257.59,267.54 375.10,267.54" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="172.715821812596" y="230.54710701484896" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a vertical</text><text x="309.8125960061444" y="208.3504864311316" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b vertical</text><text x="172.715821812596" y="289.30286738351253" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,10 m sumergidos</text><text x="308.942140296979" y="330.64951356886843" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,50 m sumergidos</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La mitad del volumen se sumerge porque</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la densidad del bloque es la mitad de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la del agua.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En cada orientación la fracción de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura sumergida también es un medio.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así a = 0,2 m y b = 1 m.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El volumen es 0,2×1×0,3 = 0,06 m³.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica por 500 kg/m³.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>