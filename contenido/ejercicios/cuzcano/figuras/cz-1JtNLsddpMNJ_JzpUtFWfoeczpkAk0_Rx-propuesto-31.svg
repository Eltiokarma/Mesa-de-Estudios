<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Imagen de un segmento paralelo al eje</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="287.88,206.77 286.44,208.79 285.06,210.82 283.72,212.84 282.43,214.86 281.19,216.89 279.99,218.91 278.84,220.93 277.74,222.96 276.68,224.98 275.67,227.01 274.71,229.03 273.79,231.05 272.92,233.08 272.10,235.10 271.33,237.12 270.60,239.15 269.92,241.17 269.29,243.19 268.70,245.22 268.16,247.24 267.67,249.26 267.22,251.29 266.82,253.31 266.47,255.34 266.16,257.36 265.91,259.38 265.69,261.41 265.53,263.43 265.41,265.45 265.34,267.48 265.32,269.50 265.34,271.52 265.41,273.55 265.53,275.57 265.69,277.59 265.91,279.62 266.16,281.64 266.47,283.66 266.82,285.69 267.22,287.71 267.67,289.74 268.16,291.76 268.70,293.78 269.29,295.81 269.92,297.83 270.60,299.85 271.33,301.88 272.10,303.90 272.92,305.92 273.79,307.95 274.71,309.97 275.67,311.99 276.68,314.02 277.74,316.04 278.84,318.07 279.99,320.09 281.19,322.11 282.43,324.14 283.72,326.16 285.06,328.18 286.44,330.21 287.88,332.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="176.79,242.18 268.86,242.18" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="269.37,242.18 316.92,257.86" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="316.92,257.86 348.28,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="269.8712058088323" y="278.10016664682774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="176.28115700511842" y="233.07576478990595" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="259.7533626949173" y="234.08754910129747" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="348.28448994167366" y="280.6296274253065" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="302.7541959290561" y="241.170039281038" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">imagen</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea f la magnitud de la focal y h la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura del segmento. Para un punto a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia p, la imagen virtual está a</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia u=fp/(p+f) detrás del espejo</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y su altura es hf/(p+f).</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al eliminar p, la altura queda</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h(1−u/f). Disminuye linealmente al</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">avanzar hacia el foco virtual.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El extremo cercano al espejo conserva</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">casi toda su altura. El más alejado</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aparece más bajo y más cerca del foco,</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sin alcanzarlo para p finito.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>