<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">487 · Fotografiar torre mediante espejo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">distancia cámara–espejo (m)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">altura necesaria (m)</text><polyline points="107.76,389.31 112.21,384.66 116.67,380.03 121.12,375.41 125.58,370.82 130.04,366.25 134.49,361.69 138.95,357.16 143.40,352.65 147.86,348.16 152.31,343.68 156.77,339.23 161.23,334.79 165.68,330.38 170.14,325.98 174.59,321.61 179.05,317.25 183.50,312.91 187.96,308.59 192.42,304.28 196.87,300.00 201.33,295.73 205.78,291.49 210.24,287.26 214.69,283.05 219.15,278.85 223.60,274.68 228.06,270.52 232.52,266.38 236.97,262.25 241.43,258.15 245.88,254.06 250.34,249.99 254.79,245.93 259.25,241.89 263.71,237.87 268.16,233.87 272.62,229.88 277.07,225.91 281.53,221.95 285.98,218.01 290.44,214.09 294.90,210.18 299.35,206.29 303.81,202.42 308.26,198.56 312.72,194.71 317.17,190.88 321.63,187.07 326.08,183.27 330.54,179.49 335.00,175.72 339.45,171.97 343.91,168.23 348.36,164.51 352.82,160.80 357.27,157.11 361.73,153.43 366.19,149.77 370.64,146.12 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">campo visual</text><circle cx="237.99999999999997" cy="261.3054110301769" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="253.3054110301769" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">ajuste</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La imagen de torre está detrás del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">espejo a distancia x+58.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde la cámara, la separación hasta</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">imagen virtual es2x+58. La altura</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interceptada en espejo es31x/(2x+58).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Igualar a 1 m:31x=2x+58, por lo que</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=2 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>