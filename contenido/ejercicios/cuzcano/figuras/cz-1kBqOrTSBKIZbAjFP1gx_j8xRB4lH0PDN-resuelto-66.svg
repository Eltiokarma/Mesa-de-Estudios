<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">066 · Instante de un corte espectral</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,375.92 375.10,375.92" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="119.49,394.51 119.49,143.56" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="119.49,282.98 365.80,159.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="119.49,190.03 305.39,190.03 305.39,375.92" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="102.7621651175506" y="282.9773100054674" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50</text><text x="100.90322580645163" y="190.0303444505194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100</text><text x="305.38655002733736" y="392.6547293603062" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20</text><text x="363.0136686714051" y="395.4431383269546" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t (s)</text><text x="149.2356478950246" y="153.7810278840896" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V (kV)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Convierte a 0,01554 nm. El fotón</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">límite tiene energía hc/λ ≈ 80 keV,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivalente a 80 kV.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta de tensión tiene pendiente</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(100 − 50)/20 = 2,5 kV/s.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resuelve 50 + 2,5t ≈ 80. El tiempo es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">unos 12 s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>