<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">092 · Ángulo límite de vuelco sobre una arista</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="130.82,215.41 280.38,215.41 280.38,364.97 130.82,364.97 130.82,215.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="180.67,174.53 330.23,174.53 330.23,324.09 180.67,324.09 180.67,174.53" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="130.82,215.41 180.67,174.53" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="280.38,215.41 330.23,174.53" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="280.38,364.97 330.23,324.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,364.97 375.10,364.97" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="280.38,364.97 330.23,174.53" fill="none" stroke="#008674" stroke-width="2.5"/><text x="130.81524926686217" y="375.93695014662757" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="280.37536656891496" y="375.93695014662757" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="346.1818181818182" y="250.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 cm</text><text x="149.75953079178885" y="185.49706744868038" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 cm</text><text x="255.94721407624633" y="163.06304985337243" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Mira la sección perpendicular a AB. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">centro de gravedad está a 2,5 cm</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontalmente de la arista y a 5 cm</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre ella.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El límite llega cuando la línea</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical que pasa por el centro de</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">gravedad pasa también por AB.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La inclinación crítica cumple tan</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=2,5/5=1/2. Para regresar</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">espontáneamente, la inclinación debe</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ser menor.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>