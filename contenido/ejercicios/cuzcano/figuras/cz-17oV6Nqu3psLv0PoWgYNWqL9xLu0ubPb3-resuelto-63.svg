<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">063 · Cosecante al cuadrado desde una pendiente perpendicular</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="168.76,376.92 168.76,162.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="129.19,190.37 168.76,269.50 188.54,309.07 208.33,348.63" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="188.54,309.07 267.67,269.50 346.81,229.93" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="284.69,269.50 284.69,269.24 284.68,268.97 284.67,268.71 284.66,268.45 284.64,268.19 284.61,267.92 284.59,267.66 284.56,267.40 284.52,267.14 284.49,266.88 284.44,266.62 284.40,266.36 284.35,266.10 284.29,265.85 284.23,265.59 284.17,265.34 284.10,265.08 284.03,264.83 283.96,264.58 283.88,264.32 283.80,264.07 283.71,263.83 283.62,263.58 283.53,263.33 283.43,263.09 283.33,262.85 283.23,262.60 283.12,262.37 283.01,262.13 282.89,261.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="168.75920495275335" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="129.19303635432667" y="190.36766280314666" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="188.54228925196668" y="309.06616859842666" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="208.32537355117998" y="348.6323371968533" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="346.80696364567336" y="229.93383140157334" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="267.67462644882" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="375.0967741935484" y="274.9403481822836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="176.37569240795045" y="162.07785225527158" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="288.24903412000185" y="260.7954429083461" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AQ tiene pendiente −2. Su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular tiene pendiente 1/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así cot θ=2 y csc² θ=1+cot² θ=5.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia es 5−2=3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>