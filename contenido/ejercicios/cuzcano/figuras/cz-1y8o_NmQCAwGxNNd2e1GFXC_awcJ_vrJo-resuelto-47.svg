<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">047 · Distancia desde la mediatriz de un lado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.69,381.53 107.69,156.43 323.39,156.43 366.74,272.37 107.69,381.53" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.69,156.43 221.03,326.17 323.39,156.43" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="221.03,156.43 221.03,326.17" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="221.03,165.31 212.15,165.31 212.15,156.43" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="107.69,165.83 117.09,165.83 117.09,156.43" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="391.97311827956986" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="102.47004608294931" y="147.54915514592938" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="328.0921658986175" y="147.02688172043014" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="273.9393241167435" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="219.9815668202765" y="337.65668202764977" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="221.5483870967742" y="147.54915514592938" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="132.23963133640552" y="353.84715821812597" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">75°</text><text x="261.76344086021504" y="233.20199692780338" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="230.42703533026113" y="235.2910906298003" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea s=AB=BC. Desde A toma el eje</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical hacia B y el horizontal hacia</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C. Entonces B=(0,s), C=(s,s) y M tiene</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abscisa s/2 por la mediatriz.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AD forma 15° con la horizontal. La</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura de M es (s/2)tan 15°. Su</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia a BC es s−(s/2)tan</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15°=s√3/2.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El desplazamiento horizontal de M a C</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es s/2. Por Pitágoras MC=s=8 y la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia pedida es 4√3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>