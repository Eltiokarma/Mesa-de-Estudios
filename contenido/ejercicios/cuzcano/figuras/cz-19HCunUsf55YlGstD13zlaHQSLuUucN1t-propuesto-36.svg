<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Diferencia de cuadrados de dos tangentes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,383.75 100.90,155.25 375.10,155.25 375.10,383.75 100.90,383.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,383.75 300.89,167.71" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,383.75 368.22,192.70" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="329.40,194.10 329.40,155.25" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.24,194.10 368.05,197.90 367.50,201.67 366.57,205.37 365.29,208.96 363.66,212.41 361.70,215.68 359.42,218.74 356.86,221.56 354.04,224.12 350.98,226.39 347.71,228.35 344.26,229.98 340.67,231.27 336.98,232.19 333.21,232.75 329.40,232.94 325.59,232.75 321.82,232.19 318.12,231.27 314.53,229.98 311.09,228.35 307.82,226.39 304.76,224.12 301.93,221.56 299.37,218.74 297.10,215.68 295.14,212.41 293.51,208.96 292.23,205.37 291.30,201.67 290.74,197.90 290.55,194.10 290.74,190.29 291.30,186.52 292.23,182.82 293.51,179.23 295.14,175.79 297.10,172.52 299.37,169.45 301.93,166.63 304.76,164.07 307.82,161.80 311.09,159.84 314.53,158.21 318.12,156.93 321.82,156.00 325.59,155.44 329.40,155.25 333.21,155.44 336.98,156.00 340.67,156.93 344.26,158.21 347.71,159.84 350.98,161.80 354.04,164.07 356.86,166.63 359.42,169.45 361.70,172.52 363.66,175.79 365.29,179.23 366.57,182.82 367.50,186.52 368.05,190.29 368.24,194.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="383.747311827957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="155.252688172043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="155.252688172043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="383.747311827957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="329.39784946236557" y="194.09677419354836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="329.39784946236557" y="155.252688172043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="300.8925555542327" y="167.70906421225078" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="368.2167724684435" y="192.69883446154876" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por potencia, AP²−DQ²=AO²−DO², pues se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cancela el cuadrado del mismo radio.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro O está sobre la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a BC trazada por T. Sus</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desplazamientos horizontales desde A y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D son 5 y 1, y tiene la misma altura</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto a ambos.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta los cuadrados de las distancias.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Queda 5²−1²=24.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>