<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">099 · Distancia al ortocentro en un triángulo 13–14–15</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="102.26,375.19 199.22,142.48 373.74,375.19 102.26,375.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="199.22,142.48 199.22,302.47 199.22,375.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="102.26,375.19 199.22,302.47" fill="none" stroke="#008674" stroke-width="2.5"/><text x="102.25757202659443" y="375.1851760650086" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="199.21644915045556" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="373.74242797340554" y="375.1851760650086" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="199.21644915045556" y="302.4660182221128" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="199.21644915045556" y="375.1851760650086" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="133.28441270623" y="239.44274809160302" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">13</text><text x="301.9928589017483" y="239.44274809160302" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15</text><text x="296.17532627431666" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">14</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma A=(0,0) y C=(14,0). Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancias a A y C dan B=(5,12), tras</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">restar sus cuadrados y escoger el</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semiplano superior.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura desde B tiene x=5. Como BC</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene pendiente −4/3, la altura desde</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A tiene pendiente 3/4.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ortocentro tiene y=15/4. La</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia vertical desde B es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">12−15/4=33/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>