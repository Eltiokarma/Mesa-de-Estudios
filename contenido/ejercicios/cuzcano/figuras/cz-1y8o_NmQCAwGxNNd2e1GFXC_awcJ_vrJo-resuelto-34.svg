<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Segmento entre puntos medios con un lado lateral dado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.23,381.17 201.24,267.42 327.01,267.42 366.77,381.17 109.23,381.17" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.23,381.17 327.01,267.42" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="201.24,267.42 366.77,381.17" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="218.35,324.29 284.01,324.29" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="201.24,267.42 289.09,158.76 327.01,267.42" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645159" y="387.639041505739" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="197.0790404177773" y="260.02113365609534" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="332.55747157700057" y="260.9459011042811" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="375.09677419354847" y="386.25189033346027" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="289.5557852363597" y="151.360958494261" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="135.58200511342" y="367.7565413697438" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="338.5684599902084" y="369.60607626611545" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°−θ</text><text x="248.86601751618346" y="317.3567154436164" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prolonga los lados laterales hasta R.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo del vértice R es 90°−θ,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igual al del extremo O de la base. Si</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D es el otro extremo, el triángulo da</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DO=DR.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por semejanza, la diferencia de las</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bases es el tramo DI sobre el lado que</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">parte de D. Por el teorema de puntos</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medios, x=DI/2.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las longitudes laterales están en</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">razón DI:LO=sen(90°−θ):sen 2θ=1:2sen</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ. Por tanto DI=16/máx(1,2sen θ) y x</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se obtiene dividiendo por dos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>