<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Diferencia entre la interfaz y el fondo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="122.00,204.91 122.00,373.64 375.10,373.64 375.10,204.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="122.00,220.73 375.10,220.73" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="122.00,297.71 375.10,297.71" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="248.55,165.36 248.55,220.73" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="340.2952853598015" y="260.27233250620344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Aceite</text><text x="340.2952853598015" y="342.0031017369727" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="261.7282878411911" y="181.17803970223324" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">50 N</text><text x="222.18114143920596" y="308.2562034739454" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="227.454094292804" y="362.0403225806452" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="335.6755583126551" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La carga del émbolo y la columna de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aceite fijan la presión en B.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al bajar de B a A solo se atraviesan</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,10 m de agua. La diferencia es ρagua</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">g(0,10 m).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con ρagua = 1000 kg/m³, multiplica</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para hallar el incremento.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>