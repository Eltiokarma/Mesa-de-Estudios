<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">060 · Mascotas bebidas y juegos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="126.27,180.12 349.73,180.12 349.73,142.48 126.27,142.48 126.27,180.12" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="126.27,238.92 349.73,238.92 349.73,201.29 126.27,201.29 126.27,238.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="126.27,297.73 349.73,297.73 349.73,260.09 126.27,260.09 126.27,297.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="126.27,356.53 349.73,356.53 349.73,318.90 126.27,318.90 126.27,356.53" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="136.21303763440858" y="153.30107526881721" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">loro/té/sapo</text><text x="136.21303763440858" y="212.10483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">gato/café/ajedrez</text><text x="136.21303763440858" y="270.9086021505376" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">perro/anís/dominó</text><text x="136.21303763440858" y="329.7123655913979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">canario/leche/damas</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Té no puede corresponder a ajedrez ni</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">damas; dominó ya es Alejandro: Pedro</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">juega sapo y tiene loro.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Alejandro no juega ajedrez y Jaime</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tampoco: Luis juega ajedrez y toma</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">café.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Luis no perro(anís),ni loro(Pedro),ni</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">canario(dato): tiene gato.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>