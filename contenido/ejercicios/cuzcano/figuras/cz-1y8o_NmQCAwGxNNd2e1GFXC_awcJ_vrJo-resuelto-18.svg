<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Ángulo de un segmento hacia dos puntos medios</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.06,343.30 108.06,197.49 367.05,197.49 367.05,343.30 108.06,343.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="108.06,197.49 367.05,270.39" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="108.06,343.30 237.78,234.16" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="177.84,212.69 175.60,219.85" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="304.87,248.92 302.63,256.08" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="363.91,233.27 370.62,233.27" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="363.47,305.73 370.62,305.73" fill="none" stroke="#008674" stroke-width="2.5"/><text x="101.79782139662154" y="349.11900752512764" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="100.90322580645156" y="189.8809924748724" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="375.0967741935484" y="191.67018365521233" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="373.7548808082935" y="348.67170973004266" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="374.64947639846343" y="269.947297795085" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="239.11824448771245" y="223.87562490133135" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="158.60464137241485" y="204.64181971267695" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">18,5°</text><text x="127.29379571646578" y="337.489264852918" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si W y H son ancho y alto, entonces</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan 18,5°=(H/2)/W.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con origen en L, el punto R tiene</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coordenadas (W/2,3H/4) al promediar I</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y P.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto tan x=(3H/4)/(W/2)=3 tan</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">18,5°. Usa el arco tangente agudo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>