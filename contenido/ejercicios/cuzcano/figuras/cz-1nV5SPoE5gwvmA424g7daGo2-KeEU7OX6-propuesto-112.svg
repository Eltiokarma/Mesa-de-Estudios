<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">112 · Fusión y ebullición desde una curva</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">Q (cal)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">T (°C)</text><polyline points="100.90,396.52 140.71,311.84 229.16,311.84 335.29,142.48 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">proceso</text><circle cx="140.70551508844954" cy="311.8387096774194" r="3.7" fill="#20364b"/><text x="147.70551508844954" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4,5;150</text><circle cx="229.15504682622267" cy="311.8387096774194" r="3.7" fill="#20364b"/><text x="236.15504682622267" y="303.8387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">14,5;150</text><circle cx="335.29448491155046" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="342.29448491155046" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">26,5;Tv=450</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El sólido alcanza 150°C con 4,5 cal:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m=4,5/(0,6·150)=0,05 g.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Meseta de fusión:</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Lf=(14,5−4,5)/0,05=200 cal/g.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calentar el líquido requiere 12 cal:</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tv=150+12/(0,05·0,8)=450°C.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>