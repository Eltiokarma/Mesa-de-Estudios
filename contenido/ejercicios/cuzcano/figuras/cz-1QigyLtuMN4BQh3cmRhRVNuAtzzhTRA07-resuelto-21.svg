31,396.24 254.58,395.43 262.78,394.08 270.87,392.19 278.83,389.78 286.61,386.85 294.18,383.42 301.51,379.50 308.57,375.11 315.32,370.27 321.75,365.00 327.81,359.31 333.50,353.25 338.77,346.82 343.61,340.07 348.00,333.01 351.92,325.68 355.35,318.11 358.28,310.33 360.69,302.37 362.58,294.28 363.93,286.08 364.74,277.81 365.02,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="110.98387096774194" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="148.1860338412248" y="179.68603384122483" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="238.0" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="327.8139661587752" y="179.68603384122483" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="365.01612903225805" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="327.8139661587752" y="359.3139661587752" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="238.0" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="148.1860338412248" y="359.3139661587752" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="197.71590904415524" y="305.42558646351006" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">AF</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las diagonales AF y AD abarcan tres</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pasos cortos y tienen igual longitud.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea R el radio. Entonces AD=2R sen</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">67.5° y AH=2R sen 22.5°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como sen 67.5°=cos 22.5°, el cociente</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(AH+AD)/AD es 1+tan 22.5°=√2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide la suma dada por √2 para</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtener la diagonal.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>