<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">043 · Distancias del punto medio a dos pies de proyección</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.90,282.69 184.04,207.55 365.50,281.89 108.90,282.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="184.04,207.55 144.87,301.08 108.90,282.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="184.04,207.55 331.13,325.86 365.50,281.89" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="144.87,301.08 236.00,282.69 331.13,325.86" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645167" y="286.68705915545945" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="184.8400263331139" y="200.3520643280354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935483" y="285.0882629549516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="147.2683156211794" y="313.06719646383897" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="331.12987867958236" y="338.6479356719646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="236.00150474936518" y="294.68104015799867" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="196.03159973666888" y="299.47742875952224" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6 cm</text><text x="277.57020596256933" y="315.4653907646008" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">MQ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma B como origen y u, v unitarios</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre las rectas, relacionados por</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reflexión en la bisectriz. Entonces</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P=(A·u)u y Q=(C·v)v.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 2M=A+C, se tiene</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MP²=∣M∣²−(A·u)(C·u) y</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MQ²=∣M∣²−(A·v)(C·v).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La reflexión intercambia las</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">direcciones unitarias de A y C y las</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de u y v. Los dos productos son</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iguales. Por tanto MQ=MP.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>