<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">060 · Intervalo de seno negativo y una raíz aislada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Intervalo cerrado y punto aislado</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="159.23076923076923" y1="275" x2="159.23076923076923" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="159.23076923076923" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="159.23076923076923" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><line x1="266.9230769230769" y1="275" x2="374.6153846153846" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="266.9230769230769" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="374.6153846153846" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="159.23076923076923" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/2</text><text x="266.9230769230769" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">7π/6</text><text x="374.6153846153846" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">11π/6</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con s=sen x, la expresión queda</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2s²−s−1=(2s+1)(s−1).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El producto es no negativo para s≤−1/2</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">o s≥1. Como s≤1, la segunda rama solo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da s=1.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la vuelta dada, la primera rama</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corresponde a [7π/6,11π/6]. La segunda</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da el punto aislado π/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>