<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Extremo de un diámetro por perpendicularidad</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="338.0483870967742" x2="421" y2="338.0483870967742" stroke="#20364b" stroke-width="1.7"/><line x1="210.58064516129033" y1="105" x2="210.58064516129033" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="375.10,338.05 374.83,329.44 374.02,320.87 372.67,312.36 370.79,303.95 368.39,295.68 365.47,287.58 362.05,279.68 358.14,272.00 353.75,264.59 348.91,257.46 343.63,250.66 337.94,244.20 331.85,238.11 325.39,232.41 318.58,227.13 311.46,222.29 304.05,217.91 296.37,214.00 288.47,210.58 280.37,207.66 272.09,205.26 263.69,203.38 255.18,202.03 246.61,201.22 238.00,200.95 229.39,201.22 220.82,202.03 212.31,203.38 203.91,205.26 195.63,207.66 187.53,210.58 179.63,214.00 171.95,217.91 164.54,222.29 157.42,227.13 150.61,232.41 144.15,238.11 138.06,244.20 132.37,250.66 127.09,257.46 122.25,264.59 117.86,272.00 113.95,279.68 110.53,287.58 107.61,295.68 105.21,303.95 103.33,312.36 101.98,320.87 101.17,329.44 100.90,338.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Semicírculo</text><polyline points="100.90,338.05 320.26,228.37 375.10,338.05 100.90,338.05" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Triángulo</text><circle cx="100.90322580645162" cy="338.0483870967742" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="330.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="375.09677419354836" cy="338.0483870967742" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="330.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="320.258064516129" cy="228.3709677419355" r="3.7" fill="#20364b"/><text x="327.258064516129" y="220.3709677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe B=(b,0). Por Tales, CA y CB</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son perpendiculares.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus vectores son (−6,−3) y (b−3,−3).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El producto escalar es −6(b−3)+9.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al anularlo se obtiene b=9/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>