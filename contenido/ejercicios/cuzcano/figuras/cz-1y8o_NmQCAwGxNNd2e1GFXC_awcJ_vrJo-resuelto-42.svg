<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Perímetro a partir de una diagonal y una hipotenusa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.34,348.17 107.34,190.83 267.90,190.83 267.90,348.17 107.34,348.17" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.34,348.17 267.90,190.83 367.28,348.17 267.90,348.17" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="267.90,340.81 275.26,340.81 275.26,348.17" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645163" y="356.91069495561806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="101.82333838493182" y="182.08930504438194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="268.3637150898463" y="181.16919246590174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="266.98354622212605" y="357.83080753409826" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.0967741935484" y="354.1503572201775" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="306.08833080753413" y="268.5798874215198" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">25</text><text x="265.6033773544058" y="229.47510283611172" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">82°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC biseca el ángulo recto en C. Por</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tanto ∠DCE=82°−45°=37°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como CD⊥DE, el lado del cuadrado es el</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cateto adyacente a 37° en el triángulo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CDE. Vale 25 cos 37°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica por cuatro para obtener el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perímetro.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>