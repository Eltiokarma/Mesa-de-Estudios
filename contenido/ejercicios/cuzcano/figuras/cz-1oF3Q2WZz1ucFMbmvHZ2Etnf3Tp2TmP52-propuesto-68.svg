<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">068 · Suma de dos ángulos a partir de una vertical</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,200.49 375.10,200.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,352.82 375.10,352.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="131.37,261.43 341.58,148.70" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="131.37,316.27 253.23,218.77" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="181.03,276.66 181.03,337.59 362.91,238.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="283.70,395.48 375.10,322.36" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="108.51971326164876" y="191.3548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="108.82437275985664" y="344.59856630824373" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">W</text><text x="333.9677419354838" y="143.52329749103944" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="255.06093189964156" y="214.8136200716846" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="359.8637992831541" y="230.35125448028674" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="371.44086021505365" y="313.21863799283153" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="227.336917562724" y="189.52688172043008" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="333.9677419354838" y="362.57347670250897" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="176.15412186379928" y="299.50896057347666" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="197.48028673835123" y="326.01433691756273" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3x/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto de las horizontales, I y R</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suben con inclinación 90°−x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D y L suben con inclinación 90°−3x/2,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por la otra marca junto a la vertical.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así β=180°−(90°−3x/2) y θ=90°−x. Suma.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>