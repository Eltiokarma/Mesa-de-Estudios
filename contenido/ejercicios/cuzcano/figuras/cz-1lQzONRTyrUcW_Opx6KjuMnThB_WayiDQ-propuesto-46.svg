<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">046 · Distancia en el plano a partir de una normal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,339.56 305.91,339.56 375.10,287.28 170.09,287.28" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,339.56 305.91,339.56 375.10,287.28 170.09,287.28 100.90,339.56" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="138.06,330.84 214.94,330.84 291.81,330.84 253.18,199.44 138.06,330.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="214.94,330.84 253.18,301.95 253.18,199.44" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="253.18,199.44 214.94,330.84" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="138.0602954476937" y="330.84314990070413" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="291.81368706662647" y="330.84314990070413" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="214.93699125716006" y="330.84314990070413" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="253.18266452550318" y="301.9464189868449" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="253.18266452550318" y="199.44415790755636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el isósceles ACB, la mediana CE es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a AB. Así CE²=6²−3²=27.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como CD es perpendicular al plano, CDE</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es recto en D.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta CD² a CE².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>