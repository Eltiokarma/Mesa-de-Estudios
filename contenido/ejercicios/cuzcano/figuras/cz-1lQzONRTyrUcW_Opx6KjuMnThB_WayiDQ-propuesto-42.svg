<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Distancia a la perpendicular común desde un punto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="137.91,396.52 275.97,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="137.91,189.42 200.03,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="137.91,396.52 137.91,292.97 137.91,189.42" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="137.91,292.97 338.09,246.03" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="275.97,396.52 338.09,246.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="200.03,142.48 338.09,246.03" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="137.90576788218794" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="137.90576788218794" y="189.42461430575034" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="275.9667776998598" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="200.03322230014027" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="137.90576788218794" y="292.9703716690042" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="338.09423211781206" y="246.0296283309958" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa la primera recta como eje x en z=0</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y la segunda paralela a y en z=6.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces P=(x,y,3).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las distancias al cuadrado son y²+9 y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x²+9. Al igualarlas a 25, sale</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x²=y²=16.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia a AB, que sigue el eje z,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es √(x²+y²).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>