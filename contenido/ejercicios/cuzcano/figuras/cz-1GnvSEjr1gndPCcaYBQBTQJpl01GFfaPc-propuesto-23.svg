<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">023 · Dos alambres y resistencia interna de batería</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="100.9032258064516" y1="269.5" x2="160.4516129032258" y2="269.5" stroke="#20364b" stroke-width="2"/><line x1="178.4516129032258" y1="269.5" x2="237.99999999999997" y2="269.5" stroke="#20364b" stroke-width="2"/><polyline points="160.4516129032258,269.5 163.4516129032258,274.5 167.4516129032258,264.5 171.4516129032258,274.5 175.4516129032258,264.5 178.4516129032258,269.5" fill="none" stroke="#1766b0" stroke-width="2"/><text x="169.4516129032258" y="284.5" font-family="Arial,sans-serif" font-size="12" fill="#20364b" text-anchor="middle">r</text><line x1="237.99999999999997" y1="269.5" x2="297.54838709677415" y2="269.5" stroke="#20364b" stroke-width="2"/><line x1="315.54838709677415" y1="269.5" x2="375.09677419354836" y2="269.5" stroke="#20364b" stroke-width="2"/><polyline points="297.54838709677415,269.5 300.54838709677415,274.5 304.54838709677415,264.5 308.54838709677415,274.5 312.54838709677415,264.5 315.54838709677415,269.5" fill="none" stroke="#1766b0" stroke-width="2"/><text x="306.54838709677415" y="284.5" font-family="Arial,sans-serif" font-size="12" fill="#20364b" text-anchor="middle">Ri</text><circle cx="100.9032258064516" cy="269.5" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="375.09677419354836" cy="269.5" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Mismo volumen V0 implica Ri=ρLi²/V0.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con resistencia interna r,</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ii=ε/(r+Ri).</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I1/I2=(r+ρL2²/V0)/(r+ρL1²/V0); sólo si</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r0 se reduce a(L2/L1)².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>