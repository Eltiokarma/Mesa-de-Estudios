"#a3b9cc"/><text x="95.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4</text><rect x="143.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="238.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4</text><rect x="333.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">70</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Comprobación del término</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con cantidades i,j,k de los tres</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sumandos se exige i+j+k=8 y 2i−j−2k=0.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituir j=8−i−k da 3i=8+k. Las</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ternas admisibles son (3,4,1) y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(4,0,4).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus aportes multinomiales son 280 y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">70, que se suman.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>