<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Encuentro tras invertir sentido</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">t (s)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">x (m)</text><polyline points="100.90,396.52 283.70,345.71 375.10,371.11" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">A</text><polyline points="100.90,142.48 375.10,371.11" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Antes del giro cierran 40 m/s; a los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">10 s queda separación 500−400=100 m.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Después A va a −10 y B a −30: cierran</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">20 m/s.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tardan 5 s adicionales; encuentro</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">total a los 15 s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>