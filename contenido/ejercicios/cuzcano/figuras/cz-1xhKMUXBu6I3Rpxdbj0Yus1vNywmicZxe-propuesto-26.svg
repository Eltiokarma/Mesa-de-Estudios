<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Bisectriz interior desde distancias a la exterior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="198.48,198.94 339.61,269.50 127.92,375.35 198.48,198.94" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="339.61,153.07 339.61,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="339.61,269.50 170.26,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="198.48,198.94 339.61,198.94" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="127.92,375.35 339.61,375.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="189.31048387096774" y="186.23387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="356.5483870967742" y="278.67338709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="119.4516129032258" y="386.63709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="348.0806451612903" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Exterior</text><text x="260.58064516129036" y="257.5040322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Interior</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las bisectrices interior y exterior</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son perpendiculares. Los dos vértices</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">están a distancias c cos(B/2) y a</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos(B/2) de la exterior.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto m=ac cos²(B/2). La fórmula</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para la bisectriz interior es 2ac</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos(B/2)/(a+c).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye ac=m/cos²(B/2) y a+c=n.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>