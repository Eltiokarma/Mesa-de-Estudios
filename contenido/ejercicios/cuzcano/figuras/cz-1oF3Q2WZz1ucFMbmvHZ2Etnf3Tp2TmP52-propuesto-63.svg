<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">063 · Restar ángulos transportados por dos pares de paralelas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="103.98,344.98 217.97,172.45" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="165.60,175.53 338.13,317.25" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="128.63,227.91 375.10,227.91" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,335.74 347.37,283.98" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="230.30,366.55 327.34,220.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="241.08,349.60 375.10,349.60" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="196.4088437839797" y="182.92877854295034" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="224.13628126132656" y="220.51486045668722" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="252.17180137731063" y="358.84396520478435" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="362.7734686480609" y="220.20677781805003" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="362.7734686480609" y="340.9751721638275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="120.31243204059442" y="346.5206596592968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t</text><text x="322.72272562522653" y="287.0607104023197" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lado ascendente izquierdo es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelo al derecho por los ángulos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iguales. Su inclinación ascendente es</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°−β.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El otro rayo ascendente del cruce,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia la izquierda, tiene orientación</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°−α gracias a L₁.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia de orientaciones es β−α.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>