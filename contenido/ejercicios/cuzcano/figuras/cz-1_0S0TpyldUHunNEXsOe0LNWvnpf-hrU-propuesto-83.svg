<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">083 · Velocidad de un gas medida por una columna de mercurio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,176.96 183.16,176.96 206.01,200.72 269.99,200.72 292.84,176.96 375.10,176.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,259.22 183.16,259.22 206.01,229.51 225.20,229.51 225.20,336.91 184.99,336.91 184.99,362.04 297.41,362.04 297.41,336.91 244.85,336.91 244.85,229.51 269.99,229.51 292.84,259.22 375.10,259.22" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="225.20,288.47 244.85,288.47" fill="none" stroke="#008674" stroke-width="2.5"/><text x="140.2043010752688" y="215.80376344086022" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A: Ø 6 cm</text><text x="237.99999999999997" y="213.5188172043011" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B: Ø 2 cm</text><text x="333.51075268817203" y="215.80376344086022" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C: Ø 6 cm</text><text x="274.5591397849462" y="309.48655913978496" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16 cm</text><text x="237.99999999999997" y="349.244623655914" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hg</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La salida C está a presión atmosférica</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y su área es la misma de A. La presión</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en B es menor en 13 600×10×0,16 = 21</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">760 Pa.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Continuidad da v_B = 9v_A y v_C = v_A.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Bernoulli entre B y C da 21 760 = ρ(81</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">− 1)v_A²/2.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye ρ = 1,36 kg/m³ y toma la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">raíz positiva.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>