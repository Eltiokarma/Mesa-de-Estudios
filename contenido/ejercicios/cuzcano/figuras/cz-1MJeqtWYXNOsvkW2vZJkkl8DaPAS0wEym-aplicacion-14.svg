<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Dos esferas junto a una pared lisa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="269.32,315.69 268.21,326.95 264.93,337.78 259.59,347.76 252.41,356.51 243.66,363.69 233.68,369.03 222.85,372.31 211.59,373.42 200.32,372.31 189.49,369.03 179.51,363.69 170.76,356.51 163.58,347.76 158.25,337.78 154.96,326.95 153.85,315.69 154.96,304.42 158.25,293.59 163.58,283.61 170.76,274.86 179.51,267.68 189.49,262.35 200.32,259.06 211.59,257.95 222.85,259.06 233.68,262.35 243.66,267.68 252.41,274.86 259.59,283.61 264.93,293.59 268.21,304.42 269.32,315.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="322.15,289.71 321.60,295.25 319.99,300.58 317.36,305.49 313.83,309.79 309.52,313.33 304.61,315.95 299.28,317.57 293.74,318.11 288.20,317.57 282.87,315.95 277.96,313.33 273.66,309.79 270.12,305.49 267.50,300.58 265.88,295.25 265.34,289.71 265.88,284.17 267.50,278.84 270.12,273.93 273.66,269.62 277.96,266.09 282.87,263.46 288.20,261.85 293.74,261.30 299.28,261.85 304.61,263.46 309.52,266.09 313.83,269.62 317.36,273.93 319.99,278.84 321.60,284.17 322.15,289.71" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="322.15,142.48 322.15,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="246.34,269.56 322.15,168.98" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="208.12234237536657" y="315.6876832844575" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="293.74276026392965" y="289.7071114369502" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="211.5864186217009" y="245.25146627565982" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6 N</text><text x="284.9093658357771" y="334.1627565982405" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 N</text><text x="306.8485153958944" y="191.55828445747804" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Considera ambas esferas juntas. Sus</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerzas mutuas se cancelan. El peso</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">combinado es 8 N hacia abajo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuerda compensa el peso con T cos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">37° y la pared compensa su componente</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal T sen 37°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con la aproximación del triángulo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3-4-5, T=8/(4/5)=10 y R=10×3/5=6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>