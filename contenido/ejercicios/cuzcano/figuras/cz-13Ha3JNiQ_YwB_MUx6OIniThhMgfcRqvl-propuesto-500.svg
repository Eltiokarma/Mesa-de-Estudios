<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">500 · Cadenas sin ramificar, ramificadas y cerradas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="150.60,243.83 177.59,263.44 167.28,295.17 133.92,295.17 123.61,263.44 150.60,243.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="136.25,288.24 129.57,267.68" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="224.39,266.82 243.41,277.60 262.42,266.82 281.44,277.60" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="264.32,263.92 279.54,272.55" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="318.05,266.82 337.07,277.60 356.08,266.82 375.10,277.60" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="356.08,266.82 356.08,245.82" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="273.06161465265825" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="201.68690149283282" y="273.06161465265825" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">II</text><text x="295.34526154395587" y="273.06161465265825" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">III</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La estructura II tiene cuatro carbonos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en un solo camino. El doble enlace no</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">crea una rama.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La estructura III tiene un carbono</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conectado con tres carbonos. Es una</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cadena abierta ramificada.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La estructura I contiene un recorrido</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cerrado de cinco carbonos. Colócala al</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">final.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>