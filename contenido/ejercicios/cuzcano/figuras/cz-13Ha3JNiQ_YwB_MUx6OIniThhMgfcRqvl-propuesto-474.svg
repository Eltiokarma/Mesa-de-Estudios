<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">474 · Ánodo y cátodo de una celda zinc–cobre</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,260.36 100.90,351.76 192.30,351.76 192.30,260.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="283.70,260.36 283.70,351.76 375.10,351.76 375.10,260.36" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="146.60,335.76 146.60,205.52 329.40,205.52 329.40,335.76" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="171.74,306.06 171.74,267.22 304.26,267.22 304.26,306.06" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="231.15,198.67 242.57,205.52 231.15,212.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="146.60215053763443" y="234.76881720430103" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Zn · ánodo</text><text x="329.3978494623656" y="234.76881720430103" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cu · cátodo</text><text x="237.99999999999997" y="187.24193548387098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">e⁻ →</text><text x="128.32258064516128" y="327.5376344086021" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Zn²⁺</text><text x="347.6774193548387" y="327.5376344086021" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cu²⁺</text><text x="237.99999999999997" y="289.60752688172045" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Puente</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A la izquierda se oxida</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Zn(s)→Zn²⁺+2e⁻. Ese electrodo es el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ánodo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A la derecha Cu²⁺ acepta dos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">electrones y se deposita Cu(s). Es la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reducción catódica.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La doble barra separa las semiceldas e</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">indica el puente salino o unión iónica</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en la notación usada.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>