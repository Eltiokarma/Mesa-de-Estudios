<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">059 · Dos centros de momentos para una barra acodada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.45,384.37 200.43,384.37 290.42,228.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="200.43,384.37 247.67,384.37" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="290.42,228.51 339.91,228.51" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="290.42,228.51 360.60,150.58" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="357.36,161.58 360.60,150.58 350.00,154.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="110.44739466886986" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P₁</text><text x="200.43159596067244" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P₂</text><text x="155.43949531477114" y="373.1202366963894" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 m</text><text x="242.27424956136062" y="296.1837445918982" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 m</text><text x="225.62717232237716" y="374.0200787093074" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="319.2107416658518" y="221.76223824507247" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="365.55260533113017" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 000 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza tiene componentes</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(500√3,500) N. La altura del punto de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aplicación es 2√3 m respecto de ambos</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puntos.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las distancias horizontales desde P₁ y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P₂ son 4 m y 2 m, respectivamente.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica τ_z=xF_y−y F_x para cada punto.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segundo término vale 3 000 N·m en</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ambos cálculos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>