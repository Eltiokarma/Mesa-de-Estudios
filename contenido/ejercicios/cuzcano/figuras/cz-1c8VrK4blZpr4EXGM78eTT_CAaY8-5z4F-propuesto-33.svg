<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">033 · Porcentaje de una barra dentro de las cuatro primeras</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,142.48 100.90,379.29 375.10,379.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="113.25,379.29 113.25,307.53 162.66,307.53 162.66,379.29" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="162.66,379.29 162.66,271.65 212.06,271.65 212.06,379.29" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="212.06,379.29 212.06,164.01 261.47,164.01 261.47,379.29" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="261.47,379.29 261.47,235.77 310.87,235.77 310.87,379.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="310.87,379.29 310.87,343.41 360.28,343.41 360.28,379.29" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="113.25428654460913" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="162.65852949723916" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="212.06277244986921" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">c</text><text x="261.4670154024993" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">d</text><text x="310.8712583551294" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">e</text><text x="360.2755013077594" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">f</text><text x="137.95640802092416" y="294.61618370694373" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10m %</text><text x="187.3606509735542" y="258.73592126845267" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15m %</text><text x="236.76489392618427" y="151.09513395297978" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30m %</text><text x="286.16913687881436" y="222.85565882996173" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20m %</text><text x="335.57337983144436" y="330.4964461454347" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5m %</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ancho común hace que las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frecuencias sean proporcionales a las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alturas.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los datos menores que e corresponden a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las primeras cuatro barras. Sus</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alturas suman 75.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La barra de [b,c) tiene altura</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proporcional a 15. Divide 15 por 75.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>