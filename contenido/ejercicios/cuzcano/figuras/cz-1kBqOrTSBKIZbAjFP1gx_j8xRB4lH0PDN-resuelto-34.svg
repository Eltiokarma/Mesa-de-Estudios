<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Potencial de frenado a partir del umbral gráfico</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="101.54,320.94 374.46,320.94" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="118.33,396.52 118.33,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="151.92,387.07 227.50,320.94 328.28,189.72 352.42,158.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="328.28,320.94 328.28,189.72 118.33,189.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="227.5027992535324" y="339.83124500133295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1,04</text><text x="328.2759264196215" y="339.83124500133295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="106.7849906691549" y="189.72127432684618" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vf</text><text x="151.92295387896564" y="152.98107171420952" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vf (V)</text><text x="341.92228739002934" y="368.1736870167955" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ν (10¹⁵ Hz)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cruce horizontal representa la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frecuencia umbral porque allí el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frenado se anula.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta las frecuencias. La diferencia</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale 0,96×10¹⁵ Hz.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica por h/e. Resultan 3,9744 V,</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aproximadamente 4 V.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>