<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Área de la intersección de dos regiones angulares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="238.00,396.52 110.98,269.50 238.00,142.48 365.02,269.50" fill="#f4c581" fill-opacity="0.45"/><polyline points="238.00,396.52 110.98,269.50 238.00,142.48 365.02,269.50 238.00,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Región</text><circle cx="238.00000000000003" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="245.00000000000003" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,5)</text><circle cx="110.98387096774195" cy="269.5" r="3.7" fill="#20364b"/><text x="117.98387096774195" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(½,5½)</text><circle cx="238.00000000000003" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="245.00000000000003" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,6)</text><circle cx="365.01612903225805" cy="269.5" r="3.7" fill="#20364b"/><text x="372.01612903225805" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1½,5½)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La segunda condición fuerza y≥5.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye ∣y−5∣ por y−5 en la primera.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Queda 5+∣x−1∣≤y≤6−∣x−1∣. Existe altura</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuando ∣x−1∣≤1/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La región tiene diagonales de longitud</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1 sobre x=1 y y=11/2. Su área es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1·1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>