<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">085 · Un sector alrededor de una tangente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="178.01,347.35 176.69,345.02 175.41,342.66 174.16,340.29 172.96,337.89 171.79,335.48 170.66,333.04 169.58,330.59 168.53,328.12 167.52,325.64 166.56,323.13 165.63,320.62 164.75,318.08 163.91,315.54 163.11,312.98 162.35,310.41 161.64,307.82 160.97,305.23 160.34,302.62 159.75,300.00 159.20,297.38 158.70,294.74 158.24,292.10 157.83,289.45 157.46,286.79 157.13,284.13 156.84,281.47 156.60,278.80 156.41,276.12 156.25,273.44 156.14,270.77 156.08,268.08 156.05,265.40 156.08,262.72 156.14,260.04 156.25,257.36 156.41,254.68 156.60,252.01 156.84,249.34 157.13,246.67 157.46,244.01 157.83,241.35 158.24,238.71 158.70,236.06 159.20,233.43 159.75,230.80 160.34,228.19 160.97,225.58 161.64,222.98 162.35,220.40 163.11,217.83 163.91,215.27 164.75,212.72 165.63,210.19 166.56,207.67 167.52,205.17 168.53,202.68 169.58,200.22 170.66,197.76 171.79,195.33 172.96,192.92 174.16,190.52 175.41,188.14 176.69,185.79 178.01,183.46" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="178.01,183.46 319.95,265.40 178.01,347.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="156.05,142.48 156.05,388.32" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="178.01,183.46 178.01,347.35" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="139.6649323621228" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="336.3350676378772" y="268.68054110301773" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="182.27679500520296" y="168.70655567117586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="182.27679500520296" y="367.0156087408949" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="142.94276795005206" y="271.9583766909469" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="280.61186264308014" y="268.68054110301773" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área del sector es π·11²/6. Su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">baricentro está a distancia 2R</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">senβ/(3β)=22/π del centro O sobre la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisectriz, con β=π/6.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia del baricentro al eje</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente es 11−22/π.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pappus, multiplica el área por</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2π(11−22/π).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>