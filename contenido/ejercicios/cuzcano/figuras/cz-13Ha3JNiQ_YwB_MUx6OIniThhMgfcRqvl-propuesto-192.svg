<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">192 · Fórmula, nombre y estado físico</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="95.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">I</text><rect x="143.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="190.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">II</text><rect x="238.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="285.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">III</text><rect x="333.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="380.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">IV</text><rect x="48.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">HCl(l)</text><rect x="143.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">HCl(ac)</text><rect x="238.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">CaH₂(s)</text><rect x="333.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">NH₃(ac)</text><text x="48" y="253" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Fórmulas del ejercicio</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">X es falsa. El nombre ácido</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">clorhídrico corresponde a HCl acuoso.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El compuesto puro es cloruro de</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hidrógeno.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Y y W son verdaderas porque CaH₂ es un</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hidruro metálico y se llama hidruro de</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">calcio.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Z es falsa en un nombre de composición</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">estricto. NH₃(ac) representa amoníaco</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">disuelto, en equilibrio con NH₄⁺ y</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OH⁻.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>