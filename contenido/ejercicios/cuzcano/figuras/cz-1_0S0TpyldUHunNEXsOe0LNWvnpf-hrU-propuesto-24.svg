<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">024 · Desplazamientos por carga antes de equilibrar niveles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,187.24 100.90,351.76 375.10,351.76 375.10,187.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="144.77,187.24 144.77,318.85 309.29,318.85 309.29,187.24" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,242.08 144.77,242.08" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="309.29,242.08 375.10,242.08" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="320.26,212.47 361.94,212.47 361.94,242.08 320.26,242.08 320.26,212.47" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="122.83870967741935" y="261.2741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 m²</text><text x="342.1935483870968" y="261.2741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 m²</text><text x="341.0967741935484" y="226.7258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Auto</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La carga sobre el émbolo mayor aporta</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">10 000/4 = 2500 Pa. Sin fuerza en el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">menor, eso corresponde a un desnivel</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 2500/(1000×10) = 0,25 m.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el mayor baja x, el menor sube 4x</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por volumen. Así 5x = 0,25 m. Los</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desplazamientos son 0,05 y 0,20 m.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para nivelarlos, aplica al menor la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">misma presión adicional. En 1 m²</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">requiere 2500 N.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>