<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Radio del corte tangente superior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="132.15,396.52 238.00,142.48 343.85,396.52 132.15,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,396.52 238.00,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="308.56,325.95 308.22,332.87 307.21,339.72 305.53,346.44 303.19,352.96 300.23,359.22 296.67,365.16 292.55,370.72 287.90,375.85 282.77,380.50 277.20,384.62 271.26,388.18 265.00,391.14 258.48,393.48 251.77,395.16 244.92,396.18 238.00,396.52 231.08,396.18 224.23,395.16 217.52,393.48 211.00,391.14 204.74,388.18 198.80,384.62 193.23,380.50 188.10,375.85 183.45,370.72 179.33,365.16 175.77,359.22 172.81,352.96 170.47,346.44 168.79,339.72 167.78,332.87 167.44,325.95 167.78,319.04 168.79,312.19 170.47,305.47 172.81,298.95 175.77,292.69 179.33,286.75 183.45,281.19 188.10,276.05 193.23,271.40 198.80,267.28 204.74,263.72 211.00,260.76 217.52,258.43 224.23,256.74 231.08,255.73 238.00,255.39 244.92,255.73 251.77,256.74 258.48,258.43 265.00,260.76 271.26,263.72 277.20,267.28 282.77,271.40 287.90,276.05 292.55,281.19 296.67,286.75 300.23,292.69 303.19,298.95 305.53,305.47 307.21,312.19 308.22,319.04 308.56,325.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="190.96,255.39 285.04,255.39" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="265.5201612903226" y="254.6814516129032" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">corte</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo axial tiene lados 13, 13</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 10. Su inradio es 60/18=10/3 cm.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El plano tangente superior queda a</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura 2r=20/3 cm sobre la base. Al</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértice le faltan 12−20/3=16/3 cm.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por semejanza con el cono completo, el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radio de la sección es 5(16/3)/12.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>