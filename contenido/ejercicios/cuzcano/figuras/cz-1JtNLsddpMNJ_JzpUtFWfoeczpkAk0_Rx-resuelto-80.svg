<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">080 · Imagen de una fuente cerca del vértice</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="188.65,178.10 192.12,182.67 195.42,187.24 198.54,191.81 201.48,196.38 204.24,200.95 206.82,205.52 209.23,210.09 211.46,214.66 213.51,219.23 215.38,223.80 217.07,228.37 218.59,232.94 219.92,237.51 221.08,242.08 222.06,246.65 222.86,251.22 223.49,255.79 223.93,260.36 224.20,264.93 224.29,269.50 224.20,274.07 223.93,278.64 223.49,283.21 222.86,287.78 222.06,292.35 221.08,296.92 219.92,301.49 218.59,306.06 217.07,310.63 215.38,315.20 213.51,319.77 211.46,324.34 209.23,328.91 206.82,333.48 204.24,338.05 201.48,342.62 198.54,347.19 195.42,351.76 192.12,356.33 188.65,360.90" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="151.17,269.50 151.17,244.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="315.69,269.50 315.69,238.65" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="151.17,244.82 224.29,269.50 315.69,238.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="151.17,244.82 224.29,244.82 315.69,238.65" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="151.1720430107527" y="228.37096774193546" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="315.68817204301075" y="221.28763440860212" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen</text><text x="238.91397849462368" y="290.52150537634407" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La focal del espejo es la mitad del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radio, 100 cm.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica 1/s′ = 1/100 − 1/20 = −1/25</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cm⁻¹.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así s′ = −25 cm. La imagen virtual</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda a 25 cm detrás del espejo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>