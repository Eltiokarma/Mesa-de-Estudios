<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Intervalos abiertos de un coseno triple</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Dos intervalos consecutivos</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="137.91666666666669" y1="275" x2="167.08333333333331" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="137.91666666666669" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="167.08333333333331" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><line x1="312.9166666666667" y1="275" x2="342.08333333333337" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="312.9166666666667" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="342.08333333333337" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="137.91666666666669" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">−π/18</text><text x="167.08333333333331" y="329" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/18</text><text x="312.9166666666667" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">11π/18</text><text x="342.08333333333337" y="329" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">13π/18</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pasa 6cos x al lado izquierdo y usa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4cos³ x−3cos x=cos 3x. Queda 2cos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3x&gt;√3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En cada vuelta, cos 3x&gt;√3/2 si 3x está</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a distancia menor que π/6 de 2nπ. Los</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos se excluyen.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide entre tres para obtener los</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intervalos centrados en 2nπ/3, con</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radio π/18.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>