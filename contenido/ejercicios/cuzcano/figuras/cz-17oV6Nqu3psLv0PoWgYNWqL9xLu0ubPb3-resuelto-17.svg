<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Bisectriz de pendiente negativa entre dos rectas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="146.55,223.77 329.45,223.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="314.21,396.52 314.21,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="156.71,340.63 324.37,214.88" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="156.71,366.03 319.29,149.26" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="156.71,264.42 273.56,381.27" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="207.51612903225805" y="317.258064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una bisectriz contiene los puntos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equidistantes de las rectas. Las dos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normas de sus vectores normales son 5.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala las expresiones 3x−4y+1 y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4x−3y+40 con los dos signos posibles.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al igualarlas directamente sale</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x+y=−39, de pendiente −1. La otra</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igualdad genera una pendiente</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positiva.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>