<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">032 · Área de un triángulo con incentro y excentro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="167.66,345.01 180.33,301.26 375.10,193.99" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,345.01 166.74,240.90 331.35,345.01 100.90,345.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,345.01 180.33,301.26 375.10,193.99" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,193.99 331.35,345.01 180.33,301.26" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="167.66,345.01 180.33,301.26 375.10,193.99 167.66,345.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="345.00747756424363" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="166.74495342909438" y="240.90256538025636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="331.34927248570136" y="345.00747756424363" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="180.33431735721416" y="301.2599758563965" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="375.0967741935484" y="193.99252243575646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="167.66110956762975" y="345.00747756424363" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CI es la bisectriz interior en C y CE,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la exterior. Por tanto CE⊥CI.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como PI⊥CI, CE es paralela a PI. La</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia de E a PI es la separación</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre esas dos rectas, IC.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con base IP y altura IC, el área es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">IP·IC/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>