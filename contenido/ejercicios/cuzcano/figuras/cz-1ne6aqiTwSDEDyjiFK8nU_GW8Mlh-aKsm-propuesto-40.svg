<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Dominio de una raíz con cotangente en el divisor</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="87.28369045049618" y1="275" x2="163.6418452252481" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="87.28369045049618" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="87.28369045049618" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">−π/2</text><circle cx="163.6418452252481" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="163.6418452252481" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">−π/4</text><line x1="316.3581547747519" y1="275" x2="392.71630954950376" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="316.3581547747519" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="316.3581547747519" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/4</text><circle cx="392.71630954950376" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="392.71630954950376" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/2</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La expresión original excluye 0 y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">±π/2. Pon t=∣x∣.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cociente es tan t·∣tan t∣. Para</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t∈(π/2,π) es negativo y no sirve.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para t∈(0,π/2), exige tan²t≥1.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces π/4≤t&lt;π/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>