<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">085 · Triángulos rectángulos de base decreciente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="166.78,353.83 166.78,148.14 321.05,353.83 166.78,353.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="243.91,353.83 243.91,250.99" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="282.48,353.83 282.48,302.41" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="301.77,353.83 301.77,328.12" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="161.4367572156197" y="375.66024552696877" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="159.37981585477343" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="330.62018414522663" y="375.66024552696877" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="231.3727634843934" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3a</text><text x="248.8567650515868" y="233.73129162857515" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5a</text><text x="242.17170562883638" y="375.1460101867572" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D</text><text x="280.7393561447042" y="375.1460101867572" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">E</text><text x="300.0231814026381" y="375.1460101867572" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pitágoras da AB=4a. El triángulo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inicial tiene área (3a)(4a)/2=6a².</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos menores comparten el</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo en C y tienen base mitad de la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">anterior. Son semejantes y sus áreas</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">escalan por 1/4.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sumar la geométrica da</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">6a²/(1−1/4)=8a².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>