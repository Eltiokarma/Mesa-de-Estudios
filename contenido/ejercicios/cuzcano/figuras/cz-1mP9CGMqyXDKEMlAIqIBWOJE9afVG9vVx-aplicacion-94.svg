<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">094 · Sentido inducido cuando el campo cruza por cero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="185.34,285.82 185.11,287.46 184.41,289.08 183.27,290.66 181.69,292.19 179.68,293.66 177.27,295.03 174.49,296.31 171.37,297.46 167.93,298.50 164.23,299.39 160.29,300.13 156.17,300.72 151.90,301.15 147.53,301.40 143.12,301.49 138.71,301.40 134.34,301.15 130.07,300.72 125.95,300.13 122.01,299.39 118.31,298.50 114.87,297.46 111.75,296.31 108.97,295.03 106.56,293.66 104.55,292.19 102.97,290.66 101.83,289.08 101.13,287.46 100.90,285.82 101.13,284.18 101.83,282.56 102.97,280.98 104.55,279.45 106.56,277.99 108.97,276.61 111.75,275.34 114.87,274.18 118.31,273.15 122.01,272.25 125.95,271.51 130.07,270.92 134.34,270.50 138.71,270.24 143.12,270.15 147.53,270.24 151.90,270.50 156.17,270.92 160.29,271.51 164.23,272.25 167.93,273.15 171.37,274.18 174.49,275.34 177.27,276.61 179.68,277.99 181.69,279.45 183.27,280.98 184.41,282.56 185.11,284.18 185.34,285.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="143.12,285.82 143.12,218.36" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="146.60,225.76 143.12,218.36 139.64,225.76" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="222.33,287.13 373.79,287.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="222.33,325.86 222.33,213.57" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="222.33,224.45 358.99,320.64" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="147.03737839221714" y="220.9720942140297" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">+z</text><text x="241.48182283666156" y="213.13799283154123" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B_z (T)</text><text x="210.58064516129033" y="224.01868919610854" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100</text><text x="311.1182795698925" y="295.83128520225296" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="375.0967741935484" y="296.70174091141837" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t (s)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para la normal +z, el flujo es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A(100−20t). Su derivada vale −20A</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">durante todo el intervalo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fem en el sentido positivo de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">circulación es −dΦ/dt=+20A, donde A es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el área de la espira.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La circulación positiva vista desde +z</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es antihoraria. En t=5 s el flujo es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cero y su derivada sigue siendo −20A.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>