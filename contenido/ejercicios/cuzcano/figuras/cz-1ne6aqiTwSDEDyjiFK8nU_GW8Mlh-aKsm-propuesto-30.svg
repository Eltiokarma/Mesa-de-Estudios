<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Rango de una cuadrática en el módulo de la tangente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="100.90,142.48 105.47,179.31 110.04,208.19 114.61,231.42 119.18,250.50 123.75,266.45 128.32,280.00 132.89,291.66 137.46,301.81 142.03,310.75 146.60,318.69 151.17,325.81 155.74,332.24 160.31,338.08 164.88,343.43 169.45,348.36 174.02,352.92 178.59,357.17 183.16,361.15 187.73,364.89 192.30,368.42 196.87,371.76 201.44,374.95 206.01,377.99 210.58,380.91 215.15,383.71 219.72,386.42 224.29,389.05 228.86,391.60 233.43,394.09 238.00,396.52 242.57,394.09 247.14,391.60 251.71,389.05 256.28,386.42 260.85,383.71 265.42,380.91 269.99,377.99 274.56,374.95 279.13,371.76 283.70,368.42 288.27,364.89 292.84,361.15 297.41,357.17 301.98,352.92 306.55,348.36 311.12,343.43 315.69,338.08 320.26,332.24 324.83,325.81 329.40,318.69 333.97,310.75 338.54,301.81 343.11,291.66 347.68,280.00 352.25,266.45 356.82,250.50 361.39,231.42 365.96,208.19 370.53,179.31 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente recorre ℝ entre −π/2 y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π/2. Entonces t=∣tan x∣ recorre [0,∞).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La expresión es t²+4t. Su mínimo es 0</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en t=0 y es estrictamente creciente</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para t≥0.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Es continua y sin cota superior. Por</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ello toma todos los valores no</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>