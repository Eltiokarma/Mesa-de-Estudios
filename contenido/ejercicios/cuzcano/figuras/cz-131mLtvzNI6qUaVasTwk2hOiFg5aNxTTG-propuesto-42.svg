<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Dispersión elástica con masas m y m/2</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="229.92357025716277" x2="421" y2="229.92357025716277" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645164" y1="105" x2="100.90322580645164" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="100.90,229.92 238.00,150.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">m después</text><line x1="238.0" y1="150.77071077148833" x2="232.13122008304714" y2="158.86746458313226" stroke="#1766b0" stroke-width="2"/><line x1="238.0" y1="150.77071077148833" x2="228.05361555245142" y2="151.80484636296745" stroke="#1766b0" stroke-width="2"/><polyline points="100.90,229.92 375.10,388.23" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">m/2 después</text><line x1="375.09677419354836" y1="388.22928922851173" x2="365.1503897459998" y2="387.1951536370326" stroke="#d37618" stroke-width="2"/><line x1="375.09677419354836" y1="388.22928922851173" x2="369.2279942765955" y2="380.13253541686777" stroke="#d37618" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el blanco sale a 30°, su rapidez es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2mVcos30°/(m+m/2).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se obtiene b=2V/√3. La otra bola sale</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a 30° al otro lado, con rapidez V/√3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Comprobar componentes del momento y</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">energía; ninguna alternativa legible</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coincide con 2V/√3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>