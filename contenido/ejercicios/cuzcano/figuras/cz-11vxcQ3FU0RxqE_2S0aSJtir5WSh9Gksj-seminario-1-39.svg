8,249.72 223.19,247.64 224.42,245.57 225.68,243.53 226.97,241.50 228.29,239.49 229.63,237.50 231.00,235.52 232.40,233.57 233.82,231.63 235.27,229.71 236.75,227.82 238.25,225.94 239.77,224.09 241.33,222.25 242.90,220.44 244.51,218.65 246.13,216.88 247.78,215.13 249.46,213.40 251.15,211.70 252.87,210.02 254.61,208.37 256.38,206.74 258.17,205.13 259.98,203.55 261.81,201.99" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645164" y="337.0069830693852" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="261.8066050027243" y="201.99301693061483" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="337.0069830693852" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="174.93548387096774" y="271.200531456482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ℓ₁</text><text x="325.7419354838709" y="260.23278952099815" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ℓ₂</text><text x="347.67741935483866" y="317.81343468228846" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="254.45161290322582" y="232.81343468228846" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ángulos centrales son π/2−θ en A y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ en C. Por tanto ℓ₂=AB(π/2−θ) y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ℓ₁=BC·θ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo da AB/BC=tan θ. El</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">argumento de la segunda cotangente se</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reduce a π/2−θ.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa cot(π/2−θ)=tan θ y multiplica.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>