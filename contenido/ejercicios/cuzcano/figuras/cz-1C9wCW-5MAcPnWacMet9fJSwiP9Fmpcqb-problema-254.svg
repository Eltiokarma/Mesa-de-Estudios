<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">254 · Manómetro con gas a900 mmHg</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="345.7096774193548" x2="421" y2="345.7096774193548" stroke="#20364b" stroke-width="1.7"/><line x1="187.19354838709677" y1="105" x2="187.19354838709677" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="187.19,142.48 187.19,396.52 288.81,396.52 288.81,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">tubo U</text><polyline points="187.19,345.71 217.68,345.71" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">nivel lado gas</text><polyline points="258.32,203.45 288.81,203.45" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="498" font-family="Arial,sans-serif" font-size="12" fill="#008674" text-anchor="start">nivel abierto</text><circle cx="187.19354838709677" cy="345.7096774193548" r="3.7" fill="#20364b"/><text x="194.19354838709677" y="337.7096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">gas</text><circle cx="288.8064516129032" cy="203.4516129032258" r="3.7" fill="#20364b"/><text x="295.8064516129032" y="195.4516129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">atmósfera</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia de presión equivale</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a900−760=140 mm de Hg.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La columna de Hg que equilibra esa</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia mide140 mm.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h=14 cm, con nivel del lado del gas</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">más bajo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>