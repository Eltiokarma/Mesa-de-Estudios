<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">084 · Cruce de dos bisectrices que nacen en paralelas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,177.23 375.10,177.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,369.17 375.10,369.17" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,369.17 136.55,259.49 306.55,311.59 210.58,177.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,369.17 360.02,222.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="210.58,177.23 358.65,269.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="349.0483870967742" y="249.6209677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="143.4032258064516" y="267.71774193548384" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊥</text><text x="287.35483870967744" y="298.7016129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">46°</text><text x="128.32258064516128" y="360.94354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="115.98387096774192" y="345.86290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="239.37096774193546" y="185.18548387096772" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="234.16129032258067" y="196.9758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="364.1290322580645" y="169.8306451612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="364.1290322580645" y="361.76612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama a y b a las inclinaciones agudas</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de las bisectrices respecto de las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontales. Sus lados exteriores</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen inclinaciones 2a y −2b.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La perpendicular al primero baja con</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">orientación 2a−90°. El ángulo de 46°</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da (2a−90°)−(−2b)=46°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el cruce de las bisectrices, x=a+b.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide 136° entre 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>