<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">093 · Fracción del área proyectada sobre un cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,355.36 227.36,183.64 290.00,355.36" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,355.36 227.36,331.25 290.00,355.36" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,355.36 290.00,355.36 375.10,291.07 186.00,291.07 100.90,355.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,355.36 227.36,183.64 290.00,355.36 100.90,355.36" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="227.36,183.64 227.36,331.25" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="227.36,183.64 280.55,291.07" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,355.36 227.36,331.25 290.00,355.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.9032258064516" y="355.36274052612123" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="290.0022246941046" y="355.36274052612123" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="291.0690809043192" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="185.99777530589543" y="291.0690809043192" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="227.3631813125695" y="183.63725947387877" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="227.3631813125695" y="331.25261816794546" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="280.5472747497219" y="291.0690809043192" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">K</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a el lado y toma A=(0,0), B=(a,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CD en y=a. La proyección de P tiene</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abscisa a/2 por equidistancia a A,B.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al igualar las distancias a A y CD se</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cancela la altura espacial. Resulta</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a²/4+y²=(y−a)² y por tanto y=3a/8.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las áreas comparten base AB. Divide la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura proyectada 3a/8 por la del</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilátero a√3/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>