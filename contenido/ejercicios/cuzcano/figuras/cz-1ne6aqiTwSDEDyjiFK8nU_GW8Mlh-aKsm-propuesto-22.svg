<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">022 · Máximo de una suma de seno, coseno y su producto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="309.34603918556434" x2="421" y2="309.34603918556434" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="100.90,222.18 105.47,204.48 110.04,188.23 114.61,173.89 119.18,161.87 123.75,152.52 128.32,146.13 132.89,142.89 137.46,142.89 142.03,146.13 146.60,152.52 151.17,161.87 155.74,173.89 160.31,188.23 164.88,204.48 169.45,222.18 174.02,240.83 178.59,259.93 183.16,279.00 187.73,297.56 192.30,315.19 196.87,331.51 201.44,346.24 206.01,359.14 210.58,370.08 215.15,379.00 219.72,385.91 224.29,390.93 228.86,394.22 233.43,395.99 238.00,396.52 242.57,396.09 247.14,395.01 251.71,393.57 256.28,392.05 260.85,390.68 265.42,389.65 269.99,389.11 274.56,389.11 279.13,389.65 283.70,390.68 288.27,392.05 292.84,393.57 297.41,395.01 301.98,396.09 306.55,396.52 311.12,395.99 315.69,394.22 320.26,390.93 324.83,385.91 329.40,379.00 333.97,370.08 338.54,359.14 343.11,346.24 347.68,331.51 352.25,315.19 356.82,297.56 361.39,279.00 365.96,259.93 370.53,240.83 375.10,222.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><circle cx="135.1774193548387" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="142.1774193548387" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">máx</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon u=sen x+cos x. Entonces u∈[−√2,√2]</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y sen x cos x=(u²−1)/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La expresión es una cuadrática convexa</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en u, así que su máximo en el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intervalo cerrado está en uno de sus</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mayor valor sale en u=√2. Se</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanza, por ejemplo, en x=π/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>