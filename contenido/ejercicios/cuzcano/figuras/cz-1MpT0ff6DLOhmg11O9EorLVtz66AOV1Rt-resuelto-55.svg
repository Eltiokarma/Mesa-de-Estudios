<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">055 · Lado de un cuadrado con dos coordenadas dadas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="395.6290322580645" x2="421" y2="395.6290322580645" stroke="#20364b" stroke-width="1.7"/><line x1="155.74193548387098" y1="105" x2="155.74193548387098" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="238.00,395.63 155.74,258.53 292.84,176.27 375.10,313.37 238.00,395.63" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">PURE</text><polyline points="100.90,291.44 347.68,143.37" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">L</text><polyline points="292.84,176.27 292.84,395.63" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">RH</text><circle cx="237.99999999999997" cy="395.6290322580645" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="387.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="155.74193548387098" cy="258.5322580645161" r="3.7" fill="#20364b"/><text x="162.74193548387098" y="250.5322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">U</text><circle cx="292.83870967741933" cy="176.27419354838707" r="3.7" fill="#20364b"/><text x="299.83870967741933" y="168.27419354838707" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="375.0967741935484" cy="313.3709677419355" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="305.3709677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">E</text><circle cx="292.83870967741933" cy="395.6290322580645" r="3.7" fill="#20364b"/><text x="299.83870967741933" y="387.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe U=(0,u). El vector PU=(−3,u).</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Un giro horario da UR=(u,3). Como R</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene altura 8, u+3=8 y u=5.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta por U=(0,5) y R=(5,8) tiene</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente 3/5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>