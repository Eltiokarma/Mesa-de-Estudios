<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Mediatriz y un ángulo de 30°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.37,301.55 277.47,301.55 375.10,301.55 277.47,203.92 108.37,301.55" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="277.47,203.92 277.47,301.55" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="360.45,218.56 326.28,252.73 277.47,301.55 236.46,342.55" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="318.47,260.54 326.28,268.35 334.09,260.54" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645157" y="294.07802875387983" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="270.00025316406027" y="196.44981448979897" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="367.6284674281411" y="294.07802875387983" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="270.00025316406027" y="294.07802875387983" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La mediatriz da QB=QC. El triángulo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">QBC tiene dos ángulos de 45° y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠BQC=90°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como A, Q y C son colineales, ABQ</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también es rectángulo en Q.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La hipotenusa AB es 2BQ, de modo que</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el seno de ∠BAC vale 1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>