<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">045 · Ángulo entre dos perpendiculares en un triángulo isósceles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="126.86,382.58 359.21,382.58 359.21,150.23 126.86,382.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="204.31,382.58 359.21,150.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="281.76,382.58 359.21,150.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="359.21,382.58 251.97,311.08" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="359.21,382.58 289.50,359.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="108.27316089693156" y="388.77124311565694" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="367.7268391030684" y="391.8691974822974" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="366.9523505114083" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="204.3097462627852" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="281.7586054287962" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="299.57184303697875" y="351.5957907159717" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Girar las dos rectas 90° conserva el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo agudo. Basta medir el ángulo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre MC y NC.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa B=(0,0), A=(−3,0), C=(0,3),</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M=(−2,0) y N=(−1,0). Las pendientes</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son 3/2 y 3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente de la diferencia es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(3−3/2)/(1+9/2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>