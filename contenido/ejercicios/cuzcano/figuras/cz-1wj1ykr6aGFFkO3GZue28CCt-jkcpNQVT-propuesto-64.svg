<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">064 · Tetracloruro de carbono</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="245.56,283.61 245.56,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="245.56,283.61 116.53,356.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="245.56,283.61 279.83,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="245.56,283.61 359.47,316.88" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="245.56048387096774" y="283.61290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="245.56048387096774" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cl</text><text x="116.52822580645159" y="356.19354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cl</text><text x="279.8346774193549" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cl</text><text x="359.4717741935484" y="316.8790322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cl</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay cuatro enlaces σ en el C y ningún</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">par libre central. Se distribuyen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tetraédricamente.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como los cuatro sustituyentes son</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iguales, sus vectores de enlace se</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cancelan por simetría.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuatro direcciones σ corresponden al</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">modelo sp³.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>