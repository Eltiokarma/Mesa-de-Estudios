<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Separación de dos pies de altura</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,343.39 306.55,224.66 274.73,243.03 238.00,206.30 375.10,343.39 100.90,343.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,343.39 238.00,206.30" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="306.55,224.66 375.10,343.39" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,206.30 306.55,224.66" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.9032258064516" y="343.39182758686985" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="274.7349699300733" y="243.03002332339474" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="343.39182758686985" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="238.0000000000001" y="206.29505339332147" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="306.54838709677415" y="224.66253835835812" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="153.41844495789854" y="335.58551122651966" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="346.71016924682027" y="329.1985251135058" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45°</text><text x="272.2741935483871" y="195.60817241313015" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como los pies forman ángulos rectos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con AC, A, N, C y P están en la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">circunferencia de diámetro AC.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La dirección de AP forma 45° con AC y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la de AN forma 30°, de modo que</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠PAN=15°. El arco PN correspondiente</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mide 30°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuerda PN mide AC·sen 15°. Como sen</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15°=√(2−√3)/2, el producto es 1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>