<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">101 · Ceviana con segmentos de igual longitud</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.80,326.98 179.65,212.02 367.62,326.98 107.80,326.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="179.65,212.02 234.26,326.98" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645164" y="336.75502130249544" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="179.65483194698044" y="201.67014945560288" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935483" y="336.75502130249544" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="234.26360992763915" y="337.3298505443971" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="130.79434638533849" y="317.21082707783864" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4α</text><text x="336.0083857442348" y="318.93531480354363" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3α</text><text x="211.845269493474" y="242.4830256306215" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ley de senos en ABC, AB/BC = sen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3α/sen 4α. En PBC, CP/BC = sen 5α/sen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">8α.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala y aplica sen 8α = 2 sen 4α cos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4α. Queda 2 sen 3α cos 4α = sen 5α.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por producto a suma, sen 7α − sen α =</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 5α. Así 2 cos 6α = 1. Como 0° &lt; α</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">&lt; 22,5°, se obtiene α = 10° y ∠PBC =</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">50°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>