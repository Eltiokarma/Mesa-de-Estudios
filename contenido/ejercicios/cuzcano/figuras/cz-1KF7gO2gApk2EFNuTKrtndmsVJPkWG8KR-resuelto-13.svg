<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">013 · Ángulos exteriores en un cruce de rectas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,344.90 238.00,162.11 375.10,344.90 100.90,344.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="178.59,203.24 313.40,376.89" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="299.69,198.67 167.17,376.89" fill="none" stroke="#008674" stroke-width="2.5"/><text x="127.40860215053763" y="333.4784946236559" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="351.33333333333337" y="333.4784946236559" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">γ</text><text x="192.3010752688172" y="246.65053763440858" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="283.6989247311828" y="246.65053763440858" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="237.99999999999997" y="257.1612903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos transversales y la base forman</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un triángulo interior.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus ángulos exteriores son α+β, θ+γ y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°−x, por el teorema del ángulo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior en los triángulos laterales.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala su suma a 360° y despeja.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>