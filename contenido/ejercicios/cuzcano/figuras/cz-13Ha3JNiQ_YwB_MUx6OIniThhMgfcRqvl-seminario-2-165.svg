rial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">Z</text><rect x="102.28571428571428" y="226" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="129.42857142857142" y="257.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">1</text><rect x="156.57142857142856" y="226" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="183.7142857142857" y="257.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">6</text><rect x="210.85714285714286" y="226" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="257.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">7</text><rect x="265.1428571428571" y="226" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="292.2857142857143" y="257.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">8</text><rect x="319.42857142857144" y="226" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="346.5714285714286" y="257.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">16</text><rect x="373.7142857142857" y="226" width="54.285714285714285" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="400.8571428571429" y="257.2" font-family="Arial,sans-serif" font-size="13.571428571428571" fill="#20364b" text-anchor="middle">17</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Electronegatividades del impreso</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H₂O y CH₃NH₂ tienen H enlazado a O o N</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y pares libres que pueden aceptar</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enlaces de hidrógeno.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CH₄ y SO₃ monomérico son simétricos.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CHCl₃ tiene dipolo permanente.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La dispersión existe en todas las</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">especies. En CH₃NH₂, el enlace de</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hidrógeno es la interacción distintiva</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que el ejercicio busca.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>