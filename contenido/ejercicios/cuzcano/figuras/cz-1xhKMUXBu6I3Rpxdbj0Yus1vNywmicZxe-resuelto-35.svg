<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Orientación de un bote con corriente hacia el sur</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="303.78,396.52 235.24,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><line x1="235.24270998845665" y1="142.48387096774195" x2="241.55796181304774" y2="150.23742462990222" stroke="#1766b0" stroke-width="2"/><line x1="235.24270998845665" y1="142.48387096774195" x2="233.6842754273452" y2="152.36168862746484" stroke="#1766b0" stroke-width="2"/><polyline points="235.24,142.48 235.24,327.98" fill="none" stroke="#d37618" stroke-width="2.5"/><line x1="235.24270998845665" y1="327.98005157229255" x2="231.16510545786096" y2="318.84916216916946" stroke="#d37618" stroke-width="2"/><line x1="235.24270998845665" y1="327.98005157229255" x2="239.32031451905235" y2="318.84916216916946" stroke="#d37618" stroke-width="2"/><polyline points="303.78,396.52 235.24,327.98" fill="none" stroke="#008674" stroke-width="2.5"/><line x1="235.24270998845665" y1="327.98005157229255" x2="244.58252561825057" y2="331.55326357292404" stroke="#008674" stroke-width="2"/><line x1="235.24270998845665" y1="327.98005157229255" x2="238.81592198908817" y2="337.31986720208647" stroke="#008674" stroke-width="2"/><text x="303.7787874484222" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="235.24270998845665" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="235.24270998845665" y="327.98005157229255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="277.46727246905334" y="232.06916041120252" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 km/h</text><text x="172.22121255157782" y="251.8027966457292" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">corriente</text><text x="277.46727246905334" y="389.9382502874158" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">NO</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea α el ángulo de orientación al</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">oeste del norte. La velocidad final</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene componente oeste 40senα y norte</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">40cosα−28,2.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para rumbo NO ambas componentes deben</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ser iguales y positivas. Resulta</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√2cos(α+45°)=28,2/40.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α=arccos(28,2/(40√2))−45°≈15,10°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>