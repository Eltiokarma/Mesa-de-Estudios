<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Dirección del segmento de puntos medios</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,352.62 316.80,352.62 375.10,308.58 159.20,308.58" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,352.62 316.80,352.62 375.10,308.58 159.20,308.58 100.90,352.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="132.21,345.28 151.64,265.83 171.07,186.38" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="171.07,315.92 238.00,330.60 304.93,345.28" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="151.64,265.83 238.00,330.60" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="132.21,345.28 304.93,345.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="171.07,186.38 171.07,315.92" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="132.20878841757684" y="345.28105156210313" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="304.92913385826773" y="345.28105156210313" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="171.0708661417323" y="315.91859283718566" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="171.0708661417323" y="186.37833375666753" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="151.63982727965458" y="265.82969265938533" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="238.00000000000003" y="330.5998221996444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Vectorialmente 2MN=AD+BC, con las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">direcciones indicadas por las letras.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 10²=8²+6², AD y BC son</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ortogonales. Proyectar 2MN sobre AD da</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente 8.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El coseno es 8/10.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>