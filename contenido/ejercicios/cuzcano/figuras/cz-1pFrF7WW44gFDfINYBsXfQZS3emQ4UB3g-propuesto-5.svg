mily="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">aro exterior</text><polyline points="339.61,269.50 339.30,261.53 338.36,253.60 336.81,245.78 334.64,238.10 331.88,230.61 328.54,223.37 324.64,216.41 320.21,209.77 315.27,203.51 309.85,197.65 303.99,192.23 297.73,187.29 291.09,182.86 284.13,178.96 276.89,175.62 269.40,172.86 261.72,170.69 253.90,169.14 245.97,168.20 238.00,167.89 230.03,168.20 222.10,169.14 214.28,170.69 206.60,172.86 199.11,175.62 191.87,178.96 184.91,182.86 178.27,187.29 172.01,192.23 166.15,197.65 160.73,203.51 155.79,209.77 151.36,216.41 147.46,223.37 144.12,230.61 141.36,238.10 139.19,245.78 137.64,253.60 136.70,261.53 136.39,269.50 136.70,277.47 137.64,285.40 139.19,293.22 141.36,300.90 144.12,308.39 147.46,315.63 151.36,322.59 155.79,329.23 160.73,335.49 166.15,341.35 172.01,346.77 178.27,351.71 184.91,356.14 191.87,360.04 199.11,363.38 206.60,366.14 214.28,368.31 222.10,369.86 230.03,370.80 238.00,371.11 245.97,370.80 253.90,369.86 261.72,368.31 269.40,366.14 276.89,363.38 284.13,360.04 291.09,356.14 297.73,351.71 303.99,346.77 309.85,341.35 315.27,335.49 320.21,329.23 324.64,322.59 328.54,315.63 331.88,308.39 334.64,300.90 336.81,293.22 338.36,285.40 339.30,277.47 339.61,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">aro interior</text><circle cx="238.0" cy="269.5" r="3.7" fill="#20364b"/><text x="200.0" y="239.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">−30µC</text><circle cx="365.016129032258" cy="269.5" r="3.7" fill="#20364b"/><text x="268.016129032258" y="289.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="end">aro neto+20µC</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La carga neta del aro permanece+20 µC:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">no hay transferencia con la partícula.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El campo externo redistribuye carga</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enla superficie, pero un aro abierto</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">no es una cavidad conductora cerrada.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">No se deduce una carga inducida exacta</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de+30 µC ni un número de electrones</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desplazados sin geometría y una</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">definición de ese desplazamiento.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>