<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">061 · Aumento quíntuple en una lupa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,284.26 375.10,284.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="297.76,213.96 288.62,250.52 285.81,284.26 288.62,318.01 297.76,354.57 306.90,318.01 309.71,284.26 306.90,250.52 297.76,213.96" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="262.61,284.26 262.61,266.69 256.98,273.72 262.61,266.69 268.23,273.72" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="122.00,284.26 122.00,196.38 116.37,203.41 122.00,196.38 127.62,203.41" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="124.10421836228285" y="184.42969396195204" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen 5h</text><text x="253.46732837055416" y="252.62655086848633" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Objeto h</text><text x="343.4590570719603" y="296.91935483870964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="323.7733664185277" y="320.12034739454094" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El aumento satisface −s′/s = 5, así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que s′ = −5s.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye en 1/5 = 1/s + 1/s′. Esto da</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/5 = 4/(5s), luego s = 4 cm.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia firmada de la imagen es</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−20 cm. Su separación de la lupa es 20</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>