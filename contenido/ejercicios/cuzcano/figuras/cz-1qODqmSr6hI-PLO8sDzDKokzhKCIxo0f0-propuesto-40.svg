<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Rango de una altura partida por bisectriz</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,350.81 362.81,350.81 362.81,188.19 100.90,350.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,350.81 362.81,276.11" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="349.57,350.81 349.57,337.57 362.81,337.57" fill="none" stroke="#008674" stroke-width="2.5"/><text x="374.15127919911015" y="232.15294771968848" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">nx</text><text x="375.0967741935484" y="313.4604603293815" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n</text><text x="151.01446051167966" y="334.7340977042424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="144.3959955506118" y="302.5872678933414" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea t=tan α=n/base, con α la mitad del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo. Como 0&lt;2α&lt;90°, se cumple</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0&lt;t&lt;1.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente del ángulo total es t(1+x)</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y también 2t/(1−t²). De ahí</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=(1+t²)/(1−t²).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al crecer t de 0 a 1, esa función</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">crece de 1 a infinito, sin alcanzar</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ninguno de los extremos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>