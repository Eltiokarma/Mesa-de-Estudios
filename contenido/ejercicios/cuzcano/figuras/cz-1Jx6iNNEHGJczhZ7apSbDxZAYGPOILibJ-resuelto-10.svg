<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Elipse de ejes coordenados que pasa por dos puntos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="237.99999999999997" y1="105" x2="237.99999999999997" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="319.99,269.50 319.81,261.19 319.29,252.92 318.41,244.72 317.19,236.63 315.64,228.67 313.75,220.89 311.53,213.32 309.00,205.99 306.17,198.93 303.05,192.18 299.64,185.75 295.97,179.69 292.06,174.00 287.91,168.73 283.55,163.89 278.99,159.50 274.26,155.58 269.38,152.15 264.35,149.22 259.22,146.81 254.00,144.92 248.70,143.57 243.36,142.76 238.00,142.48 232.64,142.76 227.30,143.57 222.00,144.92 216.78,146.81 211.65,149.22 206.62,152.15 201.74,155.58 197.01,159.50 192.45,163.89 188.09,168.73 183.94,174.00 180.03,179.69 176.36,185.75 172.95,192.18 169.83,198.93 167.00,205.99 164.47,213.32 162.25,220.89 160.36,228.67 158.81,236.63 157.59,244.72 156.71,252.92 156.19,261.19 156.01,269.50 156.19,277.81 156.71,286.08 157.59,294.28 158.81,302.37 160.36,310.33 162.25,318.11 164.47,325.68 167.00,333.01 169.83,340.07 172.95,346.82 176.36,353.25 180.03,359.31 183.94,365.00 188.09,370.27 192.45,375.11 197.01,379.50 201.74,383.42 206.62,386.85 211.65,389.78 216.78,392.19 222.00,394.08 227.30,395.43 232.64,396.24 238.00,396.52 243.36,396.24 248.70,395.43 254.00,394.08 259.22,392.19 264.35,389.78 269.38,386.85 274.26,383.42 278.99,379.50 283.55,375.11 287.91,370.27 292.06,365.00 295.97,359.31 299.64,353.25 303.05,346.82 306.17,340.07 309.00,333.01 311.53,325.68 313.75,318.11 315.64,310.33 317.19,302.37 318.41,294.28 319.29,286.08 319.81,277.81 319.99,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><circle cx="187.79246658502825" cy="169.0849331700565" r="3.7" fill="#20364b"/><text x="194.79246658502825" y="161.0849331700565" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A(−2,4)</text><circle cx="313.3113001224576" cy="319.70753341497175" r="3.7" fill="#20364b"/><text x="320.3113001224576" y="311.70753341497175" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B(3,−2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Plantea ux²+vy²=1. Los puntos dados</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">producen 4u+16v=1 y 9u+4v=1.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta la primera ecuación de cuatro</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">veces la segunda. Queda 32u=3.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye para obtener v=5/128.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambos coeficientes son positivos, así</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que la ecuación representa una elipse.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mayor semieje está en y.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>