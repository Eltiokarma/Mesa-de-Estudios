<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Área mínima de un triángulo rectángulo de alturas recíprocas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="131.06,290.23 187.59,346.76 344.94,189.41" fill="#f4c581" fill-opacity="0.45"/><polyline points="131.06,346.76 131.06,290.23 187.59,346.76 344.94,189.41 344.94,346.76 131.06,346.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="131.06,290.23 344.94,189.41" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="175.34,334.51 187.59,322.27 199.84,334.51" fill="none" stroke="#008674" stroke-width="2.5"/><text x="131.05509367032482" y="271.38449174149207" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="187.58984591508704" y="367.4935705575878" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="344.9449063296752" y="171.50642944241213" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="100.90322580645162" y="318.49678527879394" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">tan θ</text><text x="375.09677419354836" y="271.38449174149207" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">cot θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama x al ángulo agudo de BA con la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal hacia la izquierda. Por la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicularidad, BC forma el ángulo</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π/2−x con la horizontal hacia la</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así AB=tan θ/sen x y BC=cot θ/cos x.</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su producto es 1/(sen x cos x).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área de ABC vale 1/sen(2x). El</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mínimo se alcanza con x=π/4, cuando</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen(2x)=1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>