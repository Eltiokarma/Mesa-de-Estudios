<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">391 · Solubilidad del cloruro de potasio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="63.333333333333336" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="79.66666666666667" y="161.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">T (°C)</text><rect x="111.33333333333334" y="130" width="63.333333333333336" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="143.0" y="161.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">0</text><rect x="174.66666666666669" y="130" width="63.333333333333336" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="206.33333333333334" y="161.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">20</text><rect x="238.0" y="130" width="63.333333333333336" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="269.6666666666667" y="161.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">40</text><rect x="301.33333333333337" y="130" width="63.333333333333336" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="333.00000000000006" y="161.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">60</text><rect x="364.6666666666667" y="130" width="63.333333333333336" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="396.33333333333337" y="161.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">100</text><rect x="48.0" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="79.66666666666667" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">g/100 g</text><rect x="111.33333333333334" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">27,6</text><rect x="174.66666666666669" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="206.33333333333334" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">34</text><rect x="238.0" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="269.6666666666667" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">40</text><rect x="301.33333333333337" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.00000000000006" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">45,5</text><rect x="364.6666666666667" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="396.33333333333337" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">56,7</text><text x="48" y="253" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Solubilidad del KCl en agua</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La solubilidad de KCl sube con la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">temperatura, consistente con un</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proceso de disolución endotérmico.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A 40 °C, la masa total de solución</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">saturada es 100+40=140 g. Su</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">concentración es 100(40/140)≈28,57 %.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">KCl en agua aporta K⁺ y Cl⁻, por lo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que es una solución iónica.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>