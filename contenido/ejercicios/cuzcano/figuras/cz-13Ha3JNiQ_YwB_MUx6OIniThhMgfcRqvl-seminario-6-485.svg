<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">485 · Fórmula y geometría de un bromohexeno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,239.30 155.74,270.40 210.58,239.30 265.42,270.40 320.26,239.30 375.10,270.40" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="216.06,230.95 259.94,255.83" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="320.26,239.30 320.26,285.13" fill="none" stroke="#008674" stroke-width="2.5"/><text x="320.258064516129" y="308.05079441502164" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Br</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cadena contiene seis carbonos y un</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">doble enlace. El hidrocarburo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">correspondiente es C₆H₁₂; reemplazar</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un H por Br da C₆H₁₁Br.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El doble enlace está en 3 desde ambos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos. Numera para que el Br quede</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en 2.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los segmentos carbonados unidos al</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">doble enlace quedan en lados opuestos.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La configuración es trans o E.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>