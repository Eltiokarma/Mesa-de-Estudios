<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">506 · Conteo de carbonos por número de vecinos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,267.05 135.18,286.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="135.18,286.64 169.45,267.05" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="169.45,267.05 203.73,286.64" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="203.73,286.64 238.00,267.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,267.05 272.27,286.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="272.27,286.64 306.55,267.05" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="306.55,267.05 340.82,286.64" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="340.82,286.64 375.10,267.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="169.45,267.05 171.90,227.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="171.90,227.88 197.85,209.28" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="169.45,267.05 169.45,312.10" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="272.27,286.64 272.27,223.96" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="306.55,267.05 306.55,318.46" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="340.82,286.64 354.04,329.72" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay siete CH₃ terminales: uno a la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda, uno en el etilo, uno en el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">carbono central, dos en los CH</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intermedios y dos en el CH derecho.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay cuatro CH₂: uno antes del centro,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos después y uno en la rama etilo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los tres CH ramificados tienen tres</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vecinos. El C central, sin H, tiene</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuatro.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>