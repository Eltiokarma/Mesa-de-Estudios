<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Altura que deja treinta grados entre dos visuales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="192.42,385.58 276.63,385.58 276.63,142.48 192.42,385.58 276.63,312.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="225.23761382929462" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2√3</text><text x="283.579950609662" y="351.5439110973916" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="283.579950609662" y="232.42830683747493" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7</text><text x="211.13821577403917" y="344.25111899984563" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las pendientes de los rayos son</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x/(2√3) y (x+7)/(2√3). La diferencia</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de pendientes es 7/(2√3).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala la tangente del ángulo entre</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ellos a 1/√3. Resulta 1+x(x+7)/12=7/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ecuación x²+7x−30=0 tiene raíces 3</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y −10. La altura positiva es 3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>