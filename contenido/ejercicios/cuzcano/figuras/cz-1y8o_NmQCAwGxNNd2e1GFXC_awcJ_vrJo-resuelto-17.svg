<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Distancia entre dos vértices de cuadrados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.56,360.72 110.56,177.21 294.07,177.21 294.07,360.72 110.56,360.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="294.07,360.72 258.66,288.28 330.02,252.87 364.37,324.23 294.07,360.72" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="294.07,177.21 364.37,324.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.56,360.72 364.37,324.23" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645159" y="371.9872167161164" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="103.58613723881065" y="167.5493655703554" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="294.6094312227764" y="167.0127832838836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="295.68259579572" y="371.9872167161164" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="251.68284830503126" y="285.0608863076826" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="339.1457609999369" y="250.1830376870147" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="375.0967741935484" y="324.231393220125" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="330.5604444163879" y="308.6705069124424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="350.413989015845" y="241.5977211034657" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ON=7</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma O=(0,0), N=(0,7) y A=(5,0), pues</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OA=OT y OA⊥ON.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lado AD del cuadrado DINA se</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene girando AN=(−5,7) un cuarto de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vuelta hacia el lado de D en la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">figura. Así AD=(7,5).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces D=(12,5), y DO=√(12²+5²).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>