<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">505 · Pantalla mínima de proyector</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">u (cm)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">v (cm)</text><polyline points="311.12,142.48 312.18,155.27 313.25,166.72 314.32,177.03 315.38,186.36 316.45,194.86 317.52,202.62 318.58,209.73 319.65,216.28 320.72,222.33 321.78,227.94 322.85,233.14 323.91,237.99 324.98,242.52 326.05,246.75 327.11,250.72 328.18,254.46 329.25,257.97 330.31,261.28 331.38,264.41 332.44,267.38 333.51,270.18 334.58,272.85 335.64,275.38 336.71,277.78 337.78,280.08 338.84,282.26 339.91,284.35 340.97,286.35 342.04,288.26 343.11,290.08 344.17,291.84 345.24,293.52 346.31,295.13 347.37,296.68 348.44,298.17 349.51,299.61 350.57,300.99 351.64,302.32 352.70,303.60 353.77,304.84 354.84,306.04 355.90,307.20 356.97,308.31 358.04,309.40 359.10,310.44 360.17,311.46 361.23,312.44 362.30,313.39 363.37,314.31 364.43,315.21 365.50,316.08 366.57,316.92 367.63,317.74 368.70,318.54 369.77,319.31 370.83,320.06 371.90,320.80 372.96,321.51 374.03,322.21 375.10,322.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">imagen real</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una pantalla requiere v&gt;0, por lo que</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">u&gt;21 cm.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">v=fu/(u−f) disminuye cuando u aumenta</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en ese intervalo.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mínimo se alcanza en u=30:</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">v=21·30/9=70 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>