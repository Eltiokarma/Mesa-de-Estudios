<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Altura del punto de reflexión</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,309.60 258.37,309.60" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="243.67,314.64 243.67,220.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="117.70,238.22 243.67,263.41 159.69,280.21" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="243.67,263.41 369.64,238.22" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="116.01956231783828" y="229.81961665761006" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A: 170 cm</text><text x="159.68897890628858" y="289.4451662303018" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B: 70 cm</text><text x="247.02781208318925" y="262.15178086252035" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="138.69406708491823" y="318.4181445437929" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="201.67880254902929" y="318.4181445437929" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2a</text><text x="375.0967741935484" y="235.69819196759377" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen de A</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja el ojo de A a una distancia 3a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">al otro lado del espejo. Su imagen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva la altura de 170 cm.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde B hasta la imagen hay un avance</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal total de 5a y una subida de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">100 cm.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al alcanzar el espejo se han recorrido</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2a de 5a. La altura es 70 cm +</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(2/5)(100 cm) = 110 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>