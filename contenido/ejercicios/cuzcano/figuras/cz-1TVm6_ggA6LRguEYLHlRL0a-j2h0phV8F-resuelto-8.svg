<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Una distancia entre dos puntos reflejados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.21,329.76 239.41,207.36 366.62,329.76 112.21,329.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="168.74,329.76 239.41,207.36 310.08,329.76" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="340.1231232582396" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="235.6443853231349" y="196.99238500026829" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="340.1231232582396" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="164.0336991464361" y="342.0076149997317" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="305.37057975834165" y="342.0076149997317" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P′</text><text x="136.70856889480103" y="342.0076149997317" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="267.6807449285002" y="342.0076149997317" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7</text><text x="231.87540184015074" y="240.335695054586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja P sobre el eje de simetría del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo y llama P′ a su imagen.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces AP′=7 y PP′=7−2=5.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por reflexión, ∠P′BC=β. De las dos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cotas en B sale ∠PBP′=60°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como BP=BP′, ese ángulo de vértice de</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60° hace equilátero a BPP′. Entonces</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BP=PP′.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>