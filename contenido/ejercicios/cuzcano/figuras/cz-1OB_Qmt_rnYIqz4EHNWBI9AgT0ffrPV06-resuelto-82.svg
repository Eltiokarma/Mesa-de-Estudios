73.69,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Círculo unitario</text><polyline points="102.31,142.48 246.67,142.48 342.03,353.40 102.31,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Triángulo</text><circle cx="151.31129829877693" cy="185.59553290203704" r="3.7" fill="#20364b"/><text x="158.31129829877693" y="177.59553290203704" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="342.02718578952664" cy="353.404467097963" r="3.7" fill="#20364b"/><text x="349.02718578952664" y="345.404467097963" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><circle cx="102.31462892359019" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="109.31462892359019" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="246.6692420441518" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="253.6692420441518" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="246.6692420441518" cy="269.5" r="3.7" fill="#20364b"/><text x="253.6692420441518" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T=(cot θ,1) por escalar el radio OM a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ordenada 1.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La base TB mide −cot θ. La altura</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde Q hasta y=1 es 1+sen θ.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área es −cot θ(1+sen θ)/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Distribuye y usa cot θ·sen θ=cos θ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>