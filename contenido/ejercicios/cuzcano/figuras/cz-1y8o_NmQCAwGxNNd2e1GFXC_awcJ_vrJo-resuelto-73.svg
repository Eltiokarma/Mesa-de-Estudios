<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">073 · Perpendicularidad por rotación de dos vectores</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="170.54,365.25 170.54,169.40 366.39,169.40 366.39,365.25 170.54,365.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="116.14,265.15 170.54,169.40 266.29,223.80 211.89,319.55 116.14,265.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="116.14,265.15 311.99,265.15 366.39,169.40" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="211.89,319.55 311.99,265.15 366.39,365.25" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="153.1305683563748" y="380.4831029185868" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="164.01126472094214" y="158.51689708141322" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="370.74449564772146" y="162.8691756272401" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="375.0967741935484" y="373.9546850998464" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="276.0284178187404" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="268.4659498207885" y="212.92037890424987" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="203.18177163338456" y="336.96031746031747" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="320.69329237071173" y="262.9715821812596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="322.8694316436252" y="310.84664618535584" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma P=(0,0), E=(s,0), I=(u,v), con</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">s&gt;0. Por el paralelogramo, S=(u+s,v).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los giros de 90° que construyen los</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrados dan O=(v,−u) y A=(u+s,v−s).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así E→O=(v−s,−u) y E→A=(u,v−s). Son</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares y el ángulo mide 90°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>