25 160.31,243.09 164.88,256.22 169.45,269.50 174.02,282.78 178.59,295.91 183.16,308.75 187.73,321.16 192.30,333.01 196.87,344.16 201.44,354.49 206.01,363.89 210.58,372.26 215.15,379.50 219.72,385.54 224.29,390.30 228.86,393.74 233.43,395.82 238.00,396.52 242.57,395.82 247.14,393.74 251.71,390.30 256.28,385.54 260.85,379.50 265.42,372.26 269.99,363.89 274.56,354.49 279.13,344.16 283.70,333.01 288.27,321.16 292.84,308.75 297.41,295.91 301.98,282.78 306.55,269.50 311.12,256.22 315.69,243.09 320.26,230.25 324.83,217.84 329.40,205.99 333.97,194.84 338.54,184.51 343.11,175.11 347.68,166.74 352.25,159.50 356.82,153.46 361.39,148.70 365.96,145.26 370.53,143.18 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">cos x</text><polyline points="100.90,205.99 375.10,205.99" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">umbral 1/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La primera raíz exige sen x≥1/2, que</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se cumple en [π/6,5π/6].</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La segunda exige cos x≥1/2, que se</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cumple en [0,π/3] y [5π/3,2π].</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Interseca los conjuntos. El único</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tramo común va de π/6 a π/3 con ambos</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos incluidos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>