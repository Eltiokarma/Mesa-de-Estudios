<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">508 · Identificación de una cadena por sus grados de carbono</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="183.56,175.79 212.17,192.01 240.78,175.79 269.38,192.01 297.99,175.79" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="240.78,175.79 240.78,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="240.78,175.79 240.78,213.36" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="240.78,213.36 222.42,240.25" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="240.78,213.36 259.13,240.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="183.56,276.12 212.17,292.34 240.78,276.12 269.38,292.34 297.99,276.12" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="212.17,292.34 212.17,259.04" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="240.78,276.12 240.78,314.54" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="183.56,365.78 212.17,382.00 240.78,365.78 269.38,382.00 297.99,365.78 326.59,382.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="212.17,382.00 212.17,351.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="240.78,365.78 240.78,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="297.99,365.78 297.99,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="149.4089184060721" y="185.1783681214421" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="149.4089184060721" y="285.51043643263756" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">II</text><text x="149.4089184060721" y="375.16888045540793" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">III</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I tiene cinco CH₃, dos CH₂, un CH y un</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C unido a cuatro carbonos. Coincide</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con todos los recuentos.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">II tiene cuatro CH₃, un CH₂ y dos CH.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">No contiene carbono cuaternario.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">III tiene cinco CH₃, un CH₂ y tres CH.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tampoco contiene carbono cuaternario.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>