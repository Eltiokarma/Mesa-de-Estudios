<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">064 · Longitud sobre la prolongación de la base</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="157.94,384.20 217.22,150.18 281.11,384.20 157.94,384.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="157.94,384.20 260.32,307.22" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="260.32,307.22 318.06,384.20 281.11,384.20" fill="none" stroke="#008674" stroke-width="2.5"/><text x="151.01319648093846" y="394.20674486803523" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="217.21554252199414" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="281.108504398827" y="394.9765395894429" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="260.3240469208211" y="299.52199413489734" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="324.98680351906154" y="393.4369501466276" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="280.33870967741933" y="343.400293255132" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16 m</text><text x="218.7551319648094" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">26 m</text><text x="302.66275659824043" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CQ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea β=∠C y toma A=(0,0), C=(26,0).</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces P=(26−16cosβ,16senβ).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como AP forma β/2 con AC,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">26−16cosβ=16senβ/tan(β/2)=16(1+cosβ),</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de donde cosβ=5/16.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La proyección horizontal de P a Q es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">16senβ·tan(β/2)=16(1−cosβ). Entonces</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CQ=16(1−2cosβ).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>