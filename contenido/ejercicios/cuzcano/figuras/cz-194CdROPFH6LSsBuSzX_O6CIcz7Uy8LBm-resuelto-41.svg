nts="100.90,352.10 348.01,352.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,352.10 204.95,171.89" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="178.94,216.94 269.97,374.62" fill="none" stroke="#b0467a" stroke-width="2.5"/><circle cx="204.94716639294978" cy="352.0959710196007" r="3.7" fill="#20364b"/><text x="211.94716639294978" y="344.0959710196007" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H</text><circle cx="256.9691366861989" cy="352.0959710196007" r="3.7" fill="#20364b"/><text x="263.9691366861989" y="344.0959710196007" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="335.0020921260725" cy="352.0959710196007" r="3.7" fill="#20364b"/><text x="342.0020921260725" y="344.0959710196007" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">S</text><circle cx="269.9746292595112" cy="374.62214493403724" r="3.7" fill="#20364b"/><text x="276.9746292595112" y="366.62214493403724" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="178.93618124632525" cy="216.93892753298135" r="3.7" fill="#20364b"/><text x="185.93618124632525" y="208.93892753298135" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="269.9746292595112" cy="269.5" r="3.7" fill="#20364b"/><text x="276.9746292595112" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La potencia interior da AP·2=4·6, así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que AP=12. El centro se alinea</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verticalmente con T y con el punto</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio de HS, que queda una unidad a la</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha de A.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si A=(a,√3), entonces T=(a+1,0) y,</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">siguiendo la cuerda, P=(a−6,7√3). Con</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">centro (a+1,r), la igualdad CP=CT da</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r=14/√3.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de la tangente a P es √3</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">porque CP tiene pendiente −1/√3. Su</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corte con el eje Y está a altura √3,</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de donde a=12.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>