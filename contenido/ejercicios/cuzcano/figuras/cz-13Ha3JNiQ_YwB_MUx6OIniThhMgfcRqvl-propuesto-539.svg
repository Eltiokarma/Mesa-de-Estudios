<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">539 · Un éster aromático con grupo amino</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,192.98 304.26,231.24 304.26,307.76 238.00,346.02 171.74,307.76 171.74,231.24 238.00,192.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,192.98 238.00,160.85" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,346.02 238.00,378.15" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,220.53 244.39,220.95 250.67,222.20 256.74,224.26 262.49,227.09 267.81,230.65 272.63,234.87 276.85,239.69 280.41,245.01 283.24,250.76 285.30,256.83 286.55,263.11 286.97,269.50 286.55,275.89 285.30,282.17 283.24,288.24 280.41,293.99 276.85,299.31 272.63,304.13 267.81,308.35 262.49,311.91 256.74,314.74 250.67,316.80 244.39,318.05 238.00,318.47 231.61,318.05 225.33,316.80 219.26,314.74 213.51,311.91 208.19,308.35 203.37,304.13 199.15,299.31 195.59,293.99 192.76,288.24 190.70,282.17 189.45,275.89 189.03,269.50 189.45,263.11 190.70,256.83 192.76,250.76 195.59,245.01 199.15,239.69 203.37,234.87 208.19,230.65 213.51,227.09 219.26,224.26 225.33,222.20 231.61,220.95 238.00,220.53" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="238.0" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">COOCH₃</text><text x="238.0" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">NH₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El grupo –NH₂ sí es una amina.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El carbonilo está unido a OCH₃, por lo</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que pertenece a un éster. El oxígeno</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de ese grupo no se cuenta aparte como</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">éter.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I y II son falsas porque faltan éter y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cetona. III es verdadera.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>