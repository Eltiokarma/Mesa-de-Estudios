<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Verseno y exclusión de los polos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Un período con una exclusión</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="152.5" y1="275" x2="240.0" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="152.5" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><circle cx="240.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><line x1="240.0" y1="275" x2="327.5" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="240.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="327.5" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="152.5" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">−π/6</text><text x="240.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">0</text><text x="327.5" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/6</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sean s=sen x y c=cos x. El dominio</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exige sc≠0. Además vers(4x)=2sen²</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x=8s²c².</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La diferencia cot² x−tan² x es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(c⁴−s⁴)/(s²c²)=cos 2x/(s²c²).</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica la desigualdad por s²c²</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivo.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Queda cos 2x≥1/2. Esto da el intervalo</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cerrado de radio π/6 alrededor de kπ,</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con kπ excluido por el dominio.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>