<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Mezclas sin orden</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">categorías</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">cantidad</text><polyline points="100.90,396.52 100.90,205.99 131.37,205.99 131.37,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="161.84,396.52 161.84,142.48 192.30,142.48 192.30,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="222.77,396.52 222.77,205.99 253.23,205.99 253.23,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="283.70,396.52 283.70,320.31 314.16,320.31 314.16,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="344.63,396.52 344.63,383.81 375.10,383.81 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><circle cx="116.13620071684588" cy="205.99193548387095" r="3.7" fill="#20364b"/><text x="123.13620071684588" y="197.99193548387095" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">15</text><circle cx="177.06810035842295" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="184.06810035842295" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">20</text><circle cx="238.0" cy="205.99193548387095" r="3.7" fill="#20364b"/><text x="245.0" y="197.99193548387095" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">15</text><circle cx="298.93189964157705" cy="320.30645161290323" r="3.7" fill="#20364b"/><text x="305.93189964157705" y="312.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">6</text><circle cx="359.8637992831541" cy="383.81451612903226" r="3.7" fill="#20364b"/><text x="366.8637992831541" y="375.81451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada mezcla se identifica con un</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">subconjunto de los6 tipos; no importa</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el orden.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay2^6=64 subconjuntos.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Excluir el vacío y los6 vinos sin</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mezclar:64−1−6=57.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>