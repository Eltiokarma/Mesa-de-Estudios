<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Rango de un seno con un valor absoluto en el segundo cuadrante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.48387096774195" x2="421" y2="142.48387096774195" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="347.68,349.90 348.13,350.80 348.59,351.70 349.05,352.60 349.51,353.49 349.96,354.38 350.42,355.26 350.88,356.14 351.33,357.01 351.79,357.88 352.25,358.75 352.70,359.61 353.16,360.47 353.62,361.33 354.08,362.18 354.53,363.02 354.99,363.86 355.45,364.70 355.90,365.53 356.36,366.36 356.82,367.19 357.27,368.01 357.73,368.83 358.19,369.64 358.65,370.45 359.10,371.25 359.56,372.05 360.02,372.84 360.47,373.63 360.93,374.42 361.39,375.20 361.84,375.98 362.30,376.75 362.76,377.52 363.22,378.28 363.67,379.04 364.13,379.79 364.59,380.54 365.04,381.29 365.50,382.03 365.96,382.77 366.41,383.50 366.87,384.23 367.33,384.95 367.78,385.67 368.24,386.38 368.70,387.09 369.16,387.79 369.61,388.49 370.07,389.19 370.53,389.88 370.98,390.56 371.44,391.24 371.90,391.92 372.35,392.59 372.81,393.26 373.27,393.92 373.73,394.57 374.18,395.23 374.64,395.87 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el segundo cuadrante, cos x−sen x</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es negativo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al quitar el valor absoluto queda sen</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x−(sen x−cos x)=cos x.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El coseno decrece en ese tramo. Evalúa</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ambos extremos, que están incluidos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>