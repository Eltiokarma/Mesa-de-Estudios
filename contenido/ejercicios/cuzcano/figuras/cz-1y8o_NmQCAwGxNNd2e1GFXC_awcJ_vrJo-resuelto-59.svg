<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">059 · Medianas de dos triángulos con datos incompatibles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.59,316.03 212.81,244.56 371.62,244.56 268.40,316.03 109.59,316.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.59,316.03 141.35,220.74 320.01,280.29" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="133.41,244.56 212.81,244.56" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="141.35,220.74 268.40,316.03" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="324.7109181141439" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="269.63771712158814" y="325.9516129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="212.56575682382135" y="236.62158808933003" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="375.0967741935484" y="244.06575682382135" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="138.1240694789082" y="213.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="124.47642679900744" y="241.58436724565757" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="170.38213399503724" y="252.75062034739454" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="182.7890818858561" y="268.87965260545906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="324.22828784119105" y="287.49007444168734" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="148.0496277915633" y="239.1029776674938" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="232.41687344913151" y="280.045905707196" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">SA=9 (impreso)</text><text x="179.06699751861044" y="324.7109181141439" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prolonga EI hasta la recta LA en U. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simetría central de centro P lleva M a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A e I a U, luego AU=16. El triángulo</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">LEU es rectángulo en E y EA=16 por ser</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la mediana a LU. La sección paralela</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos IOS y LAS son</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semejantes porque OI∥LA, S está en LI</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y O, S, A son colineales. Así</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">SO/SA=OI/LA=4/16=1/4. Además,</text><text x="482" y="315" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">SO+SA=EA−EO=12.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De las dos relaciones salen SA=48/5 y</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">SO=12/5. El SA=9 impreso contradice</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esta construcción: al usar 9, la</text><text x="482" y="422" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semejanza exigiría SO=9/4 mientras que</text><text x="482" y="445" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la resta de medianas daría 3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>