<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Un cilindro sostenido por una cuerda tangente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="375.10,254.23 373.41,271.34 368.42,287.80 360.31,302.96 349.41,316.26 336.11,327.16 320.95,335.27 304.49,340.26 287.38,341.95 270.27,340.26 253.81,335.27 238.65,327.16 225.36,316.26 214.45,302.96 206.34,287.80 201.35,271.34 199.66,254.23 201.35,237.12 206.34,220.66 214.45,205.50 225.36,192.21 238.65,181.30 253.81,173.19 270.27,168.20 287.38,166.51 304.49,168.20 320.95,173.19 336.11,181.30 349.41,192.21 360.31,205.50 368.42,220.66 373.41,237.12 375.10,254.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,166.51 322.47,388.08 227.60,388.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,166.51 287.38,166.51" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="287.38,166.51 147.69,166.51" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="163.93,158.39 147.69,166.51 163.93,174.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="287.38,254.23 287.38,330.25" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="279.26,314.01 287.38,330.25 295.50,314.01" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="225.33,316.28 297.13,244.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="291.38,261.71 297.13,244.48 279.90,250.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="225.33,316.28 174.97,265.93" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="192.20,271.67 174.97,265.93 180.72,283.16" fill="none" stroke="#008674" stroke-width="2.5"/><text x="154.18254089588748" y="150.92103653875557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="301.6752790093258" y="328.3021709218774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">mg</text><text x="264.6396575447179" y="265.2766396575447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="171.0759822657086" y="279.57109004739334" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">f</text><text x="297.1270447943739" y="380.281990521327" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto del centro, peso y normal no</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ejercen momento. La tensión en la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">parte superior y el rozamiento rampa</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arriba tienen brazos de palanca</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iguales al radio y momentos opuestos.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la dirección de la rampa, el peso</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aporta mg sen θ hacia abajo, la</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tensión aporta T cos θ hacia arriba y</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la fricción aporta f hacia arriba.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por equilibrio, f(1+cos θ)=mg sen θ.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja f.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>