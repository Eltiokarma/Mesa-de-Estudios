<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">045 · Máxima rapidez sin rebasar moto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">t (s)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">x (m)</text><polyline points="100.90,368.29 105.47,366.38 110.04,364.40 114.61,362.36 119.18,360.26 123.75,358.10 128.32,355.87 132.89,353.58 137.46,351.23 142.03,348.81 146.60,346.34 151.17,343.80 155.74,341.19 160.31,338.53 164.88,335.80 169.45,333.01 174.02,330.15 178.59,327.24 183.16,324.26 187.73,321.22 192.30,318.11 196.87,314.94 201.44,311.71 206.01,308.42 210.58,305.06 215.15,301.65 219.72,298.16 224.29,294.62 228.86,291.01 233.43,287.34 238.00,283.61 242.57,279.82 247.14,275.96 251.71,272.04 256.28,268.06 260.85,264.01 265.42,259.90 269.99,255.73 274.56,251.50 279.13,247.20 283.70,242.84 288.27,238.42 292.84,233.94 297.41,229.39 301.98,224.78 306.55,220.10 311.12,215.37 315.69,210.57 320.26,205.71 324.83,200.79 329.40,195.80 333.97,190.75 338.54,185.64 343.11,180.46 347.68,175.23 352.25,169.93 356.82,164.56 361.39,159.14 365.96,153.65 370.53,148.10 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">moto</text><polyline points="100.90,396.52 375.10,170.71" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">auto</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con τ desde la salida del auto,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">xmoto=(τ+10)² y xauto=Vτ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La condición exige</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">V≤(τ+10)²/τ=τ+20+100/τ.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mínimo para τ&gt;0 está en τ=10 y vale</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">40 m/s: hay contacto tangente sin</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rebasar.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>