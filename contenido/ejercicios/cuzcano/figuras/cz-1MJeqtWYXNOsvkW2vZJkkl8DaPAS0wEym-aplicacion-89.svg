<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">089 · Ángulo de una barra sostenida por una masa colgante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="132.86,340.06 132.86,396.52 211.89,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="132.86,396.52 344.55,274.29" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="192.84,161.54 192.60,164.52 191.91,167.42 190.76,170.19 189.20,172.74 187.26,175.01 184.99,176.95 182.44,178.51 179.67,179.66 176.77,180.35 173.79,180.59 170.81,180.35 167.90,179.66 165.14,178.51 162.59,176.95 160.31,175.01 158.37,172.74 156.81,170.19 155.67,167.42 154.97,164.52 154.73,161.54 154.97,158.56 155.67,155.65 156.81,152.89 158.37,150.34 160.31,148.06 162.59,146.12 165.14,144.56 167.90,143.42 170.81,142.72 173.79,142.48 176.77,142.72 179.67,143.42 182.44,144.56 184.99,146.12 187.26,148.06 189.20,150.34 190.76,152.89 191.91,155.65 192.60,158.56 192.84,161.54" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="185.08,143.90 344.55,274.29" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="154.73,161.54 154.73,241.27" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="131.45,241.27 178.02,241.27 178.02,278.67 131.45,278.67 131.45,241.27" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="149.7943548387097" y="370.4072580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="312.79838709677415" y="267.383064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="154.73387096774195" y="261.0322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m</text><text x="243.64516129032256" y="347.8266129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tensión del cable vale mg. Respecto</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del apoyo, su brazo es ℓ sen 2θ, donde</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ℓ es la longitud de la barra.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El peso 2mg actúa en el centro con</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">brazo (ℓ/2)sen θ. Al igualar momentos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y cancelar mgℓ queda sen 2θ=sen θ.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye sen 2θ=2 sen θ cos θ. Como</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la barra está inclinada y sen θ&gt;0,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resulta cos θ=1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>