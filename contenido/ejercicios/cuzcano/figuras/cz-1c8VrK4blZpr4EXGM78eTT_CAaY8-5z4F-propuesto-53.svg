<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">053 · Mediana a partir de la clase modal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130.0" width="190.0" height="41.42857142857143" fill="#dfedf8" stroke="#a3b9cc"/><text x="143.0" y="156.92857142857144" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Intervalo</text><rect x="238.0" y="130.0" width="190.0" height="41.42857142857143" fill="#dfedf8" stroke="#a3b9cc"/><text x="333.0" y="156.92857142857144" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">fᵢ</text><rect x="48.0" y="171.42857142857144" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="198.3571428571429" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[10,20)</text><rect x="238.0" y="171.42857142857144" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="198.3571428571429" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">m</text><rect x="48.0" y="212.85714285714286" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="239.78571428571428" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[20,30)</text><rect x="238.0" y="212.85714285714286" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="239.78571428571428" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3n</text><rect x="48.0" y="254.28571428571428" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[30,40)</text><rect x="238.0" y="254.28571428571428" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">5n</text><rect x="48.0" y="295.7142857142857" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[40,50)</text><rect x="238.0" y="295.7142857142857" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4n</text><rect x="48.0" y="337.14285714285717" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[50,60)</text><rect x="238.0" y="337.14285714285717" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2m</text><rect x="48.0" y="378.57142857142856" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[60,70)</text><rect x="238.0" y="378.57142857142856" width="190.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">5m</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Distribución de 120 observaciones</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La moda agrupada es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">30+10(5n−3n)/[(5n−3n)+(5n−4n)]=36,666…</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La clase de frecuencia 5n es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">estrictamente modal, por lo que n&gt;m.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con m,n enteros positivos y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">8m+12n=120, la única pareja que cumple</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es m=3 y n=8.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay 27 observaciones antes de la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tercera clase y 40 dentro. La posición</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60 cae a 33/40 del ancho desde 30.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>