<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">501 · Relación entre estructuras y tipos de cadena</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="322.77,203.66 287.45,264.84 216.81,264.84 181.49,203.66 216.81,142.48 287.45,142.48 322.77,203.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="275.02,253.22 229.24,253.22" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="229.24,154.11 275.02,154.11" fill="none" stroke="#008674" stroke-width="2.5"/><text x="124.97198510458847" y="205.78135389625112" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="351.02801489541156" y="316.69009351237366" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃CH₂CH₂CH₃</text><text x="195.6144944142207" y="318.8093687916627" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">II</text><text x="351.02801489541156" y="394.3968537529691" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃CH(CH₃)C(CH₂CH₃)₂CH₃</text><text x="195.6144944142207" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">III</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I es un anillo de seis carbonos, así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que corresponde a b.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">II es butano. Solo tiene un camino</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lineal entre sus extremos, de modo que</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corresponde a a.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En III hay carbonos con tres y cuatro</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vecinos carbonados. Es ramificada y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corresponde a c.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>