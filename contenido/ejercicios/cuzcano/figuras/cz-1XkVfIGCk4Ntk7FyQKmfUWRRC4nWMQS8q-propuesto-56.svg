<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">056 · Tres raíces de un cubo cuyo argumento es obtuso</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,269.50 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,142.48 238.00,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="335.70,269.50 334.22,252.53 329.81,236.08 322.61,220.65 312.85,206.70 300.80,194.65 286.85,184.89 271.42,177.69 254.97,173.28 238.00,171.80 221.03,173.28 204.58,177.69 189.15,184.89 175.20,194.65 163.15,206.70 153.39,220.65 146.19,236.08 141.78,252.53 140.30,269.50 141.78,286.47 146.19,302.92 153.39,318.35 163.15,332.30 175.20,344.35 189.15,354.11 204.58,361.31 221.03,365.72 238.00,367.20 254.97,365.72 271.42,361.31 286.85,354.11 300.80,344.35 312.85,332.30 322.61,318.35 329.81,302.92 334.22,286.47 335.70,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,269.50 307.09,200.41" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,269.50 143.62,244.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,269.50 263.29,363.88" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="365.01612903225805" y="281.22456575682384" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Re</text><text x="250.70161290322582" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Im</text><text x="316.75993955461826" y="190.74006044538177" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z1</text><text x="130.41192176786464" y="240.67186132248284" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z2</text><text x="266.828138677517" y="377.0880782321354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe z³=e^(iφ), con φ en el segundo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrante. La diferencia con su</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recíproco es 2i sen φ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El módulo exige sen φ=√2/2, lo que en</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el intervalo da φ=3π/4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las tres raíces tienen argumentos</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π/4+2kπ/3 para k=0, 1, 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>