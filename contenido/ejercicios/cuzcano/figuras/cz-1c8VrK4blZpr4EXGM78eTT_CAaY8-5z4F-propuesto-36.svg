<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Interpolar en una ojiva acumulada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">Límite del intervalo</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Frecuencia acumulada / m</text><polyline points="203.73,396.52 238.00,393.13 272.27,311.84 306.55,227.16 340.82,145.87 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Ojiva</text><circle cx="249.4247311827957" cy="366.0322580645161" r="3.7" fill="#20364b"/><text x="256.4247311827957" y="358.0322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">26</text><circle cx="329.3978494623656" cy="172.96774193548384" r="3.7" fill="#20364b"/><text x="336.3978494623656" y="164.96774193548384" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">40</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el tramo de 24 a 30,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F(26)=a+(m−a)/3. Al igualarlo con</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,12×3m se obtiene a=m/25.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el tramo de 36 a 42,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F(40)=2m+(2/3)(m−a)=2,64m.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta F(26)=0,36m. El intervalo</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contiene 2,28m de 3m observaciones.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>