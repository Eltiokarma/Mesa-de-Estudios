<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">115 · Puntos enteros de un disco bajo una condición de producto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="110.98387096774195" y1="105" x2="110.98387096774195" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="365.02,269.50 364.62,259.53 363.45,249.63 361.51,239.85 358.80,230.25 355.35,220.89 351.17,211.84 346.30,203.13 340.76,194.84 334.58,187.01 327.81,179.69 320.49,172.92 312.66,166.74 304.37,161.20 295.66,156.33 286.61,152.15 277.25,148.70 267.65,145.99 257.87,144.05 247.97,142.88 238.00,142.48 228.03,142.88 218.13,144.05 208.35,145.99 198.75,148.70 189.39,152.15 180.34,156.33 171.63,161.20 163.34,166.74 155.51,172.92 148.19,179.69 141.42,187.01 135.24,194.84 129.70,203.13 124.83,211.84 120.65,220.89 117.20,230.25 114.49,239.85 112.55,249.63 111.38,259.53 110.98,269.50 111.38,279.47 112.55,289.37 114.49,299.15 117.20,308.75 120.65,318.11 124.83,327.16 129.70,335.87 135.24,344.16 141.42,351.99 148.19,359.31 155.51,366.08 163.34,372.26 171.63,377.80 180.34,382.67 189.39,386.85 198.75,390.30 208.35,393.01 218.13,394.95 228.03,396.12 238.00,396.52 247.97,396.12 257.87,394.95 267.65,393.01 277.25,390.30 286.61,386.85 295.66,382.67 304.37,377.80 312.66,372.26 320.49,366.08 327.81,359.31 334.58,351.99 340.76,344.16 346.30,335.87 351.17,327.16 355.35,318.11 358.80,308.75 361.51,299.15 363.45,289.37 364.62,279.47 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">(x−2)²+y²=4</text><circle cx="110.98387096774195" cy="269.5" r="3.7" fill="#20364b"/><text x="117.98387096774195" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,0)</text><circle cx="238.00000000000003" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="245.00000000000003" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2,2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completa cuadrado: (x−2)²+y²≤4. Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">únicas abscisas enteras posibles son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,1,2,3 y 4.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La segunda condición equivale a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(x−1)y≥x. En x=0 solo hay y=0, que</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">satisface. En x=1 es imposible.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x=2 se requiere y≥2 y solo sirve</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=2. En x=3 se requiere y≥3/2, pero el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">disco permite a lo sumo y=1 entero. En</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=4 solo hay y=0, que falla.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>