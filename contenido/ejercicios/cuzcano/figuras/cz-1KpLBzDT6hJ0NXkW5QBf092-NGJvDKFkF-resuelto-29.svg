<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Dos cocientes en una variable auxiliar</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">α = ½ arcsen[8/(9+√89)]</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="100.0" y1="275" x2="140.00963467681368" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="100.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="140.00963467681368" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><line x1="339.9903653231863" y1="275" x2="380.0" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="339.9903653231863" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="380.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="100.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">0</text><text x="140.00963467681368" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">α</text><text x="339.9903653231863" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/2−α</text><text x="380.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/2</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea u=tan x+cot x=2/sen 2x, con ∣u∣≥2</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y u≠2. Los cocientes se reducen a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">u−1/u y u+2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así 2u−1/u&gt;9. La rama u≤−2 falla. Para</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">u&gt;2 resulta u&gt;(9+√89)/4, o 0&lt;sen</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x&lt;8/(9+√89).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Un intervalo que cumple lo pedido es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">((π−arcsen(2/5))/2, π/2), donde 0&lt;sen</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x&lt;2/5. Los intervalos máximos tienen</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">umbral 8/(9+√89).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>