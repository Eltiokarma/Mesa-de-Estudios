<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Fuerza que equilibra tres vectores tridimensionales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="237.45,269.50 360.35,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="237.45,269.50 229.58,330.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="237.45,269.50 244.33,208.05" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="237.45,269.50 115.53,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="375.09677419354836" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F₁</text><text x="228.63997927192642" y="338.3236818240705" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F₂</text><text x="245.15766290970333" y="200.67631817592954" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F₃</text><text x="100.90322580645162" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F₄</text><text x="237.44941054540743" y="272.6953852275461" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma las componentes x. Resulta</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">500−100=400 N.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma las componentes y y z. Resultan</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−150 N y −300 N, respectivamente.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cambia el signo a cada componente de</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la resultante.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>