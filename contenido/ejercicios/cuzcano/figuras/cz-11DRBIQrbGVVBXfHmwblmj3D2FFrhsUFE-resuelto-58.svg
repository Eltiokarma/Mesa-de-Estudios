<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Distancia desde el punto medio de una bisectriz</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.27,315.57 156.92,218.27 367.73,316.30 108.27,315.57" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="156.92,218.27 156.92,315.57" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="156.92,218.27 198.93,315.57" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="156.92,218.27 237.26,315.57" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="264.53,269.13 264.53,315.57" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="264.53,269.13 220.31,298.61" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="156.92,267.66 179.03,267.66" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645167" y="325.8865764828304" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="157.65834200485608" y="212.37634408602153" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="322.9382587582379" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="150.28754769337502" y="326.6236559139785" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="199.6718695802983" y="326.6236559139785" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="238.0" y="326.6236559139785" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="268.2202566770725" y="263.9719042663892" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="150.28754769337502" y="269.13146028442594" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="184.19320152618803" y="263.9719042663892" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="273.37981269510925" y="297.87755809920225" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="235.05168227540756" y="283.13596947624" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠C=15°. Como BM=CM, ∠MBC=15°. Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancias de P a AC y BM son PC</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen15° y BP sen15°, cuya suma es BH=8.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El pie R de Q sobre BH está a mitad de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la altura, porque Q es punto medio de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BF y F está en AC. Así BR=4.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo entre BH y BF es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">45°−15°=30°. Entonces RQ=4tan30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>