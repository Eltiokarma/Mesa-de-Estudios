<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">033 · Dos espejos devuelven el rayo al origen</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="309.73,167.62 312.27,171.21 314.73,174.80 317.10,178.39 319.39,181.98 321.60,185.57 323.72,189.16 325.77,192.75 327.72,196.34 329.60,199.93 331.39,203.52 333.10,207.11 334.72,210.70 336.26,214.30 337.72,217.89 339.09,221.48 340.38,225.07 341.59,228.66 342.72,232.25 343.76,235.84 344.72,239.43 345.59,243.02 346.38,246.61 347.09,250.20 347.72,253.79 348.26,257.38 348.71,260.97 349.09,264.56 349.38,268.15 349.59,271.74 349.71,275.33 349.76,278.93 349.71,282.52 349.59,286.11 349.38,289.70 349.09,293.29 348.71,296.88 348.26,300.47 347.72,304.06 347.09,307.65 346.38,311.24 345.59,314.83 344.72,318.42 343.76,322.01 342.72,325.60 341.59,329.19 340.38,332.78 339.09,336.37 337.72,339.96 336.26,343.56 334.72,347.15 333.10,350.74 331.39,354.33 329.60,357.92 327.72,361.51 325.77,365.10 323.72,368.69 321.60,372.28 319.39,375.87 317.10,379.46 314.73,383.05 312.27,386.64 309.73,390.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="112.78,161.33 112.78,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="112.78,278.93 349.76,278.93" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="231.27,278.93 335.39,214.30 112.78,252.89 231.27,278.93" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="112.77915194346289" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">espejo plano</text><text x="231.26769634104642" y="294.18511341616323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="260.8898324404423" y="294.18511341616323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="363.2208480565371" y="290.5945514647213" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="290.51196853983816" y="317.52376610053574" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La imagen real que produciría el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">espejo cóncavo solo se encuentra a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">q=fp/(p−f)=120 cm de su vértice.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El espejo plano intercepta el rayo y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">refleja esa posición en A, que está a</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">40 cm del vértice.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El espejo plano queda en el punto</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio de ambas posiciones:</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d=(120+40)/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>