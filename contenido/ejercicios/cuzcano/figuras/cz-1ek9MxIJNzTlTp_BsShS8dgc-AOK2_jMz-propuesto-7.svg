<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Rama invertible de la cosecante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="120.54,142.48 124.78,180.93 129.03,207.75 133.27,227.51 137.51,242.66 141.75,254.65 146.00,264.36 150.24,272.38 154.48,279.12 158.72,284.85 162.97,289.79 167.21,294.08 171.45,297.84 175.69,301.16 179.94,304.11 184.18,306.75 188.42,309.12 192.67,311.26 196.91,313.21 201.15,314.97 205.39,316.59 209.64,318.07 213.88,319.42 218.12,320.67 222.36,321.83 226.61,322.89 230.85,323.88 235.09,324.80 239.33,325.65 243.58,326.44 247.82,327.17 252.06,327.86 256.30,328.50 260.55,329.10 264.79,329.65 269.03,330.17 273.27,330.66 277.52,331.11 281.76,331.54 286.00,331.93 290.24,332.30 294.49,332.64 298.73,332.96 302.97,333.25 307.22,333.53 311.46,333.78 315.70,334.01 319.94,334.22 324.19,334.42 328.43,334.60 332.67,334.76 336.91,334.90 341.16,335.03 345.40,335.14 349.64,335.23 353.88,335.31 358.13,335.38 362.37,335.43 366.61,335.47 370.85,335.49 375.10,335.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">2csc(x/4)+3</text><circle cx="375.09677419354836" cy="335.4956650923566" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="368.09677419354836" y="327.4956650923566" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="end">2π excluido</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con x/2, el argumento recorre (0,π).</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cosecante repite valores a los dos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lados de π/2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con x/3, el argumento recorre</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,2π/3). También hay puntos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simétricos alrededor de π/2 dentro del</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intervalo.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con x/4, el argumento queda en</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,π/2). El seno es estrictamente</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">creciente y positivo, por lo que la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosecante es estrictamente</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">decreciente.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>