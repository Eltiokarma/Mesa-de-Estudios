<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">074 · Parámetros del gráfico</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,257.58 105.47,248.10 110.04,244.13 114.61,241.06 119.18,238.45 123.75,236.12 128.32,234.01 132.89,232.04 137.46,230.19 142.03,228.44 146.60,226.77 151.17,225.16 155.74,223.61 160.31,222.10 164.88,220.64 169.45,219.22 174.02,217.82 178.59,216.45 183.16,215.11 187.73,213.79 192.30,212.48 196.87,211.20 201.44,209.92 206.01,208.66 210.58,207.41 215.15,206.17 219.72,204.93 224.29,203.70 228.86,202.48 233.43,201.25 238.00,200.03 242.57,198.81 247.14,197.59 251.71,196.36 256.28,195.13 260.85,193.90 265.42,192.66 269.99,191.40 274.56,190.14 279.13,188.87 283.70,187.58 288.27,186.28 292.84,184.96 297.41,183.61 301.98,182.24 306.55,180.85 311.12,179.42 315.69,177.96 320.26,176.46 324.83,174.91 329.40,173.30 333.97,171.62 338.54,169.87 343.11,168.03 347.68,166.06 352.25,163.94 356.82,161.62 361.39,159.01 365.96,155.94 370.53,151.97 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Arcoseno escalado</text><polyline points="238.00,396.52 100.90,257.58" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">OP</text><circle cx="100.90322580645162" cy="257.581273698727" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="249.581273698727" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="238.0" cy="200.03257233323447" r="3.7" fill="#20364b"/><text x="245.0" y="192.03257233323447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto x = 0 fija a = 1. Por OP = 1,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P = (cos θ, sen θ).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si c &gt; 0, el extremo izquierdo es x =</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−1/c, así que c = −sec θ. La ordenada</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fija bπ/2 = 1−sen θ.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica a, b, c y π. Cambiar</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simultáneamente los signos de b y c</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">deja invariantes tanto la curva como</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el producto.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>