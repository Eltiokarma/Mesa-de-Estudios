00 247.84,229.19 246.55,233.44 245.43,237.73 244.48,242.07 243.70,246.44 243.09,250.83 242.65,255.25 242.39,259.68 242.31,264.12 242.39,268.56 242.65,272.99 243.09,277.40 243.70,281.80 244.48,286.17 245.43,290.50 246.55,294.80 247.84,299.04 249.29,303.24 250.91,307.37 252.69,311.44 254.62,315.43 256.72,319.34 258.96,323.17 261.35,326.91 263.89,330.55 266.57,334.09 269.39,337.52 272.33,340.84 275.41,344.04 278.61,347.11 281.93,350.06 285.36,352.88 288.90,355.56 292.54,358.09 296.27,360.49 300.10,362.73 304.02,364.82 308.01,366.76 312.08,368.54 316.21,370.15 320.40,371.61 324.65,372.90 328.94,374.02 333.28,374.97 337.65,375.75 342.04,376.36 346.46,376.79 350.89,377.05 355.33,377.14" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="129.28,377.14 129.28,151.10 355.33,151.10 355.33,377.14 129.28,377.14" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="264.91,196.30 264.91,377.14" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="264.91,196.30 355.33,377.14 264.91,331.93" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="264.91,362.07 249.84,362.07 249.84,377.14" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="115.28950246036085" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="116.36591033351559" y="145.71309458720611" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="359.6340896664844" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="360.71049753963916" y="394.3633132859486" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="254.14611809732094" y="184.46377802077635" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="249.84048660470202" y="326.54961727720064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="318.7305904866047" y="343.77214324767635" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma U=(0,0), N=(0,1), C=(1,1) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P=(1,0). Los arcos cumplen x²+y²=1 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(x−1)²+(y−1/2)²=1/4.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al restar queda 2x+y=2. La raíz</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distinta de P es O=(3/5,4/5). Por</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simetría de las alturas respecto de</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=1/2, R=(3/5,1/5).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde P, los rayos hacia O y R tienen</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclinaciones respecto de la</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal izquierda arctan(2) y</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arctan(1/2). Su diferencia tiene</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente (2−1/2)/(1+1)=3/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>