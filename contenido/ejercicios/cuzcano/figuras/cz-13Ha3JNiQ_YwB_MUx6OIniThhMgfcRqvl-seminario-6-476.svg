<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">476 · Dos sustituyentes ramificados sobre nonano</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,264.64 135.18,284.08 169.45,264.64 203.73,284.08 238.00,264.64 272.27,284.08 306.55,264.64 340.82,284.08 375.10,264.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="203.73,284.08 203.73,320.91" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="203.73,320.91 179.17,342.91" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="203.73,320.91 228.28,342.91" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,264.64 238.00,227.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,227.81 213.45,205.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,227.81 262.55,205.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,227.81 238.00,196.09" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cadena principal más larga del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">esquema contiene nueve carbonos. Usar</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un extremo de las ramas la acortaría.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los localizadores posibles son 4,5 y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5,6. Elige 4,5, con isopropil en 4 y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">terc-butil en 5.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al ordenar los prefijos de las</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opciones, terc- no cuenta para la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">comparación alfabética de butil.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>