<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">067 · Imagen de una lente sumergida</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,276.22 375.10,276.22" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.62,215.74 375.10,215.74" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="235.31,229.18 246.74,252.03 250.77,276.22 246.74,300.41 235.31,323.26 235.31,229.18" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="337.46,276.22 337.46,247.99 332.09,254.72 337.46,247.99 342.84,254.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="134.51,276.22 235.31,229.18" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="174.8279569892473" y="244.63440860215056" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R = 25 cm</text><text x="290.41935483870964" y="288.3172043010753" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">25 cm</text><text x="339.47849462365593" y="234.55376344086022" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Objeto 2,5 cm</text><text x="164.747311827957" y="306.4623655913979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Líquido</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El factor relativo de índice es 1,5/2</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">− 1 = −1/4. La única curvatura no nula</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da f = −100 cm.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ecuación de lente con s = 25 cm da</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">s′ = −20 cm.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La imagen virtual y derecha tiene</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aumento 20/25 y altura 2,5(20/25) cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>