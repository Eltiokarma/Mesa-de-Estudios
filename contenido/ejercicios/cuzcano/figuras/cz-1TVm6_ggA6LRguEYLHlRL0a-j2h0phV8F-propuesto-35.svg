<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Ángulo de la base con dos ángulos iguales en el vértice</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,335.46 222.77,335.46 375.10,335.46" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="222.77,335.46 146.60,203.54 260.85,269.50 375.10,335.46" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="222.77,335.46 260.85,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><text x="222.7670250896057" y="335.4607162380621" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="146.6021505376344" y="203.53928376193795" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="260.8494623655914" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="375.09677419354836" y="335.4607162380621" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="185.44623655913978" y="310.3263076359115" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">φ</text><text x="264.65770609319" y="316.41949760006923" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">φ</text><text x="163.35842293906808" y="230.35318935634166" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como AH es mediatriz de BC, AB=AC. Los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos ángulos de la base BC son x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea φ=∠HAC. En el triángulo rectángulo</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AHC, x+φ=90°.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠BAH=90°−x=φ, el ángulo BAC mide</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2φ. Junto con el ángulo exterior φ</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suma 180°, de modo que φ=60° y x=30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>