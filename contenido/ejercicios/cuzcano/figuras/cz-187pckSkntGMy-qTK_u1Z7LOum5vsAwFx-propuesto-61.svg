<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">061 · De una conjunción al circuito en serie</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,271.69 155.74,271.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="210.58,271.69 265.42,271.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="320.26,271.69 375.10,271.69" fill="none" stroke="#008674" stroke-width="2.5"/><text x="183.16129032258064" y="267.3064516129032" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">p</text><text x="292.83870967741933" y="267.3064516129032" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el segundo factor, p↔q exige</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valores iguales y p∨q impide que ambos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sean falsos.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ello el segundo factor equivale a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">p∧q. En esa única fila verdadera, p∧¬q</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es falsa y la implicación del primer</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">factor vale V.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se obtiene p∧q, representado por los</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interruptores p y q conectados en</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">serie.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>