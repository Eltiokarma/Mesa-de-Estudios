<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">009 · Secantes sobre un equilátero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.56,352.05 212.90,185.99 302.69,355.91 110.56,352.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="186.83,351.08 100.90,245.85 375.10,176.33 230.28,355.91" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="101.86869604725123" y="360.7369377555657" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="211.93230349840982" y="180.1940027260336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="313.3066787823717" y="362.6678782371649" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="205.17401181281235" y="339.49659245797363" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100°</text><text x="254.41299409359382" y="345.28941390277146" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">80°</text><text x="273.72239890958656" y="283.49931849159475" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="123.10904134484323" y="255.50068150840525" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="355.78736937755565" y="197.57246706042707" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo con base junto a C, el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo en C es 60° y el de la secante</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con la base es 80°, así que θ=40° por</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos opuestos por el vértice.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prolonga las dos secantes por debajo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de AC hasta su intersección. El ángulo</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre ellas es 100°−80°=20°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo formado por ambas</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">secantes y el segmento superior,</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">calcula x=180°−20°−2θ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>