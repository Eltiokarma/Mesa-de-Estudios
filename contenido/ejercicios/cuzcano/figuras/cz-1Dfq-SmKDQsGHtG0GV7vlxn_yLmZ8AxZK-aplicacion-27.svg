<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Ventana en pies</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">t desde entrada (s)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">descenso en ventana (pies)</text><polyline points="100.90,396.52 105.47,392.98 110.04,389.41 114.61,385.83 119.18,382.22 123.75,378.58 128.32,374.92 132.89,371.24 137.46,367.54 142.03,363.81 146.60,360.06 151.17,356.28 155.74,352.48 160.31,348.66 164.88,344.82 169.45,340.95 174.02,337.05 178.59,333.14 183.16,329.20 187.73,325.23 192.30,321.25 196.87,317.24 201.44,313.20 206.01,309.15 210.58,305.06 215.15,300.96 219.72,296.83 224.29,292.68 228.86,288.51 233.43,284.31 238.00,280.08 242.57,275.84 247.14,271.57 251.71,267.28 256.28,262.96 260.85,258.62 265.42,254.26 269.99,249.87 274.56,245.46 279.13,241.03 283.70,236.57 288.27,232.09 292.84,227.58 297.41,223.06 301.98,218.51 306.55,213.93 311.12,209.33 315.69,204.71 320.26,200.06 324.83,195.40 329.40,190.70 333.97,185.99 338.54,181.25 343.11,176.48 347.68,171.70 352.25,166.89 356.82,162.05 361.39,157.20 365.96,152.32 370.53,147.41 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">caída</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al entrar, 6=v·0,25+½·32·0,25², así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que v=20 pies/s.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Antes de llegar a la ventana cae desde</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reposo: v²=2gx.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=20²/(2·32)=6,25 pies; no mezclar</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pies con metros.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>