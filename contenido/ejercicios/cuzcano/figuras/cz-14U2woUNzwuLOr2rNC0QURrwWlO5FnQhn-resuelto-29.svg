<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Razón futura para hallar el nominal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,262.65 375.10,262.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,252.36 100.90,272.93" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,252.36 238.00,272.93" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,252.36 375.10,272.93" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645164" y="286.63709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hoy</text><text x="238.0" y="286.63709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Mes 2</text><text x="375.09677419354836" y="286.63709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vencimiento</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cociente de descuentos es 1 + rt.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para dos meses vale 7/6, así el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">producto es 1/6.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para cuatro meses el producto duplica</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el de dos meses y vale 1/3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El valor comercial actual es dos</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tercios del nominal. Divide 6000 entre</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2/3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>