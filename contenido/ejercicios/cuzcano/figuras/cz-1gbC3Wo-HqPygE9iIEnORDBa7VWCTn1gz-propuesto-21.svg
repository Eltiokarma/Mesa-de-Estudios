<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Hipotenusa común y bisectriz</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.18,330.72 201.37,205.14 368.82,330.72 107.18,330.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,330.72 316.49,226.07 368.82,330.72" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="316.49,226.07 316.49,330.72" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="338.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="201.37109086431911" y="196.765451859148" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="337.5251169662645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="316.490519576459" y="216.6497168185176" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="316.490519576459" y="339.6181974883034" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="342.65402610194536" y="342.234548140852" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="152.70696872691457" y="259.5578675203152" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="352.59615858163016" y="323.92009357301157" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama d a AC y u a ∠DAC. Del primer</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo, AB = d cos 2u = 3.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ADC, DC = d sen u y su proyección</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre AC cumple HC = DC²/d = d sen² u.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 2 sen² u = 1 − cos 2u, queda 2HC</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= d − AB.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De ahí AC = 5. En ABC, sen x = 3/5 y x</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">≈ 37°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>