<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">082 · Cuadrado del repuno por 36</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,205.52 375.10,205.52 375.10,150.68 100.90,150.68 100.90,205.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,296.92 375.10,296.92 375.10,242.08 100.90,242.08 100.90,296.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,388.32 375.10,388.32 375.10,333.48 100.90,333.48 100.90,388.32" fill="none" stroke="#008674" stroke-width="2.5"/><text x="112.47311827956989" y="170.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">datos y dominio</text><text x="112.47311827956989" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">identidad o recurrenci</text><text x="112.47311827956989" y="352.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">resultado en ficha</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R_n=(10ⁿ−1)/9; A=4(10²ⁿ−2·10ⁿ+1)/9.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La multiplicación produce n−1</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuatros,un3,n−1 cincos,y un6:por</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ejemplo n3 da 443556.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma=4(n−1)+3+5(n−1)+6=9n.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>