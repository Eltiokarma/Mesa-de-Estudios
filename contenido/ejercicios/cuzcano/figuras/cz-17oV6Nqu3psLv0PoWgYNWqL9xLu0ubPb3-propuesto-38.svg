<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Pendiente de una secante a un círculo con dos tangencias</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="134.31,171.86 341.69,171.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="307.12,396.52 307.12,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="151.59,171.86 307.12,379.24" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="151.59,171.86 307.12,242.33" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="310.15,224.71 309.95,220.11 309.34,215.54 308.35,211.03 306.96,206.64 305.20,202.38 303.07,198.29 300.59,194.40 297.78,190.74 294.67,187.34 291.27,184.23 287.61,181.42 283.72,178.94 279.63,176.81 275.37,175.05 270.97,173.66 266.47,172.66 261.90,172.06 257.30,171.86 252.69,172.06 248.12,172.66 243.62,173.66 239.22,175.05 234.96,176.81 230.87,178.94 226.98,181.42 223.32,184.23 219.92,187.34 216.81,190.74 214.00,194.40 211.53,198.29 209.40,202.38 207.63,206.64 206.25,211.03 205.25,215.54 204.65,220.11 204.45,224.71 204.65,229.32 205.25,233.89 206.25,238.39 207.63,242.79 209.40,247.05 211.53,251.14 214.00,255.03 216.81,258.68 219.92,262.08 223.32,265.20 226.98,268.01 230.87,270.48 234.96,272.61 239.22,274.38 243.62,275.76 248.12,276.76 252.69,277.36 257.30,277.56 261.90,277.36 266.47,276.76 270.97,275.76 275.37,274.38 279.63,272.61 283.72,270.48 287.61,268.01 291.27,265.20 294.67,262.08 297.78,258.68 300.59,255.03 303.07,251.14 305.20,247.05 306.96,242.79 308.35,238.39 309.34,233.89 309.95,229.32 310.15,224.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="341.68663594470047" y="169.78801843317973" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="309.1981566820276" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="147.2741935483871" y="166.15898617511522" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="313.8640552995392" y="379.2350230414747" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="314.7281105990783" y="207.09564994727324" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="315.2465437788019" y="242.32954874247275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="313.5184331797235" y="165.64055299539172" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="178.38018433179724" y="179.63824884792623" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea A=(0,−a) y B=(0,−2a). El radio es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r=3a/2 porque el círculo toca el eje</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">X. El centro tiene ordenada −r, y de</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la cuerda AB se obtiene abscisa −√2a.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PQ tiene ecuación 4x+3y+36=0. El</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">centro está del lado del origen, según</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el dibujo. Su distancia a PQ es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[36−4√2a−9a/2]/5=r.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja a=9/(3+√2). La pendiente de PB</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es −2a/9, por debajo de la horizontal.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>