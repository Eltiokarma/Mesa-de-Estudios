<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Ángulo entre dos segmentos de un cubo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="129.36,222.48 291.51,222.48 345.56,152.21 183.41,152.21 129.36,222.48 129.36,384.63 291.51,384.63 291.51,222.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="345.56,152.21 345.56,314.36 291.51,384.63" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="183.41,152.21 183.41,314.36 345.56,314.36" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="183.41,314.36 129.36,384.63" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="345.56,152.21 210.43,222.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="291.51,222.48 305.02,367.06" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="120.71276595744683" y="215.99107755662317" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="301.23781743308166" y="230.0439258750858" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="353.665751544269" y="146.8078242964997" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="178.54564172958135" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="171.51921757035004" y="311.65854495538775" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="120.71276595744683" y="395.43514070006864" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="295.8328757721345" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="355.28723404255317" y="321.92793411118737" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="210.43479752916954" y="232.74639670555936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="315.2906657515442" y="373.54512697323264" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma lado 1, con A=(0,0,1), B=(1,0,1),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C=(1,1,1), G=(1,0,0), H=(1,1,0).</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resultan M=(1/2,0,1) y N=(1,1/4,0).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los vectores CM y BN son (−1/2,−1,0) y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,1/4,−1). Su producto escalar es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−1/4 y el producto de sus normas al</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrado es 85/64.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para el ángulo menor, cos φ=2/√85.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces tan φ=√(85−4)/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>