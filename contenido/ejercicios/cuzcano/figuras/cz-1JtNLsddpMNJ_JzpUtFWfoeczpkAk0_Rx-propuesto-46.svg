<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">046 · Salida rasante de un prisma</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="152.78,228.00 375.10,228.00 152.78,356.36 152.78,228.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="263.94,168.72 263.94,292.18 112.02,379.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="263.94,292.18 304.70,362.87" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="263.94,292.18 263.94,376.21" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="263.94,292.18 220.96,363.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="263.94,292.18 189.83,268.76" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="263.9372275501308" y="156.85832606800346" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Incidente</text><text x="316.5527462946818" y="368.06146469049696" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="271.34786399302527" y="379.9184829991282" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">II</text><text x="219.47340889276373" y="371.0257192676547" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">III</text><text x="100.90322580645163" y="382.14167393199654" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">IV</text><text x="180.19703574542285" y="264.3125544899739" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="171.30427201394946" y="325.0797733217088" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la cara horizontal la incidencia es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal, así que el rayo sigue</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la cara oblicua la normal forma 30°</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con el rayo interior.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La condición 2 sen 30° = 1 da un</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo de refracción de 90°. La salida</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es rasante en sentido IV.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>