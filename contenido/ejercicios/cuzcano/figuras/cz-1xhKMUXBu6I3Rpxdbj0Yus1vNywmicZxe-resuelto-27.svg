<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Distancia tras dos tramos de navegación</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="152.91,396.52 284.12,348.76 320.50,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="152.91,396.52 320.50,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="152.91,396.52 152.91,304.88" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="284.12,348.76 284.12,257.12" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="152.90863914713498" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="284.12459629350326" y="348.7574263702304" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="320.4961895176244" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="152.90863914713498" y="296.15195982118655" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="284.12459629350326" y="248.39325715915888" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="218.3635321108773" y="383.4251504395096" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">32 km</text><text x="323.091360852865" y="256.8790240429411" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">48 km</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los desplazamientos miden 32 km y 48</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">km. Sus direcciones forman 60° entre</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sí.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al sumar dos vectores con ese ángulo,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el cuadrado de la norma es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">32²+48²+2·32·48 cos60°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Factoriza 256·19 y toma la raíz</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positiva.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>