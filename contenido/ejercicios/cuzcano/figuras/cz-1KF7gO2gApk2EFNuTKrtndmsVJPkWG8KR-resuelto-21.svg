<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Suma de ángulos en tres triángulos cruzados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="139.56,142.48 266.58,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="156.07,174.87 272.93,157.73 201.48,266.32" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="181.48,227.58 311.03,215.52 234.19,331.10" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="218.63,300.62 336.44,328.24 257.37,378.42" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="151.6290322580645" y="164.07661290322585" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="258.3225806451613" y="167.8870967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40°</text><text x="224.6633064516129" y="237.74596774193552" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="296.7449596774194" y="225.0443548387097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">70°</text><text x="241.17540322580646" y="298.3961693548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="319.92540322580646" y="327.29233870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">80°</text><text x="269.7540322580645" y="380.6391129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ω</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama a, b, c a los ángulos interiores</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del triángulo central obtenido</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">prolongando los lados que se cruzan.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ángulos exteriores, α=a+40° y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ω=b+80°. En el cuadrilátero</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intermedio, β+θ=c+70°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma las tres igualdades y usa</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a+b+c=180°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>