<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">088 · Sentido de corriente en un circuito que se ensancha</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,330.98 160.26,208.73 375.10,208.73" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,330.98 312.91,330.98" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="266.97,336.64 326.34,203.07" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="301.60,273.74 363.08,273.74" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="351.07,279.39 363.08,273.74 351.07,268.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="176.52,174.10 176.52,364.90" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="170.86,352.89 176.52,364.90 182.17,352.89" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="235.88,174.10 235.88,364.90" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="230.23,352.89 235.88,364.90 241.53,352.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="296.65,174.10 296.65,364.90" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="291.00,352.89 296.65,364.90 302.31,352.89" fill="none" stroke="#008674" stroke-width="2.5"/><text x="357.42966411706016" y="352.88875956102424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B ↓</text><text x="117.86365147988025" y="315.4344861988693" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="260.61390089790484" y="201.65829730628533" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">v</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La barra aumenta el área del circuito</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y el flujo exterior hacia abajo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aumenta en módulo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La corriente inducida crea campo hacia</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arriba para oponerse a ese aumento.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Apunta el pulgar derecho hacia arriba.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dedos se curvan en sentido</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">antihorario para el observador situado</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arriba.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>