<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">032 · Área entre arco seno y dos rectas perpendiculares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="207.56027425841654" y1="105" x2="207.56027425841654" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 104.46,375.58 108.01,366.82 111.57,360.05 115.12,354.28 118.68,349.16 122.23,344.48 125.79,340.14 129.35,336.07 132.90,332.20 136.46,328.51 140.01,324.96 143.57,321.53 147.12,318.22 150.68,314.99 154.23,311.84 157.79,308.76 161.34,305.74 164.90,302.78 168.45,299.86 172.01,296.98 175.56,294.14 179.12,291.33 182.67,288.54 186.23,285.78 189.78,283.04 193.34,280.31 196.89,277.60 200.45,274.89 204.01,272.20 207.56,269.50 211.12,266.80 214.67,264.11 218.23,261.40 221.78,258.69 225.34,255.96 228.89,253.22 232.45,250.46 236.00,247.67 239.56,244.86 243.11,242.02 246.67,239.14 250.22,236.22 253.78,233.26 257.33,230.24 260.89,227.16 264.44,224.01 268.00,220.78 271.55,217.47 275.11,214.04 278.66,210.49 282.22,206.80 285.78,202.93 289.33,198.86 292.89,194.52 296.44,189.84 300.00,184.72 303.55,178.95 307.11,172.18 310.66,163.42 314.22,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">arcsen</text><polyline points="100.90,396.52 375.10,188.64 314.22,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">rectas</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las rectas son y=x+1−π/2 y y=−x+1+π/2.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se cortan en C=(π/2,1).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área firmada entre el arco y la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuerda AB se anula: ambos son impares</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre [−1,1]. Así, reemplazar el arco</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por la cuerda deja la misma área</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">total.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo ABC es rectángulo en C.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por coordenadas, AC=(π+2)/√2 y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC=(π−2)/√2. La mitad del producto es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(π²−4)/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>