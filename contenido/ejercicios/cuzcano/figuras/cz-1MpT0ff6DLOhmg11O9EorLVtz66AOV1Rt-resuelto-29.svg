<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Recta que une los extremos de un triángulo isósceles recto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="372.3225806451613" x2="421" y2="372.3225806451613" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,235.23 306.55,166.68 375.10,372.32 100.90,235.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Triángulo</text><polyline points="100.90,372.32 238.00,235.23 306.55,166.68" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">L</text><polyline points="375.10,372.32 238.00,235.23" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Distancia</text><circle cx="100.90322580645162" cy="235.22580645161293" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="227.22580645161293" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="375.0967741935484" cy="372.3225806451613" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="364.3225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">E</text><circle cx="306.5483870967742" cy="166.67741935483872" r="3.7" fill="#20364b"/><text x="313.5483870967742" y="158.67741935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="100.90322580645162" cy="372.3225806451613" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="364.3225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="238.00000000000003" cy="235.22580645161293" r="3.7" fill="#20364b"/><text x="245.00000000000003" y="227.22580645161293" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea E=(e,0) y a=2√2. Desde el punto</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio de AE, el vector hacia M es el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semivector (e,−a)/2 girado 90° en</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sentido antihorario.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M=((e+a)/2,(e+a)/2), así que L es y=x.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia de E a L es e/√2=4. Por</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ello E=(4√2,0). Une A con E.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>