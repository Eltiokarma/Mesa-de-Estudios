<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">023 · Altura libre frente a guía inclinada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (escala ilustrativa)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">altura (escala ilustrativa)</text><polyline points="100.90,396.52 105.47,388.19 110.04,380.15 114.61,372.38 119.18,364.90 123.75,357.71 128.32,350.79 132.89,344.16 137.46,337.81 142.03,331.74 146.60,325.95 151.17,320.45 155.74,315.23 160.31,310.29 164.88,305.63 169.45,301.25 174.02,297.16 178.59,293.35 183.16,289.82 187.73,286.58 192.30,283.61 196.87,280.93 201.44,278.53 206.01,276.42 210.58,274.58 215.15,273.03 219.72,271.76 224.29,270.77 228.86,270.06 233.43,269.64 238.00,269.50 242.57,269.64 247.14,270.06 251.71,270.77 256.28,271.76 260.85,273.03 265.42,274.58 269.99,276.42 274.56,278.53 279.13,280.93 283.70,283.61 288.27,286.58 292.84,289.82 297.41,293.35 301.98,297.16 306.55,301.25 311.12,305.63 315.69,310.29 320.26,315.23 324.83,320.45 329.40,325.95 333.97,331.74 338.54,337.81 343.11,344.16 347.68,350.79 352.25,357.71 356.82,364.90 361.39,372.38 365.96,380.15 370.53,388.19 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">libre</text><polyline points="100.90,396.52 238.00,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">guía</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Libre: sólo la energía cinética</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical se convierte en altura,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hlibre=v²sin²α/(2g).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En guía recta, la reacción no trabaja</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y toda la energía cinética se</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">convierte en altura: hguía=v²/(2g).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para0&lt;α&lt;90°, hguía&gt;hlibre: alcanza más</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura el guiado.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>