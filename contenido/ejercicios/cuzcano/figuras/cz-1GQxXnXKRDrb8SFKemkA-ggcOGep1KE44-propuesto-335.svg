="#008674" text-anchor="start">Lado z₁z₂</text><circle cx="162.325113573815" cy="330.9218877673634" r="3.7" fill="#20364b"/><text x="169.325113573815" y="322.9218877673634" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="100.90322580645162" cy="224.53605745749672" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="216.53605745749672" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">z₁</text><circle cx="375.0967741935484" cy="208.0781122326366" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="200.0781122326366" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">z₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los lados desde el origen miden ∣z₁∣=1</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y ∣z₂∣=2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El argumento del cociente es la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia angular de esos lados. Por</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tanto forman un ángulo recto.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área es (1/2)·1·2·sen(π/2)=1. El</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dibujo muestra una configuración que</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también respeta el argumento del</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">producto.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>