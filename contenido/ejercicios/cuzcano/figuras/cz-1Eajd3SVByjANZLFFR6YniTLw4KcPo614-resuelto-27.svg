<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Dos rectas perpendiculares a lados distintos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,305.18 152.91,236.16 195.47,179.69 210.93,195.15 226.39,210.61 375.10,359.31" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,305.18 226.39,210.61" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,305.18 187.86,218.22 210.93,195.15" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="174.19,207.92 187.86,218.22 375.10,359.31" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="152.91,236.16 226.39,210.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="305.17660962546097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="195.46761841165122" y="179.68542210905142" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="152.9136417393114" y="236.1564564914357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="226.39441332286114" y="210.61221702026137" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="187.85902316252796" y="218.2208122693846" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.0967741935484" y="359.3145778909486" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="210.93101586725618" y="195.1488195646564" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="174.19063007548132" y="207.92093930024356" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="117.2415190653542" y="297.3964699783645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8°</text><text x="362.648550758194" y="345.77713490500076" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="215.59909965551407" y="199.9725061458562" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="179.63672782844884" y="213.67824263909492" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta RO pasa por el circuncentro y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es perpendicular a NI. Por tanto es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mediatriz de NI y RN=RI.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el isósceles RNI, RO biseca el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo en R. Así ∠NRO=∠ORI=8°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los lados del ángulo en S son</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares a RN y RO. El ángulo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agudo entre ellos mide lo mismo que</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠NRO.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>