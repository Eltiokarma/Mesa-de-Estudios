<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">081 · Recta por el origen perpendicular a una tangente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="383.747311827957" x2="421" y2="383.747311827957" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="329.40,383.75 329.17,376.57 328.50,369.43 327.37,362.34 325.81,355.34 323.81,348.44 321.38,341.69 318.52,335.10 315.27,328.71 311.61,322.53 307.58,316.59 303.18,310.92 298.43,305.54 293.36,300.46 287.97,295.72 282.30,291.32 276.37,287.29 270.19,283.63 263.79,280.37 257.21,277.52 250.45,275.09 243.56,273.09 236.56,271.52 229.47,270.40 222.32,269.73 215.15,269.50 207.98,269.73 200.83,270.40 193.74,271.52 186.74,273.09 179.85,275.09 173.09,277.52 166.51,280.37 160.11,283.63 153.93,287.29 148.00,291.32 142.33,295.72 136.94,300.46 131.87,305.54 127.12,310.92 122.72,316.59 118.69,322.53 115.03,328.71 111.78,335.10 108.93,341.69 106.49,348.44 104.49,355.34 102.93,362.34 101.80,369.43 101.13,376.57 100.90,383.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Semicírculo</text><polyline points="100.90,155.25 375.10,360.90" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Tangente</text><polyline points="100.90,383.75 238.00,200.95" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">L</text><polyline points="215.15,383.75 283.70,292.35" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">Radio</text><circle cx="100.90322580645162" cy="383.747311827957" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="375.747311827957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="215.15053763440858" cy="383.747311827957" r="3.7" fill="#20364b"/><text x="222.15053763440858" y="375.747311827957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="283.6989247311828" cy="292.3494623655914" r="3.7" fill="#20364b"/><text x="290.6989247311828" y="284.3494623655914" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como CO=CP, se cumple c²=(4−c)²+4, por</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lo que c=5/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CP=(3/2,2) es perpendicular a la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente, así que L es paralela a CP.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de L es 2/(3/2)=4/3 y</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pasa por O.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>