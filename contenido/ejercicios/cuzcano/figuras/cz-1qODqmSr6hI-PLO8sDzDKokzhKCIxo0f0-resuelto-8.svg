<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Suma de extremos de una combinación de cuadrados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="389.9980801959322" x2="421" y2="389.9980801959322" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Valor</text><polyline points="100.90,229.33 105.47,205.16 110.04,183.80 114.61,166.18 119.18,153.08 123.75,145.06 128.32,142.49 132.89,145.46 137.46,153.86 142.03,167.31 146.60,185.23 151.17,206.83 155.74,231.17 160.31,257.18 164.88,283.74 169.45,309.67 174.02,333.84 178.59,355.20 183.16,372.82 187.73,385.92 192.30,393.94 196.87,396.51 201.44,393.54 206.01,385.14 210.58,371.69 215.15,353.77 219.72,332.17 224.29,307.83 228.86,281.82 233.43,255.26 238.00,229.33 242.57,205.16 247.14,183.80 251.71,166.18 256.28,153.08 260.85,145.06 265.42,142.49 269.99,145.46 274.56,153.86 279.13,167.31 283.70,185.23 288.27,206.83 292.84,231.17 297.41,257.18 301.98,283.74 306.55,309.67 311.12,333.84 315.69,355.20 320.26,372.82 324.83,385.92 329.40,393.94 333.97,396.51 338.54,393.54 343.11,385.14 347.68,371.69 352.25,353.77 356.82,332.17 361.39,307.83 365.96,281.82 370.53,255.26 375.10,229.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">E(x)</text><circle cx="128.15694153248938" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="135.15694153248938" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Máximo</text><circle cx="196.70532862926356" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="203.70532862926356" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Mínimo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica las fórmulas de ángulo doble a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los cuadrados y al producto. Resulta</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E=3+cos(2x)+3sen(2x).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La parte oscilante tiene amplitud</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(1²+3²)=√10.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los extremos son 3+√10 y 3−√10. Al</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sumarlos, se cancela la amplitud.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>