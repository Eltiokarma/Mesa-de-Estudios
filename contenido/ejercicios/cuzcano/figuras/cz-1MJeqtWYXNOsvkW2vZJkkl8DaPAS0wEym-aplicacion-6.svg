<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Tensión paralela a un plano liso</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,190.33 375.10,382.26 100.90,382.26 100.90,190.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="207.15,264.70 248.28,293.49 277.07,252.36 235.94,223.57 207.15,264.70" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="221.55,244.14 121.47,174.08" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="140.42,176.89 121.47,174.08 130.59,190.93" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="242.11,258.53 313.40,156.74" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="310.59,175.69 313.40,156.74 296.55,165.86" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="242.11,258.53 242.11,358.96" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="233.54,341.82 242.11,358.96 250.68,341.82" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="115.29838709677419" y="161.53629032258056" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="322.3145161290323" y="158.79435483870964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="255.8225806451613" y="360.3266129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">mg</text><text x="337.39516129032256" y="367.18145161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las fuerzas son el peso mg, la normal</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N y la tensión T rampa arriba.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El peso proyectado sobre la rampa</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene módulo mg sen α. La normal no</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene proyección paralela.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma de componentes paralelas es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cero. Iguala la tensión a la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente del peso.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>