<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Vértice de un triángulo isósceles rectángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="144.59,370.31 331.41,370.31" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,396.52 238.00,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,370.31 305.20,235.90 170.80,168.69 238.00,370.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="268.24,370.31 268.18,368.40 268.00,366.50 267.70,364.62 267.28,362.76 266.75,360.92 266.10,359.13 265.34,357.38 264.47,355.68 263.50,354.04 262.42,352.47 261.25,350.96 259.98,349.54 258.63,348.19 257.19,346.94 255.68,345.77 254.10,344.71 252.46,343.74 250.75,342.88 249.00,342.14 247.20,341.50 245.37,340.98 243.50,340.57 241.62,340.28 239.72,340.11 237.81,340.07 235.90,340.14 234.00,340.33 232.12,340.64 230.26,341.07 228.44,341.62" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="238.0" y="370.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="305.2043010752688" y="235.8978494623656" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="170.7956989247312" y="168.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="331.4139784946237" y="375.34677419354836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="245.05645161290323" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="261.52150537634407" y="336.03225806451616" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector OA=(a,b) tiene la misma</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud que AP y es perpendicular a</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">él.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Gira OA 90° en sentido antihorario:</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AP=(−b,a), la elección que coloca P en</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el segundo cuadrante.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma los vectores para obtener</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P=(a−b,a+b). Divide la ordenada por la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abscisa.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>