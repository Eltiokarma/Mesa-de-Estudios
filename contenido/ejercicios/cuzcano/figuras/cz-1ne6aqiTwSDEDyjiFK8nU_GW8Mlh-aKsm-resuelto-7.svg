<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">007 · Producto seno-coseno en un intervalo semiabierto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (radianes)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="283.70,176.52 285.22,175.42 286.75,174.33 288.27,173.27 289.79,172.22 291.32,171.19 292.84,170.17 294.36,169.17 295.89,168.19 297.41,167.23 298.93,166.28 300.46,165.36 301.98,164.45 303.50,163.55 305.03,162.68 306.55,161.82 308.07,160.98 309.59,160.16 311.12,159.36 312.64,158.57 314.16,157.80 315.69,157.05 317.21,156.32 318.73,155.61 320.26,154.92 321.78,154.24 323.30,153.58 324.83,152.94 326.35,152.32 327.87,151.72 329.40,151.14 330.92,150.58 332.44,150.03 333.97,149.50 335.49,148.99 337.01,148.51 338.54,148.04 340.06,147.58 341.58,147.15 343.11,146.74 344.63,146.34 346.15,145.97 347.68,145.61 349.20,145.27 350.72,144.96 352.25,144.66 353.77,144.38 355.29,144.12 356.82,143.88 358.34,143.65 359.86,143.45 361.39,143.27 362.91,143.10 364.43,142.96 365.96,142.83 367.48,142.73 369.00,142.64 370.53,142.57 372.05,142.52 373.57,142.49 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">f(x)</text><circle cx="283.6989247311828" cy="176.51774016766288" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="290.6989247311828" y="168.51774016766288" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">π/6</text><circle cx="375.09677419354836" cy="142.483870967742" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="134.483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">π/4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa sen x cos x=½ sen(2x).</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces π/3&lt;2x≤π/2, intervalo en que</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el seno crece.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El límite inferior es √3/4, excluido,</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y el extremo superior es ½, incluido.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>