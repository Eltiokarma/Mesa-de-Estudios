<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Área entre una cuerda y sus tangentes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="305.7903225806452" x2="421" y2="305.7903225806452" stroke="#20364b" stroke-width="1.7"/><line x1="191.125" y1="105" x2="191.125" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="366.53,396.52 356.81,392.28 347.43,388.05 338.37,383.81 329.65,379.58 321.25,375.35 313.18,371.11 305.44,366.88 298.03,362.65 290.95,358.41 284.20,354.18 277.78,349.94 271.69,345.71 265.93,341.48 260.49,337.24 255.39,333.01 250.61,328.77 246.17,324.54 242.05,320.31 238.27,316.07 234.81,311.84 231.68,307.60 228.88,303.37 226.41,299.14 224.27,294.90 222.46,290.67 220.98,286.44 219.82,282.20 219.00,277.97 218.51,273.73 218.34,269.50 218.51,265.27 219.00,261.03 219.82,256.80 220.98,252.56 222.46,248.33 224.27,244.10 226.41,239.86 228.88,235.63 231.68,231.40 234.81,227.16 238.27,222.93 242.05,218.69 246.17,214.46 250.61,210.23 255.39,205.99 260.49,201.76 265.93,197.52 271.69,193.29 277.78,189.06 284.20,184.82 290.95,180.59 298.03,176.35 305.44,172.12 313.18,167.89 321.25,163.65 329.65,159.42 338.37,155.19 347.43,150.95 356.81,146.72 366.53,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="327.21,378.37 109.47,269.50 327.21,160.63 327.21,378.37" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="327.2137096774194" cy="378.3709677419355" r="3.7" fill="#20364b"/><text x="334.2137096774194" y="370.3709677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="327.2137096774194" cy="160.6290322580645" r="3.7" fill="#20364b"/><text x="334.2137096774194" y="152.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="109.47177419354841" cy="269.5" r="3.7" fill="#20364b"/><text x="116.47177419354841" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe (y−4)²=12(x−3). Los extremos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">están a 12 de y=4, por lo que son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(15,−8) y (15,16).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La derivada dx/dy=(y−4)/6 da</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendientes ±2 al expresar x como</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">función de y. En y=4 ambas tangentes</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen x=−9.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura del triángulo es 15−(−9)=24</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m y la base mide 24 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>