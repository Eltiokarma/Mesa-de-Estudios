<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">017 · Ánodo de zinc, cátodo inerte y puente salino</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,245.91 100.90,366.88 213.81,366.88 213.81,245.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="262.19,245.91 262.19,366.88 375.10,366.88 375.10,245.91" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="127.11,322.52 127.11,173.33 221.87,173.33" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="254.13,173.33 338.81,173.33 338.81,326.56" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="173.48,322.52 173.48,245.91 197.68,229.78 238.00,225.75 282.35,229.78 302.52,245.91 302.52,322.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="106.95,274.14 207.76,274.14" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="268.24,274.14 369.05,274.14" fill="none" stroke="#008674" stroke-width="2.5"/><text x="121.06451612903227" y="302.36290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Zn (−)</text><text x="350.9032258064516" y="322.5241935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Pt (+)</text><text x="238.0" y="172.1209677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V</text><text x="238.0" y="211.63709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">KNO₃</text><text x="153.3225806451613" y="354.7822580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ZnSO₄</text><text x="312.5967741935484" y="354.7822580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">HCl</text><text x="366.2258064516129" y="255.58870967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cl₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El zinc es el ánodo y se oxida a Zn²⁺.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El par cloro/cloruro queda en el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cátodo inerte de Pt.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el cátodo se forma Cl⁻ disuelto, de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">modo que no hay depósito metálico que</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aumente la masa del Pt.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El aumento de carga positiva en el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">compartimento del ánodo se compensa</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por migración de nitrato del puente.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>