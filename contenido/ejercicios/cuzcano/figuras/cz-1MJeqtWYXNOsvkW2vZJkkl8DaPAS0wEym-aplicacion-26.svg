<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">026 · Ángulo y masa de un nudo con dos tensiones dadas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="166.30,154.20 248.24,296.13 325.27,199.93" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="141.71,154.20 325.27,154.20 325.27,390.37" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="248.24,296.13 248.24,369.88" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="232.26,369.88 264.22,369.88 264.22,396.52 232.26,396.52 232.26,369.88" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="166.2973465140479" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="334.2864203954215" y="199.92793964620185" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="238.81945889698227" y="298.18106139438083" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="197.0270551508845" y="169.93574401664932" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="315.02913631633714" y="219.10327783558793" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="248.24323621227887" y="383.4047866805411" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por equilibrio horizontal, 200 cos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60°=160 sen θ. Por tanto sen θ=5/8.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De esa razón obtén cos θ=√39/8. La</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente vertical de OA es 200 sen</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala Mg a 200 sen 60°+160 cos θ y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">divide por g.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>