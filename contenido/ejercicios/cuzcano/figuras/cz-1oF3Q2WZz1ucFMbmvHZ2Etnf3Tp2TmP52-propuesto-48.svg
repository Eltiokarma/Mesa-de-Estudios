<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">048 · Sector agudo con una restricción cuadrática</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="121.39,375.67 334.76,375.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="121.39,375.67 327.49,320.45" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="121.39,375.67 125.11,162.33" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="175.97,375.67 175.97,375.23 175.96,374.78 175.96,374.34 175.94,373.89 175.93,373.44 175.91,373.00 175.88,372.55 175.85,372.10 175.82,371.66 175.79,371.21 175.75,370.77 175.71,370.32 175.66,369.88 175.61,369.44 175.56,368.99 175.50,368.55 175.44,368.11 175.38,367.67 175.31,367.22 175.24,366.78 175.17,366.34 175.09,365.90 175.01,365.46 174.92,365.03 174.83,364.59 174.74,364.15 174.65,363.72 174.55,363.28 174.44,362.85 174.34,362.41 174.23,361.98 174.11,361.55" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="191.37,356.92 190.55,354.12 189.63,351.34 188.59,348.61 187.44,345.92 186.19,343.28 184.83,340.69 183.37,338.16 181.80,335.69 180.14,333.28 178.38,330.95 176.53,328.68 174.59,326.50 172.56,324.39 170.45,322.37 168.26,320.43 165.99,318.58 163.65,316.83 161.24,315.17 158.77,313.61 156.23,312.16 153.64,310.80 151.00,309.55 148.31,308.41 145.57,307.38 142.80,306.46 139.99,305.65 137.14,304.96 134.28,304.38 131.39,303.92 128.49,303.57 125.57,303.35 122.65,303.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="121.3868589924275" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="354.61314100757244" y="375.67463149047916" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="125.45721885801235" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="202.56369901115883" y="364.9874977557607" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="182.79382880285857" y="297.07729432328495" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ψ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica en cruz y completa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrados. Resulta (x+1)²+19(y−1)²=0.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De ahí x=−1, y=1. El índice es 2 y el</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radicando 4, así que θ=2°.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como θ+ψ&lt;90°, se requiere ψ&lt;88°. El</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">máximo entero es 87°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>