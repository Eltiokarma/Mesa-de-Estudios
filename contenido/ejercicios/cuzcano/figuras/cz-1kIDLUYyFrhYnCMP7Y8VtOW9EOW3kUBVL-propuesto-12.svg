6,304.88 106.76,307.66 105.75,310.48 104.84,313.33 104.02,316.20 103.29,319.10 102.66,322.03 102.12,324.97 101.69,327.93 101.34,330.90 101.10,333.88 100.95,336.87 100.90,339.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="344.63,339.86 344.61,338.86 344.57,337.87 344.48,336.87 344.37,335.88 344.22,334.90 344.05,333.91 343.83,332.94 343.59,331.97 343.32,331.01 343.01,330.07 342.68,329.13 342.31,328.20 341.92,327.28 341.49,326.38 341.03,325.50 340.55,324.63 340.04,323.77 339.50,322.93 338.93,322.11 338.34,321.31 337.72,320.53 337.07,319.77 336.40,319.03 335.71,318.32 334.99,317.62 334.25,316.95 333.49,316.31 332.71,315.69 331.91,315.09 331.09,314.53 330.25,313.99 329.40,313.47 328.53,312.99 327.64,312.53 326.74,312.11 325.82,311.71 324.90,311.34 323.96,311.01 323.01,310.70 322.05,310.43 321.08,310.19 320.11,309.98 319.13,309.80 318.14,309.65 317.15,309.54 316.16,309.46 315.16,309.41 314.16,309.39 313.17,309.41 312.17,309.46 311.18,309.54 310.19,309.65 309.20,309.80 308.22,309.98 307.25,310.19 306.28,310.43 305.32,310.70 304.37,311.01 303.43,311.34 302.51,311.71 301.59,312.11 300.69,312.53 299.80,312.99 298.93,313.47 298.08,313.99 297.24,314.53 296.42,315.09 295.62,315.69 294.84,316.31 294.08,316.95 293.34,317.62 292.62,318.32 291.93,319.03 291.26,319.77 290.61,320.53 289.99,321.31 289.40,322.11 288.83,322.93 288.29,323.77 287.78,324.63 287.30,325.50 286.84,326.38 286.41,327.28 286.02,328.20 285.65,329.13 285.32,330.07 285.01,331.01 284.74,331.97 284.49,332.94 284.28,333.91 284.11,334.90 283.96,335.88 283.85,336.87 283.76,337.87 283.72,338.86 283.70,339.86" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="238.0" y="339.85809732059954" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="329.3978494623656" y="339.85809732059954" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="238.0" y="260.705237834925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="329.3978494623656" y="313.4738108253747" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="339.85809732059954" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="361.6917562724014" y="334.3742263528576" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los radios a N y C son perpendiculares</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a la tangente. Sus proyecciones</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verticales son r₁cos x y r₂cos x, así</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que r₁=3r₂.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los centros distan r₁+r₂ sobre la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">base. La proyección de esa distancia</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en la normal a la tangente es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(r₁+r₂)sen x y equivale a la</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia de radios.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta sen x=(3−1)/(3+1)=1/2. Como el</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo es agudo, x=30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>