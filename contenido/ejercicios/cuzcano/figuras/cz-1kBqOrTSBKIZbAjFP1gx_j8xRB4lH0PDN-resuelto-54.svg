<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Balance de un ciclo de transiciones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,337.25 351.62,337.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,273.23 351.62,273.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,230.56 351.62,230.56" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,201.75 351.62,201.75" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="139.31,273.23 139.31,201.75 130.78,214.55 139.31,201.75 147.85,214.55" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="221.46,201.75 221.46,337.25 212.93,323.38 221.46,337.25 230.00,323.38" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="301.48,337.25 301.48,273.23 292.95,287.10 301.48,273.23 310.02,287.10" fill="none" stroke="#008674" stroke-width="2.5"/><text x="375.0967741935484" y="337.2482113719091" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n = 1</text><text x="375.0967741935484" y="273.23415338270365" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n = 2</text><text x="375.0967741935484" y="230.55811472323333" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n = 3</text><text x="375.0967741935484" y="201.75178862809088" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n = 4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada salto tiene un cambio de energía</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igual al nivel final menos el inicial.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma (E₄ − E₂) + (E₁ − E₄) + (E₂ −</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E₁).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Todos los términos se cancelan porque</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el átomo regresa al nivel 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>