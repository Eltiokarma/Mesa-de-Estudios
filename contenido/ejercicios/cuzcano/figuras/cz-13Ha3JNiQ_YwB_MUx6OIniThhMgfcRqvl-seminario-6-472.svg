<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">472 · Cadena principal de once carbonos con cuatro ramas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,268.48 128.32,284.03 155.74,268.48 183.16,284.03 210.58,268.48 238.00,284.03 265.42,268.48 292.84,284.03 320.26,268.48 347.68,284.03 375.10,268.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="210.58,268.48 210.58,239.01" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="210.58,239.01 231.86,223.46" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="210.58,268.48 210.58,297.94" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="210.58,297.94 190.94,315.54" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="210.58,297.94 230.22,315.54" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="265.42,268.48 265.42,297.94" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="265.42,297.94 245.78,315.54" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="265.42,297.94 285.06,315.54" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="292.84,284.03 292.84,254.56" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="292.84,254.56 273.19,236.97" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="292.84,254.56 312.48,236.97" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="292.84,254.56 292.84,229.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ruta más larga atraviesa el centro</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuaternario y contiene 11 carbonos. El</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">nombre base es undecano.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al numerar desde el extremo derecho se</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtienen localizadores 4,5,7,7,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">menores que 5,5,7,8 en sentido</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contrario.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ubica terc-butil en 4, isopropilos en</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5 y 7, y etil en 7. Ordénalos como en</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la alternativa escolar.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>