<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">070 · Cuerda a partir de su punto medio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="363.3030560271647" x2="421" y2="363.3030560271647" stroke="#20364b" stroke-width="1.7"/><line x1="187.490662139219" y1="105" x2="187.490662139219" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,335.64 105.47,327.39 110.04,319.37 114.61,311.59 119.18,304.06 123.75,296.77 128.32,289.72 132.89,282.91 137.46,276.34 142.03,270.01 146.60,263.92 151.17,258.08 155.74,252.47 160.31,247.11 164.88,241.99 169.45,237.10 174.02,232.47 178.59,228.07 183.16,223.91 187.73,219.99 192.30,216.32 196.87,212.88 201.44,209.69 206.01,206.74 210.58,204.03 215.15,201.56 219.72,199.33 224.29,197.35 228.86,195.60 233.43,194.10 238.00,192.83 242.57,191.81 247.14,191.03 251.71,190.49 256.28,190.19 260.85,190.14 265.42,190.32 269.99,190.75 274.56,191.41 279.13,192.32 283.70,193.47 288.27,194.86 292.84,196.49 297.41,198.36 301.98,200.48 306.55,202.83 311.12,205.43 315.69,208.26 320.26,211.34 324.83,214.66 329.40,218.22 333.97,222.02 338.54,226.07 343.11,230.35 347.68,234.88 352.25,239.64 356.82,244.65 361.39,249.90 365.96,255.39 370.53,261.12 375.10,267.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,305.58 375.10,214.18" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="230.78,320.01 230.78,175.70" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="230.78438030560272" cy="262.28438030560267" r="3.7" fill="#20364b"/><text x="237.78438030560272" y="254.28438030560267" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="122.79087338683024" cy="298.28221594519357" r="3.7" fill="#20364b"/><text x="129.79087338683024" y="290.28221594519357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="338.7778872243752" cy="226.28654466601188" r="3.7" fill="#20364b"/><text x="345.7778872243752" y="218.28654466601188" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La parábola es y=12−(x−5)²/12. En una</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrática, la pendiente de la cuerda</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es la derivada en la abscisa media.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para x=3, y′=1/3. La cuerda por P es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=x/3+6.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los puntos medios de cuerdas de esa</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente tienen x=3, que es el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diámetro buscado.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>