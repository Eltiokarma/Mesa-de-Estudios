<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Cuatro monedas distintas en un tablero de cuatro por cuatro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,142.48 110.98,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="174.49,142.48 174.49,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,142.48 238.00,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="301.51,142.48 301.51,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="365.02,142.48 365.02,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.98,142.48 365.02,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.98,205.99 365.02,205.99" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.98,269.50 365.02,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="110.98,333.01 365.02,333.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.98,396.52 365.02,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Asigna a cada fila una columna</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distinta. Las cuatro asignaciones de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">columna forman una permutación.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay 4! selecciones de cuatro casillas</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">admisibles.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Distribuye las cuatro monedas</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distintas en esas casillas de 4!</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">formas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>