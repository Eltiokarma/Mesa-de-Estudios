<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">002 · Recta a partir de sus dos cortes con los ejes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="139.21,255.39 336.79,255.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="195.66,396.52 195.66,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="167.44,382.40 317.03,158.01" fill="none" stroke="#008674" stroke-width="2.5"/><text x="252.11290322580643" y="270.9112903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(2,0)</text><text x="170.25806451612902" y="340.06451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(0,−3)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente es [0−(−3)]/(2−0)=3/2.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El corte en Y proporciona y=(3/2)x−3.</text><text x="482" y="169" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica por 2 y ordena para obtener</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la forma general.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>