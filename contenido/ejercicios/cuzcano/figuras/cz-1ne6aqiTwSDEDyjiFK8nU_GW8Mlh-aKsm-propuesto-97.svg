<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">097 · Mayor triángulo bajo una sinusoide</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="169.4516129032258" y1="105" x2="169.4516129032258" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 105.47,383.22 110.04,369.96 114.61,356.78 119.18,343.70 123.75,330.77 128.32,318.02 132.89,305.48 137.46,293.19 142.03,281.19 146.60,269.50 151.17,258.16 155.74,247.20 160.31,236.65 164.88,226.54 169.45,216.89 174.02,207.73 178.59,199.10 183.16,191.00 187.73,183.47 192.30,176.52 196.87,170.17 201.44,164.45 206.01,159.36 210.58,154.92 215.15,151.14 219.72,148.04 224.29,145.61 228.86,143.88 233.43,142.83 238.00,142.48 242.57,142.83 247.14,143.88 251.71,145.61 256.28,148.04 260.85,151.14 265.42,154.92 269.99,159.36 274.56,164.45 279.13,170.17 283.70,176.52 288.27,183.47 292.84,191.00 297.41,199.10 301.98,207.73 306.55,216.89 311.12,226.54 315.69,236.65 320.26,247.20 324.83,258.16 329.40,269.50 333.97,281.19 338.54,293.19 343.11,305.48 347.68,318.02 352.25,330.77 356.82,343.70 361.39,356.78 365.96,369.96 370.53,383.22 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">sen x+cos x</text><polyline points="100.90,396.52 238.00,142.48 375.10,396.52 100.90,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Triángulo</text><circle cx="238.0" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="245.0" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Máximo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe y=√2 sen(x+π/4). El arco</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivo mostrado se extiende de −π/4</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a 3π/4.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La base sobre el eje X mide como</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">máximo π y la altura como máximo √2.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambas cotas se alcanzan a la vez con</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los ceros y el máximo del arco.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ese intervalo el arco es cóncavo y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los lados rectos del triángulo quedan</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">debajo de la curva. Calcula base por</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura entre 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>