<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">013 · Comprobar los nombres de cuatro fórmulas orgánicas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="380.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="238.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Fórmulas</text><rect x="48.0" y="178" width="380.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">I · HOCH₂CH(CH₃)CH₂OH</text><rect x="48.0" y="226" width="380.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">II · CH₃CH₂CH(CH₃)CH₂CHO</text><rect x="48.0" y="274" width="380.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="305.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">III · CH₃CH₂CH₂COOCH₃</text><rect x="48.0" y="322" width="380.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="353.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">IV · CH₃CH₂OCH₃</text><text x="48" y="397" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Estructuras del ejercicio</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El primer compuesto tiene dos OH en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los extremos y un metilo en C2. El</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segundo contiene una cadena de cinco</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">carbonos que incluye el aldehído y un</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">metilo en C3.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En CH₃CH₂CH₂COOCH₃, el fragmento ácido</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contiene cuatro carbonos y el</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcohólico uno. El nombre es butanoato</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de metilo.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cuarto compuesto une etilo y metilo</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por oxígeno, de modo que su nombre</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">funcional sí corresponde.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>