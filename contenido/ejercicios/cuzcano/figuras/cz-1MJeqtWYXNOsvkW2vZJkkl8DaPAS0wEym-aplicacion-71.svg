<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">071 · Una placa cuadrada que recibe fuerza por la diagonal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="133.47,159.35 311.14,159.35 311.14,337.01 133.47,337.01 133.47,159.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="133.47,159.35 311.14,337.01" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="108.60,203.76 133.47,203.76" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="364.44,390.31 311.14,337.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="325.38,342.04 311.14,337.01 316.16,351.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="204.3568243572772" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="222.30641677698043" y="145.72796627882667" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="331.86539399428693" y="181.26060753849367" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a/4</text><text x="375.0967741935484" y="393.2720337211733" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El peso actúa en el centro de la placa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y tiene brazo horizontal a/2 respecto</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del apoyo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La línea de la fuerza forma 45° con el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lado izquierdo. El apoyo dista a/4 de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la esquina superior a lo largo de ese</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lado, así que el brazo perpendicular</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es (a/4) sen 45°.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala F(a√2/8) a 100√2(a/2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>