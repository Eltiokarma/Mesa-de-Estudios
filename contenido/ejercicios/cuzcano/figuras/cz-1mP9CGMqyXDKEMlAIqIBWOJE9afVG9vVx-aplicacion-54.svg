<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Varilla en L sostenida por un alambre</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="125.00,214.72 125.00,352.39 262.67,352.39 354.45,260.61 331.50,191.77 241.44,191.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="239.72,191.77 145.07,191.77 125.00,214.72" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="239.72,173.42 239.72,210.13" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="249.47,180.30 249.47,203.25" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,211.28 146.22,211.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="332.65,256.59 375.10,256.59" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="114.67026589283303" y="222.17579970306383" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="267.25496018356057" y="365.58246726953706" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="112.94938588203536" y="283.5538534215144" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 m</text><text x="196.12525307058985" y="363.2879605884735" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 m</text><text x="276.43298690781484" y="338.62201376704013" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">135°</text><text x="257.5033067890404" y="173.4175327304629" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">24 V</text><text x="198.9933864219193" y="257.74065325954916" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙ 10 T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la ley de Ohm, I=24/6=4 A. En cada</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">brazo, perpendicular al campo, actúa</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una fuerza uniforme de 4×2×10=80 N en</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">su punto medio.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el brazo vertical la fuerza apunta</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a la izquierda, con brazo de momento 1</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m respecto de O. En el horizontal</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">apunta hacia abajo, también con brazo</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1 m. Los dos momentos tienen el mismo</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El alambre forma 90° con O→P, cuya</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud es 2√2 m. Equilibra momentos:</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T·2√2=160 N·m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>