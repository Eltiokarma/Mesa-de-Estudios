<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">013 · Ubicación de un arco coseno escalado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="375.0967741935484" y1="105" x2="375.0967741935484" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,269.50 104.56,279.97 108.22,284.35 111.87,287.74 115.53,290.62 119.18,293.18 122.84,295.52 126.49,297.69 130.15,299.73 133.81,301.66 137.46,303.50 141.12,305.28 144.77,306.99 148.43,308.65 152.09,310.26 155.74,311.84 159.40,313.38 163.05,314.89 166.71,316.37 170.37,317.83 174.02,319.27 177.68,320.69 181.33,322.09 184.99,323.49 188.65,324.87 192.30,326.24 195.96,327.60 199.61,328.96 203.27,330.31 206.92,331.66 210.58,333.01 214.24,334.36 217.89,335.71 221.55,337.06 225.20,338.41 228.86,339.78 232.52,341.15 236.17,342.53 239.83,343.92 243.48,345.33 247.14,346.75 250.80,348.19 254.45,349.65 258.11,351.13 261.76,352.64 265.42,354.18 269.08,355.75 272.73,357.37 276.39,359.03 280.04,360.74 283.70,362.51 287.35,364.36 291.01,366.29 294.67,368.33 298.32,370.50 301.98,372.84 305.63,375.40 309.29,378.28 312.95,381.67 316.60,386.05 320.26,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">a=½, b=3/2</text><polyline points="100.90,142.48 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Nivel π</text><circle cx="100.9032258064516" cy="269.5" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">aπ</text><circle cx="320.258064516129" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="327.258064516129" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1−b)/a</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De −1≤ax+b≤1 sale el dominio</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[(−1−b)/a,(1−b)/a]. Ambos extremos son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativos porque b&gt;1 y a&gt;0.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rango es [0,aπ] y aπ&lt;π. Al aumentar</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x, ax+b crece y el arccos decrece, de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">modo que la gráfica baja desde aπ</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hasta 0.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El trazo está entero a la izquierda</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del eje y, empieza por debajo del</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">nivel π y llega al eje x en (1−b)/a.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Es la figura A.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>