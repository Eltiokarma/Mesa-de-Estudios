<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Área de un octaedro por distancia entre baricentros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="238.00,142.48 107.77,300.04 287.40,300.04" fill="#f4c581" fill-opacity="0.45"/><polygon points="238.00,142.48 368.23,238.96 188.60,238.96" fill="#f4c581" fill-opacity="0.45"/><polyline points="107.77,300.04 287.40,300.04 368.23,238.96 188.60,238.96 107.77,300.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,142.48 107.77,300.04" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,142.48 287.40,300.04" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,142.48 368.23,238.96" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,142.48 188.60,238.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,396.52 107.77,300.04" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,396.52 287.40,300.04" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,396.52 368.23,238.96" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,396.52 188.60,238.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="197.58,300.04 238.00,142.48 278.42,238.96" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="197.58,300.04 278.42,238.96" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="211.06,247.52 264.94,206.80" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="238.0" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="197.58371522855117" y="300.03674849398357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="278.41628477144883" y="238.96325150601643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="211.05581015236746" y="247.51912265190302" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G₁</text><text x="264.9441898476326" y="206.8034579932583" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El octaedro es una bipirámide de base</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrada. Las dos caras llegan desde O</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a lados opuestos del cuadrado.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los puntos medios de esos lados distan</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">s, la arista del octaedro. Los</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">baricentros están a 2/3 de sus</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medianas desde O, por lo que a=2s/3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La superficie son ocho triángulos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equiláteros de lado s=3a/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>