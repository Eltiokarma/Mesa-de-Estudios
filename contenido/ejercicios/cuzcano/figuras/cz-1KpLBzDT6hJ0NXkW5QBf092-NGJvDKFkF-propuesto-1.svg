<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Ecuación que alcanza un extremo del seno cuádruple</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.8488593664333" x2="421" y2="269.8488593664333" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (radianes)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">valor</text><polyline points="100.90,269.85 105.47,296.33 110.04,321.65 114.61,344.71 119.18,364.50 123.75,380.15 128.32,390.98 132.89,396.52 137.46,396.52 142.03,390.98 146.60,380.15 151.17,364.50 155.74,344.71 160.31,321.65 164.88,296.33 169.45,269.85 174.02,243.37 178.59,218.04 183.16,194.99 187.73,175.20 192.30,159.55 196.87,148.72 201.44,143.18 206.01,143.18 210.58,148.72 215.15,159.55 219.72,175.20 224.29,194.99 228.86,218.04 233.43,243.37 238.00,269.85 242.57,296.33 247.14,321.65 251.71,344.71 256.28,364.50 260.85,380.15 265.42,390.98 269.99,396.52 274.56,396.52 279.13,390.98 283.70,380.15 288.27,364.50 292.84,344.71 297.41,321.65 301.98,296.33 306.55,269.85 311.12,243.37 315.69,218.04 320.26,194.99 324.83,175.20 329.40,159.55 333.97,148.72 338.54,143.18 343.11,143.18 347.68,148.72 352.25,159.55 356.82,175.20 361.39,194.99 365.96,218.04 370.53,243.37 375.10,269.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">−sen 4x</text><polyline points="100.90,142.48 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">1</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Factoriza como sen x cos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x(sen²x−cos²x).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con el seno doble y coseno doble, el</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">producto es −sen(4x)/4. Así sen 4x=−1.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ángulos correspondientes son</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4x=−π/2+2kπ. Divide entre cuatro.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>