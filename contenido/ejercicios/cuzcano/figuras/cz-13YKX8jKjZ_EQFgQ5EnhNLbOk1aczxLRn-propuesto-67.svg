<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">067 · Área en función de dos triángulos de un rombo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="109.96,396.52 286.13,396.52 189.87,239.52" fill="#f4c581" fill-opacity="0.45"/><polygon points="189.87,239.52 257.16,239.52 239.26,142.48" fill="#f4c581" fill-opacity="0.45"/><polygon points="286.13,396.52 366.04,239.52 257.16,239.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="109.96,396.52 286.13,396.52 366.04,239.52 189.87,239.52 109.96,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.96,396.52 189.87,239.52 239.26,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="286.13,396.52 257.16,239.52 239.26,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="286.13,396.52 189.87,239.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="109.96278361364108" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="286.12893389311444" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="366.0372163863589" y="239.51555930950252" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="189.8710661068856" y="239.51555930950252" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="239.2571006703389" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="257.16054784642256" y="239.51555930950252" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon t=DP/AD=CQ/CD. Por semejanza en el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cruce de BP con la paralela CD a AB,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DQ/CD=t/(1+t)=1−t. Entonces t²=1−t.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las alturas relativas a CD dan</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[BCQ]=tS₁ y S₂=t(1−t)S₁.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como t(1−t)=2t−1, se obtiene</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">S₂=2[BCQ]−S₁.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>