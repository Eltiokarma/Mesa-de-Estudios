<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">020 · Seno de un ángulo por ley de senos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="179.24,316.79 256.62,221.04 375.10,316.79" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,316.79 256.62,221.04 375.10,316.79 100.90,316.79" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="179.24,316.79 256.62,221.04" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="249.72,229.57 258.25,236.46 265.15,227.93" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="330.4947414013763" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="179.2442396313364" y="330.4947414013763" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.0967741935484" y="330.4947414013763" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="256.6180804460374" y="208.5052585986237" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="140.073732718894" y="308.950962599533" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2k</text><text x="292.8387096774194" y="308.950962599533" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5k</text><text x="332.00921658986175" y="298.37492573317354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="242.9084030266826" y="237.88313878295548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe AD=2k, DC=5k. En el triángulo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulo BDC se cumple BD=5k</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen(2θ).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABD, ∠BAD=π/2−3θ. La ley de senos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da BD/(2k)=cos(3θ)/sen θ.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala. Como sen(2θ)=2sen θ cos θ y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos(3θ)=cos θ·(1−4sen²θ), obtienes</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">9sen²θ=1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>