<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">059 · Cadena de cuadrados inclinados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="152.09,313.37 206.60,272.29 165.52,217.79 111.02,258.86 152.09,313.37" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="237.55,313.37 278.62,282.41 247.67,241.34 206.60,272.29 237.55,313.37" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="301.95,313.37 332.90,290.04 309.57,259.09 278.62,282.41 301.95,313.37" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="350.47,313.37 373.80,295.79 356.22,272.47 332.90,290.04 350.47,313.37" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,313.37 375.10,313.37" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="136.9094250834477" y="220.0535719226009" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2 m</text><text x="169.32811839303156" y="313.2146590122471" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">37°</text><text x="382.09677419354836" y="290.00969959065026" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">…</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el vértice compartido, las alturas</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medidas desde el suelo coinciden: sₖ</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 37°=sₖ₊₁ cos 37°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así la razón de lados y perímetros es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan 37°, menor que 1.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma exacta es 8/(1−tan 37°) m. Con</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la aproximación escolar tan 37°≈3/4,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sale 32 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>