<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Caída y compresión con contrapeso</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="174.49193548387098" y1="105" x2="174.49193548387098" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="174.49,396.52 174.49,142.48 301.51,142.48 301.51,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">cuerda</text><polyline points="301.51,396.52 301.51,345.71" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">resorte</text><circle cx="174.49193548387098" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="181.49193548387098" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M=5kg</text><circle cx="301.508064516129" cy="269.5" r="3.7" fill="#20364b"/><text x="308.508064516129" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2M</text><circle cx="301.508064516129" cy="345.7096774193548" r="3.7" fill="#20364b"/><text x="308.508064516129" y="337.7096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H hasta resorte</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al bajar2M una distanciaH+x, M sube</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igual distancia.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Potencial neto liberado=Mg(H+x); en</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">compresión máxima se almacena kx²/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H=kx²/(2Mg)−x=2000·0,4²/(2·5·10)−0,4=2</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">,8 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>