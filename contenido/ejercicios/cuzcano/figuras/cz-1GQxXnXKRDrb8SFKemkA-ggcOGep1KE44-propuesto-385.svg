<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">385 · Gráfica de un cociente de potencias por tramos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="253.23297491039423" y1="105" x2="253.23297491039423" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,142.48 253.23,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">x≤0</text><polyline points="253.23,142.48 255.26,160.59 257.30,177.40 259.33,193.02 261.36,207.52 263.39,220.99 265.42,233.50 267.45,245.12 269.48,255.91 271.51,265.93 273.54,275.24 275.57,283.88 277.61,291.91 279.64,299.36 281.67,306.29 283.70,312.72 285.73,318.69 287.76,324.24 289.79,329.39 291.82,334.17 293.85,338.61 295.89,342.74 297.92,346.57 299.95,350.13 301.98,353.44 304.01,356.51 306.04,359.36 308.07,362.01 310.10,364.47 312.13,366.75 314.16,368.87 316.20,370.84 318.23,372.67 320.26,374.37 322.29,375.95 324.32,377.42 326.35,378.78 328.38,380.04 330.41,381.22 332.44,382.31 334.48,383.32 336.51,384.26 338.54,385.13 340.57,385.94 342.60,386.70 344.63,387.40 346.66,388.05 348.69,388.65 350.72,389.21 352.76,389.73 354.79,390.22 356.82,390.66 358.85,391.08 360.88,391.47 362.91,391.83 364.94,392.16 366.97,392.47 369.00,392.76 371.03,393.03 373.07,393.28 375.10,393.51" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">x&gt;0</text><circle cx="253.23297491039423" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="260.2329749103942" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Combina las potencias con base común:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f=2^(1−∣x∣−x).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para x≤0, ∣x∣=−x, de modo que f(x)=2.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para x&gt;0, ∣x∣=x y f(x)=2^(1−2x),</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">decreciente hacia 0. Los tramos se</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">unen en (0,2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>