<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">033 · Masa de un ion acelerado desde el reposo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,284.77 136.72,284.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="144.94,284.77 375.10,284.77" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="115.58,284.77 115.58,349.35 162.55,349.35 162.55,284.77" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="140.83,284.77 140.92,280.50 141.21,276.24 141.69,272.00 142.36,267.78 143.21,263.60 144.26,259.46 145.48,255.37 146.89,251.34 148.48,247.38 150.25,243.50 152.19,239.69 154.29,235.98 156.56,232.37 158.99,228.86 161.58,225.46 164.32,222.18 167.20,219.03 170.21,216.02 173.36,213.14 176.64,210.40 180.04,207.81 183.55,205.38 187.16,203.11 190.87,201.01 194.68,199.07 198.56,197.30 202.52,195.71 206.55,194.30 210.64,193.08 214.78,192.03 218.96,191.18 223.18,190.51 227.42,190.03 231.68,189.74 235.95,189.65 240.21,189.74 244.47,190.03 248.71,190.51 252.93,191.18 257.11,192.03 261.25,193.08 265.34,194.30 269.37,195.71 273.33,197.30 277.21,199.07 281.02,201.01 284.73,203.11 288.34,205.38 291.85,207.81 295.25,210.40 298.53,213.14 301.68,216.02 304.69,219.03 307.57,222.18 310.31,225.46 312.90,228.86 315.33,232.37 317.60,235.98 319.70,239.69 321.64,243.50 323.41,247.38 325.00,251.34 326.41,255.37 327.63,259.46 328.68,263.60 329.53,267.78 330.20,272.00 330.68,276.24 330.97,280.50 331.06,284.77" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="140.83,284.77 140.83,250.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="145.23,260.11 140.83,250.71 136.43,260.11" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="140.24148649582094" y="309.42539890861366" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">entrada</text><text x="333.40996062720177" y="300.03118740070454" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">placa</text><text x="235.9450162326449" y="321.1681632935001" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">diámetro 0,05 m</text><text x="349.84983076604266" y="224.8774953374318" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙ 0,5 T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia de 0,05 m es el diámetro,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que R=0,025 m.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La aceleración eléctrica da mv²/2=qV.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el campo magnético, mv=qBR.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elimina v y obtiene m=qB²R²/(2V).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye usando voltios y metros.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>