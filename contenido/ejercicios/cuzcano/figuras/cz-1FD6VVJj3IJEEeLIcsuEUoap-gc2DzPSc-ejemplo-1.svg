<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Gráfica de la exponencial de base 2</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,395.52 105.47,395.43 110.04,395.32 114.61,395.21 119.18,395.08 123.75,394.94 128.32,394.79 132.89,394.62 137.46,394.44 142.03,394.24 146.60,394.02 151.17,393.77 155.74,393.51 160.31,393.22 164.88,392.90 169.45,392.55 174.02,392.16 178.59,391.74 183.16,391.28 187.73,390.77 192.30,390.22 196.87,389.61 201.44,388.94 206.01,388.20 210.58,387.40 215.15,386.51 219.72,385.55 224.29,384.48 228.86,383.32 233.43,382.04 238.00,380.64 242.57,379.10 247.14,377.42 251.71,375.57 256.28,373.54 260.85,371.31 265.42,368.87 269.99,366.20 274.56,363.26 279.13,360.04 283.70,356.51 288.27,352.63 292.84,348.39 297.41,343.73 301.98,338.61 306.55,333.01 311.12,326.86 315.69,320.11 320.26,312.72 324.83,304.60 329.40,295.70 333.97,285.94 338.54,275.24 343.11,263.49 347.68,250.61 352.25,236.49 356.82,220.99 361.39,204.00 365.96,185.35 370.53,164.91 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">2ˣ</text><circle cx="238.0" cy="380.6391129032258" r="3.7" fill="#20364b"/><text x="245.0" y="372.6391129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,1)</text><circle cx="306.5483870967742" cy="333.008064516129" r="3.7" fill="#20364b"/><text x="313.5483870967742" y="325.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2,4)</text><circle cx="375.0967741935484" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(4,16)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula para −3,−2,−1,0 los valores</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/8,1/4,1/2,1.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para 1,2,3,4 se obtienen 2,4,8,16. La</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">base mayor que 1 hace que los valores</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aumenten.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La potencia es positiva y existe en</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">todo real. Tiende a 0 por la izquierda</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y crece sin cota por la derecha.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>