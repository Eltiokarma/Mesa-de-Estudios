<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">521 · Cadena más larga que el trazo horizontal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 146.60,293.26 192.30,269.50 238.00,293.26 283.70,269.50 329.40,293.26 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="146.60,293.26 146.60,260.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="192.30,269.50 192.30,301.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="283.70,269.50 283.70,237.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="146.6021505376344" y="249.39247311827955" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="192.3010752688172" y="313.3709677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="283.6989247311828" y="225.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">CH₃</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cadena más larga incorpora los dos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">carbonos de la rama etilo. Así</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contiene siete carbonos.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Numera desde el extremo de la derecha</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en la fórmula. Las ramas metilo quedan</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en 2, 3 y 5, frente a 3, 5 y 6 en</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sentido inverso.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa heptano como base y tres</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">localizadores para trimetil.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>