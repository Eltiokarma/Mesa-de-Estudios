<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Fuerza normal creciente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">tiempo (escala)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">radio de curvatura (escala)</text><polyline points="100.90,142.48 105.47,158.36 110.04,172.37 114.61,184.82 119.18,195.96 123.75,205.99 128.32,215.06 132.89,223.31 137.46,230.84 142.03,237.75 146.60,244.10 151.17,249.96 155.74,255.39 160.31,260.43 164.88,265.12 169.45,269.50 174.02,273.60 178.59,277.44 183.16,281.05 187.73,284.44 192.30,287.65 196.87,290.67 201.44,293.53 206.01,296.24 210.58,298.81 215.15,301.25 219.72,303.58 224.29,305.79 228.86,307.90 233.43,309.91 238.00,311.84 242.57,313.68 247.14,315.44 251.71,317.13 256.28,318.75 260.85,320.31 265.42,321.80 269.99,323.24 274.56,324.62 279.13,325.95 283.70,327.23 288.27,328.47 292.84,329.67 297.41,330.82 301.98,331.93 306.55,333.01 311.12,334.05 315.69,335.06 320.26,336.03 324.83,336.98 329.40,337.89 333.97,338.78 338.54,339.64 343.11,340.48 347.68,341.29 352.25,342.08 356.82,342.85 361.39,343.59 365.96,344.32 370.53,345.02 375.10,345.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">ρ∝1/F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como F·v=0, la rapidez permanece</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">constante.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El radio de curvatura local es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ρ=mv²/F, que disminuye al crecer F.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el modelo plano con giro del mismo</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sentido, corresponde a curvatura</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">creciente, ilustrada por la espiral</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia dentro (D).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>