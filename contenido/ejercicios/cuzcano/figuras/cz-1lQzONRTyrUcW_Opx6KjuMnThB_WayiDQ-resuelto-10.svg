<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Distancia entre una diagonal de la base y una diagonal espacial</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="104.29,389.62 288.72,389.62 371.71,326.91 371.71,142.48 187.28,142.48 104.29,205.19 104.29,389.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="288.72,389.62 288.72,205.19 371.71,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="104.29,205.19 288.72,205.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="104.29,205.19 371.71,326.91" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="187.28,326.91 288.72,389.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,358.27 282.57,286.34" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="104.29,389.62 187.28,326.91" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="187.28,326.91 371.71,326.91" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="187.28,326.91 187.28,142.48" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><text x="104.28910476493817" y="389.618491126339" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="187.28207422118345" y="326.91269198162036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="371.7108952350618" y="326.91269198162036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="288.7179257788166" y="389.618491126339" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="104.28910476493817" y="205.18967011246062" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="238.0" y="358.2655915539797" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="282.5702984116873" y="286.33835135856714" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="187.37428863169038" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">k</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En unidades de k, coloca R=(0,0,1),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A=(1,1,0), P=(0,1,0) y E=(1,0,0). El</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto medio I=(1/2,1/2,0) de PE está</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en el plano x=y que contiene RA.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El pie de I sobre RA es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T=(2/3,2/3,1/3). El vector</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">IT=(1/6,1/6,1/3) es ortogonal tanto a</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1,1,−1) como a (1,−1,0).</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I y T pertenecen a los dos segmentos.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia es la norma de IT,</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplicada por k.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>