<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">009 · Mínimos y raíces de un cuadrado de un trinomio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="340.06451612903226" x2="421" y2="340.06451612903226" stroke="#20364b" stroke-width="1.7"/><line x1="265.41935483870964" y1="105" x2="265.41935483870964" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,142.48 105.47,175.99 110.04,206.12 114.61,233.09 119.18,257.13 123.75,278.46 128.32,297.28 132.89,313.81 137.46,328.22 142.03,340.70 146.60,351.43 151.17,360.57 155.74,368.29 160.31,374.73 164.88,380.05 169.45,384.36 174.02,387.80 178.59,390.50 183.16,392.55 187.73,394.06 192.30,395.12 196.87,395.83 201.44,396.25 206.01,396.46 210.58,396.52 215.15,396.47 219.72,396.38 224.29,396.27 228.86,396.17 233.43,396.10 238.00,396.08 242.57,396.10 247.14,396.17 251.71,396.27 256.28,396.38 260.85,396.47 265.42,396.52 269.99,396.46 274.56,396.25 279.13,395.83 283.70,395.12 288.27,394.06 292.84,392.55 297.41,390.50 301.98,387.80 306.55,384.36 311.12,380.05 315.69,374.73 320.26,368.29 324.83,360.57 329.40,351.43 333.97,340.70 338.54,328.22 343.11,313.81 347.68,297.28 352.25,278.46 356.82,257.13 361.39,233.09 365.96,206.12 370.53,175.99 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F</text><circle cx="210.5806451612903" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="217.5806451612903" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M₁</text><circle cx="265.41935483870964" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="272.41935483870964" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe F=(x²+x)²−8. Su mínimo −8</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ocurre donde x²+x=0, es decir en −1 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ceros cumplen x²+x=±2√2. La rama</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativa es imposible porque</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x²+x≥−1/4. La positiva es cuadrática y</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene dos raíces reales.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El menor cero se encuentra entre −3 y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−2 porque x²+x baja de 6 a 2 en ese</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intervalo, cruzando 2√2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>