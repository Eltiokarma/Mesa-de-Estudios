<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">033 · Una esfera pequeña sobre una superficie esférica</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="122.23,205.99 130.54,206.17 138.84,206.72 147.10,207.62 155.32,208.89 163.47,210.51 171.54,212.48 179.52,214.81 187.40,217.48 195.14,220.49 202.75,223.84 210.21,227.52 217.49,231.52 224.60,235.83 231.51,240.45 238.22,245.36 244.70,250.57 250.95,256.05 256.95,261.80 262.70,267.80 268.18,274.05 273.39,280.53 278.30,287.24 282.92,294.15 287.23,301.25 291.23,308.54 294.91,316.00 298.25,323.61 301.27,331.35 303.94,339.22 306.26,347.20 308.24,355.28 309.86,363.43 311.13,371.65 312.03,379.91 312.58,388.21 312.76,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="353.77,205.99 352.80,217.02 349.94,227.71 345.26,237.75 338.91,246.81 331.08,254.64 322.01,260.99 311.98,265.67 301.29,268.54 290.26,269.50 279.23,268.54 268.54,265.67 258.51,260.99 249.44,254.64 241.61,246.81 235.26,237.75 230.58,227.71 227.72,217.02 226.75,205.99 227.72,194.96 230.58,184.27 235.26,174.24 241.61,165.17 249.44,157.34 258.51,150.99 268.54,146.31 279.23,143.45 290.26,142.48 301.29,143.45 311.98,146.31 322.01,150.99 331.08,157.34 338.91,165.17 345.26,174.24 349.94,184.27 352.80,194.96 353.77,205.99" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="122.23,205.99 226.75,205.99" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="122.23,205.99 122.23,396.52 328.63,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="122.23,396.52 290.26,205.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="134.2992275216385" y="306.3346774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="308.31132429583204" y="202.18145161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">r</text><text x="176.84963074744493" y="191.3850806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Hilo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta que une los centros mide R+r</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y la diferencia de alturas es R. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separación horizontal es</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√[(R+r)²−R²]=√(r²+2Rr).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La normal va por la línea de centros.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su componente vertical equilibra mg y</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">su componente horizontal equilibra la</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tensión T.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las componentes guardan la misma razón</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que los catetos de la figura. Por</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tanto T/(mg)=√(r²+2Rr)/R.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>