<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">050 · Conductor en ángulo recto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="134.01,178.96 134.01,349.69 361.65,349.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="134.01,178.96 361.65,349.69" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="134.01,336.24 147.46,336.24 147.46,349.69" fill="none" stroke="#008674" stroke-width="2.5"/><text x="121.59707851491174" y="174.82562385879487" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="122.63177115033474" y="364.17437614120513" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="375.0967741935484" y="360.0356055995131" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="100.9032258064516" y="274.1561168594035" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,6 m</text><text x="317.15398660986" y="332.0989044430919" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="293.3560559951309" y="223.45617772367618" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙ 0,1 T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza total se calcula con el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segmento entre A y C. La hipotenusa es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AH/sen 37°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usando sen 37°≈3/5 se obtiene AC≈1 m.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como AC es perpendicular al campo,</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F=IB·AC.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>