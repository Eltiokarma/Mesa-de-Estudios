<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">032 · Producto con una raíz excluida interior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="108.75" y1="275" x2="196.25" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="108.75" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="196.25" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><line x1="196.25" y1="275" x2="371.25" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="196.25" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="371.25" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="108.75" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">1</text><text x="196.25" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">2</text><text x="371.25" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">4</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El factor x²+x+1 es positivo. Los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">factores de multiplicidad par solo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pueden aportar ceros.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El signo restante es el de (x−1)(x−4),</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativo entre 1 y 4. El cero par −3/2</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda fuera del intervalo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se excluye 2, donde se anula el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">producto. Así (ab)^c=(1·4)²=16.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>