<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">085 · Línea de acción de dos fuerzas paralelas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.22,341.19 363.78,341.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="112.22,190.26 112.22,341.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,317.30 112.22,341.19 123.54,317.30" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="363.78,190.26 363.78,341.19" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="352.46,317.30 363.78,341.19 375.10,317.30" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="112.22314294169871" y="163.84744007102694" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 N</text><text x="363.7768570583013" y="163.84744007102694" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 N</text><text x="112.22314294169871" y="370.121485646641" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="363.7768570583013" y="370.121485646641" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="238.0" y="375.15255992897306" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza resultante es vertical hacia</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abajo con magnitud 30 N.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza de A no aporta momento</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto de A. La de B aporta un</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">momento horario de 20×2=40 N·m.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para que la resultante tenga el mismo</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">efecto, 30x=40.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>