<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">077 · Campo variable e inclinado sobre una espira cuadrada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,304.55 145.23,249.40 265.32,249.40 220.99,304.55 100.90,304.55" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="118.43,339.08 183.88,216.93" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="182.92,226.36 183.88,216.93 176.56,222.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="154.50,339.08 219.96,216.93" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="219.00,226.36 219.96,216.93 212.64,222.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="190.58,339.08 256.04,216.93" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="255.08,226.36 256.04,216.93 248.72,222.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="190.58,276.72 190.58,204.04" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="194.19,212.81 190.58,204.04 186.98,212.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="295.21,329.80 295.21,203.01" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="295.21,329.80 374.58,329.80" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="295.21,309.70 321.50,212.29" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="125.64249333009946" y="313.824520979869" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">70 cm</text><text x="217.89934513703614" y="273.6232112539413" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="249.33883094833857" y="211.7750424448217" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="300.87897162260487" y="199.92081008974048" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B(t)</text><text x="375.0967741935484" y="338.56378850351683" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t (s)</text><text x="307.5791899102595" y="248.88394373029348" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La normal hace 53° con el campo, así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que el flujo es B(0,7 m)² cos 53°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tasa de cambio del campo se</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplica por ese factor geométrico.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con la aproximación del libro, cos</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">53°≈3/5, se obtiene 24/7×0,49×3/5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>