<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Diámetro del pistón pequeño a partir de desplazamientos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,187.24 100.90,367.89 375.10,367.89 375.10,187.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="136.39,187.24 136.39,322.73 262.19,322.73 262.19,187.24" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,229.18 136.39,229.18" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="262.19,229.18 375.10,229.18" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="124.77419354838709" y="171.11290322580643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 mm</text><text x="320.258064516129" y="171.11290322580643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,05 mm</text><text x="320.258064516129" y="284.01612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D = 8 mm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El volumen de fluido desplazado</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coincide en ambos pistones. Así Aₚ ×</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">10 = Aɢ × 0,05.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las áreas son proporcionales a los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrados de los diámetros. Entonces</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dₚ² = 8²(0,05/10).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma la raíz positiva y redondea.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>