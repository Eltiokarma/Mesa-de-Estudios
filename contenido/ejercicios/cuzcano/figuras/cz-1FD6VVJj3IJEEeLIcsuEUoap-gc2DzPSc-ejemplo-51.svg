<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">051 · La base cambia de monotonía</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución real</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="100.0" y1="275" x2="170.0" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="100.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="100.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">-2</text><circle cx="170.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="170.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">-1</text><line x1="170.0" y1="275" x2="240.0" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="170.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="170.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">-1</text><circle cx="240.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="240.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">0</text><line x1="240.0" y1="275" x2="380.0" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="240.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="240.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">0</text><circle cx="380.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="380.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">2</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se requiere x&gt;−2, x≠−1, x≠0. Si</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−2&lt;x&lt;−1, la base es menor que 1 y se</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exige x²&gt;x+2, que vale en todo ese</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tramo.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si x&gt;−1 y x≠0, la base es mayor que 1:</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x²&lt;x+2, o −1&lt;x&lt;2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Unir los tramos conservando las</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exclusiones de la base y el argumento.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>