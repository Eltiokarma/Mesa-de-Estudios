<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">024 · Un segmento medio entre mediatrices</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="114.32,368.01 178.75,185.76 368.81,221.08 114.32,368.01 243.19,368.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="178.75,142.48 178.75,185.76 178.75,368.01 178.75,393.78" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="282.75,155.15 273.78,203.42 243.19,368.01 237.89,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="178.75,357.70 189.06,357.70 189.06,368.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="270.95,218.62 286.16,221.45 288.98,206.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="107.19338498422526" y="360.8826739680922" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="171.62894360713895" y="178.6313921608698" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="361.68096283592706" y="213.95420238999637" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="236.06450223005265" y="360.8826739680922" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="171.62894360713895" y="360.8826739680922" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="234.43717391007615" y="287.4184381790443" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="183.8443473440206" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="287.841453423556" y="155.15006461169713" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como B está en la mediatriz de AD,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BA=BD=6.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como D está en la mediatriz de BC,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DC=DB=6.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ADC, TM une los puntos medios de AD</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y AC. Por tanto, TM=DC/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>