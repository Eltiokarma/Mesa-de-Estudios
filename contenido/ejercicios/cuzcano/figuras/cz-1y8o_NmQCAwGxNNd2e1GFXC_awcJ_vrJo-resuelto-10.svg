<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Corte paralelo dentro de la región de una bisectriz</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.29,349.25 178.19,195.17 286.98,194.18 356.88,346.29 108.29,349.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="178.19,195.17 264.83,306.91 339.16,305.93" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="264.83,306.91 295.84,346.79" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="306.67,192.71 375.10,346.29" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645159" y="355.15471709040366" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="177.2048416053744" y="185.32208837667224" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="289.93432559217" y="183.353014420571" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="363.282330456941" y="352.20110615625185" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="297.81062141657503" y="355.646985579429" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="243.16881913476576" y="184.3375513986216" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="296.8260844385244" y="299.0361093415185" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="337.1921005385997" y="246.8556495048358" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3K</text><text x="368.6972838362194" y="322.172728325708" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">K</text><text x="175.72803613829848" y="210.42778131696295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="193.44970174320957" y="202.55148549255802" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prolonga la bisectriz hasta I sobre</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">RA. El paralelismo hace</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠RIO=∠ION=∠ROI, por lo que RI=RO.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así IA=RA−RO=2. El segmento x es un</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corte paralelo de IONA, cuyas bases</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">miden 4 y 2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Está a tres cuartos de la altura desde</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ON hacia IA. Interpola 4+(3/4)(2−4).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>