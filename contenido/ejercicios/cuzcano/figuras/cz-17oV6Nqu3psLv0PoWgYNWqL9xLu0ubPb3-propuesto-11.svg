<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Área de un triángulo entre dos paralelas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="163.31,386.35 312.69,386.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="180.59,396.52 180.59,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="180.59,386.35 261.88,325.39 261.88,188.21 180.59,386.35" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="170.43,256.80 302.52,157.73" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="170.43,393.98 302.52,294.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="312.6854838709677" y="385.33870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="181.6048387096774" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="184.0435483870968" y="392.2483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="264.6225806451613" y="329.85806451612905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A(8,6)</text><text x="264.82580645161283" y="189.53064516129032" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="194.30645161290323" y="226.51774193548388" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C(2,15)</text><text x="299.4758064516129" y="153.1532258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="299.4758064516129" y="289.8225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OA tiene longitud 10. La recta L₂</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene ecuación 3x−4y=0.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura desde B a L₂ es la misma que</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la de C a L₂, porque L₁ es paralela a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">L₂. Esa distancia es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∣3·2−4·15∣/5=54/5.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área es la mitad de OA por la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>