<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">089 · Ángulo obtuso con dos ángulos de 30°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="116.77,339.26 353.69,339.26 369.00,193.64 116.77,339.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="263.19,339.26 369.00,193.64" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645157" y="357.5651918974223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="353.6898719081723" y="358.78541621309057" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.09677419354836" y="180.2145837869094" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="258.3121625276535" y="358.78541621309057" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="152.1526470645173" y="330.72025695272123" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="342.1507176705061" y="231.46400504497515" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="323.1842640164665" y="320.95846242737537" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="187.53915221889605" y="347.80339737207646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=</text><text x="362.2314421178499" y="258.72702232829556" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Fija DA=RO=1 y s=sen(150°−x). La ley</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de senos en DRO da DR=2s. En ARO da</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AR=1/(2s).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como DR=DA+AR, se obtiene 4s²−2s−1=0.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La raíz positiva es s=(1+√5)/4=sen54°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El dato obtuso obliga 0&lt;150°−x&lt;60°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así 150°−x=54° y x=96°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>