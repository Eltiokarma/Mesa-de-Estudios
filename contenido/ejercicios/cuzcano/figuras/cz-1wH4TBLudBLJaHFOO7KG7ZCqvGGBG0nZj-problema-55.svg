<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Problema 55: Capacidad de una piscina</title><desc id="desc">Reconstrucción vectorial. Sólido en perspectiva y sección auxiliar con datos y letras.</desc><rect width="900" height="540" rx="18" fill="#f5f8fc"/><text x="28.00" y="36.00" font-family="Arial,sans-serif" font-size="22" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">55  /  Capacidad de una piscina</text><line x1="460.00" y1="70.00" x2="460.00" y2="490.00" stroke="#d8e2ee" stroke-width="1"/><text x="28.00" y="517.00" font-family="Arial,sans-serif" font-size="14" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Esquema en perspectiva · Las cotas, no la apariencia, definen la geometría.</text><polygon points="550.00,120.00 820.00,120.00 820.00,310.00 550.00,310.00" fill="#e1ecfa" fill-opacity="0.6" stroke="#2463c4" stroke-width="2"/><text x="492.00" y="375.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Tramos 10, 5, 5 m; ancho 10 m</text><text x="492.00" y="402.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Profundidades: 1 → 2 → 6 m</text><text x="492.00" y="429.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">650 m³ = 650 000 litros</text><text x="550.00" y="210.00" font-family="Arial,sans-serif" font-size="24" fill="#c36117" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">1 m³ = 1000 L</text><polygon points="55.00,216.03 420.00,216.03 420.00,318.96 328.75,318.96 237.50,250.34 55.00,233.19" fill="#bce6dc" fill-opacity="0.45" stroke="#008778" stroke-width="2"/><line x1="55.00" y1="216.03" x2="420.00" y2="216.03" stroke="#233b53" stroke-width="1.8"/><line x1="420.00" y1="216.03" x2="420.00" y2="318.96" stroke="#233b53" stroke-width="1.8"/><line x1="420.00" y1="318.96" x2="328.75" y2="318.96" stroke="#233b53" stroke-width="1.8"/><line x1="328.75" y1="318.96" x2="237.50" y2="250.34" stroke="#233b53" stroke-width="1.8"/><line x1="237.50" y1="250.34" x2="55.00" y2="233.19" stroke="#233b53" stroke-width="1.8"/><line x1="55.00" y1="233.19" x2="55.00" y2="216.03" stroke="#233b53" stroke-width="1.8"/><text x="40.00" y="255.19" font-family="Arial,sans-serif" font-size="17" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">1 m</text><text x="227.50" y="272.35" font-family="Arial,sans-serif" font-size="17" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">2 m</text><text x="323.75" y="340.96" font-family="Arial,sans-serif" font-size="17" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">6 m</text><text x="160.00" y="405.00" font-family="Arial,sans-serif" font-size="18" fill="#2463c4" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">10 m + 5 m + 5 m</text></svg>