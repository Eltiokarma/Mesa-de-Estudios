8" y="229.5345197000357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">inicio</text><text x="236.98821568860848" y="229.5345197000357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">final</text><text x="206.6346863468635" y="280.12373526961073" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una imagen real del mismo tamaño se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene cuando p=q=R.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para la nueva imagen, el aumento</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivo 2 exige q=−2p. Sustituyendo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en 1/f=1/p+1/q, queda 1/f=1/(2p).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como f=R/2, la distancia final es R/4.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta esa distancia a la inicial.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>