<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">019 · Punto proyectado sobre una diagonal del cubo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,207.10 186.00,142.80 375.10,142.80 290.00,207.10 100.90,207.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,207.10 100.90,396.20 290.00,396.20 290.00,207.10 375.10,142.80 375.10,331.90 290.00,396.20" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,396.20 375.10,237.35" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="290.00,396.20 222.77,325.60" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="222.77,325.60 375.10,331.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,396.20 186.00,331.90 186.00,142.80" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="186.00,331.90 375.10,331.90" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="100.9032258064516" y="396.1963292547275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="185.99777530589543" y="331.9026696329255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="375.0967741935484" y="331.9026696329255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="290.0022246941046" y="396.1963292547275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="100.9032258064516" y="207.09733036707456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="185.99777530589543" y="142.80367074527248" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="142.80367074527248" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="290.0022246941046" y="207.09733036707456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.0967741935484" y="237.35317018909896" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="222.7670250896057" y="325.59936967000374" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="257.47719688542827" y="347.4844271412681" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">NG</text><text x="375.0967741935484" y="282.7369299221357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3√6</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En unidades de arista, toma E=(0,0,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H=(1,0,0), G=(1,1,0) y M=(1,1,1/2).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El parámetro de la proyección es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(EH·EM)/(EM·EM)=1/(9/4)=4/9. Así</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N=(4/9,4/9,2/9).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La norma al cuadrado de NG es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2(5/9)²+(2/9)²=2/3. Multiplica la raíz</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por 6√6 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>