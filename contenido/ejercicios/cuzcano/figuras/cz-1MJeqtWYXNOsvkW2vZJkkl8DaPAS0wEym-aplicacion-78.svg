ll="#20364b" text-anchor="middle">m</text><text x="323.22231909328684" y="292.472972972973" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2m</text><text x="110.90758500435919" y="248.37968613775067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="348.7890148212729" y="285.4328683522232" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La barra horizontal transmite fuerzas</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontales. En cada esfera, su</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respectivo cable debe compensar el</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">peso en vertical.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En horizontal, las dos componentes de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las tensiones tienen la misma magnitud</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H. Así H tan 37°=mg y H tan α=2mg.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide las ecuaciones. Se obtiene tan</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α=2 tan 37°. El libro usa tan 37°≈3/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>