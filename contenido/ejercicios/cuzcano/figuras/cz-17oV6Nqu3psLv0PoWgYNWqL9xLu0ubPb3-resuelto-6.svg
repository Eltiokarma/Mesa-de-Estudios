<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Vértice de un triángulo a partir del ortocentro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="139.21,349.47 336.79,349.47" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="186.25,396.52 186.25,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="167.44,311.84 242.70,368.29 308.56,170.71 167.44,311.84" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="167.44,311.84 252.11,340.06" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="242.70,368.29 167.44,293.02" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="156.61559139784947" y="305.252688172043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="245.5268817204301" y="372.994623655914" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="313.26881720430106" y="164.1236559139785" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="190.48655913978493" y="326.89247311827955" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura AH tiene pendiente −1/3.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces BC tiene pendiente 3 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ecuación y=3x−20.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura BH tiene pendiente −1.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces AC tiene pendiente 1 y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ecuación y=x+6.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala las dos expresiones de y. Se</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene x=13 y luego y=19.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>