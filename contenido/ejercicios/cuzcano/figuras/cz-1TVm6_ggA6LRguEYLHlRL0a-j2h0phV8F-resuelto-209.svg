<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">209 · Igualdad de lados alrededor de un punto interior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.94,332.25 238.43,206.75 363.92,332.25 112.94,332.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="112.94,332.25 252.18,267.95 363.92,332.25" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645159" y="345.1395995550612" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.4297704520174" y="193.000859540904" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="345.999140459096" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="247.8847203964" y="283.2526544645566" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="334.6983517039135" y="323.6510769541915" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2t</text><text x="333.8388107998787" y="313.3365861057741" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t</text><text x="254.7610476286783" y="295.28622712104357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">9t</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el isósceles ABC, ∠A = ∠C = 3t. En</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ADC, ∠DAC = 180° − 11t. Debe quedar</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre 0° y 3t, así que 180°/14 &lt; t &lt;</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°/11.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con la ley de senos, AD/AC = sen</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2t/sen 9t y BC/AC = 1/(2 cos 3t).</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala y usa producto a suma para</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtener 4 cos 7t cos t = −1.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lado izquierdo equivale a 2(cos 8t</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">+ cos 6t), estrictamente decreciente</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en el intervalo. En t = 15° vale −1,</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por lo que es la única solución.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>