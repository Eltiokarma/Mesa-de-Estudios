<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">022 · Cubo de una suma de razones de segmentos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,280.75 375.10,280.75" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,277.35 107.18,284.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="231.11,277.35 231.11,284.15" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="313.74,277.35 313.74,284.15" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.82,277.35 368.82,284.15" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="231.11,254.59 313.74,254.59" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="231.11,251.45 231.11,257.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="313.74,251.45 313.74,257.73" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="107.18246737256834" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="231.1148667038194" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="313.73646625798676" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="368.81753262743166" y="292.7855208076828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="272.4256664809031" y="246.21447919231716" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">MO</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como MO=AO−AM, el primer sumando es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1−AM/AO.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como MO=MR−OR, el segundo sumando es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1−OR/MR.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma vale 2−1=1, así que x³=8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>