<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">055 · La mitad de un tramo de la base</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="148.79,149.40 148.79,396.52 231.16,396.52 334.13,396.52 241.46,272.96 148.79,149.40" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="148.79,149.40 200.27,303.85 231.16,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="241.46,272.96 200.27,303.85" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="148.79,383.34 161.97,383.34 161.97,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="236.52,266.37 229.93,271.31 234.87,277.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="141.8730074055479" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="141.8730074055479" y="389.59696247018957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="327.2078260323836" y="389.59696247018957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="234.54041671896576" y="266.04041671896573" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="193.35490146855784" y="296.9295531567717" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="224.2440379063638" y="389.59696247018957" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja C y M en AP para obtener C′ y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M′ sobre AB prolongada. N permanece</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fijo, NM′=NM y NM′∥BC.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos ANM′ y APB son</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semejantes. Si AB=b, AC=s y BP=p,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entonces AM′=s/2 y NM=ps/(2b).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la bisectriz, BP/PC=b/s. Sustituye</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ps/b=PC y resulta MN=PC/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>