<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">040 · Espira rectangular junto a un hilo largo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="127.21,183.50 127.21,355.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="243.56,223.97 359.92,223.97 359.92,315.03 243.56,315.03 243.56,223.97" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="127.21,329.20 243.56,329.20" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="116.08,235.61 116.08,296.31" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="112.29,287.21 116.08,296.31 119.87,287.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="265.32,214.86 319.95,214.86" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="310.85,218.66 319.95,214.86 310.85,211.07" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645163" y="266.9705392215212" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 A</text><text x="292.6363528151411" y="204.23991191524817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 A</text><text x="187.91667658612073" y="337.79544101892634" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">25 cm</text><text x="298.7070586834901" y="331.7247351505773" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">25 cm</text><text x="375.0967741935484" y="271.0176764670872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las fuerzas en los tramos horizontales</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se cancelan punto a punto por</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">simetría. En los lados verticales, la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corriente más cercana es opuesta a la</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del hilo y la lejana tiene su mismo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los campos a 0,25 y 0,50 m valen</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1,6×10⁻⁶ T y 0,8×10⁻⁶ T,</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respectivamente, usando B=μ₀I/(2πd).</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La repulsión cercana domina.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica la diferencia de campos por</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la corriente de la espira y por 0,20</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>