<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Distancia a la base y al vértice</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.17,379.49 237.61,158.74 365.06,379.49 110.17,379.49" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="205.95,303.79 237.61,158.74" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="205.95,303.79 205.95,379.49" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="205.95,303.79 166.86,281.24" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="205.95,303.79 294.38,257.22" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645163" y="392.61676510676966" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="237.61381190368016" y="144.83848250795097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="392.61676510676966" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="206.7187641980918" y="319.2410268059973" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="206.7187641980918" y="394.1615174920491" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="157.2866878691504" y="272.12607905497504" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="303.2657882780554" y="248.95479327578371" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea h la altura del equilátero y t =</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PH. La suma de distancias a los tres</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lados es h, de modo que h = t + 13.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con A en el origen, AC horizontal, la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia de P a AB da √3·xP − t = 4.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vértice B tiene xB = h/√3. Entonces</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">xB − xP = 9/√3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las diferencias vertical y horizontal</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre P y B son 13 y 9/√3. Por</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pitágoras PB = √(169 + 27) = 14.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>