<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Una barra con una cuerda que gira por su extremo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="170.92,142.48 170.92,381.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="170.92,353.66 285.20,285.34 170.92,154.91" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="291.42,285.34 291.32,286.42 291.04,287.46 290.58,288.44 289.96,289.33 289.20,290.10 288.31,290.72 287.33,291.17 286.28,291.45 285.20,291.55 284.13,291.45 283.08,291.17 282.10,290.72 281.21,290.10 280.45,289.33 279.83,288.44 279.37,287.46 279.09,286.42 278.99,285.34 279.09,284.26 279.37,283.21 279.83,282.23 280.45,281.35 281.21,280.58 282.10,279.96 283.08,279.50 284.13,279.22 285.20,279.13 286.28,279.22 287.33,279.50 288.31,279.96 289.20,280.58 289.96,281.35 290.58,282.23 291.04,283.21 291.32,284.26 291.42,285.34" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="291.42,285.34 291.42,364.84" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="272.16,364.84 310.67,364.84 310.67,396.52 272.16,396.52 272.16,364.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="234.2733654073665" y="330.0578121302942" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,5 m</text><text x="146.07634671504064" y="254.2829087467466" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,8 m</text><text x="329.92365328495936" y="379.12516759996845" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">16 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos ramas de la cuerda tiran con</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">16 N. Una apunta al anclaje y la otra</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia abajo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si x es la distancia horizontal del</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pasador a la pared, el momento del</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">peso respecto de la articulación es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">16x. El momento de la tensión</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclinada tiene magnitud 16×0,8x/ℓ,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al igualar momentos resulta ℓ=0,8 m.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El equilibrio horizontal exige</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C(x/0,5)=16(x/ℓ). Despeja.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>