<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">082 · Mediana con ángulo doble y un ángulo de 30°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="105.98,293.44 283.70,241.94 366.39,291.26 105.98,293.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="283.70,241.94 235.10,292.71" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="303.59284860897765" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="285.14968424645843" y="235.40715139102238" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="297.78981054787505" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="234.3731012118109" y="303.59284860897765" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="134.99607441542926" y="289.810633213859" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="270.642089093702" y="251.36550605905447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2x</text><text x="345.35620413039766" y="286.1837344256699" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea x=∠BAC. Entonces ∠MBC=150°−3x. Las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">áreas de ABM y MBC son iguales, por lo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que AB sen(2x)=BC sen(150°−3x).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ley de senos, AB/BC=sen30°/sen x.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye y obtén sen(150°−3x)=cos x.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En 0&lt;x&lt;50° se obtiene x=15° o x=30°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para x=30°, A=C y BM biseca B=120°,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que también verifica el dato.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>