<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">009 · Inclinación desde un trapecio perpendicular al plano</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="125.69,310.13 162.69,221.33 244.09,221.33 281.09,310.13" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,317.67 285.90,317.67 375.10,250.28 190.10,250.28" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,317.67 285.90,317.67 375.10,250.28 190.10,250.28 100.90,317.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="125.69,310.13 162.69,221.33 244.09,221.33 281.09,310.13 125.69,310.13" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="192.29,221.33 261.51,257.83" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="192.29,310.13 261.51,257.83" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="192.29,221.33 192.29,310.13" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><text x="125.69329796485695" y="310.12611825362546" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="281.09375030112926" y="310.12611825362546" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="162.6934056639694" y="221.3258597757556" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="244.09364260201679" y="221.3258597757556" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="192.29349182325936" y="221.3258597757556" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="192.29349182325936" y="310.12611825362546" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="261.50644355727314" y="257.8318880545928" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La semidiferencia de bases es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(21−11)/2=5.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura del trapecio es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(13²−5²)=12, que también es la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia de F al plano P.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El seno de la inclinación es 12/24.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>