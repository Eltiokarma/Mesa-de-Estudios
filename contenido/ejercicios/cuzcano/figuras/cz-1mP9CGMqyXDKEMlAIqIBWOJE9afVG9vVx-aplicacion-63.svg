<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">063 · Flujo lateral en un cono con campo oblicuo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="341.34,325.41 340.81,328.33 339.22,331.23 336.60,334.07 332.96,336.82 328.35,339.45 322.82,341.94 316.41,344.25 309.20,346.38 301.25,348.29 292.66,349.96 283.51,351.38 273.89,352.54 263.90,353.42 253.65,354.01 243.23,354.30 232.77,354.30 222.35,354.01 212.10,353.42 202.11,352.54 192.49,351.38 183.34,349.96 174.75,348.29 166.80,346.38 159.59,344.25 153.18,341.94 147.65,339.45 143.04,336.82 139.40,334.07 136.78,331.23 135.19,328.33 134.66,325.41 135.19,322.48 136.78,319.58 139.40,316.74 143.04,314.00 147.65,311.36 153.18,308.88 159.59,306.56 166.80,304.43 174.75,302.53 183.34,300.85 192.49,299.43 202.11,298.27 212.10,297.40 222.35,296.81 232.77,296.51 243.23,296.51 253.65,296.81 263.90,297.40 273.89,298.27 283.51,299.43 292.66,300.85 301.25,302.53 309.20,304.43 316.41,306.56 322.82,308.88 328.35,311.36 332.96,314.00 336.60,316.74 339.22,319.58 340.81,322.48 341.34,325.41" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,325.41 338.58,331.61" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="134.66,325.41 238.00,144.91 341.34,325.41" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,144.91 238.00,368.12" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="255.22,394.09 100.90,277.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.34,288.30 100.90,277.39 113.15,280.61" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="315.16,394.09 160.84,277.39" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="167.27,288.30 160.84,277.39 173.09,280.61" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,394.09 220.78,277.39" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="227.21,288.30 220.78,277.39 233.03,280.61" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="315.8489220295023" y="357.0972604960285" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 m</text><text x="345.47284811152537" y="217.93370076187387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B = 10/π T</text><text x="209.0650024315124" y="370.18690225320154" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53° con el eje</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El disco de base tiene área 9π m² y su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal exterior apunta hacia abajo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El flujo por el disco es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−(10/π)(9π)cos 53°, aproximadamente</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−54 Wb con cos 53°≈3/5.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como el flujo por la superficie</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cerrada es nulo, la parte lateral</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aporta +90 cos 53° Wb.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>