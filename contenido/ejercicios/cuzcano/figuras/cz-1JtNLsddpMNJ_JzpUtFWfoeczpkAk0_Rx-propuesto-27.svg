.08154576715245" y="246.8825118716227" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">inicio</text><text x="139.87489765842474" y="246.8825118716227" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 s</text><text x="292.28197150810547" y="255.58154576715245" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">imagen final</text><text x="311.767807434092" y="276.1112657606026" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="375.09677419354836" y="276.1112657606026" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El espejo convexo tiene f=−1,5 m. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">imagen virtual a 1 m tiene q=−1 m.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye en 1/p=1/f−1/q=−2/3+1=1/3</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m⁻¹. La persona está a 3 m al final.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide el aumento de distancia 3−0,5 m</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por los 2 s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>