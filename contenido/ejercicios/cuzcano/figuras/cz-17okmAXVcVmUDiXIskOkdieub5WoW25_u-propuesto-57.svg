<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Cotangente entre dos rayos con un signo dudoso</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="157.45,302.21 314.62,302.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="275.33,396.52 275.33,148.97" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="236.04,164.68 275.33,302.21 177.10,380.80" fill="none" stroke="#008674" stroke-width="2.5"/><text x="318.55160541875614" y="302.21181049322655" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="275.3287927550333" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="229.1589701369658" y="158.98712671207244" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(−2, 7)</text><text x="172.1834443529676" y="387.67509916922387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(−5, −4)</text><text x="254.50325574433052" y="295.72838859366817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En un ángulo entre vectores, la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cotangente es el producto escalar</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dividido por la magnitud del</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">determinante.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con el segundo punto en el tercer</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrante, (−5,−4), el producto</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">escalar es −18 y el determinante tiene</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">magnitud 43.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si se usa literalmente (−5,4), los</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valores son 38 y 27. El ángulo y su</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cotangente cambian.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>