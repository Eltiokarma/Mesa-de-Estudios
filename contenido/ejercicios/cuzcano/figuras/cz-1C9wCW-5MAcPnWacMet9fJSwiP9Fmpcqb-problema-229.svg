rt">cruce3,5</text><circle cx="269.6377171215881" cy="396.5354771507383" r="3.7" fill="#20364b"/><text x="276.6377171215881" y="388.5354771507383" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">valle8</text><circle cx="100.90322580645162" cy="333.01773857536915" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="325.01773857536915" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">marca incompatible</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Del cruce ascendente al valle</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">siguiente hay3λ/4=8−3,5=4,5 m: λ=6 m.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f=v/λ=4 Hz y ω=8π rad/s,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">correspondiente a D usando esos dos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puntos.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ese perfil exige y(0)=+2 m. Por tanto</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">no puede cumplir a la vez la marca−2;</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la gráfica tiene datos incompatibles.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>