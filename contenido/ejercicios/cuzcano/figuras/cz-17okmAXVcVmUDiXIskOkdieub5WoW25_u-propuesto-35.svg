<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Identidad con dos cubos de senos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="238.00000000000003" y1="105" x2="238.00000000000003" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (radianes)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">suma</text><polyline points="100.90,396.52 105.47,395.82 110.04,393.74 114.61,390.30 119.18,385.54 123.75,379.50 128.32,372.26 132.89,363.89 137.46,354.49 142.03,344.16 146.60,333.01 151.17,321.16 155.74,308.75 160.31,295.91 164.88,282.78 169.45,269.50 174.02,256.22 178.59,243.09 183.16,230.25 187.73,217.84 192.30,205.99 196.87,194.84 201.44,184.51 206.01,175.11 210.58,166.74 215.15,159.50 219.72,153.46 224.29,148.70 228.86,145.26 233.43,143.18 238.00,142.48 242.57,143.18 247.14,145.26 251.71,148.70 256.28,153.46 260.85,159.50 265.42,166.74 269.99,175.11 274.56,184.51 279.13,194.84 283.70,205.99 288.27,217.84 292.84,230.25 297.41,243.09 301.98,256.22 306.55,269.50 311.12,282.78 315.69,295.91 320.26,308.75 324.83,321.16 329.40,333.01 333.97,344.16 338.54,354.49 343.11,363.89 347.68,372.26 352.25,379.50 356.82,385.54 361.39,390.30 365.96,393.74 370.53,395.82 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">3√3 cos x / 4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa sen³u=(3sen u−sen 3u)/4 en los dos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cubos.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los términos de ángulo triple son</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen(180°+3x) y sen(180°−3x). Su suma</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es cero.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La suma de los senos restantes es 2sen</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60° cos x. Multiplica por 3/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>