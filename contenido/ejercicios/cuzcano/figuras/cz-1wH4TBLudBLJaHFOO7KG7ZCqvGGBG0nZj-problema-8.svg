<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Problema 8: Sección recta e inradio</title><desc id="desc">Reconstrucción vectorial. Sólido en perspectiva y sección auxiliar con datos y letras.</desc><rect width="900" height="540" rx="18" fill="#f5f8fc"/><text x="28.00" y="36.00" font-family="Arial,sans-serif" font-size="22" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">08  /  Sección recta e inradio</text><line x1="460.00" y1="70.00" x2="460.00" y2="490.00" stroke="#d8e2ee" stroke-width="1"/><text x="28.00" y="517.00" font-family="Arial,sans-serif" font-size="14" fill="#758596" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Esquema en perspectiva · Las cotas, no la apariencia, definen la geometría.</text><polygon points="100.16,435.00 306.17,435.00 134.50,373.20" fill="#e5eefb" fill-opacity="0.65" stroke="#2463c4" stroke-width="2"/><line x1="100.16" y1="435.00" x2="168.83" y2="176.80" stroke="#233b53" stroke-width="2"/><line x1="306.17" y1="435.00" x2="374.84" y2="176.80" stroke="#233b53" stroke-width="2"/><line x1="134.50" y1="373.20" x2="203.17" y2="115.00" stroke="#233b53" stroke-width="2" stroke-dasharray="6 5"/><polygon points="168.83,176.80 374.84,176.80 203.17,115.00" fill="#e7eef5" fill-opacity="0.8" stroke="#233b53" stroke-width="2"/><polygon points="140.55,283.12 334.45,328.68 168.83,244.10" fill="#a8e1d5" fill-opacity="0.8" stroke="#008778" stroke-width="2"/><text x="109.50" y="305.90" font-family="Arial,sans-serif" font-size="18" fill="#2463c4" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">a</text><circle cx="334.45" cy="328.68" r="3.5" fill="#008778"/><text x="342.45" y="320.68" font-family="Arial,sans-serif" font-size="19" fill="#008778" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">SR</text><polygon points="550.00,320.00 810.00,320.00 680.00,95.00" fill="#e0f2ec" fill-opacity="0.6" stroke="#008778" stroke-width="2"/><circle cx="680" cy="245" r="75" fill="none" stroke="#008778" stroke-width="2"/><line x1="680.00" y1="245.00" x2="680.00" y2="320.00" stroke="#c36117" stroke-width="2.3"/><line x1="692.00" y1="320.00" x2="692.00" y2="308.00" stroke="#758596" stroke-width="2"/><line x1="692.00" y1="308.00" x2="680.00" y2="308.00" stroke="#758596" stroke-width="2"/><text x="690.00" y="286.00" font-family="Arial,sans-serif" font-size="18" fill="#c36117" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">r = 3 m</text><text x="495.00" y="385.00" font-family="Arial,sans-serif" font-size="17" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">SR ⟂ aristas laterales</text><text x="495.00" y="412.00" font-family="Arial,sans-serif" font-size="17" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Perímetro de SR = 2p</text><text x="495.00" y="439.00" font-family="Arial,sans-serif" font-size="17" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">A lateral = 2p · a = 28 m²</text><text x="495.00" y="466.00" font-family="Arial,sans-serif" font-size="17" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">No se presupone triángulo equilátero.</text></svg>