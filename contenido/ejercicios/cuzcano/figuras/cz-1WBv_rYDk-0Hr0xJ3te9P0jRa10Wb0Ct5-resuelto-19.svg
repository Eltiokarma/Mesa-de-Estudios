<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">019 · Escala térmica arbitraria y dos volúmenes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="228.86021505376345" y1="105" x2="228.86021505376345" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">T (°E)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">P (atm)</text><polyline points="100.90,396.52 375.10,212.68" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">V₁</text><polyline points="100.90,396.52 361.39,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">V₂</text><circle cx="251.70967741935485" cy="249.4448217317487" r="3.7" fill="#20364b"/><text x="258.7096774193549" y="241.4448217317487" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">50 °E</text><circle cx="320.258064516129" cy="249.4448217317487" r="3.7" fill="#20364b"/><text x="327.258064516129" y="241.4448217317487" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">200 °E, V₁</text><circle cx="356.81720430107526" cy="224.93293718166382" r="3.7" fill="#20364b"/><text x="363.81720430107526" y="216.93293718166382" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">280 °E</text><circle cx="320.258064516129" cy="182.5942275042445" r="3.7" fill="#20364b"/><text x="327.258064516129" y="174.5942275042445" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Pᵧ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de V₁ es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(14−12)/(280−200)=1/40 atm por °E.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La extrapolación de V₁ hasta presión</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">nula da 200−12·40=−280 °E, el cero</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">absoluto de la escala.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sobre V₂, P es proporcional a E+280.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto Pᵧ=12·480/330.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>