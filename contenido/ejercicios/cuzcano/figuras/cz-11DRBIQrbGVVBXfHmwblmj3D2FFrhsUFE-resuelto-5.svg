<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Ángulo en un tramo quebrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="131.06,322.05 190.47,267.22 315.69,322.05 131.06,322.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="246.23,290.98 268.16,252.59 333.05,211.46" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="106.39,211.46 375.10,211.46" fill="none" stroke="#008674" stroke-width="2.5"/><text x="121.01075268817203" y="333.93548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="324.8279569892473" y="331.19354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="100.90322580645162" y="205.06451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m</text><text x="151.1720430107527" y="313.8279569892473" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="290.0967741935484" y="315.6559139784946" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="192.30107526881721" y="292.80645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100°</text><text x="262.6774193548387" y="290.06451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="314.7741935483871" y="222.43010752688173" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="284.61290322580646" y="258.98924731182797" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo en B es θ=180°−100°−α=80°−α.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Visto desde el quiebre, el tramo que</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">baja hasta la perpendicular queda a</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">90°+θ por debajo de una horizontal</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dirigida a la derecha.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El tramo superior forma α por encima</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de esa horizontal. Suma 90°+θ+α.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>