y="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Circunferencia</text><polyline points="238.00,396.52 314.21,294.90" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Tangente</text><polyline points="238.00,237.75 314.21,294.90" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Radio</text><circle cx="238.0" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="245.0" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="238.0" cy="237.7459677419355" r="3.7" fill="#20364b"/><text x="245.0" y="229.7459677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5i</text><circle cx="314.2096774193549" cy="294.9032258064516" r="3.7" fill="#20364b"/><text x="321.2096774193549" y="286.9032258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La circunferencia está por encima del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">eje real. El menor ángulo desde el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">origen lo da la tangente hacia la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo rectángulo formado por</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">origen, centro y tangencia, la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hipotenusa mide 5 y el radio 3. La</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud desde el origen hasta la</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangencia es 4.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ese segmento apunta en la dirección</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(3/5,4/5). Multiplica por su longitud</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para hallar z.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>