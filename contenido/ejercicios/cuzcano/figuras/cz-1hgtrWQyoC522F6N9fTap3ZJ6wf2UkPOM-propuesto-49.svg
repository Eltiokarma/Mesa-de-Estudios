<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">049 · Aceleración angular sin máximo finito</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">n entero positivo</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">α (rad/s²)</text><polyline points="155.74,345.71 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">α=nπ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Velocidad inicial de rebote proviene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de caída45 m; tiempo total de caída3</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">s. En subida, alcanza disco2 s después</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del rebote.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde arranque en reposo, ángulo del</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">disco al paso esα·2²/2=2α.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Agujero alineado si2α=2πn:α=nπ. No hay</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">máximo finito;π es el mínimo positivo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>