<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Área de un triángulo interior a partir de proyecciones</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,221.03 148.99,275.56 131.37,231.80" fill="#f4c581" fill-opacity="0.45"/><polygon points="148.99,275.56 186.40,317.97 375.10,317.97 131.37,231.80" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,221.03 100.90,317.97 186.40,317.97 375.10,317.97 131.37,231.80 100.90,221.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,221.03 148.99,275.56 186.40,317.97" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,317.97 102.81,317.93 104.71,317.82 106.60,317.64 108.49,317.37 110.36,317.04 112.22,316.63 114.06,316.15 115.88,315.60 117.68,314.98 119.45,314.28 121.20,313.52 122.91,312.69 124.59,311.79 126.23,310.83 127.83,309.80 129.39,308.71 130.91,307.57 132.38,306.36 133.81,305.09 135.18,303.77 136.50,302.40 137.76,300.98 138.97,299.51 140.12,297.99 141.21,296.43 142.23,294.83 143.19,293.18 144.09,291.51 144.92,289.79 145.68,288.05 146.38,286.28 147.00,284.48 147.55,282.66 148.03,280.82 148.44,278.96 148.78,277.08 149.04,275.20 149.22,273.30 149.34,271.40 149.37,269.50 149.34,267.60 149.22,265.70 149.04,263.80 148.78,261.92 148.44,260.04 148.03,258.18 147.55,256.34 147.00,254.52 146.38,252.72 145.68,250.95 144.92,249.21 144.09,247.49 143.19,245.82 142.23,244.17 141.21,242.57 140.12,241.01 138.97,239.49 137.76,238.02 136.50,236.60 135.18,235.23 133.81,233.91 132.38,232.64 130.91,231.43 129.39,230.29 127.83,229.20 126.23,228.17 124.59,227.21 122.91,226.31 121.20,225.48 119.45,224.72 117.68,224.02 115.88,223.40 114.06,222.85 112.22,222.37 110.36,221.96 108.49,221.63 106.60,221.36 104.71,221.18 102.81,221.07 100.90,221.03" fill="none" stroke="#008674" stroke-width="2.5"/><text x="125.62345077777164" y="261.25992500956" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S₁</text><text x="213.84072420483525" y="301.0061690810942" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S₂</text><text x="100.90322580645162" y="221.02897064447055" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="100.90322580645162" y="317.9710293555295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="131.3691756272401" y="231.80031050125487" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="148.9940843562175" y="275.55887866944124" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="186.39808545047984" y="317.9710293555295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="375.09677419354836" y="317.9710293555295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como O e I están en la circunferencia</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de diámetro AT, AO y AI son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares a los rayos</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respectivos.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En los triángulos rectángulos TAM y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">TAN, la proyección del cateto AT en la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hipotenusa da TO·TM=TI·TN=AT²=4R².</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos triángulos de áreas [TOI] y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[TMN] tienen el mismo ángulo en T. Su</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">razón es TO·TI/(TM·TN)=1/16. Respecto</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del área restante, la razón es 1/15.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>