<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">093 · Sumar los coeficientes de x¹⁰ con y impar</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="95.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">k</text><rect x="143.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="190.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">i</text><rect x="238.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="285.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">j</text><rect x="333.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="380.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Aporte</text><rect x="48.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1</text><rect x="143.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3</text><rect x="238.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4</text><rect x="333.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">280</text><rect x="48.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3</text><rect x="143.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">5</text><rect x="238.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="333.0" y="226" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">56</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Comprobación del término</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sean i,k,j las cantidades de x², y y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−x. Se exige 2i+j=10 e i+k+j=8.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resolver da i=2+k y j=6−2k. Con k</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">impar y cantidades no negativas,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">quedan k=1 y 3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los aportes tienen signo positivo y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son M(3,1,4)=280 y M(5,3,0)=56.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>