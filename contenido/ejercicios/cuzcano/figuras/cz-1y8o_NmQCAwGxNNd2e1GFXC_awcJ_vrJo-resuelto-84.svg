<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">084 · Inclinación entre vértices de dos equiláteros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="159.84,382.99 159.84,262.74 280.09,262.74 280.09,382.99 159.84,382.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="159.84,262.74 219.96,158.60 280.09,262.74" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="159.84,262.74 324.10,218.72 280.09,382.99 159.84,262.74" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="219.96,158.60 324.10,218.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="280.09,262.74 280.09,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="149.31418209581983" y="393.50983012025193" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="150.81733155182286" y="259.7295285359802" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="283.0944836800916" y="274.7610230960107" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="281.59133422408854" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="219.96220652796336" y="148.49646879175418" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="326.68581790418017" y="213.13189539988548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="265.056690208055" y="183.0689062798244" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa lado 1 y coloca A=(0,0), M=(1,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E=(1,−1). Como MAR queda arriba de AM,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R=(1/2,√3/2).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector A→L se obtiene girando</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A→E=(1,−1) 60° en sentido antihorario.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto L=((1+√3)/2,(√3−1)/2).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El vector R→L=(√3/2,−1/2) forma 30°</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con la horizontal. Su ángulo agudo con</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la vertical es 60°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>