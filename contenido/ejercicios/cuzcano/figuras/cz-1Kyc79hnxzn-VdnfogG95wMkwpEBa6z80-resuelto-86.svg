314.21,244.10 314.21,193.29 263.40,193.29 263.40,244.10" fill="none" stroke="#304558" stroke-width="2.5"/><polyline points="314.21,294.90 365.02,294.90 365.02,244.10 314.21,244.10 314.21,294.90" fill="none" stroke="#304558" stroke-width="2.5"/><polyline points="212.60,294.90 263.40,294.90 263.40,244.10 212.60,244.10 212.60,294.90" fill="none" stroke="#304558" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay trece cuadrados unitarios.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los cuadrados de lado dos son cuatro y</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el central de lado tres es uno; los</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mayores no caben. Total: 18.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los trece congruentes con el sombreado</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dan probabilidad 13/18. Se equiparan</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrados completos, no posiciones de</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una celda elegida.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>