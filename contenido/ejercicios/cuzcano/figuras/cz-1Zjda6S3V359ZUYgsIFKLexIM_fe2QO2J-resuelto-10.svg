y="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Circunferencia</text><polyline points="110.98,269.50 301.51,159.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Vector z</text><line x1="301.5080645161291" y1="159.5008055677024" x2="295.6392845991762" y2="167.59755937934634" stroke="#d37618" stroke-width="2"/><line x1="301.5080645161291" y1="159.5008055677024" x2="291.56168006858053" y2="160.53494115918153" stroke="#d37618" stroke-width="2"/><polyline points="238.00,269.50 301.51,159.50" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Vector z−1</text><line x1="301.5080645161291" y1="159.5008055677024" x2="300.47392892464995" y2="169.44719001525098" stroke="#008674" stroke-width="2"/><line x1="301.5080645161291" y1="159.5008055677024" x2="293.4113107044851" y2="165.36958548465526" stroke="#008674" stroke-width="2"/><circle cx="110.98387096774195" cy="269.5" r="3.7" fill="#20364b"/><text x="117.98387096774195" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="238.00000000000003" cy="269.5" r="3.7" fill="#20364b"/><text x="245.00000000000003" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><circle cx="301.5080645161291" cy="159.5008055677024" r="3.7" fill="#20364b"/><text x="308.5080645161291" y="151.5008055677024" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">z</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon z=r exp(iβ) con r&gt;0. La ecuación</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la circunferencia da r²−2r cos β=0</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y por tanto r=2cos β.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así z−1=2cos β·exp(iβ)−1=exp(2iβ).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como z²−z=z(z−1), sus argumentos son</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">β+2β más múltiplos de 2π.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>