<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">474 · Nombre de un ciclopentano con etilo y metilo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="220.29,142.48 305.76,204.58 273.11,305.06 167.47,305.06 134.82,204.58 220.29,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="305.76,204.58 341.66,192.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="167.47,305.06 145.28,335.59" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="145.28,335.59 134.34,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El anillo principal es ciclopentano.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las ramas son etil y metil.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Numerar por el camino corto produce</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1,3 en ambos sentidos posibles de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">partida.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el empate se asigna 1 al etil, que</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se cita antes que metil.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>