69,334.65 298.36,333.65 298.95,332.60 299.45,331.50 299.87,330.37 300.20,329.21 300.43,328.03 300.57,326.83 300.62,325.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="156.384096024006" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">agua: 180 cm³</text><text x="180.01500375093775" y="217.192048012003" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">10 protones / H₂O</text><text x="233.18454613653418" y="370.79294823705925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="182.37809452363092" y="353.06976744186045" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H</text><text x="286.3540885221306" y="353.06976744186045" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La masa es 180 g y hay 180/18=10 mol,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivalentes a 6·10²⁴ moléculas.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada molécula tiene 1+1+8=10 protones:</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Np=6·10²⁵.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Qpositiva=Np·e=9,6·10⁶ C. Es la suma</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de las cargas de los protones; el agua</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">neutra tiene una carga negativa igual</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y carga neta cero.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>