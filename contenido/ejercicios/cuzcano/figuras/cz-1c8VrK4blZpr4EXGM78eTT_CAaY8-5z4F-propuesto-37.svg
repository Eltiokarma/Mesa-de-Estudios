<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">037 · Ventas con porcentajes incompatibles</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="365.09,269.50 364.78,260.63 363.86,251.81 362.32,243.08 360.17,234.47 357.43,226.03 354.11,217.81 350.22,209.83 345.78,202.15 340.82,194.80 335.36,187.81 329.42,181.21 323.04,175.05 316.25,169.35 309.07,164.13 301.55,159.43 293.71,155.27 285.61,151.66 277.27,148.63 268.75,146.18 260.07,144.34 251.28,143.10 242.44,142.48 233.56,142.48 224.72,143.10 215.93,144.34 207.25,146.18 198.73,148.63 190.39,151.66 182.29,155.27 174.45,159.43 166.93,164.13 159.75,169.35 152.96,175.05 146.58,181.21 140.64,187.81 135.18,194.80 130.22,202.15 125.78,209.83 121.89,217.81 118.57,226.03 115.83,234.47 113.68,243.08 112.14,251.81 111.22,260.63 110.91,269.50 111.22,278.37 112.14,287.19 113.68,295.92 115.83,304.53 118.57,312.97 121.89,321.19 125.78,329.17 130.22,336.85 135.18,344.20 140.64,351.19 146.58,357.79 152.96,363.95 159.75,369.65 166.93,374.87 174.45,379.57 182.29,383.73 190.39,387.34 198.73,390.37 207.25,392.82 215.93,394.66 224.72,395.90 233.56,396.52 242.44,396.52 251.28,395.90 260.07,394.66 268.75,392.82 277.27,390.37 285.61,387.34 293.71,383.73 301.55,379.57 309.07,374.87 316.25,369.65 323.04,363.95 329.42,357.79 335.36,351.19 340.82,344.20 345.78,336.85 350.22,329.17 354.11,321.19 357.43,312.97 360.17,304.53 362.32,295.92 363.86,287.19 364.78,278.37 365.09,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,269.50 365.09,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,269.50 245.98,142.66" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,269.50 151.00,176.85" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,269.50 110.91,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,269.50 277.27,390.37" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="299.1471595365259" y="212.078995142008" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C 24 %</text><text x="209.58607260839517" y="190.57728053043596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B a°</text><text x="161.01714175191583" y="236.186542445398" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A a°</text><text x="188.69554814412123" y="337.3617561331729" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E 108°</text><text x="305.8617561331729" y="318.8044518558787" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D b %</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C ocupa 0,24×360°=86,4°. De los 180°</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superiores quedan 93,6° para A y B,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que cada uno representa 13 %.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">E ocupa 108°/360°=30 %. Por tanto D</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ocupa 20 %. Sin embargo, el 30 % de la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">parte de A sería 0,30×13 %=3,9 %.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La condición D=0,30A contradice el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">gráfico. Solo con el gráfico y la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia de 340 unidades se</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtendría un total de</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">340/(0,30−0,13)=2 000.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>