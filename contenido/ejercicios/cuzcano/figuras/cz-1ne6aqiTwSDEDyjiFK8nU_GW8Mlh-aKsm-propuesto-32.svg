<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">032 · Rango de una distancia a cuatro dentro de la tangente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="227.16129032258084" x2="421" y2="227.16129032258084" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="238.00,142.48 240.28,179.65 242.57,210.40 244.85,236.10 247.14,257.79 249.42,276.25 251.71,292.07 253.99,305.71 256.28,317.55 258.56,327.87 260.85,336.90 263.13,344.83 265.42,351.82 267.70,357.99 269.99,363.45 272.27,368.29 274.56,372.58 276.84,376.37 279.13,379.73 281.41,382.69 283.70,385.30 285.98,387.58 288.27,389.55 290.55,391.25 292.84,392.69 295.12,393.88 297.41,394.84 299.69,395.58 301.98,396.10 304.26,396.41 306.55,396.52 308.83,396.41 311.12,396.10 313.40,395.58 315.69,394.84 317.97,393.88 320.26,392.69 322.54,391.25 324.83,389.55 327.11,387.58 329.40,385.30 331.68,382.69 333.97,379.73 336.25,376.37 338.54,372.58 340.82,368.29 343.11,363.45 345.39,357.99 347.68,351.82 349.96,344.83 352.25,336.90 354.53,327.87 356.82,317.55 359.10,305.71 361.39,292.07 363.67,276.25 365.96,257.79 368.24,236.10 370.53,210.40 372.81,179.65 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente aumenta de −√3 a √3 a lo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">largo del tramo. Su cuadrado recorre</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[0,3], con 3 incluido por el extremo</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecho.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como tan²x≤3, el valor absoluto se</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reduce a 4−tan²x.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La función queda tan²x−2, con mínimo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−2 y máximo 1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>