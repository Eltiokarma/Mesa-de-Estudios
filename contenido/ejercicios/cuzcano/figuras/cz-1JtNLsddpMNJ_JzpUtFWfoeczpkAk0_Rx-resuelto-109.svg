<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">109 · Apertura de un haz tras una lente divergente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="205.78,200.95 242.80,200.95 230.46,238.65 228.40,269.50 230.46,300.35 242.80,338.05 205.78,338.05 218.12,300.35 220.18,269.50 218.12,238.65 205.78,200.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="347.68,187.24 347.68,351.76" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="104.33,242.08 224.29,242.08 347.68,200.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="104.33,296.92 224.29,296.92 347.68,338.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="142.03,269.50 224.29,242.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="142.03,269.50 224.29,296.92" fill="none" stroke="#008674" stroke-width="2.5"/><text x="138.60483870967744" y="226.31451612903228" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Haz</text><text x="138.60483870967744" y="280.4677419354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="283.241935483871" y="280.4677419354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30 cm</text><text x="362.0725806451612" y="329.8225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 cm</text><text x="242.79838709677418" y="299.6612903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los rayos emergentes parecen partir</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del foco virtual, en el lado de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entrada.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente del rayo límite vale (5 −</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2)/30 = 1/10. Entre el foco virtual y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la lente aumenta 2 cm en altura.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia al foco virtual es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2/(1/10) = 20 cm y el signo de la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">focal es negativo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>