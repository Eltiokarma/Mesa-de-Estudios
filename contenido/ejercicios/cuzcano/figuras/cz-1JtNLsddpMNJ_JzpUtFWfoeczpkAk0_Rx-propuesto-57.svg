<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Buceador e imagen en la superficie</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,266.54 375.10,266.54" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,376.76 375.10,376.76" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="117.03,333.75 117.03,376.76" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="117.03,333.75 206.64,266.54 353.59,376.76" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="206.64,266.54 353.59,156.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="117.03225806451613" y="324.60752688172045" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Ojo</text><text x="353.5913978494624" y="386.43548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="353.5913978494624" y="149.33870967741927" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen</text><text x="226.17204301075267" y="389.66129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="141.2258064516129" y="363.31720430107526" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El objeto está a 410 cm de la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">superficie y el ojo a 250 cm. Refleja</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">virtualmente una de las posiciones</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">respecto de la superficie.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La separación vertical desplegada del</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">trayecto es 660 cm. En el límite, sen</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θc = 4/5 y tan θc = 4/3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica 660 cm por 4/3 para obtener</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el umbral horizontal.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>