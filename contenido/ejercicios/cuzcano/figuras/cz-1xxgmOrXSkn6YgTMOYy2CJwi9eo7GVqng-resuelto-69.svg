<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">069 · Igualdad de los catetos en un triángulo exterior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="140.48,151.94 136.80,155.77 133.28,159.73 129.91,163.84 126.71,168.07 123.67,172.42 120.81,176.89 118.13,181.46 115.63,186.14 113.31,190.92 111.19,195.78 109.25,200.72 107.52,205.73 105.98,210.81 104.64,215.94 103.50,221.13 102.57,226.35 101.84,231.60 101.32,236.89 101.01,242.18 100.90,247.49 101.01,252.79 101.32,258.09 101.84,263.37 102.57,268.62 103.50,273.85 104.64,279.03 105.98,284.16 107.52,289.24 109.25,294.25 111.19,299.19 113.31,304.05 115.63,308.83 118.13,313.51 120.81,318.09 123.67,322.55 126.71,326.91 129.91,331.14 133.28,335.24 136.80,339.20 140.48,343.03 144.30,346.71 148.27,350.23 152.37,353.60 156.60,356.80 160.95,359.83 165.42,362.69 170.00,365.38 174.68,367.88 179.45,370.19 184.31,372.32 189.25,374.25 194.27,375.99 199.34,377.53 204.48,378.87 209.66,380.01 214.88,380.94 220.14,381.67 225.42,382.19 230.72,382.50 236.02,382.60 241.33,382.50 246.62,382.19 251.90,381.67 257.16,380.94 262.38,380.01 267.56,378.87 272.70,377.53 277.78,375.99 282.79,374.25 287.73,372.32 292.59,370.19 297.36,367.88 302.04,365.38 306.62,362.69 311.09,359.83 315.44,356.80 319.67,353.60 323.77,350.23 327.74,346.71 331.56,343.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="140.48,151.94 371.14,382.60 331.56,382.60 236.02,382.60" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="140.48,151.94 236.02,382.60 303.58,315.05" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="236.02,382.60 331.56,343.03 331.56,382.60" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="134.54210400098412" y="147.98594144068358" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="234.537174303504" y="391.0140585593164" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="305.064318941133" y="308.11967929134454" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="334.0375552208102" y="338.0822943414491" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="329.09066136867307" y="391.0140585593164" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="375.0967741935484" y="385.5724753219656" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="354.31982001457243" y="378.15213454375987" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como MC es diámetro, UM⊥UC. Como</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">UN⊥MC, ∠NUC=∠UMC. El teorema de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente y cuerda da ∠CUP=∠UMC.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Traza CE perpendicular a UP. Los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulos rectángulos UCN y UCE</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen la misma hipotenusa y el mismo</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo en U. Así UE=UN y CE=CN.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la condición, EP=UP−UE=CN=CE. El</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo CEP es rectángulo isósceles.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>