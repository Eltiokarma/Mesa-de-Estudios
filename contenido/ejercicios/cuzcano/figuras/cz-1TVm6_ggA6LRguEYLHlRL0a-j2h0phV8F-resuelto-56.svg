<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">056 · Diferencia de segmentos sobre un lado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.30,301.85 219.21,237.77 367.09,301.85 108.30,301.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="158.21,273.01 367.09,301.85" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="312.32348677056905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="219.20695904313155" y="226.67651322943098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="312.32348677056905" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="150.81261326567596" y="266.7272562522653" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="144.03479521565785" y="292.60619789778906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="327.03588256614717" y="293.8385284523378" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7°</text><text x="314.09641174338526" y="285.828379847771" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABC, ∠C = 15° y ∠B = 135°. Por ley</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de senos, AB = 12 sen 15°/sen 135°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ADC, el ángulo en D mide 143°. Así</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AD = 12 sen 7°/sen 143°.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta las dos longitudes. BD ≈ 1,96,</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cercano a 2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>