<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">032 · Mitad de un ángulo y octava parte de su suplemento</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,337.83 351.76,337.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,337.83 339.48,260.31" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,337.83 303.85,190.38" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="165.08,337.83 165.07,337.20 165.06,336.57 165.05,335.94 165.03,335.31 165.00,334.68 164.96,334.05 164.92,333.43 164.88,332.80 164.83,332.17 164.77,331.54 164.70,330.92 164.63,330.29 164.55,329.66 164.47,329.04 164.38,328.42 164.29,327.79 164.18,327.17 164.08,326.55 163.96,325.93 163.84,325.31 163.72,324.70 163.59,324.08 163.45,323.46 163.30,322.85 163.15,322.24 163.00,321.63 162.83,321.02 162.67,320.41 162.49,319.81 162.31,319.20 162.13,318.60 161.94,318.00" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="181.91,311.51 181.65,310.72 181.38,309.93 181.10,309.14 180.81,308.35 180.52,307.57 180.22,306.79 179.91,306.01 179.59,305.24 179.27,304.47 178.94,303.70 178.60,302.93 178.25,302.17 177.90,301.42 177.54,300.66 177.17,299.91 176.79,299.16 176.41,298.42 176.02,297.68 175.62,296.95 175.22,296.21 174.81,295.49 174.39,294.76 173.96,294.04 173.53,293.33 173.09,292.62 172.64,291.91 172.18,291.21 171.72,290.51 171.26,289.82 170.78,289.13 170.30,288.45 169.81,287.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="362.3346631059859" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.09677419354836" y="337.8322609096922" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="361.6767867260905" y="253.10179471010983" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="322.7304661995824" y="176.66533689401408" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="195.97754960087033" y="322.7739673462794" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">φ/2</text><text x="205.3839839791233" y="284.59665563824296" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">φ/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La bisectriz da φ/2=(180−φ)/8. De ahí</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">φ=36°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dos complementos consecutivos se</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cancelan.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos suplementos que quedan también</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se cancelan. El resultado es 3φ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>