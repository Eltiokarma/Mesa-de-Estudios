" stroke="#a3b9cc"/><text x="380.5" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">k²</text><rect x="48.0" y="295.7142857142857" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4</text><rect x="143.0" y="295.7142857142857" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="238.0" y="295.7142857142857" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">58</text><rect x="333.0" y="295.7142857142857" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="48.0" y="337.14285714285717" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">5</text><rect x="143.0" y="337.14285714285717" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="238.0" y="337.14285714285717" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="333.0" y="337.14285714285717" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="48.0" y="378.57142857142856" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">6</text><rect x="143.0" y="378.57142857142856" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">m</text><rect x="238.0" y="378.57142857142856" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">80</text><rect x="333.0" y="378.57142857142856" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">180</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Frecuencias y productos parciales</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La primera marca x₁ satisface</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x₁(m+1)=70. La sexta satisface</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x₆m=180. Si w=2(12−x₁), entonces</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x₆=x₁+5w. Al probar divisores</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivos de 70 menores que 12, la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con w=4 las marcas son 10, 14, 18, 22,</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">26 y 30. De los productos de las</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">clases 2 y 3 sale n=13 y k=18.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa F₄=58 y N=80 para obtener</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frecuencias 7, 13, 18, 20, 16 y 6. La</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suma ponderada es 1 612.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>