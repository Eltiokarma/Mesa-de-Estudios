<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">339 · Comparación de curvas de varias sustancias</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">Temperatura (°C)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">g soluto / 100 g agua</text><polyline points="100.90,176.35 169.45,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,277.97 128.32,261.03 210.58,217.00 320.26,150.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,374.50 155.74,342.32 210.58,289.82 265.42,227.16 312.03,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,345.71 169.45,328.77 238.00,301.68 306.55,284.74 375.10,267.81" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,347.40 169.45,337.24 238.00,323.69 306.55,310.15 375.10,296.60" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,332.16 169.45,330.47 238.00,330.47 306.55,328.77 375.10,328.77" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,389.74 169.45,379.58 238.00,360.95 306.55,333.85 375.10,296.60" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,245.79 169.45,315.23 238.00,349.10 306.55,371.11 375.10,384.66" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,366.03 169.45,381.27 238.00,388.05 306.55,391.44 375.10,391.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><circle cx="128.32258064516128" cy="261.0322580645161" r="3.7" fill="#20364b"/><text x="135.32258064516128" y="253.0322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(10,80)</text><text x="139.29032258064518" y="152.64516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">KI</text><text x="281.8709677419355" y="176.3548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">NaNO₃</text><text x="298.3225806451613" y="213.61290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">KNO₃</text><text x="320.258064516129" y="274.58064516129036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">NH₄Cl</text><text x="339.4516129032258" y="306.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">KCl</text><text x="136.5483870967742" y="323.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">NaCl</text><text x="317.51612903225805" y="340.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">KClO₃</text><text x="161.2258064516129" y="296.5967741935484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">NH₃</text><text x="259.93548387096774" y="381.2741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Ce₂(SO₄)₃</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Además de Ce₂(SO₄)₃, la curva del NH₃</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es decreciente. I es falsa.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La curva de NaNO₃ a 10 °C marca cerca</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 80 g por 100 g de agua. En 200 g,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el doble es 160 g, de acuerdo con II a</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la precisión del gráfico.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">NaCl tiene la curva más cercana a</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal. III es verdadera.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>