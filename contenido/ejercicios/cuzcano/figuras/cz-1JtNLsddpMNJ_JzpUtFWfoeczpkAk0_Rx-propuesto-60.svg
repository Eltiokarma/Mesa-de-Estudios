<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">060 · Focal de un menisco</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="272.73,196.38 293.20,214.66 304.17,240.25 307.83,269.50 304.17,298.75 293.20,324.34 272.73,342.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="272.73,196.38 285.16,214.66 295.40,240.25 299.05,269.50 295.40,298.75 285.16,324.34 272.73,342.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="188.65,269.50 272.73,196.38" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="108.22,269.50 272.73,342.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="216.43010752688173" y="224.16666666666666" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 cm</text><text x="188.64516129032256" y="318.48924731182797" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">80 cm</text><text x="329.0322580645161" y="264.3817204301075" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Vidrio</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La curvatura convexa aporta +1/40 cm⁻¹</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y la cóncava −1/80 cm⁻¹.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica la suma de curvaturas por n</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">− 1 = 1/2, según la fórmula del</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fabricante.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La potencia geométrica es 1/160 cm⁻¹.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Invierte para hallar la focal</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positiva.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>