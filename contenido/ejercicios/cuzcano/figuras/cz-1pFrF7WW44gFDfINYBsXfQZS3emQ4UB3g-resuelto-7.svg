" stroke="#b0467a" stroke-width="2.5"/><polyline points="294.45,261.03 305.74,261.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="245.0" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R=5 cm</text><text x="267.5806451612903" y="309.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">r</text><text x="301.4516129032258" y="213.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">dr; dA=2πr dr</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La densidad varía radialmente: no se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puede usar una única σ del borde</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplicada por el área. Tomar</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">anillos de área dA=2πr dr.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dq=σ(r)dA=(3r²/100)dr; integrar desde</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r=0 hasta R=0,05 m.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">q=[r³/100]_0^R=1,25·10⁻⁶ C=1,25 µC. El</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">anillo redibujado representa el</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">elemento diferencial.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>