<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">032 · Diferencia de proyecciones con bisectrices</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="126.65,310.35 218.42,152.56 349.35,383.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="126.65,310.35 245.27,201.80 191.56,201.80 349.35,383.09" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="217.30,201.80 213.94,377.49" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="126.65,310.35 215.06,313.70" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="213.94,377.49 349.35,383.09" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="115.46021031689644" y="321.5374449339207" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="217.29693051016056" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="360.53978968310355" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="226.2496092084695" y="236.48699729998577" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="225.13052437118088" y="315.9420207474776" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="202.74882762540855" y="392.0397896831036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="201.62974278811993" y="197.31902799488418" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="191.5579792525224" y="227.53431860167683" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="232.9641182322012" y="196.19994315759556" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="243.03588176779877" y="229.77248827625408" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="175.89079153048175" y="267.82137274406705" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">9</text><text x="290.0374449339207" y="317.0611055847662" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">12</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por las parejas de ángulos iguales α,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C está en la bisectriz del ángulo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre ℓ y la recta AD. La distancia de</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C a ℓ es igual a la de C a AD, que</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale CD=9.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la bisectriz marcada con θ, A</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equidista de ℓ y de DC. Su distancia a</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ℓ es AD=12.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A y C están al mismo lado de ℓ. Sus</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyecciones sobre la perpendicular</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por D están separadas por 12−9.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>