<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Perpendicularidad de dos planos en un tetraedro regular</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="273.62,144.10 273.62,256.04 375.10,394.90" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,394.90 273.62,256.04 344.86,314.16" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,394.90 375.10,394.90 344.86,314.16 100.90,394.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,394.90 273.62,144.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,394.90 273.62,144.10" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="344.86,314.16 273.62,144.10" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="273.62,144.10 273.62,367.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="273.62,367.98 375.10,394.90" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="273.62,144.10 273.62,256.04 375.10,394.90" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,394.90 273.62,256.04 344.86,314.16 100.90,394.90" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645164" y="394.8950334978174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354836" y="394.8950334978174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="344.8563603056606" y="314.1591168224294" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="273.6187867685535" y="144.1049665021826" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="273.6187867685535" y="367.9830612726881" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="273.6187867685535" y="256.0440138874353" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el equilátero ACD, CH es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a AD porque H es su</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">centro.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BH también es perpendicular a AD por</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ser perpendicular a la base. Las</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectas BH y HC determinan el plano</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BQC.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así AD es normal a BQC. Como AD está</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en AQD, los planos son</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>