<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">077 · Saltos de cinco unidades</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,200.95 375.10,200.95 375.10,155.25 100.90,155.25 100.90,200.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,292.35 375.10,292.35 375.10,246.65 100.90,246.65 100.90,292.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,383.75 375.10,383.75 375.10,338.05 100.90,338.05 100.90,383.75" fill="none" stroke="#008674" stroke-width="2.5"/><text x="112.47311827956989" y="170.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F(2)=47</text><text x="112.47311827956989" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F(7)=23,F(12)=7</text><text x="112.47311827956989" y="352.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F(17)=3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 2 es par, F(7)=(47−1)/2=23.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 7 es impar, F(12)=(23−2)/3=7.</text><text x="482" y="169" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 12 es par, F(17)=(7−1)/2=3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>