<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">055 · Tres parámetros de un sistema en equilibrio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="267.74,269.50 301.04,173.87" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="267.74,269.50 363.59,162.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="267.74,269.50 118.78,365.13" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="267.74,269.50 287.54,376.38" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="305.03629032258067" y="162.3931451612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F₁</text><text x="375.09677419354836" y="149.79233870967738" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F₂</text><text x="100.90322580645162" y="376.6068548387097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F₃</text><text x="289.9153225806451" y="389.20766129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F₄</text><text x="267.73790322580646" y="270.96259360599083" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala a cero cada componente de la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suma. Quedan b+c=−7, a+c=11 y a+b=−4.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al sumar las tres ecuaciones,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2(a+b+c)=0. Así a+b+c=0.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta cada suma de dos variables del</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">total cero para obtener la variable</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">restante.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>