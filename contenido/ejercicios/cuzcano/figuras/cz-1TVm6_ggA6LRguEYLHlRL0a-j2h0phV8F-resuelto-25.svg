<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">025 · Dos equiláteros y un giro de 60°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.37,358.96 142.75,299.41 177.13,358.96 108.37,358.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="177.13,358.96 276.11,187.51 375.10,358.96 177.13,358.96" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="142.75,299.41 276.11,187.51 306.34,358.96" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.9032258064516" y="351.4896868698316" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="135.28048212575698" y="291.9465322999764" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="169.65773844506236" y="351.4896868698316" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="268.64310293660174" y="180.04200636476114" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="367.6284674281411" y="351.4896868698316" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="298.87395478953033" y="351.4896868698316" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Gira 60° en sentido horario alrededor</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de D. E va a C y la dirección EP pasa</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a la dirección CB.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como EP=CB, P va a B. El giro lleva</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠PDE a ∠BDC, de modo que este también</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mide α.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En BCD, ∠BCD=60°. Luego 5α+α+60°=180°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>