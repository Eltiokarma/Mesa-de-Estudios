<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">062 · Suma de extremos de una cosecante con valor absoluto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="100.90,142.48 105.47,148.05 110.04,153.24 114.61,158.10 119.18,162.65 123.75,166.92 128.32,170.94 132.89,174.72 137.46,178.28 142.03,181.64 146.60,184.81 151.17,187.80 155.74,190.64 160.31,193.33 164.88,195.87 169.45,198.29 174.02,200.58 178.59,202.75 183.16,204.82 187.73,206.78 192.30,208.65 196.87,210.43 201.44,212.12 206.01,213.73 210.58,215.26 215.15,216.71 219.72,218.10 224.29,219.42 228.86,220.68 233.43,221.87 238.00,223.01 242.57,221.87 247.14,220.68 251.71,219.42 256.28,218.10 260.85,216.71 265.42,215.26 269.99,213.73 274.56,212.12 279.13,210.43 283.70,208.65 288.27,206.78 292.84,204.82 297.41,202.75 301.98,200.58 306.55,198.29 311.12,195.87 315.69,193.33 320.26,190.64 324.83,187.80 329.40,184.81 333.97,181.64 338.54,178.28 343.11,174.72 347.68,170.94 352.25,166.92 356.82,162.65 361.39,158.10 365.96,153.24 370.53,148.05 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El argumento recorre [π/6,π/3]. Allí</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el seno crece y la cosecante decrece.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El máximo es 3csc(π/6)+2=8. El mínimo</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 3csc(π/3)+2=2+2√3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma ambos extremos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>