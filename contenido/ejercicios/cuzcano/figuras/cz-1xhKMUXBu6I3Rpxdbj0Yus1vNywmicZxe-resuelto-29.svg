<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Tiempo hasta un rumbo observado desde la estación</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="178.29,396.52 178.29,158.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="178.29,158.36 265.46,245.53 297.71,277.78" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="178.29,396.52 265.46,245.53" fill="none" stroke="#008674" stroke-width="2.5"/><text x="178.28795501392096" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="178.28795501392096" y="158.36088709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="265.4588236067371" y="245.5317556895903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="178.28795501392096" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="206.866584046179" y="166.2993951612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">SE</text><text x="213.2173904977919" y="296.4909274193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N30°E</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La rapidez hacia el este y hacia el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sur es v=20(√3−1) km/h. Tras t horas,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las coordenadas relativas son</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(vt,150−vt).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rumbo N30°E exige</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vt/(150−vt)=tan30°=1/√3. Así</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vt=150/(1+√3).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide por v y usa (√3+1)(√3−1)=2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>