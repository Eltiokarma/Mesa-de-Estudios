<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">087 · Cuatro válvulas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 179.24,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="179.24,269.50 179.24,230.33 296.76,230.33 296.76,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="179.24,269.50 179.24,308.67 296.76,308.67 296.76,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="296.76,269.50 375.10,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="123.57142857142856" y="259.5414746543779" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P1=0,3</text><text x="229.33179723502303" y="222.3294930875576" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P2=0,4</text><text x="229.33179723502303" y="300.6705069124424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P3=0,8</text><text x="327.258064516129" y="259.5414746543779" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P4=0,2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El bloque paralelo funciona si abre 2</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">o 3: 1−(1−0,4)(1−0,8)=0,88.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Además deben abrir 1 y 4.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplicar 0,3·0,88·0,2=0,0528. Las</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">marginales sin independencia no</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">determinan este valor.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>