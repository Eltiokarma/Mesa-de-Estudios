<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">098 · Potencia media con corriente máxima conocida</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,270.45 176.54,270.45" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="176.54,270.45 188.83,261.94 201.13,278.95 213.42,261.94 225.71,278.95 238.00,261.94 250.29,278.95 262.58,261.94 274.87,278.95 287.17,261.94 299.46,270.45" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="299.46,270.45 375.10,270.45" fill="none" stroke="#008674" stroke-width="2.5"/><text x="119.81312569521691" y="293.1373748609566" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="356.1868743047831" y="293.1373748609566" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="238.0" y="245.8626251390434" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40 Ω</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La corriente eficaz es I_máx/√2.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con el valor indicado,</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I_ef≈14,1/1,41=10 A.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La potencia media en una resistencia</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es I_ef²R. Sustituye 10 A y 40 Ω.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>