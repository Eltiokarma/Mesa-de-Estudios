<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">024 · Energía y tensión en péndulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.48387096774195" x2="421" y2="142.48387096774195" stroke="#20364b" stroke-width="1.7"/><line x1="339.61326765919915" y1="105" x2="339.61326765919915" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="339.61,142.48 136.39,294.90" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">cuerda A</text><polyline points="339.61,142.48 339.61,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">vertical B</text><polyline points="136.39,294.90 139.97,299.57 143.67,304.16 147.47,308.66 151.37,313.07 155.38,317.38 159.48,321.61 163.68,325.73 167.98,329.76 172.36,333.69 176.84,337.52 181.41,341.24 186.06,344.85 190.79,348.36 195.60,351.75 200.49,355.03 205.45,358.20 210.49,361.25 215.60,364.19 220.77,367.00 226.01,369.70 231.30,372.27 236.66,374.72 242.07,377.04 247.53,379.24 253.05,381.31 258.61,383.25 264.21,385.07 269.85,386.75 275.53,388.30 281.25,389.72 287.00,391.01 292.77,392.16 298.57,393.18 304.39,394.06 310.23,394.81 316.09,395.42 321.96,395.90 327.84,396.24 333.72,396.45 339.61,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">arco</text><circle cx="136.38746120758628" cy="294.9032258064516" r="3.7" fill="#20364b"/><text x="143.38746120758628" y="286.9032258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="339.61326765919915" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="346.61326765919915" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con cuerda tensa ideal, K+U se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conserva. B es el punto más bajo: U</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mínima y K máxima.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T=mv²/L+mg cosθ; por energía,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">v²=vB²−2gL(1−cosθ).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambos términos dan T máxima cuando</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosθ=1, en B: I y III verdaderas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>