<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">062 · Lado igual a una suma de segmentos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.11,315.88 252.78,219.83 274.12,315.88 109.11,315.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="208.45,315.88 252.78,219.83" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="274.12,315.88 368.53,315.88 252.78,219.83" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645164" y="324.09242804713153" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="251.9559590496427" y="211.6238168823643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="274.1213057755457" y="326.5552443500097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="208.44620436546265" y="327.3761831176357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.0967741935484" y="324.9133668147576" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="124.71045006760676" y="310.9574077651149" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40°</text><text x="260.9862854935291" y="310.1364689974889" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">80°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Extiende AC hasta E con CE=CB. En BCE,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el ángulo C es 100°, de modo que los</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos B y E miden 40°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así ABE es isósceles y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BE=AB=CB+CD=CE+CD=DE.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En BDE, el ángulo E es 40° y los otros</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos miden 70°. En B, resta ∠CBE=40° de</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠DBE=70°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>