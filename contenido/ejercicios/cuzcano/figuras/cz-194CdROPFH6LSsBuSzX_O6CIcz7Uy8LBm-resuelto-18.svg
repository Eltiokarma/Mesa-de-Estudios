/><polyline points="155.82,352.12 375.10,352.12 375.10,186.88 155.82,352.12" fill="none" stroke="#d37618" stroke-width="2.5"/><circle cx="155.8168645922608" cy="352.1196319931124" r="3.7" fill="#20364b"/><text x="162.8168645922608" y="344.1196319931124" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">I</text><circle cx="375.09677419354836" cy="352.1196319931124" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="344.1196319931124" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="375.09677419354836" cy="186.88036800688755" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="178.88036800688755" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">E</text><circle cx="195.62925271197247" cy="343.33344978738296" r="3.7" fill="#20364b"/><text x="202.62925271197247" y="335.33344978738296" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">37°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los catetos son a=10cos 37° y b=10sen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">37°. Así R=(2+a,0).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El inradio de un triángulo rectángulo</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es r=(a+b−10)/2. El centro queda r a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la izquierda de RE y r encima de IR.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye el centro (2+a−r,r). Con el</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo 3–4–5 aproximado se obtiene</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a≈8, b≈6 y r≈2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>