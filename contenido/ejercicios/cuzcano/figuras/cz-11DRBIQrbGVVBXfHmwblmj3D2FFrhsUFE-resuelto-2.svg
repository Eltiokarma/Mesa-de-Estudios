<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">002 · Suma de tres ángulos interiores</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="112.78,357.10 194.94,173.98 364.21,357.10 112.78,357.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="112.78,357.10 220.68,268.02 364.21,357.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="112.78,357.10 270.17,315.53 194.94,173.98 204.84,310.58 364.21,357.10" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="374.9209852102015" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="191.971119133574" y="164.07901478979852" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="372.9412483987423" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="131.58914638406895" y="319.4883544893444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="149.40677768720158" y="337.30598579247703" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="157.32572493303832" y="354.13374868988006" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="190.98125072784444" y="208.62309304763014" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="202.85967159659953" y="217.53190869919646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="223.64690811692094" y="214.56230348200768" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="315.7046698497729" y="318.49848608361475" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="318.6742750669617" y="335.3262489810178" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="314.71480144404336" y="354.13374868988006" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="219.68743449400256" y="309.5896704320485" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="220.67730289973215" y="290.7821707231862" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="256.31256550599744" y="308.59980202631886" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si α, β y θ son los tercios de A, B y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C, su suma es 60°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En los tres triángulos, las sumas de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los ángulos de la base son 2β+2θ,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2α+2θ y 2α+2β.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta esas sumas de 3×180°. Cada</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tercio aparece cuatro veces.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>