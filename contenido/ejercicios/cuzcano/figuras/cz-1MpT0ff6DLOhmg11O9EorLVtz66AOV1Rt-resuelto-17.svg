5.27047146401986" cy="324.86600496277913" r="3.7" fill="#20364b"/><text x="192.27047146401986" y="316.86600496277913" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="227.45409429280397" cy="324.86600496277913" r="3.7" fill="#20364b"/><text x="234.45409429280397" y="316.86600496277913" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="354.00496277915636" cy="324.86600496277913" r="3.7" fill="#20364b"/><text x="361.00496277915636" y="316.86600496277913" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N</text><circle cx="354.00496277915636" cy="198.3151364764268" r="3.7" fill="#20364b"/><text x="361.00496277915636" y="190.3151364764268" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(12,y₁)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si TA=2k, el radio mide 3k y la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia TC al centro C es 5k.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El radio es perpendicular a la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente. Por Pitágoras, el otro</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cateto mide 4k y la pendiente de L es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3/4.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde (4,0) hasta x=12, el incremento</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vertical es 8·3/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>