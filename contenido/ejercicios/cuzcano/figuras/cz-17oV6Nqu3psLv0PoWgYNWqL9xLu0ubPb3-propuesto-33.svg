<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">033 · Pendiente hacia el extremo de una perpendicular</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,342.13 375.10,342.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="346.81,370.42 346.81,168.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="129.19,342.13 129.19,240.39 149.54,196.87 346.81,342.13" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="346.81,342.13 129.19,240.39" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.07,342.13 374.97,339.77 374.67,337.43 374.19,335.12 373.50,332.86 372.64,330.66 371.59,328.55 370.37,326.53 368.99,324.62 367.45,322.83 365.76,321.17 363.95,319.66 362.01,318.31 359.97,317.12 357.84,316.11 355.63,315.28 353.35,314.64 351.04,314.19 348.69,313.93 346.33,313.87 343.97,314.01 341.64,314.35 339.33,314.88 337.09,315.60 334.90,316.50 332.81,317.58 330.81,318.84 328.92,320.25 327.15,321.82 325.53,323.53 324.05,325.37" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="346.8069636456733" y="342.1321809271118" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="129.19303635432667" y="342.1321809271118" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="129.19303635432667" y="240.39060453115755" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="149.54135163351754" y="196.86781907288824" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="375.0967741935484" y="347.5725291093955" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="354.4234511008704" y="168.57800852501316" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="318.5454146467971" y="316.69678682812327" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OU tiene longitud √(77²+36²)=85. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular que apunta arriba y a la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha es (36,77).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica ese vector por 17/85=1/5 y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">súmalo a U. Así P=(−349/5,257/5).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide la ordenada entre la abscisa.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>