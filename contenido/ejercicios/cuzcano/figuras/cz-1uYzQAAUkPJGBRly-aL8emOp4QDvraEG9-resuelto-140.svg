<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">140 · Foco que emerge del piso</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="213.22,185.86 235.52,260.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="235.52,260.21 268.98,371.73" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="235.52,371.73 235.52,260.21" fill="none" stroke="#008674" stroke-width="2.5"/><text x="220.21636506687648" y="177.85523210070812" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F</text><text x="242.52163650668766" y="252.20613690007872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><text x="275.9795436664044" y="363.7324940991345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">W</text><text x="242.52163650668766" y="363.7324940991345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="214.02045633359558" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">foco:h3m al final</text><text x="238.8040912667191" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">36cm +54cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el foco está a altura h, el rayo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que pasa por la punta del poste llega</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a la pared a Y=h+(90/36)(1.8−h).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Simplificar: Y=4.5−1.5 h. La sombra</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desciende a 1.5 veces la rapidez de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ascenso del foco.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Razón de rapideces=1/1.5=2/3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>