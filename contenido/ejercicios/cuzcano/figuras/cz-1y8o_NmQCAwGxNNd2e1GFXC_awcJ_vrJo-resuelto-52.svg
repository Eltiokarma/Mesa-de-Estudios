<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">052 · Bisectriz exterior a un cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="114.52,350.20 114.52,175.19 289.53,175.19 289.53,350.20 114.52,350.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="114.52,350.20 289.53,175.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="114.52,175.19 202.02,350.20 369.26,266.58 114.52,175.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="172.85,291.86 369.26,266.58" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645159" y="367.7040722946694" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="102.84786090139553" y="165.46202242049878" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="291.47746511095863" y="165.46202242049878" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="291.47746511095863" y="369.6487073896134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="196.19034545870508" y="373.5379775795013" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="159.24227865477008" y="295.7525737817433" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="375.0967741935484" y="270.47231754747196" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="340.0933424845573" y="258.8045069778083" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="340.0933424845573" y="287.9740334019675" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa lado 2 con P=(0,0), A=(0,2),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O=(2,0) y E=(1,0). En la diagonal PS</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se cumple y=x, y AE tiene ecuación</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=2−2x. Así M=(2/3,2/3) y AM=2 ME.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia de M a EI es ME. Por la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisectriz, su distancia a IA también</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale ME. El triángulo rectángulo</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">formado con A y el pie sobre IA tiene</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cateto opuesto ME e hipotenusa AM=2</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así ∠EAI=30°. Como ∠AEI=90°, ∠AIE=60°</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y su mitad vale 30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>