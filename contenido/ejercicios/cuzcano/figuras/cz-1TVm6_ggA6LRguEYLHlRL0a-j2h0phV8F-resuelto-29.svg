<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Dos hipotenusas correspondientes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.37,350.23 286.19,350.23 375.10,350.23 375.10,196.24 241.73,273.23 108.37,350.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,196.24 286.19,350.23 241.73,273.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="350.46,350.23 350.46,325.59 375.10,325.59" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="248.85,285.55 261.17,278.44 254.05,266.12" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="342.76279164227157" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="367.6284674281411" y="342.76279164227157" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="367.6284674281411" y="188.76890159232113" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="278.7200535542446" y="342.76279164227157" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="234.26584661729635" y="265.76584661729635" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe AB=a, BC=c y NB=n. De NA=NC se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sigue (a−n)²=n²+c², o a²+c²=2a(a−n).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por proyección sobre AC, AM=(a−n)a/AC.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa la igualdad anterior y AM=c para</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtener AC/2=c.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces ∠BCA=60°, a=√3c y n=c/√3. Por</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ello, ∠BCN=30° y ∠NCM=60°−30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>