<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">043 · Cociente y extremo incluido</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Conjunto solución real</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="65" y1="275" x2="135.0" y2="275" stroke="#1766b0" stroke-width="6"/><line x1="65" y1="275" x2="75" y2="267" stroke="#1766b0" stroke-width="3"/><line x1="65" y1="275" x2="75" y2="283" stroke="#1766b0" stroke-width="3"/><circle cx="135.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#1766b0"/><text x="135.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">-5</text><line x1="345.0" y1="275" x2="415" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="345.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="345.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">1</text><line x1="415" y1="275" x2="405" y2="267" stroke="#1766b0" stroke-width="3"/><line x1="415" y1="275" x2="405" y2="283" stroke="#1766b0" stroke-width="3"/><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 3&gt;1, exigir (x+3)/(x−1)≥1/3. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">argumento queda automáticamente</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Restar 1/3: 2(x+5)/[3(x−1)]≥0, con</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x≠1.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El análisis de signos incluye x=−5 y</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">excluye el polo x=1: x≤−5 o x&gt;1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>