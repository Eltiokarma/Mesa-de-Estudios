<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Isoterma y segmento vertical</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">V (L)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">P (atm)</text><polyline points="127.27,142.48 127.27,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">V constante</text><polyline points="127.27,142.48 131.14,175.02 135.01,200.16 138.88,220.18 142.76,236.50 146.63,250.05 150.50,261.48 154.37,271.26 158.25,279.72 162.12,287.11 165.99,293.62 169.86,299.40 173.74,304.56 177.61,309.20 181.48,313.40 185.35,317.21 189.23,320.69 193.10,323.87 196.97,326.80 200.84,329.50 204.71,332.00 208.59,334.32 212.46,336.48 216.33,338.49 220.20,340.38 224.08,342.14 227.95,343.80 231.82,345.36 235.69,346.83 239.57,348.22 243.44,349.53 247.31,350.77 251.18,351.95 255.05,353.07 258.93,354.13 262.80,355.15 266.67,356.11 270.54,357.04 274.42,357.92 278.29,358.76 282.16,359.57 286.03,360.34 289.91,361.08 293.78,361.79 297.65,362.47 301.52,363.13 305.39,363.76 309.27,364.37 313.14,364.96 317.01,365.52 320.88,366.07 324.76,366.60 328.63,367.11 332.50,367.60 336.37,368.07 340.25,368.53 344.12,368.98 347.99,369.41 351.86,369.83 355.74,370.23 359.61,370.63 363.48,371.01 367.35,371.38 371.22,371.74 375.10,372.09" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">T₂ constante</text><circle cx="127.26799007444168" cy="269.5" r="3.7" fill="#20364b"/><text x="134.26799007444168" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><circle cx="127.26799007444168" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="134.26799007444168" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><circle cx="338.1861042183623" cy="368.2903225806452" r="3.7" fill="#20364b"/><text x="345.1861042183623" y="360.2903225806452" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La isoterma da 5(a+1)=45a. Entonces</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=1/8 atm.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con V fijo, T₁/T₂=P₁/P₂. Al sustituir</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a, el cociente es (9/16)/(9/8)=1/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La temperatura de 2 es 300 K, por lo</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que la de 1 vale 150 K.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>