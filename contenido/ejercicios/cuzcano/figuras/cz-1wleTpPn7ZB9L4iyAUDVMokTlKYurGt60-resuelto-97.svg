<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">097 · Ángulos de un contorno cruzado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,282.29 159.94,357.07 350.17,207.51 106.81,207.51 297.69,357.73 375.10,300.66 230.13,181.27 100.90,282.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="124.30236147553634" y="271.6674641148325" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">a</text><text x="173.49976848279056" y="337.91997221793486" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">b</text><text x="330.93147090600405" y="217.8782991202346" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">c</text><text x="128.23815403611667" y="217.8782991202346" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">d</text><text x="231.8806914647322" y="196.88740546380615" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">e</text><text x="353.8902608427226" y="297.9060811853681" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">f</text><text x="306.6607501157586" y="337.91997221793486" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">g</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea X el cruce del lado que une b con</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">c y el lado que une e con f. El</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrilátero a,b,X,e aporta</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a+b+e+m=360°, donde m es su ángulo en</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">X.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El pentágono c,d,g,f,X tiene en X el</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo reflejo 360°−m. Su suma da</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">c+d+g+f+360°−m=540°. Sumando se</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene a+b+c+d+e+f+g=540°.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la progresión de siete ángulos, la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suma es 7d. Por tanto d=540/7°≈77,14°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>