<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">079 · Protón que gira en un campo magnético</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,186.50 109.51,186.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,249.21 109.51,249.21" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,315.61 109.51,315.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,378.32 109.51,378.32" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="166.07,186.50 174.68,186.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="166.07,249.21 174.68,249.21" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="166.07,315.61 174.68,315.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="166.07,378.32 174.68,378.32" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="233.70,186.50 242.30,186.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="233.70,249.21 242.30,249.21" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="233.70,315.61 242.30,315.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="233.70,378.32 242.30,378.32" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="301.32,186.50 309.93,186.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="301.32,249.21 309.93,249.21" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="301.32,315.61 309.93,315.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="301.32,378.32 309.93,378.32" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="366.49,186.50 375.10,186.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="366.49,249.21 375.10,249.21" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="366.49,315.61 375.10,315.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="366.49,378.32 375.10,378.32" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="102.75,223.39 190.05,223.39 175.29,214.78 190.05,223.39 175.29,232.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="102.74757702878637" y="252.9008389989874" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Protón</text><text x="327.7584261536236" y="160.68327788225082" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B saliente</text><text x="161.76681614349778" y="197.5703023289455" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">v</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La curvatura magnética satisface qvB =</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pv/r. Al cancelar v queda p = qBr.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa λ = h/p para el momento del</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">protón.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye para obtener λ = h/(qBr).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>