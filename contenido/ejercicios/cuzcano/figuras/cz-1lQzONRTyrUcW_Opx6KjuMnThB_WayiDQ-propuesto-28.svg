<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Ángulo desde una arista prolongada del tetraedro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="168.57,396.52 204.64,142.48 292.12,355.63" fill="#f4c581" fill-opacity="0.45"/><polyline points="168.57,396.52 307.43,396.52 292.12,355.63 168.57,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="168.57,396.52 256.04,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="307.43,396.52 256.04,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="292.12,355.63 256.04,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="307.43,396.52 256.04,269.50 204.64,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="168.57,396.52 204.64,142.48 292.12,355.63" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="168.56542561880178" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="307.4345743811982" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="292.11889478357" y="355.62629741800515" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="256.03963159452337" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="204.64468880784847" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a la arista. En ADP y CDP, los dos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lados junto a D miden a y su ángulo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">comprendido es 120°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ley de cosenos da AP²=CP²=3a².</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica la ley de cosenos en APC, cuyo</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tercer lado AC mide a.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>