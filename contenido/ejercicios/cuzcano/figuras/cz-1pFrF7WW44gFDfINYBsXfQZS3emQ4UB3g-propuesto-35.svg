<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Tangente de línea de campo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="348.6528594856745" x2="421" y2="348.6528594856745" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645159" y1="105" x2="100.90322580645159" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="100.90,348.65 375.10,190.35 375.10,348.65 100.90,348.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">uniones</text><circle cx="100.90322580645159" cy="348.6528594856745" r="3.7" fill="#20364b"/><text x="107.90322580645159" y="340.6528594856745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4Q+</text><circle cx="375.0967741935484" cy="348.6528594856745" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="340.6528594856745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q+</text><circle cx="375.0967741935484" cy="190.3471405143255" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="182.3471405143255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si QP=h, la distancia 4Q–P=2h.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambos campos tienen módulo KQ/h²; sus</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">direcciones son 30° y90° con</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resultante biseca:60° con</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal,30° con vertical.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>