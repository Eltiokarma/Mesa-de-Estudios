<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">035 · Una secante de dos paralelas internas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,314.63 169.45,223.23 238.00,314.63 375.10,314.63 100.90,314.63" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="192.30,314.63 146.60,252.93 283.70,314.63" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="192.30,314.63 212.87,281.04 375.10,314.63" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="322.625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="169.4516129032258" y="216.37499999999997" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="237.99999999999997" y="322.625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="322.625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="192.3010752688172" y="322.625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="146.6021505376344" y="246.0793010752688" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="212.86559139784947" y="275.7836021505376" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elige coordenadas afines A=(0,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C=(2,0), B=(0,1). Para P=(p,0)</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resultan Q=(0,p/2) y R=(p,1−p/2).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta QF pasa por F=(4,0), así que</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a la abscisa p tiene altura p/2−p²/8.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Igualar a 1−p/2 da p²−8p+8=0.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 0&lt;p&lt;2, usa p=4−2√2. Resta p de 4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>