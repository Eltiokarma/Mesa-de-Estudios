<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Símbolo de Lewis del elemento 33</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="238.0" y="273.2357685009488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">As</text><text x="238.0" y="142.483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="301.508064516129" y="142.483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="110.98387096774194" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="365.01612903225805" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="238.0" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El elemento es As. Su capa externa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contiene 4s²4p³.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma 2+3 para obtener cinco electrones</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de valencia.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dibuja un par y tres puntos</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">individuales alrededor del símbolo,</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">como en la alternativa D.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>