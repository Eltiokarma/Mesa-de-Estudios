<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">021 · Reducción de una expresión a un cuadrado de lado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="64" y="160" font-family="Arial,sans-serif" font-size="19" fill="#1766b0" text-anchor="start">RELACIONES DEL PROBLEMA</text><text x="64" y="208" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa cos A=−cos(B+C) y la suma de</text><text x="64" y="231" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosenos. El corchete es −2cos B cos</text><text x="64" y="254" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C.</text><text x="64" y="293" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La expresión es (b cos C+c cos B)².</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa cos A=−cos(B+C) y la suma de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosenos. El corchete es −2cos B cos C.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La expresión es (b cos C+c cos B)².</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la ley de cosenos, b cos</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C=(a²+b²−c²)/(2a) y c cos</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=(a²+c²−b²)/(2a). La suma vale a.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>