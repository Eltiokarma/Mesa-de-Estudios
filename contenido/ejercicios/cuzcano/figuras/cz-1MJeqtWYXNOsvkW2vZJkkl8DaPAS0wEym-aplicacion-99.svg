<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">099 · Esfera lisa y bloque contra una pared</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="308.41,142.48 308.41,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="227.42,309.08 226.94,316.29 225.53,323.37 223.21,330.21 220.02,336.69 216.00,342.70 211.24,348.13 205.81,352.89 199.80,356.90 193.32,360.10 186.48,362.42 179.40,363.83 172.19,364.30 164.98,363.83 157.90,362.42 151.06,360.10 144.58,356.90 138.57,352.89 133.14,348.13 128.38,342.70 124.37,336.69 121.17,330.21 118.85,323.37 117.44,316.29 116.97,309.08 117.44,301.87 118.85,294.78 121.17,287.94 124.37,281.47 128.38,275.46 133.14,270.03 138.57,265.27 144.58,261.25 151.06,258.06 157.90,255.73 164.98,254.33 172.19,253.85 179.40,254.33 186.48,255.73 193.32,258.06 199.80,261.25 205.81,265.27 211.24,270.03 216.00,275.46 220.02,281.47 223.21,287.94 225.53,294.78 226.94,301.87 227.42,309.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="227.42,284.23 308.41,284.23 308.41,333.93 227.42,333.93 227.42,284.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="205.33,264.90 308.41,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="308.41,184.82 292.76,181.14 282.64,174.70" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="280.79891304347825" y="204.15112201963535" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="264.2315918653576" y="315.5203366058906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="172.19091865357643" y="314.5999298737728" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">100 N</text><text x="359.03348527349226" y="314.5999298737728" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">μₛ=0,8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la esfera, T cos 37°=100 N y la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fuerza horizontal de contacto es R=T</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 37°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así, R=100 tan 37°≈75 N usando el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo 3-4-5. La normal de la pared</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre el bloque es igual a R.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el límite de caída, la fricción de</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la pared sostiene el peso: Q=μₛR.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>