<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">009 · Dos líquidos no miscibles de alturas distintas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,345.66 161.84,345.66 161.84,368.51 314.16,368.51 314.16,345.66 375.10,345.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="161.84,345.66 193.82,288.54 193.82,208.57 238.00,208.57 238.00,170.49 269.99,170.49 269.99,208.57 315.69,208.57 315.69,288.54 314.16,345.66" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="193.82,269.50 315.69,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><text x="257.0412186379928" y="304.5358422939068" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ρ₁</text><text x="257.0412186379928" y="240.5573476702509" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ρ₂</text><text x="135.17741935483872" y="309.8673835125448" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h₁</text><text x="135.17741935483872" y="229.1326164874552" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2h₁</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La capa inferior aporta ρ₁gh₁.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La capa superior aporta ρ₂g(2h₁) =</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1,6ρ₁gh₁.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma las contribuciones hidrostáticas</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de las dos capas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>