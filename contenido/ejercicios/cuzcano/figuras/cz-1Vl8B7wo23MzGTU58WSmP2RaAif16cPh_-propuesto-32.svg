37 151.17,357.85 155.74,354.34 160.31,350.82 164.88,347.31 169.45,343.79 174.02,340.28 178.59,336.76 183.16,333.25 187.73,329.73 192.30,326.22 196.87,322.70 201.44,319.19 206.01,315.67 210.58,312.16 215.15,308.64 219.72,305.13 224.29,301.61 228.86,298.10 233.43,294.58 238.00,291.07 242.57,287.55 247.14,284.04 251.71,280.52 256.28,277.01 260.85,273.49 265.42,269.98 269.99,266.46 274.56,262.95 279.13,259.43 283.70,255.92 288.27,252.40 292.84,248.89 297.41,245.37 301.98,241.86 306.55,238.35 311.12,234.83 315.69,231.32 320.26,227.80 324.83,224.29 329.40,220.77 333.97,217.26 338.54,213.74 343.11,210.23 347.68,206.71 352.25,203.20 356.82,199.68 361.39,196.17 365.96,192.65 370.53,189.14 375.10,185.62" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">L₁</text><circle cx="150.7565982404692" cy="358.17163724893487" r="3.7" fill="#20364b"/><text x="157.7565982404692" y="350.17163724893487" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−1,1)</text><circle cx="350.1700879765396" cy="204.79367011564213" r="3.7" fill="#20364b"/><text x="357.1700879765396" y="196.79367011564213" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(3,9)</text><circle cx="125.82991202346042" cy="377.34388314059646" r="3.7" fill="#20364b"/><text x="132.82991202346042" y="369.34388314059646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−1,5; 0)</text><circle cx="200.60997067448682" cy="319.8271454656117" r="3.7" fill="#20364b"/><text x="207.60997067448682" y="311.8271454656117" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,3)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los cortes de L₁ con los ejes dan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente 3/(3/2)=2 y ordenada al</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">origen 3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así L₁ tiene ecuación y=2x+3. Iguala</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con x² y lleva todo al primer miembro.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Factoriza x²−2x−3=(x−3)(x+1). Los</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puntos comunes tienen abscisas 3 y −1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>