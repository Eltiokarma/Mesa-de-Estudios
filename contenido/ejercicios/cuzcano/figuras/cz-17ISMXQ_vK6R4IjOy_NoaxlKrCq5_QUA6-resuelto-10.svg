<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Sombra expresada por cincuenta</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="238.00,194.78 215.15,263.33 238.00,286.18 260.85,263.33" fill="#f4c581" fill-opacity="0.45"/><polygon points="169.45,263.33 203.73,297.60 238.00,286.18" fill="#f4c581" fill-opacity="0.45"/><polygon points="306.55,263.33 272.27,297.60 238.00,286.18" fill="#f4c581" fill-opacity="0.45"/><polygon points="100.90,331.88 203.73,297.60 238.00,331.88" fill="#f4c581" fill-opacity="0.45"/><polygon points="375.10,331.88 272.27,297.60 238.00,331.88" fill="#f4c581" fill-opacity="0.45"/><polyline points="238.00,194.78 100.90,331.88 375.10,331.88 238.00,194.78" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="169.45,263.33 306.55,263.33" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="169.45,263.33 238.00,331.88 306.55,263.33" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="169.45,263.33 375.10,331.88" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="306.55,263.33 100.90,331.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,194.78 215.15,263.33 238.00,286.18 260.85,263.33 238.00,194.78" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="169.45,263.33 203.73,297.60 238.00,286.18 169.45,263.33" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="306.55,263.33 272.27,297.60 238.00,286.18 306.55,263.33" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,331.88 203.73,297.60 238.00,331.88 100.90,331.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,331.88 272.27,297.60 238.00,331.88 375.10,331.88" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="152.45967741935482" y="255.33064516129036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><text x="319.7177419354839" y="255.33064516129036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N</text><text x="233.34677419354838" y="336.2177419354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el redibujo, tomar base 4 y altura</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2: área 4. Las rectas de M y N a los</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértices opuestos se cortan a altura</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2/3.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cometa central de arriba mide 4/9.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos triángulos medios miden 1/6</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cada uno y los dos de la base, 1/2</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cada uno.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La sombra es 16/9 y el blanco 20/9. La</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">razón 4/5 equivale a 40 por 50.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>