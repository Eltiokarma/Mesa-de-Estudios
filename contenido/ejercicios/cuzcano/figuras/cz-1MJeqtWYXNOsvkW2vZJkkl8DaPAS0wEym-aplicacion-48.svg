<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">048 · Un extremo de la cuerda se fija al eje de la polea grande</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="276.28,188.32 275.89,193.27 274.72,198.11 272.82,202.71 270.22,206.95 266.99,210.73 263.21,213.96 258.97,216.56 254.38,218.46 249.54,219.62 244.58,220.01 239.62,219.62 234.79,218.46 230.19,216.56 225.95,213.96 222.17,210.73 218.94,206.95 216.34,202.71 214.44,198.11 213.28,193.27 212.89,188.32 213.28,183.36 214.44,178.52 216.34,173.93 218.94,169.69 222.17,165.91 225.95,162.68 230.19,160.08 234.79,158.18 239.62,157.01 244.58,156.62 249.54,157.01 254.38,158.18 258.97,160.08 263.21,162.68 266.99,165.91 270.22,169.69 272.82,173.93 274.72,178.52 275.89,183.36 276.28,188.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="276.28,292.66 276.08,295.14 275.50,297.56 274.55,299.85 273.25,301.97 271.63,303.87 269.74,305.48 267.62,306.78 265.33,307.73 262.91,308.31 260.43,308.51 257.95,308.31 255.53,307.73 253.23,306.78 251.11,305.48 249.22,303.87 247.61,301.97 246.31,299.85 245.36,297.56 244.78,295.14 244.58,292.66 244.78,290.18 245.36,287.76 246.31,285.47 247.61,283.35 249.22,281.46 251.11,279.84 253.23,278.54 255.53,277.59 257.95,277.01 260.43,276.81 262.91,277.01 265.33,277.59 267.62,278.54 269.74,279.84 271.63,281.46 273.25,283.35 274.55,285.47 275.50,287.76 276.08,290.18 276.28,292.66" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="244.58,188.32 244.58,292.66" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="276.28,188.32 276.28,292.66" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="212.89,188.32 212.89,266.33 207.04,255.60" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="212.89,266.33 218.74,255.60" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="260.43,292.66 260.43,363.85" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="243.61,363.85 277.25,363.85 277.25,396.52 243.61,396.52 243.61,363.85" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="244.58,188.32 244.58,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="198.7493344065383" y="255.6038016221906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="237.26862113801005" y="245.8520834623243" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="260.67274472168907" y="380.913379976472" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El extremo libre y el tramo anclado</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pertenecen a la misma cuerda, de modo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que tienen tensión F.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La polea móvil recibe dos fuerzas</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ascendentes de esa tensión. La carga</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">transmite mg hacia abajo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Equilibra 2F=mg. El tramo de cuerda</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fijado al eje tiene esa misma tensión.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>