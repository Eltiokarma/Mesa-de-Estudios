<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Paralela por un punto exterior</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="305.7903225806452" x2="421" y2="305.7903225806452" stroke="#20364b" stroke-width="1.7"/><line x1="147.2741935483871" y1="105" x2="147.2741935483871" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="110.98,142.48 256.15,360.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Recta dada</text><polyline points="219.85,178.77 365.02,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Paralela</text><circle cx="147.2741935483871" cy="196.9193548387097" r="3.7" fill="#20364b"/><text x="154.2741935483871" y="188.9193548387097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,3)</text><circle cx="219.8548387096774" cy="305.7903225806452" r="3.7" fill="#20364b"/><text x="226.8548387096774" y="297.7903225806452" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2,0)</text><circle cx="328.72580645161287" cy="342.08064516129036" r="3.7" fill="#20364b"/><text x="335.72580645161287" y="334.08064516129036" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(5,−1)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de la recta dada es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0−3)/(2−0)=−3/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La paralela pedida satisface</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y+1=−3(x−5)/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica por 2 y ordena términos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>