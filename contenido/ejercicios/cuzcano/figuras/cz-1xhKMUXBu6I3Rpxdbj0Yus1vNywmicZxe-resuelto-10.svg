<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Mayor ángulo de un triángulo con una ceviana dada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="104.45,396.52 206.47,396.52 371.55,396.52 104.45,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="104.45,396.52 289.01,142.48 371.55,396.52 206.47,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="289.01,142.48 206.47,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="104.44733845360719" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="289.01257742271093" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="371.5526615463928" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="206.47249329902917" y="396.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="163.21050953402002" y="372.4766499539074" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3θ</text><text x="339.5000227752585" y="372.4766499539074" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4θ</text><text x="288.75001138762923" y="190.84503025081312" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En BCD, BD/BC=sen 4θ/sen 6θ. En ABC,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC/BC=sen 7θ/sen 3θ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala las razones. Producto a suma da</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos 13θ=cos 7θ.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ∠ABD=180°−9θ&gt;0, se tiene 0&lt;θ&lt;20°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La única solución es 20θ=360°, θ=18°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ángulos quedan 54°,54°,72°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>