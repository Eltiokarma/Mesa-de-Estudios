<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">020 · Una báscula bajo la masa mayor</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="254.17,184.05 253.68,189.01 252.23,193.77 249.88,198.17 246.73,202.02 242.88,205.17 238.48,207.52 233.72,208.97 228.76,209.46 223.81,208.97 219.04,207.52 214.65,205.17 210.80,202.02 207.64,198.17 205.29,193.77 203.85,189.01 203.36,184.05 203.85,179.10 205.29,174.33 207.64,169.94 210.80,166.09 214.65,162.93 219.04,160.58 223.81,159.14 228.76,158.65 233.72,159.14 238.48,160.58 242.88,162.93 246.73,166.09 249.88,169.94 252.23,174.33 253.68,179.10 254.17,184.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="228.76,142.48 228.76,184.05" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="198.74,142.48 258.78,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="203.36,184.05 203.36,290.28" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="254.17,184.05 254.17,338.78" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="186.27,290.28 220.45,290.28 220.45,322.62 186.27,322.62 186.27,290.28" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="237.08,338.78 271.26,338.78 271.26,371.11 237.08,371.11 237.08,338.78" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="227.84,371.11 289.73,371.11" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="187.1935483870968" y="306.45014662756597" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1,0 kg</text><text x="284.1876832844575" y="356.33284457478004" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1,5 kg</text><text x="255.55131964809385" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Báscula</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El bloque ligero solo tiene peso y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tensión. Así T=1,0×10=10 N.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el bloque pesado, la tensión y la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal apuntan arriba y equilibran los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15 N de peso.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La báscula mide la normal, que vale</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15−10=5 N.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>