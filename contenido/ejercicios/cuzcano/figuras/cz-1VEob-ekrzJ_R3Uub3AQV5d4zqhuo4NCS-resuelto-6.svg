<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Cantidad de aire por igual volumen inspirado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">estados indicados</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">n/n₀</text><polyline points="238.00,396.52 238.00,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">nivel del mar</text><polyline points="375.10,396.52 375.10,147.56" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">sierra</text><circle cx="237.99999999999997" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">nivel del mar</text><circle cx="375.09677419354836" cy="147.5645161290323" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="139.5645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">sierra</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A volumen fijo, n=PV/(RT). La razón es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ns/n₀=(Ps/P₀)(T₀/Ts).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con T₀=294 K y Ts=270 K:</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ns/n₀=0,9·294/270=0,98.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La disminución de cantidad de gas es</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1−0,98)100 %=2 %. Es un cálculo de</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">gas por igual volumen, no una</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">afirmación sobre la respuesta</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fisiológica de una persona.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>