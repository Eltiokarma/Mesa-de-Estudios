<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">005 · Dos cuerdas sobre un plano liso de 30°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,346.90 375.10,188.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="202.58,288.07 182.02,252.65 217.44,232.08 238.00,267.50 202.58,288.07" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="209.44,258.93 100.90,258.93" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="115.18,251.79 100.90,258.93 115.18,266.07" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="235.14,244.65 343.68,181.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="334.90,195.15 343.68,181.82 327.74,182.79" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="220.29,277.78 169.45,189.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="182.78,198.60 169.45,189.81 170.42,205.75" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="209.44,258.93 209.44,367.47" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="202.30,353.19 209.44,367.47 216.58,353.19" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="109.47177419354838" y="245.22244623655914" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T₁</text><text x="346.5349462365591" y="171.5329301075269" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T₂</text><text x="156.88440860215053" y="189.81249999999997" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="220.29166666666666" y="362.8971774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">W</text><text x="359.10215053763443" y="214.37567204301072" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuerda izquierda ejerce T₁</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal hacia la izquierda. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuerda derecha ejerce T₂ rampa arriba.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El peso W es vertical hacia abajo. La</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal N es perpendicular al plano y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">apunta hacia arriba y a la izquierda.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al ser lisa la rampa, no hay</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente de rozamiento. El diagrama</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">correcto contiene esas cuatro fuerzas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>