<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Distancia de un punto medio al lado oblicuo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="140.30,201.11 335.70,201.11" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="218.46,396.52 218.46,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="179.38,259.73 296.62,376.98 257.54,181.57 179.38,259.73" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="277.08,279.27 238.00,318.35" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="169.60669975186104" y="259.7295285359802" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="257.5409429280397" y="169.84119106699757" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="306.393300248139" y="376.9751861042183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="286.85235732009926" y="279.27047146401986" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="228.22952853598017" y="322.2605459057072" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto medio de B y C es M=(3,−4).</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La dirección de AC es (6,−6).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El parámetro de la proyección</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ortogonal de M sobre A+t(C−A) es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[(M−A)·(C−A)]/∥C−A∥²=36/72=1/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El pie H=(1,−6) cae dentro del</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segmento. La diferencia M−H=(2,2)</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene longitud 2√2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>