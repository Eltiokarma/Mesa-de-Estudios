<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">063 · Cuatro columnas y tres filas de manzanas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="119.90,362.59 119.90,172.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="183.22,362.59 183.22,172.61" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="246.55,362.59 246.55,172.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="309.87,362.59 309.87,172.61" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="373.20,362.59 373.20,172.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="119.90,362.59 373.20,362.59" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="119.90,299.26 373.20,299.26" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="119.90,235.94 373.20,235.94" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="119.90,172.61 373.20,172.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="119.90,172.61 183.22,172.61 183.22,235.94 246.55,235.94 246.55,299.26 309.87,299.26 309.87,362.59 373.20,362.59" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="107.90322580645162" y="156.3819190940922" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="382.0967741935484" y="366.6180809059078" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toda ruta mínima contiene cuatro</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tramos horizontales y tres verticales,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sin retrocesos.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La elección consiste en situar los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tres verticales entre los siete</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tramos.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se obtienen C(7,3)=35 rutas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>