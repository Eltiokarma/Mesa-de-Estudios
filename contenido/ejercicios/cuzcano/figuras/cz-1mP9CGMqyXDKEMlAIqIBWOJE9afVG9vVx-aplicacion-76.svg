<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">076 · Tramo de una gráfica con mayor fem</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="103.68,344.69 365.57,344.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="359.22,347.47 365.57,344.69 359.22,341.92" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="103.68,344.69 103.68,189.15" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="106.46,195.50 103.68,189.15 100.90,195.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="103.68,209.78 222.72,209.78 302.08,248.67 341.76,344.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="222.72,344.69 222.72,209.78" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="302.08,344.69 302.08,248.67" fill="none" stroke="#008674" stroke-width="2.5"/><text x="375.09677419354836" y="345.88532281406094" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t (s)</text><text x="113.20423883105366" y="183.98811913542787" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="103.68087390878112" y="355.01188086457216" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0</text><text x="222.7229354371878" y="355.01188086457216" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="302.0843097894589" y="355.01188086457216" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="341.7649969655945" y="355.01188086457216" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para área y orientación fijas, el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">módulo de la fem es el área por el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valor absoluto de la pendiente de</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B(t).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De 0 a 3 s la pendiente es cero. De 3</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a 5 s su módulo es menor que el del</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">último tramo, según la gráfica.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La mayor fem corresponde al tramo más</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclinado, mientras el campo cae a</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cero.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>