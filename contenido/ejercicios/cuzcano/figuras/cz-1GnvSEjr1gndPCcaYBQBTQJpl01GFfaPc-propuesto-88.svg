ill="#20364b" text-anchor="start">24A</text><circle cx="375.09677419354836" cy="390.3202202989772" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="382.3202202989772" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">0,585A</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tramo cursor–N queda puenteado;</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resistencia útil R=200x/0,5=400x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I(x)=120/(5+400x),0≤x≤0,5 m: decrece</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 24 A a 120/205≈0,585 A.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La opciónC tiene forma correcta,pero</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valores2,4 y0,48 A sólo serían</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">compatibles con resistor fijo50 Ω,no5</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ω impreso.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>