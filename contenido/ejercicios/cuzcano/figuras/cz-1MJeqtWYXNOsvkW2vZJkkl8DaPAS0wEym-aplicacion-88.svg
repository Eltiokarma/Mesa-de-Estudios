<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">088 · Punto de sujeción de un cable de 780 N</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,342.26 100.90,143.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,315.45 330.67,182.80" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,182.80 215.79,249.13" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="330.67,182.80 330.67,352.22" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="304.63,352.22 356.72,352.22 356.72,395.87 304.63,395.87 304.63,352.22" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="120.8167237340061" y="202.1004685528924" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="150.6869706253379" y="303.9656694899982" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="276.29518832222027" y="202.1004685528924" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="375.0967741935484" y="373.662912236439" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">300 N</text><text x="163.70733465489275" y="202.8663723193368" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">780 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El punto de unión del cable está a ℓ−b</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la articulación. Su brazo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular es (ℓ−b)sen 60°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El peso de la viga, 180 N, actúa a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ℓ/2. Sus momentos y el de los 300 N</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">usan proyecciones horizontales con cos</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">30°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala 780(ℓ−b)sen 60° a</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[180ℓ/2+300ℓ]cos 30°. Como los</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">factores trigonométricos son iguales,</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">780(ℓ−b)=390ℓ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>