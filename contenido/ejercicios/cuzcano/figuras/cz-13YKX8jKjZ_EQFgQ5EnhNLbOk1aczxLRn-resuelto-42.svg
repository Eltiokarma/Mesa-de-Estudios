92,272.66 229.98,274.71 227.12,276.88 224.34,279.15 221.66,281.54 219.07,284.02 216.58,286.61 214.20,289.29 211.92,292.07 209.76,294.93 207.70,297.87 205.77,300.90 203.95,303.99 202.26,307.16 200.70,310.39 199.26,313.68 197.95,317.02 196.77,320.41 195.73,323.84 194.83,327.32 194.06,330.82 193.43,334.36 192.93,337.91 192.58,341.48 192.37,345.06 192.30,348.65" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="348.6528594856745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="100.90322580645162" y="190.34714051432547" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="192.3010752688172" y="190.34714051432547" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="192.3010752688172" y="348.6528594856745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="283.6989247311828" y="348.6528594856745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="237.99999999999997" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="169.4516129032258" y="309.07642974283726" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el paralelismo y los lados</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verticales, OD=RD=r. Así RO=2r y OE=r.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo REO da ∠ERO=30°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como ID∥OE, ID⊥RE. Tomando R=(0,0),</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(r,0) y O=(2r,0), se obtiene</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">RX=√3r/2 y XE=√3r/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sobre la diagonal, XD=r/2 e IX=3r/2</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por las proyecciones de RD e ID.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Compara las áreas de los dos</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulos rectángulos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>