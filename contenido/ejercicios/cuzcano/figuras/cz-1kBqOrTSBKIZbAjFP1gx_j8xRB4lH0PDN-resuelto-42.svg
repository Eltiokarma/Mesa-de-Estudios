<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Pendiente del gráfico de energía cinética</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="102.84,325.58 373.16,325.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="128.72,396.52 128.72,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="128.72,381.18 184.32,325.58" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="184.32,325.58 346.32,163.57" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="184.31771150334754" y="344.75106512477174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ν₀</text><text x="117.21485088253195" y="344.75106512477174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0</text><text x="350.15763846622036" y="345.7096774193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ν (Hz)</text><text x="152.6835057821059" y="151.11138161898958" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Kmáx (J)</text><text x="300.3097991479002" y="249.84844796104684" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Tramo lineal</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El balance de Einstein da Kmáx = hν −</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">φ.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La función trabajo es constante para</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la muestra. La variación cumple ΔKmáx</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= hΔν.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así la pendiente es h, la constante de</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Planck, con unidades J·s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>