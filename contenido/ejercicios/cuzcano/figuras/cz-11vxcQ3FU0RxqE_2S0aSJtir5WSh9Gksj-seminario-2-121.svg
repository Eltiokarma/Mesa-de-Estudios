<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">121 · Mínimo de tres senos y cosenos con desfase</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (radianes)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">valor</text><polyline points="100.90,152.97 105.47,158.89 110.04,166.02 114.61,174.29 119.18,183.60 123.75,193.85 128.32,204.93 132.89,216.72 137.46,229.09 142.03,241.89 146.60,255.01 151.17,268.28 155.74,281.56 160.31,294.71 164.88,307.59 169.45,320.04 174.02,331.95 178.59,343.17 183.16,353.58 187.73,363.07 192.30,371.54 196.87,378.89 201.44,385.04 206.01,389.92 210.58,393.49 215.15,395.69 219.72,396.52 224.29,395.95 228.86,393.99 233.43,390.68 238.00,386.03 242.57,380.11 247.14,372.98 251.71,364.71 256.28,355.40 260.85,345.15 265.42,334.07 269.99,322.28 274.56,309.91 279.13,297.11 283.70,283.99 288.27,270.72 292.84,257.44 297.41,244.29 301.98,231.41 306.55,218.96 311.12,207.05 315.69,195.83 320.26,185.42 324.83,175.93 329.40,167.46 333.97,160.11 338.54,153.96 343.11,149.08 347.68,145.51 352.25,143.31 356.82,142.48 361.39,143.05 365.96,145.01 370.53,148.32 375.10,152.97" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">f(x)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desarrolla las sumas. El coeficiente</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de cos x es a=5sen 37°+1 y el de sen x</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es b=5cos 37°−√3−4.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mínimo de a cos x+b sen x es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−√(a²+b²). Se alcanza en la dirección</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuesta al vector (a,b).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con sen 37°≈3/5 y cos 37°≈4/5, salen</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a≈4 y b≈−√3. Evalúa también con 37°</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exactos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>