<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Ángulo espacial conociendo dos ángulos de proyección</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,332.88 308.40,332.88 375.10,282.48 167.60,282.48 100.90,332.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="145.37,321.68 240.88,206.12" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="145.37,321.68 290.29,321.68" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="145.37,321.68 240.88,299.28" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="240.88,206.12 240.88,299.28" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><text x="145.36704446381867" y="321.67791448288796" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="240.88191417223675" y="206.12379044784925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="290.2861571248668" y="321.67791448288796" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="240.88191417223675" y="299.28132434436236" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="300.6939843068875" y="329.74068693275717" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="165.52397558849174" y="304.7355527663327" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como AB forma 45° con el plano,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AT=AB·cos 45°.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Proyecta AT sobre AC. La componente de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB en la dirección de AC vale AT·cos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">45° porque la componente perpendicular</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">al plano no aporta en esa dirección.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide por AB. Se obtiene cos</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠BAC=cos²45°=1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>