<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">002 · La hormiga y las aristas del tetraedro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,382.60 375.10,382.60" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">edge</text><polyline points="100.90,382.60 238.00,156.40" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">edge</text><polyline points="100.90,382.60 238.00,310.63" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">edge</text><polyline points="375.10,382.60 238.00,156.40" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">edge</text><polyline points="375.10,382.60 238.00,310.63" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="503" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">edge</text><polyline points="238.00,156.40 238.00,310.63" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="503" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">edge</text><circle cx="100.90322580645164" cy="382.6048387096774" r="3.7" fill="#20364b"/><text x="107.90322580645164" y="374.6048387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="375.09677419354836" cy="382.6048387096774" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="374.6048387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="238.0" cy="156.39516129032262" r="3.7" fill="#20364b"/><text x="245.0" y="148.39516129032262" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="238.0" cy="310.6290322580645" r="3.7" fill="#20364b"/><text x="245.0" y="302.6290322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">D</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada uno de los cuatro vértices tiene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">grado impar. Un recorrido abierto</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">admite dos extremos impares, así que</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">debe repetirse al menos una arista.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se logra con C–A–B–C–D–A–B–D. Las seis</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aristas están cubiertas y solo se</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">repite AB.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide 8,4·60=504 segundos entre las</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">siete aristas recorridas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>