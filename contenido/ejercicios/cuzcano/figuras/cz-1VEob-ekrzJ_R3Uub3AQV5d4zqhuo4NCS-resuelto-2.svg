<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">002 · Exponente adiabático desde dos estados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">V (m³)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">P (10⁵ Pa)</text><polyline points="375.10,345.71 372.81,344.71 370.53,343.69 368.24,342.63 365.96,341.55 363.67,340.43 361.39,339.28 359.10,338.10 356.82,336.88 354.53,335.63 352.25,334.33 349.96,333.00 347.68,331.63 345.39,330.21 343.11,328.75 340.82,327.24 338.54,325.69 336.25,324.08 333.97,322.42 331.68,320.70 329.40,318.93 327.11,317.10 324.83,315.21 322.54,313.25 320.26,311.22 317.97,309.12 315.69,306.95 313.40,304.69 311.12,302.36 308.83,299.94 306.55,297.43 304.26,294.82 301.98,292.12 299.69,289.31 297.41,286.40 295.12,283.37 292.84,280.21 290.55,276.93 288.27,273.52 285.98,269.97 283.70,266.26 281.41,262.40 279.13,258.38 276.84,254.17 274.56,249.79 272.27,245.21 269.99,240.41 267.70,235.40 265.42,230.16 263.13,224.67 260.85,218.92 258.56,212.88 256.28,206.55 253.99,199.90 251.71,192.92 249.42,185.57 247.14,177.84 244.85,169.69 242.57,161.11 240.28,152.05 238.00,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">proceso</text><line x1="238.00000000000003" y1="142.483870967742" x2="244.08756042038289" y2="150.41744570604178" stroke="#1766b0" stroke-width="2"/><line x1="238.00000000000003" y1="142.483870967742" x2="236.15553843501894" y2="152.3122971660358" stroke="#1766b0" stroke-width="2"/><circle cx="375.0967741935484" cy="345.7096774193549" r="3.7" fill="#20364b"/><text x="368.0967741935484" y="359.7096774193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="end">1: 1,2 m³</text><circle cx="238.00000000000003" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="245.00000000000003" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2: 0,6 m³</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplicar P₁V₁^γ=P₂V₂^γ:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1,2/0,6)^γ=15/3, luego 2^γ=5.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">γ=log5/log2. Con log2≈0,3:</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">γ≈(1−0,3)/0,3=7/3≈2,3; con logaritmos</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sin redondear, γ≈2,321928.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">γ≈2,322 supera 5/3. Es un ajuste</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">formal de PV^γ=cte, incompatible con</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el gas molecular clásico usual.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aclarar el modelo físico antes de</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">usarlo en la app.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>