<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">091 · Razón de superficies para un tetraedro y una base ampliada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="116.02,312.01 253.12,312.01 238.00,271.65" fill="#f4c581" fill-opacity="0.45"/><polyline points="116.02,312.01 253.12,312.01 238.00,271.65 116.02,312.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="116.02,312.01 202.38,186.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="253.12,312.01 202.38,186.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,271.65 202.38,186.62" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="131.14,352.38 100.90,271.65 375.10,271.65 131.14,352.38" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="131.14,352.38 202.38,186.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,271.65 202.38,186.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="375.10,271.65 202.38,186.62" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="116.02343275039553" y="312.0135375800617" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="253.1202069439439" y="312.0135375800617" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="238.00000000000003" y="271.6455792423677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="202.38121323144648" y="186.61850408224427" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="131.14363969433944" y="352.38149591775573" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="100.90322580645163" y="271.6455792423677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="375.0967741935484" y="271.6455792423677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a la arista regular. MNS es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equilátero de lado 2a y tiene el mismo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">centro que BCD. El área de su base es</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a²√3.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura común a la base es a√(2/3) y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el inradio de MNS es a/√3. Por</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pitágoras, la altura inclinada de cada</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cara lateral grande es a.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las tres caras laterales suman 3a². El</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tetraedro pequeño tiene área a²√3.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>