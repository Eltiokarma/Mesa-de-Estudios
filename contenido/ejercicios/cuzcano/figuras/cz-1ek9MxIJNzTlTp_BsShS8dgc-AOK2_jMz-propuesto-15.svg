<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Reflexión de una rama de arcoseno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.4838709677419" x2="421" y2="142.4838709677419" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 105.47,396.36 110.04,395.91 114.61,395.16 119.18,394.10 123.75,392.75 128.32,391.11 132.89,389.18 137.46,386.97 142.03,384.48 146.60,381.72 151.17,378.70 155.74,375.42 160.31,371.90 164.88,368.15 169.45,364.17 174.02,359.97 178.59,355.58 183.16,350.99 187.73,346.22 192.30,341.29 196.87,336.21 201.44,330.99 206.01,325.65 210.58,320.20 215.15,314.65 219.72,309.03 224.29,303.35 228.86,297.61 233.43,291.85 238.00,286.07 242.57,280.29 247.14,274.52 251.71,268.79 256.28,263.10 260.85,257.48 265.42,251.94 269.99,246.49 274.56,241.14 279.13,235.92 283.70,230.84 288.27,225.91 292.84,221.15 297.41,216.56 301.98,212.16 306.55,207.97 311.12,203.99 315.69,200.23 320.26,196.71 324.83,193.44 329.40,190.42 333.97,187.66 338.54,185.17 343.11,182.95 347.68,181.02 352.25,179.38 356.82,178.03 361.39,176.98 365.96,176.22 370.53,175.77 375.10,175.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">inversa</text><circle cx="100.90322580645162" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">−aπ/2</text><circle cx="375.09677419354836" cy="175.61851332398317" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="167.61851332398317" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">aπ/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El dominio de f va de (−1−b)/a a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1−b)/a. Su rango es [−aπ/2,aπ/2].</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al despejar x de y/a=arcsen(ax+b),</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resulta f⁻¹(x)=[sen(x/a)−b]/a, con</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dominio [−aπ/2,aπ/2].</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La función crece, queda por debajo de</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y=0 porque b&gt;1 y su extremo derecho</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">satisface aπ/2&lt;π/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>