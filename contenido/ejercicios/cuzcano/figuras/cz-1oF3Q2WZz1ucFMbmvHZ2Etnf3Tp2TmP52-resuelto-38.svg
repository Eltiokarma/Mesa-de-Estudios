<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Máximo del producto con longitud total fija</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,293.83 375.10,293.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,290.43 107.18,297.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,290.43 238.00,297.23" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="368.82,290.43 368.82,297.23" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="107.18,267.67 238.00,267.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.18,264.53 107.18,270.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,264.53 238.00,270.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,267.67 368.82,267.67" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,264.53 238.00,270.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="368.82,264.53 368.82,270.81" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="107.18,241.51 368.82,241.51" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="107.18,238.37 107.18,244.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="368.82,238.37 368.82,244.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="107.18246737256834" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="238.0" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="368.81753262743166" y="305.867274070426" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="172.59123368628417" y="259.2962324550603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="303.40876631371583" y="259.2962324550603" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1997y</text><text x="238.0" y="233.132725929574" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">√1977</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De la suma de tramos, x+1997y=√1977.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con la suma fija, el producto de x y</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1997y es máximo cuando son iguales. En</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">efecto,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4x(1997y)=(x+1997y)²−(x−1997y)².</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el máximo, 4·1997·xy=1977. Si se</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">usa el √1997 que figura en el dibujo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">original, el máximo cambia a 1/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>