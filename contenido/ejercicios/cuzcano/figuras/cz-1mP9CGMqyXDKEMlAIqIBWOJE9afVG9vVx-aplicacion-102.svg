 102.73,273.58 102.08,272.31 101.57,270.98 101.20,269.61 100.98,268.20 100.90,266.78 100.98,265.36 101.20,263.95 101.57,262.57 102.08,261.24 102.73,259.97 103.50,258.78 104.40,257.67 105.41,256.67 106.51,255.77 107.71,254.99 108.98,254.35 110.31,253.84 111.68,253.47 113.09,253.25 114.51,253.17 115.93,253.25 117.34,253.47 118.72,253.84 120.05,254.35 121.31,254.99 122.51,255.77 123.62,256.67 124.62,257.67 125.52,258.78 126.30,259.97 126.94,261.24 127.45,262.57 127.82,263.95 128.04,265.36 128.12,266.78" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="353.32,302.84 353.32,329.37" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="329.51124629792685" y="210.30685183702872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 Ω</text><text x="248.54590570719603" y="284.4683822940847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8 Ω</text><text x="375.09677419354836" y="284.4683822940847" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8 Ω</text><text x="114.5108460738013" y="268.13923797326504" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">∼</text><text x="372.37525014007844" y="318.48743296245897" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I₀</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos ramas tienen corrientes</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iguales porque tienen la misma tensión</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y resistencia.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La corriente de la fuente es 2I₀(t)=8</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen(6t) A. La resistencia total es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5+8/2=9 Ω.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica la corriente total</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">instantánea por la resistencia total.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>