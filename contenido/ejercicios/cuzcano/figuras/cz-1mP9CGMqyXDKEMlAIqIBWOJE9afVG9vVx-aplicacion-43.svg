<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">043 · Circuito parcialmente dentro de un solenoide</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="135.54,211.78 135.54,247.56" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="135.54,256.80 135.54,287.97" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="135.54,287.97 127.46,292.59 144.20,297.21 127.46,301.83 144.20,306.44 135.54,311.06 135.54,327.22 352.01,327.22 352.01,211.78 135.54,211.78" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="122.84,248.14 148.24,248.14" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="128.03,256.22 143.62,256.22" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="349.70,272.96 227.90,272.96" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.29,268.63 227.90,272.96 238.29,277.29" fill="none" stroke="#008674" stroke-width="2.5"/><text x="259.6468590831919" y="203.6935483870968" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="360.6655348047538" y="207.73429541595925" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="360.6655348047538" y="332.4202037351443" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="259.6468590831919" y="335.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="104.36672325976232" y="297.7852292020374" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 Ω</text><text x="100.90322580645162" y="251.60526315789474" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 V</text><text x="375.0967741935484" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,20 m</text><text x="282.1595925297114" y="259.6867572156197" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la ley de Ohm, la corriente es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">20/4=5 A.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ME y NU tienen producto vectorial nulo</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">porque son paralelos al campo. Solo EN</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aporta a la resultante.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica ILB en EN y aplica la regla</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la mano derecha para una corriente</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia abajo y un campo hacia la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>