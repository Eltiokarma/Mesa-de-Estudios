<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Óxido de calcio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="100.90322580645159" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Ca²⁺</text><text x="346.23429541595925" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">[ O ]²⁻</text><text x="326.03056027164683" y="216.1044142614601" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">••</text><text x="326.03056027164683" y="322.8955857385399" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">••</text><text x="278.4074702886247" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">:</text><text x="375.09677419354836" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">:</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El Ca cede dos electrones de valencia</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y el O los incorpora.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los 6 electrones de valencia iniciales</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del O pasan a 8. Las cargas +2 y −2 se</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">compensan.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Eso coincide con la representación de</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la opción E.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>