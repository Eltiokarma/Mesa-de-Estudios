<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">091 · Ángulo entre una diagonal y un lado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="113.69,337.45 220.01,231.13 220.01,337.45 113.69,337.45 365.26,192.20 220.01,231.13 220.01,337.45 365.26,192.20" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="348.6404119251387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="215.21715414276312" y="215.94032728298697" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="220.01354274428667" y="353.4368005266623" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="185.56319947333776" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="157.6604909244804" y="326.2572651180288" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="138.47493651838616" y="315.86508981472775" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="332.72867488009035" y="203.94935577917803" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15°</text><text x="332.72867488009035" y="219.13791968400267" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma AC = 1 y A = (0,0). La recta AE</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se inclina 30° y la recta CE, 45°. De</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y = x/√3 y y = x − 1 sale xE = (3 +</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√3)/2.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta BE se inclina 15°. Por tanto</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y B = y E − (xE − 1) tan 15°. Como y E</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= xE − 1, resulta y B = 1.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta AB se inclina 45°. Resta los</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">30° de AE para obtener 15°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>