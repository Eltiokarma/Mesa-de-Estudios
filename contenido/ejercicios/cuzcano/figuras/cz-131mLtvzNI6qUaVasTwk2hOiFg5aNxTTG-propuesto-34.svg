<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Ángulo de dispersión de bolas no idénticas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="311.83870967741933" x2="421" y2="311.83870967741933" stroke="#20364b" stroke-width="1.7"/><line x1="153.32258064516128" y1="105" x2="153.32258064516128" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">componente x; unidades en leyenda</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">componente y</text><polyline points="153.32,311.84 322.68,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">ejemplo v1</text><line x1="322.6774193548388" y1="396.51612903225805" x2="312.68694341151786" y2="396.07979151848417" stroke="#1766b0" stroke-width="2"/><line x1="322.6774193548388" y1="396.51612903225805" x2="316.3340637778271" y2="388.78555078586567" stroke="#1766b0" stroke-width="2"/><polyline points="153.32,311.84 322.68,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">ejemplo v2</text><line x1="322.6774193548388" y1="142.48387096774195" x2="319.1042073542073" y2="151.82368659753587" stroke="#d37618" stroke-width="2"/><line x1="322.6774193548388" y1="142.48387096774195" x2="313.33760372504486" y2="146.05708296837346" stroke="#d37618" stroke-width="2"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Momento: m1u=m1v1+m2v2.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Combinar con energía da</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2m1(v1·v2)=(m1−m2)v2².</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La perpendicularidad sólo se deduce</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuando m1=m2. Con masas diferentes no</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se determina un ángulo único.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>