<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">024 · Distancia de una recta a una arista del cubo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,207.10 290.00,207.10 375.10,142.80 186.00,142.80 100.90,207.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,207.10 100.90,396.20 290.00,396.20 290.00,207.10 375.10,142.80 375.10,331.90 290.00,396.20" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="290.00,207.10 192.30,374.77" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="231.38,307.70 375.10,256.26" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,396.20 186.00,331.90 186.00,142.80" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="186.00,331.90 375.10,331.90" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="192.30,374.77 290.00,396.20" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="100.9032258064516" y="396.1963292547275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="290.0022246941046" y="396.1963292547275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="375.0967741935484" y="331.9026696329255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="185.99777530589543" y="331.9026696329255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="100.9032258064516" y="207.09733036707456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="290.0022246941046" y="207.09733036707456" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="142.80367074527248" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="185.99777530589543" y="142.80367074527248" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="192.3010752688172" y="374.7651093807935" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="231.38153503893213" y="307.6979977753059" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="375.0967741935484" y="256.2630700778643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="299.6462736373749" y="283.2664071190211" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">d</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Proyecta sobre la base. BP se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">convierte en FP y CG en G. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a FP desde G da la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia común.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En unidades de a toma F=(1,0), G=(1,1)</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y P=(1/3,1/3). La dirección FP es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proporcional a (−2,1) y una normal a</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1,2).</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta FP es x+2y=1. Sustituye G en</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la fórmula de distancia punto–recta y</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">multiplica por a.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>