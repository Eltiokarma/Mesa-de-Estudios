<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">032 · Cota de seis distancias interiores</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="143.84,181.23 268.13,147.92 359.13,238.91 325.82,363.21 201.52,396.52 110.53,305.52 143.84,181.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="143.84,181.23 242.08,281.28" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="268.13,147.92 242.08,281.28" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="359.13,238.91 242.08,281.28" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="325.82,363.21 242.08,281.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="201.52,396.52 242.08,281.28" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.53,305.52 242.08,281.28" fill="none" stroke="#008674" stroke-width="2.5"/><text x="150.17966694309206" y="175.78928312777495" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="274.47715729135757" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="365.46923547959005" y="233.4759491559745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="332.1638233195571" y="357.77343950424006" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="207.86633297129154" y="391.07885166427303" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="116.87425478305906" y="300.08677347604055" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="247.5152353939737" y="286.7180449986191" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para dos vértices consecutivos A,B, el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">camino por los otros cinco lados tiene</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud 80−AB.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En cualquier vértice, la suma de las</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancias a A y B es a lo sumo la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud de ese camino, por</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desigualdad triangular. La función</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia a A más distancia a B es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma la cota para las seis parejas</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">consecutivas. Cada distancia aparece</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos veces y cada lado cinco. La suma</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es menor que 5·80/2. Las otras</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opciones son alcanzables: en un</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>