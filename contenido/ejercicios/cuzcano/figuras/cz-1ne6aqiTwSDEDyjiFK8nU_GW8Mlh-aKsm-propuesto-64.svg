<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">064 · Rango de una tangente más cosecante en el segundo cuadrante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="323.18333274405956" x2="421" y2="323.18333274405956" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="320.26,396.52 321.17,391.40 322.09,386.39 323.00,381.49 323.91,376.68 324.83,371.96 325.74,367.32 326.66,362.77 327.57,358.28 328.48,353.87 329.40,349.52 330.31,345.24 331.23,341.01 332.14,336.83 333.05,332.70 333.97,328.61 334.88,324.57 335.80,320.57 336.71,316.60 337.62,312.66 338.54,308.75 339.45,304.86 340.37,301.00 341.28,297.16 342.19,293.33 343.11,289.52 344.02,285.72 344.94,281.93 345.85,278.14 346.76,274.36 347.68,270.57 348.59,266.79 349.51,262.99 350.42,259.20 351.33,255.39 352.25,251.56 353.16,247.73 354.08,243.87 354.99,239.99 355.90,236.09 356.82,232.16 357.73,228.20 358.65,224.21 359.56,220.18 360.47,216.11 361.39,212.00 362.30,207.84 363.22,203.63 364.13,199.37 365.04,195.05 365.96,190.68 366.87,186.23 367.78,181.71 368.70,177.13 369.61,172.46 370.53,167.70 371.44,162.86 372.35,157.93 373.27,152.89 374.18,147.74 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente crece en el tramo y el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">seno decrece sin cambiar de signo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cosecante también crece allí, así</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que la suma es creciente y continua.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Evalúa sus límites en 2π/3 y 5π/6,</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ambos excluidos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>