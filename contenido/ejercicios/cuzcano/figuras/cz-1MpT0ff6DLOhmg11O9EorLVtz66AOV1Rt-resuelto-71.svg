7" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">Círculo</text><polyline points="270.28,164.69 218.02,269.50 322.84,321.76" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Radios</text><polyline points="270.28,164.69 375.10,216.94 322.84,321.76" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">Tangentes</text><polyline points="218.02,269.50 375.10,216.94" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">Bisectriz CV</text><circle cx="218.02328905996987" cy="269.5" r="3.7" fill="#20364b"/><text x="225.02328905996987" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="270.28200515497224" cy="164.68523096142383" r="3.7" fill="#20364b"/><text x="277.28200515497224" y="156.68523096142383" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="322.83805809854607" cy="321.75871609500234" r="3.7" fill="#20364b"/><text x="329.83805809854607" y="313.75871609500234" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><circle cx="375.0967741935484" cy="216.94394705642617" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="208.94394705642617" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">V</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro es C=(√5,√5). Los radios a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los contactos son perpendiculares</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre sí porque las tangentes lo son.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta CV biseca el ángulo entre los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos radios. Su dirección es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−26,5°+45°=18,5°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pasa por C con pendiente tan(18,5°).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>