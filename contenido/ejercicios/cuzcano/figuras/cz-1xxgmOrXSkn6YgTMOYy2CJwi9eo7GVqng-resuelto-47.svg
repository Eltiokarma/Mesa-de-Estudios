ts="225.67,343.19 375.10,343.19" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="249.34,226.20 358.16,276.95 291.92,343.19" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="352.20358739359006" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="100.90322580645162" y="243.2864979530057" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="227.7527977252081" y="237.74116147568301" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="222.20746124788542" y="352.89675445325537" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="140.97984486026627" y="215.83585139967735" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="156.22952017290368" y="242.86936672662543" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4x</text><text x="338.75147985057464" y="279.7216533691061" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N y C ven UP bajo ángulos rectos, así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que U,N,C,P son concíclicos y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠PUC=∠PNC=4x.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el rectángulo RUCP, los ángulos PUC</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y PRC son iguales por las pendientes</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de sus diagonales. Por tanto ∠PRC=4x.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El arco entre contactos mide 14x. Su</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo exterior entre tangentes mide</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°−14x. Iguala a 4x.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>