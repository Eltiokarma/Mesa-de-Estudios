<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">073 · Área y cruce de un arco con una recta</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,345.71 105.47,328.96 110.04,321.96 114.61,316.53 119.18,311.92 123.75,307.82 128.32,304.08 132.89,300.61 137.46,297.35 142.03,294.26 146.60,291.30 151.17,288.46 155.74,285.72 160.31,283.07 164.88,280.49 169.45,277.97 174.02,275.50 178.59,273.09 183.16,270.72 187.73,268.38 192.30,266.08 196.87,263.81 201.44,261.56 206.01,259.33 210.58,257.12 215.15,254.93 219.72,252.75 224.29,250.58 228.86,248.41 233.43,246.25 238.00,244.10 242.57,241.94 247.14,239.78 251.71,237.62 256.28,235.45 260.85,233.26 265.42,231.07 269.99,228.86 274.56,226.64 279.13,224.39 283.70,222.11 288.27,219.81 292.84,217.48 297.41,215.10 301.98,212.69 306.55,210.23 311.12,207.71 315.69,205.12 320.26,202.47 324.83,199.73 329.40,196.89 333.97,193.94 338.54,190.84 343.11,187.58 347.68,184.11 352.25,180.37 356.82,176.27 361.39,171.66 365.96,166.24 370.53,159.23 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">arcsen</text><polyline points="100.90,345.71 238.00,396.52 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">bordes</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los extremos son (−1,a−π/2) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1,a+π/2). La diferencia entre el arco</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y su cuerda es impar, por lo que el</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área firmada entre arco y segmentos al</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">origen vale a.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En [0,1], la diferencia vertical</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">g(x)=a+arcsen x−(a+π/2)x es positiva</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en 0, pero negativa cerca de 1 porque</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la derivada del arco crece sin límite.</text><text x="482" y="315" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay un cruce interior r, además del</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si el sombreado abarca solo la región</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contigua al origen, su área es a+L y</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la solución numérica da a≈2,344785. Si</text><text x="482" y="422" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abarca ambos lóbulos, el área es a+2L</text><text x="482" y="445" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y da a≈2,333167. Con área firmada se</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>