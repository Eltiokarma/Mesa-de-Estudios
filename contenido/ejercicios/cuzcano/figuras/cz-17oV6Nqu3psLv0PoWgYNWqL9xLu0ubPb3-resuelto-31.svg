<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Áreas posibles de un rombo con una diagonal igual al lado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,333.01 365.02,333.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="174.49,396.52 174.49,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="174.49,333.01 201.33,232.83 301.51,205.99 274.67,306.17 174.49,333.01" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="174.49,333.01 128.00,159.50 301.51,205.99 348.00,379.50 174.49,333.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="126.86,158.36 349.14,380.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="174.49,333.01 301.51,205.99" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="245.93850806451613" y="266.32459677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Centro</text><text x="160.20262096774195" y="345.7096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro es (2,2), así que la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diagonal en x=y mide d₁=4√2. Denota la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">otra por d₂.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La longitud de un lado es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(d₁²+d₂²)/2. Si ese lado es d₁,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entonces d₂=√3 d₁. Si es d₂, entonces</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">d₂=d₁/√3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Calcula d₁d₂/2 en los dos casos. Las</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diagonales perpendiculares con esas</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitudes producen rombos válidos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>