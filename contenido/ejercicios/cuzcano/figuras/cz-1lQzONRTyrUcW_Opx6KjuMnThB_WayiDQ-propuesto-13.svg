<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">013 · Aristas a partir de los ángulos de todas las caras</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="375.10,343.99 340.32,301.23 242.86,152.25" fill="#f4c581" fill-opacity="0.45"/><polygon points="340.32,301.23 170.86,317.56 242.86,152.25" fill="#f4c581" fill-opacity="0.45"/><polyline points="375.10,343.99 340.32,301.23 170.86,317.56 100.90,370.42 227.13,386.75 375.10,343.99" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,343.99 242.86,152.25" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="340.32,301.23 242.86,152.25" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="170.86,317.56 242.86,152.25" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,370.42 242.86,152.25" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="227.13,386.75 242.86,152.25" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="375.09677419354836" y="343.991102359009" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="340.31776684081393" y="301.23144949396936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="170.8568344416492" y="317.56418354126765" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="100.90322580645162" y="370.4180211767503" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="227.13045043335606" y="386.75075522404865" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="242.86101034316383" y="152.24924477595135" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si una cara tiene n lados, aporta</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180°(n−2). En la suma, cada arista se</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuenta dos veces, de modo que el total</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 360°(E−F).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Euler, E−F=V−2. Así 1440=360(V−2)</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y V=6.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con F=6, Euler da E=V+F−2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>