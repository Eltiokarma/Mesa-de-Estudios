<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Tres cationes de magnesio y dos nitruros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="203.31,181.96 183.49,181.96 183.49,360.35 203.31,360.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="312.33,181.96 332.15,181.96 332.15,360.35 312.33,360.35" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645164" y="271.1517683637777" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 Mg²⁺</text><text x="259.47298872910994" y="271.1517683637777" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="351.97201710066065" y="178.65273999222697" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3−</text><text x="375.09677419354836" y="274.4553050913331" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">× 2</text><text x="239.65176836377768" y="228.2057909055577" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="275.9906723668869" y="228.2057909055577" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="239.65176836377768" y="317.40128254955306" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="275.9906723668869" y="317.40128254955306" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="219.8305479984454" y="254.63408472600076" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="219.8305479984454" y="287.66945200155465" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="299.11542945977453" y="254.63408472600076" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="299.11542945977453" y="287.66945200155465" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">•</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Mg, del grupo 2, forma Mg²⁺. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">nitruro se representa como N³⁻ con</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuatro pares de electrones.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El mínimo común múltiplo de las</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">magnitudes de las cargas es 6.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se necesitan tres Mg²⁺ y dos N³⁻ por</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">unidad fórmula. Encierra cada nitruro</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con su carga.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>