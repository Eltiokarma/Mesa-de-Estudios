<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Menor perímetro entero de un equilátero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="133.43,330.82 237.45,151.24 342.57,329.72 133.43,330.82 223.22,377.90 342.57,329.72" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="122.48102057842047" y="337.38793103448273" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="237.45251668520578" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="353.5189794215795" y="337.38793103448273" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="224.3129171301446" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="175.03941879866517" y="370.2369299221357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="286.7260150166852" y="370.2369299221357" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15</text><text x="236.35755005561734" y="322.0583982202447" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">AC</text><text x="230.8827169076752" y="356.00236373748606" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">∠D &gt; 90°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ley de cosenos en ADC da</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC²&gt;8²+15²=289. La desigualdad</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triangular da AC&lt;23.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El perímetro de ABC está entre 51 y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">69, con ambos extremos excluidos. El</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primer entero posible es 52.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para AC=52/3, el pie de D cae dentro</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de AC. Coloca D en el semiplano</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuesto a B para que BD atraviese el</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lado.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>