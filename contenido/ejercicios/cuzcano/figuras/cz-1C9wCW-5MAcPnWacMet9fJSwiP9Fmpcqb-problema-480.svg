<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">480 · Imagen aparente vista oblicuamente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="214.66129032258067" x2="421" y2="214.66129032258067" stroke="#20364b" stroke-width="1.7"/><line x1="128.32258064516128" y1="105" x2="128.32258064516128" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="100.90,214.66 375.10,214.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">agua</text><polyline points="128.32,390.15 259.94,214.66 347.68,148.85" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">rayo real</text><line x1="347.6774193548387" y1="148.85483870967738" x2="342.8192705506977" y2="157.5954559760278" stroke="#d37618" stroke-width="2"/><line x1="347.6774193548387" y1="148.85483870967738" x2="337.92614511398284" y2="151.0712887270747" stroke="#d37618" stroke-width="2"/><polyline points="128.32,313.37 259.94,214.66" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="73" y="498" font-family="Arial,sans-serif" font-size="12" fill="#008674" text-anchor="start">prolongación virtual</text><circle cx="128.32258064516128" cy="390.14516129032256" r="3.7" fill="#20364b"/><text x="135.32258064516128" y="382.14516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">fuente</text><circle cx="128.32258064516128" cy="313.3709677419355" r="3.7" fill="#20364b"/><text x="135.32258064516128" y="305.3709677419355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">imagen aparente</text><circle cx="347.6774193548387" cy="148.85483870967738" r="3.7" fill="#20364b"/><text x="354.6774193548387" y="140.85483870967738" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">ojo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Snell da sinθagua=(3/4)sin53°≈0,6:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tanθagua≈3/4.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desplazamiento horizontal bajo</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">agua=3,2·3/4=2,4 m. La profundidad</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aparente es2,4/tan53°=1,8 m.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre ojo e imagen hay1,2+1,8=3 m</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verticales; distancia=3/cos53°=5 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>