<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">037 · Posición tras cinco segundos en un campo axial</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,321.81 109.15,378.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="115.14,371.65 109.15,378.51 118.25,378.72" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,321.81 366.85,350.68" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="357.96,352.65 366.85,350.68 359.65,345.10" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,321.81 238.00,156.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="241.87,165.13 238.00,156.88 234.13,165.13" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="317.89,345.01 317.89,178.53" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="321.75,186.78 317.89,178.53 314.02,186.78" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="174.61,357.38 172.49,358.40 166.45,358.70 157.42,357.67 146.77,354.90 136.12,350.25 127.09,343.86 121.06,336.13 118.94,327.69 121.06,319.24 127.09,311.52 136.12,305.13 146.77,300.48 157.42,297.71 166.45,296.68 172.49,296.98 174.61,298.00 172.49,299.02 166.45,299.33 157.42,298.30 146.77,295.53 136.12,290.88 127.09,284.48 121.06,276.76 118.94,268.31 121.06,259.87 127.09,252.15 136.12,245.75 146.77,241.10 157.42,238.33 166.45,237.30 172.49,237.60 174.61,238.63 172.49,239.65 166.45,239.95 157.42,238.92 146.77,236.15 136.12,231.50 127.09,225.11 121.06,217.38 118.94,208.94" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="382.11520737327186" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="375.0967741935484" y="351.70652437545476" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="244.70021828765462" y="156.88479262672814" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z</text><text x="326.64904195973804" y="183.68566577734657" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="176.15183119088042" y="367.6839679844773" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A(3,0,0)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La componente z permanece constante,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">así que z=2×5=10 m. En el plano xy,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ω=∣q∣B/m=π rad/s y el radio es π/ω=1</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al inicio la fuerza magnética apunta</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia −x, de modo que el centro</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyectado está en (2,0). La partícula</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">gira desde el punto derecho en sentido</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">antihorario.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tras 5 s el ángulo barrido es 5π,</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">equivalente a media vuelta desde el</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inicio. En la proyección, x=2−1 y y=0.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>