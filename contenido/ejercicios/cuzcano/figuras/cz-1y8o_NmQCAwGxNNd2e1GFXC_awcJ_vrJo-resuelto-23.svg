<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">023 · Ángulo con tres segmentos iguales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="134.17,357.23 108.95,190.89 366.51,357.23 134.17,357.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="134.17,357.23 300.51,180.70 366.51,357.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="114.85,272.45 127.20,270.84" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="274.22,303.57 280.66,293.91" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="325.73,268.70 337.54,264.40" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645159" y="183.3785430212739" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="129.34208698945773" y="367.42626728110605" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="375.0967741935484" y="365.8165204216906" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="299.4386718010227" y="171.573732718894" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="229.14639227321507" y="261.71955684615875" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="345.58474843759865" y="345.9629758222335" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="147.04930244302756" y="333.08500094691" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="164.75651789659742" y="347.57272268164894" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Fija MR=1 y escribe a=AM=DR. Por la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisectriz MD, AD/DR=AM/MR, de modo que</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AR=a+a².</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ley de cosenos en R da</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a²=1+(a+a²)²−2(a+a²) cos 20°. Al</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">factorizar y dividir por a+1, resulta</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a³+a²−(1+2 cos 20°)a+1=0.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El polinomio tiene a lo sumo dos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">raíces positivas por la regla de los</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">signos. Hay cambios de signo en</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(0,4484, 0,4485) y (0,9353, 0,9354).</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con cos(2θ)=1/(2a)−a²−a³/2,</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>