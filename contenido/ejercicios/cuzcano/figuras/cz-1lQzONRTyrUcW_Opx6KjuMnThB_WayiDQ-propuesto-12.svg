<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">012 · Distancia entre diagonales de un cuadrado y un rectángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,348.92 290.00,348.92 375.10,284.63 186.00,284.63" fill="#f4c581" fill-opacity="0.45"/><polygon points="186.00,284.63 186.00,190.08 375.10,190.08 375.10,284.63" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,348.92 290.00,348.92 375.10,284.63 186.00,284.63 100.90,348.92" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="186.00,284.63 186.00,190.08 375.10,190.08 375.10,284.63 186.00,284.63" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,348.92 375.10,284.63" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="290.00,348.92 186.00,190.08" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,316.77 243.78,278.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.9032258064516" y="348.92157953281423" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="290.0022246941046" y="348.92157953281423" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="284.6279199110122" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="185.99777530589543" y="284.6279199110122" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="185.99777530589543" y="190.0784204671857" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="375.0967741935484" y="190.0784204671857" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="238.0" y="316.7747497219132" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="243.77802496601163" y="278.32461994809046" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con K=1, toma A=(0,0,0), C=(1,1,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=(1,0,0), E=(0,1,1/2). Las</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">direcciones son u=(1,1,0) y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">v=(−1,1,1/2).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El producto vectorial es (1/2,−1/2,2).</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Proyecta B−A=(1,0,0) sobre su</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dirección unitaria. Se obtiene</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1/2)/(3/√2).</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Recupera la escala K. Los parámetros</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de los pies sobre AC y BE son 1/2 y</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4/9, dentro de ambos segmentos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>