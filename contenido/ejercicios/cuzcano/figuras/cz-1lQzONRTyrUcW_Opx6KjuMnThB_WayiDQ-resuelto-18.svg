<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Razón de áreas de tetraedros regulares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,334.64 189.93,334.64 180.11,308.43 100.90,334.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,334.64 156.98,253.21 189.93,334.64" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="156.98,253.21 180.11,308.43" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="232.66,334.64 375.10,334.64 359.39,292.70 232.66,334.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="232.66,334.64 322.38,204.36 375.10,334.64" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="322.38,204.36 359.39,292.70" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="322.38,204.36 322.38,320.66" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="115.50314201927102" y="285.7839721563861" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h</text><text x="323.17804775869286" y="267.89373336292147" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2h: arista</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea a la arista del menor y b la del</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mayor. La altura regular vale a√(2/3).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala a√(2/3)=b/2. Por tanto</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b²/a²=8/3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los sólidos son semejantes y sus áreas</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">escalan con el cuadrado de la arista.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>