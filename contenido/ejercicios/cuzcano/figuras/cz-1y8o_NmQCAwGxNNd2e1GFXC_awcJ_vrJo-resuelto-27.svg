<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Razón de lados a partir de dos distancias</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.80,342.37 134.99,196.63 369.17,196.63 347.43,342.37 109.80,342.37" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.80,342.37 192.80,268.26 134.99,196.63" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="192.80,268.26 251.09,342.37" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="125.61,254.43 354.35,294.45" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="125.11,260.85 131.53,261.84 132.52,255.42" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="347.43,293.46 348.42,287.04 355.34,288.03" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645159" y="351.758064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="134.0040685847137" y="187.24193548387095" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="188.72406277244986" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="352.8648648648649" y="351.2640220866027" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="190.8189479802383" y="260.36021505376345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="156.23597791339725" y="257.89000290613194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">r</text><text x="270.85382156349897" y="280.12191223481545" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2r</text><text x="123.1351351351351" y="322.60956117407727" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="143.88491717523974" y="213.42618424876488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea r la distancia de P a AB. Por las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisectrices, las distancias a AD y BC</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también valen r.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La separación entre AD y BC es 2r, y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la separación entre AB y CD es 3r. Las</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisectrices interiores ponen a P entre</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AD y BC y del lado interior de AB. P</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tampoco puede rebasar CD porque su</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área es BC·2r=AB·3r, así que</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB/BC=2/3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>