<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">112 · Fricción estática al inclinar</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">θ (rad)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f/(mg)</text><polyline points="100.90,396.52 105.47,391.92 110.04,387.32 114.61,382.72 119.18,378.12 123.75,373.53 128.32,368.94 132.89,364.35 137.46,359.77 142.03,355.19 146.60,350.62 151.17,346.05 155.74,341.49 160.31,336.94 164.88,332.40 169.45,327.86 174.02,323.34 178.59,318.82 183.16,314.31 187.73,309.82 192.30,305.34 196.87,300.87 201.44,296.41 206.01,291.97 210.58,287.54 215.15,283.13 219.72,278.73 224.29,274.35 228.86,269.98 233.43,265.63 238.00,261.30 242.57,256.99 247.14,252.70 251.71,248.42 256.28,244.17 260.85,239.94 265.42,235.73 269.99,231.54 274.56,227.37 279.13,223.22 283.70,219.10 288.27,215.01 292.84,210.94 297.41,206.89 301.98,202.87 306.55,198.87 311.12,194.91 315.69,190.97 320.26,187.06 324.83,183.17 329.40,179.32 333.97,175.49 338.54,171.70 343.11,167.93 347.68,164.20 352.25,160.50 356.82,156.83 361.39,153.19 365.96,149.59 370.53,146.02 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">fricción estática</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El equilibrio tangencial da f=mg senθ.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para 0&lt;θ&lt;arctanμs, f aumenta y su</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">concavidad es negativa.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La curva parte del origen y se aplana</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">gradualmente; corresponde a E, sólo</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hasta perder el reposo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>