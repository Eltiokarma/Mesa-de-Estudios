7" y="164.4967736496034" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="194.0328784119107" cy="375.57220952461444" r="3.7" fill="#20364b"/><text x="201.0328784119107" y="367.57220952461444" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="311.27853598014883" cy="240.18858560794044" r="3.7" fill="#20364b"/><text x="318.27853598014883" y="232.18858560794044" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><circle cx="252.6557071960298" cy="274.03449158710896" r="3.7" fill="#20364b"/><text x="259.65570719602977" y="266.03449158710896" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El foco tiene abscisa 6 y el vértice</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">9. La parábola abre a la izquierda con</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4p=−12.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo da A=(0,4√3). Para x=0 se</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cumple (y−k)²=108, así que las</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ordenadas de los cortes son k±6√3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al exigir que el mayor corte sea 4√3 y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que el otro sea negativo, resulta</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k=−2√3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>