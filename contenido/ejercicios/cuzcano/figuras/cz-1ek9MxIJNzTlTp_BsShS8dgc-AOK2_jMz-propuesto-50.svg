26,147.13 306.55,142.48 308.83,147.18 311.12,151.93 313.40,156.74 315.69,161.61 317.97,166.55 320.26,171.57 322.54,176.66 324.83,181.84 327.11,187.12 329.40,192.49 331.68,197.97 333.97,203.57 336.25,209.29 338.54,215.16 340.82,221.19 343.11,227.40 345.39,233.79 347.68,240.41 349.96,247.28 352.25,254.44 354.53,261.93 356.82,269.81 359.10,278.17 361.39,287.10 363.67,296.78 365.96,307.44 368.24,319.48 370.53,333.71 372.81,352.17 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><circle cx="169.4516129032258" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="176.4516129032258" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">−π/2</text><circle cx="306.5483870967742" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="313.5483870967742" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">π/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cúbico 3x−4x³ vale −1 en x=1 y 1 en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=−1. Fuera de [−1,1] su módulo excede</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1. Dentro de ese intervalo, escribe</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=sen t y el cúbico es sen 3t.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus puntos de giro son x=±1/2, donde</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el cúbico vale ±1. Como el arcoseno</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">crece, conserva la monotonía del</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cúbico en los tres tramos.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La curva es impar, decrece hasta</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(−1/2,−π/2), sube pasando por el</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">origen hasta (1/2,π/2) y luego</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">decrece.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>