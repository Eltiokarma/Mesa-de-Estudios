<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Pistón para elevar tres toneladas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,197.97 100.90,355.93 375.10,355.93 375.10,197.97" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="136.67,197.97 136.67,311.23 238.00,311.23 238.00,197.97" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,251.62 375.10,251.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="261.84,217.05 351.25,217.05 351.25,251.62 261.84,251.62 261.84,217.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="118.18934081346421" y="183.0694249649369" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">800 kPa</text><text x="305.9523141654979" y="234.33169705469845" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3000 kg</text><text x="305.9523141654979" y="279.0371669004208" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Pistón mayor</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para iniciar la elevación, la fuerza</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hidráulica debe igualar 3000×10 = 30</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">000 N.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con presión de 800 000 Pa, el área</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">necesaria es 0,0375 m².</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como A = πd²/4, el diámetro es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(4A/π). Convierte a centímetros.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>