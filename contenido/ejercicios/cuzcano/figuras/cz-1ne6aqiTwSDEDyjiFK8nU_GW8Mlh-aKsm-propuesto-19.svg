<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">019 · Valor absoluto de arco coseno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="100.90,142.48 105.47,184.36 110.04,201.87 114.61,215.42 119.18,226.95 123.75,237.20 128.32,246.55 132.89,255.23 137.46,263.38 142.03,271.12 146.60,278.50 151.17,285.60 155.74,292.45 160.31,299.09 164.88,305.54 169.45,311.84 174.02,318.00 178.59,324.03 183.16,329.96 187.73,335.80 192.30,341.56 196.87,347.24 201.44,352.86 206.01,358.43 210.58,363.95 215.15,369.44 219.72,374.89 224.29,380.32 228.86,385.73 233.43,391.12 238.00,396.52 242.57,391.12 247.14,385.73 251.71,380.32 256.28,374.89 260.85,369.44 265.42,363.95 269.99,358.43 274.56,352.86 279.13,347.24 283.70,341.56 288.27,335.80 292.84,329.96 297.41,324.03 301.98,318.00 306.55,311.84 311.12,305.54 315.69,299.09 320.26,292.45 324.83,285.60 329.40,278.50 333.97,271.12 338.54,263.38 343.11,255.23 347.68,246.55 352.25,237.20 356.82,226.95 361.39,215.42 365.96,201.87 370.53,184.36 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En [−1,0] se tiene arccos x≥π/2. Allí</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f(x)=arccos x−π/2, que decrece.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En [0,1], f(x)=π/2−arccos x, que crece</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 0 a π/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos ramas dan el mismo rango y la</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">función cambia de monotonía en 0.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>