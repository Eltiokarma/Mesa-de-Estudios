<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Fuerza por metro en dos hilos paralelos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="157.21,142.48 157.21,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="317.99,142.48 317.99,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="157.21,345.07 317.99,345.07" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="137.91,290.40 137.91,215.64" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="143.94,230.11 137.91,215.64 131.89,230.11" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="337.28,290.40 337.28,215.64" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="343.31,230.11 337.28,215.64 331.25,230.11" fill="none" stroke="#008674" stroke-width="2.5"/><text x="113.7975193956717" y="248.598611678236" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 A</text><text x="362.20248060432834" y="248.598611678236" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 A</text><text x="237.59805022458147" y="360.3406492445896" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El primer conductor produce en el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segundo un campo de módulo μ₀I₁/(2πd).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza por unidad de longitud sobre</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el segundo es I₂B. La misma magnitud</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">actúa sobre el primero.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye d=0,20 m. Como las</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corrientes son paralelas y del mismo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sentido, la fuerza es de atracción.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>