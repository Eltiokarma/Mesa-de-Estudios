<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Pares de puntos en tres planos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,176.02 100.90,362.98 375.10,362.98 238.00,176.02" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,176.02 238.00,300.66 100.90,362.98" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,300.66 375.10,362.98" fill="none" stroke="#008674" stroke-width="2.5"/><text x="183.92961876832845" y="273.96334310850443" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B: 8</text><text x="281.14369501466274" y="273.96334310850443" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A: 10</text><text x="218.82697947214078" y="341.26539589442814" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C: 12</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Un segmento queda fijado por dos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puntos. Dentro de cada plano hay</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C(10,2), C(8,2) y C(12,2) opciones.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los conteos son 45,28 y 66.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En total 139. Si se permiten pares de</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cualesquiera de los 30 puntos, son</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C(30,2)=435.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>