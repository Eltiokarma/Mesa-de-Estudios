<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">037 · Tangente de la bisectriz de un ángulo de referencia</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="170.21,269.50 305.79,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="256.90,396.52 256.90,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="234.22,370.31 256.90,269.50 279.58,168.69" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="256.90,269.50 196.42,317.89" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="244.80,269.50 244.81,269.77 244.82,270.04 244.83,270.32 244.85,270.59 244.88,270.86 244.91,271.13 244.95,271.40 245.00,271.66 245.05,271.93 245.11,272.20 245.17,272.46 245.24,272.73 245.32,272.99 245.40,273.25 245.49,273.50 245.58,273.76 245.68,274.01 245.78,274.26 245.89,274.51 246.01,274.76 246.13,275.00 246.26,275.24 246.39,275.48 246.52,275.72 246.67,275.95 246.81,276.18 246.97,276.40 247.12,276.62 247.29,276.84 247.46,277.06" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="256.9012096774194" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="305.7923387096774" y="274.5403225806451" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="263.95766129032256" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="243.4939516129032" y="275.3467741935484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo de referencia δ tiene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">catetos 9 y 40 e hipotenusa 41.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como α está en el tercer cuadrante,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan α=tan(δ/2). Usa sen δ/(1+cos δ).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye (40/41)/(1+9/41)=40/50.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>