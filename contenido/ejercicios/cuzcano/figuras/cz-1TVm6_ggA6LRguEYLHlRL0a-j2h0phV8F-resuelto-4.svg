<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">004 · Razón de dos ángulos contiguos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="109.69,329.65 207.34,205.44 207.34,329.65" fill="#f4c581" fill-opacity="0.45"/><polygon points="207.34,329.65 267.69,252.89 365.33,329.65" fill="#f4c581" fill-opacity="0.45"/><polyline points="109.69,329.65 207.34,205.44 267.69,252.89 365.33,329.65 109.69,329.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="207.34,205.44 207.34,329.65 267.69,252.89 109.69,329.65" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645159" y="341.3684838952892" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="201.47870173380662" y="342.34494482662274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="204.40808452780726" y="196.65505517337724" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="271.5919154721928" y="243.12173275653507" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.0967741935484" y="341.3684838952892" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="138.98520212845978" y="304.26296850461455" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="148.74981144179523" y="321.83926526861836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las hipotenusas son AB y HC. En la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posición del dibujo, el cateto AH</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corresponde a HD. El emparejamiento</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alternativo BH=HD haría al triángulo</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BHD isósceles. Entonces, con α=∠BAH,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AH=HD hace isósceles a AHD. Como sus</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos en A y D son y, el ángulo</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior DHC vale 2y.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por congruencia, ∠BAH=∠DHC. Así x+y=2y</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y x=y.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>