,217.47 255.77,220.78 258.31,224.01 260.85,227.16 263.39,230.24 265.93,233.26 268.47,236.22 271.00,239.14 273.54,242.02 276.08,244.86 278.62,247.67 281.16,250.46 283.70,253.22 286.24,255.96 288.78,258.69 291.32,261.40 293.85,264.11 296.39,266.80 298.93,269.50 301.47,272.20 304.01,274.89 306.55,277.60 309.09,280.31 311.63,283.04 314.16,285.78 316.70,288.54 319.24,291.33 321.78,294.14 324.32,296.98 326.86,299.86 329.40,302.78 331.94,305.74 334.48,308.76 337.01,311.84 339.55,314.99 342.09,318.22 344.63,321.53 347.17,324.96 349.71,328.51 352.25,332.20 354.79,336.07 357.32,340.14 359.86,344.48 362.40,349.16 364.94,354.28 367.48,360.05 370.02,366.82 372.56,375.58 375.10,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">−π/2 + arccos(x−1,6)</text><circle cx="238.0" cy="194.5180007098605" r="3.7" fill="#20364b"/><text x="245.0" y="186.5180007098605" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">x=0,8</text><circle cx="177.06810035842292" cy="269.5" r="3.7" fill="#20364b"/><text x="184.06810035842292" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La segunda curva es decreciente y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arccos decrece, así que b&gt;0. Su rango</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[a,a+bπ] coincide con [−π/2,π/2]. De</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ahí a=−π/2 y b=1.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x=0,8, arccos(0,8−c)=arcsen(0,8)+π/</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2=arccos(−0,8).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El arcocoseno es inyectivo. Así</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,8−c=−0,8, luego c=1,6. Multiplica</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los coeficientes.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>