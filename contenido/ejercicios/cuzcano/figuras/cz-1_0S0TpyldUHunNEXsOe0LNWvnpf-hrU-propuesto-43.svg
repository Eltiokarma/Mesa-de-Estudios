<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">043 · Trayectoria de una esfera que entra en un líquido</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,196.38 174.02,292.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="174.02,292.35 375.10,292.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="134.72,213.29 134.66,214.53 134.46,215.76 134.14,216.96 133.69,218.12 133.13,219.23 132.45,220.27 131.67,221.24 130.79,222.12 129.82,222.90 128.78,223.58 127.67,224.14 126.51,224.59 125.31,224.91 124.08,225.11 122.84,225.17 121.60,225.11 120.37,224.91 119.17,224.59 118.01,224.14 116.90,223.58 115.85,222.90 114.89,222.12 114.01,221.24 113.23,220.27 112.55,219.23 111.98,218.12 111.54,216.96 111.22,215.76 111.02,214.53 110.96,213.29 111.02,212.05 111.22,210.82 111.54,209.62 111.98,208.46 112.55,207.35 113.23,206.31 114.01,205.34 114.89,204.46 115.85,203.68 116.90,203.00 118.01,202.44 119.17,201.99 120.37,201.67 121.60,201.47 122.84,201.41 124.08,201.47 125.31,201.67 126.51,201.99 127.67,202.44 128.78,203.00 129.82,203.68 130.79,204.46 131.67,205.34 132.45,206.31 133.13,207.35 133.69,208.46 134.14,209.62 134.46,210.82 134.66,212.05 134.72,213.29" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="119.18,226.09 119.18,292.35" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="174.02,292.35 179.05,297.25 184.08,301.90 189.10,306.30 194.13,310.45 199.16,314.34 204.18,317.99 209.21,321.38 214.24,324.52 219.26,327.41 224.29,330.05 229.32,332.44 234.34,334.58 239.37,336.46 244.40,338.09 249.42,339.48 254.45,340.61 259.48,341.49 264.51,342.12 269.53,342.49 274.56,342.62 279.59,342.49 284.61,342.12 289.64,341.49 294.67,340.61 299.69,339.48 304.72,338.09 309.75,336.46 314.77,334.58 319.80,332.44 324.83,330.05 329.85,327.41 334.88,324.52 339.91,321.38 344.94,317.99 349.96,314.34 354.99,310.45 360.02,306.30 365.04,301.90 370.07,297.25 375.10,292.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="110.5" y="213.74731182795696" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="176.30645161290323" y="282.752688172043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="135.17741935483872" y="258.0752688172043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1,25 m</text><text x="154.3709677419355" y="287.7795698924731" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">53°</text><text x="320.258064516129" y="326.6236559139785" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Trayectoria</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la rampa lisa, la pérdida de altura</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 1,25 m da rapidez √(2g×1,25) = 5</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m/s al llegar a B.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con el triángulo 3-4-5, sus</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componentes iniciales dentro del</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">líquido son 3 m/s horizontal y 4 m/s</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia abajo. El empuje menos el peso</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">produce aceleración g/2 hacia arriba.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al volver a la misma cota, el tiempo</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es 2×4/5 = 1,6 s. Multiplica por 3</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>