<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">045 · Dos refracciones con superficies paralelas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,240.16 375.10,240.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,295.00 375.10,295.00" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="117.35,173.81 238.00,240.16 286.81,295.00 315.32,365.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,211.10 238.00,269.23" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="286.81,265.94 286.81,324.06" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="224.83870967741936" y="225.90322580645164" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="293.38709677419354" y="323.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="325.741935483871" y="207.25806451612902" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n₁</text><text x="325.741935483871" y="267.5806451612903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n₂</text><text x="328.48387096774195" y="333.38709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n₃</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al aplicar Snell en ambas fronteras,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se conserva n sen i. Así n₁ sen 2θ=n₃</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen θ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye n₃=1,6n₁ y usa sen 2θ=2 sen</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ cos θ. La trayectoria oblicua</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">permite dividir por sen θ.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se obtiene cos θ=0,8 y θ=arccos(0,8).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>