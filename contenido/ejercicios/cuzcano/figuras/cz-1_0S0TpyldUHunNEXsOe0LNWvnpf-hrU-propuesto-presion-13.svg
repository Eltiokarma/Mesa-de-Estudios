<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">013 · Dos cilindros y un cono comunicantes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="117.52,219.23 117.52,327.25 341.86,327.25 341.86,304.40 375.10,229.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="159.07,219.23 159.07,312.71 211.00,312.71 211.00,227.54" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="240.08,227.54 240.08,312.71 330.64,312.71 330.64,304.40 296.16,229.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="117.52,246.24 159.07,246.24" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="117.52,271.16 159.07,271.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="211.00,271.16 240.08,271.16" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="315.27,271.16 357.23,271.16" fill="none" stroke="#008674" stroke-width="2.5"/><text x="138.29325513196483" y="211.7531769305963" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B: A</text><text x="225.5366568914956" y="221.30840664711633" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C: A/2</text><text x="333.5522971652004" y="221.30840664711633" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D: A</text><text x="100.90322580645163" y="246.23509286412514" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">22 cm</text><text x="373.01955034213097" y="271.1617790811339" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">h₂</text><text x="182.3304007820137" y="304.8128054740958" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El volumen inicial de agua es A×22 cm.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al abrir la llave, los cilindros</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contienen Ah₂ y (A/2)h₂. El cono</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">contiene Ah₂/3 con el área indicada a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la altura final.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala la suma (11/6)Ah₂ al volumen</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inicial y despeja.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>