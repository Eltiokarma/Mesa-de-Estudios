<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Área triangular con un extremo excluido</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="338.0483870967742" x2="421" y2="338.0483870967742" stroke="#20364b" stroke-width="1.7"/><line x1="306.5483870967742" y1="105" x2="306.5483870967742" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polygon points="100.90,338.05 238.00,200.95 375.10,338.05" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,338.05 238.00,200.95 375.10,338.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F</text><circle cx="100.90322580645162" cy="338.0483870967742" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="330.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−3,0)</text><circle cx="238.0" cy="200.9516129032258" r="3.7" fill="#20364b"/><text x="245.0" y="192.9516129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−1,2)</text><circle cx="375.0967741935484" cy="338.0483870967742" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="382.0967741935484" y="330.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ese intervalo ∣x+1∣≤2. Por ello</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F(x)=2−∣x+1∣.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La gráfica sube de (−3,0) a (−1,2) y</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">luego baja hacia (1,0). El extremo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecho queda abierto.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área coincide con la del triángulo</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de base 4 y altura 2. El punto</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">excluido tiene área cero.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>