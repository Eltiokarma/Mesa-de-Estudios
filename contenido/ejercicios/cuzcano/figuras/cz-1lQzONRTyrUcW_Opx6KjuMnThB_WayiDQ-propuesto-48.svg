<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">048 · Longitud de un segmento desde un punto elevado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="132.74,396.52 248.42,363.74 333.57,396.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="132.74,396.52 248.42,363.74 333.57,396.52 132.74,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="132.74,396.52 132.74,142.48 333.57,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="132.74,142.48 248.42,363.74" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="333.57,396.52 335.45,395.03 337.13,393.54 338.61,392.06 339.89,390.59 340.97,389.13 341.84,387.68 342.51,386.25 342.97,384.84 343.22,383.45 343.26,382.09 343.09,380.75 342.71,379.45 342.12,378.17 341.33,376.93 340.33,375.73 339.12,374.57 337.72,373.45 336.11,372.37 334.31,371.34 332.32,370.36 330.13,369.43 327.77,368.55 325.22,367.72 322.50,366.95 319.60,366.23 316.55,365.57 313.33,364.97 309.96,364.43 306.45,363.96 302.79,363.54 299.01,363.18 295.09,362.89 291.06,362.67 286.92,362.50 282.68,362.41 278.34,362.38 273.92,362.41 269.42,362.50 264.85,362.67 260.22,362.89 255.54,363.18 250.81,363.54 246.06,363.96 241.27,364.43 236.48,364.97 231.67,365.57 226.87,366.23 222.08,366.95 217.31,367.72 212.57,368.55 207.88,369.43 203.23,370.36 198.63,371.34 194.10,372.37 189.65,373.45 185.28,374.57 181.00,375.73 176.82,376.93 172.75,378.17 168.79,379.45 164.95,380.75 161.25,382.09 157.68,383.45 154.25,384.84 150.98,386.25 147.86,387.68 144.90,389.13 142.11,390.59 139.50,392.06 137.06,393.54 134.81,395.03 132.74,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="132.740608858981" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="333.570742518868" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="233.1556756889245" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="248.4187658470759" y="363.7406512189645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="132.740608858981" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el diámetro, AP⊥PB. Como O biseca</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB, su distancia a AP es PB/2. Así</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PB=4 cm.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como AQ es perpendicular al plano,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AP²+AQ²=PQ²=49.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">También AB²=AP²+PB². Luego</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">QB²=AB²+AQ²=49+16.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>