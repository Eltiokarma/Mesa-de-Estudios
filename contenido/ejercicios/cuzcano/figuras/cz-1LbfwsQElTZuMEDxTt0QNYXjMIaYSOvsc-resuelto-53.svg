<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">053 · Exponentes en progresión</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="95.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">j</text><rect x="143.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="190.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">x</text><rect x="238.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="285.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">y</text><rect x="333.0" y="130" width="95.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="380.5" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">z</text><rect x="48.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4</text><rect x="143.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">24</text><rect x="238.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">16</text><rect x="333.0" y="178" width="95.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">8</text><text x="48" y="253" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Comprobación del término</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si j cuenta las elecciones del segundo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sumando, los exponentes son 36−3j, 4j</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 2j.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La condición de progresión es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">8j=36−3j+2j, de donde j=4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El factor numérico es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C(12,4)·2⁸·(−1/4)⁴.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>