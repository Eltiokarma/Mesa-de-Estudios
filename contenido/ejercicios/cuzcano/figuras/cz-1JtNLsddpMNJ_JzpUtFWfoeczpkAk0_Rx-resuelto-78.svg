<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">078 · Giro de un espejo con rayo fijo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,272.34 372.66,272.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,272.34 352.38,364.01" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="149.58,174.99 234.76,272.34 319.93,174.99" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="234.76,272.34 293.97,339.67 375.10,339.67" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="155.2552013743081" y="252.8699179232678" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="234.75510593624736" y="253.68114143920596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2α</text><text x="326.423363237259" y="325.88003435770185" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4α</text><text x="307.7652223706814" y="256.9260355029586" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Espejo inicial</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo de incidencia medido desde</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la normal es la mitad de la abertura</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre los rayos. Al inicio vale α.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El giro de la normal añade α a ese</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo, porque el rayo incidente</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">permanece fijo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La incidencia final vale 2α y la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abertura es el doble, 4α.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>