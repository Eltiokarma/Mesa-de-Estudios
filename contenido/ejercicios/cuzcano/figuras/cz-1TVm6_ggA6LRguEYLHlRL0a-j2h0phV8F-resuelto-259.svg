<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">259 · Altura a una hipotenusa y ángulos en razón tres a uno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="132.09,327.89 248.88,211.11 365.67,327.89 132.09,327.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="132.09,327.89 110.70,290.90 248.88,211.11" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.70,290.90 139.93,320.06" fill="none" stroke="#008674" stroke-width="2.5"/><text x="121.93923877794845" y="338.773766854412" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="248.8806963645673" y="199.5008533879502" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="339.4991466120498" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="100.90322580645162" y="287.9971838197645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="147.32753029527225" y="322.81541218637994" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="225.66854412015704" y="229.24142345110087" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="341.0039255845707" y="318.463133640553" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma AB = a. En ABP, BP = a cos x y la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura PH = BP sen x = a cos x sen x.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABC, BC = a cot 3x. La igualdad del</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enunciado da cot 3x = 4 cos x sen x =</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2 sen 2x.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En 0° &lt; x &lt; 30°, el lado izquierdo</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">decrece y el derecho crece. En x =</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15°, ambos valen 1. Esa es la única</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">solución.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>