70967741936" y="350.4112903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">7</text><circle cx="110.98387096774195" cy="269.5" r="3.7" fill="#20364b"/><text x="117.98387096774195" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><circle cx="149.08870967741936" cy="180.5887096774194" r="3.7" fill="#20364b"/><text x="156.08870967741936" y="172.5887096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si centro c y suma S,4S=45+3c; máximo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">centro9 da S=18.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Intercambiar el5 central con el9</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferior deja parejas</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuestas4+5,2+7,8+1,6+3,todas9.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada línea suma 9+9=18. Dos fichas</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cambian de puesto,y con una sola no</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puede alterarse una permutación.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>