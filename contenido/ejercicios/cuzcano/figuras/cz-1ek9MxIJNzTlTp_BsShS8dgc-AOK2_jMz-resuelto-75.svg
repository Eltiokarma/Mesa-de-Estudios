<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">075 · Escala vertical de un arco coseno desplazado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,142.48 105.47,158.98 110.04,165.88 114.61,171.22 119.18,175.76 123.75,179.79 128.32,183.48 132.89,186.89 137.46,190.11 142.03,193.15 146.60,196.06 151.17,198.86 155.74,201.55 160.31,204.17 164.88,206.71 169.45,209.19 174.02,211.62 178.59,214.00 183.16,216.33 187.73,218.63 192.30,220.90 196.87,223.14 201.44,225.35 206.01,227.54 210.58,229.72 215.15,231.88 219.72,234.03 224.29,236.17 228.86,238.30 233.43,240.42 238.00,242.55 242.57,244.67 247.14,246.80 251.71,248.93 256.28,251.07 260.85,253.21 265.42,255.37 269.99,257.55 274.56,259.74 279.13,261.96 283.70,264.19 288.27,266.46 292.84,268.76 297.41,271.10 301.98,273.47 306.55,275.90 311.12,278.38 315.69,280.92 320.26,283.54 324.83,286.24 329.40,289.03 333.97,291.94 338.54,294.99 343.11,298.20 347.68,301.62 352.25,305.30 356.82,309.34 361.39,313.88 365.96,319.22 370.53,326.12 375.10,342.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">curva</text><polyline points="100.90,396.52 375.10,342.61" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">rayo</text><circle cx="100.90322580645162" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3π</text><circle cx="375.09677419354836" cy="342.60880959790643" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="334.60880959790643" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">x=3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El extremo derecho tiene ordenada 3</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan θ. Como la función decrece y b&gt;0,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ahí el arco coseno vale 0, así que a=3</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan θ.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El extremo izquierdo corresponde a un</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arco coseno de π. Su ordenada es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a+bπ=3π.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces bπ=3π−3 tan θ. Por</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">periodicidad e imparidad,</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan(πb)=−tan(3 tan θ), donde está</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">definida.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>