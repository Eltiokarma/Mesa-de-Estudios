<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Una función seno que pierde su inversa</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="786.1552049079811" x2="421" y2="786.1552049079811" stroke="#20364b" stroke-width="1.7"/><line x1="99.13514354026657" y1="105" x2="99.13514354026657" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 105.47,387.65 110.04,378.79 114.61,369.97 119.18,361.17 123.75,352.43 128.32,343.73 132.89,335.11 137.46,326.56 142.03,318.10 146.60,309.74 151.17,301.49 155.74,293.35 160.31,285.34 164.88,277.46 169.45,269.73 174.02,262.15 178.59,254.74 183.16,247.50 187.73,240.44 192.30,233.57 196.87,226.90 201.44,220.44 206.01,214.18 210.58,208.15 215.15,202.35 219.72,196.78 224.29,191.45 228.86,186.37 233.43,181.54 238.00,176.97 242.57,172.67 247.14,168.64 251.71,164.88 256.28,161.40 260.85,158.20 265.42,155.29 269.99,152.67 274.56,150.35 279.13,148.32 283.70,146.59 288.27,145.16 292.84,144.04 297.41,143.21 301.98,142.70 306.55,142.48 311.12,142.58 315.69,142.98 320.26,143.68 324.83,144.69 329.40,146.00 333.97,147.62 338.54,149.53 343.11,151.74 347.68,154.24 352.25,157.04 356.82,160.13 361.39,163.50 365.96,167.15 370.53,171.08 375.10,175.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">C</text><circle cx="272.71621411493334" cy="151.2512549361483" r="3.7" fill="#20364b"/><text x="279.71621411493334" y="143.2512549361483" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5π/4</text><circle cx="342.14864234480007" cy="151.2512549361483" r="3.7" fill="#20364b"/><text x="349.14864234480007" y="143.2512549361483" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">7π/4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En A y D la fase x/2 queda en (0,π/2).</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El seno aumenta estrictamente y su</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recíproca disminuye estrictamente.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En B y E la fase x/3 queda en (0,π/2).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El coseno disminuye estrictamente y su</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recíproca aumenta estrictamente.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En C la fase atraviesa π/2. Las</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entradas 5π/4 y 7π/4 producen fases</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5π/12 y 7π/12 y tienen el mismo seno.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por eso C no es inyectiva.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>