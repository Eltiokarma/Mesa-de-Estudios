<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Dos alturas en proporción 2 a 1</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.89,317.26 315.54,213.87 363.86,317.26 109.89,317.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="255.98,244.22 255.98,317.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="255.98,244.22 363.86,317.26" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="315.54,213.87 290.82,267.81" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645159" y="332.99153886832374" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="317.78582760444215" y="206.0084611316764" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="326.249074563723" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="246.9899524061343" y="238.59703860391332" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="141.35801163405603" y="310.5166578529879" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="329.02326811211003" y="310.5166578529879" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40°</text><text x="243.61872025383394" y="291.41300898995246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2a</text><text x="291.93971443680596" y="244.21575885774726" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo rectángulo de hipotenusa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DC con altura 2a sobre AC da DC=2a/sen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">40°. Además ∠BDC=x+40°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo DBC, rectángulo en B,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">su altura a respecto de DC vale</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DC·sen(x+40°)cos(x+40°).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye DC y obtén sen(2x+80°)=sen</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">40°. Como 0&lt;x&lt;50°, la solución</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">admisible es 2x+80°=140°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>