<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">052 · Área entre una mediana y una secante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="110.50,142.48 238.00,269.50 195.50,396.52" fill="#f4c581" fill-opacity="0.45"/><polyline points="365.50,396.52 110.50,396.52 110.50,142.48 365.50,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.50,396.52 238.00,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.50,142.48 195.50,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,269.50 195.50,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="365.4970068263948" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="110.50299317360515" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="110.50299317360515" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="237.99999999999997" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="174.25149658680255" y="333.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="195.50099772453504" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con B=(0,0), A=(a,0), C=(0,c), se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene M=(a/2,c/2), Q=(a/4,c/4) y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T=(a/3,0).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los avances verticales dan CT=4TQ=4.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Además TM=(a/6,c/2) tiene la mitad del</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">módulo de TC, así TM=2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa [CMT]=CT·TM sin37°/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>