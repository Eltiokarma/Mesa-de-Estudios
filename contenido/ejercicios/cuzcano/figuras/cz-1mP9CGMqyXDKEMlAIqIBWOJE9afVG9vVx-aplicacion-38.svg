<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Conductor horizontal sostenido por un resorte</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="122.29,303.77 373.84,303.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="125.43,291.20 129.87,290.00 132.61,288.81 132.61,287.61 129.87,286.42 125.43,285.22 120.99,284.03 118.25,282.83 118.25,281.64 120.99,280.44 125.43,279.25 129.87,278.05 132.61,276.86 132.61,275.66 129.87,274.47 125.43,273.27 120.99,272.08 118.25,270.88 118.25,269.69 120.99,268.49 125.43,267.30 129.87,266.10 132.61,264.91 132.61,263.71 129.87,262.52 125.43,261.32 120.99,260.13 118.25,258.93 118.25,257.74 120.99,256.54 125.43,255.35 129.87,254.16 132.61,252.96 132.61,251.77 129.87,250.57 125.43,249.38 120.99,248.18 118.25,246.99 118.25,245.79 120.99,244.60 125.43,243.40 129.87,242.21 132.61,241.01 132.61,239.82 129.87,238.62 125.43,237.43 120.99,236.23 118.25,235.04 118.25,233.84 120.99,232.65 125.43,231.45 129.87,230.26 132.61,229.06 132.61,227.87 129.87,226.67 125.43,225.48 120.99,224.28 118.25,223.09 118.25,221.89 120.99,220.70 125.43,219.50 129.87,218.31 132.61,217.11 132.61,215.92 129.87,214.72 125.43,213.53 120.99,212.33 118.25,211.14 118.25,209.94 120.99,208.75 125.43,207.55" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="125.43,291.20 125.43,303.77" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,206.93 150.59,206.93" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="360.00,305.66 344.91,332.07 375.10,332.07 360.00,305.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="213.47,290.57 297.74,290.57" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="286.42,295.28 297.74,290.57 286.42,285.85" fill="none" stroke="#008674" stroke-width="2.5"/><text x="107.19206865936667" y="252.20568215448358" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">k</text><text x="255.6087599881622" y="279.2477064220183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 A</text><text x="350.5702870671796" y="224.53477360165726" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙ 0,4 T</text><text x="248.0621485646641" y="322.0118378218408" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,4 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza del resorte es 0,5×10=5 N</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia arriba. La fuerza magnética vale</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ILB=1,6 N hacia abajo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El peso y la fuerza magnética actúan</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en el centro. Toma momentos respecto</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del apoyo derecho: 5L=(mg+1,6)L/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cancela L, despeja mg=8,4 N y divide</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre g.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>