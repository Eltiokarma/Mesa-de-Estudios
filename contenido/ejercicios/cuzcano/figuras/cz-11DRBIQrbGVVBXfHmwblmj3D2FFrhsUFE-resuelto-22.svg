<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">022 · Concurrencia en un triángulo con altura</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.52,363.44 178.76,168.79 364.94,363.44 108.52,363.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="178.76,168.79 178.76,363.44" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="142.37,266.96 276.08,266.96" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="142.37,266.96 364.94,363.44" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="108.52,363.44 178.76,283.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645169" y="374.4382716049383" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="178.76065312624456" y="162.02289924332933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935483" y="370.2068896853843" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="177.06810035842298" y="376.97710075667067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="186.3771405814417" y="285.5792512943051" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="134.7542811628834" y="259.3446833930705" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="279.46754281162885" y="257.6521306252489" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="140.6782158502589" y="320.27658303464756" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="129.67662285941861" y="358.35902031063324" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La mediatriz de BH es paralela a AC y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corta BC en N. Como pasa por la mitad</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de BH, M y N son puntos medios. La</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">bisectriz en C da ∠MCN=∠CMN, luego</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">MN=NC=BN.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así M pertenece a la circunferencia de</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diámetro BC y CM es perpendicular a</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AB. Como M es punto medio de AB, la</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recta CM es mediatriz de AB y PA=PB.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABP, ∠ABP=∠BAP=20°. El ángulo</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior APH vale 40°. En el triángulo</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulo APH, ∠PAC=90°−40°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>