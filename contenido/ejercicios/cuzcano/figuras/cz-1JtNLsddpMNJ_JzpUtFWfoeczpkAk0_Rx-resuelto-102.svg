<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">102 · Imagen virtual de una vela</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="261.18,190.93 274.53,230.22 278.46,269.50 274.53,308.78 261.18,348.07 247.82,308.78 243.89,269.50 247.82,230.22 261.18,190.93" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="198.32,269.50 198.32,242.79" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="135.47,269.50 135.47,216.08" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="198.32,242.79 261.18,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="198.32,242.79 261.18,242.79 135.47,216.08" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="261.18,269.50 335.03,300.89" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="261.18,242.79 335.03,258.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="198.324429244847" y="227.07463721231167" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Objeto</text><text x="135.4720399297532" y="201.93368148627414" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen</text><text x="282.389499953785" y="191.72016822257137" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Lente</text><text x="229.75062390239395" y="289.1413716609668" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De 1/s′ = 1/6 − 1/3 se obtiene s′ = −6</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cm, del mismo lado que la vela.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambas posiciones están a un mismo lado</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la lupa. Su separación es 6 − 3 = 3</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cm.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La luz emergente llega al ojo. Al</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">prolongar sus rayos hacia atrás, estos</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">parecen salir de la posición de la</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">imagen virtual.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>