185.95,343.15 180.39,337.14 175.33,330.72 170.79,323.92 166.79,316.78 163.37,309.36 160.54,301.69 158.32,293.81 156.72,285.79 155.76,277.67 155.44,269.50 155.76,261.33 156.72,253.21 158.32,245.19 160.54,237.31 163.37,229.64 166.79,222.22 170.79,215.08 175.33,208.28 180.39,201.86 185.95,195.85 191.95,190.30 198.37,185.24 205.17,180.69 212.31,176.70 219.74,173.27 227.41,170.44 235.28,168.22 243.30,166.63 251.42,165.67 259.59,165.35 267.76,165.67 275.89,166.63 283.91,168.22 291.78,170.44 299.45,173.27 306.88,176.70 314.01,180.69 320.81,185.24 327.23,190.30 333.24,195.85 338.79,201.86 343.85,208.28 348.40,215.08 352.39,222.22 355.82,229.64 358.65,237.31 360.87,245.19 362.46,253.21 363.42,261.33 363.75,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="109.71,269.50 363.75,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="236.73,142.48 236.73,396.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="236.73,142.48 236.73,167.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="140.19758064516128" y="284.741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">9</text><text x="246.89112903225805" y="155.18548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="226.56854838709677" y="279.6612903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="264.67338709677415" y="284.741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Centro menor</text><text x="366.2862903225806" y="271.0241935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Tangencia</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangencia interior implica que la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia horizontal entre los centros</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es R−r. La diferencia de los extremos</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierdos vale 2(R−r)=9.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura del cruce de la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">circunferencia menor con la vertical</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de O es R−5. Pitágoras da</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">r²=(9/2)²+(R−5)².</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye r=R−9/2. Los términos</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadráticos se cancelan y queda R=25.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>