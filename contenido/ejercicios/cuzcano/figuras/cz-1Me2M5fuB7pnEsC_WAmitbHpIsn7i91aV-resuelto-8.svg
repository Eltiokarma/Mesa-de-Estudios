lyline points="120.44,234.71 238.00,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="120.44,234.71 310.65,372.91" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="120.44,234.71 355.56,311.11" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="120.44,234.71 355.56,234.71" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="120.44,234.71 310.65,172.91" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="120.44,311.11 238.00,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="120.44,311.11 310.65,372.91" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="120.44,311.11 355.56,311.11" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="120.44,311.11 355.56,234.71" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="120.44,311.11 310.65,172.91" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="244.81965793461785" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="172.16569766600264" y="166.09057366833804" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="127.26308080271394" y="227.8937237008126" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="127.26308080271392" y="304.28661836456945" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada vértice aporta n−3 diagonales.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre los cuatro hay tres diagonales</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">internas al grupo contadas dos veces.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces 4(n−3)−3=25.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Despeja n=10 y calcula 360°/10.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>