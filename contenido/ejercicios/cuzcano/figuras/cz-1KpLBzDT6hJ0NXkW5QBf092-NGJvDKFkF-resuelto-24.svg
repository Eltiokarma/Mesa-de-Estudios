<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">024 · Producto a suma para comparar cuatro senos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Dentro de (0, π/2)</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="115.0" y1="275" x2="215.0" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="115.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="215.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><line x1="315.0" y1="275" x2="365.0" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="315.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="365.0" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="115.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">0</text><text x="215.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/5</text><text x="315.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">2π/5</text><text x="365.0" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/2</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al aplicar producto a suma y restar,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el segundo miembro menos el primero es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(cos 3x−cos 7x)/2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica diferencia de cosenos para</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtener sen 5x sen 2x. En el intervalo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pedido, sen 2x&gt;0.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Basta que sen 5x&gt;0. Como 0&lt;5x&lt;5π/2, el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">signo es positivo entre 0 y π y entre</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2π y 5π/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>