4.231884057971" y="339.8366058906031" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="148.98644226273962" y="322.74918186068254" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="100.90322580645162" y="165.78330995792425" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 N</text><text x="363.1753155680225" y="163.00163627863486" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 N</text><text x="358.406732117812" y="320.76227208976155" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30 N</text><text x="145.807386629266" y="372.81930808789156" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 N</text><text x="250.71622253389435" y="374.40883590462835" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15 N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La línea de acción de la fuerza de 20</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N pasa por C. La de 30 N se aplica en</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C. Ambas aportan momento cero.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los 5 N a 4 m a la izquierda dan +20</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N·m. Los 15 N a 2 m a la izquierda dan</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−30 N·m.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza de 10 N en B tiene</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente horizontal 10×4/5=8 N hacia</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la derecha. A 3 m sobre C da −24 N·m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>