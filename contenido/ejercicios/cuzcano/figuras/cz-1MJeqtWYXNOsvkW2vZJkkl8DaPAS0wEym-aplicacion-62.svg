<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">062 · Momento de cada apoyo respecto del otro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="106.58,246.01 364.77,246.01 364.77,283.44" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,258.40 106.58,246.01 112.26,258.40 100.90,258.40" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="281.63,258.40 287.31,246.01 292.99,258.40 281.63,258.40" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="354.44,283.44 375.10,283.44 375.10,300.22 354.44,300.22 354.44,283.44" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="106.58331814592069" y="238.77586416378105" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="287.3135289472085" y="238.77586416378105" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="364.7693335763319" y="238.77586416378105" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="196.9484235465646" y="238.77586416378105" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7 m</text><text x="326.04143126177024" y="238.77586416378105" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 m</text><text x="364.7693335763319" y="291.96218334244577" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 kg</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El peso de la barra es 200 N y actúa a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5 m de A, es decir a 2 m a la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda de B. El bloque pesa 50 N.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto de B, el momento de la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reacción en A es el opuesto a</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">200×2−50×3. Resulta −250 N·m.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto de A, los dos pesos tienen</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">momentos horarios. La reacción en B</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">debe aportar +200×5+50×10.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>