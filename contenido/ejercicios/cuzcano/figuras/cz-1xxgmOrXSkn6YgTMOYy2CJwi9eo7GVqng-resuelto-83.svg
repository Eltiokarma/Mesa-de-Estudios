<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">083 · Tres ángulos iguales y una perpendicular</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.89,380.62 239.50,156.13 369.10,380.62 109.89,380.62" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.89,380.62 239.50,305.79 239.50,156.13" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="174.70,268.38 369.10,380.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="179.94,259.29 189.02,264.54 183.78,273.62" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="391.8550463833084" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="235.7525118984664" y="147.14495361669168" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.09677419354836" y="390.356720982286" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="243.24413890357832" y="310.28501546110283" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="134.6155473294553" y="374.62430427155095" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="231.25753569539924" y="183.10476324122894" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="340.63528997003345" y="358.8918875608159" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama α a los ángulos de base. Como</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OA⊥DR, ∠AOD=90°−α y 2α=90°+x. Además</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DO=2DR cosα.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En DRA, la ley de senos da DA=DR sen</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x/senα. En DOA, da DA=DO</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosα/cos(α−x). Como α−x=90°−α, el</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segundo denominador es senα.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala y cancela para obtener sen</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=2cos²α=1+cos2α=1−sen x. En la</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">configuración x es agudo, así que</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x=30°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>