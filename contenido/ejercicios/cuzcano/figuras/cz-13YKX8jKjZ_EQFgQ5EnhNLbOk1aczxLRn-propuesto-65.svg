<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">065 · Razón áurea desde una tangente y una secante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="235.10,299.12 100.90,365.35 186.98,365.35" fill="#f4c581" fill-opacity="0.45"/><polygon points="235.10,299.12 186.98,365.35 326.26,365.35" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,365.35 186.98,365.35 326.26,365.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,365.35 143.94,232.89" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="143.94,232.89 326.26,365.35" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="256.62,269.50 235.10,299.12 186.98,365.35" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="235.10,299.12 100.90,365.35" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="235.10,299.12 326.26,365.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,269.50 374.73,260.20 373.64,250.97 371.82,241.84 369.30,232.89 366.08,224.16 362.18,215.71 357.64,207.60 352.47,199.86 346.71,192.56 340.40,185.72 333.56,179.41 326.26,173.65 318.52,168.48 310.41,163.94 301.96,160.04 293.23,156.82 284.28,154.30 275.15,152.48 265.92,151.39 256.62,151.02 247.32,151.39 238.09,152.48 228.96,154.30 220.01,156.82 211.28,160.04 202.83,163.94 194.72,168.48 186.98,173.65 179.68,179.41 172.84,185.72 166.53,192.56 160.77,199.86 155.60,207.60 151.06,215.71 147.16,224.16 143.94,232.89 141.42,241.84 139.60,250.97 138.51,260.20 138.14,269.50 138.51,278.80 139.60,288.03 141.42,297.16 143.94,306.11 147.16,314.84 151.06,323.29 155.60,331.40 160.77,339.14 166.53,346.44 172.84,353.28 179.68,359.59 186.98,365.35 194.72,370.52 202.83,375.06 211.28,378.96 220.01,382.18 228.96,384.70 238.09,386.52 247.32,387.61 256.62,387.98 265.92,387.61 275.15,386.52 284.28,384.70 293.23,382.18 301.96,378.96 310.41,375.06 318.52,370.52 326.26,365.35 333.56,359.59 340.40,353.28 346.71,346.44 352.47,339.14 357.64,331.40 362.18,323.29 366.08,314.84 369.30,306.11 371.82,297.16 373.64,288.03 374.73,278.80 375.10,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="365.3495344875407" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="326.25899704995254" y="365.3495344875407" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="186.9814708605228" y="365.3495344875407" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="143.9423483334872" y="232.88873563161468" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="256.62023395523767" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="235.10067269171986" y="299.1191350595777" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos triángulos tienen la misma</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura sobre PCD, así que su razón es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PC/CD. Pon PD=d y PC=xd.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como OC es mediatriz de AD,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CA=CD=(1−x)d. Por potencia, PA²=xd².</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El coseno del ángulo en D calculado en</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PAD es 1−x/2, y calculado en CAD es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/[2(1−x)].</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala los cosenos. Sale x²−3x+1=0,</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con x=(3−√5)/2 en (0,1). Divide x</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre 1−x.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>