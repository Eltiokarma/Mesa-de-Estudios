<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">069 · Cota óptima de una fracción positiva</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="192.30107526881721" y1="105" x2="192.30107526881721" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,344.71 105.47,341.58 110.04,338.20 114.61,334.53 119.18,330.54 123.75,326.20 128.32,321.49 132.89,316.36 137.46,310.77 142.03,304.69 146.60,298.08 151.17,290.90 155.74,283.11 160.31,274.69 164.88,265.62 169.45,255.89 174.02,245.54 178.59,234.61 183.16,223.21 187.73,211.48 192.30,199.64 196.87,187.96 201.44,176.79 206.01,166.52 210.58,157.59 215.15,150.42 219.72,145.40 224.29,142.81 228.86,142.81 233.43,145.40 238.00,150.42 242.57,157.59 247.14,166.52 251.71,176.79 256.28,187.96 260.85,199.64 265.42,211.48 269.99,223.21 274.56,234.61 279.13,245.54 283.70,255.89 288.27,265.62 292.84,274.69 297.41,283.11 301.98,290.90 306.55,298.08 311.12,304.69 315.69,310.77 320.26,316.36 324.83,321.49 329.40,326.20 333.97,330.54 338.54,334.53 343.11,338.20 347.68,341.58 352.25,344.71 356.82,347.59 361.39,350.26 365.96,352.73 370.53,355.02 375.10,357.14" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F(x)</text><circle cx="226.57526881720432" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="233.57526881720432" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Máximo 8/31</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completa el cuadrado:</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x²−3x+5=2(x−3/4)²+31/8.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El denominador alcanza su mínimo</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivo en x=3/4. Su recíproco</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanza allí el máximo.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toda cota válida debe ser al menos ese</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">máximo y el máximo mismo satisface la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desigualdad.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>