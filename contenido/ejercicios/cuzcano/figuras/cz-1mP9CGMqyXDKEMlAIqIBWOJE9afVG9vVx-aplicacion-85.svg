<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">085 · Varilla que alimenta un resistor y un condensador</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,220.87 352.83,220.87 352.83,258.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="352.83,280.05 352.83,318.13 100.90,318.13" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="176.48,215.60 176.48,323.40" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="261.44,220.87 261.44,256.61 256.75,262.47 266.12,268.33 256.75,274.19 261.44,279.46 261.44,318.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="339.94,260.13 365.72,260.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="339.94,278.87 365.72,278.87" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="172.97,269.50 124.34,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="134.30,265.40 124.34,269.50 134.30,273.60" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="280.1836228287841" y="271.8435346015991" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2 Ω</text><text x="375.09677419354836" y="270.67176730079956" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3 μF</text><text x="191.12930796801766" y="256.02467604080505" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,4 m</text><text x="139.57154673283708" y="253.68114143920596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 m/s</text><text x="127.85387372484149" y="298.2082988695892" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙ 2 T</text><text x="276.0824372759856" y="301.1377171215881" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A₁</text><text x="366.89440308795145" y="300.55183347118833" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fem de movimiento es BLv=2×0,40×5=4</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">V. Las dos ramas tienen esa tensión.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El condensador almacena Q=CV=3 μF×4</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">V=12 μC. A tensión constante, la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corriente en esa rama es cero.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El resistor conduce I₁=4/2=2 A. La</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segunda rama puede tener corriente</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">durante el transitorio de carga.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>