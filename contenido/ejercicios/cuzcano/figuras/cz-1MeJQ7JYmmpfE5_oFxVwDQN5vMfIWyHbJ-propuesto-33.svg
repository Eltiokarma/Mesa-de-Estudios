<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">033 · Tres masas acopladas y energía</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="338.04838709677415" x2="421" y2="338.04838709677415" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645164" y1="105" x2="100.90322580645164" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="100.90,200.95 375.10,200.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">mesa</text><polyline points="100.90,338.05 100.90,200.95 238.00,200.95" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">cuerda izquierda</text><polyline points="238.00,200.95 375.10,200.95 375.10,338.05" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">cuerda derecha</text><circle cx="100.90322580645164" cy="338.04838709677415" r="3.7" fill="#20364b"/><text x="107.90322580645164" y="330.04838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m1=5</text><circle cx="238.0" cy="200.95161290322582" r="3.7" fill="#20364b"/><text x="245.0" y="192.95161290322582" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m2=10</text><circle cx="375.09677419354836" cy="338.04838709677415" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="330.04838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">m3=15</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las tres masas tienen igual rapidez</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por las cuerdas. m3 baja4 m y m1 sube4</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Potencial liberado=(15−5)·10·4=400 J.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">400=(1/2)(5+10+15)v²; v=√(80/3)≈5,16</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>