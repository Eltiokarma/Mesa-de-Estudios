5 105.21,214.75 103.06,214.68 100.90,214.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,324.34 375.03,321.11 374.84,317.88 374.53,314.67 374.08,311.47 373.52,308.29 372.82,305.14 372.01,302.01 371.07,298.92 370.01,295.87 368.84,292.86 367.54,289.90 366.13,286.99 364.61,284.15 362.98,281.36 361.23,278.64 359.39,275.99 357.44,273.41 355.39,270.92 353.24,268.50 351.00,266.17 348.68,263.93 346.26,261.79 343.76,259.74 341.19,257.79 338.54,255.94 335.82,254.20 333.03,252.57 330.18,251.05 327.28,249.64 324.32,248.34 321.31,247.16 318.26,246.11 315.17,245.17 312.04,244.35 308.89,243.66 305.71,243.09 302.51,242.65 299.29,242.33 296.07,242.14 292.84,242.08 289.61,242.14 286.38,242.33 283.17,242.65 279.97,243.09 276.79,243.66 273.64,244.35 270.51,245.17 267.42,246.11 264.37,247.16 261.36,248.34 258.40,249.64 255.49,251.05 252.65,252.57 249.86,254.20 247.14,255.94 244.49,257.79 241.91,259.74 239.42,261.79 237.00,263.93 234.67,266.17 232.43,268.50 230.29,270.92 228.24,273.41 226.29,275.99 224.44,278.64 222.70,281.36 221.07,284.15 219.55,286.99 218.14,289.90 216.84,292.86 215.66,295.87 214.61,298.92 213.67,302.01 212.85,305.14 212.16,308.29 211.59,311.47 211.15,314.67 210.83,317.88 210.64,321.11 210.58,324.34" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="233.67912237026954" y="238.9390440839148" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4 cm</text><text x="100.90322580645163" y="324.33870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">K</text><text x="100.90322580645163" y="214.66129032258067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="176.5428253615128" y="244.91713014460512" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="210.5806451612903" y="324.33870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="375.09677419354836" y="324.33870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="290.81541937902625" y="242.105532222647" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="233.27252502780865" y="267.6090100111235" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo entre IP y PO mide 45°</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">porque el arco menor TI del cuadrante</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mide 90° y PO prolonga TP. Además</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">IQ⊥PO por el diámetro IO.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo PIQ es rectángulo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">isósceles, así que IQ=PQ. La potencia</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de P en el segundo círculo es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PQ·PO=PN²=16.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa PO como base e IQ como altura. Su</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semiproducto es el área pedida.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>