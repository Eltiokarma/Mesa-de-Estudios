<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">192 · Reflexión horizontal de una función lineal por tramos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="296.91935483870964" x2="421" y2="296.91935483870964" stroke="#20364b" stroke-width="1.7"/><line x1="210.58064516129033" y1="105" x2="210.58064516129033" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="210.58,242.08 320.26,242.08 375.10,296.92" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F</text><polyline points="100.90,296.92 155.74,242.08 265.42,242.08" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">F(1−x)</text><circle cx="100.9032258064516" cy="296.91935483870964" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="288.91935483870964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−2,0)</text><circle cx="155.74193548387098" cy="242.08064516129033" r="3.7" fill="#20364b"/><text x="162.74193548387098" y="234.08064516129033" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−1,1)</text><circle cx="265.41935483870964" cy="242.08064516129033" r="3.7" fill="#20364b"/><text x="272.41935483870964" y="234.08064516129033" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,1)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada punto (u,y) de f se transforma en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1−u,y).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los vértices pasan a</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1,1),(−1,1),(−2,0). Léelos en orden</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">creciente de abscisas.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Une (−2,0) con (−1,1), y después con</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1,1). La primera rama tiene pendiente</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1 y la segunda es constante.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>