<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">043 · Distancia oblicua con dos segmentos colineales dados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="106.07,337.58 156.31,202.83 368.99,202.83 320.63,337.58 106.07,337.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="156.31,202.83 344.11,271.38" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="106.07,337.58 320.63,262.46 320.63,337.58" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="315.00,337.58 315.00,331.94 320.63,331.94" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="352.09,238.51 358.19,240.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="331.43,298.61 338.01,300.96" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645164" y="345.09102960671675" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="154.89681838267788" y="192.96995139195758" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.0967741935484" y="196.25651789659744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="323.4507291206363" y="346.0300486080424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="351.6212991604066" y="275.6036235086169" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="319.22514361467086" y="254.00618647812638" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="202.78678745028725" y="297.6705700397702" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="239.87803800265138" y="228.65267344233317" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6</text><text x="331.9019001325674" y="273.72558550596557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma L=(0,0), A=(w,0), O=(u,h) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">M=(w+u,h). Entonces D=(w+u/2,h/2).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como R=(6D+O)/7 y su abscisa es w,</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resulta u=w/4 y R=(w,4h/7).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con ese valor de u, el vector</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OD=(7w/8,−h/2) tiene componentes</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proporcionales en magnitud a</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">LR=(w,4h/7), con razón 7/8. Como OD=7,</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">LR=8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>