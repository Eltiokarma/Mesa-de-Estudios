<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">050 · Velocidad aparente bajo el agua</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,266.76 375.10,266.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="216.98,200.95 240.74,200.95 240.74,358.16 216.98,358.16 216.98,200.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="264.51,243.91 264.51,180.84 256.28,191.81 264.51,180.84 272.73,191.81" fill="none" stroke="#008674" stroke-width="2.5"/><text x="306.54838709677415" y="207.3494623655914" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,8 cm/s</text><text x="151.1720430107527" y="232.94086021505376" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Aire</text><text x="150.25806451612902" y="322.51075268817203" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="295.5806451612903" y="341.7043010752688" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Extremo sumergido</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tabla rígida hace que los dos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos suban a la misma rapidez</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">real.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para observación casi normal, la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">profundidad aparente es la profundidad</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">real dividida por 4/3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su variación por segundo también se</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">divide por 4/3. Resulta 0,6 cm/s hacia</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arriba.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>