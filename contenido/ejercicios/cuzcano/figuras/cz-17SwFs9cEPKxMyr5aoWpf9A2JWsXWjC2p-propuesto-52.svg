<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">052 · Terreno elevado y camino</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,308.67 179.24,308.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="179.24,308.67 257.59,230.33" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="257.59,230.33 375.10,230.33" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,308.67 257.59,230.33" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,308.67 375.10,230.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="107.90322580645162" y="300.6705069124424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="186.2442396313364" y="300.6705069124424" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F</text><text x="264.58525345622115" y="222.3294930875576" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="382.0967741935484" y="222.3294930875576" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sección vertical por diámetro:ángulo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">al borde cercano2θ y al lejanoθ. Si</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura h y distancia horizontal</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cercana L, h=Ltan2θ=(L+d)tanθ.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De ahí L=dcos2θ. Camino:tramo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal más</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ladera=L+h(csc4θ−cot4θ).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usar csc4θ−cot4θ=tan2θ:camino=Lsec²2θ=</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dsec2θ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>