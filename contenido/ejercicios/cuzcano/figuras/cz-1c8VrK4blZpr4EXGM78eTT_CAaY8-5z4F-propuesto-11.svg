3" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="48.0" y="295.7142857142857" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[16,18)</text><rect x="143.0" y="295.7142857142857" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="238.0" y="295.7142857142857" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="333.0" y="295.7142857142857" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0,70</text><rect x="48.0" y="337.14285714285717" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[18,20)</text><rect x="143.0" y="337.14285714285717" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="238.0" y="337.14285714285717" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">103</text><rect x="333.0" y="337.14285714285717" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="48.0" y="378.57142857142856" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="95.5" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[20,22)</text><rect x="143.0" y="378.57142857142856" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="190.5" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="238.0" y="378.57142857142856" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="285.5" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="333.0" y="378.57142857142856" width="95.0" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="380.5" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Distribución simétrica</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La primera y la sexta tienen 17 datos.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al terminar la quinta hay 103, así que</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el total es 120.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuarta acumula 0,70×120=84 datos.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La quinta tiene 103−84=19, y también</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la segunda. Las clases centrales</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen (120−2×17−2×19)/2=24 cada una.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[15,17) abarca la mitad de cada clase</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">central. La estimación es 12+12.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>