<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">030 · Potencial de frenado del potasio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="132.33,167.03 132.33,326.07 132.33,355.96 345.80,355.96 345.80,167.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="230.53,337.81 230.53,374.10" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="247.61,334.61 247.61,377.30" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="278.56,142.48 132.33,223.60" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="278.56,175.57 132.33,256.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="132.33,274.84 345.80,274.84" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="117.38804554079695" y="148.88804554079695" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cátodo K</text><text x="358.61195445920305" y="148.88804554079695" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Ánodo</text><text x="217.72011385199238" y="169.16793168880457" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Luz</text><text x="244.40417457305503" y="260.96110056926" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">e⁻</text><text x="242.26944971537" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Fuente</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada fotón lleva Eγ = hc/λ. Con las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">constantes dadas, Eγ = 3,75 eV.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al restar la función trabajo queda</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Kmáx = 1,55 eV.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para detener un electrón, eVf = Kmáx.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El valor en voltios coincide</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">numéricamente con la energía en eV.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>