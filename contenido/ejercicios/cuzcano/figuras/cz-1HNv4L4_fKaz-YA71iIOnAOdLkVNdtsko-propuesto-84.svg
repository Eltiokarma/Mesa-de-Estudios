<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">084 · Área generada por un segmento oblicuo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="116.97,348.53 194.34,187.86 355.01,265.23 314.90,348.53" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="194.34,187.86 194.34,348.53" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="355.01,265.23 355.01,348.53" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,348.53 375.10,348.53" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="116.97012058886024" y="356.56248610217676" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="194.3442078914513" y="356.56248610217676" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A₁</text><text x="314.9004650112722" y="357.1649946565171" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="355.0131557155376" y="357.1649946565171" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B₁</text><text x="194.3442078914513" y="181.83500534348292" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="355.0131557155376" y="258.6065840917336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea α el ángulo agudo entre AB y el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">eje. Su proyección es AB cosα=A₁B₁=8.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los radios del tronco son AA₁=AM cosα</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y BB₁=BN cosα, porque AM y BN son</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares a AB.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área lateral es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">π(AA₁+BB₁)AB=π(AM+BN)A₁B₁.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>