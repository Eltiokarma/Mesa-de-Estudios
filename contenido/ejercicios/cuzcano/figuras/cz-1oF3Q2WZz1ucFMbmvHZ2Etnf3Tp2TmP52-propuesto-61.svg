<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">061 · Eliminar un ángulo repetido entre transversales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="222.77,193.34 375.10,193.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,345.66 161.84,345.66" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="161.84,345.66 253.23,162.87" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,284.73 192.30,376.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="131.37,315.20 344.63,254.27 238.00,193.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="256.2795698924731" y="184.19534050179212" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">44°</text><text x="251.7096774193548" y="208.56810035842295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="135.93906810035844" y="303.6218637992832" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="169.14695340501794" y="358.7652329749104" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">121°</text><text x="330.3118279569892" y="253.65770609318997" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="362.91039426523287" y="185.10931899641577" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="110.04301075268819" y="337.13440860215053" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El segmento desde el punto superior</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia el vértice derecho tiene</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">orientación 44°−θ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El rayo superior izquierdo de la otra</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">transversal tiene orientación 121°. El</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segmento desde el punto inferior hacia</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el vértice derecho tiene orientación</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">121°−θ.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta las orientaciones de los</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segmentos. El término θ se cancela.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>