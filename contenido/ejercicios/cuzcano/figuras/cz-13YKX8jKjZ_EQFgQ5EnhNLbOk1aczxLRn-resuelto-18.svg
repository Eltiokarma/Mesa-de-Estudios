<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Área con un cuadrado y un cuadrante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="275.39,356.74 100.90,257.04 375.10,356.74" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,356.74 100.90,257.04 200.61,257.04 200.61,356.74 100.90,356.74" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="200.61,356.74 200.61,182.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,356.74 200.61,182.26" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="275.39,356.74 100.90,257.04 375.10,356.74 275.39,356.74" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,356.74 375.06,353.32 374.96,349.89 374.79,346.47 374.56,343.05 374.26,339.64 373.89,336.23 373.45,332.84 372.95,329.45 372.38,326.07 371.74,322.70 371.04,319.35 370.28,316.01 369.44,312.69 368.55,309.38 367.58,306.09 366.56,302.82 365.47,299.58 364.31,296.35 363.09,293.15 361.81,289.97 360.47,286.82 359.07,283.69 357.60,280.60 356.08,277.53 354.49,274.49 352.85,271.49 351.15,268.51 349.38,265.57 347.57,262.67 345.69,259.80 343.76,256.97 341.77,254.18 339.73,251.43 337.64,248.72 335.49,246.05 333.29,243.42 331.04,240.84 328.74,238.30 326.39,235.81 323.99,233.36 321.54,230.96 319.05,228.61 316.51,226.31 313.93,224.06 311.30,221.86 308.63,219.72 305.92,217.62 303.17,215.58 300.38,213.59 297.55,211.66 294.68,209.79 291.78,207.97 288.84,206.21 285.87,204.50 282.86,202.86 279.83,201.27 276.76,199.75 273.66,198.28 270.54,196.88 267.38,195.54 264.21,194.26 261.00,193.04 257.78,191.89 254.53,190.80 251.26,189.77 247.97,188.81 244.67,187.91 241.34,187.08 238.00,186.31 234.65,185.61 231.28,184.97 227.91,184.40 224.52,183.90 221.12,183.47 217.71,183.10 214.30,182.79 210.88,182.56 207.46,182.39 204.04,182.29 200.61,182.26" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="356.7434017595308" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="100.90322580645162" y="257.0366568914956" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="200.60997067448682" y="257.0366568914956" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="200.60997067448682" y="356.7434017595308" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="200.60997067448682" y="182.25659824046923" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.0967741935484" y="356.7434017595308" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="275.3900293255132" y="356.7434017595308" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lado del cuadrado es 4. Los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulos BAR y OBP son rectángulos y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen un par de ángulos agudos</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iguales porque BR⊥OP y BA⊥OB.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como BA=OB, son congruentes y AR=BP.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">También AR=AN por ser radios. Así</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PN=BN−BP=BA=4.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura desde O a PN es OB=4. El</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área vale 4·4/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>