<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">098 · Factores de un número con cantidad prescrita de coprimos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="64" y="160" font-family="Arial,sans-serif" font-size="19" fill="#1766b0" text-anchor="start">RELACIONES DEL PROBLEMA</text><text x="64" y="208" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los numerales del conteo llevan un 5,</text><text x="64" y="231" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un 7 y nueve unos, así que hay</text><text x="64" y="254" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">11·10=110. N es coprimo con 55. Los</text><text x="64" y="277" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primos distintos a,b,d son 2,3,7 en</text><text x="64" y="300" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">algún orden.</text><text x="64" y="339" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cantidad de coprimos es</text><text x="64" y="362" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a^(b−1)b^(c−1)d^(a−1)(a−1)(b−1)(d−1).</text><text x="64" y="385" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si d=2, el exponente de 2 es al menos</text><text x="64" y="408" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2 y debería ser 1. Si b=2, el</text><text x="64" y="431" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exponente de a es a lo sumo 2 y</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los numerales del conteo llevan un 5,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un 7 y nueve unos, así que hay</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">11·10=110. N es coprimo con 55. Los</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primos distintos a,b,d son 2,3,7 en</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">algún orden.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cantidad de coprimos es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a^(b−1)b^(c−1)d^(a−1)(a−1)(b−1)(d−1).</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si d=2, el exponente de 2 es al menos</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2 y debería ser 1. Si b=2, el</text><text x="482" y="315" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exponente de a es a lo sumo 2 y</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con a=2, el exponente de 2 en la</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cantidad es b+1, que debe valer 4. Así</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">b=3 y d=7. Igualar la potencia de 3 da</text><text x="482" y="422" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">c=2, de modo que la suma pedida es 7.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>