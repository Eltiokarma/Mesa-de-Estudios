<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Compresión adiabática y temperatura</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">V (L)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">P (atm)</text><polyline points="375.10,364.76 371.67,364.16 368.24,363.53 364.81,362.89 361.39,362.22 357.96,361.53 354.53,360.82 351.10,360.09 347.68,359.33 344.25,358.54 340.82,357.72 337.40,356.87 333.97,356.00 330.54,355.09 327.11,354.14 323.69,353.16 320.26,352.14 316.83,351.08 313.40,349.97 309.98,348.82 306.55,347.63 303.12,346.38 299.69,345.08 296.27,343.72 292.84,342.30 289.41,340.81 285.98,339.26 282.56,337.63 279.13,335.92 275.70,334.13 272.27,332.25 268.85,330.27 265.42,328.19 261.99,326.00 258.56,323.69 255.14,321.25 251.71,318.67 248.28,315.94 244.85,313.04 241.43,309.97 238.00,306.70 234.57,303.23 231.15,299.52 227.72,295.56 224.29,291.32 220.86,286.78 217.44,281.91 214.01,276.66 210.58,271.00 207.15,264.88 203.73,258.24 200.30,251.02 196.87,243.16 193.44,234.56 190.02,225.13 186.59,214.75 183.16,203.27 179.73,190.53 176.31,176.32 172.88,160.41 169.45,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">proceso</text><line x1="169.4516129032258" y1="142.48387096774195" x2="175.17129862744432" y2="150.6866263106844" stroke="#1766b0" stroke-width="2"/><line x1="169.4516129032258" y1="142.48387096774195" x2="167.1611651687106" y2="152.21802985156208" stroke="#1766b0" stroke-width="2"/><circle cx="375.09677419354836" cy="364.76209677419354" r="3.7" fill="#20364b"/><text x="368.09677419354836" y="378.76209677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="end">1: 4 L; 300 K</text><circle cx="169.4516129032258" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="176.4516129032258" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2: 1 L; 600 K</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La razón de compresión es V₁/V₂=4. Por</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PV^γ=cte, P₂=1·4^(3/2)=8 atm.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por TV^(γ−1)=cte, T₂=300·4^(1/2)=600</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">K.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Comprobar la ecuación de estado entre</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extremos: P₂V₂/T₂=8·1/600=1·4/300.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>