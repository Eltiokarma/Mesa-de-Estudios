<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Altura del rombo como suma de dos distancias</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="185.38,335.88 110.56,202.16 293.51,202.16 367.37,335.88 185.38,335.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.56,202.16 367.37,335.88" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="185.38,335.88 277.58,288.57 277.58,335.88" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.56,202.16 110.56,335.88 185.38,335.88" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="110.56,327.67 118.76,327.67 118.76,335.88" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="277.58,327.19 286.27,327.19 286.27,335.88" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="103.31690140845069" y="192.9864834166288" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="295.92821444797823" y="193.95195365742842" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="180.07178555202182" y="346.0135165833712" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="375.09677419354847" y="344.0825761017719" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="278.54975011358476" y="279.39606996819623" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="277.10154475238534" y="344.5653112221718" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="100.90322580645162" y="267.81042707860064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="135.17741935483872" y="207.46853702862333" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="266.9641072239891" y="306.4292367105861" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">NP biseca el ángulo en N. En MOP se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene ∠OMP=90°−θ. Al usar la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alineación NMP se obtiene ∠UMN=90°−θ</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y, como ∠UNM=θ, resulta UM⊥UN.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo isósceles UNP, UN=UP.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia de N a UP coincide con la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de P a UN porque ambas son alturas</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sobre lados iguales.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para M en NP las distancias a las dos</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectas suman esa altura, por</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">linealidad o descomposición de áreas.</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces x=UM+MO=8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>