<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">111 · Potencia de un conjunto de vidrio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="252.43,197.34 264.70,233.42 268.31,269.50 264.70,305.58 252.43,341.66 240.16,305.58 236.56,269.50 240.16,233.42 252.43,197.34" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="252.43,197.34 272.63,197.34 287.07,234.87 289.95,269.50 287.07,304.13 272.63,341.66 252.43,341.66" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="157.19,269.50 252.43,197.34" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="347.68,269.50 252.43,197.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="122.55,269.50 272.63,341.66" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="187.49066213921904" y="223.32003395585738" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30 cm</text><text x="313.7640067911715" y="224.04159592529712" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30 cm</text><text x="180.27504244482174" y="319.28777589134125" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60 cm</text><text x="243.0509337860781" y="286.09592529711375" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1</text><text x="278.4074702886248" y="285.374363327674" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En metros, la primera lente aporta</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1,5 − 1)(1/0,30 + 1/0,30) = 10/3</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dioptrías.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La segunda aporta (1,5 − 1)(1/0,60 −</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/0,30) = −5/6 dioptrías. Las</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">curvaturas de contacto se cancelan al</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sumar.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La potencia equivalente es 10/3 − 5/6</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= 2,5 dioptrías.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>