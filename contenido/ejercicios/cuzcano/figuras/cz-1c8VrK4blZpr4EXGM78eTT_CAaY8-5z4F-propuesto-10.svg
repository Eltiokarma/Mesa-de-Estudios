334" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[37,41)</text><rect x="174.66666666666669" y="370" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">a</text><rect x="301.33333333333337" y="370" width="126.66666666666667" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="401.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1</text><text x="48" y="445" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Frecuencias relativas de 500 objetos</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La primera clase empieza en 21 y la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tercera en 29. El ancho es cuatro, de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">modo que [33,37) es la cuarta clase.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La última frecuencia relativa es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=1−0,84=0,16. La tercera acumulada es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2a+0,28=0,60.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La frecuencia relativa de la cuarta</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">clase es 0,84−0,60=0,24. Multiplica</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por 500.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>