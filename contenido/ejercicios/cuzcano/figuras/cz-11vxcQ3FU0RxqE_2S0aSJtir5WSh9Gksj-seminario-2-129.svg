<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">129 · Pendiente de una segunda visual al girar un rayo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="130.01,182.98 341.09,182.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="149.64,396.52 149.64,148.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="149.64,182.98 174.19,379.34 321.45,360.93 149.64,182.98" fill="none" stroke="#008674" stroke-width="2.5"/><text x="345.99438990182324" y="182.98176718092566" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="149.64095371669003" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="174.18513323983169" y="390.3800841514726" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(1, −8)</text><text x="328.81346423562417" y="363.38148667601683" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="166.08555399719495" y="243.11500701262273" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="206.09256661991583" y="201.3899018232819" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa sen²u−sen²v=sen(u+v)sen(u−v). Aquí</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">da sen α·sen 30°=0,3, así que sen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α=3/5.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como α es agudo, cos α=4/5 y tan</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α=3/4. El rayo OP tiene pendiente −8.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al sumar el giro α a la inclinación de</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">OP, tan β=(−8+3/4)/(1+8·3/4).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>