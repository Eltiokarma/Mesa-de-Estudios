<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">095 · Inyección por dos agujeros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,214.66 375.10,214.66 375.10,167.66 100.90,167.66 100.90,214.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,293.00 375.10,293.00 375.10,246.00 100.90,246.00 100.90,293.00" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,371.34 375.10,371.34 375.10,324.34 100.90,324.34 100.90,371.34" fill="none" stroke="#008674" stroke-width="2.5"/><text x="115.73732718894009" y="183.15898617511522" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P absoluta; T kelvin</text><text x="115.73732718894009" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">PV = nRT</text><text x="115.73732718894009" y="339.8410138248848" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">conservar n o balance</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los datos solo fijan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ntotal=PV/(RT)≈7,089 mol; falta la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proporción de alimentación.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si se añaden agujeros iguales y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alimentaciones equivalentes en régimen</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de Graham, nO2/nH2O=√(18/32)=3/4.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces xO2=3/7 y mO2≈97,22 g,</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">próxima a 96 g; sin esas hipótesis no</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hay masa única.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>