<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Área de un triángulo levantado sobre un hexágono regular</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="306.64,211.58 175.29,317.17 167.63,296.70" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,327.42 293.78,327.42 375.10,265.98 182.22,265.98 100.90,327.42" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="175.29,317.17 167.63,296.70 229.47,276.24 298.97,276.24 306.64,296.70 244.80,317.17 175.29,317.17" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="306.64,211.58 175.29,317.17 167.63,296.70 306.64,211.58" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="306.64,296.70 306.64,211.58" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="175.29,317.17 306.64,296.70" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="175.2926352714708" y="317.16735451450415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">J</text><text x="167.6271311173801" y="296.7019763965351" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="229.46569499550657" y="276.23659827856596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S</text><text x="298.96976302772373" y="276.23659827856596" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="306.63526718181447" y="296.7019763965351" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="244.79670330368796" y="317.16735451450415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="306.63526718181447" y="211.57722553322498" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="306.63526718181447" y="254.13960096488003" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">√6</text><text x="277.4956866593074" y="307.6905695524286" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="293.25573408561263" y="323.87806699713195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el hexágono, PJ es una cuerda de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">120° de longitud 2√3. El ángulo entre</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">JO y JP mide 90°, pues el arco OP que</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">no contiene a J es una</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semicircunferencia.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como AP es perpendicular al plano,</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AJ²=AP²+PJ²=6+12=18. Además AJ es</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a JO, por el teorema de</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las tres perpendiculares.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa JO=2 como base y AJ=3√2 como</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>