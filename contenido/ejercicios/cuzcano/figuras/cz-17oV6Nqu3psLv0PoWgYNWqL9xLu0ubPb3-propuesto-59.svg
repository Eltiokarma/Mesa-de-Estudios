<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">059 · Dos tangentes a partir de un par de rayos ortogonales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="151.31,249.34 324.69,249.34" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="298.48,396.52 298.48,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="177.52,168.69 298.48,249.34 217.84,370.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="324.29,249.34 324.20,247.14 323.92,244.97 323.45,242.82 322.81,240.72 321.99,238.68 321.00,236.72 319.84,234.86 318.53,233.09 317.08,231.45 315.49,229.93 313.78,228.55 311.96,227.33 310.04,226.26 308.03,225.36 305.96,224.64 303.84,224.09 301.67,223.73 299.48,223.55 297.28,223.56 295.10,223.76 292.93,224.14 290.81,224.70 288.75,225.44 286.75,226.35 284.84,227.44 283.02,228.68 281.32,230.06 279.75,231.59 278.31,233.25 277.01,235.02" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="298.48,285.63 297.77,285.62 297.06,285.60 296.35,285.57 295.64,285.52 294.93,285.45 294.23,285.38 293.52,285.29 292.82,285.18 292.12,285.07 291.42,284.93 290.72,284.79 290.03,284.63 289.34,284.46 288.65,284.27 287.97,284.07 287.29,283.86 286.61,283.63 285.94,283.39 285.28,283.14 284.62,282.88 283.96,282.60 283.32,282.31 282.67,282.00 282.04,281.69 281.40,281.36 280.78,281.02 280.16,280.66 279.55,280.30 278.95,279.92 278.35,279.53" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="298.48387096774195" y="249.33870967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="177.51612903225805" y="168.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="324.69354838709677" y="254.3790322580645" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="305.5403225806451" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="274.2903225806452" y="227.56451612903223" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="273.88709677419354" y="289.6612903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como a&lt;0 y b&lt;0, el vector (b,a) está</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en el tercer cuadrante y es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular a (a,−b).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para θ, gira ese vector 90° para</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">convertir el eje inicial en +x.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta (−a,b).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambas tangentes valen −b/a. Su</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">producto es un cuadrado.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>