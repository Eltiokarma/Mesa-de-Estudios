<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">012 · Calor isócoro dentro de dos ciclos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">V/V₀</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">P/P₀</text><polyline points="192.30,269.50 192.30,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">1→2</text><line x1="192.30107526881721" y1="142.48387096774195" x2="196.3786797994129" y2="151.61476037086504" stroke="#1766b0" stroke-width="2"/><line x1="192.30107526881721" y1="142.48387096774195" x2="188.22347073822152" y2="151.61476037086504" stroke="#1766b0" stroke-width="2"/><polyline points="192.30,142.48 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">2→3</text><line x1="375.09677419354836" y1="142.48387096774195" x2="365.96588479042526" y2="146.56147549833764" stroke="#d37618" stroke-width="2"/><line x1="375.09677419354836" y1="142.48387096774195" x2="365.96588479042526" y2="138.40626643714626" stroke="#d37618" stroke-width="2"/><polyline points="375.10,142.48 375.10,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">3→4</text><line x1="375.09677419354836" y1="269.5" x2="371.01916966295266" y2="260.3691105968769" stroke="#008674" stroke-width="2"/><line x1="375.09677419354836" y1="269.5" x2="379.17437872414405" y2="260.3691105968769" stroke="#008674" stroke-width="2"/><polyline points="375.10,269.50 192.30,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">4→1</text><line x1="192.30107526881721" y1="269.5" x2="201.4319646719403" y2="265.4223954694043" stroke="#b0467a" stroke-width="2"/><line x1="192.30107526881721" y1="269.5" x2="201.4319646719403" y2="273.5776045305957" stroke="#b0467a" stroke-width="2"/><polyline points="192.30,269.50 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="503" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">1↔3</text><circle cx="192.30107526881721" cy="269.5" r="3.7" fill="#20364b"/><text x="199.30107526881721" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><circle cx="192.30107526881721" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="199.30107526881721" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><circle cx="375.09677419354836" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><circle cx="375.09677419354836" cy="269.5" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El tramo 1→2 es isócoro, por tanto</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">W₁₂=0. Para gas monoatómico,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">U=(3/2)PV.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ΔU₁₂=(3/2)[2P₀V₀−P₀V₀]=(3/2)P₀V₀.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Q=ΔU+W, Q₁₂=(3/2)P₀V₀&gt;0. Las áreas</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">encerradas de los ciclos no</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intervienen en el trabajo de este</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tramo vertical.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>