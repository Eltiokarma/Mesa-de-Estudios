<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Palitos de cuadrícula20</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,396.52 110.98,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="195.66,396.52 195.66,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="280.34,396.52 280.34,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="365.02,396.52 365.02,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="110.98,396.52 365.02,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="110.98,311.84 365.02,311.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.98,227.16 365.02,227.16" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="110.98,142.48 365.02,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay n+1 líneas verticales,con n</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">palitos cada una.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Otros n(n+1) palitos horizontales.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2n(n+1)=2·20·21=840.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>