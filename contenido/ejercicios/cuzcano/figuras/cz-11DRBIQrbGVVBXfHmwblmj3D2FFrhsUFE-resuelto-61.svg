<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">061 · Ángulo determinado por dos mediatrices</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.45,260.57 148.29,165.03 366.55,261.34 109.45,260.57" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.45,260.57 187.12,369.31 366.55,261.34" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="187.12,369.31 148.29,165.03" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="187.12,369.31 267.13,260.57" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="267.55811934570045" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="146.73160924792103" y="158.03605044320568" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="375.09677419354836" y="266.0046148222608" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="267.9049620762131" y="253.57657863474367" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="187.89947911907154" y="380.9639495567943" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="344.02668372475557" y="254.3533308964635" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="154.49913186511924" y="193.76665448231745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las mediatrices dan PA=PC y PB=PQ.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Junto con AB=QC, los triángulos PAB y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">PCQ son congruentes por tres lados.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea x=∠PAB=∠PCQ. Entonces ∠ACP=20°+x</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y, como PA=PC, ∠PAC=20°+x.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En A, ∠PAB y ∠PAC suman 90°. Resuelve</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x+(20°+x)=90°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>