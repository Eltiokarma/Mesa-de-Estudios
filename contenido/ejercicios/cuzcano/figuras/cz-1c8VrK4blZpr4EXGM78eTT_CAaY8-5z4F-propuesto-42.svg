<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">042 · Simetría alrededor de la clase modal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="104.77,381.82 375.10,381.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="104.77,381.82 104.77,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,381.82 100.90,241.86 139.52,241.86 139.52,381.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="139.52,381.82 139.52,276.85 178.14,276.85 178.14,381.82" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="178.14,381.82 178.14,224.36 216.76,224.36 216.76,381.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="216.76,381.82 216.76,171.88 255.38,171.88 255.38,381.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="255.38,381.82 255.38,224.36 294.00,224.36 294.00,381.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="294.00,381.82 294.00,276.85 332.62,276.85 332.62,381.82" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="332.62,381.82 332.62,241.86 371.23,241.86 371.23,381.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="120.21263062244434" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7–9</text><text x="120.21263062244434" y="231.3601706211677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="158.8314402544298" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">9–11</text><text x="158.8314402544298" y="266.35083977605973" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="197.45024988641526" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">11–13</text><text x="197.45024988641526" y="213.86483604372168" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">9</text><text x="236.06905951840073" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">13–15</text><text x="236.06905951840073" y="161.37883231138363" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2a</text><text x="274.6878691503862" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15–17</text><text x="274.6878691503862" y="213.86483604372168" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">9</text><text x="313.3066787823717" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">17–19</text><text x="313.3066787823717" y="266.35083977605973" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="351.9254884143571" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">19–21</text><text x="351.9254884143571" y="231.3601706211677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada clase tiene una compañera a igual</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia de 14 con la misma</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frecuencia. Eso da simetría y media</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">14.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La mitad de las observaciones</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">acumuladas se alcanza a mitad de la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">clase central. Como sus vecinas tienen</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">igual frecuencia y es la clase modal,</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también la moda agrupada es su punto</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El total es la frecuencia central más</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos veces la suma de las tres clases a</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">su izquierda.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>