<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">069 · Proyección sobre la base cuando un ángulo duplica a otro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="196.83,305.76 238.38,227.20 366.79,305.76 196.83,305.76" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.97,305.76 238.38,227.20 238.38,305.76" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="109.97,305.76 196.83,305.76" fill="none" stroke="#008674" stroke-width="2.5"/><text x="196.0778459077579" y="317.84266417844134" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="236.86696880831778" y="219.6466275659824" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354847" y="314.0658935395006" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="239.13303119168222" y="317.0873100506532" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="100.90322580645159" y="314.8212476672888" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="209.67422020794453" y="264.9678752332711" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">18 m</text><text x="307.8702568204035" y="319.3533724340176" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">22 m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma E en la prolongación de CA con</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">EA=AB=18. Si ∠C=α, el isósceles EAB</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene ángulos α en E y B.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En EBC los ángulos de la base son α,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de modo que BE=BC. Su altura BH cae en</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el punto medio de EC.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como EC=18+22=40 m, EH=20 m. Resta EA</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">para obtener AH.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>