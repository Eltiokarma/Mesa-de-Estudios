<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">016 · Piedra lanzada desde helicóptero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">t (s)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (m)</text><polyline points="100.90,294.90 105.47,293.27 110.04,291.74 114.61,290.33 119.18,289.03 123.75,287.85 128.32,286.77 132.89,285.81 137.46,284.97 142.03,284.23 146.60,283.61 151.17,283.10 155.74,282.71 160.31,282.43 164.88,282.26 169.45,282.20 174.02,282.26 178.59,282.43 183.16,282.71 187.73,283.10 192.30,283.61 196.87,284.23 201.44,284.97 206.01,285.81 210.58,286.77 215.15,287.85 219.72,289.03 224.29,290.33 228.86,291.74 233.43,293.27 238.00,294.90 242.57,296.65 247.14,298.52 251.71,300.49 256.28,302.58 260.85,304.78 265.42,307.10 269.99,309.52 274.56,312.06 279.13,314.72 283.70,317.48 288.27,320.36 292.84,323.35 297.41,326.46 301.98,329.68 306.55,333.01 311.12,336.45 315.69,340.01 320.26,343.68 324.83,347.46 329.40,351.35 333.97,355.36 338.54,359.48 343.11,363.72 347.68,368.06 352.25,372.52 356.82,377.10 361.39,381.78 365.96,386.58 370.53,391.49 375.10,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">piedra</text><polyline points="100.90,294.90 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">helicóptero</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La piedra inicia en tierra con</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vy=30−10=20 m/s.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0=h0+20·8−5·8², así h0=160 m.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Helicóptero sigue subiendo:</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h=160+30·8=400 m.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>