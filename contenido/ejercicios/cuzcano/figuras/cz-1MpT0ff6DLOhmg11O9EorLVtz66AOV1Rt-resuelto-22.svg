<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">022 · Cruce de rectas con pendientes distintas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="340.06451612903226" x2="421" y2="340.06451612903226" stroke="#20364b" stroke-width="1.7"/><line x1="233.2956989247312" y1="105" x2="233.2956989247312" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="214.48,396.52 299.16,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">L</text><polyline points="176.84,396.52 299.16,151.89" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">L₁</text><circle cx="233.2956989247312" cy="340.06451612903226" r="3.7" fill="#20364b"/><text x="240.2956989247312" y="332.06451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="289.747311827957" cy="170.70967741935482" r="3.7" fill="#20364b"/><text x="296.747311827957" y="162.70967741935482" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><circle cx="186.252688172043" cy="377.6989247311828" r="3.7" fill="#20364b"/><text x="193.252688172043" y="369.6989247311828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por el origen, L tiene y=3x.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">L₁ tiene y+4=2(x+5), es decir y=2x+6.</text><text x="482" y="169" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala y resuelve a=6, b=18.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>