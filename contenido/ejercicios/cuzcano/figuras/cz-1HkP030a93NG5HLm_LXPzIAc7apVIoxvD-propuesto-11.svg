<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Cambio de tensión en resorte hidráulico</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="372.3225806451613" x2="421" y2="372.3225806451613" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645164" y1="105" x2="100.90322580645164" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="100.90,166.68 100.90,372.32 375.10,372.32 375.10,166.68" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">vasija</text><polyline points="135.18,187.24 340.82,187.24" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">émbolo1</text><polyline points="100.90,303.77 135.18,303.77" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">émbolo3</text><polyline points="340.82,303.77 375.10,303.77" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">émbolo2</text><polyline points="135.18,303.77 169.45,290.06 203.73,317.48 238.00,290.06 272.27,317.48 306.55,290.06 340.82,303.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="503" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">resorte</text><circle cx="238.0" cy="166.67741935483872" r="3.7" fill="#20364b"/><text x="245.0" y="158.67741935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R1;F</text><circle cx="114.61290322580646" cy="276.35483870967744" r="3.7" fill="#20364b"/><text x="121.61290322580646" y="268.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R3</text><circle cx="354.53225806451616" cy="276.35483870967744" r="3.7" fill="#20364b"/><text x="361.53225806451616" y="268.35483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A1/A2=16, por lo que incremento de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">presión produce incremento de fuerza</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en cada extremo ΔT=256/16=16 N.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El resorte soporta tensión 16 N</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">adicional; no se suman fuerzas</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuestas como32 N de tensión.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Δx=ΔT/K=16/320=0,05 m=5 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>