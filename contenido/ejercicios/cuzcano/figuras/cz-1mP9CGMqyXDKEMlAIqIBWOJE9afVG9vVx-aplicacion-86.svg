<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">086 · Fem de una espira cuadrada en rotación</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="153.22,229.16 303.24,229.16 303.24,359.01 153.22,359.01 153.22,229.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,229.16 375.10,229.16" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="350.51,229.16 350.45,232.99 350.26,236.78 349.94,240.50 349.51,244.11 348.95,247.58 348.28,250.87 347.51,253.95 346.64,256.79 345.67,259.37 344.63,261.65 343.52,263.62 342.34,265.26 341.12,266.56 339.86,267.49 338.57,268.05 337.28,268.24 335.98,268.05 334.69,267.49 333.43,266.56 332.21,265.26 331.04,263.62 329.92,261.65 328.88,259.37 327.92,256.79 327.04,253.95 326.27,250.87 325.60,247.58 325.05,244.11 324.61,240.50 324.29,236.78 324.10,232.99 324.04,229.16 324.10,225.33 324.29,221.53 324.61,217.81 325.05,214.20 325.60,210.74 326.27,207.45 327.04,204.37 327.92,201.52 328.88,198.95 329.92,196.66 331.04,194.69 332.21,193.05 333.43,191.76 334.69,190.83 335.98,190.27 337.28,190.08 338.57,190.27 339.86,190.83 341.12,191.76 342.34,193.05 343.52,194.69 344.63,196.66 345.67,198.95 346.64,201.52 347.51,204.37 348.28,207.45 348.95,210.74 349.51,214.20 349.94,217.81 350.26,221.53 350.45,225.33 350.51,229.16" fill="none" stroke="#008674" stroke-width="2.5"/><text x="341.05895439377093" y="179.99314052651087" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ω</text><text x="139.3533555802744" y="288.40989988876527" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="357.4475342973675" y="287.7795698924731" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊙ B</text><text x="354.29588431590656" y="244.9171301446051" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">eje</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al cabo de t, el ángulo de la normal</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con el campo es ωt.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El flujo por la espira es Φ(t)=Ba²</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos(ωt).</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Deriva y aplica el signo de Faraday:</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ε=−dΦ/dt.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>