<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">001 · Área de un círculo comparada con la de un triángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="213.81,350.15 294.45,350.15 375.10,188.85" fill="#f4c581" fill-opacity="0.45"/><polyline points="213.81,350.15 294.45,350.15 375.10,188.85 213.81,350.15" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,350.15 294.45,350.15" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,188.85 375.10,188.85" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="294.45,350.15 294.45,188.85" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="294.45,269.50 294.20,263.17 293.46,256.88 292.22,250.67 290.50,244.58 288.31,238.64 285.66,232.89 282.57,227.36 279.05,222.10 275.13,217.13 270.83,212.48 266.18,208.18 261.21,204.26 255.94,200.74 250.42,197.64 244.67,194.99 238.73,192.80 232.63,191.08 226.42,189.85 220.13,189.10 213.81,188.85 207.48,189.10 201.19,189.85 194.98,191.08 188.89,192.80 182.94,194.99 177.19,197.64 171.67,200.74 166.40,204.26 161.43,208.18 156.78,212.48 152.48,217.13 148.56,222.10 145.05,227.36 141.95,232.89 139.30,238.64 137.11,244.58 135.39,250.67 134.15,256.88 133.41,263.17 133.16,269.50 133.41,275.83 134.15,282.12 135.39,288.33 137.11,294.42 139.30,300.36 141.95,306.11 145.05,311.64 148.56,316.90 152.48,321.87 156.78,326.52 161.43,330.82 166.40,334.74 171.67,338.26 177.19,341.36 182.94,344.01 188.89,346.20 194.98,347.92 201.19,349.15 207.48,349.90 213.81,350.15 220.13,349.90 226.42,349.15 232.63,347.92 238.73,346.20 244.67,344.01 250.42,341.36 255.94,338.26 261.21,334.74 266.18,330.82 270.83,326.52 275.13,321.87 279.05,316.90 282.57,311.64 285.66,306.11 288.31,300.36 290.50,294.42 292.22,288.33 293.46,282.12 294.20,275.83 294.45,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="226.70967741935485" y="259.8225806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">círculo</text><text x="213.80645161290323" y="350.14516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="294.45161290322585" y="350.14516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="375.09677419354847" y="188.85483870967738" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La separación de las dos horizontales</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangentes es 2r. Esa es la altura del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo con base UN.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia horizontal desde U a la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tangente vertical es r, de modo que</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">UN=r y el área de UNI es r·2r/2=r².</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El área del círculo es πr². Divide las</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">áreas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>