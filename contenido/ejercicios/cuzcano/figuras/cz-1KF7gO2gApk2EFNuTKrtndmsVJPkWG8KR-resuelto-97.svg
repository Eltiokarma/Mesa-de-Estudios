<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">097 · Área del triángulo medial a partir de las medianas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="179.00,388.32 238.00,152.32 297.00,388.32 179.00,388.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,152.32 238.00,388.32" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="179.00,388.32 267.50,270.32" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="297.00,388.32 208.50,270.32" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="208.50,270.32 267.50,270.32 238.00,388.32 208.50,270.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="178.99895941727368" y="394.87721123829346" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="238.0" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="297.0010405827263" y="394.87721123829346" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="274.05619146722165" y="268.6805411030177" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="238.0" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="201.94380853277835" y="268.6805411030177" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="241.27783558792925" y="312.9313215400624" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El baricentro G divide las medianas en</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">razón 2:1. Así GA=96, GB=GC=60 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">GD=48.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como GB=GC, G está en la mediatriz de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BC. En BGD, Pitágoras da</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BD=√(60²−48²)=36.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces BC=72 y la recta AD coincide</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con GD y es perpendicular a BC. La</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura es 144. El área de DEF es un</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuarto de la de ABC.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>