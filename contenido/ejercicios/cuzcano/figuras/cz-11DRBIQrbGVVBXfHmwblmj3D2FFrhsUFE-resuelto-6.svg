<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Cruce de rayos y ángulos repetidos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,330.16 375.10,330.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="125.56,330.16 194.60,209.83 337.62,330.16 372.14,149.66 125.56,330.16" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="194.60,209.83 231.10,389.34 372.14,149.66" fill="none" stroke="#008674" stroke-width="2.5"/><text x="106.82107217451838" y="313.39069389649575" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="155.15015084706425" y="269.00684613599446" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="189.67092132745415" y="243.3628452077048" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n</text><text x="212.35599907171036" y="243.3628452077048" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2m</text><text x="333.67184961708057" y="311.41807844047344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="362.27477372940365" y="324.24007890461826" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="333.67184961708057" y="193.06115107913664" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2n</text><text x="363.2610814574148" y="195.03376653515892" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m</text><text x="235.0410768159666" y="362.7060802970527" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo superior con base AC,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los ángulos interiores son 180°−θ,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">n+2m y 180°−θ−α. Su suma da</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α+2θ=180°+n+2m.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al comparar las direcciones de los dos</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rayos que llegan al vértice inferior</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con la horizontal, resulta α=x+n. En</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el cruce con el otro lado se obtiene</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=x+m.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye ambas relaciones en la</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primera igualdad. Se cancelan n y 2m y</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda 3x=180°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>