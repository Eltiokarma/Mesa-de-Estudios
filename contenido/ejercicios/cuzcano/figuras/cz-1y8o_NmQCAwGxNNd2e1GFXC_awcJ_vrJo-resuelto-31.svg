<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Rectas desde dos puntos medios de un cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="118.57,385.96 118.57,155.02 356.11,155.02 356.11,385.96 118.57,385.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="118.57,155.02 238.00,270.49" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="118.57,385.96 178.62,212.43 356.11,270.49" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="145.62,181.41 152.88,174.82" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="206.33,241.46 213.59,233.54" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="352.15,211.77 360.73,211.77" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="352.15,329.87 360.73,329.87" fill="none" stroke="#008674" stroke-width="2.5"/><text x="108.01466275659826" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="110.65395894428156" y="142.483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="366.66568914956" y="145.78299120234607" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="367.98533724340166" y="395.8563049853372" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="241.95894428152488" y="282.366568914956" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="170.69794721407624" y="205.82697947214078" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="365.3460410557184" y="269.82991202346045" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="191.15249266862168" y="228.92082111436952" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escoge un lado de longitud 4. Con</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">L=(0,0), I=(0,4), M=(4,4), A=(4,0), se</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tiene O=(2,2).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por puntos medios, N=(1,3) y F=(4,2).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los vectores desde N son NL=(−1,−3) y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">NF=(3,−1).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El producto escalar es −3+3=0, por lo</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que el ángulo es recto.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>