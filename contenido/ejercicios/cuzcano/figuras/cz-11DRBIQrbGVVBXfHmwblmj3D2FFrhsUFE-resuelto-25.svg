<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">025 · Dos ángulos iguales en un cuadrilátero</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="113.42,258.23 269.93,175.60 357.57,329.60 258.66,352.13 113.42,258.23" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645159" y="264.49189865959636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="269.9266460450729" y="165.58189718662538" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="332.10126675504495" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="258.65841802916486" y="373.4181028133746" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="152.23626454558843" y="263.23987332449553" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">60°</text><text x="266.1705700397702" y="210.65480925025773" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="326.2677861246134" y="323.33708940933866" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="187.2929739284136" y="213.15885992045955" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=·</text><text x="320.0076594491089" y="246.9635439681838" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=·</text><text x="178.5287965827073" y="315.82493739873325" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">=·</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo ABD es equilátero, de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">modo que ∠ABD=60° y BD=AB.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como BD=BC, los ángulos en D y C del</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">triángulo BDC son iguales a x.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo restante en B es x−60°. Usa</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x+(x−60°)=180°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>