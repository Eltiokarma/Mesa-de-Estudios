<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">048 · Ángulo entre la cuerda al vértice y el radio focal</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="209.71085604161647" y1="105" x2="209.71085604161647" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="368.48,396.52 358.07,392.28 348.02,388.05 338.31,383.81 328.96,379.58 319.97,375.35 311.32,371.11 303.03,366.88 295.09,362.65 287.51,358.41 280.28,354.18 273.40,349.94 266.87,345.71 260.69,341.48 254.87,337.24 249.40,333.01 244.29,328.77 239.52,324.54 235.11,320.31 231.06,316.07 227.35,311.84 224.00,307.60 221.00,303.37 218.36,299.14 216.06,294.90 214.12,290.67 212.53,286.44 211.30,282.20 210.42,277.97 209.89,273.73 209.71,269.50 209.89,265.27 210.42,261.03 211.30,256.80 212.53,252.56 214.12,248.33 216.06,244.10 218.36,239.86 221.00,235.63 224.00,231.40 227.35,227.16 231.06,222.93 235.11,218.69 239.52,214.46 244.29,210.23 249.40,205.99 254.87,201.76 260.69,197.52 266.87,193.29 273.40,189.06 280.28,184.82 287.51,180.59 295.09,176.35 303.03,172.12 311.32,167.89 319.97,163.65 328.96,159.42 338.31,155.19 348.02,150.95 358.07,146.72 368.48,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.52,269.50 311.90,167.60" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="209.71,269.50 235.11,269.50 311.90,167.60 209.71,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="107.51898266806097" cy="269.5" r="3.7" fill="#20364b"/><text x="114.51898266806097" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="209.71085604161647" cy="269.5" r="3.7" fill="#20364b"/><text x="216.71085604161647" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">V</text><circle cx="235.11408184806808" cy="269.5" r="3.7" fill="#20364b"/><text x="242.11408184806808" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F</text><circle cx="311.90272941517196" cy="167.5980228868401" r="3.7" fill="#20364b"/><text x="318.90272941517196" y="159.5980228868401" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><circle cx="158.90440442871324" cy="259.3387096774194" r="3.7" fill="#20364b"/><text x="165.90440442871324" y="251.3387096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">26.5°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En y²=4px, la pendiente tangente en R</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es m=2p/y=tan 26.5°. De ahí</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R=(p/m²,2p/m).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de VR vale 2m y la de FR</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale 2m/(1−m²). Esta última</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corresponde al ángulo doble 53°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta las inclinaciones para obtener</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el ángulo en R.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>