<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">031 · Incluir el término cúbico ausente</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="86.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Orden</text><rect x="124.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="162.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1</text><rect x="200.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="238.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2</text><rect x="276.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="314.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3</text><rect x="352.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="390.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4</text><rect x="48.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="86.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Suma</text><rect x="124.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="162.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="200.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">9</text><rect x="276.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="314.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">−4</text><rect x="352.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3</text><text x="48" y="253" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Cálculos de la resolución</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El coeficiente de x³ es cero y ocupa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la primera posición después del líder.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Viète, para productos de k raíces</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">se aplica el signo (−1)^k al</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coeficiente de x^(4−k).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los coeficientes 0,9,4,3 dan las sumas</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,9,−4,3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>