<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">065 · Elevar al cuadrado las raíces de una cúbica</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="86.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Grado</text><rect x="124.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="162.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3</text><rect x="200.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="238.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2</text><rect x="276.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="314.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1</text><rect x="352.0" y="130" width="76.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="390.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">0</text><rect x="48.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="86.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Antes</text><rect x="124.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="162.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2</text><rect x="200.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">1</text><rect x="276.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="314.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">−1</text><rect x="352.0" y="178" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3</text><rect x="48.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="86.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Después</text><rect x="124.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="162.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4</text><rect x="200.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="238.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">−5</text><rect x="276.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="314.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">−5</text><rect x="352.0" y="226" width="76.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="390.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">−9</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Cálculo de los coeficientes</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Descompón P en su parte par x²+3 y su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">parte impar 2x³−x. El producto</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">P(x)P(−x) es la diferencia de sus</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrados.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al desarrollar queda −4x⁶+5x⁴+5x²+9,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con solo potencias pares.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa y=x² y cambia el signo de la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ecuación. Cada factor asociado a una</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">raíz r se transforma en y−r².</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>