<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">071 · Corrimiento del enfoque en una cámara</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,271.81 375.10,271.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="246.26,205.74 237.67,240.10 235.03,271.81 237.67,303.53 246.26,337.88 254.85,303.53 257.49,271.81 254.85,240.10 246.26,205.74" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="116.76,271.81 116.76,240.10 111.47,246.71 116.76,240.10 122.05,246.71" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="286.56,225.56 299.78,225.56 299.78,318.06 286.56,318.06 286.56,225.56" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="344.04,212.35 344.04,331.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="116.76,240.10 246.26,240.10 286.56,253.18 299.78,256.02 348.67,271.81" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="116.76020209871747" y="226.88437621453556" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Objeto</text><text x="293.82977069568597" y="213.67022930431406" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Lámina</text><text x="344.0435289545278" y="201.11678973960358" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Película</text><text x="175.56315584920327" y="286.3480373105325" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8 m</text><text x="297.79401476875245" y="290.97298872911" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al entrar en la lámina, la pendiente</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paraxial de un rayo convergente se</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reduce en un factor 1/n.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los 12 mm de vidrio causan el mismo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">acercamiento al eje que 12/1,5 = 8 mm</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de recorrido en aire. Al salir se</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recupera la pendiente.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hacen falta 4 mm adicionales para</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanzar el foco. La imagen se aleja</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la lente.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>