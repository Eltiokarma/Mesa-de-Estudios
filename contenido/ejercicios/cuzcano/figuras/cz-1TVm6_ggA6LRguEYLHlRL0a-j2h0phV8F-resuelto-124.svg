<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">124 · Ángulo del triángulo desde el incentro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="111.43,349.03 201.17,192.44 365.19,349.03 111.43,349.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="201.17,192.44 233.98,349.03" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="365.19,349.03 143.61,292.71" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="358.318903371441" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="201.17264982159764" y="180.06214956673708" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.0967741935484" y="358.93785043326295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="220.36000873807617" y="311.8978737347994" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="133.7074200830117" y="339.1315444549625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3t</text><text x="342.29257991698825" y="339.1315444549625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2t</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe A = 3t, C = 2t y B = 180° −</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">5t. Con circunradio R, AB = 2R sen 2t.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como Q es el incentro, QC = r/sen t =</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4R sen(3t/2) sen(B/2).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al igualar y usar producto a suma,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sale sen 4t − sen t = sen 2t. Entonces</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sen 4t − sen 2t = 2 cos 3t sen t = sen</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como 0° &lt; t &lt; 36°, cos 3t = 1/2 da t =</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">20°. Por tanto B = 80°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>