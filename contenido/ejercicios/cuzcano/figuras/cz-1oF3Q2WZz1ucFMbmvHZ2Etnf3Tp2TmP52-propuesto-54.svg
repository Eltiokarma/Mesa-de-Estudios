<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Dos bisectrices con perpendiculares auxiliares</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="131.37,225.32 375.10,225.32" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="131.37,286.26 204.49,286.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="161.84,347.19 375.10,347.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,255.79 180.11,204.00" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,255.79 161.84,347.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="131.37,286.26 253.23,164.39 335.49,261.88" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="308.07,225.32 192.30,316.72 253.23,374.61" fill="none" stroke="#008674" stroke-width="2.5"/><text x="253.23297491039423" y="173.5322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="161.83512544802866" y="219.23118279569889" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20°</text><text x="375.09677419354836" y="219.23118279569889" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="204.48745519713256" y="280.163082437276" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="375.09677419354836" y="341.09498207885304" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₃</text><text x="259.3261648745519" y="362.421146953405" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">30°</text><text x="103.94982078853047" y="264.93010752688167" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊥</text><text x="201.44086021505373" y="316.7222222222222" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊥</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A la izquierda, la perpendicular forma</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">un ángulo de 110° con la horizontal</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia la derecha. Su bisectriz sube</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con inclinación 55°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A la derecha, la perpendicular sube a</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">60°. El sector inferior entre su</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">prolongación y la horizontal mide 120°</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y su bisectriz baja con inclinación</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−60°.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos rayos que bajan desde el</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértice tienen orientaciones 235° y</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">300°. Resta.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>