<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">014 · Distancias perpendiculares a dos lados paralelos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.40,327.19 186.31,212.81 368.60,212.81 291.19,327.19 107.40,327.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.40,327.19 277.21,212.81 333.14,263.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="186.31,212.81 291.19,327.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="180.31,222.30 219.77,249.27" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="177.82,226.30 182.81,229.79 186.31,225.80" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="328.15,258.76 331.65,254.27 336.64,258.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="231.76,208.82 231.76,216.81" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="321.16,208.82 321.16,216.81" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645166" y="336.1754803454962" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="184.31000646336452" y="202.8245196545038" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="375.09677419354836" y="206.32061225688938" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="293.18831893765787" y="336.674922145837" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="276.70673952641164" y="202.32507785416303" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="224.76479229096893" y="259.26144309301367" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="193.29995886949882" y="242.28042188142663" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">K</text><text x="304.6754803454962" y="228.79549327222517" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Usa coordenadas afines con P=(0,0),</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I=(0,1), O=(1,0), N=(1,1). En ellas</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R=(1/2,1).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sobre PR los puntos son (t/2,t). La</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diagonal IO cumple que ambas</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coordenadas suman 1, de modo que t=2/3</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y A tiene primera coordenada 1/3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si d es la separación perpendicular</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre PI y NO, las distancias son</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">K=d/3 y x=d/2. Elimina d.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>