<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">011 · Punto luminoso que se desplaza sobre una pared</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.13,381.06 355.13,381.06 355.13,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="132.62,306.89 188.24,381.06 355.13,158.55" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="132.62,306.89 206.79,381.06 355.13,232.72" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="132.62,306.89 132.62,381.06" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="141.8880386154933" y="293.91429244172355" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">láser</text><text x="151.1592889098187" y="328.5269602072051" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="114.6923710854721" y="345.2152107369908" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20 cm</text><text x="365.01612903225805" y="159.17212149752777" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="366.87037909112314" y="231.48787379326583" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P′</text><text x="271.685542736049" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45 cm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con tan 37°≈3/4, el primer rayo avanza</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15 cm en horizontal antes del espejo.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pared está a 60 cm de la vertical</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del láser.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura inicial de P es 45 cot</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">37°≈60 cm. Tras el giro, el ángulo con</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la vertical es 45° y el rayo avanza 20</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cm antes de reflejarse.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Quedan 40 cm hasta la pared y el rayo</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reflejado sube con pendiente 1. La</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura final es 40 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>