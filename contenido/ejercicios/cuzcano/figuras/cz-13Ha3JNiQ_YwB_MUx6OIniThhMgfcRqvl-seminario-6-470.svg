<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">470 · Cuatro clases de carbonos en una cadena con grupos repetidos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,238.40 155.74,269.50 210.58,238.40 265.42,269.50 320.26,238.40 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="155.74,269.50 155.74,210.57" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="265.42,269.50 265.42,210.57" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="265.42,210.57 307.98,179.47" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="265.42,269.50 265.42,328.43" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="265.42,328.43 307.98,359.53" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="320.26,238.40 320.26,297.33" fill="none" stroke="#008674" stroke-width="2.5"/><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los dos grupos (CH₃)₂ aportan cuatro</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primarios. Los dos etilos aportan</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">otros dos.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay tres CH₂: el enlace central de la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierda y los dos de los etilos. Los</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos CH tienen tres vecinos.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El C que lleva ambos etilos tiene</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuatro vecinos. Reúne los cuatro</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recuentos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>