<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">484 · Tres sustituyentes en un ciclohexano</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="213.32,176.68 283.83,217.39 283.83,298.81 213.32,339.52 142.81,298.81 142.81,217.39 213.32,176.68" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="213.32,176.68 213.32,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="283.83,217.39 313.45,200.29" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="213.32,339.52 213.32,373.72" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="333.19161056641144" y="188.89361042183623" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Cl</text><text x="213.32069355685627" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Br</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las posiciones relativas son metil 1,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cloro 2 y bromo 4 al comenzar por el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">metil hacia el cloro.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ese conjunto 1,2,4 es menor que las</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">otras numeraciones posibles. Conserva</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los números al ordenar los nombres.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cita bromo, cloro y metil en ese</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">orden.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>