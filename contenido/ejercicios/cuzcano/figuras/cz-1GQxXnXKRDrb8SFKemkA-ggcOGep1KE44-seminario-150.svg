<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">150 · Gráfica de una diferencia de funciones signo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="238.0" y1="105" x2="238.0" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,142.48 238.00,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">h=2</text><polyline points="238.00,142.48 283.70,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">h=2</text><polyline points="283.70,396.52 375.10,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">h=0</text><circle cx="238.0" cy="269.5" r="3.7" fill="#20364b"/><text x="245.0" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,1)</text><circle cx="283.69892473118284" cy="269.5" r="3.7" fill="#20364b"/><text x="290.69892473118284" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,1)</text><circle cx="238.0" cy="142.48387096774195" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="245.0" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="283.69892473118284" cy="142.48387096774195" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="290.69892473118284" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="283.69892473118284" cy="396.51612903225805" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="290.69892473118284" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para x&lt;1 con x≠0, f=1 y g=−1, de modo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que h=2. En x=0, f=0 y g=−1, así que</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h=1.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En x=1, f=1 y g=0, por lo que h=1.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para x&gt;1, f=g=1 y h=0.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dibuja las ramas horizontales con</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">huecos en x=0 y 1 donde corresponda y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los dos puntos cerrados de altura 1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>