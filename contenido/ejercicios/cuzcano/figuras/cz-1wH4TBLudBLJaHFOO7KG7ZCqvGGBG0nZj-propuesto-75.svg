3.5" fill="#233b53"/><text x="392.00" y="263.00" font-family="Arial,sans-serif" font-size="19" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Q</text><line x1="90.00" y1="314.00" x2="384.00" y2="272.00" stroke="#c36117" stroke-width="2" stroke-dasharray="6 5"/><line x1="258.00" y1="440.00" x2="216.00" y2="146.00" stroke="#c36117" stroke-width="2" stroke-dasharray="6 5"/><text x="490.00" y="140.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">DESARROLLO PLANO</text><text x="490.00" y="167.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Bordes verticales se identifican.</text><text x="490.00" y="194.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">N y Q: misma generatriz, Δz = 2.</text><text x="490.00" y="221.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Diagonal NQ: (14, 2).</text><text x="490.00" y="248.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Diagonal MP: (−2, 14).</text><text x="490.00" y="275.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Lado del cuadrado: 10 m.</text><text x="490.00" y="302.00" font-family="Arial,sans-serif" font-size="16" fill="#233b53" text-anchor="start" paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round">Altura = circunferencia = 14 m.</text></svg>