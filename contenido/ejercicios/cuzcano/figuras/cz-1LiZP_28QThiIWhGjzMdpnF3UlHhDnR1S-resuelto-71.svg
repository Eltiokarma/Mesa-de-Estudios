<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">071 · Tanque de veinte metros</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="195.77,142.48 195.77,396.52 271.98,396.52 271.98,142.48 195.77,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="195.77,269.50 271.98,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="271.98,142.48 291.66,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="271.98,333.01 291.66,333.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="191.33568548387098" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">20 m</text><text x="191.33568548387098" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">10 m</text><text x="191.33568548387098" y="325.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5 m</text><text x="291.6784274193549" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A · entrada</text><text x="291.6784274193549" y="325.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B · desagüe</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A llena 1/2 del volumen en 8 h: tasa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/16.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B quitaría la capa de 10 a 5 m, 1/4</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del volumen, en 5 h: tasa 1/20.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El saldo es 1/80 por hora. Falta medio</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tanque, que tarda 40 h.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>