<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Tangente del menor ángulo de tres rectas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="64" y="160" font-family="Arial,sans-serif" font-size="19" fill="#1766b0" text-anchor="start">RELACIONES DEL PROBLEMA</text><text x="64" y="208" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus pendientes son 1, −1/2 y −2.</text><text x="64" y="247" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para cada par, calcula la tangente</text><text x="64" y="270" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del ángulo agudo como</text><text x="64" y="293" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∣(m₂−m₁)/(1+m₁m₂)∣. Se obtienen 3, 3</text><text x="64" y="316" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y 3/4.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus pendientes son 1, −1/2 y −2.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para cada par, calcula la tangente del</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo agudo como ∣(m₂−m₁)/(1+m₁m₂)∣.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se obtienen 3, 3 y 3/4.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El menor ángulo interior es agudo y</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corresponde al menor de estos valores.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El par de pendientes negativas da 3/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>