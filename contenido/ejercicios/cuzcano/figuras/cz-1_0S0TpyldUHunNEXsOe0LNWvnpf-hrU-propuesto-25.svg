<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">025 · Palanca conectada a un émbolo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,200.95 100.90,338.05 329.40,338.05 329.40,200.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="137.46,200.95 137.46,310.63 274.56,310.63 274.56,200.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,223.80 137.46,223.80" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="137.46,246.65 375.10,246.65" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="274.56,262.65 329.40,262.65" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="297.41,246.65 297.41,262.65" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,203.24 375.10,246.65" fill="none" stroke="#008674" stroke-width="2.5"/><text x="153.0" y="237.51075268817203" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Pivote</text><text x="258.5645161290322" y="237.96774193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5 cm</text><text x="341.2795698924731" y="237.05376344086022" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15 cm</text><text x="375.09677419354836" y="200.95161290322582" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="114.61290322580646" y="254.87634408602148" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">0,2 m</text><text x="308.83333333333326" y="278.63978494623655" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1 cm²</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La columna produce 1000×10×0,2 = 2000</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pa sobre el émbolo.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza sobre el área de 10⁻⁴ m² es</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0,2 N.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala momentos: F×20 = 0,2×5, con</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancias en cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>