<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">064 · Dos sectores dobles separados por un quiebre</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,276.03 296.76,151.99 247.79,387.01" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="153.13,241.75 375.10,241.75" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,364.16 252.69,364.16" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="153.13,241.75 115.59,315.20" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="126.36,293.98 252.69,364.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="286.963133640553" y="173.20583717357914" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="174.02150537634407" y="233.2672811059908" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="137.46236559139783" y="253.50537634408602" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="143.33794162826416" y="307.03840245775734" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">76°</text><text x="247.79262672811058" y="344.25038402457756" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="239.63210445468508" y="377.2188940092166" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="362.03993855606757" y="233.59370199692782" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="108.08448540706601" y="355.67511520737327" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sean a y b las inclinaciones de los</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos lados que suben al vértice. La</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">primera pareja de marcas da</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclinación 2a para el segmento</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierdo que llega al quiebre.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La segunda pareja da orientación 2b al</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segmento que va desde L₂ al quiebre.</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Vistos desde el quiebre, los rayos</text><text x="482" y="292" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">hacia abajo tienen orientaciones</text><text x="482" y="315" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2a−180° y 2b−180°.</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su separación es 2(b−a)=76°. En el</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértice, x=b−a.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>