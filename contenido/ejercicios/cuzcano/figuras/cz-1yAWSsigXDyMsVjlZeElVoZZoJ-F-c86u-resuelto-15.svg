<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">015 · Rutas con enlaces directos entre puntos no contiguos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 123.75,255.79 146.60,252.74 169.45,255.79 192.30,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,269.50 192.30,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,269.50 123.75,283.21 146.60,286.26 169.45,283.21 192.30,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="192.30,269.50 215.15,255.79 238.00,252.74 260.85,255.79 283.70,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="192.30,269.50 215.15,283.21 238.00,286.26 260.85,283.21 283.70,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="283.70,269.50 306.55,255.79 329.40,252.74 352.25,255.79 375.10,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="283.70,269.50 375.10,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="283.70,269.50 306.55,283.21 329.40,286.26 352.25,283.21 375.10,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="100.90,269.50 137.46,298.44 192.30,304.54 247.14,298.44 283.70,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="192.30,269.50 228.86,240.56 283.70,234.46 338.54,240.56 375.10,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645163" y="262.4928315412186" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="192.3010752688172" y="277.1164874551971" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="283.69892473118273" y="277.1164874551971" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="277.1164874551971" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay tres vías de A a B y una directa</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de A a C. De B a C hay dos, de B a D</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una y de C a D tres.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A B se llega de 3 formas. A C se llega</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 3×2+1=7 formas.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para llegar a D se puede venir de B</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por una vía o de C por tres. Suma</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3+7×3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>