<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Dirección al centro de un cuadrado sobre un lado inclinado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="115.06,350.87 115.06,244.73 199.97,244.73 263.65,350.87 115.06,350.87" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="199.97,244.73 263.65,350.87 369.79,287.19 306.11,181.05 199.97,244.73" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="115.06,350.87 284.88,265.96" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="199.97,244.73 369.79,287.19" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="102.67221644120708" y="361.48751300728406" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="235.8891779396462" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="194.65972944849113" y="234.12018730489072" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="260.11238293444325" y="366.79448491155046" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="375.09677419354836" y="287.1899063475546" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="304.33714880332985" y="172.20551508844952" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="284.8782518210197" y="255.34807492195628" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="153.9729448491155" y="345.56659729448495" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="153.9729448491155" y="235.8891779396462" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="100.90322580645162" y="299.57284079084286" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="189.35275754422474" y="366.79448491155046" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sitúa A=(0,0), B=(0,5), C=(4,5) y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">D=(7,0). El vector C→D es (3,−5).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Gíralo 90° en sentido antihorario para</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtener D→E=(5,3). Entonces E=(12,3) y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">O, punto medio de CE, es (8,4).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo con AD tiene tangente</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4/8=1/2. El resultado exacto es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">arctan(1/2), aproximadamente 26,565°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>