<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">037 · Tangente a semicírculo en cuadrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="110.98387096774195" y1="105" x2="110.98387096774195" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="110.98,396.52 110.98,142.48 365.02,142.48 365.02,396.52 110.98,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">cuadrado</text><polyline points="110.98,396.52 117.63,396.34 124.26,395.82 130.85,394.95 137.39,393.74 143.86,392.19 150.23,390.30 156.50,388.08 162.65,385.54 168.65,382.67 174.49,379.50 180.16,376.02 185.64,372.26 190.92,368.21 195.97,363.89 200.80,359.31 205.38,354.49 209.69,349.43 213.74,344.16 217.51,338.68 220.98,333.01 224.16,327.16 227.02,321.16 229.56,315.02 231.78,308.75 233.67,302.37 235.22,295.91 236.44,289.37 237.30,282.78 237.83,276.15 238.00,269.50 237.83,262.85 237.30,256.22 236.44,249.63 235.22,243.09 233.67,236.63 231.78,230.25 229.56,223.98 227.02,217.84 224.16,211.84 220.98,205.99 217.51,200.32 213.74,194.84 209.69,189.57 205.38,184.51 200.80,179.69 195.97,175.11 190.92,170.79 185.64,166.74 180.16,162.98 174.49,159.50 168.65,156.33 162.65,153.46 156.50,150.92 150.23,148.70 143.86,146.81 137.39,145.26 130.85,144.05 124.26,143.18 117.63,142.66 110.98,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">semicírculo</text><polyline points="365.02,142.48 174.49,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">tangente PQ</text><polyline points="365.02,142.48 110.98,142.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="490" font-family="Arial,sans-serif" font-size="11" fill="#b0467a" text-anchor="start">A=PN</text><line x1="110.98387096774195" y1="142.48387096774195" x2="120.11476037086503" y2="138.40626643714626" stroke="#b0467a" stroke-width="2"/><line x1="110.98387096774195" y1="142.48387096774195" x2="120.11476037086503" y2="146.56147549833764" stroke="#b0467a" stroke-width="2"/><polyline points="110.98,396.52 110.98,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="503" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">B=MN</text><line x1="110.98387096774195" y1="142.48387096774195" x2="115.06147549833766" y2="151.61476037086504" stroke="#1766b0" stroke-width="2"/><line x1="110.98387096774195" y1="142.48387096774195" x2="106.90626643714624" y2="151.61476037086504" stroke="#1766b0" stroke-width="2"/><polyline points="365.02,396.52 212.60,345.71" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="503" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">x=RT</text><line x1="212.5967741935484" y1="345.7096774193548" x2="222.5485482380481" y2="344.72876286282" stroke="#d37618" stroke-width="2"/><line x1="212.5967741935484" y1="345.7096774193548" x2="219.9696446952273" y2="352.4654734912825" stroke="#d37618" stroke-width="2"/><circle cx="212.5967741935484" cy="345.7096774193548" r="3.7" fill="#20364b"/><text x="219.5967741935484" y="337.7096774193548" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="174.49193548387098" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="181.49193548387098" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El centro es (0,1/2),radio 1/2. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto de tangencia interior T</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">satisface x²+(y−1/2)²=1/4 y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(P−T)·(T−centro)=0.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La solución distinta de N es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T=(2/5,1/5). Así RT=(−3/5,1/5).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como A=(−1,0),B=(0,1),m=3/5,n=1/5;</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m+2n=1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>