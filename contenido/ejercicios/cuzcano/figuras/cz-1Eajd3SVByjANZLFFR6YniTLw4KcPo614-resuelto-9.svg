<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">009 · Ángulo de cruce entre una bisectriz y un lado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,333.43 208.19,205.57 255.13,261.51 315.48,333.43 100.90,333.43" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="208.19,205.57 375.10,205.57 315.48,333.43" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,333.43 255.13,261.51 375.10,205.57" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="333.42927571479817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="208.18928915388724" y="205.57072428520183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="315.47535250132285" y="333.42927571479817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="375.09677419354836" y="205.57072428520183" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="255.12979780048676" y="261.51224410298636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="346.7732534698254" y="212.8661765928275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">25°</text><text x="363.08073509863556" y="230.8902352351966" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">40°</text><text x="233.2434408776099" y="261.51224410298636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En PEN, el ángulo en P es P/2 y el de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">N es 90°+N/2. Por suma de ángulos,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠PEN=A/2=40°. Así A=80°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como AE biseca el exterior de A,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠NAE=(180°−80°)/2=50°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En AME, x es el ángulo exterior en M.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma ∠MAE=50° y ∠AEM=25°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>