<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">153 · Recta que forma un triángulo de área conocida</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="368.67697746354395" x2="421" y2="368.67697746354395" stroke="#20364b" stroke-width="1.7"/><line x1="243.63411400795405" y1="105" x2="243.63411400795405" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polygon points="130.95,368.68 243.63,368.68 243.63,264.28" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,396.52 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">f(x)</text><circle cx="130.95183384887318" cy="368.67697746354395" r="3.7" fill="#20364b"/><text x="137.95183384887318" y="360.67697746354395" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−3,0)</text><circle cx="243.63411400795405" cy="264.2801590808661" r="3.7" fill="#20364b"/><text x="250.63411400795405" y="256.2801590808661" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,2)</text><circle cx="356.31639416703496" cy="159.88334069818825" r="3.7" fill="#20364b"/><text x="363.31639416703496" y="151.88334069818825" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(3,4)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los cortes son (−b/a,0) y (0,b). El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área es b²/(2a)=3, así a=b²/6.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De f(3)=4 resulta 3a+b=4, que al</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sustituir da b²+2b−8=0.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La raíz positiva es b=2. Entonces</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a=2/3 y la diferencia es 2/3−2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>