<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Cubo entre dos capas densas bajo agua</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,178.10 100.90,360.90 375.10,360.90 375.10,178.10" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,198.67 375.10,198.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,229.51 375.10,229.51" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,298.06 375.10,298.06" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="192.30,229.51 263.71,229.51 263.71,332.34 192.30,332.34 192.30,229.51" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="337.3951612903226" y="215.2325268817204" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="337.3951612903226" y="266.64381720430106" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1,2 g/cm³</text><text x="337.3951612903226" y="323.1962365591398" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">1,5 g/cm³</text><text x="227.7177419354839" y="260.93145161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2H/3</text><text x="227.7177419354839" y="314.627688172043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H/3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza de empuje suma los pesos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desplazados en las dos capas que</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ocupan volumen del cubo.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como el área transversal es constante,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las fracciones de volumen son 2/3 y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al igualar empuje y peso y cancelar</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">gV, queda ρ_cubo = (2/3)×1,2 +</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1/3)×1,5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>