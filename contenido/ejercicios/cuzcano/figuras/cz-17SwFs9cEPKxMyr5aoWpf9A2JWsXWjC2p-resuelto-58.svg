<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Dos faros y diferencia de alturas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="127.43,301.09 100.90,327.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="127.43,301.09 375.10,353.62" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,327.61 375.10,353.62" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="100.90,327.61 100.90,185.38" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="375.10,353.62 375.10,193.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,185.38 375.10,193.66" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="127.43,301.09 100.90,185.38" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="127.43,301.09 375.10,193.66" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="134.42960770312655" y="293.08724834607244" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="107.90322580645163" y="319.6136302427474" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="382.09677419354836" y="345.62270790464675" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="107.90322580645163" y="177.37729209535325" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><text x="382.09677419354836" y="185.66178635110631" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Diferencia de alturas=6√5·√5/30=1m.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si Aaltura h,Baltura h+1,los rumbos</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendiculares dan</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">h²cot²53+(h+1)²cot²37=180.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resolver la cuadrática positiva. La</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">convención3–4–5 da 8m y9m;los ángulos</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exactos cambian ligeramente esos</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valores.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>