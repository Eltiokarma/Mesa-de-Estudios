<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">024 · Inclinación determinada por dos puntos medios</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="107.54,342.56 107.54,198.34 367.51,198.34 367.51,342.56 107.54,342.56" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="107.54,342.56 300.14,198.34 367.51,342.56" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="236.58,198.34 334.30,270.45" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="166.84,194.55 166.84,202.14" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="301.09,194.55 301.09,202.14" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="101.37760910815939" y="350.61954459203037" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="100.90322580645162" y="187.90607210626186" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="373.19924098671726" y="188.8548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.09677419354836" y="351.09392789373817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="236.57685009487668" y="187.90607210626186" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="303.93927893738135" y="187.90607210626186" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="343.31309297912713" y="272.3462998102467" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="257.44971537001896" y="205.9326375711575" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="121.30170777988616" y="326.4259962049336" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">56°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea w el ancho, h el alto y m la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia horizontal de A a M. Con</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">origen en A, N=(w/2,h) y</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">R=((m+w)/2,h/2).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así NR tiene desplazamiento horizontal</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m/2 y descenso h/2. Forma con la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal el mismo ángulo agudo que</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AM.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AM forma 56° con AB, que es vertical.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su ángulo con la horizontal mide</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">90°−56°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>