<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">068 · Fórmula del ácido pantoténico a partir del esqueleto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="108.14,281.81 137.10,252.85 166.05,281.81 195.00,252.85 223.96,281.81 252.91,252.85 281.87,281.81 310.82,252.85 339.77,281.81 368.73,252.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="166.05,281.81 154.47,316.55" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="166.05,281.81 177.63,316.55" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="195.00,252.85 195.00,228.24" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="221.64,281.81 221.64,307.86" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="226.27,281.81 226.27,307.86" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="337.46,281.81 337.46,307.86" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="342.09,281.81 342.09,307.86" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="100.90322580645162" y="289.0438907245291" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">HO</text><text x="195.00344040603602" y="222.4498927002078" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">OH</text><text x="223.95735259052356" y="313.65471608134345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="252.91126477501106" y="248.79795278809144" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">NH</text><text x="339.77300132847364" y="313.65471608134345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.0967741935484" y="247.63979630071194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">OH</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuenta nueve carbonos en los vértices</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y extremos, incluidas las dos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ramificaciones y los dos carbonilos.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cuenta cinco oxígenos, incluidos los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de tres grupos OH, y un nitrógeno de</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la amida.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completa las valencias. Los hidrógenos</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de los carbonos suman 13. Añade tres</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en OH y uno en NH.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>