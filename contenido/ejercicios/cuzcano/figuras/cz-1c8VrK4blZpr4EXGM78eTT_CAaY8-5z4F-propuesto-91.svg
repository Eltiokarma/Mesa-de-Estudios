<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">091 · Restaurar los acumulados antes de calcular el centro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130.0" width="126.66666666666667" height="41.42857142857143" fill="#dfedf8" stroke="#a3b9cc"/><text x="111.33333333333334" y="156.92857142857144" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Intervalo</text><rect x="174.66666666666669" y="130.0" width="126.66666666666667" height="41.42857142857143" fill="#dfedf8" stroke="#a3b9cc"/><text x="238.00000000000003" y="156.92857142857144" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">fᵢ</text><rect x="301.33333333333337" y="130.0" width="126.66666666666667" height="41.42857142857143" fill="#dfedf8" stroke="#a3b9cc"/><text x="364.6666666666667" y="156.92857142857144" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Fᵢ</text><rect x="48.0" y="171.42857142857144" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="198.3571428571429" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[10,16)</text><rect x="174.66666666666669" y="171.42857142857144" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="198.3571428571429" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="301.33333333333337" y="171.42857142857144" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="198.3571428571429" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">c</text><rect x="48.0" y="212.85714285714286" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="239.78571428571428" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[16,22)</text><rect x="174.66666666666669" y="212.85714285714286" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="239.78571428571428" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3a</text><rect x="301.33333333333337" y="212.85714285714286" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="239.78571428571428" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4a</text><rect x="48.0" y="254.28571428571428" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[22,28)</text><rect x="174.66666666666669" y="254.28571428571428" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">20</text><rect x="301.33333333333337" y="254.28571428571428" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="281.2142857142857" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">b</text><rect x="48.0" y="295.7142857142857" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[28,34)</text><rect x="174.66666666666669" y="295.7142857142857" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">6a</text><rect x="301.33333333333337" y="295.7142857142857" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">15a</text><rect x="48.0" y="337.14285714285717" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[34,40)</text><rect x="174.66666666666669" y="337.14285714285717" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><rect x="301.33333333333337" y="337.14285714285717" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2(b+2)</text><rect x="48.0" y="378.57142857142856" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">[40,46)</text><rect x="174.66666666666669" y="378.57142857142856" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">2c</text><rect x="301.33333333333337" y="378.57142857142856" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">—</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Distribución parcial</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De F₂=4a y f₂=3a se obtiene c=a. Luego</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F₄=4a+20+6a=15a, de modo que a=4 y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F₃=b=36.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">F₅=2(b+2)=76 y f₆=2c=8. Así N=84. La</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posición mediana 42 cae en la cuarta</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">clase [28,34), que tiene frecuencia</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">24.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La mediana es 28+6(42−36)/24=29,5. Las</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vecinas de la cuarta clase tienen</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frecuencias 20 y 16. La moda es</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">28+6(4/(4+8))=30.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>