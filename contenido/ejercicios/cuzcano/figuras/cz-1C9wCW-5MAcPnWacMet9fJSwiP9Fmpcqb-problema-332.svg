rt">línea3</text><line x1="375.09677419354836" y1="345.7096774193548" x2="366.4314300362422" y2="350.7008506917869" stroke="#008674" stroke-width="2"/><line x1="375.09677419354836" y1="345.7096774193548" x2="365.59633625752633" y2="342.58851112711824" stroke="#008674" stroke-width="2"/><circle cx="100.9032258064516" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><circle cx="375.09677419354836" cy="227.16129032258064" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="219.16129032258064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N</text><circle cx="237.99999999999997" cy="193.29032258064515" r="3.7" fill="#20364b"/><text x="244.99999999999997" y="185.29032258064515" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las líneas salen de positivas y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">terminan en negativas: I según la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">lectura de extremos del esquema.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las tangentes en 1 y2 difieren: II</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">falsa; mayor densidad cerca de 1 hace</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">III verdadera.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">No dibujar una línea por 3 no prueba</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">campo nulo: IV falsa. Son dos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">correctas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>