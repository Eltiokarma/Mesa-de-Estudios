<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">091 · Dos redes en serie que se reducen a un paralelo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,258.95 122.00,258.95 122.00,216.77 143.09,216.77" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="206.36,216.77 227.45,216.77 227.45,258.95 248.55,258.95 248.55,216.77 269.64,216.77" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="339.24,216.77 354.00,216.77 354.00,258.95 375.10,258.95" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="122.00,258.95 122.00,269.50 143.09,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="206.36,269.50 227.45,269.50 227.45,258.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="122.00,269.50 122.00,322.23 143.09,322.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="206.36,322.23 227.45,322.23 227.45,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="248.55,258.95 248.55,269.50 269.64,269.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="339.24,269.50 354.00,269.50 354.00,258.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="248.55,269.50 248.55,322.23 269.64,322.23" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="339.24,322.23 354.00,322.23 354.00,269.50" fill="none" stroke="#008674" stroke-width="2.5"/><text x="174.72456575682384" y="216.77047146401983" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(p∨¬q)∧(q∨¬p)</text><text x="176.83374689826303" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">¬p∧q</text><text x="176.83374689826303" y="322.22952853598014" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">¬q∧p</text><text x="307.6029776674938" y="216.77047146401983" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">(p∨¬q)∧q</text><text x="307.6029776674938" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">¬p∧q</text><text x="307.6029776674938" y="322.22952853598014" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">p</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la primera red, las dos ramas</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inferiores forman la negación de la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rama superior. Su disyunción es</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verdadera.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la segunda, (p∨¬q)∧q se reduce a</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">p∧q. Al combinar p∧q con ¬p∧q se</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">obtiene q y queda p∨q.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La conexión en serie da V∧(p∨q)=p∨q.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se representa con dos interruptores en</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>