<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">024 · Rango de una forma cuadrática en seno y coseno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="191.3135464403065" x2="421" y2="191.3135464403065" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="100.90,386.78 105.47,381.03 110.04,374.06 114.61,365.94 119.18,356.76 123.75,346.63 128.32,335.66 132.89,323.96 137.46,311.66 142.03,298.90 146.60,285.82 151.17,272.56 155.74,259.27 160.31,246.09 164.88,233.16 169.45,220.63 174.02,208.64 178.59,197.32 183.16,186.78 187.73,177.16 192.30,168.54 196.87,161.03 201.44,154.71 206.01,149.65 210.58,145.90 215.15,143.50 219.72,142.48 224.29,142.86 228.86,144.62 233.43,147.75 238.00,152.22 242.57,157.97 247.14,164.94 251.71,173.06 256.28,182.24 260.85,192.37 265.42,203.34 269.99,215.04 274.56,227.34 279.13,240.10 283.70,253.18 288.27,266.44 292.84,279.73 297.41,292.91 301.98,305.84 306.55,318.37 311.12,330.36 315.69,341.68 320.26,352.22 324.83,361.84 329.40,370.46 333.97,377.97 338.54,384.29 343.11,389.35 347.68,393.10 352.25,395.50 356.82,396.52 361.39,396.14 365.96,394.38 370.53,391.25 375.10,386.78" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica las identidades de ángulo</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">doble. Se obtiene −4−6cos 2x+(5/2)sen</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La parte sinusoidal tiene amplitud</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√(36+25/4)=13/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma y resta esa amplitud al</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desplazamiento −4. Ambos extremos son</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">alcanzables.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>