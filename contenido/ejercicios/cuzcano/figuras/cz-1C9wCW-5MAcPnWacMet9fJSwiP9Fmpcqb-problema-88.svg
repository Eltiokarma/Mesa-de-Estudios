<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">088 · Lluvia vista desde un auto</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.4838709677419" x2="421" y2="142.4838709677419" stroke="#20364b" stroke-width="1.7"/><line x1="333.26209677419354" y1="105" x2="333.26209677419354" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">vx relativo (m/s)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">vy relativo (m/s)</text><polyline points="333.26,142.48 333.26,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">lluvia/suelo</text><line x1="333.26209677419354" y1="396.5161290322581" x2="329.18449224359784" y2="387.385239629135" stroke="#1766b0" stroke-width="2"/><line x1="333.26209677419354" y1="396.5161290322581" x2="337.33970130478923" y2="387.385239629135" stroke="#1766b0" stroke-width="2"/><polyline points="333.26,142.48 142.74,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">lluvia/auto</text><line x1="142.73790322580646" y1="396.5161290322581" x2="144.95435324320374" y2="386.76485479140223" stroke="#d37618" stroke-width="2"/><line x1="142.73790322580646" y1="396.5161290322581" x2="151.47852049215686" y2="391.6579802281171" stroke="#d37618" stroke-width="2"/><circle cx="142.73790322580646" cy="396.5161290322581" r="3.7" fill="#20364b"/><text x="149.73790322580646" y="388.5161290322581" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">modelo notable</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Respecto al auto, la lluvia tiene</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">componente horizontal −u y vertical</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">−24 m/s.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan37°=u/24.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">u=24tan37°≈18,09 m/s; usando la razón</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">notable 3/4, resulta 18 m/s.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>