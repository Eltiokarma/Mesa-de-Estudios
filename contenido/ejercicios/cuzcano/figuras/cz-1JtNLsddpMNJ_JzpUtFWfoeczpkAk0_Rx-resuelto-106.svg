<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">106 · Enfoque con la lente a mitad de camino</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="234.64,208.43 245.02,238.97 248.08,269.50 245.02,300.03 234.64,330.57 224.26,300.03 221.21,269.50 224.26,238.97 234.64,208.43" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="127.77,269.50 127.77,240.80" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="341.51,269.50 341.51,298.20" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="127.77,240.80 234.64,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="127.77,240.80 234.64,240.80 341.51,298.20" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="341.51,214.54 341.51,324.46" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="234.64,269.50 341.51,298.20" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="127.77297219627849" y="228.58470436094547" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Objeto</text><text x="341.5095912062648" y="309.19394353042605" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Imagen</text><text x="251.12953516775633" y="209.0430706228896" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Lente</text><text x="181.20712694877506" y="284.76690135785617" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L/2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La distancia objeto–lente y la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia lente–imagen valen L/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En la ecuación de lentes, 1/f =</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/(L/2) + 1/(L/2) = 4/L.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Invierte para hallar f = L/4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>