<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">020 · Área entre las dos normales desde un punto equidistante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="321.94,245.27 321.94,342.19 238.00,196.81" fill="#f4c581" fill-opacity="0.45"/><polygon points="128.88,361.22 212.82,215.83 263.18,177.78 179.24,323.17" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,361.22 324.73,361.22 375.10,323.17 151.27,323.17 100.90,361.22" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="128.88,361.22 212.82,215.83 263.18,177.78 179.24,323.17 128.88,361.22" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="321.94,245.27 321.94,342.19 238.00,196.81 321.94,245.27 154.06,342.19" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="154.06,342.19 321.94,342.19" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="154.06,342.19 238.00,196.81" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="321.93680052666224" y="245.26953281050785" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="321.93680052666224" y="342.1914015684766" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="237.99999999999997" y="196.80859843152345" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="154.06319947333773" y="342.1914015684766" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una sección perpendicular a la arista</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">muestra un isósceles con AB=AC. El</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo BAC es suplementario al ángulo</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de la abertura que contiene A.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si A está en una abertura de 60°,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BAC=120° y la altura sobre BC es</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3cot60°=√3. En la abertura de 120°,</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BAC=60° y la altura es 3√3.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica cada altura por 6/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>