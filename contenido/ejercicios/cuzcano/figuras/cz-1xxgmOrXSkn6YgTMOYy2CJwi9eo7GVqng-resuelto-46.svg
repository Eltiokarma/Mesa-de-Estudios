="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="253.55775979166862" y="174.50444368430098" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="186.28847818516465" y="301.17136345102324" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="277.5136760821888" y="284.8321303070368" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="278.00597356281094" y="371.735436659507" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="136.19867342030852" y="228.56318858038264" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">55°</text><text x="229.0245360578666" y="356.6088162535683" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">70°</text><text x="229.25255383467015" y="313.6447406040628" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4√2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo inscrito CTM vale 35°.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe α=∠CMT. Por la cuerda CT, el</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo entre RT y TC en T también vale</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo en C del triángulo RTC es el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">exterior de CTM en C y vale 35°+α. Por</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suma, 55°+35°+2α=180°, así que α=45°.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el triángulo COM los catetos son</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">iguales y CM es su hipotenusa.</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica CO por √2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>