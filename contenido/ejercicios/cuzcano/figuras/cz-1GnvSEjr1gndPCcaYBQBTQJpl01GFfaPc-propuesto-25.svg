<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">025 · Corriente mínima según caras de bloque</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="146.60,338.05 375.10,338.05 375.10,261.88 146.60,261.88 146.60,338.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">frente</text><polyline points="100.90,277.12 329.40,277.12 329.40,200.95 100.90,200.95 100.90,277.12" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">fondo</text><polyline points="146.60,338.05 100.90,277.12 329.40,277.12 375.10,338.05 375.10,261.88 329.40,200.95 100.90,200.95 146.60,261.88" fill="none" stroke="#008674" stroke-width="2.5"/><text x="73" y="490" font-family="Arial,sans-serif" font-size="11" fill="#008674" text-anchor="start">aristas</text><circle cx="375.09677419354836" cy="338.04838709677415" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="330.04838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3ℓ</text><circle cx="100.90322580645163" cy="277.1164874551971" r="3.7" fill="#20364b"/><text x="107.90322580645163" y="269.1164874551971" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2ℓ</text><circle cx="146.60215053763443" cy="261.8835125448029" r="3.7" fill="#20364b"/><text x="153.60215053763443" y="253.8835125448029" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">ℓ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para corriente mínima elegir máxima</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resistencia, dirección de mayor</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">longitud 3ℓ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Rmax=ρ·3ℓ/(2ℓ²)=3ρ/(2ℓ)=10⁻⁴ Ω.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Imin=0,005/10⁻⁴=50 A.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>