<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">008 · Comunicación de dos recipientes</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,237.24 100.90,317.89 181.55,317.89 181.55,237.24 100.90,237.24" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="270.26,221.11 270.26,317.89 375.10,317.89 375.10,221.11 270.26,221.11" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="181.55,277.56 270.26,277.56" fill="none" stroke="#008674" stroke-width="2.5"/><text x="107.90322580645162" y="184.88709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A: 2 L; 2 atm</text><text x="269.1935483870968" y="180.85483870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B: 3 L; 1 atm</text><text x="148.22580645161293" y="342.14516129032256" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">final: 1,4 atm</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con volúmenes rígidos, tubo de volumen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">despreciable y temperatura final igual</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">a la inicial, se conserva n₁+n₂.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pf(V₁+V₂)=P₁V₁+P₂V₂; no se toma la</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">media aritmética simple de las</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">presiones.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pf=(2·2+1·3)/(2+3)=7/5=1,4 atm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>