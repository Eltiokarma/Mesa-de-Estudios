<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Tres diámetros y suma mínima</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,269.50 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="142.03,173.53 333.97,365.47" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="142.03,365.47 333.97,173.53" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="238.0" cy="269.5" r="3.7" fill="#20364b"/><text x="245.0" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><circle cx="100.90322580645162" cy="269.5" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><circle cx="375.0967741935484" cy="269.5" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">10</text><circle cx="142.03225806451616" cy="173.5322580645161" r="3.7" fill="#20364b"/><text x="149.03225806451616" y="165.5322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><circle cx="333.9677419354839" cy="365.4677419354839" r="3.7" fill="#20364b"/><text x="340.9677419354839" y="357.4677419354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">8</text><circle cx="142.03225806451616" cy="365.4677419354839" r="3.7" fill="#20364b"/><text x="149.03225806451616" y="357.4677419354839" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5</text><circle cx="333.9677419354839" cy="173.5322580645161" r="3.7" fill="#20364b"/><text x="340.9677419354839" y="165.5322580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">6</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea c el centro. Tres sumas cuentan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una vez extremos y tres veces</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">c:3S=37+2c.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para c=1 se obtiene S=13 y las</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">parejas3+10,4+9 no existen; se prueba</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la siguiente posibilidad.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con c=4, S=15, parejas1+10,3+8,5+6:</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sí. El mínimo alcanzable es15.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>