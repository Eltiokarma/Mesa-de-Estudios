<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">025 · Dos parámetros fijados por un punto y un paralelismo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="209.13,269.50 266.87,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="226.45,396.52 226.45,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="224.14,148.26 247.81,384.97" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="217.79,144.41 242.62,392.67" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="240.30938416422285" y="288.55241935483866" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye P en la primera recta.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta 2a+b=12.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala las pendientes −a/2 y (b−2)/3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Esto da 3a+2b=4.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elimina b con el doble de la primera</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ecuación. Se obtiene a=20 y b=−28.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>