<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">500 · Separación de objeto e imagen virtual</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="210.58064516129033" y1="105" x2="210.58064516129033" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">posición (cm)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">altura relativa</text><polyline points="210.58,396.52 210.58,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="480" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">espejo</text><polyline points="100.90,269.50 100.90,195.87" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="248" y="480" font-family="Arial,sans-serif" font-size="12" fill="#d37618" text-anchor="start">objeto</text><line x1="100.90322580645162" y1="195.86746143057502" x2="104.98083033704732" y2="204.9983508336981" stroke="#d37618" stroke-width="2"/><line x1="100.90322580645162" y1="195.86746143057502" x2="96.82562127585591" y2="204.9983508336981" stroke="#d37618" stroke-width="2"/><polyline points="375.10,269.50 375.10,159.05" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="73" y="498" font-family="Arial,sans-serif" font-size="12" fill="#008674" text-anchor="start">imagen virtual</text><line x1="375.0967741935484" y1="159.05119214586256" x2="379.1743787241441" y2="168.18208154898565" stroke="#008674" stroke-width="2"/><line x1="375.0967741935484" y1="159.05119214586256" x2="371.0191696629527" y2="168.18208154898565" stroke="#008674" stroke-width="2"/><polyline points="100.90,220.41 210.58,195.87 100.90,195.87 210.58,269.50 100.90,343.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="248" y="498" font-family="Arial,sans-serif" font-size="12" fill="#b0467a" text-anchor="start">rayos reflejados</text><polyline points="210.58,195.87 375.10,159.05 210.58,269.50" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><text x="73" y="516" font-family="Arial,sans-serif" font-size="12" fill="#1766b0" text-anchor="start">prolongaciones virtuales</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f=30 cm y m=+1,5, por lo que v=−1,5u.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/30=1/u−1/(1,5u)=1/(3u), así u=10</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cm,v=−15 cm.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Objeto e imagen están en lados</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">opuestos del espejo:</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">separación=u+∣v∣=25 cm.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>