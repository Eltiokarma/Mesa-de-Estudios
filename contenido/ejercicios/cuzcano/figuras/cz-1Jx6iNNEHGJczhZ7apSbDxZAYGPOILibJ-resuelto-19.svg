01.82,354.13 305.92,349.55 309.64,344.77 312.96,339.80 315.86,334.67 318.34,329.40 320.38,324.01 321.98,318.53 323.13,312.97 323.82,307.37 324.05,301.74" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="194.98,142.48 367.07,314.58" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="151.95,396.52 367.07,181.39" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="132.50,247.99 300.48,355.50" fill="none" stroke="#b0467a" stroke-width="2.5"/><circle cx="300.4791738599896" cy="247.98768160924385" r="3.7" fill="#20364b"/><text x="307.4791738599896" y="239.98768160924385" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="349.86405563193193" cy="297.3725633811862" r="3.7" fill="#20364b"/><text x="356.86405563193193" y="289.3725633811862" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">tangente</text><circle cx="173.46304482773158" cy="375.0038106415019" r="3.7" fill="#20364b"/><text x="180.46304482773158" y="367.0038106415019" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">normal</text><circle cx="151.95072643697546" cy="260.43858533946934" r="3.7" fill="#20364b"/><text x="158.95072643697546" y="252.43858533946934" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">diámetro</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La tangente tiene pendiente −1. La</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal en T=(u,v) tiene dirección</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(u/25,v/16), así que u/25=v/16.</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye en la elipse para obtener</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">T=(25,16)/√41.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por T, la tangente es x+y=√41. La</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">normal tiene pendiente 1 y ecuación</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x−y=9/√41.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El diámetro conjugado a la dirección</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de pendiente 1 tiene pendiente −16/25,</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de donde 16x+25y=0.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>