<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">100 · Cateto en función del ángulo de una mediana</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.03,216.69 109.03,307.41 366.30,307.41 109.03,216.69" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="109.03,216.69 237.66,307.41" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="228.20171246515332" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="109.02747909199522" y="295.2268020708881" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="318.9225408203903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="109.02747909199522" y="322.30764635603344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="237.6614894464357" y="318.9225408203903" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="212.61170848267625" y="297.257865392274" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">u</text><text x="123.92194344882517" y="240.38809239346872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2u</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea u = ∠AMB. Por el triángulo ABM,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tan u = 2AB/BC. En ABC, tan 2u = BC/AB</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= 2/tan u.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala con 2 tan u/(1 − tan²u).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta tan²u = 1/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces cos 2u = (1 − 1/2)/(1 + 1/2)</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= 1/3. Por tanto AB = AC/3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>