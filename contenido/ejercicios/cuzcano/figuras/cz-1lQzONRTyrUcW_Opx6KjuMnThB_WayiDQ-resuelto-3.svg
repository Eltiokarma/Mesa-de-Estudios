<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">003 · Distancia mínima entre un segmento oblicuo y una arista vertical</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="106.76,396.52 287.78,396.52 287.78,215.50 369.24,153.95 188.22,153.95 106.76,215.50 287.78,215.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="106.76,215.50 106.76,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="369.24,153.95 369.24,334.97 287.78,396.52" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="188.22,153.95 347.86,153.95" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="106.76,396.52 347.86,153.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="287.78,215.50 287.78,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="226.37,276.18 287.78,306.72" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="106.76,396.52 188.22,334.97 347.86,334.97 369.24,334.97" fill="none" stroke="#b0467a" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="188.22,334.97 188.22,153.95" fill="none" stroke="#1766b0" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="347.86,334.97 347.86,153.95" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><polyline points="106.76,396.52 226.37,365.98 347.86,334.97" fill="none" stroke="#008674" stroke-width="2.5" stroke-dasharray="6 5"/><text x="106.76005670063599" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="188.2193318519654" y="334.96912114014253" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="369.23994329936403" y="334.96912114014253" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">G</text><text x="287.78066814803464" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="106.76005670063599" y="215.49551758485939" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="188.2193318519654" y="153.94850969274393" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="369.23994329936403" y="153.94850969274393" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="287.78066814803464" y="215.49551758485939" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="347.86450520752163" y="153.94850969274393" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="347.86450520752163" y="334.96912114014253" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="226.36675871449808" y="365.9839896280079" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="268.0419185297435" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">√7</text><text x="147.48969427630067" y="175.0675810282737" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Proyecta R en I sobre la base. DH se</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proyecta a H y RE a EI. El punto de RE</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que proyecta al pie de H sobre EI</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">puede emparejarse con un punto de DH a</text><text x="482" y="185" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">su misma altura.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con E=(0,0), H=(3,0) e I=(√7,3) en la</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">base, EI=4. El área de EIH vale 9/2</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">usando EH como base.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al usar EI como base, la altura es</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">9/4. El pie cae en EI porque el</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">parámetro de proyección es 3√7/16,</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entre 0 y 1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>