<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">058 · Frecuencias proporcionales a áreas de un histograma</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,380.13 375.10,380.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,380.13 100.90,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,380.13 100.90,303.30 163.22,303.30 163.22,380.13" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="163.22,380.13 163.22,175.26 225.54,175.26 225.54,380.13" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="225.54,380.13 225.54,226.48 287.85,226.48 287.85,380.13" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="287.85,380.13 287.85,328.91 350.17,328.91 350.17,380.13" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">160</text><text x="163.21994134897358" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">230</text><text x="225.53665689149557" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">300</text><text x="287.8533724340175" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">370</text><text x="350.17008797653955" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">440</text><text x="132.0615835777126" y="291.01079604578564" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A₁</text><text x="194.37829912023457" y="162.97034339229964" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A₂</text><text x="256.69501466275653" y="214.18652445369403" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A₃</text><text x="319.0117302052786" y="316.61888657648285" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A₄</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La amplitud es 70. Escribe las</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frecuencias en la proporción b, 4a,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2b, a, pues los anchos son iguales.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica la fórmula de la moda en</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[230,300). De 230+70(4a−b)/(8a−3b)=280</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resulta 80b=120a, así que b=3a/2.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las frecuencias son proporcionales a</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3, 8, 6 y 2. Pondera 195, 265, 335 y</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">405 por ellas.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>