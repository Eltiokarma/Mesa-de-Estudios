<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">054 · Último de la carrera</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,269.50 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><circle cx="110.98387096774192" cy="269.5" r="3.7" fill="#20364b"/><text x="117.98387096774192" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Ecuador</text><circle cx="153.32258064516128" cy="269.5" r="3.7" fill="#20364b"/><text x="160.32258064516128" y="241.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Perú</text><circle cx="195.66129032258064" cy="269.5" r="3.7" fill="#20364b"/><text x="202.66129032258064" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Bolivia</text><circle cx="238.0" cy="269.5" r="3.7" fill="#20364b"/><text x="245.0" y="241.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Brasil</text><circle cx="280.3387096774194" cy="269.5" r="3.7" fill="#20364b"/><text x="287.3387096774194" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Argentina</text><circle cx="322.6774193548387" cy="269.5" r="3.7" fill="#20364b"/><text x="329.6774193548387" y="241.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Colombia</text><circle cx="365.01612903225805" cy="269.5" r="3.7" fill="#20364b"/><text x="372.01612903225805" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Venezuela</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Todo atleta que debe preceder a otro</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">no puede ser último.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los únicos sin sucesor obligatorio son</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Bolivia,Venezuela,Colombia.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hay órdenes válidos que terminan en</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cada uno de ellos.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>