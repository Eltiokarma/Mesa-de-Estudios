<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Unitario en malla oblicua</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="129.1290322580645" y1="105" x2="129.1290322580645" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (geometría)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y (geometría)</text><polyline points="346.87,215.06 238.00,323.94" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">BC (dirección resultante)</text><line x1="238.0" y1="323.93548387096774" x2="241.57321200063151" y2="314.5956682411738" stroke="#1766b0" stroke-width="2"/><line x1="238.0" y1="323.93548387096774" x2="247.33981562979392" y2="320.36227187033626" stroke="#1766b0" stroke-width="2"/><circle cx="165.4193548387097" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="172.4193548387097" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><circle cx="346.8709677419355" cy="215.06451612903226" r="3.7" fill="#20364b"/><text x="353.8709677419355" y="207.06451612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="238.0" cy="323.93548387096774" r="3.7" fill="#20364b"/><text x="245.0" y="315.93548387096774" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">C</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC+BA=C−B,independiente de A.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La lectura de malla da C−B=−3μ1−3μ2;el</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">factor 1/2 no cambia dirección.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para ángulo φ entre</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ejes,unitario=−(μ1+μ2)/√(2+2cosφ);si</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son ortogonales,−(μ1+μ2)/√2. No</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coincide con las opciones.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>