<text x="212.1258067712524" y="138.81184061247723" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="205.1258067712524" cy="392.1881593875228" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="212.1258067712524" y="384.1881593875228" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="360.6881593875228" cy="236.6258067712524" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="367.6881593875228" y="228.6258067712524" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="360.6881593875228" cy="302.3741932287476" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="367.6881593875228" y="294.3741932287476" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="115.31184061247723" cy="236.6258067712524" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="122.31184061247723" y="228.6258067712524" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="115.31184061247723" cy="302.3741932287476" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="122.31184061247723" y="294.3741932287476" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La primera desigualdad equivale a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∣xy∣&gt;1. Los ejes quedan fuera y, para</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x≠0, se exige ∣y∣&gt;1/∣x∣.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dentro del disco debe cumplirse además</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∣y∣≤√(4−x²). Hay puntos cuando</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/x²&lt;4−x², o 2−√3&lt;x²&lt;2+√3.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sombrea una región por cuadrante. Se</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">incluye el arco de la circunferencia</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dentro de cada región y se excluyen</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">las hipérbolas y los puntos de cruce.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>