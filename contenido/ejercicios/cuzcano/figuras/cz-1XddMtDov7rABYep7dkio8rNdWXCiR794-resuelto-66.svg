one" stroke="#008674" stroke-width="2.5"/><polyline points="275.08,321.38 375.10,321.38 325.09,196.35 275.08,321.38" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="300.08,258.87 350.09,258.87" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="275.08,321.38 350.09,258.87" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="375.10,321.38 300.08,258.87" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="312.58,227.61 337.59,227.61" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="300.08,258.87 337.59,227.61" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="350.09,258.87 312.58,227.61" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="318.84,211.98 331.34,211.98" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="312.58,227.61 331.34,211.98" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="337.59,227.61 318.84,211.98" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="115.27,285.45 144.02,285.45 129.64,297.43 115.27,285.45" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="199.49,273.24 238.00,273.24 218.74,289.28 199.49,273.24" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="209.11,249.17 228.37,249.17 218.74,257.19 209.11,249.17" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="300.08,258.87 350.09,258.87 325.09,279.70 300.08,258.87" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="312.58,227.61 337.59,227.61 325.09,238.03 312.58,227.61" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="318.84,211.98 331.34,211.98 325.09,217.19 318.84,211.98" fill="none" stroke="#008674" stroke-width="2.5"/><text x="128.59707851491177" y="334.64702103198755" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F1</text><text x="217.69561100967067" y="334.64702103198755" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F2</text><text x="324.0390207614796" y="334.64702103198755" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F3</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las bases del trapecio son B y B/2; su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura es H/2. El cruce de diagonales</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda a (H/2)·(1/3)=H/6 de la base</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">menor.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La sombra del primer trapecio es</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(B/2)(H/6)/2=BH/24, que es 1/12 del</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área total BH/2.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo superior tiene 1/4 del</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área. La serie de sombras suma</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(1/12)/(1−1/4)=1/9 del total.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>