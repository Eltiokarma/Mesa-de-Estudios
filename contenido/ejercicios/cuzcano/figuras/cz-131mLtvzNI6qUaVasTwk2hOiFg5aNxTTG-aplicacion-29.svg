x="210.58064516129033" cy="244.09677419354836" r="3.7" fill="#20364b"/><text x="217.58064516129033" y="236.09677419354836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2, 3</text><circle cx="265.4193548387097" cy="244.09677419354836" r="3.7" fill="#20364b"/><text x="272.4193548387097" y="236.09677419354836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3, 3</text><circle cx="265.4193548387097" cy="193.29032258064512" r="3.7" fill="#20364b"/><text x="272.4193548387097" y="185.29032258064512" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3, 4</text><circle cx="320.258064516129" cy="193.29032258064512" r="3.7" fill="#20364b"/><text x="327.258064516129" y="185.29032258064512" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4, 4</text><circle cx="320.258064516129" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="327.258064516129" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4, 5</text><circle cx="375.0967741935484" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="382.0967741935484" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5, 5</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El impulso es la suma de áreas de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rectángulos de ancho 1 s.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">I=1+2+…+n=n(n+1)/2 N·s.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vf=I/20=n(n+1)/40 m/s. El redibujo</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ilustra n=5; la fórmula vale para n</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">entero positivo.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>