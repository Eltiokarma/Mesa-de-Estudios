<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Polinomio cuártico con una cotangente doble</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><text x="48" y="100" font-family="Arial,sans-serif" font-size="17" fill="#20364b" text-anchor="start">Un intervalo por período</text><line x1="60" y1="275" x2="425" y2="275" stroke="#8295a8" stroke-width="2"/><line x1="181.66666666666666" y1="275" x2="298.33333333333337" y2="275" stroke="#1766b0" stroke-width="6"/><circle cx="181.66666666666666" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><circle cx="298.33333333333337" cy="275" r="6" stroke="#1766b0" stroke-width="2" fill="#ffffff"/><text x="181.66666666666666" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">π/24</text><text x="298.33333333333337" y="310" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="middle">5π/24</text><text x="48" y="390" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo vacío: extremo excluido.</text><text x="48" y="415" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">Círculo lleno: extremo incluido.</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea t=tan x. El valor t=0 falla, así</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">que divide por t² y pon u=t−1/t=−2cot</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2x.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La desigualdad queda u²+8u+4&lt;0. Por</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sus raíces, −4−2√3&lt;u&lt;−4+2√3.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Equivale a 2−√3&lt;cot 2x&lt;2+√3. En cada</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rama decreciente de cotangente, 2x</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">queda entre π/12 y 5π/12 módulo π.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>