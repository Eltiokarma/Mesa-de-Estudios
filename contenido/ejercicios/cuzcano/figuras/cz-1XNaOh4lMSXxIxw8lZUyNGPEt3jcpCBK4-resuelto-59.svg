<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">059 · Diagonales desde un vértice</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="353.36,269.50 304.31,167.64 194.09,142.48 105.70,212.97 105.70,326.03 194.09,396.52 304.31,371.36 353.36,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="353.36,269.50 194.09,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="353.36,269.50 105.70,212.97" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="353.36,269.50 105.70,326.03" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="353.36,269.50 194.09,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="223.08,269.50 353.36,269.50" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="370.29993754547576" y="282.528258545599" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">V₀</text><text x="216.56648670740793" y="282.528258545599" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="293.43321212644184" y="259.0773931635208" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">r</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La cuerda al vértice j tiene longitud</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2r sen(jπ/n). Para diagonales, j va de</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2 a n−2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea t=π/n. Al multiplicar la suma de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">senos por 2sen(t/2), telescopa y queda</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos(3t/2)−cos((n−3/2)t)=2cos(3t/2).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como cos(3t/2)=sen((n−3)t/2), divide y</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">repón el factor 2r.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>