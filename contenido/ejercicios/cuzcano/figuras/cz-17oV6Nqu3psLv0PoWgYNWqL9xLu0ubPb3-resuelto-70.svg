<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">070 · Perpendicular a una ceviana con razón 2 a 1</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="151.01,330.00 324.99,330.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="298.78,396.52 298.78,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="177.22,330.00 258.26,222.46 298.78,168.69" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="258.26,222.46 298.78,330.00 191.81,370.31" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="324.30,330.00 324.19,332.37 323.87,334.71 323.32,337.01 322.57,339.25 321.61,341.42 320.46,343.48 319.11,345.43 317.60,347.25 315.92,348.92 314.10,350.42 312.14,351.75 310.07,352.90 307.90,353.84 305.66,354.59 303.35,355.12 301.01,355.43 298.64,355.53 296.28,355.41 293.94,355.07 291.64,354.51 289.40,353.75 287.24,352.77 285.18,351.61 283.24,350.26 281.43,348.73 279.77,347.05 278.28,345.21 276.96,343.25 275.83,341.17 274.89,339.00" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="298.77772139256604" y="330.0030692748823" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="177.22227860743396" y="330.0030692748823" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="298.77772139256604" y="168.69354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="258.2592404641887" y="222.46338868302527" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Q</text><text x="191.80893174164981" y="370.30645161290323" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="324.98739881192085" y="335.0433918555275" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="305.8341730054693" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="306.071047959674" y="362.823038826868" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma P=(−1,0), R=(0,k) con k=tan 53°.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La razón 2:1 da Q=(−1/3,2k/3).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La pendiente de OQ es −2k y la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">perpendicular tiene pendiente 1/(2k).</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así tan θ=1/(2k).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye para obtener 4/k−6k. La</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">convención escolar k≈4/3 produce −5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>