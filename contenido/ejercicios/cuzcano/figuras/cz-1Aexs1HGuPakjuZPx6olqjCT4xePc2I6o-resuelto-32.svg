tart">144</text><text x="244.99999999999997" y="330.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">169</text><text x="290.69892473118284" y="330.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">196</text><text x="336.3978494623656" y="330.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">225</text><text x="382.0967741935484" y="330.0483870967742" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">256</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Hasta fila n hay1+3+…+(2n−1)=n²</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">términos.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Fila n contiene los cuadrados de</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enteros(n−1)²+1 hasta n². El entero</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">central es n²−n+1,independiente del</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sentido.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La raíz pedida para n100</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es10000−100+1=9901.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>