<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">002 · Regla de un radical a partir de dos interceptos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="192.30107526881721" y1="105" x2="192.30107526881721" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 105.47,363.72 110.04,350.14 114.61,339.71 119.18,330.93 123.75,323.18 128.32,316.18 132.89,309.75 137.46,303.76 142.03,298.13 146.60,292.81 151.17,287.75 155.74,282.91 160.31,278.27 164.88,273.81 169.45,269.50 174.02,265.33 178.59,261.30 183.16,257.38 187.73,253.56 192.30,249.85 196.87,246.23 201.44,242.69 206.01,239.23 210.58,235.85 215.15,232.54 219.72,229.29 224.29,226.11 228.86,222.98 233.43,219.91 238.00,216.89 242.57,213.92 247.14,211.00 251.71,208.12 256.28,205.29 260.85,202.50 265.42,199.74 269.99,197.03 274.56,194.35 279.13,191.71 283.70,189.10 288.27,186.52 292.84,183.98 297.41,181.46 301.98,178.98 306.55,176.52 311.12,174.09 315.69,171.68 320.26,169.30 324.83,166.95 329.40,164.62 333.97,162.31 338.54,160.02 343.11,157.76 347.68,155.52 352.25,153.30 356.82,151.10 361.39,148.92 365.96,146.75 370.53,144.61 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">F(x)</text><circle cx="100.90322580645162" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="107.90322580645162" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−2,0)</text><circle cx="192.30107526881721" cy="249.8505364558612" r="3.7" fill="#20364b"/><text x="199.30107526881721" y="241.8505364558612" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entre las opciones radicales, el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">radicando debe anularse en x=−2 y ser</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">positivo a la derecha.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe F(x)=√[a(x+2)] con a&gt;0. En x=0</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la ordenada es 2, así que 2a=4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resulta a=2 y la fórmula √(2x+4)</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verifica ambos puntos y la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">orientación.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>