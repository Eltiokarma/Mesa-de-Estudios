312.38 364.66,306.60 367.82,300.66 370.43,294.59 372.46,288.41 373.92,282.15 374.80,275.84 375.10,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><circle cx="356.72928922851173" cy="317.9710293555295" r="3.7" fill="#20364b"/><text x="363.72928922851173" y="309.9710293555295" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P(√6,−1)</text><circle cx="334.94205871105896" cy="200.9516129032258" r="3.7" fill="#20364b"/><text x="341.94205871105896" y="192.9516129032258" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">N(2,√2)</text><circle cx="141.05794128894107" cy="269.5" r="3.7" fill="#20364b"/><text x="148.05794128894107" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F₁</text><circle cx="334.94205871105896" cy="269.5" r="3.7" fill="#20364b"/><text x="341.94205871105896" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">F₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Pon A=1/a² y B=1/b². Los puntos dan</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">6A+B=1 y 4A+2B=1.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Duplica la primera ecuación y resta la</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segunda. Obtienes 8A=1. Entonces</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">B=1−6/8=1/4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los denominadores son 8 y 4. El mayor</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">corresponde a X como exige el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">enunciado.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>