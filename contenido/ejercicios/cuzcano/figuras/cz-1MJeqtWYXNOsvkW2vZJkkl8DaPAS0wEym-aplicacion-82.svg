<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">082 · Dos segmentos perpendiculares de un alambre</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,319.37 247.86,209.16 375.10,378.83" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="247.86,209.16 247.86,160.17" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="159.69,209.16 336.03,209.16" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="231.33,221.40 243.57,237.94 260.10,225.69" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="151.72516532438155" y="261.8154778198793" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ℓ₁</text><text x="341.5420478612284" y="310.80047976487197" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ℓ₂</text><text x="188.46391678312608" y="220.7905386909479" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los pesos son proporcionales a ℓ₁ y ℓ₂</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y se aplican en sus puntos medios.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sus brazos horizontales respecto del</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértice son (ℓ₁/2)cos 37° y (ℓ₂/2)sen</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">37°. Los momentos se oponen.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al igualarlos resulta (ℓ₁/ℓ₂)²=tan</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">37°. Con tan 37°≈3/4 se obtiene la</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">relación del libro.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>