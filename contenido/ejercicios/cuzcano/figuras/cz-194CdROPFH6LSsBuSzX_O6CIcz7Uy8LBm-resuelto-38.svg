<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">038 · Recta por el vértice y segundo corte</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="354.1774193548387" x2="421" y2="354.1774193548387" stroke="#20364b" stroke-width="1.7"/><line x1="169.19959677419354" y1="105" x2="169.19959677419354" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="306.80,396.52 300.56,392.28 294.52,388.05 288.70,383.81 283.09,379.58 277.69,375.35 272.51,371.11 267.53,366.88 262.77,362.65 258.22,358.41 253.88,354.18 249.75,349.94 245.83,345.71 242.13,341.48 238.64,337.24 235.35,333.01 232.28,328.77 229.43,324.54 226.78,320.31 224.35,316.07 222.12,311.84 220.11,307.60 218.31,303.37 216.72,299.14 215.35,294.90 214.18,290.67 213.23,286.44 212.49,282.20 211.96,277.97 211.64,273.73 211.54,269.50 211.64,265.27 211.96,261.03 212.49,256.80 213.23,252.56 214.18,248.33 215.35,244.10 216.72,239.86 218.31,235.63 220.11,231.40 222.12,227.16 224.35,222.93 226.78,218.69 229.43,214.46 232.28,210.23 235.35,205.99 238.64,201.76 242.13,197.52 245.83,193.29 249.75,189.06 253.88,184.82 258.22,180.59 262.77,176.35 267.53,172.12 272.51,167.89 277.69,163.65 283.09,159.42 288.70,155.19 294.52,150.95 300.56,146.72 306.80,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="169.20,354.18 169.20,269.50 253.88,269.50 253.88,354.18 169.20,354.18" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="169.20,354.18 270.81,150.95" fill="none" stroke="#008674" stroke-width="2.5"/><circle cx="169.19959677419354" cy="354.1774193548387" r="3.7" fill="#20364b"/><text x="176.19959677419354" y="346.1774193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><circle cx="169.19959677419354" cy="269.5" r="3.7" fill="#20364b"/><text x="176.19959677419354" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><circle cx="211.5383064516129" cy="269.5" r="3.7" fill="#20364b"/><text x="218.5383064516129" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">T</text><circle cx="253.87701612903226" cy="269.5" r="3.7" fill="#20364b"/><text x="260.87701612903226" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">E</text><circle cx="253.87701612903226" cy="354.1774193548387" r="3.7" fill="#20364b"/><text x="260.87701612903226" y="346.1774193548387" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">S</text><circle cx="253.87701612903226" cy="184.82258064516125" r="3.7" fill="#20364b"/><text x="260.87701612903226" y="176.82258064516125" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">R</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El lado del cuadrado es 2 y T=(1,2).</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con S=(2,0), la parábola cumple</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(y−2)²=4(x−1).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta OT es y=2x. Sustituye y</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">divide por 4 para obtener (x−1)²=x−1.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las raíces son x=1 y x=2. El segundo</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">punto tiene y=4.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>