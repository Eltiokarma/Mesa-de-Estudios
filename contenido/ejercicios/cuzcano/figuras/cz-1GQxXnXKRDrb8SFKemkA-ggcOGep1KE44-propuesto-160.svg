<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">160 · Rango de una parábola sobre un intervalo cerrado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="142.48387096774195" x2="421" y2="142.48387096774195" stroke="#20364b" stroke-width="1.7"/><line x1="100.9032258064516" y1="105" x2="100.9032258064516" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="100.90,396.52 105.47,390.92 110.04,385.41 114.61,380.00 119.18,374.69 123.75,369.47 128.32,364.34 132.89,359.31 137.46,354.37 142.03,349.52 146.60,344.77 151.17,340.11 155.74,335.55 160.31,331.08 164.88,326.70 169.45,322.42 174.02,318.24 178.59,314.14 183.16,310.15 187.73,306.24 192.30,302.43 196.87,298.71 201.44,295.09 206.01,291.56 210.58,288.13 215.15,284.79 219.72,281.54 224.29,278.39 228.86,275.33 233.43,272.37 238.00,269.50 242.57,266.72 247.14,264.04 251.71,261.46 256.28,258.96 260.85,256.56 265.42,254.26 269.99,252.05 274.56,249.93 279.13,247.91 283.70,245.98 288.27,244.14 292.84,242.40 297.41,240.76 301.98,239.20 306.55,237.75 311.12,236.38 315.69,235.11 320.26,233.94 324.83,232.85 329.40,231.87 333.97,230.97 338.54,230.17 343.11,229.47 347.68,228.85 352.25,228.34 356.82,227.91 361.39,227.58 365.96,227.35 370.53,227.21 375.10,227.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">f(x)</text><circle cx="100.9032258064516" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="107.9032258064516" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,−6)</text><circle cx="375.09677419354836" cy="227.16129032258064" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="219.16129032258064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2,−2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Completa cuadrado: f(x)=−(x−2)²−2.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En 0≤x≤2, el cuadrado disminuye de 4 a</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">0. Por tanto f aumenta de −6 a −2.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La continuidad da todos los valores</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">intermedios y ambos extremos se</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">incluyen.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>