font-size="15.833333333333334" fill="#20364b" text-anchor="middle">Antes</text><rect x="111.33333333333334" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">3</text><rect x="174.66666666666669" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="206.33333333333334" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">−4</text><rect x="238.0" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="269.6666666666667" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">0</text><rect x="301.33333333333337" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.00000000000006" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">2</text><rect x="364.6666666666667" y="178" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="396.33333333333337" y="209.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">−5</text><rect x="48.0" y="226" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="79.66666666666667" y="257.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">Después</text><rect x="111.33333333333334" y="226" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="257.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">5</text><rect x="174.66666666666669" y="226" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="206.33333333333334" y="257.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">−2</text><rect x="238.0" y="226" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="269.6666666666667" y="257.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">0</text><rect x="301.33333333333337" y="226" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.00000000000006" y="257.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">4</text><rect x="364.6666666666667" y="226" width="63.333333333333336" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="396.33333333333337" y="257.2" font-family="Arial,sans-serif" font-size="15.833333333333334" fill="#20364b" text-anchor="middle">−3</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Cálculo de los coeficientes</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El término constante −5 asegura que</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ninguna raíz sea cero. Para y=1/r,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">evalúa P(1/y).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplicar por y⁴ invierte los</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">coeficientes, incluido el cero del</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">grado dos.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se obtiene −5y⁴+2y³−4y+3. Cambiar</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">todos los signos conserva las raíces.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>