<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">097 · Tiempo de mezcla SO3/SO2</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,214.66 375.10,214.66 375.10,167.66 100.90,167.66 100.90,214.66" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,293.00 375.10,293.00 375.10,246.00 100.90,246.00 100.90,293.00" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,371.34 375.10,371.34 375.10,324.34 100.90,324.34 100.90,371.34" fill="none" stroke="#008674" stroke-width="2.5"/><text x="115.73732718894009" y="183.15898617511522" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Graham:igual P y T</text><text x="115.73732718894009" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">r ∝ 1/√M</text><text x="115.73732718894009" y="339.8410138248848" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">tiempo=volumen/rapidez</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Masas iguales dan xSO3=4/9 y xSO2=5/9.</text><text x="482" y="131" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sumar flujos molares: rmezcla/rO2=√32·</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">[(4/9)/√80+(5/9)/√64]≈0,6739.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para igual volumen</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">t=120/(rmezcla/rO2)≈178,1 s. Usar masa</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">media da≈178,9 s;80,5 s invierte</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">indebidamente el efecto.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>