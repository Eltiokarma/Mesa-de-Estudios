<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">100 · Avión que anuncia la llegada del vapor</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,200.95 375.10,200.95 375.10,155.25 100.90,155.25 100.90,200.95" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,292.35 375.10,292.35 375.10,246.65 100.90,246.65 100.90,292.35" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,383.75 375.10,383.75 375.10,338.05 100.90,338.05 100.90,383.75" fill="none" stroke="#008674" stroke-width="2.5"/><text x="112.47311827956989" y="170.1021505376344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">vAvión=4u</text><text x="112.47311827956989" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">x+100=20u</text><text x="112.47311827956989" y="352.89784946236557" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2x−100)/(4u)=7</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea u la rapidez del vapor y x la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">posición del avión al primer contacto:</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x+100=20 u.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El avión recorre x al ir y x−100 al</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">volver antes de contactar Callao.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Así(2 x−100)/(4 u)=7.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituir x=20 u−100: 12 u=300⇒u=25</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">km/h.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>