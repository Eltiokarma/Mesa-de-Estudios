.6610156576634" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="320.49037710645484" cy="366.08382224355233" r="3.7" fill="#20364b"/><text x="327.49037710645484" y="358.08382224355233" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="331.9450785960733" cy="354.9834442562817" r="3.7" fill="#20364b"/><text x="338.9450785960733" y="346.9834442562817" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="341.9182100761622" cy="342.53494128775515" r="3.7" fill="#20364b"/><text x="348.9182100761622" y="334.53494128775515" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="350.2524893056204" cy="328.9346336661615" r="3.7" fill="#20364b"/><text x="357.2524893056204" y="320.9346336661615" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="356.81647972234197" cy="314.3970063671235" r="3.7" fill="#20364b"/><text x="363.81647972234197" y="306.3970063671235" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="361.50666327631774" cy="299.15132645750407" r="3.7" fill="#20364b"/><text x="368.50666327631774" y="291.15132645750407" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><circle cx="364.2490729711216" cy="283.4380274168062" r="3.7" fill="#20364b"/><text x="371.2490729711216" y="275.4380274168062" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start"></text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe 1+i=√2 exp(πi/4). Las raíces</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tienen argumentos (1+8k)π/200,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k=0,1,…,49.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El tercer cuadrante exige π&lt;arg</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">z&lt;3π/2, es decir 200&lt;1+8k&lt;300.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los índices enteros van de 25 a 37</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">inclusive. Su número es 37−25+1.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>