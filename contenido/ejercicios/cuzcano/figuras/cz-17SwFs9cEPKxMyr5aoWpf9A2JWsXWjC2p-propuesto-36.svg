<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">036 · Segmentos colineales con ángulos de 8° y 15°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,303.04 258.92,235.96 288.18,252.86 375.10,303.04 100.90,303.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,303.04 288.18,252.86" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="100.90322580645162" y="303.0371872518617" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="258.92054966719684" y="235.96281274813828" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="288.1809021317375" y="252.85628512012417" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="303.0371872518617" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="129.62212883882762" y="298.4759497114255" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">15°</text><text x="136.37951778762198" y="290.3670829728723" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8°</text><text x="278.88949232714526" y="254.88350180476246" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45°</text><text x="265.00219972111177" y="243.90274476297165" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABC, ∠ABC=127°. Por senos, AC=2 sen</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">127°/sen 8°. En ACD, ∠ACD=135° y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠ADC=30°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Aplica de nuevo senos: CD=AC sen</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">15°/sen 30°. Con ángulos literales</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resulta aproximadamente 5,94.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La clave toma 8°≈45°−arctan(3/4).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces sen 127°≈4/5 y sen</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">8°≈1/(5√2), de modo que CD≈8(√3−1).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>