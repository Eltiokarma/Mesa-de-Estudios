<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Dos triángulos rectos opuestos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="138.50,149.40 262.05,242.07 344.42,303.85 262.05,303.85 215.72,303.85 169.38,303.85" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="138.50,149.40 215.72,303.85 262.05,396.52 262.05,303.85 262.05,242.07 215.72,303.85 187.92,340.92 262.05,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="254.64,251.95 244.75,244.54 252.17,234.66" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="262.05,293.96 271.94,293.96 271.94,303.85" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="192.37,334.98 198.30,339.43 193.85,345.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="208.79946968746077" y="296.9295531567717" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="255.13317434416967" y="235.15128028115979" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="337.50420484498557" y="296.9295531567717" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="131.5766285929459" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="255.13317434416967" y="389.5969624701895" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="180.9992468934354" y="333.99651688213885" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">T</text><text x="255.13317434416967" y="296.9295531567717" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja AB sobre AM. Su imagen es el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">rayo horizontal a la izquierda de A.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por tanto, la imagen de MB es vertical</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y la altura de M sobre AC es 10.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea θ=∠BAC. En la imagen, esa altura</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es AB·tan((180°−θ)/2), y BH=AB·senθ.</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Su cociente es BH/MB=1−cosθ, luego</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cosθ=3/5.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos rectos ABM y ATN son</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semejantes. Las proyecciones</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontales de AN y AM miden AB·cosθ</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y AB, de modo que TN=MB·cosθ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>