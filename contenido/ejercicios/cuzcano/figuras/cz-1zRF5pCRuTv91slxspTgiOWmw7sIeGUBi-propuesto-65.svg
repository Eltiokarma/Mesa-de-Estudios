.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">4</text><rect x="301.33333333333337" y="295.7142857142857" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="322.64285714285717" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">sp³</text><rect x="48.0" y="337.14285714285717" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">HNO₃</text><rect x="174.66666666666669" y="337.14285714285717" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3 en N</text><rect x="301.33333333333337" y="337.14285714285717" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="364.0714285714286" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">sp²</text><rect x="48.0" y="378.57142857142856" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="111.33333333333334" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">O₃</text><rect x="174.66666666666669" y="378.57142857142856" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="238.00000000000003" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">3</text><rect x="301.33333333333337" y="378.57142857142856" width="126.66666666666667" height="41.42857142857143" fill="#ffffff" stroke="#a3b9cc"/><text x="364.6666666666667" y="405.5" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">sp²</text><text x="48" y="447.0" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Dominios electrónicos</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">NH₃ y PCl₃ tienen tres enlaces y un</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">par libre. H₂O tiene dos enlaces y dos</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pares libres. Son cuatro dominios en</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cada caso.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BeCl₂ monomérico tiene dos dominios.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En HNO₃ hay tres conexiones alrededor</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del N.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El O central de O₃ tiene dos</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conexiones y un par libre. Los centros</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con tres dominios son N en HNO₃ y O</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">central en O₃.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>