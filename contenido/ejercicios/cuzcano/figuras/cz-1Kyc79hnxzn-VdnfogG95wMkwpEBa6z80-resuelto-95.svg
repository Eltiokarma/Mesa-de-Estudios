<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">095 · Tres segmentos que forman triángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,261.96 375.10,261.96" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="100.90,267.44 100.90,256.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="169.45,267.44 169.45,256.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,267.44 238.00,256.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="306.55,267.44 306.55,256.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,267.44 375.10,256.48" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="107.90322580645164" y="253.95967741935488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="245.0" y="253.95967741935488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">O</text><text x="382.09677419354836" y="253.95967741935488" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="176.45161290322582" y="274.5241935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1/4</text><text x="313.54838709677415" y="274.5241935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3/4</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Normalizar AB=1 y escribir AX=x,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">XB=1−x, AO=1/2.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las desigualdades relevantes dan</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x+1/2&gt;1−x y 1−x+1/2&gt;x, es decir</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/4&lt;x&lt;3/4.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El intervalo favorable mide 1/2 del</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">total: probabilidad 1/2.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>