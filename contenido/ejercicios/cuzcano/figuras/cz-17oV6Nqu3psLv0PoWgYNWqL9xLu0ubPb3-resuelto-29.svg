<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">029 · Dos interceptos posibles para un triángulo de área dada</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,318.46 375.10,318.46" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,338.05 238.00,200.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.70,279.29 365.30,279.29" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,320.84 362.64,279.29" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,237.75 113.36,279.29" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="242.8963133640553" y="320.83922331856445" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b₁</text><text x="242.8963133640553" y="237.74603013765673" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escribe la paralela como y=x/3+b.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Corta y=4 en x=3(4−b).</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El triángulo rectángulo tiene catetos</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∣4−b∣ y 3∣4−b∣. Su área es 3(4−b)²/2.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Iguala a 27 y toma ambos signos al</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">extraer la raíz.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>