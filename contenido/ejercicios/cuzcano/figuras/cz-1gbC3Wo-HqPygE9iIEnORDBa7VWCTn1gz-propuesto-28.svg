<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">028 · Distancia entre puntos medios de dos segmentos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="109.09,365.33 207.99,239.83 366.91,365.33 109.09,365.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="207.99,365.33 207.99,174.35 366.91,365.33" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="109.09,365.33 238.34,302.58" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="207.99,239.83 238.34,302.58" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.34,302.58 287.45,269.84" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="374.88035628310064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="207.98876584817847" y="228.9166265446959" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="374.1982827796501" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="207.98876584817847" y="162.0734232065479" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="207.98876584817847" y="376.9265767934521" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="295.29417428984107" y="264.3844487241213" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="237.31792649654952" y="314.1758144760071" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="188.89070775156478" y="210.50064195153266" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Refleja B respecto de la bisectriz. Su</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reflejo T está en AC, a distancia AB</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de A, y N es el punto medio de BT.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como M es el punto medio de PC, el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vector NM es la mitad de la suma de BP</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">y TC tomados como vectores. El primero</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es vertical y el segundo horizontal.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los componentes tienen magnitudes 8/2</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">= 4 y 6/2 = 3. Por Pitágoras, MN = 5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>