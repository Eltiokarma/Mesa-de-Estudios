<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">024 · Amplitud de tres términos con fases distintas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="269.5" x2="421" y2="269.5" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x (radianes)</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">M</text><polyline points="100.90,223.50 105.47,211.36 110.04,199.86 114.61,189.12 119.18,179.26 123.75,170.39 128.32,162.60 132.89,155.99 137.46,150.62 142.03,146.55 146.60,143.83 151.17,142.48 155.74,142.53 160.31,143.97 164.88,146.78 169.45,150.94 174.02,156.40 178.59,163.10 183.16,170.96 187.73,179.90 192.30,189.83 196.87,200.62 201.44,212.18 206.01,224.35 210.58,237.03 215.15,250.06 219.72,263.30 224.29,276.61 228.86,289.84 233.43,302.85 238.00,315.50 242.57,327.64 247.14,339.14 251.71,349.88 256.28,359.74 260.85,368.61 265.42,376.40 269.99,383.01 274.56,388.38 279.13,392.45 283.70,395.17 288.27,396.52 292.84,396.47 297.41,395.03 301.98,392.22 306.55,388.06 311.12,382.60 315.69,375.90 320.26,368.04 324.83,359.10 329.40,349.17 333.97,338.38 338.54,326.82 343.11,314.65 347.68,301.97 352.25,288.94 356.82,275.70 361.39,262.39 365.96,249.16 370.53,236.15 375.10,223.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">M(x)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al desarrollar, los coeficientes de</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos x son 1/2, √3/2 y −1/2. Su suma es</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√3/2.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los coeficientes de sen x son √3/2,</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1/2 y √3/2. Su suma es √3+1/2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La amplitud es la raíz de</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">3/4+(√3+1/2)²=4+√3 y se alcanza para</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">una fase real.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>