<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Perímetro de un triángulo cortado por el incentro</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.81,357.04 181.84,181.96 364.36,357.04 110.81,357.04" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="138.89,290.97 294.99,290.97" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="110.81,357.04 208.27,290.97 364.36,357.04" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645156" y="363.6507967353284" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="181.83987563155847" y="174.5233190827827" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354847" y="364.47668091721727" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="127.33151962689463" y="288.49533618344344" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="305.72250291488535" y="287.66945200155465" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="208.26816945200153" y="280.236494364555" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="158.71511853867077" y="278.5847260007773" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">AM</text><text x="252.86591527399924" y="280.236494364555" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">NC</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por la bisectriz AI y el paralelismo,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">los ángulos MAI y AIM son iguales. Así</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AM=MI.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">De forma análoga, la bisectriz CI da</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">CN=IN.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces BM+BN+MN=BM+BN+AM+CN=AB+BC.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>