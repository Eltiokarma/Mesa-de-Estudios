<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">027 · Paridad de aplicaciones de suplemento</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="238.00,311.28 375.10,311.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,311.28 141.06,214.33" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="238.00,311.28 100.90,311.28" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="273.07,311.28 272.98,308.70 272.69,306.13 272.22,303.59 271.56,301.09 270.72,298.65 269.70,296.28 268.52,293.99 267.16,291.79 265.65,289.70 263.99,287.72 262.18,285.88 260.25,284.17 258.19,282.60 256.03,281.19 253.77,279.95 251.42,278.87 249.00,277.97 246.52,277.26 244.00,276.72 241.44,276.37 238.86,276.21 236.28,276.25 233.71,276.47 231.16,276.88 228.65,277.47 226.18,278.25 223.79,279.21 221.47,280.35 219.24,281.65 217.11,283.11 215.09,284.72 213.20,286.48" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="205.08,278.36 204.29,279.18 203.51,280.02 202.75,280.87 202.02,281.75 201.30,282.64 200.61,283.55 199.94,284.47 199.30,285.41 198.67,286.37 198.07,287.34 197.50,288.33 196.95,289.33 196.42,290.35 195.92,291.37 195.44,292.41 194.99,293.46 194.57,294.52 194.17,295.59 193.80,296.67 193.46,297.76 193.14,298.86 192.85,299.97 192.58,301.08 192.35,302.19 192.14,303.32 191.95,304.45 191.80,305.58 191.68,306.71 191.58,307.85 191.51,308.99 191.46,310.13 191.45,311.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="238.0" y="324.6664532114935" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="258.131789718381" y="262.6731657266067" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="178.79339154930483" y="286.751425297174" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">S(θ)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Dos aplicaciones de C o S cancelan sus</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">efectos. El miembro izquierdo se</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">reduce a 3(180−θ).</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si n+3 es impar, el miembro derecho es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">180−θ, que llevaría a θ=180°, fuera</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del intervalo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Si n+3 es par, el derecho es θ.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resuelve 3(180−θ)=θ.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>