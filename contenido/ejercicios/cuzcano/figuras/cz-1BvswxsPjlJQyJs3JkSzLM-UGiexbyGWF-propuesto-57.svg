<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">057 · Orden de motos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="110.98,269.50 365.02,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><circle cx="110.98387096774192" cy="269.5" r="3.7" fill="#20364b"/><text x="117.98387096774192" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">4</text><circle cx="161.79032258064515" cy="269.5" r="3.7" fill="#20364b"/><text x="168.79032258064515" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">1</text><circle cx="212.59677419354838" cy="269.5" r="3.7" fill="#20364b"/><text x="219.59677419354838" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">6</text><circle cx="263.4032258064516" cy="269.5" r="3.7" fill="#20364b"/><text x="270.4032258064516" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">3</text><circle cx="314.2096774193548" cy="269.5" r="3.7" fill="#20364b"/><text x="321.2096774193548" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">5</text><circle cx="365.01612903225805" cy="269.5" r="3.7" fill="#20364b"/><text x="372.01612903225805" y="261.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Interpretar diferencia quinto menos</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">segundo=4:se obtiene moto5 quinta y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">moto1 segunda.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Moto6 va tercera; la condición de</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">semisuma completa el orden4,1,6,3,5,2.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A dos posiciones después de la moto1</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">está la moto3. Con diferencia absoluta</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">también hay otro orden,por lo que se</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">declara la lectura dirigida.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>