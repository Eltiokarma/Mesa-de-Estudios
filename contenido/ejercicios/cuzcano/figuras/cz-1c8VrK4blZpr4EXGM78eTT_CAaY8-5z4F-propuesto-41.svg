<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">041 · Reconstruir la escala salarial de un histograma</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="106.28,381.82 375.10,381.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="106.28,381.82 106.28,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,381.82 100.90,329.33 154.67,329.33 154.67,381.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="154.67,381.82 154.67,276.85 208.43,276.85 208.43,381.82" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="208.43,381.82 208.43,241.86 262.19,241.86 262.19,381.82" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="262.19,381.82 262.19,171.88 315.96,171.88 315.96,381.82" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="315.96,381.82 315.96,276.85 369.72,276.85 369.72,381.82" fill="none" stroke="#008674" stroke-width="2.5"/><text x="127.78494623655915" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a–2a</text><text x="127.78494623655915" y="318.83684350839775" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3m</text><text x="181.5483870967742" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2a–3a</text><text x="181.5483870967742" y="266.35083977605973" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6m</text><text x="235.31182795698925" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3a–4a</text><text x="235.31182795698925" y="231.3601706211677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">8m</text><text x="289.0752688172043" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4a–5a</text><text x="289.0752688172043" y="161.37883231138363" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">12m</text><text x="342.83870967741933" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5a–6a</text><text x="342.83870967741933" y="266.35083977605973" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">6m</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las marcas de clase en unidades de a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">son 1,5, 2,5, 3,5, 4,5 y 5,5.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica por sus pesos y divide por</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">35 para obtener 269a/70.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Al igualar la media a 269 soles,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">resulta a=70 soles.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El intervalo [280,350) es la cuarta</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">clase. Su proporción es 12/35.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>