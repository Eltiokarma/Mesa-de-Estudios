<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">044 · Un rayo de pendiente −3 en el segundo cuadrante</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="178.19,269.50 297.81,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="238.00,396.52 238.00,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="204.40,168.69 238.00,269.50 271.60,370.31" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="252.22,269.50 252.19,268.60 252.10,267.71 251.96,266.83 251.77,265.95 251.51,265.09 251.21,264.25 250.85,263.42 250.44,262.63 249.99,261.86 249.48,261.12 248.93,260.41 248.33,259.74 247.70,259.11 247.02,258.51 246.31,257.97 245.57,257.47 244.80,257.01 244.00,256.61 243.17,256.26 242.33,255.96 241.46,255.71 240.59,255.52 239.70,255.39 238.81,255.31 237.91,255.28 237.02,255.32 236.12,255.41 235.24,255.55 234.36,255.76 233.51,256.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="238.0" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="297.81182795698925" y="274.5403225806451" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="245.0564516129032" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="244.46195202646817" y="249.59718775847807" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="210.85980148883377" y="201.00330851943755" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y=−3x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Elige (−1,3) en el rayo. Su norma es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">√10 y tan θ=−3.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Se obtiene sen θ+cos θ=(3−1)/√10.</text><text x="482" y="192" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sustituye −6+6√10·2/√10 para hallar 6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>