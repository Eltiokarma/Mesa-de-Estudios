<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">064 · Una cifra par en el centro de un tablero giratorio</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="286.89,269.50 262.44,311.84 213.56,311.84 189.11,269.50 213.56,227.16 262.44,227.16 286.89,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="286.89,354.18 262.44,396.52 213.56,396.52 189.11,354.18 213.56,311.84 262.44,311.84 286.89,354.18" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="286.89,184.82 262.44,227.16 213.56,227.16 189.11,184.82 213.56,142.48 262.44,142.48 286.89,184.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="360.22,311.84 335.78,354.18 286.89,354.18 262.44,311.84 286.89,269.50 335.78,269.50 360.22,311.84" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="360.22,227.16 335.78,269.50 286.89,269.50 262.44,227.16 286.89,184.82 335.78,184.82 360.22,227.16" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="213.56,311.84 189.11,354.18 140.22,354.18 115.78,311.84 140.22,269.50 189.11,269.50 213.56,311.84" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="213.56,227.16 189.11,269.50 140.22,269.50 115.78,227.16 140.22,184.82 189.11,184.82 213.56,227.16" fill="none" stroke="#008674" stroke-width="2.5"/><text x="238.0" y="269.5" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Par</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para el centro hay tres cifras pares,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">4, 6 u 8.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las otras seis se ordenan alrededor</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del centro. Cada rotación de las seis</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">casillas genera una representación del</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mismo arreglo.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada clase tiene seis representaciones</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">porque todas las cifras son distintas.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Multiplica 3×6!/6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>