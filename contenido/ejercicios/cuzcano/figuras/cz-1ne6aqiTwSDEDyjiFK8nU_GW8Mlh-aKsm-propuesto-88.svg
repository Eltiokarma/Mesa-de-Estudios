<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">088 · Abscisa de un corte a partir del máximo y mínimo de una sinusoide</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="333.008064516129" x2="421" y2="333.008064516129" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">f(x)</text><polyline points="181.22,197.34 184.45,188.48 187.69,180.24 190.92,172.69 194.15,165.87 197.38,159.85 200.61,154.67 203.84,150.36 207.07,146.97 210.30,144.52 213.53,143.02 216.77,142.48 220.00,142.93 223.23,144.33 226.46,146.70 229.69,150.01 232.92,154.23 236.15,159.33 239.38,165.28 242.62,172.02 245.85,179.51 249.08,187.68 252.31,196.49 255.54,205.85 258.77,215.70 262.00,225.96 265.23,236.55 268.47,247.40 271.70,258.41 274.93,269.51 278.16,280.61 281.39,291.63 284.62,302.47 287.85,313.07 291.08,323.33 294.32,333.17 297.55,342.53 300.78,351.34 304.01,359.51 307.24,367.00 310.47,373.74 313.70,379.68 316.93,384.78 320.17,389.00 323.40,392.31 326.63,394.67 329.86,396.08 333.09,396.51 336.32,395.98 339.55,394.48 342.78,392.02 346.02,388.63 349.25,384.32 352.48,379.13 355.71,373.11 358.94,366.29 362.17,358.74 365.40,350.50 368.63,341.64 371.87,332.22 375.10,322.33" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start"></text><circle cx="216.91729143266312" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="223.91729143266312" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2π/3, 3)</text><circle cx="332.93135705887465" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="339.93135705887465" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(4π/3, −1)</text><circle cx="294.2600018501375" cy="333.008064516129" r="3.7" fill="#20364b"/><text x="301.2600018501375" y="325.008064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">M</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La línea media es y=1 y la amplitud es</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2. Entre máximo y mínimo transcurre</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">medio período, 2π/3, así que la</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">frecuencia angular es 3/2.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Una ecuación que empieza en el máximo</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es y=1+2cos[(3/2)(x−2π/3)].</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el tramo descendente, y=0 exige que</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el argumento valga 2π/3. Despeja x.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>