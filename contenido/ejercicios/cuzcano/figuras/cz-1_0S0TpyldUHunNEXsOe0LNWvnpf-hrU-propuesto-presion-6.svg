<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">006 · Columna de agua contra cilindro de diez newtons</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="113.10,244.10 113.10,396.52 341.73,396.52 341.73,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="145.28,244.10 145.28,364.34 309.55,364.34 309.55,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="113.10,184.82 145.28,184.82 145.28,244.10 113.10,244.10 113.10,184.82" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="309.55,172.97 341.73,172.97" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="125.80241935483869" y="166.19354838709677" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">10 N</text><text x="362.89919354838713" y="212.76612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">H</text><text x="227.41532258064515" y="328.77419354838713" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Agua</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">A la altura de la base del cilindro,</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la presión del agua excede a la del</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aire en ρgH.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La fuerza ascendente neta del fluido</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es ρgHA. En el límite iguala el peso</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de 10 N.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Divide 10 N entre 1000×10×0,001 en</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">unidades SI.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>