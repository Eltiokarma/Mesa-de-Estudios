<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">023 · Ceviana y cotangente en un triángulo rectángulo</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="362.45,396.52 113.55,396.52 113.55,294.90 113.55,142.48 362.45,396.52" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="362.45,396.52 188.22,325.39 113.55,294.90" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="188.22,325.39 113.55,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><text x="362.4498820930163" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="113.55011790698369" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="113.55011790698369" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="113.55011790698369" y="294.9032258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="188.2200471627935" y="325.38709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="128.79205339085468" y="381.27419354838713" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">90°</text><text x="125.74366629408047" y="342.1532258064516" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="125.74366629408047" y="217.67741935483872" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5−x</text><text x="244.63076306827404" y="230.88709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">7</text><text x="331.9660111252744" y="390.4193548387097" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="131.84044048762885" y="190.75" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="150.63882758440306" y="166.3629032258064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por Pitágoras, AB²=49−25=24. Además</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos(2θ)=BC/AC=5/7.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con la identidad de ángulo mitad, cot²</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=(1+5/7)/(1−5/7)=6. Entonces tan²</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">θ=1/6.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABD, x=AB tan θ. Por tanto</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">x²=24/6=4. Suma 4+6.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>