<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">048 · Área de un cuadrilátero por razón de productos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polygon points="100.90,338.05 118.04,303.77 220.86,226.66 375.10,303.77" fill="#f4c581" fill-opacity="0.45"/><polyline points="100.90,338.05 118.04,303.77 169.45,200.95 375.10,303.77 100.90,338.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="118.04,303.77 220.86,226.66" fill="none" stroke="#d37618" stroke-width="2.5"/><text x="136.20564516129033" y="252.36290322580646" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3a</text><text x="101.93145161290326" y="320.9112903225806" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a</text><text x="195.15725806451616" y="202.1512096774194" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">b</text><text x="297.9798387096774" y="253.5625" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">3b</text><text x="100.90322580645164" y="338.04838709677415" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="169.45161290322582" y="200.95161290322582" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">R</text><text x="375.09677419354836" y="303.7741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="118.04032258064518" y="303.7741935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">I</text><text x="220.86290322580646" y="226.65725806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los triángulos RIL y RDO comparten el</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulo de R. Sus áreas son</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">proporcionales a los productos de los</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">dos lados que forman ese ángulo.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los cocientes son RI/RD=3/4 y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">RL/RO=1/4. Así el triángulo RIL tiene</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">área 16·3/16=3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El cuadrilátero es el área que queda</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tras quitar RIL de RDO.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>