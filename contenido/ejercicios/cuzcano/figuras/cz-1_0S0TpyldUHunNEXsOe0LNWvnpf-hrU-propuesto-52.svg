<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">052 · Resorte dentro de un tanque que acelera hacia arriba</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="120.03,184.48 120.03,354.52 375.10,354.52 375.10,184.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="120.03,201.48 375.10,201.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="264.04,233.37 263.93,235.37 263.62,237.34 263.10,239.28 262.38,241.15 261.47,242.93 260.38,244.61 259.12,246.17 257.71,247.58 256.15,248.84 254.47,249.93 252.69,250.84 250.82,251.56 248.89,252.08 246.91,252.39 244.91,252.50 242.91,252.39 240.93,252.08 239.00,251.56 237.13,250.84 235.34,249.93 233.66,248.84 232.11,247.58 230.69,246.17 229.43,244.61 228.34,242.93 227.43,241.15 226.71,239.28 226.20,237.34 225.88,235.37 225.78,233.37 225.88,231.37 226.20,229.39 226.71,227.45 227.43,225.59 228.34,223.80 229.43,222.12 230.69,220.57 232.11,219.15 233.66,217.89 235.34,216.80 237.13,215.89 239.00,215.17 240.93,214.65 242.91,214.34 244.91,214.24 246.91,214.34 248.89,214.65 250.82,215.17 252.69,215.89 254.47,216.80 256.15,217.89 257.71,219.15 259.12,220.57 260.38,222.12 261.47,223.80 262.38,225.59 263.10,227.45 263.62,229.39 263.93,231.37 264.04,233.37" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="244.91,252.50 237.47,259.78 252.35,267.07 237.47,274.36 252.35,281.65 237.47,288.93 252.35,296.22 237.47,303.51 252.35,310.80 237.47,318.08 252.35,325.37 237.47,332.66 252.35,339.95 237.47,347.23 244.91,354.52" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="340.02550637659414" y="280.1276569142285" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Líquido</text><text x="244.90797699424854" y="233.36596649162288" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">m</text><text x="264.5691422855714" y="302.97711927981993" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">k</text><text x="100.90322580645159" y="253.55851462865715" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">a₀ ↑</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En el marco del recipiente, la</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">gravedad efectiva pasa de g a g + a₀.</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con ella se calculan tanto el peso</text><text x="482" y="162" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">efectivo como el empuje.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El alargamiento inicial cumple kx =</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(ρV − m)g. El nuevo cumple kx′ = (ρV −</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">m)(g + a₀).</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta las ecuaciones y divide entre k.</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El incremento depende de la masa de</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">fluido desplazada.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>