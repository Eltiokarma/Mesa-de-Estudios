font-size="16" fill="#20364b" text-anchor="start">espurias.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En [0,π/2] hay un cruce porque el lado</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">izquierdo decrece y el derecho crece.</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Cada máximo kπ, k=1,…,5, tiene</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">16cos²(kπ)=16&gt;kπ, y queda delimitado</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por valores negativos de 16cos²x−x en</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En cada media onda descendente hay un</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cruce por monotonía. En la ascendente</text><text x="482" y="353" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">con x≥π/2, la derivada logarítmica de</text><text x="482" y="376" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos²x/x, −2tan x−1/x, decrece</text><text x="482" y="399" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">estrictamente, así que la razón solo</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>