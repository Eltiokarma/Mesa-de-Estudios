<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">065 · Complemento del doble de una inclinación</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,199.89 375.10,199.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="277.61,352.22 375.10,352.22" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="131.37,158.76 175.54,282.14 285.22,257.77" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="269.99,199.89 227.95,317.18 327.87,380.24" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="244.09,266.91 334.88,160.28" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="133.19713261648747" y="191.05017921146955" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="307.4623655913978" y="190.74551971326164" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="314.1648745519713" y="365.3154121863799" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="364.4336917562723" y="191.96415770609318" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">p</text><text x="364.4336917562723" y="343.98924731182797" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">n</text><text x="179.81003584229387" y="272.089605734767" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊥</text><text x="234.95340501792114" y="313.21863799283153" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">⊥</text><text x="268.4659498207885" y="251.98207885304657" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t</text><text x="266.33333333333326" y="237.0537634408602" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">t</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Las dos perpendiculares que llegan al</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">sector tienen inclinaciones 90°−θ y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">90°−β.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La inclinación de la bisectriz es su</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">promedio. Entonces 2x=180°−123°=57°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El complemento pedido es 90°−57°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>