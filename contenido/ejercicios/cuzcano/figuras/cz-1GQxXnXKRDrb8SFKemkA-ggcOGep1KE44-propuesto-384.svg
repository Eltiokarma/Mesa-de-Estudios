45 339.45,155.52 342.19,154.64 344.94,153.83 347.68,153.07 350.42,152.36 353.16,151.70 355.90,151.08 358.65,150.51 361.39,149.97 364.13,149.47 366.87,149.00 369.61,148.56 372.35,148.16 375.10,147.78" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">f(x)</text><polyline points="100.90,142.48 375.10,142.48" fill="none" stroke="#d37618" stroke-width="2.5" stroke-dasharray="6 5"/><text x="248" y="477" font-family="Arial,sans-serif" font-size="11" fill="#d37618" text-anchor="start">Asíntota y=3</text><circle cx="210.5806451612903" cy="227.16129032258064" r="3.7" fill="#20364b"/><text x="217.5806451612903" y="219.16129032258064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(−1,2)</text><circle cx="238.0" cy="142.48387096774195" r="3.7" fill="#20364b"/><text x="245.0" y="134.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(0,3)</text><circle cx="265.41935483870964" cy="227.16129032258064" r="3.7" fill="#20364b"/><text x="272.41935483870964" y="219.16129032258064" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,2)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El valor interior 2^(1−∣x∣)−1 es no</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">negativo cuando ∣x∣≤1. En ese tramo</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">f=2^(1−∣x∣)+1.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para ∣x∣&gt;1 se invierte el signo</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">interior. Allí f=3−2^(1−∣x∣).</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El gráfico es par, alcanza mínimos 2</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en ±1 y pasa por (0,3). Sus dos colas</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">suben hacia la asíntota y=3.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>