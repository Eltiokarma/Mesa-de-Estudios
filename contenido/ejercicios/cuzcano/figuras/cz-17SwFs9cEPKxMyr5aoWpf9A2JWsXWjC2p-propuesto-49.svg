<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">049 · Faro en plano inclinado</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,367.43 375.10,276.03" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="375.10,276.03 375.10,171.57" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,367.43 375.10,171.57" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="218.41,328.26 375.10,171.57" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="107.90322580645162" y="359.426267281106" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">P</text><text x="225.4147465437788" y="320.2557603686636" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">Q</text><text x="382.0967741935484" y="268.0284178187404" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">A</text><text x="382.0967741935484" y="163.57373271889398" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">B</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Sea x distancia horizontal inicial a</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">la base. H=x[tan(1.5θ)−tanθ].</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Tras avanzar d,la separación</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">horizontal disminuye dcosθ:</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">H=(x−dcosθ)[tan2θ−tanθ].</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Eliminar x y simplificar las</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencias de tangentes:H=d</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">tanθ,para0&lt;θ&lt;45°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Reconstrucción propia · Ejes, puntos y unidades conservados en la ficha.</text></svg>