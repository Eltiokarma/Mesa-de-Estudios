<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">020 · Recta por el origen y el cruce de dos líneas</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="136.63,308.58 339.37,308.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="200.14,396.52 200.14,142.48" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="151.29,308.58 273.42,186.45" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="175.71,186.45 322.27,333.01" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="175.71,381.86 251.43,154.70" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="339.36864143920593" y="306.1392679900745" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="202.58204094292802" y="142.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="223.34429280397023" y="246.05086848635233" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="253.87701612903228" y="153.47565136476425" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L</text><text x="276.8376240694789" y="186.45099255583125" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₁</text><text x="170.09522332506202" y="180.34444789081886" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">L₂</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma las ecuaciones para obtener 2y=6.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Luego x=1.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La recta L une O=(0,0) y P=(1,3). Su</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">pendiente es 3.</text><text x="482" y="215" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como el intercepto es cero, su</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ecuación es y=3x.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>