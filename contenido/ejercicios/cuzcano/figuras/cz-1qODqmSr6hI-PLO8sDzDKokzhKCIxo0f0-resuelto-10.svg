<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">010 · Coseno de 2 grados a partir de razones de 22 grados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><rect x="48.0" y="130" width="190.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="143.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Expresión</text><rect x="238.0" y="130" width="190.0" height="48" fill="#dfedf8" stroke="#a3b9cc"/><text x="333.0" y="161.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">Equivalente</text><rect x="48.0" y="178" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">k</text><rect x="238.0" y="178" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="209.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">sen 44°+cos 44°</text><rect x="48.0" y="226" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="143.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">k²−1</text><rect x="238.0" y="226" width="190.0" height="48" fill="#ffffff" stroke="#a3b9cc"/><text x="333.0" y="257.2" font-family="Arial,sans-serif" font-size="18" fill="#20364b" text-anchor="middle">sen 88° = cos 2°</text><text x="48" y="301" font-family="Arial,sans-serif" font-size="14" fill="#20364b" text-anchor="start">Relaciones del cálculo</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desarrolla el cuadrado y resta</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2sen²22°. Queda</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cos²22°−sen²22°+2sen22° cos22°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Por ángulo doble, k=cos 44°+sen 44°.</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Eleva al cuadrado para obtener</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">k²=1+sen 88°.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ángulos de 88° y 2° son</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">complementarios. Así sen 88°=cos 2°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>