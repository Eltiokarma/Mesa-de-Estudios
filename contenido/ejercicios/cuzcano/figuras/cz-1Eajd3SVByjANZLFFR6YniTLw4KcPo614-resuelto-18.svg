<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">018 · Circuncentro y ortocentro sobre la recta de Euler</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,347.19 192.30,164.39 375.10,347.19 283.70,347.19 100.90,347.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="192.30,164.39 192.30,255.79" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="155.74,219.23 192.30,255.79 238.00,301.49 283.70,347.19 311.12,374.61" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="238.00,301.49 238.00,347.19" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="238.00,301.49 375.10,347.19" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645162" y="347.18817204301075" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="192.3010752688172" y="164.39247311827955" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="375.09677419354836" y="347.18817204301075" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="237.99999999999997" y="301.48924731182797" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="192.3010752688172" y="255.79032258064512" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="283.6989247311828" y="347.18817204301075" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">F</text><text x="237.99999999999997" y="347.18817204301075" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">U</text><text x="200.06989247311827" y="210.09139784946237" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">OB</text><text x="248.0537634408602" y="324.33870967741933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">DU</text><text x="264.04838709677415" y="325.252688172043" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Escala FC=OB=2, de modo que AF=4 y</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">AC=6. La perpendicular de D a AC cae</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en su punto medio U, con AU=3.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Con AC horizontal, el vector del</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ortocentro es A+B+C−2D. Por ello la</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">altura de D sobre AC es BO/2=1. Así</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">DU=UF=1 y UC=3.</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Desde D, DF baja con inclinación de</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">45° y DC con arctan(1/3). La</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">diferencia equivale a arctan(1/2).</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>