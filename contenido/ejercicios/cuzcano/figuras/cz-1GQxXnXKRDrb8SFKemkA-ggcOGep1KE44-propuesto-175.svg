<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">175 · Rango de un valor absoluto con un factor de parte entera</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><line x1="65" y1="396.51612903225805" x2="421" y2="396.51612903225805" stroke="#20364b" stroke-width="1.7"/><line x1="100.90322580645162" y1="105" x2="100.90322580645162" y2="441" stroke="#20364b" stroke-width="1.7"/><text x="407" y="466" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="end">x</text><text x="50" y="86" font-family="Arial,sans-serif" font-size="15" fill="#20364b" text-anchor="start">y</text><polyline points="192.30,244.10 194.59,246.67 196.87,249.30 199.16,252.00 201.44,254.77 203.73,257.59 206.01,260.48 208.30,263.43 210.58,266.45 212.87,269.53 215.15,272.68 217.44,275.88 219.72,279.15 222.01,282.49 224.29,285.89 226.58,289.35 228.86,292.87 231.15,296.46 233.43,300.11 235.72,303.83 238.00,307.60 240.28,311.45 242.57,315.35 244.85,319.32 247.14,323.35 249.42,327.45 251.71,331.61 253.99,335.83 256.28,340.12 258.56,344.47 260.85,348.89 263.13,353.36 265.42,357.90 267.70,362.51 269.99,367.18 272.27,371.91 274.56,376.70 276.84,381.56 279.13,386.48 281.41,391.47 283.70,396.52 285.98,391.40 288.27,386.23 290.55,380.99 292.84,375.69 295.12,370.32 297.41,364.89 299.69,359.40 301.98,353.84 304.26,348.22 306.55,342.53 308.83,336.79 311.12,330.98 313.40,325.10 315.69,319.16 317.97,313.16 320.26,307.10 322.54,300.97 324.83,294.78 327.11,288.52 329.40,282.20 331.68,275.82 333.97,269.37 336.25,262.86 338.54,256.29 340.82,249.65 343.11,242.95 345.39,236.19 347.68,229.36 349.96,222.47 352.25,215.52 354.53,208.50 356.82,201.42 359.10,194.27 361.39,187.07 363.67,179.79 365.96,172.46 368.24,165.06 370.53,157.60 372.81,150.07 375.10,142.48" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="73" y="477" font-family="Arial,sans-serif" font-size="11" fill="#1766b0" text-anchor="start">f(x)</text><circle cx="192.30107526881721" cy="244.09677419354836" r="4.5" fill="#f4f8fc" stroke="#20364b" stroke-width="1.6"/><text x="199.30107526881721" y="236.09677419354836" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(1,3) abierto</text><circle cx="283.69892473118284" cy="396.51612903225805" r="3.7" fill="#20364b"/><text x="290.69892473118284" y="388.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(2,0)</text><circle cx="375.09677419354836" cy="142.4838709677419" r="3.7" fill="#20364b"/><text x="382.09677419354836" y="134.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="start">(3,5)</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El argumento de la parte entera</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">satisface 1≤(5−x)/2&lt;2, así que ese</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">factor es 1.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La función es ∣x²−4∣. En (1,2] va</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">desde valores menores que 3 hasta 0, y</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">en [2,3] va de 0 a 5.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La unión de esas imágenes es [0,5]. El</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">valor 3 aparece también en la rama</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">derecha.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>