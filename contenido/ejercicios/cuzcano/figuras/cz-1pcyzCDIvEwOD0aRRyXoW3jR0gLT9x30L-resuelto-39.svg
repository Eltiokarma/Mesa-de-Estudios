<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">039 · Altura de un trapecio escaleno</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,330.67 153.63,204.12 206.36,204.12 375.10,330.67 100.90,330.67" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="153.63,204.12 153.63,330.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="153.63,204.12 322.37,330.67" fill="none" stroke="#008674" stroke-width="2.5"/><text x="100.90322580645162" y="330.66625310173697" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="153.63275434243178" y="204.1153846153846" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="206.36228287841192" y="204.1153846153846" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="375.0967741935484" y="330.66625310173697" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="153.63275434243178" y="330.66625310173697" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="322.3672456575682" y="330.66625310173697" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="179.99751861042182" y="193.5694789081886" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">5</text><text x="227.45409429280397" y="345.43052109181144" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">26</text><text x="121.99503722084368" y="256.8449131513647" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">13</text><text x="301.27543424317616" y="256.8449131513647" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">20</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Marca E en AD de modo que DE=5.</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces BCDE es un paralelogramo y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">BE=20.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En ABE, AE=21 y el semiperímetro es</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">27. Herón da área √(27·6·7·14)=126.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La altura común a ABE y ABCD es</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2·126/21=12.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>