<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">486 · Validación de tres nombres de hidrocarburos</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="196.71,160.37 231.95,180.35 267.18,160.37 302.42,180.35 337.66,160.37" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="270.71,155.00 298.90,170.99" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="231.95,180.35 231.95,142.48" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="196.71,241.36 233.52,241.36 270.34,241.36 307.16,241.36 338.71,262.40" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="235.63,235.05 268.24,235.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="235.63,247.67 268.24,247.67" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="307.16,241.36 338.71,220.32" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="244.04,291.33 289.59,317.62 289.59,370.22 244.04,396.52 198.49,370.22 198.49,317.62 244.04,291.33" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="289.59,317.62 308.72,306.58" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="289.59,370.22 308.72,381.26" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="198.49,370.22 179.36,381.26" fill="none" stroke="#008674" stroke-width="2.5"/><text x="154.63103278507808" y="171.9368863955119" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">X</text><text x="154.63103278507808" y="242.9396914446003" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Y</text><text x="137.2876207913595" y="345.4992987377279" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Z</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En X se da prioridad al localizador</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">del doble enlace. Debe quedar en 2, y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">el metil en 4. I es falsa.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En Y el triple enlace queda en 2 al</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">numerar desde el lado izquierdo y el</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">metil en 4. II es verdadera.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El anillo Z se numera para obtener el</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">conjunto mínimo 1,2,4. III es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">verdadera.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>