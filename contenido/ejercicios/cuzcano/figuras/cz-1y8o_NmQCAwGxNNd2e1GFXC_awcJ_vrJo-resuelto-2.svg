<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">002 · Dos triángulos con el mismo ángulo obtuso</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="105.48,211.59 217.63,211.59 366.86,326.95 172.77,326.95 105.48,211.59" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="105.48,211.59 366.86,326.95" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="217.63,211.59 247.84,303.14" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="132.03,263.32 137.52,259.66" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="280.34,293.53 284.00,286.21" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="100.90322580645164" y="203.35481178307933" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="218.54553287737627" y="201.52380311271475" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">N</text><text x="375.09677419354836" y="328.3211535354623" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="171.85481178307936" y="337.47619688728525" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="201.15095050891273" y="228.53118100059237" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">2ψ</text><text x="230.90484140233724" y="221.66489848672518" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">ψ</text><text x="214.8835155366471" y="277.5106629328451" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="182.84086380526685" y="313.67308417254566" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="245.0951585976628" y="261.94708923474604" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">E</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Prolonga PN hasta A tal que MA∥CP. El</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">paralelogramo PCMA da MA=PC=EM y</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">∠NAM=θ.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">En NEM y NAM la ley de senos da el</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">mismo seno para ∠ENM y ∠MNA, porque</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">comparten NM y el lado opuesto a ambos</text><text x="482" y="246" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">ángulos en N tiene igual longitud.</text><text x="482" y="269" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Ambos ángulos son agudos, pues θ es</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los tres ángulos entre NP y NA miden</text><text x="482" y="330" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">2ψ, ψ y ψ. Su suma es 180°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>