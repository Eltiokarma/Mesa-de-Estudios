<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">034 · Segmento vertical en una figura de 45°</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="147.58,329.98 329.03,148.53 329.03,390.47" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="147.58,329.98 329.03,329.98" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="208.06,269.50 329.03,390.47" fill="none" stroke="#008674" stroke-width="2.5"/><text x="141.52822580645162" y="335.72983870967744" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">A</text><text x="329.02822580645164" y="142.4838709677419" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">B</text><text x="332.0524193548387" y="396.51612903225805" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">C</text><text x="268.5443548387097" y="336.63709677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">D</text><text x="208.06048387096777" y="261.93951612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">M</text><text x="334.4717741935484" y="327.26209677419354" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">P</text><text x="208.06048387096777" y="336.93951612903226" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">4</text><text x="319.0483870967742" y="177.2620967741936" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">45°</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Toma A = (0,0), D = (4,0), P = (p,0).</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">El ángulo de 45° da B = (p,p) y la</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">recta AB cumple y = x.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Como D es punto medio de MC y C tiene</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">abscisa p, M tiene abscisa 8 − p y,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">por estar en AB, ordenada 8 − p.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">C tiene ordenada −(8 − p). La</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">distancia vertical de B a C es p + (8</text><text x="482" y="307" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">− p) = 8.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>