<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">019 · Suma en un triángulo con ángulos trisecados</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,338.05 196.87,200.95 375.10,338.05 100.90,338.05" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="196.87,200.95 196.87,291.78 375.10,338.05" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="100.90,338.05 213.32,253.73 375.10,338.05" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="196.87,200.95 268.85,299.66 100.90,338.05" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="135.17741935483872" y="317.48387096774195" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="200.2983870967742" y="223.22983870967747" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">θ</text><text x="333.96774193548384" y="319.1975806451613" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">γ</text><text x="207.1532258064516" y="288.3508064516129" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="217.43548387096774" y="266.0725806451612" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="261.991935483871" y="290.4072580645161" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">z</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Llama α, θ y γ a una parte en cada</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vértice. Por la suma interior,</text><text x="482" y="139" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α+θ+γ=60°.</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Los ángulos marcados, por los quiebres</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">de las trisectrices, son 3α+θ+γ,</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">α+3θ+γ y α+θ+3γ.</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Suma las tres expresiones. Cada letra</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">aparece con coeficiente total 5.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>