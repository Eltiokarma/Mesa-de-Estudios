<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">046 · Secante y tangente de dos rayos ortogonales</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="100.90,187.89 375.10,187.89" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="292.40,379.40 292.40,159.60" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="346.81,351.11 292.40,187.89 129.19,242.30" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="317.79,187.89 317.77,188.95 317.70,190.01 317.59,191.06 317.44,192.10 317.24,193.14 317.00,194.17 316.72,195.19 316.40,196.20 316.03,197.19 315.62,198.16 315.18,199.12 314.69,200.06 314.16,200.98 313.60,201.87 313.00,202.74 312.36,203.58 311.69,204.40 310.99,205.19 310.25,205.95 309.49,206.68 308.69,207.37 307.87,208.03 307.01,208.66 306.14,209.25 305.24,209.80 304.31,210.32 303.37,210.79 302.41,211.23 301.43,211.63 300.43,211.98" fill="none" stroke="#b0467a" stroke-width="2.5"/><polyline points="256.13,187.89 256.14,188.28 256.14,188.67 256.15,189.06 256.17,189.45 256.19,189.84 256.21,190.23 256.24,190.62 256.27,191.00 256.30,191.39 256.34,191.78 256.39,192.16 256.43,192.55 256.49,192.94 256.54,193.32 256.60,193.70 256.67,194.09 256.74,194.47 256.81,194.85 256.88,195.23 256.97,195.61 257.05,195.99 257.14,196.37 257.23,196.75 257.33,197.13 257.43,197.50 257.54,197.88 257.64,198.25 257.76,198.62 257.87,198.99 258.00,199.36" fill="none" stroke="#1766b0" stroke-width="2.5"/><text x="292.4034818228366" y="187.89477726574503" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">O</text><text x="375.0967741935484" y="193.3351254480287" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">x</text><text x="300.0199692780338" y="159.60496671786996" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">y</text><text x="314.1648745519713" y="209.65616999487966" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">α</text><text x="247.06724697047275" y="196.23664447858" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">β</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Para α usa el vector (1,−3). Su radio</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">es √10, así que sec²α=10.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La perpendicular en el tercer</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">cuadrante tiene dirección (−3,−1). Al</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">girarla 180° al sistema de β queda</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">(3,1).</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Entonces tan β=1/3 y la expresión es</text><text x="482" y="284" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">1−10.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>