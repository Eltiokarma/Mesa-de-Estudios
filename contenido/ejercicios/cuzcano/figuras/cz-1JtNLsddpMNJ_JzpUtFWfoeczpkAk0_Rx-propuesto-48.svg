<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540"><rect width="900" height="540" rx="18" fill="#f4f8fc"/><text x="25" y="36" font-family="Arial,sans-serif" font-size="20" fill="#20364b" text-anchor="start">048 · Desviación entre medios</text><line x1="455" y1="65" x2="455" y2="477" stroke="#d5e1ed" stroke-width="1"/><polyline points="115.22,269.50 360.78,269.50" fill="none" stroke="#1766b0" stroke-width="2.5"/><polyline points="233.77,142.48 233.77,396.52" fill="none" stroke="#d37618" stroke-width="2.5"/><polyline points="153.32,376.19 233.77,269.50 331.15,196.17" fill="none" stroke="#008674" stroke-width="2.5"/><polyline points="233.77,269.50 313.36,163.65" fill="none" stroke="#b0467a" stroke-width="2.5"/><text x="189.73387096774192" y="322.8467741935484" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">37°</text><text x="299.8145161290323" y="194.98387096774192" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">φ</text><text x="149.08870967741933" y="197.5241935483871" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Medio 1</text><text x="322.6774193548387" y="345.7096774193549" font-family="Arial,sans-serif" font-size="13" fill="#20364b" text-anchor="middle">Medio 2</text><text x="482" y="93" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La incidencia respecto de la normal</text><text x="482" y="116" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">vale 53°. Los índices son 15/4 y 5.</text><text x="482" y="154" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">La ley de Snell da sen r = (3/4) sen</text><text x="482" y="177" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">53° ≈ 0,6. El ángulo r es cercano a</text><text x="482" y="200" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">37°.</text><text x="482" y="238" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">Resta las direcciones, 53° − 37° ≈</text><text x="482" y="261" font-family="Arial,sans-serif" font-size="16" fill="#20364b" text-anchor="start">16°.</text><text x="482" y="475" font-family="Arial,sans-serif" font-size="15" fill="#008674" text-anchor="start">Resultado en la ficha y controles</text><text x="25" y="532" font-family="Arial,sans-serif" font-size="13" fill="#65788a" text-anchor="start">Esquema propio · Consulte las condiciones y el desarrollo completo de la ficha.</text></svg>