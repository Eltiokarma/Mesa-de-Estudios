<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mol, masa molar y composición</title>
<style>
/* Cáscara acogedora (crema, tarjetas cálidas, esquinas redondas; docs/diseno.md).
   Dentro del dibujo y de las ecuaciones solo mandan los colores de las variables (regla 4).

   Colores de esta escena (claro / oscuro). Revisados con CIEDE2000 y contraste WCAG sobre --paper y --card:
     Elementos (cada átomo y cada montón de un elemento lleva su color; el texto dice "átomos de H" o "moléculas de H₂O"):
       la paleta común de química (nucleo/elementos.js), en el bloque generado más abajo: H turquesa, C gris, O rojo,
       N azul, Ca lavanda, Mg azul pizarra, Fe gris acero, S añil y Cu cobre (definido, pero no sale en esta escena).
     Variables
       m  masa (g o u)            siena     #773922 / #e0a07a   (la de limitante-particulas)
       n  moles                   mostaza   #7d6a00 / #e3c84a   (la de limitante-particulas)
       M  masa molar (g/mol)      fucsia    #c400ad / #ff2ed8   (nuevo)
       partículas (cuántas hay) verde   #0a8200 / #2da500   (nuevo; sin letra: N es solo el nitrógeno)
       %  porcentaje en masa      tinta: cada tramo de la barra lleva el color de su elemento y el número va en tinta.
   Qué sale junto: todas las variables con todos los elementos del explorador (H, C, O, N, Ca, S, Fe; la segunda
   sustancia del explorador es siempre H₂, O₂ o H₂O); Mg solo con C; Fe nunca con N, S, Ca ni C; S nunca con N, Fe ni C.
   ΔE00 mínimo entre todo lo que sale junto (nucleo/elementos-escenas.test.js): 20,2 en claro (Ca–C) y 20,1 en oscuro
   (Ca–tinta). Contraste mínimo 4,54 (AA). Un color propio para % no entra: con M, N y % nuevos, lo mejor que encontramos
   (búsqueda exhaustiva por familias de tono) da ΔE00 20,4, pero con dos verdes casi iguales; por eso el porcentaje va en
   tinta, como el tiempo en cinética. Con la paleta común quedan resueltos C–tinta, C–Ca y m–O. Parecidos que nunca salen
   juntos: Fe–C y Mg–N (Elementos.CERCANOS); Cu–m 16 si se agrega un hidrato de cobre, hay que revisarlo. */
[hidden]{display:none!important}
:root{
  --bg:#fbf3ec; --card:#fffaf6; --paper:#fdf7f1; --ink:#2d2340; --muted:#716579; --line:#efe3dc; --grid:#f3e8e0;
  --acento:#ffd3e2; --acento-ink:#5c1f3d; --ok:#1d7f58; --warn:#c8363b;
  --shadow:0 1px 2px rgba(92,52,110,.05),0 10px 28px rgba(92,52,110,.09);
  --c-masa:#773922; --c-mol:#7d6a00; --c-Mm:#c400ad; --c-part:#0a8200;
  --vidrio:#8e97a8; --monton:#e3d5ca; --letra-atomo:#ffffff;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-masa:#e0a07a; --c-mol:#e3c84a; --c-Mm:#ff2ed8; --c-part:#2da500;
  --vidrio:#5e5670; --monton:#4a3d58; --letra-atomo:#1d1626; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-masa:#e0a07a; --c-mol:#e3c84a; --c-Mm:#ff2ed8; --c-part:#2da500;
  --vidrio:#5e5670; --monton:#4a3d58; --letra-atomo:#1d1626; color-scheme:dark }
/* Colores de los elementos: paleta común de química (nucleo/elementos.js). Este bloque sale de
   Elementos.css(['H', 'C', 'N', 'O', 'Mg', 'S', 'Ca', 'Fe', 'Cu']) y no se edita a mano: nucleo/elementos-escenas.test.js lo compara. */
:root{ --el-H:#0f766e; --el-C:#6b6b6b; --el-N:#136caa; --el-O:#c4284e; --el-Mg:#425697; --el-S:#3328c4; --el-Ca:#6a5b8f; --el-Fe:#6a676d; --el-Cu:#c52e03 }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --el-H:#5ed9c8; --el-C:#9a9a9a; --el-N:#4eb3f9; --el-O:#f17384; --el-Mg:#8db7ff; --el-S:#9f9bff; --el-Ca:#deb0f5; --el-Fe:#9e9ea4; --el-Cu:#ff8a3d } }
:root[data-theme="dark"]{ --el-H:#5ed9c8; --el-C:#9a9a9a; --el-N:#4eb3f9; --el-O:#f17384; --el-Mg:#8db7ff; --el-S:#9f9bff; --el-Ca:#deb0f5; --el-Fe:#9e9ea4; --el-Cu:#ff8a3d }

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--font); -webkit-text-size-adjust:100%}
.wrap{max-width:1240px; margin:0 auto; padding-block:18px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid; gap:16px}
.top{display:grid; gap:12px}
.eyebrow{margin:0; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700}
h1{margin:2px 0 0; font-size:clamp(1.65rem, 4.4vw, 2.1rem); line-height:1.1; letter-spacing:-.01em}
.sub{margin:4px 0 0; color:var(--muted); font-size:.95rem; max-width:60ch}

.tabs{display:flex; gap:4px; padding:5px; border-radius:999px; background:var(--card); box-shadow:var(--shadow); justify-self:start; max-width:100%}
.tabs a{padding:9px 16px; border-radius:999px; color:var(--muted); text-decoration:none; font-weight:700; white-space:nowrap; font-size:.95rem}
.tabs a[aria-current="page"]{background:var(--ink); color:var(--card)}
.tabs a:hover:not([aria-current]){color:var(--ink)}

.mode{display:grid; gap:16px; min-width:0; align-items:start}
.bench{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:10px; display:grid; gap:8px; min-width:0}
.lienzo{border-radius:16px; overflow:hidden; background:var(--paper); border:1px solid var(--line)}
/* Nada se arrastra en esta escena: el dedo siempre desplaza la página sobre el dibujo. */
canvas{display:block; width:100%; touch-action:pan-y; -webkit-user-select:none; user-select:none}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; padding:2px 8px 4px; font-size:.82rem; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:4px; border-radius:2px; display:inline-block}
.legend svg{flex:none}
.contar{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:0 6px 2px; font-size:.86rem; color:var(--muted); font-weight:700}

.guide{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:20px; display:grid; gap:14px; min-width:0}
.dots{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.dots button{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); color:var(--muted);
  font:700 .82rem var(--font); cursor:pointer; font-variant-numeric:tabular-nums}
.dots button.done{border-color:var(--ink); color:var(--ink)}
.dots button.on{background:var(--ink); border-color:var(--ink); color:var(--card)}
.dots button:disabled{opacity:.45; cursor:not-allowed}
.step-k{display:inline-block; margin:0; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; font-weight:800;
  color:var(--acento-ink); background:var(--acento); border-radius:999px; padding:3px 10px}
.step-t{margin:8px 0 0; font-size:1.35rem; line-height:1.2; text-wrap:balance}
.body{display:grid; gap:12px; min-width:0}
.body p{margin:0; max-width:66ch}
.problem{border-left:4px solid var(--acento); padding:6px 0 6px 14px; font-size:1.06rem; max-width:66ch}

.v{font-weight:800; border-radius:6px; padding:0 2px; cursor:pointer; text-decoration:underline dotted 1.5px; text-underline-offset:3px; white-space:nowrap}
.f{white-space:nowrap}
.f .v{padding:0; border-radius:3px}
.v-masa{color:var(--c-masa); background:color-mix(in srgb, var(--c-masa) 12%, transparent)}
.v-mol{color:var(--c-mol); background:color-mix(in srgb, var(--c-mol) 12%, transparent)}
.v-Mm{color:var(--c-Mm); background:color-mix(in srgb, var(--c-Mm) 12%, transparent)}
.v-part{color:var(--c-part); background:color-mix(in srgb, var(--c-part) 12%, transparent)}
.v-H{color:var(--el-H)} .v-C{color:var(--el-C)} .v-O{color:var(--el-O)} .v-N{color:var(--el-N)} .v-Ca{color:var(--el-Ca)}
.v-Mg{color:var(--el-Mg)} .v-Fe{color:var(--el-Fe)} .v-S{color:var(--el-S)} .v-Cu{color:var(--el-Cu)}
.v.hl{background:color-mix(in srgb, currentColor 26%, transparent)}

.eqs{display:grid; gap:10px; padding:14px; border-radius:16px; background:var(--paper); border:1px solid var(--line); overflow-x:auto}
.eq{display:flex; flex-wrap:wrap; align-items:center; gap:.42em; font-family:var(--mono); font-size:1.02rem; font-variant-numeric:tabular-nums; min-width:0}
.eq .note{font-family:var(--font); font-size:.84rem; color:var(--muted); white-space:normal; flex-basis:100%}
.eq .ex{white-space:normal; line-height:2}
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.15}
.frac > span:first-child{border-bottom:1.5px solid currentColor; padding:0 .25em}
.frac > span:last-child{padding:0 .25em}
.aviso{background:var(--acento); color:var(--acento-ink); border-radius:16px; padding:10px 14px; font-size:.93rem}
.tabla{border-collapse:collapse; font-family:var(--mono); font-size:.95rem; font-variant-numeric:tabular-nums}
.tabla th, .tabla td{padding:4px 10px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap}
.tabla thead th{white-space:normal}
.tabla th:first-child, .tabla td:first-child{text-align:left; font-family:var(--font); color:var(--muted); font-weight:700; font-size:.88rem; white-space:normal}
.scroll{overflow-x:auto; max-width:100%}

.opts{display:grid; grid-template-columns:1fr; gap:8px}
@media (min-width:560px){ .opts{grid-template-columns:repeat(2, minmax(0,1fr))} }
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; padding:12px 14px; border-radius:16px; border:2px solid var(--line);
  background:var(--paper); color:var(--ink); font:inherit; cursor:pointer; min-height:48px}
.opt .l{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:.85rem;
  background:var(--card); border:1.5px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 10%, var(--paper))}
.opt.correct .l{background:var(--ok); border-color:var(--ok); color:var(--card)}
.opt.wrong{border-color:var(--warn); background:color-mix(in srgb, var(--warn) 9%, var(--paper))}
.opt.wrong .l{background:var(--warn); border-color:var(--warn); color:var(--card)}
.fb{font-weight:700; margin:0}
.fb.ok{color:var(--ok)} .fb.mal{color:var(--warn)}

.ctrls{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap:12px; align-items:end}
.slider{display:grid; gap:4px}
.slider label{font-weight:700; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.slider output{font-family:var(--mono); color:var(--muted)}
input[type=range]{width:100%; accent-color:var(--ink); min-height:28px}
input.r-masa{accent-color:var(--c-masa)}
select{font:700 .95rem var(--font); padding:9px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); min-height:44px; max-width:100%}
.campo{display:grid; gap:4px; font-weight:700}
.botones{display:flex; flex-wrap:wrap; gap:6px}
.seg{display:inline-flex; flex-wrap:wrap; gap:4px; padding:4px; border-radius:999px; background:var(--paper); border:1px solid var(--line); justify-self:start; max-width:100%}
.seg button{font:700 .9rem var(--font); padding:8px 14px; border-radius:999px; border:0; background:transparent; color:var(--muted); cursor:pointer; min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--card)}
.seg button:disabled{opacity:.45; cursor:not-allowed}
.exps{border-radius:20px}
.lect{font-size:.92rem; font-variant-numeric:tabular-nums; display:grid; gap:4px}
.lect .fila{display:flex; flex-wrap:wrap; gap:2px 14px}
.barra{display:flex; height:22px; border-radius:8px; overflow:hidden; border:1px solid var(--line)}
.barra span{display:block; height:100%}
.barra-rot{display:flex; flex-wrap:wrap; gap:2px 14px; font-size:.88rem; font-family:var(--mono)}

.nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.btn{font:700 .95rem var(--font); padding:11px 20px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; min-height:44px}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--card)}
.btn:disabled{opacity:.45; cursor:not-allowed}
button:focus-visible, .v:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.hint{font-size:.88rem; color:var(--muted)}
.fuente{font-size:.86rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px}
.pie{margin:4px 0 0; text-align:center; color:var(--muted); font-size:.95rem}
.pie a{color:var(--ink); font-weight:700}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.volver-app{display:inline-block; margin:12px 16px 0; background:var(--card); color:var(--ink); box-shadow:var(--shadow);
  font:700 14px var(--font); padding:8px 16px; border-radius:999px; text-decoration:none}

/* Pantalla grande (laboratorio de cómputo, 1366 × 768): dibujo a la izquierda, fijo; guía a la derecha. */
@media (min-width:900px){
  .top{grid-template-columns:1fr auto; align-items:end}
  .mode{grid-template-columns:minmax(0, 1.25fr) minmax(360px, 1fr)}
  .bench{position:sticky; top:12px}
}

<script>

<script src="motor.js"></script>
<script src="../../nucleo/medicion.js"></script>
<script>
// Registro anónimo de predicciones (nucleo/medicion.js). Solo guarda si el alumno entró por la app.
const PLANTILLA = { id: 'mol-composicion', unidad: 'quimica.mol-y-composicion', version: '0.1.0' };
function registrarPrediccion(problema, opcion, correcta, error, respaldo, t0){
  if (!window.Medicion) return;
  Medicion.guardar({ tipo: 'prediccion', modulo: PLANTILLA.id, unidad: PLANTILLA.unidad, problema, opcion, correcta,
    error: correcta ? '' : error, respaldo: correcta ? '' : respaldo, ms: t0 ? Date.now() - t0 : '' }, PLANTILLA.version);
}

/* ================= Piezas compartidas =================
   Toda la química sale de MotorMol (motor.js): masas molares, moles, partículas, igualar masas, composición,
   fórmula empírica y molecular, Proust y el volumen de un líquido. Aquí solo se pinta lo que el motor dice.
   Tres niveles a la vez (Johnstone): arriba la balanza (lo que se pesa), al centro la lupa (las partículas o las
   porciones) y abajo la cuenta (los símbolos), con los mismos colores. */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TMAX = 0.16; // inclinación máxima de la balanza (rad)
const MM = MotorMol;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
// Coma decimal, espacio de miles (desde 5 cifras) y signo menos tipográfico.
function fmt(n, d){
  if (!Number.isFinite(n)) return '—';
  const p = Math.pow(10, d === undefined ? 1 : d), r = Math.round(n*p)/p + 0;
  let [e, f] = String(Math.abs(r)).split('.');
  if (e.length > 4) e = e.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (r < 0 ? '−' : '') + e + (f ? ',' + f : '');
}
const SUP = { '-':'⁻', '0':'⁰', '1':'¹', '2':'²', '3':'³', '4':'⁴', '5':'⁵', '6':'⁶', '7':'⁷', '8':'⁸', '9':'⁹' };
const SUB = { '0':'₀', '1':'₁', '2':'₂', '3':'₃', '4':'₄', '5':'₅', '6':'₆', '7':'₇', '8':'₈', '9':'₉' };
const sup = n => String(n).split('').map(ch => SUP[ch] || ch).join('');
const sub = f => String(f).replace(/\d/g, d => SUB[d]);
// Notación científica con coma: 6,02 × 10²³ (hasta 3 decimales, sin ceros de más).
function sci(x, d){
  if (!Number.isFinite(x)) return '—'; if (x === 0) return '0';
  let e = Math.floor(Math.log10(Math.abs(x))), m = x/Math.pow(10, e);
  const p = Math.pow(10, d === undefined ? 3 : d); m = Math.round(m*p)/p; if (m >= 10){ m /= 10; e++; }
  return `${fmt(m, d === undefined ? 3 : d)} × 10${sup(e)}`;
}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const esperar = (ms, fn) => setTimeout(fn, RM ? 0 : ms);
const NOMBRE = { H:'hidrógeno', C:'carbono', O:'oxígeno', N:'nitrógeno', Ca:'calcio', Mg:'magnesio', Fe:'hierro', S:'azufre', Cu:'cobre' };
const IONICOS = ['CaCO3', 'Fe2O3'];
// Qué se cuenta en una sustancia: átomos (un elemento suelto), unidades fórmula (sólido iónico) o moléculas.
const esElemento = f => /^[A-Z][a-z]?$/.test(f);
const particula = (f, plural) => esElemento(f) ? (plural === false ? 'átomo' : 'átomos') : IONICOS.includes(f) ? (plural === false ? 'unidad fórmula' : 'unidades fórmula') : (plural === false ? 'molécula' : 'moléculas');

/* ----- Texto en el lienzo, por piezas de colores -----
   Una línea es una lista de piezas [texto, clave de color, peso]. Si no entra en el ancho, baja la letra hasta 10 px;
   nunca se corta a medias ni se sale del dibujo. */
function anchoPiezas(ctx, c, ps, tam){ let w = 0; for (const [t, , peso, mono] of ps){ ctx.font = `${peso || 700} ${tam}px ${mono ? c.mono : c.font}`; w += ctx.measureText(t).width; } return w; }

  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

// Partir un texto en líneas que entren en el ancho (para los pies de la lupa).

const PLANTILLAS = {

  H2O:[['H',-.92,.58],['H',.92,.58],['O',0,-.12]],

  CH4:[['H',-.95,-.95],['H',.95,-.95],['H',-.95,.95],['H',.95,.95],['C',0,0]],
  NH3:[['H',0,-1.25],['H',-1.08,.66],['H',1.08,.66],['N',0,0]],
  CaCO3:[['Ca',-2.05,-.55],['O',.75,-1.55],['O',2.1,.78],['O',-.6,.78],['C',.75,0]],
  H2SO4:[['H',-2.5,.62],['H',2.5,-.62],['O',-1.6,0],['O',1.6,0],['O',0,-1.6],['O',0,1.6],['S',0,0]],

function plantilla(f){

  const at = MM.atomos(f), lista = []; for (const [e, n] of Object.entries(at)) for (let k = 0; k < n; k++) lista.push(e);

// Puntos de una cuadrícula hexagonal dentro de un círculo, mezclados con semilla: para repartir n figuras.
function puntosEnCirculo(n, r, sem){
  if (n <= 0) return { pts:[], d:r };

    pts = [];

      const x = (i + (j % 2 ? 0.5 : 0))*d, y = j*d*0.866;
      if (Math.hypot(x, y) <= r - d*0.5) pts.push([x, y]);

const fmtMol = x => x >= 100 ? fmt(x, 1) : x >= 1 ? fmt(x, 3) : x >= 0.001 ? fmt(x, 5) : sci(x);

/* ----- La escena -----
   E.vista dice qué se ve:
     bal:   { izq:[cosas], der:[cosas], u:'g'|'u' }  cosa = { f, m, tipo:'monton'|'atomos'|'pesa'|'bloques', n, etq, ocultaM }
     lupa:  { tapa:'texto' } | { lentes:[{ figs:[{ f, n }], vacio }], pie:'texto' } | { agrupar:{…} } | { escala:true } | { unidad:'CaCO3' }
     cuenta:{ cols:[{ f, m, n, M, N, etq }] } | { lineas:[[piezas]] }

const ESCENAS = [];
function crearEscena(cv, idDesc, modoId, idLey, idCnt){

  const llave = w => { const v = E.vista; return `${w}|${v.bal ? 1 : 0}|${JSON.stringify(v.lupa ? Object.keys(v.lupa) : [])}|${v.lupa && v.lupa.lentes ? v.lupa.lentes.length : 0}|${v.lupa && v.lupa.pie}|${v.cuenta ? (v.cuenta.cols ? 'c' : v.cuenta.lineas.length) : 0}`; };
  function layout(w){
    const v = E.vista, chico = w < 560, L = {};
    // Separación de los platillos: en dos lupas, cada platillo queda sobre su lupa.
    const rL = Math.min((w - 52)/4, 92);
    L.sep = chico ? Math.max(rL + 12, w*0.24) : Math.min(w*0.29, 210);
    L.pw = Math.min(L.sep*1.7, chico ? w/2 - 14 : 150);

    if (v.bal){ const sube = L.sep*Math.sin(TMAX), h = 16 + 2*sube + 58 + 44; L.bal = { y, h, cx:w/2, py:y + 16 + sube }; y += h + 4; }

      const r = dos ? Math.min((w - 52)/4, 92) : Math.min(w/2 - 28, chico ? 112 : 124);
      ctx.font = `700 12px ${css('--font')}`;
      const pieTxt = v.lupa.pie || v.lupa.tapa, pie = pieTxt ? envolver(ctx, colores(), pieTxt, w - 28, 12) : [];

      ctx.strokeStyle = c.muted; ctx.lineWidth = 1.2; linea(ctx, x, y, x - pw/2 + 6, yp); linea(ctx, x, y, x + pw/2 - 6, yp);

          ctx.font = `800 7.5px ${c.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; let xx = px - 9;

  ['c', '20'],
  ['d', '2', 'divide-masas-atomicas', RES('hipotesis', 'hipótesis nuestra')]],
  fb:{ c:'¡Bien! Cada átomo de C pesa la mitad que uno de Mg: hacen falta el doble de átomos, 20, para la misma masa. Mira cómo caen al platillo.',
    a:'Elegiste la 1. A igual masa no hay igual número de átomos: los de C pesan la mitad, así que hacen falta más. Según León Vega y López González (2020), 13 de 28 escolares eligieron "la misma cantidad" en una pregunta parecida. La correcta está marcada.',
    b:'Elegiste la 2. Es al revés: el átomo más liviano necesita más compañeros para pesar lo mismo, no menos. Según León Vega y López González (2020), 10 de 28 escolares respondieron así en una pregunta parecida. La correcta está marcada.',
    d:'Elegiste la 4. 2 es cuántas veces pesa un Mg más que un C, no cuántos átomos de C hacen falta. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.' } };
const P2 = { id:'mol-paso6', ok:'b', opts:[
  ['a', Fh('C3H'), 'ES16-razon-de-masas', RES('documentado', 'Christianto y otros 2025: entre 16 % y 25 % de 32')],
  ['b', Fh('CH4')],
  ['c', Fh('CH3'), 'redondea-mal-CH3', RES('hipotesis', 'hipótesis nuestra')],
  ['d', Fh('C2H8'), 'no-simplifica-C2H8', RES('hipotesis', 'hipótesis nuestra')]],
  fb:{ b:'¡Bien! Hay que comparar moles, no gramos: 75 g de C son 6,25 mol y 25 g de H son 25 mol, de 1 a 4. Mira la lupa: las porciones se juntan en grupos CH₄.',
    a:'Elegiste la 1. 75 a 25 es la razón de las masas, no la de los átomos: un átomo de C pesa 12 veces más que uno de H. Antes de comparar hay que pasar a moles. Según Christianto y otros (2025), entre el 16 % y el 25 % de 32 escolares, según la pregunta, eligió esta idea con confianza alta. La correcta está marcada.',
    c:'Elegiste la 3. Con los moles, la razón sale exacta: 25 entre 6,25 es 4, no 3. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.',
    d:'Elegiste la 4. C₂H₈ tiene la misma proporción que CH₄, pero la fórmula empírica es la más simple: se divide entre 2. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.' } };
const P3 = { id:'mol-paso8', ok:'b', opts:[
  ['a', Fh('CH2O'), 'ES17-empirica-es-molecular', RES('documentado', 'Christianto y otros 2025: 16 % de 32')],
  ['b', Fh(GLU.formula)],
  ['c', Fh(SOLO_C), 'multiplica-solo-el-C', RES('hipotesis', 'hipótesis nuestra')],
  ['d', Fh(MITAD), 'k-equivocado', RES('hipotesis', 'hipótesis nuestra')]],
  fb:{ b:`¡Bien! CH₂O pesa 30 g/mol, y ${MMOL} entre 30 es ${GLU.k}: la molécula tiene ${GLU.k} veces la fórmula empírica. Mira la balanza: ${GLU.k} mol de CH₂O pesan lo mismo que 1 mol del compuesto.`,
    a:`Elegiste la 1. CH₂O es la proporción más simple, pero pesa 30 g/mol y el compuesto pesa ${MMOL}: la molécula es ${GLU.k} veces más grande. La empírica y la molecular coinciden solo a veces. Según Christianto y otros (2025), el 16 % de 32 escolares eligió esta idea con confianza alta. La correcta está marcada.`,
    c:`Elegiste la 3. Se multiplicó solo el carbono. Al multiplicar la fórmula empírica por ${GLU.k}, se multiplica cada subíndice: el del C, el del H y el del O. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.`,
    d:`Elegiste la 4. ${sub(MITAD)} pesa 90 g/mol, no ${MMOL}. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.` } };

// ----- Vistas -----
const NUM = 10; // en los pasos 2 y 3, cada figura es 0,1 mol de moléculas
const vMol = r => ({
  bal:{ izq:[{ f:'O2', m:32 }], der:[{ f:'H2O', m:18 }], u:'g' },
  lupa: r ? { lentes:[{ figs:[{ f:'O2', n:NUM }] }, { figs:[{ f:'H2O', n:NUM }] }], pie:`Cada figura es ${textoPorcion(0.1, 'O2')}. En cada lupa hay ${NUM}.`, desc:`${NUM} figuras de O₂ y ${NUM} de H₂O.` }
    : { tapa:r === false ? 'Responde para ver la lupa' : 'Responde en el paso 2 para verla' },
  cuenta:{ cols:[{ ...col('O2', 32, r), phN:r === false ? 'moléculas: responde primero' : 'moléculas: responde en el paso 2' }, { ...col('H2O', 18, r), phN:r === false ? 'moléculas: responde primero' : 'moléculas: responde en el paso 2' }] },
  vars:['masa', 'Mm', 'mol', ...(r ? ['part'] : [])] });
// Pasos 4 y 5: 10 átomos de Mg contra átomos de C, en u. Aquí cada figura es un átomo de verdad.
const vMg = (nC, r) => ({
  bal:{ izq:[{ f:'Mg', m:24, tipo:'atomos', n:10, ocultaM:!r }], der: nC ? [{ f:'C', m:12, tipo:'atomos', n:nC }] : [], u:'u', vacio:{ der:'átomos de C: ?' } },
  lupa:{ lentes:[{ figs:[{ f:'Mg', n:10 }] }, { figs:[{ f:'C', n:nC }], vacio:r ? '' : 'todavía nada' }], pie:'Aquí cada figura es un átomo de verdad, no una porción: 1 átomo de Mg pesa 24 u y 1 átomo de C, 12 u.', desc:`10 átomos de Mg y ${nC} de C.` },
  cuenta:{ lineas: r ? [[['10 × 24 u = ', 'ink'], [`${fmt(10*24, 0)} u`, 'masa', 800], ['   en el platillo de Mg', 'muted']],
      [[`${nC} × 12 u = `, 'ink'], [`${fmt(nC*12, 0)} u`, 'masa', 800], ['   en el platillo de C', 'muted']]]
    : [[['1 átomo de ', 'ink'], ...pzF('Mg'), [': ', 'ink'], ['24 u', 'masa', 800], ['    1 átomo de ', 'ink'], ...pzF('C'), [': ', 'ink'], ['12 u', 'masa', 800]], [['¿Cuántos átomos de C equilibran la balanza?', 'muted']]],
    leer: r ? `10 por 24 u son 240 u; ${nC} por 12 u son ${nC*12} u.` : '' },
  vars:['masa'] });
// Pasos 6 y 7: 100 g de un compuesto con 75 % de C y 25 % de H. Porciones de 1,25 mol de átomos.
const POR = 1.25, nCp = Math.round(EMP.moles.C/POR), nHp = Math.round(EMP.moles.H/POR);
const vComp = (r, p) => ({
  bal:{ izq:[{ f:'C', m:75, etq:[...pzF('C'), [' en la muestra', 'ink']] }], der:[{ f:'H', m:25, etq:[...pzF('H'), [' en la muestra', 'ink']] }], u:'g' },
  lupa: r ? { agrupar:{ partes:[{ e:'C', n:nCp }, { e:'H', n:nHp }], grupo:EMP.formula, k:nCp, p }, pie:`Cada punto es una porción de ${fmt(POR, 2)} mol de átomos: de C los grises, de H los turquesa. ${p > 0.98 ? `Se juntan en ${nCp} grupos ${sub(EMP.formula)}.` : ''}`, desc:`${nCp} porciones de C y ${nHp} de H${p > 0.98 ? `, juntas en ${nCp} grupos CH₄` : ''}.` }
    : { tapa:'Responde para ver la lupa' },
  cuenta:{ lineas: r ? [
      [...pzF('C'), [': ', 'ink'], ['75 g', 'masa', 800], [' ÷ ', 'ink'], ['12 g/mol', 'Mm', 800], [' = ', 'ink'], [`${fmt(EMP.moles.C, 2)} mol`, 'mol', 800], [` → ÷ ${fmt(EMP.moles.C, 2)} = ${fmt(EMP.razon.C, 2)}`, 'ink']],
      [...pzF('H'), [': ', 'ink'], ['25 g', 'masa', 800], [' ÷ ', 'ink'], ['1 g/mol', 'Mm', 800], [' = ', 'ink'], [`${fmt(EMP.moles.H, 2)} mol`, 'mol', 800], [` → ÷ ${fmt(EMP.moles.C, 2)} = ${fmt(EMP.razon.H, 2)}`, 'ink']],
      [['Fórmula empírica: ', 'ink'], ...pzF(EMP.formula)]]
    : [[...pzF('C'), [': ', 'ink'], ['75 g', 'masa', 800], ['  (masa atómica 12)', 'muted'], ['     ', 'ink'], ...pzF('H'), [': ', 'ink'], ['25 g', 'masa', 800], ['  (masa atómica 1)', 'muted']], [['¿Cuál es la fórmula empírica?', 'muted']]],
    leer: r ? `Carbono: 75 g entre 12 g/mol son ${fmt(EMP.moles.C, 2)} mol. Hidrógeno: 25 g entre 1 son 25 mol. Divididos entre ${fmt(EMP.moles.C, 2)}: 1 y 4. Fórmula empírica CH4.` : '' },
  vars: r ? ['masa', 'Mm', 'mol'] : ['masa'] });
// Paso 8: un compuesto sin nombre (150 g/mol) contra moles de CH₂O que caen al otro platillo.
const vGlu = (r, k) => ({
  bal:{ izq:[{ f:GLU.formula, m:MMOL, etq:[['1 mol del compuesto', 'ink']], nombre:'el compuesto' }], der: k ? [{ f:'CH2O', m:GLU.Mempirica, tipo:'bloques', n:k, etq:[[`${k} mol`, 'mol', 800], [' de ', 'ink'], ...pzF('CH2O')] }] : [], u:'g', vacio:{ der:'mol de CH₂O: ?' } },
  lupa: r && k === GLU.k ? { lentes:[{ figs:[{ f:GLU.formula, n:1 }] }, { figs:[{ f:'CH2O', n:GLU.k }] }], pie:`Cada figura es una porción de 1 mol: de moléculas del compuesto (izquierda) o de grupos CH₂O (derecha). El compuesto tiene los mismos átomos que ${GLU.k} CH₂O.`, desc:`Una porción de 1 mol de moléculas del compuesto y ${GLU.k} porciones de 1 mol de grupos CH2O: los mismos átomos.` }
    : { tapa: r ? 'Mira la balanza' : 'Responde para ver la lupa' },
  cuenta:{ lineas: r ? [[...pzF('CH2O'), [': 12 + 2 × 1 + 16 = ', 'ink'], [`${fmt(GLU.Mempirica, 0)} g/mol`, 'Mm', 800]],
      [['k = ', 'ink'], [String(MMOL), 'Mm', 800], [' ÷ ', 'ink'], ['30', 'Mm', 800], [` = ${GLU.k}`, 'ink', 800], ['   →   ', 'ink'], ...pzF(GLU.formula)]]
    : [[['Fórmula empírica: ', 'ink'], ...pzF('CH2O'), ['     ', 'ink'], [`M = ${MMOL} g/mol`, 'Mm', 800]], [['¿Cuál es la fórmula molecular?', 'muted']]],
    leer: r ? `CH2O pesa 30 g/mol; ${MMOL} entre 30 es ${GLU.k}; la fórmula molecular es ${GLU.formula}.` : '' },
  vars:['masa', 'Mm'] });

const steps = [
 { k:'Paso 1', t:'El problema', vista:() => vMol(undefined),
   body:() => `<p class="problem">En un platillo hay 1 mol de ${Fh('O2')}, que pesa ${m_('32 g')}. En el otro, 1 mol de ${Fh('H2O')}, que pesa ${m_('18 g')}. ¿Dónde hay más moléculas?</p>
   <p>El mol sirve para contar partículas pesando. Es un paquete, como la docena: una docena son 12 cosas y un mol son ${N_(NA_TXT)} partículas. Son tantas que no se cuentan de una en una: se pesan.</p>
   <p>Arriba, la balanza muestra lo que se pesa (la ${m_('masa m')}). Al centro, la lupa mostrará las partículas, pero todavía está tapada. Abajo está la cuenta: la ${M_('masa molar M')}, que es cuánto pesa 1 mol, y los ${n_('moles n')}.</p>
   <p class="hint">Cada elemento tiene su color en el texto, en la lupa y en la cuenta: ${Fh('O')} el oxígeno y ${Fh('H')} el hidrógeno. Toca un color del texto para resaltarlo en el dibujo.</p>` },
 { k:'Paso 2', t:'Antes de mirar, predice', gate:P0, vista:r => vMol(r ? true : false),
   body:() => `<p>1 mol de ${Fh('O2')} (${m_('32 g')}) y 1 mol de ${Fh('H2O')} (${m_('18 g')}). ¿Dónde hay más moléculas?</p>${opcionesHTML(P0.opts, 'fb')}
   <p class="hint" id="tras" hidden>Ahora la lupa está abierta. Debajo del dibujo puedes cambiar la cuenta entre moléculas y átomos.</p>` },
 { k:'Paso 3', t:'Lo mismo de moléculas, distinto peso', vista:() => vMol(true),
   body:() => `<p>En la lupa hay el mismo número de figuras a cada lado: 1 mol de cualquier sustancia tiene ${N_(NA_TXT)} partículas. La balanza se inclina hacia el ${Fh('O2')} porque cada molécula de ${Fh('O2')} pesa 32 u y cada una de ${Fh('H2O')}, 18 u.</p>
   <div class="eqs">
     <div class="eq"><span class="ex">${n_('n')} = ${fr(m_('m'), M_('M'))}: &nbsp; ${fr(m_('32 g'), M_('32 g/mol'))} = ${n_('1 mol')} de ${Fh('O2')} &nbsp; y &nbsp; ${fr(m_('18 g'), M_('18 g/mol'))} = ${n_('1 mol')} de ${Fh('H2O')}</span></div>
     <div class="eq"><span class="ex">${N_('partículas')} = ${n_('n')} × 6,02 × 10²³ = ${n_('1')} × 6,02 × 10²³ = ${N_(NA_TXT + ' moléculas')}, en los dos</span><span class="note">6,02 × 10²³ por mol es el número de Avogadro (Nₐ): cuántas partículas hay en un paquete.</span></div>
   </div>
   <p>Ahora cambia la cuenta a <b>átomos</b> (debajo del dibujo). Cada molécula de ${Fh('H2O')} tiene 3 átomos y cada una de ${Fh('O2')}, 2. Con las mismas moléculas, el agua tiene más átomos: ${N_(sci(3*MM.NA))} contra ${N_(sci(2*MM.NA))}. Por eso siempre hay que decir qué se cuenta: moléculas de ${Fh('H2O')} o átomos de ${Fh('H')}.</p>
   <p class="fuente">Según Dahsah y otros (2006), solo el 33 % de 97 escolares razonó bien que 1 mol de O₂ y 1 mol de H₂O tienen el mismo número de moléculas. Confundir moléculas con átomos está documentado en el mismo estudio, sin porcentaje. Que todo mol ocupa 22,4 L lo sostuvo el 11 % de 97.</p>` },
 { k:'Paso 4', t:'Átomos que pesan distinto: predice', gate:P1, vista:r => vMg(r ? MG10.valor : 0, !!r),
   body:() => `<p>Ahora no hay moles: en un platillo hay 10 átomos sueltos de ${Fh('Mg')}. Un átomo de ${Fh('Mg')} pesa ${m_('24 u')} y uno de ${Fh('C')}, ${m_('12 u')} (u es la unidad de masa atómica). ¿Cuántos átomos de ${Fh('C')} pesan lo mismo que los 10 de ${Fh('Mg')}?</p>${opcionesHTML(P1.opts, 'fb')}` },
 { k:'Paso 5', t:'Del átomo al mol', vista:() => vMg(MG10.valor, true),
   body:() => `<p>Los átomos de ${Fh('C')} cayeron uno a uno hasta que la balanza quedó pareja: con ${MG10.valor}. Como cada uno pesa la mitad, hacen falta el doble.</p>
   <div class="eqs">
     <div class="eq"><span class="ex">10 × ${m_('24 u')} = ${m_('240 u')} = ${MG10.valor} × ${m_('12 u')}</span></div>
   </div>
   <p>El puente con los gramos: si en vez de 1 átomo se juntan ${N_(NA_TXT)}, la masa en u pasa a ser la misma cifra en gramos. ${N_(NA_TXT)} átomos de ${Fh('C')} pesan ${m_('12 g')}, y ${N_(NA_TXT)} átomos de ${Fh('Mg')}, ${m_('24 g')}. Por eso la masa molar tiene la misma cifra: ${M_('12 g/mol')} y ${M_('24 g/mol')}.</p>
   <div class="eqs">
     <div class="eq"><span class="ex">1 átomo de ${Fh('C')}: ${m_('12 u')} ≈ ${m_(sci(MM.masaParticula('C')) + ' g')}</span><span class="note">Es la masa molar entre 6,02 × 10²³: 12 g/mol ÷ 6,02 × 10²³. Un átomo solo no se nota en ninguna balanza: hay que juntar 6,02 × 10²³ para tener 12 g.</span></div>
     <div class="eq"><span class="ex">${N_(NA_TXT)} átomos de ${Fh('C')} = ${n_('1 mol')} → ${m_('12 g')}</span></div>
   </div>
   <p>El mol convierte las u en gramos. "Un átomo de carbono pesa 12 g" es un error: pesa 12 u; los 12 g son de un mol de átomos.</p>
   <div class="nav"><span></span>${otraVez}</div>
   <p class="fuente">Según Dahsah y otros (2006), solo el 10 % de 97 escolares razonó bien qué es la masa atómica. Que a igual masa hay igual número de átomos (13 de 28) y la razón al revés (10 de 28) salen de León Vega y López González (2020), en una pregunta parecida.</p>` },
 { k:'Paso 6', t:'La composición: predice', gate:P2, vista:r => vComp(!!r, r ? 1 : 0),
   body:() => `<p class="problem">Un compuesto tiene 75 % de ${Fh('C')} y 25 % de ${Fh('H')} en masa. ¿Cuál es su fórmula empírica?</p>
   <p>Se toma una muestra de 100 g: la balanza muestra ${m_('75 g')} de ${Fh('C')} y ${m_('25 g')} de ${Fh('H')}. La fórmula empírica es la proporción más simple de átomos.</p>${opcionesHTML(P2.opts, 'fb')}` },
 { k:'Paso 7', t:'Moles, no gramos', vista:() => vComp(true, 1),
   body:() => { const cm = MM.composicion(EMP.formula);
     return `<p>La lupa convierte cada montón en porciones iguales de moles: cada punto es ${n_(fmt(POR, 2) + ' mol')} de átomos. Los ${m_('75 g')} de ${Fh('C')} son ${nCp} puntos y los ${m_('25 g')} de ${Fh('H')}, ${nHp}. Al juntarlos salen ${nCp} grupos de 1 ${Fh('C')} y 4 ${Fh('H')}.</p>
   <div class="eqs">
     <div class="eq"><span class="ex">1. Moles:</span></div>
     <div class="eq"><span class="ex">${Fh('C')}: ${fr(m_('75 g'), M_('12 g/mol'))} = ${n_(fmt(EMP.moles.C, 2) + ' mol')}</span></div>
     <div class="eq"><span class="ex">${Fh('H')}: ${fr(m_('25 g'), M_('1 g/mol'))} = ${n_(fmt(EMP.moles.H, 2) + ' mol')}</span></div>
     <div class="eq"><span class="ex">2. Entre el menor:</span></div>
     <div class="eq"><span class="ex">${Fh('C')}: ${fr(n_(fmt(EMP.moles.C, 2)), n_(fmt(EMP.moles.C, 2)))} = ${fmt(EMP.razon.C, 2)}</span></div>
     <div class="eq"><span class="ex">${Fh('H')}: ${fr(n_(fmt(EMP.moles.H, 2)), n_(fmt(EMP.moles.C, 2)))} = ${fmt(EMP.razon.H, 2)}</span></div>
     <div class="eq"><span class="ex">3. Fórmula empírica: ${Fh(EMP.formula)}</span><span class="note">Si la división diera 1,5 o 2,5, se multiplicaría todo por 2 (en "¿Qué pasa si…?" hay un caso).</span></div>
   </div>
   <p>De vuelta: ${Fh('CH4')} pesa ${M_(fmt(cm.M, 0) + ' g/mol')}, y su carbono, 12. El porcentaje de C es ${fr('12', fmt(cm.M, 0))} × 100 = ${fmt(cm.porcentajes.C, 1)} %: el dato del problema.</p>
   <div class="nav"><span></span>${otraVez}</div>
   <p class="fuente">Usar la razón de masas como fórmula (C₃H): según Christianto y otros (2025), entre el 16 % y el 25 % de 32 escolares, según la pregunta, eligió esta idea con confianza alta. CH₃ y C₂H₈ son hipótesis nuestras.</p>`; } },
 { k:'Paso 8', t:'Empírica y molecular: predice', gate:P3, vista:r => vGlu(!!r, r ? GLU.k : 0),
   body:() => `<p class="problem">Un compuesto tiene fórmula empírica ${Fh('CH2O')} y masa molar ${M_(MMOL + ' g/mol')}. ¿Cuál es su fórmula molecular?</p>
   <p>En la balanza, 1 mol del compuesto (${m_(MMOL + ' g')}). El otro platillo espera.</p>${opcionesHTML(P3.opts, 'fb')}<div id="tras8" class="body"></div>` },
 { k:'Paso 9', t:'Ahora explora tú', explora:true, vista:() => vistaExp(),
   body:() => `<div class="ctrls">
     <label class="campo" for="xA">Sustancia del platillo izquierdo<select id="xA">${['H2O', 'CO2', 'CH4', 'CaCO3', 'H2SO4', 'NH3', 'Fe2O3', 'C6H12O6'].map(f => `<option value="${f}">${sub(f)}</option>`).join('')}</select></label>
     <div class="slider"><label for="mA"><span>Masa (${m_('m')})</span><output id="mA-o"></output></label><input id="mA" class="r-masa" type="range" min="1" max="200" step="1" value="18"></div>
     <label class="campo" for="xB">Sustancia del platillo derecho<select id="xB">${['H2', 'O2', 'H2O'].map(f => `<option value="${f}">${sub(f)}</option>`).join('')}</select></label>
     <div class="slider"><label for="mB"><span>Masa (${m_('m')})</span><output id="mB-o"></output></label><input id="mB" class="r-masa" type="range" min="1" max="400" step="1" value="32"></div>
   </div>
   <div class="botones" role="group" aria-label="Comparar"><button type="button" class="btn" id="igG">Mismos gramos</button><button type="button" class="btn" id="igN">Mismos moles</button><button type="button" class="btn" id="reset">Volver a empezar</button></div>
   <div class="lect" id="live" aria-live="off"></div>
   <p class="hint">Pista: con "mismos gramos", mira cuál lupa se llena más. Con "mismos moles", las lupas quedan iguales y la balanza se inclina. Cambia la cuenta a átomos para ver cuántos hay en total.</p>` },
];

// ----- Explorador -----
const X = { A:'H2O', mA:18, B:'O2', mB:32 };
function vistaExp(){
  const a = MM.moles(X.A, { gramos:X.mA }), b = MM.moles(X.B, { gramos:X.mB });
  const L = lentesPara([X.A, X.B], [a.n, b.n], 24);
  return { bal:{ izq:[{ f:X.A, m:X.mA }], der:[{ f:X.B, m:X.mB }], u:'g' },
    lupa:{ lentes:L.lentes, pie:`Cada figura es una porción de ${fmtMol(L.p)} mol (${sci(L.p*MM.NA)} ${particula(X.A) === particula(X.B) ? particula(X.A) : particula(X.A) + ' o ' + particula(X.B)})${L.exactas ? '' : '; las cuentas están redondeadas'}.`, desc:`${L.lentes[0].figs[0].n} figuras de ${sub(X.A)} y ${L.lentes[1].figs[0].n} de ${sub(X.B)}.` },
    cuenta:{ cols:[col(X.A, X.mA, true), col(X.B, X.mB, true)] }, vars:['masa', 'Mm', 'mol', 'part', 'pct'] };
}
function explorar(){
  const vivo = () => {
    $('mA-o').textContent = `${fmt(X.mA, 2)} g`; $('mB-o').textContent = `${fmt(X.mB, 2)} g`;
    E.vista = vistaExp(); E.dibujar(); pedir();
    const fila = f => { const r = MM.moles(f, { gramos: f === X.A ? X.mA : X.mB });
      return `<div class="fila"><b>${Fh(f)}</b><span>${n_(fmtMol(r.n) + ' mol')}</span><span>${N_(sci(r.moleculas))} ${particula(f)}</span><span>${N_(sci(r.atomos))} átomos</span></div>`; };
    const cp = MM.composicion(X.A).porcentajes;
    $('live').innerHTML = fila(X.A) + fila(X.B) + `<div>Composición de ${Fh(X.A)} en masa:</div><div class="barra" role="img" aria-label="Composición de ${sub(X.A)}: ${Object.entries(cp).map(([e, p]) => `${NOMBRE[e]} ${fmt(p, 1)} %`).join(', ')}">${Object.entries(cp).map(([e, p]) => `<span style="width:${p}%; background:var(--el-${e})"></span>`).join('')}</div>
      <div class="barra-rot">${Object.entries(cp).map(([e, p]) => `<span>${Fh(e)} ${fmt(p, 1)} %</span>`).join('')}</div>`;
  };
  $('xA').value = X.A; $('xB').value = X.B; $('mA').value = X.mA; $('mB').value = Math.round(X.mB);
  $('xA').onchange = () => { X.A = $('xA').value; vivo(); E.describir(true); };
  $('xB').onchange = () => { X.B = $('xB').value; vivo(); E.describir(true); };
  $('mA').oninput = () => { X.mA = +$('mA').value; vivo(); };
  $('mB').oninput = () => { X.mB = +$('mB').value; vivo(); };
  $('mA').onchange = $('mB').onchange = () => E.describir(true);
  $('igG').onclick = () => { X.mB = X.mA; $('mB').value = Math.round(X.mB); vivo(); E.describir(true); };
  $('igN').onclick = () => { const n = MM.moles(X.A, { gramos:X.mA }).n, M = MM.masaMolar(X.B).valor;
    // Mismos moles exactos; si no entran en el deslizador de la derecha, se achica el de la izquierda.
    if (n*M > 400){ X.mA = Math.floor(400/M*MM.masaMolar(X.A).valor); $('mA').value = X.mA; }
    X.mB = MM.moles(X.A, { gramos:X.mA }).n*M; $('mB').value = Math.round(X.mB); vivo(); E.describir(true); };
  $('reset').onclick = () => { Object.assign(X, { A:'H2O', mA:18, B:'O2', mB:32 }); $('xA').value = X.A; $('xB').value = X.B; $('mA').value = 18; $('mB').value = 32; vivo(); E.describir(true); };
  vivo();
}

// ----- Navegación -----
const dots = $('dots');
steps.forEach((s, n) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.textContent = n + 1; b.addEventListener('click', () => go(n)); li.appendChild(b); dots.appendChild(li);
});
// Lo que pasa después de responder (o al pedir "Ver de nuevo"): caen los átomos de C, se agrupan las porciones, caen los CH₂O.
function mostrar(n){
  cortar(E);
  if (n === 3 || n === 4){
    E.vista = vMg(0, true); E.dibujar();
    animar(E, MG10.valor*0.11, f => { const k = Math.round(f*MG10.valor); if (k !== (E.vista.bal.der[0] || { n:0 }).n){ E.vista = vMg(k, true); } }, () => { E.vista = vMg(MG10.valor, true); E.describir(true); }, 0.25);
  } else if (n === 5 || n === 6){
    E.vista = vComp(true, 0); E.dibujar();
    animar(E, 1.4, f => { E.vista = vComp(true, f); }, () => { E.vista = vComp(true, 1); E.describir(true); }, 0.8);
  } else if (n === 7){
    E.vista = vGlu(true, 0); E.dibujar();
    animar(E, GLU.k*0.35, f => { const k = Math.round(f*GLU.k); E.vista = vGlu(true, k); }, () => { E.vista = vGlu(true, GLU.k); E.describir(true); }, 0.25);
  } else E.vista = steps[n].vista(true);
  pedir();
}
function enlazarRepetir(){ const rep = $('stepBody').querySelector('[data-repetir]'); if (rep) rep.onclick = () => { mostrar(S.step); E.describir(true); }; }
function go(n){
  if (n < 0 || n >= steps.length || n > S.max) return;
  const s = steps[n], previo = S.step; S.step = n; cortar(E);
  const r = s.gate ? !!S.pred[s.gate.id] : true;
  E.vista = s.vista(s.gate ? (r || null) : undefined);
  // Pasos que muestran una animación: si se llega desde la predicción anterior, la animación ya corrió.
  if ((n === 4 && previo === 3) || (n === 6 && previo === 5)) E.vista = s.vista();
  else if ((n === 4 || n === 6) && previo !== n - 1) mostrar(n);
  $('stepK').textContent = `${s.k} de ${steps.length}`;
  $('stepT').textContent = s.t;
  $('stepBody').innerHTML = s.body();
  enlazarRepetir(); pintarDots();
  if (s.gate) prediccion(s);
  if (s.explora) explorar();
  nav(); E.dibujar(); pedir(); E.describir(true);
}
function nav(){
  const s = steps[S.step];
  $('prev').disabled = S.step === 0;
  $('next').disabled = S.step === steps.length - 1 || (s.gate && !S.pred[s.gate.id]);
  $('next').textContent = s.gate && !S.pred[s.gate.id] ? 'Elige una opción' : 'Siguiente';
}
function pintarDots(){
  [...dots.querySelectorAll('button')].forEach((b, k) => {
    b.className = k === S.step ? 'on' : (k <= S.max ? 'done' : ''); b.disabled = k > S.max;
    b.setAttribute('aria-label', k > S.max ? `Paso ${k + 1}, bloqueado` : `Ir al ${steps[k].k.toLowerCase()}: ${steps[k].t}`);
    if (k > S.max) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
    if (k === S.step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
}
function desbloquear(n){ if (n > S.max) S.max = n; }
function trasP3(){ const el = $('tras8'); if (!el || !S.pred[P3.id]) return; const a = MM.composicion('CH2O').porcentajes, b = MM.composicion(GLU.formula).porcentajes;
  el.innerHTML = `<div class="eqs"><div class="eq"><span class="ex">k = ${fr(M_(MMOL + ' g/mol'), M_(fmt(GLU.Mempirica, 0) + ' g/mol'))} = ${GLU.k} &nbsp;→&nbsp; ${Fh('CH2O')} × ${GLU.k} = ${Fh(GLU.formula)}</span><span class="note">CH₂O pesa 12 + 2 × 1 + 16 = 30 g/mol. Se divide la masa molar entre la masa de la fórmula empírica, no entre su número de átomos.</span></div></div>
    <div class="scroll"><table class="tabla"><thead><tr><th>en masa</th><th>${Fh('C')}</th><th>${Fh('H')}</th><th>${Fh('O')}</th></tr></thead><tbody>
      <tr><td>${Fh('CH2O')}</td><td>${fmt(a.C, 1)} %</td><td>${fmt(a.H, 1)} %</td><td>${fmt(a.O, 1)} %</td></tr>
      <tr><td>${Fh(GLU.formula)}</td><td>${fmt(b.C, 1)} %</td><td>${fmt(b.H, 1)} %</td><td>${fmt(b.O, 1)} %</td></tr></tbody></table></div>
    <p>Las dos fórmulas tienen la misma composición: por los porcentajes solo se sabe la empírica. Para la molecular hace falta la masa molar.</p>
    <div class="nav"><span></span>${otraVez}</div>
    <p class="fuente">Creer que la fórmula empírica es la de la molécula: según Christianto y otros (2025), el 16 % de 32 escolares eligió esta idea con confianza alta. Multiplicar solo el carbono (${sub(SOLO_C)}) y ${sub(MITAD)} son hipótesis nuestras.</p>`;
  enlazarRepetir(); }
function prediccion(s){
  const P = s.gate, btns = [...$('stepBody').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[P.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === P.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb'); fb.textContent = P.fb[p]; fb.className = 'fb ' + (p === P.ok ? 'ok' : 'mal');
    const tras = $('tras'); if (tras) tras.hidden = false;
    if (P === P3) trasP3();
  };
  const t0 = Date.now();
  btns.forEach(b => b.addEventListener('click', () => {
    if (S.pred[P.id]) return;
    const o = P.opts.find(q => q[0] === b.dataset.k);
    S.pred[P.id] = o[0]; desbloquear(S.step + 1); pintar(); pintarDots(); nav();
    registrarPrediccion(P.id, o[0], o[0] === P.ok, o[2] || '', o[3] || '', t0);
    $('next').focus({ preventScroll:true });
    // En el celular, el dibujo queda arriba de la pantalla: se lleva a la vista antes de mostrar lo que pasa.
    const paso = S.step, chico = innerWidth < 900;
    if (chico) $('cv').scrollIntoView({ block:'start', behavior: RM ? 'auto' : 'smooth' });
    esperar(chico ? 380 : 0, () => { if (S.step !== paso) return; mostrar(paso); E.dibujar(); E.describir(true); });
  }));
  // Ya respondida: se muestra directo lo que pasa.
  if (S.pred[P.id]){ E.vista = s.vista(true); }
  pintar();
}
$('next').addEventListener('click', () => { const s = steps[S.step]; if (s.gate && !S.pred[s.gate.id]) return; desbloquear(S.step + 1); go(S.step + 1); });
$('prev').addEventListener('click', () => go(S.step - 1));
alRedibujarTema(() => E.dibujar());
addEventListener('modo', () => { E.resize(); E.dibujar(); pedir(); });
go(0);
})();
</script>

    ok:'c',
    fb:{ a:'Salió de repartir 9 g en 2 a 1, como los subíndices. Pero los subíndices cuentan átomos, no gramos: el O pesa 16 veces más que el H. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      b:'Los elementos de un compuesto no están en igual masa. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      d:'2 es el número de átomos de H en cada molécula, no los gramos. Esta opción es una hipótesis nuestra, sin estudio que la mida.' },
    antes:() => ({ bal:{ izq:[{ f:'H2O', m:9 }], der:[{ f:'pesa', tipo:'pesa', m:9, etq:[['pesa de ', 'muted'], ['9 g', 'masa', 800]] }], u:'g' }, lupa:{ tapa:'Responde para ver la lupa' },
      cuenta:{ lineas:[[['Muestra: ', 'ink'], ['9 g', 'masa', 800], [' de ', 'ink'], ...pzF('H2O')], [['¿Cuántos gramos son de hidrógeno?', 'muted']]] }, vars:['masa'] }),
    despues:() => ({ bal:{ izq:[{ f:'H', m:PROUST.H }, { f:'O', m:PROUST.O }], der:[{ f:'pesa', tipo:'pesa', m:9, etq:[['pesa de ', 'muted'], ['9 g', 'masa', 800]] }], u:'g' },
      lupa:{ lentes:[{ figs:[{ f:'H2O', n:10 }] }], pie:'Cada figura es una porción de 0,05 mol de H₂O (0,9 g). En cada molécula, el O pesa 16 u y los dos H, 2 u: 8 a 1 en masa.', desc:'10 figuras de H2O.' },
      cuenta:{ lineas:[[...pzF('H2O'), [': 2 × 1 + 16 = ', 'ink'], ['18 g/mol', 'Mm', 800], ['  →  ', 'ink'], ['9 g', 'masa', 800], [' = ', 'ink'], ['0,5 mol', 'mol', 800]],
        [['de ', 'ink'], ...pzF('H'), [': 9 × 2 ÷ 18 = ', 'ink'], [`${fmt(PROUST.H, 1)} g`, 'masa', 800], ['   de ', 'ink'], ...pzF('O'), [': 9 × 16 ÷ 18 = ', 'ink'], [`${fmt(PROUST.O, 1)} g`, 'masa', 800]]], leer:'9 g de agua son 0,5 mol: 1 g de hidrógeno y 8 g de oxígeno.' }, vars:['masa', 'Mm', 'mol'] }),
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">${fr(m_('9 g'), M_('18 g/mol'))} = ${n_('0,5 mol')} de ${Fh('H2O')} &nbsp;→&nbsp; ${n_('1 mol')} de átomos de ${Fh('H')} = ${m_(fmt(PROUST.H, 1) + ' g')}</span></div>
      <div class="eq"><span class="ex">${Fh('H')} : ${Fh('O')} = 2 : 16 = 1 : 8 en masa</span><span class="note">Ley de Proust: un compuesto tiene siempre la misma proporción en masa. En 18 g de agua hay 2 g de H; en 9 g, 1 g.</span></div></div>
      <p class="fuente">Repartir la masa como los subíndices (6 g) o en partes iguales (4,5 g) están en nuestra lista de errores sin respaldo; 2 g también es una hipótesis nuestra.</p>` },
  { id:'mol-de-liquido', corto:'Un mol de agua líquida',
    q:`¿Qué volumen ocupan ${m_('18 g')} (${n_('1 mol')}) de ${Fh('H2O')} líquida? La densidad del agua es 1 g/mL.`,
    opts:[['a', '22,4 L', 'ES5-22-L-liquido', RES('documentado', 'Dahsah y otros 2006: 11 % de 97')],
          ['b', `${fmt(VOL.litros, 3)} L`],
          ['c', '18 L', 'confunde-mL-con-L', RES('hipotesis', 'hipótesis nuestra')],
          ['d', '1 L', 'un-mol-un-litro', RES('hipotesis', 'hipótesis nuestra')]],
    ok:'b',
    fb:{ a:'22,4 L es lo que ocupa 1 mol de gas en condiciones normales. El agua líquida ocupa lo que dice su densidad: 18 g en 1 g/mL son 18 mL, es decir, 0,018 L. Según Dahsah y otros (2006), el 11 % de 97 escolares creía que todo mol ocupa 22,4 L.',
      c:'Con 1 g/mL, 18 g son 18 mL (0,018 L), mil veces menos que 18 L. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      d:'El mol no dice el volumen: depende de la sustancia y de si es sólido, líquido o gas. Esta opción es una hipótesis nuestra, sin estudio que la mida.' },
    antes:() => ({ bal:{ izq:[{ f:'H2O', m:18, etq:[['agua líquida', 'ink']], nombre:'agua líquida' }], der:[{ f:'pesa', tipo:'pesa', m:18, etq:[['pesa de ', 'muted'], ['18 g', 'masa', 800]] }], u:'g' }, lupa:{ tapa:'Responde para ver el volumen' },
      cuenta:{ lineas:[[...pzF('H2O'), [' líquida: ', 'ink'], ['18 g', 'masa', 800], [' = ', 'ink'], ['1 mol', 'mol', 800], ['   densidad 1 g/mL', 'muted']], [['¿Qué volumen ocupa?', 'muted']]] }, vars:['masa', 'mol'] }),
    despues:() => ({ bal:{ izq:[{ f:'H2O', m:18, etq:[['agua líquida', 'ink']], nombre:'agua líquida' }], der:[{ f:'pesa', tipo:'pesa', m:18, etq:[['pesa de ', 'muted'], ['18 g', 'masa', 800]] }], u:'g' },
      lupa:{ escala:true, pie:'A escala: 18 mL de agua líquida junto a 22,4 L, lo que ocupa 1 mol de un gas en condiciones normales.', desc:'Un vaso pequeño con 18 mL junto a una caja de 22,4 L, a la misma escala.' },
      cuenta:{ lineas:[[['V = ', 'ink'], ['18 g', 'masa', 800], [' ÷ 1 g/mL = ', 'ink'], [`${fmt(VOL.mililitros, 0)} mL`, 'ink', 800]], [[`22,4 L es ${fmt(VOL.con224/VOL.litros, 0)} veces más: solo vale para gases`, 'muted']]], leer:'18 g entre 1 g por mL son 18 mL.' }, vars:['masa', 'mol'] }),
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">V = ${fr(m_('18 g'), '1 g/mL')} = ${fmt(VOL.mililitros, 0)} mL = ${fmt(VOL.litros, 3)} L</span><span class="note">Para un líquido o un sólido, el volumen sale de la densidad. 22,4 L/mol solo vale para gases en condiciones normales (1 atm y 0 °C).</span></div></div>
      <p>1 mol de agua líquida cabe en una cuchara grande: unas 1200 veces menos que la caja de 22,4 L.</p>
      <p class="fuente">Que todo mol ocupa 22,4 L: según Dahsah y otros (2006), el 11 % de 97 escolares lo sostuvo. 18 L y 1 L son hipótesis nuestras.</p>` },
];
const S = { k:0, pred:{}, t0:Date.now() };
// Regla de Gerson: un experimento se abre solo si todos los anteriores ya tienen respuesta. Los respondidos se
// pueden volver a abrir.
const abierto = k => EXPS.slice(0, k).every(x => S.pred[x.id]);
function botones(){
  $('exps').innerHTML = EXPS.map((x, k) => abierto(k)
    ? `<button type="button" aria-pressed="${k === S.k}" data-k="${k}">${k+1}. ${x.corto}</button>`
    : `<button type="button" aria-pressed="false" data-k="${k}" disabled aria-disabled="true" aria-label="Experimento ${k+1}, bloqueado">${k+1}. ${x.corto}</button>`).join('');
  $('exps').querySelectorAll('button').forEach(b => b.onclick = () => ir(+b.dataset.k));
}
function despues(x, k){
  cortar(E);
  if (x.anima){ E.vista = x.despues(0); E.dibujar(); animar(E, 1.3, f => { E.vista = x.despues(f); }, () => { E.vista = x.despues(1); E.describir(true); }, 0.7); }
  else E.vista = x.despues();
  E.dibujar(); pedir();
}
function ir(k){
  if (!abierto(k)) return;
  S.k = k; S.t0 = Date.now();
  const x = EXPS[k];
  cortar(E); E.vista = x.antes();
  botones();
  $('k2').textContent = `¿Qué pasa si…? · ${k+1} de ${EXPS.length}`;
  $('t2').textContent = x.corto;
  $('body2').innerHTML = `<p>${x.q}</p>${opcionesHTML(x.opts, 'fb2')}<div id="res2" class="body"></div>`;
  const btns = [...$('body2').querySelectorAll('.opt')];
  const explicar = () => {
    if (S.k !== k || !S.pred[x.id]) return;
    $('res2').innerHTML = x.exp() + `<div class="nav">${x.anima ? otraVez : '<span></span>'}${k < EXPS.length - 1 ? `<button type="button" class="btn primary" id="sig2">Siguiente: ${EXPS[k+1].corto}</button>` : ''}</div>`;
    const sig = $('sig2'); if (sig) sig.onclick = () => { ir(k + 1); document.querySelector('#m2').scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); };
    const rep = $('res2').querySelector('[data-repetir]'); if (rep) rep.onclick = () => { despues(x, k); E.describir(true); };
  };
  const pintar = () => {
    const p = S.pred[x.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === x.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb2');
    fb.textContent = p === x.ok ? '¡Bien pensado! Mira la lupa y la cuenta para ver por qué.' : `Elegiste la ${'abcd'.indexOf(p) + 1}. ${x.fb[p]} La correcta está marcada.`;
    fb.className = 'fb ' + (p === x.ok ? 'ok' : 'mal');
    explicar();
  };
  btns.forEach(b => b.onclick = () => {
    if (S.pred[x.id]) return;
    const o = x.opts.find(q => q[0] === b.dataset.k);
    S.pred[x.id] = o[0]; pintar(); botones();
    registrarPrediccion('que-pasa-si-' + x.id, o[0], o[0] === x.ok, o[2] || '', o[3] || '', S.t0);
    const chico = innerWidth < 900;
    if (chico) $('cv2').scrollIntoView({ block:'start', behavior: RM ? 'auto' : 'smooth' });
    esperar(chico ? 380 : 0, () => { if (S.k !== k) return; despues(x, k); E.describir(true); });
  });
  // Si ya respondió antes, se muestra directo lo que pasa.
  if (S.pred[x.id]) E.vista = x.anima ? x.despues(1) : x.despues();
  pintar(); E.dibujar(); pedir(); E.describir(true);
}
alRedibujarTema(() => E.dibujar());
addEventListener('modo', () => { E.resize(); E.dibujar(); pedir(); });
ir(0);
})();
</script>

<script>
/* ================= Pestañas ================= */
(function(){
  const modos = [['#paso-a-paso', 'm1', 'tab1'], ['#que-pasa-si', 'm2', 'tab2']];
  function route(){
    const k = Math.max(0, modos.findIndex(m => m[0] === location.hash));
    modos.forEach(([, m, t], j) => {
      document.getElementById(m).hidden = j !== k;
      const a = document.getElementById(t);
      if (j === k) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    dispatchEvent(new Event('modo'));
  }
  addEventListener('hashchange', route); route();
})();
</script>
