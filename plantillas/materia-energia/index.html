<style>
/* Cáscara acogedora (crema, tarjetas cálidas, esquinas redondas; docs/diseno.md).
   Dentro del dibujo y de las ecuaciones solo mandan los colores de las variables (regla 4).

   Colores de esta escena (claro / oscuro). Revisados con CIEDE2000 (docs/metodo/paleta.py) y contraste WCAG sobre
   #fdf7f1 y #241c2e, también sobre el chip .v (fondo del 8 %): contraste mínimo 4,5 en los dos modos.
     ELEMENTOS: paleta común de nucleo/elementos.js (variables --el-<Símbolo>), en el bloque generado de abajo.
     VARIABLES
       m  masa (lo que marca la balanza; también Δm)   mostaza       #756300 / #e3c84a
       E  energía                                      magenta       #b3246b / #ff86bd
       c  rapidez de la luz                            verde oscuro  #255c1f / #5fe06a
       fases                                           naranja       #a05200 / #f0a04a
       componentes                                     azul          #1f5fbf / #7cb0ff
       T  temperatura (solo en Juliaca)                ámbar         #8f5800 / #ffc04d
   Qué sale junto: H, O y Fe (cajas); H, O, Na y Cl con fases y componentes (vaso); C, H y O con m (frasco); C, H, O y Fe
   (azúcar y clavo); H y O con Na y Cl, con Si o con C, o Fe y S (separación, una mezcla a la vez); m, E y c; Fe, O y m;
   H, O y T; O; S. Las variables quedan a ΔE00 ≥ 20 de los elementos de cada vista y de la tinta (mínimo 22,2: m–C y c–m;
   el mínimo de toda la escena, contando pares de elementos, es 20,3). Contraste mínimo de las variables 4,70, también sobre
   el fondo de las opciones marcadas (ahí el chip va sin fondo). La masa se oscureció de #7d6a00 a #756300 para eso.
   Con la paleta común de hoy, ningún par de Elementos.CERCANOS sale junto en una vista de esta escena (O–Na y C–Fe
   se separaron en nucleo/elementos.js para el vaso, la sal y el azúcar con el clavo). Cada átomo lleva además su letra.
   Parecidos que nunca comparten dibujo: fases–T, Fe–componentes (los dos azules), S–componentes.
   Los tonos de agua, aceite, arena, hielo, azufre en polvo y llama son pálidos y no nombran variables. */
[hidden]{display:none!important}
:root{

  /* variables */
  --c-m:#756300; --c-E:#b3246b; --c-c:#255c1f; --c-fa:#a05200; --c-co:#1f5fbf; --c-T:#8f5800;
  /* tonos del mundo (no son variables) */
  --vidrio:#8e97a8; --caja:#f6ece4; --letra-atomo:#ffffff; --agua:#dbe9ef; --aceite:#f3e5ad; --arena:#e6d3ae; --hielo:#ffffff;
  --polvo:#efe08a; --llama:#f6c48e; --oxido:#a8642f;

}

  --c-m:#e3c84a; --c-E:#ff86bd; --c-c:#5fe06a; --c-fa:#f0a04a; --c-co:#7cb0ff; --c-T:#ffc04d;
  --vidrio:#5e5670; --caja:#211a2a; --letra-atomo:#1d1626; --agua:#2b3a46; --aceite:#4a4326; --arena:#4d4131; --hielo:#3a4553;
  --polvo:#6a6230; --llama:#7a4f34; --oxido:#b97a4a; color-scheme:dark } }

  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;

<script>
// Registro anónimo de predicciones (nucleo/medicion.js). Solo guarda si el alumno entró por la app.
const PLANTILLA = { id: 'materia-energia', unidad: 'quimica.materia-y-energia', version: '0.1.0' };
function registrarPrediccion(problema, opcion, correcta, error, respaldo, t0){
  if (!window.Medicion) return;
  Medicion.guardar({ tipo: 'prediccion', modulo: PLANTILLA.id, unidad: PLANTILLA.unidad, problema, opcion, correcta,
    error: correcta ? '' : error, respaldo: correcta ? '' : respaldo, ms: t0 ? Date.now() - t0 : '' }, PLANTILLA.version);
}

/* ================= Piezas compartidas =================
   Toda la química sale de MotorMateria (motor.js): qué es cada caja, cuántas fases y componentes, si un cambio es
   físico, químico o nuclear, lo que marca la balanza, qué separa cada método y E = mc². Aquí solo se pinta. */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MM = MotorMateria;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fmt(n, d){
  if (!Number.isFinite(n)) return '—';
  const p = Math.pow(10, d === undefined ? 1 : d), r = Math.round(n*p)/p + 0;
  let [e, f] = String(Math.abs(r)).split('.');
  if (e.length > 4) e = e.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (r < 0 ? '−' : '') + e + (f ? ',' + f : '');
}
const fmt2 = n => (Math.round(n*100)/100).toFixed(2).replace('.', ',');
const SUP = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻' };
// Notación científica de academia: 9 × 10¹³.
function cien(x){
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)) + 1e-9), m = Math.round(x/Math.pow(10, e)*100)/100;
  if (e >= 0 && e <= 3) return fmt(x, 3);
  return `${fmt(m, 2)} × 10${String(e).split('').map(ch => SUP[ch]).join('')}`;
}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ELEM = ['H', 'O', 'C', 'Cl', 'Fe', 'Na', 'Si', 'S'];
const SUBD = { '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉' };
function txt(f){ const [c, q] = String(f).split('^'); return c.replace(/\d/g, d => SUBD[d]) + (q ? (q === '+' ? '⁺' : q === '-' ? '⁻' : q) : ''); }
// Fórmula en el texto: cada elemento con su color; al tocarlo se resalta en el dibujo.
function F(f){
  const [cuerpo, q] = String(f).split('^'); let h = '';
  cuerpo.replace(/([A-Z][a-z]?)(\d*)/g, (m, el, d) => { h += `<span class="v v-${el}" data-var="${el}" tabindex="0">${el}${d ? `<sub>${d}</sub>` : ''}</span>`; return m; });
  if (q) h += `<sup class="carga">${q === '-' ? '−' : q}</sup>`;
  return `<span class="f">${h}</span>`;
}
const V = (k, t) => `<span class="v v-${k}" data-var="${k}" tabindex="0">${t}</span>`;
const Vm = t => V('m', t), VE = t => V('E', t), Vc = t => V('c', t), Vfa = t => V('fa', t), Vco = t => V('co', t), VT = t => V('T', t);

function colores(){
  const g = n => css(n), el = {};
  for (const e of ELEM) el[e] = g('--el-' + e);
  return { ink:g('--ink'), muted:g('--muted'), grid:g('--grid'), paper:g('--paper'), card:g('--card'), line:g('--line'), ok:g('--ok'), warn:g('--warn'),
    m:g('--c-m'), E:g('--c-E'), c:g('--c-c'), fa:g('--c-fa'), co:g('--c-co'), T:g('--c-T'), el,
    vidrio:g('--vidrio'), caja:g('--caja'), letra:g('--letra-atomo'), agua:g('--agua'), aceite:g('--aceite'), arena:g('--arena'),
    hielo:g('--hielo'), polvo:g('--polvo'), llama:g('--llama'), oxido:g('--oxido'), font:g('--font') };
}
function alRedibujarTema(fn){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', fn);
  new MutationObserver(fn).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
function linea(ctx, x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function azar(sem){ let s = sem >>> 0 || 1; return () => (s = (s*1664525 + 1013904223) >>> 0)/4294967296; }
const ease = p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
// Texto en el lienzo; si no entra, baja la letra hasta 10 px.
function texto(ctx, c, t, x, y, tam, color, align, max, peso){
  let s = tam; ctx.font = `${peso || 700} ${s}px ${c.font}`;
  if (max) while (s > 10 && ctx.measureText(t).width > max){ s -= 0.5; ctx.font = `${peso || 700} ${s}px ${c.font}`; }
  ctx.fillStyle = color; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y);
  return ctx.measureText(t).width;
}
const colDe = (c, k) => c.el[k] || c[k] || c.ink;

/* ----- Partículas -----
   Cada átomo lleva el color de su elemento y su letra si cabe. Coordenadas en radios de átomo. El azúcar y el aceite
   van simplificados (un anillo y una cadena): la leyenda lo dice. */
const RADIO = { H:0.62, C:0.95, O:0.95, Na:1.1, Cl:1.15, Si:1.05, Fe:1.1, S:1.0 };
const anillo = (n, r, els) => els.map((e, k) => [e, r*Math.cos(2*Math.PI*k/n - Math.PI/2), r*Math.sin(2*Math.PI*k/n - Math.PI/2)]);
const FORMAS = {
  H2:[['H',-.6,0],['H',.6,0]], O2:[['O',-.78,0],['O',.78,0]], N2:[['N',-.78,0],['N',.78,0]],
  O3:[['O',-1.4,.55],['O',0,-.25],['O',1.4,.55]], H2O:[['H',-.92,.58],['H',.92,.58],['O',0,-.12]],
  Fe:[['Fe',0,0]], S:[['S',0,0]], 'Na^+':[['Na',0,0]], 'Cl^-':[['Cl',0,0]],
  NaCl:[['Na',-1.05,0],['Cl',1.1,0]], SiO2:[['O',-1.75,0],['O',1.75,0],['Si',0,0]],
  C2H5OH:[['H',-2.3,-.7],['H',-2.3,.7],['H',-1.35,1.05],['H',.15,1.05],['H',.15,-1.05],['H',2.45,.35],['C',-1.35,0],['C',.15,0],['O',1.6,-.45]],
  Fe2O3:[['Fe',-1.9,.45],['Fe',1.9,.45],['O',-3.8,-.4],['O',0,-.4],['O',3.8,-.4]],
  S8:anillo(8, 1.75, Array(8).fill('S')),
  C12H22O11:[...anillo(6, 1.55, ['O','C','C','C','C','C']), ['O', 2.75, -1.6], ['O', -2.75, 1.6]],
  aceite:[['C',-3.6,.3],['C',-2.4,-.3],['C',-1.2,.3],['C',0,-.3],['C',1.2,.3],['C',2.4,-.3],['O',3.55,.25],['O',3.4,-1.35]],
};
const CARGA = { 'Na^+':'+', 'Cl^-':'−' };
const radioDe = e => RADIO[e] || 1;
function extension(f){ let x = 0; for (const [e, dx, dy] of FORMAS[f]) x = Math.max(x, Math.hypot(dx, dy) + radioDe(e)); return x; }
// Átomos de una partícula en (x, y), girada ang.
function atomosEn(f, x, y, R, ang){
  const co = Math.cos(ang || 0), si = Math.sin(ang || 0);
  return FORMAS[f].map(([e, dx, dy]) => ({ e, x: x + (dx*co - dy*si)*R, y: y + (dx*si + dy*co)*R, r: radioDe(e)*R }));
}
function pintarAtomos(ctx, c, ats, hl, alpha, siempre){
  ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  for (const a of ats){
    ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI*2); ctx.fillStyle = c.el[a.e] || c.muted; ctx.fill();
    ctx.strokeStyle = c.paper; ctx.lineWidth = a.r > 4 ? 1.2 : 0.7; ctx.stroke();
    if (hl && hl === a.e){ ctx.strokeStyle = c.ink; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(a.x, a.y, a.r + 2.2, 0, Math.PI*2); ctx.stroke(); }
    if (a.r >= 4 || siempre){ ctx.fillStyle = c.letra; ctx.font = `800 ${Math.max(6, Math.round(a.r*(a.e.length > 1 ? 0.8 : 0.95)))}px ${c.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(a.e, a.x, a.y + 0.5); }
  }
  ctx.restore();
}
function particula(ctx, c, f, x, y, R, ang, hl, alpha, siempre){
  pintarAtomos(ctx, c, atomosEn(f, x, y, R, ang), hl, alpha, siempre);
  if (CARGA[f] && R >= 3){ const r0 = radioDe(FORMAS[f][0][0])*R, t = siempre ? Math.max(14, R*1.7) : Math.max(10, R*1.2); ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha; texto(ctx, c, CARGA[f], x + r0 + t*0.3, y - r0 - t*0.1, t, c.ink, 'center', 0, 900); ctx.restore(); }
}
// Lugares para n partículas dentro de un círculo (o rectángulo), sin encimarse: cuadrícula con un poco de azar.
function lugares(n, zona, sem, paso){
  const rnd = azar(sem), pts = [];
  const { x, y, w, h, circ } = zona;
  let s = paso || Math.sqrt(w*h/(Math.max(1, n)*1.25));
  for (let intento = 0; intento < 12 && pts.length < n; intento++){
    pts.length = 0;
    for (let yy = y + s/2; yy < y + h; yy += s) for (let xx = x + s/2; xx < x + w; xx += s){
      if (circ){ const cx = x + w/2, cy = y + h/2; if (Math.hypot(xx - cx, yy - cy) > Math.min(w, h)/2 - s*0.45) continue; }
      pts.push([xx + (rnd() - .5)*s*0.3, yy + (rnd() - .5)*s*0.3, rnd()*Math.PI*2]);
    }
    if (pts.length < n) s *= 0.9;
  }
  // Barajar con la semilla y tomar n.
  for (let i = pts.length - 1; i > 0; i--){ const j = Math.floor(rnd()*(i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
  return pts.slice(0, n);
}
// Lista de partículas [{ f, n }] → [{ f, x, y, a }] en una zona.
function repartir(items, zona, sem){
  const lista = []; items.forEach(it => { for (let k = 0; k < it.n; k++) lista.push(it.f); });
  const pts = lugares(lista.length, zona, sem);
  return lista.map((f, i) => ({ f, x: pts[i][0], y: pts[i][1], a: pts[i][2] }));
}
// Radio de átomo que hace caber las partículas en la zona.
function radioPara(items, zona){
  const n = items.reduce((s, it) => s + it.n, 0), ext = Math.max(...items.map(it => extension(it.f)));
  const s = Math.sqrt(zona.w*zona.h*(zona.circ ? 0.72 : 1)/(n*1.25));
  return clamp(s*0.42/ext, 2.2, 11);
}
// Transición antes → después dentro de una zona. Si las sustancias son las mismas (cambio físico), cada partícula viaja
// entera; si cambian (químico), cada átomo viaja a su lugar en una partícula nueva.
function transicion(ctx, c, ant, des, R, p, quimico, hl){
  const pe = ease(clamp(p, 0, 1));
  if (pe <= 0){ ant.forEach(q => particula(ctx, c, q.f, q.x, q.y, R, q.a, hl)); return; }
  if (pe >= 1){ des.forEach(q => particula(ctx, c, q.f, q.x, q.y, R, q.a, hl)); return; }
  if (!quimico){
    const usados = new Set();
    for (const q of des){
      let j = -1, d = Infinity; ant.forEach((b, k) => { if (!usados.has(k) && b.f === q.f){ const dd = Math.hypot(b.x - q.x, b.y - q.y); if (dd < d){ d = dd; j = k; } } });
      if (j < 0){ particula(ctx, c, q.f, q.x, q.y, R, q.a, hl, pe); continue; }
      usados.add(j); const b = ant[j];
      particula(ctx, c, q.f, b.x + (q.x - b.x)*pe, b.y + (q.y - b.y)*pe, R, b.a + (q.a - b.a)*pe, hl);
    }
    ant.forEach((b, k) => { if (!usados.has(k)) particula(ctx, c, b.f, b.x, b.y, R, b.a, hl, 1 - pe); });
    return;
  }
  const a0 = ant.flatMap(q => atomosEn(q.f, q.x, q.y, R, q.a)), a1 = des.flatMap(q => atomosEn(q.f, q.x, q.y, R, q.a)), usados = new Set(), ats = [];
  for (const at of a1){
    let j = -1, d = Infinity; a0.forEach((b, k) => { if (!usados.has(k) && b.e === at.e){ const dd = Math.hypot(b.x - at.x, b.y - at.y); if (dd < d){ d = dd; j = k; } } });
    usados.add(j); const b = a0[j] || at; ats.push({ e: at.e, r: at.r, x: b.x + (at.x - b.x)*pe, y: b.y + (at.y - b.y)*pe });
  }
  pintarAtomos(ctx, c, ats, hl);
}
// La lupa: un círculo con borde grueso y su mango hacia el punto que mira.
function lupa(ctx, c, cx, cy, r, hacia, fondo){
  ctx.save();
  if (hacia){ ctx.strokeStyle = c.muted; ctx.lineWidth = 1.2; ctx.setLineDash([3, 4]); linea(ctx, hacia[0], hacia[1], cx + (hacia[0] - cx)/Math.hypot(hacia[0] - cx, hacia[1] - cy)*r, cy + (hacia[1] - cy)/Math.hypot(hacia[0] - cx, hacia[1] - cy)*r); ctx.setLineDash([]);

function bordeLupa(ctx, c, cx, cy, r){ ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.strokeStyle = c.ink; ctx.lineWidth = 3; ctx.stroke(); ctx.restore(); }
function recortar(ctx, cx, cy, r){ ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r - 1.5, 0, Math.PI*2); ctx.clip(); }
// Balanza digital: plato y pantalla con la lectura en el color de la masa.
function balanza(ctx, c, cx, y, w, lectura, color){
  ctx.save(); rr(ctx, cx - w/2, y, w, 34, 9); ctx.fillStyle = c.vidrio; ctx.fill();
  rr(ctx, cx - w*0.36, y + 6, w*0.72, 22, 5); ctx.fillStyle = c.paper; ctx.fill(); ctx.restore();
  texto(ctx, c, lectura, cx, y + 17.5, 15, color || c.m, 'center', w*0.68, 900);
}
function flechaH(ctx, x1, y, x2, col){ ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2; linea(ctx, x1, y, x2 - 6, y); ctx.beginPath(); ctx.moveTo(x2, y); ctx.lineTo(x2 - 7, y - 5); ctx.lineTo(x2 - 7, y + 5); ctx.closePath(); ctx.fill(); ctx.restore(); }
function llama(ctx, c, x, y, w){ ctx.save(); ctx.fillStyle = c.llama; for (let k = -1; k <= 1; k++){ ctx.beginPath(); const xx = x + k*w*0.3; ctx.moveTo(xx - 7, y); ctx.quadraticCurveTo(xx - 6, y - 14, xx, y - 22); ctx.quadraticCurveTo(xx + 6, y - 14, xx + 7, y); ctx.closePath(); ctx.fill(); } ctx.restore(); }

/* ----- La escena -----
   E.vista.tipo dice qué se dibuja; cada tipo tiene su alto natural (layout) y su pintura. En el celular, con una
   predicción pendiente, todo el dibujo se encoge a escala (nucleo/celular.js). Nada regala la respuesta: lo que la
   respondería (rótulos, lecturas, la lupa de después) se muestra solo con r = true. */
const ESCENAS = [];
const PINTA = {};
function crearEscena(cv, idDesc, modoId, idLey){
  const E = { vista:{ tipo:'cajas' }, hl:null, modoId, anims:[], compacto:false, ctx: cv.getContext('2d'), cv };
  ESCENAS.push(E);
  let H = 0, Hn = 0;
  E.W = 0; E.esc = 1;
  E.resize = () => {
    const w = cv.clientWidth; if (!w) return;
    E.W = w; const P = PINTA[E.vista.tipo]; Hn = P.alto(w, E.vista);
    const h = Math.round(Celular.alto(Hn, E.compacto)); E.esc = h/Hn;
    const dpr = window.devicePixelRatio || 1;
    if (h !== H || cv.width !== Math.round(w*dpr)){ H = h; cv.style.height = h + 'px'; cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  };
  new ResizeObserver(() => { E.resize(); E.dibujar(); }).observe(cv);
  E.compactar = on => { on = !!on; Celular.compactar(cv.closest('.mode'), on); if (on === E.compacto) return; E.compacto = on; E.resize(); E.dibujar(); };
  let llave = '';
  E.dibujar = () => {
    const w = cv.clientWidth; if (!w) return;
    const k = `${w}|${E.vista.tipo}|${PINTA[E.vista.tipo].llave ? PINTA[E.vista.tipo].llave(E.vista) : ''}|${E.compacto}`;
    if (k !== llave){ E.resize(); llave = k; }
    const c = colores(), dpr = window.devicePixelRatio || 1, ctx = E.ctx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, E.W, H);
    ctx.setTransform(dpr*E.esc, 0, 0, dpr*E.esc, dpr*(E.W - E.W*E.esc)/2, 0);
    PINTA[E.vista.tipo].pintar(ctx, c, E.W, E.vista, E.hl);
    const ley = (PINTA[E.vista.tipo].leyenda ? PINTA[E.vista.tipo].leyenda(E.vista) : []).join(''), el = document.getElementById(idLey);
    if (el && el.dataset.k !== ley){ el.dataset.k = ley; el.innerHTML = ley; }
  };
  E.describir = () => { const t = PINTA[E.vista.tipo].describir(E.vista), el = document.getElementById(idDesc); if (el.textContent !== t) el.textContent = t; };
  return E;
}
const LEY_EL = { H:'hidrógeno', O:'oxígeno', C:'carbono', Cl:'cloro', Fe:'hierro', Na:'sodio', Si:'silicio', S:'azufre' };
const leyEl = (els, extra) => els.map(e => `<span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="var(--el-${e})"/></svg>${e} · ${LEY_EL[e]}${extra && extra[e] ? ' ' + extra[e] : ''}</span>`);
const leyVar = (k, t) => `<span><i style="background:var(--c-${k})"></i>${t}</span>`;

/* --- Las cuatro cajas (paso 2) --- */
PINTA.cajas = {
  alto: w => (w < 560 ? 2 : 1)*((w < 560 ? (w - 30)/2 : (w - 50)/4)*0.95 + 34) + 14,
  pintar(ctx, c, W, v, hl){
    const dos = W < 560, n = dos ? 2 : 4, bw = (W - 10*(n + 1))/n, bh = bw*0.95;
    [1, 2, 3, 4].forEach((k, i) => {
      const x = 10 + (i % n)*(bw + 10), y = 8 + Math.floor(i/n)*(bh + 34);
      rr(ctx, x, y, bw, bh, 14); ctx.fillStyle = c.caja; ctx.fill(); ctx.strokeStyle = c.line; ctx.lineWidth = 1; ctx.stroke();
      const items = MM.CAJAS[k].map(p => ({ f:p.formula, n:p.n })), zona = k === 3 ? { x:x + bw*0.2, y:y + bh*0.2, w:bw*0.6, h:bh*0.6 } : { x:x + 6, y:y + 6, w:bw - 12, h:bh - 12 }, R = k === 3 ? radioPara(items, zona)*1.25 : radioPara(items, zona);
      repartir(items, zona, 11 + k).forEach(q => particula(ctx, c, q.f, q.x, q.y, R, q.a, hl));
      const rot = v.r ? `caja ${k}: ${MM.clasificarCaja(MM.CAJAS[k]).nombre.replace('sustancia pura (', '').replace(')', '')}` : `caja ${k}`;
      texto(ctx, c, rot, x + bw/2, y + bh + 14, 13, v.r && MM.clasificarCaja(MM.CAJAS[k]).tipo === 'compuesto' ? c.ink : c.muted, 'center', bw, 800);
    });
  },
  leyenda: () => leyEl(['H', 'O', 'Fe']),
  describir: v => v.r ? 'Caja 1: moléculas de O₂, un elemento. Caja 2: moléculas de H₂O, un compuesto. Caja 3: átomos de Fe, un elemento. Caja 4: moléculas de H₂ y de O₂ sin unirse, una mezcla homogénea.'
    : 'Cuatro cajas con partículas. Caja 1: moléculas de dos átomos de oxígeno. Caja 2: moléculas de dos átomos de hidrógeno y uno de oxígeno. Caja 3: átomos de hierro, uno al lado del otro. Caja 4: moléculas de dos átomos de hidrógeno y moléculas de dos átomos de oxígeno.',
};

/* --- El vaso (paso 3): agua, hielo, sal disuelta, aceite y arena --- */
PINTA.vaso = {
  alto: w => w < 560 ? 300 : 334,
  pintar(ctx, c, W, v, hl){
    const chico = W < 560, gx = chico ? 14 : 24, gw = chico ? W*0.5 : W*0.44, top = 26, gh = chico ? 236 : 262, base = top + gh;
    const yAce = top + gh*0.2, yAg = top + gh*0.36, yAr = base - gh*0.16;
    // Contenido.
    ctx.fillStyle = c.aceite; ctx.fillRect(gx, yAce, gw, yAg - yAce);
    ctx.fillStyle = c.agua; ctx.fillRect(gx, yAg, gw, yAr - yAg);
    ctx.fillStyle = c.arena; ctx.fillRect(gx, yAr, gw, base - yAr);
    const rnd = azar(5); ctx.fillStyle = c.muted; for (let i = 0; i < 70; i++){ ctx.beginPath(); ctx.arc(gx + 4 + rnd()*(gw - 8), yAr + 3 + rnd()*(base - yAr - 6), 1.3, 0, Math.PI*2); ctx.fill(); }
    // Hielo flotando entre el agua y el aceite.
    const cub = [[0.18, -6], [0.48, -2], [0.74, -7]];
    cub.forEach(([fx, dy]) => { const s = gw*0.16; rr(ctx, gx + gw*fx - s/2, yAg + dy - s*0.45, s, s, 5); ctx.fillStyle = c.hielo; ctx.fill(); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 1.4; ctx.stroke(); });
    // Vidrio.
    ctx.save(); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(gx, top); ctx.lineTo(gx, base); ctx.lineTo(gx + gw, base); ctx.lineTo(gx + gw, top); ctx.stroke(); ctx.restore();
    // Rótulos a la derecha del vaso.
    const xr = gx + gw + 8, max = chico ? W - xr - 8 : W*0.18;
    const etq = (t, y) => { ctx.save(); ctx.strokeStyle = c.muted; ctx.lineWidth = 1; linea(ctx, gx + gw - 6, y, xr - 2, y); ctx.restore(); texto(ctx, c, t, xr, y, 12, c.ink, 'left', max, 700); };
    if (v.r && !chico){ etq('aceite', (yAce + yAg)/2 - 6); etq('hielo', yAg + 8); etq('agua con sal', (yAg + yAr)/2 + 12); etq('arena', (yAr + base)/2); }
    if (v.r) texto(ctx, c, 'aire', gx + gw/2, top + 14, 12, c.muted, 'center', gw, 700);
    if (v.r){
      // Las cuatro fases, numeradas, en el color de las fases.
      const zonas = [[gx + 3, yAce + 2, gw - 6, yAg - yAce - 10], [gx + gw*0.1, yAg - gw*0.09, gw*0.74, gw*0.15], [gx + 3, yAg + gw*0.1, gw - 6, yAr - yAg - gw*0.1 - 3], [gx + 3, yAr + 2, gw - 6, base - yAr - 5]];
      ctx.save(); ctx.strokeStyle = c.fa; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
      zonas.forEach(([x, y, w, h], i) => { rr(ctx, x, y, w, h, 6); ctx.stroke(); });
      ctx.restore();
      zonas.forEach(([x, y, w, h], i) => { ctx.beginPath(); ctx.arc(x + 12, y + h/2, 9, 0, Math.PI*2); ctx.fillStyle = c.paper; ctx.fill(); ctx.strokeStyle = c.fa; ctx.lineWidth = 2; ctx.stroke(); texto(ctx, c, String(i + 1), x + 12, y + h/2 + 0.5, 12, c.fa, 'center', 0, 900); });
      // Lupa sobre el agua con sal.
      const lr = chico ? Math.min(W*0.2, 74) : Math.min(W*0.17, 92), lx = chico ? W - lr - 8 : gx + gw + W*0.2 + lr, ly = chico ? top + gh*0.62 : top + gh*0.55;
      lupa(ctx, c, lx, ly, lr, [gx + gw*0.55, (yAg + yAr)/2 + 16], c.paper);
      recortar(ctx, lx, ly, lr);
      const items = [{ f:'H2O', n:14 }, { f:'Na^+', n:3 }, { f:'Cl^-', n:3 }], zona = { x:lx - lr, y:ly - lr, w:2*lr, h:2*lr, circ:true };
      repartir(items, zona, 23).forEach(q => particula(ctx, c, q.f, q.x, q.y, radioPara(items, zona), q.a, hl, 1, q.f !== 'H2O'));
      ctx.restore(); bordeLupa(ctx, c, lx, ly, lr);
      texto(ctx, c, 'la sal, repartida en el agua', lx, ly + lr + 13, 11, c.muted, 'center', chico ? 2*lr + 14 : 2*lr + 40, 700);
      // Componentes.
      const comp = ['H₂O (agua y hielo)', 'NaCl (sal)', 'aceite', 'SiO₂ (arena)'];
      texto(ctx, c, `componentes: ${comp.join(' · ')}`, W/2, base + 22, chico ? 11 : 13, c.co, 'center', W - 16, 800);
    }
  },
  leyenda: v => v.r ? [...leyEl(['H', 'O', 'Na', 'Cl']), leyVar('fa', 'fases (numeradas)'), leyVar('co', 'componentes')] : [],
  describir: v => v.r ? 'Cuatro fases numeradas: el aceite, el hielo, el agua con la sal disuelta y la arena. La lupa muestra los iones de la sal repartidos entre las moléculas de agua. Cuatro componentes: agua, sal, aceite y arena.'
    : 'Un vaso con una capa de aceite arriba, cubitos de hielo flotando, agua con sal disuelta y arena en el fondo.',
};

/* --- La olla que hierve (paso 4) --- */
PINTA.olla = {
  alto: w => w < 560 ? 270 : 300,
  llave: v => v.r ? 1 : 0,
  pintar(ctx, c, W, v, hl){
    const chico = W < 560, ox = chico ? 16 : 30, ow = chico ? W*0.46 : W*0.42, oy = 40, oh = chico ? 150 : 170;
    // Olla con agua y burbujas.
    ctx.fillStyle = c.agua; rr(ctx, ox, oy + 16, ow, oh - 16, 10); ctx.fill();
    ctx.save(); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 3.5; rr(ctx, ox, oy, ow, oh, 12); ctx.stroke(); ctx.restore();
    const t = (v.t || 0), rnd = azar(9);
    for (let i = 0; i < 11; i++){ const bx = ox + 12 + rnd()*(ow - 24), sp = 0.5 + rnd(), yy = oy + oh - 8 - ((rnd()*oh + t*60*sp) % (oh - 24)); const br = 3 + rnd()*6;

    texto(ctx, c, 'agua hirviendo', ox + ow/2, oy - 14, 12, c.ink, 'center', ow, 700);
    // Lupa sobre una burbuja.

    const bx = ox + ow*0.6, by = oy + oh*0.5;

    const br = lr*0.52, items = [{ f:'H2O', n:24 }], zona = { x:lx - lr, y:ly - lr, w:2*lr, h:2*lr, circ:true }, R = radioPara(items, zona)*0.95;
    repartir(items, zona, 31).filter(q => Math.hypot(q.x - lx, q.y - ly) > br + extension('H2O')*R).forEach(q => particula(ctx, c, q.f, q.x, q.y, R, q.a, hl));
    ctx.beginPath(); ctx.arc(lx, ly, br, 0, Math.PI*2); ctx.fillStyle = c.card; ctx.fill(); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 1.5; ctx.stroke();
    if (v.r){ const p = v.p === undefined ? 1 : v.p, pts = [[-0.45, -0.3, 0.5], [0.4, -0.05, 2], [-0.05, 0.45, 4]];
      pts.forEach(([dx, dy, a], i) => particula(ctx, c, 'H2O', lx + dx*br*Math.min(1, p*1.3), ly + dy*br*Math.min(1, p*1.3), R, a + t, hl, clamp(p*2 - i*0.3, 0, 1))); }
    else texto(ctx, c, '?', lx, ly, 30, c.muted, 'center', 0, 900);
    ctx.restore(); bordeLupa(ctx, c, lx, ly, lr);

  },
  leyenda: () => leyEl(['H', 'O']),
  describir: v => v.r ? 'En la lupa, dentro de la burbuja hay moléculas de agua separadas unas de otras; afuera, las moléculas del agua líquida, juntas.' : 'Una olla con agua que hierve. La lupa mira una burbuja: afuera, moléculas de agua juntas; adentro, un signo de pregunta.',
};

/* --- El frasco sobre la balanza (pasos 1 y 5) --- */
// v: { masa, recipiente, p (0 a 1: cuánto se evaporó), q (0 a 1: cuánto vapor salió, sin tapa), tapa, oculta, sust }
PINTA.frasco = {
  alto: w => w < 560 ? 300 : 320,
  llave: v => `${v.tapa}|${v.sust}`,
  pintar(ctx, c, W, v, hl){
    const chico = W < 560, cx = chico ? W*0.36 : W*0.36, fw = chico ? W*0.5 : Math.min(W*0.4, 240), yb = chico ? 238 : 252, fh = chico ? 170 : 186, yT = yb - fh;
    const p = v.p || 0, q = v.q || 0, f = v.sust || 'C2H5OH';
    // Frasco.
    ctx.save(); rr(ctx, cx - fw/2, yT, fw, fh, 18); ctx.fillStyle = c.caja; ctx.fill(); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
    if (v.tapa){ ctx.save(); rr(ctx, cx - fw*0.32, yT - 14, fw*0.64, 16, 5); ctx.fillStyle = c.vidrio; ctx.fill(); ctx.restore(); }
    else { ctx.save(); ctx.fillStyle = c.paper; ctx.fillRect(cx - fw*0.3, yT - 3, fw*0.6, 7); ctx.restore(); }
    // Líquido que baja y moléculas: abajo juntas (líquido), arriba sueltas (vapor).
    const nTot = 12, nVap = Math.round(nTot*p), nSale = Math.round(nVap*q), hLiq = (fh - 24)*0.36*(1 - p);
    if (hLiq > 1){ ctx.fillStyle = c.agua; rr(ctx, cx - fw/2 + 5, yb - 5 - hLiq, fw - 10, hLiq, 8); ctx.fill(); }
    const R = chico ? 3.4 : 4, liq = lugares(nTot, { x:cx - fw/2 + 10, y:yb - 4 - (fh - 24)*0.36, w:fw - 20, h:(fh - 24)*0.36 }, 41, 0), gas = lugares(nTot, { x:cx - fw/2 + 10, y:yT + 10, w:fw - 20, h:fh*0.55 }, 43, 0);
    for (let i = 0; i < nTot; i++){
      const enGas = i < nVap, sale = i < nSale;
      if (!enGas){ const [x, y, a] = liq[i], h0 = (fh - 24)*0.36, yy = yb - 5 - hLiq + (y - (yb - 4 - h0))/h0*Math.max(hLiq, 2*R + 2); particula(ctx, c, f, x, yy, R, a, hl); continue; }
      const [gx, gy, a] = gas[i];
      if (sale){ const k = clamp((q*nVap - i)/1, 0, 1), ty = Math.max(10, yT - 20 - 40*k); particula(ctx, c, f, gx + (cx - gx)*k*0.6, gy + (ty - gy)*k, R, a, hl, 1 - k*0.85); }
      else particula(ctx, c, f, gx, gy, R, a, hl);
    }
    // Balanza.
    const r = MM.evaporar({ recipiente: v.recipiente, masa: v.masa, fraccion: p*q, cerrado: false });
    balanza(ctx, c, cx, yb + 4, fw*1.1, v.oculta ? '? g' : `${fmt2(r.despues)} g`);
    texto(ctx, c, v.tapa ? 'frasco con tapa' : 'frasco destapado', cx, yb + 52, 12, c.ink, 'center', fw*1.2, 700);
    // Lado derecho: el contenido en palabras.
    const xr = chico ? cx + fw/2 + 10 : cx + fw/2 + 24, max = W - xr - 8;
    texto(ctx, c, `frasco: ${fmt(v.recipiente, 2)} g`, xr, yT + 20, 12, c.muted, 'left', max, 700);
    texto(ctx, c, `${v.sust === 'H2O' ? 'agua' : 'alcohol'}: ${fmt(v.masa, 2)} g`, xr, yT + 40, 12, c.muted, 'left', max, 700);
    if (p > 0.05) texto(ctx, c, v.tapa ? 'el vapor queda adentro' : (q > 0 ? 'el vapor se va al aire' : 'vapor'), xr, yT + 66, 12, c.ink, 'left', max, 700);
  },
  leyenda: v => [...leyEl(v.sust === 'H2O' ? ['H', 'O'] : ['C', 'H', 'O']), leyVar('m', 'm · lo que marca la balanza')],
  describir: v => {
    const r = MM.evaporar({ recipiente: v.recipiente, masa: v.masa, fraccion: (v.p || 0)*(v.q || 0), cerrado: false });
    return `Un frasco ${v.tapa ? 'con tapa' : 'destapado'} sobre una balanza. ${(v.p || 0) > 0.5 ? 'El líquido se evaporó.' : 'Tiene líquido en el fondo.'} ${v.oculta ? 'La lectura final está tapada hasta que respondas.' : `La balanza marca ${fmt2(r.despues)} gramos.`}`;
  },
};

/* --- Azúcar contra clavo (paso 6) --- */
// v: { r, p (0 a 1, la transición), ev (0 a 1, se evapora el agua azucarada) }
PINTA.dos = {
  alto: w => w < 560 ? 314 : Math.round(176 + 2*Math.min(w/2*0.36, 100)),
  pintar(ctx, c, W, v, hl){
    const chico = W < 560, cw = W/2, lr = chico ? Math.min(cw*0.44, 80) : Math.min(cw*0.36, 100), ly = chico ? 212 : 144 + lr, p = v.r ? (v.p === undefined ? 1 : v.p) : 0, ev = v.ev || 0;
    [0, 1].forEach(i => {
      const x0 = i*cw, gx = x0 + cw*0.28, gw = cw*0.44, gy = 30, gh = chico ? 74 : 80;
      ctx.fillStyle = c.agua; ctx.fillRect(gx, gy + gh*(0.25 + 0.7*ev*(1 - i)), gw, gh*(0.75 - 0.7*ev*(1 - i)));
      ctx.save(); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy + gh); ctx.lineTo(gx + gw, gy + gh); ctx.lineTo(gx + gw, gy); ctx.stroke(); ctx.restore();
      // Granos de azúcar: un montoncito de puntos finos (no cubos, para no confundirlos con hielo).
      const granos = n => { const rg = azar(17); ctx.save(); ctx.fillStyle = c.muted; for (let k = 0; k < n; k++){ const t = rg(); ctx.beginPath(); ctx.arc(gx + gw*0.5 + (rg() - .5)*gw*0.5*(1 - t*0.6), gy + gh - 3 - t*7, 1.4, 0, Math.PI*2); ctx.fill(); } ctx.restore(); };
      if (i === 0){ if (p < 0.5) granos(26); if (ev > 0.6) granos(20); }
      else { ctx.save(); ctx.strokeStyle = p > 0.5 ? c.oxido : c.vidrio; ctx.lineWidth = 4; linea(ctx, gx + gw*0.3, gy - 8, gx + gw*0.62, gy + gh - 5); ctx.restore(); }
      texto(ctx, c, i ? 'clavo en agua, al aire' : (ev > 0.6 ? 'se evaporó el agua' : 'azúcar en agua'), x0 + cw/2, gy + gh + 14, 12, c.ink, 'center', cw - 8, 700);
      const lx = x0 + cw/2;
      lupa(ctx, c, lx, ly, lr, [gx + gw*(i ? 0.5 : 0.35), gy + gh - 12], c.paper);
      recortar(ctx, lx, ly, lr);
      const zona = { x:lx - lr, y:ly - lr, w:2*lr, h:2*lr, circ:true };
      if (i === 0){
        // Azúcar: abajo, cristales juntos; después, moléculas repartidas entre las de agua.
        const ag = repartir([{ f:'H2O', n:12 }], zona, 51), R = lr/18;
        const cris = [[-0.45, 0.5], [0, 0.62], [0.45, 0.5]].map(([dx, dy], k) => ({ f:'C12H22O11', x:lx + dx*lr, y:ly + dy*lr, a:k }));
        const sueltas = [[-0.45, -0.35], [0.42, -0.3], [0, 0.22]].map(([dx, dy], k) => ({ f:'C12H22O11', x:lx + dx*lr, y:ly + dy*lr, a:k*2 }));
        const aguaQ = ag.filter(q => cris.every(s => Math.hypot(q.x - s.x, q.y - s.y) > R*4.2) && sueltas.every(s => Math.hypot(q.x - s.x, q.y - s.y) > R*4.2));
        aguaQ.forEach((q, k) => { const sube = clamp(ev*1.6 - k*0.05, 0, 1); particula(ctx, c, 'H2O', q.x, q.y - sube*lr*1.6, R, q.a, hl, 1 - sube); });
        transicion(ctx, c, cris, ev > 0 ? sueltas.map((s, k) => ({ ...s, x: cris[k].x + (s.x - cris[k].x)*(1 - ev), y: cris[k].y + (s.y - cris[k].y)*(1 - ev) })) : sueltas, R, p, false, hl);
      } else {
        // El hierro, sólido: átomos en fila que se tocan (como el motor: 4 Fe, 3 O₂ y 2 H₂O → 2 Fe₂O₃ y 2 H₂O).
        const R = lr/10.5, fila = [-1.5, -0.5, 0.5, 1.5].map(k => ({ f:'Fe', x:lx + k*2.2*R, y:ly + 0.55*lr, a:0 }));
        const ant = fila.concat([{ f:'O2', x:-0.45, y:-0.5 }, { f:'O2', x:0.1, y:-0.62 }, { f:'O2', x:0.5, y:-0.25 }, { f:'H2O', x:-0.55, y:0 }, { f:'H2O', x:0.05, y:-0.15 }]
          .map((q, k) => ({ f:q.f, x:lx + q.x*lr, y:ly + q.y*lr, a:k })));
        const des = [{ f:'Fe2O3', x:0, y:0.5, a:0 }, { f:'Fe2O3', x:0, y:0.12, a:0 }, { f:'H2O', x:-0.55, y:-0.1, a:7 }, { f:'H2O', x:0.15, y:-0.5, a:8 }].map(q => ({ ...q, x:lx + q.x*lr, y:ly + q.y*lr }));
        transicion(ctx, c, ant, des, R, p, true, hl);
      }
      ctx.restore(); bordeLupa(ctx, c, lx, ly, lr);
      if (v.r && p >= 1) texto(ctx, c, i ? 'sustancia nueva: Fe₂O₃' : (ev > 0.6 ? 'vuelve el azúcar' : 'las mismas moléculas'), lx, ly + lr + 14, 11, c.ink, 'center', cw - 6, 800);
    });
  },
  leyenda: () => leyEl(['C', 'H', 'O', 'Fe'], { C:'(en el azúcar)', Fe:'(en el clavo)' }).concat(['<span>azúcar: dibujo simplificado, sin sus H y con menos átomos que los 45 reales</span>', '<span>el óxido es un sólido; la lupa muestra unidades Fe₂O₃</span>']),
  describir: v => v.r ? `En la lupa del azúcar, las mismas moléculas de azúcar quedan repartidas entre las de agua${v.ev > 0.6 ? ', y al evaporarse el agua vuelven a juntarse' : ''}. En la del clavo, los átomos de hierro y de oxígeno se reacomodan en Fe₂O₃, una sustancia nueva.`

/* --- Separar una mezcla (paso 7) --- */
// v: { mezcla, metodo (o null), p }
const PART = { agua:[{ f:'H2O', n:9 }], sal:[{ f:'Na^+', n:2 }, { f:'Cl^-', n:2 }], arena:[{ f:'SiO2', n:3 }], aceite:[{ f:'aceite', n:2 }],
  alcohol:[{ f:'C2H5OH', n:3 }], hierro:[{ f:'Fe', n:5 }], azufre:[{ f:'S8', n:2 }] };
const PART_SOLIDO = { sal:[{ f:'NaCl', n:2 }] };
const ETQ = { filtracion:['queda en el papel', 'pasa por el papel'], decantacion:['arriba: se vierte', 'abajo: queda'], destilacion:['se recoge (destilado)', 'queda en el balón'],
  imantacion:['pegado al imán', 'queda'], evaporacion:['queda en el plato'] };
const ELS_MEZCLA = { 'agua-sal':['H', 'O', 'Na', 'Cl'], 'agua-arena':['H', 'O', 'Si'], 'agua-aceite':['H', 'O', 'C'], 'agua-alcohol':['H', 'O', 'C'], 'hierro-azufre':['Fe', 'S'] };
PINTA.separar = {
  alto: w => w < 560 ? 306 : 290,
  llave: v => `${v.mezcla}|${v.metodo}`,
  pintar(ctx, c, W, v, hl){
    const chico = W < 560, mez = MM.MEZCLAS[v.mezcla], p = v.metodo ? (v.p === undefined ? 1 : v.p) : 0;
    const r = v.metodo ? MM.separar(v.mezcla, v.metodo) : null;
    const cajaLupa = (x, y, w, h, nombres, sem, alpha, solido, etq) => {
      rr(ctx, x, y, w, h, 12); ctx.fillStyle = c.caja; ctx.fill(); ctx.strokeStyle = c.line; ctx.lineWidth = 1; ctx.stroke();
      if (etq) texto(ctx, c, etq, x + w/2, y + h + 12, 11, c.ink, 'center', w + 8, 700);
      if (!nombres.length) { texto(ctx, c, 'nada', x + w/2, y + h/2, 12, c.muted, 'center', w, 700); return; }
      const items = nombres.flatMap(n => (solido && PART_SOLIDO[n]) || PART[n]), zona = { x:x + 4, y:y + 4, w:w - 8, h:h - 8 };
      const R = radioPara(items, zona); repartir(items, zona, sem).forEach(q => particula(ctx, c, q.f, q.x, q.y, R, q.a, hl, alpha));
    };
    texto(ctx, c, mez.nombre.toLowerCase(), W/2, 14, 13, c.ink, 'center', W - 16, 800);
    if (chico){
      // Celular: la mezcla arriba a la izquierda, el método al lado; las fracciones abajo.
      const mw = W*0.5, mh = 104;
      cajaLupa(10, 30, mw, mh, mez.partes.map(q => q.nombre), 61, 1 - (r ? ease(p) : 0)*0.85, false, 'la mezcla');
      texto(ctx, c, r ? r.nombre : 'elige un método', 10 + mw + (W - 20 - mw)/2 + 5, 30 + mh/2, 14, c.ink, 'center', W - mw - 30, 800);
      if (r){ flechaH(ctx, 10 + mw + 6, 30 + mh/2 + 18, W - 14, c.muted); dibujarResultado(160, 98); }
    } else {
      const mw = W*0.3, mh = 150;
      cajaLupa(12, 36, mw, mh, mez.partes.map(q => q.nombre), 61, 1 - (r ? ease(p) : 0)*0.85, false, 'la mezcla');
      texto(ctx, c, r ? r.nombre : 'elige un método', 12 + mw + W*0.09, 36 + mh/2 - 14, 14, c.ink, 'center', W*0.17, 800);
      if (r){ flechaH(ctx, 12 + mw + 10, 36 + mh/2 + 4, 12 + mw + W*0.17, c.muted); dibujarResultado(36, mh, 12 + mw + W*0.19); }
    }
    function dibujarResultado(y0, h, x0){
      const x = x0 || 10, ancho = W - x - 10, frs = r.fracciones.length ? r.fracciones : [], n = frs.length + (r.pierde.length ? 1 : 0);
      const w = (ancho - (n - 1)*10)/Math.max(1, n), a = ease(p);
      frs.forEach((fr, k) => cajaLupa(x + k*(w + 10), y0, w, h, fr, 70 + k, a, v.metodo === 'evaporacion' || (v.metodo === 'destilacion' && k === 1), r.separa ? ETQ[v.metodo][k] : (frs.length === 2 ? ETQ[v.metodo][k] : 'todo junto')));
      if (r.pierde.length){ const xx = x + frs.length*(w + 10); ctx.save(); ctx.setLineDash([4, 4]); rr(ctx, xx, y0, w, h, 12); ctx.strokeStyle = c.muted; ctx.stroke(); ctx.restore();
        const items = r.pierde.flatMap(nm => PART[nm]), zona = { x:xx + 4, y:y0 + 4, w:w - 8, h:h - 8 }, R = radioPara(items, zona);
        repartir(items, zona, 80).forEach(q => particula(ctx, c, q.f, q.x, q.y - (1 - a)*12, R, q.a, hl, a*0.8));
        texto(ctx, c, 'se va al aire', xx + w/2, y0 + h + 12, 11, c.ink, 'center', w + 8, 700); }
      if (p >= 1) texto(ctx, c, r.separa ? (r.adecuado ? '✓ se separaron' : 'se separaron, pero no es el método de examen') : '✗ no se separó nada', W/2, y0 + h + 34, 13, c.ink, 'center', W - 16, 800);
    }
  },
  leyenda: v => [...leyEl(ELS_MEZCLA[v.mezcla]), ...(v.mezcla === 'agua-aceite' ? ['<span>aceite: cadenas de C y O, sin sus H</span>'] : [])],
  describir: v => { if (!v.metodo) return `${MM.MEZCLAS[v.mezcla].nombre}. Todavía no se aplica ningún método.`; const r = MM.separar(v.mezcla, v.metodo); return `${MM.MEZCLAS[v.mezcla].nombre}, por ${r.nombre}: ${r.razon}. ${r.separa ? 'Se separaron.' : 'No se separó nada.'}`; },
};

/* --- E = mc² en una escala de potencias de 10 (paso 8) --- */
PINTA.emc = {
  alto: w => w < 560 ? 262 : 250,
  llave: v => v.r ? 1 : 0,
  pintar(ctx, c, W, v, hl){
    const chico = W < 560, x0 = 24, x1 = W - 24, y = chico ? 160 : 150, e0 = 4, e1 = 18, X = e => x0 + (e - e0)/(e1 - e0)*(x1 - x0);

      ops.forEach(([val, t], i) => { const e = Math.log10(val), xx = X(e), ok = i === 2, yy = y - [22, 46, 50, 22][i];
        ctx.save(); ctx.strokeStyle = ok ? c.E : c.muted; ctx.lineWidth = ok ? 3 : 1.5; linea(ctx, xx, y, xx, yy + 8); ctx.restore();
        texto(ctx, c, `${cien(val)}${ok ? ' J' : ''}`, xx, yy - 2, ok ? 13 : 11, ok ? c.E : c.muted, xx < 60 ? 'left' : xx > W - 60 ? 'right' : 'center', 0, ok ? 900 : 700);
        if (!chico || ok) texto(ctx, c, t, xx, yy - 16, 10, ok ? c.ink : c.muted, xx < 60 ? 'left' : xx > W - 60 ? 'right' : 'center', 0, 700); });
      texto(ctx, c, `= ${cien(r.kWh)} kWh`, X(Math.log10(r.E)), y + 58, 12, c.E, 'center', W - 20, 800);
    } else texto(ctx, c, '¿dónde cae 1 g convertido en energía?', W/2, y - 28, 12, c.muted, 'center', W - 20, 700);
  },
  leyenda: () => [leyVar('m', 'm · masa'), leyVar('E', 'E · energía'), leyVar('c', 'c · rapidez de la luz')],
  describir: v => v.r ? 'En la escala de potencias de 10, la energía de 1 gramo cae en 9 por 10 a la 13 joules. Las otras marcas son los errores: sin el cuadrado, con c en kilómetros por segundo y con la masa en gramos.' : 'Un gramo sobre una balanza y una escala de energía en potencias de 10, todavía sin marcas.',
};

/* ----- Resaltar en el dibujo lo que se toca en el texto (regla 4) ----- */
function resaltar(k){ ESCENAS.forEach(E => { E.hl = k; E.dibujar(); }); document.querySelectorAll('.v').forEach(s => s.classList.toggle('hl', !!k && s.dataset.var === k)); }
document.addEventListener('mouseover', e => { const s = e.target.closest && e.target.closest('.v'); if (s) resaltar(s.dataset.var); });
document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('.v')) resaltar(null); });
document.addEventListener('focusin', e => { const s = e.target.closest && e.target.closest('.v'); resaltar(s ? s.dataset.var : null); });

// Un bucle que solo corre mientras algo se mueve.
let RAF = 0, ULT = 0;
function pedir(){ if (!RAF){ ULT = performance.now(); RAF = requestAnimationFrame(tick); } }
function tick(now){
  RAF = 0; const dt = Math.min(0.05, (now - ULT)/1000); ULT = now; let sigue = false;
  for (const E of ESCENAS){
    if (document.getElementById(E.modoId).hidden) continue;
    for (const a of [...E.anims]){ a.t += dt; const f = Math.min(1, a.t/a.dur); a.paso(Math.max(0, f)); if (f >= 1){ E.anims.splice(E.anims.indexOf(a), 1); if (a.fin) a.fin(); } else sigue = true; }
    E.dibujar();
  }
  if (sigue) pedir();
}
function animar(E, dur, paso, fin, retraso){
  if (RM){ paso(1); if (fin) fin(); E.dibujar(); return; }
  E.anims.push({ t:-(retraso || 0), dur, paso, fin }); pedir();
}
function cortar(E){ E.anims = []; }
const LETRAS = 'abcd';
const opcionesHTML = (opts, idFb) => `<div class="opts">${opts.map(([k, t]) => `<button class="opt" type="button" data-k="${k}" aria-label="Opción ${LETRAS.indexOf(k) + 1}: ${t.replace(/<[^>]+>/g, '')}"><span class="l">${LETRAS.indexOf(k) + 1}</span><span>${t.replace(/ tabindex="0"/g, '')}</span></button>`).join('')}</div><p class="fb" id="${idFb}"></p>`;
const otraVez = `<button type="button" class="btn" data-repetir>Ver de nuevo</button>`;
</script>

<script>
/* ================= MODO 1: paso a paso =================

   docs/investigacion/quimica-materia-nomenclatura-organica-ideas-erroneas.md, más fases y componentes, separación y E = mc². */
(function(){

const fc = (f, k) => `${Vfa(f + ' fases')} y ${Vco(k + ' componentes')}`;

const P1 = { id:'materia-cajas', ok:'c', opts:[
  ['a', `La caja 4: tiene dos clases de átomos, ${F('H')} y ${F('O')}`, 'MA9-dos-clases-de-atomos', 'parcial'],
  ['b', `La caja 1: sus átomos están unidos de a dos`, 'MA9-unidos-es-compuesto', 'parcial'],
  ['c', `La caja 2: cada partícula une átomos de dos elementos distintos`],
  ['d', `La caja 3: muchos átomos juntos forman un compuesto`, 'MA9-atomo-es-sustancia', 'hipotesis']],
  fb:{ c:'¡Bien! En la caja 2 todas las partículas son iguales (una sola sustancia) y cada una tiene átomos de H y de O unidos: es un compuesto, H₂O. Mira los rótulos de las cajas.',
    a:`Elegiste la 1. En la caja 4 hay H y O, pero no están unidos entre sí: son moléculas de H₂ y moléculas de O₂ revueltas. Dos sustancias sin unirse forman una ${C4.nombre}. Confundir compuesto y mezcla al leer dibujos de partículas está documentado en universitarios, sin porcentaje en lo que leímos (Stains y Talanquer, 2007, por su resumen). La correcta está marcada.`,
    b:'Elegiste la 2. Los átomos de la caja 1 están unidos, pero todos son de oxígeno: el O₂ es un elemento. Un compuesto necesita átomos de elementos distintos unidos. Esta confusión está documentada, sin porcentaje en lo que leímos (Stains y Talanquer, 2007, por su resumen). La correcta está marcada.',
    d:'Elegiste la 4. Juntar muchos átomos iguales no forma un compuesto: el hierro de la caja 3 es un elemento, con una sola clase de átomo. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.' } };
const P2 = { id:'materia-fases', ok:'d', opts:[
  ['a', `${fc(VASO.errores.cadaCosaUnaFase, VASO.errores.cadaCosaUnComponente)}: cada cosa nombrada cuenta una vez`, 'fases-cada-cosa', 'hipotesis'],
  ['b', `${fc(VASO.nFases, VASO.errores.hieloOtroComponente)}: el hielo y el agua son componentes distintos`, 'fases-hielo-otro-componente', 'hipotesis'],
  ['c', `${fc(VASO.errores.disueltoEsFase, VASO.nComponentes)}: la sal disuelta es una fase aparte`, 'fases-disuelto-es-fase', 'hipotesis'],
  ['d', `${fc(VASO.nFases, VASO.nComponentes)}: la sal está dentro de la fase del agua, y el hielo es agua`]],
  fb:{ d:'¡Bien! Fases: aceite, hielo, agua con sal y arena. Componentes: agua (líquida y sólida, la misma sustancia), sal, aceite y arena. Mira la lupa: la sal está repartida entre las moléculas de agua.',
    a:'Elegiste la 1. Las cosas nombradas no son lo mismo que las fases ni que los componentes: la sal disuelta no forma una zona aparte, y el hielo y el agua son la misma sustancia. Esta opción es una hipótesis nuestra, de la tabla de lo que no tiene respaldo del informe. La correcta está marcada.',
    b:'Elegiste la 2. Las fases están bien, pero el hielo es H₂O igual que el agua: un componente es una sustancia, no un estado. Son 4. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.',
    c:'Elegiste la 3. Los componentes están bien, pero la sal disuelta no forma una zona aparte: sus iones se reparten entre las moléculas de agua y todo se ve igual. Agua con sal es una sola fase. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.' } };
const P3 = { id:'materia-burbujas', ok:'b', opts:[
  ['a', `Hidrógeno y oxígeno (${F('H2')} y ${F('O2')}): el calor separa el agua en sus elementos`, 'MA1-cambio-de-estado-es-reaccion', 'parcial'],
  ['b', `Moléculas de agua (${F('H2O')}): las mismas, solo que separadas unas de otras`],
  ['c', 'Aire que estaba disuelto en el agua: el calor lo saca', 'MA1-burbujas-de-aire', 'hipotesis'],
  ['d', 'Nada: son huecos vacíos que se abren en el agua caliente', 'MA1-burbujas-vacias', 'hipotesis']],
  fb:{ b:'¡Bien! Hervir es un cambio físico: las moléculas de H₂O se separan unas de otras y forman vapor, pero ninguna se rompe. Mira la lupa: dentro de la burbuja hay las mismas moléculas, más sueltas.',
    a:'Elegiste la 1. Para separar el agua en hidrógeno y oxígeno hace falta una reacción química (la electrólisis, con corriente eléctrica), no una cocina. Al hervir, las moléculas de H₂O no se rompen. En una pregunta parecida, sobre el agua que aparece afuera de un vaso frío, cerca de un tercio de 358 universitarios de química general creyó que se forma con el hidrógeno y el oxígeno del aire, antes y después del curso (Salame y Casino, 2021). La correcta está marcada.',
    c:'Elegiste la 3. Las primeras burbujitas sí son aire, pero salen al principio. El agua lleva minutos hirviendo: las burbujas grandes son de vapor de agua. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.',
    d:'Elegiste la 4. La burbuja no está vacía: tiene vapor de agua, moléculas de H₂O muy separadas. Por eso sube y empuja el agua. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.' } };
const P4 = { id:'materia-frasco-cerrado', ok:'a', opts:[
  ['a', `${Vm(fmt2(EV.despues) + ' g')}: el vapor sigue dentro del frasco, y pesa`],
  ['b', `${Vm(fmt2(EV.errores.vaporNoPesa) + ' g')}: el vapor de alcohol no pesa`, 'MA4-el-gas-no-pesa', 'parcial'],
  ['c', `Entre ${Vm(fmt2(EV.errores.vaporPesaMenos[0]))} y ${Vm(fmt2(EV.errores.vaporPesaMenos[1]) + ' g')}: el vapor pesa, pero menos que el líquido`, 'MA4-el-gas-pesa-menos', 'hipotesis'],
  ['d', `Más de ${Vm(fmt2(EV.antes) + ' g')}: el vapor ocupa más lugar y empuja hacia abajo`, 'MA4-el-gas-empuja', 'hipotesis']],
  fb:{ a:`¡Bien! Las moléculas de alcohol no salen del frasco: solo se separan. La balanza sigue en ${fmt2(EV.despues)} g. Ahora prueba a quitar la tapa.`,
    b:`Elegiste la 2. El gas pesa: son las mismas moléculas de alcohol, solo más separadas, y siguen dentro del frasco. Que el gas no pesa aparece en un estudio con escolares israelíes (Stavy, 1990); un resumen secundario dice que cerca de la mitad de los de 15 años no conservaba la materia al evaporarse, cifra que no pudimos verificar. La correcta está marcada.`,
    c:'Elegiste la 3. Cada molécula pesa lo mismo en el líquido que en el vapor; están más separadas, nada más. La masa de vapor es la masa de líquido que se evaporó. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.',
    d:'Elegiste la 4. Ocupar más lugar no es tener más masa: no entró nada al frasco. El vapor empuja la tapa y las paredes por igual, no hacia la balanza. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.' } };
const P5 = { id:'materia-disolver-oxidar', ok:'c', opts:[
  ['a', 'En los dos: el azúcar y el clavo se convierten en otra cosa', 'MA3-disolver-es-reaccionar', 'parcial'],
  ['b', 'Solo en el del azúcar: el azúcar desaparece y se forma «agua azucarada»', 'MA3-disolver-es-desaparecer', 'parcial'],
  ['c', `Solo en el del clavo: el óxido es una sustancia nueva, de ${F('Fe')} y ${F('O')} unidos`],
  ['d', 'En ninguno: el óxido es hierro sucio, y el hierro sigue siendo hierro', 'MA2-oxidar-es-fisico', 'parcial']],
  fb:{ c:'¡Bien! El azúcar se reparte entre las moléculas de agua sin cambiar: si se evapora el agua, vuelve a aparecer. En el clavo, los átomos de hierro se unen con los de oxígeno y forman Fe₂O₃, una sustancia con otras propiedades (rojiza y quebradiza). Mira las lupas.',
    a:'Elegiste la 1. Disolver no es reaccionar: las moléculas de azúcar siguen siendo de azúcar, solo repartidas entre las de agua. Que al disolverse se forma otra sustancia está documentado, sin porcentaje en lo que leímos (citado por Smith y Nakhleh, 2011). La correcta está marcada.',
    b:'Elegiste la 2. El azúcar no desaparece: ya no se ve porque sus moléculas se separaron, pero el agua sabe dulce y, al evaporarla, queda el azúcar. Usar «derretir» por «disolver» aparece en entrevistas con escolares, con una cifra que no pudimos revisar. La correcta está marcada.',
    d:'Elegiste la 4. El óxido no es hierro con suciedad encima: los átomos de hierro se unieron con oxígeno y forman otra sustancia, con otro color y otra dureza. En un estudio con 28 escolares españoles, cerca de 1 de cada 4 llamó cambio físico a una reja que se oxida (Dávila Acedo y otros, 2017; solo vimos fragmentos del artículo). La correcta está marcada.' } };
const P6 = { id:'materia-separar', ok:'c', opts:[
  ['a', 'Filtrar: el papel de filtro retiene la sal', 'separar-filtrar-lo-disuelto', 'hipotesis'],
  ['b', 'Decantar: dejar reposar hasta que la sal se asiente', 'separar-decantar-lo-disuelto', 'hipotesis'],
  ['c', 'Evaporar el agua: la sal se queda en el plato'],
  ['d', 'No se puede: la sal se volvió parte del agua', 'MA3-la-sal-ya-no-esta', 'parcial']],
  fb:{ c:`¡Bien! El agua se va al aire como vapor y la sal, que hierve a ${MM.MEZCLAS['agua-sal'].partes[1].tEb} °C, se queda. Abajo puedes probar cada método con cada mezcla, también los equivocados.`,
    a:`Elegiste la 1. ${FIL.razon[0].toUpperCase() + FIL.razon.slice(1)}: no se separa nada. Pruébalo abajo. Filtrar una mezcla homogénea es una hipótesis nuestra, de la tabla de lo que no tiene respaldo del informe. La correcta está marcada.`,
    b:'Elegiste la 2. Lo disuelto no se asienta: sus partículas se mueven entre las del agua y no caen al fondo, por más que esperes. Esta opción es una hipótesis nuestra, de la tabla de lo que no tiene respaldo del informe. La correcta está marcada.',
    d:'Elegiste la 4. La sal no se volvió agua: sus iones siguen ahí, repartidos, y se recuperan al evaporar. Creer que al disolverse se forma otra sustancia está documentado, sin porcentaje en lo que leímos (citado por Smith y Nakhleh, 2011). La correcta está marcada.' } };
const P7 = { id:'materia-emc2', ok:'b', opts:[
  ['a', `${VE(cien(EMC.errores.gramosSinConvertir) + ' J')}`, 'emc2-gramos-sin-convertir', 'hipotesis'],
  ['b', `${VE(cien(EMC.E) + ' J')}`],
  ['c', `${VE(cien(EMC.errores.cEnKmPorS) + ' J')}`, 'emc2-c-en-km-s', 'hipotesis'],
  ['d', `${VE(cien(EMC.errores.sinCuadrado) + ' J')}`, 'emc2-sin-cuadrado', 'hipotesis']],

    c:`Elegiste la 3. Salió de usar c = 3 × 10⁵ (km/s): con J, la rapidez va en m/s, 3 × 10⁸. Al elevar al cuadrado, el error es de un millón de veces. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.`,
    d:`Elegiste la 4. Salió de multiplicar por c sin elevarla al cuadrado: E = mc², c por c. Esta opción es una hipótesis nuestra, sin estudio que la mida. La correcta está marcada.` } };

// Vistas.
const vCajas = r => ({ tipo:'cajas', r });
const vVaso = r => ({ tipo:'vaso', r });
const vOlla = (r, p) => ({ tipo:'olla', r, p, t: E.vista.t || 0 });
const vFrasco = o => ({ tipo:'frasco', recipiente:FR.recipiente, masa:FR.masa, sust:'C2H5OH', tapa:true, p:0, q:0, ...o });
