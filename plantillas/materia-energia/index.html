const steps = [
 { k:'Paso 1', t:'La lupa y la balanza', vista:() => ({ tipo:'frasco', recipiente:250, masa:100, sust:'H2O', tapa:true, p:0, q:0 }),
   body:() => `<p class="problem">Todo lo que ves está hecho de partículas que no se ven: átomos, y átomos unidos en moléculas. En esta escena, la lupa muestra esas partículas al lado de lo que se ve, y una balanza dice cuánta masa hay.</p>
   <p>En el frasco hay 100 g de agua. La balanza marca la masa del frasco más la del agua: ${Vm('350,00 g')}.</p>
   <p>Para saber si algo es un elemento, un compuesto o una mezcla, no basta mirarlo: hay que ver qué partículas tiene. Y la balanza va a contestar otra pregunta: ¿qué le pasa a la masa cuando algo cambia?</p>
   <p class="hint">Cada elemento tiene su color en el texto y en el dibujo: ${F('H')} el hidrógeno y ${F('O')} el oxígeno. Ese color es una clave, no el color real del átomo. La masa ${Vm('m')} va en mostaza. Toca un color del texto para resaltarlo en el dibujo.</p>` },
 { k:'Paso 2', t:'Antes de mirar, predice', gate:P1, vista:r => vCajas(r),
   body:() => `<p>Cada caja muestra las partículas de una muestra, vistas con una lupa muy potente. Cada círculo es un átomo; los que se tocan están unidos.</p>
   <p>¿En cuál caja hay un compuesto?</p>${opcionesHTML(P1.opts, 'fb')}
   <div class="tras" hidden><div class="eqs"><div class="eq"><span class="ex"><b>Elemento</b>: una sola clase de átomo, sueltos (${F('Fe')}, un metal) o unidos en moléculas (${F('O2')}).</span></div>
   <div class="eq"><span class="ex"><b>Compuesto</b>: átomos de elementos distintos unidos, siempre en la misma proporción (${F('H2O')}: 2 H por cada O).</span></div>
   <div class="eq"><span class="ex"><b>Mezcla</b>: dos o más sustancias sin unirse (${F('H2')} con ${F('O2')}). Se ve igual en todas partes: es homogénea.</span></div></div>
   <p>Elementos y compuestos son <b>sustancias puras</b>: todas sus partículas son iguales. Hay ${C1.atomos} átomos en la caja 1 y ${C3.atomos} en la 3, pero la cantidad no decide nada: decide qué clase de partículas hay.</p>
   <p class="fuente">Confundir compuesto con mezcla, y elemento con átomo, al leer dibujos de partículas (MA9): documentado en universitarios, sin porcentaje en lo que leímos; según el resumen, algunos de esos razonamientos son más fuertes en quienes llevaron más cursos de química (Stains y Talanquer, 2007).</p></div>` },
 { k:'Paso 3', t:'Fases y componentes', gate:P2, vista:r => vVaso(r),
   body:() => `<p>Pregunta clásica de academia. En un vaso hay agua con sal disuelta, unos cubitos de hielo, una capa de aceite y arena en el fondo.</p>
   <p>Una <b>fase</b> es cada zona con las mismas propiedades en toda ella; un <b>componente</b> es cada sustancia distinta. ¿Cuántas ${Vfa('fases')} y cuántos ${Vco('componentes')} tiene el sistema? (El aire de arriba no se cuenta.)</p>${opcionesHTML(P2.opts, 'fb')}
   <div class="tras" hidden><div class="eqs"><div class="eq"><span class="ex">${Vfa('Fases')}: aceite · hielo · agua con sal · arena = ${Vfa(VASO.nFases)}</span><span class="note">Lo disuelto no forma otra fase: está repartido en la del líquido.</span></div>
   <div class="eq"><span class="ex">${Vco('Componentes')}: ${F('H2O')} (agua y hielo) · ${F('NaCl')} · aceite · arena (SiO₂) = ${Vco(VASO.nComponentes)}</span><span class="note">El hielo es agua sólida: el mismo componente en otra fase. Sistema ${VASO.nombre}.</span></div></div>
   <p>Si te preguntan por los <b>elementos</b> (especies atómicas), se cuentan las clases de átomo: H, O, Na, Cl, Si… y los del aceite, que es una mezcla de grasas con C, H y O.</p></div>` },
 { k:'Paso 4', t:'¿Qué hay en las burbujas?', gate:P3, vista:r => vOlla(r, r ? 1 : 0), anima:true,
   body:() => `<p>Una olla con agua lleva varios minutos hirviendo a borbotones (las burbujitas de aire del principio ya salieron). Del fondo suben burbujas grandes.</p>
   <p>¿Qué hay dentro de esas burbujas?</p>${opcionesHTML(P3.opts, 'fb')}
   <div class="tras" hidden><p>Hervir, fundir, evaporar y condensar son <b>cambios físicos</b>: cambia cómo están juntas las moléculas, no las moléculas. Las de ${F('H2O')} siguen siendo de ${F('H2O')}.</p>
   <p>Lo mismo pasa con el agua que aparece afuera de un vaso con hielo: es vapor del aire que se condensa, no agua que «se forma».</p>
   <p class="fuente">Leer un cambio de estado como una reacción (MA1): en una pregunta sobre el vaso frío, cerca de un tercio de 358 universitarios de química general eligió que el agua se forma con el oxígeno y el hidrógeno del aire, antes y después del curso (Salame y Casino, 2021). Lo de las burbujas de aire o vacías es hipótesis nuestra.</p></div>` },
 { k:'Paso 5', t:'La balanza con el frasco cerrado', gate:P4, vista:r => vFrasco(r ? { p:1 } : { oculta:false }),
   body:() => `<p>En un frasco grande con tapa (${Vm(fmt2(FR.recipiente) + ' g')}) se echan ${Vm(fmt2(FR.masa) + ' g')} de alcohol. La balanza marca ${Vm(fmt2(EV.antes) + ' g')}. Se deja al sol y, al rato, ya no se ve líquido: todo el alcohol se evaporó dentro del frasco.</p>
   <p>¿Qué marca ahora la balanza?</p>${opcionesHTML(P4.opts, 'fb')}
   <div class="tras" hidden><div class="eqs"><div class="eq"><span class="ex">Cerrado: ${Vm(fmt2(EV.antes) + ' g')} → ${Vm(fmt2(EV.despues) + ' g')}</span><span class="note">Ley de conservación de la masa (Lavoisier): en un sistema cerrado la masa no cambia, ni en un cambio físico ni en uno químico.</span></div>
   <div class="eq"><span class="ex">Destapado: ${Vm(fmt2(EVA.antes) + ' g')} → ${Vm(fmt2(EVA.despues) + ' g')}</span><span class="note">El vapor se va al aire: la balanza baja en los ${fmt2(EVA.seVa)} g que salieron. La masa no desapareció; está afuera.</span></div></div>
   <div class="nav"><button type="button" class="btn" id="destapar">Quitar la tapa</button>${otraVez}</div>
   <p class="fuente">«El gas no pesa» (MA4): Stavy (1990) lo encontró en escolares israelíes y vio que quien conserva el peso al evaporarse la acetona no siempre lo conserva al sublimarse el yodo; la cifra de cerca de la mitad de los de 15 años viene de un resumen secundario y no la pudimos verificar. Las otras dos opciones son hipótesis nuestras.</p></div>` },
 { k:'Paso 6', t:'Disolver contra oxidar', gate:P5, vista:r => vDos(r, r ? 1 : 0, 0),
   body:() => `<p>En un vaso, un poco de azúcar se disuelve en agua y ya no se ve. En otro, un clavo de hierro pasa unos días en agua, al aire, y se cubre de herrumbre rojiza.</p>
   <p>¿En cuál aparece una sustancia nueva?</p>${opcionesHTML(P5.opts, 'fb')}
   <div class="tras" hidden><div class="eqs"><div class="eq"><span class="ex">Azúcar: las mismas sustancias antes y después (${AZ.sustanciasDespues.map(F).join(' y ')}) → cambio ${AZ.tipo}</span></div>
   <div class="eq"><span class="ex">Clavo: aparece ${CL.nuevas.map(F).join(', ')} con los mismos átomos (${CL.atomosAntes.Fe} ${F('Fe')} y 6 ${F('O')} del ${F('O2')} → ${CL.atomosDespues.Fe/2} ${F('Fe2O3')}; el agua no cambia) → cambio ${CL.tipo}</span><span class="note">La herrumbre real lleva además agua en su estructura (Fe₂O₃·xH₂O); la lupa la dibuja como Fe₂O₃. El agua ayuda a que pase. El óxido es un sólido: la lupa muestra unidades Fe₂O₃, no moléculas sueltas.</span></div></div>
   <p>Un cambio químico se reconoce porque aparecen sustancias nuevas, no porque «se vea irreversible» ni porque cambie el color. Y si cambian los propios elementos (el uranio que se parte en bario y kriptón), el cambio es <b>nuclear</b>.</p>
   <div class="nav"><button type="button" class="btn" id="evaporar">Evaporar el agua azucarada</button>${otraVez}</div>
   <p class="fuente">Describir una reacción por lo que se ve y no por las partículas (MA8): según el resumen de Ahtee y Varjola (1998), solo cerca del 6 % de los escolares de último ciclo y del 14 % de los universitarios de primer año la describieron bien.</p></div>` },
 { k:'Paso 7', t:'Separar la mezcla', gate:P6, vista:r => vSep(1),
   body:() => `<p>Quieres recuperar la sal de un vaso de agua salada. ¿Qué método funciona?</p>${opcionesHTML(P6.opts, 'fb')}
   <div class="tras" hidden><p>Cada método aprovecha una propiedad en la que los componentes son distintos. Elige una mezcla y un método, y mira qué pasa.</p>
   <div class="campo" id="sepMez">Mezcla<div class="seg" role="group" aria-label="Mezcla">${Object.entries(MM.MEZCLAS).map(([k, m]) => `<button type="button" data-m="${k}" aria-pressed="${k === SEP.mezcla}">${m.nombre.replace('Limaduras de hierro con azufre en polvo', 'Hierro con azufre')}</button>`).join('')}</div></div>
   <div class="campo" id="sepMet">Método<div class="seg" role="group" aria-label="Método">${Object.entries(MM.METODOS).map(([k, m]) => `<button type="button" data-k="${k}" aria-pressed="false">${m.nombre}</button>`).join('')}</div></div>
   <p class="estado" id="sepEst" aria-live="polite"></p>
   <div class="eqs"><div class="eq"><span class="ex">Agua con sal → ${SAL.adecuados.map(k => MM.METODOS[k].nombre).join(' o ')} (difiere ${SAL.difiere})</span></div>
   <div class="eq"><span class="ex">Filtración: tamaño · decantación: densidad · destilación: temperatura de ebullición · imantación: magnetismo</span></div></div></div>` },
 { k:'Paso 8', t:'E = mc²: la masa que se vuelve energía', gate:P7, vista:r => vEmc(r),
   body:() => `<p>En las reacciones nucleares, una parte pequeñísima de la masa ${Vm('m')} se transforma en energía ${VE('E')}, según ${VE('E')} = ${Vm('m')}${Vc('c')}², con <span class="f">${Vc('c')} = 3 × 10⁸ m/s</span>, la rapidez de la luz.</p>
   <p>Si 1 g de materia se transformara por completo en energía, ¿cuánta energía daría?</p>${opcionesHTML(P7.opts, 'fb')}
   <div class="tras" hidden><div class="eqs"><div class="eq"><span class="ex">${VE('E')} = ${Vm('m')}${Vc('c')}² = ${Vm('0,001 kg')} × (${Vc('3 × 10⁸ m/s')})² = ${VE(cien(EMC.E) + ' J')}</span><span class="note">La masa en kg, c en m/s y al cuadrado: así sale en joules. En kWh: ${cien(EMC.E)} ÷ (3,6 × 10⁶) = ${cien(EMC.kWh)} kWh. Si una casa gastara 150 kWh al mes, le alcanzaría para unos ${fmt(Math.round(EMC.kWh/150/12/1000)*1000, 0)} años.</span></div></div>
   <p>En una reacción química la masa también cambia, pero tan poco que ninguna balanza lo nota (lo ves en «¿Qué pasa si…?»). Por eso, en química se dice que la masa se conserva.</p>
   <p class="fuente">No encontramos estudios que midan estos errores de cálculo con E = mc² (gramos sin convertir, c en km/s, olvidar el cuadrado): son hipótesis nuestras, de la tabla de lo que no tiene respaldo del informe. La idea de que «una parte de la masa se convierte en energía» es el lenguaje de examen; lo que pasa es que la energía del sistema y su masa cambian a la vez.</p></div>` },
];

// ----- Navegación -----
const dots = $('dots');
steps.forEach((s, n) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.textContent = n + 1; b.addEventListener('click', () => go(n)); li.appendChild(b); dots.appendChild(li);
});
// La olla siempre burbujea un poco (salvo con movimiento reducido).
let burbujeo = 0;
function burbujear(){ if (RM || burbujeo) return; const f = now => { if (S.step !== 3 || $('m1').hidden){ burbujeo = 0; return; } E.vista.t = now/1000; E.dibujar(); burbujeo = requestAnimationFrame(f); }; burbujeo = requestAnimationFrame(f); }
// Lo que pasa después de responder (o al pedir "Ver de nuevo"); todo lo calcula el motor.
function mostrar(n){
  cortar(E);
  if (n === 3){ E.vista = vOlla(true, 0); animar(E, 1.2, f => { E.vista.p = f; }, null, 0.2); }
  else if (n === 4){ E.vista = vFrasco({ p:0 }); animar(E, 1.8, f => { E.vista.p = f; }, () => E.describir(), 0.3); }
  else if (n === 5){ E.vista = vDos(true, 0, 0); animar(E, 1.8, f => { E.vista.p = f; }, () => E.describir(), 0.3); }
  else if (n === 6){ if (SEP.metodo){ E.vista = vSep(0); animar(E, 1.4, f => { E.vista.p = f; }, () => E.describir(), 0.2); } else E.vista = vSep(1); }
  else E.vista = steps[n].vista(true);
  E.dibujar(); pedir();
}
function estadoSep(){
  const el = $('sepEst'); if (!el) return;
  if (!SEP.metodo){ el.textContent = 'Elige un método.'; return; }
  const r = MM.separar(SEP.mezcla, SEP.metodo);
  el.textContent = `${r.nombre[0].toUpperCase() + r.nombre.slice(1)} (aprovecha ${r.propiedad}): ${r.razon}. ${r.separa ? (r.adecuado ? 'Separa.' : 'Separa, pero no es el método que pide el examen para esta mezcla.') : 'No separa nada.'}`;
}
function enlazar(){
  const body = $('stepBody');
  const rep = body.querySelector('[data-repetir]'); if (rep) rep.onclick = () => { mostrar(S.step); E.describir(); };
  const des = $('destapar'); if (des) des.onclick = () => { cortar(E); E.vista = vFrasco({ p:1, tapa:false, q:0 }); animar(E, 2.2, f => { E.vista.q = f; }, () => E.describir(), 0.1); E.dibujar(); pedir(); subir(); };
  const ev = $('evaporar'); if (ev) ev.onclick = () => { cortar(E); E.vista = vDos(true, 1, 0); animar(E, 2.0, f => { E.vista.ev = f; }, () => E.describir(), 0.1); E.dibujar(); pedir(); subir(); };
  body.querySelectorAll('#sepMez button').forEach(b => b.onclick = () => { SEP.mezcla = b.dataset.m; SEP.metodo = null; body.querySelectorAll('#sepMez button').forEach(x => x.setAttribute('aria-pressed', x === b)); body.querySelectorAll('#sepMet button').forEach(x => x.setAttribute('aria-pressed', 'false')); cortar(E); E.vista = vSep(1); E.dibujar(); E.describir(); estadoSep(); });
  body.querySelectorAll('#sepMet button').forEach(b => b.onclick = () => { SEP.metodo = b.dataset.k; body.querySelectorAll('#sepMet button').forEach(x => x.setAttribute('aria-pressed', x === b)); estadoSep(); mostrar(6); E.describir(); subir(); });
  estadoSep();
}
const subir = () => { if (innerWidth < 900) $('cv').scrollIntoView({ block:'start', behavior: RM ? 'auto' : 'smooth' }); };
function go(n){
  if (n < 0 || n >= steps.length || n > S.max) return;
  const s = steps[n]; S.step = n; cortar(E);
  const r = s.gate ? !!S.pred[s.gate.id] : true;
  E.vista = s.vista(r);
  $('stepK').textContent = `${s.k} de ${steps.length}`;
  $('stepT').textContent = s.t;
  $('stepBody').innerHTML = s.body();
  enlazar(); pintarDots();
  E.compactar(s.gate && !S.pred[s.gate.id]);
  if (s.gate) prediccion(s);
  nav(); E.dibujar(); pedir(); E.describir();
  if (n === 3) burbujear();
}
function nav(){
  const s = steps[S.step];
  $('prev').disabled = S.step === 0;
  $('next').disabled = S.step === steps.length - 1 || (s.gate && !S.pred[s.gate.id]);
  $('next').textContent = s.gate && !S.pred[s.gate.id] ? 'Elige una opción' : 'Siguiente';
}
function pintarDots(){
  [...dots.querySelectorAll('button')].forEach((b, k) => {
    b.className = k === S.step ? 'on' : (k <= S.max ? 'done' : ''); b.disabled = k > S.max;
    b.setAttribute('aria-label', k > S.max ? `Paso ${k + 1}, bloqueado` : `Ir al ${steps[k].k.toLowerCase()}: ${steps[k].t}`);
    if (k > S.max) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
    if (k === S.step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
}
function desbloquear(n){ if (n > S.max) S.max = n; }
function prediccion(s){
  const P = s.gate, btns = [...$('stepBody').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[P.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === P.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb'); fb.textContent = P.fb[p]; fb.className = 'fb ' + (p === P.ok ? 'ok' : 'mal');
    $('stepBody').querySelectorAll('.tras').forEach(el => el.hidden = false);
    enlazar();
  };
  const t0 = Date.now();
  btns.forEach(b => b.addEventListener('click', () => {
    if (S.pred[P.id]) return;
    const o = P.opts.find(q => q[0] === b.dataset.k);
    S.pred[P.id] = o[0]; desbloquear(S.step + 1); pintar(); pintarDots(); nav();
    registrarPrediccion(P.id, o[0], o[0] === P.ok, o[2] || '', o[3] || '', t0);
    $('next').focus({ preventScroll:true });
    // En el celular el dibujo sube a la vista y la animación arranca ~380 ms después (nucleo/celular.js).
    const paso = S.step; E.compactar(false);
    Celular.alResponder($('cv'), () => { mostrar(paso); E.describir(); if (paso === 3) burbujear(); }, () => S.step === paso);
  }));
  pintar();
}
$('next').addEventListener('click', () => { const s = steps[S.step]; if (s.gate && !S.pred[s.gate.id]) return; desbloquear(S.step + 1); go(S.step + 1); });
$('prev').addEventListener('click', () => go(S.step - 1));
alRedibujarTema(() => E.dibujar());
addEventListener('modo', () => { E.resize(); E.dibujar(); pedir(); if (S.step === 3) burbujear(); });
go(0);
})();
</script>

<script>
/* ================= MODO 2: ¿qué pasa si…? =================
   Cada experimento arranca con una predicción; lo que la respondería (la lectura, los rótulos, la lupa de después)
   se muestra después de responder. */

/* --- Lana de acero que arde sobre la balanza --- */
// v: { r, p, cerrado }
PINTA.lana = {
  alto: w => w < 560 ? 280 : 290,
  llave: v => `${v.cerrado}`,
  pintar(ctx, c, W, v, hl){
    const chico = W < 560, cx = chico ? W*0.3 : W*0.32, yb = 196, p = v.r ? (v.p === undefined ? 1 : v.p) : 0;
    const r = MM.quemarMetal({ metal:'Fe', masa:5.6, oxido:'Fe2O3', recipiente: v.cerrado ? 200 : 0, cerrado: !!v.cerrado });
    if (v.cerrado){ ctx.save(); rr(ctx, cx - 70, yb - 150, 140, 150, 16); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 3; ctx.stroke(); ctx.restore(); }
    // Montón de lana (hebras grises) que se vuelve polvo.
    ctx.save(); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 1.2; const rnd = azar(3);
    for (let i = 0; i < 26; i++){ ctx.globalAlpha = 1 - p*0.8; ctx.beginPath(); const x = cx - 40 + rnd()*80, y = yb - 8 - rnd()*34; ctx.ellipse(x, y, 10 + rnd()*12, 4 + rnd()*5, rnd()*3, 0, Math.PI*2); ctx.stroke(); }
    ctx.restore();
    if (p > 0 && p < 1) llama(ctx, c, cx, yb - 20, 70);
    balanza(ctx, c, cx, yb, chico ? W*0.48 : 180, `${fmt2(r.antes + (r.despues - r.antes)*ease(p))} g`);
    texto(ctx, c, v.cerrado ? 'frasco cerrado grande, con aire de sobra' : 'balanza abierta, al aire', cx, yb + 50, 12, c.ink, 'center', W*0.55, 700);
    // Lupa: Fe con O₂ del aire → Fe₂O₃.
    const lr = chico ? Math.min(W*0.2, 76) : Math.min(W*0.18, 98), lx = chico ? W - lr - 8 : W*0.74, ly = 110;
    lupa(ctx, c, lx, ly, lr, [cx + 20, yb - 24], c.paper); recortar(ctx, lx, ly, lr);
    // Antes: solo el hierro (sólido, átomos en fila que se tocan). El O₂ del aire entra desde fuera de la lupa al arder.
    const R = lr/9, ant = [-1.5, -0.5, 0.5, 1.5].map(k => ({ f:'Fe', x:lx + k*2.2*R, y:ly + 0.45*lr, a:0 }))
      .concat([[-0.6, -1.4], [0.05, -1.6], [0.65, -1.4]].map(([x, y], k) => ({ f:'O2', x:lx + x*lr, y:ly + y*lr, a:k })));
    const des = [{ f:'Fe2O3', x:lx, y:ly + 0.42*lr, a:0 }, { f:'Fe2O3', x:lx, y:ly - 0.02*lr, a:0 }];
    transicion(ctx, c, ant, des, R, p, true, hl);
    ctx.restore(); bordeLupa(ctx, c, lx, ly, lr);
    if (p >= 1) texto(ctx, c, 'el O₂ del aire queda unido', lx, ly + lr + 14, 11, c.ink, 'center', chico ? 2*lr + 14 : 2*lr + 40, 800);
  },
  leyenda: () => [...leyEl(['Fe', 'O']), leyVar('m', 'm · lo que marca la balanza')],
  describir: v => { const r = MM.quemarMetal({ metal:'Fe', masa:5.6, oxido:'Fe2O3', recipiente: v.cerrado ? 200 : 0, cerrado: !!v.cerrado }); return v.r ? `La balanza pasa de ${fmt2(r.antes)} a ${fmt2(r.despues)} gramos. En la lupa, el hierro se une con moléculas de oxígeno y forma Fe₂O₃.` : `Lana de acero sobre una balanza que marca ${fmt2(r.antes)} gramos.`; },
};
/* --- Oxígeno y ozono en una caja --- */
PINTA.ozono = {
  alto: w => w < 560 ? 230 : 250,
  pintar(ctx, c, W, v, hl){
    const bw = Math.min(W - 30, 420), bx = (W - bw)/2, by = 12, bh = W < 560 ? 180 : 200;
    rr(ctx, bx, by, bw, bh, 16); ctx.fillStyle = c.caja; ctx.fill(); ctx.strokeStyle = c.line; ctx.stroke();
    const items = [{ f:'O2', n:4 }, { f:'O3', n:3 }], zona = { x:bx + 8, y:by + 8, w:bw - 16, h:bh - 16 }, R = Math.min(radioPara(items, zona), 10);
    repartir(items, zona, 91).forEach(q => { particula(ctx, c, q.f, q.x, q.y, R, q.a, hl); if (v.r) texto(ctx, c, q.f === 'O2' ? 'O₂' : 'O₃', q.x, q.y + extension(q.f)*R + 8, 11, c.ink, 'center', 0, 800); });
    texto(ctx, c, v.r ? 'una mezcla: oxígeno (O₂) y ozono (O₃)' : 'la caja', W/2, by + bh + 14, 12, v.r ? c.ink : c.muted, 'center', W - 20, 800);
  },
  leyenda: () => leyEl(['O']),
  describir: v => v.r ? 'La caja tiene 4 moléculas de O₂ y 3 de O₃: dos sustancias del mismo elemento, una mezcla.' : 'Una caja con moléculas de dos átomos de oxígeno y moléculas de tres átomos de oxígeno.',
};
/* --- Un átomo de azufre --- */
PINTA.azufre = {
  alto: w => w < 560 ? 250 : 260,
  pintar(ctx, c, W, v, hl){
    const chico = W < 560, px = chico ? W*0.2 : W*0.18, py = 190;
    ctx.save(); ctx.fillStyle = c.polvo; ctx.beginPath(); ctx.moveTo(px - 60, py); ctx.quadraticCurveTo(px, py - 90, px + 60, py); ctx.closePath(); ctx.fill(); ctx.restore();
    texto(ctx, c, 'azufre en polvo', px, py + 16, 12, c.ink, 'center', W*0.36, 700);
    const lr = chico ? Math.min(W*0.19, 70) : Math.min(W*0.16, 86), lx = chico ? W*0.56 : W*0.5, ly = 112;
    lupa(ctx, c, lx, ly, lr, [px + 10, py - 30], c.paper); recortar(ctx, lx, ly, lr);
    const R = lr/9.5; [[-0.42, -0.4, 0], [0.42, -0.3, 0.4], [0, 0.45, 0.8]].forEach(([x, y, a]) => particula(ctx, c, 'S8', lx + x*lr, ly + y*lr, R, a, hl));
    ctx.restore(); bordeLupa(ctx, c, lx, ly, lr);
    texto(ctx, c, 'moléculas S₈', lx, ly + lr + 14, 11, c.muted, 'center', 2*lr + 10, 700);
    // Un solo átomo, aparte.
    const ax = chico ? W - 40 : W*0.83, ay = ly;
    ctx.save(); ctx.strokeStyle = c.muted; ctx.setLineDash([3, 4]); linea(ctx, lx + lr, ly, ax - 26, ay); ctx.restore();
    particula(ctx, c, 'S', ax, ay, chico ? 15 : 18, 0, hl);
    texto(ctx, c, 'un átomo', ax, ay + 34, 11, c.muted, 'center', 80, 700);
    if (v.r) texto(ctx, c, 'el átomo solo: sin color, sin fusión, sin dureza', chico ? W/2 : ax, chico ? 236 : ay + 52, 11, c.ink, 'center', chico ? W - 16 : W*0.3, 800);
  },
  leyenda: () => leyEl(['S']).concat(['<span>el añil es la clave del azufre en el dibujo, no su color</span>']),
  describir: v => v.r ? 'Un átomo de azufre solo tiene masa y su forma de combinarse; el color amarillo, la fusión y la dureza son del conjunto de muchos átomos.' : 'Un montón de azufre en polvo amarillo; la lupa muestra moléculas de ocho átomos de azufre y, aparte, un solo átomo.',
};
/* --- Juliaca: la meseta de la ebullición --- */
PINTA.juliaca = {
  alto: w => w < 560 ? 270 : 260,
  pintar(ctx, c, W, v, hl){
    const chico = W < 560, ox = 16, ow = chico ? W*0.4 : W*0.3, oy = 64, oh = 120, p = v.r ? (v.p === undefined ? 1 : v.p) : 0;
    ctx.fillStyle = c.agua; rr(ctx, ox, oy + 14, ow, oh - 14, 10); ctx.fill();
    ctx.save(); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 3.5; rr(ctx, ox, oy, ow, oh, 12); ctx.stroke(); ctx.restore();
    llama(ctx, c, ox + ow/2, oy + oh + 30, ow*0.8);
    // Termómetro.
    const tx = ox + ow*0.75; ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 2; rr(ctx, tx - 4, oy - 30, 8, oh, 4); ctx.stroke(); ctx.restore();
    texto(ctx, c, v.r ? '87 °C' : '87 °C → ?', tx, oy - 42, 13, c.T, 'center', ow, 900);
    // Gráfica T contra t: sube y se queda en 87 mientras hierve.
    const gx = ox + ow + (chico ? 24 : 40), gw = W - gx - 16, gy = 30, gh = chico ? 170 : 160;
    ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.3; linea(ctx, gx, gy, gx, gy + gh); linea(ctx, gx, gy + gh, gx + gw, gy + gh); ctx.restore();
    texto(ctx, c, 'T', gx - 10, gy + 6, 12, c.T, 'center', 0, 900); texto(ctx, c, 'tiempo', gx + gw - 20, gy + gh + 14, 11, c.muted, 'center', 0, 700);
    const Ty = T => gy + gh - (T - 10)/(110 - 10)*gh;
    ctx.save(); ctx.setLineDash([3, 4]); ctx.strokeStyle = c.muted; linea(ctx, gx, Ty(100), gx + gw, Ty(100)); ctx.restore();
    texto(ctx, c, '100 °C', gx + gw, Ty(100) - 9, 10, c.muted, 'right', 0, 700);
    ctx.save(); ctx.strokeStyle = c.T; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(gx, Ty(15)); ctx.lineTo(gx + gw*0.45, Ty(87)); ctx.stroke();
    if (p > 0){ ctx.beginPath(); ctx.moveTo(gx + gw*0.45, Ty(87)); ctx.lineTo(gx + gw*(0.45 + 0.5*p), Ty(87)); ctx.stroke(); }
    ctx.restore();
    if (!chico) texto(ctx, c, 'empieza a hervir', gx + gw*0.45 - 6, Ty(87) - 12, 10, c.muted, 'right', gw*0.45, 700);
    if (p >= 1) texto(ctx, c, chico ? 'sigue en 87 °C' : '5 min más: sigue en 87 °C', gx + gw*0.74, Ty(87) + 16, 11, c.T, 'center', gw*0.5, 800);
  },
  leyenda: () => [leyVar('T', 'T · temperatura')],
  describir: v => v.r ? 'La gráfica sube hasta 87 grados y se queda horizontal mientras el agua hierve: el termómetro sigue en 87 grados.' : 'Una olla que hierve en Juliaca con un termómetro en 87 grados y una gráfica de temperatura que sube hasta que empieza a hervir.',
};
/* --- La balanza nuclear --- */
PINTA.nuclear = {
  alto: w => w < 560 ? 230 : 230,
  pintar(ctx, c, W, v, hl){
    const chico = W < 560, cx = W/2, yb = 128, p = v.r ? (v.p === undefined ? 1 : v.p) : 0, b = MM.balanzaNuclear(1.8e14);
    ctx.save(); rr(ctx, cx - 70, yb - 92, 140, 90, 14); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
    texto(ctx, c, 'el combustible antes y lo que queda después; la energía sale', cx, yb + 74, 11, c.muted, 'center', W - 20, 700);
    ctx.save(); ctx.fillStyle = c.muted; for (let i = 0; i < 5; i++){ rr(ctx, cx - 50 + i*21, yb - 40, 16, 34, 4); ctx.fill(); } ctx.restore();
    balanza(ctx, c, cx, yb, chico ? W*0.7 : 260, v.r ? `M − ${fmt(b.baja*ease(p), 2)} g` : 'M');
    // La energía que sale, en su color, al responder.
    if (v.r && p > 0){ ctx.save(); ctx.strokeStyle = c.E; ctx.lineWidth = 2.5; for (const a of [-0.45, 0, 0.45, Math.PI - 0.45, Math.PI, Math.PI + 0.45]){ const r0 = 80, r1 = 80 + 26*ease(p); linea(ctx, cx + Math.cos(a)*r0, yb - 46 + Math.sin(a)*r0, cx + Math.cos(a)*r1, yb - 46 + Math.sin(a)*r1); } ctx.restore();
      texto(ctx, c, `E = 1,8 × 10¹⁴ J`, cx, yb - 106, 13, c.E, 'center', W - 20, 900); }
    texto(ctx, c, v.r && p >= 1 ? `baja ${fmt(b.baja, 2)} g = 2 × 10⁻³ kg` : 'se liberan 1,8 × 10¹⁴ J', cx, yb + 52, 13, v.r && p >= 1 ? c.m : c.ink, 'center', W - 20, 800);
  },
  leyenda: () => [leyVar('m', 'm · masa'), leyVar('E', 'E · energía')],
  describir: v => v.r ? 'La balanza marca 2 gramos menos: la masa que corresponde a la energía que salió como calor y radiación.' : 'El combustible sobre una balanza que marca M; después se pesa lo que queda.',
};

(function(){
const $ = id => document.getElementById(id);
const E = crearEscena($('cv2'), 'desc2', 'm2', 'ley2');
const LANA = MM.quemarMetal({ metal:'Fe', masa:5.6, oxido:'Fe2O3', cerrado:false }), LANAC = MM.quemarMetal({ metal:'Fe', masa:5.6, oxido:'Fe2O3', recipiente:200, cerrado:true });
const OZ = MM.clasificarCaja([{ formula:'O2', n:4 }, { formula:'O3', n:3 }]);
const AZU = MM.particula('S', ['color', 'temperatura de fusión', 'dureza', 'masa']);
const JUL = MM.hervir({ masa:500, Teb:87, minutos:5, potencia:2000 });
const NUC = MM.balanzaNuclear(1.8e14), MET = MM.masaDeEnergia(890000);

const EXPS = [
  { id:'lana-de-acero', corto:'La lana de acero que arde',
    q:`Sobre una balanza abierta hay ${Vm('5,60 g')} de lana de acero (hilos finos de ${F('Fe')}). Se enciende y arde toda, hasta volverse un polvo oscuro: óxido de hierro. ¿Qué pasa con la lectura de la balanza?`,
    opts:[['a', 'Sube: el hierro se une con oxígeno del aire'],
          ['b', 'No cambia: la masa siempre se conserva', 'balanza-abierta-conserva', 'hipotesis'],
          ['c', 'Baja: al arder, parte del hierro se va como humo', 'MA5-arder-pierde-masa', 'parcial'],
          ['d', 'Sube: el calor del fuego queda guardado en el polvo, y el calor pesa', 'calor-pesa', 'hipotesis']],
    ok:'a',
    fb:{ b:`La masa se conserva, pero hay que contarla toda: aquí entra oxígeno del aire, que la balanza abierta no pesaba al principio. Esta opción es una hipótesis nuestra, sin estudio que la mida.`,
      c:'El hierro no se va: se queda en el plato, unido con oxígeno. Por eso el polvo pesa más que la lana. Creer que la masa cambia cuando algo arde está documentado: en 195 escolares de Israel, las respuestas erróneas sobre la masa en una combustión en recipiente cerrado bajaron de cerca del 45 % al 19 % al enseñar el tema (Basheer y otros, 2018).',
      d:'Acertaste que sube, pero no por el calor: el calor es energía y no se pesa en una balanza. Sube por el oxígeno que se unió al hierro. Esta opción es una hipótesis nuestra, sin estudio que la mida.' },
    antes:() => ({ tipo:'lana' }), despues:p => ({ tipo:'lana', r:true, p }), anima:true,
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">${F('Fe')} → ${F('Fe2O3')}: ${Vm(fmt2(LANA.antes) + ' g')} → ${Vm(fmt2(LANA.despues) + ' g')}</span><span class="note">${fmt(LANA.moles, 2)} mol de Fe × 3/2 × 16 g = ${fmt(LANA.oxigeno, 2)} g de oxígeno que vinieron del aire.</span></div>
      <div class="eq"><span class="ex">En un frasco cerrado: ${Vm(fmt2(LANAC.antes) + ' g')} → ${Vm(fmt2(LANAC.despues) + ' g')}</span><span class="note">Un frasco grande, con aire de sobra: el oxígeno ya estaba adentro y la balanza no se mueve.</span></div></div>
      <p>En la práctica sale sobre todo Fe₃O₄, negro; la cuenta de academia usa Fe₂O₃. Con cualquiera de los dos óxidos la balanza sube.</p>
      <p>Es lo contrario de lo que pasa con un papel que arde: ahí se forman gases (CO₂ y vapor) que se van, y la balanza abierta baja. En los dos casos, la masa total se conserva.</p>
      <div class="nav"><button type="button" class="btn" id="xCerrado">Hacerlo en un frasco cerrado</button></div>
      <p class="fuente">Que la masa cambia cuando algo arde o se forma un gas (MA5): solo el 38 % de 79 escolares argentinos aceptó que la masa se conserva en un recipiente cerrado (Casado y Raviolo, 2005). La versión con oxígeno que entra, al revés, es hipótesis nuestra.</p>` },
  { id:'oxigeno-ozono', corto:'Oxígeno con ozono',
    q:`En la caja hay moléculas de ${F('O2')} (el oxígeno que respiras) y moléculas de ${F('O3')} (el ozono), revueltas. ¿Cómo se clasifica lo que hay en la caja?`,
    opts:[['a', 'Sustancia pura: solo hay átomos de oxígeno', 'MA9-un-elemento-una-sustancia', 'hipotesis'],
          ['b', 'Sustancia pura, un compuesto: el O₃ es una combinación de átomos', 'MA9-unidos-es-compuesto', 'parcial'],
          ['c', 'Mezcla: hay dos sustancias distintas, del mismo elemento'],
          ['d', 'Mezcla de dos elementos: el O₂ y el O₃ son elementos distintos', 'alotropo-otro-elemento', 'hipotesis']],
    ok:'c',
    fb:{ a:'Un solo elemento no quiere decir una sola sustancia: las moléculas de O₂ y de O₃ son distintas (el ozono huele fuerte y es tóxico; el oxígeno, no). Esta opción es una hipótesis nuestra, de la tabla de lo que no tiene respaldo del informe.',
      b:'El O₃ tiene sus átomos unidos, pero todos son de oxígeno: es un elemento, no un compuesto. Confundir «unido» con «compuesto» está documentado, sin porcentaje en lo que leímos (Stains y Talanquer, 2007, por su resumen).',
      d:'El O₂ y el O₃ son el mismo elemento, oxígeno, en dos formas (alótropos). Un elemento se define por su clase de átomo, no por la molécula. Esta opción es una hipótesis nuestra, sin estudio que la mida.' },
    antes:() => ({ tipo:'ozono' }), despues:() => ({ tipo:'ozono', r:true }),
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">Sustancias: ${OZ.sustancias.map(F).join(' y ')} = ${OZ.nSustancias} · elementos: ${OZ.elementos.map(F).join('')} = ${OZ.nElementos}</span><span class="note">${OZ.nombre[0].toUpperCase() + OZ.nombre.slice(1)}: dos sustancias sin unirse, repartidas por igual. Lo mismo vale para el diamante y el grafito: los dos son carbono puro.</span></div></div>
      <p class="fuente">MA9 (elemento, compuesto y mezcla en dibujos de partículas): documentado sin porcentaje en lo que leímos (Stains y Talanquer, 2007). Que un elemento nunca forme moléculas, o que O₂ y O₃ sean compuestos, está en la tabla de hipótesis del informe.</p>` },
  { id:'atomo-de-azufre', corto:'Un solo átomo de azufre',
    q:`El azufre en polvo es amarillo, quebradizo y se funde a unos 113 °C. Imagina que, con una lupa imposible, tomas un solo átomo de ${F('S')}. ¿Cómo es ese átomo?`,
    opts:[['a', 'Amarillo, quebradizo y se funde a 113 °C, como el polvo', 'MA11-particula-con-propiedades-de-la-sustancia', 'documentado'],
          ['b', 'Amarillo, pero no se funde: un átomo solo no se derrite', 'MA11-color-en-el-atomo', 'hipotesis'],
          ['c', 'Sin color ni temperatura de fusión: eso es de muchos átomos juntos'],
          ['d', 'Del color del dibujo, añil: ese es el color real del átomo', 'color-del-dibujo', 'hipotesis']],
    ok:'c',
    fb:{ a:'Ser amarillo, quebrarse o fundirse a 113 °C son propiedades del conjunto: dependen de cómo se ordenan y se mueven muchísimas moléculas juntas. Un átomo solo tiene masa y su forma de combinarse. Entre 358 universitarios, cerca del 40 % antes del curso y del 46 % después eligió que un átomo tendría todas las propiedades de la sustancia (Salame y Casino, 2021).',
      b:'El color tampoco es del átomo: sale de cómo muchos átomos juntos devuelven la luz. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      d:'El añil es solo la clave del azufre en este dibujo, para distinguirlo de otros elementos. Un átomo solo no tiene color. Esta opción es una hipótesis nuestra, sin estudio que la mida.' },
    antes:() => ({ tipo:'azufre' }), despues:() => ({ tipo:'azufre', r:true }),
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">Un átomo de ${F('S')} tiene: ${AZU.tiene.join(', ')} (y su forma de combinarse). No tiene: ${AZU.noTiene.join(', ')}.</span><span class="note">Por eso un cambio de estado no cambia las partículas: fundir el azufre cambia cómo están juntas las moléculas, no las moléculas.</span></div></div>
      <p class="fuente">MA11 (AT1 del informe de átomo y enlace): Salame y Casino (2021), ítem 22 del Chemical Concepts Inventory, 358 universitarios de química general.</p>` },
  { id:'juliaca', corto:'El agua que hierve en Juliaca',
    q:`En Juliaca, a 3825 m, una olla con 500 g de agua ya hierve, y el termómetro marca ${VT('87 °C')}. La cocina le sigue dando calor 5 minutos más. ¿Qué marca el termómetro al final?`,
    opts:[['a', `${VT('100 °C')}: el agua hierve siempre a 100 °C`, 'MA7-siempre-100', 'documentado'],
          ['b', `${VT('87 °C')}: mientras hierve, el calor se usa en volver vapor el agua`],
          ['c', `${VT(fmt(JUL.errores.sigueSubiendo, 0) + ' °C')}: sigue subiendo mientras haya fuego`, 'MA7-sigue-subiendo', 'documentado'],
          ['d', `Menos de ${VT('87 °C')}: el vapor se lleva el calor y el agua se enfría`, 'vapor-enfria', 'hipotesis']],
    ok:'b',
    fb:{ a:'A 3825 m la presión del aire es menor y el agua hierve antes, a unos 87 °C. Y una vez que hierve, no sube más. Con 858 universitarios de Sídney, entre un tercio y algo más de 4 de cada 10, según el grupo, dijo que el agua hierve siempre a la misma temperatura (Georgiou y Sharma, 2010).',
      c:`Salió de sumar todo el calor como si calentara: 87 + 10 000/500 = ${fmt(JUL.errores.sigueSubiendo, 0)}. Pero mientras hierve, ese calor separa moléculas y forma vapor. Con 858 universitarios de Sídney, entre el 19 % y el 25 %, según el grupo, creyó que el agua sigue calentándose mientras hierve; y entre el 30 % y el 48 %, que agregar calor siempre sube la temperatura (Georgiou y Sharma, 2010).`,
      d:'El vapor sí se lleva energía, pero la cocina la repone: el agua se queda en 87 °C mientras haya líquido. Esta opción es una hipótesis nuestra, sin estudio que la mida.' },
    antes:() => ({ tipo:'juliaca' }), despues:p => ({ tipo:'juliaca', r:true, p }), anima:true,
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">Calor: 2000 cal/min × 5 min = ${fmt(JUL.Q, 0)} cal → se vuelven vapor ${fmt(JUL.Q, 0)} ÷ 540 ≈ ${fmt(JUL.vapor, 1)} g de agua</span><span class="note">La temperatura se queda en ${VT('87 °C')}: es la meseta de la ebullición. La escena del calor y los cambios de fase está en <a href="../calorimetria/">calorimetría</a>.</span></div></div>
      <p class="fuente">MA6 y MA7: Georgiou y Sharma (2010), 858 universitarios de primer año en Sídney, preguntas 6 y 8. «Sigue subiendo mientras hierve»: entre 2 y 2,5 de cada 10, según el grupo.</p>` },
  { id:'defecto-de-masa', corto:'La balanza de un reactor',
    q:`En un reactor nuclear se liberan ${VE('1,8 × 10¹⁴ J')}, que salen como calor y radiación. Si pesaras el combustible antes y todo lo que queda después, ya frío, ¿cuánto menos marcaría la balanza?`,
    opts:[['a', `${Vm('0 g')}`, 'nuclear-conserva-masa', 'hipotesis'],
          ['b', `${Vm(fmt(NUC.errores.kgComoGramos, 3) + ' g')}`, 'emc2-kg-como-gramos', 'hipotesis'],
          ['c', `${Vm(fmt(NUC.baja, 0) + ' g')}`],
          ['d', `${Vm(cien(NUC.errores.cEnKmPorS) + ' g')}`, 'emc2-c-en-km-s', 'hipotesis']],
    ok:'c',
    fb:{ a:'En una reacción nuclear la masa sí baja de forma que se puede medir: es el defecto de masa. Lo que se conserva es la energía total. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      b:'Salió de calcular 1,8 × 10¹⁴ ÷ 9 × 10¹⁶ = 0,002 y leerlo como gramos: la fórmula da kilogramos. 0,002 kg = 2 g. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      d:'Salió de usar c = 3 × 10⁵ (km/s): al cuadrado, el resultado sale un millón de veces más grande. Esta opción es una hipótesis nuestra, sin estudio que la mida.' },
    antes:() => ({ tipo:'nuclear' }), despues:p => ({ tipo:'nuclear', r:true, p }), anima:true,
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">${Vm('Δm')} = ${VE('E')} ÷ ${Vc('c')}² = 1,8 × 10¹⁴ ÷ (${Vc('3 × 10⁸')})² = ${Vm('2 × 10⁻³ kg')} = ${Vm(fmt(NUC.baja, 0) + ' g')}</span></div>
      <div class="eq"><span class="ex">Química: arder 1 mol de metano libera unos 890 000 J → ${Vm('Δm')} ≈ ${cien(MET.g)} g</span><span class="note">También baja, pero menos de una cienmillonésima de gramo: ninguna balanza lo nota. Por eso en química decimos que la masa se conserva.</span></div></div>
      <p>En el nuclear, además, cambian los elementos: el uranio-235 se parte en bario y kriptón. En una reacción química, los elementos nunca cambian.</p>
      <p class="fuente">No encontramos estudios con porcentaje sobre masa y energía. La idea de que «una parte de la masa se convierte en energía» es muy común y la repiten los libros de divulgación (Taber, por la descripción de un buscador; Riggs, 2023, por su resumen). Los errores de cálculo son hipótesis nuestras.</p>` },
];
const S = { k:0, pred:{}, t0:Date.now() };
// Regla de Gerson: un experimento se abre solo si todos los anteriores ya tienen respuesta. Los respondidos se revisitan.
const abierto = k => EXPS.slice(0, k).every(x => S.pred[x.id]);
function botones(){
  $('exps').innerHTML = EXPS.map((x, k) => abierto(k)
    ? `<button type="button" aria-pressed="${k === S.k}" data-k="${k}">${k+1}. ${x.corto}</button>`
    : `<button type="button" aria-pressed="false" data-k="${k}" disabled aria-disabled="true" aria-label="Experimento ${k+1}, bloqueado">${k+1}. ${x.corto}</button>`).join('');
  $('exps').querySelectorAll('button').forEach(b => b.onclick = () => ir(+b.dataset.k));
}
function despues(x, vista){
  cortar(E);
  const v = vista || x.despues;
  if (x.anima){ E.vista = v(0); E.dibujar(); animar(E, 1.6, f => { E.vista = v(f); }, () => { E.vista = v(1); E.describir(); }, 0.3); }
  else E.vista = v();
  E.dibujar(); pedir();
}
function ir(k){
  if (!abierto(k)) return;
  S.k = k; S.t0 = Date.now();
  const x = EXPS[k];
  cortar(E); E.vista = x.antes();
  botones();
  $('k2').textContent = `¿Qué pasa si…? · ${k+1} de ${EXPS.length}`;
  $('t2').textContent = x.corto;
  $('body2').innerHTML = `<p>${x.q}</p>${opcionesHTML(x.opts, 'fb2')}<div id="res2" class="body"></div>`;
  const btns = [...$('body2').querySelectorAll('.opt')];
  const explicar = () => {
    if (S.k !== k || !S.pred[x.id]) return;
    $('res2').innerHTML = x.exp() + `<div class="nav">${x.anima ? otraVez : '<span></span>'}${k < EXPS.length - 1 ? `<button type="button" class="btn primary" id="sig2">Siguiente: ${EXPS[k+1].corto}</button>` : ''}</div>`;
    const sig = $('sig2'); if (sig) sig.onclick = () => { ir(k + 1); document.querySelector('#m2').scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); };
    const rep = $('res2').querySelector('[data-repetir]'); if (rep) rep.onclick = () => { despues(x); E.describir(); };
    const ce = $('xCerrado'); if (ce) ce.onclick = () => { despues(x, p => ({ tipo:'lana', r:true, p, cerrado:true })); E.describir(); if (innerWidth < 900) $('cv2').scrollIntoView({ block:'start', behavior: RM ? 'auto' : 'smooth' }); };
  };
  const pintar = () => {
    const p = S.pred[x.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === x.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb2');
    fb.textContent = p === x.ok ? '¡Bien pensado! Mira el dibujo para ver por qué.' : `Elegiste la ${LETRAS.indexOf(p) + 1}. ${x.fb[p]} La correcta está marcada.`;
    fb.className = 'fb ' + (p === x.ok ? 'ok' : 'mal');
    explicar();
  };
  btns.forEach(b => b.onclick = () => {
    if (S.pred[x.id]) return;
    const o = x.opts.find(q => q[0] === b.dataset.k);
    S.pred[x.id] = o[0]; pintar(); botones(); E.compactar(false);
    registrarPrediccion('que-pasa-si-' + x.id, o[0], o[0] === x.ok, o[2] || '', o[3] || '', S.t0);
    Celular.alResponder($('cv2'), () => { despues(x); E.describir(); }, () => S.k === k);
  });
  if (S.pred[x.id]) E.vista = x.anima ? x.despues(1) : x.despues();
  E.compactar(!S.pred[x.id]);
  pintar(); E.dibujar(); pedir(); E.describir();
}
alRedibujarTema(() => E.dibujar());
addEventListener('modo', () => { E.resize(); E.dibujar(); pedir(); });
ir(0);
})();
</script>

<script>
/* ================= Pestañas ================= */
(function(){
  const modos = [['#paso-a-paso', 'm1', 'tab1'], ['#que-pasa-si', 'm2', 'tab2']];
  function route(){
    const k = Math.max(0, modos.findIndex(m => m[0] === location.hash));
    modos.forEach(([, m, t], j) => {
      document.getElementById(m).hidden = j !== k;
      const a = document.getElementById(t);
      if (j === k) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    dispatchEvent(new Event('modo'));
  }
  addEventListener('hashchange', route); route();
})();
</script>
