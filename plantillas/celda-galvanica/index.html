/* Cáscara acogedora (crema, tarjetas cálidas, esquinas redondas; docs/diseno.md), copiada del molde de soluciones.
   Dentro del dibujo y de las ecuaciones solo mandan los colores de las variables y de las especies (regla 4):
     --c-e   electrones, carga Q y moles de e⁻   dorado    #8f5f00 / #ffd54a
     --c-E   potencial y fem (voltímetro)        magenta   #b3246b / #ff86bd (el mismo voltaje de circuitos-cc)
     --c-an  aniones (NO₃⁻)                      verde     #4f7a17 / #a3d65e
     --c-I   corriente (Faraday)                 azul      #1f5fbf / #7cb0ff (el de circuitos-cc)
     --c-t   tiempo (Faraday)                    oliva     #474515 / #f1f0d0
   Los metales y el K⁺ del puente llevan la paleta común de química (nucleo/elementos.js, bloque generado más abajo):
     --el-Zn zinc y Zn²⁺ gris · --el-Fe hierro y Fe²⁺ azul · --el-Cu cobre y Cu²⁺ cobre · --el-Ag plata y Ag⁺
     turquesa · --el-K catión del puente (K⁺) violeta. En el código el K⁺ sigue llamándose «cat».
   La masa depositada va en el color de su metal. Diferencia CIEDE2000 mínima entre colores que aparecen en el
   mismo dibujo (nucleo/elementos-escenas.test.js): 20,2 en claro (Fe–K⁺) y 20,1 en oscuro (K⁺–E°). Quedan cerca
   pares que nunca se ven juntos (I solo sale en Faraday, sin Fe ni K⁺): Fe–I y Ag con el H de la paleta.
   Electrólisis con agua y con sal («¿Qué pasa si…?» 6 y 7, 7 nov 2026): --el-H el H₂, --el-O el O₂, --el-Na el Na⁺
   y el sodio metálico, --el-Cl el Cl⁻ y el Cl₂; el SO₄²⁻ va con --c-an (anión). Ahí no salen --c-E (cerca del O y
   del Na), --c-I, --c-t, --el-Ag (casi igual al H) ni el NO₃⁻; el Cl⁻ es el único anión de la salmuera, así que
   coincidir con --c-an no confunde. Mínimos: H–Na 20,7 y Na–tinta 22,0.
   Todos pasan el contraste AA sobre el papel, la tarjeta y el chip al 8 %. */

body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--font); -webkit-text-size-adjust:100%}
.wrap{max-width:1240px; margin:0 auto; padding-block:18px 48px;

<script>
// Registro anónimo de predicciones (nucleo/medicion.js). Solo guarda si el alumno entró por la app.
const PLANTILLA = { id: 'celda-galvanica', unidad: 'quimica.electroquimica', version: '0.1.0' };
function registrarPrediccion(problema, opcion, correcta, error, respaldo, t0){
  if (!window.Medicion) return;
  Medicion.guardar({ tipo: 'prediccion', modulo: PLANTILLA.id, unidad: PLANTILLA.unidad, problema, opcion, correcta,
    error: correcta ? '' : error, respaldo: correcta ? '' : respaldo, ms: t0 ? Date.now() - t0 : '' }, PLANTILLA.version);
}

/* ================= Piezas compartidas =================
   Toda la química (quién es ánodo, E°, la reacción, cuántas partículas se mueven y cuándo, Faraday) sale de
   MotorCelda (motor.js); aquí solo se pinta y se anima. */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = Celular.variable; // guardada hasta que cambie el tema o el tamaño (nucleo/celular.js)
// Coma decimal, espacio de miles (desde 5 cifras) y signo menos tipográfico.
function fmt(n, d){
  if (!Number.isFinite(n)) return '—';
  const p = Math.pow(10, d === undefined ? 2 : d), r = Math.round(n*p)/p + 0;
  let [e, f] = String(Math.abs(r)).split('.');
  if (e.length >= 5) e = e.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  if (d !== undefined && d > 0) f = (f || '').padEnd(d, '0');
  return (r < 0 ? '−' : '') + e + (f ? ',' + f : '');
}
const fV = x => `${fmt(x, 2)} V`;
// lo que marca el voltímetro: la fem, 0 V sin puente, o "—" si un alambre reemplaza al puente (ya no es esta pila)
const lecturaV = v => v === null ? '— V' : v === 0 ? '0 V' : fV(v);
const V = (k, t) => `<span class="v v-${k}" data-var="${k}" tabindex="0">${t}</span>`;
const fr = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const MC = MotorCelda;
// En el celular, tras responder, llevar la vista al dibujo: el texto pide mirarlo y queda arriba, fuera de la pantalla.
const esperar = (ms, fn) => setTimeout(fn, RM ? 0 : ms);
// Metales con color propio en la escena; los demás de la tabla solo aparecen en texto.
const METALES = ['Zn', 'Fe', 'Cu', 'Ag'];
const NOMBRE = { Zn:'zinc', Fe:'hierro', Cu:'cobre', Ag:'plata', Mg:'magnesio', Al:'aluminio', H2:'hidrógeno' };
const SAL = { Zn:'Zn(NO₃)₂', Fe:'Fe(NO₃)₂', Cu:'Cu(NO₃)₂', Ag:'AgNO₃' };
const Mx = (id, t) => V(id, t === undefined ? MC.par(id).red : t);   // un metal o su ion, en su color

function crearLienzo(cv, alto, dibujar){
  const ctx = cv.getContext('2d');
  const L = { cv, ctx, W:0, H:0 };

      flechita(ctx, m1, l.yW, sg, 0, c.e, 7); flechita(ctx, m2, l.yW, sg, 0, c.e, 7);

  /* ---------- Faraday: celdas en serie ---------- */
  function iniciarFaraday(){
    const esp = E.cfg.especies || ['Cu'], rnd = MC.azar(E.cfg.semilla*31 + 7);
    E.far = { esp, rnd, meta:E.cfg.meta || 8, emitidos:0, reloj:0, dots:[], llegados:esp.map(() => 0), salidos:esp.map(() => 0), corriendo:!!E.cfg.corriendo,
      iones: esp.map(m => { const p = MC.par(m), out = []; for (let i = 0; i < 4; i++){ out.push({ tipo:'ion', id:m, q:p.q, u:.34 + .32*rnd(), v:0.2 + 0.7*rnd(), a:rnd()*6.3 }); for (let j = 0; j < p.q; j++) out.push({ tipo:'an', u:.34 + .32*rnd(), v:0.2 + 0.7*rnd(), a:rnd()*6.3 }); } return out; }) };
  }
  E.correr = fin => { E.far.corriendo = true; E.far.alTerminar = fin; };
  function pasoFaraday(dt){
    const f = E.far; if (!f) return;
    for (const lista of f.iones) for (const p of lista){
      p.a += (f.rnd() - .5)*dt*5; p.u += Math.cos(p.a)*0.08*dt; p.v += Math.sin(p.a)*0.08*dt;
      if (p.u < .34 || p.u > .66){ p.u = clamp(p.u, .34, .66); p.a = Math.PI - p.a; }
      if (p.v < .1 || p.v > .94){ p.v = clamp(p.v, .1, .94); p.a = -p.a; }
    }
    if (!f.corriendo) return;
    f.reloj += dt;
    // la misma corriente en todo el circuito: sale un electrón por cada tramo a la vez
    if (f.emitidos < f.meta && f.reloj > 0.5){ f.reloj = 0; f.emitidos++; for (let s = 0; s < f.esp.length; s++){ f.dots.push({ tramo:s, s:0 }); f.salidos[s]++; } }
    for (const d of f.dots) d.s += dt*0.55;
    for (const d of f.dots.filter(d => d.s >= 1)) f.llegados[d.tramo]++;
    f.dots = f.dots.filter(d => d.s < 1);
    if (f.emitidos >= f.meta && !f.dots.length && f.corriendo){ f.corriendo = false; const cb = f.alTerminar; f.alTerminar = null; if (cb) cb(); }
  }
  function layoutFar(W, H){
    const n = E.far.esp.length, ancho = W >= 560;
    const bw = n === 1 ? Math.min(W*0.5, 260) : Math.min(W*0.42, 250);
    const cxs = n === 1 ? [W/2] : [10 + bw/2 + 4, W - 10 - bw/2 - 4];
    const yW = 48, yT = Math.round(H*0.36), yL = yT + 14, yB = H - 88, yE = yT - 40, yM = yT - 20;
    return { n, bw, cxs, yW, yT, yL, yB, yE, yM, ancho };
  }
  // tramos de alambre: el electrón sale del ánodo de una celda y llega al cátodo de la siguiente (o de la fuente)
  function tramosFar(l, W){
    const n = l.n, el = l.cxs.map(cx => ({ a: cx - l.bw*0.24, c: cx + l.bw*0.24 }));
    const xf = W/2, bx0 = xf - 30, bx1 = xf + 30;
    if (n === 1) return [ { de:'fuente', a:0, pts:[[bx1, l.yW], [el[0].c, l.yW], [el[0].c, l.yE]] },
                         { de:0, a:'fuente', pts:[[el[0].a, l.yE], [el[0].a, l.yW], [bx0, l.yW]] } ];
    // fuente(−) → cátodo de la celda 2; ánodo 2 → cátodo 1; ánodo 1 → fuente(+)
    return [ { de:'fuente', a:1, pts:[[bx1, l.yW], [el[1].c, l.yW], [el[1].c, l.yE]] },
             { de:1, a:0, pts:[[el[1].a, l.yE], [el[1].a, l.yM], [el[0].c, l.yM], [el[0].c, l.yE]] },
             { de:0, a:'fuente', pts:[[el[0].a, l.yE], [el[0].a, l.yW], [bx0, l.yW]] } ];
  }
  function dibujarFaraday(ctx, c, W, H){
    const f = E.far, l = layoutFar(W, H), tr = tramosFar(l, W), R = l.ancho ? 7 : 6;
    for (const t of tr){ ctx.save(); ctx.lineJoin = 'round'; trazo(ctx, t.pts); ctx.strokeStyle = c.cable; ctx.lineWidth = 3.4; ctx.stroke(); ctx.restore(); }
    // fuente
    const xf = W/2;
    ctx.save(); rr(ctx, xf - 30, l.yW - 17, 60, 34, 9); ctx.fillStyle = c.card; ctx.fill(); ctx.strokeStyle = c.cable; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 2.5; linea(ctx, xf - 6, l.yW - 11, xf - 6, l.yW + 11); ctx.lineWidth = 4; linea(ctx, xf + 6, l.yW - 6, xf + 6, l.yW + 6); ctx.restore();
    ctx.font = `800 13px ${c.font}`; ctx.fillStyle = c.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('+', xf - 19, l.yW); ctx.fillText('−', xf + 19, l.yW);

      const cx = l.cxs[k], x0 = cx - l.bw/2, x1 = cx + l.bw/2, col = colorDe(c, m), p = MC.par(m);

      ctx.save(); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(x0, l.yT); ctx.lineTo(x0, l.yB - 6); ctx.quadraticCurveTo(x0, l.yB, x0 + 6, l.yB);
      ctx.lineTo(x1 - 6, l.yB); ctx.quadraticCurveTo(x1, l.yB, x1, l.yB - 6); ctx.lineTo(x1, l.yT); ctx.stroke(); ctx.restore();
      const dep = MC.deposito(m, f.llegados[k]).depositados, dis = MC.deposito(m, f.salidos[k]).depositados;
      const xa = cx - l.bw*0.24, xc = cx + l.bw*0.24, yBot = l.yL + 0.8*(l.yB - l.yL), w0 = l.ancho ? 16 : 13;

      ctx.save(); ctx.fillStyle = col; rr(ctx, xa - wa/2, l.yE, wa, yBot - l.yE, 3); ctx.fill(); rr(ctx, xc - w0/2, l.yE, w0, yBot - l.yE, 3); ctx.fill(); ctx.restore();
      // átomos depositados en la cara interna del cátodo: se cuentan
      const ra = l.ancho ? 5 : 4.4;
      for (let i = 0; i < dep; i++){ const y = yBot - 8 - i*(2*ra + 2); ctx.beginPath(); ctx.arc(xc - w0/2 - ra - 1, y, ra, 0, Math.PI*2); ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = c.card; ctx.lineWidth = 1; ctx.stroke(); }
      // iones en la disolución
      for (const q of f.iones[k]){
        const x = x0 + 8 + q.u*(l.bw - 16), y = l.yL + q.v*(l.yB - l.yL - 6);
        ctx.beginPath(); ctx.arc(x, y, q.tipo === 'ion' ? R : R*0.82, 0, Math.PI*2); ctx.fillStyle = q.tipo === 'ion' ? col : c.an; ctx.fill();
        ctx.fillStyle = c.card; ctx.font = `800 ${Math.round(R*1.1)}px ${c.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(q.tipo === 'ion' ? (q.q === 1 ? '+' : q.q + '+') : '−', x, y + .5);
      }
      rotulo(ctx, c, xa, yBot + 12, 'ánodo', c.muted, 'center', 800, 10.5);
      rotulo(ctx, c, xc, yBot + 12, 'cátodo', c.muted, 'center', 800, 10.5);
      rotulo(ctx, c, cx, l.yB + 54, `${p.ox} + ${p.n === 1 ? '' : p.n + ' '}e⁻ → ${p.red}`, c.ink, 'center', 700, l.ancho ? 12 : 10.5, c.mono);
      rotulo(ctx, c, cx, l.yB - 10, `${SAL[m]} 1 M`, c.muted, 'center', 700, 10);
      rotuloColor(ctx, c, cx, l.yB + 16, [['e⁻ que llegaron: ', c.ink], [String(f.llegados[k]), c.e]], 'center', 800, 12);
      rotuloColor(ctx, c, cx, l.yB + 34, [[`átomos de ${p.red}: `, c.ink], [String(dep), col]], 'center', 800, 12);
    });
    // electrones en los tramos
    const re = l.ancho ? 4.2 : 3.8;
    for (const d of f.dots){ const q = sobre(tr[d.tramo].pts, d.s); electron(ctx, c, q.x, q.y, re); }
    if (!f.corriendo && !f.emitidos) rotulo(ctx, c, W/2, l.yW + 34, E.cfg.aviso || 'Responde para hacer pasar la corriente', c.muted, 'center', 800, 11.5);
  }

  /* ---------- Electrólisis con agua y con sal: tubos invertidos que se llenan ----------
     Cada celda tiene su fuente: el polo − va al electrodo de la izquierda (cátodo) y el + al de la derecha (ánodo).
     Los electrones salen del ánodo y entran al cátodo, siempre por el cable; en el líquido solo se mueven iones.
     Cuántas moléculas (o átomos) se forman con los electrones que pasaron lo dice MC.productos. */
  // Iones del dibujo. Con 12 electrones se gastan 12 Cl⁻ (6 Cl₂) y, en la sal fundida, 12 Na⁺; por eso hay 13 de cada uno.
  const IONES = { 'agua-sulfato':[['Na', 1, 6], ['an', -2, 3]], 'nacl-acuoso':[['Na', 1, 13], ['Cl', -1, 13]], 'nacl-fundido':[['Na', 1, 13], ['Cl', -1, 13]] };
  // u de cada electrodo dentro del recipiente (el dibujo pone el cátodo a la izquierda y el ánodo a la derecha)
  const U_CAT = 0.25, U_AN = 0.75;
  // quita de la celda k los n iones 'que' más cercanos al electrodo (se gastan al formar el producto)
  function gastar(g, k, que, n, uE){
    for (let i = 0; i < n; i++){
      let mejor = -1, d0 = Infinity;
      g.iones[k].forEach((p, j) => { if (p.que !== que) return; const d = Math.hypot(p.u - uE, (p.v - .5)*0.6); if (d < d0){ d0 = d; mejor = j; } });
      if (mejor >= 0) g.iones[k].splice(mejor, 1);
    }
  }
  function iniciarGases(){
    const sis = E.cfg.sistemas || ['agua-sulfato'], rnd = MC.azar(E.cfg.semilla*17 + 3);
    E.gas = { sis, rnd, meta:E.cfg.meta || 24, corriendo:false, emitidos:0, reloj:0, dots:[], burbujas:[],
      llegados:sis.map(() => 0), salidos:sis.map(() => 0), nivel:sis.map(() => ({ catodo:0, anodo:0 })),
      iones:sis.map(id => { const out = []; for (const [que, q, n] of IONES[id] || []) for (let i = 0; i < n; i++) out.push({ que, q, u:rnd(), v:rnd(), a:rnd()*6.3 }); return out; }) };
  }
  // correr: pasa la corriente; terminar: el estado final, al volver a un experimento ya respondido.
  E.correrGases = () => { if (E.gas) E.gas.corriendo = true; };
  E.terminarGases = () => {
    const g = E.gas; if (!g) return;
    g.corriendo = false; g.emitidos = g.meta; g.dots = []; g.burbujas = [];
    g.sis.forEach((id, k) => {
      g.llegados[k] = g.salidos[k] = g.meta; const r = MC.productos(id, g.meta); g.nivel[k] = { catodo:r.catodo.unidades, anodo:r.anodo.unidades };
      if (id !== 'agua-sulfato') gastar(g, k, 'Cl', 2*r.anodo.unidades, U_AN);
      if (id === 'nacl-fundido') gastar(g, k, 'Na', r.catodo.unidades, U_CAT);
      if (id === 'nacl-acuoso') for (let i = 0; i < g.meta; i++) g.iones[k].push({ que:'OH', q:-1, u:U_CAT + (g.rnd() - .5)*0.3, v:g.rnd(), a:g.rnd()*6.3 });
    });
  };
  function pasoGases(dt){
    const g = E.gas; if (!g) return;
    for (const lista of g.iones) for (const p of lista){
      p.a += (g.rnd() - .5)*dt*5; p.u += Math.cos(p.a)*0.07*dt; p.v += Math.sin(p.a)*0.07*dt;
      // con corriente, los cationes derivan hacia el cátodo (−) y los aniones hacia el ánodo (+)
      if (g.corriendo){ const meta = p.q > 0 ? U_CAT : U_AN; if (Math.abs(p.u - meta) > 0.06) p.u += Math.sign(meta - p.u)*0.06*dt; }
      if (p.u < 0 || p.u > 1){ p.u = clamp(p.u, 0, 1); p.a = Math.PI - p.a; }
      if (p.v < 0 || p.v > 1){ p.v = clamp(p.v, 0, 1); p.a = -p.a; }
    }
    // las burbujas (o gotitas de sodio) suben y, al llegar, el tubo marca una unidad más
    for (const b of g.burbujas) b.s += dt*1.1;
    for (const b of g.burbujas.filter(b => b.s >= 1)) g.nivel[b.k][b.lado]++;
    g.burbujas = g.burbujas.filter(b => b.s < 1);
    if (!g.corriendo) return;
    g.reloj += dt;
    // la misma corriente en todo el circuito: sale un electrón del ánodo y entra otro al cátodo a la vez
    if (g.emitidos < g.meta && g.reloj > 0.32){
      g.reloj = 0; g.emitidos++;
      g.sis.forEach((id, k) => {
        g.dots.push({ k, tramo:'anodo', s:0 }, { k, tramo:'catodo', s:0 });
        const antes = MC.productos(id, g.salidos[k]).anodo.unidades; g.salidos[k]++;
        if (MC.productos(id, g.salidos[k]).anodo.unidades > antes){
          g.burbujas.push({ k, lado:'anodo', s:0, w:g.rnd() - .5 });
          if (id !== 'agua-sulfato') gastar(g, k, 'Cl', 2, U_AN);   // 2 Cl⁻ → Cl₂ + 2 e⁻
        }
      });
    }
    for (const d of g.dots) d.s += dt*0.9;
    for (const d of g.dots.filter(d => d.s >= 1 && d.tramo === 'catodo')){
      const id = g.sis[d.k], antes = MC.productos(id, g.llegados[d.k]).catodo.unidades; g.llegados[d.k]++;
      // en la salmuera, por cada electrón que entra al cátodo aparece un OH⁻ junto a él (2 H₂O + 2 e⁻ → H₂ + 2 OH⁻)
      if (id === 'nacl-acuoso') g.iones[d.k].push({ que:'OH', q:-1, u:U_CAT + (g.rnd() - .5)*0.12, v:0.25 + 0.5*g.rnd(), a:g.rnd()*6.3 });
      if (MC.productos(id, g.llegados[d.k]).catodo.unidades > antes){
        g.burbujas.push({ k:d.k, lado:'catodo', s:0, w:g.rnd() - .5 });
        if (id === 'nacl-fundido') gastar(g, d.k, 'Na', 1, U_CAT);   // Na⁺ + e⁻ → Na
      }
    }
    g.dots = g.dots.filter(d => d.s < 1);
    if (g.emitidos >= g.meta && !g.dots.length) g.corriendo = false;
  }
  function layoutGases(W, H){
    const n = E.gas.sis.length, ancho = W >= 560, cw = W/n;
    const yW = n > 1 ? 40 : 26, yTubo = yW + 34, yL = Math.round(yTubo + (H - yTubo)*0.42), yB = H - 72, yC = yB + 14;
    const celdas = E.gas.sis.map((id, k) => {
      const cx = cw*(k + .5), bw = Math.min(cw - 26, 300), sep = Math.min(bw*0.26, 70), tw = Math.min(40, bw*0.2);
      return { id, cx, x0:cx - bw/2, x1:cx + bw/2, xc:cx - sep, xa:cx + sep, tw, xOutC:cx - bw/2 - 7, xOutA:cx + bw/2 + 7 };
    });
    const capacidad = 12, hu = (yL - 6 - yTubo - 8)/capacidad, yBoca = yB - 26, yPunta = yL + 8;
    return { n, ancho, cw, yW, yTubo, yL, yB, yC, yBoca, yPunta, hu, celdas };
  }
  // tramo del ánodo: de la punta del electrodo, bajando y por fuera, hasta el borne + de la fuente; el del cátodo, al revés
  function tramoGas(l, c, tramo){
    if (tramo === 'anodo') return [[c.xa, l.yPunta], [c.xa, l.yC], [c.xOutA, l.yC], [c.xOutA, l.yW], [c.cx + 24, l.yW]];
    return [[c.cx - 24, l.yW], [c.xOutC, l.yW], [c.xOutC, l.yC], [c.xc, l.yC], [c.xc, l.yPunta]];
  }
  function dibujarGases(ctx, c, W, H){
    const g = E.gas, l = layoutGases(W, H), R = l.ancho ? 6.5 : 5.2, chico = l.n > 1 && !l.ancho;
    l.celdas.forEach((ce, k) => {
      const S = MC.electrolizar(ce.id), fundido = ce.id === 'nacl-fundido';
      // cables
      for (const t of ['anodo', 'catodo']){ ctx.save(); ctx.lineJoin = 'round'; trazo(ctx, tramoGas(l, ce, t)); ctx.strokeStyle = c.cable; ctx.lineWidth = 3; ctx.stroke(); ctx.restore(); }
      // fuente: − a la izquierda (cátodo) y + a la derecha (ánodo)
      ctx.save(); rr(ctx, ce.cx - 24, l.yW - 15, 48, 30, 8); ctx.fillStyle = c.card; ctx.fill(); ctx.strokeStyle = c.cable; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
      ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 4; linea(ctx, ce.cx - 4, l.yW - 6, ce.cx - 4, l.yW + 6); ctx.lineWidth = 2.5; linea(ctx, ce.cx + 5, l.yW - 10, ce.cx + 5, l.yW + 10); ctx.restore();
      ctx.font = `800 13px ${c.font}`; ctx.fillStyle = c.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('−', ce.cx - 15, l.yW); ctx.fillText('+', ce.cx + 15, l.yW);
      if (l.n > 1) rotulo(ctx, c, ce.cx, 12, fundido ? (chico ? 'NaCl fundido' : 'NaCl fundido (sin agua)') : (chico ? 'salmuera' : 'salmuera (NaCl en agua)'), c.ink, 'center', 800, chico ? 11 : 12);
      // recipiente con el líquido
      ctx.save(); ctx.fillStyle = fundido ? c.fundido : c.liquido; ctx.fillRect(ce.x0 + 2, l.yL, ce.x1 - ce.x0 - 4, l.yB - l.yL); ctx.restore();
      ctx.save(); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(ce.x0, l.yL - 14); ctx.lineTo(ce.x0, l.yB - 6); ctx.quadraticCurveTo(ce.x0, l.yB, ce.x0 + 6, l.yB);
      ctx.lineTo(ce.x1 - 6, l.yB); ctx.quadraticCurveTo(ce.x1, l.yB, ce.x1, l.yB - 6); ctx.lineTo(ce.x1, l.yL - 14); ctx.stroke(); ctx.restore();
      // iones (debajo de los tubos)
      for (const p of g.iones[k]){
        const x = ce.x0 + 8 + p.u*(ce.x1 - ce.x0 - 16), y = l.yL + 8 + p.v*(l.yB - l.yL - 16);
        const oh = p.que === 'OH', col = p.que === 'an' ? c.an : oh ? c.paper : c[p.que], r = (p.q < 0 ? R*0.85 : R)*(E.hl === p.que ? 1.3 : 1);
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = col; ctx.fill();
        // OH⁻: sin color de elemento (es O y H a la vez), solo un aro de tinta
        if (oh){ ctx.strokeStyle = c.ink; ctx.lineWidth = 1.3; ctx.stroke(); }
        // Na⁺: un aro claro por dentro, para que no se confunda con la tinta ni con el cable
        if (p.que === 'Na'){ ctx.beginPath(); ctx.arc(x, y, r - 1.8, 0, Math.PI*2); ctx.strokeStyle = c.card; ctx.lineWidth = 1.1; ctx.stroke(); }
        ctx.fillStyle = oh ? c.ink : c.card; ctx.font = `800 ${Math.round(R*(p.que === 'Na' ? 1.45 : 1.05))}px ${c.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(p.q === 1 ? '+' : p.q === -1 ? '−' : '2−', x, y + .5);
      }
      // electrodos (varillas que entran por abajo)
      for (const lado of ['catodo', 'anodo']){
        const x = lado === 'catodo' ? ce.xc : ce.xa;
        ctx.save(); ctx.fillStyle = c.cable; rr(ctx, x - 3, l.yPunta, 6, l.yC - l.yPunta, 2); ctx.fill(); ctx.restore();
      }
      // tubos invertidos: llenos de líquido; el gas los vacía desde arriba
      for (const lado of ['catodo', 'anodo']){
        const x = lado === 'catodo' ? ce.xc : ce.xa, P = S[lado], col = c[P.id], n = g.nivel[k][lado];
        const x0 = x - ce.tw/2, x1 = x + ce.tw/2, top = l.yTubo;
        ctx.save(); ctx.fillStyle = fundido ? c.fundido : c.liquido; ctx.fillRect(x0, top, ce.tw, l.yL - top); ctx.restore();
        if (P.gas && n > 0){
          const h = n*l.hu;
          ctx.save(); ctx.fillStyle = c.paper; ctx.fillRect(x0 + 1, top + 1, ce.tw - 2, h); ctx.globalAlpha = .28; ctx.fillStyle = col; ctx.fillRect(x0 + 1, top + 1, ce.tw - 2, h); ctx.restore();
          ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 2; linea(ctx, x0 + 1, top + 1 + h, x1 - 1, top + 1 + h); ctx.restore();
        } else if (!P.gas) for (let i = 0; i < n; i++){
          // gotitas de sodio: suben y se juntan arriba (el sodio fundido flota)
          const fila = Math.floor(i/3), col3 = i % 3, rr2 = Math.min(4.6, ce.tw/7);
          ctx.beginPath(); ctx.arc(x0 + ce.tw*(0.22 + 0.28*col3), top + 6 + rr2 + fila*(2*rr2 + 1.5), rr2, 0, Math.PI*2); ctx.fillStyle = col; ctx.fill();
        }
        // marcas de la escala, cada 2 unidades
        ctx.save(); ctx.strokeStyle = c.vidrio; ctx.globalAlpha = .7; ctx.lineWidth = 1;
        for (let m = 2; m <= 12; m += 2){ const y = top + 1 + m*l.hu; linea(ctx, x1 - 6, y, x1, y); }
        ctx.restore();
        ctx.save(); ctx.strokeStyle = E.hl === P.id && n ? c.ink : c.vidrio; ctx.lineWidth = E.hl === P.id && n ? 3 : 2.2; ctx.beginPath();
        ctx.moveTo(x0, l.yBoca); ctx.lineTo(x0, top + 6); ctx.quadraticCurveTo(x0, top, x0 + 6, top); ctx.lineTo(x1 - 6, top); ctx.quadraticCurveTo(x1, top, x1, top + 6); ctx.lineTo(x1, l.yBoca); ctx.stroke(); ctx.restore();
        // rótulo del producto, solo cuando ya hay algo en el tubo
        if (n > 0) rotulo(ctx, c, x, top - 9, P.producto, col, 'center', 800, 12);
      }
      // burbujas que suben desde la punta del electrodo
      for (const b of g.burbujas) if (b.k === k){
        const P = S[b.lado], x = (b.lado === 'catodo' ? ce.xc : ce.xa) + b.w*ce.tw*0.4, yFin = l.yTubo + 4 + (g.nivel[k][b.lado] + .5)*(P.gas ? l.hu : 0);
        const y = l.yPunta - (l.yPunta - yFin)*b.s;
        ctx.save(); ctx.beginPath(); ctx.arc(x, y, P.gas ? 3.6 : 3.2, 0, Math.PI*2);
        if (P.gas){ ctx.strokeStyle = c[P.id]; ctx.lineWidth = 1.8; ctx.stroke(); } else { ctx.fillStyle = c[P.id]; ctx.fill(); }
        ctx.restore();
      }
      // electrones en el cable
      const re = l.ancho ? 4 : 3.4;
      for (const d of g.dots) if (d.k === k){ const q = sobre(tramoGas(l, ce, d.tramo), d.s); electron(ctx, c, q.x, q.y, re); }
      // debajo: polos, y cuánto se juntó (solo después de responder)
      const ty = l.yC + 15, tam = chico ? 10 : 11.5;
      rotulo(ctx, c, ce.xc, ty, chico ? 'cátodo −' : 'cátodo (−)', c.ink, 'center', 800, tam);
      rotulo(ctx, c, ce.xa, ty, chico ? 'ánodo +' : 'ánodo (+)', c.ink, 'center', 800, tam);
      if (g.emitidos && !g.corriendo && !g.burbujas.length){
        // los contadores salen al terminar: a media corrida irían desfasados (las burbujas del ánodo y del cátodo no llegan juntas)
        const nC = g.nivel[k].catodo, nA = g.nivel[k].anodo;
        rotuloColor(ctx, c, ce.cx, ty + 17, [[S.catodo.producto + ': ', c.ink], [String(nC), c[S.catodo.id]], ['  ·  ', c.muted], [S.anodo.producto + ': ', c.ink], [String(nA), c[S.anodo.id]]], 'center', 800, tam);
      } else if (!g.emitidos && (l.n === 1 || k === 0)) rotulo(ctx, c, l.n > 1 ? W/2 : ce.cx, ty + 17, E.cfg.aviso || 'Responde para hacer pasar la corriente', c.muted, 'center', 800, tam);
    });
    if (g.emitidos) rotuloColor(ctx, c, W/2, l.yC + 49, [['e⁻ por cada cable: ', c.ink], [String(g.emitidos), c.e]], 'center', 800, chico ? 10.5 : 11.5);
  }

  function dibujar(now){
    if (!L.W) return;
    const c = colores(), { ctx, W, H } = L;
    ctx.clearRect(0, 0, W, H);
    if (E.tipo === 'pila' && E.est) dibujarPila(ctx, c, W, H, now);
    else if (E.tipo === 'faraday' && E.far) dibujarFaraday(ctx, c, W, H);
    else if (E.tipo === 'gases' && E.gas) dibujarGases(ctx, c, W, H);
    let d = '';
    if (E.tipo === 'pila' && E.est){
      const q = MC.cargas(E.est), k = E.cfg;
      d = `Pila de ${NOMBRE[k.izq]} (izquierda) y ${NOMBRE[k.der]} (derecha). ` + (k.roles ? `Ánodo: ${NOMBRE[E.celda.anodo]}; cátodo: ${NOMBRE[E.celda.catodo]}. ` : '')
        + (k.fuente ? `Fuente externa de ${fmt(E.celda.fuente, 1)} V. ` : `Voltímetro: ${k.ocultarV ? 'oculto' : lecturaV(MC.voltimetro(E.celda, { puente:k.puente }))}. `)
        + `Puente: ${k.puente === 'sal' ? 'salino' : k.puente === 'alambre' ? 'un alambre de cobre' : 'ninguno'}. `
        + `Átomos disueltos: ${E.est.disueltos}; depositados: ${E.est.depositados}. Carga de los vasos: ${q.vasoA} y ${q.vasoC}.`;
    } else if (E.tipo === 'gases' && E.gas){
      const g = E.gas, NOM = { 'agua-sulfato':'agua con Na₂SO₄', 'nacl-acuoso':'salmuera', 'nacl-fundido':'NaCl fundido' };
      d = g.sis.map((id, k) => {
        const S = MC.electrolizar(id);
        return `Celda de ${NOM[id]}: tubo del cátodo (−) a la izquierda, del ánodo (+) a la derecha. `
          + (g.emitidos ? `Pasaron ${g.emitidos} electrones por el cable; en el cátodo, ${g.nivel[k].catodo} de ${S.catodo.producto}; en el ánodo, ${g.nivel[k].anodo} de ${S.anodo.producto}.` : 'Aún no pasa corriente; los tubos están llenos de líquido.');
      }).join(' ');
    } else if (E.far) d = E.far.esp.map((m, k) => `Celda de ${NOMBRE[m]}: ${E.far.llegados[k]} electrones, ${MC.deposito(m, E.far.llegados[k]).depositados} átomos depositados`).join('. ');
    if (d !== E.desc && idDesc){ E.desc = d; document.getElementById(idDesc).textContent = d; }
  }
  E.dibujar = () => dibujar(performance.now());
  alRedibujarTema(E.dibujar);
  addEventListener('modo', () => L.resize());
  return E;
}
</script>
<script>
/* ================= MODO 1: paso a paso =================
   Problemas guiados de docs/investigacion/equilibrio-acidos-electroquimica-ideas-erroneas.md ("Celda galvánica con
   flujo de electrones e iones"): ¿por dónde van los electrones? y el puente cambiado por un alambre. Más la fem
   Cu–Ag y la masa depositada, con los errores de "Lo que no tiene respaldo" (hipótesis). */
(function(){
const $ = id => document.getElementById(id);
const E = crearEscena($('cv'), 'desc1', 'leyenda1');
const S = { step:0, max:0, pred:{}, listo:false, ocupado:false, hecho:{}, x:{ izq:'Zn', der:'Cu', puente:'sal', fuente:false } };
const DAN = MC.pila('Cu', 'Zn'), CUAG = MC.pila('Cu', 'Ag'), FAR = MC.faraday({ especie:'Cu', I:5, s:1930 });
const e = t => V('e', t), Ev = t => V('E', t), Zn = t => Mx('Zn', t), Cu = t => Mx('Cu', t), Ag = t => Mx('Ag', t), K = t => V('cat', t), N = t => V('an', t);
const Iv = t => V('I', t), tv = t => V('t', t);

function cfgDaniell(o){ E.config(Object.assign({ izq:'Cu', der:'Zn', puente:'sal', semilla:3 }, o)); }

const P1 = { id:'celda-paso2', ok:'a', anima:() => { E.cfg.roles = true; E.soltar(); }, opts:[
  ['a','Del Zn al Cu, por el alambre'],
  ['b','Del Cu al Zn, por el alambre','EC6-cable-al-reves','documentado'],
  ['c','Del Zn al Cu, por el puente salino','EC2-electrones-por-la-disolucion','documentado'],
  ['d','Del electrodo de la izquierda al de la derecha, sea cual sea','EC4-anodo-a-la-izquierda','documentado']],
  fb:{ a:'¡Bien! El zinc se oxida y suelta electrones; estos van por el alambre hasta el cobre, donde los toman los Cu²⁺.',
    b:'Elegiste la B. Los electrones salen del metal que se oxida, el zinc (el de menor potencial), y van al cobre. La correcta está marcada.',
    c:'Elegiste la C. Los electrones no pueden andar sueltos en el agua: solo van por los metales y el alambre. Por el puente pasan iones. La correcta está marcada.',
    d:'Elegiste la D. El lado del dibujo no decide nada: aquí el zinc está a la derecha y los electrones van de derecha a izquierda. La correcta está marcada.' } };
const P2 = { id:'celda-paso4', ok:'c', anima:() => E.cambiarPuente('alambre'), opts:[
  ['a','Sí, igual: los electrones pasan por el alambre igual que por el puente','EC1-puente-lleva-electrones','documentado'],
  ['b','Sí, igual: el metal conduce iones y electrones','EC1-metal-conduce-iones','documentado'],
  ['c','No: por el alambre no pueden pasar iones; sin iones entre los vasos, cada disolución se carga y la pila de zinc y cobre se detiene.'],
  ['d','Funciona mejor, porque ahora hay dos caminos para los electrones','EC1-dos-caminos','hipotesis']],
  fb:{ c:'¡Bien! El puente no lleva electrones: lleva iones que mantienen neutra cada disolución. Sin ellos, la pila de zinc y cobre se frena enseguida.',
    a:'Elegiste la A. Por el puente salino nunca pasaron electrones: pasaban iones. Un alambre no deja pasar iones, así que cada vaso se carga y la pila de zinc y cobre se detiene. La correcta está marcada.',
    b:'Elegiste la B. Un metal conduce electrones, pero no iones: los iones no pueden entrar al alambre. La correcta está marcada.',
    d:'Elegiste la D. El circuito de los electrones ya estaba cerrado por arriba; lo que se rompe es el camino de los iones. La correcta está marcada.' } };
const P3 = { id:'celda-paso5', ok:'c', anima:() => { E.cfg.ocultarV = false; E.soltar(); }, opts:[
  ['a','1,26 V: 2 · 0,80 − 0,34','fem-multiplica-coeficientes','hipotesis'],
  ['b','1,14 V: 0,80 + 0,34','fem-suma-sin-cambiar-signo','hipotesis'],
  ['c','0,46 V: 0,80 − 0,34'],
  ['d','−0,46 V: 0,34 − 0,80','fem-resta-al-reves','hipotesis']],
  fb:{ c:'¡Bien! El potencial no se multiplica por el 2 de la plata: depende de qué metales son, no de cuántos átomos escribes.',
    a:'Elegiste la A. El 2 de "2 Ag⁺" sirve para igualar electrones, no para el potencial: E° no depende de cuánta sustancia reacciona. La correcta está marcada.',
    b:'Elegiste la B. Los dos valores de la tabla son de reducción. Al cobre, que se oxida, se le resta: E°(cátodo) − E°(ánodo). La correcta está marcada.',
    d:'Elegiste la D. Restaste al revés: una pila que funciona tiene fem positiva. Es E°(cátodo) − E°(ánodo), y el cátodo es la plata. La correcta está marcada.' } };

const opciones = P => `<div class="opts">${P.opts.map(([k, t]) => `<button class="opt" type="button" data-k="${k}"><span class="l">${k.toUpperCase()}</span><span>${t}</span></button>`).join('')}</div><p class="fb" id="fb"></p>`;
const tabla = (ids, celda) => `<div class="tabla" role="table" aria-label="Potenciales estándar de reducción"><div class="fila cab" role="row"><span>semirreacción de reducción</span><span>E°</span><span></span></div>`
  + [...ids].sort((a, b) => MC.par(b).E - MC.par(a).E).map(id => {
    const p = MC.par(id), rol = celda ? (celda.anodo === id ? 'ánodo' : celda.catodo === id ? 'cátodo' : '') : '';
    return `<div class="fila${rol ? ' usa' : ''}" role="row" style="--k:var(--c-${id})"><span>${Mx(id, p.ox)} + ${p.n === 1 ? '' : p.n + ' '}e⁻ → ${Mx(id, p.red)}</span><span>${Ev(fV(p.E).replace(/^(\d)/, '+$1'))}</span><span class="rol">${rol}</span></div>`;
  }).join('') + `</div>`;

const steps = [
 { k:'Paso 1', t:'La pila de zinc y cobre', prep:() => cfgDaniell({ pausa:true, roles:false }),
   body:() => `<p class="problem">En un vaso hay una lámina de ${Zn('zinc')} en una disolución de ${Zn('Zn²⁺')} 1 M; en otro, una lámina de ${Cu('cobre')} en ${Cu('Cu²⁺')} 1 M. Las láminas se unen por arriba con un alambre y un voltímetro, y los vasos, con un tubo con una sal disuelta en gel (KNO₃): el puente salino. ¿Qué pasa por dentro?</p>
   <p>En el dibujo, cada punto representa muchísimas partículas: ${e('electrones')}, ${K('cationes K⁺')} y ${N('aniones NO₃⁻')} del puente, y los iones de cada metal. Las disoluciones son de nitratos (NO₃⁻), así que hay un solo tipo de anión. El agua no se dibuja.</p>
   ${tabla(['Zn', 'Cu'])}
   <p>El zinc tiene el potencial de reducción más bajo: es el que tiende a oxidarse, a perder electrones. El cobre, el más alto: sus iones tienden a ganarlos.</p>` },
 { k:'Paso 2', t:'Predice: ¿por dónde van los electrones?', gate:P1, prep:() => cfgDaniell({ pausa:!S.pred[P1.id], roles:!!S.pred[P1.id] }),
   body:() => `<p>Fíjate en el dibujo: el ${Cu('cobre')} quedó a la izquierda y el ${Zn('zinc')} a la derecha. Cuando la pila funciona, ¿por dónde y hacia dónde van los ${e('electrones')}?</p>${opciones(P1)}
   <div id="tras" class="body" hidden><div class="eqs">
     <div class="eq">${Zn('Zn')} → ${Zn('Zn²⁺')} + 2 ${e('e⁻')}<span class="note">oxidación: el zinc es el ánodo</span></div>
     <div class="eq">${Cu('Cu²⁺')} + 2 ${e('e⁻')} → ${Cu('Cu')}<span class="note">reducción: el cobre es el cátodo</span></div></div>
   <p>Mira el dibujo: los ${e('electrones')} solo andan por el alambre, del ${Zn('zinc')} al ${Cu('cobre')}. La lámina de zinc adelgaza: sus átomos pasan a la disolución como ${Zn('Zn²⁺')}. La de cobre engrosa: los ${Cu('Cu²⁺')} que llegan a ella toman dos electrones y se quedan pegados como átomos.</p>
   <p class="fuente">En Turquía, con 59 escolares de 11.º grado y enseñanza tradicional: el 5,08 % cree que en la pila los electrones van del cátodo al ánodo; el 3,39 %, que pasan por el electrolito y el puente salino; el 15,25 %, que el ánodo siempre está a la izquierda (Şen, Yılmaz y Geban, 2016, tabla 2). En la Facultad de Química de la UNAM, cerca de 170 de 306 respuestas (56 %) pusieron a los electrones viajando por la disolución en una celda electrolítica (Tagle Barrios, 2024, ítem 6, leído de sus gráficas).</p></div>` },
 { k:'Paso 3', t:'La fem y el trabajo del puente', prep:() => cfgDaniell({}),
   body:() => `<div class="eqs"><div class="eq">${Ev('E°')} = ${Ev('E°')}(cátodo) − ${Ev('E°')}(ánodo) = ${Ev('0,34')} − (${Ev('−0,76')}) = ${Ev('1,10 V')}</div>
     <div class="eq">${Zn('Zn')} + ${Cu('Cu²⁺')} → ${Zn('Zn²⁺')} + ${Cu('Cu')}<span class="note">2 electrones por cada átomo de zinc</span></div></div>
   <p>Cada vez que un átomo de ${Zn('zinc')} se disuelve, el vaso del zinc gana una carga +2; cada vez que un ${Cu('Cu²⁺')} se deposita, el vaso del cobre pierde una carga +2. El puente lo compensa: sus ${N('aniones NO₃⁻')} entran al vaso del zinc y sus ${K('cationes K⁺')} entran al del cobre. Mira el contador "carga del vaso": casi siempre está en 0.</p>
   <p>Los aniones van hacia el ánodo, que es el polo negativo. Suena raro, pero lo que los atrae es la carga positiva que aparece en la disolución alrededor del zinc.</p>
   <p class="aviso">Un voltímetro casi no deja pasar corriente: mide la fem sin gastar la pila. En el dibujo dejamos que los electrones avancen, como pasaría si en el alambre hubiera un foquito, para que se vea su camino. Con el foco conectado, el voltaje en los bornes sería un poco menor que 1,10 V.</p>
   <p class="fuente">En Turquía, el 25,42 % de 59 escolares cree que en la disolución la corriente la llevan solo los iones negativos (Şen y otros, 2016). Se mueven los dos, en sentidos opuestos.</p>` },
 { k:'Paso 4', t:'Predice: un alambre en lugar del puente', gate:P2, prep:() => cfgDaniell({ puente: S.pred[P2.id] ? 'alambre' : 'sal' }),
   body:() => `<p>Se saca el puente salino y en su lugar se pone un alambre de cobre, con una punta en cada vaso. ¿Sigue funcionando la pila de zinc y cobre como antes?</p>${opciones(P2)}
   <div id="tras" class="body" hidden>
   <p>Mira los contadores: en cuanto se disuelven dos puntos de ${Zn('zinc')}, el vaso del zinc queda con carga positiva y el del cobre con carga negativa. En una pila real, eso pasa con una cantidad tan pequeña que ninguna balanza la detecta. Esa carga frena la reacción y los ${e('electrones')} dejan de pasar.</p>
   <p class="aviso">En el laboratorio el ${Ev('voltímetro')} puede marcar algo, porque las puntas del alambre forman electrodos nuevos con otras reacciones; pero ya no es la pila de zinc y cobre, y el puente nunca llevó electrones.</p>
   <p class="fuente">En la Facultad de Química de la UNAM (306 respuestas de cinco grupos), cerca de 161 (unas 53 %) eligieron que habría electricidad "porque hay un flujo constante de electrones por el alambre"; por grupo, 47 %, 52 %, 55 %, 49 % y 69 %, y el más alto es un grupo de Electroquímica. Otro 21 % eligió que el metal conduce iones y electrones. Solo el 13 % dio la respuesta esperada (Tagle Barrios, 2024, ítem 5, tabla 19; cifras leídas de sus gráficas). El ítem usaba un alambre de platino, y la respuesta esperada de la tesis también tenía un error: decía que "ni iones ni electrones pueden fluir por el alambre de Pt", cuando los electrones sí pueden. La opción "funciona mejor" es una hipótesis nuestra.</p></div>` },
 { k:'Paso 5', t:'Predice: la fem de la pila de cobre y plata', gate:P3, prep:() => E.config({ izq:'Cu', der:'Ag', semilla:5, pausa:!S.pred[P3.id], ocultarV:!S.pred[P3.id] }),
   body:() => `<p>Ahora la pila es de ${Cu('cobre')} y ${Ag('plata')}. La reacción global es ${Cu('Cu')} + 2 ${Ag('Ag⁺')} → ${Cu('Cu²⁺')} + 2 ${Ag('Ag')}. ¿Cuánto marca el ${Ev('voltímetro')}?</p>
   ${tabla(['Cu', 'Ag'], CUAG)}${opciones(P3)}
   <div id="tras" class="body" hidden><div class="eqs">
     <div class="eq">${Cu('Cu')} → ${Cu('Cu²⁺')} + 2 ${e('e⁻')}</div>
     <div class="eq">2 × (${Ag('Ag⁺')} + ${e('e⁻')} → ${Ag('Ag')})<span class="note">se multiplica para igualar los electrones</span></div>
     <div class="eq">${Ev('E°')} = ${Ev('0,80')} − ${Ev('0,34')} = ${Ev(fV(CUAG.E))}<span class="note">el potencial no se multiplica</span></div></div>
   <p>En el dibujo, por cada átomo de ${Cu('cobre')} que se disuelve salen dos ${e('electrones')}, y en el cátodo se depositan dos puntos de ${Ag('plata')}. Lo que se multiplica es la cantidad que reacciona; la "fuerza" con que empuja cada electrón, la fem, sigue igual.</p>
   <p class="fuente">No encontramos estudios que midan estos errores de cálculo: las tres opciones incorrectas son hipótesis nuestras. Lo que sí se midió es otra cosa: la mayoría de 16 universitarios con ideas erróneas sobre la pila igual calculaba bien el potencial (Sanger y Greenbowe, 1997b, según el resumen). Saber la fórmula no garantiza entender la pila.</p></div>` },
 { k:'Paso 6', t:'¿Cuánto cobre se deposita?', accion:true, prep:() => E.config({ tipo:'faraday', especies:['Cu'], meta:8, semilla:2, aviso:'Pulsa el botón para hacer pasar la corriente', corriendo:false, leyenda:undefined }),
   body:() => `<p class="problem">Se hace pasar una corriente de ${Iv('5 A')} durante ${tv('1930 s')} por una celda con ${Cu('Cu²⁺')} y dos láminas de ${Cu('cobre')}. La del ánodo se disuelve y repone los ${Cu('Cu²⁺')} que se depositan en el cátodo. ¿Cuántos gramos de ${Cu('cobre')} se depositan en el cátodo?</p>
   <p>Ahora una fuente empuja los electrones: es una celda de electrólisis. En el dibujo, cada ${e('electrón')} representa 0,0125 mol de electrones; pasarán 8.</p>
   <div class="acciones"><button type="button" class="btn primary" id="correr">Hacer pasar la corriente</button></div>
   <div id="tras" class="body" ${S.hecho.correr ? '' : 'hidden'}><div class="eqs">
     <div class="eq">${e('Q')} = ${Iv('I')} · ${tv('t')} = ${Iv('5')} · ${tv('1930')} = ${e('9650 C')}</div>
     <div class="eq">${e('n(e⁻)')} = ${fr(e('9650 C'), '96 500 C/mol')} = ${e('0,1 mol')}<span class="note">8 puntos en el dibujo</span></div>
     <div class="eq">${Cu('Cu²⁺')} + 2 ${e('e⁻')} → ${Cu('Cu')} : ${fr(e('0,1'), '2')} = ${Cu('0,05 mol de Cu')}<span class="note">4 átomos en el dibujo</span></div>
     <div class="eq">${Cu('m')} = ${Cu('0,05')} · 63,5 = ${Cu(`${fmt(FAR.g, 3)} g`)}</div></div>
   <p class="answer">Se depositan ${Cu(`${fmt(FAR.g, 3)} g de cobre`)}.</p>
   <p class="aviso">Ojo: cada Cu²⁺ necesita dos electrones. Si no divides entre la carga del ion, te sale ${fmt(FAR.errores.sinCarga, 2)} g, el doble. Y el tiempo va en segundos: F está en culombios por mol, y 1 C = 1 A · s: la carga que pasa con un amperio durante un segundo.</p>
   <p class="fuente">No encontramos ningún estudio con porcentajes sobre la ley de Faraday: el error de olvidar la carga del ion es una hipótesis nuestra.</p></div>
   <p id="estado" class="hint"></p>` },
 { k:'Paso 7', t:'Lo que no cambia', fin:true, prep:() => cfgDaniell({}),
   body:() => `<div class="eqs">
     <div class="eq">Ánodo = oxidación · cátodo = reducción<span class="note">en la pila y en la electrólisis</span></div>
     <div class="eq">${e('e⁻')}: del ánodo al cátodo, solo por el alambre</div>
     <div class="eq">${N('aniones')} → ánodo · ${K('cationes')} → cátodo<span class="note">por el puente y las disoluciones</span></div>
     <div class="eq">${Ev('E°')} = ${Ev('E°')}(cátodo) − ${Ev('E°')}(ánodo), sin multiplicar<span class="note">${Ev('E°')} &gt; 0: espontánea</span></div>
     <div class="eq">${e('n(e⁻)')} = ${fr(`${Iv('I')}·${tv('t')}`, 'F')}</div>
     <div class="eq">moles de metal = ${fr(e('n(e⁻)'), 'carga del ion')}</div></div>
   <p>El polo cambia (en la pila el cátodo es positivo; en la electrólisis, negativo), pero la regla "cátodo = reducción" no cambia. Ánodo y cátodo se reconocen por la reacción, nunca por el lado del dibujo.</p>
   <p class="fuente">En la UNAM, la idea errónea que la tesis señala como la más extendida fue que el cátodo es siempre positivo (o siempre negativo), y el error del puente salino no bajó con los semestres: los de quinto se equivocaron con más seguridad (Tagle Barrios, 2024, conclusiones). Por eso la escena pinta siempre los electrones y los iones de colores distintos.</p>` },
 { k:'Paso 8', t:'Ahora explora tú', explora:true,
   body:() => `<p>Elige el metal de cada vaso y mira quién se oxida, cuánto marca el voltímetro y hacia dónde va todo.</p>
   <div class="control"><span>Vaso izquierdo</span><div class="seg" role="group" aria-label="Metal del vaso izquierdo">${METALES.map(m => `<button type="button" data-lado="izq" data-m="${m}">${MC.par(m).red}</button>`).join('')}</div></div>
   <div class="control"><span>Vaso derecho</span><div class="seg" role="group" aria-label="Metal del vaso derecho">${METALES.map(m => `<button type="button" data-lado="der" data-m="${m}">${MC.par(m).red}</button>`).join('')}</div></div>
   <div class="control"><span>Entre los vasos</span><div class="seg" role="group" aria-label="Puente">${[['sal', 'Puente salino'], ['ninguno', 'Sin puente']].map(([k, t]) => `<button type="button" data-puente="${k}">${t}</button>`).join('')}</div></div>
   <div class="control"><span>En el alambre</span><div class="seg" role="group" aria-label="Fuente">${[[false, 'Voltímetro (pila)'], [true, 'Fuente externa (electrólisis)']].map(([k, t]) => `<button type="button" data-fuente="${k}">${t}</button>`).join('')}</div></div>
   <div class="lecturas" id="x-lect"></div>
   <div id="x-tabla"></div>
   <p id="x-msg" class="hint" aria-live="polite"></p>` },
];

const dots = $('dots');
steps.forEach((s, k) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.textContent = k + 1; b.setAttribute('aria-label', `Ir al ${s.k.toLowerCase()}: ${s.t}`);
  b.addEventListener('click', () => go(k)); li.appendChild(b); dots.appendChild(li);
});
function go(k){
  if (k < 0 || k >= steps.length || k > S.max || S.ocupado) return;
  const s = steps[k]; S.step = k; S.listo = s.accion ? !!S.hecho.correr : true;
  if (s.prep) s.prep();
  $('stepK').textContent = `${s.k} de ${steps.length}`;
  $('stepT').textContent = s.t;
  $('stepBody').innerHTML = s.body();
  pintarDots();
  if (s.gate) prediccion(s.gate);
  E.L.compactar(s.gate && !S.pred[s.gate.id]);
  if (s.accion) accion();
  if (s.explora) explorar();
  nav(); E.dibujar();
}
function nav(){
  const s = steps[S.step];
  $('prev').disabled = S.step === 0 || S.ocupado;
  const bloqueo = (s.gate && !S.pred[s.gate.id]) || (s.accion && !S.listo) || S.ocupado;
  $('next').disabled = S.step === steps.length - 1 || bloqueo;
  $('next').textContent = s.gate && !S.pred[s.gate.id] ? 'Elige una opción' : (s.accion && !S.listo ? 'Primero haz pasar la corriente' : 'Siguiente');
}
function pintarDots(){
  [...dots.querySelectorAll('button')].forEach((b, k) => {
    b.className = k === S.step ? 'on' : (k <= S.max ? 'done' : ''); b.disabled = k > S.max;
    if (k === S.step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
}
function desbloquear(k){ if (k > S.max) S.max = k; }
function accion(){
  const b = $('correr');
  if (S.hecho.correr){
    b.disabled = true; b.textContent = 'Listo: pasaron 9650 C';
    E.far.llegados = [8]; E.far.salidos = [8]; E.far.emitidos = 8;
    return;
  }
  b.onclick = () => {
    b.disabled = true; S.ocupado = true; nav(); $('estado').textContent = 'Pasa la corriente…';
    E.correr(() => {
      S.ocupado = false; S.hecho.correr = true; S.listo = true; b.textContent = 'Listo: pasaron 9650 C';
      $('estado').textContent = 'Llegaron 8 electrones al cátodo y se depositaron 4 átomos de cobre: uno por cada dos electrones.';
      $('tras').hidden = false; desbloquear(S.step + 1); pintarDots(); nav();
    });
  };
}
function prediccion(P){
  const btns = [...$('stepBody').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[P.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === P.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb'); fb.textContent = P.fb[p]; fb.className = 'fb ' + (p === P.ok ? 'ok' : 'mal');
    $('tras').hidden = false;
  };
  const t0 = Date.now();
  btns.forEach(b => b.addEventListener('click', () => {
    if (S.pred[P.id] || S.ocupado) return;
    const o = P.opts.find(q => q[0] === b.dataset.k);
    S.pred[P.id] = o[0]; desbloquear(S.step + 1); pintar(); pintarDots();
    registrarPrediccion(P.id, o[0], o[0] === P.ok, o[2] || '', o[3] || '', t0);
    nav();
    $('next').focus({ preventScroll:true });
    const paso = S.step; E.L.compactar(false); Celular.alResponder(E.L.cv, () => P.anima(), () => S.step === paso);
  }));
  pintar();
}

// ----- explorador: los cuatro metales del informe (Zn, Fe, Cu, Ag), con puente o sin él y con fuente externa -----
function cfgX(){ const x = S.x; E.config({ izq:x.izq, der:x.der, puente:x.puente, fuente:x.fuente, semilla:11 }); }
function explorar(){
  cfgX(); pintarX();
  const B = $('stepBody');
  B.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.x[b.dataset.lado] = b.dataset.m; cfgX(); pintarX(); });
  B.querySelectorAll('[data-puente]').forEach(b => b.onclick = () => { S.x.puente = b.dataset.puente; cfgX(); pintarX(); });
  B.querySelectorAll('[data-fuente]').forEach(b => b.onclick = () => { S.x.fuente = b.dataset.fuente === 'true'; cfgX(); pintarX(); });
}
function pintarX(){
  const x = S.x, B = $('stepBody'), c = E.celda;
  B.querySelectorAll('[data-m]').forEach(b => { b.setAttribute('aria-pressed', String(x[b.dataset.lado] === b.dataset.m)); b.disabled = x[b.dataset.lado === 'izq' ? 'der' : 'izq'] === b.dataset.m; });
  B.querySelectorAll('[data-puente]').forEach(b => b.setAttribute('aria-pressed', String(x.puente === b.dataset.puente)));
  B.querySelectorAll('[data-fuente]').forEach(b => b.setAttribute('aria-pressed', String(String(x.fuente) === b.dataset.fuente)));
  const caja = (k, val, que, det) => `<div class="lectura" style="--k:var(--c-${k})"><span>${que}</span><b>${val}</b><span>${det}</span></div>`;
  const lado = l => l === 'izq' ? 'izquierda' : 'derecha';
  const v = MC.voltimetro(c, { puente:x.puente });
  $('x-lect').innerHTML =
      caja('E', x.fuente ? fV(c.E) : lecturaV(v), x.fuente ? 'E° de la reacción forzada' : 'Voltímetro', x.fuente ? `no es espontánea: la fuente da ${fmt(c.fuente, 1)} V` : (x.puente === 'sal' ? `E° = ${fmt(c.Ecatodo)} − (${fmt(c.Eanodo)})` : 'sin puente el circuito de iones queda abierto: 0 V'))
    + caja('e', c.sentido.electrones.lado === 'izq→der' ? 'izquierda → derecha' : 'derecha → izquierda', 'Electrones, por el alambre', `del ${NOMBRE[c.anodo]} al ${NOMBRE[c.catodo]}`)
    + caja(c.anodo, `${MC.par(c.anodo).red} (${c.polos.anodo})`, 'Ánodo: oxidación', `a la ${lado(c.lados.anodo)}; aniones hacia aquí`)
    + caja(c.catodo, `${MC.par(c.catodo).red} (${c.polos.catodo})`, 'Cátodo: reducción', `a la ${lado(c.lados.catodo)}; cationes hacia aquí`);
  $('x-tabla').innerHTML = `<div class="eqs"><div class="eq">${c.reaccion.texto.replace(/(Zn|Fe|Cu|Ag)(²⁺|⁺)?/g, (s, m) => Mx(m, s))}</div></div>` + tabla(METALES, c);
  const msg = [];
  if (x.fuente) msg.push(`Con la fuente, la reacción va al revés: ahora se oxida el ${NOMBRE[c.anodo]} (el de mayor potencial) y el cátodo es el polo negativo. Sigue siendo cierto que en el cátodo ocurre la reducción y que los electrones van del ánodo al cátodo por el alambre.`);
  if (x.puente !== 'sal') msg.push('Sin puente, en cuanto reacciona muy poco, cada vaso queda cargado y la reacción se detiene: el voltímetro marca 0 V.');
  if (!x.fuente && c.lados.anodo === 'der') msg.push('El ánodo quedó a la derecha: lo decide la reacción, no el lado.');
  $('x-msg').textContent = msg.join(' ');
}

$('next').addEventListener('click', () => { desbloquear(S.step + 1); go(S.step + 1); });
$('prev').addEventListener('click', () => go(S.step - 1));
go(0);
})();
</script>
<script>
/* ================= MODO 2: ¿qué pasa si…? =================
   Experimentos del catálogo de docs/investigacion/equilibrio-acidos-electroquimica-ideas-erroneas.md:
   EC1 y EC5 (¿qué lleva el puente?), EC11 (sin puente, cada vaso se carga), "duplicar la reacción" (hipótesis,
   ligada a EC12), Faraday con Cu²⁺ y Ag⁺ en serie (hipótesis), EC3/EC4 (¿el ánodo siempre a la izquierda?) y,
   desde el 7 nov 2026, la electrólisis del agua (H₂ y O₂ en 2 : 1; "el hidrógeno en el polo positivo", confusión de
   polos, EC3/EC6) y la del NaCl en agua contra fundido ("sale sodio", hipótesis; electrólisis como disociación, EC7).
   La escena se mueve recién después de responder. */
(function(){
const $ = id => document.getElementById(id);
const E = crearEscena($('cv2'), 'desc2', 'leyenda2');
const e = t => V('e', t), Ev = t => V('E', t), Zn = t => Mx('Zn', t), Cu = t => Mx('Cu', t), Ag = t => Mx('Ag', t), K = t => V('cat', t), N = t => V('an', t);
const SERIE = MC.serie(9650, ['Cu', 'Ag']), DUP = MC.pila('Zn', 'Cu'), AGZN = MC.pila('Ag', 'Zn');
const H = t => V('H', t), O = t => V('O', t), Na = t => V('Na', t), Cl = t => V('Cl', t);
const AGUA = MC.electrolizar('agua-sulfato', { Q:19300 }), SALA = MC.electrolizar('nacl-acuoso', { Q:9650 }), SALF = MC.electrolizar('nacl-fundido', { Q:9650 });
// una semirreacción o ecuación con cada especie en su color
const pintaEc = t => t.replace(/H₂O|OH⁻|H₂SO₄|NaOH|NaCl|Na₂SO₄|(?:\d+ )?e⁻|H⁺|H₂|O₂|Cl₂|Cl⁻|Na⁺|Na/g, m =>
  /e⁻$/.test(m) ? e(m) : m === 'H₂' ? H(m) : m === 'O₂' ? O(m) : m === 'Cl₂' || m === 'Cl⁻' ? Cl(m) : m === 'Na⁺' || m === 'Na' ? Na(m) : m);

const EXPS = [
  { id:'puente', corto:'¿Qué lleva el puente?',
    q:`En la pila de ${Zn('zinc')} y ${Cu('cobre')}, ¿qué pasa por el puente salino mientras la pila funciona?`,
    opts:[['a','Electrones, del zinc al cobre','EC1-puente-lleva-electrones','documentado'],
          ['b','Iones: los aniones van hacia el vaso del zinc y los cationes hacia el del cobre',null],
          ['c','Iones, pero solo los negativos','EC5-solo-iones-negativos','documentado'],
          ['d','Iones: los aniones van hacia el cobre, porque es el polo positivo','aniones-al-polo-positivo','hipotesis']],
    ok:'b',
    fb:{ a:'Elegiste la A. Por el puente no pasa ni un electrón: mira el dibujo, los electrones solo van por el alambre. La correcta está marcada.',
      c:'Elegiste la C. Se mueven los dos: los aniones hacia el zinc y los cationes hacia el cobre, en sentidos opuestos. La correcta está marcada.',
      d:'Elegiste la D. Lo que mueve a los aniones no es el polo de la lámina, sino la carga de la disolución: alrededor del zinc aparecen Zn²⁺ y sobra carga positiva. Los aniones van hacia allá. La correcta está marcada.' },
    antes:ver => E.config({ izq:'Zn', der:'Cu', semilla:21, pausa:!ver }),
    despues:() => E.soltar(),
    exp:() => `<p>Por el puente solo pasan iones: ${N('NO₃⁻')} hacia el vaso del ${Zn('zinc')}, donde aparecen ${Zn('Zn²⁺')}, y ${K('K⁺')} hacia el del ${Cu('cobre')}, donde desaparecen ${Cu('Cu²⁺')}. Así cada disolución sigue neutra y la reacción puede continuar. Los ${e('electrones')} van por arriba, por el alambre.</p>
      <p class="fuente">En la UNAM, ante la pregunta de cambiar el puente por un alambre de platino, cerca de 161 de 306 respuestas (unas 53 %) eligieron que habría electricidad "porque hay un flujo constante de electrones por el alambre" (Tagle Barrios, 2024, ítem 5; cifras leídas de sus gráficas). En Turquía, el 25,42 % de 59 escolares cree que en la disolución la corriente la llevan solo los iones negativos (Şen, Yılmaz y Geban, 2016, tabla 2). Que los aniones vayan "al polo positivo" es una hipótesis nuestra.</p>` },
  { id:'sin-puente', corto:'Quito el puente',
    q:`Se arma la pila de ${Zn('zinc')} y ${Cu('cobre')} sin puente salino: los vasos solo se unen por el alambre. ¿Qué pasa con la carga de cada disolución?`,
    opts:[['a','El vaso del zinc queda positivo, el del cobre negativo, y la reacción se detiene',null],
          ['b','Siguen neutras: los electrones del alambre compensan la carga','EC11-electrones-compensan','parcial'],
          ['c','Nada cambia: el puente solo sirve para que no se mezclen las disoluciones','puente-solo-separa','hipotesis'],
          ['d','El vaso del zinc queda negativo y el del cobre positivo','vaso-zinc-negativo','hipotesis']],
    ok:'a',
    fb:{ b:'Elegiste la B. Los electrones no entran a la disolución: se quedan en los metales. La carga de cada vaso solo la pueden compensar iones, y sin puente no llegan. La correcta está marcada.',
      c:'Elegiste la C. El puente sí separa las disoluciones, pero su trabajo es dejar pasar iones. Sin él, la reacción se frena. La correcta está marcada.',
      d:'Elegiste la D. Al vaso del zinc llegan Zn²⁺ (carga positiva) y del vaso del cobre se van Cu²⁺: el del zinc queda positivo y el del cobre, negativo. La correcta está marcada.' },
    antes:ver => E.config({ izq:'Zn', der:'Cu', puente:'ninguno', semilla:22, pausa:!ver, ocultarV:!ver }),
    despues:() => { E.cfg.ocultarV = false; E.soltar(); },
    exp:() => `<p>Mira los contadores: se disuelven dos puntos de ${Zn('zinc')} y se depositan dos de ${Cu('cobre')}; el vaso del zinc queda con +4 y el del cobre con −4, y ya no pasa ningún ${e('electrón')} más. En una pila real basta que reaccione una cantidad que ninguna balanza detecta: la carga que se acumula frena la reacción. Sin puente, el voltímetro marca ${Ev('0 V')}.</p>
      <p class="fuente">En São Paulo, con 125 estudiantes que ya habían estudiado el tema, apareció la idea de que los electrones van de un electrodo al otro sin que la disolución cambie de carga; es un estudio cualitativo, sin porcentaje (Caramel y Pacca, 2011). Las opciones C y D son hipótesis nuestras.</p>` },
  { id:'duplicar', corto:'Duplico la reacción',
    q:`Si escribo la reacción como 2 ${Zn('Zn')} + 2 ${Cu('Cu²⁺')} → 2 ${Zn('Zn²⁺')} + 2 ${Cu('Cu')}, o si armo la pila con láminas y vasos el doble de grandes, ¿cuánto marca el ${Ev('voltímetro')}?`,
    opts:[['a','2,20 V: el doble','fem-duplicada','hipotesis'],
          ['b','1,10 V: lo mismo',null],
          ['c','0,55 V: la mitad, porque se reparte entre más átomos','fem-mitad','hipotesis'],
          ['d','Depende de cuánta masa de zinc haya','fem-depende-de-cantidad','hipotesis']],
    ok:'b',
    fb:{ a:'Elegiste la A. Duplicar la reacción duplica cuánto reacciona y cuánta carga puede dar la pila, pero no la fem: cada electrón sale con el mismo "empuje". La correcta está marcada.',
      c:'Elegiste la C. La fem no se reparte entre los átomos: depende de qué metales son. La correcta está marcada.',
      d:'Elegiste la D. Más zinc hace que la pila dure más, no que empuje más fuerte. La correcta está marcada.' },
    antes:ver => E.config({ izq:'Zn', der:'Cu', semilla:23, grande:true, pausa:!ver, ocultarV:!ver }),
    despues:() => { E.cfg.ocultarV = false; E.soltar(); },
    exp:() => `<div class="eqs"><div class="eq">${Ev('E°')} = ${Ev('0,34')} − (${Ev('−0,76')}) = ${Ev(fV(DUP.E))}<span class="note">con 1, 2 o 100 átomos de zinc</span></div></div>
      <p>La fem es intensiva, como la temperatura: depende de qué metales son y de las concentraciones, no de cuánto metal hay. Una pila más grande da la misma fem y dura más. Para tener más voltaje, se conectan pilas en serie.</p>
      <p class="fuente">No encontramos estudios que midan este error: las tres opciones incorrectas son hipótesis nuestras, ligadas a un dato: la mayoría de 16 universitarios con ideas erróneas sobre la pila calculaba bien el potencial (Sanger y Greenbowe, 1997b, según el resumen).</p>` },
  { id:'faraday', corto:'Faraday: Cu²⁺ y Ag⁺',
    q:`Una celda con ${Cu('Cu²⁺')} y dos láminas de ${Cu('cobre')}, y otra con ${Ag('Ag⁺')} y dos láminas de ${Ag('plata')}, están en serie. En cada una, la lámina del ánodo se disuelve y repone los iones que se depositan en el cátodo. Por las dos pasa la misma corriente. Mientras pasan 8 ${e('electrones')} por cada una, ¿cuántos átomos se depositan en cada cátodo?`,
    opts:[['a','8 de cobre y 8 de plata','faraday-sin-carga-del-ion','hipotesis'],
          ['b','4 de cobre y 8 de plata',null],
          ['c','8 de cobre y 4 de plata','faraday-carga-al-reves','hipotesis'],
          ['d','16 de cobre y 8 de plata','faraday-multiplica-la-carga','hipotesis']],
    ok:'b',
    fb:{ a:'Elegiste la A. Los electrones son los mismos, pero cada Cu²⁺ necesita dos y cada Ag⁺ solo uno. La correcta está marcada.',
      c:'Elegiste la C. Al revés: el que necesita más electrones por átomo, el cobre, deposita menos átomos. La correcta está marcada.',
      d:'Elegiste la D. La carga del ion divide, no multiplica: con 8 electrones alcanzan para 4 Cu²⁺. La correcta está marcada.' },
    antes:ver => E.config({ tipo:'faraday', especies:['Cu', 'Ag'], meta:8, semilla:4, corriendo:false, aviso:'Responde para hacer pasar la corriente' }),
    despues:() => E.correr(),
    exp:() => `<div class="eqs"><div class="eq">${Cu('Cu²⁺')} + 2 ${e('e⁻')} → ${Cu('Cu')} · ${Ag('Ag⁺')} + ${e('e⁻')} → ${Ag('Ag')}</div>
      <div class="eq">Con ${e('9650 C')} (${e('0,1 mol de e⁻')}): ${Cu(`${fmt(SERIE[0].mol, 2)} mol = ${fmt(SERIE[0].g, 3)} g de Cu`)} · ${Ag(`${fmt(SERIE[1].mol, 1)} mol = ${fmt(SERIE[1].g, 1)} g de Ag`)}</div></div>
      <p>En serie, lo que es igual en las dos celdas son los ${e('moles de electrones')}, no los moles de metal. Cada metal deposita los moles de electrones divididos entre la carga de su ion. Es la segunda ley de Faraday.</p>
      <p class="fuente">No encontramos ningún estudio con porcentajes sobre la ley de Faraday: las opciones incorrectas son hipótesis nuestras.</p>` },
  { id:'anodo-lado', corto:'¿Ánodo a la izquierda?',
    q:`En este dibujo la ${Ag('plata')} está a la izquierda y el ${Zn('zinc')} a la derecha. ¿Cuál es el ánodo?`,
    opts:[['a','El de la izquierda: el ánodo siempre está a la izquierda','EC4-anodo-a-la-izquierda','documentado'],
          ['b','El zinc, porque es el que se oxida',null],
          ['c','La plata, porque el ánodo es el polo positivo','EC3-anodo-positivo','documentado'],
          ['d','Depende de dónde se ubiquen las semiceldas','EC4-depende-de-la-ubicacion','documentado']],
    ok:'b',
    fb:{ a:'Elegiste la A. Es una costumbre de los libros dibujar el ánodo a la izquierda, no una regla: el ánodo es donde ocurre la oxidación. La correcta está marcada.',
      c:'Elegiste la C. En una pila, el ánodo es el polo negativo: de ahí salen los electrones. La correcta está marcada.',
      d:'Elegiste la D. Moviendo los vasos no cambia nada: el zinc se oxida esté donde esté. La correcta está marcada.' },
    antes:ver => E.config({ izq:'Ag', der:'Zn', semilla:25, pausa:!ver, roles:ver }),
    despues:() => { E.cfg.roles = true; E.soltar(); },
    exp:() => `<div class="eqs"><div class="eq">${Zn('Zn')} → ${Zn('Zn²⁺')} + 2 ${e('e⁻')}<span class="note">oxidación: ánodo, polo −</span></div>
      <div class="eq">2 ${Ag('Ag⁺')} + 2 ${e('e⁻')} → 2 ${Ag('Ag')}<span class="note">reducción: cátodo, polo +</span></div>
      <div class="eq">${Ev('E°')} = ${Ev('0,80')} − (${Ev('−0,76')}) = ${Ev(fV(AGZN.E))}</div></div>
      <p>Para saber cuál es el ánodo, mira la tabla de potenciales: el de menor potencial se oxida. Ahora los ${e('electrones')} van de derecha a izquierda y los ${N('aniones')} del puente, hacia la derecha.</p>
      <p class="fuente">En Turquía, con 59 escolares de 11.º grado: el 15,25 % cree que el ánodo siempre está a la izquierda, el 5,08 % que depende de la ubicación de las semiceldas y el 6,78 % que en la pila el ánodo es positivo y el cátodo negativo (Şen, Yılmaz y Geban, 2016, tabla 2). En la UNAM, "el cátodo siempre es positivo" (o siempre negativo) fue la idea más frecuente, sin porcentaje legible (Tagle Barrios, 2024).</p>` },
  { id:'agua', corto:'Electrolizo agua',
    q:`Un voltámetro de Hofmann tiene dos tubos invertidos llenos de agua con un poco de Na₂SO₄, que no se gasta: sin él, el agua casi no conduce. Cada tubo tapa un electrodo. El de la izquierda está unido al polo − de la fuente (cátodo) y el de la derecha al polo + (ánodo). Al pasar la corriente, ¿qué gas se junta en cada tubo?`,
    opts:[['a','Cátodo (−): H₂; ánodo (+): O₂, el mismo volumen en los dos tubos','agua-gases-1-a-1','hipotesis'],
          ['b','Cátodo (−): O₂; ánodo (+): H₂, con el doble de volumen de H₂','agua-hidrogeno-en-el-polo-positivo','parcial'],
          ['c','Cátodo (−): H₂; ánodo (+): O₂, con el doble de volumen de O₂','agua-doble-de-oxigeno','hipotesis'],
          ['d','Cátodo (−): H₂; ánodo (+): O₂, con el doble de volumen de H₂',null]],
    ok:'d',
    fb:{ a:'Elegiste la A. Los gases sí son H₂ y O₂, pero no salen iguales: cada H₂ necesita 2 electrones y cada O₂ suelta 4. Con los mismos electrones sale el doble de H₂, como en la fórmula H₂O. La correcta está marcada.',
      b:'Elegiste la B. Al cátodo, el polo −, llegan los electrones y ahí ocurre la reducción: el agua gana electrones y suelta H₂. El O₂ sale en el ánodo, donde el agua pierde electrones. La correcta está marcada.',
      c:'Elegiste la C. Al revés: para cada O₂ tienen que salir 4 electrones y para cada H₂ basta que lleguen 2, así que con los mismos electrones se junta el doble de H₂. La correcta está marcada.' },
    antes:ver => { E.config({ tipo:'gases', sistemas:['agua-sulfato'], meta:24, semilla:6, mostrar:ver }); if (ver) E.terminarGases(); },
    despues:() => { E.cfg.mostrar = true; E.leyenda(); E.correrGases(); },
    exp:() => `<div class="eqs"><div class="eq">${pintaEc(AGUA.catodo.semirreaccion)}<span class="note">cátodo (−): reducción</span></div>
      <div class="eq">${pintaEc(AGUA.anodo.semirreaccion)}<span class="note">ánodo (+): oxidación</span></div>
      <div class="eq">${pintaEc(AGUA.global)}<span class="note">global</span></div>
      <div class="eq">Con ${e('19 300 C')} ${e('(' + fmt(AGUA.molE, 1) + ' mol de e⁻)')}: ${H(`${fmt(AGUA.catodo.mol, 1)} mol = ${fmt(AGUA.catodo.L, 2)} L de H₂`)} · ${O(`${fmt(AGUA.anodo.mol, 2)} mol = ${fmt(AGUA.anodo.L, 2)} L de O₂`)}<span class="note">en condiciones normales, 22,4 L/mol</span></div></div>
      <p>Los ${e('electrones')} entran por el cátodo y salen por el ánodo, siempre por el cable: en el agua no hay electrones sueltos, solo se mueven los iones del Na₂SO₄. Por cada ${O('O₂')} tienen que salir 4 electrones y por cada ${H('H₂')} basta que lleguen 2. Como por el cable pasan los mismos electrones, el tubo del ${H('hidrógeno')} se llena el doble. Con la carga: 2 F por mol de ${H('H₂')} y 4 F por mol de ${O('O₂')}.</p>
      <p class="fuente">En una tesis de la UNAM se documentó la idea de que "la reducción del hidrógeno ocurre en el polo positivo", sin porcentaje (Tagle Barrios, 2024). Que los gases salgan iguales o que salga más oxígeno son hipótesis nuestras.</p>` },
  { id:'sal', corto:'Sal en agua o fundida',
    q:`Se electroliza NaCl en dos celdas. A la izquierda, una salmuera concentrada: NaCl disuelto en agua. A la derecha, NaCl fundido a más de 800 °C, sin nada de agua. En los dos ánodos (+) sale cloro, ${Cl('Cl₂')} (si la salmuera estuviera diluida, saldría además algo de O₂). ¿Qué sale en cada cátodo (−)?`,
    opts:[['a','En la salmuera, sodio; en la sal fundida, sodio','nacl-acuoso-sale-sodio','hipotesis'],
          ['b','En la salmuera, nada: la corriente solo separa Na⁺ y Cl⁻; en la sal fundida, sodio','electrolisis-como-disociacion','parcial'],
          ['c','En la salmuera, H₂; en la sal fundida, sodio',null],
          ['d','En la salmuera, H₂; en la sal fundida, H₂','nacl-fundido-sale-hidrogeno','hipotesis']],
    ok:'c',
    fb:{ a:'Elegiste la A. En la salmuera hay muchísima agua, y al agua le cuesta menos ganar electrones que al Na⁺: en el cátodo se reduce el agua y sale H₂. Solo sale sodio si no hay agua, en la sal fundida. La correcta está marcada.',
      b:'Elegiste la B. Los iones Na⁺ y Cl⁻ ya estaban separados desde que la sal se disolvió, sin corriente. La electrólisis forma sustancias nuevas en los electrodos: aquí, H₂ y Cl₂. La correcta está marcada.',
      d:'Elegiste la D. En la sal fundida no hay agua ni ningún otro hidrógeno: lo único que puede ganar electrones es el Na⁺, y sale sodio metálico. La correcta está marcada.' },
    antes:ver => { E.config({ tipo:'gases', sistemas:['nacl-acuoso', 'nacl-fundido'], meta:12, semilla:7, mostrar:ver }); if (ver) E.terminarGases(); },
    despues:() => { E.cfg.mostrar = true; E.leyenda(); E.correrGases(); },
    exp:() => `<div class="eqs"><div class="eq">${pintaEc(SALA.catodo.semirreaccion)}<span class="note">salmuera, cátodo (−)</span></div>
      <div class="eq">${pintaEc(SALA.anodo.semirreaccion)}<span class="note">salmuera, ánodo (+)</span></div>
      <div class="eq">${pintaEc(SALA.global)}</div>
      <div class="eq">${pintaEc(SALF.catodo.semirreaccion)}<span class="note">sal fundida, cátodo (−)</span></div>
      <div class="eq">${pintaEc(SALF.anodo.semirreaccion)}<span class="note">sal fundida, ánodo (+)</span></div>
      <div class="eq">${pintaEc(SALF.global)}</div>
      <div class="eq">Con ${e('9650 C')} ${e('(' + fmt(SALA.molE, 1) + ' mol de e⁻)')}: ${H(`${fmt(SALA.catodo.L, 2)} L de H₂`)} en la salmuera · ${Na(`${fmt(SALF.catodo.mol, 1)} mol = ${fmt(SALF.catodo.g, 1)} g de Na`)} en la fundida · ${Cl(`${fmt(SALA.anodo.L, 2)} L de Cl₂`)} en cada ánodo</div></div>
      <p>Con los mismos ${e('electrones')}, la sal fundida da dos átomos de ${Na('sodio')} por cada molécula de ${H('H₂')} de la salmuera: cada ${Na('Na⁺')} toma un solo electrón. En la salmuera, el ${Na('Na⁺')} se queda en el agua y, con los OH⁻ que salen del cátodo, queda NaOH disuelto. Así se fabrican la soda cáustica y el cloro; el sodio metálico se saca de la sal fundida.</p>
      <p>En el ánodo compiten el ${Cl('Cl⁻')} y el agua. Con salmuera concentrada sale casi solo ${Cl('Cl₂')}; si está diluida, sale también O₂, y con muy poca sal, sobre todo O₂.</p>
      <p class="fuente">No encontramos estudios que midan el error de que en la salmuera "sale sodio": es una hipótesis nuestra, como la D. La B sale de una idea que una tesis de la UNAM documenta sin porcentaje: confundir la electrólisis con la disociación (Tagle Barrios, 2024).</p>` },
];
const S = { k:0, pred:{}, t0:Date.now() };
// Pastillas: la k solo se abre si todos los experimentos anteriores ya tienen respuesta;
// las respondidas se revisitan libres (misma regla que los puntos del paso a paso).
function primeraLibre(){ const j = EXPS.findIndex(x => !S.pred[x.id]); return j < 0 ? EXPS.length - 1 : j; }
function botones(){
  const libre = primeraLibre();
  $('exps').innerHTML = EXPS.map((x, k) => k > libre
    ? `<button type="button" aria-pressed="false" data-k="${k}" disabled aria-disabled="true" aria-label="Experimento ${k+1}, bloqueado">${k+1}. ${x.corto}</button>`
    : `<button type="button" aria-pressed="${k === S.k}" data-k="${k}">${k+1}. ${x.corto}</button>`).join('');
  $('exps').querySelectorAll('button').forEach(b => b.onclick = () => ir(+b.dataset.k));
}
function ir(k){
  if (k > primeraLibre()) return;
  S.k = k; S.t0 = Date.now();
  const x = EXPS[k], visto = !!S.pred[x.id];
  x.antes(visto);
  if (visto && x.id === 'faraday'){ E.far.llegados = [8, 8]; E.far.salidos = [8, 8]; E.far.emitidos = 8; }
  E.L.compactar(!S.pred[x.id]);
  botones();
  $('k2').textContent = `¿Qué pasa si…? · ${k+1} de ${EXPS.length}`;
  $('t2').textContent = x.corto;
  $('body2').innerHTML = `<p>${x.q}</p>
    <div class="opts">${x.opts.map(([l, t]) => `<button class="opt" type="button" data-k="${l}"><span class="l">${l.toUpperCase()}</span><span>${t}</span></button>`).join('')}</div>
    <p class="fb" id="fb2"></p><div id="res2" class="body"></div>`;
  const btns = [...$('body2').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[x.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === x.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb2');
    fb.textContent = p === x.ok ? '¡Bien pensado! Mira la escena para ver por qué.' : (x.fb && x.fb[p]) || `Elegiste la ${p.toUpperCase()}. La correcta está marcada; mira la escena para ver por qué.`;
    fb.className = 'fb ' + (p === x.ok ? 'ok' : 'mal');
    $('res2').innerHTML = x.exp() + (k < EXPS.length - 1 ? `<div class="nav"><span></span><button type="button" class="btn primary" id="sig2">Siguiente: ${EXPS[k+1].corto}</button></div>` : '');
    const sig = $('sig2'); if (sig) sig.onclick = () => { ir(k + 1); document.querySelector('#m2').scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); };
  };
  btns.forEach(b => b.onclick = () => {
    if (S.pred[x.id]) return;
    const o = x.opts.find(q => q[0] === b.dataset.k);
    S.pred[x.id] = o[0]; botones(); pintar(); E.L.compactar(false);
    Celular.alResponder(E.L.cv, () => { x.despues(); E.dibujar(); }, () => S.k === k);
    registrarPrediccion('que-pasa-si-' + x.id, o[0], o[0] === x.ok, o[2] || '', o[3] || '', S.t0);
  });
  pintar(); E.dibujar();
}
ir(0);
})();
</script>

<script>
/* ================= Pestañas ================= */
(function(){
  const modos = [['#paso-a-paso', 'm1', 'tab1'], ['#que-pasa-si', 'm2', 'tab2']];
  function route(){
    const k = Math.max(0, modos.findIndex(m => m[0] === location.hash));
    modos.forEach(([, m, t], j) => {
      document.getElementById(m).hidden = j !== k;
      const a = document.getElementById(t);
      if (j === k) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    dispatchEvent(new Event('modo'));
  }
  addEventListener('hashchange', route); route();
})();
</script>
