<title>El montón y la caja punteada: pureza, rendimiento y equivalentes</title>
<style>
/* Cáscara acogedora (crema, tarjetas cálidas, esquinas redondas; docs/diseno.md).
   Dentro del dibujo y de las ecuaciones solo mandan los colores de las variables (regla 4).

   Colores de esta escena (claro / oscuro). Revisados con CIEDE2000 y contraste WCAG (docs/metodo/paleta.py):
     imp   impureza: la parte de la muestra que no es el reactivo         marrón    #7a4a1e / #d9a877
     pur   reactivo puro (su masa y su fórmula en la ecuación)            verde azulado #0d6f6b / #4fd1c5
     teo   producto teórico, el máximo que da la ecuación (caja punteada) violeta   #6a3fc0 / #b49cff
     real  producto real, el que se obtiene                               verde     #36700c / #8fd14f
     vol   volumen del gas en condiciones normales                        vino / magenta #730030 / #ff47c8
     eq    equivalentes                                                   naranja   #a04f00 / #ffa64d
     Fe, O átomos de la lupa de la hematita: paleta común (nucleo/elementos.js, --el-Fe y --el-O)
   La masa de la muestra, los porcentajes, los otros productos (CO₂ en la caliza, CO, CaO del gas) y las masas molares
   van en tinta. Salen juntos imp, pur, teo y real (con Fe y O en la hematita); imp, pur, real y vol (gas); eq solo.
   ΔE00 mínimo entre lo que sale junto: 20,1 en claro (teo–Fe) y 24,7 en oscuro (teo–Fe); pur–real 24,7 / 26,9;
   contra la tinta, 24,3 / 26,3 (teo). vol (recalibrado con docs/metodo/paleta.py) sale con imp, pur, teo, real, la tinta y
   el gris de «otro producto»: mínimo 22,0 en claro (vol–tinta) y 22,7 en oscuro (vol–teo); contra el rojo de los avisos,
   22,4 / 22,8. Contraste mínimo contra el papel, la tarjeta y el chip (8 %): 4,91 en claro (eq)
   y 4,61 en oscuro (vol); todos pasan AA (4,5). pur y real quedan a ΔE00 13 a 16 del verde de «correcto» (--ok):
   ese verde solo marca el borde de la opción y siempre va con texto. */
[hidden]{display:none!important}
:root{
  --bg:#fbf3ec; --card:#fffaf6; --paper:#fdf7f1; --ink:#2d2340; --muted:#716579; --line:#efe3dc; --grid:#f3e8e0;
  --acento:#ffd3e2; --acento-ink:#5c1f3d; --ok:#1d7f58; --warn:#c8363b;
  --shadow:0 1px 2px rgba(92,52,110,.05),0 10px 28px rgba(92,52,110,.09);
  --c-imp:#7a4a1e; --c-pur:#0d6f6b; --c-teo:#6a3fc0; --c-real:#36700c; --c-vol:#730030; --c-eq:#a04f00;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-imp:#d9a877; --c-pur:#4fd1c5; --c-teo:#b49cff; --c-real:#8fd14f; --c-vol:#ff47c8; --c-eq:#ffa64d; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-imp:#d9a877; --c-pur:#4fd1c5; --c-teo:#b49cff; --c-real:#8fd14f; --c-vol:#ff47c8; --c-eq:#ffa64d; color-scheme:dark }
/* Colores de los elementos: paleta común de química (nucleo/elementos.js). Este bloque sale de
   Elementos.css(['O', 'Fe']) y no se edita a mano: nucleo/elementos-escenas.test.js lo compara. */
:root{ --el-O:#c4284e; --el-Fe:#1768be }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --el-O:#f17384; --el-Fe:#209cf2 } }
:root[data-theme="dark"]{ --el-O:#f17384; --el-Fe:#209cf2 }

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--font); -webkit-text-size-adjust:100%}
.wrap{max-width:1240px; margin:0 auto; padding-block:18px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid; gap:16px}
.top{display:grid; gap:12px}
.eyebrow{margin:0; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700}
h1{margin:2px 0 0; font-size:clamp(1.65rem, 4.4vw, 2.1rem); line-height:1.1; letter-spacing:-.01em}
.sub{margin:4px 0 0; color:var(--muted); font-size:.95rem; max-width:60ch}

.tabs{display:flex; gap:4px; padding:5px; border-radius:999px; background:var(--card); box-shadow:var(--shadow); justify-self:start; max-width:100%}
.tabs a{padding:9px 16px; border-radius:999px; color:var(--muted); text-decoration:none; font-weight:700; white-space:nowrap; font-size:.95rem}

.tabs a:hover:not([aria-current]){color:var(--ink)}

.mode{display:grid; gap:16px; min-width:0; align-items:start}

.step-t{margin:8px 0 0; font-size:1.35rem; line-height:1.2; text-wrap:balance}
.body{display:grid; gap:12px; min-width:0}

.problem{border-left:4px solid var(--acento); padding:6px 0 6px 14px; font-size:1.06rem; max-width:66ch}

.v{font-weight:800; border-radius:6px; padding:0 2px; cursor:pointer; text-decoration:underline dotted 1.5px; text-underline-offset:3px; white-space:nowrap}
.v-imp{color:var(--c-imp); background:color-mix(in srgb, var(--c-imp) 8%, transparent)}
.v-pur{color:var(--c-pur); background:color-mix(in srgb, var(--c-pur) 8%, transparent)}
.v-teo{color:var(--c-teo); background:color-mix(in srgb, var(--c-teo) 8%, transparent)}
.v-real{color:var(--c-real); background:color-mix(in srgb, var(--c-real) 8%, transparent)}
.v-vol{color:var(--c-vol); background:color-mix(in srgb, var(--c-vol) 8%, transparent)}
.v-eq{color:var(--c-eq); background:color-mix(in srgb, var(--c-eq) 8%, transparent)}
.v.hl{background:transparent; outline:2px solid currentColor; outline-offset:1px}

.eqs{display:grid; gap:10px; padding:14px; border-radius:16px; background:var(--paper); border:1px solid var(--line); overflow-x:auto}
.eq{display:flex; flex-wrap:wrap; align-items:center; gap:.42em; font-family:var(--mono); font-size:1rem; font-variant-numeric:tabular-nums; min-width:0}
.eq .note{font-family:var(--font); font-size:.84rem; color:var(--muted); white-space:normal; flex-basis:100%}

.opts{display:grid; grid-template-columns:1fr; gap:8px}
@media (min-width:560px){ .opts{grid-template-columns:repeat(2, minmax(0,1fr))} }
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; padding:12px 14px; border-radius:16px; border:2px solid var(--line);
  background:var(--paper); color:var(--ink); font:inherit; cursor:pointer; min-height:48px}
.opt .l{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:.85rem;
  background:var(--card); border:1.5px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 10%, var(--paper))}
.opt.correct .l{background:var(--ok); border-color:var(--ok); color:var(--card)}
.opt.wrong{border-color:var(--warn); background:color-mix(in srgb, var(--warn) 9%, var(--paper))}
.opt.wrong .l{background:var(--warn); border-color:var(--warn); color:var(--card)}
.fb{font-weight:700; margin:0}
.fb.ok{color:var(--ok)} .fb.mal{color:var(--warn)}

.ctrls{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap:12px; align-items:end}
select{font:700 .95rem var(--font); padding:9px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); min-height:44px; max-width:100%; width:100%; min-width:0}
.campo{display:grid; gap:4px; font-weight:700; min-width:0}
.botones{display:flex; flex-wrap:wrap; gap:6px}
.botones .btn{padding:8px 14px; min-height:40px; font-size:.9rem}
.seg{display:inline-flex; flex-wrap:wrap; gap:4px; padding:4px; border-radius:22px; background:var(--paper); border:1px solid var(--line); justify-self:start; max-width:100%}
.seg button{font:700 .9rem var(--font); padding:8px 14px; border-radius:999px; border:0; background:transparent; color:var(--muted); cursor:pointer; min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--card)}
.seg button:disabled{opacity:.45; cursor:not-allowed}
.lect{font-size:.92rem; font-variant-numeric:tabular-nums; display:grid; gap:4px}
.lect .fila{display:flex; flex-wrap:wrap; gap:2px 14px}
.aviso{background:var(--acento); color:var(--acento-ink); border-radius:16px; padding:10px 14px; font-size:.93rem}

.nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.btn{font:700 .95rem var(--font); padding:11px 20px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; min-height:44px}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--card)}
.btn:disabled{opacity:.45; cursor:not-allowed}
button:focus-visible, .v:focus-visible, select:focus-visible, a:focus-visible, canvas:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.hint{font-size:.88rem; color:var(--muted)}
.fuente{font-size:.86rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px}
.pie{margin:4px 0 0; text-align:center; color:var(--muted); font-size:.95rem}
.pie a{color:var(--ink); font-weight:700}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.volver-app{display:inline-block; margin:12px 16px 0; background:var(--card); color:var(--ink); box-shadow:var(--shadow);
  font:700 14px var(--font); padding:8px 16px; border-radius:999px; text-decoration:none}

.slider{display:grid; gap:4px}
.slider label{font-weight:700; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.slider output{font-family:var(--mono); font-variant-numeric:tabular-nums}
input[type=range]{width:100%; accent-color:var(--ink); min-height:32px}

/* Pantalla grande (laboratorio de cómputo, 1366 × 768): dibujo a la izquierda, fijo; guía a la derecha. */
@media (min-width:900px){
  .top{grid-template-columns:1fr auto; align-items:end}
  .mode{grid-template-columns:minmax(0, 1.15fr) minmax(360px, 1fr)}
  .bench{position:sticky; top:12px}
}

<script>
// Si la escena se abrió desde la app, mostrar un botón para volver (en iPhone, la app instalada no tiene "atrás").
if (new URLSearchParams(location.search).get('desde') === 'app') addEventListener('DOMContentLoaded', () => {

  a.setAttribute('aria-label', 'Volver a la app');

<script src="motor.js"></script>
<script src="../../nucleo/medicion.js"></script>
<script src="../../nucleo/celular.js"></script>
<script>
// Registro anónimo de predicciones (nucleo/medicion.js). Solo guarda si el alumno entró por la app.
const PLANTILLA = { id: 'rendimiento-pureza', unidad: 'quimica.estequiometria', version: '0.1.0' };
function registrarPrediccion(problema, opcion, correcta, error, respaldo, t0){
  if (!window.Medicion) return;
  Medicion.guardar({ tipo: 'prediccion', modulo: PLANTILLA.id, unidad: PLANTILLA.unidad, problema, opcion, correcta,
    error: correcta ? '' : error, respaldo: correcta ? '' : respaldo, ms: t0 ? Date.now() - t0 : '' }, PLANTILLA.version);
}

/* ================= Piezas compartidas =================
   Toda la química sale de MotorRendimiento (motor.js): masas molares, masa a masa, pureza, rendimiento, el problema
   inverso, la cadena, la conservación de la masa, los equivalentes y los cuadros de la animación (reparto).
   Aquí solo se pinta lo que el motor dice. */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MR = MotorRendimiento;
const css = Celular.variable; // guardada hasta que cambie el tema o el tamaño (nucleo/celular.js)
// Números con coma decimal; hasta d decimales, sin ceros de más.
function g(n, d){
  if (!Number.isFinite(n)) return '—';
  const p = Math.pow(10, d === undefined ? 2 : d), r = Math.round(n*p)/p + 0;
  const [e, f] = String(Math.abs(r)).split('.');
  return (r < 0 ? '−' : '') + e + (f ? ',' + f : '');
}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const SUB = { '0':'₀', '1':'₁', '2':'₂', '3':'₃', '4':'₄', '5':'₅', '6':'₆', '7':'₇', '8':'₈', '9':'₉' };
const fx = f => String(f).replace(/\d/g, d => SUB[d]);          // 'Fe2O3' → 'Fe₂O₃'
// Chips del texto: cada variable con su color; al tocarlos se resalta en el dibujo.
const V = (k, t) => `<span class="v v-${k}" data-var="${k}" tabindex="0">${t}</span>`;
const Im_ = t => V('imp', t), Pu_ = t => V('pur', t), Te_ = t => V('teo', t), Re_ = t => V('real', t), Vo_ = t => V('vol', t), Eq_ = t => V('eq', t);

function colores(){
  const c = css;
  return { ink:c('--ink'), muted:c('--muted'), grid:c('--grid'), paper:c('--paper'), card:c('--card'), line:c('--line'),
    imp:c('--c-imp'), pur:c('--c-pur'), teo:c('--c-teo'), real:c('--c-real'), vol:c('--c-vol'), eq:c('--c-eq'),
    Fe:c('--el-Fe'), O:c('--el-O'), font:c('--font') };
}
function alfa(hex, a){
  const h = String(hex).replace('#', ''); if (h.length !== 6) return hex;
  return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`;
}
function alRedibujarTema(fn){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', fn);
  new MutationObserver(fn).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w/2, h/2))); else ctx.rect(x, y, w, h); }
// Texto por piezas de colores: [texto, clave de color, peso]. Baja la letra hasta 9 px si no entra.
function anchoPiezas(ctx, c, ps, tam){ let w = 0; for (const [t, , peso] of ps){ ctx.font = `${peso || 700} ${tam}px ${c.font}`; w += ctx.measureText(t).width; } return w; }
function dibujarPiezas(ctx, c, ps, x, y, tam, align, max){
  let t = tam; if (max) while (t > 9 && anchoPiezas(ctx, c, ps, t) > max) t -= 0.5;
  const w = anchoPiezas(ctx, c, ps, t);
  let x0 = align === 'center' ? x - w/2 : align === 'right' ? x - w : x;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (const [txt, k, peso] of ps){ ctx.font = `${peso || 700} ${t}px ${c.font}`; ctx.fillStyle = c[k] || c.ink; ctx.fillText(txt, x0, y); x0 += ctx.measureText(txt).width; }
  return w;
}
function envolver(ctx, c, txt, max, tam){
  ctx.font = `700 ${tam}px ${c.font}`; const pal = String(txt).split(' '), lineas = []; let l = '';
  for (const p of pal){ const t = l ? l + ' ' + p : p; if (ctx.measureText(t).width > max && l){ lineas.push(l); l = p; } else l = t; }
  if (l) lineas.push(l); return lineas;
}
function flecha(ctx, x1, y, x2, col){
  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2 - 6, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y); ctx.lineTo(x2 - 8, y - 5); ctx.lineTo(x2 - 8, y + 5); ctx.closePath(); ctx.fill(); ctx.restore();
}

/* ----- La escena -----
   E.vista: { ec:[piezas], paneles:[...], pie, vars:[claves de la leyenda], desc }
     { tipo:'montones', mmax, items:[slot], flechas:[[x1, x2]], recipiente:{ balanza:[piezas] } }
        slot: { x (0 a 1), k ('imp' | 'pur' | 'real' | 'otro' | 'mezcla'), masa, alfa, relleno (0 a 1), teo (masa de la
        caja punteada), teoAlfa, tapa ('?' en vez del montón), gas (globo en vez de montón), etq:[[piezas]] }
        El área del montón (o del globo) es proporcional a la masa, con la misma escala (mmax) en toda la vista.

    vars: r ? ['imp', 'pur', 'teo', 'real'] : ['real'],

}

const steps = [
 { k:'Paso 1', t:'El problema', vista:() => vFe(false),
   body:() => `<p class="problem">Un mineral de hierro, la hematita, tiene 80 % de Fe₂O₃; el resto es roca. Se tratan 200 g del mineral con CO en exceso: Fe₂O₃ + 3CO → 2Fe + 3CO₂. La reacción tiene un rendimiento de 90 %. ¿Cuántos gramos de hierro se obtienen?</p>
   <p>Dos palabras del enunciado. La <b>pureza</b> dice qué parte de la masa de la muestra es la sustancia que reacciona (aquí, Fe₂O₃); el resto es impureza y no reacciona. El <b>rendimiento</b> dice qué parte del ${Te_('producto teórico')}, el máximo que da la ecuación, se obtiene de verdad: el ${Re_('producto real')}.</p>
   <p>Masas molares: Fe₂O₃ = 2 × 56 + 3 × 16 = 160 g/mol; Fe = 56 g/mol.</p>
` },
 { k:'Paso 2', t:'El hierro de la hematita: predice', gate:P0, vista:r => vFe(!!r, 1),
   anima: fin => animar(E, 2.6, f => { E.vista = vFe(true, f); }, () => { E.vista = vFe(true, 1); fin(); }, 0.2),
   body:() => `<p>200 g de mineral con 80 % de Fe₂O₃, CO en exceso y 90 % de rendimiento. ¿Cuántos gramos de hierro se obtienen?</p>${opcionesHTML(P0.opts, 'fb')}
   <div id="tras" class="body" hidden><div class="eqs">
     <div class="eq"><span class="ex">200 g × 0,80 = ${Pu_('160 g de Fe₂O₃')} &nbsp;(+ ${Im_('40 g')} de roca)</span></div>
     <div class="eq"><span class="ex">160 ÷ 160 = 1 mol de Fe₂O₃ → 2 mol de Fe → ${Te_(g(FE.teorico) + ' g')}</span></div>
     <div class="eq"><span class="ex">${Te_(g(FE.teorico) + ' g')} × 0,90 = ${Re_(g(FE.real) + ' g')}</span><span class="note">La caja punteada marca el lugar de los ${g(FE.noFormado)} g que no se formaron: esa masa nunca existió como hierro. Del Fe₂O₃, ${g(FE.pura*0.1)} g quedan sin reaccionar.</span></div></div>
   <p class="fuente">Las tres opciones incorrectas salen de errores que suponemos frecuentes en los problemas de academia. Ningún estudio que hayamos leído los mide: son hipótesis nuestras, y la escena las va a poner a prueba.</p></div>` },
 { k:'Paso 3', t:'Uno después del otro', vista:() => vFe(true, 1),
   body:() => `<p>La pureza y el rendimiento actúan en lugares distintos. La pureza separa la muestra: solo el ${Pu_('Fe₂O₃ puro')} entra a la ecuación y la ${Im_('roca')} se queda afuera. El rendimiento actúa al final, sobre el producto: de la ${Te_('caja teórica')} solo se llena una parte con ${Re_('hierro real')}.</p>
   <div class="eqs"><div class="eq"><span class="ex">${Re_('real')} = 200 × 0,80 × (112 ÷ 160) × 0,90 = ${Re_(g(FE.real) + ' g')}</span><span class="note">112 ÷ 160 = 0,7: cada gramo de Fe₂O₃ da 0,7 g de Fe (masa → mol → mol → masa).</span></div>
   <div class="eq"><span class="ex">0,80 × 0,90 = 0,72 &nbsp;→&nbsp; 72 % de lo que darían 200 g de Fe₂O₃ puro: ${g(FE140)} × 0,72 = ${g(FE.real)} g</span><span class="note">Como se multiplican, da lo mismo el orden: primero la pureza o primero el rendimiento. Sumarlos y restar 100 no sale de ninguna cuenta con la masa.</span></div></div>
   <p class="hint">Cada variable tiene su color en el texto, en el dibujo y en las cuentas. Toca un color del texto para resaltarlo en el dibujo.</p>
   <p>El rendimiento se aplica una sola vez, al producto. Si se aplicara también al reactivo, saldrían ${g(FEe['rendimiento-dos-veces'])} g: el 90 % estaría contado dos veces.</p>` },
 { k:'Paso 4', t:'La cal viva: predice', gate:P1, vista:r => vCal(!!r, 1),
   anima: fin => animar(E, 1.2, f => { E.vista = vCal(true, f); }, () => { E.vista = vCal(true, 1); fin(); }, 0.2),
   body:() => `<p>En un horno se calientan 50 g de CaCO₃ puro: CaCO₃ → CaO + CO₂. Se obtienen 21 g de CaO (cal viva). Masas molares: CaCO₃ = 100 g/mol, CaO = 56 g/mol, CO₂ = 44 g/mol. ¿Cuál fue el rendimiento?</p>${opcionesHTML(P1.opts, 'fb')}
   <div id="tras" class="body" hidden><div class="eqs">
     <div class="eq"><span class="ex">50 ÷ 100 = 0,5 mol de CaCO₃ → 0,5 mol de CaO = ${Te_(g(CAL.teorico) + ' g')}</span></div>
     <div class="eq"><span class="ex">rendimiento = ${Re_('21 g')} ÷ ${Te_(g(CAL.teorico) + ' g')} × 100 = ${pct0(CAL.porcentaje)}</span><span class="note">Real y teórico tienen que ser del mismo producto.</span></div></div></div>` },
 { k:'Paso 5', t:'¿Adónde va lo que falta?: predice', gate:P2, vista:r => vBal(!!r, 1),
   anima: fin => animar(E, 2, f => { E.vista = vBal(true, f); }, () => { E.vista = vBal(true, 1); fin(); }, 0.2),
   body:() => `<p>La misma reacción, ahora en un recipiente cerrado sobre una balanza: 50 g de CaCO₃ puro y se forman 21 g de CaO, el ${pct0(CAL.porcentaje)} del ${Te_('teórico (' + g(BAL.teorico) + ' g)')}. Faltan ${g(BAL.falta)} g de CaO. ¿Qué hay en el recipiente al final?</p>${opcionesHTML(P2.opts, 'fb')}
   <div id="tras" class="body" hidden><div class="eqs">
     <div class="eq"><span class="ex">reacciona: 50 × 0,75 = ${g(BAL.reacciona)} g de CaCO₃ → ${Re_(g(BAL.formados.CaO) + ' g de CaO')} + ${g(BAL.formados.CO2)} g de CO₂</span></div>
     <div class="eq"><span class="ex">quedan: 50 − ${g(BAL.reacciona)} = ${Pu_(g(BAL.quedan.CaCO3) + ' g de CaCO₃')}</span></div>
     <div class="eq"><span class="ex">${g(BAL.formados.CaO)} + ${g(BAL.formados.CO2)} + ${g(BAL.quedan.CaCO3)} = ${g(BAL.total)} g</span><span class="note">Si el recipiente estuviera abierto, el CO₂ se escaparía y la balanza bajaría, pero esa masa no desaparece: está en el aire.</span></div></div>
   <p>En otras reacciones, lo que falta sale como otro producto. Al quemar 12 g de carbón con poco aire, si el 75 % del carbono forma CO₂ (${g(COMB.CO2)} g de ${g(COMB.teoricoCO2)} posibles), el resto forma ${g(COMB.CO)} g de CO. La masa cuadra igual: 12 + ${g(COMB.O2)} de O₂ = ${g(COMB.CO2)} + ${g(COMB.CO)}.</p>
   <p class="fuente">Las opciones 1 y 2 rompen la conservación de la masa o de los átomos. En un estudio con 79 escolares argentinos, solo cerca de 4 de cada 10 aceptó que la masa se conserva en un recipiente cerrado, y algo más de la mitad, que los átomos se reacomodan (Casado y Raviolo, 2005). Que aparezcan en este problema es una hipótesis nuestra.</p></div>` },
 { k:'Paso 6', t:'Al revés: predice', gate:P3, vista:r => vInv(!!r, 1),
   anima: fin => animar(E, 1.8, f => { E.vista = vInv(true, f); }, () => { E.vista = vInv(true, 1); fin(); }, 0.2),

   <div id="tras" class="body" hidden><div class="eqs">
     <div class="eq"><span class="ex">${Te_('teórico')} = ${Re_('42 g')} ÷ 0,75 = ${Te_(g(INV.teorico) + ' g de CaO')} = 1 mol</span></div>
     <div class="eq"><span class="ex">1 mol de CaO ← 1 mol de CaCO₃ = ${Pu_(g(INV.pura) + ' g')}</span></div>
     <div class="eq"><span class="ex">caliza = ${Pu_(g(INV.pura) + ' g')} ÷ 0,80 = ${g(INV.muestra)} g &nbsp;(${Im_(g(INV.impureza) + ' g')} de impureza)</span><span class="note">Hacia adelante se multiplica por la pureza y por el rendimiento; hacia atrás se divide. Comprobación: 125 × 0,80 = 100 g → 56 g → 56 × 0,75 = 42 g.</span></div></div></div>` },
 { k:'Paso 7', t:'Ahora explora tú', explora:true, vista:() => ({ paneles:[] }),
   body:() => `<div class="ctrls">
     <label class="campo" for="xR">Reacción del examen<select id="xR">${Object.entries(MR.REACCIONES).map(([k, r]) => `<option value="${k}">${r.texto}</option>`).join('')}</select></label>
     <div class="slider"><label for="xM"><span>Masa de la muestra</span><output id="xMo"></output></label><input id="xM" type="range" min="20" max="400" step="5" value="200"></div>
     <div class="slider"><label for="xP"><span>Pureza</span><output id="xPo"></output></label><input id="xP" type="range" min="10" max="100" step="1" value="80"></div>
     <div class="slider"><label for="xE"><span>Rendimiento</span><output id="xEo"></output></label><input id="xE" type="range" min="10" max="100" step="1" value="90"></div>
   </div>
   <div class="lect" id="live" aria-live="off"></div>
   <p class="hint">Baja la pureza y mira cómo crece la ${Im_('impureza')} sin cambiar la muestra. Baja el rendimiento y mira cómo la ${Te_('caja punteada')} se queda con más espacio vacío.</p>` },
];

// ----- Explorador -----
const X = { reac:'hierro', m:200, p:80, eta:90 };
function explorar(){
  const vivo = () => {
    const R = MR.REACCIONES[X.reac], d = MR.producir({ reaccion:X.reac, muestra:X.m, pureza:X.p, rendimiento:X.eta });
    const gas = R.gases.includes(R.producto);
    // Mientras el experimento 2 no tenga respuesta, el real, el teórico y la caja quedan tapados; el volumen, hasta el 3.
    const tapaM = !PRED_EXP['mejora'], tapaV = !PRED_EXP['gas'];
    $('xR').value = X.reac; $('xM').value = X.m; $('xP').value = X.p; $('xE').value = X.eta;
    $('xMo').textContent = g(X.m) + ' g'; $('xPo').textContent = X.p + ' %'; $('xEo').textContent = X.eta + ' %';
    const P = fx(R.producto), Rr = fx(R.reactivo);
    $('live').innerHTML = `<div class="fila"><span>${Pu_(g(d.pura, 1) + ' g de ' + Rr)} puro</span><span>${Im_(g(d.impureza, 1) + ' g')} de impureza</span><span>${g(d.n, 3)} mol de ${Rr}</span></div>
      <div class="fila">${tapaM ? `<span>real y teórico de ${P}: ? (responde primero el experimento 2 de «¿Qué pasa si…?»)</span>` : `<span>teórico: ${Te_(g(d.teorico, 2) + ' g de ' + P)}</span><span>real: ${Re_(g(d.real, 2) + ' g')}</span><span>no se formó: ${g(d.noFormado, 2)} g</span>`}</div>
      ${gas ? `<div class="fila"><span>${tapaV ? `Volumen en CN: ? (${DESCUBRE}, experimento 3)` : tapaM ? 'Volumen en CN: ?' : `Volumen en CN: ${Vo_(g(d.V, 2) + ' L')} (22,4 L por mol)`}</span></div>` : ''}
      <div class="fila"><span>${R.exceso ? `El ${fx(R.exceso)} está en exceso: no limita.` : 'Un solo reactivo: se descompone con el calor.'}</span></div>`;
    const mmax = Math.max(400, 400*MR.masaAMasa(X.reac, 1, R.reactivo, R.producto));
    E.vista = { ...vistaMuestra({ reac:X.reac, muestra:X.m, p:X.p, eta:X.eta, f:1, mmax, tapaReal:tapaM, tapaTxt:'primero, el experimento 2', tapaV }),
      pie: X.reac === 'hierro' ? 'Abajo, la muestra en casillas de 10 % de su masa; en la lupa, unidades Fe₂O₃.' : 'Abajo, la muestra en casillas de 10 % de su masa. Los gases van en globos (misma escala de masa).',
      desc:'' };
    E.dibujar();
  };
  $('xR').onchange = () => { X.reac = $('xR').value; vivo(); };
  $('xM').oninput = () => { X.m = +$('xM').value; vivo(); };
  $('xP').oninput = () => { X.p = +$('xP').value; vivo(); };
  $('xE').oninput = () => { X.eta = +$('xE').value; vivo(); };
  vivo();
}

// ----- Navegación -----
const dots = $('dots');
steps.forEach((s, n) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.textContent = n + 1; b.addEventListener('click', () => go(n)); li.appendChild(b); dots.appendChild(li);
});
function go(n){
  if (n < 0 || n >= steps.length || n > S.max || S.ocupado) return;
  const s = steps[n]; S.step = n; cortar(E);
  const r = s.gate ? !!S.pred[s.gate.id] : true;
  E.vista = s.vista(s.gate ? r : undefined);
  $('stepK').textContent = `${s.k} de ${steps.length}`;
  $('stepT').textContent = s.t;
  $('stepBody').innerHTML = s.body();
  pintarDots();
  // En el celular, el lienzo queda fijo arriba con una predicción pendiente y en el explorador (se ve al mover los deslizadores).
  E.compactar((s.gate && !S.pred[s.gate.id]) || !!s.explora);
  if (s.gate) prediccion(s);
  if (s.explora) explorar();
  nav(); E.dibujar(); E.describir();
}
function nav(){
  const s = steps[S.step];
  $('prev').disabled = S.step === 0 || S.ocupado;
  $('next').disabled = S.step === steps.length - 1 || (s.gate && !S.pred[s.gate.id]) || S.ocupado;
  $('next').textContent = s.gate && !S.pred[s.gate.id] ? 'Elige una opción' : 'Siguiente';
  pintarDots();
}
function pintarDots(){
  [...dots.querySelectorAll('button')].forEach((b, k) => {
    b.className = k === S.step ? 'on' : (k <= S.max ? 'done' : ''); b.disabled = k > S.max || S.ocupado;
    b.setAttribute('aria-label', k > S.max ? `Paso ${k + 1}, bloqueado` : `Ir al ${steps[k].k.toLowerCase()}: ${steps[k].t}`);
    if (k > S.max) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
    if (k === S.step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
}
function desbloquear(n){ if (n > S.max) S.max = n; }
function prediccion(s){
  const P = s.gate, btns = [...$('stepBody').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[P.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === P.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb'); fb.innerHTML = P.fb[p].replace(/ tabindex="0"/g, ''); fb.className = 'fb ' + (p === P.ok ? 'ok' : 'mal');
    const tras = $('tras'); if (tras) tras.hidden = false;
  };
  const t0 = Date.now();
  btns.forEach(b => b.addEventListener('click', () => {
    if (S.pred[P.id] || S.ocupado) return;
    const o = P.opts.find(q => q[0] === b.dataset.k);
    S.pred[P.id] = o[0]; desbloquear(S.step + 1); pintar();
    registrarPrediccion(P.id, o[0], o[0] === P.ok, o[2] || '', o[3] || '', t0);
    S.ocupado = true; nav();
    E.compactar(false);
    $('next').focus({ preventScroll:true });
    const paso = S.step;
    // En el celular, el dibujo sube a la vista y se anima después (nucleo/celular.js).
    Celular.alResponder($('cv'), () => { s.anima(() => { S.ocupado = false; nav(); E.describir(); }); E.describir(); },
      () => S.step === paso, { siNo:() => { S.ocupado = false; nav(); } });
  }));
  pintar();
}
$('next').addEventListener('click', () => { const s = steps[S.step]; if (S.ocupado || (s.gate && !S.pred[s.gate.id])) return; desbloquear(S.step + 1); go(S.step + 1); });
$('prev').addEventListener('click', () => go(S.step - 1));
alRedibujarTema(() => E.dibujar());
addEventListener('modo', () => {
  // Al volver de «¿Qué pasa si…?», el explorador se rehace: puede haber algo recién descubierto.
  if (!document.getElementById('m1').hidden && steps[S.step].explora && !S.ocupado) go(S.step);
  else { E.resize(); E.dibujar(); }
});
go(0);
})();
</script>

<script>
/* ================= MODO 2: ¿qué pasa si…? =================
   Todo hipótesis (informe de estequiometría, «Lo que no tiene respaldo»): rendimiento en dos pasos, pureza al 100 % contra
   rendimiento al 100 %, gas en condiciones normales desde caliza impura y equivalentes en una neutralización. */
(function(){
const $ = id => document.getElementById(id);
const E = crearEscena($('cv2'), 'desc2', 'm2', 'ley2');
const CAD = MR.rendimientoCadena([80, 60]), CADe = CAD.errores;

const GAS = MR.producir({ reaccion:'caliza', muestra:80, pureza:75, producto:'CO2' }), GASe = GAS.errores;
const GASpuro = MR.producir({ reaccion:'caliza', muestra:80, producto:'CO2' });
const NEU = MR.neutralizar('H2SO4', 98, 'NaOH'), NEUe = NEU.errores;
const pct0 = x => g(x, 0) + ' %';
const fila = (etq, real, teo, max, tapa) => tapa ? { etq, tapa:true, tapaAncho:max*0.4 } : { etq, segs:[{ k:'real', masa:real }, { k:'teo', masa:Math.max(0, teo - real), punteado:true }] };

const EXPS = [
  { id:'cadena', corto:'Dos pasos seguidos', ok:'b',
    q:`Un laboratorio fabrica un producto en dos pasos seguidos: el primero rinde 80 % y el segundo, 60 % (de lo que le entrega el primero). ¿Qué rendimiento tiene el proceso completo?`,
    opts:[['a', `${pct0(CADe['suma-porcentajes'])}: 80 + 60 − 100 = 40`, 'suma-porcentajes', RES('hipotesis', 'tabla de lo que no tiene respaldo: porcentajes sumados')],
          ['b', `${pct0(CAD.total)}: 0,80 × 0,60 = 0,48`],
          ['c', `${pct0(CADe['el-menor'])}: el menor de 80 y 60 es 60`, 'el-menor', RES('hipotesis', 'hipótesis nuestra')],
          ['d', `${pct0(CADe['promedio'])}: (80 + 60) ÷ 2 = 70`, 'promedio', RES('hipotesis', 'hipótesis nuestra')]],
    fb:{ a:`Restar puntos funciona solo si los dos porcentajes son del mismo total, y no lo son: el 60 % es de lo que salió del primer paso (80), no del máximo (100). El 60 % de 80 es ${g(CAD.total)}. ${HIPO}`,
      c:`El paso que rinde menos no basta: el primero ya perdió el 20 %, y el segundo pierde el 40 % de lo que quedó. Juntos dejan ${pct0(CAD.total)}, menos que cualquiera de los dos. ${HIPO}`,
      d:`El promedio no sigue a la masa: cada paso trabaja con lo que le deja el anterior. 0,80 × 0,60 = 0,48. ${HIPO}` },
    vista:(r, f) => { const t = r ? f : 0, fin = 80 - (80 - CAD.total)*t;
      return { paneles:[{ tipo:'barras', siempre:true, alto:44, max:100, filas:[
        { etq:[['lo que da la ecuación: ', 'ink', 700], ['100 %', 'teo', 800]], segs:[{ k:'teo', masa:100, punteado:true }] },
        fila([['tras el paso 1 (rinde 80 %): ', 'ink', 700], ['80 %', 'real', 800]], 80, 100, 100),
        r ? fila([['tras el paso 2 (rinde 60 %): ', 'ink', 700], [pct0(fin), 'real', 800]], fin, 100, 100) : fila([['tras el paso 2 (rinde 60 %): ?', 'ink', 700]], 0, 0, 100, true)] }],
        pie: r ? 'El segundo paso solo puede trabajar con el 80 % que le llegó: pierde el 40 % de eso, 32 puntos.' : 'Cada barra es lo que hay después de cada paso, como porcentaje del máximo.',
        vars: ['teo', 'real'], desc: r ? `Tras el primer paso queda el 80 por ciento; tras el segundo, el ${g(CAD.total)} por ciento.` : 'Barras del máximo y del primer paso; la del segundo paso está oculta.' }; },
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">0,80 × 0,60 = 0,48 &nbsp;→&nbsp; ${Re_(pct0(CAD.total))} del ${Te_('máximo')}</span><span class="note">Con más pasos, se siguen multiplicando: 90 %, 80 % y 50 % dejan 36 %. Por eso las síntesis largas rinden poco aunque cada paso rinda bien.</span></div></div>
      <p class="fuente">Las tres opciones incorrectas son errores que suponemos (hipótesis nuestras); no hay estudios que los midan en este tipo de problema.</p>` },
  { id:'mejora', corto:'Pureza o rendimiento', ok:'c',
    q:`Con 200 g de hematita al 80 % de Fe₂O₃ y 90 % de rendimiento se obtienen ${Re_(g(MEJ.real) + ' g de hierro')}. Una mina ofrece mineral puro (100 %); otra fábrica ofrece un horno que rinde 100 %. Con los mismos 200 g, ¿qué da más hierro?`,
    opts:[['a', `El horno al 100 %: el rendimiento actúa sobre el producto, y la pureza solo sobre el reactivo.`, 'rendimiento-pesa-mas', RES('hipotesis', 'hipótesis nuestra')],
          ['b', `Dan lo mismo: en los dos casos un porcentaje sube a 100 y el otro no cambia.`, 'dan-lo-mismo', RES('hipotesis', 'hipótesis nuestra')],
          ['c', `El mineral puro: pasar de 80 a 100 multiplica por más que pasar de 90 a 100.`],
          ['d', `Depende de la masa: con más mineral, el horno al 100 % terminaría ganando.`, 'depende-de-la-masa', RES('hipotesis', 'hipótesis nuestra')]],
    fb:{ a:`Los dos se multiplican en la misma cuenta: real = muestra × pureza × 0,7 × rendimiento. Da lo mismo dónde actúa cada uno; gana el que más crece. 80 → 100 es × ${g(MEJ.factorPureza)}; 90 → 100 es × ${g(MEJ.factorRendimiento)}. ${HIPO}`,
      b:`Los dos llegan a 100, pero desde lugares distintos: la pureza sube de 80 a 100 (× ${g(MEJ.factorPureza)}) y el rendimiento de 90 a 100 (× ${g(MEJ.factorRendimiento)}). ${HIPO}`,
      d:`Con más mineral crecen los dos casos en la misma proporción: si se duplica la muestra, se duplica el hierro en los dos. El que gana no cambia. ${HIPO}` },
    vista:(r, f) => { const t = r ? f : 0;
      return { paneles:[{ tipo:'barras', siempre:true, alto:44, max:T140, filas:[
        fila([['ahora (80 % y 90 %): ', 'ink', 700], [g(MEJ.real) + ' g', 'real', 800], [' de ', 'ink', 700], [g(MEJ.real/0.9) + ' g', 'teo', 800]], MEJ.real, MEJ.real/0.9, T140),
        r ? fila([['mineral puro (100 % y 90 %): ', 'ink', 700], [g(MEJ.conPureza*t, 1) + ' g', 'real', 800], [' de ', 'ink', 700], [g(T140) + ' g', 'teo', 800]], MEJ.conPureza*t, T140*t, T140)
          : fila([['mineral puro (100 % y 90 %): ?', 'ink', 700]], 0, 0, T140, true),
        r ? fila([['horno al 100 % (80 % y 100 %): ', 'ink', 700], [g(MEJ.conRendimiento*t, 1) + ' g', 'real', 800]], MEJ.conRendimiento*t, MEJ.conRendimiento*t, T140)
          : fila([['horno al 100 % (80 % y 100 %): ?', 'ink', 700]], 0, 0, T140, true)] }],
        pie: r ? 'Con el mineral puro, la caja teórica crece a 140 g y se llena al 90 %; con el horno perfecto, la caja de 112 g se llena entera.' : 'La barra llena es el hierro real; la punteada, el teórico que no se formó.',
        vars:['teo', 'real'], desc: r ? `Ahora ${g(MEJ.real)} gramos. Con mineral puro, ${g(MEJ.conPureza)} gramos. Con rendimiento de 100 por ciento, ${g(MEJ.conRendimiento)} gramos.` : 'Barra del hierro de ahora; las de las dos mejoras están ocultas.' }; },
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">mineral puro: 200 × 1,00 × 0,7 × 0,90 = ${Re_(g(MEJ.conPureza) + ' g')} &nbsp;·&nbsp; horno al 100 %: 200 × 0,80 × 0,7 × 1,00 = ${Re_(g(MEJ.conRendimiento) + ' g')}</span><span class="note">Pureza y rendimiento son dos factores de la misma multiplicación. Mejora más el que está más lejos de 100.</span></div></div>
      <p class="fuente">Las opciones incorrectas son hipótesis nuestras.</p>` },
  { id:'gas', corto:'El gas de la caliza', ok:'a',
    q:`Se calientan 80 g de caliza con 75 % de CaCO₃ hasta que todo el CaCO₃ se descompone: CaCO₃ → CaO + CO₂. ¿Qué volumen de CO₂ se obtiene en condiciones normales (22,4 L por mol)?`,
    opts:[['a', `${g(GAS.V)} L: los 60 g de CaCO₃ puro son 0,6 mol, y dan 0,6 mol de CO₂.`],
          ['b', `${g(GASpuro.V)} L: los 80 g de caliza son 0,8 mol de CaCO₃, y dan 0,8 mol de CO₂.`, 'muestra-pura', RES('hipotesis', 'tabla de lo que no tiene respaldo: muestra como si fuera pura')],
          ['c', `${g(GASe['masa-como-volumen'])} L: los 60 g de CaCO₃ dan ${g(GAS.real)} g de CO₂, que es lo que ocupa el gas.`, 'masa-como-volumen', RES('hipotesis', 'hipótesis nuestra')],
          ['d', `${g(GASe['coeficiente-como-moles'])} L: la ecuación da 1 mol de CO₂, y un mol de gas ocupa 22,4 L.`, 'coeficiente-como-moles', RES('hipotesis', 'hipótesis nuestra')]],
    fb:{ b:`La caliza no es CaCO₃ puro: solo el 75 % de los 80 g, ${Pu_('60 g')}, se descompone; los ${Im_('20 g')} de impureza no dan gas. 60 g son 0,6 mol y dan ${Vo_(g(GAS.V) + ' L')}. ${HIPO}`,
      c:`${Re_(g(GAS.real) + ' g')} es la masa del CO₂, no su volumen. Para el volumen se pasa a moles: 26,4 ÷ 44 = 0,6 mol, y 0,6 × 22,4 = ${Vo_(g(GAS.V) + ' L')}. ${HIPO}`,
      d:`El coeficiente 1 dice la proporción (1 mol de CO₂ por cada mol de CaCO₃), no cuántos moles hay. Hay 0,6 mol de CaCO₃ puro: ${Vo_(g(GAS.V) + ' L')}. ${HIPO}` },
    vista:(r, f) => r ? { ...vistaMuestra({ reac:'caliza', muestra:80, p:75, eta:100, producto:'CO2', reacciona:1, otro:'CaO', f }),
        pie:'El CaCO₃ se descompone todo: 33,6 g de CaO (gris) y 26,4 g de CO₂ (globo); la impureza queda.',
        desc:`Los 80 gramos de caliza se separan en 20 de impureza y 60 de carbonato puro, que dan ${g(GAS.real)} gramos de dióxido de carbono: ${g(GAS.V)} litros en condiciones normales.` }
      : { ...vistaMuestra({ reac:'caliza', muestra:80, p:75, eta:100, producto:'CO2', antes:true }), pie:'Un montón de caliza sin separar. El gas se ve al responder.', desc:'Un montón de 80 gramos de caliza y una caja oculta para el gas.' },
    dur:2.4,
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">80 × 0,75 = ${Pu_('60 g de CaCO₃')} = 0,6 mol → 0,6 mol de CO₂ = ${Re_(g(GAS.real) + ' g')} → 0,6 × 22,4 = ${Vo_(g(GAS.V) + ' L')}</span><span class="note">CN: 0 °C y 1 atm. A otra temperatura o presión, el mismo gas ocupa otro volumen (PV = nRT).</span></div></div>
      <p class="fuente">Las opciones incorrectas son hipótesis nuestras.</p>` },
  { id:'equivalentes', corto:'Ácido contra base', ok:'d',
    q:`¿Cuántos gramos de NaOH neutralizan exactamente 98 g de H₂SO₄? El H₂SO₄ tiene 2 H ácidos y el NaOH, un OH. Masas molares: H₂SO₄ = 98 g/mol y NaOH = 40 g/mol.`,
    opts:[['a', `${g(NEUe['theta-1'])} g: 98 g de H₂SO₄ son 1 equivalente, y piden 1 equivalente de NaOH.`, 'theta-1', RES('hipotesis', 'tabla de lo que no tiene respaldo: θ = 1 para todo')],
          ['b', `${g(NEUe['masas-iguales'])} g: para neutralizar hace falta la misma masa de base que de ácido.`, 'masas-iguales', RES('hipotesis', 'hipótesis nuestra')],
          ['c', `${g(NEUe['theta-multiplica'])} g: el equivalente del H₂SO₄ pesa 196 g, y 98 g son medio equivalente.`, 'theta-multiplica', RES('hipotesis', 'hipótesis nuestra')],
          ['d', `${g(NEU.masaBase)} g: 98 g de H₂SO₄ son 2 equivalentes, y piden 2 equivalentes de NaOH.`]],
    fb:{ a:`Con θ = 1, 98 g serían 1 equivalente, pero el H₂SO₄ tiene 2 H ácidos: θ = 2 y su equivalente pesa 98 ÷ 2 = 49 g. 98 g son ${Eq_('2 eq')}, y piden ${Eq_('2 eq')} de NaOH: 2 × 40 = ${g(NEU.masaBase)} g. ${HIPO}`,
      b:`La neutralización iguala equivalentes, no gramos: cada H⁺ del ácido necesita un OH⁻ de la base. 98 g de H₂SO₄ son ${Eq_('2 eq')} y piden ${Eq_('2 eq')} de NaOH, ${g(NEU.masaBase)} g. ${HIPO}`,
      c:`La masa equivalente se divide entre θ, no se multiplica: 98 ÷ 2 = 49 g por equivalente. 98 g son ${Eq_('2 eq')}. ${HIPO}` },
    vista:(r, f) => ({ paneles:[{ tipo:'fichas', unir: r ? f : 0, grupos:[
        { x:0.27, etq:[['H₂SO₄: 98 g', 'ink', 800]], n:2, tapa:!r, bajo: r ? [['θ = 2 · 49 g por ', 'ink', 700], ['eq', 'eq', 800]] : [['equivalentes: ?', 'muted', 700]] },
        { x:0.73, etq: r ? [['NaOH: ', 'ink', 800], [g(NEU.masaBase*Math.min(1, f*1.5)) + ' g', 'ink', 800]] : [['NaOH: ? g', 'ink', 800]], n:2, tapa:!r, bajo: r ? [['θ = 1 · 40 g por ', 'ink', 700], ['eq', 'eq', 800]] : [['equivalentes: ?', 'muted', 700]] }] }],
      pie: r ? 'Cada equivalente de ácido (un H⁺) se junta con uno de base (un OH⁻).' : 'Las fichas de equivalentes aparecen al responder.',
      vars: r ? ['eq'] : [], desc: r ? '98 gramos de ácido sulfúrico son 2 equivalentes y se juntan con 2 equivalentes de hidróxido de sodio: 80 gramos.' : 'Ácido sulfúrico e hidróxido de sodio; los equivalentes están ocultos.' }),
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">masa equivalente = M ÷ θ: H₂SO₄ 98 ÷ 2 = 49 g · NaOH 40 ÷ 1 = 40 g · Ca(OH)₂ 74 ÷ 2 = 37 g</span></div>
      <div class="eq"><span class="ex">${Eq_('eq')} de ácido = ${Eq_('eq')} de base: 98 ÷ 49 = ${Eq_('2 eq')} → 2 × 40 = ${g(NEU.masaBase)} g de NaOH</span><span class="note">Con moles da lo mismo: H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O; 1 mol de ácido con 2 mol de base. θ: en un ácido, los H ácidos; en una base, los OH; en una sal, la carga total de los cationes.</span></div></div>
      <p class="fuente">Las opciones incorrectas son hipótesis nuestras; el informe no encontró estudios con cifras sobre equivalentes.</p>` },
];
const S = { k:0, pred:PRED_EXP, t0:Date.now(), ocupado:false };
// Regla de Gerson: un experimento se abre solo si todos los anteriores ya tienen respuesta. Los respondidos se revisitan.
const abierto = k => EXPS.slice(0, k).every(x => S.pred[x.id]);
function botones(){
  $('exps').innerHTML = EXPS.map((x, k) => abierto(k)
    ? `<button type="button" aria-pressed="${k === S.k}" data-k="${k}"${S.ocupado ? ' disabled' : ''}>${k+1}. ${x.corto}</button>`
    : `<button type="button" aria-pressed="false" data-k="${k}" disabled aria-disabled="true" aria-label="Experimento ${k+1}, bloqueado">${k+1}. ${x.corto}</button>`).join('');
  $('exps').querySelectorAll('button').forEach(b => b.onclick = () => ir(+b.dataset.k));
}
function despues(x, fin){
  cortar(E); E.vista = x.vista(true, 0); E.dibujar();
  animar(E, x.dur || 1.4, f => { E.vista = x.vista(true, f); }, () => { E.vista = x.vista(true, 1); if (fin) fin(); }, 0.2);
}
function ir(k){
  if (!abierto(k) || S.ocupado) return;
  S.k = k; S.t0 = Date.now();
  const x = EXPS[k], ya = !!S.pred[x.id];
  cortar(E); E.vista = ya ? x.vista(true, 1) : x.vista(false, 0);
  E.compactar(!ya);
  botones();
  $('k2').textContent = `¿Qué pasa si…? · ${k+1} de ${EXPS.length}`;
  $('t2').textContent = x.corto;
  $('body2').innerHTML = `<p>${x.q}</p>${opcionesHTML(x.opts, 'fb2')}<div id="res2" class="body"></div>`;
  const btns = [...$('body2').querySelectorAll('.opt')];
  const explicar = () => {
    if (S.k !== k || !S.pred[x.id]) return;
    $('res2').innerHTML = x.exp() + `<div class="nav">${otraVez}${k < EXPS.length - 1 ? `<button type="button" class="btn primary" id="sig2">Siguiente: ${EXPS[k+1].corto}</button>` : ''}</div>`;
    const sig = $('sig2'); if (sig) sig.onclick = () => { if (S.ocupado) return; ir(k + 1); document.querySelector('#m2').scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); };
    const rep = $('res2').querySelector('[data-repetir]');
    if (rep) rep.onclick = () => { if (S.ocupado) return; Celular.alResponder($('cv2'), () => despues(x, () => E.describir()), () => S.k === k); };
  };
  const pintar = () => {
    const p = S.pred[x.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === x.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb2');
    fb.innerHTML = (p === x.ok ? '¡Bien pensado! Mira el dibujo y la explicación para ver por qué.' : `Elegiste la ${LETRAS.indexOf(p) + 1}. ${x.fb[p]} La correcta está marcada.`).replace(/ tabindex="0"/g, '');
    fb.className = 'fb ' + (p === x.ok ? 'ok' : 'mal');
    explicar();
  };
  btns.forEach(b => b.onclick = () => {
    if (S.pred[x.id] || S.ocupado) return;
    const o = x.opts.find(q => q[0] === b.dataset.k);
    S.pred[x.id] = o[0]; S.ocupado = true; pintar(); botones();
    registrarPrediccion('que-pasa-si-' + x.id, o[0], o[0] === x.ok, o[2] || '', o[3] || '', S.t0);
    E.compactar(false);
    Celular.alResponder($('cv2'), () => { despues(x, () => { S.ocupado = false; botones(); E.describir(); }); E.describir(); },
      () => S.k === k, { siNo:() => { S.ocupado = false; botones(); } });
  });
  pintar(); E.dibujar(); E.describir();
}
alRedibujarTema(() => E.dibujar());
addEventListener('modo', () => { E.resize(); E.dibujar(); });
ir(0);
})();
</script>

<script>
/* ================= Pestañas ================= */
(function(){
  const modos = [['#paso-a-paso', 'm1', 'tab1'], ['#que-pasa-si', 'm2', 'tab2']];
  function route(){
    const k = Math.max(0, modos.findIndex(m => m[0] === location.hash));
    modos.forEach(([, m, t], j) => {
      document.getElementById(m).hidden = j !== k;
      const a = document.getElementById(t);
      if (j === k) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    dispatchEvent(new Event('modo'));
  }
  addEventListener('hashchange', route); route();
})();
</script>
