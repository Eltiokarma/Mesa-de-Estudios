<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La ventana principal: funciones trigonométricas inversas</title>
<style>
/* Cáscara acogedora (crema, tarjetas cálidas, esquinas redondas; docs/diseno.md), del molde de identidades-trig.
   Dentro del dibujo y de las ecuaciones solo mandan los colores de las variables (regla 4): el ángulo que devuelve
   la inversa, θ, fucsia (como en circunferencia-trig); el número que recibe, k, petróleo (la altura, la abscisa o la
   lectura en la recta tangente: lo que se le da a la inversa); el otro ángulo, φ (el de partida o el segundo arco),
   naranja; y el lado que se busca en el triángulo de la compuesta, verde. Las curvas, los ejes y los demás cortes
   van en tinta o en gris; la ventana (el rango) se sombrea con el color de θ, porque es donde puede caer θ.
   Elegidos con CIEDE2000: ΔE00 mínimo 23,6 en claro y 25,3 en oscuro (k contra el verde, que solo salen juntos en
   el triángulo); contraste AA sobre el papel, la tarjeta y su chip (.v, fondo al 8 %): el más bajo es k en claro,
   4,63, y θ en oscuro, 4,64. El petróleo de k se parece al verde de «correcto» (ΔE00 11): el «correcto» siempre va
   con texto y borde. */
[hidden]{display:none!important}
:root{
  --bg:#fbf3ec; --card:#fffaf6; --paper:#fdf7f1; --ink:#2d2340; --muted:#716579; --line:#efe3dc; --grid:#efe2d8;
  --acento:#ffd3e2; --acento-ink:#5c1f3d; --ok:#1d7f58; --warn:#c8363b;
  --shadow:0 1px 2px rgba(92,52,110,.05),0 10px 28px rgba(92,52,110,.09);
  --c-th:#a10fbf; --c-k:#0f766e; --c-phi:#a05200; --c-r:#466d14;
  --relleno:.13;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#33293f;
  --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-th:#cf6bfa; --c-k:#5ed9c8; --c-phi:#f0a04a; --c-r:#a3d65e;
  --relleno:.17; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#33293f;
  --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-th:#cf6bfa; --c-k:#5ed9c8; --c-phi:#f0a04a; --c-r:#a3d65e;
  --relleno:.17; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--font); -webkit-text-size-adjust:100%}
.wrap{max-width:1240px; margin:0 auto; padding-block:18px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid; gap:16px}
.top{display:grid; gap:12px}
.eyebrow{margin:0; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700}
h1{margin:2px 0 0; font-size:clamp(1.65rem, 4.4vw, 2.1rem); line-height:1.1; letter-spacing:-.01em}
.sub{margin:4px 0 0; color:var(--muted); font-size:.95rem; max-width:60ch}

.tabs{display:flex; gap:4px; padding:5px; border-radius:999px; background:var(--card); box-shadow:var(--shadow); justify-self:start; max-width:100%}
.tabs a{padding:9px 16px; border-radius:999px; color:var(--muted); text-decoration:none; font-weight:700; white-space:nowrap; font-size:.95rem}
.tabs a[aria-current="page"]{background:var(--ink); color:var(--card)}
.tabs a:hover:not([aria-current]){color:var(--ink)}

.mode{display:grid; gap:16px; min-width:0; align-items:start}
@media (max-width:899px){
  .mode.pendiente .bench{position:sticky; top:0; z-index:1; padding:6px; gap:4px; background:var(--card); border-radius:0 0 20px 20px}
  .mode.pendiente .legend{display:none}
  .mode.pendiente .lecturas{gap:4px}
}
.bench{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:10px; display:grid; gap:8px; min-width:0}
.lienzo{border-radius:16px; overflow:hidden; background:var(--paper); border:1px solid var(--line)}
canvas{display:block; width:100%; touch-action:pan-y pinch-zoom; -webkit-user-select:none; user-select:none; outline:none}
.lienzo:focus-within{outline:3px solid var(--ink); outline-offset:2px}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; padding:2px 8px 4px; font-size:.82rem; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:12px; height:12px; border-radius:3px; display:inline-block; border:2px solid; opacity:.9}
.legend i.linea{width:16px; height:0; border-width:3px 0 0; border-radius:0}
.legend i.trazos{width:16px; height:0; border-width:2px 0 0; border-style:dashed; border-radius:0}

.guide{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:20px; display:grid; gap:14px; min-width:0}
.dots{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.dots button{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); color:var(--muted);
  font:700 .82rem var(--font); cursor:pointer; font-variant-numeric:tabular-nums}
.dots button.done{border-color:var(--ink); color:var(--ink)}
.dots button.on{background:var(--ink); border-color:var(--ink); color:var(--card)}
.dots button:disabled{opacity:.45; cursor:not-allowed}
#exps button:disabled{opacity:.45; cursor:not-allowed}
.step-k{display:inline-block; margin:0; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; font-weight:800;
  color:var(--acento-ink); background:var(--acento); border-radius:999px; padding:3px 10px}
.step-t{margin:8px 0 0; font-size:1.35rem; line-height:1.2; text-wrap:balance}
.body{display:grid; gap:12px; min-width:0}
.body p{margin:0; max-width:66ch}
.problem{border-left:4px solid var(--acento); padding:6px 0 6px 14px; font-size:1.06rem; max-width:66ch}

.v{font-weight:800; border-radius:6px; padding:0 3px; cursor:pointer; text-decoration:underline dotted 1.5px; text-underline-offset:3px; white-space:nowrap}
.v-th{color:var(--c-th); background:color-mix(in srgb, var(--c-th) 8%, transparent)}
.v-k{color:var(--c-k); background:color-mix(in srgb, var(--c-k) 8%, transparent)}
.v-phi{color:var(--c-phi); background:color-mix(in srgb, var(--c-phi) 8%, transparent)}
.v-r{color:var(--c-r); background:color-mix(in srgb, var(--c-r) 8%, transparent)}
.v.hl{background:transparent; outline:2px solid currentColor; outline-offset:1px}

.eqs{display:grid; gap:10px; padding:14px; border-radius:16px; background:var(--paper); border:1px solid var(--line); min-width:0}
.eq{font-family:var(--mono); font-size:1rem; line-height:1.9; font-variant-numeric:tabular-nums}
.eq .tramo{white-space:nowrap}
.eq .note{display:inline-block; font-family:var(--font); font-size:.84rem; line-height:1.3; color:var(--muted); margin-left:.5em; white-space:normal}
.aviso{background:var(--acento); color:var(--acento-ink); border-radius:16px; padding:10px 14px; font-size:.93rem}

.opts{display:grid; grid-template-columns:1fr; gap:8px}
@media (min-width:560px){ .opts{grid-template-columns:repeat(2, minmax(0,1fr))} }
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; padding:12px 14px; border-radius:16px; border:2px solid var(--line);
  background:var(--paper); color:var(--ink); font:inherit; cursor:pointer; min-height:48px}
.opt .l{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:.85rem;
  background:var(--card); border:1.5px solid var(--line)}
.opt .m{font-family:var(--mono); font-variant-numeric:tabular-nums}
.opt .m.frase{font-family:var(--font)}
@media (hover:hover){ .opt:hover:not(:disabled){border-color:var(--ink)} }
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 10%, var(--paper))}
.opt.correct .l{background:var(--ok); border-color:var(--ok); color:var(--card)}
.opt.wrong{border-color:var(--warn); background:color-mix(in srgb, var(--warn) 9%, var(--paper))}
.opt.wrong .l{background:var(--warn); border-color:var(--warn); color:var(--card)}
.fb{font-weight:700; margin:0}
.fb.ok{color:var(--ok)} .fb.mal{color:var(--warn)}

.seg{display:inline-flex; flex-wrap:wrap; gap:4px; padding:4px; border-radius:22px; background:var(--paper); border:1px solid var(--line); justify-self:start; max-width:100%}
.seg button{font:700 .9rem var(--font); padding:8px 14px; border-radius:999px; border:0; background:transparent; color:var(--muted); cursor:pointer; min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--card)}
.nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.pasos{display:flex; flex-wrap:wrap; gap:8px}
.btn{font:700 .95rem var(--font); padding:11px 20px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; min-height:44px}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--card)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn[aria-pressed="true"]{border-color:var(--ink)}
button:focus-visible, .v:focus-visible, a:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.hint{font-size:.88rem; color:var(--muted)}
.fuente{font-size:.86rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px}
.pie{margin:4px 0 0; text-align:center; color:var(--muted); font-size:.95rem}
.pie a{color:var(--ink); font-weight:700}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.volver-app{display:inline-block; margin:12px 16px 0; background:var(--card); color:var(--ink); box-shadow:var(--shadow);
  font:700 14px var(--font); padding:8px 16px; border-radius:999px; text-decoration:none}

.lecturas{display:grid; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); gap:8px}
.lecturas:empty{display:none}
.lectura{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:6px 10px; border-left:5px solid var(--k); min-width:0}
.lectura b{display:block; color:var(--k); font:800 .92rem var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lectura span{display:block; font-size:.76rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

@media (min-width:900px){
  .top{grid-template-columns:1fr auto; align-items:end}
  .mode{grid-template-columns:minmax(0, 1.3fr) minmax(360px, 1fr)}
  .bench{position:sticky; top:12px}
}
</style>

<script src="../../nucleo/medicion.js"></script>
<script src="../../nucleo/celular.js"></script>
<script>
// Registro anónimo de predicciones (nucleo/medicion.js). Solo guarda si el alumno entró por la app.
const PLANTILLA = { id: 'funciones-trig-inversas', unidad: 'trigonometria.funciones-trigonometricas-inversas', version: '0.1.0' };
function registrarPrediccion(problema, opcion, correcta, error, respaldo, t0){
  if (!window.Medicion) return;
  Medicion.guardar({ tipo: 'prediccion', modulo: PLANTILLA.id, unidad: PLANTILLA.unidad, problema, opcion, correcta,
    error: correcta ? '' : error, respaldo: correcta ? '' : respaldo, ms: t0 ? Date.now() - t0 : '' }, PLANTILLA.version);
}

/* ================= Piezas compartidas =================
   Toda la matemática (ángulos principales, cortes, compuestas, dominios, los puntos de la circunferencia y las
   curvas, y los errores típicos) sale de MotorInvTrig (motor.js); aquí solo se pinta, se arrastra y se anima. */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MI = MotorInvTrig;
const GR = Math.PI/180;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (n, d) => MI.decimal(n, d === undefined ? 2 : d);
const V = (k, t) => `<span class="v v-${k}" data-var="${k}" tabindex="0">${t}</span>`;
const th_ = t => V('th', t), k_ = t => V('k', t), phi_ = t => V('phi', t), r_ = t => V('r', t);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, f) => a + (b - a)*f;
const esperar = (ms, fn) => setTimeout(fn, RM ? 0 : ms);
const suave = f => f < .5 ? 2*f*f : 1 - Math.pow(-2*f + 2, 2)/2;
function tween(dur, paso, fin){
  if (RM || !dur){ paso(1); if (fin) setTimeout(fin, 0); return; }
  const t0 = performance.now();
  const tick = now => { const f = Math.min(1, (now - t0)/dur); paso(suave(f)); if (f < 1) requestAnimationFrame(tick); else if (fin) fin(); };
  requestAnimationFrame(tick);
}
// Una ecuación larga se parte solo entre tramos (después de ⟹, de = o de ;), nunca a media expresión.
function tramos(raiz){ raiz.querySelectorAll('.eq').forEach(q => { if (q.dataset.tr) return; q.dataset.tr = '1';
  const nota = q.querySelector('.note'), html = nota ? q.innerHTML.replace(nota.outerHTML, '') : q.innerHTML;
  q.innerHTML = html.split(/(⟹|;| = )/).reduce((a, p, i, l) => (i % 2 ? a : a + `<span class="tramo">${p}${l[i + 1] || ''}</span> `), '') + (nota ? ' ' + nota.outerHTML : ''); }); }
const opcionesHTML = (opts, idFb, frase) => `<div class="opts">${opts.map(([k, t]) => `<button class="opt" type="button" data-k="${k}"><span class="l">${k.toUpperCase()}</span><span class="m${frase ? ' frase' : ''}">${t}</span></button>`).join('')}</div><p class="fb" id="${idFb}" aria-live="polite"></p>`;
const KS = ['th', 'k', 'phi', 'r'];
function colores(){
  const c = { ink:css('--ink'), muted:css('--muted'), grid:css('--grid'), paper:css('--paper'), card:css('--card'), line:css('--line'),
    relleno:Number(css('--relleno')) || .13, font:css('--font') };
  for (const k of KS) c[k] = css('--c-' + k);
  return c;
}
const col = (c, k) => (c[k] || k);
function alRedibujarTema(fn){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', fn);
  new MutationObserver(fn).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
const ESCENAS = [];
function resaltar(k){ ESCENAS.forEach(E => { E.hl = k; E.dibujar(); }); document.querySelectorAll('.v').forEach(s => s.classList.toggle('hl', !!k && s.dataset.var === k)); }
document.addEventListener('mouseover', e => { const s = e.target.closest && e.target.closest('.v'); if (s) resaltar(s.dataset.var); });
document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('.v')) resaltar(null); });
document.addEventListener('focusin', e => { const s = e.target.closest && e.target.closest('.v'); resaltar(s ? s.dataset.var : null); });
const pt = (x, y) => ({ x, y });
const P_ = g => MI.punto(g);     // el punto de la circunferencia del ángulo g (grados)
const curva = (fn, de, a, o) => (o && o.inversa ? MI.muestras({ fn, inversa:true, desde:de, hasta:a, n:200 }) : MI.muestras({ fn, desde:de, hasta:a, n:360, tope:(o && o.tope) || 4 })).tramos.map(t => t.map(([x, y]) => pt(x, y)));
const ticksRad = (gs, lab) => gs.map(g => [g*GR, lab === false ? '' : MI.textoRad(g)]);
const ticksGr = gs => gs.map(g => [g*GR, MI.textoGrados(g)]);

/* ================= La escena =================
   Un plano en coordenadas del mundo (los ángulos en radianes) con piezas: bandas, ejes con marcas, curvas,
   la circunferencia, arcos de ángulo, segmentos, puntos, textos y manijas que se arrastran. Cada paso arma sus
   piezas con L.rehacer(L) a partir de L.estado; aspY estira el eje vertical (las gráficas de seno se leen mejor
   altas), y vale 1 cuando hay circunferencia o reflejo en la diagonal. */
function crearEscena(cv, idDesc, idLect, idLey){
  const E = { L:null, lect:[], ley:[], hl:null, ocupado:false, tok:0, cad:0, anim:false, compacto:false, desc:'' };
  ESCENAS.push(E);
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, arrastrando = null, sobre = null;
  const chico = () => innerWidth < 900;
  E.angosto = () => (cv.clientWidth || W) < 520;
  function alto(w){
    const L = E.L; if (!L) return 300;
    const B = L.caja, g = innerWidth >= 900 ? Math.max(300, Math.min(520, innerHeight - 220)) : 430;
    const h = Math.round(clamp(w*(B.y1 - B.y0)*(L.aspY || 1)/(B.x1 - B.x0), 220, g));
    return Celular.alto(h, E.compacto, { tope:250 });
  }
  function resize(){
    const w = cv.clientWidth; if (!w) return;
    const h = alto(w), dpr = window.devicePixelRatio || 1;
    if (w === W && h === H) { E.dibujar(); return; }
    W = w; H = h; cv.style.height = h + 'px'; cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    E.dibujar();
  }
  new ResizeObserver(resize).observe(cv);
  alRedibujarTema(() => E.dibujar());

  const VACIO = () => ({ bandas:[], rejilla:null, ejes:null, curvas:[], circ:null, arcos:[], segs:[], puntos:[], textos:[], manijas:[] });
  E.config = o => {
    E.tok++; E.cad++; E.anim = false;
    E.L = Object.assign({ caja:{ x0:-1.3, x1:1.3, y0:-1.3, y1:1.3 }, aspY:1, estado:{}, rehacer:null, mover:null, tecla:null }, VACIO(), o.L);
    E.lect = o.lect || []; E.ley = o.ley || []; E.desc = o.desc || '';
    E.rehacer();
    cv.tabIndex = E.L.manijas.length ? 0 : -1;
    W = 0; resize(); E.leyenda(); E.avisar();
  };
  E.rehacer = () => { const L = E.L; if (!L || !L.rehacer) return; Object.assign(L, VACIO()); L.rehacer(L, E); };
  E.compactar = on => { on = !!on; Celular.compactar(cv.closest('.mode'), on); if (on === E.compacto) return; E.compacto = on; W = 0; resize(); };
  E.redimensionar = () => { W = 0; resize(); };
  const grosor = (k, base) => (E.hl === k ? base + 2.5 : base);

  function escala(){
    const L = E.L, B = L.caja, pad = 12, a = L.aspY || 1;

const P8 = { id:'funciones-trig-inversas-paso8', ok:'a', opts:[

// ---------- piezas ----------
const NOT = ['0', '1/2', '√2/2', '√3/2', '1', '-1/2', '-√2/2', '-√3/2', '-1'];
// la altura que se arrastra: se pega a un notable si pasa cerca; si no, en centésimos
function pegar(y, lo, hi){
  y = clamp(y, lo, hi);
  for (const t of NOT){ const v = MI.exacto(t).valor; if (Math.abs(v - y) < .035) return t; }
  return Math.round(y*100)/100;
}
const kv = k => MI.exacto(k).valor, kt = k => (typeof k === 'number' ? fmt(k, 2) : MI.exacto(k).texto);
const ventanaSen = (o) => Object.assign({ x0:-Math.PI/2, x1:Math.PI/2, y0:-1.3, y1:1.6, color:'th', borde:true, texto:[['ventana', 'th']] }, o || {});
const BOX1 = { x0:-.75, x1:6.85, y0:-1.5, y1:1.75 };
const BOX2 = { x0:-5.05, x1:8.15, y0:-1.45, y1:1.75 };
const BOXC = { x0:-1.45, x1:1.45, y0:-1.38, y1:1.42 };
function ejes2(gr){
  const todos = [-270, -180, -90, 90, 180, 270, 360, 450], pocos = [-180, -90, 90, 180, 360];
  const lab = E.angosto() ? pocos : todos;
  return { x0:-4.95, x1:8.05, y0:-1.3, y1:1.62, tx: todos.map(g => [g*GR, lab.includes(g) ? (gr ? MI.textoGrados(g) : MI.textoRad(g)) : '']),
    ty:[[1, '1'], [-1, '−1']], nx:[['θ', 'th']] };
}
const LEY_G = [['ink', 'la onda del seno (altura sen θ)', 'linea'], ['k', 'la altura k', 'linea'], ['th', 'la ventana y el ángulo θ']];

// Paso 1
function config1(r){

      L.ejes = { x0:-.6, x1:6.75, y0:-1.35, y1:1.62, tx:ticksRad([90, 180, 270, 360]), ty:[[1, '1'], [-1, '−1']], nx:[['θ', 'th']], ny:[['sen θ', 'ink']] };
      L.curvas = [{ tramos:curva('sen', -40, 386), ancho:2.4 }];
      if (s.ky <= 1.6){ L.segs.push({ p:pt(-.6, s.ky), q:pt(6.75, s.ky), color:'k', ancho:2.6 });
        L.textos.push({ p:pt(s.ky >= 0 ? 4.2 : 1.6, s.ky), t:[[`k = ${kt(s.k)}`, 'k']], dy: s.ky >= 0 ? (s.ky > 1.2 ? 14 : -12) : (s.ky < -1.2 ? -12 : 14) }); }
      if (s.fc > 0){ const C = MI.cortes({ fn:'sen', k:s.k, desde:0, hasta:360 });

}

const lect2 = [E => ['k', 'k', kt(E.L.estado.k)], E => { const A = MI.arco({ fn:'sen', k:E.L.estado.k }); return ['th', 'arcsen k', A.existe ? A.texto : 'no existe']; }];
// El espejo: el tramo de la ventana se refleja en la diagonal y queda la gráfica de arcsen.
function espejo(f){
  E.config({ L:{ caja:{ x0:-2.05, x1:2.05, y0:-1.95, y1:1.95 }, aspY:1, estado:{ f, k:'1/2', libre: f >= 1 },
    rehacer:L => { const s = L.estado, F = s.f;
      const ramas = curva('sen', -90, 90).map(t => t.map(q => pt(lerp(q.x, q.y, F), lerp(q.y, q.x, F))));
      L.ejes = { x0:-1.95, x1:1.95, y0:-1.85, y1:1.85, tx: F >= 1 ? [[-1, '−1', 'k'], [1, '1', 'k']] : [[-Math.PI/2, '−π/2'], [Math.PI/2, 'π/2']],
        ty: F >= 1 ? [[-Math.PI/2, '−π/2', 'th'], [Math.PI/2, 'π/2', 'th']] : [[-1, '−1'], [1, '1']],
        nx: F >= 1 ? [['k', 'k']] : [['θ', 'th']], ny: F >= 1 ? [['arcsen k', 'th']] : [['sen θ', 'ink']] };
      L.segs.push({ p:pt(-1.8, -1.8), q:pt(1.8, 1.8), color:'muted', ancho:1.3, dash:true });
      L.curvas = [{ tramos:ramas, ancho:3, color: F >= 1 ? 'ink' : 'ink' }];
      if (s.libre){
        L.segs.push({ p:pt(-1, -.03), q:pt(1, -.03), color:'k', ancho:5, f:.55 }, { p:pt(.03, -Math.PI/2), q:pt(.03, Math.PI/2), color:'th', ancho:5, f:.45 });
        const v = kv(s.k), A = MI.arco({ fn:'sen', k:s.k });
        L.segs.push({ p:pt(v, -1.8), q:pt(v, 1.8), color:'k', ancho:2.2 });
        if (A.existe){ L.puntos.push({ p:pt(v, A.valor), color:'th', texto:A.texto, dx: v < 0 ? -26 : 26, dy:0 });
          L.segs.push({ p:pt(v, A.valor), q:pt(0, A.valor), color:'th', ancho:1.6, dash:true }); }
        L.manijas = [{ id:'k', p:pt(v, -1.7), color:'k' }];
      } },
    mover:(id, q, L) => { L.estado.k = pegar(q.x, -1.3, 1.3); },
    tecla:(id, d, L) => { L.estado.k = pegar(kv(L.estado.k) + d*.05, -1.3, 1.3); } },
    lect: f >= 1 ? lect2 : [], ley:[['ink', 'el tramo de la ventana (y su reflejo)', 'linea'], ['muted', 'la diagonal', 'trazos'], ['k', 'k'], ['th', 'arcsen k']],
    desc:'El tramo del seno dentro de la ventana, reflejado en la diagonal: queda la gráfica de arcsen, que recibe k entre −1 y 1 y devuelve un ángulo entre −π/2 y π/2.' });
}

// Paso 4: la circunferencia. arccos lee la abscisa y devuelve el ángulo de arriba (o arcsen: la altura y el de la derecha).
function config4(r){

        }
        if (s.f2 > 0){
          L.segs.push({ p:pt(.5, 0), q:M, color:'muted', ancho:1.4, dash:true, f:s.f2 });
          L.puntos.push({ p:M, color:'muted', hueco:true, f:s.f2 });
          L.arcos.push({ de:0, a:60, r:.5, color:'muted', ancho:2, dash:true, flecha:false, texto:[['π/3', 'muted']], f:s.f2, sep:12 },

        }

      }

      L.sector = cos ? { de:0, a:180, color:'th' } : { de:-90, a:90, color:'th' };
      if (cos) L.segs.push({ p:pt(P.x, -1.25), q:pt(P.x, 1.25), color:'k', ancho:1.4, dash:true }, { p:pt(0, 0), q:pt(P.x, 0), color:'k', ancho:5 });
      else L.segs.push({ p:pt(-1.25, P.y), q:pt(1.25, P.y), color:'k', ancho:1.4, dash:true }, { p:pt(P.x, 0), q:P, color:'k', ancho:5 });
      L.segs.push({ p:pt(0, 0), q:P, color:'th', ancho:2.2 });
      L.arcos.push({ de:0, a:s.g, r:.24, color:'th', texto:MI.textoGrados(s.g) });
      // el otro punto con la misma lectura (fuera del rango)

      if (Math.abs(Q.x - P.x) + Math.abs(Q.y - P.y) > .02) L.puntos.push({ p:Q, color:'muted', hueco:true });
      L.manijas = [{ id:'P', p:P, color:'th' }]; void A; },
    mover:(id, q, L) => { const s = L.estado; let g = Math.round(Math.atan2(q.y, q.x)/GR); if (s.modo === 'cos'){ if (g < -90) g += 360; s.g = clamp(g, 0, 180); } else s.g = clamp(g > 180 ? g - 360 : g, -90, 90); },

// Paso 5: el triángulo de la compuesta

    desc:'Un triángulo rectángulo con hipotenusa 5 y cateto opuesto 3 al ángulo θ; el cateto adyacente está marcado con un signo de pregunta.' });
}
const lect5 = [E => { const g = E.L.estado.g; return ['k', 'k = sen θ', g === null ? '3/5' : fmt(P_(g).y, 3)]; },

// Paso 6: la recta de arriba (arccot) y la de la derecha (arctan)

          L.arcos.push({ de:0, a:-45, r:.5, color:'muted', ancho:2, dash:true, flecha:false, texto:[[T6.texto, 'muted']], f:s.f2, sep:14 }); }
        return; }
      const A = MI.arco({ fn: cot ? 'cot' : 'tan', k:s.k }), Q = cot ? pt(s.k, 1) : pt(1, s.k), P = P_(A.angulo.grados);

        { de:Ca.angulo.grados, a:90, r:.3, color:'th', ancho:3, dash:true, texto:'θ', f:s.f2, flecha:false, sep:10 });
      if (s.libre) L.manijas = [{ id:'A', p:A, color:'th' }]; },
    mover:(id, q, L) => { const g = clamp(Math.atan2(q.y, q.x)/GR, 3, 87); L.estado.k = Math.round(P_(g).y*100)/100; },

}

function config8(r){
  E.config({ L:{ caja:{ x0:-2.4, x1:3.4, y0:-1.3, y1:1.15 }, aspY:1, estado:{ x:1.5, f: r ? 1 : 0, libre:r },

        L.segs.push({ p:pt(-2.3, y), q:pt(3.3, y), color:'muted', ancho:1.4, flecha:true });
        for (let n = -2; n <= 3; n++){ L.segs.push({ p:pt(n, y - .06), q:pt(n, y + .06), color:'muted', ancho:1.2 }); L.textos.push({ p:pt(n, y), t:[[MI.textoGrados(n).replace('°', ''), 'muted']], dy:16, peso:700, tam:11 }); }
        L.textos.push({ p:pt(-2.3, y), t:[[nombre, k]], align:'left', dy:-14 }); }
      L.textos.push({ p:pt(0, yB - .17), t:[['arcsen k existe', 'k']], dy:24 });
      if (s.f > 0){
        L.bandas.push({ x0:0, x1:1, y0:yA - .13, y1:yA + .13, color:'ink', alfa:.16, f:s.f });
        L.segs.push({ p:pt(0, yA - .08), q:pt(-1, yB + .1), color:'ink', ancho:1.6, dash:true, flecha:true, f:s.f }, { p:pt(1, yA - .08), q:pt(1, yB + .1), color:'ink', ancho:1.6, dash:true, flecha:true, f:s.f });
        L.textos.push({ p:pt(.5, yA + .13), t:[[D8.texto, 'ink']], dy:-12, f:s.f }); }
      if (s.libre){ const d = MI.dentro({ fn:'sen', a:'2', b:'-1', x:s.x }), u = clamp(d.u, -2.25, 3.25);
        L.segs.push({ p:pt(s.x, yA - .08), q:pt(u, yB + .1), color: d.dentro ? 'k' : 'muted', ancho:1.8, flecha:true });

        L.manijas = [{ id:'x', p:pt(s.x, yA), color:'ink' }]; } },
    mover:(id, q, L) => { L.estado.x = Math.round(clamp(q.x, -2.2, 3.2)*20)/20; },
    tecla:(id, d, L) => { L.estado.x = Math.round(clamp(L.estado.x + d*.05, -2.2, 3.2)*20)/20; } },
    lect: r ? lect8 : [], ley:[['ink', 'la recta de x', 'linea'], ['k', 'la recta de k = 2x − 1 y donde arcsen existe']],
    desc:'Dos rectas numéricas: arriba la de x; abajo la de k = 2x − 1, con el tramo de −1 a 1 sombreado, donde arcsen k existe.' });
}
const lect8 = [E => ['ink', 'x', fmt(E.L.estado.x, 2)], E => ['k', 'k = 2x − 1', fmt(MI.dentro({ fn:'sen', a:'2', b:'-1', x:E.L.estado.x }).u, 2)],
  E => { const d = MI.dentro({ fn:'sen', a:'2', b:'-1', x:E.L.estado.x }); return ['th', 'arcsen k', d.dentro ? MI.arco({ fn:'sen', k:Math.round(d.u*100)/100 }).textoG : 'no existe']; }];

});
function go(k){
  if (k < 0 || k >= steps.length || k > S.max || S.ocupado) return;

  $('next').textContent = s.gate && !S.pred[s.gate.id] ? 'Elige una opción' : 'Siguiente';

      () => S.step === paso, { siNo:() => { S.ocupado = false; nav(); } });
  }));

$('next').addEventListener('click', () => { desbloquear(S.step + 1); go(S.step + 1); });
$('prev').addEventListener('click', () => go(S.step - 1));
addEventListener('modo', () => { if (!$('m1').hidden) E.redimensionar(); });
go(0);
})();

    exp:() => `<div class="eqs"><div class="eq">cos(${phi_('−60°')}) = cos 60° = ${k_('1/2')}  ⟹  arccos(${k_('1/2')}) = ${th_(D2.texto)}</div></div>
      <p>El punto de ${phi_('−60°')} y el de 60° tienen la misma abscisa: son reflejos en el eje horizontal. arccos devuelve el de arriba. Arrastra ${phi_('φ')} por toda la circunferencia (o usa ← y →): cuando ${phi_('φ')} está arriba, el resultado es ${phi_('φ')}; cuando está abajo, sale su reflejo.</p><p class="fuente">${hip}</p>` },
  { id:'tangente-enorme', corto:'Una tangente enorme',
    q:`¿Cuánto vale arctan ${k_('1000')}, en grados?`,
    opts:[['a', T3.errores.rangoCerrado.textoG, 'IN18-rango-cerrado', 'hipotesis'], ['b', T3.textoG], ['c', T3.errores.comoCot.textoG, 'IN26-confunde-arctan-y-arccot', 'hipotesis'],
      ['d', T3.errores.mezcla.textoG, 'IN20-mezcla-grados-y-radianes', 'hipotesis']], ok:'b',
    fb:{ a:'90° no se alcanza: tan 90° no existe, y el rayo vertical nunca corta la recta de la derecha. El rango de arctan es abierto.',
      c:'≈ 0,06° es arccot 1000: la cotangente se lee en la recta de arriba.',
      d:'≈ 1,57 es el valor en radianes; escrito con «°» se mezclan las unidades. En grados es casi 90°.' },
    antes:ya => cfg3(ya), despues:() => { cfg3(false); const s = E.L.estado; s.f = 1; E.animar(2200, f => { s.k = Math.round(Math.pow(1000, f)*100)/100; }, () => cfg3(true)); },
    exp:() => `<div class="eqs"><div class="eq">arctan ${k_('1000')} ≈ ${fmt(T3.valor, 4)} rad</div><div class="eq">≈ ${fmt(T3.valor, 4)} rad ≈ ${fmt(T3.angulo.grados, 2)}°<span class="note">muy cerca de 90° = π/2, sin llegar</span></div></div>
      <p>Cuanto más arriba está la lectura ${k_('k')} en la recta de la derecha, más se para el rayo, pero nunca llega a la vertical: por eso el rango de arctan es ⟨−π/2; π/2⟩, abierto. Arrastra ${k_('k')} (o usa ← y →).</p><p class="fuente">${hip}</p>` },
  { id:'lo-que-dice-el-exponente', corto:'Lo que dice el ⁻¹',
    q:`La calculadora está en radianes. ¿Qué número muestra sen⁻¹(${k_('0,5')})?`,
    opts:[['a', N4.errores.reciprocoNumero.decimal, 'IN6-exponente-al-numero', 'hipotesis'], ['b', N4.errores.reciprocaFuncion.decimal, 'IN5-inversa-como-reciproca', 'hipotesis'],
      ['c', N4.decimal], ['d', N4.errores.otraInversa.decimal, 'IN7-confunde-arcsen-y-arccos', 'hipotesis']], ok:'c',
    fb:{ a:'2 = 1/0,5 es el recíproco del número. sen⁻¹ es la función inversa del seno: da un ángulo.',
      b:'≈ 2,09 = 1/sen(0,5) es la cosecante de 0,5 rad. Esa se escribe (sen 0,5)⁻¹ o csc 0,5, no sen⁻¹ 0,5.',
      d:'≈ 1,05 = π/3 es arccos(0,5), el ángulo de abscisa 0,5. sen⁻¹ lee la altura.' },
    antes:ya => cfg4(ya), despues:() => { cfg4(false); const s = E.L.estado; s.f = .001; E.animar(1100, f => { s.f = f; }, () => cfg4(true)); },
    exp:() => `<div class="eqs"><div class="eq">sen⁻¹(${k_('0,5')}) = arcsen(${k_('0,5')}) = ${th_(N4.angulo.texto)} ≈ ${th_(N4.decimal.replace('≈ ', ''))}</div></div>
      <p>En la circunferencia de radio 1, un ángulo en radianes es el largo de su arco. El arco que llega a la altura ${k_('0,5')} mide π/6 ≈ 0,52. El ⁻¹ de sen⁻¹ no es un exponente: quiere decir «la función que deshace al seno». El exponente −1 va con paréntesis: (sen x)⁻¹ = csc x. Arrastra el punto (o usa ← y →).</p>
      <p class="fuente">El informe registra como hipótesis, sin estudio con cifras, un error de notación parecido (TR17: leer sen²x como sen(x²)). Leer el ⁻¹ como «uno entre» es una hipótesis nuestra.</p>` },
  { id:'dos-arcos-tangentes', corto:'Dos arcos seguidos',
    q:`¿A qué es igual ${th_('arctan(1/2)')} + ${phi_('arctan(1/3)')}?`,
    opts:[['a', S5.errores.lineal.textoArctan, 'IN21-arctan-lineal', 'hipotesis'], ['b', S5.textoArctan], ['c', S5.errores.signoDen.textoArctan, 'IN22-signo-del-denominador', 'hipotesis'],
      ['d', S5.errores.producto.textoArctan, 'IN23-arctan-del-producto', 'hipotesis']], ok:'b',
    fb:{ a:'arctan(5/6) suma los números. Los ángulos se suman, pero las tangentes no: tan(θ + φ) = (tan θ + tan φ)/(1 − tan θ tan φ).',
      c:'arctan(5/7) usa 1 + tan θ tan φ en el denominador: en la suma va 1 − tan θ tan φ.',
      d:'arctan(1/6) multiplica los números: sumar ángulos no es multiplicar tangentes.' },
    antes:ya => cfg5(ya ? 1 : 0), despues:() => { cfg5(0); const s = E.L.estado; E.animar(1500, f => { s.f = f; }, () => cfg5(1)); },
    exp:() => `<div class="eqs"><div class="eq">tan(${th_('θ')} + ${phi_('φ')}) = (1/2 + 1/3)/(1 − 1/2 · 1/3) = (5/6)/(5/6) = 1</div>
      <div class="eq">${th_('θ')} + ${phi_('φ')} = arctan(1) = ${S5.texto}<span class="note">porque 1/2 · 1/3 &lt; 1</span></div></div>
      <p>En la cuadrícula: la flecha (2;&nbsp;1) tiene pendiente 1/2 y la (3;&nbsp;1), pendiente 1/3. Al poner el ángulo ${phi_('φ')} a continuación de ${th_('θ')}, la flecha cae sobre la diagonal, donde la pendiente es 1: el ángulo es 45° = π/4, como dice la fórmula. Si el producto de los números pasa de 1, hay que sumar π: arctan 2 + arctan 3 = 3π/4.</p><p class="fuente">${hip}</p>` },
];

const S = { k:0, pred:{}, t0:Date.now() };
const abierto = k => EXPS.slice(0, k).every(x => !!S.pred[x.id]);
function botones(){
  $('exps').innerHTML = EXPS.map((x, k) => abierto(k)
    ? `<button type="button" aria-pressed="${k === S.k}" data-k="${k}">${k+1}. ${x.corto}</button>`
    : `<button type="button" aria-pressed="false" data-k="${k}" disabled aria-disabled="true" aria-label="Experimento ${k+1}, bloqueado">${k+1}</button>`).join('');
  $('exps').querySelectorAll('button').forEach(b => b.onclick = () => ir(+b.dataset.k));
}
function ir(k){
  if (k < 0 || k >= EXPS.length || !abierto(k)) return;
  E.parar();
  S.k = k; S.t0 = Date.now();
  const x = EXPS[k], ya = !!S.pred[x.id];
  x.antes(ya);
  E.compactar(!ya);
  botones();
  $('k2').textContent = `¿Qué pasa si…? · ${k+1} de ${EXPS.length}`;
  $('t2').textContent = x.corto;
  $('body2').innerHTML = `<p class="problem">${x.q}</p>${opcionesHTML(x.opts, 'fb2', x.frase)}<div id="res2" class="body"></div>`;
  const btns = [...$('body2').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[x.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === x.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb2');
    fb.textContent = p === x.ok ? '¡Bien pensado! Mira la escena para ver por qué.' : `Elegiste la ${p.toUpperCase()}. ${x.fb[p]} La correcta está marcada.`;
    fb.className = 'fb ' + (p === x.ok ? 'ok' : 'mal');
    $('res2').innerHTML = x.exp() + `<div class="nav"><button type="button" class="btn" id="otra2">Ver otra vez</button>${k < EXPS.length - 1 ? `<button type="button" class="btn primary" id="sig2">Siguiente: ${EXPS[k+1].corto}</button>` : ''}</div>`;
    tramos($('res2'));
    const sig = $('sig2'); if (sig) sig.onclick = () => { ir(k + 1); document.querySelector('#m2').scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); };
    $('otra2').onclick = () => { E.parar(); Celular.alResponder($('cv2'), () => x.despues(), () => S.k === k); };
  };
  btns.forEach(b => b.onclick = () => {
    if (S.pred[x.id]) return;
    const o = x.opts.find(q => q[0] === b.dataset.k);
    S.pred[x.id] = o[0]; pintar(); botones();
    E.compactar(false);
    registrarPrediccion('que-pasa-si-' + x.id, o[0], o[0] === x.ok, o[2] || '', o[3] || '', S.t0);
    Celular.alResponder($('cv2'), () => x.despues(), () => S.k === k);
  });
  pintar();
}
addEventListener('modo', () => { if (!$('m2').hidden) E.redimensionar(); });
ir(0);
})();
</script>

<script>
/* ================= Pestañas ================= */
(function(){
  const modos = [['#paso-a-paso', 'm1', 'tab1'], ['#que-pasa-si', 'm2', 'tab2']];
  function route(){
    const k = Math.max(0, modos.findIndex(m => m[0] === location.hash));
    modos.forEach(([, m, t], j) => {
      document.getElementById(m).hidden = j !== k;
      const a = document.getElementById(t);
      if (j === k) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    dispatchEvent(new Event('modo'));
  }
  addEventListener('hashchange', route); route();
})();
</script>
