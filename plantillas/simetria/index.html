<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El espejo en la cuadrícula</title>
<style>
/* Cáscara acogedora (crema, tarjetas cálidas, esquinas redondas; docs/diseno.md).
   Dentro del dibujo y de las ecuaciones solo mandan los colores de las variables (regla 4):
   la figura original (P, A, B, C, la bandera) azul; su imagen (P', A', B', C') fucsia; el espejo L (o L₁, los ejes y el
   plano de simetría) naranja; el pie H y la distancia d turquesa; el centro O verde; el segundo espejo L₂ oliva y la
   imagen final después de los dos espejos (P'') granate, con la traslación o el giro que la lleva.
   Entre las variables que salen juntas, ΔE00 ≥ 25; con la tinta y el gris, ≥ 20. */
[hidden]{display:none!important}
:root{
  --bg:#fbf3ec; --card:#fffaf6; --paper:#fdf7f1; --ink:#2d2340; --muted:#716579; --line:#efe3dc; --grid:#f3e8e0;
  --acento:#ffd3e2; --acento-ink:#5c1f3d; --ok:#1d7f58; --warn:#c8363b;
  --shadow:0 1px 2px rgba(92,52,110,.05),0 10px 28px rgba(92,52,110,.09);
  --c-F:#1f5fbf; --c-I:#a10fbf; --c-E:#a05200; --c-H:#0f766e; --c-O:#466d14; --c-S:#5f6f00; --c-J:#77032c;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-F:#7cb0ff; --c-I:#cf6bfa; --c-E:#f0a04a; --c-H:#5ed9c8; --c-O:#a3d65e; --c-S:#c8dc3c; --c-J:#ff8fa3;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-F:#7cb0ff; --c-I:#cf6bfa; --c-E:#f0a04a; --c-H:#5ed9c8; --c-O:#a3d65e; --c-S:#c8dc3c; --c-J:#ff8fa3;
  color-scheme:dark }

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--font); -webkit-text-size-adjust:100%}
.wrap{max-width:1240px; margin:0 auto; padding-block:18px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid; gap:16px}
.top{display:grid; gap:12px}
.eyebrow{margin:0; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700}
h1{margin:2px 0 0; font-size:clamp(1.65rem, 4.4vw, 2.1rem); line-height:1.1; letter-spacing:-.01em}
.sub{margin:4px 0 0; color:var(--muted); font-size:.95rem; max-width:60ch}

.tabs{display:flex; gap:4px; padding:5px; border-radius:999px; background:var(--card); box-shadow:var(--shadow); justify-self:start; max-width:100%}
.tabs a{padding:9px 16px; border-radius:999px; color:var(--muted); text-decoration:none; font-weight:700; white-space:nowrap; font-size:.95rem}
.tabs a[aria-current="page"]{background:var(--ink); color:var(--card)}
.tabs a:hover:not([aria-current]){color:var(--ink)}

.mode{display:grid; gap:16px; min-width:0; align-items:start}
.bench{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:10px; display:grid; gap:8px; min-width:0}
.lienzo{border-radius:16px; overflow:hidden; background:var(--paper); border:1px solid var(--line)}
canvas{display:block; width:100%; touch-action:pan-y pinch-zoom; -webkit-user-select:none; user-select:none}
canvas:focus-visible{outline:3px solid var(--ink); outline-offset:-3px}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; padding:2px 8px 4px; font-size:.82rem; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:4px; border-radius:2px; display:inline-block}

.guide{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:20px; display:grid; gap:14px; min-width:0}
.dots{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.dots button{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); color:var(--muted);
  font:700 .82rem var(--font); cursor:pointer; font-variant-numeric:tabular-nums}
.dots button.done{border-color:var(--ink); color:var(--ink)}
.dots button.on{background:var(--ink); border-color:var(--ink); color:var(--card)}
.dots button:disabled{opacity:.45; cursor:not-allowed}
#exps button:disabled{opacity:.45; cursor:not-allowed}
.step-k{display:inline-block; margin:0; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; font-weight:800;
  color:var(--acento-ink); background:var(--acento); border-radius:999px; padding:3px 10px}
.step-t{margin:8px 0 0; font-size:1.35rem; line-height:1.2; text-wrap:balance}
.body{display:grid; gap:12px; min-width:0}
.body p{margin:0; max-width:66ch}
.problem{border-left:4px solid var(--acento); padding:6px 0 6px 14px; font-size:1.06rem; max-width:66ch}

.v{font-weight:800; border-radius:6px; padding:0 3px; cursor:pointer; text-decoration:underline dotted 1.5px; text-underline-offset:3px}
.v-F{color:var(--c-F); background:color-mix(in srgb, var(--c-F) 8%, transparent)}
.v-I{color:var(--c-I); background:color-mix(in srgb, var(--c-I) 8%, transparent)}
.v-E{color:var(--c-E); background:color-mix(in srgb, var(--c-E) 8%, transparent)}
.v-H{color:var(--c-H); background:color-mix(in srgb, var(--c-H) 8%, transparent)}
.v-O{color:var(--c-O); background:color-mix(in srgb, var(--c-O) 8%, transparent)}
.v-S{color:var(--c-S); background:color-mix(in srgb, var(--c-S) 8%, transparent)}
.v-J{color:var(--c-J); background:color-mix(in srgb, var(--c-J) 8%, transparent)}
.v.hl{background:transparent; outline:2px solid currentColor; outline-offset:1px}

.eqs{display:grid; gap:10px; padding:14px; border-radius:16px; background:var(--paper); border:1px solid var(--line); overflow-x:auto}
.eq{display:flex; flex-wrap:wrap; align-items:center; gap:.42em; font-family:var(--mono); font-size:1.02rem; font-variant-numeric:tabular-nums}
.eq .note{font-family:var(--font); font-size:.84rem; color:var(--muted); margin-left:.5em; white-space:normal}
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.15}
.frac > span:first-child{border-bottom:1.5px solid currentColor; padding:0 .25em; align-self:stretch; text-align:center}
.frac > span:last-child{padding:0 .25em}
.aviso{background:var(--acento); color:var(--acento-ink); border-radius:16px; padding:10px 14px; font-size:.93rem}

.opts{display:grid; grid-template-columns:1fr; gap:8px}
@media (min-width:560px){ .opts{grid-template-columns:repeat(2, minmax(0,1fr))} }
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; padding:12px 14px; border-radius:16px; border:2px solid var(--line);
  background:var(--paper); color:var(--ink); font:inherit; cursor:pointer; min-height:48px}
.opt .l{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:.85rem;
  background:var(--card); border:1.5px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 10%, var(--paper))}
.opt.correct .l{background:var(--ok); border-color:var(--ok); color:var(--card)}
.opt.wrong{border-color:var(--warn); background:color-mix(in srgb, var(--warn) 9%, var(--paper))}
.opt.wrong .l{background:var(--warn); border-color:var(--warn); color:var(--card)}
.fb{font-weight:700; margin:0}
.fb.ok{color:var(--ok)} .fb.mal{color:var(--warn)}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:.86rem; padding:4px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); font-weight:700}
.seg{display:inline-flex; flex-wrap:wrap; gap:4px; padding:4px; border-radius:999px; background:var(--paper); border:1px solid var(--line); justify-self:start; max-width:100%}
.seg button{font:700 .9rem var(--font); padding:8px 14px; border-radius:999px; border:0; background:transparent; color:var(--muted); cursor:pointer; min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--card)}
.exps{border-radius:20px}
.check{display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:.92rem; cursor:pointer; min-height:44px}
.check input{width:20px; height:20px; accent-color:var(--ink)}

.nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.btn{font:700 .95rem var(--font); padding:11px 20px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; min-height:44px}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--card)}
.btn:disabled{opacity:.45; cursor:not-allowed}
button:focus-visible, .v:focus-visible, input:focus-visible, a:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.hint{font-size:.88rem; color:var(--muted)}
.fuente{font-size:.86rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px}
.pie{margin:4px 0 0; text-align:center; color:var(--muted); font-size:.95rem}
.pie a{color:var(--ink); font-weight:700}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.volver-app{display:inline-block; margin:12px 16px 0; background:var(--card); color:var(--ink); box-shadow:var(--shadow);
  font:700 14px var(--font); padding:8px 16px; border-radius:999px; text-decoration:none}

/* Pantalla grande (laboratorio de cómputo, 1366 × 768): dibujo a la izquierda, fijo; guía a la derecha. */
@media (min-width:900px){
  .top{grid-template-columns:1fr auto; align-items:end}
  .mode{grid-template-columns:minmax(0, 1.3fr) minmax(360px, 1fr)}
  .bench{position:sticky; top:12px}
}
.seg button:disabled{opacity:.45; cursor:not-allowed}
.vivo-ok{color:var(--ok); font-weight:800}
.vivo-no{color:var(--warn); font-weight:800}
</style>

    </header>
    <nav class="tabs" aria-label="Modo de la escena">

<script>

<script src="motor.js"></script>
<script src="../../nucleo/medicion.js"></script>
<script src="../../nucleo/celular.js"></script>
<script>
// Registro anónimo de predicciones (nucleo/medicion.js). Solo guarda si el alumno entró por la app.
const PLANTILLA = { id: 'simetria', unidad: 'geometria.simetria', version: '0.1.0' };
function registrarPrediccion(problema, opcion, correcta, error, respaldo, t0){
  if (!window.Medicion) return;
  Medicion.guardar({ tipo: 'prediccion', modulo: PLANTILLA.id, unidad: PLANTILLA.unidad, problema, opcion, correcta,
    error: correcta ? '' : error, respaldo: correcta ? '' : respaldo, ms: t0 ? Date.now() - t0 : '' }, PLANTILLA.version);
}

/* ================= Piezas de dibujo compartidas =================
   Toda la geometría sale de MotorSimetria (motor.js): reflejos, pies, centros, giros, ejes, planos y cortes.
   Aquí solo se pinta y se pasa de coordenadas del problema a píxeles. */
const M = MotorSimetria;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = Celular.variable; // guardada hasta que cambie el tema o el tamaño (nucleo/celular.js)
function fmt(n, d){
  if (n === null || n === undefined || !Number.isFinite(n)) return '—';
  const p = Math.pow(10, d === undefined ? 1 : d), r = Math.round(n*p)/p + 0;
  const [e, f] = String(Math.abs(r)).split('.');
  return (r < 0 ? '−' : '') + e + (f ? ',' + f : '');
}
const pt = (P, d) => `(${fmt(P.x, d)}; ${fmt(P.y, d)})`;
const gr = (n, d) => fmt(n, d === undefined ? 0 : d) + '°';
const V = (k, t) => `<span class="v v-${k}" data-var="${k}" tabindex="0">${t}</span>`;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const RAD = Math.PI/180;
const CLAVES = ['F','I','E','H','O','S','J'];
function colores(hl){
  const o = { ink:css('--ink'), muted:css('--muted'), grid:css('--grid'), paper:css('--paper'), card:css('--card'), line:css('--line'),
    font:css('--font'), ok:css('--ok'), warn:css('--warn'), hl };
  CLAVES.forEach(k => o[k] = css('--c-' + k));
  return o;
}
const LEYENDA = { F:'la figura (original)', I:'su imagen', E:'el espejo L', H:'el pie H y la distancia', O:'el centro O', S:'el segundo espejo', J:'la imagen final' };
function leyenda(el, claves, textos){ el.innerHTML = claves.map(k => `<span><i style="background:var(--c-${k})"></i>${(textos && textos[k]) || LEYENDA[k]}</span>`).join(''); }

function crearLienzo(cv, alto, dibujar){
  const ctx = cv.getContext('2d');
  const L = { cv, ctx, W:0, H:0, compacto:false };
  L.resize = () => {
    const W = cv.clientWidth; if (!W) return;
    const H = Math.round(Celular.alto(alto(W), L.compacto)), dpr = Celular.dpr();
    L.W = W; L.H = H; cv.style.height = H + 'px'; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    dibujar();
  };
  new ResizeObserver(L.resize).observe(cv);
  L.compactar = on => { on = !!on; Celular.compactar(cv.closest('.mode'), on); if (on === L.compacto) return; L.compacto = on; L.resize(); };
  return L;
}
function alRedibujarTema(fn){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', fn);
  new MutationObserver(fn).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
function linea(ctx, x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function rotulo(ctx, c, x, y, t, color, align, tam){
  ctx.font = `800 ${tam || 12}px ${c.font}`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(t).width, x0 = align === 'left' ? x : align === 'right' ? x - w : x - w/2;
  ctx.save(); ctx.fillStyle = c.paper; ctx.globalAlpha = .88; ctx.fillRect(x0 - 3, y - 9, w + 6, 18); ctx.restore();
  ctx.fillStyle = color; ctx.fillText(t, x, y);
  return w;
}
function punto(ctx, x, y, r, color, borde){
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill();
  if (borde){ ctx.strokeStyle = borde; ctx.lineWidth = 2; ctx.stroke(); }
}
function mango(ctx, c, x, y, color, activo){
  ctx.save(); ctx.globalAlpha = .18; punto(ctx, x, y, activo ? 17 : 14, color); ctx.restore();
  punto(ctx, x, y, 8, c.card, color); punto(ctx, x, y, 3.5, color);
}
function flecha(ctx, x1, y1, x2, y2, color, ancho){
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = ancho || 2.6; ctx.lineCap = 'round';
  const a = Math.atan2(y2 - y1, x2 - x1), h = 10;
  linea(ctx, x1, y1, x2 - (h - 2)*Math.cos(a), y2 - (h - 2)*Math.sin(a));
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - h*Math.cos(a - .42), y2 - h*Math.sin(a - .42)); ctx.lineTo(x2 - h*Math.cos(a + .42), y2 - h*Math.sin(a + .42)); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- Vista 1: el plano con cuadrícula ----------
   V = { tipo:'plano', ventana:[x0, x1, y0, y1], ejesXY, espejos:[{ id, punto, angulo, k, nombre, mover, girar }],
         figuras:[{ pts, cerrada, k, dash, relleno, ancho, alpha, rotulos:[{ P, t, dx, dy }] }], segs:[{ P, Q, k, dash }],
         rectos:[{ H, angulo, hacia }], flechas:[{ P, Q, k, t }], arcos:[{ O, r, desde, hasta, k, t }],
         puntos:[{ P, k, t, dx, dy, r }], activo } */
function vistaPlano(L, c, V){
  const { ctx, W, H } = L, [x0, x1, y0, y1] = V.ventana, pad = 12;
  const s = Math.min((W - 2*pad)/(x1 - x0), (H - 2*pad)/(y1 - y0));
  const ox = W/2 - s*(x0 + x1)/2, oy = H/2 + s*(y0 + y1)/2;
  const X = x => ox + x*s, Y = y => oy - y*s;
  V._X = X; V._Y = Y; V._s = s; V._de = (px, py) => ({ x:(px - ox)/s, y:(oy - py)/s });
  // cuadrícula: una línea por unidad
  const xa = Math.ceil((0 - ox)/s), xb = Math.floor((W - ox)/s), ya = Math.ceil((oy - H)/s), yb = Math.floor(oy/s);
  ctx.strokeStyle = c.grid; ctx.lineWidth = 1;
  for (let x = xa; x <= xb; x++) linea(ctx, X(x), 0, X(x), H);
  for (let y = ya; y <= yb; y++) linea(ctx, 0, Y(y), W, Y(y));
  if (V.ejesXY){
    ctx.strokeStyle = c.muted; ctx.lineWidth = 1.4; linea(ctx, 0, Y(0), W, Y(0)); linea(ctx, X(0), 0, X(0), H);
    ctx.font = `700 10px ${c.font}`; ctx.fillStyle = c.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const paso = s < 22 ? 2 : 1;
    for (let x = xa; x <= xb; x++) if (x && x % paso === 0) ctx.fillText(fmt(x), X(x), Y(0) + 3);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let y = ya; y <= yb; y++) if (y && y % paso === 0) ctx.fillText(fmt(y), X(0) - 4, Y(y));
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText('x', W - 12, Y(0) - 2); ctx.textAlign = 'left'; ctx.fillText('y', X(0) + 5, 14);
  }
  const grueso = k => (c.hl && c.hl === k ? 1.6 : 1);
  const largo = Math.hypot(W, H)/s + Math.hypot(x1 - x0, y1 - y0);
  const recta = (P, ang, color, ancho, dash) => {
    const d = { x:Math.cos(ang*RAD), y:Math.sin(ang*RAD) };

function vista7(V){
  const [e1, e2] = V.espejos, r1 = rectaDe(e1), r2 = rectaDe(e2);
  const b = B7, i1 = mapear(b, P => M.reflejar(P, r1).P), i2 = mapear(b, P => M.aplicarDos(P, r1, r2));
  V.figuras = [figBandera(b, 'F'), figTela(b, 'F'), figBandera(i1, 'I', { dash:[6, 4] }), figTela(i1, 'I', { alpha:.12 }), figBandera(i2, 'J'), figTela(i2, 'J')];
  const c = M.componer(r1, r2); V._c = c;
  V.flechas = []; V.arcos = [];
  if (c.tipo === 'traslacion') V.flechas.push({ P:b.pie, Q:i2.pie, k:'J', t:`${fmt(c.modulo, 1)} cm` });
  else if (c.tipo === 'giro'){
    const a0 = Math.atan2(b.pie.y - c.centro.y, b.pie.x - c.centro.x)/RAD;
    V.arcos.push({ O:c.centro, rU:Math.hypot(b.pie.x - c.centro.x, b.pie.y - c.centro.y), desde:a0, hasta:a0 + c.angulo, k:'J', t:gr(Math.abs(c.angulo)) });
    V.puntos = [{ P:c.centro, t:'Q', dx:-12, dy:14 }];
  } else V.puntos = [];
  if (c.tipo !== 'giro') V.puntos = [];
  return V;
}

    desc:v => v._c ? `Los espejos forman ${gr(v.espejos[1].angulo)}: la imagen final es la bandera girada ${gr(v._c.angulo)} alrededor de Q, sin voltear.` : 'Dos espejos que se cortan en Q: L₁ horizontal y L₂ a 40°. Junto a L₁, por arriba, una bandera.',
    vivo:v => !v._c ? '' : `<div class="eqs"><div class="eq">ángulo entre ${V('E','L₁')} y ${V('S','L₂')} = ${gr(v.espejos[1].angulo)} → ${V('J','giro')} = 2 · ${gr(v.espejos[1].angulo)} = ${V('J', gr(v._c.angulo))}</div></div>`,
    exp:`<p>Q está en los dos espejos: no se mueve. Todo lo demás gira alrededor de Q. Un punto que forma un ángulo α con L₁ pasa a −α con el primer reflejo y a 80° + α con el segundo: avanza el doble del ángulo entre los espejos.</p>
      <p>Gira ${V('S','L₂')} con su manija. Con 90°, el giro es de 180°: dos espejos perpendiculares hacen una simetría respecto de Q.</p>` + NOHAY },
  { id:'romboide', corto:'El romboide', leg:['F','I','E','O'], legAntes:['F'], leyTextos:{ F:'el romboide', I:'su reflejo en el espejo', O:'el centro O y la media vuelta' },
    q:'Un romboide es un paralelogramo que no es rectángulo ni rombo, como el del dibujo. ¿Cuántos ejes de simetría tiene y tiene centro de simetría?',
    opts:[['a', '2 ejes (sus diagonales) y sí tiene centro', 'diagonales-del-romboide-como-ejes', 'hipotesis'], ['b', '0 ejes y no tiene centro', 'sin-ejes-no-hay-simetria', 'hipotesis'],
          ['c', '2 ejes (sus medianas) y no tiene centro', 'romboide-como-rectangulo', 'hipotesis'], ['d', '0 ejes y sí tiene centro']],
    ok:'d',
    antes:() => vistaE2(false), despues:() => vistaE2(true, 0),
    anima:v => animar(1600, f => { Object.assign(v, vistaE2(true, v.espejos[0].angulo, suave(f))); }),
    desc:v => v.espejos ? `Un espejo pasa por el centro O del romboide, a ${gr(v.espejos[0].angulo)}: el reflejo ${v._ok ? 'cae encima' : 'no cae encima'}. Después de media vuelta alrededor de O, el romboide sí queda igual.` : 'Un romboide: los lados de abajo y de arriba miden 5 y los inclinados se corren 2 hacia la derecha.',
    vivo:v => !v.espejos ? '' : `<div class="chips"><span class="chip">${V('E','espejo a ' + gr(v.espejos[0].angulo))}</span><span class="chip ${v._ok ? 'vivo-ok' : 'vivo-no'}">${v._ok ? 'cae encima' : 'el reflejo no cae encima'}</span><span class="chip">${V('O','media vuelta alrededor de O: cae encima')}</span></div>`,
    exp:`<p>Gira el ${V('E','espejo')}: en ningún ángulo el ${V('I','reflejo')} cae sobre el romboide, ni siquiera en sus diagonales. Pero si lo giras media vuelta alrededor de ${V('O','O')} (el cruce de las diagonales), cae justo encima: tiene centro de simetría.</p>
      <p>Una figura puede no tener ejes y aun así ser simétrica respecto de un punto. Les pasa a todos los paralelogramos y a letras como N, S y Z.</p>` + NOHAY },
  { id:'caja', corto:'La caja de zapatos', leg:['E'], legAntes:[], leyTextos:{ E:'los planos de simetría' },
    q:'Una caja de zapatos tiene largo 4, ancho 3 y alto 2 (las tres aristas distintas). ¿Cuántos planos de simetría tiene?',
    opts:[['a', pl(E3.errores.comoCubo), 'caja-como-cubo', 'hipotesis'], ['b', pl(E3.planos)], ['c', pl(E3.errores.unoPorCara), 'un-plano-por-cara', 'hipotesis'], ['d', pl(E3.errores.unoPorArista), 'un-plano-por-arista', 'hipotesis']],
    ok:'b',
    antes:() => ({ tipo:'3d', poli:CAJA, yaw:-32, pitch:24 }),
    despues:() => ({ tipo:'3d', poli:CAJA, yaw:-32, pitch:24, plano:E3.lista[0], todos:E3.lista }),
    desc:v => v.plano ? `La caja con sus ${E3.planos} planos de simetría, todos paralelos a las caras. Los planos en diagonal del cubo ya no sirven.` : 'Una caja de 4 de largo, 3 de ancho y 2 de alto.',
    vivo:() => `<div class="seg" id="pl3" role="group" aria-label="Planos de la caja">${E3.lista.map((_, i) => `<button type="button" data-p="${i}" aria-pressed="${i === 0}">Plano ${i + 1}</button>`).join('')}</div>`,
    montar:() => { const g = $('pl3'); if (!g) return; g.querySelectorAll('button').forEach(b => b.onclick = () => { S.vista.plano = E3.lista[+b.dataset.p]; g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); draw(); }); },
    exp:`<p>Solo quedan los 3 ${V('E','planos')} paralelos a las caras, por la mitad del largo, del ancho y del alto. Un plano en diagonal, como los del cubo, ya no sirve: lleva el largo (4) sobre el ancho (3), y no encajan.</p>
      <p>En el cubo las tres medidas son iguales, y eso cambia la cuenta: compruébalo en el paso 8 de «Paso a paso».</p>` + NOHAY },
  { id:'mano', corto:'La mano en el espejo', leg:['F','I','E'], legAntes:['F','E'], leyTextos:{ F:'tu mano derecha', I:'la mano del espejo', E:'el espejo' },
    q:'Pones tu mano derecha frente a un espejo: el pulgar hacia arriba, el índice apuntando al espejo y el medio hacia la izquierda. ¿Qué mano ves en el espejo?',
    opts:[['a', 'Una mano derecha: el espejo copia la mano tal cual', 'espejo-copia-sin-invertir', 'hipotesis'], ['b', 'Una mano izquierda: ningún giro la vuelve derecha'],
          ['c', 'Una mano izquierda, pero media vuelta la vuelve derecha', 'un-giro-deshace-el-reflejo', 'hipotesis'], ['d', 'Una mano derecha, pero puesta de cabeza', 'espejo-pone-de-cabeza', 'hipotesis']],
    ok:'b',
    antes:() => vistaE4(false), despues:() => vistaE4(true, 0),
    desc:v => v.palmas.length > 1 ? `En el espejo, el índice apunta de vuelta hacia ti y el pulgar y el medio no cambian: es una mano ${E4.imagen}. Después de media vuelta sigue siendo ${E4.trasGiro}.` : 'Tu mano derecha frente a un espejo vertical: el pulgar hacia arriba, el índice hacia el espejo y el medio hacia la izquierda.',
    vivo:() => `<div class="nav"><button type="button" class="btn" id="girar4">Dale media vuelta a la imagen</button></div>`,
    montar:() => { const b = $('girar4'); if (!b) return; let g = 0; b.onclick = () => { const de = g, a = de ? 0 : 1; g = a; animar(1200, f => { S.vista = vistaE4(true, de + (a - de)*suave(f)); }); b.textContent = a ? 'Devuélvela a su lugar' : 'Dale media vuelta a la imagen'; }; },
    exp:`<p>El espejo solo invierte lo que va hacia él: el ${V('I','índice')} de la imagen apunta de vuelta hacia ti. El pulgar y el medio no cambian. Con eso la mano ya no es derecha: es una izquierda.</p>
      <p>Dale media vuelta: el índice vuelve a apuntar al espejo, pero el medio queda hacia la derecha. Ningún giro arregla eso: un reflejo cambia la «mano» y un giro no.</p>` + NOHAY },
  { id:'heptagono', corto:'El heptágono', leg:['F','E'], legAntes:['F'], leyTextos:{ F:'el heptágono', E:'los ejes de simetría' },
    q:'Un heptágono regular tiene 7 lados iguales y 7 ángulos iguales. ¿Cuántos ejes de simetría tiene?',
    opts:[['a', n(E5.errores.soloVertical), 'solo-el-eje-vertical', 'hipotesis'], ['b', n(E5.errores.ninguno), 'impar-sin-ejes', 'hipotesis'], ['c', n(E5.errores.dobleCuenta), 'cuenta-vertices-y-lados-aparte', 'hipotesis'], ['d', n(E5.ejes)]],
    ok:'d',
    antes:() => vistaFigura(E5f, false), despues:() => vistaFigura(E5f, true),
    anima:v => { const ejes = v.segs.slice(); animar(1800, f => { v.segs = ejes.slice(0, Math.ceil(f*ejes.length)); }); },
    desc:v => v.segs && v.segs.length ? `El heptágono regular con sus ${E5.ejes} ejes: cada uno va de un vértice al punto medio del lado de enfrente. No tiene centro de simetría.` : 'Un heptágono regular con un vértice arriba.',
    vivo:() => '',
    exp:`<p>Cada ${V('E','eje')} sale de un vértice y llega al punto medio del lado de enfrente: 7 vértices, 7 ejes. No se cuentan aparte los ejes «por los lados», porque son los mismos.</p>
      <p>Con n par (un hexágono, un octógono) cada eje une dos vértices o dos lados, y también hay n: un polígono regular de n lados tiene n ejes.</p>` + NOHAY },
];
// los números de las opciones deben ser distintos (si un error coincide con otro, se descarta en el motor y en las pruebas)
function primeraLibre(){ const j = EXPS.findIndex(x => !S.pred[x.id]); return j < 0 ? EXPS.length - 1 : j; }
function botones(){
  const libre = primeraLibre();
  $('exps').innerHTML = EXPS.map((x, k) => k > libre
    ? `<button type="button" aria-pressed="false" data-k="${k}" disabled aria-disabled="true" aria-label="Experimento ${k+1}, bloqueado">${k+1}. ${x.corto}</button>`
    : `<button type="button" aria-pressed="${k === S.k}" data-k="${k}">${k+1}. ${x.corto}</button>`).join('');
  $('exps').querySelectorAll('button').forEach(b => b.onclick = () => ir(+b.dataset.k));
}
function ponerVista(v){
  const antes = S.vista && S.vista.tipo; S.vista = v;
  cv.tabIndex = (v.espejos || []).some(e => e.mover || e.girar) ? 0 : -1;
  if (v.tipo !== antes) L.resize(); else draw();
}
function describir(){ const x = EXPS[S.k]; if (S.vista) { const t = x.desc(S.vista); $('desc2').textContent = t; cv.setAttribute('aria-label', t); } }
function vivo(){ const x = EXPS[S.k], el = $('vivo2'); if (el && x.vivo && !x.montar) el.innerHTML = x.vivo(S.vista); describir(); }
function ir(k){
  if (k > primeraLibre()) return;
  cancelAnimationFrame(anim);
  S.k = k; S.t0 = Date.now();
  const x = EXPS[k], hecho = !!S.pred[x.id];
  ponerVista(hecho ? x.despues() : x.antes());
  L.compactar(!hecho);
  botones();
  leyenda($('leg2'), hecho ? x.leg : x.legAntes, x.leyTextos);
  $('k2').textContent = `¿Qué pasa si…? · ${k+1} de ${EXPS.length}`;
  $('t2').textContent = x.corto;
  $('body2').innerHTML = `<p>${x.q}</p>
    <div class="opts">${x.opts.map(([l, t]) => `<button class="opt" type="button" data-k="${l}"><span class="l">${l.toUpperCase()}</span><span>${t}</span></button>`).join('')}</div>
    <p class="fb" id="fb2"></p><div id="res2" class="body"></div>`;
  const btns = [...$('body2').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[x.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === x.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb2');
    fb.textContent = p === x.ok ? '¡Bien pensado! Mira el dibujo para ver por qué.' : `Elegiste la ${p.toUpperCase()}. La correcta está marcada; mira el dibujo para ver por qué.`;
    fb.className = 'fb ' + (p === x.ok ? 'ok' : 'mal');
    $('res2').innerHTML = `<div id="vivo2" class="body">${x.montar ? x.vivo(S.vista) : ''}</div>` + x.exp + (k < EXPS.length - 1 ? `<div class="nav"><span></span><button type="button" class="btn primary" id="sig2">Siguiente: ${EXPS[k+1].corto}</button></div>` : '');
    if (x.montar) x.montar();
    vivo();
    const sig = $('sig2'); if (sig) sig.onclick = () => { ir(k + 1); document.querySelector('#m2').scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); };
  };
  btns.forEach(b => b.onclick = () => {
    if (S.pred[x.id]) return;
    const o = x.opts.find(q => q[0] === b.dataset.k);
    S.pred[x.id] = o[0]; botones(); pintar(); L.compactar(false);
    registrarPrediccion('que-pasa-si-' + x.id, o[0], o[0] === x.ok, o[2] || '', o[3] || '', S.t0);
    // el dibujo cambia recién ahora: en el celular, primero sube el lienzo y después se anima
    Celular.alResponder(L.cv, () => { ponerVista(x.despues()); leyenda($('leg2'), x.leg, x.leyTextos); vivo(); if (x.anima) x.anima(S.vista); describir(); }, () => S.k === k);
  });
  pintar(); describir();
}
conectarArrastre(L, () => S.vista, (id, p, tecla) => {
  if (!moverEspejo(S.vista, id, p, tecla)) return;
  cancelAnimationFrame(anim);
  const x = EXPS[S.k], v = S.vista;
  if (x.id === 'espejos-en-angulo') S.vista = Object.assign(vistaE1(true, v.espejos[1].angulo), { activo:v.activo });
  else if (x.id === 'romboide') S.vista = Object.assign(vistaE2(true, v.espejos[0].angulo, 1), { activo:v.activo });
  vivo(); draw();
}, draw);
alRedibujarTema(draw);
addEventListener('modo', () => L.resize());
L.resize(); ir(0);
})();
</script>

<script>
/* ================= Pestañas ================= */
(function(){
  const modos = [['#paso-a-paso', 'm1', 'tab1'], ['#que-pasa-si', 'm2', 'tab2']];
  function route(){
    const k = Math.max(0, modos.findIndex(m => m[0] === location.hash));
    modos.forEach(([, m, t], j) => {
      document.getElementById(m).hidden = j !== k;
      const a = document.getElementById(t);
      if (j === k) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    dispatchEvent(new Event('modo'));
  }
  addEventListener('hashchange', route); route();
})();
</script>
</body>
</html>
