<style>
/* Cáscara acogedora (crema, tarjetas cálidas, esquinas redondas; docs/diseno.md).
   Dentro del dibujo y de las ecuaciones solo mandan los colores de las variables (regla 4).

   Colores de esta escena (claro / oscuro). Revisados con CIEDE2000 (docs/metodo/paleta.py) y contraste WCAG sobre
   #fdf7f1 y #241c2e, también sobre el chip .v (fondo del 8 %): contraste mínimo 4,6 en los dos modos.
     ELEMENTOS: paleta común de nucleo/elementos.js (C gris, H turquesa), en el bloque generado de abajo.
     VARIABLES
       cad  cadena principal                      azul      #1f5fbf / #7cb0ff
       loc  localizadores (la numeración)         magenta   #b3246b / #ff86bd
       sus  sustituyentes (las ramas)             naranja   #a05200 / #f0a04a
       mul  enlace doble o triple                 violeta   #4d00b8 / #b27aff
       T    temperatura de ebullición             verde     #255c1f / #5fe06a
       ang  ángulo de enlace                      mostaza   #756300 / #e3c84a
   Qué sale junto: C y H siempre; con ellos cad, loc, sus y mul (nombres); C, H y T (ebullición); C, H, mul y ang
   (hibridación). Entre todos, y contra C, H y la tinta, ΔE00 ≥ 20 en claro y en oscuro (mínimo 21,5: C–H; entre
   variables, 22,2: T–ang; contra C, H o tinta, 20,4: T–H). sus y ang (18,9) nunca comparten dibujo: en las vistas de
   hibridación no hay ramas. Cada átomo lleva además su letra.
   Los tonos de la «nube» de contacto y de la marca punteada son pálidos o neutros y no nombran variables. */
[hidden]{display:none!important}
:root{
  --bg:#fbf3ec; --card:#fffaf6; --paper:#fdf7f1; --ink:#2d2340; --muted:#716579; --line:#efe3dc; --grid:#f3e8e0;
  --acento:#ffd3e2; --acento-ink:#5c1f3d; --ok:#1d7f58; --warn:#c8363b;
  --shadow:0 1px 2px rgba(92,52,110,.05),0 10px 28px rgba(92,52,110,.09);
  /* variables */
  --c-cad:#1f5fbf; --c-loc:#b3246b; --c-sus:#a05200; --c-mul:#4d00b8; --c-T:#255c1f; --c-ang:#756300;
  /* tonos del mundo (no son variables) */
  --letra-atomo:#ffffff; --nube:#efe4f3; --palito:#8a7f93;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-cad:#7cb0ff; --c-loc:#ff86bd; --c-sus:#f0a04a; --c-mul:#b27aff; --c-T:#5fe06a; --c-ang:#e3c84a;
  --letra-atomo:#1d1626; --nube:#3a3046; --palito:#8d8399; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-cad:#7cb0ff; --c-loc:#ff86bd; --c-sus:#f0a04a; --c-mul:#b27aff; --c-T:#5fe06a; --c-ang:#e3c84a;
  --letra-atomo:#1d1626; --nube:#3a3046; --palito:#8d8399; color-scheme:dark }

/* Bloque generado con Elementos.css(['C', 'H']); no se edita a mano: nucleo/elementos-escenas.test.js lo compara. */
:root{ --el-C:#6b6b6b; --el-H:#0f766e }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --el-C:#9a9a9a; --el-H:#5ed9c8 } }
:root[data-theme="dark"]{ --el-C:#9a9a9a; --el-H:#5ed9c8 }

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--font); -webkit-text-size-adjust:100%}
.wrap{max-width:1240px; margin:0 auto; padding-block:18px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid; gap:16px}
.top{display:grid; gap:12px}
.eyebrow{margin:0; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700}
h1{margin:2px 0 0; font-size:clamp(1.65rem, 4.4vw, 2.1rem); line-height:1.1; letter-spacing:-.01em}
.sub{margin:4px 0 0; color:var(--muted); font-size:.95rem; max-width:60ch}

/* El dedo desplaza la página sobre el dibujo; solo un toque que empieza cerca de un enlace o de un átomo, cuando se

.dots{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.dots button{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); color:var(--muted);
  font:700 .82rem var(--font); cursor:pointer; font-variant-numeric:tabular-nums}

.step-k{display:inline-block; margin:0; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; font-weight:800;

@media (min-width:560px){ .opts{grid-template-columns:repeat(2, minmax(0,1fr))} }
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; padding:12px 14px; border-radius:16px; border:2px solid var(--line);
  background:var(--paper); color:var(--ink); font:inherit; cursor:pointer; min-height:48px}

.seg{display:inline-flex; flex-wrap:wrap; gap:4px; padding:4px; border-radius:20px; background:var(--paper); border:1px solid var(--line); justify-self:start; max-width:100%}
.seg button{font:700 .9rem var(--font); padding:8px 14px; border-radius:999px; border:0; background:transparent; color:var(--muted); cursor:pointer; min-height:40px}

.nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.btn{font:700 .95rem var(--font); padding:11px 20px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; min-height:44px}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--card)}
.btn:disabled{opacity:.45; cursor:not-allowed}

button:focus-visible, .v:focus-visible, a:focus-visible{outline:3px solid var(--ink); outline-offset:2px}

.volver-app{display:inline-block; margin:12px 16px 0; background:var(--card); color:var(--ink); box-shadow:var(--shadow);
  font:700 14px var(--font); padding:8px 16px; border-radius:999px; text-decoration:none}
/* Pantalla grande (laboratorio de cómputo, 1366 × 768): dibujo a la izquierda, fijo; guía a la derecha. */

  .top{grid-template-columns:1fr auto; align-items:end}
  .mode{grid-template-columns:minmax(0, 1.2fr) minmax(360px, 1fr)}
  .bench{position:sticky; top:12px}
}

<script src="../../nucleo/medicion.js"></script>
<script src="../../nucleo/celular.js"></script>
<script>
// Registro anónimo de predicciones (nucleo/medicion.js). Solo guarda si el alumno entró por la app.
const PLANTILLA = { id: 'hidrocarburos', unidad: 'quimica.hidrocarburos', version: '0.1.0' };
function registrarPrediccion(problema, opcion, correcta, error, respaldo, t0){
  if (!window.Medicion) return;
  Medicion.guardar({ tipo: 'prediccion', modulo: PLANTILLA.id, unidad: PLANTILLA.unidad, problema, opcion, correcta,
    error: correcta ? '' : error, respaldo: correcta ? '' : respaldo, ms: t0 ? Date.now() - t0 : '' }, PLANTILLA.version);
}

/* ================= Piezas compartidas =================
   Toda la química sale de MotorHidrocarburos (motor.js): el grafo, el nombre, la cadena principal, los isómeros,
   cis y trans, la hibridación, las coordenadas y los giros. Aquí solo se pinta. */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MH = MotorHidrocarburos;
const css = Celular.variable; // guardada hasta que cambie el tema o el tamaño (nucleo/celular.js)
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
function fmt(n, d){
  if (!Number.isFinite(n)) return '—';
  const p = Math.pow(10, d === undefined ? 1 : d), r = Math.round(n*p)/p + 0;
  const [e, f] = String(Math.abs(r)).split('.');
  return (r < 0 ? '−' : '') + e + (f ? ',' + f : '');
}
const SUBD = { '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉' };
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const V = (k, t) => `<span class="v v-${k}" data-var="${k}" tabindex="0">${t}</span>`;
// Fórmula molecular o semidesarrollada en el texto: C y H con su color; los números como subíndices.
function F(f){
  let h = '';
  String(f).replace(/([A-Z][a-z]?)(\d*)|([–=≡\-()])|(\d+)/g, (m, el, d, s, n) => {
    if (el) h += `<span class="v v-${el === 'C' || el === 'H' ? el : 'x'}" data-var="${el}" tabindex="0">${el}${d ? `<sub>${d}</sub>` : ''}</span>`;
    else if (s) h += s === '-' ? '–' : s;
    else if (n) h += `<sub>${n}</sub>`;
    return m;
  });
  return `<span class="f">${h}</span>`;
}
// Nombre IUPAC con sus partes de color: cadena, localizadores, ramas y enlace múltiple.
const TIPOS = { cad:1, loc:1, sus:1, mul:1 };
const N = r => `<span class="nom">${(r.partes || MH.nombre(r).partes).map(p => TIPOS[p.tipo] ? V(p.tipo, esc(p.t)) : esc(p.t)).join('')}</span>`;
const sinTab = h => h.replace(/ tabindex="0"/g, '');

function colores(){
  const g = n => css(n);
  return { ink:g('--ink'), muted:g('--muted'), grid:g('--grid'), paper:g('--paper'), card:g('--card'), line:g('--line'), ok:g('--ok'), warn:g('--warn'),
    cad:g('--c-cad'), loc:g('--c-loc'), sus:g('--c-sus'), mul:g('--c-mul'), T:g('--c-T'), ang:g('--c-ang'),
    el:{ C:g('--el-C'), H:g('--el-H') }, letra:g('--letra-atomo'), nube:g('--nube'), palito:g('--palito'), font:g('--font') };
}
function alRedibujarTema(fn){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', fn);
  new MutationObserver(fn).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
function linea(ctx, x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function texto(ctx, c, t, x, y, tam, color, align, max, peso){
  let s = tam; ctx.font = `${peso || 700} ${s}px ${c.font}`;
  if (max) while (s > 9 && ctx.measureText(t).width > max){ s -= 0.5; ctx.font = `${peso || 700} ${s}px ${c.font}`; }
  ctx.fillStyle = color; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y);
  return ctx.measureText(t).width;
}
// Un texto hecho de partes de colores (el nombre), centrado en x; se achica hasta caber en max.
function partesTexto(ctx, c, partes, x, y, tam, max){
  const col = p => ({ cad:c.cad, loc:c.loc, sus:c.sus, mul:c.mul }[p.tipo] || c.ink);
  let s = tam, w;
  const medir = () => { ctx.font = `800 ${s}px ${c.font}`; return partes.reduce((t, p) => t + ctx.measureText(p.t).width, 0); };
  w = medir(); while (max && s > 9 && w > max){ s -= 0.5; w = medir(); }
  let xx = x - w/2; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (const p of partes){ ctx.fillStyle = col(p); ctx.fillText(p.t, xx, y); xx += ctx.measureText(p.t).width; }
}

/* ----- Una molécula de bolitas y palitos -----
   it = { m (molécula del motor), c (coordenadas del motor), rot (rótulo), partes (rótulo de colores), modo ('bolitas'
   o 'esqueleto'), op: { cadena, nums, subs, hib, ang, nube, prueba, marca, foco }, teb: { valor, ver }, tachado }.
   El dibujo es plano: z solo agranda un poco las bolitas que quedan adelante mientras se gira. */
const RC = 0.27, RH = 0.17;
// Escala que hace caber la molécula en su caja (px por largo de enlace C–C).
function ajuste(it, box){
  const A = it.c.atomos, op = it.op || {}, esq = it.modo === 'esqueleto';
  const pts = esq ? A.filter(p => p.el !== 'H') : A;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of pts){ x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
  const mg = esq ? 0.5 : 0.4 + (op.nums || op.hib ? 0.35 : 0) + (op.nube ? 0.3 : 0);
  return { s: Math.min(box.w/(x1 - x0 + 2*mg), box.h/(y1 - y0 + 2*mg), it.max || 58), x0, x1, y0, y1 };
}

const ESCENAS = [];
function crearEscena(cv, idDesc, modoId, idLey){
  const E = { vista:{ tipo:'mols', items:[] }, hl:null, modoId, anims:[], compacto:false, ctx: cv.getContext('2d'), cv };
  ESCENAS.push(E);

  E.resize = () => {
    const w = cv.clientWidth; if (!w) return;
    E.W = w; const Hn = PINTA[E.vista.tipo].alto(w, E.vista);
    const h = Math.round(Celular.alto(Hn, E.compacto)); E.esc = h/Hn;
    const dpr = Celular.dpr();
    if (h !== H || cv.width !== Math.round(w*dpr)){ H = h; cv.style.height = h + 'px'; cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  };

  E.compactar = on => { on = !!on; Celular.compactar(cv.closest('.mode'), on); if (on === E.compacto) return; E.compacto = on; E.resize(); E.dibujar(); };

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, E.W, H);

    else x.m.at.forEach((a, i) => { if (a.el !== 'C') return; if (modo === 'agregar' && a.h < 1) return; if (modo === 'quitar' && x.m.en.filter(e => e.a === i || e.b === i).length > 1) return; const q = P(A[i]); l.push({ atomo: i, X: q.X, Y: q.Y }); });
    return l;
  };
  const cercano = (p, r) => { const q = E.local(p); let mejor = null, d0 = r/E.esc; for (const o of objetivos()){ const d = Math.hypot(o.X - q.x, o.Y - q.y); if (d < d0){ d0 = d; mejor = o; } } return mejor; };
  let blanco = null, ini = null, movido = 0, c0 = null;
  Celular.arrastre(cv, {
    activo: () => !!(E.inter && !E.ocupado),
    cerca: (p, r) => !!cercano(p, r),
    empezar: (p) => { blanco = cercano(p, Celular.RADIO_DEDO); ini = p; movido = 0; c0 = it().c; poner(blanco); },
    mover: (p) => {
      if (!blanco || !ini) return; movido = Math.max(movido, Math.hypot(p.x - ini.x, p.y - ini.y));
      if (E.inter.modo !== 'girar' || blanco.enlace === undefined || movido < 6) return;

      if (g.ok){ x.c = g.coords; E.dibujar(); }

    soltar: () => {
      if (!blanco) return;
      const x = it();
      if (movido < 6){ x.c = c0; hacer(blanco); }

          E.ocupado = true; animar(E, 0.3, f => { x.c = MH.girar(x.m, cIni, k, th + (fin - th)*f).coords; }, () => { x.c = MH.girar(x.m, cIni, k, fin).coords; E.ocupado = false; listo(fin ? 'Giraste media vuelta un enlace simple.' : 'El enlace volvió a su lugar.'); }); }
      }
      blanco = null;
    },
  });
  // Teclado: flechas para elegir un enlace o un átomo; Enter o espacio para actuar.
  cv.addEventListener('keydown', e => {
    if (!E.inter || E.ocupado) return;
    const l = objetivos(); if (!l.length) return;
    const k = { ArrowRight:1, ArrowDown:1, ArrowLeft:-1, ArrowUp:-1 }[e.key];
    if (k){ e.preventDefault(); const i = l.findIndex(o => igual(o, E.foco)); E.foco = l[((i < 0 ? (k > 0 ? -1 : 0) : i) + k + l.length) % l.length]; poner(E.foco); decir(nombreObjetivo(E.foco)); return; }
    if ((e.key === 'Enter' || e.key === ' ') && E.foco){ e.preventDefault(); hacer(E.foco); }
  });
  cv.addEventListener('blur', () => { E.foco = null; poner(null); });
  const igual = (a, b) => a && b && a.enlace === b.enlace && a.atomo === b.atomo;
  const poner = o => { const x = it(); if (!x) return; x.op.foco = o ? { enlace: o.enlace, atomo: o.atomo } : null; E.dibujar(); };
  const decir = t => { if (E.inter.decir) E.inter.decir(t); };
  const aviso = t => { decir(t); const x = it(); if (!x || RM) return; const c1 = x.c; E.ocupado = true;
    // Un temblor corto: el doble enlace no se deja girar.
    animar(E, 0.45, f => { const d = Math.sin(f*Math.PI*4)*0.06; x.c = { atomos: c1.atomos.map(p => ({ ...p, x: p.x + d })), enlaces: c1.enlaces }; }, () => { x.c = c1; E.ocupado = false; }); };
  const listo = t => { if (E.inter.alHacer) E.inter.alHacer(t); else decir(t); };
  function nombreObjetivo(o){
    const x = it(), m = x.m;
    if (o.enlace !== undefined){ const e = m.en[o.enlace], t = { 1:'simple', 2:'doble', 3:'triple', 1.5:'del benceno' }[e.o]; return `Enlace ${t} entre el carbono ${e.a + 1} y el ${e.b + 1} (números del dibujo, no del nombre).`; }
    return `Carbono ${o.atomo + 1} (número del dibujo), con ${m.at[o.atomo].h} hidrógenos.`;
  }
  function hacer(o){
    const x = it(), modo = E.inter.modo;

      if (modo === 'girar'){
        const g = MH.girar(x.m, x.c, o.enlace, Math.PI);
        if (!g.ok){ aviso(g.texto); return; }
        const c1 = x.c; E.ocupado = true;
        animar(E, 0.7, f => { x.c = MH.girar(x.m, c1, o.enlace, f*Math.PI, g.mueve).coords; }, () => { x.c = g.coords; E.ocupado = false; listo('Giraste media vuelta un enlace simple: cambió el dibujo.'); });
        return;
      }
      const m2 = modo === 'agregar' ? MH.agregarC(x.m, o.atomo) : modo === 'quitar' ? MH.quitarC(x.m, o.atomo) : MH.cambiarEnlace(x.m, o.enlace);
      x.m = m2; x.c = MH.coordenadas(m2); x.op.foco = null; E.foco = null;
      if (E.inter.cambio) E.inter.cambio(x);

    } catch (err){ decir(err.message.replace('hidrocarburos: ', '').replace(/^./, s => s.toUpperCase()) + '.'); }
  }
  E.hacer = hacer;
}

const steps = [
 { k:'Paso 1', t:'Cuatro palitos por carbono', vista:() => vPropano(),

 { k:'Paso 4', t:'¿Cuántos hay?', gate:P3, vista:r => vC5(r),

 { k:'Paso 5', t:'Dos alquenos', gate:P4, vista:r => vCisTrans(r, r ? 1 : undefined),
   body:() => `<p>El but-2-eno (en muchos libros, 2-buteno), ${F('CH3–CH=CH–CH3')}, y el 2-metilpropeno, ${F('CH2=C(CH3)2')}, tienen la misma fórmula, ${F('C4H8')}. Los dos tienen un ${V('mul', 'doble enlace')}, y un doble enlace no gira como uno simple.</p>

   <div class="tras" hidden><p>Para pasar de una forma a la otra habría que girar media vuelta el doble enlace (romper su segundo enlace). El dibujo muestra ese cambio, hecho a mano: en el but-2-eno sale <b>otra</b> molécula (trans → cis); en el 2-metilpropeno sale <b>la misma</b>.</p>

   <div class="fila">${otraVez}</div>
   <p class="fuente">Ver cis-trans en todo alqueno, o creer que hacen falta halógenos, está descrito en futuros profesores de ciencias, sin porcentaje en lo que leímos (Şendur, 2012, por la descripción de un buscador). «Solo el ramificado» es una hipótesis nuestra.</p></div>` },
 { k:'Paso 6', t:'¿Cuál hierve a más temperatura?', gate:P5, vista:r => vEbullicion(r, r ? 1 : undefined),

const dots = $('dots');
steps.forEach((s, n) => {

// Lo que pasa después de responder (o al pedir «Ver de nuevo»); todo lo calcula el motor.
function mostrar(n){
  cortar(E); E.inter = null;
  if (n === 1){
    E.vista = pentanos(true); const b = E.vista.items[1], c0 = b.c0;
    animar(E, 1.1, f => { b.c = MH.girar(b.m, c0, 2, (1 - f)*Math.PI, 3).coords; }, () => { b.c = MH.girar(b.m, c0, 2, 0, 3).coords; b.rot = 'dibujo B, enderezado'; E.describir(); activarGiro(); }, 0.25);
    E.vista.items[1].desc = 'El dibujo B se endereza al girar media vuelta un enlace simple: queda igual al A.';
  } else if (n === 2){

function activarGiro(){

    alHacer: t => { const el = $('estado1'); if (el) el.textContent = t + ' Sigue siendo el pentano: la misma molécula.'; const b = E.vista.items[1]; if (b) b.rot = 'dibujo B, girado'; E.dibujar(); E.describir(); } };
  E.cv.tabIndex = 0;
}
let busca = -1;
function enlazar(){
  const body = $('stepBody');
  const rep = body.querySelector('[data-repetir]'); if (rep) rep.onclick = () => { mostrar(S.step); E.describir(); subir(); };
  const bu = $('buscar');
  if (bu) bu.onclick = () => {
    // Recorre las cadenas de punta a punta, de la más corta a la más larga, y termina en la principal.
    const l = MH.cadenas(ESC).slice().reverse(), it = E.vista.items[0];
    busca = (busca + 1) % (l.length + 1);
    if (busca === l.length){ conNombre(it, ['cadena', 'nums', 'subs']); delete it.op.prueba; $('estado2').textContent = `La más larga tiene ${NESC.cadena.length} carbonos: es la cadena principal.`; }
    else { it.op = { prueba: l[busca].atomos }; it.partes = null; it.rot = `una cadena de ${l[busca].largo} C`; $('estado2').textContent = `Cadena ${busca + 1} de ${l.length}: ${l[busca].largo} carbonos de punta a punta.`; }
    E.dibujar(); subir();
  };
}
const subir = () => { if (innerWidth < 900) $('cv').scrollIntoView({ block:'start', behavior: RM ? 'auto' : 'smooth' }); };
function go(n){
  if (n < 0 || n >= steps.length || n > S.max) return;
  const s = steps[n]; S.step = n; cortar(E); E.inter = null; E.cv.tabIndex = -1; busca = -1;
  const r = s.gate ? !!S.pred[s.gate.id] : true;
  E.vista = s.vista(r);
  $('stepK').textContent = `${s.k} de ${steps.length}`;
  $('stepT').textContent = s.t;
  $('stepBody').innerHTML = s.body();
  enlazar(); pintarDots();
  E.compactar(s.gate && !S.pred[s.gate.id]);
  if (s.gate) prediccion(s);
  if (n === 1 && r){ const b = E.vista.items[1]; b.c = b.c0; b.rot = 'dibujo B, enderezado'; activarGiro(); }
  nav(); E.dibujar(); pedir(); E.describir();
}
function nav(){
  const s = steps[S.step];
  $('prev').disabled = S.step === 0;
  $('next').disabled = S.step === steps.length - 1 || (s.gate && !S.pred[s.gate.id]);
  $('next').textContent = s.gate && !S.pred[s.gate.id] ? 'Elige una opción' : 'Siguiente';
}
function pintarDots(){
  [...dots.querySelectorAll('button')].forEach((b, k) => {
    b.className = k === S.step ? 'on' : (k <= S.max ? 'done' : ''); b.disabled = k > S.max;
    b.setAttribute('aria-label', k > S.max ? `Paso ${k + 1}, bloqueado` : `Ir al ${steps[k].k.toLowerCase()}: ${steps[k].t}`);
    if (k > S.max) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
    if (k === S.step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
}
function desbloquear(n){ if (n > S.max) S.max = n; }
function prediccion(s){
  const P = s.gate, btns = [...$('stepBody').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[P.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === P.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb'); fb.textContent = P.fb[p]; fb.className = 'fb ' + (p === P.ok ? 'ok' : 'mal');
    $('stepBody').querySelectorAll('.tras').forEach(el => el.hidden = false);
    enlazar();
  };
  const t0 = Date.now();
  btns.forEach(b => b.addEventListener('click', () => {
    if (S.pred[P.id]) return;
    const o = P.opts.find(q => q[0] === b.dataset.k);
    S.pred[P.id] = o[0]; desbloquear(S.step + 1); pintar(); pintarDots(); nav();
    registrarPrediccion(P.id, o[0], o[0] === P.ok, o[2] || '', o[3] || '', t0);
    $('next').focus({ preventScroll:true });
    // En el celular el dibujo sube a la vista y la animación arranca ~380 ms después (nucleo/celular.js).
    const paso = S.step; E.compactar(false);
    Celular.alResponder($('cv'), () => { mostrar(paso); E.describir(); }, () => S.step === paso);
  }));
  pintar();
}
$('next').addEventListener('click', () => { const s = steps[S.step]; if (s.gate && !S.pred[s.gate.id]) return; desbloquear(S.step + 1); go(S.step + 1); });
$('prev').addEventListener('click', () => go(S.step - 1));
alRedibujarTema(() => E.dibujar());
addEventListener('modo', () => { E.resize(); E.dibujar(); pedir(); });
go(0);
})();
</script>

<script>

const BUT = 'CH3-CH2-CH2-CH3', ARM = MH.armar(BUT, [['agregar', 1]]), NARM = MH.nombre(ARM.molecula);

    <div class="eq"><span class="ex">Carbonos: ${cl || 'uno solo (el del metano no se clasifica)'}.</span><span class="note">${ct.tiene ? 'Tiene isómeros cis y trans: ' + ct.razon + '.' : 'Sin cis-trans: ' + ct.razon + '.'}</span></div>
    ${MH.nombre(it.m).difiereIUPAC2013 ? '<div class="eq"><span class="note">Con la regla IUPAC de 2013 se elegiría la cadena más larga, aunque no pase por el doble enlace: el nombre cambia.</span></div>' : ''}</div>`;
}
function vMesa(it){ it.modo = MESA.esq ? 'esqueleto' : 'bolitas'; conNombre(it, ['cadena', 'nums', 'subs']); it.desc = `${it.rot}: ${contar(it)}.`; return { tipo:'mols', items:[it] }; }

const EXPS = [
  { id:'agregar-carbono', corto:'Arma tu alcano',
    q:`Al butano, ${F('CH3–CH2–CH2–CH3')}, se le agrega un carbono (con sus H) en el segundo carbono, el del anillo punteado. ¿Cómo se llama la molécula nueva?`,
    opts:[['a', `${N({ partes: NARM.erroresPartes.todosLosC })}: el carbono nuevo alarga la cadena a 5`, 'todo-C-alarga', 'hipotesis'],

          ['c', `${N({ partes: NARM.erroresPartes.numeracionContraria })}: la rama queda en el tercer carbono contando desde el otro lado`, 'numeracion-contraria', 'hipotesis'],

    ok:'b',
    fb:{ a:'Un carbono en un extremo alarga la cadena; en el segundo carbono, queda como rama: la cadena más larga sigue teniendo 4. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      c:'Se numera desde la punta más cercana a la rama: queda en el 2, no en el 3. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      d:'Al agregar un carbono cambia la fórmula (de C₄H₁₀ a C₅H₁₂): ya no es un isómero del butano. Reducir la isomería a «mover o poner una rama» aparece en escolares alemanes, sin porcentaje en lo que leímos (Schmidt, 1992, por su resumen).' },
    antes:() => { const it = mol(BUT, { rot:'butano', desc:'Butano: cuatro carbonos en zigzag; el segundo está marcado con un anillo punteado.' }); it.op.marca = 1; return { tipo:'mols', items:[it] }; },
    despues:() => { const it = { m: ARM.molecula, c: MH.coordenadas(ARM.molecula), op:{} }; return vMesa(it); },
    mesa:true,
    exp:() => `<p>Ahora arma lo que quieras. Elige qué hace el toque y toca un carbono o un enlace del dibujo (con el teclado: enfoca el dibujo, flechas y Enter). El nombre, la fórmula y la cadena principal se recalculan solos.</p>
      <div class="seg" id="mesaModo" role="group" aria-label="Qué hace el toque">
        <button type="button" data-m="agregar" aria-pressed="true">Agregar C</button><button type="button" data-m="quitar" aria-pressed="false">Quitar C</button>
        <button type="button" data-m="enlace" aria-pressed="false">Cambiar enlace</button><button type="button" data-m="girar" aria-pressed="false">Girar</button></div>
      <div class="fila"><button type="button" class="btn" id="mesaEsq" aria-pressed="false">Ver como esqueleto</button><button type="button" class="btn" id="mesaOtra">Empezar con el butano</button></div>
      <p class="estado" id="mesaEst" aria-live="polite"></p>
      <div id="mesaRes"></div>
      <p class="fuente">El armado usa la regla escolar para la cadena principal (la que pasa por los enlaces dobles o triples). Si armas un alqueno donde la IUPAC de 2013 elegiría otra cadena, el motor lo avisa.</p>` },
  { id:'isomeros-c6', corto:'Los isómeros del C₆H₁₄',
    q:`¿Cuántos alcanos distintos tienen la fórmula ${F('C6H14')}?`,
    opts:[['a', `${C6.errores.sinCuaternario} alcanos`, 'olvida-cuaternario', 'hipotesis'], ['b', `${C6.n} alcanos`], ['c', `${C6.errores.torcidaDosVeces} alcanos`, 'torcida-dos-veces', 'hipotesis'], ['d', `${C6.errores.deUnCarbonoMas} alcanos`, 'confunde-c7', 'hipotesis']],
    ok:'b',
    fb:{ a:'Falta el 2,2-dimetilbutano: dos metilos en un mismo carbono, que queda unido a otros cuatro. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      c:'Uno de tus 6 es repetido: una cadena torcida, o un etilo en el C2 de un butano (que es el 3-metilpentano), no es una molécula nueva. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      d:'9 son los de C₇H₁₆. Con 6 carbonos son 5. Esta opción es una hipótesis nuestra, sin estudio que la mida.' },
    antes:() => ({ tipo:'mols', items:[mol('CCCCCC', { rot:'uno de ellos: el hexano', desc:'El hexano, C6H14, en bolitas y palitos.' })] }),
    despues:() => ({ tipo:'mols', items: MH.isomeros(6, 'alcano').map(z => { const it = conNombre({ m: z.molecula, c: MH.coordenadas(z.molecula), op:{} }, []); const t = MH.ebullicion(z.molecula).teb; it.teb = { valor: t, ver: true }; it.desc = `${z.nombre}, hierve a ${fmt(t)} °C.`; return it; }), mismaEscala:true }),
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">${MH.isomeros(6, 'alcano').map(z => N(MH.nombre(z.molecula))).join(' · ')}</span><span class="note">Cadena de 6; de 5 con un metilo (en el C2 o en el C3); de 4 con dos metilos (2,2 o 2,3).</span></div></div>
      <p>Mira el ${V('T', 'punto de ebullición')} de cada uno (de tabla): todos tienen 6 C, y aun así el recto hierve más alto y el más ramificado, más bajo.</p>
      <p class="fuente">Los errores de conteo son hipótesis nuestras, de la tabla de lo que no tiene respaldo del informe. Los puntos de ebullición son del CRC Handbook; conviene compararlos con la tabla de tu libro.</p>` },
  { id:'intercambio-metilpropeno', corto:'El 2-metilpropeno que se gira',
    q:`En el 2-metilpropeno, ${F('CH2=C(CH3)2')}, imagina que el doble enlace pudiera girar media vuelta: el carbono que tiene los dos ${F('CH3')} da la vuelta y sus grupos cambian de lado. ¿Qué molécula queda?`,
    opts:[['a', 'Su isómero trans: todo alqueno tiene una forma cis y una trans', 'HC4-todo-alqueno', 'parcial'],
          ['b', 'El but-2-eno: los metilos pasan a carbonos distintos', 'metilos-cambian-de-carbono', 'hipotesis'],
          ['c', 'El but-1-eno: una rama cambió de lugar', 'HC1-rama-cambia', 'hipotesis'],
          ['d', 'La misma molécula: los dos grupos de ese carbono son iguales']],
    ok:'d',
    fb:{ a:'Para que haya cis y trans, cada carbono del doble enlace necesita dos grupos distintos. Aquí uno tiene dos CH₃ y el otro dos H: al girar, todo queda igual. Ver cis-trans en todo alqueno está descrito en futuros profesores de ciencias, sin porcentaje en lo que leímos (Şendur, 2012, por la descripción de un buscador).',
      b:'Girar no cambia qué átomo está unido con cuál: los dos CH₃ siguen en el mismo carbono. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      c:'Girar no mueve ramas de un carbono a otro: solo las cambia de lado. Esta opción es una hipótesis nuestra, sin estudio que la mida.' },
    antes:() => ({ tipo:'mols', items:[mol('CH2=C(CH3)2', { rot:'2-metilpropeno', desc:'2-metilpropeno: un doble enlace; el carbono de la izquierda tiene dos H y el de la derecha dos CH3.' })] }),
    despues:p => { const a = mol('CH2=C(CH3)2'), b = mol('CH3-CH=CH-CH3'); const f = p === undefined ? 1 : p;
      a.c = MH.intercambiar(a.m, a.c, INT.enlace, INT.mueve, f*Math.PI).coords; b.c = MH.intercambiar(b.m, b.c, INT2.enlace, INT2.mueve, f*Math.PI).coords;
      a.rot = `${INT.antes} → ${INT.despues}`; a.rot2 = 'la misma molécula'; b.rot = `${INT2.antes} → ${INT2.despues}`; b.rot2 = 'otra molécula'; b.rot2Color = 'ink';
      a.op.marca = INT.mueve; b.op.marca = INT2.mueve;
      a.desc = 'En el 2-metilpropeno, los dos CH3 cambian de lado y queda la misma molécula.'; b.desc = 'En el but-2-eno, el mismo giro pasa de trans a cis: otra molécula.';
      return { tipo:'mols', items:[a, b] }; },
    anima:true,
    exp:() => `<p>Al lado, para comparar, el mismo giro en el but-2-eno: ahí sí sale otra molécula (${INT2.antes} → ${INT2.despues}).</p>
      <p>En la vida real el doble enlace no gira: hace falta romper su segundo enlace. Por eso el cis y el trans del but-2-eno son dos sustancias que se pueden guardar en frascos separados.</p>
      <p class="fuente">El motor compara el grafo con su cis o trans: si sale la misma forma canónica, es la misma molécula.</p>` },
  { id:'anillo-cadena', corto:'Un anillo y una cadena',
    q:'El ciclobutano (un anillo de 4 carbonos) y el but-1-eno (una cadena de 4 con un doble enlace en la punta), ¿qué son entre sí?',
    opts:[['a', `Isómeros: los dos son ${F('C4H8')}, pero sus carbonos están unidos de otra forma`],
          ['b', `La misma sustancia: tienen los mismos átomos, ${F('C4H8')}`, 'misma-formula-misma-sustancia', 'hipotesis'],
          ['c', 'No son isómeros: los isómeros tienen que ser de la misma clase, y uno es un anillo', 'HC1-misma-clase', 'parcial'],
          ['d', 'No son isómeros: el anillo tiene dos H menos que la cadena', 'anillo-menos-H', 'hipotesis']],
    ok:'a',
    fb:{ b:'Tienen los mismos átomos, pero unidos de otra forma: uno es un anillo sin dobles enlaces y el otro, una cadena con uno. Son sustancias distintas. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      c:'Los isómeros pueden ser de clases distintas: basta la misma fórmula y otro grafo. Limitar la isomería a compuestos de la misma clase aparece en escolares alemanes, sin porcentaje en lo que leímos (Schmidt, 1992, por su resumen).',
      d:'Cerrar el anillo quita 2 H, igual que un doble enlace: por eso los dos quedan en C₄H₈. Esta opción es una hipótesis nuestra, sin estudio que la mida.' },
    antes:() => ({ tipo:'mols', items:[mol('C1CCC1', { rot:'ciclobutano', desc:'Ciclobutano: cuatro carbonos en un cuadrado, cada uno con dos H.' }), mol('CH2=CH-CH2-CH3', { rot:'but-1-eno', desc:'But-1-eno: cuatro carbonos en zigzag con un doble enlace en la punta.' })] }),
    despues:() => { const v = EXPS[3].antes(); v.items.forEach(it => { it.rot2 = MH.formula(it.m).texto.replace(/\d/g, d => SUBD[d]); it.rot2Color = 'ink'; }); return v; },
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">${ISO.formulaA.replace(/\d/g, d => SUBD[d])} = ${ISO.formulaB.replace(/\d/g, d => SUBD[d])}, distinto grafo: isómeros (un ${ISO.tipoA} y un ${ISO.tipoB}).</span></div>
      <div class="eq"><span class="ex">Todos los ${F('C4H8')}: ${C4.nombres.join(' · ')}</span><span class="note">${C4.n} en total: sin los anillos quedan ${C4.errores.sinAnillos}; sin anillos ni cis-trans, ${C4.errores.sinAnillosNiCisTrans}.</span></div></div>
      <p>La fórmula ${F('CnH2n')} es la de los alquenos y también la de los cicloalcanos: con la fórmula sola no se sabe cuál es.</p>` },
  { id:'angulos', corto:'sp³, sp² y sp',
    q:`En el etino, ${F('H–C≡C–H')}, ¿qué ${V('ang', 'ángulo')} forman los dos enlaces de cada carbono?`,
    opts:[['a', '120°: como en el eteno, porque hay un enlace múltiple', 'multiple-120', 'hipotesis'],
          ['b', '109,5°: todo carbono es un tetraedro', 'todo-tetraedrico', 'hipotesis'],
          ['c', '180°: el carbono es sp y sus dos enlaces quedan en línea'],
          ['d', '90°: el triple enlace ocupa tres lugares en cruz', 'triple-en-cruz', 'hipotesis']],
    ok:'c',
    fb:{ a:'Los 120° son del carbono sp², el del doble enlace. Con un triple enlace, el carbono solo tiene dos direcciones, opuestas: 180°. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      b:'El tetraedro (109,5°) es del carbono con cuatro enlaces simples, sp³. Esta opción es una hipótesis nuestra, sin estudio que la mida.',
      d:'Los tres enlaces del triple van juntos, en la misma dirección: cuentan como una sola. Esta opción es una hipótesis nuestra, sin estudio que la mida.' },
    antes:() => ({ tipo:'mols', items:[mol('CH≡CH', { rot:'etino', oculto:'H–C≡C–H', desc:'Etino: la fórmula H–C≡C–H; el modelo se arma al responder.' })] }),
    despues:() => ({ tipo:'mols', items:[['CH3-CH3', 'etano'], ['CH2=CH2', 'eteno'], ['CH≡CH', 'etino']].map(([t, n]) => { const it = mol(t, { rot:n }); it.op.hib = it.op.ang = true; const h = MH.hibridacion(it.m).lista[0]; it.desc = `${n}: carbonos ${h.hib}, ${fmt(h.angulo)} grados.`; return it; }) }),
    exp:() => `<div class="eqs"><div class="eq"><span class="ex">etano: sp³, ${V('ang', '109,5°')} · eteno: sp², ${V('ang', 'unos 120°')} · etino: sp, ${V('ang', fmt(HE.angulos[0]) + '°')}</span><span class="note">El dibujo es plano: el tetraedro del etano está en el espacio, En el papel los H del etano se dibujan separados, pero en el espacio forman 109,5°.</span></div></div>
      <p>Enlaces del etino: ${MH.enlaces('CH≡CH').sigma} σ y ${MH.enlaces('CH≡CH').pi} π. El triple enlace tiene 1 σ y 2 π.</p>` },
];
const S = { k:0, pred:{}, t0:Date.now() };
// Regla de Gerson: un experimento se abre solo si todos los anteriores ya tienen respuesta. Los respondidos se revisitan.
const abierto = k => EXPS.slice(0, k).every(x => S.pred[x.id]);
function botones(){
  $('exps').innerHTML = EXPS.map((x, k) => abierto(k)
    ? `<button type="button" aria-pressed="${k === S.k}" data-k="${k}">${k+1}. ${x.corto}</button>`
    : `<button type="button" aria-pressed="false" data-k="${k}" disabled aria-disabled="true" aria-label="Experimento ${k+1}, bloqueado">${k+1}. ${x.corto}</button>`).join('');
  $('exps').querySelectorAll('button').forEach(b => b.onclick = () => ir(+b.dataset.k));
}
function despues(x){
  cortar(E);
  if (x.anima){ E.vista = x.despues(0); E.dibujar(); animar(E, 1.2, f => { const v = x.despues(f); E.vista.items.forEach((it, k) => { it.c = v.items[k].c; }); }, () => { E.vista = x.despues(1); E.describir(); }, 0.3); }
  else E.vista = x.despues();
  if (x.mesa) mesa();
  E.dibujar(); pedir();
}
function mesa(){
  E.inter = { item:0, modo: MESA.modo,
    decir: t => { const el = $('mesaEst'); if (el) el.textContent = t; },
    alHacer: t => { const el = $('mesaEst'); if (el) el.textContent = t; },
    cambio: it => { E.vista = vMesa(it); const r = $('mesaRes'); if (r) r.innerHTML = resumen(it); E.describir(); } };
  E.cv.tabIndex = 0;
  const r = $('mesaRes'); if (r) r.innerHTML = resumen(E.vista.items[0]);
}
function enlazarMesa(){
  const md = $('mesaModo'); if (!md) return;
  // En el celular los botones quedan lejos del dibujo: al cambiar de modo, el lienzo vuelve a la vista.
  md.querySelectorAll('button').forEach(b => b.onclick = () => { if (innerWidth < 900) $('cv2').scrollIntoView({ block:'start', behavior: RM ? 'auto' : 'smooth' }); MESA.modo = b.dataset.m; md.querySelectorAll('button').forEach(z => z.setAttribute('aria-pressed', z === b)); if (E.inter) E.inter.modo = MESA.modo; E.foco = null; const it = E.vista.items[0]; if (it) it.op.foco = null; E.dibujar();
    $('mesaEst').textContent = { agregar:'Toca un carbono que tenga algún H: se le agrega un CH₃.', quitar:'Toca un carbono de una punta para quitarlo.', enlace:'Toca un enlace entre dos carbonos: pasa de simple a doble, a triple y vuelve, si la valencia lo deja.', girar:'Toca un enlace simple para girarlo media vuelta; el doble enlace no gira.' }[MESA.modo]; });
  $('mesaEsq').onclick = () => { MESA.esq = !MESA.esq; $('mesaEsq').setAttribute('aria-pressed', MESA.esq); $('mesaEsq').textContent = MESA.esq ? 'Ver bolitas y palitos' : 'Ver como esqueleto'; const it = E.vista.items[0]; E.vista = vMesa(it); E.dibujar(); };
  $('mesaOtra').onclick = () => { const it = { m: MH.molecula(BUT), c: MH.coordenadas(BUT), op:{} }; E.vista = vMesa(it); mesa(); E.resize(); E.dibujar(); E.describir(); $('mesaEst').textContent = 'De vuelta al butano.'; };
}
function ir(k){
  if (!abierto(k)) return;
  S.k = k; S.t0 = Date.now();
  const x = EXPS[k];
  cortar(E); E.inter = null; E.cv.tabIndex = -1; E.vista = x.antes();
  botones();
  $('k2').textContent = `¿Qué pasa si…? · ${k+1} de ${EXPS.length}`;
  $('t2').textContent = x.corto;
  $('body2').innerHTML = `<p>${x.q}</p>${opcionesHTML(x.opts, 'fb2')}<div id="res2" class="body"></div>`;
  const btns = [...$('body2').querySelectorAll('.opt')];
  const explicar = () => {
    if (S.k !== k || !S.pred[x.id]) return;
    $('res2').innerHTML = x.exp() + `<div class="nav">${x.anima ? otraVez : '<span></span>'}${k < EXPS.length - 1 ? `<button type="button" class="btn primary" id="sig2">Siguiente: ${EXPS[k+1].corto}</button>` : ''}</div>`;
    const sig = $('sig2'); if (sig) sig.onclick = () => { ir(k + 1); document.querySelector('#m2').scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); };
    const rep = $('res2').querySelector('[data-repetir]'); if (rep) rep.onclick = () => { despues(x); E.describir(); if (innerWidth < 900) $('cv2').scrollIntoView({ block:'start', behavior: RM ? 'auto' : 'smooth' }); };
    enlazarMesa();
  };
  const pintar = () => {
    const p = S.pred[x.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === x.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb2');
    fb.textContent = p === x.ok ? '¡Bien pensado! Mira el dibujo para ver por qué.' : `Elegiste la ${LETRAS.indexOf(p) + 1}. ${x.fb[p]} La correcta está marcada.`;
    fb.className = 'fb ' + (p === x.ok ? 'ok' : 'mal');
    explicar();
  };
  btns.forEach(b => b.onclick = () => {
    if (S.pred[x.id]) return;
    const o = x.opts.find(q => q[0] === b.dataset.k);
    S.pred[x.id] = o[0]; pintar(); botones(); E.compactar(false);
    registrarPrediccion('que-pasa-si-' + x.id, o[0], o[0] === x.ok, o[2] || '', o[3] || '', S.t0);
    Celular.alResponder($('cv2'), () => { despues(x); E.describir(); if (x.mesa) mesa(); }, () => S.k === k);
  });
  if (S.pred[x.id]){ E.vista = x.anima ? x.despues(1) : x.despues(); if (x.mesa) mesa(); }
  E.compactar(!S.pred[x.id]);
  pintar(); E.dibujar(); pedir(); E.describir();
}
alRedibujarTema(() => E.dibujar());
addEventListener('modo', () => { E.resize(); E.dibujar(); pedir(); });
ir(0);
})();
</script>

<script>
/* ================= Pestañas ================= */
(function(){
  const modos = [['#paso-a-paso', 'm1', 'tab1'], ['#que-pasa-si', 'm2', 'tab2']];
  function route(){
    const k = Math.max(0, modos.findIndex(m => m[0] === location.hash));
    modos.forEach(([, m, t], j) => {
      document.getElementById(m).hidden = j !== k;
      const a = document.getElementById(t);
      if (j === k) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    dispatchEvent(new Event('modo'));
  }
  addEventListener('hashchange', route); route();
})();
</script>
