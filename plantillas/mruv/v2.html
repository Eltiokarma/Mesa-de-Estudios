<!doctype html>
<html lang="es" data-curso="fisica">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El carrito y la pista</title>
<!--
  MRU y MRUV, versión A (docs/pogil-v2-rive.md, sección 7.5): sesión 1, partes 1 (empujar), 1b (dos carritos)
  y 2 (pisar). Sin Rive: el carrito es el provisional del kit (nucleo/kit/piezas/pista.js) hasta que llegue el
  arte del encargo (docs/encargo-vectores.md, sección 9). La física es la del motor de siempre (motor.js) y la
  lógica de la lección, la de leccion.js; esta página solo pinta, escucha el dedo y lleva el reloj.
  Reloj de simulación lineal, en tiempo real (1 s del modelo = 1 s); con movimiento reducido, la corrida se
  muestra ya terminada, con las marcas puestas.
-->
<link rel="stylesheet" href="../../nucleo/kit/kit.css">
<style>
[hidden]{display:none!important}
:root{
  /* Tokens de la cáscara (app/estilos.css) y de variable del kit: x turquesa (i), v rojo (h), a verde (d). */
  --bg:#fbf3ec; --card:#fffaf6; --ink:#2d2340; --muted:#716579; --line:#efe3dc; --borde:#e3d3c8;
  --brand:#7f5ae0; --brand-ink:#ffffff; --brand-soft:#efe6ff;
  --c-o:#b85a06; --c-i:#08807a; --c-h:#c0364a; --c-d:#4f7a17;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#1d1626; --card:#2a2135; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --borde:#4a3d58;
  --brand:#9b7ff2; --brand-ink:#ffffff; --brand-soft:#3a2d55;
  --c-o:#f0a04a; --c-i:#3dcdc3; --c-h:#f17384; --c-d:#a3d65e; color-scheme:dark } }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%}
.marco{max-width:420px;margin:0 auto;padding:10px max(12px, env(safe-area-inset-left, 0px)) 92px}
header{display:flex;align-items:center;gap:8px;min-height:44px}
header h1{font-size:18px;margin:0;flex:1}
.parte{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.volver{min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--ink);text-decoration:none;font-weight:700}
.tarjeta{background:var(--card);border:2px solid var(--borde);border-radius:16px;padding:12px}
/* Alto reservado para la consigna (2 líneas) y para el aviso (2 líneas): ningún cambio de estado mueve la figura. */
.consigna{margin:0 0 6px;font-weight:700;font-size:17px;min-height:calc(2 * 1.45em)}
.lectura{margin:2px 0;min-height:1.45em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.v-x{color:var(--c-i)} .v-v{color:var(--c-h)} .v-a{color:var(--c-d)}
.kit-lienzo.agarrable{cursor:grab;touch-action:none}
.fila{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:52px;align-items:center;margin-top:6px}
.btn{min-height:44px;min-width:44px;padding:8px 14px;border-radius:12px;border:2px solid var(--borde);background:var(--card);
  color:var(--ink);font:inherit;font-weight:600;box-shadow:0 3px 0 var(--borde);touch-action:manipulation}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--brand-soft)}
.btn.principal{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pedal{min-width:120px;min-height:56px;-webkit-user-select:none;user-select:none}
.pregunta{margin-top:6px}
.pregunta p{margin:0 0 6px;font-weight:700}
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.opcion{flex:1 1 auto}
.opcion[aria-checked="true"]{border-color:var(--ink)}
.aviso{min-height:calc(2 * 1.45em);margin:8px 0 0}
.registro{margin:8px 0 0;padding-left:20px;font-variant-numeric:tabular-nums}
/* La acción principal no se mueve: barra fija abajo. */
.barra{position:fixed;left:0;right:0;bottom:0;padding:10px max(12px, env(safe-area-inset-left, 0px)) max(10px, env(safe-area-inset-bottom, 0px));
  background:color-mix(in srgb, var(--bg) 92%, transparent);display:flex;justify-content:center}
.barra .btn{min-width:240px}
.kit-svg .kit-carrito{transition:none}
#preg-texto:focus{outline:none}
</style>
</head>
<body>
<div class="marco">
  <header>
    <a class="volver" id="volver" href="/app/#/cursos" aria-label="Volver a la app" hidden>‹</a>
    <h1>El carrito y la pista</h1>
    <span class="parte" id="parte"></span>
  </header>
  <main class="tarjeta">
    <p class="consigna" id="consigna"></p>
    <div class="kit-lienzo" id="lienzo"></div>
    <p class="lectura" id="lectura" aria-hidden="true"></p>
    <div class="kit-lienzo" id="grafica"></div>
    <div class="pregunta" id="pregunta" hidden>
      <p id="preg-texto" tabindex="-1"></p>
      <div class="opciones" id="opciones" role="radiogroup"></div>
    </div>
    <div class="fila" id="controles"></div>
    <div id="tiempo" hidden></div>
    <p class="aviso" id="aviso" role="status"></p>
    <ol class="registro" id="registro" hidden></ol>
  </main>
</div>
<div class="barra"><button class="btn principal" id="seguir" hidden></button></div>

<script src="motor.js"></script>
<script src="leccion.js"></script>
<script src="../../nucleo/medicion.js"></script>
<script src="../../nucleo/kit/kit.js"></script>
<script src="../../nucleo/kit/trazo.js"></script>
<script src="../../nucleo/kit/piezas/ejes.js"></script>
<script src="../../nucleo/kit/piezas/pista.js"></script>
<script src="../../nucleo/kit/piezas/torre.js"></script>
<script src="../../nucleo/kit/linea-tiempo.js"></script>
<script>
'use strict';
const L = window.LeccionMRUV, M = window.MotorMRUV, Pista = Kit.piezas.pista, Ejes = Kit.piezas.ejes, F = Kit.formatear;
const PLANTILLA = { id: 'mruv', unidad: 'fisica.movimiento-rectilineo', version: '0.2.0-a' };
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
if (new URLSearchParams(location.search).get('desde') === 'app') $('volver').hidden = false;

// ---------- Medición (anónima; solo guarda si se entró por la app, como el resto de las escenas) ----------
function registrar(problema, r, t0) {
  if (!window.Medicion) return;
  Medicion.guardar({ tipo: 'prediccion', modulo: PLANTILLA.id, unidad: PLANTILLA.unidad, problema, opcion: r.opcion, correcta: r.correcta,
    error: r.correcta ? '' : r.error, respaldo: '', ms: t0 ? Date.now() - t0 : '' }, PLANTILLA.version);
}

// ---------- Dibujo ----------
let pista = {}, grafica = null;
function pintarPista() { $('lienzo').innerHTML = Pista.dibujar(pista); }
function pintarGrafica() { $('grafica').innerHTML = grafica ? Ejes.dibujar(grafica, { corte: 9 }) : ''; }
// Mueve solo el carrito k (sin redibujar la pista): transform del grupo y giro de las ruedas.
function moverCarrito(k, x, cabeceo = 0) {
  const g = $('lienzo').querySelector('.kit-carrito-' + k);
  if (!g) return;
  const m = Pista.mover(pista, k, x, cabeceo);
  g.setAttribute('transform', m.carrito);
  g.querySelectorAll('.rueda-del,.rueda-tras').forEach(r => {
    const base = r.getAttribute('data-base') || r.getAttribute('transform');
    r.setAttribute('data-base', base);
    r.setAttribute('transform', `${base} ${m.rueda}`);
  });
  pista.carriles[k].x = x;
}
const lectura = (t, x, v) => {
  $('lectura').innerHTML = `t = ${F(t, 1)} s · <span class="v-x">x = ${F(x, 1)} m</span>` + (v === undefined ? '' : ` · <span class="v-v">v = ${F(v, 1)} m/s</span>`);
};
// Puntos de una gráfica entre t0 y t1, con los dos bordes exactos (para el área de un tramo).
function tramo(fn, t0, t1) { const n = Math.max(2, Math.ceil((t1 - t0) * 10)), r = []; for (let k = 0; k <= n; k++) { const t = t0 + (t1 - t0) * k / n; r.push([t, fn(t)]); } return r; }
function curva(fn, t1, color, extra = {}) {
  const pts = []; const n = Math.max(2, Math.ceil(t1 * 10));
  for (let k = 0; k <= n; k++) { const t = t1 * k / n; pts.push([t, fn(t)]); }
  return { puntos: pts, color, ...extra };
}

// ---------- Reloj de la simulación (lineal, con fin; nada pasa de unos 5 s salvo el pedal) ----------
let corriendo = null;
function correr({ dur, cada, fin, tiempoReal }) {
  if (RM && !tiempoReal) { cada(dur(), true); fin(); return; }
  const t0 = performance.now(); let ultimoSeg = -1;
  corriendo = { pausa: false, acumulado: 0, desde: t0 };
  const paso = ahora => {
    if (!corriendo) return;
    if (corriendo.pausa) { requestAnimationFrame(paso); return; }
    const t = Math.min(dur(), corriendo.acumulado + (ahora - corriendo.desde) / 1000);
    const seg = Math.floor(t + 1e-9);
    cada(t, seg !== ultimoSeg); ultimoSeg = seg;
    if (t >= dur() - 1e-9) { corriendo = null; fin(); return; }
    requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
}
function pausar(on) {
  if (!corriendo) return;
  const ahora = performance.now();
  if (on && !corriendo.pausa) { corriendo.acumulado += (ahora - corriendo.desde) / 1000; corriendo.pausa = true; }
  if (!on && corriendo.pausa) { corriendo.desde = ahora; corriendo.pausa = false; }
}

// ---------- Interfaz común ----------
function consigna(t) { $('consigna').textContent = t; }
function aviso(t) { $('aviso').textContent = t || ''; }
function controles(lista) {
  const c = $('controles'); c.innerHTML = '';
  for (const b of lista) {
    const e = document.createElement('button');
    e.className = 'btn' + (b.clase ? ' ' + b.clase : ''); e.textContent = b.texto; e.type = 'button';
    if (b.alClic) e.addEventListener('click', b.alClic);
    if (b.alPulsar) {
      const on = ev => { ev.preventDefault(); e.setAttribute('aria-pressed', 'true'); b.alPulsar(true); };
      const off = () => { if (e.getAttribute('aria-pressed') !== 'true') return; e.setAttribute('aria-pressed', 'false'); b.alPulsar(false); };
      e.setAttribute('aria-pressed', 'false');
      e.addEventListener('pointerdown', on); e.addEventListener('pointerup', off); e.addEventListener('pointerleave', off); e.addEventListener('pointercancel', off);
      e.addEventListener('keydown', ev => { if ((ev.key === ' ' || ev.key === 'Enter') && !ev.repeat) on(ev); });
      e.addEventListener('keyup', ev => { if (ev.key === ' ' || ev.key === 'Enter') off(); });
      e.addEventListener('contextmenu', ev => ev.preventDefault());
    }
    c.appendChild(e);
  }
}
function seguir(texto, alClic) {
  const b = $('seguir');
  if (!texto) { b.hidden = true; b.onclick = null; return; }
  b.textContent = texto; b.hidden = false; b.onclick = () => { b.hidden = true; alClic(); };
}
// Predicción que bloquea (regla 3): mientras está abierta, no hay otro control.
function predecir(id, problema) {
  return new Promise(res => {
    const p = L.PREDICCIONES[id], t0 = Date.now();
    $('preg-texto').textContent = p.pregunta; const o = $('opciones'); o.innerHTML = '';
    // Orden al azar en cada vez: la posición no delata la correcta.
    const ops = p.opciones.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    for (const op of ops) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn opcion'; b.textContent = op.texto; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', 'false');
      b.addEventListener('click', () => {
        b.setAttribute('aria-checked', 'true');
        const r = { ...L.responder(id, op.id), opcion: op.id };
        registrar(problema, r, t0);
        $('pregunta').hidden = true; $('controles').hidden = false;
        res(r);
      });
      o.appendChild(b);
    }
    // La pregunta ocupa el lugar de los controles (que quedan vacíos mientras se predice).
    $('controles').innerHTML = ''; $('controles').hidden = true; $('pregunta').hidden = false;
    $('preg-texto').focus({ preventScroll: true });
  });
}
const parte = (n, nombre) => { $('parte').textContent = `Parte ${n} · ${nombre}`; };

// =============================== Parte 1: empujar (MRU) ===============================
const P1 = { corridas: [], pred: null };
function parte1() {
  parte(1, 'Empujar');
  pista = { largo: L.LARGO, cada: 5, carriles: [{ x: 0, marcas: [] }], registro: [], filas: 2 };
  grafica = { compacto: true, x: { min: 0, max: 5, paso: 1, nombre: 't', unidad: 's' }, y: { min: 0, max: 30, paso: 10, nombre: 'x', unidad: 'm', color: 'i' }, curvas: [] };
  pintarPista(); pintarGrafica(); lectura(0, 0);
  pedirEmpujon();
}
function pedirEmpujon() {
  const n = P1.corridas.length;
  consigna(n === 0 ? 'Empuja el carrito con el dedo y suéltalo.' : P1.pred === 'separacionSuave' ? 'Ahora empújalo más suave.' : 'Ahora empújalo más fuerte.');
  controles([
    { texto: 'Suave', alClic: () => soltar(L.BOTONES.suave, pista.carriles[0].x) },
    { texto: 'Medio', alClic: () => soltar(L.BOTONES.medio, pista.carriles[0].x) },
    { texto: 'Fuerte', alClic: () => soltar(L.BOTONES.fuerte, pista.carriles[0].x) },
  ]);
  arrastre(true);
}
// El dedo: sigue uno a uno mientras arrastra (hasta 6 m); al soltar, rapidez de los últimos 100 ms.
let arrastrando = null;
const ZONA_EMPUJE = 6;   // metros en los que el dedo empuja el carrito antes de soltarlo
function aMetros(clientX) {
  const r = $('lienzo').getBoundingClientRect(), k = Pista.constantes;
  const px = (clientX - r.left) * 320 / r.width;
  return { m: (px - k.PX0) / (k.PX1 - k.PX0) * L.LARGO, escala: (320 / r.width) / ((k.PX1 - k.PX0) / L.LARGO) };
}
function arrastre(on) {
  const el = $('lienzo');
  el.classList.toggle('agarrable', on);
  el.onpointerdown = on ? ev => {
    ev.preventDefault(); el.setPointerCapture(ev.pointerId);
    const a = aMetros(ev.clientX);
    arrastrando = { id: ev.pointerId, x0: pista.carriles[0].x, m0: a.m, muestras: [{ t: ev.timeStamp, x: ev.clientX }] };
    aviso('');
  } : null;
  el.onpointermove = on ? ev => {
    if (!arrastrando || ev.pointerId !== arrastrando.id) return;
    arrastrando.muestras.push({ t: ev.timeStamp, x: ev.clientX });
    const deseado = arrastrando.x0 + aMetros(ev.clientX).m - arrastrando.m0;
    moverCarrito(0, Math.min(ZONA_EMPUJE, Math.max(0, deseado)));
    // Al llegar al final de la zona de empuje con el dedo todavía empujando, el carrito se suelta solo
    // (antes se quedaba pegado en 6 m hasta levantar el dedo).
    if (deseado >= ZONA_EMPUJE) el.onpointerup(ev);
  } : null;
  el.onpointerup = el.onpointercancel = on ? ev => {
    if (!arrastrando || ev.pointerId !== arrastrando.id) return;
    const a = arrastrando; arrastrando = null;
    // Rapidez del dedo en px de pantalla por segundo (clientX), clasificada en suave, medio o fuerte.
    const v = L.clasificarEmpujon(L.rapidezEmpujon(a.muestras, ev.timeStamp));
    if (v === null) { aviso('Suéltalo mientras lo mueves, como un empujón.'); return; }
    soltar(v, pista.carriles[0].x);
  } : null;
}
function soltar(v, x0) {
  arrastre(false); controles([]); seguir(null);
  const n = P1.corridas.length, antes = n ? P1.corridas[n - 1].v : null;
  if (n === 1 && (P1.pred === 'separacion' ? v <= antes : v >= antes)) {
    aviso(`Fue de ${F(v, 0)} m/s y el anterior, de ${F(antes, 0)} m/s. Empújalo ${P1.pred === 'separacion' ? 'más fuerte' : 'más suave'}.`);
    moverCarrito(0, 0); pedirEmpujon(); return;
  }
  const c = L.corridaMRU(v, x0);
  aviso(`Tu empujón: ${F(v, 0)} m/s. Lo redondeamos a 2, 4 o 6 m/s.`);
  consigna('Mira las marcas: una por segundo.');
  const marcas = [];
  pista.carriles[0].marcas = marcas;
  grafica.curvas = [...P1.corridas.map(k => ({ ...k.curva, discontinua: true, rotulo: `${F(k.v, 0)} m/s` }))];
  correr({
    dur: () => c.dur,
    cada: (t, nuevoSeg) => {
      if (nuevoSeg || RM) {
        marcas.length = 0; marcas.push(...c.marcas.filter((m, k) => k <= Math.floor(t + 1e-9)));
        pintarPista();
      }
      moverCarrito(0, c.x(t));
      lectura(t, c.x(t), v);
      grafica.curvas = [...grafica.curvas.filter(k => k.discontinua), curva(c.x, Math.max(t, 0.01), 'i')];
      pintarGrafica();
    },
    fin: () => {
      const k = { v, marcas: c.marcas, curva: curva(c.x, c.dur, 'i') };
      P1.corridas.push(k);
      pista.registro = P1.corridas.map(r => ({ marcas: r.marcas, rotulo: `${F(r.v, 0)} m/s` }));
      pista.carriles[0] = { x: 0, marcas: [] };
      grafica.curvas = P1.corridas.map((r, i) => ({ ...r.curva, discontinua: i < P1.corridas.length - 1, rotulo: `${F(r.v, 0)} m/s` }));
      pintarPista(); pintarGrafica(); lectura(0, 0);
      despuesDeCorrida();
    },
  });
}
async function despuesDeCorrida() {
  if (P1.corridas.length === 1) {
    consigna('Tu corrida quedó registrada abajo.');
    P1.pred = P1.corridas[0].v === 6 ? 'separacionSuave' : 'separacion';
    const r = await predecir(P1.pred, 'v2-' + P1.pred);
    P1.respuesta = r;
    aviso(r.correcta ? '' : r.explica);
    pedirEmpujon();
    return;
  }
  const [a, b] = P1.corridas;
  consigna('Compara las dos tiras.');
  aviso(`Cada segundo, ${F(a.v, 0)} m y ${F(b.v, 0)} m: más rápido es marcas más separadas y recta más empinada.`);
  seguir('Siguiente: dos carritos', parte1b);
}

// =============================== Parte 1b: dos carritos ===============================
const ORDEN_1B = ['alcance', 'cruce', 'nunca'];
const P1B = { i: 0, hechos: [] };
// Regla de Gerson (14 nov): el alumno juega con la simulación antes de cualquier pregunta, también de una predicción.
function parte1b() {
  parte('1b', 'Dos carritos'); P1B.i = 0; $('registro').hidden = true; $('registro').innerHTML = '';
  juego1b();
}
const J1B = { vA: 4, b: 0, corridas: 0 };
function juego1b() {
  const rot = (k, o) => `${k} · ${F(Math.abs(o.v0), 0)} m/s ${o.v0 > 0 ? '→' : '←'}`;
  const armar = () => {
    const A = { x0: 0, v0: J1B.vA }, B = L.SALIDAS_B[J1B.b];
    pista = { largo: L.LARGO, cada: 5, carriles: [{ x: 0, variante: 'a', marcas: [], rotulo: rot('A', A) }, { x: B.x0, variante: 'b', marcas: [], rotulo: rot('B', B) }] };
    grafica = { compacto: true, x: { min: 0, max: 5, paso: 1, nombre: 't', unidad: 's' }, y: { min: 0, max: 30, paso: 10, nombre: 'x', unidad: 'm', color: 'i' }, curvas: [] };
    pintarPista(); pintarGrafica(); lectura(0, 0);
  };
  armar();
  consigna('Juega: cambia las rapideces y suelta los carritos.');
  aviso('');
  const botones = () => controles([
    { texto: `A: ${J1B.vA} m/s`, alClic: () => { J1B.vA = L.RAPIDECES[(L.RAPIDECES.indexOf(J1B.vA) + 1) % L.RAPIDECES.length]; armar(); botones(); } },
    { texto: 'Cambiar B', alClic: () => { J1B.b = (J1B.b + 1) % L.SALIDAS_B.length; armar(); botones(); } },
    { texto: 'Soltar', alClic: soltarJuego },
  ]);
  botones();
  function soltarJuego() {
    controles([]); seguir(null);
    const d = L.dosCarritosCon({ x0: 0, v0: J1B.vA }, L.SALIDAS_B[J1B.b]);
    correr({
      dur: () => d.dur,
      cada: (t, nuevoSeg) => {
        if (nuevoSeg || RM) { const k = Math.floor(t + 1e-9); pista.carriles[0].marcas = d.marcasA.slice(0, k + 1); pista.carriles[1].marcas = d.marcasB.slice(0, k + 1); pintarPista(); }
        moverCarrito(0, d.xA(t)); moverCarrito(1, d.xB(t)); lectura(t, d.xA(t));
        grafica.curvas = [curva(d.xA, Math.max(t, 0.01), 'i', { rotulo: 'A' }), curva(d.xB, Math.max(t, 0.01), 'i', { rotulo: 'B', discontinua: true })];
        pintarGrafica();
      },
      fin: () => {
        J1B.corridas++;
        if (d.encuentro) { pista.encuentro = { x: d.encuentro.x, rotulo: `${F(d.encuentro.x, 0)} m` }; grafica.puntos = [{ x: d.encuentro.t, y: d.encuentro.x, color: 'i', guias: true }]; pintarPista(); pintarGrafica(); }
        aviso(d.encuentro ? `Se encontraron en ${F(d.encuentro.x, 0)} m.` : 'No se encontraron.');

}
function caso1b() {

async function listo1b(d, xBandera) {
  const el = $('lienzo'); el.classList.remove('agarrable'); el.onpointerdown = el.onpointermove = el.onpointerup = el.onpointercancel = null;

      $('registro').appendChild(li);

const nombreCaso = c => ({ alcance: 'Uno alcanza al otro', cruce: 'Se cruzan', nunca: 'Uno se aleja' }[c]);

// =============================== Parte 2: pisar (MRUV) ===============================
const P2 = { eventos: [], predicho: false, tFin: Infinity, frenó: false };
function parte2(libre = true) {
  parte(2, 'Pisar'); $('registro').hidden = true; aviso(''); seguir(null);
  P2.libre = libre;
  P2.eventos = [{ t: 0, pedal: 'suelto' }]; P2.predicho = libre; P2.tFin = Infinity; P2.freno = false; P2.final = false;
  pista = { largo: L.LARGO, cada: 5, carriles: [{ x: 0, marcas: [] }] };
  grafica = { compacto: true, x: { min: 0, max: 10, paso: 2, nombre: 't', unidad: 's' }, y: { min: 0, max: 8, paso: 2, nombre: 'v', unidad: 'm/s', color: 'h' }, curvas: [] };
  pintarPista(); pintarGrafica(); lectura(0, 0, 0);
  consigna(libre ? 'Juega con los pedales: mantenlos apretados.' : 'Otra corrida. Mantén apretado «Acelerar».');
  const pedal = (nombre, on) => {
    if (!corriendo && P2.eventos.length === 1 && on && (nombre === 'acelera' || libre)) arrancar2();
    if (!corriendo) return;
    const t = tiempo2();
    P2.eventos.push({ t, pedal: on ? nombre : 'suelto' });
  };
  controles([
    { texto: 'Frenar', clase: 'pedal', alPulsar: on => {
      if (on && !P2.predicho) { frenarPrimero(); return; }
      pedal('frena', on);
    } },
    { texto: 'Acelerar', clase: 'pedal', alPulsar: on => pedal('acelera', on) },
  ]);
}
let reloj2 = null;
const tiempo2 = () => reloj2 ? reloj2() : 0;
function arrancar2() {
  let tAhora = 0;
  reloj2 = () => tAhora;
  correr({
    tiempoReal: true,      // el pedal se juega en tiempo real; con movimiento reducido, el carrito salta de segundo en segundo
    dur: () => P2.tFin,
    cada: (t, nuevoSeg) => {
      tAhora = t;
      const m = L.corridaPedal(P2.eventos).movil;
      let x = m.x(t);
      // La corrida no se acaba por tiempo: termina al llegar al final de la pista o al quedar quieto después de frenar.
      if (x >= L.LARGO) { x = L.LARGO; P2.tFin = t; P2.final = true; }
      if (m.tParada !== null && t > m.tParada + 0.6) P2.tFin = t;
      const e = P2.eventos[P2.eventos.length - 1], a = L.PEDAL[e.pedal] && m.v(t) > 0 ? L.PEDAL[e.pedal] : 0;
      // En la corrida libre no hay flecha de a: es lo que después se pregunta.
      pista.carriles[0].flecha = a && !P2.libre ? { a } : null;
      if (nuevoSeg || RM) {
        pista.carriles[0].marcas = L.marcas(m, Math.min(t, P2.tFin)).filter(v => v <= L.LARGO);
        pintarPista();
      } else if (!!$('lienzo').querySelector('.kit-carrito-0 line[stroke="var(--c-d)"]') !== !!a) pintarPista();
      if (!RM || nuevoSeg) moverCarrito(0, x, RM ? 0 : a < 0 ? 3 : a > 0 ? -3 : 0);
      lectura(t, x, m.v(t));
      grafica.curvas = [curva(m.v, Math.max(t, 0.01), 'h')];
      pintarGrafica();
    },
    fin: () => {
      controles([]);
      const m = L.corridaPedal(P2.eventos).movil;
      pista.carriles[0].flecha = null; pintarPista();
      if (P2.libre) {
        consigna('Juega otra vez o sigue.');
        aviso('Mira las marcas y la gráfica v-t de tu corrida.');
        controles([{ texto: 'Otra vez', alClic: () => { reloj2 = null; parte2(true); } }]);
        seguir('Ya jugué: seguir', () => { reloj2 = null; parte2(false); });
        return;
      }
      if (P2.final && !P2.eventos.some(e => e.pedal === 'frena')) {
        consigna('Llegó al final sin frenar.'); aviso('Esta vez, frena antes del final.');
        seguir('Otra vez', () => { reloj2 = null; parte2(false); });
        return;
      }
      consigna('Mira cómo cambian las marcas.');
      aviso('Al acelerar, las marcas se abren y v sube. Al frenar, se cierran y v baja: la aceleración apunta hacia atrás.');
      // La corrida queda guardada para la sesión 2 (pintar su área), que es otro día.
      try { localStorage.setItem(CLAVE_CORRIDA, JSON.stringify(P2.eventos)); } catch (e) { /* sin almacenamiento: la sesión 2 usa una de ejemplo */ }

    },
  });
}
async function frenarPrimero() {

  pausar(true);
  const r = await predecir('k3', 'v2-k3');
  P2.predicho = true;
  consigna('Mantén apretado «Frenar».');
  aviso(r.correcta ? '' : r.explica);
  parte2Controles();
  pausar(false);
}
function parte2Controles() {
  const pedal = (nombre, on) => { if (!corriendo) return; P2.eventos.push({ t: tiempo2(), pedal: on ? nombre : 'suelto' }); };
  controles([
    { texto: 'Frenar', clase: 'pedal', alPulsar: on => pedal('frena', on) },
    { texto: 'Acelerar', clase: 'pedal', alPulsar: on => pedal('acelera', on) },
  ]);
}

// =============================== Sesiones: 1 (partes 1, 1b y 2), 2 (parte 3) y 3 (partes 4 y 5) ===============================
const CLAVE_CORRIDA = 'mruv-v2-corrida';
function irSesion(n) { const u = new URL(location.href); u.searchParams.set('sesion', n); location.href = u.toString(); }
function limpiarFigura() {
  ['lienzo', 'grafica'].forEach(id => { const e = $(id); e.innerHTML = ''; e.classList.remove('agarrable'); e.onpointerdown = e.onpointermove = e.onpointerup = e.onpointercancel = null; });
  $('registro').hidden = true; $('tiempo').hidden = true; $('tiempo').innerHTML = ''; controles([]); aviso(''); seguir(null);
}

// =============================== Parte 3: pintar el área (sesión 2) ===============================
async function parte3() {
  limpiarFigura(); parte(3, 'Pintar el área');
  let eventos = null;
  try { eventos = JSON.parse(localStorage.getItem(CLAVE_CORRIDA) || 'null'); } catch (e) { eventos = null; }
  let propia = Array.isArray(eventos) && eventos.length > 1;
  let A;
  try { A = L.areas(propia ? eventos : L.CORRIDA_DEFECTO); } catch (e) { propia = false; A = L.areas(L.CORRIDA_DEFECTO); }
  if (!propia) eventos = L.CORRIDA_DEFECTO;
  const m = A.movil, fin = A.fin, tMax = Math.max(6, Math.ceil(fin));
  const vPico = Math.max(...A.tramos.flatMap(t => [t.v0, t.v1])), vMax = Math.max(8, 2 * Math.ceil(vPico / 2));
  // La pista arriba: el carrito avanza lo que se lleva pintado (fidelidad: la misma cifra en la regla y en el área).
  pista = { largo: L.LARGO, cada: 5, carriles: [{ x: 0, marcas: [] }] };
  const base = () => ({ compacto: true, x: { min: 0, max: tMax, paso: 1, nombre: 't', unidad: 's' }, y: { min: 0, max: vMax, paso: 2, nombre: 'v', unidad: 'm/s', color: 'h' },
    curvas: [curva(m.v, fin, 'h')], areas: [] });
  grafica = base();
  pintarPista(); pintarGrafica(); lectura(0, 0);
  consigna(propia ? 'Esta es la gráfica v-t de tu corrida con el pedal.' : 'Esta es la gráfica v-t de una corrida con el pedal.');
  if (!propia) aviso('No encontramos tu corrida de la sesión 1: usamos una de ejemplo.');
  consigna('Pasa el dedo por la gráfica: pinta lo que hay debajo.');
  let hasta = 0;
  const pintar = t => {
    hasta = Math.max(hasta, Math.min(fin, Math.max(0, t)));
    const p = L.pintado(eventos, hasta);
    grafica.areas = hasta > 0 ? [{ puntos: curva(m.v, hasta, 'h').puntos, color: 'i' }] : [];
    pintarGrafica();
    // Mientras pinta solo cuenta cuadritos: lo que miden se pregunta después y se ve en la regla al final.
    $('lectura').textContent = `${F(p.cuadritos, 1)} cuadritos pintados`;
    if (hasta >= fin - 1e-9) terminar();
  };
  const el = $('grafica');
  const aT = clientX => {
    const r = el.getBoundingClientRect(), g = Ejes.geometria(grafica);
    const px = (clientX - r.left) * 320 / r.width;
    return (px - g.X(0)) / (g.X(tMax) - g.X(0)) * tMax;
  };
  el.classList.add('agarrable');
  el.onpointerdown = ev => { ev.preventDefault(); el.setPointerCapture(ev.pointerId); pintar(aT(ev.clientX)); el.onpointermove = e => pintar(aT(e.clientX)); };
  el.onpointerup = el.onpointercancel = () => { el.onpointermove = null; };
  controles([{ texto: 'Pintar 1 s más', alClic: () => pintar(Math.floor(hasta + 1e-9) + 1) }, { texto: 'Pintar todo', alClic: () => pintar(fin) }]);
  let listo = false;
  async function terminar() {
    if (listo) return; listo = true;
    el.classList.remove('agarrable'); el.onpointerdown = el.onpointermove = null; controles([]);
    const r = await predecir('area', 'v2-area');
    aviso(r.correcta ? '' : r.explica);
    // Ahora el carrito recorre la corrida: avanza lo mismo que el área pintada.
    consigna('Mira la regla mientras el carrito recorre tu corrida.');
    await new Promise(fin_ => correr({ dur: () => fin, cada: t => { moverCarrito(0, m.x(t)); $('lectura').innerHTML = `${F(L.pintado(eventos, t).cuadritos, 1)} cuadritos · <span class="v-x">x = ${F(m.x(t), 1)} m</span>`; }, fin: fin_ }));
    // Cada tramo con su área: así se arma la regla (rectángulo v·t, triángulo la mitad).
    grafica.areas = A.tramos.map(t => ({ puntos: tramo(m.v, t.t0, t.t1), color: 'i', rotulo: `${F(t.area, 1)} m` }));
    pintarGrafica();
    pista.carriles[0].marcas = []; pista.encuentro = { x: A.total, rotulo: `${F(A.total, 1)} m` }; pintarPista();
    const suma = A.tramos.map(t => F(t.area, 1)).join(' + ');
    consigna('Lo pintado es lo que avanzó.');
    aviso(`${r.correcta ? '' : r.explica + ' '}${suma} = ${F(A.total, 1)} m, lo mismo que marca la regla. Rectángulo: v · t. Triángulo: la mitad.`);
    seguir('Fin de la sesión 2 · Ir a la sesión 3', () => irSesion(3));
  }
}

// =============================== Parte 4: parar la pista (sesión 3) ===============================
const Torre = Kit.piezas.torre;
let torre = {};
const pintarTorre = () => { $('lienzo').innerHTML = Torre.dibujar(torre); };
async function parte4() {
  limpiarFigura(); parte(4, 'Parar la pista');
  torre = { alto: L.ALTO, pelotas: [{ y: 0, marcas: [] }] };
  grafica = { compacto: true, x: { min: 0, max: 4, paso: 1, nombre: 't', unidad: 's' }, y: { min: -20, max: 20, paso: 10, nombre: 'v', unidad: 'm/s', color: 'h' }, curvas: [] };
  torre.g = false;                      // en el juego libre no hay flecha de g: es lo que después se pregunta
  pintarTorre(); pintarGrafica();
  $('lectura').innerHTML = '';
  consigna('La pista ahora está parada. Lanza la pelota hacia arriba, con el dedo o con un botón.');
  let r = null, libres = 0;
  const lanzarCon = v0 => {
    desactivarGesto(); controles([]);
    const l = L.lanzar(v0);
    aviso(`Tu lanzamiento: ${F(v0, 0)} m/s hacia arriba. Lo redondeamos a 10, 15 o 20 m/s.`);
    correr({
      dur: () => l.dur,
      cada: t => {
        const k = Math.floor(t / 0.5 + 1e-9);
        torre.pelotas[0] = { y: l.y(t), v: l.v(t), marcas: l.marcas.slice(0, k + 1) };
        pintarTorre();
        $('lectura').innerHTML = `<span class="v-x">y = ${F(l.y(t), 1)} m</span> · <span class="v-v">v = ${F(l.v(t), 1)} m/s</span>` + (r ? ' · <span class="v-a">a = −10 m/s²</span>' : '');
        grafica.curvas = [curva(l.v, Math.max(t, 0.01), 'h')]; pintarGrafica();
      },
      fin: async () => {
        if (!r) {
          // Juego libre: puede lanzar otra vez o pasar a la pregunta.
          libres++;
          aviso(`Subió ${F(l.cima, 0)} m y tardó ${F(l.dur, 1)} s en volver.`);
          controles(L.LANZAMIENTOS.map(v => ({ texto: `${v} m/s`, alClic: () => { seguir(null); lanzarCon(v); } })));
          activarGesto();
          seguir('Ya jugué: seguir', async () => {
            controles([]); desactivarGesto();
            r = await predecir('c1', 'v2-c1');
            aviso(r.correcta ? '' : r.explica);
            torre.g = true; torre.pelotas[0] = { y: 0, marcas: [] }; pintarTorre(); grafica.curvas = []; pintarGrafica();
            consigna('Ahora con la flecha de la aceleración. Lánzala otra vez.');
            controles(L.LANZAMIENTOS.map(v => ({ texto: `${v} m/s`, alClic: () => lanzarCon(v) })));
            activarGesto();
          });
          return;
        }
        // La cima queda a la vista: pelota arriba, v = 0 y la misma flecha de g.
        torre.pelotas[0] = { y: l.cima, v: 0, marcas: l.marcas };
        pintarTorre();
        $('lectura').innerHTML = `En la cima: <span class="v-v">v = 0</span> · <span class="v-a">a = −10 m/s²</span>`;
        consigna('Arriba, la velocidad es cero; la aceleración, no.');
        aviso(`${r.correcta ? '' : r.explica + ' '}La flecha de g no cambió en todo el viaje: 10 m/s² hacia abajo.`);
        seguir('Siguiente: dos pelotas', parte4b);
      },
    });
  };
  // Gesto hacia arriba: la rapidez de los últimos 100 ms (en m/s de la torre), ajustada a 10, 15 o 20.
  const el = $('lienzo');
  let muestras = null;
  function desactivarGesto() { el.classList.remove('agarrable'); el.onpointerdown = el.onpointermove = el.onpointerup = null; }
  function activarGesto() {
  el.classList.add('agarrable');
  const escala = () => { const r = el.getBoundingClientRect(); return (320 / r.width) / ((Torre.constantes.SUELO - Torre.constantes.TECHO) / L.ALTO); };
  el.onpointerdown = ev => { ev.preventDefault(); el.setPointerCapture(ev.pointerId); muestras = [{ t: ev.timeStamp, x: -ev.clientY }]; };
  el.onpointermove = ev => { if (muestras) muestras.push({ t: ev.timeStamp, x: -ev.clientY }); };
  el.onpointerup = ev => {
    if (!muestras) return;
    const v = L.rapidezDedo(muestras, ev.timeStamp) * escala() * 4;   // ×4: un dedo no recorre la torre entera; el empujón se amplifica
    muestras = null;
    const v0 = v >= 2 ? L.LANZAMIENTOS.reduce((a, b) => (Math.abs(b - v) < Math.abs(a - v) ? b : a)) : null;
    if (v0 === null) { aviso('Suéltala mientras la mueves hacia arriba.'); return; }
    seguir(null); lanzarCon(v0);
  };
  }
  activarGesto();
  controles(L.LANZAMIENTOS.map(v => ({ texto: `${v} m/s`, alClic: () => lanzarCon(v) })));
}
async function parte4b() {
  limpiarFigura(); parte(4, 'Dos pelotas');
  // Juego libre: soltar una pelota desde la altura que quiera, antes de preguntar por dos masas.
  await new Promise(listo => {
    torre = { alto: L.ALTO, pelotas: [{ y: L.ALTO, rotulo: '1 kg' }] };
    pintarTorre(); $('lectura').innerHTML = ''; grafica = null; pintarGrafica();
    consigna('Juega: suelta la pelota desde la altura que quieras.');
    const soltarDesde = h => {
      controles([]); seguir(null);
      const d1 = L.soltarDos(h);
      torre.pelotas[0].y = h; pintarTorre();
      correr({ dur: () => d1.tSuelo, cada: t => { torre.pelotas[0].y = d1.y(t); pintarTorre(); $('lectura').innerHTML = `t = ${F(t, 1)} s`; },
        fin: () => { aviso(`Desde ${F(h, 0)} m tardó ${F(d1.tSuelo, 2)} s.`); botones(); seguir('Ya jugué: seguir', listo); } });
    };
    const botones = () => controles([5, 10, 20].map(h => ({ texto: `Desde ${h} m`, alClic: () => soltarDesde(h) })));

  const d = L.soltarDos();
  torre = { alto: L.ALTO, pelotas: [{ y: L.ALTO, rotulo: '1 kg' }, { y: L.ALTO, rotulo: '5 kg', grande: true }] };
  pintarTorre(); $('lectura').innerHTML = ''; grafica = null; pintarGrafica();
  consigna('Dos pelotas a 20 m de altura.');
  const r = await predecir('c2', 'v2-c2');
  consigna('Suéltalas a la vez.');
  seguir('Soltar las dos', () => {
    correr({
      dur: () => d.tSuelo,
      cada: t => { torre.pelotas[0].y = torre.pelotas[1].y = d.y(t); pintarTorre(); $('lectura').innerHTML = `t = ${F(t, 1)} s`; },
      fin: () => {
        consigna('Llegan juntas.');
        aviso(r.correcta ? `Las dos tardan ${F(d.tSuelo, 1)} s: sin aire, la masa no cambia la caída.` : `${r.explica} Las dos tardan ${F(d.tSuelo, 1)} s.`);
        seguir('Siguiente: un problema de examen', parte5);
      },
    });
  });
}

// =============================== Parte 5: transferir (sesión 3) ===============================
function datosProblema(P, conAreas) {
  const pts = []; for (let k = 0; k <= P.fin * 4; k++) pts.push([k / 4, P.movil.v(k / 4)]);
  return { compacto: true, x: { min: 0, max: Math.ceil(P.fin), paso: 1, cada: 2, nombre: 't', unidad: 's' }, y: { min: 0, max: P.vmax + 2, paso: 2, nombre: 'v', unidad: 'm/s', color: 'h' },
    curvas: [{ puntos: pts, color: 'h', desde: 0 }],
    areas: conAreas ? P.partes.map((q, i) => ({ puntos: pts.filter(p => p[0] >= q.t0 - 1e-9 && p[0] <= q.t1 + 1e-9), color: 'i', rotulo: `${F(q.area, 0)} m`, desde: i + 1 })) : [] };
}
async function parte5() {
  limpiarFigura(); parte(5, 'Examen');
  const P = L.problema('auto');
  const datos = datosProblema(P, true);
  const [a, b, c] = P.partes;
  const pasos = [
    { estado: { corte: 0 }, texto: `Acelera ${F(a.t1, 0)} s, sigue ${F(b.t1 - b.t0, 0)} s y frena ${F(c.t1 - c.t0, 0)} s.` },
    { estado: { corte: 1 }, texto: `Primer tramo, triángulo: ½ · ${F(a.t1 - a.t0, 0)} · ${F(P.vmax, 0)} = ${F(a.area, 0)} m.` },
    { estado: { corte: 2 }, texto: `Rapidez constante, rectángulo: ${F(P.vmax, 0)} · ${F(b.t1 - b.t0, 0)} = ${F(b.area, 0)} m.` },
    { estado: { corte: 3 }, texto: `Al frenar, triángulo: ½ · ${F(c.t1 - c.t0, 0)} · ${F(P.vmax, 0)} = ${F(c.area, 0)} m.` },
    { estado: { corte: 3 }, texto: `Total: ${F(a.area, 0)} + ${F(b.area, 0)} + ${F(c.area, 0)} = ${F(P.total, 0)} m.` },
  ];
  consigna(P.texto);
  $('lienzo').innerHTML = ''; $('lectura').innerHTML = '';
  $('tiempo').hidden = false;
  const montar = n => Kit.lineaTiempo.montar($('tiempo'), { pieza: Ejes, datos, pasos: pasos.slice(0, n), figura: $('grafica'), pie: $('aviso') });
  let lt = montar(2); lt.ir(1, false);
  // Antes del tercer paso, el alumno elige qué se calcula (un paso por elegir del ejemplo resuelto).
  seguir('Elegir el paso siguiente', async () => {
    lt.pausar(); lt.destruir && lt.destruir(); $('tiempo').hidden = true;
    const r = await predecir('paso', 'v2-paso');
    $('tiempo').hidden = false;
    lt = montar(pasos.length); lt.ir(3, true);
    if (!r.correcta) aviso(`${r.explica} ${pasos[2].texto}`);
    seguir('Ahora tú, solo', parte5b);
  });
}
async function parte5b() {
  limpiarFigura(); parte(5, 'Ahora tú');
  const P = L.problema(Math.random() < 0.5 ? 'bus' : 'moto');
  grafica = datosProblema(P, false); pintarGrafica();
  consigna(P.texto); $('lienzo').innerHTML = ''; $('lectura').innerHTML = '';
  // Alternativas al azar; los valores salen del motor (leccion.problema).
  const t0 = Date.now(), o = $('opciones'); o.innerHTML = '';
  $('preg-texto').textContent = 'Lo que avanzó:';
  for (const op of P.opciones.map(x => [Math.random(), x]).sort((x, y) => x[0] - y[0]).map(x => x[1])) {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'btn opcion'; btn.textContent = `${F(op.valor, 0)} m`; btn.setAttribute('role', 'radio'); btn.setAttribute('aria-checked', 'false');
    btn.addEventListener('click', () => {
      btn.setAttribute('aria-checked', 'true');
      registrar('v2-transferir-' + P.id, { opcion: op.id, correcta: !!op.correcta, error: op.error }, t0);
      $('pregunta').hidden = true; $('controles').hidden = false;
      grafica = datosProblema(P, true); grafica.areas.forEach(a => { a.desde = 0; }); pintarGrafica();
      consigna(op.correcta ? `Sí: ${F(P.total, 0)} m.` : `Avanzó ${F(P.total, 0)} m.`);
      aviso(`${op.correcta ? '' : op.explica + ' '}${P.partes.map(q => F(q.area, 0)).join(' + ')} = ${F(P.total, 0)} m.`);
      seguir('Terminar', () => { consigna('Terminaste la unidad. Otro día te llega una pregunta de repaso.'); aviso(''); limpiarFigura(); parte(5, 'Fin'); });
    });
    o.appendChild(btn);
  }
  $('controles').hidden = true; $('pregunta').hidden = false;
}

({ 2: parte3, 3: parte4 }[new URLSearchParams(location.search).get('sesion')] || parte1)();
