const datos = () => ({ v0:S.v0, angulo:S.ang, y0:S.y0 });

function draw(){
  if (!L.W) return;
  const s = steps[S.step], c = colores(L.W), P = s.cfg();
  P.crece = S.crece; P.hl = S.hl;
  vistaTiro(L, c, P);
  decir($('desc1'), S.explora ? resumen() : s.desc());
}
function resumen(){
  const p = M.proyectil(datos());
  return `Disparo a ${S.v0} metros por segundo y ${S.ang} ${S.ang === 1 ? 'grado' : 'grados'} desde ${S.y0} metros: altura máxima ${N1(p.H)} metros, ${fmt(p.tVuelo, 2)} segundos en el aire, alcance ${N1(p.alcance)} metros.`;
}
function vuela(desde, hasta, listo){
  parar(); S.t = desde;
  parar = animarValor(RM ? 0 : (hasta - desde)*650, f => { S.t = desde + (hasta - desde)*f; draw(); }, listo);
}
const dots = $('dots');
steps.forEach((s, n) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.textContent = n + 1;
  b.addEventListener('click', () => go(n)); li.appendChild(b); dots.appendChild(li);
});
function go(n){
  if (n < 0 || n >= steps.length || n > S.max) return;
  parar(); S.ocupado = false;
  const s = steps[n]; S.step = n; S.hl = null; S.explora = !!s.explora; S.crece = 1;
  cv.tabIndex = S.explora ? 0 : -1;
  cv.setAttribute('aria-label', S.explora ? 'Campo de tiro del explorador: con las flechas del teclado cambias el ángulo del cañón' : 'Campo de tiro con un cañón, el proyectil y sus sombras sobre los ejes');
  S.t = s.anima && s.gate && S.pred[s.gate.id] ? s.anima.hasta : 0;
  $('stepK').textContent = `${s.k} de ${steps.length}`;
  $('stepT').textContent = s.t;
  $('stepBody').innerHTML = s.body();
  L.compactar(s.gate && !S.pred[s.gate.id]);
  L.resize();
  const respondido = s.gate && S.pred[s.gate.id];
  leyenda($('ley1'), s.gate && !respondido && s.leyAntes ? s.leyAntes : respondido && s.leyDespues ? s.leyDespues : (s.ley || []));
  pintarDots();
  if (s.gate) prediccion(s);
  if (s.anima && s.anima.siempre){ vuela(0, 6); $('otra').onclick = () => vuela(0, 6); }
  if (s.explora) explorar();
  nav(); draw();
}
function nav(){
  const s = steps[S.step];
  $('prev').disabled = S.step === 0;
  const falta = s.gate && !S.pred[s.gate.id];
  $('next').disabled = S.step === steps.length - 1 || falta || S.ocupado;
  $('next').textContent = falta ? 'Elige una opción' : 'Siguiente';
}
function pintarDots(){
  [...dots.querySelectorAll('button')].forEach((b, k) => {
    b.className = k === S.step ? 'on' : (k <= S.max ? 'done' : ''); b.disabled = k > S.max;
    if (k > S.max) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
    b.setAttribute('aria-label', k > S.max ? `Paso ${k + 1}, bloqueado` : `Ir al ${steps[k].k.toLowerCase()}: ${steps[k].t}`);
    if (k === S.step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
}
function desbloquear(n){ if (n > S.max) S.max = n; }
function prediccion(s){
  const P = s.gate, btns = [...$('stepBody').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[P.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === P.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb'); fb.textContent = P.fb[p]; fb.className = 'fb ' + (p === P.ok ? 'ok' : 'mal');
    $('res').innerHTML = s.exp();
  };
  const t0 = Date.now();
  btns.forEach(b => b.addEventListener('click', () => {
    if (S.pred[P.id] || S.ocupado) return;
    const o = P.opts.find(q => q[0] === b.dataset.k);
    S.pred[P.id] = o[0]; desbloquear(S.step + 1);
    registrarPrediccion(P.id, o[0], o[0] === P.ok, o[2] || '', o[3] || '', t0);
    S.ocupado = true; pintar(); pintarDots(); nav();
    leyenda($('ley1'), s.leyDespues || s.ley || []);
    $('fb').focus({ preventScroll:true });
    const paso = S.step, an = s.anima;
    S.t = an.desde || 0; S.crece = an.crece ? 0 : 1;
    L.compactar(false); draw();
    // En el celular, el dibujo sube a la vista y la animación arranca ~380 ms después (nucleo/celular.js).
    Celular.alResponder(cv, () => {
      const fin = () => { S.ocupado = false; nav(); draw(); if (!RM && S.step === paso && !$('m1').hidden) $('next').focus({ preventScroll:true }); };
      if (an.crece) parar = animarValor(500, f => { S.crece = f; draw(); }, () => vuela(an.desde || 0, an.hasta, fin));
      else vuela(an.desde || 0, an.hasta, fin);
    }, () => S.step === paso && !$('m1').hidden, { siNo: () => { S.ocupado = false; nav(); } });
  }));
  pintar();
}

// ----- explorador -----
function explorar(){
  [['e-v0', 'v0'], ['e-ang', 'ang'], ['e-y0', 'y0']].forEach(([id, k]) => $(id).addEventListener('input', () => {
    parar(); S[k] = +$(id).value;
    if (S.y0 === 0 && S.ang < 1) S.ang = 1; // desde el suelo, a 0° no hay tiro
    acomodarPared(); S.t = tFinal(); vivo();
  }));
  $('disparar').addEventListener('click', () => disparar());
  $('e-pared').addEventListener('change', () => {
    parar(); S.pared = $('e-pared').checked; $('e-pared-ctrl').hidden = !S.pared;
    if (S.pared){ S.dPared = Math.max(5, Math.round(M.proyectil(datos()).alcance*0.6/5)*5); $('e-d').value = S.dPared; }
    acomodarPared(); S.t = tFinal(); L.resize(); vivo();
  });
  $('e-d').addEventListener('input', () => { parar(); S.dPared = +$('e-d').value; acomodarPared(); S.t = tFinal(); vivo(); });
  $('e-h').addEventListener('input', () => { parar(); S.altoPared = +$('e-h').value; S.t = tFinal(); vivo(); });
  acomodarPared(); S.t = tFinal(); vivo();
}
// La pared se queda dentro del dibujo: el deslizador llega hasta el borde derecho del campo.
function acomodarPared(){
  const max = Math.max(5, Math.floor(XmaxExplora() - 4));
  S.dPared = clamp(S.dPared, 5, max);
  const d = $('e-d'); if (d){ d.max = max; d.value = S.dPared; }
}
function disparar(){
  // El disparo anterior queda a trazos, para comparar (se guarda al empezar el nuevo).
  const ahora = JSON.stringify(datos());
  if (S.ultimo && S.ultimo !== ahora) S.previo = JSON.parse(S.ultimo);
  S.ultimo = ahora;
  acomodarPared(); vuela(0, tFinal());
}
function vivo(){
  $('e-v0-o').textContent = `${S.v0} m/s`; $('e-ang-o').textContent = `${S.ang}°`; $('e-y0-o').textContent = `${S.y0} m`;
  if (+$('e-ang').value !== S.ang) $('e-ang').value = S.ang;
  const p = M.proyectil(datos());
  $('live').innerHTML = `<div class="eqs">
      <div class="eq">${V('vx','vx')} = ${fmt(p.vx, 1)} m/s · ${V('vy','v₀y')} = ${fmt(p.vy, 1)} m/s</div>
      <div class="eq">subida ${fmt(p.tSubida, 2)} s · altura máxima ${fmt(p.H, 1)} m</div>
      <div class="eq">${V('t','en el aire')} ${fmt(p.tVuelo, 2)} s · alcance ${fmt(p.alcance, 1)} m</div>
    </div>${chipsPared()}`;
  if (S.pared){ $('e-d-o').textContent = `${S.dPared} m`; $('e-h-o').textContent = S.altoPared >= 100 ? 'muy alta' : `${S.altoPared} m`; }
  // Se rehace en cada movimiento del deslizador: sus datos de color no son paradas del tabulador.
  $('live').querySelectorAll('.v').forEach(e => e.removeAttribute('tabindex'));
  draw();
}
function chipsPared(){
  if (!S.pared) return '';
  const w = impacto();
  if (w.sinAvance) return '<div class="chips"><span class="chip">a 90° no avanza: no llega a la pared</span></div>';
  if (w.choca) return `<div class="chips"><span class="chip">golpea la pared a ${fmt(w.y, 1)} m</span><span class="chip">${FASES[w.fase]}</span><span class="chip">${V('v','v')} = ${fmt(w.v, 1)} m/s</span></div>`;
  return `<div class="chips"><span class="chip">${w.motivo === 'cae-antes' ? `no llega: cae a ${fmt(w.alcance, 1)} m` : 'pasa por encima de la pared'}</span></div>`;
}
// Asas del explorador: la boca del cañón (ángulo) y el pie de la pared (distancia). Celular.arrastre elige la más cercana.
function asas(){
  const P = steps[S.step].cfg(), m = marco(L.W, L.H, P), th = S.ang*Math.PI/180;
  const r = [{ id:'canon', x:m.X(0) + Math.cos(th)*40, y:m.Y(S.y0) - Math.sin(th)*40, m }];
  if (S.pared) r.push({ id:'pared', x:m.X(S.dPared) + 4, y:m.Y(0), m });
  return r;
}
function masCercana(p, rad){
  let mejor = null, dm = rad;
  for (const a of asas()){ const d = Math.hypot(p.x - a.x, p.y - a.y); if (d < dm){ dm = d; mejor = a; } }
  return mejor;
}
function ponerAngulo(p){
  const m = marco(L.W, L.H, steps[S.step].cfg()), bx = m.X(0), by = m.Y(S.y0);
  const ang = Math.round(clamp(Math.atan2(by - p.y, p.x - bx)*180/Math.PI, S.y0 > 0 ? 0 : 1, 90));
  if (ang !== S.ang){ parar(); S.ang = ang; acomodarPared(); S.t = tFinal(); vivo(); }
}
function ponerPared(p){
  const m = marco(L.W, L.H, steps[S.step].cfg()), d = Math.round(m.xmin + (p.x - 4 - m.ml)/m.sx);
  const nd = clamp(d, 5, Math.max(5, Math.floor(XmaxExplora() - 4)));
  if (nd !== S.dPared){ parar(); S.dPared = nd; acomodarPared(); S.t = tFinal(); vivo(); }
}
Celular.arrastre(cv, {
  activo: () => S.explora,
  cerca: (p, r) => { S.cerca = masCercana(p, r); return !!S.cerca; },
  empezar: () => { S.cual = S.cerca && S.cerca.id; draw(); },
  mover: p => { if (S.cual === 'canon') ponerAngulo(p); else if (S.cual === 'pared') ponerPared(p); },
  soltar: () => { S.cual = null; draw(); },
  sobre: s => { S.sobre = s && S.cerca ? S.cerca.id : null; draw(); }
});
cv.addEventListener('keydown', e => {
  if (!S.explora) return;
  const d = { ArrowUp:1, ArrowRight:1, ArrowDown:-1, ArrowLeft:-1 }[e.key]; if (!d) return;
  e.preventDefault(); parar(); S.ang = clamp(S.ang + d, S.y0 > 0 ? 0 : 1, 90); acomodarPared(); S.t = tFinal(); vivo();
});

$('next').addEventListener('click', () => { desbloquear(S.step + 1); go(S.step + 1); $('stepT').focus({ preventScroll:true }); });
$('prev').addEventListener('click', () => go(S.step - 1));
function marcar(k){
  S.hl = k;
  document.querySelectorAll('#m1 .v').forEach(e => e.classList.toggle('hl', !!k && e.dataset.var === k));
  draw();
}
document.addEventListener('pointerover', e => { const t = e.target.closest && e.target.closest('#m1 [data-var]'); if (t) marcar(t.dataset.var); });
document.addEventListener('pointerout', e => { const t = e.target.closest && e.target.closest('#m1 [data-var]'); if (t && !t.contains(e.relatedTarget)) marcar(null); });
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('#m1 [data-var]'); if (t) marcar(t.dataset.var); });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('#m1 [data-var]')) marcar(null); });
alRedibujarTema(draw);
addEventListener('modo', () => { if ($('m1').hidden){ parar(); S.ocupado = false; } else go(S.step); });
L.resize(); go(0);
})();
</script>
<script>
/* ================= Máquina de experimentos (pestañas 2 y 3) =================
   La escena cambia recién después de responder. Los experimentos de cada pestaña se abren en orden
   (decisión de Gerson, 6 nov 2026); entre pestañas no se bloquea nada. Toda la física sale de MotorTiro.
   cfg = { modo, cv, exps, ley, k, t, body, desc, titulo, nombres, ids:{ fb, res, sig, rep }, crear(api) → EXPS }
   Cada experimento: { id, mid (id de medición), corto, tipo, ley, leyAntes, q, opts, ok, fb, antes(), despues(revisita),
   ctrl(), vivo(), alCambiar(), enlazar(), exp, dibujar(L, c), desc(respondido), arrastre:{ cerca, mover }, continuo } */
function modoExperimentos(cfg){
  const $ = id => document.getElementById(id);
  const modo = $(cfg.modo), cv = $(cfg.cv), ids = cfg.ids;
  const E = {}, S = { k:0, pred:{}, t0:Date.now() };
  let EXPS = [];
  const L = crearLienzo(cv, W => { const x = EXPS[S.k]; if (!x) return altoLienzo(W); return x.alto ? x.alto(W) : x.tipo === 'tiro' && E.cfg ? altoCampo(W, E.cfg) : altoLienzo(W); }, draw);
  // Un solo bucle por lienzo (nucleo/celular.js): se duerme cuando nada se mueve o el lienzo no se ve.
  const bucle = Celular.bucle(cv, dt => {
    if (!E.mover) return false;
    const sigue = E.mover(Math.min(dt, 0.05));
    if (!sigue) E.mover = null;
    draw(); return !!sigue;
  });
  function parar(){ E.mover = null; }
  // Lleva una animación que no es un giro sin fin a su último cuadro (al volver a un experimento o al cambiar de pestaña).
  function terminar(x){ if (E.mover && !x.continuo){ let n = 0; while (E.mover && E.mover(1e3) && n++ < 1e4); } E.mover = null; }
  // mover(dt) avanza el estado y devuelve true mientras siga. Con movimiento reducido, se salta al final
  // (o, si es un giro sin fin, se dibuja quieto).
  function animar(mover, continuo){
    parar();
    if (RM){ if (!continuo){ let n = 0; while (mover(1e3) && n++ < 1e4); } draw(); return; }
    E.mover = mover; bucle.despertar();
  }
  const api = { E, animar, parar, draw: () => draw(), ir: k => ir(k), $, L, pred: id => S.pred[id] };
  const abierto = k => EXPS.slice(0, k).every(x => S.pred[x.id]);
  function draw(){
    if (!L.W || !EXPS.length) return;
    const x = EXPS[S.k], c = colores(L.W);
    if (x.dibujar) x.dibujar(L, c);
    else if (x.tipo === 'circulo') vistaCirculo(L, c, Object.assign({ crece:E.crece }, E.circ));
    else vistaTiro(L, c, Object.assign({}, E.cfg, { t:E.t, crece:E.crece }));
    decir($(cfg.desc), x.desc(!!S.pred[x.id]));
  }
  function botones(){
    const cont = $(cfg.exps);
    if (!cont.children.length){
      cont.innerHTML = EXPS.map((x, k) => `<button type="button" data-k="${k}">${k + 1}. ${x.corto}</button>`).join('');
      cont.querySelectorAll('button').forEach(b => b.onclick = () => ir(+b.dataset.k));
    }
    [...cont.children].forEach((b, k) => {
      const ok = abierto(k);
      b.disabled = !ok; b.setAttribute('aria-pressed', String(k === S.k));
      if (ok){ b.removeAttribute('aria-disabled'); b.removeAttribute('aria-label'); }
      else { b.setAttribute('aria-disabled', 'true'); b.setAttribute('aria-label', `Experimento ${k + 1}, bloqueado`); }
    });
  }
  const sinParada = el => el.querySelectorAll('.v').forEach(e => { e.removeAttribute('tabindex'); e.style.cursor = 'default'; });
  function ir(k){
    if (!abierto(k)) return;   // ninguna vía salta un experimento sin responder
    parar();
    S.k = k; S.t0 = Date.now();
    const x = EXPS[k];
    for (const key of Object.keys(E)) delete E[key];
    x.antes();
    const resp = S.pred[x.id];
    if (resp){
      x.despues(true);
      // Al volver a un experimento respondido, su animación ya terminó (salvo los giros sin fin).
      if (!x.continuo) terminar(x);
    }
    L.compactar(!resp);
    botones(); L.resize();
    leyenda($(cfg.ley), resp ? x.ley : x.leyAntes, cfg.nombres);
    $(cfg.k).textContent = `${cfg.titulo} · ${k + 1} de ${EXPS.length}`;
    $(cfg.t).textContent = x.corto;
    $(cfg.body).innerHTML = `<p>${x.q}</p>${opcionesHTML(x.opts, ids.fb)}<div id="${ids.res}" class="body"></div>`;
    sinParada($(cfg.body));
    const btns = [...$(cfg.body).querySelectorAll('.opt')];
    const pintar = () => {
      const p = S.pred[x.id]; if (!p) return;
      btns.forEach(b => { b.disabled = true; if (b.dataset.k === x.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
      const fb = $(ids.fb);
      fb.textContent = x.fb ? x.fb[p] : p === x.ok ? '¡Bien pensado! Mira la escena para ver por qué.' : `Elegiste la ${p.toUpperCase()}. La correcta está marcada; mira la escena para ver por qué.`;
      fb.className = 'fb ' + (p === x.ok ? 'ok' : 'mal');
      $(ids.res).innerHTML = x.ctrl() + x.exp + (k < EXPS.length - 1 ? `<div class="nav"><span></span><button type="button" class="btn primary" id="${ids.sig}">Siguiente: ${EXPS[k + 1].corto}</button></div>` : '');
      $(ids.res).querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => { if (!x.continuo) parar(); x.alCambiar(); x.vivo(); draw(); }));
      const rep = $(ids.rep); if (rep) rep.onclick = () => { parar(); x.repetir ? x.repetir() : x.despues(false); };
      if (x.enlazar) x.enlazar();
      const sig = $(ids.sig); if (sig) sig.onclick = () => { ir(k + 1); modo.scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); $(cfg.t).focus({ preventScroll:true }); };
      sinParada($(ids.res)); x.vivo();
    };
    btns.forEach(b => b.onclick = () => {
      if (S.pred[x.id]) return;
      const o = x.opts.find(q => q[0] === b.dataset.k);
      S.pred[x.id] = o[0];
      registrarPrediccion(x.mid, o[0], o[0] === x.ok, o[2] || '', o[3] || '', S.t0);
      if (x.alResponder) x.alResponder(o[0]);
      pintar(); botones(); leyenda($(cfg.ley), x.ley, cfg.nombres);
      $(ids.fb).focus({ preventScroll:true });
      L.compactar(false);
      // Si en esos ~380 ms el alumno cambió de pestaña, la escena queda en su estado final (sin animar).
      Celular.alResponder(cv, () => { x.despues(false); draw(); }, () => S.k === k && !modo.hidden,
        { siNo: () => { if (S.k === k){ x.despues(true); terminar(x); parar(); draw(); } } });
    });
    pintar(); draw();
  }
  // Arrastre (solo después de responder y en los experimentos que lo traen): el dedo cerca captura; lejos, desplaza la página.
  Celular.arrastre(cv, {
    activo: () => { const x = EXPS[S.k]; return !!(x && x.arrastre && S.pred[x.id]); },
    cerca: (p, r) => EXPS[S.k].arrastre.cerca(p, r),
    empezar: () => { E.agarrado = true; draw(); },
    mover: p => { parar(); EXPS[S.k].arrastre.mover(p); EXPS[S.k].vivo(); draw(); },
    soltar: () => { E.agarrado = false; draw(); },
    sobre: s => { E.sobre = s; draw(); }
  });
  EXPS = cfg.crear(api);
  alRedibujarTema(draw);
  addEventListener('modo', () => {
    if (modo.hidden){ terminar(EXPS[S.k]); parar(); }
    else { L.resize(); if (E.reanudar && S.pred[EXPS[S.k].id]) E.reanudar(); }
  });
  L.resize(); ir(0);
  return api;
}
</script>
<script>
/* ================= MODO 2: ¿qué pasa si…? (tiro) =================
   Preguntas de docs/investigacion/cinematica-ideas-erroneas.md (P2 a P5) y, para el golpe, del informe de
   estática y energía (E8, sumar como números). */
modoExperimentos({ modo:'m2', cv:'cv2', exps:'exps', ley:'ley2', k:'k2', t:'t2', body:'body2', desc:'desc2', titulo:'¿Qué pasa si…?',
  nombres:NOMBRES, ids:{ fb:'fb2', res:'res2', sig:'sig2', rep:'repetir' },
  crear: api2 => { const { E, animar, $ } = api2;
  // El tiro vuela hasta E.T (o hasta el impacto) a 650 ms por segundo simulado.
  const volar = () => animar(dt => { E.t = Math.min(E.T, E.t + dt/0.65); return E.t < E.T; });
  const pared = () => M.impactoPared({ v0:50, angulo:37, d:E.d });
  const golpe = () => M.impactoPared({ vx:15, y0:45, d:E.d, alto:60 });
  return [
  { id:'mas-rapida', mid:'que-pasa-si-mas-rapida', corto:'Dos pelotas', ley:['t'], leyAntes:[], tipo:'tiro',
    q:`Desde lo alto de un acantilado de 80 m se lanzan dos pelotas en horizontal al mismo tiempo: una a 15 m/s y otra a 30 m/s. ¿Cuál llega primero al agua?`,
    opts:[['a','La más rápida, porque va con más fuerza','P2-mas-rapida-llega-antes','documentado'],
          ['b','La más lenta: la rápida se queda más tiempo en el aire','P2-mas-rapida-dura-mas','documentado'],
          ['c','Llegan a la vez: en vertical caen igual',null],
          ['d','Depende de cuánto pese cada pelota','C2-depende-de-la-masa','parcial']],
    ok:'c',
    antes:() => Object.assign(E, { cfg:{ tiros:[{ o:{ vx:15, y0:80 }, nombre:'15 m/s' }, { o:{ vx:30, y0:80 }, nombre:'30 m/s', trazos:true }], xmin:-12, Xmax:130, Ymax:90, plataforma:true, ver:{} }, t:0, T:4 }),
    despues:() => { E.cfg.ver = { tray:'hasta', estrobo:0.5, alturas:true }; E.t = 0; volar(); },
    ctrl:() => `<div class="chips" id="chips2"></div><p><button type="button" class="btn" id="repetir">Disparar otra vez</button></p>`,
    vivo:() => { $('chips2').innerHTML = '<span class="chip">las dos: 4 s en el aire</span><span class="chip">caen a 60 m y a 120 m</span>'; },
    alCambiar:() => {},
    exp:`<p>Las líneas naranjas a trazos unen las dos pelotas en el mismo instante: son horizontales. En vertical, las dos caen igual, sin velocidad vertical al salir: 80 = 5t², t = 4 s. La más rápida no cae más rápido ni más lento: solo llega más lejos, al doble de distancia.</p>
      ${fuente('Según Prescott y Mitchelmore (2005), con dos balas disparadas en horizontal a distinta velocidad, el 38 % de las alumnas entrevistadas dijo que la más rápida está más tiempo en el aire. Con pelotas, el 43 % dijo que la más rápida llega primero. Que el más pesado caiga distinto está documentado sin cifra (Carrascosa, Gil Pérez y Valdés, 2004).')}`,
    desc: r => r ? 'Las dos pelotas caen a la par y llegan juntas a los 4 segundos; la rápida cae el doble de lejos.' : 'Un acantilado de 80 metros con dos pelotas listas para lanzarse en horizontal, a 15 y a 30 metros por segundo.' },
  { id:'cada-segundo', mid:'que-pasa-si-cada-segundo', corto:'Segundo a segundo', ley:['vx','vy'], leyAntes:[], tipo:'tiro',
    q:`Una pelota sale rodando del borde de una azotea de 80 m. En el primer segundo avanza 15 m en horizontal. ¿Cuánto avanza en horizontal durante el segundo siguiente?`,
    opts:[['a','Menos de 15 m: la velocidad horizontal se va gastando','P3-vx-se-gasta','documentado'],
          ['b','15 m: en horizontal nada la frena',null],
          ['c','Más de 15 m, porque cae cada vez más rápido','confunde-vx-con-vy','hipotesis'],
          ['d','0 m: ya se le acabó el impulso y cae en picada','P3-cae-en-picada','documentado']],
    ok:'b',
    antes:() => Object.assign(E, { cfg:{ tiros:[{ o:{ vx:15, y0:80 } }], xmin:-12, Xmax:70, Ymax:90, plataforma:true, ver:{ tray:'hasta', estrobo:1 } }, t:1, T:4 }),
    despues:() => { E.cfg.ver = { tray:'hasta', estrobo:1, sombras:true, vx:true, vy:true }; E.t = 0; volar(); },
    ctrl:() => `<div class="chips" id="chips2"></div><p><button type="button" class="btn" id="repetir">Otra vez</button></p>`,
    vivo:() => { $('chips2').innerHTML = '<span class="chip">en horizontal: 15, 15, 15 y 15 m</span><span class="chip">en vertical cae: 5, 15, 25 y 35 m</span>'; },
    alCambiar:() => {},
    exp:`<p>Mira las sombras. La ${V('vx','azul')}, en el suelo, avanza 15 m cada segundo: en horizontal no hay ninguna aceleración, así que ${V('vx','vx')} no cambia. La ${V('vy','roja')}, en el eje vertical, baja 5, 15, 25 y 35 m: en vertical sí hay aceleración.</p>
      <p>La pelota tampoco «cae en picada» al acabarse el impulso: desde que deja la azotea su camino es una parábola, sin tramo recto y sin esquina.</p>
      ${fuente('Según Prescott y Mitchelmore (2005), en una pregunta parecida (10 m en el primer segundo), el 60 % de las alumnas dijo que en el segundo siguiente avanza menos. Que un objeto siga recto un tramo y recién después caiga lo reportó McCloskey (1983) en más de un tercio de escolares y universitarios, según Prescott y Mitchelmore (2005).')}`,
    desc: r => r ? 'En horizontal avanza 15 metros cada segundo; en vertical cae 5, 15, 25 y 35 metros.' : 'La pelota al final del primer segundo, 15 metros adelante del borde.' },
  { id:'avioneta', mid:'que-pasa-si-avioneta', corto:'El paquete', ley:['t'], leyAntes:[], tipo:'tiro',
    q:`Una avioneta vuela en horizontal a 50 m/s constantes, a 180 m de altura, y suelta un paquete. Sin aire, mientras el paquete cae, ¿dónde está respecto a la avioneta?`,
    opts:[['a','Cae recto hacia abajo desde donde lo soltaron, y la avioneta se aleja','P4-cae-recto','documentado'],
          ['b','Se va quedando atrás de la avioneta','P4-queda-atras','parcial'],
          ['c','Siempre justo debajo: avanza a la par de la avioneta',null],
          ['d','Adelante de la avioneta','adelanta-al-avion','hipotesis']],
    ok:'c',
    antes:() => Object.assign(E, { cfg:{ tiros:[{ o:{ vx:50, y0:180 } }], xmin:-15, Xmax:330, Ymax:200, ver:{ avion:true } }, t:0, T:6 }),
    despues:() => { E.cfg.ver = { avion:true, avionLinea:true, tray:'hasta', estrobo:1 }; E.t = 0; volar(); },
    ctrl:() => `<div class="chips" id="chips2"></div><p><button type="button" class="btn" id="repetir">Soltar otra vez</button></p>`,
    vivo:() => { $('chips2').innerHTML = '<span class="chip">6 s de caída</span><span class="chip">cae a 300 m de donde lo soltaron</span><span class="chip">la avioneta también avanzó 300 m</span>'; },
    alCambiar:() => {},
    exp:`<p>Al soltarlo, el paquete ya va a 50 m/s en horizontal, igual que la avioneta, y nada lo frena en horizontal. Por eso avanza a la par de la avioneta mientras cae: la línea a trazos que los une queda siempre vertical. Cae en 6 s (180 = 5t²), a 300 m de donde lo soltaron.</p>
      <p>Visto desde la avioneta, el paquete cae en línea recta, siempre debajo de ella. Visto desde el suelo, hace una parábola. Las dos descripciones son correctas. Lo que no pasa es lo de la opción A: caer recto sobre el punto del suelo donde lo soltaron. Con aire, el paquete sí se quedaría un poco atrás.</p>
      ${fuente('Según Prescott y Mitchelmore (2005), en preguntas de este tipo (soltar algo desde un avión, una faja transportadora o alguien que camina) solo entre el 25 % y el 38 % acertó, según el caso, y entre el 30 % y el 53 % dijo que cae recto. Que se quede atrás es una idea vecina, sin cifra propia.')}`,
    desc: r => r ? 'El paquete cae siempre justo debajo de la avioneta y llega al suelo a los 6 segundos, a 300 metros.' : 'Una avioneta a 180 metros de altura, con el paquete a punto de soltarse.' },
  { id:'complementarios', mid:'que-pasa-si-complementarios', corto:'37° o 53°', ley:[], leyAntes:[], tipo:'tiro',
    q:`Dos proyectiles salen del suelo con la misma rapidez, 50 m/s: uno a 37° y otro a 53°. ¿Cuál llega más lejos?`,
    opts:[['a','El de 53°: sube más, así que llega más lejos','mas-angulo-mas-lejos','hipotesis'],
          ['b','El de 37°: va más rápido en horizontal','menos-angulo-mas-lejos','hipotesis'],
          ['c','Llegan al mismo lugar: vx y vy se intercambian',null],
          ['d','Depende de cuánto pese cada uno','C2-depende-de-la-masa','parcial']],
    ok:'c',
    antes:() => Object.assign(E, { ang:37, cfg:{ tiros:[{ o:{ v0:50, angulo:37 } }, { o:{ v0:50, angulo:53 }, trazos:true }], xmin:-8, Xmax:260, Ymax:90, canon:true, ver:{} }, t:0, T:8 }),
    despues:() => { E.cfg.ver = { tray:'hasta', estrobo:1 }; E.cfg.tiros[0].nombre = `${E.ang}°`; E.cfg.tiros[1].nombre = `${90 - E.ang}°`; E.t = 0; volar(); },
    ctrl:() => `<div class="slider"><label for="q-ang"><span>Ángulo del primero (el otro es su complemento)</span><output id="q-ang-o"></output></label><input id="q-ang" type="range" min="10" max="45" step="1" value="${E.ang}"></div><div class="chips" id="chips2"></div>`,
    vivo:() => {
      const a = M.proyectil({ v0:50, angulo:E.ang }), b = M.proyectil({ v0:50, angulo:90 - E.ang });
      $('q-ang-o').textContent = `${E.ang}° y ${90 - E.ang}°`;
      $('chips2').innerHTML = `<span class="chip">alcances: ${N1(a.alcance)} m y ${N1(b.alcance)} m</span><span class="chip">alturas: ${N1(a.H)} m y ${N1(b.H)} m</span><span class="chip">tiempos: ${fmt(a.tVuelo, 1)} s y ${fmt(b.tVuelo, 1)} s</span>`;
    },
    alCambiar:() => { E.ang = +$('q-ang').value; E.cfg.tiros = [{ o:{ v0:50, angulo:E.ang }, nombre:`${E.ang}°` }, { o:{ v0:50, angulo:90 - E.ang }, nombre:`${90 - E.ang}°`, trazos:true }]; E.T = M.proyectil({ v0:50, angulo:90 - E.ang }).tVuelo; E.t = E.T; },
    exp:`<p>Con 37° y 53°, los dos caen a 240 m. El de 53° sube mucho más (80 m contra 45 m) y está más tiempo en el aire (8 s contra 6 s), pero avanza más lento en horizontal (30 m/s contra 40 m/s). Al pasar de 37° a 53° se intercambian vx y vy, y el alcance depende del producto de las dos.</p>
      <p>Mueve el ángulo: cualquier par que sume 90° llega al mismo lugar, si se lanza y cae a la misma altura. Con la misma rapidez, y si se lanza y cae a la misma altura, el alcance más grande es a 45°. Desde una azotea, el mejor ángulo es algo menor.</p>
      ${fuente('Las opciones incorrectas son errores que suponemos, sin estudio con porcentaje; la de la masa es la cara, en este problema, de la idea de que el más pesado cae distinto, documentada sin cifra.')}`,
    desc: r => r ? `Disparos a ${E.ang} y ${90 - E.ang} grados con 50 metros por segundo: caen en el mismo lugar.` : 'Un cañón listo para disparar a 37 grados y a 53 grados con 50 metros por segundo.' },
  { id:'pared', mid:'que-pasa-si-pared', corto:'La pared', ley:['vx','vy','v'], leyAntes:['v'], tipo:'tiro',
    q:`Un cañón en el suelo dispara a 50 m/s, a 37° sobre la horizontal, hacia una pared muy alta que está a 160 m. ¿A qué altura golpea la pared?`,
    opts:[['a','45 m: llega a la pared en lo más alto de su vuelo','pared-en-la-cima','hipotesis'],
          ['b','120 m: sigue la línea hacia donde apunta el cañón','pared-linea-de-mira','hipotesis'],
          ['c','40 m: ya pasó lo más alto y está bajando',null],
          ['d','44,8 m: tarda 160 entre 50, o sea 3,2 s','pared-t-con-v0','hipotesis']],
    ok:'c',
    fb:{ c:'¡Bien! Llega a la pared a los 4 s (160 entre 40). Sube 120 m por su velocidad vertical y cae 80 m por la gravedad: queda a 40 m, ya de bajada, porque lo más alto lo pasó a los 120 m.',
         a:'Elegiste la A. Lo más alto lo alcanza a los 120 m del cañón, a los 3 s. La pared está más lejos: cuando llega, ya está bajando. La correcta está marcada.',
         b:'Elegiste la B. Eso pasaría si no hubiera gravedad. Desde que sale, la gravedad lo va bajando cada vez más que la línea de mira: a los 4 s, ya 80 m. La correcta está marcada.',
         d:'Elegiste la D. El tiempo hasta la pared sale de la velocidad horizontal, porque la pared está a 160 m en horizontal: 160 entre 40 da 4 s. Los 50 m/s van en diagonal. La correcta está marcada.' },
    antes:() => Object.assign(E, { d:160, t:0, T:0, marca:null, cfg:{ tiros:[{ o:{ v0:50, angulo:37 } }], xmin:-8, Xmax:260, Ymax:130, canon:true, ver:{ v0:true } } }),
    alResponder: o => { const w = pared(); E.marcaElegida = { a:w.errores.yEnLaCima, b:w.errores.yRecta, d:w.errores.yConTv0 }[o]; },
    despues:() => {
      if (E.marcaElegida === undefined){ const m = { a:'yEnLaCima', b:'yRecta', d:'yConTv0' }[api2.pred('pared')]; E.marcaElegida = m ? M.impactoPared({ v0:50, angulo:37, d:160 }).errores[m] : null; }
      E.cfg.ver = { tray:'hasta', estrobo:0.5, vx:true, vy:true, v:true, cima:true, cortas:true }; E.T = pared().t; E.t = 0; volar();
    },
    dibujar:(L, c) => {
      const w = pared(), hit = w.choca && E.t >= w.t - 1e-9, resp = api2.pred('pared');
      const ver = Object.assign({}, E.cfg.ver, resp ? { mira:E.d } : {});
      vistaTiro(L, c, Object.assign({}, E.cfg, { ver, t:E.t, tFin: w.choca ? w.t : null,
        pared:{ d:E.d, alto:Infinity, cota:true, asa:!!resp, sobre:E.sobre || E.agarrado, marca: resp && E.d === 160 ? E.marcaElegida : null, estrella: hit ? { x:E.d, y:w.y } : null } }));
    },
    arrastre:{
      cerca:(p, r) => { const m = marco(api2.L.W, api2.L.H, E.cfg); return Math.hypot(p.x - m.X(E.d) - 4, p.y - m.Y(0)) < r; },
      mover: p => { const m = marco(api2.L.W, api2.L.H, E.cfg), d = clamp(Math.round((m.xmin + (p.x - 4 - m.ml)/m.sx)/10)*10, 20, 240);
        if (d !== E.d){ E.d = d; $('q-d').value = d; const w = pared(); E.t = E.T = w.choca ? w.t : M.proyectil({ v0:50, angulo:37 }).tVuelo; } }
    },
    ctrl:() => `<div class="slider"><label for="q-d"><span>Distancia a la pared</span><output id="q-d-o"></output></label><input id="q-d" type="range" min="20" max="240" step="10" value="${E.d}"></div><div class="chips" id="chips2"></div>
      <p class="hint">Prueba con 80 m y con 160 m. También puedes arrastrar el pie de la pared.</p><p><button type="button" class="btn" id="repetir">Disparar otra vez</button></p>`,
    vivo:() => {
      const w = pared(); $('q-d-o').textContent = `${E.d} m`;
      $('chips2').innerHTML = w.choca
        ? `<span class="chip">llega a los ${fmt(w.t, 2)} s</span><span class="chip">sube ${fmt(w.sube, 1)} y cae ${fmt(w.cae, 1)}: ${fmt(w.y, 1)} m</span><span class="chip">${FASES[w.fase]}</span><span class="chip">${V('v','v')} = ${fmt(w.v, 1)} m/s</span>`
        : `<span class="chip">no llega: cae a ${N1(w.alcance)} m, antes de la pared</span>`;
    },
    alCambiar:() => { E.d = +$('q-d').value; const w = pared(); E.t = E.T = w.choca ? w.t : M.proyectil({ v0:50, angulo:37 }).tVuelo; },
    repetir:() => { const w = pared(); E.T = w.choca ? w.t : M.proyectil({ v0:50, angulo:37 }).tVuelo; E.t = 0; volar(); },
    exp:`<div class="eqs"><div class="eq">${V('t','t')} = 160 ÷ ${V('vx','40')} = ${V('t','4 s')}<span class="note">la pared está a 160 m en horizontal</span></div>
      <div class="eq">y = ${V('vy','30')}·4 − 5·4² = 120 − 80 = 40 m<span class="note">sube por su velocidad vertical, cae por la gravedad</span></div></div>
      <p>La línea gris a trazos es hacia donde apunta el cañón: sin gravedad, llegaría a la pared a 120 m. La gravedad lo baja 5·t² metros: a los 4 s, 80 m. Lo más alto (45 m) lo pasó a los 120 m del cañón; en la pared ya va de bajada, con ${V('vy','vy')} = −10 m/s.</p>
      ${fuente('Las tres opciones incorrectas son hipótesis nuestras, sin estudio con porcentaje. La de la línea de mira se parece a una idea documentada: que un proyectil sigue recto un tramo antes de caer (McCloskey, 1983, según Prescott y Mitchelmore, 2005).')}`,
    desc: r => { if (!r) return 'Un cañón a 37 grados y una pared alta a 160 metros.'; const w = pared();
      return w.choca ? `Con la pared a ${E.d} metros, el proyectil la golpea a los ${fmt(w.t, 1)} segundos, a ${fmt(w.y, 1)} metros de altura, ${FASES[w.fase]}.` : `Con la pared a ${E.d} metros, el proyectil cae antes de llegar.`; } },
  { id:'golpe', mid:'que-pasa-si-golpe', corto:'El golpe', ley:['vx','vy','v'], leyAntes:['vx'], tipo:'tiro',
    q:`Desde una azotea de 45 m lanzas una pelota en horizontal a 15 m/s hacia la pared de otro edificio, que está a 30 m. Llega a la pared a los 2 s. ¿Con qué rapidez la golpea?`,
    opts:[['a','15 m/s: en horizontal nada la frena, así que va igual de rápido','rapidez-constante','hipotesis'],
          ['b','35 m/s: los 15 de la horizontal más los 20 que ganó al caer','VE-suma-modulos','parcial'],
          ['c','25 m/s: los 15 y los 20 se combinan como los lados de una escuadra',null],
          ['d','20 m/s: al chocar solo cuenta lo que ganó al caer','pared-solo-vertical','hipotesis']],
    ok:'c',
    fb:{ c:'¡Bien! En 2 s ganó 20 m/s hacia abajo y conserva los 15 m/s horizontales. Las dos flechas forman un ángulo recto: v = √(15² + 20²) = 25 m/s, inclinada 53° bajo la horizontal.',
         a:'Elegiste la A. La parte horizontal sí se queda en 15 m/s, pero además ganó 20 m/s hacia abajo. La rapidez es la de las dos juntas. La correcta está marcada.',
         b:'Elegiste la B. 15 + 20 sería si las dos apuntaran hacia el mismo lado. Una va en horizontal y la otra en vertical, así que se suman como flechas: 25 m/s. La correcta está marcada.',
         d:'Elegiste la D. La parte horizontal no desaparece al chocar: la pelota sigue avanzando a 15 m/s cuando llega. La rapidez combina las dos: 25 m/s. La correcta está marcada.' },
    antes:() => Object.assign(E, { d:30, t:0, T:0, cfg:{ tiros:[{ o:{ vx:15, y0:45 } }], xmin:-14, Xmax:60, Ymax:70, plataforma:true, altoTxt:true, ver:{ vx:true } } }),
    despues:() => { E.cfg.ver = { tray:'hasta', vx:true, vy:true, v:true, cortas:true }; const w = golpe(); E.T = w.choca ? w.t : w.tVuelo; E.t = 0; volar(); },
    dibujar:(L, c) => {
      const w = golpe(), hit = w.choca && E.t >= w.t - 1e-9;
      const ver = Object.assign({}, E.cfg.ver, hit ? { triangulo:Math.abs(w.angulo) } : {});
      vistaTiro(L, c, Object.assign({}, E.cfg, { ver, t:E.t, tFin: w.choca ? w.t : null,
        pared:{ d:E.d, alto:60, edificio:true, cota:true, estrella: hit ? { x:E.d, y:w.y } : null } }));
    },
    ctrl:() => `<div class="slider"><label for="q-dg"><span>Distancia al otro edificio</span><output id="q-dg-o"></output></label><input id="q-dg" type="range" min="10" max="45" step="5" value="${E.d}"></div><div class="chips" id="chips2"></div><p><button type="button" class="btn" id="repetir">Lanzar otra vez</button></p>`,
    vivo:() => {
      const w = golpe(); $('q-dg-o').textContent = `${E.d} m`;
      $('chips2').innerHTML = w.choca
        ? `<span class="chip">en ${fmt(w.t, 2)} s cae ${fmt(w.cae, 1)} m: golpea a ${fmt(w.y, 1)} m</span><span class="chip">${V('v','v')} = √(${V('vx', fmt(w.vx, 0))}² + ${V('vy', fmt(Math.abs(w.vy), 1))}²) = ${fmt(w.v, 1)} m/s</span><span class="chip">${fmt(Math.abs(w.angulo), 0)}° bajo la horizontal</span>`
        : `<span class="chip">llega justo al pie del edificio, a los ${fmt(w.tVuelo, 1)} s</span>`;
    },
    alCambiar:() => { E.d = +$('q-dg').value; const w = golpe(); E.t = E.T = w.choca ? w.t : w.tVuelo; },
    exp:`<div class="eqs"><div class="eq">${V('vy','vy')} = −10·${V('t','2')} = −20 m/s<span class="note">lo que ganó al caer</span></div>
      <div class="eq">${V('v','v')} = √(${V('vx','15')}² + ${V('vy','20')}²) = √625 = ${V('v','25 m/s')}<span class="note">las dos partes son perpendiculares</span></div></div>
      <p>Las flechas ${V('vx','azul')} y ${V('vy','roja')} forman un ángulo recto, y la ${V('v','morada')} es la hipotenusa de ese triángulo: 15, 20 y 25, como el triángulo de 37° y 53°. Golpea a 25 m del suelo (cae 5·2² = 20 m), inclinada 53° bajo la horizontal.</p>
      ${fuente('Sumar 15 + 20 como números tiene un pariente documentado: en una pregunta con dos cuerdas, cerca del 15 % de 132 alumnos trató las tensiones como números (Flores-García y otros, 2009). Las otras dos opciones son hipótesis nuestras.')}`,
    desc: r => { if (!r) return 'Una azotea de 45 metros con una pelota en el borde, lista para lanzarse en horizontal a 15 metros por segundo hacia otro edificio a 30 metros.'; const w = golpe();
      return w.choca ? `La pelota golpea el edificio de enfrente a ${fmt(w.y, 1)} metros de altura, a ${fmt(w.v, 1)} metros por segundo.` : 'La pelota llega justo al pie del edificio de enfrente.'; } },
  ]; } });
</script>
<script>
/* ================= MODO 3: ruedas y pistas =================
   MCU (rotonda y honda, que se mudaron desde «¿Qué pasa si…?» con sus mismos ids de medición), transmisión por cadena
   y por eje, MCUV con la gráfica ω-t y encuentros en una pista circular. Casi todo es hipótesis nuestra (se dice en pantalla). */
modoExperimentos({ modo:'m3', cv:'cv3', exps:'exps3', ley:'ley3', k:'k3', t:'t3', body:'body3', desc:'desc3', titulo:'Ruedas',
  nombres:NOMBRES_RUEDAS, ids:{ fb:'fb3', res:'res3', sig:'sig3', rep:'repetir3' },
  crear: api3 => { const { E, animar, $ } = api3;
  const hasta = (clave, fin, rapidez) => dt => { E[clave] = Math.min(fin, E[clave] + dt*rapidez); return E[clave] < fin; };
  const cadena = () => M.transmision({ r1:E.r1, r2:E.r2, f1:1, tipo:'faja' });
  const eje = r => M.transmision({ r1:0.04, r2:r, v1:0.8, tipo:'eje' });
  const frenado = () => M.mcuvDatos({ f0:E.f0, f:0, t:E.tp, r:0.3 });
  const finFrena = () => (E.seguir ? Math.ceil(E.tp*1.5) : E.tp);
  const pista = () => M.encuentroPista({ L:400, v1:E.v1, v2:E.v2, sentido:E.sentido, separacion:E.s0 });
  const finPista = () => { const r = pista(); return r.nunca ? 60 : r.t; };
  const vueltas = n => `${fmt(n, 1)} ${Math.abs(n - 1) < 1e-9 ? 'vuelta' : 'vueltas'}`;
  const girarRotonda = revisita => {
    E.crece = RM || revisita ? 1 : 0;
    const mv = dt => { if (E.crece < 1){ E.crece = Math.min(1, E.crece + dt/0.5); return true; } E.circ.theta += dt*E.circ.omega*180/Math.PI; return true; };
    E.reanudar = () => animar(mv, true); animar(mv, true);
  };
  const lista = [
  { id:'rotonda', mid:'que-pasa-si-rotonda', corto:'La rotonda', ley:['v','a'], leyAntes:['v'], tipo:'circulo', continuo:true,
    q:`Un auto da vueltas a una rotonda (óvalo) de 50 m de radio a 10 m/s constantes. ¿Tiene aceleración?`,
    opts:[['a','No: su rapidez no cambia','rapidez-constante-sin-aceleracion','hipotesis'],
          ['b','Sí, hacia el centro: la dirección de su velocidad cambia',null],
          ['c','Sí, hacia afuera: es lo que se siente al dar la curva','D9-hacia-afuera','hipotesis'],
          ['d','Sí, hacia adelante: en el sentido en que avanza','K3-a-en-direccion-del-movimiento','parcial']],
    ok:'b',
    fb:{ b:'¡Bien! La rapidez no cambia, pero la dirección de la velocidad sí, en cada punto de la curva: eso ya es acelerar. La aceleración apunta al centro: ac = v²/r = 100/50 = 2 m/s².',
         a:'Elegiste la A. La rapidez es constante, pero la velocidad también tiene dirección, y esa cambia en cada punto de la curva. Cambiar la dirección ya es acelerar. La correcta está marcada.',
         c:'Elegiste la C. Lo que se siente «hacia afuera» es tu cuerpo, que tiende a seguir recto. La aceleración del auto apunta al centro de la rotonda, y la produce el roce de la pista. La correcta está marcada.',
         d:'Elegiste la D. Si apuntara hacia adelante, el auto iría cada vez más rápido. Va a rapidez constante: la aceleración no lo apura, lo hace doblar, y apunta al centro. La correcta está marcada.' },
    antes:() => Object.assign(E, { r:50, v:10, circ:{ r:50, omega:0.2, theta:30, auto:true, ver:{ v:true }, pie:'rotonda de 50 m · vista desde arriba' }, t:0, T:6 }),
    despues: revisita => { E.circ.ver = { v:'nueva', a:'nueva', todos:true }; girarRotonda(revisita); },
    ctrl:() => `<div class="slider"><label for="w-r"><span>Radio de la rotonda</span><output id="w-r-o"></output></label><input id="w-r" type="range" min="10" max="100" step="5" value="${E.r}"></div>
      <div class="slider"><label for="w-v"><span>Rapidez (${V('v','v')})</span><output id="w-v-o"></output></label><input id="w-v" class="r-v" type="range" min="2" max="15" step="1" value="${E.v}"></div><div class="chips" id="chips3"></div>`,
    vivo:() => {
      const m = M.mcu({ r:E.r, v:E.v }); $('w-r-o').textContent = `${E.r} m`; $('w-v-o').textContent = `${E.v} m/s`;
      $('chips3').innerHTML = `<span class="chip">ac = v²/r = ${fmt(m.ac, 2)} m/s², hacia el centro</span>${m.ac > 7 ? '<span class="chip">más de unos 7 m/s²: un auto real patina</span>' : ''}<span class="chip">una vuelta en ${fmt(m.periodo, 1)} s</span>`;
    },
    alCambiar:() => { E.r = +$('w-r').value; E.v = +$('w-v').value; const m = M.mcu({ r:E.r, v:E.v }); E.circ.r = E.r; E.circ.omega = m.omega; E.circ.pie = `rotonda de ${E.r} m · vista desde arriba`; },
    exp:`<p>La rapidez no cambia, pero la dirección de la ${V('v','velocidad')} sí: en cada punto apunta hacia otro lado. Cambiar la velocidad, aunque sea solo su dirección, es acelerar. Las flechas ${V('a','verdes')} muestran que esa aceleración apunta siempre al centro: ac = v²/r = 100/50 = 2 m/s².</p>
      <p>Lo que la produce es el roce de la pista sobre las llantas, hacia el centro. Lo que se siente «hacia afuera» no es una fuerza sobre el auto: es tu cuerpo, que tiende a seguir en línea recta mientras el auto gira.</p>
      ${fuente('Que la aceleración apunte hacia afuera es un error que suponemos, sin estudio con porcentaje. Creemos que sale de una idea documentada: que en el movimiento circular hay una fuerza real hacia afuera (Hestenes, Wells y Swackhamer, 1992). Que la aceleración apunte hacia donde se mueve está reportado sin porcentaje (Trowbridge y McDermott, 1981). En la PUCP, según Castillo y otros (2013), el movimiento circular en general fue de lo peor contestado en el curso de nivelación. La opción de que no hay aceleración es otro error que suponemos.')}`,
    desc: r => r ? `El auto gira a ${E.v} metros por segundo en una rotonda de ${E.r} metros; su aceleración apunta al centro.` : 'Un auto en una rotonda de 50 metros, con su velocidad tangente.' },
  { id:'honda', mid:'que-pasa-si-honda', corto:'Se rompe la cuerda', ley:['v','w'], leyAntes:['w'], tipo:'circulo',
    q:`Haces girar una piedra atada a una cuerda en un círculo horizontal, sobre tu cabeza. Visto desde arriba, si la cuerda se rompe justo cuando la piedra está aquí, ¿qué camino sigue?`,
    opts:[['a','Sigue curvándose un rato y luego se endereza','D9-sigue-curvando','parcial'],
          ['b','En línea recta, tangente al círculo',null],
          ['c','En línea recta hacia afuera, alejándose del centro','sale-hacia-afuera','hipotesis'],
          ['d','En línea recta, en diagonal entre la tangente y la dirección hacia afuera','entre-tangente-y-radio','hipotesis']],
    ok:'b',
    fb:{ b:'¡Bien! Al romperse la cuerda, ya nada la desvía: sigue en línea recta con la velocidad que tenía en ese instante, tangente al círculo.',
         a:'Elegiste la A. Un movimiento no «recuerda» su curva: la curva la hacía la cuerda, que tiraba hacia el centro. Sin cuerda, sigue recto. La correcta está marcada.',
         c:'Elegiste la C. Se aleja del centro, pero no por el radio: sale con la velocidad que tenía, y esa es tangente al círculo. La correcta está marcada.',

    antes:() => Object.assign(E, { circ:{ r:1.5, omega:3, theta:0, ver:{ w:true } }, t:0, T:0.3 }),

        <span class="chip">${V('t','t')} = ${fr('distancia que falta', mismo ? '|v₁ − v₂|' : 'v₁ + v₂')} = ${fmt(r.brecha, 0)}/${fmt(r.vRel, 1)} = ${fmt(r.t, 1)} s</span>
        <span class="chip">Ana ${fmt(r.s1, 0)} m · Beto ${fmt(r.s2, 0)} m</span><span class="chip">a ${fmt(r.lugar, 0)} m de la salida</span>`;
    },
    alCambiar:() => { E.s0 = +$('w-s0').value; E.v1 = +$('w-v1').value; E.v2 = +$('w-v2').value; E.t = finPista(); },
    exp:`<div class="eqs"><div class="eq">ventaja de Ana = (${V('v','7')} − ${V('v','3')})·${V('t','t')} = 4·${V('t','t')}<span class="note">lo que le saca cada segundo</span></div>
      <div class="eq">400 = 4·${V('t','t')} → ${V('t','t = 100 s')}<span class="note">una vuelta entera de ventaja</span></div></div>
      <p>El arco grueso en tinta es lo que le falta a Ana para alcanzar a Beto: se acorta 4 m cada segundo y se cierra a los 100 s, cuando ella le lleva una vuelta. Ana corrió 700 m y Beto 300 m: se juntan a 300 m de la salida. Prueba con sentidos contrarios: se cruzan a los 40 s, porque juntos cierran 7 + 3 = 10 m por segundo.</p>
      ${fuente('Hipótesis nuestras. Sumar en vez de restar en los móviles es un error que suponemos, sin estudio con porcentaje (informe de aritmética y razonamiento, RM4).')}`,
    desc: r => { if (!r) return 'Una pista circular de 400 metros vista desde arriba. Ana y Beto están en la salida, listos para correr en el mismo sentido, Ana a 7 y Beto a 3 metros por segundo.'; const p = pista();
      return p.nunca ? 'Con esos datos, Ana y Beto nunca se encuentran.' : `Se encuentran a los ${fmt(p.t, 1)} segundos, a ${fmt(p.lugar, 0)} metros de la salida. Ana corrió ${fmt(p.s1, 0)} metros y Beto ${fmt(p.s2, 0)}.`; } },
  ];
  const EXPS_pista = () => lista[5];
  return lista;
  } });
</script>

<script>
/* ================= Pestañas ================= */
(function(){
  const modos = [['#paso-a-paso', 'm1', 'tab1'], ['#que-pasa-si', 'm2', 'tab2'], ['#ruedas', 'm3', 'tab3']];
  function route(){
    const k = Math.max(0, modos.findIndex(m => m[0] === location.hash));
    modos.forEach(([, m, t], j) => {
      document.getElementById(m).hidden = j !== k;
      const a = document.getElementById(t);
      if (j === k) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    dispatchEvent(new Event('modo'));
  }
  addEventListener('hashchange', route); route();
})();
</script>
