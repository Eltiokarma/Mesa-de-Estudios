<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiro parabólico y movimiento circular</title>
<style>
/* Cáscara acogedora (crema, tarjetas cálidas, esquinas redondas; docs/diseno.md).
   Dentro del dibujo y de las ecuaciones solo mandan los colores de las variables (regla 4):
   vx azul (y la sombra en el eje horizontal), vy rojo (y la sombra en el eje vertical), v morado,
   a aceleración verde (g en el tiro, ac en el círculo), t tiempo naranja, ω velocidad angular turquesa,
   at aceleración tangencial ocre (solo en «Ruedas»). Posiciones, alturas, radios, ángulos, vueltas, la distancia
   que falta en la pista y la aceleración total del MCUV (a trazos, sin letra) van en tinta. El morado de marca no se usa aquí. */
[hidden]{display:none!important}
:root{
  --bg:#fbf3ec; --card:#fffaf6; --paper:#fdf7f1; --ink:#2d2340; --muted:#716579; --line:#efe3dc; --grid:#f3e8e0;
  --detras:#f6ece4; --acento:#ffd3e2; --acento-ink:#5c1f3d; --ok:#1d7f58; --warn:#c8363b;
  --shadow:0 1px 2px rgba(92,52,110,.05),0 10px 28px rgba(92,52,110,.09);
  --c-vx:#1f5fbf; --c-vy:#c0364a; --c-v:#8a2aa8; --c-a:#466d14; --c-t:#a05200; --c-w:#0f766e; --c-at:#4a3b00;
  --suelo:#d9c8bb; --bloque:#f3e3d3;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --detras:#211a2a; --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-vx:#7cb0ff; --c-vy:#f17384; --c-v:#ec62e6; --c-a:#a3d65e; --c-t:#f0a04a; --c-w:#5ed9c8; --c-at:#ffde0a;
  --suelo:#4a3d55; --bloque:#5a4868; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --detras:#211a2a; --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-vx:#7cb0ff; --c-vy:#f17384; --c-v:#ec62e6; --c-a:#a3d65e; --c-t:#f0a04a; --c-w:#5ed9c8; --c-at:#ffde0a;
  --suelo:#4a3d55; --bloque:#5a4868; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--font); -webkit-text-size-adjust:100%}
.wrap{max-width:1240px; margin:0 auto; padding-block:18px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid; gap:16px}
.top{display:grid; gap:12px}
.eyebrow{margin:0; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700}
h1{margin:2px 0 0; font-size:clamp(1.65rem, 4.4vw, 2.1rem); line-height:1.1; letter-spacing:-.01em}
.sub{margin:4px 0 0; color:var(--muted); font-size:.95rem; max-width:60ch}

.tabs{display:flex; gap:4px; padding:5px; border-radius:999px; background:var(--card); box-shadow:var(--shadow); justify-self:start; max-width:100%}
.tabs a{padding:9px 16px; border-radius:999px; color:var(--muted); text-decoration:none; font-weight:700; white-space:nowrap; font-size:.95rem}
.tabs a[aria-current="page"]{background:var(--ink); color:var(--card)}
.tabs a:hover:not([aria-current]){color:var(--ink)}
@media (max-width:419px){ .tabs{overflow-x:auto} .tabs a{padding:9px 12px} }

.mode{display:grid; gap:16px; min-width:0; align-items:start}
.bench{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:10px; display:grid; gap:8px; min-width:0}
.lienzo{border-radius:16px; overflow:hidden; background:var(--paper); border:1px solid var(--line)}
canvas{display:block; width:100%; touch-action:pan-y pinch-zoom; -webkit-user-select:none; user-select:none}
canvas:focus-visible{outline:3px solid var(--ink); outline-offset:-3px}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; padding:2px 8px 4px; font-size:.82rem; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:4px; border-radius:2px; display:inline-block}

.guide{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:20px; display:grid; gap:14px; min-width:0}
.dots{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.dots button{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); color:var(--muted);
  font:700 .82rem var(--font); cursor:pointer; font-variant-numeric:tabular-nums}
.dots button.done{border-color:var(--ink); color:var(--ink)}
.dots button.on{background:var(--ink); border-color:var(--ink); color:var(--card)}
.dots button:disabled{opacity:.45; cursor:not-allowed}
.step-k{display:inline-block; margin:0; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; font-weight:800;
  color:var(--acento-ink); background:var(--acento); border-radius:999px; padding:3px 10px}
.step-t{margin:8px 0 0; font-size:1.35rem; line-height:1.2; text-wrap:balance}
.body{display:grid; gap:12px; min-width:0}
.body p{margin:0; max-width:66ch}
.problem{border-left:4px solid var(--acento); padding:6px 0 6px 14px; font-size:1.06rem; max-width:66ch}
.map{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.map li{display:flex; gap:10px; align-items:baseline}
.map b{font-family:var(--mono); min-width:4.6em; flex:none}

.v{font-weight:800; border-radius:6px; padding:0 3px; cursor:pointer; text-decoration:underline dotted 1.5px; text-underline-offset:3px}
.v-vx{color:var(--c-vx); background:color-mix(in srgb, var(--c-vx) 8%, transparent)}
.v-vy{color:var(--c-vy); background:color-mix(in srgb, var(--c-vy) 8%, transparent)}
.v-v{color:var(--c-v); background:color-mix(in srgb, var(--c-v) 8%, transparent)}
.v-a{color:var(--c-a); background:color-mix(in srgb, var(--c-a) 8%, transparent)}
.v-t{color:var(--c-t); background:color-mix(in srgb, var(--c-t) 8%, transparent)}
.v-w{color:var(--c-w); background:color-mix(in srgb, var(--c-w) 8%, transparent)}
.v-at{color:var(--c-at); background:color-mix(in srgb, var(--c-at) 8%, transparent)}
.v-m{color:var(--ink); background:color-mix(in srgb, var(--ink) 8%, transparent)}
.v.hl{background:none; outline:2px solid currentColor; outline-offset:1px}

.eqs{display:grid; grid-template-columns:minmax(0,1fr); gap:10px; padding:14px; border-radius:16px; background:var(--paper); border:1px solid var(--line); overflow-x:auto}
.eq{display:flex; flex-wrap:wrap; align-items:center; gap:.42em; font-family:var(--mono); font-size:1.05rem; white-space:nowrap; font-variant-numeric:tabular-nums}
.eq .note{font-family:var(--font); font-size:.84rem; color:var(--muted); margin-left:.5em; white-space:normal}
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.15}
.frac > span:first-child{border-bottom:1.5px solid currentColor; padding:0 .25em}
.frac > span:last-child{padding:0 .25em}
.answer{font-weight:700; padding:12px 16px; border-radius:16px; background:var(--paper); border:2px solid var(--ink); max-width:66ch}
.aviso{background:var(--acento); color:var(--acento-ink); border-radius:16px; padding:10px 14px; font-size:.93rem}

.opts{display:grid; grid-template-columns:1fr; gap:8px}
@media (min-width:560px){ .opts{grid-template-columns:repeat(2, minmax(0,1fr))} }
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; padding:12px 14px; border-radius:16px; border:2px solid var(--line);
  background:var(--paper); color:var(--ink); font:inherit; cursor:pointer; min-height:48px}
.opt .l{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:.85rem;
  background:var(--card); border:1.5px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 10%, var(--paper))}
.opt.correct .l{background:var(--ok); border-color:var(--ok); color:var(--card)}
.opt.wrong{border-color:var(--warn); background:color-mix(in srgb, var(--warn) 9%, var(--paper))}
.opt.wrong .l{background:var(--warn); border-color:var(--warn); color:var(--card)}
.fb{font-weight:700; margin:0}
.fb.ok{color:var(--ok)} .fb.mal{color:var(--warn)}

.ctrls{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap:12px; align-items:end}
.slider{display:grid; gap:4px}
.slider label{font-weight:700; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.slider output{font-family:var(--mono); color:var(--muted)}
input[type=range]{width:100%; accent-color:var(--ink); min-height:28px}
input.r-v{accent-color:var(--c-v)} input.r-a{accent-color:var(--c-a)} input.r-t{accent-color:var(--c-t)} input.r-w{accent-color:var(--c-w)} input.r-at{accent-color:var(--c-at)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:.86rem; padding:4px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); font-weight:700}
.chip.ok{border-color:var(--ok); color:var(--ok)}
.chip.virt{border-style:dashed}
.seg{display:inline-flex; flex-wrap:wrap; gap:4px; padding:4px; border-radius:999px; background:var(--paper); border:1px solid var(--line); justify-self:start; max-width:100%}
.seg button{font:700 .9rem var(--font); padding:8px 14px; border-radius:999px; border:0; background:transparent; color:var(--muted); cursor:pointer; min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--card)}
.exps{border-radius:20px}
.seg button:disabled{opacity:.45; cursor:not-allowed}

.nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.btn{font:700 .95rem var(--font); padding:11px 20px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; min-height:44px}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--card)}
.btn:disabled{opacity:.45; cursor:not-allowed}
button:focus-visible, .v:focus-visible, input:focus-visible, a:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.hint{font-size:.88rem; color:var(--muted)}
.fuente{font-size:.86rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px}
.pie{margin:4px 0 0; text-align:center; color:var(--muted); font-size:.95rem}
.pie a{color:var(--ink); font-weight:700}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.volver-app{display:inline-block; margin:12px 16px 0; background:var(--card); color:var(--ink); box-shadow:var(--shadow);
  font:700 14px var(--font); padding:8px 16px; border-radius:999px; text-decoration:none}

.barra{display:grid; gap:6px}
.fila{display:grid; grid-template-columns:7.2em 1fr; gap:8px; align-items:center; font-size:.86rem; font-weight:700}
.tiras{display:flex; height:28px; border-radius:8px; overflow:hidden; background:var(--grid)}
.tira{display:flex; align-items:center; justify-content:center; color:var(--card); font:700 .78rem var(--mono); white-space:nowrap; overflow:hidden; min-width:2px; border-right:2px solid var(--card)}
.tira:last-child{border-right:0}

.check{display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:.92rem; cursor:pointer; min-height:44px}
.check input{width:20px; height:20px; accent-color:var(--ink)}

/* Pantalla grande (laboratorio de cómputo, 1366 × 768): dibujo a la izquierda, fijo; guía a la derecha. */
@media (min-width:900px){
  .top{grid-template-columns:1fr auto; align-items:end}
  .mode{grid-template-columns:minmax(0, 1.4fr) minmax(360px, 1fr)}
  .bench{position:sticky; top:12px}
}
</style>
</head>
<body>

<main class="wrap">
  <div class="top">
    <header>
      <p class="eyebrow">Física · Cinemática · Problemas tipo admisión</p>
      <h1>Tiro parabólico y movimiento circular</h1>
      <p class="sub">Un tiro son dos movimientos a la vez: uno horizontal y otro vertical. Mira sus sombras sobre los ejes.</p>
    </header>
    <nav class="tabs" aria-label="Modo de la escena">
      <a href="#paso-a-paso" id="tab1">Paso a paso</a>
      <a href="#que-pasa-si" id="tab2">¿Qué pasa si…?</a>
      <a href="#ruedas" id="tab3" aria-label="Ruedas y pistas: movimiento circular">Ruedas</a>
    </nav>
  </div>

  <!-- ===== MODO 1: paso a paso ===== -->
  <div id="m1" class="mode">
    <section class="bench" aria-label="Campo de tiro con el proyectil, su trayectoria y sus sombras sobre los ejes">
      <div class="lienzo"><canvas id="cv" tabindex="-1" role="img" aria-label="Campo de tiro con un cañón, el proyectil y sus sombras sobre los ejes"></canvas></div>
      <p class="sr" id="desc1" aria-live="polite"></p>
      <div class="legend" id="ley1"></div>
    </section>
    <section class="guide">
      <ol class="dots" id="dots"></ol>
      <div aria-live="polite">
        <p class="step-k" id="stepK"></p>
        <h2 class="step-t" id="stepT" tabindex="-1"></h2>
      </div>
      <div id="stepBody" class="body"></div>
      <div class="nav">
        <button id="prev" type="button" class="btn">Anterior</button>
        <button id="next" type="button" class="btn primary">Siguiente</button>
      </div>
    </section>
  </div>

  <!-- ===== MODO 2: ¿qué pasa si…? ===== -->
  <div id="m2" class="mode" hidden>
    <section class="bench" aria-label="Experimento elegido">
      <div class="lienzo"><canvas id="cv2" tabindex="-1" role="img" aria-label="Dibujo del experimento elegido"></canvas></div>
      <p class="sr" id="desc2" aria-live="polite"></p>
      <div class="legend" id="ley2"></div>
    </section>
    <section class="guide">
      <div class="seg exps" id="exps" role="group" aria-label="Experimentos (se abren en orden: responde uno para pasar al siguiente)"></div>
      <div aria-live="polite">
        <p class="step-k" id="k2"></p>
        <h2 class="step-t" id="t2" tabindex="-1"></h2>
      </div>
      <div id="body2" class="body"></div>
    </section>
  </div>

  <!-- ===== MODO 3: ruedas y pistas ===== -->
  <div id="m3" class="mode" hidden>
    <section class="bench" aria-label="Experimento elegido de ruedas y pistas">
      <div class="lienzo"><canvas id="cv3" tabindex="-1" role="img" aria-label="Dibujo del experimento elegido"></canvas></div>
      <p class="sr" id="desc3" aria-live="polite"></p>
      <div class="legend" id="ley3"></div>
    </section>
    <section class="guide">
      <div class="seg exps" id="exps3" role="group" aria-label="Experimentos de ruedas y pistas (se abren en orden: responde uno para pasar al siguiente)"></div>
      <div aria-live="polite">
        <p class="step-k" id="k3"></p>
        <h2 class="step-t" id="t3" tabindex="-1"></h2>
      </div>
      <div id="body3" class="body"></div>
    </section>
  </div>

  <p class="pie">¿Quieres practicar sin la escena? <a href="/app/#/papel/tiro-parabolico">Problemas para lápiz y papel</a></p>
</main>

<script>
// Si la escena se abrió desde la app, mostrar un botón para volver (en iPhone, la app instalada no tiene "atrás").
if (new URLSearchParams(location.search).get('desde') === 'app') addEventListener('DOMContentLoaded', () => {
  const a = document.createElement('a'); a.href = '/app/#/cursos'; a.textContent = '‹ App'; a.className = 'volver-app';
  a.setAttribute('aria-label', 'Volver a la app');
  document.body.prepend(a);
});
</script>
<script src="motor.js"></script>
<script src="../../nucleo/medicion.js"></script>
<script src="../../nucleo/celular.js"></script>
<script>
// Registro anónimo de predicciones (nucleo/medicion.js). Solo guarda si el alumno entró por la app.
const PLANTILLA = { id: 'tiro-parabolico', unidad: 'fisica.movimiento-parabolico-y-circular', version: '0.2.0' };
function registrarPrediccion(problema, opcion, correcta, error, respaldo, t0){
  if (!window.Medicion) return;
  Medicion.guardar({ tipo: 'prediccion', modulo: PLANTILLA.id, unidad: PLANTILLA.unidad, problema, opcion, correcta,
    error: correcta ? '' : error, respaldo: correcta ? '' : respaldo, ms: t0 ? Date.now() - t0 : '' }, PLANTILLA.version);
}

/* ================= Piezas de dibujo compartidas =================
   Toda la física sale de MotorTiro (motor.js); aquí solo se pinta. */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = Celular.variable; // guardada hasta que cambie el tema o el tamaño (nucleo/celular.js)
function fmt(n, d){
  if (!Number.isFinite(n)) return '—';
  const p = Math.pow(10, d === undefined ? 1 : d), r = Math.round(n*p)/p + 0;
  let [e, f] = String(Math.abs(r)).split('.');
  if (e.length >= 5) e = e.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (r < 0 ? '−' : '') + e + (f ? ',' + f : '');
}
const N1 = n => fmt(n, Math.abs(n - Math.round(n)) < 1e-9 ? 0 : 1);
// Un múltiplo de π, como en el examen: 8π, −π, 0,24π.
const fmtPi = x => { const k = x/Math.PI; return Math.abs(k - 1) < 1e-9 ? 'π' : Math.abs(k + 1) < 1e-9 ? '−π' : `${fmt(k, 2)}π`; };
const V = (k, t) => `<span class="v v-${k}" data-var="${k}" tabindex="0">${t}</span>`;
const fr = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const M = MotorTiro;
const chico = () => Celular.chico();
// Escribe en una región aria-live solo si el texto cambia (si no, el lector de pantalla repite en cada cuadro).
function decir(el, t){ if (el.textContent !== t) el.textContent = t; }
function crearLienzo(cv, alto, dibujar){
  const ctx = cv.getContext('2d');
  const L = { cv, ctx, W:0, H:0 };
  L.resize = () => {
    const W = cv.clientWidth; if (!W) return;
    const H = Math.round(Celular.alto(alto(W), L.compacto, { tope:260 })), dpr = Celular.dpr();
    L.W = W; L.H = H; cv.style.height = H + 'px'; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    dibujar();
  };
  new ResizeObserver(L.resize).observe(cv);
  // Celular con predicción pendiente: el dibujo más bajo y pegado arriba (nucleo/celular.js).
  L.compactar = on => { on = !!on; Celular.compactar(cv.closest('.mode'), on); if (on === !!L.compacto) return; L.compacto = on; L.resize(); };
  return L;
}
const altoLienzo = W => W >= 560 ? clamp(W*0.62, 330, 460) : clamp(W*0.95, 320, 400);
function alRedibujarTema(fn){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', fn);
  new MutationObserver(fn).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
function linea(ctx, x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function rotulo(ctx, c, x, y, t, color, align, peso, W){
  ctx.font = `${peso || 700} ${c.chico ? 11 : 12}px ${c.font}`; ctx.textBaseline = 'middle';
  const w = ctx.measureText(t).width;
  let x0 = align === 'left' ? x : align === 'right' ? x - w : x - w/2;
  if (W) x0 = clamp(x0, 4, W - w - 4);
  ctx.save(); ctx.fillStyle = c.paper; ctx.globalAlpha = .9; ctx.fillRect(x0 - 3, y - 9, w + 6, 18); ctx.restore();
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.fillText(t, x0, y);
}
function colores(W){
  const g = n => css(n);
  return { ink:g('--ink'), muted:g('--muted'), grid:g('--grid'), paper:g('--paper'), card:g('--card'), line:g('--line'),
    vx:g('--c-vx'), vy:g('--c-vy'), v:g('--c-v'), a:g('--c-a'), t:g('--c-t'), w:g('--c-w'), at:g('--c-at'),
    suelo:g('--suelo'), bloque:g('--bloque'), mono:g('--mono'), font:g('--font'), chico: W < 480 };
}
function flecha(ctx, x1, y1, x2, y2, color, w, dash){
  const ang = Math.atan2(y2 - y1, x2 - x1), l = Math.hypot(x2 - x1, y2 - y1); if (l < 2) return;
  const p = Math.min(9 + w, l*0.6);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  linea(ctx, x1, y1, x2 - Math.cos(ang)*p*0.7, y2 - Math.sin(ang)*p*0.7);
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - Math.cos(ang - .45)*p, y2 - Math.sin(ang - .45)*p); ctx.lineTo(x2 - Math.cos(ang + .45)*p, y2 - Math.sin(ang + .45)*p);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
/* Un vector dibujado: { x, y, dx, dy (en pantalla, sin normalizar: largo en px), col, txt, al, ox, oy, fino, hl } */
function vector(ctx, c, f, W, H){
  const l = Math.hypot(f.dx, f.dy); if (l < 1.5) return;
  flecha(ctx, f.x, f.y, f.x + f.dx, f.y + f.dy, f.col, f.ancho || (f.fino ? 1.8 : (f.hl ? 4.4 : 3)), f.trazos || (f.fino ? [5, 4] : null));
  if (!f.txt) return;
  const ux = f.dx/l, uy = f.dy/l;
  const al = f.al || (ux > 0.35 ? 'left' : ux < -0.35 ? 'right' : 'center');
  rotulo(ctx, c, f.x + f.dx + ux*9 + (f.ox || 0), clamp(f.y + f.dy + uy*12 + (f.oy || 0), 12, (H || 999) - 12), f.txt, f.col, al, f.fino ? 700 : 800, W);
}
function pasoBonito(rango, n){
  const crudo = rango/n, p = Math.pow(10, Math.floor(Math.log10(crudo))), r = crudo/p;
  return (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10)*p;
}

// Alto del lienzo para un campo de tiro: con la misma escala en los dos ejes, el alto que pide la escena
// (sin pasarse del alto normal ni bajar de 230 px), para que una trayectoria baja no deje el lienzo vacío.
function altoCampo(W, P){
  const s = (W - 58)/(P.Xmax - (P.xmin || 0));
  return Math.round(clamp(64 + P.Ymax*s + 24, 230, altoLienzo(W)));
}
/* ---------- Campo de tiro ----------
   P = { tiros:[{ o, nombre, trazos }], t, tFin, xmin, Xmax, Ymax, ver:{ tray:'toda'|'hasta'|null, estrobo, sombras, vx, vy, v, a, comp0,
         v0, cima, alcance, alturas, avion, gTodos, mira, triangulo }, canon, plataforma, crece, hl,
         pared:{ d, alto, cota, asa, sobre, marca, estrella, edificio } }
   tFin corta el vuelo del primer tiro (el impacto contra la pared, que calcula impactoPared en el motor).
   Escala: la misma en los dos ejes, para que la trayectoria, el ángulo del cañón y las flechas de velocidad coincidan. */
function marco(W, H, P){
  const ml = 42, mr = 16, mt = 16, mb = 48, xmin = P.xmin || 0;
  const sc = Math.min((W - ml - mr)/(P.Xmax - xmin), (H - mt - mb)/P.Ymax);
  const X = x => ml + (x - xmin)*sc, Y = y => H - mb - y*sc;
  return { X, Y, sx:sc, sy:sc, ml, mb, mt, xmin };
}
function vistaTiro(L, c, P){
  const { ctx, W, H } = L; ctx.clearRect(0, 0, W, H);
  const m = marco(W, H, P), { X, Y } = m, ver = P.ver || {};
  const ps = P.tiros.map(q => Object.assign({}, q, { p: M.proyectil(q.o) }));
  // Ejes con marcas: el horizontal es el suelo
  ctx.save();
  const px = pasoBonito(P.Xmax - m.xmin, W < 480 ? 4 : 7), py = pasoBonito(P.Ymax, 4);
  ctx.strokeStyle = c.grid; ctx.lineWidth = 1; ctx.font = `600 10px ${c.mono}`; ctx.fillStyle = c.muted;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let x = 0; x <= P.Xmax + 1e-9; x += px){ linea(ctx, X(x), Y(0), X(x), m.mt); ctx.fillText(fmt(x, 0), X(x), Y(0) + 13); }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let y = py; y <= P.Ymax + 1e-9; y += py) linea(ctx, X(0), Y(y), W - 16, Y(y));
  ctx.restore();
  ctx.fillStyle = c.suelo; ctx.globalAlpha = .55; ctx.fillRect(4, Y(0), W - 8, 10); ctx.globalAlpha = 1;
  ctx.strokeStyle = c.ink; ctx.lineWidth = 1.5; linea(ctx, 4, Y(0), W - 4, Y(0)); linea(ctx, X(0), Y(0), X(0), m.mt);
  ctx.font = `700 10px ${c.font}`; ctx.fillStyle = c.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('x (m)', W - 18, Y(0) - 3); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('y (m)', X(0) + 5, m.mt - 2);
  // Plataforma (mirador, mesa o azotea) a la izquierda del punto de lanzamiento
  const y0 = ps[0].p.y0;
  if (P.plataforma && y0 > 0){
    ctx.fillStyle = c.bloque; ctx.strokeStyle = c.ink; ctx.lineWidth = 1.4;
    rr(ctx, X(0) - 26, Y(y0), 26, Y(0) - Y(y0), 3); ctx.fill(); ctx.stroke();
    if (P.altoTxt) rotulo(ctx, c, X(0) - 13, Y(y0) - 12, `azotea ${N1(y0)} m`, c.ink, 'left', 800, W);
  }
  // Números del eje vertical, encima de la plataforma y con fondo, para que se lean
  ctx.save(); ctx.font = `600 10px ${c.mono}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let y = py; y <= P.Ymax + 1e-9; y += py){
    const t = fmt(y, 0), w = ctx.measureText(t).width;
    ctx.fillStyle = c.paper; ctx.globalAlpha = .9; ctx.fillRect(X(0) - 8 - w, Y(y) - 6, w + 4, 12); ctx.globalAlpha = 1;
    ctx.fillStyle = c.muted; ctx.fillText(t, X(0) - 6, Y(y));
  }
  ctx.restore();
  const tCl = q => clamp(P.t, 0, q === ps[0] && P.tFin !== undefined && P.tFin !== null ? Math.min(P.tFin, q.p.tVuelo) : q.p.tVuelo);
  // Pared vertical (o el edificio de enfrente) a la distancia d del punto de lanzamiento
  const pa = P.pared;
  if (pa){
    const xw = X(ps[0].p.x0 + pa.d), top = Number.isFinite(pa.alto) ? Y(pa.alto) : m.mt - 4, ancho = pa.edificio ? Math.max(18, W*0.06) : 8;
    ctx.save(); ctx.fillStyle = c.bloque; ctx.strokeStyle = c.ink; ctx.lineWidth = 1.4;
    rr(ctx, xw, top, ancho, Y(0) - top, 2); ctx.fill(); ctx.stroke(); ctx.restore();
    if (pa.cota){
      ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.2; const yc = Y(0) + 34;
      linea(ctx, X(ps[0].p.x0), yc, xw, yc); linea(ctx, X(ps[0].p.x0), yc - 5, X(ps[0].p.x0), yc + 5); linea(ctx, xw, yc - 5, xw, yc + 5); ctx.restore();
      rotulo(ctx, c, (X(ps[0].p.x0) + xw)/2, Y(0) + 34, `${N1(pa.d)} m`, c.ink, 'center', 800, W);
    }
    if (pa.marca !== undefined && pa.marca !== null && pa.marca <= P.Ymax + 1e-9){
      ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); linea(ctx, xw - 10, Y(pa.marca), xw + ancho + 4, Y(pa.marca)); ctx.restore();
      rotulo(ctx, c, xw - 14, Y(pa.marca), `tu respuesta: ${N1(pa.marca)} m`, c.ink, 'right', 700, W);
    }
    if (pa.asa){ ctx.save(); ctx.beginPath(); ctx.arc(xw + ancho/2, Y(0), pa.sobre ? 11 : 9, 0, Math.PI*2); ctx.fillStyle = c.card; ctx.fill(); ctx.strokeStyle = c.ink; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); }
  }
  // Trayectorias
  ps.forEach((q, j) => {
    if (!ver.tray && !q.fantasma) return;
    const tf = q.fantasma ? q.p.tVuelo : ver.tray === 'toda' ? (j === 0 && P.tFin != null ? Math.min(P.tFin, q.p.tVuelo) : q.p.tVuelo) : tCl(q);
    ctx.save(); ctx.strokeStyle = c.muted; ctx.lineWidth = 1.8; ctx.setLineDash(q.trazos ? [7, 5] : [2, 4]); ctx.beginPath();
    for (let k = 0; k <= 100; k++){ const e = q.p.estado(tf*k/100); k ? ctx.lineTo(X(e.x), Y(e.y)) : ctx.moveTo(X(e.x), Y(e.y)); }
    ctx.stroke(); ctx.restore();
  });
  // Estroboscopio: fotos cada ver.estrobo segundos, con sus sombras sobre los ejes
  if (ver.estrobo){
    const dt = ver.estrobo;
    ps.forEach((q, j) => {
      if (q.fantasma) return;
      for (let t = 0; t <= tCl(q) + 1e-9; t += dt){
        const e = q.p.estado(t);
        ctx.save(); ctx.globalAlpha = .32; ctx.beginPath(); ctx.arc(X(e.x), Y(e.y), 5, 0, Math.PI*2); ctx.fillStyle = c.ink; ctx.fill(); ctx.restore();
        if (ver.sombras && j === 0){
          ctx.save(); ctx.globalAlpha = .55; ctx.fillStyle = c.vx; ctx.fillRect(X(e.x) - 2, Y(0) + 2, 4, 8); ctx.fillStyle = c.vy; ctx.fillRect(X(0) - 10, Y(e.y) - 2, 8, 4); ctx.restore();
        }
      }
    });
    // Líneas de igual instante entre dos proyectiles: si son horizontales, están a la misma altura
    if (ver.alturas && ps.length > 1){
      const a = ps[0], b = ps[1];
      for (let t = dt; t <= Math.min(tCl(a), tCl(b)) + 1e-9; t += dt){
        const ea = a.p.estado(t), eb = b.p.estado(t);
        ctx.save(); ctx.strokeStyle = c.t; ctx.globalAlpha = .7; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.3; linea(ctx, X(ea.x), Y(ea.y), X(eb.x), Y(eb.y)); ctx.restore();
      }
    }
  }
  // Cañón
  if (P.canon){
    const th = ps[0].p.angulo*Math.PI/180, bx = X(ps[0].p.x0), by = Y(y0);
    ctx.save(); ctx.translate(bx, by); ctx.rotate(-th); ctx.fillStyle = c.ink; rr(ctx, -4, -6, 30, 12, 4); ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(bx, by, 11, Math.PI, 0); ctx.fillStyle = c.bloque; ctx.fill(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.4; ctx.stroke();
    if (P.asa){ ctx.save(); ctx.beginPath(); ctx.arc(bx + Math.cos(th)*40, by - Math.sin(th)*40, P.sobreAsa ? 11 : 9, 0, Math.PI*2); ctx.fillStyle = c.card; ctx.fill(); ctx.strokeStyle = c.ink; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); }
    if (ps[0].p.angulo > 0.5){
      ctx.strokeStyle = c.ink; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(bx, by, 52, -th, 0); ctx.stroke();
      rotulo(ctx, c, bx + 58, by - 10, `${fmt(ps[0].p.angulo, 0)}°`, c.ink, 'left', 800, W);
    }
  }
  // Avioneta encima del paquete
  if (ver.avion){
    const q = ps[0], e = q.p.estado(tCl(q)), ax = X(q.p.x0 + q.p.vx*clamp(P.t, 0, q.p.tVuelo)), ay = Y(q.p.y0) - 10;
    ctx.save(); ctx.fillStyle = c.bloque; ctx.strokeStyle = c.ink; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(ax - 26, ay); ctx.lineTo(ax + 18, ay - 4); ctx.lineTo(ax + 26, ay); ctx.lineTo(ax + 18, ay + 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    linea(ctx, ax - 4, ay - 2, ax - 12, ay - 14); linea(ctx, ax - 22, ay, ax - 28, ay - 9); ctx.restore();
    if (ver.avionLinea){ ctx.save(); ctx.strokeStyle = c.t; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.4; linea(ctx, ax, ay + 6, X(e.x), Y(e.y) - 6); ctx.restore(); }
  }
  // Proyectiles
  ps.forEach((q, j) => {
    if (q.fantasma) return;
    const e = q.p.estado(tCl(q));
    ctx.beginPath(); ctx.arc(X(e.x), Y(e.y), 7, 0, Math.PI*2); ctx.fillStyle = j ? c.card : c.bloque; ctx.fill(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.8; ctx.stroke();
    if (q.nombre) rotulo(ctx, c, X(e.x) + (j ? 12 : -12), Y(e.y) - 14, q.nombre, c.ink, j ? 'left' : 'right', 700, W);
  });
  // Vectores sobre el primero (o sobre todos con gTodos)
  const q = ps[0], e = q.p.estado(tCl(q)), bx = X(e.x), by = Y(e.y), enSuelo = P.t > 0 && e.y < 1e-6;
  const vref = Math.max(...ps.map(r => Math.max(r.p.v0, r.p.vFinal.modulo)), 10), kv = Math.min(W, H)*0.2/vref, cr = P.crece === undefined ? 1 : P.crece;
  const lista = [];
  const sh = (o, k) => o === 'nueva' ? cr : 1;
  if (ver.comp0){
    const x0 = X(q.p.x0), y0p = Y(q.p.y0);
    lista.push({ x:x0, y:y0p, dx:q.p.vx*kv*m.sx/m.sx, dy:0, col:c.vx, txt:`vx = ${N1(q.p.vx)} m/s`, oy:14, al:'left', hl:P.hl === 'vx' });
    lista.push({ x:x0, y:y0p, dx:0, dy:-q.p.vy*kv, col:c.vy, txt:`v₀y = ${N1(q.p.vy)} m/s`, al:'right', ox:-4, hl:P.hl === 'vy' });
    lista.push({ x:x0, y:y0p, dx:q.p.vx*kv, dy:-q.p.vy*kv, col:c.v, txt:`v₀ = ${N1(q.p.v0)} m/s`, oy:-10, hl:P.hl === 'v' });
  }
  if (ver.v0){ const x0 = X(q.p.x0), y0p = Y(q.p.y0); lista.push({ x:x0, y:y0p, dx:q.p.vx*kv, dy:-q.p.vy*kv, col:c.v, txt:`v₀ = ${N1(q.p.v0)} m/s`, oy:-10 }); }
  if (ver.mira){
    ctx.save(); ctx.strokeStyle = c.muted; ctx.lineWidth = 1.6; ctx.setLineDash([6, 5]);
    linea(ctx, X(q.p.x0), Y(q.p.y0), X(q.p.x0 + ver.mira), Y(q.p.y0 + ver.mira*q.p.vy/q.p.vx)); ctx.restore();
    rotulo(ctx, c, X(q.p.x0 + ver.mira*0.45) - 6, Y(q.p.y0 + ver.mira*0.45*q.p.vy/q.p.vx) - 4, 'línea de mira', c.muted, 'right', 700, W);
  }
  // Triángulo rectángulo de vx, vy y v (a trazos, en tinta); el ángulo del golpe sale del motor (ver.triangulo, en grados)
  const triangulo = () => {
    if (!ver.triangulo || Math.abs(e.vy) < 0.05) return;
    ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.3; ctx.setLineDash([4, 4]);
    linea(ctx, bx + e.vx*kv, by, bx + e.vx*kv, by - e.vy*kv); ctx.restore();
    const ang = Math.atan2(-e.vy, e.vx); ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(bx, by, 24, 0, ang, ang < 0); ctx.stroke(); ctx.restore();
    rotulo(ctx, c, bx + 34*Math.cos(ang/2), by + 34*Math.sin(ang/2), `${fmt(ver.triangulo, 0)}°`, c.ink, 'left', 800, W);
  };
  // Con ver.cortas los rótulos dicen solo la letra (los valores van en los chips): en el impacto contra la pared no caben
  const tx = (letra, val, u) => (ver.cortas ? letra : `${letra} = ${N1(val)} ${u}`);
  if (ver.vx) lista.push({ x:bx, y:by, dx:e.vx*kv*sh(ver.vx), dy:0, col:c.vx, txt:tx('vx', e.vx, 'm/s'), oy: ver.cortas ? -10 : 12, al:'left', hl:P.hl === 'vx' });
  if (ver.vy && Math.abs(e.vy) > 0.05 && !enSuelo) lista.push({ x:bx, y:by, dx:0, dy:-e.vy*kv*sh(ver.vy), col:c.vy, txt:tx('vy', e.vy, 'm/s'), al:'right', ox:-6, hl:P.hl === 'vy' });
  if (ver.v) lista.push({ x:bx, y:by, dx:e.vx*kv*sh(ver.v), dy:-e.vy*kv*sh(ver.v), col:c.v, txt:tx('v', e.v, 'm/s'), oy: ver.cortas ? 10 : -10, hl:P.hl === 'v' });
  const ka = Math.min(W, H)*0.11/10;
  if (ver.gTodos && ver.estrobo){
    for (let t = 0; t <= tCl(q) + 1e-9; t += ver.estrobo){ const s = q.p.estado(t); flecha(ctx, X(s.x), Y(s.y) + 7, X(s.x), Y(s.y) + 7 + 10*ka*sh(ver.gTodos), c.a, 2); }
  }
  if (ver.a && !enSuelo) lista.push({ x:bx, y:by + 8, dx:0, dy:10*ka*sh(ver.a), col:c.a, txt:'a = g = 10 m/s²', al:'left', ox:6, oy:-4, hl:P.hl === 'a' });
  lista.forEach(f => vector(ctx, c, f, W, H));
  triangulo();
  // Estrella en el punto donde golpea la pared
  if (pa && pa.estrella){ const ex = X(pa.estrella.x), ey = Y(pa.estrella.y); estrella(ctx, ex, ey, 9, c.ink, c.card); }
  // Marcas: altura máxima y alcance
  if (ver.cima && q.p.vy > 0 && (q.p.H - q.p.y0)*m.sy > 20 && !(pa && pa.estrella && q.p.vx*q.p.tSubida > pa.d)){
    const xc = X(q.p.x0 + q.p.vx*q.p.tSubida), yc = Y(q.p.H);
    ctx.save(); ctx.strokeStyle = c.ink; ctx.globalAlpha = .5; ctx.setLineDash([4, 4]); linea(ctx, xc, yc, xc, Y(0)); ctx.restore();
    rotulo(ctx, c, xc + 6, (yc + Y(0))/2, `H = ${N1(q.p.H)} m`, c.ink, 'left', 800, W);
  }
  if (ver.alcance && q.p.alcance*m.sx > 40 && !(pa && pa.estrella)){
    ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.4; linea(ctx, X(q.p.x0), Y(0) + 36, X(q.p.x0 + q.p.alcance), Y(0) + 36); ctx.restore();
    rotulo(ctx, c, (X(q.p.x0) + X(q.p.x0 + q.p.alcance))/2, Y(0) + 36, `alcance ${N1(q.p.alcance)} m`, c.ink, 'center', 800, W);
  }
  return m;
}

function estrella(ctx, x, y, r, borde, relleno){
  ctx.save(); ctx.beginPath();
  for (let k = 0; k < 10; k++){ const a = -Math.PI/2 + k*Math.PI/5, rr = k % 2 ? r*0.45 : r; ctx.lineTo(x + rr*Math.cos(a), y + rr*Math.sin(a)); }
  ctx.closePath(); ctx.fillStyle = relleno; ctx.fill(); ctx.strokeStyle = borde; ctx.lineWidth = 1.8; ctx.stroke(); ctx.restore();
}

/* ---------- Movimiento circular, visto desde arriba ----------
   P = { r, omega, theta (grados), suelto:{ theta0, t } | null, ver:{ v, a, w, todos }, auto, crece } */
function vistaCirculo(L, c, P){
  const { ctx, W, H } = L; ctx.clearRect(0, 0, W, H);
  const cx = W/2, cy = H/2, R = Math.min(W, H)*0.3, k = R/P.r, ver = P.ver || {}, cr = P.crece === undefined ? 1 : P.crece;
  ctx.save(); ctx.strokeStyle = c.muted; ctx.setLineDash([3, 5]); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2); ctx.fillStyle = c.ink; ctx.fill();
  const scr = (x, y) => ({ x: cx + x*k, y: cy - y*k });
  const v = Math.abs(P.omega)*P.r, kv = R*0.55/Math.max(v, 1e-9);
  const lista = [];
  const punto = th => { const a = th*Math.PI/180; return { x: P.r*Math.cos(a), y: P.r*Math.sin(a) }; };
  // Velocidad tangente (v) y aceleración al centro (a) en un punto del círculo
  const flechasEn = (th, fino, txt) => {
    const a = th*Math.PI/180, p = scr(...Object.values(punto(th))), sg = Math.sign(P.omega) || 1;
    if (ver.v) lista.push({ x:p.x, y:p.y, dx:-Math.sin(a)*sg*v*kv*(ver.v === 'nueva' ? cr : 1), dy:-Math.cos(a)*sg*v*kv*(ver.v === 'nueva' ? cr : 1), col:c.v, txt: txt ? `v = ${N1(v)} m/s` : '', fino });
    if (ver.a) lista.push({ x:p.x, y:p.y, dx:-Math.cos(a)*R*0.45*(ver.a === 'nueva' ? cr : 1), dy:Math.sin(a)*R*0.45*(ver.a === 'nueva' ? cr : 1), col:c.a, txt: txt ? `ac = ${N1(P.omega*P.omega*P.r)} m/s²` : '', fino });
  };
  if (ver.todos) for (let th = 0; th < 360; th += 45) if (Math.abs(((th - P.theta) % 360 + 360) % 360) > 10) flechasEn(th, true, false);
  if (P.suelto){
    const s = M.soltarDelCirculo({ r:P.r, omega:P.omega, theta:P.suelto.theta0, t:P.suelto.t }), p0 = scr(s.suelta.x, s.suelta.y), p = scr(s.x, s.y);
    ctx.save(); ctx.strokeStyle = c.muted; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); linea(ctx, p0.x, p0.y, p.x, p.y); ctx.restore();
    ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fillStyle = c.bloque; ctx.fill(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.8; ctx.stroke();
    if (ver.v) lista.push({ x:p.x, y:p.y, dx:s.vx*kv, dy:-s.vy*kv, col:c.v, txt:`v = ${N1(v)} m/s` });
    // la mano y el trozo de cuerda que quedó
    ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.4; const q0 = scr(s.suelta.x*0.55, s.suelta.y*0.55); linea(ctx, cx, cy, q0.x, q0.y); ctx.restore();
  } else {
    const pt = punto(P.theta), p = scr(pt.x, pt.y);
    if (P.auto){ ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(-P.theta*Math.PI/180); ctx.fillStyle = c.bloque; ctx.strokeStyle = c.ink; ctx.lineWidth = 1.6; rr(ctx, -9, -15, 18, 30, 5); ctx.fill(); ctx.stroke(); ctx.restore(); }
    else {
      ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.4; linea(ctx, cx, cy, p.x, p.y); ctx.restore();
      ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fillStyle = c.bloque; ctx.fill(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.8; ctx.stroke();
    }
    flechasEn(P.theta, false, true);
  }
  if (ver.w){
    const sg = Math.sign(P.omega) || 1, a0 = -0.3, a1 = a0 - sg*1.4;
    ctx.save(); ctx.strokeStyle = c.w; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(cx, cy, 26, a0, a1, sg > 0); ctx.stroke();
    const a2 = a1 + sg*0.55, ex = cx + 26*Math.cos(a1), ey = cy + 26*Math.sin(a1); flecha(ctx, cx + 26*Math.cos(a2), cy + 26*Math.sin(a2), ex, ey, c.w, 2.4); ctx.restore();
    rotulo(ctx, c, cx + 30, cy + 26, `ω = ${fmt(Math.abs(P.omega), 2)} rad/s`, c.w, 'left', 800, W);
  }
  lista.forEach(f => vector(ctx, c, f, W, H));
  rotulo(ctx, c, cx, cy + R + 18, P.pie || `radio ${N1(P.r)} m · vista desde arriba`, c.muted, 'center', 700, W);
}

/* ---------- Arco de giro (ω) con su punta ---------- sentido horario en pantalla si horario */
function arcoGiro(ctx, c, cx, cy, rad, color, horario, txt, W, tx, ty, desde){
  const a0 = desde === undefined ? -2.3 : desde, a1 = horario ? a0 + 1.5 : a0 - 1.5;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.arc(cx, cy, rad, a0, a1, !horario); ctx.stroke(); ctx.restore();
  const a2 = horario ? a1 - 0.5 : a1 + 0.5;
  flecha(ctx, cx + rad*Math.cos(a2), cy + rad*Math.sin(a2), cx + rad*Math.cos(a1), cy + rad*Math.sin(a1), color, 2.6);
  if (txt) rotulo(ctx, c, tx === undefined ? cx : tx, ty === undefined ? cy - rad - 12 : ty, txt, color, 'center', 800, W);
}
function rueda(ctx, c, cx, cy, R, th, o){
  o = o || {};
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fillStyle = c.bloque; ctx.fill(); ctx.strokeStyle = c.ink; ctx.lineWidth = o.llanta ? 4 : 1.6; ctx.stroke();
  if (o.dientes){ ctx.lineWidth = 1.4; for (let j = 0; j < o.dientes; j++){ const a = th + j*2*Math.PI/o.dientes; linea(ctx, cx + R*Math.cos(a), cy - R*Math.sin(a), cx + (R + 4)*Math.cos(a), cy - (R + 4)*Math.sin(a)); } }
  if (o.rayos){ ctx.strokeStyle = c.muted; ctx.lineWidth = 1.2; for (let j = 0; j < o.rayos; j++){ const a = th + j*2*Math.PI/o.rayos; linea(ctx, cx + (o.desde || 0)*Math.cos(a), cy - (o.desde || 0)*Math.sin(a), cx + R*Math.cos(a), cy - R*Math.sin(a)); } }
  // La marca: un radio en tinta con un punto, para ver cuánto gira
  ctx.strokeStyle = c.ink; ctx.lineWidth = 2; linea(ctx, cx, cy, cx + R*0.85*Math.cos(th), cy - R*0.85*Math.sin(th));
  ctx.beginPath(); ctx.arc(cx + R*0.85*Math.cos(th), cy - R*0.85*Math.sin(th), Math.max(3, Math.min(6, R*0.12)), 0, Math.PI*2); ctx.fillStyle = c.ink; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI*2); ctx.fill(); ctx.restore();
}

/* ---------- Transmisión: cadena entre dos ruedas (vista de lado) o dos ruedas en el mismo eje ----------
   P = { tipo:'cadena'|'eje', r1, r2 (m), th1, th2 (rad, + antihorario; giran en sentido horario), avance (m de cadena),
         v1, perfil:[{ r, v }], ver:{ w1, w2, v, w }, txtW1, txtW2, txtV, contador, pie } */
function vistaTransmision(L, c, P){
  const { ctx, W, H } = L; ctx.clearRect(0, 0, W, H);
  const ver = P.ver || {};
  if (P.tipo === 'cadena'){
    const Dm = P.r1 + P.r2 + 0.1, k = Math.min((W - 80)/(P.r1 + Dm + P.r2), (H - 120)/(2*Math.max(P.r1, P.r2)));
    const R1 = P.r1*k, R2 = P.r2*k, D = Dm*k, x1 = (W - (R1 + D + R2))/2 + R1, x2 = x1 + D, y = H/2 + 4;
    // Recorrido de la cadena: tangentes exteriores y los arcos que abraza en cada rueda
    const cosA = (R1 - R2)/D, al = Math.acos(clamp(cosA, -1, 1)), sA = Math.sin(al);
    const T1 = [R1*cosA, R1*sA], T2 = [D + R2*cosA, R2*sA], B2 = [D + R2*cosA, -R2*sA], B1 = [R1*cosA, -R1*sA];
    const seg = Math.hypot(T2[0] - T1[0], T2[1] - T1[1]), arc2 = R2*2*al, arc1 = R1*(2*Math.PI - 2*al), tot = 2*seg + arc1 + arc2;
    const pt = u => { u = ((u % tot) + tot) % tot; let q;
      if (u < seg){ const f = u/seg; q = [T1[0] + (T2[0] - T1[0])*f, T1[1] + (T2[1] - T1[1])*f]; }
      else if ((u -= seg) < arc2){ const a = al - u/R2; q = [D + R2*Math.cos(a), R2*Math.sin(a)]; }
      else if ((u -= arc2) < seg){ const f = u/seg; q = [B2[0] + (B1[0] - B2[0])*f, B2[1] + (B1[1] - B2[1])*f]; }
      else { u -= seg; const a = -al - u/R1; q = [R1*Math.cos(a), R1*Math.sin(a)]; }
      return [x1 + q[0], y - q[1]]; };
    rueda(ctx, c, x1, y, R1, P.th1, { dientes: Math.round(P.r1*200) });
    rueda(ctx, c, x2, y, R2, P.th2, { dientes: Math.max(5, Math.round(P.r2*200)) });
    // Biela y pedal de la catalina
    ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 4; ctx.lineCap = 'round'; const bx = x1 - R1*1.15*Math.cos(P.th1), by = y + R1*1.15*Math.sin(P.th1);
    linea(ctx, x1, y, bx, by); ctx.fillStyle = c.ink; ctx.fillRect(bx - 9, by - 3, 18, 6); ctx.restore();
    // Eslabones: rayitas que avanzan a la rapidez de la cadena
    ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const paso = 11, off = ((P.avance || 0)*k) % paso;
    for (let u = off; u < tot + off - 1; u += paso){ const a = pt(u), b = pt(u + 6); linea(ctx, a[0], a[1], b[0], b[1]); }
    ctx.restore();
    if (ver.w1) arcoGiro(ctx, c, x1, y, R1 + 16, c.w, true, P.txtW1, W, x1 - R1*0.55, y - R1 - 26);
    if (ver.w2) arcoGiro(ctx, c, x2, y, R2 + 14, c.w, true, P.txtW2, W, x2, y + R2 + 38, 0.5);
    if (ver.v){
      const kv = Math.min(W*0.12, 48)/Math.max(P.v1, 1e-9);
      vector(ctx, c, { x:x1, y:y - R1, dx:P.v1*kv, dy:0, col:c.v, txt:'v', al:'left' }, W, H);
      vector(ctx, c, { x:x2, y:y - R2, dx:P.v1*kv, dy:0, col:c.v, txt:'v', al:'left' }, W, H);
      if (P.txtV) rotulo(ctx, c, W/2, H - 14, P.txtV, c.v, 'center', 800, W);
    }
    rotulo(ctx, c, x1, y + R1 + 16, `catalina · ${fmt(P.r1*100, 0)} cm`, c.ink, 'center', 700, W);
    rotulo(ctx, c, x2, y - R2 - 30, `piñón · ${fmt(P.r2*100, 0)} cm`, c.ink, 'center', 700, W);
  } else {
    const cx = W/2, cy = H/2 + 10, k = (Math.min(W*0.9, H) / 2 - 30)/0.35, R1 = P.r1*k, R2 = P.r2*k;
    rueda(ctx, c, cx, cy, R2, P.th1, { llanta:true, rayos:12, desde:R1 });
    rueda(ctx, c, cx, cy, R1, P.th1, { dientes:9 });
    // Flechas v a lo largo del radio vertical de arriba (de los puntos que en este instante pasan por ahí)
    const kv = (W/2 - 70)/7;
    (P.perfil || []).forEach((q, j, arr) => {
      const yy = cy - q.r*k;
      vector(ctx, c, { x:cx, y:yy, dx:q.v*kv, dy:0, col:c.v, txt:q.txt || '', al:'left', oy:0, ancho:3 }, W, H);
      ctx.save(); ctx.fillStyle = c.ink; ctx.beginPath(); ctx.arc(cx, yy, 2.6, 0, Math.PI*2); ctx.fill(); ctx.restore();
      if (q.rtxt) rotulo(ctx, c, cx - 8, yy, q.rtxt, c.ink, 'right', 700, W);
    });
    if (ver.w) arcoGiro(ctx, c, cx, cy, Math.max(R1 + 18, R2*0.5), c.w, true, P.txtW1, W, cx, cy + R2*0.62, 0.3);
  }
  if (P.contador) rotulo(ctx, c, 10, 16, P.contador, c.ink, 'left', 800, W);
  if (P.pie) rotulo(ctx, c, W/2, H - 12, P.pie, c.muted, 'center', 700, W);
}

/* ---------- Frena la rueda: rueda que gira y gráfica ω-t con el área barrida ----------
   P = { f0, tp, t, seguir, ver:{ area, cursor, flechas, rect } }   ω en vueltas por segundo; todo sale del motor */
function vistaGiroW(L, c, P){
  const { ctx, W, H } = L; ctx.clearRect(0, 0, W, H);
  const ver = P.ver || {}, r = 0.3, w0 = P.f0*M.TAU;
  const d = M.mcuvDatos({ f0:P.f0, f:0, t:P.tp, r });
  const giro = M.mcuv({ r, omega0:w0, alfa:d.alfa, t:P.t || 0, frena:!P.seguir });
  const ancho = W >= 560;
  const tAx = Math.ceil(P.seguir ? P.tp*1.5 : P.tp + 1), fTop = Math.ceil(P.f0 + 0.5), fBot = P.seguir ? -Math.ceil(P.f0*0.5) : 0;
  const gx0 = ancho ? W*0.4 : 46, gx1 = W - 16, gy0 = ancho ? 30 : Math.min(96, H*0.3), gy1 = H - (P.pie ? 46 : 32);
  const Xg = t => gx0 + t/tAx*(gx1 - gx0), Yg = f => gy0 + (fTop - f)/(fTop - fBot)*(gy1 - gy0);
  // Cuadrícula de 1 s por 1 vuelta/s
  ctx.save(); ctx.strokeStyle = c.grid; ctx.lineWidth = 1;
  for (let t = 0; t <= tAx; t++) linea(ctx, Xg(t), Yg(fTop), Xg(t), Yg(fBot));
  for (let f = fBot; f <= fTop; f++) linea(ctx, Xg(0), Yg(f), Xg(tAx), Yg(f));
  ctx.restore();
  // Área barrida hasta el cursor (en tinta suave): lo que giró
  if (ver.area && P.t > 0){
    const tA = Math.min(P.t, P.tp), fA = P.f0*(1 - tA/P.tp);
    ctx.save(); ctx.fillStyle = c.ink; ctx.globalAlpha = .16; ctx.beginPath();
    ctx.moveTo(Xg(0), Yg(0)); ctx.lineTo(Xg(0), Yg(P.f0)); ctx.lineTo(Xg(tA), Yg(fA)); ctx.lineTo(Xg(tA), Yg(0)); ctx.closePath(); ctx.fill(); ctx.restore();
    if (P.seguir && P.t > P.tp){
      const fB = P.f0*(1 - P.t/P.tp);
      ctx.save(); ctx.fillStyle = c.ink; ctx.globalAlpha = .08; ctx.beginPath(); ctx.moveTo(Xg(P.tp), Yg(0)); ctx.lineTo(Xg(P.t), Yg(fB)); ctx.lineTo(Xg(P.t), Yg(0)); ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }
  if (ver.rect){
    ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.4; ctx.setLineDash([5, 4]); ctx.strokeRect(Xg(0), Yg(P.f0), Xg(P.tp) - Xg(0), Yg(0) - Yg(P.f0)); ctx.restore();
    rotulo(ctx, c, Xg(P.tp) - 4, Yg(P.f0) + 12, `rectángulo ${N1(d.errores.vueltasRectanguloInicial)} · la mitad: ${N1(d.vueltas)}`, c.ink, 'right', 800, W);
  }
  // Ejes
  ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.5; linea(ctx, Xg(0), Yg(0), Xg(tAx), Yg(0)); linea(ctx, Xg(0), Yg(fBot), Xg(0), Yg(fTop)); ctx.restore();
  ctx.save(); ctx.font = `600 10px ${c.mono}`; ctx.fillStyle = c.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let t = 0; t <= tAx; t++) ctx.fillText(String(t), Xg(t), Yg(Math.min(0, fBot)) + 5);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let f = fBot; f <= fTop; f++) if (f) ctx.fillText(String(f).replace('-', '−'), Xg(0) - 5, Yg(f));
  ctx.restore();
  ctx.save(); ctx.font = `700 10px ${c.font}`; ctx.fillStyle = c.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('t (s)', Xg(tAx), Yg(0) - 4); ctx.textAlign = 'left'; ctx.fillText('ω (vueltas por segundo)', Xg(0) + 4, gy0 - 8); ctx.restore();
  // La recta de ω
  ctx.save(); ctx.strokeStyle = c.w; ctx.lineWidth = 3; linea(ctx, Xg(0), Yg(P.f0), Xg(P.tp), Yg(0));
  if (P.seguir){ ctx.setLineDash([6, 5]); linea(ctx, Xg(P.tp), Yg(0), Xg(tAx), Yg(P.f0*(1 - tAx/P.tp))); }
  ctx.restore();
  if (ver.cursor){
    const xt = Xg(Math.min(P.t, tAx));
    ctx.save(); ctx.strokeStyle = c.t; ctx.lineWidth = 2; linea(ctx, xt, Yg(fTop), xt, Yg(fBot)); ctx.restore();
    rotulo(ctx, c, xt, Yg(fBot) - 10, `t = ${fmt(P.t, 1)} s`, c.t, 'center', 800, W);
  }
  // La rueda (arriba a la izquierda en pantalla grande; en la esquina libre del gráfico en el celular)
  const Rw = ancho ? Math.min(W*0.13, H*0.26) : Math.min(30, gy0*0.3), wx = ancho ? W*0.2 : W - 60, wy = ancho ? H*0.42 : gy0/2;
  const th = Math.PI/2 - giro.theta;
  rueda(ctx, c, wx, wy, Rw, th, { llanta:true, rayos:8 });
  if (ver.cursor) rotulo(ctx, c, ancho ? wx : wx - Rw - 44, ancho ? wy + Rw + 22 : wy, `vueltas: ${fmt(giro.vueltas, 1)}`, c.ink, ancho ? 'center' : 'right', 800, W);
  if (ver.flechas && Math.abs(giro.omega) > 1e-9){
    const px = wx + Rw*Math.cos(th), py = wy - Rw*Math.sin(th), acMax = w0*w0*r, Lm = ancho ? Rw*0.9 : 34;
    const lac = giro.ac/acMax*Lm, lat = Math.max(14, Math.abs(giro.at)/acMax*Lm), sg = Math.sign(giro.omega);
    // Gira en sentido horario: la velocidad va (sen θ, cos θ) en pantalla; at frena, en contra
    const ux = Math.sin(th)*sg, uy = Math.cos(th)*sg, atx = giro.at < 0 ? -ux*lat : ux*lat, aty = giro.at < 0 ? -uy*lat : uy*lat;
    const acx = -Math.cos(th)*lac, acy = Math.sin(th)*lac;
    if (Math.abs(giro.at) > 1e-9){ flecha(ctx, px, py, px + atx + acx, py + aty + acy, c.ink, 1.8, [4, 3]); }
    flecha(ctx, px, py, px + atx, py + aty, c.at, 3.6);
    if (lac > 2) flecha(ctx, px, py, px + acx, py + acy, c.a, 3.2);
    rotulo(ctx, c, px + atx*1.25, py + aty*1.25, 'at', c.at, 'center', 800, W);
    if (lac > 10) rotulo(ctx, c, px + acx*0.55, py + acy*0.55 - 9, 'ac', c.a, 'center', 800, W);
  }
  if (P.pie) rotulo(ctx, c, W/2, H - 10, P.pie, c.muted, 'center', 700, W);
}

/* ---------- La pista: vista desde arriba, A y B corren; el arco grueso es la distancia que falta cerrar ----------
   P = { L, v1, v2, sentido, s0, t, ver:{ arco, fin } }   posiciones con encuentroPista(...).estado(t) */
function vistaPista(L, c, P){
  const { ctx, W, H } = L; ctx.clearRect(0, 0, W, H);
  const e = M.encuentroPista({ L:P.L, v1:P.v1, v2:P.v2, sentido:P.sentido, separacion:P.s0 }), st = e.estado(P.t || 0), ver = P.ver || {};
  const cx = W/2, cy = H/2 + 6, R = Math.min(W*0.42, H/2 - 44);
  const ang = s => Math.PI/2 - s/P.L*2*Math.PI, at = (s, rr) => [cx + rr*Math.cos(ang(s)), cy - rr*Math.sin(ang(s))];
  ctx.save(); ctx.strokeStyle = c.suelo; ctx.globalAlpha = .55; ctx.lineWidth = 26; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.strokeStyle = c.muted; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, R - 13, 0, Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(cx, cy, R + 13, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  // Salida
  ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 3; linea(ctx, cx, cy - R - 14, cx, cy - R + 14); ctx.restore();
  rotulo(ctx, c, cx - 10, cy - R - 26, `salida · pista de ${N1(P.L)} m`, c.ink, 'right', 700, W);
  const mismo = P.sentido === 'mismo';
  // Lo que falta cerrar para el primer encuentro: desde el que persigue, en el sentido de A
  if (ver.arco && !e.nunca){
    const resta = Math.max(0, e.brecha - e.vRel*(P.t || 0)), desde = mismo && P.v1 < P.v2 ? st.b : st.a;
    if (resta > 0.5){
      ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 6; ctx.globalAlpha = .8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, R, -ang(desde), -ang(desde + resta), false); ctx.stroke(); ctx.restore();
      const mid = at(desde + resta/2, R - 30); rotulo(ctx, c, mid[0], mid[1], `falta ${N1(resta)} m`, c.ink, 'center', 800, W);
    }
  }
  if (ver.fin){ ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, R + 17, 0, Math.PI*2); ctx.stroke(); ctx.restore(); }
  // Corredores: A (relleno, carril de adentro) y B (hueco, carril de afuera)
  const kv = R*0.07, pa = at(st.a, R - 6), pb = at(st.b, R + 6);
  const tang = (s, sg) => { const a = ang(s); return [Math.sin(a)*sg, Math.cos(a)*sg]; };
  const ta = tang(st.a, 1), tb = tang(st.b, mismo ? 1 : -1);
  // Rótulos: el de A hacia adentro del anillo y el de B hacia afuera, para que no se encimen cuando van juntos
  const na = [-Math.cos(ang(st.a)), Math.sin(ang(st.a))], nb = [Math.cos(ang(st.b)), -Math.sin(ang(st.b))];
  vector(ctx, c, { x:pa[0], y:pa[1], dx:ta[0]*P.v1*kv, dy:ta[1]*P.v1*kv, col:c.v, txt:`v₁ = ${N1(P.v1)} m/s`, ox:na[0]*12, oy:na[1]*12 }, W, H);
  vector(ctx, c, { x:pb[0], y:pb[1], dx:tb[0]*P.v2*kv, dy:tb[1]*P.v2*kv, col:c.v, txt:`v₂ = ${N1(P.v2)} m/s`, ox:nb[0]*12, oy:nb[1]*12 }, W, H);
  ctx.save(); ctx.lineWidth = 2; ctx.strokeStyle = c.ink;
  ctx.beginPath(); ctx.arc(pa[0], pa[1], 8, 0, Math.PI*2); ctx.fillStyle = c.ink; ctx.fill();
  ctx.beginPath(); ctx.arc(pb[0], pb[1], 8, 0, Math.PI*2); ctx.fillStyle = c.card; ctx.fill(); ctx.stroke(); ctx.restore();
  const la = at(st.a, R - 34), lb = at(st.b, R + 34);
  rotulo(ctx, c, la[0], la[1], 'Ana', c.ink, 'center', 800, W); rotulo(ctx, c, lb[0], lb[1] + (lb[1] > cy ? 4 : -4), 'Beto', c.ink, 'center', 800, W);
  // Reloj
  ctx.save(); ctx.font = `800 ${c.chico ? 17 : 20}px ${c.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = c.t;
  ctx.fillText(`t = ${fmt(P.t || 0, 0)} s`, cx, cy - (ver.fin ? 12 : 0)); ctx.restore();
  if (ver.fin && !e.nunca) rotulo(ctx, c, cx, cy + 14, `${mismo ? (P.v1 >= P.v2 ? '¡Ana alcanza a Beto!' : '¡Beto alcanza a Ana!') : '¡se cruzan!'} a ${N1(e.lugar)} m`, c.ink, 'center', 800, W);
}

const NOMBRES = { vx:'vx · velocidad horizontal (y su sombra)', vy:'vy · velocidad vertical (y su sombra)', v:'v · velocidad', a:'a · aceleración de la gravedad, g', t:'t · tiempo (líneas de igual instante)', w:'ω · velocidad angular' };
const NOMBRES_RUEDAS = { v:'v · velocidad (del borde o de cada corredor)', a:'ac · aceleración centrípeta', at:'at · aceleración tangencial', w:'ω · velocidad angular', t:'t · tiempo' };
function leyenda(el, claves, nombres){ const n = nombres || NOMBRES; el.innerHTML = (claves || []).map(k => `<span><i style="background:var(--c-${k})"></i>${n[k]}</span>`).join(''); }
function animarValor(dur, paso, listo){
  if (RM){ paso(1); listo && listo(); return () => {}; }
  let id, ini = performance.now();
  const tick = now => { const f = Math.min(1, (now - ini)/dur); paso(f); if (f < 1) id = requestAnimationFrame(tick); else listo && listo(); };
  id = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(id);
}
const opcionesHTML = (opts, idfb) => `<div class="opts">${opts.map(([k, t]) => `<button class="opt" type="button" data-k="${k}"><span class="l">${k.toUpperCase()}</span><span>${t}</span></button>`).join('')}</div><p class="fb" id="${idfb}" tabindex="-1"></p>`;
const fuente = t => `<p class="fuente">${t}</p>`;

     ${fuente('En una pregunta parecida, con fuerzas y una moneda lanzada hacia arriba, solo el 5 % de 240 universitarios de Oregon respondió bien en las tres posiciones (al subir, arriba y al bajar) después de un curso tradicional. Con demostraciones en las que primero predecían, más del 90 % (Thornton y Sokoloff, 1998). Que la aceleración apunte hacia donde se mueve está reportado sin porcentaje (Trowbridge y McDermott, 1981).')}`,
   desc:() => S.pred[P3.id] ? 'La aceleración es de 10 metros por segundo al cuadrado hacia abajo en todo el vuelo. Altura máxima 45 metros; tiempo de vuelo 6 segundos.' : 'El proyectil en lo más alto, a los 3 segundos, con su velocidad horizontal de 40 metros por segundo.' },
