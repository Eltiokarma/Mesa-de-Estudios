<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiro parabólico y movimiento circular</title>
<style>
/* Cáscara acogedora (crema, tarjetas cálidas, esquinas redondas; docs/diseno.md).
   Dentro del dibujo y de las ecuaciones solo mandan los colores de las variables (regla 4):
   vx azul (y la sombra en el eje horizontal), vy rojo (y la sombra en el eje vertical), v morado,
   a aceleración verde (g en el tiro, ac en el círculo), t tiempo naranja, ω velocidad angular turquesa.
   Posiciones, alturas, radios y ángulos van en tinta. El morado de marca no se usa aquí. */
[hidden]{display:none!important}
:root{
  --bg:#fbf3ec; --card:#fffaf6; --paper:#fdf7f1; --ink:#2d2340; --muted:#716579; --line:#efe3dc; --grid:#f3e8e0;
  --detras:#f6ece4; --acento:#ffd3e2; --acento-ink:#5c1f3d; --ok:#1d7f58; --warn:#c8363b;
  --shadow:0 1px 2px rgba(92,52,110,.05),0 10px 28px rgba(92,52,110,.09);
  --c-vx:#1f5fbf; --c-vy:#c0364a; --c-v:#8a2aa8; --c-a:#4f7a17; --c-t:#a05200; --c-w:#0f766e;
  --suelo:#d9c8bb; --bloque:#f3e3d3;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --detras:#211a2a; --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-vx:#7cb0ff; --c-vy:#f17384; --c-v:#ec62e6; --c-a:#a3d65e; --c-t:#f0a04a; --c-w:#5ed9c8;
  --suelo:#4a3d55; --bloque:#5a4868; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --detras:#211a2a; --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-vx:#7cb0ff; --c-vy:#f17384; --c-v:#ec62e6; --c-a:#a3d65e; --c-t:#f0a04a; --c-w:#5ed9c8;
  --suelo:#4a3d55; --bloque:#5a4868; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--font); -webkit-text-size-adjust:100%}
.wrap{max-width:1240px; margin:0 auto; padding-block:18px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid; gap:16px}
.top{display:grid; gap:12px}
.eyebrow{margin:0; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700}
h1{margin:2px 0 0; font-size:clamp(1.65rem, 4.4vw, 2.1rem); line-height:1.1; letter-spacing:-.01em}
.sub{margin:4px 0 0; color:var(--muted); font-size:.95rem; max-width:60ch}

.tabs{display:flex; gap:4px; padding:5px; border-radius:999px; background:var(--card); box-shadow:var(--shadow); justify-self:start; max-width:100%}
.tabs a{padding:9px 16px; border-radius:999px; color:var(--muted); text-decoration:none; font-weight:700; white-space:nowrap; font-size:.95rem}
.tabs a[aria-current="page"]{background:var(--ink); color:var(--card)}
.tabs a:hover:not([aria-current]){color:var(--ink)}

.mode{display:grid; gap:16px; min-width:0; align-items:start}
.bench{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:10px; display:grid; gap:8px; min-width:0}
.lienzo{border-radius:16px; overflow:hidden; background:var(--paper); border:1px solid var(--line)}
canvas{display:block; width:100%; touch-action:pan-y; -webkit-user-select:none; user-select:none}
canvas.arrastrable{cursor:grab}
canvas.agarrando{cursor:grabbing}
canvas.sin-scroll{touch-action:none}
canvas:focus-visible{outline:3px solid var(--ink); outline-offset:-3px}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; padding:2px 8px 4px; font-size:.82rem; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:4px; border-radius:2px; display:inline-block}

.guide{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:20px; display:grid; gap:14px; min-width:0}
.dots{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.dots button{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); color:var(--muted);
  font:700 .82rem var(--font); cursor:pointer; font-variant-numeric:tabular-nums}
.dots button.done{border-color:var(--ink); color:var(--ink)}
.dots button.on{background:var(--ink); border-color:var(--ink); color:var(--card)}
.dots button:disabled{opacity:.45; cursor:not-allowed}
.step-k{display:inline-block; margin:0; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; font-weight:800;
  color:var(--acento-ink); background:var(--acento); border-radius:999px; padding:3px 10px}
.step-t{margin:8px 0 0; font-size:1.35rem; line-height:1.2; text-wrap:balance}
.body{display:grid; gap:12px; min-width:0}
.body p{margin:0; max-width:66ch}
.problem{border-left:4px solid var(--acento); padding:6px 0 6px 14px; font-size:1.06rem; max-width:66ch}
.map{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.map li{display:flex; gap:10px; align-items:baseline}
.map b{font-family:var(--mono); min-width:4.6em; flex:none}

.v{font-weight:800; border-radius:6px; padding:0 3px; cursor:pointer; text-decoration:underline dotted 1.5px; text-underline-offset:3px}
.v-vx{color:var(--c-vx); background:color-mix(in srgb, var(--c-vx) 12%, transparent)}
.v-vy{color:var(--c-vy); background:color-mix(in srgb, var(--c-vy) 12%, transparent)}
.v-v{color:var(--c-v); background:color-mix(in srgb, var(--c-v) 12%, transparent)}
.v-a{color:var(--c-a); background:color-mix(in srgb, var(--c-a) 12%, transparent)}
.v-t{color:var(--c-t); background:color-mix(in srgb, var(--c-t) 12%, transparent)}
.v-w{color:var(--c-w); background:color-mix(in srgb, var(--c-w) 12%, transparent)}
.v-m{color:var(--ink); background:color-mix(in srgb, var(--ink) 9%, transparent)}
.v.hl{background:color-mix(in srgb, currentColor 26%, transparent)}

.eqs{display:grid; grid-template-columns:minmax(0,1fr); gap:10px; padding:14px; border-radius:16px; background:var(--paper); border:1px solid var(--line); overflow-x:auto}
.eq{display:flex; flex-wrap:wrap; align-items:center; gap:.42em; font-family:var(--mono); font-size:1.05rem; white-space:nowrap; font-variant-numeric:tabular-nums}
.eq .note{font-family:var(--font); font-size:.84rem; color:var(--muted); margin-left:.5em; white-space:normal}
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.15}
.frac > span:first-child{border-bottom:1.5px solid currentColor; padding:0 .25em}
.frac > span:last-child{padding:0 .25em}
.answer{font-weight:700; padding:12px 16px; border-radius:16px; background:var(--paper); border:2px solid var(--ink); max-width:66ch}
.aviso{background:var(--acento); color:var(--acento-ink); border-radius:16px; padding:10px 14px; font-size:.93rem}

.opts{display:grid; grid-template-columns:1fr; gap:8px}
@media (min-width:560px){ .opts{grid-template-columns:repeat(2, minmax(0,1fr))} }
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; padding:12px 14px; border-radius:16px; border:2px solid var(--line);
  background:var(--paper); color:var(--ink); font:inherit; cursor:pointer; min-height:48px}
.opt .l{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:.85rem;
  background:var(--card); border:1.5px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 10%, var(--paper))}
.opt.correct .l{background:var(--ok); border-color:var(--ok); color:var(--card)}
.opt.wrong{border-color:var(--warn); background:color-mix(in srgb, var(--warn) 9%, var(--paper))}
.opt.wrong .l{background:var(--warn); border-color:var(--warn); color:var(--card)}
.fb{font-weight:700; margin:0}
.fb.ok{color:var(--ok)} .fb.mal{color:var(--warn)}

.ctrls{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap:12px; align-items:end}
.slider{display:grid; gap:4px}
.slider label{font-weight:700; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.slider output{font-family:var(--mono); color:var(--muted)}
input[type=range]{width:100%; accent-color:var(--ink); min-height:28px}
input.r-v{accent-color:var(--c-v)} input.r-a{accent-color:var(--c-a)} input.r-t{accent-color:var(--c-t)} input.r-w{accent-color:var(--c-w)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:.86rem; padding:4px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); font-weight:700}
.chip.ok{border-color:var(--ok); color:var(--ok)}
.chip.virt{border-style:dashed}
.seg{display:inline-flex; flex-wrap:wrap; gap:4px; padding:4px; border-radius:999px; background:var(--paper); border:1px solid var(--line); justify-self:start; max-width:100%}
.seg button{font:700 .9rem var(--font); padding:8px 14px; border-radius:999px; border:0; background:transparent; color:var(--muted); cursor:pointer; min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--card)}
.exps{border-radius:20px}
.seg button:disabled{opacity:.45; cursor:not-allowed}

.nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.btn{font:700 .95rem var(--font); padding:11px 20px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; min-height:44px}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--card)}
.btn:disabled{opacity:.45; cursor:not-allowed}
button:focus-visible, .v:focus-visible, input:focus-visible, a:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.hint{font-size:.88rem; color:var(--muted)}
.fuente{font-size:.86rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px}
.pie{margin:4px 0 0; text-align:center; color:var(--muted); font-size:.95rem}
.pie a{color:var(--ink); font-weight:700}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.volver-app{display:inline-block; margin:12px 16px 0; background:var(--card); color:var(--ink); box-shadow:var(--shadow);
  font:700 14px var(--font); padding:8px 16px; border-radius:999px; text-decoration:none}

.barra{display:grid; gap:6px}
.fila{display:grid; grid-template-columns:7.2em 1fr; gap:8px; align-items:center; font-size:.86rem; font-weight:700}
.tiras{display:flex; height:28px; border-radius:8px; overflow:hidden; background:var(--grid)}
.tira{display:flex; align-items:center; justify-content:center; color:var(--card); font:700 .78rem var(--mono); white-space:nowrap; overflow:hidden; min-width:2px; border-right:2px solid var(--card)}
.tira:last-child{border-right:0}

.check{display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:.92rem; cursor:pointer; min-height:44px}
.check input{width:20px; height:20px; accent-color:var(--ink)}

/* Pantalla grande (laboratorio de cómputo, 1366 × 768): dibujo a la izquierda, fijo; guía a la derecha. */
@media (min-width:900px){
  .top{grid-template-columns:1fr auto; align-items:end}
  .mode{grid-template-columns:minmax(0, 1.4fr) minmax(360px, 1fr)}
  .bench{position:sticky; top:12px}
}
</style>
</head>
<body>

<main class="wrap">
  <div class="top">
    <header>
      <p class="eyebrow">Física · Cinemática · Problemas tipo admisión</p>
      <h1>Tiro parabólico y movimiento circular</h1>
      <p class="sub">Un tiro son dos movimientos a la vez: uno horizontal y otro vertical. Mira sus sombras sobre los ejes.</p>
    </header>
    <nav class="tabs" aria-label="Modo de la escena">
      <a href="#paso-a-paso" id="tab1">Paso a paso</a>
      <a href="#que-pasa-si" id="tab2">¿Qué pasa si…?</a>
    </nav>
  </div>

  <!-- ===== MODO 1: paso a paso ===== -->
  <div id="m1" class="mode">
    <section class="bench" aria-label="Campo de tiro con el proyectil, su trayectoria y sus sombras sobre los ejes">
      <div class="lienzo"><canvas id="cv" tabindex="-1" role="img" aria-label="Campo de tiro con un cañón, el proyectil y sus sombras sobre los ejes"></canvas></div>
      <p class="sr" id="desc1" aria-live="polite"></p>
      <div class="legend" id="ley1"></div>
    </section>
    <section class="guide">
      <ol class="dots" id="dots"></ol>
      <div aria-live="polite">
        <p class="step-k" id="stepK"></p>
        <h2 class="step-t" id="stepT" tabindex="-1"></h2>
      </div>
      <div id="stepBody" class="body"></div>
      <div class="nav">
        <button id="prev" type="button" class="btn">Anterior</button>
        <button id="next" type="button" class="btn primary">Siguiente</button>
      </div>
    </section>
  </div>

  <!-- ===== MODO 2: ¿qué pasa si…? ===== -->
  <div id="m2" class="mode" hidden>
    <section class="bench" aria-label="Experimento elegido">
      <div class="lienzo"><canvas id="cv2" tabindex="-1" role="img" aria-label="Dibujo del experimento elegido"></canvas></div>
      <p class="sr" id="desc2" aria-live="polite"></p>
      <div class="legend" id="ley2"></div>
    </section>
    <section class="guide">
      <div class="seg exps" id="exps" role="group" aria-label="Experimentos (se abren en orden: responde uno para pasar al siguiente)"></div>
      <div aria-live="polite">
        <p class="step-k" id="k2"></p>
        <h2 class="step-t" id="t2" tabindex="-1"></h2>
      </div>
      <div id="body2" class="body"></div>
    </section>
  </div>

  <p class="pie">¿Quieres practicar sin la escena? <a href="/app/#/papel/tiro-parabolico">Problemas para lápiz y papel</a></p>
</main>

<script>
// Si la escena se abrió desde la app, mostrar un botón para volver (en iPhone, la app instalada no tiene "atrás").
if (new URLSearchParams(location.search).get('desde') === 'app') addEventListener('DOMContentLoaded', () => {
  const a = document.createElement('a'); a.href = '/app/#/cursos'; a.textContent = '‹ App'; a.className = 'volver-app';
  a.setAttribute('aria-label', 'Volver a la app');
  document.body.prepend(a);
});
</script>
<script src="motor.js"></script>
<script src="../../nucleo/medicion.js"></script>
<script src="../../nucleo/celular.js"></script>
<script>
// Registro anónimo de predicciones (nucleo/medicion.js). Solo guarda si el alumno entró por la app.
const PLANTILLA = { id: 'tiro-parabolico', unidad: 'fisica.movimiento-parabolico-y-circular', version: '0.1.0' };
function registrarPrediccion(problema, opcion, correcta, error, respaldo, t0){
  if (!window.Medicion) return;
  Medicion.guardar({ tipo: 'prediccion', modulo: PLANTILLA.id, unidad: PLANTILLA.unidad, problema, opcion, correcta,
    error: correcta ? '' : error, respaldo: correcta ? '' : respaldo, ms: t0 ? Date.now() - t0 : '' }, PLANTILLA.version);
}

/* ================= Piezas de dibujo compartidas =================
   Toda la física sale de MotorTiro (motor.js); aquí solo se pinta. */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = Celular.variable; // guardada hasta que cambie el tema o el tamaño (nucleo/celular.js)
function fmt(n, d){
  if (!Number.isFinite(n)) return '—';
  const p = Math.pow(10, d === undefined ? 1 : d), r = Math.round(n*p)/p + 0;
  let [e, f] = String(Math.abs(r)).split('.');
  if (e.length >= 5) e = e.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (r < 0 ? '−' : '') + e + (f ? ',' + f : '');
}
const N1 = n => fmt(n, Math.abs(n - Math.round(n)) < 1e-9 ? 0 : 1);
const V = (k, t) => `<span class="v v-${k}" data-var="${k}" tabindex="0">${t}</span>`;
const fr = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const M = MotorTiro;
const chico = () => innerWidth < 900;
// Escribe en una región aria-live solo si el texto cambia (si no, el lector de pantalla repite en cada cuadro).
function decir(el, t){ if (el.textContent !== t) el.textContent = t; }
function esperar(ms, fn){ return ms ? setTimeout(fn, ms) : fn(); }
function crearLienzo(cv, alto, dibujar){
  const ctx = cv.getContext('2d');
  const L = { cv, ctx, W:0, H:0 };
  L.resize = () => {
    const W = cv.clientWidth; if (!W) return;
    const H = Math.round(alto(W)), dpr = Celular.dpr();
    L.W = W; L.H = H; cv.style.height = H + 'px'; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    dibujar();
  };
  new ResizeObserver(L.resize).observe(cv);
  return L;
}
const altoLienzo = W => W >= 560 ? clamp(W*0.62, 330, 460) : clamp(W*0.95, 320, 400);
function alRedibujarTema(fn){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', fn);
  new MutationObserver(fn).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
function linea(ctx, x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function rotulo(ctx, c, x, y, t, color, align, peso, W){
  ctx.font = `${peso || 700} ${c.chico ? 11 : 12}px ${c.font}`; ctx.textBaseline = 'middle';
  const w = ctx.measureText(t).width;
  let x0 = align === 'left' ? x : align === 'right' ? x - w : x - w/2;
  if (W) x0 = clamp(x0, 4, W - w - 4);
  ctx.save(); ctx.fillStyle = c.paper; ctx.globalAlpha = .9; ctx.fillRect(x0 - 3, y - 9, w + 6, 18); ctx.restore();
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.fillText(t, x0, y);
}
function colores(W){
  const g = n => css(n);
  return { ink:g('--ink'), muted:g('--muted'), grid:g('--grid'), paper:g('--paper'), card:g('--card'), line:g('--line'),
    vx:g('--c-vx'), vy:g('--c-vy'), v:g('--c-v'), a:g('--c-a'), t:g('--c-t'), w:g('--c-w'),
    suelo:g('--suelo'), bloque:g('--bloque'), mono:g('--mono'), font:g('--font'), chico: W < 480 };
}
function flecha(ctx, x1, y1, x2, y2, color, w, dash){
  const ang = Math.atan2(y2 - y1, x2 - x1), l = Math.hypot(x2 - x1, y2 - y1); if (l < 2) return;
  const p = Math.min(9 + w, l*0.6);
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  linea(ctx, x1, y1, x2 - Math.cos(ang)*p*0.7, y2 - Math.sin(ang)*p*0.7);
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - Math.cos(ang - .45)*p, y2 - Math.sin(ang - .45)*p); ctx.lineTo(x2 - Math.cos(ang + .45)*p, y2 - Math.sin(ang + .45)*p);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
/* Un vector dibujado: { x, y, dx, dy (en pantalla, sin normalizar: largo en px), col, txt, al, ox, oy, fino, hl } */
function vector(ctx, c, f, W, H){
  const l = Math.hypot(f.dx, f.dy); if (l < 1.5) return;
  flecha(ctx, f.x, f.y, f.x + f.dx, f.y + f.dy, f.col, f.fino ? 1.8 : (f.hl ? 4.4 : 3), f.fino ? [5, 4] : null);
  if (!f.txt) return;
  const ux = f.dx/l, uy = f.dy/l;
  const al = f.al || (ux > 0.35 ? 'left' : ux < -0.35 ? 'right' : 'center');
  rotulo(ctx, c, f.x + f.dx + ux*9 + (f.ox || 0), clamp(f.y + f.dy + uy*12 + (f.oy || 0), 12, (H || 999) - 12), f.txt, f.col, al, f.fino ? 700 : 800, W);
}
function pasoBonito(rango, n){
  const crudo = rango/n, p = Math.pow(10, Math.floor(Math.log10(crudo))), r = crudo/p;
  return (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10)*p;
}

// Alto del lienzo para un campo de tiro: con la misma escala en los dos ejes, el alto que pide la escena
// (sin pasarse del alto normal ni bajar de 230 px), para que una trayectoria baja no deje el lienzo vacío.
function altoCampo(W, P){
  const s = (W - 58)/(P.Xmax - (P.xmin || 0));

/* ---------- Campo de tiro ----------
   P = { tiros:[{ o, nombre, trazos }], t, xmin, Xmax, Ymax, ver:{ tray:'toda'|'hasta'|null, estrobo, sombras, vx, vy, v, a, comp0,
         cima, alcance, alturas, avion, gTodos }, canon, plataforma, crece, hl }
   Escala: la misma en los dos ejes, para que la trayectoria, el ángulo del cañón y las flechas de velocidad coincidan. */
function marco(W, H, P){
  const ml = 42, mr = 16, mt = 16, mb = 48, xmin = P.xmin || 0;

function vistaTiro(L, c, P){
  const { ctx, W, H } = L; ctx.clearRect(0, 0, W, H);
  const m = marco(W, H, P), { X, Y } = m, ver = P.ver || {};
  const ps = P.tiros.map(q => Object.assign({}, q, { p: M.proyectil(q.o) }));

  ctx.strokeStyle = c.grid; ctx.lineWidth = 1; ctx.font = `600 10px ${c.mono}`; ctx.fillStyle = c.muted;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';

  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let y = py; y <= P.Ymax + 1e-9; y += py) linea(ctx, X(0), Y(y), W - 16, Y(y));
  ctx.restore();

  ctx.font = `700 10px ${c.font}`; ctx.fillStyle = c.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('x (m)', W - 18, Y(0) - 3); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('y (m)', X(0) + 5, m.mt - 2);

    ctx.save(); ctx.translate(bx, by); ctx.rotate(-th); ctx.fillStyle = c.ink; rr(ctx, -4, -6, 30, 12, 4); ctx.fill(); ctx.restore();

    if (P.asa){ ctx.save(); ctx.beginPath(); ctx.arc(bx + Math.cos(th)*40, by - Math.sin(th)*40, P.sobreAsa ? 11 : 9, 0, Math.PI*2); ctx.fillStyle = c.card; ctx.fill(); ctx.strokeStyle = c.ink; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); }
    if (ps[0].p.angulo > 0.5){
      ctx.strokeStyle = c.ink; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(bx, by, 52, -th, 0); ctx.stroke();
      rotulo(ctx, c, bx + 58, by - 10, `${fmt(ps[0].p.angulo, 0)}°`, c.ink, 'left', 800, W);

    ctx.beginPath(); ctx.moveTo(ax - 26, ay); ctx.lineTo(ax + 18, ay - 4); ctx.lineTo(ax + 26, ay); ctx.lineTo(ax + 18, ay + 4); ctx.closePath(); ctx.fill(); ctx.stroke();

  const lista = [];

    lista.push({ x:x0, y:y0p, dx:0, dy:-q.p.vy*kv, col:c.vy, txt:`v₀y = ${N1(q.p.vy)} m/s`, al:'right', ox:-4, hl:P.hl === 'vy' });
    lista.push({ x:x0, y:y0p, dx:q.p.vx*kv, dy:-q.p.vy*kv, col:c.v, txt:`v₀ = ${N1(q.p.v0)} m/s`, oy:-10, hl:P.hl === 'v' });

/* ---------- Movimiento circular, visto desde arriba ----------
   P = { r, omega, theta (grados), suelto:{ theta0, t } | null, ver:{ v, a, w, todos }, auto, crece } */
function vistaCirculo(L, c, P){
  const { ctx, W, H } = L; ctx.clearRect(0, 0, W, H);
  const cx = W/2, cy = H/2, R = Math.min(W, H)*0.3, k = R/P.r, ver = P.ver || {}, cr = P.crece === undefined ? 1 : P.crece;
  ctx.save(); ctx.strokeStyle = c.muted; ctx.setLineDash([3, 5]); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke(); ctx.restore();

  const scr = (x, y) => ({ x: cx + x*k, y: cy - y*k });
  const v = Math.abs(P.omega)*P.r, kv = R*0.55/Math.max(v, 1e-9);
  const lista = [];
  const punto = th => { const a = th*Math.PI/180; return { x: P.r*Math.cos(a), y: P.r*Math.sin(a) }; };
  // Velocidad tangente (v) y aceleración al centro (a) en un punto del círculo
  const flechasEn = (th, fino, txt) => {
    const a = th*Math.PI/180, p = scr(...Object.values(punto(th))), sg = Math.sign(P.omega) || 1;
    if (ver.v) lista.push({ x:p.x, y:p.y, dx:-Math.sin(a)*sg*v*kv*(ver.v === 'nueva' ? cr : 1), dy:-Math.cos(a)*sg*v*kv*(ver.v === 'nueva' ? cr : 1), col:c.v, txt: txt ? `v = ${N1(v)} m/s` : '', fino });
    if (ver.a) lista.push({ x:p.x, y:p.y, dx:-Math.cos(a)*R*0.45*(ver.a === 'nueva' ? cr : 1), dy:Math.sin(a)*R*0.45*(ver.a === 'nueva' ? cr : 1), col:c.a, txt: txt ? `ac = ${N1(P.omega*P.omega*P.r)} m/s²` : '', fino });
  };
  if (ver.todos) for (let th = 0; th < 360; th += 45) if (Math.abs(((th - P.theta) % 360 + 360) % 360) > 10) flechasEn(th, true, false);
  if (P.suelto){
    const s = M.soltarDelCirculo({ r:P.r, omega:P.omega, theta:P.suelto.theta0, t:P.suelto.t }), p0 = scr(s.suelta.x, s.suelta.y), p = scr(s.x, s.y);
    ctx.save(); ctx.strokeStyle = c.muted; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); linea(ctx, p0.x, p0.y, p.x, p.y); ctx.restore();

    if (ver.v) lista.push({ x:p.x, y:p.y, dx:s.vx*kv, dy:-s.vy*kv, col:c.v, txt:`v = ${N1(v)} m/s` });
    // la mano y el trozo de cuerda que quedó
    ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.4; const q0 = scr(s.suelta.x*0.55, s.suelta.y*0.55); linea(ctx, cx, cy, q0.x, q0.y); ctx.restore();
  } else {
    const pt = punto(P.theta), p = scr(pt.x, pt.y);
    if (P.auto){ ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(-P.theta*Math.PI/180); ctx.fillStyle = c.bloque; ctx.strokeStyle = c.ink; ctx.lineWidth = 1.6; rr(ctx, -9, -15, 18, 30, 5); ctx.fill(); ctx.stroke(); ctx.restore(); }
    else {
      ctx.save(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.4; linea(ctx, cx, cy, p.x, p.y); ctx.restore();
      ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fillStyle = c.bloque; ctx.fill(); ctx.strokeStyle = c.ink; ctx.lineWidth = 1.8; ctx.stroke();
    }
    flechasEn(P.theta, false, true);
  }
  if (ver.w){
    const sg = Math.sign(P.omega) || 1, a0 = -0.3, a1 = a0 - sg*1.4;
    ctx.save(); ctx.strokeStyle = c.w; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(cx, cy, 26, a0, a1, sg > 0); ctx.stroke();

}

const NOMBRES = { vx:'vx · velocidad horizontal (y su sombra)', vy:'vy · velocidad vertical (y su sombra)', v:'v · velocidad', a:'a · aceleración (g en el tiro; ac en el círculo)', t:'t · tiempo (líneas de igual instante)', w:'ω · velocidad angular' };

function animarValor(dur, paso, listo){

const datos = () => ({ v0:S.v0, angulo:S.ang, y0:S.y0 });

function draw(){
  if (!L.W) return;
  const s = steps[S.step], c = colores(L.W), P = s.cfg();

function resumen(){

}
function vuela(desde, hasta, listo){
  parar(); S.t = desde;

const dots = $('dots');
steps.forEach((s, n) => {

function go(n){

  S.t = s.anima && s.gate && S.pred[s.gate.id] ? s.anima.hasta : 0;
  $('stepK').textContent = `${s.k} de ${steps.length}`;
  $('stepT').textContent = s.t;
  $('stepBody').innerHTML = s.body();

  const respondido = s.gate && S.pred[s.gate.id];
  leyenda($('ley1'), s.gate && !respondido && s.leyAntes ? s.leyAntes : respondido && s.leyDespues ? s.leyDespues : (s.ley || []));
  pintarDots();
  if (s.gate) prediccion(s);
  if (s.anima && s.anima.siempre){ vuela(0, 6); $('otra').onclick = () => vuela(0, 6); }

  nav(); draw();
}
function nav(){
  const s = steps[S.step];

  const falta = s.gate && !S.pred[s.gate.id];
  $('next').disabled = S.step === steps.length - 1 || falta || S.ocupado;
  $('next').textContent = falta ? 'Elige una opción' : 'Siguiente';
}
function pintarDots(){
  [...dots.querySelectorAll('button')].forEach((b, k) => {
    b.className = k === S.step ? 'on' : (k <= S.max ? 'done' : ''); b.disabled = k > S.max;
    if (k > S.max) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
    b.setAttribute('aria-label', k > S.max ? `Paso ${k + 1}, bloqueado` : `Ir al ${steps[k].k.toLowerCase()}: ${steps[k].t}`);
    if (k === S.step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
}
function desbloquear(n){ if (n > S.max) S.max = n; }
function prediccion(s){
  const P = s.gate, btns = [...$('stepBody').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[P.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === P.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb'); fb.textContent = P.fb[p]; fb.className = 'fb ' + (p === P.ok ? 'ok' : 'mal');
    $('res').innerHTML = s.exp();
  };
  const t0 = Date.now();
  btns.forEach(b => b.addEventListener('click', () => {
    if (S.pred[P.id] || S.ocupado) return;
    const o = P.opts.find(q => q[0] === b.dataset.k);
    S.pred[P.id] = o[0]; desbloquear(S.step + 1);
    registrarPrediccion(P.id, o[0], o[0] === P.ok, o[2] || '', o[3] || '', t0);
    S.ocupado = true; pintar(); pintarDots(); nav();
    leyenda($('ley1'), s.leyDespues || s.ley || []);
    $('fb').focus({ preventScroll:true });
    const paso = S.step, ch = chico(), an = s.anima;
    S.t = an.desde || 0; S.crece = an.crece ? 0 : 1; draw();

    if (ch) cv.scrollIntoView({ block:'start', behavior: RM ? 'auto' : 'smooth' });

      if (S.step !== paso){ S.ocupado = false; nav(); return; }
      const fin = () => { S.ocupado = false; nav(); draw(); if (!RM) $('next').focus({ preventScroll:true }); };
      if (an.crece) parar = animarValor(500, f => { S.crece = f; draw(); }, () => vuela(an.desde || 0, an.hasta, fin));
      else vuela(an.desde || 0, an.hasta, fin);
    });
  }));

}

// ----- explorador -----
function explorar(){
  [['e-v0', 'v0'], ['e-ang', 'ang'], ['e-y0', 'y0']].forEach(([id, k]) => $(id).addEventListener('input', () => {
    parar(); S[k] = +$(id).value;
    if (S.y0 === 0 && S.ang < 1) S.ang = 1; // desde el suelo, a 0° no hay tiro

  S.t = M.proyectil(datos()).tVuelo; vivo();
}
function disparar(){

  vuela(0, p.tVuelo);
}
function vivo(){

  const p = M.proyectil(datos());
  $('live').innerHTML = `<div class="eqs">
      <div class="eq">${V('vx','vx')} = ${fmt(p.vx, 1)} m/s · ${V('vy','v₀y')} = ${fmt(p.vy, 1)} m/s</div>
      <div class="eq">subida ${fmt(p.tSubida, 2)} s · altura máxima ${fmt(p.H, 1)} m</div>
      <div class="eq">${V('t','en el aire')} ${fmt(p.tVuelo, 2)} s · alcance ${fmt(p.alcance, 1)} m</div>
    </div>`;

  $('live').querySelectorAll('.v').forEach(e => e.removeAttribute('tabindex'));
  draw();
}
const local = e => { const r = cv.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };
function asa(){ const m = marco(L.W, L.H, steps[S.step].cfg()), th = S.ang*Math.PI/180; return { x:m.X(0) + Math.cos(th)*40, y:m.Y(S.y0) - Math.sin(th)*40, bx:m.X(0), by:m.Y(S.y0) }; }
function cercaAsa(p, rad){ const a = asa(); return Math.hypot(p.x - a.x, p.y - a.y) < rad; }
function ponerAngulo(p){
  const a = asa(), ang = Math.round(clamp(Math.atan2(a.by - p.y, p.x - a.bx)*180/Math.PI, S.y0 > 0 ? 0 : 1, 90));
  if (ang !== S.ang){ parar(); S.ang = ang; S.t = M.proyectil(datos()).tVuelo; vivo(); }
}
cv.addEventListener('touchstart', e => {
  if (!S.explora || e.touches.length !== 1) return;
  const r = cv.getBoundingClientRect(), t = e.touches[0];
  if (cercaAsa({ x:t.clientX - r.left, y:t.clientY - r.top }, 40)) e.preventDefault();
}, { passive:false });
cv.addEventListener('pointerdown', e => {
  if (!S.explora) return;
  const p = local(e); if (!cercaAsa(p, e.pointerType === 'mouse' ? 26 : 40)) return;
  S.arrastrando = true; cv.setPointerCapture(e.pointerId); e.preventDefault(); cv.focus({ preventScroll:true }); draw();
}, { passive:false });
cv.addEventListener('pointermove', e => {
  const p = local(e);
  if (S.arrastrando){ ponerAngulo(p); return; }
  const s = S.explora && cercaAsa(p, 26);
  if (s !== S.sobreAsa){ S.sobreAsa = s; cv.style.cursor = s ? 'grab' : ''; draw(); }
});
const soltarAsa = () => { if (S.arrastrando){ S.arrastrando = false; draw(); } };
cv.addEventListener('pointerup', soltarAsa); cv.addEventListener('pointercancel', soltarAsa);
cv.addEventListener('keydown', e => {
  if (!S.explora) return;
  const d = { ArrowUp:1, ArrowRight:1, ArrowDown:-1, ArrowLeft:-1 }[e.key]; if (!d) return;
  e.preventDefault(); parar(); S.ang = clamp(S.ang + d, S.y0 > 0 ? 0 : 1, 90); S.t = M.proyectil(datos()).tVuelo; vivo();
});

$('next').addEventListener('click', () => { desbloquear(S.step + 1); go(S.step + 1); $('stepT').focus({ preventScroll:true }); });
$('prev').addEventListener('click', () => go(S.step - 1));
function marcar(k){
  S.hl = k;
  document.querySelectorAll('#m1 .v').forEach(e => e.classList.toggle('hl', !!k && e.dataset.var === k));
  draw();
}
document.addEventListener('pointerover', e => { const t = e.target.closest && e.target.closest('#m1 [data-var]'); if (t) marcar(t.dataset.var); });
document.addEventListener('pointerout', e => { const t = e.target.closest && e.target.closest('#m1 [data-var]'); if (t && !t.contains(e.relatedTarget)) marcar(null); });
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('#m1 [data-var]'); if (t) marcar(t.dataset.var); });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('#m1 [data-var]')) marcar(null); });
alRedibujarTema(draw);
addEventListener('modo', () => { if ($('m1').hidden){ parar(); S.ocupado = false; } else go(S.step); });
L.resize(); go(0);
})();

    ctrl:() => `<div class="chips" id="chips2"></div><p><button type="button" class="btn" id="repetir">Disparar otra vez</button></p>`,
    vivo:() => { $('chips2').innerHTML = '<span class="chip">las dos: 4 s en el aire</span><span class="chip">caen a 60 m y a 120 m</span>'; },
    exp:`<p>Las líneas naranjas a trazos unen las dos pelotas en el mismo instante: son horizontales. En vertical, las dos caen igual, sin velocidad vertical al salir: 80 = 5t², t = 4 s. La más rápida no cae más rápido ni más lento: solo llega más lejos, al doble de distancia.</p>
      ${fuente('Según Prescott y Mitchelmore (2005), con dos balas disparadas en horizontal a distinta velocidad, el 38 % de las alumnas entrevistadas dijo que la más rápida está más tiempo en el aire. Con pelotas, el 43 % dijo que la más rápida llega primero.')}` },
  { id:'cada-segundo', corto:'Segundo a segundo', ley:['vx','vy'], leyAntes:[],  tipo:'tiro',
    q:`Una pelota sale rodando del borde de una azotea de 80 m. En el primer segundo avanza 15 m en horizontal. ¿Cuánto avanza en horizontal durante el segundo siguiente?`,
    opts:[['a','Menos de 15 m: la velocidad horizontal se va gastando','P3-vx-se-gasta','documentado'],
          ['b','15 m',null],
          ['c','Más de 15 m, porque cae cada vez más rápido','confunde-vx-con-vy','hipotesis'],
          ['d','0 m: ya se le acabó el impulso y cae en picada','P3-cae-en-picada','documentado']],
    ok:'b',
    antes:() => Object.assign(E, { cfg:{ tiros:[{ o:{ vx:15, y0:80 } }], xmin:-12, Xmax:70, Ymax:90, plataforma:true, ver:{ tray:'hasta', estrobo:1 } }, t:1, T:4 }),
    despues:() => { E.cfg.ver = { tray:'hasta', estrobo:1, sombras:true, vx:true, vy:true }; correr(); },
    ctrl:() => `<div class="chips" id="chips2"></div><p><button type="button" class="btn" id="repetir">Otra vez</button></p>`,
    vivo:() => { $('chips2').innerHTML = '<span class="chip">en horizontal: 15, 15, 15 y 15 m</span><span class="chip">en vertical cae: 5, 15, 25 y 35 m</span>'; },
    exp:`<p>Mira las sombras. La ${V('vx','azul')}, en el suelo, avanza 15 m cada segundo: en horizontal no hay ninguna aceleración, así que ${V('vx','vx')} no cambia. La ${V('vy','roja')}, en el eje vertical, baja 5, 15, 25 y 35 m: en vertical sí hay aceleración.</p>
      <p>La pelota tampoco «cae en picada» al acabarse el impulso: desde que deja la azotea su camino es una parábola, sin tramo recto y sin esquina.</p>
      ${fuente('Según Prescott y Mitchelmore (2005), en una pregunta parecida (10 m en el primer segundo), el 60 % de las alumnas dijo que en el segundo siguiente avanza menos. Que un objeto siga recto un tramo y recién después caiga lo reportó McCloskey (1983) en más de un tercio de escolares y universitarios, según Prescott y Mitchelmore (2005).')}` },
  { id:'avioneta', corto:'El paquete', ley:['t'], leyAntes:[],  tipo:'tiro',
    q:`Una avioneta vuela en horizontal a 50 m/s constantes, a 180 m de altura, y suelta un paquete. Sin aire, mientras el paquete cae, ¿dónde está respecto a la avioneta?`,
    opts:[['a','Cae recto hacia abajo desde donde lo soltaron, y la avioneta se aleja','P4-cae-recto','documentado'],
          ['b','Se va quedando atrás de la avioneta','P4-queda-atras','documentado'],
          ['c','Siempre justo debajo de la avioneta',null],
          ['d','Adelante de la avioneta','adelanta-al-avion','hipotesis']],
    ok:'c',
    antes:() => Object.assign(E, { cfg:{ tiros:[{ o:{ vx:50, y0:180 } }], xmin:-15, Xmax:330, Ymax:200, ver:{ avion:true } }, t:0, T:6 }),
    despues:() => { E.cfg.ver = { avion:true, avionLinea:true, tray:'hasta', estrobo:1 }; correr(); },
    ctrl:() => `<div class="chips" id="chips2"></div><p><button type="button" class="btn" id="repetir">Soltar otra vez</button></p>`,
    vivo:() => { $('chips2').innerHTML = '<span class="chip">6 s de caída</span><span class="chip">cae a 300 m de donde lo soltaron</span><span class="chip">la avioneta también avanzó 300 m</span>'; },
    exp:`<p>Al soltarlo, el paquete ya va a 50 m/s en horizontal, igual que la avioneta, y nada lo frena en horizontal. Por eso avanza a la par de la avioneta mientras cae: la línea a trazos que los une queda siempre vertical. Cae en 6 s (180 = 5t²), a 300 m de donde lo soltaron.</p>
      <p>Visto desde la avioneta, el paquete cae en línea recta, siempre debajo de ella. Visto desde el suelo, hace una parábola. Las dos descripciones son correctas. Lo que no pasa es lo de la opción A: caer recto sobre el punto del suelo donde lo soltaron. Con aire, el paquete sí se quedaría un poco atrás.</p>
      ${fuente('Según Prescott y Mitchelmore (2005), en preguntas de este tipo (soltar algo desde un avión, una faja transportadora o alguien que camina) solo entre el 25 % y el 38 % acertó, según el caso, y entre el 30 % y el 53 % dijo que cae recto.')}` },
  { id:'complementarios', corto:'37° o 53°', ley:[], leyAntes:[],  tipo:'tiro',
    q:`Dos proyectiles salen del suelo con la misma rapidez, 50 m/s: uno a 37° y otro a 53°. ¿Cuál llega más lejos?`,
    opts:[['a','El de 53°: sube más, así que llega más lejos','mas-angulo-mas-lejos','hipotesis'],
          ['b','El de 37°: va más rápido en horizontal','menos-angulo-mas-lejos','hipotesis'],
          ['c','Llegan al mismo lugar',null],
          ['d','Depende de cuánto pese cada uno','C2-depende-de-la-masa','documentado']],
    ok:'c',
    antes:() => Object.assign(E, { ang:37, cfg:{ tiros:[{ o:{ v0:50, angulo:37 } }, { o:{ v0:50, angulo:53 }, trazos:true }], xmin:-8, Xmax:260, Ymax:90, canon:true, ver:{} }, t:0, T:8 }),
    despues:() => { E.cfg.ver = { tray:'hasta', estrobo:1 }; E.cfg.tiros[0].nombre = `${E.ang}°`; E.cfg.tiros[1].nombre = `${90 - E.ang}°`; correr(); },
    ctrl:() => `<div class="slider"><label for="q-ang"><span>Ángulo del primero (el otro es su complemento)</span><output id="q-ang-o"></output></label><input id="q-ang" type="range" min="10" max="45" step="1" value="${E.ang}"></div><div class="chips" id="chips2"></div>`,
    vivo:() => {
      const a = M.proyectil({ v0:50, angulo:E.ang }), b = M.proyectil({ v0:50, angulo:90 - E.ang });
      $('q-ang-o').textContent = `${E.ang}° y ${90 - E.ang}°`;
      $('chips2').innerHTML = `<span class="chip">alcances: ${N1(a.alcance)} m y ${N1(b.alcance)} m</span><span class="chip">alturas: ${N1(a.H)} m y ${N1(b.H)} m</span><span class="chip">tiempos: ${fmt(a.tVuelo, 1)} s y ${fmt(b.tVuelo, 1)} s</span>`;
    },
    alCambiar:() => { E.ang = +$('q-ang').value; E.cfg.tiros = [{ o:{ v0:50, angulo:E.ang }, nombre:`${E.ang}°` }, { o:{ v0:50, angulo:90 - E.ang }, nombre:`${90 - E.ang}°`, trazos:true }]; E.T = M.proyectil({ v0:50, angulo:90 - E.ang }).tVuelo; E.t = E.T; },
    exp:`<p>Con 37° y 53°, los dos caen a 240 m. El de 53° sube mucho más (80 m contra 45 m) y está más tiempo en el aire (8 s contra 6 s), pero avanza más lento en horizontal (30 m/s contra 40 m/s). Al pasar de 37° a 53° se intercambian vx y vy, y el alcance depende del producto de las dos.</p>
      <p>Mueve el ángulo: cualquier par que sume 90° llega al mismo lugar, si se lanza y cae a la misma altura. Con la misma rapidez, y si se lanza y cae a la misma altura, el alcance más grande es a 45°. Desde una azotea, el mejor ángulo es algo menor.</p>
      ${fuente('Las opciones incorrectas son errores que suponemos, sin estudio con porcentaje; la de la masa es la idea documentada de que el más pesado cae distinto.')}` },
  { id:'honda', corto:'Se rompe la cuerda', ley:['v','w'], leyAntes:['w'],  tipo:'circulo',
    q:`Haces girar una piedra atada a una cuerda en un círculo horizontal, sobre tu cabeza. Visto desde arriba, si la cuerda se rompe justo cuando la piedra está aquí, ¿qué camino sigue?`,
    opts:[['a','Sigue curvándose un rato y luego se endereza','D9-sigue-curvando','documentado'],
          ['b','En línea recta, tangente al círculo',null],
          ['c','En línea recta hacia afuera, alejándose del centro','sale-hacia-afuera','hipotesis'],
          ['d','En línea recta, en diagonal entre la tangente y la dirección hacia afuera','entre-tangente-y-radio','hipotesis']],
    ok:'b',
    antes:() => Object.assign(E, { circ:{ r:1.5, omega:3, theta:0, ver:{ w:true } }, t:0, T:0.3 }),
    despues:() => { E.circ.ver = { v:true, w:true }; E.circ.suelto = { theta0:0, t:0 }; correr(); },
    ctrl:() => `<p><button type="button" class="btn" id="repetir">Otra vez</button></p>`,
    vivo:() => {},
    exp:`<p>Mientras gira, la cuerda tira de la piedra hacia el centro y le cambia la dirección todo el tiempo. Cuando se rompe, ya nada la desvía: sigue en línea recta con la ${V('v','velocidad')} que tenía en ese instante, que es tangente al círculo.</p>
      <p>Por eso parece que «sale disparada hacia afuera»: se aleja del centro, pero en línea recta tangente, no en la dirección del radio. Y no conserva ninguna curva: un movimiento no «recuerda» su camino. Además va cayendo por su peso, pero visto desde arriba eso no se nota.</p>
      ${fuente('La idea de que un objeto que salió de un camino curvo sigue curvándose la documentaron McCloskey, Caramazza y Green (1980). Que salga en la dirección del radio es un error que suponemos, sin estudio con porcentaje.')}` },
  { id:'rotonda', corto:'La rotonda', ley:['v','a'], leyAntes:['v'],  tipo:'circulo',
    q:`Un auto da vueltas a una rotonda (óvalo) de 50 m de radio a 10 m/s constantes. ¿Tiene aceleración?`,
    opts:[['a','No: su rapidez no cambia','rapidez-constante-sin-aceleracion','hipotesis'],
          ['b','Sí, hacia el centro de la rotonda',null],
          ['c','Sí, hacia afuera de la rotonda','D9-hacia-afuera','hipotesis'],
          ['d','Sí, hacia adelante, en el sentido en que avanza','K3-a-en-direccion-del-movimiento','documentado']],
    ok:'b',
    antes:() => Object.assign(E, { r:50, v:10, circ:{ r:50, omega:0.2, theta:30, auto:true, ver:{ v:true }, pie:'rotonda de 50 m · vista desde arriba' }, t:0, T:6 }),
    despues:() => { E.circ.ver = { v:'nueva', a:'nueva', todos:true }; crecer(() => correr()); },
    ctrl:() => `<div class="slider"><label for="q-r"><span>Radio de la rotonda</span><output id="q-r-o"></output></label><input id="q-r" type="range" min="10" max="100" step="5" value="${E.r}"></div>
      <div class="slider"><label for="q-v"><span>Rapidez (${V('v','v')})</span><output id="q-v-o"></output></label><input id="q-v" class="r-v" type="range" min="2" max="15" step="1" value="${E.v}"></div><div class="chips" id="chips2"></div>`,
    vivo:() => {
      const m = M.mcu({ r:E.r, v:E.v }); $('q-r-o').textContent = `${E.r} m`; $('q-v-o').textContent = `${E.v} m/s`;
      $('chips2').innerHTML = `<span class="chip">ac = v²/r = ${fmt(m.ac, 2)} m/s², hacia el centro</span>${m.ac > 7 ? '<span class="chip">más de unos 7 m/s²: un auto real patina</span>' : ''}<span class="chip">una vuelta en ${fmt(m.periodo, 1)} s</span>`;
    },
    alCambiar:() => { E.r = +$('q-r').value; E.v = +$('q-v').value; const m = M.mcu({ r:E.r, v:E.v }); E.circ.r = E.r; E.circ.omega = m.omega; E.circ.pie = `rotonda de ${E.r} m · vista desde arriba`; },
    exp:`<p>La rapidez no cambia, pero la dirección de la ${V('v','velocidad')} sí: en cada punto apunta hacia otro lado. Cambiar la velocidad, aunque sea solo su dirección, es acelerar. Las flechas ${V('a','verdes')} muestran que esa aceleración apunta siempre al centro: ac = v²/r = 100/50 = 2 m/s².</p>
      <p>Lo que la produce es el roce de la pista sobre las llantas, hacia el centro. Lo que se siente «hacia afuera» no es una fuerza sobre el auto: es tu cuerpo, que tiende a seguir en línea recta mientras el auto gira.</p>
      ${fuente('Que la aceleración apunte hacia afuera es un error que suponemos, sin estudio con porcentaje. Creemos que sale de una idea documentada: que en el movimiento circular hay una fuerza real hacia afuera (Hestenes, Wells y Swackhamer, 1992). Que la aceleración apunte hacia donde se mueve está reportado sin porcentaje (Trowbridge y McDermott, 1981). En la PUCP, según Castillo y otros (2013), el movimiento circular en general fue de lo peor contestado en el curso de nivelación. La opción de que no hay aceleración es otro error que suponemos.')}` },
];
const S = { k:0, pred:{}, t0:Date.now() };
const sinParada = el => el.querySelectorAll('.v').forEach(e => { e.removeAttribute('tabindex'); e.style.cursor = 'default'; });
// Se puede abrir un experimento solo si todos los anteriores tienen respuesta (decisión de Gerson, 6 nov 2026).
const abierto = k => EXPS.slice(0, k).every(x => S.pred[x.id]);
function crecer(listo){ parar(); E.crece = 0; parar = animarValor(500, f => { E.crece = f; draw(); }, () => { listo && listo(); draw(); }); }
function correr(){
  parar();
  if (EXPS[S.k].tipo === 'circulo' && E.circ.suelto){
    parar = animarValor(RM ? 0 : 1600, f => { E.circ.suelto.t = E.T*f; draw(); });
  } else if (EXPS[S.k].id === 'rotonda'){
    if (RM){ draw(); return; }
    let id, antes = performance.now();
    const tick = now => { E.circ.theta += (now - antes)/1000*E.circ.omega*180/Math.PI; antes = now; draw(); id = requestAnimationFrame(tick); };
    id = requestAnimationFrame(tick); parar = () => cancelAnimationFrame(id);
  } else {
    const desde = E.desde || 0;
    parar = animarValor(RM ? 0 : (E.T - desde)*650, f => { E.t = desde + (E.T - desde)*f; draw(); });
  }
}
function draw(){
  if (!L.W) return;
  const x = EXPS[S.k], c = colores(L.W);
  if (x.tipo === 'circulo') vistaCirculo(L, c, Object.assign({ crece:E.crece }, E.circ));
  else vistaTiro(L, c, Object.assign({}, E.cfg, { t:E.t, crece:E.crece }));
  decir($('desc2'), describir(x));
}
function describir(x){
  const r = S.pred[x.id];
  if (x.id === 'mas-rapida') return r ? 'Las dos pelotas caen a la par y llegan juntas a los 4 segundos; la rápida cae el doble de lejos.' : 'Un acantilado de 80 metros con dos pelotas listas para lanzarse en horizontal, a 15 y a 30 metros por segundo.';
  if (x.id === 'cada-segundo') return r ? 'En horizontal avanza 15 metros cada segundo; en vertical cae 5, 15, 25 y 35 metros.' : 'La pelota al final del primer segundo, 15 metros adelante del borde.';
  if (x.id === 'avioneta') return r ? 'El paquete cae siempre justo debajo de la avioneta y llega al suelo a los 6 segundos, a 300 metros.' : 'Una avioneta a 180 metros de altura, con el paquete a punto de soltarse.';
  if (x.id === 'complementarios') return r ? `Disparos a ${E.ang} y ${90 - E.ang} grados con 50 metros por segundo: caen en el mismo lugar.` : 'Un cañón listo para disparar a 37 grados y a 53 grados con 50 metros por segundo.';
  if (x.id === 'honda') return r ? 'Al romperse la cuerda, la piedra sigue en línea recta, tangente al círculo.' : 'Vista desde arriba: una piedra atada a una cuerda gira en sentido antihorario. Ahora está en el extremo derecho del círculo.';
  return r ? `El auto gira a ${E.v} metros por segundo en una rotonda de ${E.r} metros; su aceleración apunta al centro.` : 'Un auto en una rotonda de 50 metros, con su velocidad tangente.';
}
function botones(){
  if (!$('exps').children.length){
    $('exps').innerHTML = EXPS.map((x, k) => `<button type="button" data-k="${k}">${k+1}. ${x.corto}</button>`).join('');
    $('exps').querySelectorAll('button').forEach(b => b.onclick = () => ir(+b.dataset.k));
  }
  [...$('exps').children].forEach((b, k) => {
    const ok = abierto(k);
    b.disabled = !ok; b.setAttribute('aria-pressed', String(k === S.k));
    if (ok){ b.removeAttribute('aria-disabled'); b.removeAttribute('aria-label'); }
    else { b.setAttribute('aria-disabled', 'true'); b.setAttribute('aria-label', `Experimento ${k + 1}, bloqueado`); }
  });
}
function reiniciar(x){ for (const k of Object.keys(E)) delete E[k]; x.antes(); }
function ir(k){
  if (!abierto(k)) return;
  parar();
  S.k = k; S.t0 = Date.now();
  const x = EXPS[k];
  reiniciar(x);
  if (S.pred[x.id]){ x.despues(); parar(); E.crece = 1; if (E.T !== undefined && x.tipo === 'tiro') E.t = E.T; if (E.circ && E.circ.suelto) E.circ.suelto.t = E.T; if (x.id === 'rotonda') correr(); }
  botones(); L.resize();
  leyenda($('ley2'), S.pred[x.id] ? x.ley : x.leyAntes);
  $('k2').textContent = `¿Qué pasa si…? · ${k+1} de ${EXPS.length}`;
  $('t2').textContent = x.corto;
  $('body2').innerHTML = `<p>${x.q}</p>${opcionesHTML(x.opts, 'fb2')}<div id="res2" class="body"></div>`;
  sinParada($('body2'));
  const btns = [...$('body2').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[x.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === x.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb2');
    fb.textContent = p === x.ok ? '¡Bien pensado! Mira la escena para ver por qué.' : `Elegiste la ${p.toUpperCase()}. La correcta está marcada; mira la escena para ver por qué.`;
    fb.className = 'fb ' + (p === x.ok ? 'ok' : 'mal');
    $('res2').innerHTML = x.ctrl() + x.exp + (k < EXPS.length - 1 ? `<div class="nav"><span></span><button type="button" class="btn primary" id="sig2">Siguiente: ${EXPS[k+1].corto}</button></div>` : '');
    $('res2').querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => { if (x.id !== 'rotonda') parar(); x.alCambiar(); x.vivo(); draw(); }));
    const rep = $('repetir'); if (rep) rep.onclick = () => { if (E.circ && E.circ.suelto) E.circ.suelto.t = 0; E.t = 0; correr(); };
    const sig = $('sig2'); if (sig) sig.onclick = () => { ir(k + 1); document.querySelector('#m2').scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); $('t2').focus({ preventScroll:true }); };
    sinParada($('res2')); x.vivo();
  };
  btns.forEach(b => b.onclick = () => {
    if (S.pred[x.id]) return;
    const o = x.opts.find(q => q[0] === b.dataset.k);
    S.pred[x.id] = o[0];
    registrarPrediccion('que-pasa-si-' + x.id, o[0], o[0] === x.ok, o[2] || '', o[3] || '', S.t0);
    pintar(); botones(); leyenda($('ley2'), x.ley);
    $('fb2').focus({ preventScroll:true });
    const ch = chico();
    if (ch) cv.scrollIntoView({ block:'start', behavior: RM ? 'auto' : 'smooth' });
    esperar(ch ? 380 : 0, () => { if (S.k !== k || $('m2').hidden) return; E.t = 0; x.despues(); draw(); });
  });
  pintar(); draw();
}
alRedibujarTema(draw);
addEventListener('modo', () => { if ($('m2').hidden) parar(); else { L.resize(); if (EXPS[S.k].id === 'rotonda' && S.pred.rotonda) correr(); } });
L.resize(); ir(0);
})();
</script>

<script>
/* ================= Pestañas ================= */
(function(){
  const modos = [['#paso-a-paso', 'm1', 'tab1'], ['#que-pasa-si', 'm2', 'tab2']];
  function route(){
    const k = Math.max(0, modos.findIndex(m => m[0] === location.hash));
    modos.forEach(([, m, t], j) => {
      document.getElementById(m).hidden = j !== k;
      const a = document.getElementById(t);
      if (j === k) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    dispatchEvent(new Event('modo'));
  }
  addEventListener('hashchange', route); route();
})();
</script>
</body>
