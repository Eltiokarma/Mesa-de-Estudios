<!doctype html>
<html lang="es" data-curso="quimica">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soluciones: concentración, dilución y mezcla</title>
<style>
/* Cáscara acogedora (crema, tarjetas cálidas, esquinas redondas; docs/diseno.md), copiada del molde de limitante-particulas.
   Dentro del dibujo y de las ecuaciones solo mandan los colores de las variables (regla 4):
   soluto n (puntos) mostaza, volumen V (cuadros) azul, concentración M (puntos por lupa) magenta,
   masa de soluto siena, solvente turquesa y equivalentes (H⁺, θ, N) morado; en solubilidad (experimentos 6 y 7),
   la curva de solubilidad S verde y la presión del gas P azul petróleo. La temperatura T va en tinta: es la condición. */
[hidden]{display:none!important}
:root{
  --bg:#fbf3ec; --card:#fffaf6; --paper:#fdf7f1; --ink:#2d2340; --muted:#716579; --line:#efe3dc; --grid:#f3e8e0;
  --detras:#f6ece4; --acento:#ffd3e2; --acento-ink:#5c1f3d; --ok:#1d7f58; --warn:#c8363b;
  --shadow:0 1px 2px rgba(92,52,110,.05),0 10px 28px rgba(92,52,110,.09);
  --c-n:#7d6a00; --c-V:#1f5fbf; --c-M:#b3246b; --c-g:#773922; --c-solv:#0f766e; --c-eq:#6b3dbd; --c-S:#476e0c; --c-P:#093f53;
  --vidrio:#8e97a8; --liquido:.10;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --detras:#211a2a; --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-n:#e3c84a; --c-V:#7cb0ff; --c-M:#ff86bd; --c-g:#e0a07a; --c-solv:#5ed9c8; --c-eq:#ab8cf2; --c-S:#9bd35a; --c-P:#409dbf;
  --vidrio:#a99cb8; --liquido:.16; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --detras:#211a2a; --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-n:#e3c84a; --c-V:#7cb0ff; --c-M:#ff86bd; --c-g:#e0a07a; --c-solv:#5ed9c8; --c-eq:#ab8cf2; --c-S:#9bd35a; --c-P:#409dbf;
  --vidrio:#a99cb8; --liquido:.16; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--font); -webkit-text-size-adjust:100%}
.wrap{max-width:1240px; margin:0 auto; padding-block:18px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid; gap:16px}
.top{display:grid; gap:12px}
.eyebrow{margin:0; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700}
h1{margin:2px 0 0; font-size:clamp(1.65rem, 4.4vw, 2.1rem); line-height:1.1; letter-spacing:-.01em}
.sub{margin:4px 0 0; color:var(--muted); font-size:.95rem; max-width:60ch}

.tabs{display:flex; gap:4px; padding:5px; border-radius:999px; background:var(--card); box-shadow:var(--shadow); justify-self:start; max-width:100%}
.tabs a{padding:9px 16px; border-radius:999px; color:var(--muted); text-decoration:none; font-weight:700; white-space:nowrap; font-size:.95rem}
.tabs a[aria-current="page"]{background:var(--ink); color:var(--card)}
.tabs a:hover:not([aria-current]){color:var(--ink)}

.mode{display:grid; gap:16px; min-width:0; align-items:start}
.bench{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:10px; display:grid; gap:8px; min-width:0}
.lienzo{border-radius:16px; overflow:hidden; background:var(--paper); border:1px solid var(--line)}
canvas{display:block; width:100%; touch-action:pan-y; -webkit-user-select:none; user-select:none}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; padding:2px 8px 4px; font-size:.82rem; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:4px; border-radius:2px; display:inline-block}
.legend i.pt{width:8px; height:8px; border-radius:50%}

.guide{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:20px; display:grid; gap:14px; min-width:0}
.dots{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.dots button{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); color:var(--muted);
  font:700 .82rem var(--font); cursor:pointer; font-variant-numeric:tabular-nums}
.dots button.done{border-color:var(--ink); color:var(--ink)}
.dots button.on{background:var(--ink); border-color:var(--ink); color:var(--card)}
.dots button:disabled{opacity:.45; cursor:not-allowed}
#exps button:disabled{opacity:.45; cursor:not-allowed}
.step-k{display:inline-block; margin:0; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; font-weight:800;
  color:var(--acento-ink); background:var(--acento); border-radius:999px; padding:3px 10px}
.step-t{margin:8px 0 0; font-size:1.35rem; line-height:1.2; text-wrap:balance}
.body{display:grid; gap:12px; min-width:0}
.body p{margin:0; max-width:66ch}
.problem{border-left:4px solid var(--acento); padding:6px 0 6px 14px; font-size:1.06rem; max-width:66ch}

.v{font-weight:800; border-radius:6px; padding:0 3px; cursor:pointer; text-decoration:underline dotted 1.5px; text-underline-offset:3px}
.v-n{color:var(--c-n); background:color-mix(in srgb, var(--c-n) 12%, transparent)}
.v-V{color:var(--c-V); background:color-mix(in srgb, var(--c-V) 12%, transparent)}
.v-M{color:var(--c-M); background:color-mix(in srgb, var(--c-M) 12%, transparent)}
.v-g{color:var(--c-g); background:color-mix(in srgb, var(--c-g) 12%, transparent)}
.v-solv{color:var(--c-solv); background:color-mix(in srgb, var(--c-solv) 12%, transparent)}
.v-eq{color:var(--c-eq); background:color-mix(in srgb, var(--c-eq) 12%, transparent)}
.v-S{color:var(--c-S); background:color-mix(in srgb, var(--c-S) 12%, transparent)}
.v-P{color:var(--c-P); background:color-mix(in srgb, var(--c-P) 12%, transparent)}
.v.hl{background:color-mix(in srgb, currentColor 26%, transparent)}

.eqs{display:grid; gap:10px; padding:14px; border-radius:16px; background:var(--paper); border:1px solid var(--line); overflow-x:auto}
.eq{display:flex; flex-wrap:wrap; align-items:center; gap:.42em; font-family:var(--mono); font-size:1.05rem; white-space:nowrap; font-variant-numeric:tabular-nums}
.eq .note{font-family:var(--font); font-size:.84rem; color:var(--muted); margin-left:.5em; white-space:normal}
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.15}
.frac > span:first-child{border-bottom:1.5px solid currentColor; padding:0 .25em; align-self:stretch; text-align:center}
.frac > span:last-child{padding:0 .25em}
.answer{font-weight:700; padding:12px 16px; border-radius:16px; background:var(--paper); border:2px solid var(--c-M); max-width:66ch}
.aviso{background:var(--acento); color:var(--acento-ink); border-radius:16px; padding:10px 14px; font-size:.93rem}

.opts{display:grid; grid-template-columns:1fr; gap:8px}
@media (min-width:560px){ .opts{grid-template-columns:repeat(2, minmax(0,1fr))} }
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; padding:12px 14px; border-radius:16px; border:2px solid var(--line);
  background:var(--paper); color:var(--ink); font:inherit; cursor:pointer; min-height:48px}
.opt .l{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:.85rem;
  background:var(--card); border:1.5px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 10%, var(--paper))}
.opt.correct .l{background:var(--ok); border-color:var(--ok); color:var(--card)}
.opt.wrong{border-color:var(--warn); background:color-mix(in srgb, var(--warn) 9%, var(--paper))}
.opt.wrong .l{background:var(--warn); border-color:var(--warn); color:var(--card)}
.fb{font-weight:700; margin:0}
.fb.ok{color:var(--ok)} .fb.mal{color:inherit}

.juego{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.juego[hidden]{display:none}
.juego .seg{border-radius:16px}
.juego .seg button{min-height:44px}
.seg{display:inline-flex; flex-wrap:wrap; gap:4px; padding:4px; border-radius:999px; background:var(--paper); border:1px solid var(--line); justify-self:start; max-width:100%}
.seg button{font:700 .9rem var(--font); padding:8px 14px; border-radius:999px; border:0; background:transparent; color:var(--muted); cursor:pointer; min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--card)}
.exps{border-radius:20px}

.nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.acciones{display:flex; flex-wrap:wrap; gap:8px}
.btn{font:700 .95rem var(--font); padding:11px 20px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; min-height:44px}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--card)}
.btn:disabled{opacity:.45; cursor:not-allowed}
button:focus-visible, .v:focus-visible, input:focus-visible, a:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.hint{font-size:.88rem; color:var(--muted)}
.fuente{font-size:.86rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px}
.pie{margin:4px 0 0; text-align:center; color:var(--muted); font-size:.95rem}
.pie a{color:var(--ink); font-weight:700}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.volver-app{display:inline-block; margin:12px 16px 0; background:var(--card); color:var(--ink); box-shadow:var(--shadow);
  font:700 14px var(--font); padding:8px 16px; border-radius:999px; text-decoration:none}

/* Tres lecturas del explorador: soluto, volumen y concentración, cada una con su color */
.lecturas{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px}
.lectura{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:8px 10px; border-left:5px solid var(--k); min-width:0}
.lectura b{display:block; color:var(--k); font:800 1.05rem var(--mono); font-variant-numeric:tabular-nums}
.lectura span{display:block; font-size:.78rem; color:var(--muted)}
.lectura em{font-style:normal; font-weight:800; font-size:.8rem; color:var(--ink)}

/* Pantalla grande (laboratorio de cómputo, 1366 × 768): dibujo a la izquierda, fijo; guía a la derecha. */
@media (min-width:900px){
  .top{grid-template-columns:1fr auto; align-items:end}
  .mode{grid-template-columns:minmax(0, 1.4fr) minmax(360px, 1fr)}
  .bench{position:sticky; top:12px}
}

<script>

<script src="motor.js"></script>
<script src="../../nucleo/medicion.js"></script>
<script src="../../nucleo/celular.js"></script>
<script src="../../nucleo/jugar.js"></script>
<script>
// Registro anónimo de predicciones (nucleo/medicion.js). Solo guarda si el alumno entró por la app.
const PLANTILLA = { id: 'soluciones', unidad: 'quimica.soluciones', version: '0.1.0' };
function registrarPrediccion(problema, opcion, correcta, error, respaldo, t0){
  if (!window.Medicion) return;
  Medicion.guardar({ tipo: 'prediccion', modulo: PLANTILLA.id, unidad: PLANTILLA.unidad, problema, opcion, correcta,
    error: correcta ? '' : error, respaldo: correcta ? '' : respaldo, ms: t0 ? Date.now() - t0 : '' }, PLANTILLA.version);
}

/* ================= Piezas compartidas =================
   Toda la química (moles, concentraciones, cuántos puntos y cuántos cuadros) sale de MotorSolucion (motor.js);
   aquí solo se pinta y se anima. */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = Celular.variable; // guardada hasta que cambie el tema o el tamaño (nucleo/celular.js)
// Coma decimal, espacio de miles (desde 5 cifras) y signo menos tipográfico.
function fmt(n, d){
  if (!Number.isFinite(n)) return '—';
  const p = Math.pow(10, d === undefined ? 1 : d), r = Math.round(n*p)/p + 0;
  let [e, f] = String(Math.abs(r)).split('.');
  if (e.length >= 5) e = e.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (r < 0 ? '−' : '') + e + (f ? ',' + f : '');
}
const V = (k, t) => `<span class="v v-${k}" data-var="${k}" tabindex="0">${t}</span>`;
const fr = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const MS = MotorSolucion;
const esperar = (ms, fn) => setTimeout(fn, RM ? 0 : ms);
const suave = f => f < .5 ? 2*f*f : 1 - Math.pow(-2*f + 2, 2)/2;
// Las transiciones solo cambian números; el bucle de cada escena las dibuja (y se despierta para eso).
let TWEENS = 0;
const despertarTodo = () => ESCENAS.forEach(E => E.B && E.B.despertar());
function tween(dur, paso, fin){
  if (RM || !dur){ paso(1); despertarTodo(); if (fin) setTimeout(fin, 0); return; }
  const t0 = performance.now(); TWEENS++; despertarTodo();
  const tick = now => { const f = Math.max(0, Math.min(1, (now - t0)/dur)); paso(suave(f)); if (f < 1) requestAnimationFrame(tick); else { TWEENS--; if (fin) fin(); } };
  requestAnimationFrame(tick);
}

function crearLienzo(cv, alto, dibujar){
  const ctx = cv.getContext('2d');
  const L = { cv, ctx, W:0, H:0 };
  L.resize = () => {
    const W = cv.clientWidth; if (!W) return;
    const H = Math.round(Celular.alto(alto(W), L.compacto, { tope:340 })), dpr = Celular.dpr();
    L.W = W; L.H = H; cv.style.height = H + 'px'; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    dibujar();
  };
  new ResizeObserver(L.resize).observe(cv);
  // Celular con predicción pendiente: el dibujo más bajo y pegado arriba (nucleo/celular.js).
  L.compactar = on => { on = !!on; Celular.compactar(cv.closest('.mode'), on); if (on === !!L.compacto) return; L.compacto = on; L.resize(); };
  return L;
}
function alRedibujarTema(fn){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', fn);
  new MutationObserver(fn).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
function linea(ctx, x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
// Texto con un fondo claro detrás, para que se lea sobre las líneas.
function rotulo(ctx, c, x, y, t, color, align, peso, tam){
  ctx.font = `${peso || 700} ${tam || 12}px ${c.font}`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(t).width, x0 = align === 'left' ? x : align === 'right' ? x - w : x - w/2;
  ctx.save(); ctx.fillStyle = c.paper; ctx.globalAlpha = .88; ctx.fillRect(x0 - 3, y - 9, w + 6, 18); ctx.restore();
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function colores(){
  const g = n => css(n);
  return { ink:g('--ink'), muted:g('--muted'), grid:g('--grid'), paper:g('--paper'), card:g('--card'), line:g('--line'),
    n:g('--c-n'), V:g('--c-V'), M:g('--c-M'), g:g('--c-g'), solv:g('--c-solv'), eq:g('--c-eq'), S:g('--c-S'), P:g('--c-P'),
    vidrio:g('--vidrio'), liquido:Number(g('--liquido')) || .1, mono:g('--mono'), font:g('--font') };
}
const fM = M => `${fmt(M, 2)} M`;
const fmol = n => `${fmt(n, 3)} mol`;
function leyendaBase(esc, extra){
  const mol = esc.MporPunto*esc.mLporCuadro/1000;
  return `<span><i class="pt" style="background:var(--c-n)"></i>n · soluto (cada punto: ${fmt(mol, 5)} mol)</span>`
    + `<span><i style="background:var(--c-V)"></i>V · volumen (cada cuadro: ${fmt(esc.mLporCuadro, 0)} mL)</span>`
    + `<span><i style="background:var(--c-M)"></i>M · concentración (puntos por cuadro o por lupa)</span>` + (extra || '');
}
// Resaltar en el dibujo la variable que se toca en el texto (regla 4: el mismo color en el texto y en el dibujo).
const ESCENAS = [];
function resaltar(k){ ESCENAS.forEach(E => { E.hl = k; if (E.B) E.B.despertar(); }); document.querySelectorAll('.v').forEach(s => s.classList.toggle('hl', !!k && s.dataset.var === k)); }
document.addEventListener('mouseover', e => { const s = e.target.closest && e.target.closest('.v'); if (s) resaltar(s.dataset.var); });
document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('.v')) resaltar(null); });
document.addEventListener('focusin', e => { const s = e.target.closest && e.target.closest('.v'); resaltar(s ? s.dataset.var : null); });

/* ================= La escena de cuadros y puntos =================
   Un recipiente graduado por cuadros (2 columnas): cada cuadro es mLporCuadro de solución. Los puntos son el
   soluto; se mueven siempre, cada uno dentro de su cuadro, y nunca se dibujan quietos. El agua no se dibuja.
   La lupa es un círculo rotulado "volumen muy pequeño" (del mismo volumen que un cuadro): su borde no es una
   pared, así que los puntos salen por un lado y entran por el otro. */
function crearEscena(cv, idDesc, idLey){
  const rnd = MS.azar(4242);
  const E = { vasos:[], lupas:[], esc:{ mLporCuadro:25, MporPunto:0.5 }, cols:2, extra:null, hl:null, lay:{ v:{}, l:{} }, desc:'', descr:null };
  ESCENAS.push(E);
  const L = crearLienzo(cv, W => W >= 560 ? clamp(W*0.64, 340, 470) : 540, () => dibujar(performance.now()));
  E.L = L;
  const VEL = RM ? 0.05 : 0.2, DUR = RM ? 0 : 900;
  const cuadrosDe = vs => Math.round(vs.mL / E.esc.mLporCuadro);
  const punto = q => ({ c:q.c, u:q.u, v:q.v, ang:rnd()*Math.PI*2, from:null, t0:0, sale:0 });
  const parte = (x, y, a) => ({ x, y, ang:rnd()*Math.PI*2, alpha:a, sale:false });
  E.vaso = id => E.vasos.find(v => v.id === id);
  E.lupa = id => E.lupas.find(l => l.id === id);
  function llenarLupa(lu){
    const k = Math.round(lu.cuenta);
    lu.parts = [];
    for (let i = 0; i < k; i++){ const r = Math.sqrt(rnd())*0.85, a = rnd()*Math.PI*2; lu.parts.push(parte(Math.cos(a)*r, Math.sin(a)*r, 1)); }
  }
  E.nuevaLupa = o => { const lu = Object.assign({ titulo:'Lupa · volumen muy pequeño', sub:'', iones:0 }, o); llenarLupa(lu); return lu; };
  // E.gen cambia con cada config: los avisos de fin de una animación vieja no tocan la escena nueva.
  E.config = cfg => {
    E.gen = (E.gen || 0) + 1;
    E.esc = cfg.esc || E.esc; E.cols = cfg.cols || 2; E.extra = cfg.extra || null; E.descr = cfg.descr || null; E.nota = cfg.nota || '';
    E.vasos = (cfg.vasos || []).map(o => {
      const vs = { id:o.id, cap:o.cap, mL:o.mL, nivel:o.mL, n:o.n, etiqueta:o.etiqueta || '', oculto:!!o.oculto, iones:o.iones || 0, puntos:[], aviso:'' };
      if (o.mL > 0){
        const m = MS.modelo(o.n, o.mL, E.esc, { redondear:true });
        vs.puntos = MS.ubicar(m.puntos, m.cuadros, o.sem || 1).map(punto);
      }
      return vs;
    });
    E.lupas = (cfg.lupas || []).map(E.nuevaLupa);
    if (idLey) document.getElementById(idLey).innerHTML = cfg.leyenda !== undefined ? cfg.leyenda : leyendaBase(E.esc);
    if (E.B) E.B.despertar();
  };
  E.M = vs => vs.mL > 0 ? vs.n/(vs.mL/1000) : 0;

  // ----- posiciones -----
  function pix(vs, p){
    const l = E.lay.v[vs.id]; if (!l) return { x:0, y:0 };
    const col = p.c % E.cols, fila = Math.floor(p.c / E.cols);
    return { x: l.x + (col + p.u)*l.cel, y: l.base - (fila + 1 - p.v)*l.cel };
  }
  function ahora(vs, p, now){
    const q = pix(vs, p);
    if (!p.from) return q;
    const f = DUR ? Math.min(1, (now - p.t0)/DUR) : 1;
    if (f >= 1){ p.from = null; return q; }
    const e = suave(f);
    return { x: p.from.x + (q.x - p.from.x)*e, y: p.from.y + (q.y - p.from.y)*e };
  }
  // Reacomodar los puntos de un recipiente con el reparto del motor (todos los cuadros con lo mismo, ±1).
  E.reubicar = (id, sem, fin) => {
    const vs = E.vaso(id), now = performance.now(), cu = cuadrosDe(vs), gen = E.gen;
    const nuevos = MS.ubicar(vs.puntos.length, cu, sem || 1);
    const ord = (a, b) => (a.c - b.c) || (a.u - b.u);
    const viejos = [...vs.puntos].sort(ord); nuevos.sort(ord);
    viejos.forEach((p, i) => { p.from = ahora(vs, p, now); p.t0 = now; p.c = nuevos[i].c; p.u = nuevos[i].u; p.v = nuevos[i].v; });
    esperar(DUR + 50, () => fin && E.gen === gen && fin());
  };
  // Subir o bajar el nivel del líquido (agregar agua, sacar, verter).
  E.nivel = (id, mL, fin) => {
    const vs = E.vaso(id), de = vs.nivel, gen = E.gen;
    tween(RM ? 0 : 1100, f => { vs.nivel = de + (mL - de)*f; }, () => { vs.nivel = mL; fin && E.gen === gen && fin(); });
  };
  // Pasar puntos de un recipiente a otro: filtro(p) elige cuáles y mapear(p) da su cuadro y lugar en el destino.
  E.pasar = (de, a, filtro, mapear) => {
    const o = E.vaso(de), d = E.vaso(a), now = performance.now();
    const van = o.puntos.filter(filtro);
    o.puntos = o.puntos.filter(p => !van.includes(p));
    van.forEach((p, k) => { const from = ahora(o, p, now), q = mapear(p, k); p.from = from; p.t0 = now; Object.assign(p, q); d.puntos.push(p); });
    return van.length;
  };
  // Puntos nuevos que caen desde arriba (agregar soluto) y puntos que se van (sacar).
  E.agregar = (id, k) => {
    const vs = E.vaso(id), l = E.lay.v[id], now = performance.now();
    for (let i = 0; i < k; i++){
      const p = punto({ c:0, u:.5, v:.5 });
      p.from = l ? { x: l.x + l.w*(0.2 + 0.6*rnd()), y: l.base - vs.cap*l.cel - 30 - rnd()*20 } : null; p.t0 = now;
      vs.puntos.push(p);
    }
  };
  E.quitar = (id, lista) => { const now = performance.now(); lista.forEach(p => { p.sale = now; }); };
  E.lupaA = (id, cuenta) => { const lu = E.lupa(id); if (lu) lu.cuenta = cuenta; };
  E.iones = (id, k) => { const vs = E.vaso(id); if (vs) vs.iones = k; E.lupas.forEach(lu => { if (lu.vaso === id) lu.iones = k; }); };

  // ----- movimiento: siempre -----
  function mover(dt, now){
    for (const vs of E.vasos){
      vs.puntos = vs.puntos.filter(p => !p.sale || now - p.sale < 650);
      for (const p of vs.puntos){
        p.ang += (rnd() - .5)*dt*4;
        p.u += Math.cos(p.ang)*VEL*dt; p.v += Math.sin(p.ang)*VEL*dt;
        if (p.u < .1){ p.u = .1; p.ang = Math.PI - p.ang; } else if (p.u > .9){ p.u = .9; p.ang = Math.PI - p.ang; }
        if (p.v < .1){ p.v = .1; p.ang = -p.ang; } else if (p.v > .9){ p.v = .9; p.ang = -p.ang; }
      }
    }
    for (const lu of E.lupas){
      const meta = Math.round(lu.cuenta), vivos = lu.parts.filter(q => !q.sale);
      if (vivos.length < meta){ const r = Math.sqrt(rnd())*0.85, a = rnd()*Math.PI*2; lu.parts.push(parte(Math.cos(a)*r, Math.sin(a)*r, 0)); }
      else if (vivos.length > meta) vivos[Math.floor(rnd()*vivos.length)].sale = true;
      for (const q of lu.parts){
        q.alpha = clamp(q.alpha + (q.sale ? -2 : 2)*dt*(RM ? 50 : 1), 0, 1);
        q.ang += (rnd() - .5)*dt*3;
        q.x += Math.cos(q.ang)*VEL*0.9*dt; q.y += Math.sin(q.ang)*VEL*0.9*dt;
        if (q.x*q.x + q.y*q.y > 1){ q.x *= -0.96; q.y *= -0.96; } // sale por un lado y entra por el otro: el borde no es pared
      }
      lu.parts = lu.parts.filter(q => !(q.sale && q.alpha <= 0));
    }
  }
  // El bucle corre mientras algo se mueve (puntos, lupas o una transición) y el lienzo se ve; si no, se duerme
  // (nucleo/celular.js) y lo despiertan los cambios de la escena.
  const seMueve = () => TWEENS > 0 || !!E.extra || E.vasos.some(v => v.puntos.length) || E.lupas.some(lu => lu.parts.length || lu.cuenta > 0);
  E.B = Celular.bucle(cv, (dt, now) => {
    if (!L.W) return true;
    mover(Math.min(0.05, dt), now); dibujar(now);
    return seMueve();
  });
  for (const k of ['reubicar', 'nivel', 'pasar', 'agregar', 'quitar', 'lupaA', 'iones']){ const f = E[k]; E[k] = (...a) => { const r = f(...a); E.B.despertar(); return r; }; }

  // ----- dibujo -----
  function layout(W, H){
    const ancho = W >= 560, nl = E.lupas.length;
    let zv = { x:0, y:0, w:W, h:H }, zl = null;
    if (nl && ancho){ zv = { x:0, y:0, w:W*0.54, h:H }; zl = { x:W*0.54, y:0, w:W*0.46, h:H }; }
    else if (nl){ zv = { x:0, y:0, w:W, h:H*0.58 }; zl = { x:0, y:H*0.58, w:W, h:H*0.42 }; }
    const nv = Math.max(1, E.vasos.length), arriba = 44, abajo = 46;
    const capMax = Math.max(1, ...E.vasos.map(v => v.cap));
    const cel = clamp(Math.min((zv.h - arriba - abajo)/capMax, (zv.w/nv - 56)/E.cols), 10, 72);
    E.lay.v = {};
    E.vasos.forEach((vs, k) => {
      const cx = zv.x + zv.w*(k + 0.5)/nv, w = E.cols*cel;
      E.lay.v[vs.id] = { x: cx - w/2 + (nv === 1 && zl ? 14 : 8), base: zv.y + zv.h - abajo, cel, w };
    });
    E.lay.l = {};
    if (zl){
      const fila = zl.w >= zl.h*nl*0.7;
      const R = Math.max(30, Math.min(fila ? zl.w/nl/2 - 16 : zl.w/2 - 16, fila ? zl.h/2 - 58 : zl.h/nl/2 - 58, 108));
      E.lupas.forEach((lu, k) => {
        E.lay.l[lu.id] = fila ? { x: zl.x + zl.w*(k + 0.5)/nl, y: zl.y + zl.h/2 + 2, R }
                              : { x: zl.x + zl.w/2, y: zl.y + zl.h*(k + 0.5)/nl + 2, R };
      });
    }
  }
  function dibujarVaso(ctx, c, vs, now){
    const l = E.lay.v[vs.id], { x, base, cel, w } = l, top = base - vs.cap*cel, filas = vs.nivel / (E.esc.mLporCuadro*E.cols);
    const yNivel = base - filas*cel;
    // líquido
    if (!vs.oculto && vs.nivel > 0.01){
      ctx.save(); ctx.fillStyle = c.V; ctx.globalAlpha = c.liquido; ctx.fillRect(x, yNivel, w, base - yNivel); ctx.restore();
      // cuadros (volumen): líneas a trazos en el color de V
      ctx.save(); ctx.strokeStyle = c.V; ctx.lineWidth = E.hl === 'V' ? 2 : 1; ctx.globalAlpha = E.hl === 'V' ? .95 : .5; ctx.setLineDash([3, 3]);
      for (let k = 1; k < E.cols; k++) linea(ctx, x + k*cel, yNivel, x + k*cel, base);
      for (let r = 1; r < filas - 1e-6; r++) linea(ctx, x, base - r*cel, x + w, base - r*cel);
      ctx.restore();
      ctx.save(); ctx.strokeStyle = c.V; ctx.lineWidth = 2; linea(ctx, x, yNivel, x + w, yNivel); ctx.restore();
    }
    // vidrio
    ctx.save(); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x - 9, top - 12); ctx.lineTo(x - 4, top - 8); ctx.lineTo(x - 4, base - 4); ctx.quadraticCurveTo(x - 4, base + 3, x + 3, base + 3);
    ctx.lineTo(x + w - 3, base + 3); ctx.quadraticCurveTo(x + w + 4, base + 3, x + w + 4, base - 4); ctx.lineTo(x + w + 4, top - 8); ctx.lineTo(x + w + 9, top - 12); ctx.stroke();
    // marcas de graduación, una por fila de cuadros
    ctx.strokeStyle = c.V; ctx.lineWidth = 1.2; ctx.globalAlpha = .8;
    for (let r = 1; r <= vs.cap; r++) linea(ctx, x - 4, base - r*cel, x - 10, base - r*cel);
    ctx.restore();
    if (vs.etiqueta){
      // la concentración del rótulo ('A · 2 M', '0,8 M') va en magenta (regla 4)
      const m = /^(.*?)(\d[\d,]* M)$/.exec(vs.etiqueta);
      if (!m) rotulo(ctx, c, x + w/2, top - 26, vs.etiqueta, c.ink, 'center', 800, 13);
      else {
        ctx.font = `800 13px ${c.font}`; const w1 = ctx.measureText(m[1]).width, w2 = ctx.measureText(m[2]).width, x1 = x + w/2 - (w1 + w2)/2;
        if (m[1]) rotulo(ctx, c, x1, top - 26, m[1], c.ink, 'left', 800, 13);
        rotulo(ctx, c, x1 + w1, top - 26, m[2], c.M, 'left', 800, 13);
      }
    }
    if (vs.oculto){
      ctx.save(); rr(ctx, x - 2, top, w + 4, base - top, 8); ctx.fillStyle = c.card; ctx.fill(); ctx.strokeStyle = c.line; ctx.stroke();
      ctx.fillStyle = c.muted; ctx.font = `800 ${Math.round(clamp(cel*0.9, 16, 30))}px ${c.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', x + w/2, (top + base)/2); ctx.restore();
      return;
    }
    // puntos (soluto)
    const rp = clamp(cel*0.07, 1.9, 4.2)*(E.hl === 'n' ? 1.5 : 1);
    for (const p of vs.puntos){
      const q = ahora(vs, p, now);
      let a = 1, dy = 0;
      if (p.sale){ const f = Math.min(1, (now - p.sale)/600); a = 1 - f; dy = -f*cel*1.4; }
      ctx.save(); ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(q.x, q.y + dy, rp, 0, Math.PI*2); ctx.fillStyle = c.n; ctx.fill();
      if (vs.iones){
        for (let k = 0; k < vs.iones; k++){
          const an = now/700 + p.u*9 + k*Math.PI;
          ctx.beginPath(); ctx.arc(q.x + Math.cos(an)*rp*2.6, q.y + dy + Math.sin(an)*rp*2.6, rp*0.62, 0, Math.PI*2); ctx.fillStyle = c.eq; ctx.fill();
        }
      }
      ctx.restore();
    }
    // lecturas debajo: volumen en azul y concentración en magenta
    if (vs.nivel > 0.01){
      ctx.font = `800 12px ${c.mono}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = c.V; ctx.fillText(`${fmt(vs.nivel, 0)} mL`, x + w/2, base + 17);
      ctx.fillStyle = c.M; ctx.fillText(fM(vs.n/(vs.nivel/1000)), x + w/2, base + 33);
    } else { ctx.font = `700 11px ${c.font}`; ctx.fillStyle = c.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('vacío', x + w/2, base + 17); }
  }
  function dibujarLupa(ctx, c, lu, now){
    const l = E.lay.l[lu.id]; if (!l) return;
    const { x, y, R } = l;
    // conexión con el cuadro que se mira
    const vs = lu.vaso && E.vaso(lu.vaso), lv = vs && E.lay.v[vs.id];
    if (vs && lv && !vs.oculto && vs.nivel > 0.01){
      const cIdx = lu.cuadro || 0, col = cIdx % E.cols, fila = Math.floor(cIdx / E.cols);
      const sx = lv.x + (col + .5)*lv.cel, sy = lv.base - (fila + .5)*lv.cel, r0 = lv.cel*0.42;
      ctx.save(); ctx.strokeStyle = c.muted; ctx.globalAlpha = .55; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
      linea(ctx, sx, sy - r0, x, y - R); linea(ctx, sx, sy + r0, x, y + R);
      ctx.setLineDash([]); ctx.globalAlpha = .9; ctx.lineWidth = 1.6; ctx.strokeStyle = c.ink;
      ctx.beginPath(); ctx.arc(sx, sy, r0, 0, Math.PI*2); ctx.stroke(); ctx.restore();
    }
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.fillStyle = c.paper; ctx.fill();
    ctx.clip();
    const rp = R*0.062*(E.hl === 'n' ? 1.35 : 1);
    for (const q of lu.parts){
      const px = x + q.x*R, py = y + q.y*R;
      ctx.globalAlpha = q.alpha;
      ctx.beginPath(); ctx.arc(px, py, rp, 0, Math.PI*2); ctx.fillStyle = c.n; ctx.fill();
      for (let k = 0; k < lu.iones; k++){
        const an = now/700 + q.x*7 + k*Math.PI;
        ctx.beginPath(); ctx.arc(px + Math.cos(an)*rp*2.3, py + Math.sin(an)*rp*2.3, rp*0.55, 0, Math.PI*2); ctx.fillStyle = c.eq; ctx.fill();
      }
    }
    ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2);
    ctx.strokeStyle = E.hl === 'M' ? c.M : c.ink; ctx.lineWidth = E.hl === 'M' ? 4 : 2.4; ctx.stroke();
    // mango de la lupa
    ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = c.vidrio;
    linea(ctx, x + R*0.72, y + R*0.72, x + R*0.72 + 14, y + R*0.72 + 14); ctx.restore();
    const tit = lu.titulo.replace(/\s*·\s*volumen muy pequeño$/, '');
    rotulo(ctx, c, x, y - R - 40, tit, c.ink, 'center', 800, 11);
    rotulo(ctx, c, x, y - R - 26, 'volumen muy pequeño:', c.muted, 'center', 700, 10);
    rotulo(ctx, c, x, y - R - 13, 'mismo volumen que un cuadro', c.muted, 'center', 700, 10);
    const k = Math.round(lu.cuenta), exacto = Math.abs(lu.cuenta - k) < 1e-6;
    const t = `${exacto ? k : fmt(lu.cuenta, 1)} ${k === 1 && exacto ? 'punto' : 'puntos'}${exacto ? '' : ' en promedio'}${lu.sub ? ' · ' + lu.sub : ''}`;
    rotulo(ctx, c, x, y + R + 15, t, c.M, 'center', 800, 12);
    if (lu.subEq) rotulo(ctx, c, x, y + R + 33, lu.subEq, c.eq, 'center', 800, 12);
  }
  function dibujar(now){
    if (!L.W) return;
    const c = colores(), { ctx, W, H } = L;
    ctx.clearRect(0, 0, W, H);
    layout(W, H);
    if (E.extra) E.extra(ctx, c, W, H, now);
    for (const lu of E.lupas) dibujarLupa(ctx, c, lu, now);
    for (const vs of E.vasos) dibujarVaso(ctx, c, vs, now);
    if (E.nota) rotulo(ctx, c, 10, 14, E.nota, c.muted, 'left', 700, 11);
    const d = E.descr ? E.descr() : E.vasos.filter(v => !v.oculto && v.mL > 0).map(v => `${v.etiqueta || 'Recipiente'}: ${fmt(v.mL, 0)} mL, ${v.puntos.filter(p => !p.sale).length} puntos en ${cuadrosDe(v)} cuadros, ${fM(E.M(v))}`).join('. ') + (E.lupas.length ? '. Lupa: ' + E.lupas.map(l => `${fmt(l.cuenta, 1)} puntos`).join(' y ') : '');
    if (d !== E.desc && idDesc){ E.desc = d; document.getElementById(idDesc).textContent = d; }
  }
  E.dibujar = () => { dibujar(performance.now()); E.B.despertar(); };
  alRedibujarTema(E.dibujar);
  addEventListener('modo', () => L.resize());
  return E;
}

/* Regla 3 (decisión 20): antes de cualquier pregunta se juega con un vaso de 200 mL de agua al que se le echa sal
   (tocando el vaso, con el botón o con las flechas): caen puntos y la lupa los cuenta. El volumen queda fijo: lo que
   después se pregunta es qué pasa al agregar agua, sacar una parte, mezclar o calentar, y eso el juego no lo muestra. */
function jugarSal(E, idJuego, preguntas, volver){
  const cv = E.L.cv, caja = document.getElementById(idJuego), ESC = { mLporCuadro:50, MporPunto:0.5 }, ML = 200;
  const J = { n:0, on:true, ocupado:false, k:0 };
  const M = () => J.n/(ML/1000);
  const armar = () => E.config({ esc:ESC, vasos:[{ id:'j', cap:3, n:J.n, mL:ML, etiqueta:'Agua con sal', sem:5 }],
    lupas:[{ id:'l', vaso:'j', cuenta:MS.lupa(M(), ESC), sub:fM(M()) }] });
  armar(); E.L.compactar(false);   // mientras se juega no hay predicción pendiente: el dibujo a su tamaño y con leyenda
  function echar(que){
    if (!J.on || J.ocupado) return;
    if (que === 'vaciar'){ J.n = 0; armar(); return; }
    if (J.n >= 0.8 - 1e-9) return;   // hasta 4 M
    J.ocupado = true; J.n = Math.round((J.n + 0.1)*10)/10; J.k++;
    const vs = E.vaso('j'); vs.n = J.n; E.agregar('j', 4);
    esperar(500, () => { if (!J.on || !E.vaso('j')) return; E.reubicar('j', 30 + J.k, () => { E.lupaA('l', MS.lupa(M(), ESC)); E.lupa('l').sub = fM(M()); J.ocupado = false; }); });
  }
  caja.querySelectorAll('[data-echar]').forEach(b => b.addEventListener('click', () => echar(b.dataset.echar)));
  cv.tabIndex = 0;
  cv.addEventListener('click', () => echar('sal'));
  cv.addEventListener('keydown', e => { if (J.on && /^(ArrowUp|ArrowRight|Enter)$/.test(e.key)){ e.preventDefault(); echar('sal'); } });
  return JugarPrimero.montar({ escena: cv.closest('.bench'), preguntas, minimo: 2,
    consigna: 'Toca el vaso para echar sal: mira los puntos y la lupa.',
    alListo: () => { J.on = false; caja.hidden = true; cv.removeAttribute('tabindex'); volver(); } });
}
</script>
<script>
/* ================= MODO 1: paso a paso =================
   Problema guiado de docs/investigacion/gases-soluciones-ideas-erroneas.md ("Disolución y dilución"):
   50 mL de HCl 6 M se llevan con agua hasta 200 mL. Predicciones 1 a 3 de la misma sección. */
(function(){
const $ = id => document.getElementById(id);
const E = crearEscena($('cv'), 'desc1', 'leyenda1');
const S = { step:0, max:0, pred:{}, listo:false, ocupado:false, hecho:{}, x:{ n:0.2, mL:100, Motra:4, ultimo:null, cambia:null, msg:'' } };

// Escalas del modelo (el motor revisa que den cuadros y puntos enteros).
const ESC_HCL = { mLporCuadro:25, MporPunto:0.5 };    // 6 M → 12 puntos por cuadro; 1,5 M → 3
const ESC_AZ = { mLporCuadro:125, MporPunto:0.1 };    // 0,8 M → 8 puntos por cuadro; 0,4 M → 4
const ESC_JARRA = { mLporCuadro:250, MporPunto:0.5 }; // 1 M → 2 puntos por cuadro
const ESC_MEZ = { mLporCuadro:25, MporPunto:0.25 };   // 2 M → 8; 1 M → 4; 1,25 M → 5
const ESC_X = { mLporCuadro:50, MporPunto:0.5 };      // explorador: 2 M → 4 puntos por cuadro

const HCL = { M1:6, V1:50, V2:200 }, dil = MS.diluir(HCL.M1, HCL.V1, HCL.V2);
function cfgHCl(mL){
  E.config({ esc:ESC_HCL, vasos:[{ id:'hcl', cap:5, n:dil.n, mL, etiqueta:'HCl', sem:3 }],
    lupas:[{ id:'l', vaso:'hcl', cuenta:MS.lupa(dil.n/(mL/1000), ESC_HCL), sub:fM(dil.n/(mL/1000)) }] });
}
const AZ = MS.diluir(0.8, 500, 1000);
function cfgAzucar(fin){
  E.config({ esc:ESC_AZ, vasos:[{ id:'az', cap:4, n:AZ.n, mL: fin ? 1000 : 500, etiqueta:'Agua con azúcar', sem: fin ? 8 : 5 }],
    lupas: fin ? [{ id:'antes', cuenta:MS.lupa(0.8, ESC_AZ), titulo:'Antes · volumen muy pequeño' }, { id:'despues', vaso:'az', cuenta:MS.lupa(AZ.M2, ESC_AZ), titulo:'Después' }]
               : [{ id:'antes', vaso:'az', cuenta:MS.lupa(0.8, ESC_AZ), titulo:'Lupa · volumen muy pequeño' }] });
}
const SAC = MS.sacar(1, 2000, 500);
function cfgJarra(fin){
  E.config({ esc:ESC_JARRA, vasos:[
      { id:'jarra', cap:4, n: fin ? SAC.queda.n : SAC.inicial.n, mL: fin ? 1500 : 2000, etiqueta:'Jarra', sem:7 },
      { id:'vaso', cap:2, n: fin ? SAC.sacado.n : 0, mL: fin ? 500 : 0, etiqueta:'Lo que se sacó', sem:9 }],
    lupas: fin ? [{ id:'lj', vaso:'jarra', cuenta:MS.lupa(SAC.queda.M, ESC_JARRA), titulo:'Lo que queda', sub:fM(SAC.queda.M) },
                  { id:'lv', vaso:'vaso', cuenta:MS.lupa(SAC.sacado.M, ESC_JARRA), titulo:'Lo que se sacó', sub:fM(SAC.sacado.M) }]
               : [{ id:'lj', vaso:'jarra', cuenta:MS.lupa(1, ESC_JARRA), sub:fM(1) }] });
}
const MEZ = MS.mezclar([[2, 100], [1, 300]]);
function cfgMezcla(fin){
  E.config({ esc:ESC_MEZ, vasos:[
      { id:'a', cap:4, n: fin ? 0 : MEZ.partes[0].n, mL: fin ? 0 : 100, etiqueta: fin ? 'A (vacío)' : 'A · 2 M', sem:11 },
      { id:'b', cap:8, n: fin ? MEZ.n : MEZ.partes[1].n, mL: fin ? 400 : 300, etiqueta: fin ? 'Mezcla' : 'B · 1 M', sem: fin ? 17 : 13 }],
    lupas: fin ? [{ id:'lb', vaso:'b', cuenta:MS.lupa(MEZ.M, ESC_MEZ), titulo:'La mezcla', sub:fM(MEZ.M) }]
               : [{ id:'la', vaso:'a', cuenta:MS.lupa(2, ESC_MEZ), titulo:'Lupa en A', sub:fM(2) }, { id:'lb', vaso:'b', cuenta:MS.lupa(1, ESC_MEZ), titulo:'Lupa en B', sub:fM(1) }] });
}

// ----- animaciones de cada predicción (la escena cambia recién después de responder) -----
function animarAzucar(fin){
  E.lupa('antes').titulo = 'Antes · volumen muy pequeño'; E.lupa('antes').vaso = null;
  E.lupas.push(E.nuevaLupa({ id:'despues', vaso:'az', cuenta:MS.lupa(0.8, ESC_AZ), titulo:'Después' }));
  const vs = E.vaso('az'); vs.mL = 1000;
  E.nivel('az', 1000, () => E.reubicar('az', 8, () => { E.lupaA('despues', MS.lupa(AZ.M2, ESC_AZ)); fin && fin(); }));
}
function animarDilucion(fin){
  const vs = E.vaso('hcl'); vs.mL = HCL.V2;
  E.nivel('hcl', HCL.V2, () => E.reubicar('hcl', 4, () => { E.lupaA('l', MS.lupa(dil.M2, ESC_HCL)); E.lupa('l').sub = fM(dil.M2); fin && fin(); }));
}
function animarJarra(fin){
  const j = E.vaso('jarra'), quedan = Math.round(SAC.queda.mL / ESC_JARRA.mLporCuadro);
  E.vaso('vaso').mL = 500; E.vaso('vaso').n = SAC.sacado.n; j.n = SAC.queda.n; j.mL = 1500;
  E.pasar('jarra', 'vaso', p => p.c >= quedan, p => ({ c: p.c - quedan }));
  E.nivel('jarra', 1500); E.nivel('vaso', 500, () => {
    E.lupas.push(E.nuevaLupa({ id:'lv', vaso:'vaso', cuenta:MS.lupa(SAC.sacado.M, ESC_JARRA), titulo:'Lo que se sacó', sub:fM(SAC.sacado.M) }));
    E.lupa('lj').titulo = 'Lo que queda'; fin && fin();
  });
}
function animarMezcla(fin){
  const a = E.vaso('a'), b = E.vaso('b'), cu = Math.round(300/ESC_MEZ.mLporCuadro);
  // los puntos de A entran por arriba de B
  E.pasar('a', 'b', () => true, (p, k) => ({ c: cu + (k % 4), u:p.u, v:p.v }));
  a.n = 0; a.mL = 0; a.etiqueta = 'A (vacío)'; b.n = MEZ.n; b.mL = 400; b.etiqueta = 'Mezcla';
  E.lupas = E.lupas.filter(l => l.id !== 'la');
  E.nivel('a', 0); E.nivel('b', 400, () => E.reubicar('b', 17, () => { E.lupaA('lb', MS.lupa(MEZ.M, ESC_MEZ)); Object.assign(E.lupa('lb'), { titulo:'La mezcla', sub:fM(MEZ.M) }); fin && fin(); }));
}

const dots = $('dots');
steps.forEach((s, k) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.textContent = k + 1; b.setAttribute('aria-label', `Ir al ${s.k.toLowerCase()}: ${s.t}`);
  b.addEventListener('click', () => go(k)); li.appendChild(b); dots.appendChild(li);
});
function go(k){
  if (k < 0 || k >= steps.length || k > S.max || S.ocupado) return;
  const s = steps[k]; S.step = k; S.listo = s.accion ? !!S.hecho.diluir : true;
  if (s.prep) s.prep();
  $('stepK').textContent = `${s.k} de ${steps.length}`;
  $('stepT').textContent = s.t;
  $('stepBody').innerHTML = s.body();
  pintarDots();
  if (s.gate) prediccion(s.gate);
  E.L.compactar(s.gate && !S.pred[s.gate.id]);
  if (s.accion) accion();
  if (s.explora) explorar();
  nav(); E.dibujar();
}
function nav(){
  const s = steps[S.step];
  $('prev').disabled = S.step === 0 || S.ocupado;
  const bloqueo = (s.gate && !S.pred[s.gate.id]) || (s.accion && !S.listo) || S.ocupado;
  $('next').disabled = S.step === steps.length - 1 || bloqueo;
  $('next').textContent = s.gate && !S.pred[s.gate.id] ? 'Elige una opción' : (s.accion && !S.listo ? 'Primero diluye' : 'Siguiente');
}
function pintarDots(){
  [...dots.querySelectorAll('button')].forEach((b, k) => {
    b.className = k === S.step ? 'on' : (k <= S.max ? 'done' : ''); b.disabled = k > S.max;
    if (k === S.step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
}
function desbloquear(k){ if (k > S.max) S.max = k; }
function accion(){
  const b = $('diluir');
  if (S.hecho.diluir){ b.disabled = true; b.textContent = 'Listo: 200 mL'; return; }
  b.onclick = () => {
    b.disabled = true; S.ocupado = true; nav(); $('estado').textContent = 'Agregando agua…';
    animarDilucion(() => {
      S.ocupado = false; S.hecho.diluir = true; S.listo = true; b.textContent = 'Listo: 200 mL';
      $('estado').textContent = 'Los 24 puntos siguen ahí, repartidos en 8 cuadros: 3 por cuadro.';
      $('tras').hidden = false; desbloquear(S.step + 1); pintarDots(); nav();
    });
  };
}
function prediccion(P){
  const btns = [...$('stepBody').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[P.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === P.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb'); fb.textContent = P.fb[p]; fb.className = 'fb ' + (p === P.ok ? 'ok' : 'mal');
    $('tras').hidden = false;
  };
  const t0 = Date.now();
  btns.forEach(b => b.addEventListener('click', () => {
    if (S.pred[P.id] || S.ocupado) return;
    const o = P.opts.find(q => q[0] === b.dataset.k);
    S.pred[P.id] = o[0]; desbloquear(S.step + 1); pintar(); pintarDots();
    registrarPrediccion(P.id, o[0], o[0] === P.ok, o[2] || '', o[3] || '', t0);
    S.ocupado = true; nav();
    P.anima(() => { S.ocupado = false; nav(); });
    $('next').focus({ preventScroll:Celular.chico() });
    const paso = S.step; E.L.compactar(false); Celular.alResponder(E.L.cv, E.dibujar, () => S.step === paso);
  }));
  pintar();
}

  for (let T = 0; T <= 70; T += 10) linea(ctx, X(T), m.t, X(T), m.b);
  for (let s = 0; s <= 140; s += 20) linea(ctx, m.l, Y(s), m.r, Y(s));
  ctx.strokeStyle = c.muted; ctx.lineWidth = 1.4; linea(ctx, m.l, m.b, m.r, m.b); linea(ctx, m.l, m.b, m.l, m.t);
  ctx.fillStyle = c.muted; ctx.font = `700 10px ${c.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let T = 0; T <= 70; T += (m.r - m.l) < 260 ? 20 : 10) ctx.fillText(String(T), X(T), m.b + 4);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let s = 0; s <= 140; s += 20) ctx.fillText(String(s), m.l - 5, Y(s));
  ctx.restore();
  rotulo(ctx, c, m.r, m.b + 21, 'T (°C)', c.ink, 'right', 700, 10);
  rotulo(ctx, c, m.l - 34, m.t - 16, 'g de soluto por 100 g de agua', c.ink, 'left', 700, 10);
  const trazar = (pts, dash, ancho) => { ctx.save(); ctx.strokeStyle = c.S; ctx.lineWidth = ancho; ctx.setLineDash(dash); ctx.beginPath();
    pts.forEach(([T, s], i) => i ? ctx.lineTo(X(T), Y(s)) : ctx.moveTo(X(T), Y(s))); ctx.stroke(); ctx.restore(); };
  trazar(CURVA.KNO3, [], E.hl === 'S' ? 4 : 2.6);
  rotulo(ctx, c, X(68), Y(MS.solubilidad('KNO3', 70)) + 12, 'KNO₃', c.S, 'right', 800, 11);
  if (VS.ver){ trazar(CURVA.NaCl, [6, 4], E.hl === 'S' ? 3 : 2); rotulo(ctx, c, X(68), Y(MS.solubilidad('NaCl', 70)) - 11, 'NaCl', c.S, 'right', 800, 11); }
  // camino recorrido y punto del vaso (T, gramos disueltos por 100 g de agua)
  if (VS.ver && VS.hist.length > 1){ ctx.save(); ctx.strokeStyle = c.g; ctx.globalAlpha = .45; ctx.lineWidth = 1.6; ctx.beginPath();
    VS.hist.forEach(([T, s], i) => i ? ctx.lineTo(X(T), Y(s)) : ctx.moveTo(X(T), Y(s))); ctx.stroke(); ctx.restore(); }
  const px = X(VS.T), py = Y(VS.eq.disuelto);
  if (VS.ver && VS.eq.solido > 0.05){
    ctx.save(); ctx.strokeStyle = c.g; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.6; linea(ctx, px, py, px, Y(CR.g));
    ctx.setLineDash([]); ctx.beginPath(); ctx.arc(px, Y(CR.g), 4, 0, Math.PI*2); ctx.stroke(); ctx.restore();
    rotulo(ctx, c, px + 8, (py + Y(CR.g))/2, `sólido ${fmt(VS.eq.solido, 1)} g`, c.g, 'left', 800, 10);
  }
  ctx.beginPath(); ctx.arc(px, py, E.hl === 'g' ? 7 : 5.5, 0, Math.PI*2); ctx.fillStyle = c.g; ctx.fill();
  ctx.strokeStyle = c.paper; ctx.lineWidth = 1.5; ctx.stroke();
  // A la izquierda de 45 °C, ya respondido, el rótulo va debajo y a la derecha del punto: ahí no pasan las curvas.
  const izq = px > X(45), abajo = VS.ver && !izq;
  rotulo(ctx, c, px + (izq ? -10 : 10), py + (abajo ? 16 : -12), VS.ver ? `vaso · ${TIPO[VS.eq.tipo]}` : 'vaso', c.ink, izq ? 'right' : 'left', 800, 11);
}

const GAS = { P:2, T:[10, 30], kg:0.5, gPunto:0.1 };
const CMP = MS.compararGasT({ gas:'CO2', T1:GAS.T[0], T2:GAS.T[1], P:GAS.P, kgAgua:GAS.kg });
const GS = { P:GAS.P, abierta:false, ver:false, bot:[], last:0, gen:0 };
const gasDe = T => GS.abierta ? MS.destapar({ gas:'CO2', T, P1:GS.P, kgAgua:GAS.kg }).despues : MS.henry({ gas:'CO2', T, P:GS.P, kgAgua:GAS.kg }).g;
const Pactual = () => GS.abierta ? MS.P_AIRE.CO2 : GS.P;
function gsIniciar(ver){
  GS.ver = ver; GS.P = GAS.P; GS.abierta = false; GS.gen++;
  GS.bot = GAS.T.map(T => ({ T, dis:[], gas:[] }));
  gsAjustar(true);
}
function gsAjustar(ya){
  const now = performance.now();
  for (const b of GS.bot){
    const meta = Math.round(gasDe(b.T)/GAS.gPunto);
    let vivos = b.dis.filter(p => !p.sale);
    while (vivos.length > meta){ const p = vivos[Math.floor(azarSol()*vivos.length)]; if (ya) b.dis.splice(b.dis.indexOf(p), 1); else p.sale = now; vivos = b.dis.filter(q => !q.sale); }
    while (vivos.length < meta){ const p = { u:.1 + .8*azarSol(), v: ya ? .1 + .8*azarSol() : .04, ang:azarSol()*Math.PI*2, sale:0 }; b.dis.push(p); vivos.push(p); }
    const mg = GS.abierta ? 0 : Math.round(GS.P*4);
    let gv = b.gas.filter(p => !p.sale);
    while (gv.length > mg){ const p = gv.pop(); if (ya) b.gas.splice(b.gas.indexOf(p), 1); else p.sale = now; }
    while (gv.length < mg){ const p = { u:.1 + .8*azarSol(), v:.15 + .7*azarSol(), ang:azarSol()*Math.PI*2, sale:0 }; b.gas.push(p); gv.push(p); }
  }
}
function dibujarGaseosa(ctx, c, W, H, now){
  const dt = GS.last ? Math.min(.05, (now - GS.last)/1000) : 0; GS.last = now;
  const n = GS.bot.length, colW = W/n;
  const hb = clamp(H - 92, 120, 380), wb = clamp(Math.min(colW*0.5, hb*0.55), 60, 150);
  GS.bot.forEach((b, k) => {
    const cx = colW*(k + .5), x = cx - wb/2, base = H - 46, top = base - hb, cuello = wb*0.34;
    const yLiq = top + hb*0.30, hl = base - yLiq;
    // cuerpo de la botella (hombros hacia el cuello) y la tapa
    ctx.save(); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.beginPath();
    ctx.moveTo(cx - cuello/2, top); ctx.lineTo(cx - cuello/2, top + hb*0.08); ctx.quadraticCurveTo(x, top + hb*0.12, x, top + hb*0.24);
    ctx.lineTo(x, base - 8); ctx.quadraticCurveTo(x, base, x + 8, base); ctx.lineTo(x + wb - 8, base); ctx.quadraticCurveTo(x + wb, base, x + wb, base - 8);
    ctx.lineTo(x + wb, top + hb*0.24); ctx.quadraticCurveTo(x + wb, top + hb*0.12, cx + cuello/2, top + hb*0.08); ctx.lineTo(cx + cuello/2, top); ctx.stroke(); ctx.restore();
    if (!GS.abierta){ rr(ctx, cx - cuello/2 - 4, top - 12, cuello + 8, 12, 3); ctx.fillStyle = c.ink; ctx.fill(); }
    // líquido: 0,5 kg de agua en 4 cuadros
    ctx.save(); ctx.fillStyle = c.solv; ctx.globalAlpha = c.liquido; ctx.fillRect(x + 1, yLiq, wb - 2, hl - 1); ctx.restore();
    ctx.save(); ctx.strokeStyle = c.solv; ctx.lineWidth = E.hl === 'solv' ? 2 : 1; ctx.globalAlpha = E.hl === 'solv' ? .95 : .55; ctx.setLineDash([3, 3]);
    linea(ctx, cx, yLiq, cx, base); linea(ctx, x, yLiq + hl/2, x + wb, yLiq + hl/2); ctx.restore();
    ctx.save(); ctx.strokeStyle = c.solv; ctx.lineWidth = 2; linea(ctx, x, yLiq, x + wb, yLiq); ctx.restore();
    // gas sobre el líquido (presión del CO₂)
    const rg = clamp(wb*0.035, 2.4, 4.2)*(E.hl === 'P' ? 1.4 : 1);
    const gx0 = x + 6, gw = wb - 12, gy0 = top + hb*0.12, gh = yLiq - gy0 - 4;
    b.gas = b.gas.filter(p => !p.sale || now - p.sale < 900);
    for (const p of b.gas){
      if (p.sale){ p.v -= dt*1.2; } else {
        p.ang += (azarSol() - .5)*dt*4; p.u += Math.cos(p.ang)*.35*dt; p.v += Math.sin(p.ang)*.35*dt;
        if (p.u < .05 || p.u > .95){ p.u = clamp(p.u, .05, .95); p.ang = Math.PI - p.ang; }
        if (p.v < .05 || p.v > .95){ p.v = clamp(p.v, .05, .95); p.ang = -p.ang; }
      }
      const a = p.sale ? Math.max(0, 1 - (now - p.sale)/900) : 1, px = p.sale ? cx + (p.u - .5)*cuello : gx0 + p.u*gw;
      ctx.save(); ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(px, gy0 + p.v*gh, rg, 0, Math.PI*2); ctx.fillStyle = c.P; ctx.fill(); ctx.restore();
    }
    if (!GS.ver){
      ctx.save(); rr(ctx, x + 3, yLiq + 3, wb - 6, hl - 7, 8); ctx.fillStyle = c.card; ctx.fill(); ctx.strokeStyle = c.line; ctx.stroke();
      ctx.fillStyle = c.muted; ctx.font = `800 ${Math.round(clamp(wb*0.25, 18, 30))}px ${c.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', cx, yLiq + hl/2); ctx.restore();
    } else {
      const rp = clamp(wb*0.03, 2.2, 3.8)*(E.hl === 'g' ? 1.4 : 1);
      b.dis = b.dis.filter(p => !p.sale || p.v > -0.05);
      for (const p of b.dis){
        if (p.sale){ p.v -= dt*(RM ? 6 : .55); } else {
          p.ang += (azarSol() - .5)*dt*4; p.u += Math.cos(p.ang)*.16*dt; p.v += Math.sin(p.ang)*.16*dt;
          if (p.u < .06 || p.u > .94){ p.u = clamp(p.u, .06, .94); p.ang = Math.PI - p.ang; }
          if (p.v < .06 || p.v > .94){ p.v = clamp(p.v, .06, .94); p.ang = -p.ang; }
        }
        const px = x + p.u*wb, py = yLiq + Math.max(0, p.v)*hl;
        ctx.beginPath(); ctx.arc(px, py, p.sale ? rp*1.5 : rp, 0, Math.PI*2);
        if (p.sale){ ctx.strokeStyle = c.g; ctx.lineWidth = 1.4; ctx.stroke(); } else { ctx.fillStyle = c.g; ctx.fill(); }
      }
    }
    rotulo(ctx, c, cx, top - 26, `${b.T} °C`, c.ink, 'center', 800, 13);
    // rótulo de la presión con fondo opaco, encima de los puntos de gas
    { const t = GS.abierta ? 'destapada' : `P = ${fmt(GS.P, 0)} atm`; ctx.font = `800 11px ${c.font}`; const tw = ctx.measureText(t).width;
      rr(ctx, cx - tw/2 - 5, gy0 + gh/2 - 9, tw + 10, 18, 9); ctx.fillStyle = c.paper; ctx.fill();
      ctx.fillStyle = c.P; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, cx, gy0 + gh/2); }
    rotulo(ctx, c, cx, base + 13, '0,5 kg de agua', c.solv, 'center', 800, 11);
    if (GS.ver) rotulo(ctx, c, cx, base + 29, `${fmt(gasDe(b.T), GS.abierta ? 4 : 2)} g de CO₂ disuelto`, c.g, 'center', 800, 11);
  });
}
const descGaseosa = () => GS.ver

          ['b','8: la mitad, porque la concentración baja a la mitad','SO7-baja-como-cantidad','documentado'],
          ['c','Los mismos 16',null],
          ['d','Ninguno: la sal se termina de disolver y ya no está','SO2-no-se-ve-no-esta','parcial']],
    ok:'c',
    fb:{ a:'La sal ya estaba disuelta: el agua no la "termina de disolver" ni hace desaparecer puntos. Siguen los 16; solo se reparten en el doble de cuadros.',
      b:'Lo que baja a la mitad es la concentración (puntos por cuadro), no la cantidad de sal: siguen los 16 puntos.',
      d:'Que la sal disuelta no se vea no quiere decir que no esté: sus partículas siguen en el agua.' },
    antes:ver => E.config({ esc:ESC_AGUA, vasos:[{ id:'s', cap:4, n:AGUA.n, mL: ver ? 400 : 200, etiqueta:'Salmuera', sem:91 }],
      lupas:[{ id:'ls', vaso:'s', cuenta:MS.lupa(ver ? AGUA.M2 : 1, ESC_AGUA), sub:fM(ver ? AGUA.M2 : 1) }] }),
    despues:() => { const s = E.vaso('s'); s.mL = 400; E.nivel('s', 400, () => E.reubicar('s', 93, () => { E.lupaA('ls', MS.lupa(AGUA.M2, ESC_AGUA)); E.lupa('ls').sub = fM(AGUA.M2); })); },
    exp:() => `<div class="eqs"><div class="eq">${n('n')} = ${Mm('1')} · ${Vv('0,2')} = ${n('0,2 mol')} antes y después<span class="note">16 puntos</span></div>
      <div class="eq">${Mm('M₂')} = ${fr(n('0,2'), Vv('0,4'))} = ${Mm(fM(AGUA.M2))}<span class="note">de 4 a 2 puntos por cuadro</span></div></div>
      <p>Diluir no cambia la cantidad de soluto: la misma sal se reparte en más volumen. Lo que baja a la mitad es la concentración, no los moles.</p>
      <p class="fuente">Al diluir al doble, el 84 % eligió el dibujo correcto, pero solo el 51 % lo justificó bien; el 21 % sostuvo que "el agua disuelve más soluto" (Adadan y Savasci, 2012). Niaz (1995) encontró la misma idea en universitarios. Ante azúcar disuelta, el 28 % eligió un recuadro vacío (de Berg, 2012). Los tres, citados por Raviolo y Farré (2020).</p>` },
  { id:'unidades', corto:'¿Entre qué se divide?',
    q:`Se disuelven ${G('20 g')} de NaOH en ${Sv('80 g')} de agua. ¿Cuál es el porcentaje en masa de NaOH?`,
    opts:[['a','25 %: 20 entre 80','pct-sobre-solvente','hipotesis'],
          ['b','20 %',null],
          ['c','No se puede saber sin el volumen','SO14-que-mide-cada-unidad','parcial'],
          ['d','80 %: el agua entre la solución','confunde-soluto-solvente','hipotesis']],
    ok:'b',
    antes:ver => { U.ver = ver; E.config({ vasos:[], lupas:[], extra:barrasUnidades, leyenda:`<span><i style="background:var(--c-g)"></i>masa de soluto</span><span><i style="background:var(--c-solv)"></i>solvente (agua): su masa y sus moles</span><span><i style="background:var(--c-n)"></i>n · moles de soluto</span><span><i style="background:var(--c-V)"></i>V · volumen de solución</span>`,
      descr:() => U.ver ? `Unidad: ${UNIDADES[U.unidad].t}. Masa de solución 100 g: 20 g de NaOH y 80 g de agua; 0,5 mol de NaOH y 4,44 mol de agua; 83,3 mL de solución.` : 'Masa de solución: 20 g de NaOH y 80 g de agua.' }); },
    despues:() => { U.ver = true; },
    ctrl:() => `<div class="seg" role="group" aria-label="Unidad de concentración">${Object.entries(UNIDADES).map(([k, u]) => `<button type="button" data-uni="${k}" aria-pressed="${U.unidad === k}">${u.t}</button>`).join('')}</div><div id="uni-eq"></div>`,
    exp:() => `<p>Todas las unidades son una razón: algo del soluto <b>arriba</b> y algo de la solución o del solvente <b>abajo</b>. Lo que cambia de una a otra es qué va abajo. Toca cada unidad y mira qué parte del dibujo divide.</p>
      <p class="fuente">De 131 futuros profesores de ciencias, solo el 1,5 % definió bien "concentración"; el 29,0 % definió bien el % en masa, el 19,8 % el % en volumen y el 12,2 % el % masa-volumen, que el 55,7 % dejó sin responder (Karaer, 2019, tablas 2 y 3). Dividir entre el solvente para el % en masa es una hipótesis nuestra, ligada a ese dato.</p>` },
  { id:'normalidad', corto:'Normalidad',
    q:`Se disuelven ${G('49 g')} de H₂SO₄ en agua y se completa hasta ${Vv('500 mL')}: la solución es ${Mm('1 M')}. ¿Cuál es su normalidad, si el ácido entrega sus dos H⁺?`,
    opts:[['a','1 N: igual que la molaridad','SO15-N-igual-M','parcial'],
          ['b','0,5 N: se divide entre θ = 2','N-divide-theta','hipotesis'],
          ['c','2 N',null],
          ['d','4 N','N-multiplica-dos-veces','hipotesis']],
    ok:'c',
    antes:ver => E.config({ esc:ESC_NOR, vasos:[{ id:'h', cap:3, n:NOR.n, mL:500, etiqueta:'H₂SO₄', sem:101, iones: ver ? 2 : 0 }],
      lupas:[{ id:'lh', vaso:'h', cuenta:MS.lupa(NOR.M, ESC_NOR), iones: ver ? 2 : 0, sub: ver ? '' : fM(NOR.M), subEq: ver ? '8 H⁺ → 2 N' : '' }],
      leyenda: leyendaBase(ESC_NOR, `<span><i class="pt" style="background:var(--c-eq)"></i>H⁺ · equivalentes</span>`) }),
    despues:() => { E.iones('h', 2); E.lupa('lh').sub = ''; E.lupa('lh').subEq = '8 H⁺ → 2 N'; },
    exp:() => `<div class="eqs"><div class="eq">${n('n')} = ${fr(G('49 g'), '98 g/mol')} = ${n(fmol(NOR.n))} · ${Mm('M')} = ${fr(n('0,5'), Vv('0,5'))} = ${Mm(fM(NOR.M))}</div>
      <div class="eq">${Q('θ = 2')} H⁺ por fórmula → ${Q(`${fmt(NOR.eq, 0)} equivalente`)} </div><div class="eq">${Q('N')} = ${fr(Q('1 eq'), Vv('0,5 L'))} = ${Q('2 N')}</div><div class="eq">${Q('N')} = ${Mm('M')} · ${Q('θ')} = ${Mm('1')} · ${Q('2')} = ${Q(`${fmt(NOR.N, 0)} N`)}</div></div>
      <p>Cada H₂SO₄ puede entregar dos H⁺ al reaccionar con una base (los puntos morados). La lupa tenía 4 fórmulas y ahora cuenta 8 H⁺: hay el doble de H⁺ que de moléculas. La normalidad cuenta equivalentes (los H⁺ que puede entregar), no fórmulas. Por eso N = M · θ no es una regla suelta: sale de contar.</p>
      <p class="fuente">De 131 futuros profesores de ciencias, el 62,6 % definió bien la normalidad, pero solo el 29,8 % el número de equivalentes: la autora lo interpreta como uso de N = M · θ sin contar equivalentes (Karaer, 2019, tabla 3). Las opciones 0,5 N y 4 N son hipótesis nuestras, sin estudio que las mida.</p>` },  { id:'enfriar', corto:'Enfriar el vaso',
    q:`Un vaso tiene ${Sv('100 g de agua')} a 60 °C con ${G(`${fmt(CR.g, 0)} g de KNO₃`)}, todo disuelto. Se enfría hasta 20 °C, agitando y con un cristalito de KNO₃ dentro. Cada cuadro del dibujo es una porción de 25 g de agua, no de solución. Con la ${S_('curva de solubilidad')}, ¿qué pasa?`,
    opts:[['a',`Cristalizan unos ${fmt(ENF.cristaliza, 0)} g; el líquido que queda está insaturado, porque ya es diluido`,'SO13-diluida-es-insaturada','parcial'],
          ['b','No cristaliza nada; lo que ya se disolvió no vuelve a ser sólido','cristal-no-vuelve','hipotesis'],
          ['c',`Cristalizan unos ${fmt(ENF.errores.laSolubilidad, 0)} g; el líquido que queda está saturado`,'cristaliza-la-solubilidad','hipotesis'],
          ['d',`Cristalizan unos ${fmt(ENF.cristaliza, 0)} g; el líquido que queda está saturado`,null]],
    ok:'d',
    fb:{ a:`La cantidad está bien, pero el líquido que queda sobre los cristales está saturado: tiene justo lo que cabe a 20 °C (${fmt(ENF.cabe2, 1)} g). Saturada quiere decir que ya no admite más a esa temperatura, haya poco o mucho soluto; diluida solo dice que hay poco.`,
      b:`Lo disuelto sí vuelve a ser sólido: a 20 °C, en 100 g de agua solo caben ${fmt(ENF.cabe2, 1)} g, y con el cristalito y la agitación lo que sobra se separa como cristales.`,
      c:`${fmt(ENF.cabe2, 1)} g es lo que marca la curva a 20 °C: lo que se queda disuelto, no lo que cristaliza. Cristaliza lo que sobra.` },
    antes:ver => { vsIniciar(ver); E.config({ vasos:[], lupas:[], extra:dibujarCristal, descr:descCristal,
      leyenda:leyCristal(ver) }); },
    despues:() => { $('leyenda2').innerHTML = leyCristal(true); VS.ver = true; VS.hist = [[VS.T, VS.eq.disuelto]]; vsIrA(CR.T2, vsLeer); },
    ctrl:() => vsControles(),
    enlazar:vsEnlazar,
    exp:() => `<div class="eqs">
        <div class="eq">60 °C: caben ${S_(`${fmt(ENF.cabe1, 0)} g`)} y hay ${G(`${fmt(CR.g, 0)} g`)}<span class="note">insaturada: todavía admite ${fmt(ENF.cabe1 - CR.g, 0)} g más</span></div>
        <div class="eq">20 °C: caben ${S_(`${fmt(ENF.cabe2, 1)} g`)} → cristalizan ${G(`${fmt(CR.g, 0)} − ${fmt(ENF.cabe2, 1)} = ${fmt(ENF.cristaliza, 1)} g`)}</div>
        <div class="eq">Empieza a cristalizar a unos ${fmt(ENF.Tsat, 0)} °C<span class="note">donde la curva baja a ${fmt(CR.g, 0)} g</span></div></div>
      <p>El líquido que queda sobre los cristales está <b>saturado</b>: tiene justo lo que cabe a esa temperatura, y el punto del vaso baja por la curva. <b>Saturada, insaturada y sobresaturada</b> comparan lo disuelto con lo que cabe a esa temperatura (la curva). <b>Diluida y concentrada</b> solo dicen si hay poco o mucho soluto. Por eso a 60 °C el vaso era concentrado e insaturado, y una sal poco soluble puede dar una solución diluida y saturada.</p>
      <p>Con NaCl (la curva a trazos) casi no cristaliza nada: ${fmt(37, 0)} g a 60 °C dejan apenas ${fmt(NACL.cristaliza, 1)} g de cristales al bajar a 20 °C, porque su curva es casi plana. Cambia la temperatura y prueba sin cristalito: si se enfría despacio y sin agitar, puede quedar más disuelto de lo que cabe. Esa solución es <b>sobresaturada</b>: el punto queda encima de la curva, y un cristalito la hace cristalizar de golpe.</p>
      <p class="fuente">De 131 futuros profesores de ciencias, más de la mitad definió mal «solución diluida» y solo cerca de uno de cada cuatro la definió bien; las definiciones erróneas usaban «lo que el solvente puede disolver», que es lo que define a la saturada (Karaer, 2019). Que no cristalice nada o que cristalice lo que marca la curva son hipótesis nuestras, sin estudio que las mida. La curva usa valores de tabla redondeados, unidos en línea recta.</p>` },
  { id:'gaseosa', corto:'Dos gaseosas',
    q:`Dos botellas cerradas de la misma gaseosa tienen CO₂ a la misma presión sobre el líquido, ${Pp(`${fmt(GAS.P, 0)} atm`)}. Una está en la refrigeradora a ${GAS.T[0]} °C y la otra al sol a ${GAS.T[1]} °C. Cuando cada una se asienta, ¿en cuál hay más ${G('CO₂ disuelto')}? (Cada cuadro del dibujo es una porción de 125 g de agua, no de solución.)`,
    opts:[['a','En la de 10 °C: en frío el agua retiene más gas',null],
          ['b','En la de 30 °C: el calor ayuda a disolver, como con el azúcar','SO6-gas-mas-en-caliente','parcial'],
          ['c','Igual en las dos: con la misma presión, la temperatura no cuenta','gas-solo-presion','hipotesis'],
          ['d','En ninguna: el CO₂ no se disuelve, solo forma las burbujas','gas-no-se-disuelve','hipotesis']],
    ok:'a',
    fb:{ b:`Con muchos sólidos pasa eso, pero con los gases es al revés: al calentar, las moléculas de gas escapan más fácil del líquido. A ${GAS.T[0]} °C quedan ${fmt(CMP.g1, 2)} g disueltos y a ${GAS.T[1]} °C, ${fmt(CMP.g2, 2)} g.`,
      c:`La presión importa (más presión, más gas disuelto), pero la temperatura también: con la misma presión, la botella fría retiene casi el doble de CO₂ que la de ${GAS.T[1]} °C.`,
      d:'Las burbujas salen del CO₂ que estaba disuelto: en la botella cerrada el gas está repartido entre las moléculas de agua, sin verse.' },
    antes:ver => { gsIniciar(ver); E.config({ vasos:[], lupas:[], extra:dibujarGaseosa, descr:descGaseosa,
      leyenda:`<span><i class="pt" style="background:var(--c-g)"></i>CO₂ disuelto (cada punto: ${fmt(GAS.gPunto, 1)} g)</span><span><i style="background:var(--c-solv)"></i>agua (cada cuadro: 125 g)</span><span><i class="pt" style="background:var(--c-P)"></i>P · CO₂ gaseoso sobre el líquido (más puntos, más presión)</span>` }); },
    despues:() => { GS.ver = true; gsAjustar(true); E.dibujar(); },
    ctrl:() => gsControles(),
    enlazar:gsEnlazar,
    exp:() => `<div class="eqs">
        <div class="eq">Ley de Henry: ${S_('S')} = k · ${Pp('P')}<span class="note">k es lo que se disuelve con 1 atm del gas; baja al calentar</span></div>
        <div class="eq">${GAS.T[0]} °C: k = ${fmt(MS.solubilidad('CO2', GAS.T[0]), 3)} g/(kg·atm) → ${S_('S')} = ${fmt(MS.solubilidad('CO2', GAS.T[0]), 3)} · ${Pp(`${fmt(GAS.P, 0)} atm`)} = ${S_(`${fmt(CMP.S1, 2)} g/kg`)} → en 0,5 kg, ${G(`${fmt(CMP.g1, 2)} g`)}</div>
        <div class="eq">${GAS.T[1]} °C: k = ${fmt(MS.solubilidad('CO2', GAS.T[1]), 3)} g/(kg·atm) → ${S_('S')} = ${fmt(MS.solubilidad('CO2', GAS.T[1]), 3)} · ${Pp(`${fmt(GAS.P, 0)} atm`)} = ${S_(`${fmt(CMP.S2, 2)} g/kg`)} → en 0,5 kg, ${G(`${fmt(CMP.g2, 2)} g`)}</div></div>
      <p>Un gas se disuelve <b>menos</b> al subir la temperatura y <b>más</b> al subir su presión sobre el líquido. Al destapar, la presión del CO₂ baja a la del aire y casi todo el gas sale en burbujas; en caliente sale más rápido y la gaseosa «se pasa». Por lo mismo, el agua tibia de un río lleva menos oxígeno para los peces. Prueba con las presiones.</p>
      <p class="fuente">En entrevistas con 6 futuros profesores de química, uno dijo que el gas se disuelve más al subir la temperatura y otro, que se disuelve menos al subir la presión; la mitad sabía que las dos influyen, pero no explicó por qué (Dindar y otros, 2010). Son casos, no porcentajes. Las opciones «igual en las dos» y «el CO₂ no se disuelve» son hipótesis nuestras. La k sale de una tabla de solubilidad del CO₂ con valores redondeados, y los 2 atm son un valor de ejemplo.</p>` },
];
const S = { k:0, pred:{}, t0:Date.now() };
// Pastillas: la k solo se abre si todos los experimentos anteriores ya tienen respuesta;
// las respondidas se revisitan libres (misma regla que los puntos del paso a paso).
function primeraLibre(){ const j = EXPS.findIndex(x => !S.pred[x.id]); return j < 0 ? EXPS.length - 1 : j; }
function botones(){
  const libre = primeraLibre();
  $('exps').innerHTML = EXPS.map((x, k) => k > libre
    ? `<button type="button" aria-pressed="false" data-k="${k}" disabled aria-disabled="true" aria-label="Experimento ${k+1}, bloqueado">${k+1}. ${x.corto}</button>`
    : `<button type="button" aria-pressed="${k === S.k}" data-k="${k}">${k+1}. ${x.corto}</button>`).join('');
  $('exps').querySelectorAll('button').forEach(b => b.onclick = () => ir(+b.dataset.k));
}
function pintarUnidad(){
  const u = UNIDADES[U.unidad], d = $('uni-eq'); if (!d) return;
  d.innerHTML = `<div class="eqs"><div class="eq">${u.eq()}</div></div><p>${u.d}</p>`;
}
function ir(k){
  if (k > primeraLibre()) return;
  S.k = k; S.t0 = Date.now();
  const x = EXPS[k];
  x.antes(!!S.pred[x.id]);
  E.L.compactar(!S.pred[x.id]);
  botones();
  $('k2').textContent = `¿Qué pasa si…? · ${k+1} de ${EXPS.length}`;
  $('t2').textContent = x.corto;
  $('body2').innerHTML = `<p>${x.q}</p>
    <div class="opts">${x.opts.map(([l, t]) => `<button class="opt" type="button" data-k="${l}"><span class="l">${l.toUpperCase()}</span><span>${t}</span></button>`).join('')}</div>
    <p class="fb" id="fb2"></p><div id="res2" class="body"></div>`;
  const btns = [...$('body2').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[x.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === x.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb2');
    fb.textContent = p === x.ok ? '¡Bien pensado! Mira la escena para ver por qué.' : (x.fb && x.fb[p]) || 'Mira la escena: ahí se ve qué pasa de verdad.';
    fb.className = 'fb ' + (p === x.ok ? 'ok' : 'mal');
    $('res2').innerHTML = (x.ctrl ? x.ctrl() : '') + x.exp() + (k < EXPS.length - 1 ? `<div class="nav"><span></span><button type="button" class="btn primary" id="sig2">Siguiente: ${EXPS[k+1].corto}</button></div>` : '');
    $('res2').querySelectorAll('[data-uni]').forEach(b => b.onclick = () => { U.unidad = b.dataset.uni; $('res2').querySelectorAll('[data-uni]').forEach(y => y.setAttribute('aria-pressed', String(y === b))); pintarUnidad(); E.dibujar(); });
    pintarUnidad();
    if (x.enlazar) x.enlazar();
    const sig = $('sig2'); if (sig) sig.onclick = () => { ir(k + 1); document.querySelector('#m2').scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); };
  };
  btns.forEach(b => b.onclick = () => {
    if (S.pred[x.id]) return;
    const o = x.opts.find(q => q[0] === b.dataset.k);
    S.pred[x.id] = o[0]; botones(); pintar(); E.L.compactar(false);
    Celular.alResponder(E.L.cv, () => { x.despues(); E.dibujar(); }, () => S.k === k);
    registrarPrediccion('que-pasa-si-' + x.id, o[0], o[0] === x.ok, o[2] || '', o[3] || '', S.t0);
  });
  pintar(); E.dibujar();
}
ir(0);
jugarSal(E, 'juego2', [...document.querySelectorAll('#m2 .guide > *')], () => ir(0));
})();
</script>

<script>
/* ================= Pestañas ================= */
(function(){
  const modos = [['#paso-a-paso', 'm1', 'tab1'], ['#que-pasa-si', 'm2', 'tab2']];
  function route(){
    const k = Math.max(0, modos.findIndex(m => m[0] === location.hash));
    modos.forEach(([, m, t], j) => {
      document.getElementById(m).hidden = j !== k;
      const a = document.getElementById(t);
      if (j === k) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    dispatchEvent(new Event('modo'));
  }
  addEventListener('hashchange', route); route();
})();
</script>
