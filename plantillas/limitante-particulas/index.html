<!doctype html>
<html lang="es" data-curso="quimica">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reactivo limitante</title>
<style>
/* Cáscara acogedora (crema, tarjetas cálidas, esquinas redondas; docs/diseno.md).
   Dentro del dibujo y de las ecuaciones solo mandan los colores de las variables (regla 4):
   cada elemento con su color de la paleta común (nucleo/elementos.js: N azul, H turquesa, O rojo, Cl verde, Al celeste,
   C gris), productos morado, mol mostaza y g siena. ΔE00 mínimo entre lo que sale junto: 20,8 en claro (O–g) y 21,6 en
   oscuro; contraste mínimo de los elementos 4,54 (AA), también en el chip al 8 %. */
[hidden]{display:none!important}
:root{
  --bg:#fbf3ec; --card:#fffaf6; --paper:#fdf7f1; --ink:#2d2340; --muted:#716579; --line:#efe3dc; --grid:#f3e8e0;
  --detras:#f6ece4; --acento:#ffd3e2; --acento-ink:#5c1f3d; --ok:#1d7f58; --warn:#c8363b;
  --shadow:0 1px 2px rgba(92,52,110,.05),0 10px 28px rgba(92,52,110,.09);
  --c-prod:#6b3dbd; --c-mol:#7d6a00; --c-g:#773922; --vidrio:#8e97a8; --letra-atomo:#ffffff;
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --detras:#211a2a; --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-prod:#ab8cf2; --c-mol:#e3c84a; --c-g:#e0a07a; --vidrio:#a99cb8; --letra-atomo:#1d1626; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1d1626; --card:#2a2135; --paper:#241c2e; --ink:#f1ebf7; --muted:#a99cb8; --line:#3a2f48; --grid:#2d2439;
  --detras:#211a2a; --acento:#4c2a40; --acento-ink:#ffe1ec; --ok:#4fd09a; --warn:#ff7b7f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --c-prod:#ab8cf2; --c-mol:#e3c84a; --c-g:#e0a07a; --vidrio:#a99cb8; --letra-atomo:#1d1626; color-scheme:dark }
/* Colores de los elementos: paleta común de química (nucleo/elementos.js). Este bloque sale de
   Elementos.css(['H', 'C', 'N', 'O', 'Al', 'Cl', 'Ca']) y no se edita a mano: nucleo/elementos-escenas.test.js lo compara. */
:root{ --el-H:#0f766e; --el-C:#6b6b6b; --el-N:#136caa; --el-O:#c4284e; --el-Al:#056ea3; --el-Cl:#466d14; --el-Ca:#6a5b8f }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --el-H:#5ed9c8; --el-C:#9a9a9a; --el-N:#4eb3f9; --el-O:#f17384; --el-Al:#38b6e8; --el-Cl:#a3d65e; --el-Ca:#deb0f5 } }
:root[data-theme="dark"]{ --el-H:#5ed9c8; --el-C:#9a9a9a; --el-N:#4eb3f9; --el-O:#f17384; --el-Al:#38b6e8; --el-Cl:#a3d65e; --el-Ca:#deb0f5 }

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 var(--font); -webkit-text-size-adjust:100%}
.wrap{max-width:1240px; margin:0 auto; padding-block:18px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid; gap:16px}
.top{display:grid; gap:12px}
.eyebrow{margin:0; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700}
h1{margin:2px 0 0; font-size:clamp(1.65rem, 4.4vw, 2.1rem); line-height:1.1; letter-spacing:-.01em}
.sub{margin:4px 0 0; color:var(--muted); font-size:.95rem; max-width:60ch}

.tabs{display:flex; gap:4px; padding:5px; border-radius:999px; background:var(--card); box-shadow:var(--shadow); justify-self:start; max-width:100%}
.tabs a{padding:9px 16px; border-radius:999px; color:var(--muted); text-decoration:none; font-weight:700; white-space:nowrap; font-size:.95rem}
.tabs a[aria-current="page"]{background:var(--ink); color:var(--card)}
.tabs a:hover:not([aria-current]){color:var(--ink)}

.mode{display:grid; gap:16px; min-width:0; align-items:start}
.bench{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:10px; display:grid; gap:8px; min-width:0}
.lienzo{border-radius:16px; overflow:hidden; background:var(--paper); border:1px solid var(--line)}
canvas{display:block; width:100%; touch-action:pan-y; -webkit-user-select:none; user-select:none}
canvas.arrastrable{cursor:grab}
canvas.agarrando{cursor:grabbing}
canvas.sin-scroll{touch-action:none}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; padding:2px 8px 4px; font-size:.82rem; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:4px; border-radius:2px; display:inline-block}

.guide{background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:20px; display:grid; gap:14px; min-width:0}
.dots{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.dots button{width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); color:var(--muted);
  font:700 .82rem var(--font); cursor:pointer; font-variant-numeric:tabular-nums}
.dots button.done{border-color:var(--ink); color:var(--ink)}
.dots button.on{background:var(--ink); border-color:var(--ink); color:var(--card)}
.dots button:disabled{opacity:.45; cursor:not-allowed}
#exps button:disabled{opacity:.45; cursor:not-allowed}
.step-k{display:inline-block; margin:0; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; font-weight:800;
  color:var(--acento-ink); background:var(--acento); border-radius:999px; padding:3px 10px}
.step-t{margin:8px 0 0; font-size:1.35rem; line-height:1.2; text-wrap:balance}
.body{display:grid; gap:12px; min-width:0}
.body p{margin:0; max-width:66ch}
.problem{border-left:4px solid var(--acento); padding:6px 0 6px 14px; font-size:1.06rem; max-width:66ch}
.map{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.map li{display:flex; gap:10px; align-items:baseline}
.map b{font-family:var(--mono); min-width:4.6em; flex:none}

.v{font-weight:800; border-radius:6px; padding:0 3px; cursor:pointer; text-decoration:underline dotted 1.5px; text-underline-offset:3px}
.v-N{color:var(--el-N); background:color-mix(in srgb, var(--el-N) 8%, transparent)}
.v-H{color:var(--el-H); background:color-mix(in srgb, var(--el-H) 8%, transparent)}
.v-O{color:var(--el-O); background:color-mix(in srgb, var(--el-O) 8%, transparent)}
.v-Cl{color:var(--el-Cl); background:color-mix(in srgb, var(--el-Cl) 8%, transparent)}
.v-Al{color:var(--el-Al); background:color-mix(in srgb, var(--el-Al) 8%, transparent)}
.v-C{color:var(--el-C); background:color-mix(in srgb, var(--el-C) 8%, transparent)}
.v-Ca{color:var(--el-Ca); background:color-mix(in srgb, var(--el-Ca) 8%, transparent)}
.v-prod{color:var(--c-prod); background:color-mix(in srgb, var(--c-prod) 12%, transparent)}
.v-mol{color:var(--c-mol); background:color-mix(in srgb, var(--c-mol) 12%, transparent)}
.v-g{color:var(--c-g); background:color-mix(in srgb, var(--c-g) 12%, transparent)}
.v.hl{background:color-mix(in srgb, currentColor 26%, transparent)}

.eqs{display:grid; gap:10px; padding:14px; border-radius:16px; background:var(--paper); border:1px solid var(--line); overflow-x:auto}
.eq{display:flex; flex-wrap:wrap; align-items:center; gap:.42em; font-family:var(--mono); font-size:1.05rem; white-space:nowrap; font-variant-numeric:tabular-nums}
.eq .note{font-family:var(--font); font-size:.84rem; color:var(--muted); margin-left:.5em; white-space:normal}
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.15}
.frac > span:first-child{border-bottom:1.5px solid currentColor; padding:0 .25em; align-self:stretch; text-align:center}
.frac > span:last-child{padding:0 .25em}
.answer{font-weight:700; padding:12px 16px; border-radius:16px; background:var(--paper); border:2px solid var(--c-prod); max-width:66ch}
.aviso{background:var(--acento); color:var(--acento-ink); border-radius:16px; padding:10px 14px; font-size:.93rem}

.opts{display:grid; grid-template-columns:1fr; gap:8px}
@media (min-width:560px){ .opts{grid-template-columns:repeat(2, minmax(0,1fr))} }
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; padding:12px 14px; border-radius:16px; border:2px solid var(--line);
  background:var(--paper); color:var(--ink); font:inherit; cursor:pointer; min-height:48px}
.opt .l{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:.85rem;
  background:var(--card); border:1.5px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 10%, var(--paper))}
.opt.correct .l{background:var(--ok); border-color:var(--ok); color:var(--card)}
.opt.wrong{border-color:var(--warn); background:color-mix(in srgb, var(--warn) 9%, var(--paper))}
.opt.wrong .l{background:var(--warn); border-color:var(--warn); color:var(--card)}
.fb{font-weight:700; margin:0}
.fb.ok{color:var(--ok)} .fb.mal{color:inherit}

.juego{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.juego[hidden]{display:none}
.juego .seg{border-radius:16px}
.juego .seg button{min-height:44px}
.juego .seg button[aria-pressed="true"]{background:var(--ink); color:var(--card)}
.ctrls{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap:12px; align-items:end}
.slider{display:grid; gap:4px}
.slider label{font-weight:700; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.slider output{font-family:var(--mono); color:var(--muted)}
input[type=range]{width:100%; accent-color:var(--ink); min-height:28px}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:.86rem; padding:4px 12px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); font-weight:700}
.chip.real{border-color:var(--c-prod); color:var(--c-prod)}
.chip.virt{border-style:dashed}
.seg{display:inline-flex; flex-wrap:wrap; gap:4px; padding:4px; border-radius:999px; background:var(--paper); border:1px solid var(--line); justify-self:start; max-width:100%}
.seg button{font:700 .9rem var(--font); padding:8px 14px; border-radius:999px; border:0; background:transparent; color:var(--muted); cursor:pointer; min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--card)}
.exps{border-radius:20px}

.nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.btn{font:700 .95rem var(--font); padding:11px 20px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; min-height:44px}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--card)}
.btn:disabled{opacity:.45; cursor:not-allowed}
button:focus-visible, .v:focus-visible, input:focus-visible, a:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.hint{font-size:.88rem; color:var(--muted)}
.fuente{font-size:.86rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:10px}
.pie{margin:4px 0 0; text-align:center; color:var(--muted); font-size:.95rem}
.pie a{color:var(--ink); font-weight:700}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.volver-app{display:inline-block; margin:12px 16px 0; background:var(--card); color:var(--ink); box-shadow:var(--shadow);
  font:700 14px var(--font); padding:8px 16px; border-radius:999px; text-decoration:none}

.barra{display:grid; gap:6px}
.fila{display:grid; grid-template-columns:7.2em 1fr; gap:8px; align-items:center; font-size:.86rem; font-weight:700}
.tiras{display:flex; height:28px; border-radius:8px; overflow:hidden; background:var(--grid)}
.tira{display:flex; align-items:center; justify-content:center; color:var(--card); font:700 .78rem var(--mono); white-space:nowrap; overflow:hidden; min-width:2px; border-right:2px solid var(--card)}
.tira:last-child{border-right:0}

.check{display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:.92rem; cursor:pointer; min-height:44px}
.check input{width:20px; height:20px; accent-color:var(--ink)}

/* Pantalla grande (laboratorio de cómputo, 1366 × 768): dibujo a la izquierda, fijo; guía a la derecha. */
@media (min-width:900px){
  .top{grid-template-columns:1fr auto; align-items:end}
  .mode{grid-template-columns:minmax(0, 1.4fr) minmax(360px, 1fr)}
  .bench{position:sticky; top:12px}
}

<script>
// Registro anónimo de predicciones (nucleo/medicion.js). Solo guarda si el alumno entró por la app.
const PLANTILLA = { id: 'limitante-particulas', unidad: 'quimica.estequiometria', version: '0.1.0' };
function registrarPrediccion(problema, opcion, correcta, error, respaldo, t0){
  if (!window.Medicion) return;
  Medicion.guardar({ tipo: 'prediccion', modulo: PLANTILLA.id, unidad: PLANTILLA.unidad, problema, opcion, correcta,
    error: correcta ? '' : error, respaldo: correcta ? '' : respaldo, ms: t0 ? Date.now() - t0 : '' }, PLANTILLA.version);
}

/* ================= Piezas compartidas =================
   Toda la química sale de MotorReaccion (motor.js); aquí solo se pinta. */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = Celular.variable; // guardada hasta que cambie el tema o el tamaño (nucleo/celular.js)
// Coma decimal, espacio de miles (desde 5 cifras) y signo menos tipográfico.
function fmt(n, d){
  if (!Number.isFinite(n)) return '—';
  const p = Math.pow(10, d === undefined ? 1 : d), r = Math.round(n*p)/p + 0;
  let [e, f] = String(Math.abs(r)).split('.');
  if (e.length >= 5) e = e.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (r < 0 ? '−' : '') + e + (f ? ',' + f : '');
}
const V = (k, t) => `<span class="v v-${k}" data-var="${k}" tabindex="0">${t}</span>`;
const fr = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const M = MotorReaccion;

function crearLienzo(cv, alto, dibujar){
  const ctx = cv.getContext('2d');
  const L = { cv, ctx, W:0, H:0 };
  L.resize = () => {
    const W = cv.clientWidth; if (!W) return;
    const H = Math.round(Celular.alto(alto(W), L.compacto, { tope:420 })), dpr = Celular.dpr();
    L.W = W; L.H = H; cv.style.height = H + 'px'; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    dibujar();
  };
  new ResizeObserver(L.resize).observe(cv);
  // Celular con predicción pendiente: el dibujo más bajo y pegado arriba (nucleo/celular.js).
  L.compactar = on => { on = !!on; Celular.compactar(cv.closest('.mode'), on); if (on === !!L.compacto) return; L.compacto = on; L.resize(); };
  return L;
}
function alRedibujarTema(fn){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', fn);
  new MutationObserver(fn).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
}
function linea(ctx, x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
// Texto con un fondo claro detrás, para que se lea sobre las líneas.
function rotulo(ctx, c, x, y, t, color, align, peso){
  ctx.font = `${peso || 700} 12px ${c.font}`; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(t).width, x0 = align === 'left' ? x : align === 'right' ? x - w : x - w/2;
  ctx.save(); ctx.fillStyle = c.paper; ctx.globalAlpha = .88; ctx.fillRect(x0 - 3, y - 9, w + 6, 18); ctx.restore();
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function pasoBonito(rango, n){
  const crudo = rango/n, p = Math.pow(10, Math.floor(Math.log10(crudo))), r = crudo/p;
  return (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10)*p;
}
// Ejes de una gráfica dentro de la caja b = {x, y, w, h}, con rango R = {x0, x1, y0, y1}.
// tit = { x:'Q (cal)', colX, y:'T (°C)', colY }. Devuelve las funciones X(valor) e Y(valor).
function ejes(ctx, c, b, R, tit, hl){
  const X = v => b.x + (v - R.x0)/(R.x1 - R.x0)*b.w, Y = v => b.y + b.h - (v - R.y0)/(R.y1 - R.y0)*b.h;
  const px = tit.pasoX || pasoBonito(R.x1 - R.x0, b.w < 260 ? 3 : 5), py = pasoBonito(R.y1 - R.y0, 5);
  ctx.save();
  ctx.fillStyle = c.paper; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = c.grid; ctx.lineWidth = 1;
  ctx.font = `600 10px ${c.mono}`; ctx.textBaseline = 'top'; ctx.textAlign = 'center'; ctx.fillStyle = tit.colX || c.muted;
  for (let v = Math.ceil(R.x0/px)*px; v <= R.x1 + 1e-9; v += px){
    linea(ctx, X(v), b.y, X(v), b.y + b.h);

      <p class="fuente">Solo el 38 % de 79 escolares argentinos aceptó que la masa se conserva en un recipiente cerrado (Casado y Raviolo, 2005); en Tailandia, solo el 46,4 % de 97 lo razonó bien (Dahsah y otros, 2006).</p>` },
  { id:'proporcion', corto:'1 a 3 en gramos',
    q:`${ecuacionHTML(REAC.amoniaco)}. La receta dice 1 ${V('N','N₂')} por cada 3 ${V('H','H₂')}. ¿Cuántos gramos de ${V('H','H₂')} reaccionan exactamente con ${V('g','28 g')} de ${V('N','N₂')}?`,
    opts:[['a','84 g: tres veces 28','ES19-proporcion-en-masa','documentado'],
          ['b','6 g',null],
          ['c','3 g: los 3 de la receta','coeficiente-como-gramos','hipotesis'],
          ['d','28 g: la misma masa','misma-masa','hipotesis']],
    ok:'b', r:REAC.amoniaco,
    antes:() => Object.assign(E, { tipo:'proporcion', ver:false }),
    despues:() => { E.ver = true; draw(); },
    exp:`<p>28 g de N₂ son 1 mol (28 g/mol). La receta pide 3 mol de H₂ por cada mol de N₂, y 3 mol de H₂ pesan 3 · 2 = 6 g. La proporción 1 a 3 es en moléculas (o en moles), no en gramos: una molécula de N₂ pesa 14 veces lo que una de H₂.</p>
      <p class="fuente">Con la reacción de Haber, solo el 3,1 % de 97 escolares relacionó bien masa, volumen y número de partículas; una idea errónea que aparece es "la razón de moléculas es igual a la razón de masas" (Dahsah y otros, 2006).</p>` },
  { id:'no-alcanza', corto:'Si no alcanza',
    q:`En la caja hay 2 ${V('N','N₂')} y solo 3 ${V('H','H₂')}, cuando la receta del amoníaco pide 1 N₂ por cada 3 H₂. ¿Qué pasa?`,
    opts:[['a','No hay reacción: falta H₂ para todo el N₂','ES23-sin-proporcion-no-hay-reaccion','documentado'],
          ['b','Se forman 2 NH₃ y sobra 1 N₂',null],
          ['c','Se forman 4 NH₃: se usa todo','ES22-se-acaban-los-dos','documentado'],
          ['d','Se forma 1 NH₃','mitad-de-la-receta','hipotesis']],
    ok:'b', r:REAC.amoniaco,
    antes:() => Object.assign(E, { tipo:'caja', r:REAC.amoniaco, lista:llenar({ N2:2, H2:3 }, 31), ver:false }),
    despues:() => { E.ver = true; reaccionarTodo(); },
    exp:`<p>Con 3 H₂ alcanza para una vuelta de la receta: 1 N₂ y 3 H₂ dan 2 NH₃. El otro N₂ se queda sin pareja. La reacción no necesita que todo esté en la proporción justa: ocurre hasta que algo se acaba.</p>
      <p class="fuente">La idea de que "si un reactivo no alcanza, no hay reacción" está documentada sin porcentaje (Dahsah y otros, 2006; Gauchon y Méheut, 2007, citado por Raviolo y Lerzo, 2016).</p>` },
];
const S = { k:0, pred:{}, t0:Date.now() };
function reiniciar(x){ S.vez = (S.vez || 0) + 1; for (const k of Object.keys(E)) delete E[k]; x.antes(); leyenda('leyenda2', E.r || x.r); }
function reaccionarTodo(){
  const vez = S.vez; // si se cambia de experimento a media animación, la cadena se corta
  const otra = () => { if (S.vez !== vez) return; if (!vuelta(E.lista, E.r, () => { if (S.vez !== vez) return; E.lista = E.lista.filter(m => !(m.usado && m.alpha <= 0.01)); setTimeout(otra, RM ? 0 : 120); }, draw)) draw(); };
  otra();
}
function correr(desde, hasta, clave){
  clave = clave || 'xi';
  cancelAnimationFrame(anim);
  if (RM){ E[clave] = hasta; draw(); return; }
  const t0 = performance.now(), dur = 2200;
  const tick = now => { const f = Math.max(0, Math.min(1, (now - t0)/dur)); E[clave] = desde + (hasta - desde)*f; draw(); if (f < 1) anim = requestAnimationFrame(tick); };
  anim = requestAnimationFrame(tick);
}
function draw(){
  if (!L.W) return;
  const c = colores(), { ctx, W, H } = L;
  ctx.clearRect(0, 0, W, H);
  const ancho = W >= 560;
  if (E.tipo === 'caja'){
    const caja = ancho ? { x:6, y:22, w:W*0.6 - 12, h:H - 30 } : { x:6, y:22, w:W - 12, h:H*0.55 };
    dibujarCaja(ctx, c, caja, E.lista, E.r, { titulo: E.r === REAC.cloruro ? 'Cada partícula dibujada: un tercio de mol (unas 2 × 10²³ partículas)' : 'La caja' });
    const lado = ancho ? { x:W*0.6 + 10, y:10, w:W*0.4 - 18, h:H - 20 } : { x:12, y:H*0.55 + 30, w:W - 24, h:H*0.45 - 36 };
    receta(ctx, c, { x:lado.x, y:lado.y, w:lado.w }, E.r);
    const cant = contar(E.lista);
    contadores(ctx, c, { x:lado.x, y:lado.y + 62, w:lado.w, h:lado.h - 62 }, E.r, cant, E.r === REAC.cloruro ? { titulo:'Moles en la caja', fmt:(n, f) => `${tercios(n)} mol` } : undefined);
    $('desc2').textContent = 'En la caja: ' + Object.entries(cant).map(([f, n]) => `${n} de ${sub(f)}`).join(', ') + '.';
  } else if (E.tipo === 'curvas'){
    const r = E.r, ini = { N2:4, H2:9, NH3:0 };
    const b = ancho ? { x:44, y:16, w:W - 60, h:H - 52 } : { x:40, y:16, w:W - 52, h:H - 52 };
    const ej = ejes(ctx, c, b, { x0:0, x1:3, y0:0, y1:10 }, { x:'vueltas', colX:c.muted, y:'moléculas', colY:c.muted, pasoX:1 });
    const sus = [['N2', 1], ['H2', 2], ['NH3', 3]];
    sus.forEach(([f, n], j) => {
      const col = E.ver ? (claveDe(f, r) === 'prod' ? c.prod : c.el[claveDe(f, r)]) : c.ink, hasta = E.ver ? E.xi : 3;
      ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.setLineDash(E.ver ? [] : [[], [8, 5], [2, 4]][j]);
      ctx.beginPath(); for (let k = 0; k <= 60; k++){ const xi = hasta*k/60, v = M.avance(r, ini, xi)[f]; k ? ctx.lineTo(ej.X(xi), ej.Y(v)) : ctx.moveTo(ej.X(xi), ej.Y(v)); } ctx.stroke(); ctx.restore();
      const v = M.avance(r, ini, hasta)[f];
      rotulo(ctx, c, ej.X(hasta) - 6, ej.Y(v) - 12, E.ver ? `${sub(f)}: ${fmt(v, 0)}` : `curva ${n}`, col, 'right', 800);
    });
    $('desc2').textContent = E.ver ? 'N₂ baja de 4 a 1, H₂ baja de 9 a 0 y NH₃ sube de 0 a 6.' : 'Tres curvas sin nombre: una sube, una baja hasta cero y otra baja y se queda arriba de cero.';
  } else if (E.tipo === 'balanza'){
    const r = M.porMasas(CAL, { CaCO3:10, HCl:7.3 }), f = E.ver ? E.f : 0;
    const gas = r.forman.CO2*f, masa = 17.3 - (E.abierto ? gas : 0);
    const cx = W*(ancho ? 0.32 : 0.5), base = H - 70;
    // Frasco
    ctx.save(); ctx.strokeStyle = c.vidrio; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(cx - 22, base - 150); ctx.lineTo(cx - 22, base - 110); ctx.lineTo(cx - 60, base - 30); ctx.quadraticCurveTo(cx - 64, base, cx - 40, base); ctx.lineTo(cx + 40, base); ctx.quadraticCurveTo(cx + 64, base, cx + 60, base - 30); ctx.lineTo(cx + 22, base - 110); ctx.lineTo(cx + 22, base - 150); ctx.stroke();
    ctx.fillStyle = c.line; ctx.globalAlpha = .6; ctx.beginPath(); ctx.moveTo(cx - 52, base - 40); ctx.lineTo(cx + 52, base - 40); ctx.lineTo(cx + 58, base - 26); ctx.quadraticCurveTo(cx + 60, base - 2, cx + 40, base - 2); ctx.lineTo(cx - 40, base - 2); ctx.quadraticCurveTo(cx - 60, base - 2, cx - 58, base - 26); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    if (!E.abierto){ ctx.fillStyle = c.ink; ctx.fillRect(cx - 26, base - 160, 52, 12); }
    ctx.restore();
    // Burbujas y gas
    const nb = Math.round(14*f);
    for (let k = 0; k < nb; k++){
      const yy = E.abierto ? base - 30 - ((k*37) % 200) : base - 30 - ((k*29) % 110), xx = cx + ((k*23) % 70) - 35;
      molecula(ctx, c, 'CO2', xx, yy, 5, { halo:c.prod, alpha: E.abierto && yy < base - 160 ? 0.5 : 1 });
    }
    balanza(ctx, c, { x:cx - 100, y:base - 4, w:200, h:44 }, masa, E.abierto ? 'el CO₂ se escapa' : 'sin contar el frasco ni el agua');
    if (E.ver){
      const lx = ancho ? W*0.62 : 14, ly = ancho ? 30 : 14;
      ctx.font = `800 12px ${c.font}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = c.ink;
      const filas = [['Antes', 'CaCO₃ 10 g + HCl 7,3 g', 17.3], ['Después', `CaCl₂ ${fmt(11.1*f, 1)} + H₂O ${fmt(1.8*f, 1)} + CO₂ ${fmt(4.4*f, 1)} g`, 17.3]];
      if (ancho) filas.forEach(([t, d, g], k) => { ctx.fillStyle = c.ink; ctx.fillText(t, lx, ly + k*44); ctx.font = `600 12px ${c.font}`; ctx.fillStyle = c.muted; ctx.fillText(d, lx, ly + k*44 + 17); ctx.font = `800 12px ${c.font}`; });
    }
    $('desc2').textContent = `La balanza marca ${fmt(masa, 1)} g.`;
  } else if (E.tipo === 'proporcion'){
    const caja = ancho ? { x:6, y:22, w:W*0.5 - 12, h:H - 30 } : { x:6, y:22, w:W - 12, h:H*0.5 };
    dibujarCaja(ctx, c, caja, E.lista || (E.lista = llenar({ N2:3, H2:9 }, 41)), REAC.amoniaco, { titulo:'3 N₂ y 9 H₂: la misma proporción, 1 a 3' });
    const lado = ancho ? { x:W*0.5 + 20, y:20, w:W*0.5 - 40, h:H - 40 } : { x:20, y:H*0.5 + 30, w:W - 40, h:H*0.5 - 40 };
    if (!E.ver){ rotulo(ctx, c, lado.x + lado.w/2, lado.y + lado.h/2, 'Responde para ver las masas', c.muted); $('desc2').textContent = ''; return; }
    const filas = [['N₂', 'N', 1, 28], ['H₂', 'H', 3, 6]], maxG = 28, h = Math.min(60, lado.h/3);
    filas.forEach(([n, e, mol, g], k) => {
      const y = lado.y + 20 + k*(h + 24);
      ctx.font = `800 13px ${c.font}`; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillStyle = c.el[e]; ctx.fillText(`${n}: `, lado.x, y); ctx.fillStyle = c.mol; ctx.fillText(`${mol} mol`, lado.x + ctx.measureText(`${n}: `).width, y);
      ctx.fillStyle = c.grid; ctx.fillRect(lado.x, y + 4, lado.w, h*0.5); ctx.fillStyle = c.g; ctx.fillRect(lado.x, y + 4, lado.w*g/maxG, h*0.5);
      ctx.font = `800 13px ${c.mono}`; const dentro = g/maxG > 0.6; ctx.fillStyle = dentro ? c.card : c.g; ctx.textAlign = dentro ? 'right' : 'left'; ctx.textBaseline = 'middle'; ctx.fillText(`${g} g`, dentro ? lado.x + lado.w*g/maxG - 8 : lado.x + lado.w*g/maxG + 6, y + 4 + h*0.25);
    });
    $('desc2').textContent = '1 mol de N₂ pesa 28 g; 3 mol de H₂ pesan 6 g.';
  }
}
function sincronizar(){ draw(); }
// Pastillas: la k solo se abre si todos los experimentos anteriores ya tienen respuesta;
// las respondidas se revisitan libres (misma regla que los puntos del paso a paso).
function primeraLibre(){ const j = EXPS.findIndex(x => !S.pred[x.id]); return j < 0 ? EXPS.length - 1 : j; }
function botones(){
  const libre = primeraLibre();
  $('exps').innerHTML = EXPS.map((x, k) => k > libre
    ? `<button type="button" aria-pressed="false" data-k="${k}" disabled aria-disabled="true" aria-label="Experimento ${k+1}, bloqueado">${k+1}. ${x.corto}</button>`
    : `<button type="button" aria-pressed="${k === S.k}" data-k="${k}">${k+1}. ${x.corto}</button>`).join('');
  $('exps').querySelectorAll('button').forEach(b => b.onclick = () => ir(+b.dataset.k));
}
function ir(k){
  if (k > primeraLibre()) return;
  cancelAnimationFrame(anim);
  S.k = k; S.t0 = Date.now();
  const x = EXPS[k];
  reiniciar(x);
  if (S.pred[x.id]){
    E.ver = true; E.xi = 3; E.f = 1;
    if (E.tipo === 'caja'){ const s = M.porParticulas(E.r, contar(E.lista)); E.lista = llenar(s.finales, 99); }
  }
  L.compactar(!S.pred[x.id]);
  botones();
  $('k2').textContent = `¿Qué pasa si…? · ${k+1} de ${EXPS.length}`;
  $('t2').textContent = x.corto;
  $('body2').innerHTML = `<p>${x.q}</p>
    <div class="opts">${x.opts.map(([l, t]) => `<button class="opt" type="button" data-k="${l}"><span class="l">${l.toUpperCase()}</span><span>${t}</span></button>`).join('')}</div>
    <p class="fb" id="fb2"></p><div id="res2" class="body"></div>`;
  const btns = [...$('body2').querySelectorAll('.opt')];
  const pintar = () => {
    const p = S.pred[x.id]; if (!p) return;
    btns.forEach(b => { b.disabled = true; if (b.dataset.k === x.ok) b.classList.add('correct'); else if (b.dataset.k === p) b.classList.add('wrong'); });
    const fb = $('fb2');
    fb.textContent = p === x.ok ? '¡Bien pensado! Mira la escena para ver por qué.' : `; mira la escena para ver por qué.`;
    fb.className = 'fb ' + (p === x.ok ? 'ok' : 'mal');
    $('res2').innerHTML = (x.ctrl ? x.ctrl() : '') + x.exp + (k < EXPS.length - 1 ? `<div class="nav"><span></span><button type="button" class="btn primary" id="sig2">Siguiente: ${EXPS[k+1].corto}</button></div>` : '');
    $('res2').querySelectorAll('[data-ab]').forEach(b => b.onclick = () => { E.abierto = b.dataset.ab === '1'; $('res2').querySelectorAll('[data-ab]').forEach(y => y.setAttribute('aria-pressed', String(y === b))); draw(); });
    const sig = $('sig2'); if (sig) sig.onclick = () => { ir(k + 1); document.querySelector('#m2').scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); };
  };
  btns.forEach(b => b.onclick = () => {
    if (S.pred[x.id]) return;
    const o = x.opts.find(q => q[0] === b.dataset.k);
    S.pred[x.id] = o[0]; botones(); pintar(); L.compactar(false);
    Celular.alResponder(L.cv, () => { x.despues(); sincronizar(); }, () => S.k === k);
    registrarPrediccion('que-pasa-si-' + x.id, o[0], o[0] === x.ok, o[2] || '', o[3] || '', S.t0);
  });
  pintar(); draw();
}
alRedibujarTema(draw);
addEventListener('modo', () => L.resize());
L.resize(); ir(0);
S.vez = (S.vez || 0) + 1; Object.assign(E, { tipo:'caja', r:JUEGO, lista:llenar({ CO:3, O2:2 }, 4), ver:false }); leyenda('leyenda2', JUEGO); draw();
const juego = juegoCaja(cv, $('juego2'), { lista:() => E.lista, dibujar:draw,
  caja:() => L.W >= 560 ? { x:6, y:22, w:L.W*0.6 - 12, h:L.H - 30 } : { x:6, y:22, w:L.W - 12, h:L.H*0.55 } });
JugarPrimero.montar({ escena: cv.closest('.bench'), preguntas: [...document.querySelector('#m2 .guide').children], minimo: 2,
  consigna: 'Toca la caja para poner moléculas; toca una para sacarla.',
  alListo: () => { juego.terminar(); ir(0); } });
})();
</script>

<script>

(function(){

    const k = Math.max(0, modos.findIndex(m => m[0] === location.hash));
